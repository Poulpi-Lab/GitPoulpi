# Dependency security advisories, between releases. ci.yml is disabled and release.yml runs cargo-deny only
# when a release is cut, so nothing else would tell us about a new RustSec/GitHub advisory on a locked crate.
#
# Two checks: cargo-deny `check advisories` (RustSec database, deny.toml policy) and `xtask advisories` (OSV, which
# also covers GitHub advisories; deny.toml's ignore list applies to both). On a finding the workflow opens or
# updates ONE issue, and closes it with a comment once the scan is clean again. This workflow is not disabled.
name: Advisories

on:
  schedule:
    - cron: "17 5 * * *" # daily, early morning UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - deny.toml

# Least privilege: read the code, write issues, nothing else.
permissions:
  contents: read
  issues: write

concurrency:
  group: advisories
  cancel-in-progress: false

env:
  ISSUE_TITLE: Dependency security advisories

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        id: deny
        continue-on-error: true
        with:
          command: check
          arguments: advisories
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: OSV scan
        id: osv
        run: |
          set +e
          cargo run -q -p xtask -- advisories --markdown > advisories.md
          code=$?
          if [ "$code" -ne 0 ] && [ ! -s advisories.md ]; then
            # The scan itself failed (network, OSV outage): do not touch the issue.
            echo "state=error" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            echo "state=findings" >> "$GITHUB_OUTPUT"
            cat advisories.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "state=clean" >> "$GITHUB_OUTPUT"
          fi
          cat advisories.md
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSV: ${{ steps.osv.outputs.state }}
          DENY: ${{ steps.deny.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          if [ "$OSV" = "error" ]; then
            echo "::error::the OSV scan itself failed; the issue is left as it is"
            exit 1
          fi
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ "$OSV" = "clean" ] && [ "$DENY" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "The scheduled scan is clean again ($RUN_URL)."
            fi
            exit 0
          fi
          {
            echo "Found by the scheduled run $RUN_URL ($(date -u +%F))."
            echo
            if [ "$DENY" != "success" ]; then
              echo "- \`cargo deny check advisories\` failed, see the run log."
            fi
            if [ "$OSV" = "findings" ]; then
              echo "- \`cargo run -p xtask -- advisories\` (OSV) found:"
              echo
              cat advisories.md
            fi
            echo
            echo "Run \`cargo run -p xtask -- advisories\` locally. This issue closes itself once the scan is clean."
          } > body.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi
          exit 1
