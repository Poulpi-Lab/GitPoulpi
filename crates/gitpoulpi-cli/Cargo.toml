[package]
name = "gitpoulpi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "`gitpoulpi` scriptable CLI: an IPC client over gitpoulpi-ipc, auto-starting its target session's daemon on first use."

[[bin]]
name = "gitpoulpi"
path = "src/main.rs"

# `gp` is a PowerShell alias to this binary (see the user's PowerShell
# profile), not a separate build target -- `gp` collides with PowerShell's
# built-in Get-ItemProperty alias, so shipping a same-named .exe wouldn't
# actually be reachable there.

[features]
default = ["full"]
full = ["github", "gitlab", "azure-devops", "bitbucket", "jira", "trello", "gitea", "gerrit", "local-issues", "lfs", "worktree", "submodule", "avatar-fetch", "image-view", "mermaid", "board", "global-search", "workspaces"]
all-langs = []
lang-fr = []
lang-es = []
lang-pt-br = []
lang-pt-pt = []
lang-it = []
lang-de = []
lang-zh-cn = []
lang-ja = []
lang-ru = []
lang-ko = []
lang-nl = []
lang-pl = []
lang-uk = []
lang-cs = []
lang-sv = []
lang-tr = []
lang-qps = []
ai = []
github = ["gitpoulpi-commands/github", "gitpoulpi-tui/github"]
gitlab = ["gitpoulpi-commands/gitlab", "gitpoulpi-tui/gitlab"]
azure-devops = ["gitpoulpi-commands/azure-devops", "gitpoulpi-tui/azure-devops"]
bitbucket = ["gitpoulpi-commands/bitbucket", "gitpoulpi-tui/bitbucket"]
jira = ["gitpoulpi-commands/jira", "gitpoulpi-tui/jira"]
trello = ["gitpoulpi-commands/trello", "gitpoulpi-tui/trello"]
gitea = ["gitpoulpi-commands/gitea", "gitpoulpi-tui/gitea"]
linear = []
youtrack = []
redmine = []
gerrit = ["gitpoulpi-commands/gerrit", "gitpoulpi-tui/gerrit"]
local-issues = ["gitpoulpi-commands/local-issues", "gitpoulpi-tui/local-issues"]
mcp = []
lfs = ["gitpoulpi-commands/lfs", "gitpoulpi-tui/lfs"]
worktree = ["gitpoulpi-commands/worktree", "gitpoulpi-tui/worktree"]
submodule = ["gitpoulpi-commands/submodule", "gitpoulpi-tui/submodule"]
avatar-fetch = ["gitpoulpi-commands/avatar-fetch", "gitpoulpi-tui/avatar-fetch"]
image-view = ["gitpoulpi-commands/image-view", "gitpoulpi-tui/image-view"]
radar = []
mermaid = ["gitpoulpi-commands/mermaid", "gitpoulpi-tui/mermaid"]
board = ["gitpoulpi-commands/board", "gitpoulpi-tui/board"]
review = []
history-rewrite = []
global-search = ["gitpoulpi-commands/global-search", "gitpoulpi-tui/global-search"]
workspaces = ["gitpoulpi-commands/workspaces", "gitpoulpi-tui/workspaces"]
# Embedded Lua for history rewrite scripts (sandboxed; off = a Script rule is refused as unsupported).
rewrite-scripts = []

[dependencies]
gitpoulpi-core.workspace = true
gitpoulpi-ipc.workspace = true
gitpoulpi-tui.workspace = true
gitpoulpi-daemon.workspace = true
gitpoulpi-config.workspace = true
gitpoulpi-log.workspace = true
gitpoulpi-commands.workspace = true
# Only to forward the `lang-*` features.
gitpoulpi-i18n.workspace = true
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
# Build script: logo colorways + Windows executable icon (assets/logo/logo_build*.rs).
serde_json.workspace = true
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
gitpoulpi-testkit.workspace = true
gitpoulpi-session.workspace = true
toml.workspace = true
assert_cmd.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# The pty driver, for `tests/pty_ui_show.rs`: it runs the `gitpoulpi`
# binary (the TUI when it gets no subcommand) in a terminal.
xtask.workspace = true
