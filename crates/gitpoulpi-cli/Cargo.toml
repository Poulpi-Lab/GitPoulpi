[package]
name = "gitpoulpi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "`gitpoulpi` scriptable CLI: an IPC client over gitpoulpi-ipc, auto-starting its target session's daemon on first use."

[[bin]]
name = "gitpoulpi"
path = "src/main.rs"

# `gp` is a PowerShell alias to this binary (see the user's PowerShell
# profile), not a separate build target -- `gp` collides with PowerShell's
# built-in Get-ItemProperty alias, so shipping a same-named .exe wouldn't
# actually be reachable there.

[features]
default = ["full"]
full = ["github", "gitlab", "azure-devops", "bitbucket", "jira", "trello", "gitea", "linear", "youtrack", "redmine", "gerrit", "local-issues", "ai", "mcp", "lfs", "worktree", "submodule", "avatar-fetch", "image-view", "radar", "mermaid", "board", "review", "history-rewrite", "global-search", "workspaces", "rewrite-scripts"]
all-langs = []
lang-fr = []
lang-es = []
lang-pt-br = []
lang-pt-pt = []
lang-it = []
lang-de = []
lang-zh-cn = []
lang-ja = []
lang-ru = []
lang-ko = []
lang-nl = []
lang-pl = []
lang-uk = []
lang-cs = []
lang-sv = []
lang-tr = []
lang-qps = []
ai = ["gitpoulpi-commands/ai", "gitpoulpi-tui/ai", "gitpoulpi-mcp?/ai"]
github = ["gitpoulpi-commands/github", "gitpoulpi-tui/github", "gitpoulpi-mcp?/github"]
gitlab = ["gitpoulpi-commands/gitlab", "gitpoulpi-tui/gitlab", "gitpoulpi-mcp?/gitlab"]
azure-devops = ["gitpoulpi-commands/azure-devops", "gitpoulpi-tui/azure-devops", "gitpoulpi-mcp?/azure-devops"]
bitbucket = ["gitpoulpi-commands/bitbucket", "gitpoulpi-tui/bitbucket", "gitpoulpi-mcp?/bitbucket"]
jira = ["gitpoulpi-commands/jira", "gitpoulpi-tui/jira", "gitpoulpi-mcp?/jira"]
trello = ["gitpoulpi-commands/trello", "gitpoulpi-tui/trello", "gitpoulpi-mcp?/trello"]
gitea = ["gitpoulpi-commands/gitea", "gitpoulpi-tui/gitea", "gitpoulpi-mcp?/gitea"]
linear = ["gitpoulpi-commands/linear", "gitpoulpi-tui/linear", "gitpoulpi-mcp?/linear"]
youtrack = ["gitpoulpi-commands/youtrack", "gitpoulpi-tui/youtrack", "gitpoulpi-mcp?/youtrack"]
redmine = ["gitpoulpi-commands/redmine", "gitpoulpi-tui/redmine", "gitpoulpi-mcp?/redmine"]
gerrit = ["gitpoulpi-commands/gerrit", "gitpoulpi-tui/gerrit", "gitpoulpi-mcp?/gerrit"]
local-issues = ["gitpoulpi-commands/local-issues", "gitpoulpi-tui/local-issues", "gitpoulpi-mcp?/local-issues"]
mcp = ["gitpoulpi-commands/mcp", "gitpoulpi-tui/mcp", "dep:gitpoulpi-mcp", "gitpoulpi-mcp/mcp"]
lfs = ["gitpoulpi-commands/lfs", "gitpoulpi-tui/lfs", "gitpoulpi-mcp?/lfs"]
worktree = ["gitpoulpi-commands/worktree", "gitpoulpi-tui/worktree", "gitpoulpi-mcp?/worktree"]
submodule = ["gitpoulpi-commands/submodule", "gitpoulpi-tui/submodule", "gitpoulpi-mcp?/submodule"]
avatar-fetch = ["gitpoulpi-commands/avatar-fetch", "gitpoulpi-tui/avatar-fetch", "gitpoulpi-mcp?/avatar-fetch"]
image-view = ["gitpoulpi-commands/image-view", "gitpoulpi-tui/image-view", "gitpoulpi-mcp?/image-view"]
radar = ["gitpoulpi-commands/radar", "gitpoulpi-tui/radar", "gitpoulpi-mcp?/radar"]
mermaid = ["gitpoulpi-commands/mermaid", "gitpoulpi-tui/mermaid", "gitpoulpi-mcp?/mermaid"]
board = ["gitpoulpi-commands/board", "gitpoulpi-tui/board", "gitpoulpi-mcp?/board"]
review = ["gitpoulpi-commands/review", "gitpoulpi-tui/review", "gitpoulpi-mcp?/review"]
history-rewrite = ["gitpoulpi-commands/history-rewrite", "gitpoulpi-tui/history-rewrite", "gitpoulpi-mcp?/history-rewrite"]
global-search = ["gitpoulpi-commands/global-search", "gitpoulpi-tui/global-search", "gitpoulpi-mcp?/global-search"]
workspaces = ["gitpoulpi-commands/workspaces", "gitpoulpi-tui/workspaces", "gitpoulpi-mcp?/workspaces"]
# Embedded Lua for history rewrite scripts (sandboxed; off = a Script rule is refused as unsupported).
rewrite-scripts = ["gitpoulpi-commands/rewrite-scripts", "gitpoulpi-tui/rewrite-scripts", "gitpoulpi-mcp?/rewrite-scripts"]

[dependencies]
gitpoulpi-core.workspace = true
gitpoulpi-ipc.workspace = true
gitpoulpi-tui.workspace = true
gitpoulpi-daemon.workspace = true
gitpoulpi-config.workspace = true
gitpoulpi-log.workspace = true
gitpoulpi-commands.workspace = true
gitpoulpi-mcp = { workspace = true, optional = true }
# Only to forward the `lang-*` features.
gitpoulpi-i18n.workspace = true
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
# Build script: logo colorways + Windows executable icon (assets/logo/logo_build*.rs).
serde_json.workspace = true
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
gitpoulpi-testkit.workspace = true
gitpoulpi-session.workspace = true
toml.workspace = true
assert_cmd.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# The pty driver, for `tests/pty_ui_show.rs`: it runs the `gitpoulpi`
# binary (the TUI when it gets no subcommand) in a terminal.
xtask.workspace = true
