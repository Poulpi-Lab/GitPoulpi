[package]
name = "gitpoulpi-commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
build = "build.rs"
description = "Shared command layer: the `gitpoulpi` clap `Cli` tree, the IPC `Session` client, and `execute` -- one `GitBackend` mapping per subcommand, run by both the CLI and the MCP server so their tools can never drift apart."

[features]
default = ["full"]
# Standalone (`cargo test -p gitpoulpi-commands`) behaves as a full build.
full = [
    "gitpoulpi-i18n/all-langs", "github", "gitlab", "azure-devops", "bitbucket", "jira", "trello", "gitea", "linear", "youtrack", "redmine", "gerrit", "local-issues", "ai", "mcp", "lfs", "worktree", "submodule",
    "avatar-fetch", "image-view", "radar", "mermaid", "board", "review", "conversation", "history-rewrite", "global-search", "workspaces", "rewrite-scripts",
]
ai = ["dep:gitpoulpi-ai", "dep:async-trait"]
# Internal: "at least one hosting provider". Never enabled alone.
hosting = ["gitpoulpi-daemon/hosting", "gitpoulpi-ai?/conversation"]
github = ["hosting", "gitpoulpi-hosting/github"]
gitlab = ["hosting", "gitpoulpi-hosting/gitlab"]
azure-devops = ["hosting", "gitpoulpi-hosting/azure-devops"]
bitbucket = ["hosting", "gitpoulpi-hosting/bitbucket"]
jira = ["hosting", "gitpoulpi-hosting/jira"]
trello = ["hosting", "gitpoulpi-hosting/trello"]
gitea = ["hosting", "gitpoulpi-hosting/gitea"]
linear = ["hosting", "gitpoulpi-hosting/linear"]
youtrack = ["hosting", "gitpoulpi-hosting/youtrack"]
redmine = ["hosting", "gitpoulpi-hosting/redmine"]
gerrit = ["hosting", "gitpoulpi-hosting/gerrit"]
local-issues = ["hosting", "gitpoulpi-hosting/local-issues"]
mcp = []
lfs = ["gitpoulpi-daemon/lfs"]
worktree = ["gitpoulpi-daemon/worktree"]
submodule = ["gitpoulpi-daemon/submodule"]
# Nothing to fetch here; listed so `--version` reports the build faithfully.
avatar-fetch = []
# Nothing to decode here; listed so `--version` reports the build faithfully.
image-view = []
# Mermaid gitGraph output of `log --format mermaid`.
mermaid = []
# Provider-backed extras: only effective together with a hosting provider (`hosting`).
radar = []
board = []
review = []
# The conversation view of an issue or a request (a TUI surface; listed so `--version` reports the build faithfully).
conversation = []
# Advanced history rewriting (Rewrite: palette commands, `gitpoulpi rewrite`).
history-rewrite = []
# Global search (`gitpoulpi search`).
global-search = []
# Workspaces (`gitpoulpi workspace`, the `--workspace` flags).
workspaces = []
# Embedded Lua scripts in history rewrite recipes.
rewrite-scripts = ["gitpoulpi-daemon/rewrite-scripts"]

[dependencies]
gitpoulpi-core.workspace = true
gitpoulpi-ipc.workspace = true
gitpoulpi-daemon.workspace = true
gitpoulpi-config.workspace = true
gitpoulpi-session.workspace = true
gitpoulpi-hosting.workspace = true
gitpoulpi-secrets.workspace = true
gitpoulpi-ai = { workspace = true, features = ["network", "terminal-agent"], optional = true }
gitpoulpi-i18n.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
async-trait = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
