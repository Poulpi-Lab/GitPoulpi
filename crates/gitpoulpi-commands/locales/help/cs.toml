treat = "Přiměje git zacházet se soubory jako s binárními nebo textovými zápisem pravidla `.gitattributes` (`binary` nebo `text diff`) pro cesty: ve výchozím stavu soubor v kořeni repozitáře, `--file` pro soubor složky nebo `.git/info/attributes` (jen tento klon). Pravidlo, které už pojmenovává stejný vzor, se přepíše, ne popře. Odpověď říká, zda git s cestami nyní opravdu tak zachází (`effective`). Vrátit lze pomocí `gitpoulpi undo`, kromě `.git/info/attributes`"
