"rewrite preview --extract" = "Pravidlo cesty: ponechá jen tuto podsložku, která se stane kořenem; commity, které se jí nedotýkají, se zahodí a merge se zjednoduší. Způsob vyjmutí se zjišťuje pokaždé: zadejte `--extract-mode`, jinak je návratový kód 3 a nic se neukáže v náhledu. Vyjmutí proběhne před ostatními přepínači cest"
"rewrite preview --extract_mode" = "Jak `--extract` skončí: `clone` (nový lokální klon v `--target`, originál se nemění; každá lokální větev a tag), `in-place` (přepíše se historie tohoto repozitáře, jeden záznam pro vrácení zpět) nebo `submodule` (klon jako u `clone` a jeden nový commit na aktuální větvi nahradí složku submodulem; tato historie zůstane)"
