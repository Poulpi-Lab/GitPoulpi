"rewrite script check --trust" = "Nejdřív skriptu důvěřovat (rozhoduje člověk, přes MCP se odmítne)"
"rewrite script check#long" = """
Zkompiluje skript v Lua a vypíše jeho hlavičku (název, okno, parametry), funkce, které definuje, a každý problém. Návratový kód 2, když má problémy. Jen čte; na žádném commitu se nic nespustí.

U skriptu v shellu, Pythonu nebo externí Lua (bez izolace) také uvede, zda byl nalezen interpret a zda je skript důvěryhodný, a u důvěryhodného provede zkušební handshake: spustí skript jednou s vymyšleným commitem (`"dry_run": true`) a zkontroluje odpověď. Nedůvěryhodný skript se nikdy nespustí."""
"rewrite script test --language" = "`lua`, `shell`, `python` nebo `lua-external`; výchozí podle přípony"
"rewrite script test --trust" = "Nejdřív skriptu důvěřovat (rozhoduje člověk, přes MCP se odmítne)"
"rewrite script trust" = "Důvěřovat externímu skriptu (shell, Python, externí Lua) podle jeho obsahu: SHA-256 souboru se zapamatuje pro tento repozitář, takže skript smí běžet (náhled, běh, zkouška); změněný soubor se zeptá znovu. Tyto skripty nejsou v izolaci: běží s vašimi oprávněními, proto si soubor nejdřív přečtěte. Může to udělat jen člověk: žádný nástroj MCP pro to neexistuje"
"rewrite script trust --file" = "Soubor se skriptem"
"rewrite tools" = "Které nástroje funkce přepisu potřebují (gpg / ssh-keygen / gpgsm pro nové podepsání, interprety skriptů, git-lfs) a zda je každý nalezen. Jen čte"
"rewrite tools --fresh" = "Znovu to ověří místo odpovědi z minutové mezipaměti"
"mailmap" = "Soubor `.mailmap`: jedno kanonické jméno a e-mail pro lidi, kteří commitovali pod několika. Log, blame i historie souboru ukazují namapovaná jména (`log.use_mailmap`), aniž by se cokoli změnilo na commitu. `list` spočítá identity v historii a ukáže, které jsou namapované, `check` ukáže, jak se některé identity vyhodnotí, `add` sloučí identity do jedné připsáním řádků do `.mailmap` (upraví se, necommituje se; lze vrátit zpět)"
"mailmap add" = "Sloučí identity do jedné kanonické identity připsáním řádků do `.mailmap` (vytvoří se, pokud chybí; řádek, který tam už je, se neopakuje). Soubor se upraví, necommituje se: commitněte ho sami. Jeden záznam, který lze vrátit zpět (`gitpoulpi undo` vrátí předchozí soubor). Log ukáže kanonickou identitu okamžitě (`log.use_mailmap`); uložené commity se nemění, takže není potřeba žádný force push. Chcete-li přepsat samotné commity, použijte v `rewrite` pravidlo `mailmap`"
