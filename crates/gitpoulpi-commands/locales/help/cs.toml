"rewrite preview --map_trailers" = "S pravidlem identity: namapuje i odpovídající identity v trailerech (`Name <email>` v `Signed-off-by`, `Co-authored-by`...), nejen autora a committera"
"rewrite preview --trailer_add" = "Pravidlo trailerů `KEY=VALUE`: přidá tento trailer do každé zprávy (lze opakovat; zpráva, která přesně takový trailer už má, zůstane beze změny)"
"rewrite preview --trailer_map" = "Pravidlo trailerů `KEY:OLD=NEW`: nahradí doslovný text v hodnotách trailerů s tímto klíčem, například `Signed-off-by:@old.org=@new.org` (lze opakovat)"
