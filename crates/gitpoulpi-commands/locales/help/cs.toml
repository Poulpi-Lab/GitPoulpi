"remote-group" = "Větev s několika remote (další cíle push, zdroje pull): jak stojí vůči každému z nich. Změny viz `branch upstream`"
"remote-group status" = "Jak aktuální větev (nebo `--branch`) stojí vůči každému ze svých remote: primární upstream, další cíle push, zdroje pull. Jen čte, bez sítě"
