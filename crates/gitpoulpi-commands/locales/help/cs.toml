"rewrite push --yes" = "Pokračuje a odešle. Bez něj se nic neodešle (návratový kód 3)"
"rewrite purge" = "Trvale smaže z tohoto klonu starou historii přepisu: zahodí pojistky pro vrácení zpět u tohoto přepisu (i u každé dřívější operace, jejíž pojistky starou historii také drží), vyprší záznamy reflogu, které ji uvádějí, odstraní objekty (`gc --prune=now`) a ověří, že jsou pryč. Vrácení zpět už u těchto operací není možné (v `undo --list` zůstanou jako vymazané). Po spuštění ji nelze zastavit ani vrátit zpět. Cokoli, co starou historii stále drží (větev mimo přepis, stash, HEAD jiného worktree, sledovací ref remote: po odeslání proveďte fetch), ji zablokuje a nic se nezmění. Na žádný remote se nic neposílá; odpověď vypíše kroky, které je třeba udělat u hostitele (GitHub, GitLab, Azure DevOps, Bitbucket). Bez `--yes` se nic neděje: odpověď uvede, co by se smazalo a co by se ztratilo, a návratový kód je 3. Návratový kód 2, když záznam není přepis, 4, když něco brání nebo objekty zůstaly. Přes MCP jen s `[mcp] allow_history_purge = true`"
