"flow status" = "Každá větev repozitáře zařazená podle jeho workflow větvení: základní nebo tématická (s typem), rodič a o kolik commitů je před tímto rodičem a za ním. Bez souboru workflow je každá větev nezařazená; `flow detect` jeden navrhne"
"flow sync" = "Aktualizuje větev podle jejího rodiče (merge nebo rebase, podle nastavené strategie větve) a s `--stack` i větve na ní postavené, popořadě. Vypíše plán a vyžaduje `--yes`; bez něj návratový kód 3"
"flow sync --abort" = "Vzdá se zastavené akce: přeruší probíhající merge nebo rebase a vrátí se na větev, na které se začalo. Již dokončené kroky zůstanou (vrátíte je pomocí `undo`)"
"flow sync --autostash" = "Odloží lokální změny, které blokují checkout nebo merge, a poté je vrátí, ať říká `general.auto_stash` cokoli"
"flow sync --branch" = "Větev k aktualizaci. Výchozí je aktuální"
"flow sync --continue_" = "Pokračuje po vyřešení konfliktu: commitne merge nebo pokračuje v rebase a pak provede zbývající kroky. Po selhání hooku spustí tento krok znovu"
"flow sync --dry_run" = "Vypíše plán (každý krok, blokátory, varování) jako JSON a nic nezmění"
"flow sync --merge" = "Použije merge místo rebase"
"flow sync --no_hooks" = "Přeskočí nastavené hooky bez ptaní"
"flow sync --rebase" = "Použije rebase místo merge"
"flow sync --run_hooks" = "Spustí hooky, které workflow pro tuto akci nastavuje (příkazy shellu ze souboru workflow, zobrazené i s výstupem). Nikdy se nespustí, pokud o to nepožádáte; bez tohoto přepínače se zeptá terminál"
"flow sync --stack" = "Aktualizuje i větve, jejichž rodičem je tato, rekurzivně"
"flow sync --yes" = "Provede plán bez ptaní. Bez něj se zeptá terminál, cokoli jiného vypíše plán a skončí s kódem 3"
"flow templates" = "Vestavěné šablony workflow (Git Flow, GitHub Flow, GitLab Flow, Trunk-based, Custom) s jejich základními větvemi a typy tématických větví"
"flow trust-hooks" = "Zkontroluje a schválí hooky workflow, které repozitář commituje (`[hooks]` v `.gitpoulpi/workflow.toml`): shellové příkazy, které by se spustily na vašem počítači. Bez `--hash` jen vypíše `{hash, hooks, trusted}`; s hashem si důvěru zapamatuje, ale jen když soubor na disku má přesně tento hash, takže důvěřuje se tomu, co jste četli. Změněný soubor se zeptá znovu. Hooky vašeho vlastního přepsání to nikdy nepotřebují. Může to udělat jen člověk: neexistuje k tomu nástroj MCP"
"flow trust-hooks --hash" = "Hash vypsaný příkazem `flow trust-hooks` (nebo odmítnutým `--run-hooks`): schválí hooky s tímto hashem"
alias = "Alias příkazu (`gp` nebo libovolný název), který spouští GitPoulpi z terminálu: skriptovatelný protějšek Nastavení > Spouštěč"
"alias create" = "Vytvoří `<name>` (například `gp`), které spouští GitPoulpi: odkaz v Linuxu a macOS, soubor `.cmd` ve Windows, ve složce bin uživatele. Soubor, který GitPoulpi nepatří, se nikdy nenahradí. Složku přidejte do PATH pomocí `path add`"
"alias create --add" = "Vytvoří variantu pro přidání (například `gpa`): spouští `gitpoulpi --add`, které otevře aktuální složku jako novou kartu již spuštěného GitPoulpi"
"alias create --name" = "Název příkazu: jen písmena, číslice, `-`, `_` a `.`"
"alias remove" = "Odebere aliasy příkazu, které GitPoulpi vytvořil (všechny, nebo jen `<name>`); soubor, který GitPoulpi nepatří, se nikdy nedotkne"
"alias remove --name" = "Alias k odebrání (výchozí: každý alias, který GitPoulpi vytvořil)"
"alias status" = "Zobrazí aliasy příkazů, které GitPoulpi vytvořil (a co každý spouští), a názvy v `ui.command_alias` a `ui.command_alias_add`"
installation = "Která instalace GitPoulpi to je a její vlastní nastavení (barva, název, aliasy, prostředí). Na jednom počítači může vedle sebe existovat několik instalací"
"installation show" = "Ukáže, která instalace GitPoulpi to je (její id, druh, složka a prostředí), zda je hlavní, její vlastní nastavení a ostatní instalace na tomto počítači"
"installation set" = "Nastaví jedno z vlastních nastavení této instalace: `name`, `name_with_version`, `logo_color`, `command_alias`, `command_alias_add`, `folder_menu_submenu`, `env` nebo `mcp_bind`. Prázdná hodnota nastavení zruší. Barva a aliasy hlavní instalace se zapisují i do sdílených klíčů `ui.*`, které čtou starší verze"
"installation set --field" = "Pole, které se nastaví"
"installation set --value" = "Nová hodnota (prázdná maže)"
path = "Přidá GitPoulpi do uživatelské PATH pro nové terminály"
"path add" = "Přidá do uživatelské PATH pro nové terminály složku, ve které GitPoulpi leží, a složku s aliasy: označený blok v souborech spuštění shellu (Linux, macOS) nebo uživatelskou PATH v registru (Windows). Složky, které už v PATH jsou, zůstanou beze změny"
"path remove" = "Odebere přesně to, co tam přidalo `path add`"
"path status" = "Ukáže, zda složka, ve které GitPoulpi leží, a složka s aliasy jsou v uživatelské PATH, a co GitPoulpi přidal"
uninstall = "Odebere, co vytvořil instalátor a Nastavení (aliasy příkazů, položky PATH, zástupce) a u instalace z vydání i soubory programu. Odmítne na sestavení, které není instalací z vydání (vedle exe chybí značka `.gitpoulpi-dist`). Vaše konfigurace, relace a repozitáře se nikdy nedotknou"
"uninstall --keep_files" = "Soubory programu ponechá na místě (odinstalátor Windows je smaže sám, protože běžící exe se smazat nedá)"
launch = "Co spouštějí zástupci GitPoulpi: ukáže okno už otevřeného GitPoulpi (`ui.reuse_window`), jinak spustí COMMAND (terminál, který GitPoulpi spouští). Nespustí nic ani daemon, když lze okno ukázat"
"launch --command" = "Příkaz ke spuštění, když není okno k zobrazení, za `--`"
"launch --folder" = """Otevře tuto složku: při zapnutém `ui.reuse_window` a otevřeném okně se repozitář, který ji obsahuje, stane kartou naposledy aktivního okna (bez dotazu); jinak se GitPoulpi spustí ve zvoleném terminálu v této složce. Toto spouští položka „Otevřít v GitPoulpi“ správce souborů"""
"launch --new_window" = "Spustí nové okno, i když je nějaké otevřené"
"ai split-plan" = "Vypíše plán, který AI navrhuje pro rozdělení commitu na více commitů, ve formátu JSON, který přijímá `split-commit --plan`. Nic neaplikuje: zkontrolujte ho a předejte `split-commit`. Vyžaduje `ai.enabled = true`"
"ai split-plan --rev" = "Commit k rozdělení (libovolná revize: sha, `HEAD~2`, ...)"
"ai rewrite-script" = "Vypíše skript v Lua, který AI napíše pro přepis historie podle vašeho zadání (\"posunout každý commit vytvořený v noci na následující ráno\"), spolu s výsledkem `rewrite script check`. Nic nespouští a nic nemění: skript si přečtěte, pak `rewrite script test` a `rewrite preview --script`. Odesílá jen vaše zadání a s `--sample N` autora, datum a předmět N commitů (nikdy obsah souborů). Vyžaduje `ai.enabled = true`"
"ai rewrite-script --instruction" = "Co má skript dělat, vlastními slovy"
"ai rewrite-script --sample" = "Odešle také autora, datum a předmět N nejnovějších commitů (nejvýše 50), aby model viděl, jak data vypadají. Ve výchozím stavu vypnuto: bez toho žádná data o commitech počítač neopustí"
"ai rewrite-rules" = "Vypíše pravidla a nastavení, která AI navrhuje pro přepis historie podle vašeho popisu („nahradit můj starý e-mail a@b adresou c@d ve všech commitech“, „odstranit secrets.txt z celé historie“), jako JSON recept, který čte `rewrite preview --recipe-json` (pole `recipe` uložte do souboru pro `--recipe`), spolu s tím, co AI vynechala a proč. Nic nezobrazí v náhledu a nic nepoužije: přečtěte si pravidla a pak sami spusťte `rewrite preview` a `rewrite apply`. Odešle jen váš popis a s `--context` také aktuální větev, názvy větví a tagů a autory 200 nejnovějších commitů (nikdy obsah souborů). Vyžaduje `ai.enabled = true`"
"ai rewrite-rules --description" = "Jak se má historie přepsat, vlastními slovy"
"ai rewrite-rules --context" = "Odešle také názvy větví a tagů a autory nejnovějších 200 commitů (nejvýše 100 názvů větví a tagů a 100 autorů), aby je model mohl přesně pojmenovat. Ve výchozím stavu vypnuto: bez toho počítač opustí jen váš popis"
"ai sequence-draft" = "Print the action sequence the AI drafts from your description (\"stage everything, write the message with the AI, commit and push\"), or, with `--edit <id>`, the changed version of an existing sequence: `{ sequence, toml, problems, notes, suggested_shortcut, shortcut_conflict, retried, context, applied: false }`. Every step is checked on its own against the step vocabulary: a step that is unknown, destructive, nested or has an impossible pause is left out and listed in `problems` (exit code 2). Saves and runs nothing: read the sequence, then save it yourself with `sequence add --file`. Sends only your description and, with `--edit`, that sequence; with `--context` also the remote names, the AI profile ids and the Open in labels. Needs `ai.enabled = true`"
"ai sequence-draft --description" = "What the sequence must do, or with `--edit` how to change it, in your own words"
"ai sequence-draft --edit" = "Change this sequence (its id, `sequence list`) instead of creating one: it is sent along, and the proposal keeps its id and scope"
"ai sequence-draft --context" = "Also send the remote names, the AI profile ids and the Open in labels so the model can name them exactly. Off by default: without it nothing but your description (and the sequence being edited) leaves the machine"
"ai worktree-name" = """Vypíše název worktree a název větve, které AI navrhuje pro úkol („opravit pád při prázdné konfiguraci“): `{ name, worktree, branch }`, kde `worktree` je název, který by vyplnil dialog Vytvořit worktree (`worktree-<name>`) a `branch` se řídí pojmenováním větví v samotném repozitáři. Nic nevytvoří: předejte je příkazu `worktree add`. Odešle jen váš popis a názvy lokálních větví. Vyžaduje `ai.enabled = true`"""
"ai worktree-name --describe" = "Funkce, chyba nebo úkol, vlastními slovy"
"ai hosting-reply" = "Vypíše návrh, který AI napíše pro konverzaci na hostiteli kódu: komentář, odpověď ve vlákně (`--reply-to`), komentář k řádku kódu (`--path`), shrnutí kontroly (`--review-summary`) nebo popis nové issue (`--issue-title`). Konverzace se čte z `--conversation` (JSON, který vypíše `hosting issue comments --json` nebo `hosting review conversation --json`, takže funguje `hosting issue comments 7 --json | ai hosting-reply --conversation -`) nebo ji načte `--item`; AI vidí položku, vlákno, nedávné komentáře v mezích `ai.limits.hosting_reply_context_bytes` a váš `--hint`. **Jen navrhuje: odpověď je `{ draft, posted: false, ... }` a nic se neodešle, neupraví ani nesmaže**; odeslání je samostatný příkaz, který spustíte sami. Základní prompt je `ai.hosting_reply.base_prompt` (upravíte ho v Nastavení > AI). Vyžaduje `ai.enabled = true`"
"ai hosting-reply --conversation" = "Konverzace jako JSON, tak jak ji vypisuje konverzační příkaz `hosting`: soubor, `-` pro standardní vstup, nebo přímo JSON. Ne pro `--issue-title`"
"ai hosting-reply --draft" = "Váš vlastní text k vylepšení místo psaní nového"
"ai hosting-reply --flavor" = "Značkování, které hostitel přijímá: `gfm`, `gitlab_md`, `gitea_md`, `common_mark`, `azure_md`, `bitbucket_md`, `html`, `jira_wiki`, `textile`, `youtrack_md`, `trello_md`, `plain_text`, `obsidian_md`. Výchozí: značkování samotné položky"
"ai hosting-reply --hint" = "Co chcete v této odpovědi (\"řekni, že se na to podívám zítra\")"
"ai hosting-reply --issue_title" = "Navrhne popis nové issue s tímto názvem (bez konverzace)"
"ai hosting-reply --item" = "Issue nebo pull request, na který se odpovídá, načtené přímo z hostitele v propojeném zdroji repozitáře (`7` nebo `#7` issue, `!7` pull request): táž konverzace, kterou vypíše `hosting issue comments 7 --json`, bez systémových událostí. Místo `--conversation`"
"ai hosting-reply --line" = "S `--path`: řádek"
"ai hosting-reply --path" = "Navrhne nový komentář při kontrole k tomuto souboru pull requestu"
"ai hosting-reply --read_repo" = "Nechá AI číst repozitář pro tento návrh (vypnuto, dokud se nezadá nebo dokud `ai.hosting_reply.read_repository` není true). Lokální agent ho čte sám nástroji jen pro čtení ve složce repozitáře; profil API dostane kontext, který GitPoulpi sestaví (soubory, které konverzace jmenuje, nálezy hledání, mapu) v mezích `ai.limits.hosting_reply_*`. AI v obou případech jen navrhuje; nic se neodešle"
"ai hosting-reply --refresh_context" = "Zapomene kontext a relaci agenta ponechané z dřívějších návrhů tohoto repozitáře a přečte ho znovu (s `--read-repo`)"
"ai hosting-reply --continue_exchange" = 'Naváže na výměnu posledního `hosting-reply` pro tentýž cíl (stejné `--item`, `--reply-to`, `--path`/`--line` nebo `--issue-title`): dřívější nápovědy a návrhy se vrátí modelu jako předchozí tahy, takže funguje i „zkrať to“. Pro lokálního agenta Claude, jehož relace se ponechává, to není potřeba (pamatuje si). Bez přepínače začne nová výměna. Uchovává se ve složce stavu'
"ai hosting-reply --pr_base" = "S `--read-repo`: základní revize pull requestu, aby se do kontextu dostal jeho diff (proti merge base)"
"ai hosting-reply --pr_head" = "S `--read-repo`: hlavní revize (head) pull requestu"
"ai hosting-reply --reply_to" = "Odpoví ve vlákně s tímto id (vlákno ke kódu, komentář nebo diskuse)"
"ai hosting-reply --review_summary" = "Navrhne shrnutí kontroly, která se právě odesílá"
"split-commit" = "Rozdělí commit aktuální větve na několik, od nejstaršího, podle JSON plánu (číslování viz `split-source`). Poslední nový commit zachová původní strom, takže potomci a pracovní strom zůstanou beze změny; odeslaný commit pak vyžaduje force push. Jedno `undo` vrátí vše. Výstupní kód 2 při odmítnutí"
"split-commit --commit" = "Commit k rozdělení (libovolná revize: sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Ověří plán a vypíše, co není přiřazeno; nic nemění"
"split-commit --plan" = "Plán (JSON) z cesty k souboru nebo `-` pro stdin. Kus je `path` plus volitelný `hunk` plus volitelné `lines` (indexy do `lines` hunku); kus jen s `path` je celý soubor"
"split-commit --rest_message" = "Vše, co plán nepřiřadí, vloží do posledního commitu s touto zprávou"
"split-commit --sign" = "Podepíše nové commity (i znovu vytvořené potomky)"
"split-source" = "Změny commitu očíslované pro `split-commit`: každý soubor se svými hunky (`id`, řádky) nebo, u souborů, které lze přiřadit jen celé (binární, jen režim, přidaný, smazaný, submodul, LFS), důvod. Jen pro čtení"
"split-source --commit" = "Commit (libovolná revize: sha, `HEAD~2`, ...)"
"rewrite" = "Hromadný přepis historie (identity, data, zprávy) podle sady: `preview` jej naplánuje bez jakékoli změny, `apply` provede plán, který jste zkontrolovali, jako JEDEN záznam pro vrácení zpět, `run` dělá obojí u skriptů. Odesílá jen `push`: vynuceně odešle přepsané refy, každý s lease"
"rewrite apply" = "Provede náhled: přesune refy jako JEDEN záznam pro vrácení (`gitpoulpi undo` vrátí vše zpět). Nikdy neodesílá. Návratový kód 2 při odmítnutí (repozitář se od náhledu změnil, špatný digest, ...), 3 když plán přesouvá refy, které jsou na remote, a chybí `--yes`"
"rewrite apply --digest" = "Digest, který vypsal `rewrite preview`: plán, který jste zkontrolovali"
"rewrite apply --run" = "ID běhu, které vypsal `rewrite preview`"
"rewrite apply --yes" = "Potvrdí přesun refů, které už jsou odeslané. Bez toho takový plán nic nezmění a návratový kód je 3"
"rewrite diff" = "Co pravidlo obsahu udělalo s jedním souborem jednoho commitu v náhledu: starý a nový soubor jako diff. Řádky, které odstraní pravidlo pro tajné hodnoty, jsou skryté. Jen čte"
"rewrite diff --commit" = "Commit tak, jak je před přepisem (id z řádků)"
"rewrite diff --path" = "Soubor, relativně ke kořeni repozitáře"
"rewrite diff --run" = "ID běhu, které vypsal `rewrite preview`"
"rewrite discard" = "Zahodí náhled bez provedení. Opakované zahození nevadí"
"rewrite discard --run" = "ID běhu, které vypsal `rewrite preview`"
"rewrite preview" = "Naplánuje přepis historie bez jakékoli změny: počty, refy, které by se přesunuly, varování a první řádky. Plán drží daemon jako běh (`run`, `digest`) pro `rewrite rows` a `rewrite apply`. Náhled je navíc uložen na disku v git adresáři repozitáře, takže `rewrite apply` funguje i z pozdějšího příkazu, po restartu daemona nebo z jiného frontendu, aniž by spouštěl daemona; daemona, který náhled vytvořil, potřebuje jen `rewrite rows` (běžícího, nebo použijte u náhledu `--all`). Návratový kód 2 při odmítnutí sady"
"rewrite preview --all" = "Vypíše každý změněný commit"
"rewrite preview --all_local" = "Přepíše všechny lokální větve a tagy místo aktuální větve"
"rewrite preview --committer" = "Committer přepsaných commitů: `keep` (výchozí) nebo `me-now`"
"rewrite preview --include_protected" = "Přepíše i tyto chráněné větve, které už jsou odeslané (ve výchozím stavu se vynechávají; lze opakovat)"
"rewrite preview --lfs_export" = "Pravidlo LFS: v každém commitu změní ukazatele LFS odpovídající tomuto globu zpět na skutečné soubory (lze opakovat). Objekty musí být v lokálním úložišti LFS (nejdřív `lfs fetch`); jinak se příkaz odmítne a objekty vypíše"
"rewrite preview --encoding_exclude" = "S `--reencode`: soubory, které nechá být (globy, lze opakovat)"
"rewrite preview --encoding_fallback" = "S `--reencode`: v jakém kódování se čte soubor, který nemá značku a není UTF-8, když se zdroj zjišťuje (výchozí `windows-1252`)"
"rewrite preview --encoding_paths" = "S `--reencode`: soubory, které převede (globy, lze opakovat)"
"rewrite preview --eol" = "Pravidlo konců řádků: každý textový soubor odpovídající `--eol-paths` dostane tento konec (`lf` pro Linux a macOS, `crlf` pro Windows, `cr` pro klasický Mac); smíšené konce se sjednotí a binární soubory se přeskočí"
"rewrite preview --eol_exclude" = "S `--eol`: soubory, které nechá být (globy, lze opakovat)"
"rewrite preview --eol_follow_attributes" = "S `--eol`: čte kořenový `.gitattributes` každého commitu: soubory s `-text` a `binary` se přeskočí, soubory s `eol=lf` a `eol=crlf` si ponechají vlastní konec"
"rewrite preview --eol_paths" = "S `--eol`: soubory, které převede (globy, lze opakovat; vzor bez lomítka odpovídá v libovolné hloubce)"
"rewrite preview --reencode" = "Pravidlo kódování: textové soubory odpovídající `--encoding-paths` se převedou do tohoto kódování (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). Binární soubory, soubory, které zdrojové kódování nepřečte, a znaky, které cíl nepojme, zůstanou beze změny a započítají se"
"rewrite preview --reencode_from" = "S `--reencode`: v jakém kódování soubory jsou. Vynecháno: zjistí se pro každý soubor zvlášť (BOM, platné UTF-8, jinak `--encoding-fallback`)"
"rewrite preview --strip_exec" = "Pravidlo režimu souboru: soubory odpovídající těmto globům přijdou o příznak spustitelnosti (100755 se změní na 100644; lze opakovat). Obsah se nemění"
"rewrite preview --strip_exec_exclude" = "S `--strip-exec`: soubory, které si příznak spustitelnosti ponechají (globy)"
