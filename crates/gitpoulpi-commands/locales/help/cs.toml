"ai trust" = "Naváže API klíč profilu na adresu, pro kterou byl uložen: ukáže, čemu se důvěřuje, nebo přijme aktuální adresu profilu (po změně jeho základní URL), certifikát vlastního serveru či prosté http. Spouští to jen člověk (není to nástroj agenta)"
