"remote-group continue --yes" = "Potvrdí force pushe uvedené v `--resolve`"
"remote-group plan" = "Co by udělal skupinový push (nebo s `--pull` skupinový pull), remote po remote: jak každý stojí, navržená akce a ostatní povolené. Ptá se remote (`ls-remote`, fetch těch, jejichž hrot je neznámý), pokud není `--no-preflight`; nic nemění"
