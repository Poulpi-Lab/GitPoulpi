"rewrite check-signing" = "Jednou podepíše zkušební data podle nastavení podepisování repozitáře (`gpg.format`, `user.signingkey`, `gpg.*.program`) a ověří podpis; slouží jako zkouška před během, který znovu podepisuje (`--signatures resign-signed` nebo `resign-all`). Vypíše program, zda funguje a jak dlouho trval jeden podpis (pro odhad ho vynásobte počtem commitů k novému podepsání). Může otevřít výzvu k zadání hesla. Skončí s kódem 2, když nefunguje, s důvodem (`tool_missing` nebo `signing_failed`)"
"rewrite preview --remove_signatures" = "Pravidlo podpisů: odstraní podpis každého commitu v rozsahu, i tam, kde se jinak nic nemění. Tyto commity nepotřebují odpověď na `--signatures`"
"rewrite preview --fix_message_encoding" = "Pravidlo zpráv: převede zprávy commitů do UTF-8. Zpráva s hlavičkou `encoding` (ISO-8859-1, Shift_JIS...) se dekóduje a hlavička zmizí; UTF-8 přečtené kdysi jako Latin-1 nebo Windows-1252 („RÃ©Ã©criture“) se opraví jen tehdy, když převod tam a zpět přesně sedí. Co nelze určit, zůstane beze změny a započítá se (`encoding_left`)"
"rewrite preview --fix_name_encoding" = "S `--fix-message-encoding`: opraví i poškozená jména autorů a committerů (jména commitu, jemuž hlavička zmizí, se dekódují vždy společně s ní)"
"rewrite run --remove_signatures" = "Pravidlo podpisů: odstraní podpis každého commitu v rozsahu, i tam, kde se jinak nic nemění. Tyto commity nepotřebují odpověď na `--signatures`"
"rewrite run --fix_message_encoding" = "Pravidlo zpráv: převede zprávy commitů do UTF-8. Zpráva s hlavičkou `encoding` (ISO-8859-1, Shift_JIS...) se dekóduje a hlavička zmizí; UTF-8 přečtené kdysi jako Latin-1 nebo Windows-1252 („RÃ©Ã©criture“) se opraví jen tehdy, když převod tam a zpět přesně sedí. Co nelze určit, zůstane beze změny a započítá se (`encoding_left`)"
