"rewrite preview --move_paths" = "Pravidlo cesty `FROM=TO`: v každém commitu přejmenuje soubor nebo složku, se stejnými bloby a stromy na nové cestě (lze opakovat, v daném pořadí, až po pravidlech obsahu). Commit, kde `TO` už existuje, se nemění: náhled se odmítne (návratový kód 2, `path_collision`) a vypíše commity a cesty"
"rewrite preview --target" = "Složka nového repozitáře pro `--extract-mode clone` nebo `submodule`: nesmí existovat (nebo musí být prázdná) a nesmí ležet uvnitř tohoto repozitáře. Používá ji `rewrite run`; `rewrite apply` má vlastní"
"rewrite push" = "Odešle refy, které provedený běh přesunul a které byly na remote, každý s `--force-with-lease=<ref>:<id, které remote mělo při náhledu>` (nikdy obyčejný force), jeden push s `--atomic` na remote, pokud to server dovoluje (jinak jeden push na ref a odpověď to uvede). Tagy jsou zahrnuty. Chráněné větve (`rewrite.protected_branches`) se vynechají, dokud je nevyjmenujete přes `--include-protected` nebo všechny přes `--include-all-protected`. Ref, jehož remote se od náhledu posunulo, se odmítne (načtěte, zkontrolujte a spusťte znovu). Nelze vrátit zpět: remote si novou historii ponechá, i když přepis lokálně vrátíte příkazem `undo`. Bez `--yes` (nebo s `--dry-run`) se nic neodešle: odpověď vypíše, co by se odeslalo, a bez `--yes` je návratový kód 3. Návratový kód 2, když běh už neexistuje, 4, když byl některý ref odmítnut nebo neodeslán"
