"undo-restore" = "„Obnovit jen tuto“: vrátí, co jedna dřívější operace odstranila (smazanou větev nebo tag, zahozený stash, zahozený či smazaný soubor, odebraný remote, řádek ignorování), aniž by vrátila operace po ní. Obnovení je nový záznam v žurnálu, takže ho `undo` vrátí. Nic se nepřepíše: soubor, který se mezitím změnil, dostane vedle sebe uchovanou verzi jako `<name>.restored`; reset, amend nebo rebase se vrátí jako nová větev na dřívější špičce. Také zapisované jako `gitpoulpi undo restore <id>`. Návratový kód 2, když to nelze provést (JSON uvádí důvod)"
