"pull --resolve" = "S `--all-sources`: `REMOTE=ff|merge|rebase|skip` (opakovatelné), rozhodnutí pro remote, na který se plán ptal"
"pull --all_branches" = "Aktualizuje každou lokální větev, která má upstream: provede fetch jejich remote, větve, které jen zaostávají, posune fast-forwardem (u nich nikdy merge ani rebase) a nakonec integruje aktuálně checkoutnutou větev jako obyčejný pull v režimu `--mode` (výchozí: nastavený režim pullu). Rozešlé větve se přeskočí a vypíšou. Konflikt na checkoutnuté větvi zanechá stejný stav jako konfliktní pull, ostatní větve jsou už aktualizované. Jeden záznam undo pokrývá všechny posunuté větve. Kód 4: selhala větev nebo fetch; 2: odmítnuto (čeká nebo je potřeba auto-stash)"
"pull --no_fetch" = "S `--all-branches`: nejdřív nedělat fetch, použít remote-tracking větve tak, jak jsou"
"pull --prune" = "S `--all-branches`: při fetchi odstraní remote-tracking větve, které remote už nemá"
"pull --worktrees" = "S `--all-branches`: co dělat s větví, která zaostává a je checkoutnutá v jiném worktree: `skip` (výchozí) ji jen vypíše, `update` ji tam posune fast-forwardem"
"push --all_targets" = "Pushne na primární upstream a každý další cíl push větve (viz `branch upstream add`). Nejdřív plánuje: když je každý remote obyčejný push nebo aktuální, provede se, jinak odpoví `needs_resolution` (kód 3, nic se nezměnilo). Kód 4: některý remote selhal nebo merge zastavily konflikty (`stopped`)"
"push --no_preflight" = "Nejdřív se na remote neptat (použijí se sledovací refs)"
"push --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (opakovatelné): rozhodnutí pro remote, na který se plán ptal"
"push --tags" = "Pushne také dosud nepushnuté tagy na každý remote, který větev přijal"
"push --to" = "Pushne přesně na tyto remote (`<remote>` nebo `<remote>:<dst>`, opakovatelné), jen pro tento push; konfigurace se nemění. Stejný plán, `--resolve` a běh jako u `--all-targets`"
"push --yes" = "Potvrdí force push zvolený pomocí `--resolve REMOTE=force`. Bez něj takový push nic nezmění a skončí kódem 3"
