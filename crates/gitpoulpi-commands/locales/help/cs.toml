"hosting integrations trust --accept_account" = "Přijme toto id účtu jako vlastníka tokenu"
"hosting integrations trust --accept_certificate" = "Přijme certifikát s tímto otiskem klíče (SHA-256, hex), přesně tak, jak ho vypsalo odmítnutí"
"hosting integrations trust --accept_origin" = "Přijme aktuální adresu profilu (musí být zapsána přesně tak, jak ji vypsalo odmítnutí)"
"hosting integrations trust --allow_insecure_http" = "Povolí prostou adresu `http://`, která není na tomto počítači"
"hosting integrations trust --id" = "Profil"
