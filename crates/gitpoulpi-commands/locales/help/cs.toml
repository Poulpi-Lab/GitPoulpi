"ui" = "Ukazuje věci uživateli v jeho otevřeném okně GitPoulpi: commit, diff na řádku, soubor, stránku nastavení. Jen zobrazení: nic tu nemění repozitář ani nepíše do okna, kromě `ui propose`, které otevře předvyplněný dialog k potvrzení uživatelem (vypnuto, dokud není `[mcp] allow_ui_propose = true`). Vyžaduje otevřené TUI GitPoulpi v relaci"
