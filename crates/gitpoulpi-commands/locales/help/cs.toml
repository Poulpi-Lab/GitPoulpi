"tag annotate" = "Nahradí existující tag anotovaným, na místě. Tag si ponechá commit, na který už ukazuje"
"tag move" = "Move an existing tag to another commit, keeping its kind (an annotated tag keeps its message and tagger). Local only: a remote keeps the old position until you push"
