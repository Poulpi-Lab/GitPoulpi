"mailmap add --from" = "Identita, která se na ni namapuje, `Name <email>` (lze opakovat, alespoň jedna)"
"mailmap check" = "Ukáže, jak se identity (`Name <email>` nebo `<email>`) zobrazí přes `.mailmap` repozitáře: kanonické jméno a e-mail, nebo stejná identita, když ji nic nemapuje. Jen čte"
