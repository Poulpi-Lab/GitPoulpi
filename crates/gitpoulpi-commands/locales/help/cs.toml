"mailmap list" = "Vypíše každé jméno a e-mail, které v rozsahu autorovaly nebo commitovaly commit, s počtem commitů jako autor a jako committer, nejčastější první, a s identitou, na kterou je `.mailmap` už mapuje (`mapped_to`). Jen čte"
