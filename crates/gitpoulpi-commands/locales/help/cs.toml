"pull --all_sources" = "Stáhne primární upstream a každý zdroj pull větve (viz `branch upstream pull`), každý s `--mode`. Nejdřív plánuje: cokoli jiného než fast-forward nebo vlastní integrace režimu vyžaduje `--resolve` (kód 3, nic se nezměnilo). Zastavení na konfliktech skončí kódem 4 s `stopped`; pokračujte pomocí `remote-group continue`"
"pull --branch" = "S `--all-sources`: větev (výchozí: aktuální)"
