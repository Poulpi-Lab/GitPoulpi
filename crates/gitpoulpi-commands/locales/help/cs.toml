"tag delete" = "Smaže tag. Ve výchozím stavu jen lokální (`--local`): má-li tag i remote, příští `fetch` ho vrátí, což odpověď uvede. `--remote <R>` ho smaže jen na tom remote (dopad navenek: o tag přijdou ostatní), `--both` ho smaže tady i na remote, který ho má (`--both --remote <R>` ho pojmenuje)"
"tag delete --both" = "Smaže tady i na remote, který tag má"
"tag delete --local" = "Smaže jen lokální tag (výchozí)"
"tag delete --remote" = "Smaže na tomto remote (samostatně, pokud není zadáno `--both`)"
"tag delete-remote" = "Smaže tag z remote a ponechá lokální"
"tag take-remote" = "Use the remote's version of a tag that `differs` (here and on a remote at another commit): the local tag moves to what the remote has, as known from the last fetch or push (no network). An annotated tag becomes that same tag object. Undoable"
"tag take-remote --remote" = "Omitted: the one remote the tag differs on"
"tag force-push" = "Force-push the local tag to a remote that has it at another commit (a tag that `differs`), leased on the value the last fetch saw: a remote that moved since is refused (\"fetch first\") and nothing is overwritten. Outward-facing: without `--yes` nothing changes and the exit code is 3. Undoable (the old value is pushed back, with a lease)"
"tag force-push --remote" = "Omitted: the one remote the tag differs on"
"tag force-push --yes" = "Go ahead; without it nothing changes and the exit code is 3"
"tag fetch" = "Stáhne jeden tag z remote do lokálních tagů - to potřebuje tag, který je v `tag list` jen na `remote`. Nikdy nepřepíše lokální tag na jiném commitu"
"tag fetch --remote" = "Vynecháno: jediný remote, který tag má"
"tag list" = "Každý tag s tím, kde existuje: `local` (tady), `remote` (remoty, které ho mají), `differs_on` (remoty, kde je na jiném commitu) a `where`: `local`, `remote` (tady nestažen nebo smazán), `both` nebo `differs`. Zjištěno z posledního fetch nebo push, ne ze sítě"
"tag list --unpushed" = "Jen tagy, o kterých není známo, že by je měl nějaký remote"
"tag push" = "Odešle tagy na remote. Bez názvů odešle každý tag, o kterém není známo, že by ho měl nějaký remote - jeden push, ne jeden na tag"
"tag push --names" = "Tagy k odeslání. Vynechejte pro push každého neodeslaného tagu"
