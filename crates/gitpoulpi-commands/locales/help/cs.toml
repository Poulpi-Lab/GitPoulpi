repo-auth = "Jakou identitou se tento repozitář ověřuje (HTTPS i SSH): vlastní identitou počítače, účtem GitPoulpi, nebo souborem klíče. `show` a `test` jen čtou; `set` a `clear` jsou rozhodnutím člověka"
"repo-auth clear" = "Zapomene profil: repozitář se vrátí k vlastní identitě počítače. Smí to jen člověk: agent je odmítnut"
"repo-auth set" = "Zvolí identitu, jíž se tento repozitář ověřuje, podle protokolu: `--https` pro remote přes HTTPS, `--ssh` pro remote přes SSH. Profil se uchovává v soukromém adresáři GitPoulpi, nikdy v repozitáři. Nastavit ho smí jen člověk: agent je odmítnut (návratový kód 2)"
"repo-auth set --cache_minutes" = "S `token-command`: jak dlouho se jeho token znovu používá, v minutách"
"repo-auth set --use_for_hosting" = "S `token-command`: tentýž příkaz dodává i token pro volání API hostitele tohoto repozitáře (issues, pull requesty) místo osobního tokenu, například instalační token GitHub App."
"repo-auth set --command" = "S `--https token-command`: příkaz a jeho argumenty (první slovo je program). Pište `--command` jako poslední: každé slovo za ním, i s pomlčkou (`sh -c ...`), patří příkazu"
"repo-auth set --helper" = "S `--https helper`: příkaz credential helperu. Člověk ho potvrdí spolu s jeho hashem (nebo zadá `--yes`)"
"repo-auth set --hosts" = "S `helper` nebo `token-command`: hostitelé, kterým smí sloužit (oddělení čárkou nebo opakováním)"
"repo-auth set --https" = "Identita pro HTTPS: `system` (vlastní pomocníci gitu), `integration:<id>` (token účtu GitPoulpi), `helper` (jeden credential helper, s `--helper`) nebo `token-command` (příkaz, který vytiskne token, s `--command` a `--hosts`)"
"repo-auth set --ignore_repo_helpers" = "S `--https system`: zahodí credential helpery, které si repozitář nastavuje sám, a ponechá systémové a globální"
"repo-auth set --known_hosts" = "S `--ssh key:` nebo `integration-key:`: soubor `known_hosts`"
"repo-auth set --ssh" = "Identita pro SSH: `system` (vlastní konfigurace a agent ssh), `key:<cesta>` (soubor soukromého klíče, nabízený samostatně) nebo `integration-key:<id>` (klíč účtu GitPoulpi)"
"repo-auth set --strict" = "S `--ssh key:` nebo `integration-key:`: odmítne neznámé klíče hostitelů (`StrictHostKeyChecking=yes`)"
"repo-auth set --username" = "Uživatelské jméno: se `system` je to `credential.username` (umožní správci přihlašovacích údajů vybrat jeden z více účtů); s `integration:<id>` jméno odeslané s tokenem"
"repo-auth set --yes" = "Potvrdí helper nebo příkaz pro token bez interaktivní otázky (příkaz a jeho hash se přesto vytisknou)"
"repo-auth show" = "Zobrazí, jakou identitou se tento repozitář ověřuje: uložený profil, identitu, kterou použije každý remote, nastavení, která profil přepisuje, a případná varování. Nikdy nevytiskne tajemství; helper nebo příkaz pro token se vytiskne jen člověku (agent dostane `{set, sha256}`)"
"repo-auth test" = "Otestuje připojení každého remote (nebo jednoho) s použitým profilem, aniž by cokoli změnil: vypíše větve remote, nebo s `--push` zjistí, zda by push byl přijat. Odpovědí je zpráva o každém remote plus použitá identita. Používá síť"
"repo-auth test --push" = "Navíc ověří, že by push byl přijat"
"repo-auth test --remote" = "Jen tento remote (výchozí: každý remote)"
"apply-commit" = "Použije změny, které provedl jeden commit (i ztracený), jen na pracovní strom: index a HEAD zůstanou. Vše nebo nic: když se některý soubor nepoužije čistě, nic se nezmění (`stash from-commit` místo toho změny uloží jako stash). Merge commit se odmítne. `undo` to vrátí"
"apply-commit --commit" = "Commit, jehož změny se mají použít (libovolná revize: sha, `HEAD~2`, ...)"
"stash from-commit" = "Uloží změny, které provedl jeden commit (i ztracený), jako nový stash, bez zásahu do pracovního stromu. `undo` ho znovu zahodí"
