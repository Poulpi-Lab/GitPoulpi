"ai" = "Pomocníci AI (vypnutí, dokud není `ai.enabled = true`): vypíší vygenerovanou zprávu commitu, nebo vysvětlí commit či rozpracované změny"
"ai --print_sent" = "Vypíše, co by se odeslalo modelu (systémový a uživatelský text po nahrazení tajných hodnot a vynechání citlivých souborů), a nic neodešle. Vyžaduje `ai.enabled = true`, ale ne klíč ani síť"
"ai --send_all" = "Odešle každý vstup celý, i nad jeho limitem `ai.limits.*`. Bez přepínače se vstup nad limitem zkrátí (konflikt se odmítne) a odpověď říká, co bylo oříznuto, v `truncated: [{part, detail?, bytes, limit, setting}]`"
"commit --send_all" = "S `--ai`: odešle celý diff, i když přesahuje `ai.limits.diff_bytes`. Bez přepínače se větší diff zkrátí a odpověď to uvádí (`truncated`)"
"hosting review suggest --send_all" = "Odešle každý vstup celý, i nad jeho limitem `ai.limits.*` (diff, diff souboru, popis, stávající komentáře, kontextové soubory). Bez přepínače se vstup nad limitem zkrátí a odpověď říká, co bylo oříznuto, v `truncated`"
"stash push --send_all" = "S `--ai`: odešle celý diff, i když přesahuje `ai.limits.diff_bytes`. Bez přepínače se větší diff zkrátí a odpověď to uvádí (`truncated`)"
"ai commit-message" = "Vypíše zprávu commitu, kterou AI navrhuje pro změny v indexu (nebo pro všechny změny, když v indexu nic není). Nic necommituje"
"ai explain" = "Vysvětlí commit (výchozí HEAD) nebo s --wip rozpracované změny"
"ai resolve-conflict" = "Vypíše řešení, které AI navrhuje pro JEDEN konflikt merge v souboru v konfliktu (`--conflict N`, číslováno od 1; u souboru s jediným konfliktem nepovinné). Jen vypisuje: nic se nezapíše ani nepřidá do indexu, rozhodnutí tak zůstává na volajícím (výsledek celého souboru použije `conflicts resolve --content-file`). Vyžaduje `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Který konflikt souboru, číslováno od 1"
"ai resolve-conflict --path" = "Soubor v konfliktu, relativně ke kořeni repozitáře"
autostash = "Čekající auto-stash: GitPoulpi odložil lokální změny, aby provedl checkout, merge, rebase nebo pull, a ještě je nevrátil"
"ai review-context" = "Zobrazí nebo nastaví, co dostane koncept kontroly kódu ✦ kromě diffu (`[ai.review]`): CLAUDE.md a AGENTS.md repozitáře, ještě jeden soubor (cestu nebo odkaz) a zda v repozitáři běží místní agent. Bez `--repo` i `--project` jde o globální výchozí hodnotu; `--repo PATH` je hodnota jednoho naklonovaného repozitáře, `--project HOST/PROJECT` hodnota repozitáře, který není naklonovaný. Bez přepínače nastavení vypíše hodnoty (`effective` je to, co kontrola dostane); s ním hodnotu uloží a vypíše výsledek. Nepotřebuje model a funguje i při vypnuté AI"
"ai review-context --agents_md" = "Předat modelu soubor AGENTS.md repozitáře"
"ai review-context --claude_md" = "Předat modelu soubor CLAUDE.md repozitáře"
"ai review-context --context_file" = "Ještě jeden soubor: cesta relativní ke kořeni repozitáře, absolutní cesta nebo odkaz na soubor na hostiteli kódu"
"ai review-context --no_context_file" = "Žádný další soubor"
"ai review-context --no_extra_file" = "Žádný další soubor pro repozitář nebo projekt, ať říká globální hodnota cokoli (`on`, výchozí při samostatném použití); `off` ho přinutí znovu následovat globální hodnotu"
"ai review-context --project" = "Repozitář, který není naklonovaný, jako `HOST/PROJECT` (`github.com/owner/name`)"
"ai review-context --reset" = "S `--repo` nebo `--project`: zapomene vlastní hodnoty repozitáře (opět se řídí globálními) před použitím přepínačů"
"ai review-context --run_in_repo" = "Spustit místního agenta v repozitáři (`yes`), nespouštět (`no`) nebo podle jeho profilu AI (`profile`). Ne pro `--project`"
"autostash start-over" = "Začít znovu: zahodí změny v pracovním stromu u souborů stashe (kopie zůstane v `refs/gitpoulpi-backup/`), vrátí operaci, která auto-stash vytvořila (pull, checkout, merge, rebase), a poté provede pop stashe na původním commitu. Zastaví se s neporušeným stashem, pokud některý krok selže. Návratový kód 1 při odmítnutí, 3 když je třeba `--yes`"
"autostash start-over --dry_run" = "Ukáže, co by se stalo, a nic nezmění"
"autostash start-over --yes" = "Pokračuje; bez toho se nic nezmění a návratový kód je 3"
"blame" = "Autorství jednotlivých řádků souboru v dané revizi"
"blame --at" = "Revize, pro kterou se blame provede (výchozí: HEAD)"
"branch delete-remote" = "Smaže větev na remote a ponechá případnou lokální větev stejného názvu"
"branch fast-forward" = "Posune `<branch>` dopředu na `<target>`, jen pokud jde o fast-forward (rozešlá historie se odmítne a nic se nepohne). Přepnutá větev vezme s sebou i pracovní strom, jako `git merge --ff-only`; u jiné větve se jen přesune ref"
"branch fast-forward --target" = "Libovolná revize (výchozí: HEAD)"
"branch set-upstream" = "Nastaví, aby `<branch>` sledovala `<upstream>` (`origin/main`)"
"branch track" = "Vytvoří lokální větev sledující vzdálenou sledovací větev a přepne na ni. `<upstream>` se zapisuje tak, jak ho vypisuje seznam refs (`origin/feature/login`); `--name` je ve výchozím stavu část s názvem větve"
"branch unset-upstream" = "Odebere upstream větve `<branch>`"
"checkout --autostash" = "Stashne místní změny, které tomu brání, provede operaci a pak stash pop (to dělá `general.auto_stash = \"always\"`)"
"cherry-pick --commits" = "Commity k použití, v daném pořadí. Vynechává se, je-li zadáno `--plan`"
"cherry-pick --plan" = "JSON `Vec<RebaseStep>` (stejný tvar jako `rebase --plan`; viz `rebase-plan`), z cesty k souboru nebo `-` pro stdin: kroky se provedou jako cherry-pick v pořadí seznamu. Smysl tu mají jen akce `Pick` a `Drop` (`Drop` commit přeskočí); jakákoli jiná akce se odmítne. Nelze kombinovat s pozičními commity"
"clone --branch" = "Přepne na tuto větev místo výchozího HEAD remote"
"clone --depth" = "Zkrátí historii na tento počet commitů (`git clone --depth`)"
"clone --no_lfs" = "Po klonování ponechá soubory Git LFS jako ukazatele a nestáhne jejich obsah"
"clone --origin" = "Pojmenuje nový remote jinak než `origin`"
"clone --recurse_submodules" = "Naklonuje i submoduly"
"commit --ai" = "Nechá AI napsat zprávu z diffu v indexu podle instrukcí repozitáře pro zprávy commitů (Nastavení > AI). Vyžaduje `ai.enabled = true` a nastavený profil"
"commit --message" = "Zpráva commitu. Povinná, pokud ji nepíše --ai"
"commit --no_verify" = "Přeskočí hooky commitu (`pre-commit`, `commit-msg`), jako `commit --no-verify`"
"completions" = "Vypíše na standardní výstup skript pro doplňování shellu (bash, zsh, fish, powershell nebo elvish), např. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Přeruší probíhající operaci: HEAD, index a pracovní strom se vrátí do stavu před ní. Zahodí všechna dosavadní řešení"
"conflicts skip" = "Přeskočí probíhající cherry-pick nebo revert (nebo commit, na kterém se zastavil rebase): HEAD, index a pracovní strom se vrátí na HEAD. Cesta ven, když se stal prázdným (změna je už použita). Merge nemá co přeskočit"
"conflicts check" = "Způsobilo by sloučení HEAD do větve, ze které vznikla, konflikt, a v kterých souborech? Nic se nemění (merge v paměti). Základem je cíl známého pull requestu větve, jinak větev povolená vzory Základních větví s nejméně commity od rozdvojení. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Vypnuto, je-li vypnuté `general.conflict_detection` nebo přepínač repozitáře"
"conflicts list" = "Soubory v konfliktu, každý s textem svých tří stran. S `--names-only`: jen cesta, druh konfliktu a oid stagí (žádný blob se nečte; levné i u velkého merge)"
"conflicts resolve" = "Vyřeší jeden soubor a přidá ho do indexu (soubor přestane být v konfliktu). Právě jedno z `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` nebo `--delete`. A a „ours“ jsou aktuální strana (`HEAD`; při rebase větev, na kterou se rebasuje), B a „theirs“ příchozí strana. Značky konfliktu nikdy neupravujte ručně: vyberte, nebo zapište konečný text do souboru"
"conflicts resolve --both" = "Ponechá obě strany každého konfliktu (A, pak B) a všude jinde vlastní merge gitu"
"conflicts resolve --content_file" = "Přesný konečný text souboru (`-` čte standardní vstup)"
"conflicts resolve --delete" = "Přijme smazání: odstraní soubor (`git rm`)"
"conflicts resolve --encoding" = "S `--content-file`: zapíše text v tomto kódování (štítek WHATWG, např. `windows-1252`) místo UTF-8"
"conflicts resolve --expect" = "Oid stagí, vůči kterým se rozhodovalo, `base,ours,theirs` (chybějící stage zadejte `-`). Volání se odmítne jako `stale`, pokud index už přesně tyto nedrží. `--both` a `--pick` vždy kontrolují stage, které čtou"
"conflicts resolve --no_stage" = "Zapíše soubor v pracovním stromě, ale ponechá ho v konfliktu (prosté uložení)"
"conflicts resolve --ours" = "Totéž jako `--side ours`"
"conflicts resolve --pick" = "Volba pro každé číslo konfliktu: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = obojí v tomto pořadí). Každý konflikt potřebuje volbu, pokud zbytek nepokrývá `--default`"
"conflicts resolve --pick_default" = "S `--pick`: volba pro každý neuvedený konflikt"
"conflicts resolve --side" = "Vezme celý soubor z jednoho stage, bez automatického merge"
"conflicts resolve --theirs" = "Totéž jako `--side theirs`"
"conflicts resolve --theirs_first" = "S `--both`: B, pak A"
"conflicts show" = "Jeden soubor v konfliktu tak, jak ho vidí editor merge: popisky panelů, tři strany a očíslované oblasti konfliktů (`--json` je celý dokument). Sloučené oblasti, které git vyřešil sám, se neuvádějí; zůstávají ve výsledku `resolve --both`/`--pick`"
"conflicts show --conflict" = "Jen konflikt N (číslováno od 1)"
"conflicts state" = "Probíhající merge, rebase, cherry-pick nebo revert (`null`, není-li žádný)"
"conflicts unresolve" = "Vrátí soubor vyřešený během této operace zpět do konfliktu (opět se značkami). Odmítne se, je-li stále v konfliktu nebo nebyl vyřešen za běhu operace"
"daemon" = "`gitpoulpi server ...` je viditelný alias - vlastník této skupině říká „server“ a píše `gp server stop`"
"daemon restart" = "`daemon stop` a po něm `daemon start`"
"daemon run" = "Spustí daemona této relace v popředí (blokuje; zastavíte ho Ctrl-C, nebo `daemon stop`/`daemon restart` poslaným odjinud). To spouští odpojeně `daemon start` a lze to spustit i přímo ve vyhrazeném terminálu"
"daemon start" = "Spustí daemona této relace jako odpojený proces na pozadí (nebo ohlásí, že už běží). `--backend` připne backend, který má spuštěný proces použít; je-li vynecháno, spuštěný proces si `general.default_backend` vyhodnotí sám"
"daemon status" = "Zda daemon této relace naslouchá, a pokud ano, jeho port, PID, dobu běhu, backend a verzi sestavení"
"daemon stop" = "Požádá daemona této relace o řádné ukončení; k zabití zaznamenaného PID sáhne, jen když neodpoví včas a jen jde-li o samostatného daemona (nikdy ne o vestavěného v běžícím TUI)"
"daemon stop --all" = "Zastaví daemony všech relací, pro které `session list` hlásí soubor s portem, nejen této"
"discard" = "Zahodí změny souboru *mimo index* v pracovním stromě: jeden hunk (`--hunk`), některé jeho řádky (`--hunk --lines`), nebo - se samotným `--file` - každou necommitnutou změnu souboru včetně těch v indexu (nesledovaný soubor se smaže). Hunky a řádky se číslují tak, jak je číslování diffu mimo index v `gitpoulpi diff --json`. Vše, co se zahodí, se uchová v záložním snímku, takže `gitpoulpi undo` to vrátí (včetně nesledovaných souborů). Bez potvrzení: toto je rozhraní pro skripty"
"discard --lines" = "Indexy řádků uvnitř `--hunk` oddělené čárkou"
"fetch --all" = "Fetch každého nakonfigurovaného remote"
"fetch --prune" = "Zahodí sledovací větve, které remote už nemá"
"fetch --prune_tags" = "Smaže i lokální tagy, které remote smazal (jen tagy, které na něm byly: tag, který jste nikdy neodeslali, zůstane). Užší varianta `fetch.pruneTags` z gitu; bez zadání vypnuto"
"fetch --remote" = "Vynecháno: výchozí remote repozitáře (viz `remote default`)"
"gitpoulpi" = "Lehký multiplatformní TUI klient Gitu, skriptovatelný přes CLI/MCP."
"gitpoulpi --add" = "Otevře složku jako novou kartu již spuštěného GitPoulpi, místo aby spustil další (`gp -a`, `gp --add ../jina`). PATH je ve výchozím stavu aktuální složka a převádí se na nadřazený repozitář. Jedna spuštěná relace: dostane kartu a její okno se přenese do popředí, pokud to desktop dovolí. Několik: jednu vyberete z číslovaného seznamu (nebo zadáte `--session NÁZEV`). Žádná: GitPoulpi se spustí normálně v této složce. Nepřijímá podpříkaz; s `--json` vypíše jeden objekt (`action` je `joined` nebo `cancelled`), návratový kód 0, když je karta otevřená, 3, když ji zaneprázdněné okno nabídlo na čipu stavového řádku"
"gitpoulpi --no_raise" = "S `--add`: nežádá okno, aby přesunulo svůj terminál do popředí"
"gitpoulpi --backend" = "Na kterém `GitBackend` běží daemon tohoto příkazu; přepíše `general.default_backend` v config.toml a `GITPOULPI_GENERAL_DEFAULT_BACKEND` (přepínače jsou na vrcholu pořadí priorit - viz docs/user/config-reference.md)"
"gitpoulpi --backend#long" = "Na kterém `GitBackend` běží daemon tohoto příkazu; přepíše `general.default_backend` v config.toml a `GITPOULPI_GENERAL_DEFAULT_BACKEND` (přepínače jsou na vrcholu pořadí priorit - viz docs/user/config-reference.md).\n\nVolí backend pro daemona, kterého tento příkaz *spouští*. Relace, jejíž daemon už běží, si ponechá backend, se kterým byl daemon sestaven; `gitpoulpi` nemá jak vyměnit backend běžícího daemona pod klienty, kteří už jsou k němu připojeni, a předstírat opak by bylo totéž tiché nic, kterému se tento přepínač snaží zabránit."
"gitpoulpi --cwd_file" = "Soubor, do kterého TUI při ukončení zapíše složku aktivní karty („Ukončit a cd sem“, nebo vždy s `ui.tab_dir_follow = \"auto\"`). Určeno pro obal, který vypisuje `gitpoulpi shell-init`; všechny podpříkazy ho ignorují, protože karty má jen TUI"
"gitpoulpi --json" = "Místo textu pro lidi vypíše strukturovaný JSON"
"gitpoulpi --lang" = "Jazyk textu `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = "Jazyk textu `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).\n\nPřekládají se jen vysvětlivky - názvy příkazů a přepínačů se nikdy nemění - a `--help` zůstává anglicky, dokud se tento přepínač nezadá (prostředí se záměrně ignoruje, aby skripty dostávaly stabilní výstup). Příklad: `gitpoulpi -l cs --help`."
"gitpoulpi --repo" = "Repozitář, na kterém se pracuje. Výchozí je repozitář obsahující aktuální adresář, takže `gitpoulpi status` se chová jako `git status`; agent ovládající víc repozitářů místo chdir předá tento přepínač"
"gitpoulpi --session" = "Pojmenovaná relace, na kterou se míří. Je-li vynechána, odvodí se z kořene aktuálního repozitáře (viz `gitpoulpi_config::default_session_name`), takže dva repozitáře mají dva nezávislé daemony, zatímco vše otevřené uvnitř jednoho repozitáře sdílí jednoho. Předejte ho, chcete-li dva repozitáře přinutit k jedné relaci, nebo relaci pojmenovat výslovně. Hodnota se před použitím očistí - stane se názvem souboru"
"hosting checkout-pr" = "Přepne na pull/merge request, včetně toho z forku: načte jeho head (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) do lokální větve `pr/<n>` (`mr/<n>` na GitLabu), nastaví sledování a přepne na ni"
"hosting checkout-pr --id" = "Která integrace (viz `hosting prs`)"
"hosting checkout-pr --no_checkout" = "Jen načte a vytvoří/aktualizuje větev; zůstanete tam, kde jste"
"hosting checkout-pr --number" = "Číslo PR (GitHub) nebo `iid` MR (GitLab)"
"hosting checkout-pr --remote" = "Remote, na kterém požadavek žije. Výchozí je ten, ze kterého se projekt vyhodnotil, jinak výchozí remote repozitáře"
"hosting clone" = "Naklonuje projekt z `projects` podle jeho úplné cesty; URL pro klonování zjistí přes hostitele, takže ji uživatel nemusí vkládat"
"hosting clone --https" = "Klonuje přes HTTPS místo SSH"
"hosting clone --project" = "Úplná cesta projektu, jak ji vypisuje `hosting projects`"
"hosting edit-url" = "Vypíše URL, na které se upravuje pull/merge request (zobrazení `.../edit` na GitLabu; GitHub upravuje na místě na stránce požadavku). S číslem ten požadavek; jinak ten pro `--branch` (výchozí: přepnutá větev). Řídí se propojením repozitáře s pull/merge requesty jako `prs`. Prohlížeč spouští jen s `--open`"
"hosting edit-url --branch" = "Najde požadavek podle jeho zdrojové větve"
"hosting edit-url --number" = "Číslo požadavku (`53` pro `!53` / `#53`)"
"hosting edit-url --open" = "URL také otevře v systémovém prohlížeči"
"hosting file" = "Přečte jeden soubor projektu v dané revizi přes API hostitele, bez klonu: text tak, jak je, jiné bajty jako base64 (`encoding`). Skončí kódem 1 a chybou, pokud soubor v dané revizi neexistuje"
"hosting file --id" = "Která integrace (viz `hosting list`); volitelné, je-li nakonfigurovaná jen jedna"
"hosting file --path" = "Cesta uvnitř projektu, např. `CLAUDE.md` nebo `src/main.rs`"
"hosting file --project" = "Projekt: `owner/name` na GitHubu, `group/sub/project` na GitLabu"
"hosting file --rev" = "Revize: větev, tag nebo commit. Výchozí je výchozí větev projektu"
"hosting integrations" = "Spravuje nakonfigurované profily integrací (`[[integrations]]`)"
"hosting integrations add" = "Přidá profil libovolného druhu, pro který existuje klient"
"hosting integrations add --id" = "Výchozí je název druhu (`gitlab`, `gitlab-2`, ...)"
"hosting integrations add --kind" = "`github`, `github_enterprise`, `gitlab`, `gitlab_self_managed`, `azure_devops`, `azure_devops_server`, `bitbucket`, `jira_cloud`, `jira_data_center`, `trello`, `gitea`, `forgejo`, `linear`, `youtrack`, `redmine`, `gerrit` nebo `local_markdown`"
"hosting integrations add --name" = "Zobrazovaný název"
"hosting integrations add --url" = "Webový kořen instance. Povinný pro druhy se vlastním hostingem a pro Jiru"
"hosting integrations list" = "Nakonfigurované profily, bez jejich tokenů"
"hosting integrations radar" = "Zobrazí nebo změní nastavení Radaru profilu (`[integrations.radar]`): které seznamy za celý účet načítají `hosting radar` a Radar, jmenné prostory k prohledání a co udělá kontrola žádosti, která není naklonovaná. Bez voleb jen vypíše aktuální nastavení"
"hosting integrations radar --assigned_issues" = "Otevřené issues přiřazené vám, ve všech repozitářích"
"hosting integrations radar --clear_namespaces" = "Zapomenout uložené jmenné prostory: vlastní plus všechna členství"
