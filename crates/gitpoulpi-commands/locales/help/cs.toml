"treat --file" = "`.gitattributes` relativní k repozitáři, do kterého zapsat, nebo `.git/info/attributes` (výchozí: `.gitattributes` v kořeni)"
convert = "Přepíše kódování, konce řádků nebo odsazení souborů v pracovním adresáři funkcemi editoru TUI a jeho nabídky Převést. Právě jedna z voleb `--encoding`, `--eol` a `--indent`. Binární soubory, chybějící soubory a soubory, které cílové kódování nedokáže vyjádřit, se přeskočí a ohlásí, nikdy se nepoškodí. Jeden záznam žurnálu pro celou dávku: `gitpoulpi undo` vrátí všechny soubory"
