"rewrite scan-secrets" = "Prohledá historii kvůli tajným hodnotám: známé předpony tokenů (GitHub, GitLab, Slack, AWS, Stripe, npm, Google, OpenAI, Anthropic), bloky soukromých klíčů, JWT, hesla v URL a řádky `password = hodnota`, které vypadají náhodně. U každého nálezu vypíše pravidlo, soubor, první a poslední commit, počty a ZAKRYTÝ náhled (`ghp_****abcd`); hodnota se nikdy nevypíše, nezaloguje ani neuloží. Není vyčerpávající. Tajná hodnota, která už byla odeslána, je prozrazená: nejdřív ji zrušte a vydejte novou. Jen čte"
