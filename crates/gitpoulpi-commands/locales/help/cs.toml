"rewrite preview --script_language" = "Jazyk každého `--script`: `lua` (vestavěné, v izolaci), `shell`, `python` nebo `lua-external`. Výchozí: podle přípony souboru (`.lua`; `.sh`, `.bash`, `.ps1`; `.py`), jinak `lua`. Python a externí Lua se musí zapnout v `rewrite.external_scripts`"
"rewrite preview --trust" = "Důvěřuje externím skriptům (shell, Python, externí Lua) této sady podle jejich obsahu: zapamatuje se pro tento repozitář a při změně skriptu se zeptá znovu. Rozhoduje člověk: server MCP to odmítne a agent smí spouštět jen skripty, kterým člověk důvěřuje"
"rewrite run --script_language" = "Jazyk každého `--script`: `lua` (vestavěné, v izolaci), `shell`, `python` nebo `lua-external`. Výchozí: podle přípony souboru (`.lua`; `.sh`, `.bash`, `.ps1`; `.py`), jinak `lua`. Python a externí Lua se musí zapnout v `rewrite.external_scripts`"
