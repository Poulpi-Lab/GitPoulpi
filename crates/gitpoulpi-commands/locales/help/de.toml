"hosting review submit" = "Sendet ein Review ab: alle `--comment` und die Beurteilung in einem Zug. `request-changes` bietet GitLab nicht an (es hat keinen solchen Review-Status: dort wird es abgelehnt, ohne dass etwas gesendet wird)"
