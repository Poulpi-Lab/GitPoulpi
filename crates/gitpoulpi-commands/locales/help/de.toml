"flow promote --continue_" = "Setzt nach gelöstem Konflikt fort: committet den Merge oder setzt den Rebase fort und führt dann die restlichen Schritte aus. Nach einem fehlgeschlagenen Hook wird dieser Schritt erneut ausgeführt"
"flow promote --dry_run" = "Gibt den Plan (jeden Schritt, Blocker, Warnungen) als JSON aus und ändert nichts"
"flow promote --no_hooks" = "Überspringt die konfigurierten Hooks ohne Nachfrage"
"flow promote --run_hooks" = "Führt die Hooks aus, die der Workflow für diese Aktion konfiguriert (Shell-Befehle aus der Workflow-Datei, mit ihrer Ausgabe angezeigt). Läuft nie ungefragt; ohne diese Angabe fragt ein Terminal nach"
"flow promote --yes" = "Führt den Plan ohne Nachfrage aus. Ohne diese Option fragt ein Terminal nach, alles andere gibt den Plan aus und endet mit Exit-Code 3"
"flow set-parent" = "Hält fest, von welchem Branch ein Branch ausging und in welchen er abgeschlossen wird (`branch.<name>.gitpoulpi-parent`), oder vergisst es mit `--clear`. Rückgängig zu machen"
"flow set-parent --autostash" = "Stasht lokale Änderungen, die einen Checkout oder Merge blockieren, und spielt sie danach zurück, unabhängig von `general.auto_stash`"
"flow set-parent --branch" = "Der Branch"
"flow set-parent --clear" = "Vergisst den festgehaltenen Eltern-Branch"
"flow set-parent --dry_run" = "Gibt den Plan (jeden Schritt, Blocker, Warnungen) als JSON aus und ändert nichts"
"flow set-parent --no_hooks" = "Überspringt die konfigurierten Hooks ohne Nachfrage"
"flow set-parent --parent" = "Sein Eltern-Branch (ein vorhandener lokaler Branch)"
"flow set-parent --run_hooks" = "Führt die Hooks aus, die der Workflow für diese Aktion konfiguriert (Shell-Befehle aus der Workflow-Datei, mit ihrer Ausgabe angezeigt). Läuft nie ungefragt; ohne diese Angabe fragt ein Terminal nach"
"flow set-parent --yes" = "Führt den Plan ohne Nachfrage aus. Ohne diese Option fragt ein Terminal nach, alles andere gibt den Plan aus und endet mit Exit-Code 3"
"flow start" = "Startet einen Topic-Branch eines Workflow-Typs: benennt ihn nach dem Muster des Typs (`feature/{slug}`, `release/{version}`, ...), erstellt ihn aus dem Eltern-Branch des Typs (oder `--from`), checkt ihn aus und hält den Eltern-Branch fest. Gibt die Schritte aus, die es ausführen wird; es führt sie nur mit `--yes` aus (oder nach der interaktiven Frage in einem Terminal). Mit Rückgängig wird alles zurückgenommen"
"flow start --autostash" = "Stasht lokale Änderungen, die einen Checkout oder Merge blockieren, und spielt sie danach zurück, unabhängig von `general.auto_stash`"
"flow start --dry_run" = "Gibt den Plan (jeden Schritt, Blocker, Warnungen) als JSON aus und ändert nichts"
"flow start --fields" = "Werte für die Token des Musters als `name=wert` (`slug=login`, `version=1.2.0`, `issue=42`); ein einzelnes Wort ist der `slug`. `user` und `date` sind standardmäßig Sie und heute"
"flow start --from" = "Startet von diesem Branch, Remote-Branch oder Tag statt vom Eltern-Branch des Typs"
"flow start --no_hooks" = "Überspringt die konfigurierten Hooks ohne Nachfrage"
"flow start --publish" = "Pusht den neuen Branch und setzt seinen Upstream"
"flow start --run_hooks" = "Führt die Hooks aus, die der Workflow für diese Aktion konfiguriert (Shell-Befehle aus der Workflow-Datei, mit ihrer Ausgabe angezeigt). Läuft nie ungefragt; ohne diese Angabe fragt ein Terminal nach"
"flow start --type" = "Der Branch-Typ (`feature`, `hotfix`, `release`, ...): siehe `flow config --show-effective`"
"flow start --yes" = "Führt den Plan ohne Nachfrage aus. Ohne diese Option fragt ein Terminal nach, alles andere gibt den Plan aus und endet mit Exit-Code 3"
"flow status" = "Jeder Branch des Repositorys, nach seinem Branching-Workflow eingeordnet: Basis oder Topic (mit seinem Typ), Eltern-Branch und wie viele Commits er vor und hinter diesem Eltern-Branch liegt. Ohne Workflow-Datei ist jeder Branch nicht eingeordnet; `flow detect` schlägt einen vor"
"flow sync" = "Bringt einen Branch auf den Stand seines Eltern-Branches (Merge oder Rebase, nach der konfigurierten Strategie des Branches) und mit `--stack` die darauf aufbauenden Branches, der Reihe nach. Gibt den Plan aus und braucht `--yes`; ohne es Exit-Code 3"
"flow sync --abort" = "Gibt die angehaltene Aktion auf: bricht den laufenden Merge oder Rebase ab und kehrt zum Branch zurück, auf dem sie begann. Bereits abgeschlossene Schritte bleiben (mit `undo` zurücknehmen)"
"flow sync --autostash" = "Stasht lokale Änderungen, die einen Checkout oder Merge blockieren, und spielt sie danach zurück, unabhängig von `general.auto_stash`"
"flow sync --branch" = "Der zu aktualisierende Branch. Standard: der ausgecheckte"
"flow sync --continue_" = "Setzt nach gelöstem Konflikt fort: committet den Merge oder setzt den Rebase fort und führt dann die restlichen Schritte aus. Nach einem fehlgeschlagenen Hook wird dieser Schritt erneut ausgeführt"
"flow sync --dry_run" = "Gibt den Plan (jeden Schritt, Blocker, Warnungen) als JSON aus und ändert nichts"
"flow sync --merge" = "Mergen statt rebasen"
"flow sync --no_hooks" = "Überspringt die konfigurierten Hooks ohne Nachfrage"
"flow sync --rebase" = "Rebasen statt mergen"
"flow sync --run_hooks" = "Führt die Hooks aus, die der Workflow für diese Aktion konfiguriert (Shell-Befehle aus der Workflow-Datei, mit ihrer Ausgabe angezeigt). Läuft nie ungefragt; ohne diese Angabe fragt ein Terminal nach"
"flow sync --stack" = "Aktualisiert auch die Branches, deren Eltern-Branch dieser ist, rekursiv"
"flow sync --yes" = "Führt den Plan ohne Nachfrage aus. Ohne diese Option fragt ein Terminal nach, alles andere gibt den Plan aus und endet mit Exit-Code 3"
"flow templates" = "Die eingebauten Workflow-Vorlagen (Git Flow, GitHub Flow, GitLab Flow, Trunk-based, Custom) mit ihren Basis-Branches und Topic-Typen"
"flow trust-hooks" = "Prüft und vertraut den Workflow-Hooks, die das Repository eincommittet (die `[hooks]` der `.gitpoulpi/workflow.toml`): Shell-Befehle, die auf deinem Rechner laufen würden. Ohne `--hash` gibt es nur `{hash, hooks, trusted}` aus; mit dem Hash merkt es sich das Vertrauen, aber nur, wenn die Datei auf der Platte noch genau diesen Hash hat, sodass das Gelesene dem Vertrauten entspricht. Eine geänderte Datei fragt erneut. Hooks deiner eigenen Abweichung brauchen das nie. Das kann nur ein Mensch: Es gibt dafür kein MCP-Tool"
"flow trust-hooks --hash" = "Der Hash, den `flow trust-hooks` (oder ein abgelehntes `--run-hooks`) ausgibt: den Hooks mit diesem Hash vertrauen"
alias = "Der Befehlsalias (`gp` oder ein beliebiger Name), der GitPoulpi aus einem Terminal startet: das skriptbare Gegenstück zu Einstellungen > Starter"
"alias create" = "Legt `<name>` (zum Beispiel `gp`) an, damit es GitPoulpi startet: ein Link unter Linux und macOS, eine `.cmd`-Datei unter Windows, in einem bin-Ordner des Benutzers. Eine Datei, die nicht von GitPoulpi stammt, wird nie ersetzt. Den Ordner mit `path add` in den PATH aufnehmen"
"alias create --add" = "Legt die Variante zum Hinzufügen an (zum Beispiel `gpa`): sie führt `gitpoulpi --add` aus, das den aktuellen Ordner als neuen Tab im bereits laufenden GitPoulpi öffnet"
"alias create --name" = "Der Befehlsname: nur Buchstaben, Ziffern, `-`, `_` und `.`"
"alias remove" = "Entfernt die von GitPoulpi angelegten Befehlsaliase (alle oder nur `<name>`); eine Datei, die nicht von GitPoulpi stammt, bleibt unberührt"
"alias remove --name" = "Der zu entfernende Alias (Standard: alle von GitPoulpi angelegten Aliase)"
"alias status" = "Zeigt die von GitPoulpi angelegten Befehlsaliase (und was jeder ausführt) und die Namen in `ui.command_alias` und `ui.command_alias_add`"
path = "Nimmt GitPoulpi in den PATH des Benutzers auf, für neue Terminals"
"path add" = "Nimmt den Ordner, in dem GitPoulpi liegt, und den Alias-Ordner für neue Terminals in den PATH des Benutzers auf: ein markierter Block in den Shell-Startdateien (Linux, macOS) oder der Benutzer-PATH in der Registry (Windows). Ordner, die schon im PATH stehen, bleiben unberührt"
"path remove" = "Entfernt genau das, was `path add` eingetragen hat"
"path status" = "Zeigt, ob der Ordner, in dem GitPoulpi liegt, und der Alias-Ordner im PATH des Benutzers stehen und was GitPoulpi hinzugefügt hat"
uninstall = "Entfernt, was das Installationsprogramm und die Einstellungen angelegt haben (Befehlsaliase, PATH-Einträge, Verknüpfungen) und bei einer Release-Installation die Programmdateien. Weigert sich bei einem Build, der keine Release-Installation ist (kein `.gitpoulpi-dist`-Marker neben der Exe). Ihre Konfiguration, Sitzungen und Repositorys bleiben unberührt"
"uninstall --keep_files" = "Lässt die Programmdateien an Ort und Stelle (das Windows-Deinstallationsprogramm löscht sie selbst, weil eine laufende Exe sich nicht löschen kann)"
launch = "Was die GitPoulpi-Verknüpfungen ausführen: zeigt das Fenster eines bereits geöffneten GitPoulpi (`ui.reuse_window`), sonst startet es COMMAND (das Terminal, in dem GitPoulpi läuft). Startet nichts und keinen Daemon, wenn sich ein Fenster zeigen lässt"
"launch --command" = "Der Befehl, der gestartet wird, wenn es kein Fenster zu zeigen gibt, nach `--`"
"launch --folder" = "Öffnet diesen Ordner: Ist `ui.reuse_window` an und ein Fenster offen, wird das Repository, das ihn enthält, zu einem Tab des zuletzt fokussierten Fensters (ohne Rückfrage); sonst startet GitPoulpi im gewählten Terminal in diesem Ordner. Das führt der Eintrag „In GitPoulpi öffnen“ des Dateimanagers aus"
"launch --new_window" = "Öffnet auch dann ein neues Fenster, wenn schon eines offen ist"
"ai split-plan" = "Gibt einen Plan aus, den die KI vorschlägt, um einen Commit in mehrere Commits aufzuteilen, im JSON-Format, das `split-commit --plan` akzeptiert. Wendet nichts an: erst prüfen, dann an `split-commit` übergeben. Erfordert `ai.enabled = true`"
"ai split-plan --rev" = "Der aufzuteilende Commit (beliebige Revision: ein SHA, `HEAD~2`, ...)"
"ai rewrite-script" = "Gibt ein Lua-Skript aus, das die KI aus Ihrer Anweisung für ein Umschreiben des Verlaufs schreibt („jeden nachts erstellten Commit auf den nächsten Morgen verschieben“), samt dem Ergebnis von `rewrite script check` dafür. Führt nichts aus und ändert nichts: das Skript lesen, dann `rewrite script test` und `rewrite preview --script`. Gesendet werden nur Ihre Anweisung und mit `--sample N` Autor, Datum und Betreff von N Commits (nie Dateiinhalte). Erfordert `ai.enabled = true`"
"ai rewrite-script --instruction" = "Was das Skript tun soll, in eigenen Worten"
"ai rewrite-script --sample" = "Sendet zusätzlich Autor, Datum und Betreff der neuesten N Commits (höchstens 50), damit das Modell sieht, wie die Daten aussehen. Standardmäßig aus: Ohne diese Option verlassen keine Commit-Daten den Rechner"
"ai rewrite-rules" = "Gibt die Regeln und Einstellungen aus, die die KI für ein Umschreiben des Verlaufs aus Ihrer Beschreibung vorschlägt („meine alte E-Mail a@b in allen Commits durch c@d ersetzen“, „secrets.txt aus dem gesamten Verlauf entfernen“), als JSON-Rezept, das `rewrite preview --recipe-json` liest (das Feld `recipe` für `--recipe` in einer Datei speichern), samt dem, was sie ausgelassen hat, und warum. Zeigt nichts in der Vorschau und wendet nichts an: die Regeln lesen, dann `rewrite preview` und `rewrite apply` selbst ausführen. Sendet nur Ihre Beschreibung und mit `--context` den aktuellen Branch, die Namen der Branches und Tags und die Autoren der neuesten 200 Commits (nie Dateiinhalte). Erfordert `ai.enabled = true`"
"ai rewrite-rules --description" = "Wie der Verlauf umgeschrieben werden soll, in Ihren eigenen Worten"
"ai rewrite-rules --context" = "Sendet zusätzlich die Namen der Branches und Tags und die Autoren der neuesten 200 Commits (höchstens 100 Branch- und Tag-Namen und 100 Autoren), damit das Modell sie genau benennen kann. Standardmäßig aus: Ohne diese Option verlässt nur Ihre Beschreibung den Rechner"
"split-commit" = "Teilt einen Commit des aktuellen Branches nach einem JSON-Plan in mehrere auf, älteste zuerst (Nummerierung siehe `split-source`). Der letzte neue Commit behält den ursprünglichen Baum, daher bleiben Nachfolger und Arbeitsverzeichnis unverändert; ein bereits gepushter Commit braucht danach einen Force-Push. Ein `undo` stellt alles wieder her. Exit-Code 2 bei Ablehnung"
"split-commit --commit" = "Der aufzuteilende Commit (beliebige Revision: ein SHA, `HEAD~2`, ...)"
"split-commit --dry_run" = "Prüft den Plan und listet auf, was nicht zugeordnet ist; ändert nichts"
"split-commit --plan" = "Der Plan (JSON), aus einem Dateipfad oder `-` für stdin. Ein Stück ist `path` plus optional `hunk` plus optional `lines` (Indizes in den `lines` des Hunks); ein Stück nur mit `path` ist die ganze Datei"
"split-commit --rest_message" = "Packt alles, was der Plan nicht zuordnet, in einen letzten Commit mit dieser Nachricht"
"split-commit --sign" = "Signiert die neuen Commits (und die erneut aufgespielten Nachfolger)"
"split-source" = "Die Änderungen eines Commits, nummeriert für `split-commit`: jede Datei mit ihren Hunks (`id`, Zeilen) oder, bei Dateien, die nur als Ganzes zugeordnet werden können (binär, nur Modus, hinzugefügt, gelöscht, Submodul, LFS), der Grund. Nur lesend"
"split-source --commit" = "Der Commit (beliebige Revision: ein SHA, `HEAD~2`, ...)"
"rewrite" = "Verlauf anhand eines Rezepts im Ganzen umschreiben (Identitäten, Datum, Nachrichten): `preview` plant es, ohne etwas zu ändern, `apply` führt den geprüften Plan als EINEN Undo-Eintrag aus, `run` macht beides für Skripte. Nur `push` sendet etwas: Es pusht die umgeschriebenen Refs per Force, jede mit einem Lease"
"rewrite apply" = "Wendet einen geprüften Lauf an: verschiebt die Refs als EINEN Undo-Eintrag (`gitpoulpi undo` stellt alles wieder her). Pusht nie. Exit-Code 2 bei Ablehnung (das Repository hat sich seit der Vorschau geändert, falscher Digest, ...), 3 wenn der Plan Refs verschiebt, die auf einem Remote liegen, und `--yes` fehlt"
"rewrite apply --digest" = "Der Digest, den `rewrite preview` ausgegeben hat: der Plan, den Sie geprüft haben"
"rewrite apply --run" = "Die Run-ID, die `rewrite preview` ausgegeben hat"
"rewrite apply --yes" = "Bestätigt das Verschieben von Refs, die bereits gepusht sind. Ohne das ändert so ein Plan nichts und der Exit-Code ist 3"
"rewrite diff" = "Was eine Inhaltsregel an einer Datei eines Commits eines geprüften Laufs getan hat: die alte und die neue Datei als Diff. Zeilen, die eine Geheimnisregel entfernt, bleiben verborgen. Nur lesend"
"rewrite diff --commit" = "Der Commit vor dem Umschreiben (eine ID aus den Zeilen)"
"rewrite diff --path" = "Die Datei, relativ zum Repository-Stammverzeichnis"
"rewrite diff --run" = "Die Run-ID, die `rewrite preview` ausgegeben hat"
"rewrite discard" = "Verwirft einen geprüften Lauf, ohne ihn anzuwenden. Zweimal verwerfen ist unproblematisch"
"rewrite discard --run" = "Die Run-ID, die `rewrite preview` ausgegeben hat"
"rewrite preview" = "Plant ein Umschreiben des Verlaufs, ohne etwas zu ändern: Zähler, die Refs, die sich bewegen würden, Warnungen und die ersten Zeilen. Der Plan bleibt im Daemon als Lauf (`run`, `digest`) für `rewrite rows` und `rewrite apply`. Die Vorschau liegt außerdem auf der Platte im Git-Verzeichnis des Repositorys, sodass `rewrite apply` auch bei einem späteren Befehl, nach einem Daemon-Neustart oder von einem anderen Frontend funktioniert, ohne einen Daemon zu starten; nur `rewrite rows` braucht den Daemon, der die Vorschau erstellt hat (einen laufenden, oder `--all` bei der Vorschau). Exit-Code 2, wenn das Rezept abgelehnt wird"
"rewrite preview --all" = "Gibt jeden geänderten Commit aus"
"rewrite preview --all_local" = "Schreibt jeden lokalen Branch und Tag um statt nur den aktuellen Branch"
"rewrite preview --committer" = "Committer der umgeschriebenen Commits: `keep` (Standard) oder `me-now`"
"rewrite preview --include_protected" = "Schreibt auch diese geschützten Branches um, die bereits gepusht sind (standardmäßig ausgeschlossen; wiederholbar)"
"rewrite preview --lfs_export" = "LFS-Regel: die LFS-Zeiger, die zu diesem Glob passen, in jedem Commit wieder in die echten Dateien umwandeln (wiederholbar). Die Objekte müssen im lokalen LFS-Speicher liegen (zuerst `lfs fetch`); sonst wird mit der Liste abgelehnt"
"rewrite preview --encoding_exclude" = "Mit `--reencode`: Dateien, die es in Ruhe lässt (Globs, wiederholbar)"
"rewrite preview --encoding_fallback" = "Mit `--reencode`: als was eine Datei gelesen wird, die weder markiert noch UTF-8 ist, wenn die Quelle erkannt wird (Standard `windows-1252`)"
"rewrite preview --encoding_paths" = "Mit `--reencode`: die Dateien, die es umwandelt (Globs, wiederholbar)"
"rewrite preview --eol" = "Zeilenenden-Regel: Jede Textdatei, die zu `--eol-paths` passt, erhält dieses Zeilenende (`lf` für Linux und macOS, `crlf` für Windows, `cr` für klassische Macs); gemischte Zeilenenden werden vereinheitlicht, Binärdateien übersprungen"
"rewrite preview --eol_exclude" = "Mit `--eol`: Dateien, die es in Ruhe lässt (Globs, wiederholbar)"
"rewrite preview --eol_follow_attributes" = "Mit `--eol`: die `.gitattributes` an der Wurzel jedes Commits lesen: `-text`- und `binary`-Dateien werden übersprungen, `eol=lf`- und `eol=crlf`-Dateien behalten ihr eigenes Zeilenende"
"rewrite preview --eol_paths" = "Mit `--eol`: die Dateien, die es umwandelt (Globs, wiederholbar; ein Muster ohne Schrägstrich passt in jeder Tiefe)"
"rewrite preview --reencode" = "Kodierungsregel: Die Textdateien, die zu `--encoding-paths` passen, werden in diese Kodierung umgewandelt (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). Binärdateien, Dateien, die die Quellkodierung nicht lesen kann, und Zeichen, die das Ziel nicht darstellen kann, bleiben unverändert und werden gezählt"
"rewrite preview --reencode_from" = "Mit `--reencode`: die Kodierung, in der die Dateien vorliegen. Weggelassen: pro Datei erkannt (Byte-Order-Mark, gültiges UTF-8, sonst `--encoding-fallback`)"
"rewrite preview --strip_exec" = "Dateimodus-Regel: Das Ausführbar-Bit (100755 wird zu 100644) entfällt bei den Dateien, die zu diesen Globs passen (wiederholbar). Der Inhalt bleibt unberührt"
"rewrite preview --strip_exec_exclude" = "Mit `--strip-exec`: Dateien, die ihr Ausführbar-Bit behalten (Globs)"
"rewrite preview --lfs_import" = "LFS-Regel: die Dateien, die zu diesem Glob passen, in jedem Commit nach Git LFS verschieben (wiederholbar; im Stil von `.gitattributes`: ohne Schrägstrich passt es in jeder Tiefe). Benötigt git-lfs. Der Inhalt kommt in den lokalen LFS-Speicher, und `.gitattributes` erhält die Zeile `filter=lfs`; die Objekte danach pushen"
"rewrite preview --lfs_min_size" = "Mit `--lfs-import`: nur Dateien ab dieser Anzahl Bytes werden verschoben"
"rewrite preview --limit" = "Wie viele geänderte Commits ausgegeben werden (Standard 50)"
"rewrite preview --match_email" = "Identitätsregel: auf diese Autor-/Committer-E-Mail passen"
"rewrite preview --match_name" = "Identitätsregel: auf diesen Autor-/Committer-Namen passen"
"rewrite preview --prune_empty" = "Commits, die eine Inhaltsregel leer lässt: `auto` verwirft sie (Standard), `never` behält sie"
"rewrite preview --recipe" = "Eine Rezeptdatei (TOML oder JSON, das Format der TUI-Werkbank) oder `-` für JSON über stdin"
"rewrite preview --recipe_json" = "Ein Rezept als JSON-String (für Aufrufer, die keine Datei schreiben können)"
"rewrite preview --refs" = "Schreibt nur diese lokalen Branches oder Tags um (wiederholbar)"
"rewrite preview --remove_blobs_over" = "Inhaltsregel: entfernt jede Datei, die größer als so viele Bytes ist, aus jedem Commit"
"rewrite preview --remove_findings" = "Inhaltsregel: entfernt ein Geheimnis, das `rewrite scan-secrets` gefunden hat, anhand seiner Treffer-ID (wiederholbar), oder `all` für jeden Treffer im Bereich. Der Daemon sucht erneut und löst die IDs selbst auf: Der Wert gelangt nie in die Befehlszeile, in ein Rezept oder in ein Log"
"rewrite preview --remove_paths" = "Inhaltsregel: entfernt Dateien und Ordner, die auf dieses Glob passen, aus jedem Commit (wiederholbar; ein Muster ohne Schrägstrich passt in jeder Tiefe)"
"rewrite preview --replace_content" = "Inhaltsregel `FIND=WITH`: ersetzt wörtlichen Text in jeder Textdatei (wiederholbar; Binärdateien werden übersprungen und mitgezählt). Für Geheimnisse eine `content_replace`-Regel im Rezept mit `--secrets-file` verwenden"
"rewrite preview --replace_message" = "Nachrichtenregel `FIND=WITH` (wörtlicher Text, wiederholbar)"
"rewrite preview --script_params" = "Ein Skriptparameter `NAME=VALUE`, den jedes `--script` erhält (wiederholbar). Die Namen sind die, die der Skript-Header deklariert"
"rewrite preview --scripts" = "Skriptregel: führt diese Skriptdatei auf jedem Commit aus (wiederholbar, der Reihe nach, nach den Regeln der übrigen Optionen). Die Datei wird hier gelesen und ins Rezept eingebettet; das Format steht unter `rewrite script check`. Eine `.lua`-Datei läuft im eingebauten Lua mit Sandbox; ein Shell-, Python- oder externes Lua-Skript hat keine Sandbox und braucht Vertrauen (`--trust` oder vorher `rewrite script trust FILE`)"
"rewrite preview --secrets_file" = "Eine Datei mit einem Geheimnis pro Zeile (Leerzeilen werden ignoriert). Die Geheimnisse kommen zu den `content_replace`-Regeln des Rezepts, die nach Geheimnissen suchen, und stehen so nie in der Befehlszeile, in einem gespeicherten Rezept oder in einem Log"
"rewrite preview --set_email" = "Identitätsregel: die zu setzende E-Mail"
"rewrite preview --set_name" = "Identitätsregel: der zu setzende Name (mit `--set-email`, mindestens eins von beiden)"
"rewrite preview --shift_dates" = "Datumsregel: verschiebt jedes Datum um so viele Sekunden (negativ: früher) und behält den Zeitzonenversatz jedes Commits"
"rewrite preview --signatures" = "Was mit den Signaturen umgeschriebener Commits geschieht: `strip`, `resign-signed` oder `resign-all`. Erforderlich, wenn sich signierte Commits ändern"
"rewrite preview --since" = "Beim aktuellen Branch: nur die Commits nach dieser Revision"
"rewrite preview --who" = "Identitätsregel: `author`, `committer` oder `both` (Standard)"
"rewrite rows" = "Blättert durch die Commits eines geprüften Laufs"
"rewrite rows --filter" = "`changed` (Standard), `dropped`, `pushed` oder `all`"
"rewrite rows --limit" = "Zeilen pro Seite (höchstens 200)"
"rewrite rows --offset" = "Zu überspringende Zeilen"
"rewrite rows --run" = "Die Run-ID, die `rewrite preview` ausgegeben hat"
"rewrite run" = "Vorschau und Anwenden in einem Aufruf, für Skripte. Dieselben Ablehnungen und Exit-Codes wie bei `preview` und `apply`; bei Exit-Code 3 wird die Vorschau verworfen und nichts geändert"
"rewrite run --all_local" = "Schreibt jeden lokalen Branch und Tag um statt nur den aktuellen Branch"
"rewrite run --committer" = "Committer der umgeschriebenen Commits: `keep` (Standard) oder `me-now`"
"rewrite run --include_protected" = "Schreibt auch diese geschützten Branches um, die bereits gepusht sind (standardmäßig ausgeschlossen; wiederholbar)"
"rewrite run --lfs_export" = "LFS-Regel: die LFS-Zeiger, die zu diesem Glob passen, in jedem Commit wieder in die echten Dateien umwandeln (wiederholbar). Die Objekte müssen im lokalen LFS-Speicher liegen (zuerst `lfs fetch`); sonst wird mit der Liste abgelehnt"
"rewrite run --encoding_exclude" = "Mit `--reencode`: Dateien, die es in Ruhe lässt (Globs, wiederholbar)"
"rewrite run --encoding_fallback" = "Mit `--reencode`: als was eine Datei gelesen wird, die weder markiert noch UTF-8 ist, wenn die Quelle erkannt wird (Standard `windows-1252`)"
"rewrite run --encoding_paths" = "Mit `--reencode`: die Dateien, die es umwandelt (Globs, wiederholbar)"
"rewrite run --eol" = "Zeilenenden-Regel: Jede Textdatei, die zu `--eol-paths` passt, erhält dieses Zeilenende (`lf` für Linux und macOS, `crlf` für Windows, `cr` für klassische Macs); gemischte Zeilenenden werden vereinheitlicht, Binärdateien übersprungen"
"rewrite run --eol_exclude" = "Mit `--eol`: Dateien, die es in Ruhe lässt (Globs, wiederholbar)"
"rewrite run --eol_follow_attributes" = "Mit `--eol`: die `.gitattributes` an der Wurzel jedes Commits lesen: `-text`- und `binary`-Dateien werden übersprungen, `eol=lf`- und `eol=crlf`-Dateien behalten ihr eigenes Zeilenende"
"rewrite run --eol_paths" = "Mit `--eol`: die Dateien, die es umwandelt (Globs, wiederholbar; ein Muster ohne Schrägstrich passt in jeder Tiefe)"
"rewrite run --reencode" = "Kodierungsregel: Die Textdateien, die zu `--encoding-paths` passen, werden in diese Kodierung umgewandelt (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). Binärdateien, Dateien, die die Quellkodierung nicht lesen kann, und Zeichen, die das Ziel nicht darstellen kann, bleiben unverändert und werden gezählt"
"rewrite run --reencode_from" = "Mit `--reencode`: die Kodierung, in der die Dateien vorliegen. Weggelassen: pro Datei erkannt (Byte-Order-Mark, gültiges UTF-8, sonst `--encoding-fallback`)"
"rewrite run --strip_exec" = "Dateimodus-Regel: Das Ausführbar-Bit (100755 wird zu 100644) entfällt bei den Dateien, die zu diesen Globs passen (wiederholbar). Der Inhalt bleibt unberührt"
"rewrite run --strip_exec_exclude" = "Mit `--strip-exec`: Dateien, die ihr Ausführbar-Bit behalten (Globs)"
"rewrite run --lfs_import" = "LFS-Regel: die Dateien, die zu diesem Glob passen, in jedem Commit nach Git LFS verschieben (wiederholbar; im Stil von `.gitattributes`: ohne Schrägstrich passt es in jeder Tiefe). Benötigt git-lfs. Der Inhalt kommt in den lokalen LFS-Speicher, und `.gitattributes` erhält die Zeile `filter=lfs`; die Objekte danach pushen"
"rewrite run --lfs_min_size" = "Mit `--lfs-import`: nur Dateien ab dieser Anzahl Bytes werden verschoben"
"rewrite run --match_email" = "Identitätsregel: auf diese Autor-/Committer-E-Mail passen"
"rewrite run --match_name" = "Identitätsregel: auf diesen Autor-/Committer-Namen passen"
"rewrite run --prune_empty" = "Commits, die eine Inhaltsregel leer lässt: `auto` verwirft sie (Standard), `never` behält sie"
"rewrite run --recipe" = "Eine Rezeptdatei (TOML oder JSON, das Format der TUI-Werkbank) oder `-` für JSON über stdin"
"rewrite run --recipe_json" = "Ein Rezept als JSON-String (für Aufrufer, die keine Datei schreiben können)"
"rewrite run --refs" = "Schreibt nur diese lokalen Branches oder Tags um (wiederholbar)"
"rewrite run --remove_blobs_over" = "Inhaltsregel: entfernt jede Datei, die größer als so viele Bytes ist, aus jedem Commit"
"rewrite run --remove_findings" = "Inhaltsregel: entfernt ein Geheimnis, das `rewrite scan-secrets` gefunden hat, anhand seiner Treffer-ID (wiederholbar), oder `all` für jeden Treffer im Bereich. Der Daemon sucht erneut und löst die IDs selbst auf: Der Wert gelangt nie in die Befehlszeile, in ein Rezept oder in ein Log"
"rewrite run --remove_paths" = "Inhaltsregel: entfernt Dateien und Ordner, die auf dieses Glob passen, aus jedem Commit (wiederholbar; ein Muster ohne Schrägstrich passt in jeder Tiefe)"
"rewrite run --replace_content" = "Inhaltsregel `FIND=WITH`: ersetzt wörtlichen Text in jeder Textdatei (wiederholbar; Binärdateien werden übersprungen und mitgezählt). Für Geheimnisse eine `content_replace`-Regel im Rezept mit `--secrets-file` verwenden"
"rewrite run --replace_message" = "Nachrichtenregel `FIND=WITH` (wörtlicher Text, wiederholbar)"
"rewrite run --script_params" = "Ein Skriptparameter `NAME=VALUE`, den jedes `--script` erhält (wiederholbar). Die Namen sind die, die der Skript-Header deklariert"
"rewrite run --scripts" = "Skriptregel: führt diese Skriptdatei auf jedem Commit aus (wiederholbar, der Reihe nach, nach den Regeln der übrigen Optionen). Die Datei wird hier gelesen und ins Rezept eingebettet; das Format steht unter `rewrite script check`. Eine `.lua`-Datei läuft im eingebauten Lua mit Sandbox; ein Shell-, Python- oder externes Lua-Skript hat keine Sandbox und braucht Vertrauen (`--trust` oder vorher `rewrite script trust FILE`)"
"rewrite run --secrets_file" = "Eine Datei mit einem Geheimnis pro Zeile (Leerzeilen werden ignoriert). Die Geheimnisse kommen zu den `content_replace`-Regeln des Rezepts, die nach Geheimnissen suchen, und stehen so nie in der Befehlszeile, in einem gespeicherten Rezept oder in einem Log"
"rewrite run --set_email" = "Identitätsregel: die zu setzende E-Mail"
"rewrite run --set_name" = "Identitätsregel: der zu setzende Name (mit `--set-email`, mindestens eins von beiden)"
"rewrite run --shift_dates" = "Datumsregel: verschiebt jedes Datum um so viele Sekunden (negativ: früher) und behält den Zeitzonenversatz jedes Commits"
"rewrite run --signatures" = "Was mit den Signaturen umgeschriebener Commits geschieht: `strip`, `resign-signed` oder `resign-all`. Erforderlich, wenn sich signierte Commits ändern"
"rewrite run --since" = "Beim aktuellen Branch: nur die Commits nach dieser Revision"
"rewrite run --who" = "Identitätsregel: `author`, `committer` oder `both` (Standard)"
"rewrite run --yes" = "Bestätigt das Verschieben von Refs, die bereits gepusht sind"
"rewrite scan-secrets" = "Durchsucht den Verlauf nach Geheimnissen: bekannte Token-Präfixe (GitHub, GitLab, Slack, AWS, Stripe, npm, Google, OpenAI, Anthropic), private Schlüsselblöcke, JWTs, Passwörter in URLs und Zeilen der Art `password = value`, die zufällig aussehen. Gibt pro Treffer die Regel, die Datei, den ersten und letzten Commit, Zähler und eine GESCHWÄRZTE Vorschau aus (`ghp_****abcd`); der Wert wird nie ausgegeben, geloggt oder gespeichert. Nicht vollständig. Ein gepushtes Geheimnis gilt als offengelegt: zuerst rotieren. Nur lesend"
"rewrite scan-secrets --all_local" = "Durchsucht jeden lokalen Branch und Tag statt des aktuellen Branches"
"rewrite scan-secrets --refs" = "Durchsucht nur diese lokalen Branches oder Tags (wiederholbar)"
"rewrite scan-secrets --since" = "Beim aktuellen Branch: nur die Commits nach dieser Revision"
"rewrite script" = "Eingebettete Lua-Skripte für das Umschreiben des Verlaufs: eines prüfen oder an ein paar Commits ausprobieren. Echt ausführen mit `rewrite preview --script FILE`"
"rewrite script check" = "Kompiliert ein Lua-Skript und gibt seinen Header (Name, Zeitfenster, Parameter), die definierten Funktionen und jedes Problem aus. Exit-Code 2, wenn es Probleme gibt. Nur lesend; auf keinem Commit läuft etwas"
"rewrite script check --file" = "Die Skriptdatei"
"rewrite script check --params" = "Ein Parameter `NAME=VALUE` (wiederholbar), gegen den Header geprüft"
"rewrite script test" = "Führt ein Skript auf einigen Commits aus und gibt aus, was es ändern würde und was es geloggt hat, in Verlaufsreihenfolge und mit dem Zustand, der von Commit zu Commit weitergegeben wird. Nur lesend: nichts wird geschrieben. Exit-Code 2, wenn das Skript fehlschlägt (die Antwort nennt Commit und Grund)"
"rewrite script test --commits" = "Ein Commit, auf dem es laufen soll (wiederholbar; eine Revision oder eine ID)"
"rewrite script test --file" = "Die Skriptdatei"
"rewrite script test --params" = "Ein Parameter `NAME=VALUE` (wiederholbar)"
"rewrite preview --script_language" = "Die Sprache jedes `--script`: `lua` (eingebaut, mit Sandbox), `shell`, `python` oder `lua-external`. Standard: nach der Dateiendung (`.lua`; `.sh`, `.bash`, `.ps1`; `.py`), sonst `lua`. Python und externes Lua müssen in `rewrite.external_scripts` eingeschaltet sein"
"rewrite preview --trust" = "Den externen Skripten (Shell, Python, externes Lua) dieses Rezepts anhand ihres Inhalts vertrauen: Es wird für dieses Repository gemerkt, und bei einer Änderung des Skripts wird erneut gefragt. Eine Entscheidung für Menschen: Der MCP-Server lehnt sie ab, und ein Agent kann nur Skripte ausführen, denen ein Mensch vertraut hat"
"rewrite run --script_language" = "Die Sprache jedes `--script`: `lua` (eingebaut, mit Sandbox), `shell`, `python` oder `lua-external`. Standard: nach der Dateiendung (`.lua`; `.sh`, `.bash`, `.ps1`; `.py`), sonst `lua`. Python und externes Lua müssen in `rewrite.external_scripts` eingeschaltet sein"
"rewrite run --trust" = "Den externen Skripten (Shell, Python, externes Lua) dieses Rezepts anhand ihres Inhalts vertrauen: Es wird für dieses Repository gemerkt, und bei einer Änderung des Skripts wird erneut gefragt. Eine Entscheidung für Menschen: Der MCP-Server lehnt sie ab, und ein Agent kann nur Skripte ausführen, denen ein Mensch vertraut hat"
"rewrite script check --language" = "`lua`, `shell`, `python` oder `lua-external`; Standard nach der Endung"
"rewrite script check --trust" = "Diesem Skript zuerst vertrauen (eine Entscheidung für Menschen, über MCP abgelehnt)"
"rewrite script check#long" = """
Kompiliert ein Lua-Skript und gibt seinen Header (Name, Zeitfenster, Parameter), die definierten Funktionen und jedes Problem aus. Exit-Code 2, wenn es Probleme gibt. Nur lesend; auf keinem Commit läuft etwas.

Bei einem Shell-, Python- oder externen Lua-Skript (ohne Sandbox) sagt es außerdem, ob der Interpreter gefunden wurde und dem Skript vertraut wird, und bei einem vertrauten Skript folgt ein Probe-Handshake: Es startet das Skript einmal mit einem erfundenen Commit (`"dry_run": true`) und prüft die Antwort. Ein Skript ohne Vertrauen wird nie gestartet."""
"rewrite script test --language" = "`lua`, `shell`, `python` oder `lua-external`; Standard nach der Endung"
"rewrite script test --trust" = "Diesem Skript zuerst vertrauen (eine Entscheidung für Menschen, über MCP abgelehnt)"
"rewrite script trust" = "Einem externen Skript (Shell, Python, externes Lua) anhand seines Inhalts vertrauen: Der SHA-256 der Datei wird für dieses Repository gemerkt, damit das Skript laufen darf (Vorschau, Lauf, Test); bei einer geänderten Datei wird erneut gefragt. Diese Skripte haben keine Sandbox: Sie laufen mit Ihren Rechten, also die Datei vorher lesen. Das kann nur ein Mensch: Es gibt dafür kein MCP-Werkzeug"
"rewrite script trust --file" = "Die Skriptdatei"
"rewrite tools" = "Welche Programme die Umschreib-Funktionen brauchen (gpg / ssh-keygen / gpgsm zum Neu-Signieren, Skript-Interpreter, git-lfs) und ob jedes gefunden wird. Nur lesend"
"rewrite tools --fresh" = "Prüft neu, statt aus dem Ein-Minuten-Cache zu antworten"
"mailmap" = "Die `.mailmap`: ein kanonischer Name und eine kanonische E-Mail-Adresse für Personen, die unter mehreren committet haben. Log, Blame und Dateiverlauf zeigen die zugeordneten Namen (`log.use_mailmap`), ohne einen Commit anzufassen. `list` zählt die Identitäten des Verlaufs und zeigt, welche zugeordnet sind, `check` zeigt, wie einige Identitäten aufgelöst werden, `add` führt Identitäten zu einer zusammen, indem es Zeilen an die `.mailmap` anhängt (bearbeitet, nicht committet; rückgängig machbar)"
"mailmap add" = "Führt Identitäten zu einer kanonischen Identität zusammen, indem Zeilen an die `.mailmap` angehängt werden (wird bei Bedarf angelegt; eine bereits vorhandene Zeile wird nicht wiederholt). Die Datei wird bearbeitet, nicht committet: selbst committen. Ein rückgängig machbarer Eintrag (`gitpoulpi undo` stellt die vorherige Datei wieder her). Das Log zeigt die kanonische Identität sofort (`log.use_mailmap`); die gespeicherten Commits ändern sich nicht, daher braucht nichts einen Force-Push. Um die Commits selbst umzuschreiben, eine `mailmap`-Regel in `rewrite` verwenden"
"mailmap add --canonical" = "Die Identität, die bleibt, `Name <email>`"
"mailmap add --file" = "Die zu schreibende `.mailmap`, relativ zum Repository-Stammverzeichnis (Standard: die `.mailmap` im Stammverzeichnis)"
"mailmap add --from" = "Eine Identität, die auf sie abgebildet wird, `Name <email>` (wiederholbar, mindestens eine)"
"mailmap check" = "Zeigt, wie Identitäten (`Name <email>` oder `<email>`) durch die `.mailmap` des Repositorys erscheinen: der kanonische Name und die kanonische E-Mail-Adresse, oder dieselbe Identität, wenn nichts sie abbildet. Nur lesend"
"mailmap check --identities" = "Die aufzulösenden Identitäten, jeweils `Name <email>` oder `<email>`"
"mailmap list" = "Listet jeden Namen und jede E-Mail-Adresse, die einen Commit des Bereichs verfasst oder committet haben, mit der Zahl der Commits als Autor und als Committer, die meisten zuerst, und mit der Identität, auf die die `.mailmap` sie schon abbildet (`mapped_to`). Nur lesend"
"mailmap list --all_local" = "Jeder lokale Branch und Tag statt des aktuellen Branches"
"mailmap list --mapped" = "Nur die Identitäten, die die `.mailmap` schon abbildet"
"mailmap list --refs" = "Nur diese lokalen Branches oder Tags (wiederholbar)"
"mailmap list --unmapped" = "Nur die Identitäten, die die `.mailmap` nicht abbildet"
"rewrite preview --mailmap" = "Mailmap-Regel: schreibt Autoren und Committer so um, wie die `.mailmap` des Worktrees sie nennt (der Verlauf zeigt danach, was `git log --use-mailmap` zeigt). `--who` wählt Autor, Committer oder beide. Für eine reine Anzeigekorrektur ohne Umschreiben stattdessen `mailmap add` verwenden"
"rewrite preview --mailmap_file" = "Mit `--mailmap`: diese Datei statt der `.mailmap` des Worktrees anwenden (relativ zum Repository-Stammverzeichnis oder absolut)"
"rewrite run --mailmap" = "Mailmap-Regel: schreibt Autoren und Committer so um, wie die `.mailmap` des Worktrees sie nennt (der Verlauf zeigt danach, was `git log --use-mailmap` zeigt). `--who` wählt Autor, Committer oder beide. Für eine reine Anzeigekorrektur ohne Umschreiben stattdessen `mailmap add` verwenden"
"rewrite run --mailmap_file" = "Mit `--mailmap`: diese Datei statt der `.mailmap` des Worktrees anwenden (relativ zum Repository-Stammverzeichnis oder absolut)"
"rewrite analyze" = "Größenanalyse des Verlaufs, wie `filter-repo --analyze`: die größten Blobs mit Pfad, Größe, erstem und letztem Commit und der Angabe, ob sie noch in HEAD sind, die größten Ordner, die aus HEAD gelöschten Dateien, die der Verlauf noch hält, und die Summen samt dem, was das Entfernen des nur im Verlauf vorhandenen Teils freigäbe (eine Schätzung: erst nach einer Bereinigung und einem gc). Was sie zeigt, lässt sich mit `rewrite preview --remove-paths PATH` oder `--remove-blobs-over BYTES` entfernen. Nur lesend"
