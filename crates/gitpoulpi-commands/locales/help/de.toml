"ai prompt" = "Gibt den System-Prompt aus, den eine KI-Aktion für dieses Repository sendet, Ebene für Ebene: die eingebaute Basis, die globalen Anweisungen, die des Workspace (der aus `GITPOULPI_WORKSPACE`, wenn er das Repository enthält, sonst der erste, der es enthält), die des Repositorys, dann die der Aktion selbst. Ruft kein Modell auf und funktioniert auch bei ausgeschalteter KI"
"ai prompt --action" = "Die KI-Aktion (`commit_message`, `code_review`, ...)"
"hosting review suggest" = "Bittet die KI, einen Pull-/Merge-Request zu prüfen, und gibt ihre vorgeschlagenen Kommentare (Pfad, Zeile, Seite, Schweregrad, Text) und eine Gesamtzusammenfassung als JSON aus. Sendet nichts: Die behaltenen an `review submit --comment` übergeben. Ruft die Refs des Requests wie `review fetch` ab. Erfordert `ai.enabled = true`; es gelten die `code_review`-Anweisungen der globalen, der Workspace- und der Repository-Ebene (siehe `ai prompt`)"
"hosting review suggest --id" = "Welche Integration (siehe `hosting prs`)"
"hosting review suggest --number" = "Die PR-Nummer (GitHub) oder die `iid` des MR (GitLab)"
"hosting review suggest --remote" = "Das Remote, auf dem der Request liegt. Standard: das, aus dem das Projekt ermittelt wurde, sonst das Standard-Remote des Repositorys"
"workspace set-ai-instructions" = "Legt die KI-Anweisungen eines Workspace fest (mit `--clear` entfernt sie): für jede KI-Aktion oder mit `--action` für eine. Sie gelten für jedes Repository des Workspace, nach den globalen Anweisungen und vor denen des Repositorys. Das Ergebnis zeigt `ai prompt`"
