"ai trust" = "Bindet den API-Schlüssel eines Profils an die Adresse, für die er gespeichert wurde: zeigt, was vertraut wird, oder akzeptiert die aktuelle Adresse des Profils (nach einer Änderung der Basis-URL), das Zertifikat eines selbst gehosteten Servers oder einfaches http. Nur ein Mensch führt das aus (es ist kein Agent-Tool)"
"ai trust --accept_certificate" = "Das Zertifikat mit diesem Schlüssel-Fingerabdruck akzeptieren (SHA-256, hex)"
"ai trust --accept_origin" = "Die aktuelle Basis-URL des Profils akzeptieren (genau so geschrieben, wie die Ablehnung sie ausgab)"
"ai trust --allow_insecure_http" = "Eine einfache `http://`-Basis-URL erlauben, die nicht auf diesem Rechner liegt"
"ai trust --profile" = "Die ID des KI-Profils"
"hosting integrations trust" = "Prüft die Sicherheitsprüfung eines Profils und akzeptiert, was sie gestoppt hat: eine neue Adresse, ein anderes Konto, ein neues Zertifikat, einfaches http. Nur ein Mensch führt das aus (es ist kein Agent-Tool). Ohne Option gibt es aus, was vertraut wird und was gestoppt ist"
"hosting integrations trust --accept_account" = "Diese Konto-ID als Eigentümerin des Tokens akzeptieren"
"hosting integrations trust --accept_certificate" = "Das Zertifikat mit diesem Schlüssel-Fingerabdruck akzeptieren (SHA-256, hex), genau so, wie die Ablehnung ihn ausgab"
"hosting integrations trust --accept_origin" = "Die aktuelle Adresse des Profils akzeptieren (sie muss genau so geschrieben sein, wie die Ablehnung sie ausgab)"
"hosting integrations trust --allow_insecure_http" = "Eine einfache `http://`-Adresse erlauben, die nicht auf diesem Rechner liegt"
"hosting integrations trust --id" = "Das Profil"
"hosting integrations trust --strict_tls" = "Das angeheftete Zertifikat strikt prüfen: Der Schlüssel muss übereinstimmen, auch wenn das Zertifikat zu einer öffentlichen Wurzel führt"
repo-auth = "Mit welcher Identität sich dieses Repository authentifiziert (HTTPS und SSH): die des Rechners, ein GitPoulpi-Konto oder eine Schlüsseldatei. `show` und `test` lesen; `set` und `clear` entscheidet ein Mensch"
"repo-auth clear" = "Vergisst das Profil: Das Repository verwendet wieder die Identität des Rechners. Nur ein Mensch kann das: Ein Agent wird abgelehnt"
"repo-auth set" = "Wählt die Identität, mit der sich dieses Repository authentifiziert, je Protokoll: `--https` für HTTPS-Remotes, `--ssh` für SSH-Remotes. Das Profil liegt im privaten Verzeichnis von GitPoulpi, nie im Repository. Nur ein Mensch kann es setzen: Ein Agent wird abgelehnt (Exit-Code 2)"
"repo-auth set --cache_minutes" = "Mit `token-command`: wie lange sein Token wiederverwendet wird, in Minuten"
"repo-auth set --command" = "Mit `--https token-command`: der Befehl und seine Argumente (das erste Wort ist das Programm). `--command` zuletzt schreiben: Jedes Wort danach, auch mit Bindestrich (`sh -c ...`), gehört zum Befehl"
"repo-auth set --helper" = "Mit `--https helper`: der Credential-Helper-Befehl. Ein Mensch bestätigt ihn samt Hash (oder übergibt `--yes`)"
"repo-auth set --hosts" = "Mit `helper` oder `token-command`: die Hosts, die er bedienen darf (durch Kommas getrennt oder wiederholt)"
"repo-auth set --https" = "HTTPS-Identität: `system` (die eigenen Helper von git), `integration:<id>` (das Token eines GitPoulpi-Kontos), `helper` (ein Credential-Helper, mit `--helper`) oder `token-command` (ein Befehl, der ein Token ausgibt, mit `--command` und `--hosts`)"
"repo-auth set --ignore_repo_helpers" = "Mit `--https system`: die Credential-Helper verwerfen, die dieses Repository selbst setzt, und die System- und globalen behalten"
"repo-auth set --known_hosts" = "Mit `--ssh key:` oder `integration-key:`: die Datei `known_hosts`"
"repo-auth set --ssh" = "SSH-Identität: `system` (die eigene Konfiguration und der Agent von ssh), `key:<path>` (eine private Schlüsseldatei, allein angeboten) oder `integration-key:<id>` (der Schlüssel eines GitPoulpi-Kontos)"
"repo-auth set --strict" = "Mit `--ssh key:` oder `integration-key:`: unbekannte Hostschlüssel ablehnen (`StrictHostKeyChecking=yes`)"
"repo-auth set --username" = "Ein Benutzername: mit `system` `credential.username` (lässt einen Credential-Manager eines von mehreren Konten wählen); mit `integration:<id>` der Benutzername, der mit dem Token gesendet wird"
"repo-auth set --yes" = "Bestätigt einen Helper oder Token-Befehl ohne die interaktive Frage (der Befehl und sein Hash werden trotzdem ausgegeben)"
"repo-auth show" = "Zeigt, mit welcher Identität sich dieses Repository authentifiziert: das gespeicherte Profil, die Identität, die jedes Remote verwendet, die Einstellungen, die das Profil überschreibt, und jede Warnung. Gibt nie ein Geheimnis aus; ein Helper oder Token-Befehl wird nur einem Menschen ausgegeben (ein Agent erhält `{set, sha256}`)"
"repo-auth test" = "Testet die Verbindung jedes Remotes (oder eines) mit angewendetem Profil, ohne etwas zu ändern: listet die Branches des Remotes auf oder fragt mit `--push`, ob ein Push akzeptiert würde. Antwortet mit dem Bericht jedes Remotes und der verwendeten Identität. Greift auf das Netzwerk zu"
"repo-auth test --push" = "Zusätzlich prüfen, ob ein Push akzeptiert würde"
"repo-auth test --remote" = "Nur dieses Remote (Standard: jedes Remote)"
"apply-commit" = "Wendet die Änderungen eines Commits (auch eines verlorenen) nur auf das Arbeitsverzeichnis an: Index und HEAD bleiben unberührt. Ganz oder gar nicht: Lässt sich eine Datei nicht sauber anwenden, ändert sich nichts (`stash from-commit` sichert die Änderungen stattdessen als Stash). Ein Merge-Commit wird abgelehnt. `undo` nimmt es zurück"
"apply-commit --commit" = "Der Commit, dessen Änderungen angewendet werden (beliebige Revision: ein SHA, `HEAD~2`, ...)"
"stash from-commit" = "Sichert die Änderungen eines Commits (auch eines verlorenen) als neuen Stash, ohne das Arbeitsverzeichnis zu berühren. `undo` verwirft ihn wieder"
"stash from-commit --commit" = "Der Commit, dessen Änderungen gesichert werden (beliebige Revision: ein SHA, `HEAD~2`, ...)"
"stash from-commit --message" = "Die Stash-Nachricht; ohne Angabe eine, die den Commit nennt"
"branch upstream" = "A branch's several remotes: the primary upstream plus extra push targets and opt-in pull sources, kept in its own config section"
"branch upstream add" = "Add `<remote>[:<dst>]` as an extra push target (`<dst>` is the branch name on that remote, default the same name). Undoable"
"branch upstream add --branch" = "The branch (default: the current one)"
"branch upstream add --pull" = "Also make it a pull source"
"branch upstream add --target" = "`<remote>` or `<remote>:<dst>`"
"branch upstream list" = "The branch's primary upstream, its extra push targets and pull sources, each with where it stands (ahead, behind, relation) from the remote-tracking refs as they are. Reads only, no network"
"branch upstream list --branch" = "The branch (default: the current one)"
"branch upstream primary" = "Set the primary upstream (`origin/main`): the same request as `branch set-upstream`"
"branch upstream primary --branch" = "The branch (default: the current one)"
"branch upstream pull" = "Turn `<remote>[:<dst>]` on or off as a pull source: a plain pull then integrates it too"
"branch upstream pull --branch" = "The branch (default: the current one)"
"branch upstream pull --off" = "Stop pulling from it"
"branch upstream pull --on" = "Make it a pull source"
"branch upstream pull --target" = "`<remote>` or `<remote>:<branch>`"
"branch upstream remove" = "Remove every extra push target and pull source naming `<remote>`. The primary upstream is left alone (use `unset-upstream`). Undoable"
"branch upstream remove --branch" = "The branch (default: the current one)"
"remote-group" = "A branch with several remotes (extra push targets, pull sources): where it stands against each. See `branch upstream` to change them"
"remote-group status" = "Where the current branch (or `--branch`) stands against each of its remotes: primary upstream, extra push targets, pull sources. Reads only, no network"
"remote-group status --branch" = "The branch (default: the current one)"
"pull --all_sources" = "Pull the primary upstream and every pull source of the branch (see `branch upstream pull`), each with `--mode`. Plans first: anything but a fast-forward or the mode's own integration asks for `--resolve` (exit 3, nothing changed). A stop on conflicts exits 4 with `stopped`; resume with `remote-group continue`"
"pull --branch" = "With `--all-sources`: the branch (default: the current one)"
"pull --no_preflight" = "With `--all-sources`: do not ask the remotes first"
"pull --resolve" = "With `--all-sources`: `REMOTE=ff|merge|rebase|skip` (repeatable), the decision for a remote the plan asked about"
"push --all_targets" = "Push to the primary upstream and every extra push target of the branch (see `branch upstream add`). Plans first: when every remote is a plain push or up to date it runs, otherwise it answers `needs_resolution` (exit 3, nothing changed). Exit 4: some remote failed or a merge stopped on conflicts (`stopped`)"
"push --no_preflight" = "Do not ask the remotes first (use the remote-tracking refs)"
"push --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (repeatable): the decision for a remote the plan asked about"
"push --tags" = "Also push the unpushed tags to every remote that took the branch"
"push --to" = "Push to exactly these remotes (`<remote>` or `<remote>:<dst>`, repeatable) for this push only; the config is not changed. Same plan, `--resolve` and run as `--all-targets`"
"push --yes" = "Confirm a force push chosen with `--resolve REMOTE=force`. Without it such a push changes nothing and exits with code 3"
"remote-group abort" = "Drop the saved grouped run: aborts the merge or rebase it started. Pushes already done stay"
"remote-group abort --run" = "The saved run's id, to be sure it is still the one meant"
"remote-group continue" = "Resume the saved grouped run once its merge or rebase is concluded (never automatic). Answers a `needs_resolution` with `--resolve`"
"remote-group continue --branch" = "The branch (default: the current one); only read with `--resolve`"
"remote-group continue --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (repeatable): the decision for a remote the previous answer asked about"
"remote-group continue --run" = "The saved run's id, to be sure it is still the one meant"
"remote-group continue --yes" = "Confirm the force pushes named by `--resolve`"
"remote-group plan" = "What a grouped push (or, with `--pull`, a grouped pull) would do, remote by remote: where each stands, the suggested action and the others allowed. Asks the remotes (`ls-remote`, a fetch of the ones whose tip is unknown) unless `--no-preflight`; changes nothing"
"remote-group plan --branch" = "The branch (default: the current one)"
"remote-group plan --no_preflight" = "Do not ask the remotes: use the remote-tracking refs as they are"
"remote-group plan --pull" = "Plan the grouped pull (the primary and the pull sources)"
"remote-group plan --to" = "Plan a push to exactly these remotes (`<remote>` or `<remote>:<dst>`, repeatable) instead of the configured targets"
"remote-group retry" = "Run again the targets of the saved run that failed, were canceled mid-push or were never attempted"
"remote-group retry --run" = "The saved run's id, to be sure it is still the one meant"
