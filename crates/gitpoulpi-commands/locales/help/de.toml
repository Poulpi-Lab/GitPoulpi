"flow config init" = "Gibt das TOML einer Vorlage aus. Mit `--write` wird daraus `.gitpoulpi/workflow.toml` erstellt, nur wenn diese Datei noch nicht existiert"
"flow config init --template" = "Die Vorlage, mit der begonnen wird"
"flow config init --write" = "Erstellt `.gitpoulpi/workflow.toml` (überschreibt nie)"
"flow config show" = "Gibt die gemeinsame Workflow-Datei aus (oder mit `--show-effective` den wirksamen Workflow). Wie `flow config`"
"flow config show --show_effective" = "Gibt den wirksamen Workflow statt der gemeinsamen Datei aus"
"flow detect" = "Welche Vorlage zu den Branches dieses Repositorys passt, nach Wert sortiert, mit den gefundenen konkreten Basis-Namen (`master` für `main`, `dev` für `develop`)"
"flow finish" = "Schließt einen Topic-Branch ab: für jedes Abschlussziel seines Typs der Reihe nach wird er gemergt (Merge-Commit, Squash, Rebase oder Fast-Forward), bei entsprechender Typ-Einstellung getaggt, dann der Branch gelöscht und zu seinem Eltern-Branch zurückgekehrt. Im Abschlussmodus `merge-request` wird stattdessen der Branch gepusht und der Pull/Merge Request geöffnet (nicht rückgängig zu machen; lokal wird nichts gemergt oder gelöscht). Ein Merge, der bei Konflikten anhält, hinterlässt den normalen Konfliktzustand: lösen, dann `--continue` (oder `--abort`). Gibt den Plan aus und braucht `--yes`; ohne es Exit-Code 3"
"flow finish --abort" = "Gibt die angehaltene Aktion auf: bricht den laufenden Merge oder Rebase ab und kehrt zum Branch zurück, auf dem sie begann. Bereits abgeschlossene Schritte bleiben (mit `undo` zurücknehmen)"
"flow finish --allow_behind" = "Fährt fort, obwohl das Ziel hinter seinem Remote liegt"
"flow finish --assignees" = "Merge-Request-Modus: wen zuweisen; wiederholen oder durch Kommas trennen"
"flow finish --autostash" = "Stasht lokale Änderungen, die einen Checkout oder Merge blockieren, und spielt sie danach zurück, unabhängig von `general.auto_stash`"
