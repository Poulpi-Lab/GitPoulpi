index-lock = "Eine veraltete `.git/index.lock`, die jeden Schreibvorgang scheitern lässt: anzeigen oder entfernen, sobald sie alt genug ist"
"index-lock remove" = "Löscht eine veraltete `index.lock` (von einem abgestürzten git-Befehl hinterlassen). Abgelehnt, solange sie jünger als 10 s ist oder keine existiert. Nur die Sperrdatei wird entfernt; prüfe, dass kein git-Befehl läuft"
"index-lock show" = "Die `index.lock` des Repositorys (`null`, wenn es keine gibt): Pfad, Alter in Sekunden und ob sie veraltet ist (älter als 10 s)"
"job" = "Die Hintergrundaufgaben des Daemons: jedes Fetch, Push, Pull, Clone und jeder LFS-Transfer ist ab Eingang eine. `list` zeigt sie, `cancel` stoppt eine, `wait` blockiert bis eine endet. Strg+C bei einem Befehl, der eine Aufgabe gestartet hat, bricht sie ab"
"job list" = "Die Aufgaben des Daemons dieser Sitzung, älteste zuerst: laufend, hinter einer anderen wartend und die in den letzten 30 Sekunden beendeten"
"job cancel" = "Stoppt eine Aufgabe. Abgelehnt (Exitcode 1, nichts ändert sich), sobald der sichere Punkt zum Stoppen überschritten ist, z. B. ein Pull, der mit dem Zusammenführen begonnen hat. Ein abgebrochener Push kann das Remote schon erreicht haben"
"job cancel --id" = "Die ID der Aufgabe aus `job list`"
"job wait" = "Wartet, bis eine Aufgabe endet, und gibt ihren Endzustand aus. Exitcode 0 bei `Done`, 1 bei Fehler oder Abbruch"
"job wait --id" = "Die ID der Aufgabe aus `job list`"
"job wait --timeout" = "Gibt nach so vielen Sekunden auf (Exitcode 1, die Aufgabe läuft weiter). Weggelassen: so lange warten wie nötig"
"undo-forget" = "Entfernt den blockierten obersten Eintrag aus dem Rückgängig-Journal (unterbrochene Operation, oder das Repository ging weiter), damit die darunter rückgängig gemacht werden können. Berührt nie das Repository, nur das Journal; der Eintrag lässt sich danach weder rückgängig machen noch wiederherstellen. Exit-Code 2, wenn der oberste Eintrag nicht blockiert ist, 3 ohne `--yes`"
"undo-forget --dry_run" = "Zeigt, was entfernt würde, und ändert nichts"
"undo-forget --expect" = "Vergisst nur, wenn es noch der oberste Eintrag ist (seine ID, wie `undo --list` sie zeigt); sonst als veraltet abgelehnt"
"undo-forget --redo" = "Vergisst den obersten Wiederherstellen-Eintrag statt des Rückgängig-Eintrags"
"undo-forget --yes" = "Bestätigt. Ohne ändert sich nichts und der Exit-Code ist 3"
"clone --sparse" = "Sparse Checkout: checkt nur diese Verzeichnisse aus (plus die Dateien im Wurzelverzeichnis); der gesamte Verlauf wird trotzdem heruntergeladen"
sparse-checkout = "Sparse Checkout (Cone-Modus): behält nur einige Verzeichnisse im Arbeitsverzeichnis eines großen Repositorys. `gitpoulpi clone --sparse` startet eines"
"sparse-checkout add" = "Zeigt auch diese Verzeichnisse, die bereits sichtbaren bleiben"
"sparse-checkout disable" = "Checkt wieder alle Dateien aus (vollständiger Checkout)"
"sparse-checkout set" = "Zeigt genau diese Verzeichnisse (plus die Dateien im Wurzelverzeichnis des Repositorys); alle anderen verlassen das Arbeitsverzeichnis. Schaltet Sparse Checkout ein, falls es aus ist. Der Verlauf bleibt unberührt"
"sparse-checkout set --dirs" = "Verzeichnisse relativ zum Wurzelverzeichnis des Repositorys, z. B. `src docs/guide`"
"sparse-checkout status" = "Ob das Arbeitsverzeichnis ein Sparse Checkout ist und welche Verzeichnisse es zeigt: `{ \"enabled\", \"cone\", \"dirs\" }`"
"diff --from" = "Vergleicht ab dieser Revision (älteres Ende) statt Arbeitsverzeichnis gegen Index. Zusammen mit `--to` verwenden"
"diff --name_only" = "Listet nur die geänderten Dateien und ihren Status auf, ohne Änderungsblöcke"
"diff --to" = "Das andere Ende von `--from`: eine Revision oder `worktree` (Standard) für das Arbeitsverzeichnis mit gestageten und ungestageten Änderungen verfolgter Dateien. Auswahl vergleichen im Log listet dieselben Dateien"
"file-history" = "Die Commits, die eine Datei geändert haben, neueste zuerst, über Umbenennungen hinweg (Pfad je Commit, Art der Änderung und Zeilenzahlen)"
"file-history --at" = "Revision, ab der gestartet wird (Standard: HEAD)"
"file-history --limit" = "Einträge pro Seite; `more` in der Antwort zeigt, ob es ältere gibt"
"file-history --skip" = "Zu überspringende Einträge (Seite n ist `--skip <n*limit> --limit <limit>`)"
"lost-commits" = "Commits, die kein Branch, Tag, Remote oder Stash erreicht: was ein gelöschter Branch hinterlassen hat (genannt von einem Reflog oder nur von einer Rückgängig-Sicherung gehalten) und, außer bei `--no-deep`, die unreferenzierten Commits der Objektdatenbank. Neueste zuerst. Mit einem Branch an einem davon bekommen Sie ihn zurück"
"lost-commits --budget_ms" = "Das Durchsuchen nach so vielen Millisekunden abbrechen (0: kein Limit); die Antwort sagt dann `partial`"
"lost-commits --limit" = "Anzahl der aufzulistenden Commits"
"lost-commits --no_deep" = "Nur Commits, die ein Reflog oder eine Rückgängig-Sicherung noch nennt (bei jeder Größe schnell)"
"lost-commits --skip" = "Zu überspringende Commits"
"reflog" = "Listet ein Reflog, neueste zuerst: wo `HEAD` oder ein Branch vorher war, mit Datum und dem Grund von git, auch Verschiebungen in einer Shell. Ein gelöschter Branch hat kein Reflog mehr. Auch als `reflog restore` für `reflog-restore` schreibbar"
"reflog --limit" = "Anzahl der aufzulistenden Einträge"
"reflog --ref" = "`HEAD` (Standard) oder ein Branch (oder ein vollständiger Ref-Name)"
"reflog --skip" = "Zu überspringende Einträge"
"reflog-restore" = "Setzt einen Branch (oder `HEAD`) auf eine Position seines Reflogs. Ein nicht ausgecheckter Branch wird einfach verschoben. Beim ausgecheckten Branch bleibt das Arbeitsverzeichnis sicher: bei nicht committeten Änderungen wird abgelehnt, außer `--mode` ist angegeben. Ein Journal-Eintrag: `undo` nimmt es zurück. Auch als `gitpoulpi reflog restore` schreibbar"
"reflog-restore --dry_run" = "Zeigen, was passieren würde, und nichts ändern"
"reflog-restore --mode" = "Bei nicht committeten Änderungen: `keep` verschiebt und behält sie (lehnt ab, wenn eine im Weg ist), `soft`, `mixed` und `hard` sind die Reset-Modi"
"reflog-restore --oid" = "Der Commit, auf den verschoben wird (das `new` eines Reflog-Eintrags)"
"reflog-restore --ref" = "`HEAD` oder ein Branch"
"undo-restore" = "\"Nur diese wiederherstellen\": holt zurück, was ein früherer Vorgang entfernt hat (ein gelöschter Branch oder Tag, ein verworfener Stash, eine verworfene oder gelöschte Datei, ein entferntes Remote, eine Ignore-Zeile), ohne die späteren Vorgänge rückgängig zu machen. Die Wiederherstellung ist ein neuer Journal-Eintrag, `undo` nimmt sie also zurück. Nichts wird überschrieben: eine Datei, die sich seither geändert hat, bekommt die behaltene Fassung daneben als `<name>.restored`; ein Reset, Amend oder Rebase kommt als neuer Branch an der alten Spitze zurück. Auch als `gitpoulpi undo restore <id>` schreibbar. Exit-Code 2, wenn es nicht geht (das JSON nennt den Grund)"
"undo-restore --dry_run" = "Zeigen, was passieren würde, und nichts ändern"
"undo-restore --id" = "Der wiederherzustellende Eintrag, wie `undo --list` seine ID zeigt"
"undo-restore --name" = "Den Branch oder Tag unter diesem Namen wiederherstellen (wenn der alte Name vergeben ist, oder für den Branch, den ein Reset/Amend/Rebase wiederherstellt)"
"commit --workspace" = "Als Standardprofil dieses Workspace committen (eine Workspace-ID; auch `GITPOULPI_WORKSPACE`). Gilt, wenn das Repository im Workspace ist und der Workspace ein vorhandenes Profil nennt; sonst `general.active_profile`; sonst die Identität der eigenen git-Konfiguration des Repositorys. Ohne diese Option wird Letztere verwendet"
"search" = "Fuzzy-Suche über die Branches, Tags, Worktrees, Stashes und Commit-Nachrichten des aktuellen Repositorys oder aller Repositories eines Workspace sowie über die zwischengespeicherten Pull Requests und Issues. Treffer kommen bester zuerst, mit den übereinstimmenden Zeichen. Ein Präfix schränkt die Suche ein: `b:` Branches, `t:` Tags, `c:` Commits, `s:` Stashes, `w:` Worktrees, `pr:` Pull Requests, `i:` Issues, `r:` Repositories (nur Workspace)"
"search --kinds" = "Nur diese Arten (wiederholbar); Standard alle. Ein Präfix in der Anfrage schränkt weiter ein"
"search --limit" = "Höchstens so viele Treffer"
"search --query" = "Wonach gesucht wird, Präfix eingeschlossen (`c: fix login`)"
"search --workspace" = "Alle Repositories dieses Workspace durchsuchen (eine ID; auch `GITPOULPI_WORKSPACE`). Ohne Angabe das aktuelle Repository"
"workspace" = "Workspaces: benannte Gruppen von Repositories, optional mit einem Standard-Commit-Profil. Gespeichert in `workspaces.toml` neben `config.toml`, gemeinsam mit der TUI"
"workspace add" = "Fügt Repositories zu einem Workspace hinzu und merkt sich die `origin`-URL jedes Repositorys"
"workspace create" = "Legt einen Workspace an und gibt ihn mit seiner neuen ID aus. Jedes `--add` wird mit seiner `origin`-URL gespeichert"
"workspace create --color" = "Der Name einer Akzentfarbe des Designs für seinen Punkt in der Tab-Leiste"
