"rewrite analyze --top" = "Zeilen, die in jeder Liste bleiben (Standard 50, höchstens 5000)"
"rewrite check-signing" = "Signiert einmal eine Testnutzlast mit der Signaturkonfiguration des Repositorys (`gpg.format`, `user.signingkey`, `gpg.*.program`) und verifiziert sie, als Smoke-Test vor einem Lauf, der neu signiert (`--signatures resign-signed` oder `resign-all`). Gibt das Programm aus, ob es funktioniert und wie lange eine Signatur dauerte (mit der Zahl der neu zu signierenden Commits multiplizieren, ergibt die Schätzung). Kann eine Passphrase-Abfrage öffnen. Endet mit Exit-Code 2, wenn es nicht funktioniert, und nennt den Grund (`tool_missing` oder `signing_failed`)"
"rewrite preview --remove_signatures" = "Signaturregel: die Signatur jedes Commits im Bereich entfernen, auch wo sich sonst nichts ändert. Diese Commits brauchen keine `--signatures`-Antwort"
"rewrite preview --fix_message_encoding" = "Nachrichtenregel: Commit-Nachrichten nach UTF-8 umkodieren. Eine Nachricht mit `encoding`-Header (ISO-8859-1, Shift_JIS...) wird dekodiert, und der Header entfällt; UTF-8, das einmal als Latin-1 oder Windows-1252 gelesen wurde („RÃ©Ã©criture“), wird nur repariert, wenn die Rückumwandlung exakt aufgeht. Was sich nicht entscheiden lässt, bleibt unverändert und wird gezählt (`encoding_left`)"
"rewrite preview --fix_name_encoding" = "Mit `--fix-message-encoding`: auch zerstörte Namen von Autor und Committer reparieren (die Namen eines Commits, dessen Header entfällt, werden immer mit ihm dekodiert)"
"rewrite run --remove_signatures" = "Signaturregel: die Signatur jedes Commits im Bereich entfernen, auch wo sich sonst nichts ändert. Diese Commits brauchen keine `--signatures`-Antwort"
"rewrite run --fix_message_encoding" = "Nachrichtenregel: Commit-Nachrichten nach UTF-8 umkodieren. Eine Nachricht mit `encoding`-Header (ISO-8859-1, Shift_JIS...) wird dekodiert, und der Header entfällt; UTF-8, das einmal als Latin-1 oder Windows-1252 gelesen wurde („RÃ©Ã©criture“), wird nur repariert, wenn die Rückumwandlung exakt aufgeht. Was sich nicht entscheiden lässt, bleibt unverändert und wird gezählt (`encoding_left`)"
"rewrite run --fix_name_encoding" = "Mit `--fix-message-encoding`: auch zerstörte Namen von Autor und Committer reparieren (die Namen eines Commits, dessen Header entfällt, werden immer mit ihm dekodiert)"
"rewrite preview --map_trailers" = "Mit einer Identitätsregel: auch die passenden Identitäts-Trailer (`Name <email>` in `Signed-off-by`, `Co-authored-by`...) umsetzen, nicht nur Autor und Committer"
"rewrite preview --trailer_add" = "Trailer-Regel `KEY=VALUE`: diesen Trailer an jede Nachricht anhängen (wiederholbar; eine Nachricht, die genau diesen Trailer schon hat, bleibt unverändert)"
"rewrite preview --trailer_map" = "Trailer-Regel `KEY:OLD=NEW`: Text in den Werten der Trailer mit diesem Schlüssel wörtlich ersetzen, zum Beispiel `Signed-off-by:@old.org=@new.org` (wiederholbar)"
