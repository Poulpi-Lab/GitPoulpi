"hosting review" = "Prüft einen Pull-/Merge-Request direkt in GitPoulpi (GitHub, GitLab, Gitea, Forgejo): ihn, seine Threads und Dateien lesen, kommentieren, antworten, auflösen, ein Review absenden und seinen Head für den Diff abrufen. Dieselben Befehle für Menschen, Skripte und KI-Agenten"
