"flow finish --branch" = "Der abzuschließende Branch. Standard: der ausgecheckte"
"flow finish --continue_" = "Setzt nach gelöstem Konflikt fort: committet den Merge oder setzt den Rebase fort und führt dann die restlichen Schritte aus. Nach einem fehlgeschlagenen Hook wird dieser Schritt erneut ausgeführt"
"flow finish --delete" = "Löscht danach den lokalen Branch (Standard: die Einstellung des Typs)"
"flow finish --delete_remote" = "Löscht den Branch auch auf seinem Remote (setzt das lokale Löschen voraus; nicht rückgängig zu machen)"
"flow finish --draft" = "Merge-Request-Modus: als Entwurf öffnen"
"flow finish --dry_run" = "Gibt den Plan (jeden Schritt, Blocker, Warnungen) als JSON aus und ändert nichts"
"flow finish --integration" = "Merge-Request-Modus: welche Hosting-Integration verwendet wird"
