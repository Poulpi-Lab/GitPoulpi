"flow" = "Branching-Workflows (Git Flow, GitHub Flow, GitLab Flow, Trunk-based oder ein eigener): welche Branches langlebige Basen sind, welche Topic-Branches welchen Typs, ihre Eltern-Branches und wie weit sie davon entfernt sind. `status`, `templates`, `detect` und `config` lesen; `config init` und `import` geben eine Workflow-Datei aus und erstellen sie nur mit `--write`. `start`, `finish`, `sync`, `promote` und `set-parent` handeln: jedes gibt die Schritte aus, die es ausführen wird (`--dry-run` gibt sie als JSON aus und hält an), braucht `--yes` zum Ausführen und ist ein einziger rückgängig zu machender Eintrag (ein Merge Request oder ein Push lässt sich nicht zurücknehmen)"
"flow config" = "Der Workflow des Repositorys: die gemeinsame `.gitpoulpi/workflow.toml` oder mit `--show-effective` diese Datei mit angewandter Benutzer-Abweichung. `config init` schreibt eine Vorlage"
