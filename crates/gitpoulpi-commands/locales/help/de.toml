"conflicts am-continue" = "Setzt das laufende `git am` fort: wendet den Patch an, bei dem es angehalten hat (zuvor seine Dateien lösen und stagen), und den Rest des Postfachs. `{\"outcome\":\"Completed\"}` oder `\"Stopped\"` (ein weiterer Patch kollidiert)"
