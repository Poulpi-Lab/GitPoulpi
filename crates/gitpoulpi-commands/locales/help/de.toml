"hosting review threads" = "Die Review-Threads eines Pull-/Merge-Requests (auch aufgelöste, jeweils mit Pfad, Zeile, Seite, Veraltet-Markierung und Kommentaren) und seine Kommentare in der Unterhaltung. Zeilen beziehen sich auf den Diff von `refs/gitpoulpi/pr/<n>`: `new` ist die Zeile im Head, `old` die an der Merge-Basis"
