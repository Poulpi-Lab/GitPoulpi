undo = "Macht die letzte protokollierte Operation rückgängig (Commit, Amend, Checkout, Branch erstellen/löschen). Wird abgelehnt und ändert nichts, wenn sich etwas, das die Operation berührt hat, seither bewegt hat. Exit-Code 2, wenn abgelehnt, 3, wenn `--yes` nötig ist (ein riskantes Undo)"
"undo --all" = "Mit `--list`: auch Einträge, die nicht mehr wiederholbar sind"
"undo --dry_run" = "Zeigt, was passieren würde, und ändert nichts"
"undo --expect" = "Nur rückgängig machen, wenn dies noch der letzte Eintrag ist (seine ID, wie `--list` sie zeigt); sonst als veraltet abgelehnt"
"undo --list" = "Listet stattdessen das Journal auf (neueste zuletzt); `--all` ergänzt die Einträge, die nicht mehr wiederholbar, aber noch angeheftet sind"
"undo --yes" = "Fortfahren, wenn das Undo riskant ist (der Commit liegt bereits auf seinem Upstream, oder Dateien im Arbeitsverzeichnis würden überschrieben). Ohne dies ändert ein solches Undo nichts und endet mit Exit-Code 3"
worktree = "Verknüpfte Worktrees: auflisten, einen auf einem Branch oder Commit hinzufügen"
"worktree add" = "Fügt einen verknüpften Worktree unter `<path>` hinzu. Nennt `<start>` einen lokalen Branch, wird dieser Branch dort ausgecheckt (oder `--branch` startet darauf); jede andere Revision ergibt einen losgelösten HEAD (oder `--branch` startet dort)"
"worktree add --branch" = "Erstellt diesen neuen Branch bei `<start>` und checkt ihn dort aus"
"worktree add --start" = "Ein lokaler Branch oder eine beliebige Revision"
"worktree list" = "Jeder Worktree des Repositorys, der Haupt-Worktree zuerst"
