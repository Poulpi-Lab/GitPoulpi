"rewrite run --trailer_map" = "Trailer-Regel `KEY:OLD=NEW`: Text in den Werten der Trailer mit diesem Schlüssel wörtlich ersetzen, zum Beispiel `Signed-off-by:@old.org=@new.org` (wiederholbar)"
