ai = "KI-Helfer (aus, außer bei `ai.enabled = true`): gibt eine generierte Commit-Nachricht aus oder erklärt einen Commit bzw. die Änderungen im Arbeitsverzeichnis"
"ai --print_sent" = "Gibt aus, was an das Modell gesendet würde (System- und Benutzertext, nachdem Geheimnisse geschwärzt und sensible Dateien ausgelassen wurden), und sendet nichts. Erfordert `ai.enabled = true`, aber weder Schlüssel noch Netzwerk"
"ai --send_all" = "Sendet jede Eingabe vollständig, auch über ihrem `ai.limits.*`-Limit. Ohne diese Option wird eine Eingabe über dem Limit gekürzt (ein Konflikt wird abgelehnt), und die Antwort nennt in `truncated: [{part, detail?, bytes, limit, setting}]`, was gekürzt wurde"
"commit --send_all" = "Mit `--ai`: sendet den ganzen Diff, auch wenn er über `ai.limits.diff_bytes` liegt. Ohne diese Option wird ein größerer Diff gekürzt, und die Antwort sagt es (`truncated`)"
"hosting review suggest --send_all" = "Sendet jede Eingabe vollständig, auch über ihrem `ai.limits.*`-Limit (den Diff, den Diff einer Datei, die Beschreibung, die vorhandenen Kommentare, die Kontextdateien). Ohne diese Option wird eine Eingabe über dem Limit gekürzt, und die Antwort nennt in `truncated`, was gekürzt wurde"
"stash push --send_all" = "Mit `--ai`: sendet den ganzen Diff, auch wenn er über `ai.limits.diff_bytes` liegt. Ohne diese Option wird ein größerer Diff gekürzt, und die Antwort sagt es (`truncated`)"
"ai commit-message" = "Gibt die Commit-Nachricht aus, die die KI für die gestageten Änderungen vorschlägt (oder für alle Änderungen, wenn nichts gestaget ist). Committet nichts"
"ai explain" = "Erklärt einen Commit (Standard HEAD) oder mit --wip die Änderungen im Arbeitsverzeichnis"
"ai resolve-conflict" = "Gibt die Lösung aus, die die KI für EINEN Merge-Konflikt einer Konfliktdatei vorschlägt (`--conflict N`, ab 1; optional, wenn die Datei nur einen Konflikt hat). Gibt nur aus: nichts wird geschrieben oder gestaget, die Entscheidung liegt beim Aufrufer (`conflicts resolve --content-file` übernimmt ein Ergebnis für die ganze Datei). Erfordert `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Welcher Konflikt der Datei, ab 1"
"ai resolve-conflict --path" = "Die Konfliktdatei, relativ zum Repository-Stammverzeichnis"
autostash = "Der ausstehende Auto-Stash: GitPoulpi hat lokale Änderungen für einen checkout, merge, rebase oder pull beiseitegelegt und noch nicht zurückgespielt"
"ai review-context" = "Zeigt oder setzt, was ein ✦-Code-Review-Entwurf außer dem Diff erhält (`[ai.review]`): CLAUDE.md und AGENTS.md des Repositorys, eine weitere Datei (ein Pfad oder ein Link) und ob ein lokaler Agent im Repository läuft. Ohne `--repo` und `--project` ist es der globale Standard; `--repo PATH` ist der eigene Wert eines geklonten Repositorys, `--project HOST/PROJECT` der eines nicht geklonten. Ohne Einstellungs-Flag werden die Werte ausgegeben (`effective` ist, was ein Review erhält); mit einem wird gespeichert und das Ergebnis ausgegeben. Braucht kein Modell und funktioniert bei ausgeschalteter KI"
"ai review-context --agents_md" = "Dem Modell die AGENTS.md des Repositorys geben"
"ai review-context --claude_md" = "Dem Modell die CLAUDE.md des Repositorys geben"
"ai review-context --context_file" = "Eine weitere Datei: ein Pfad relativ zur Repository-Wurzel, ein absoluter Pfad oder ein Link auf eine Datei eines Code-Hosts"
"ai review-context --no_context_file" = "Keine zusätzliche Datei"
"ai review-context --no_extra_file" = "Keine zusätzliche Datei für das Repository oder Projekt, was auch immer der globale Wert sagt (`on`, der Standard, wenn allein angegeben); `off` lässt es wieder dem globalen Wert folgen"
"ai review-context --project" = "Ein nicht geklontes Repository als `HOST/PROJECT` (`github.com/owner/name`)"
"ai review-context --reset" = "Mit `--repo` oder `--project`: die eigenen Werte des Repositorys verwerfen (es folgt wieder den globalen), bevor die Flags angewendet werden"
"ai review-context --run_in_repo" = "Einen lokalen Agenten im Repository ausführen (`yes`), nicht dort (`no`) oder wie sein KI-Profil es sagt (`profile`). Nicht für `--project`"
"autostash start-over" = "Neu beginnen: verwirft die Änderungen im Arbeitsverzeichnis an den Dateien des Stash (eine Kopie bleibt unter `refs/gitpoulpi-backup/`), macht die Operation rückgängig, die den Auto-Stash ausgelöst hat (pull, checkout, merge, rebase) und wendet den Stash per pop auf dem ursprünglichen Commit an. Bricht mit unversehrtem Stash ab, wenn ein Schritt fehlschlägt. Exit-Code 1 bei Ablehnung, 3 wenn `--yes` nötig ist"
"autostash start-over --dry_run" = "Zeigt, was passieren würde, und ändert nichts"
"autostash start-over --yes" = "Fortfahren; ohne das ändert sich nichts und der Exit-Code ist 3"
blame = "Zeilenweise Urheberschaft einer Datei in einer Revision"
"blame --at" = "Revision für den Blame (Standard: HEAD)"
"branch delete-remote" = "Löscht einen Branch auf einem Remote und behält einen lokalen Branch gleichen Namens"
"branch fast-forward" = "Setzt `<branch>` auf `<target>` vor, aber nur als Fast-Forward (abweichender Verlauf wird abgelehnt, nichts bewegt sich). Der ausgecheckte Branch nimmt sein Arbeitsverzeichnis mit, wie bei `git merge --ff-only`; bei jedem anderen Branch wird nur die Ref verschoben"
"branch fast-forward --target" = "Beliebige Revision (Standard: HEAD)"
"branch set-upstream" = "Lässt `<branch>` den Branch `<upstream>` (`origin/main`) verfolgen"
"branch track" = "Erstellt einen lokalen Branch, der einen Remote-Tracking-Branch verfolgt, und checkt ihn aus. `<upstream>` wird so geschrieben, wie die Ref-Liste ihn schreibt (`origin/feature/login`); `--name` ist standardmäßig der Branch-Teil"
"branch unset-upstream" = "Entfernt den Upstream von `<branch>`"
"checkout --autostash" = 'Stasht lokale Änderungen, die dem im Weg stehen, führt die Aktion aus und poppt dann den Stash (was `general.auto_stash = "always"` bewirkt)'
"cherry-pick --commits" = "Anzuwendende Commits, in dieser Reihenfolge. Entfällt, wenn `--plan` angegeben ist"
"cherry-pick --plan" = "Ein JSON `Vec<RebaseStep>` (gleiche Form wie `rebase --plan`; siehe `rebase-plan`), aus einem Dateipfad oder `-` für stdin: die Schritte werden in Listenreihenfolge cherry-gepickt. Nur die Aktionen `Pick` und `Drop` sind hier sinnvoll (`Drop` überspringt den Commit); jede andere Aktion wird abgelehnt. Nicht mit positionalen Commits kombinierbar"
"clone --branch" = "Diesen Branch statt des Standard-HEAD des Remotes auschecken"
"clone --depth" = "Kürzt den Verlauf auf diese Anzahl Commits (`git clone --depth`)"
"clone --no_lfs" = "Git-LFS-Dateien nach dem Klonen als Pointer belassen, statt ihren Inhalt herunterzuladen"
"clone --origin" = "Gibt dem neuen Remote einen anderen Namen als `origin`"
"clone --recurse_submodules" = "Klont auch die Submodule"
"commit --ai" = "Lässt die KI die Nachricht aus dem gestageten Diff schreiben, anhand der Commit message instructions des Repositorys (Settings > AI). Erfordert `ai.enabled = true` und ein konfiguriertes Profil"
"commit --message" = "Die Commit-Nachricht. Erforderlich, außer --ai schreibt sie"
"commit --no_verify" = "Überspringt die Commit-Hooks (`pre-commit`, `commit-msg`), wie `commit --no-verify`"
completions = "Gibt ein Shell-Vervollständigungsskript auf stdout aus (bash, zsh, fish, powershell oder elvish), z. B. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Bricht die laufende Operation ab: HEAD, Index und Arbeitsverzeichnis kehren in den Zustand davor zurück. Verwirft die seither getroffenen Lösungen"
"conflicts skip" = "Überspringt den laufenden Cherry-Pick oder Revert (oder den Commit, bei dem ein Rebase angehalten hat): HEAD, Index und Arbeitsverzeichnis kehren zu HEAD zurück. Der Ausweg, wenn er leer geworden ist (die Änderung ist schon enthalten). Ein Merge hat nichts zu überspringen"
"conflicts check" = "Würde ein Merge von HEAD in den Branch, von dem aus er abgezweigt wurde, Konflikte erzeugen, und in welchen Dateien? Nichts wird verändert (ein Merge im Arbeitsspeicher). Die Basis ist das Ziel des bekannten Pull Requests des Branches, sonst der Branch, den die Muster der Basis-Branches zulassen und der seit dem Abzweigen die wenigsten Commits hat. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Aus, wenn `general.conflict_detection` oder der Schalter des Repositorys aus ist"
"conflicts list" = "Die Konfliktdateien, jeweils mit dem Text ihrer drei Seiten. Mit `--names-only`: nur Pfad, Konfliktart und Stage-Oids (kein Blob wird gelesen; günstig bei großen Merges)"
"conflicts resolve" = 'Löst eine Datei auf und staget sie (die Datei gilt nicht mehr als Konflikt). Genau eines von `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` oder `--delete`. A und "ours" sind die aktuelle Seite (`HEAD`; bei einem Rebase der Branch, auf den neu aufgesetzt wird), B und "theirs" die eingehende Seite. Konfliktmarker nie von Hand bearbeiten: auswählen oder den endgültigen Text in eine Datei schreiben'
"conflicts resolve --both" = "Behält beide Seiten jedes Konflikts (A, dann B) und überall sonst Gits eigenen Merge"
"conflicts resolve --content_file" = "Der endgültige Dateitext, exakt (`-` liest die Standardeingabe)"
"conflicts resolve --delete" = "Löschung akzeptieren: Datei entfernen (`git rm`)"
"conflicts resolve --encoding" = "Mit `--content-file`: schreibt den Text in dieser Kodierung (ein WHATWG-Label wie `windows-1252`) statt in UTF-8"
"conflicts resolve --expect" = "Die Stage-Oids, auf deren Grundlage entschieden wurde, `base,ours,theirs` (`-` für eine fehlende Stage). Der Aufruf wird als `stale` abgelehnt, wenn der Index nicht mehr genau diese enthält. `--both` und `--pick` prüfen immer die Stages, die sie lesen"
"conflicts resolve --no_stage" = "Schreibt die Datei im Arbeitsverzeichnis, lässt sie aber im Konflikt (einfaches Speichern)"
"conflicts resolve --ours" = "Wie `--side ours`"
"conflicts resolve --pick" = "Eine Wahl je Konfliktnummer: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = beide in dieser Reihenfolge). Jeder Konflikt braucht eine, außer `--default` deckt den Rest ab"
"conflicts resolve --pick_default" = "Mit `--pick`: die Wahl für jeden nicht aufgeführten Konflikt"
"conflicts resolve --side" = "Übernimmt die ganze Datei aus einer Stage, ohne Auto-Merge"
"conflicts resolve --theirs" = "Wie `--side theirs`"
"conflicts resolve --theirs_first" = "Mit `--both`: B, dann A"
"conflicts show" = "Eine Konfliktdatei, wie der Merge-Editor sie sieht: die Bereichsbezeichnungen, die drei Seiten und die nummerierten Konfliktbereiche (`--json` ist das vollständige Dokument). Von Git selbst aufgelöste Bereiche werden nicht aufgeführt; sie bleiben im Ergebnis von `resolve --both`/`--pick`"
"conflicts show --conflict" = "Nur Konflikt N (ab 1)"
"conflicts state" = "Der laufende Merge, Rebase, Cherry-Pick oder Revert (`null`, wenn keiner läuft)"
"conflicts unresolve" = "Setzt eine während dieser Operation gelöste Datei wieder auf Konflikt (wieder mit Markern). Wird abgelehnt, wenn sie noch im Konflikt ist oder nicht während der Operation gelöst wurde"
daemon = "`gitpoulpi server ...` ist ein sichtbarer Alias - der Eigentümer nennt diese Gruppe „Server“ und tippt `gp server stop`"
"daemon restart" = "`daemon stop` gefolgt von `daemon start`"
"daemon run" = "Führt den Daemon dieser Sitzung im Vordergrund aus (blockiert; Strg-C zum Beenden, oder ein anderswo gesendetes `daemon stop`/`daemon restart`). Das startet `daemon start` losgelöst, und ein eigenes Terminal kann es auch direkt ausführen"
"daemon start" = "Startet den Daemon dieser Sitzung als losgelösten Hintergrundprozess (oder meldet, dass er schon läuft). `--backend` legt das Backend fest, das der gestartete Prozess nutzen soll; ohne Angabe ermittelt er `general.default_backend` selbst"
"daemon status" = "Ob der Daemon dieser Sitzung lauscht, und falls ja Port, PID, Laufzeit, Backend und Build-Version"
"daemon stop" = "Bittet den Daemon dieser Sitzung, sich geordnet zu beenden; nur wenn er nicht rechtzeitig antwortet und nur wenn er ein eigenständiger Daemon ist (nie einer, der in einer laufenden TUI eingebettet ist), wird seine gespeicherte PID beendet"
"daemon stop --all" = "Beendet den Daemon jeder Sitzung, für die `session list` eine Port-Datei meldet, nicht nur diese"
discard = "Verwirft die *ungestageten* Änderungen einer Datei im Arbeitsverzeichnis: einen Hunk (`--hunk`), einige seiner Zeilen (`--hunk --lines`) oder - mit `--file` allein - jede nicht committete Änderung der Datei, auch gestagete (eine nicht verfolgte Datei wird gelöscht). Hunks und Zeilen werden so nummeriert, wie `gitpoulpi diff --json` den ungestageten Diff nummeriert. Alles Verworfene wird in einem Sicherheits-Snapshot aufbewahrt, sodass `gitpoulpi undo` es zurückholt (auch nicht verfolgte Dateien). Nicht bestätigt: das ist die Skripting-Oberfläche"
"discard --lines" = "Kommagetrennte Zeilenindizes innerhalb von `--hunk`"
"fetch --all" = "Holt von jedem konfigurierten Remote"
"fetch --prune" = "Entfernt Remote-Tracking-Branches, die der Remote nicht mehr hat"
"fetch --prune_tags" = "Löscht auch die lokalen Tags, die das Remote gelöscht hat (nur Tags, die dort lagen: Ein nie gepushter Tag bleibt unberührt). Das engere `fetch.pruneTags` von Git; aus, solange nicht angefordert"
"fetch --remote" = "Ohne Angabe: der Standard-Remote des Repositorys (siehe `remote default`)"
gitpoulpi = "Schlanker plattformübergreifender TUI-Git-Client, skriptbar per CLI/MCP."
"gitpoulpi --add" = "Öffnet einen Ordner als neuen Tab im bereits laufenden GitPoulpi, statt ein weiteres zu starten (`gp -a`, `gp --add ../anderer`). PATH ist standardmäßig das aktuelle Verzeichnis und wird zum umgebenden Repository aufgelöst. Eine laufende Sitzung: sie erhält den Tab und ihr Fenster kommt in den Vordergrund, wenn die Desktop-Umgebung es erlaubt. Mehrere: man wählt eine aus einer nummerierten Liste (oder gibt `--session NAME` an). Keine: GitPoulpi startet normal in diesem Ordner. Nimmt keinen Unterbefehl; mit `--json` wird ein Objekt ausgegeben (`action` ist `joined` oder `cancelled`), Exitcode 0, wenn der Tab offen ist, 3, wenn ein beschäftigtes Fenster ihn im Chip seiner Statuszeile angeboten hat"
"gitpoulpi --no_raise" = "Mit `--add`: das Fenster nicht bitten, sein Terminal in den Vordergrund zu holen"
"gitpoulpi --backend" = "Auf welchem `GitBackend` der Daemon dieses Befehls läuft; überschreibt `general.default_backend` in config.toml und `GITPOULPI_GENERAL_DEFAULT_BACKEND` (Flags stehen an der Spitze der Rangfolge - siehe docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
Auf welchem `GitBackend` der Daemon dieses Befehls läuft; überschreibt `general.default_backend` in config.toml und `GITPOULPI_GENERAL_DEFAULT_BACKEND` (Flags stehen an der Spitze der Rangfolge - siehe docs/user/config-reference.md).

Es wählt das Backend für einen Daemon, den dieser Befehl *startet*. Eine Sitzung, deren Daemon bereits läuft, behält das Backend, mit dem dieser Daemon gebaut wurde; `gitpoulpi` kann das Backend eines laufenden Daemons nicht unter den bereits angemeldeten Clients austauschen, und etwas anderes vorzutäuschen wäre genau das stille Nichtstun, das dieses Flag vermeiden soll."""
"gitpoulpi --cwd_file" = '''Datei, in die die TUI beim Beenden den Ordner des aktiven Tabs schreibt ("Quit and cd here", oder immer bei `ui.tab_dir_follow = "auto"`). Gedacht für den Wrapper, den `gitpoulpi shell-init` ausgibt; wird von jedem Unterbefehl ignoriert, da nur die TUI Tabs hat'''
"gitpoulpi --json" = "Gibt strukturiertes JSON statt menschenlesbarer Ausgabe aus"
"gitpoulpi --lang" = "Sprache des `--help`-Textes (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
Sprache des `--help`-Textes (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Nur Erklärungen werden übersetzt - Befehls- und Flag-Namen ändern sich nie - und `--help` bleibt Englisch, solange dies nicht angegeben wird (die Umgebung wird bewusst ignoriert, damit Skripte stabile Ausgaben erhalten). Beispiel: `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Repository, auf dem gearbeitet wird. Standard ist das Repository, das das aktuelle Verzeichnis umschließt, sodass `gitpoulpi status` sich wie `git status` verhält; ein Agent, der mehrere Repos steuert, übergibt dies statt zu chdir-en"
"gitpoulpi --session" = "Benannte Sitzung als Ziel. Ohne Angabe wird sie aus dem Stammverzeichnis des aktuellen Repositorys abgeleitet (siehe `gitpoulpi_config::default_session_name`), sodass zwei Repositorys zwei unabhängige Daemons erhalten, während alles, was innerhalb eines Repositorys geöffnet wird, einen teilt. Mit diesem Flag lassen sich zwei Repositorys in eine Sitzung zwingen oder eine Sitzung ausdrücklich benennen. Der Wert wird vor der Verwendung bereinigt - er wird zu einem Dateinamen"
"hosting checkout-pr" = "Checkt einen Pull-/Merge-Request aus, auch aus einem Fork: holt seinen Head (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) in den lokalen Branch `pr/<n>` (`mr/<n>` bei GitLab), verfolgt ihn und wechselt darauf"
"hosting checkout-pr --id" = "Welche Integration (siehe `hosting prs`)"
"hosting checkout-pr --no_checkout" = "Nur den Branch holen und anlegen/aktualisieren; bleibt, wo man ist"
"hosting checkout-pr --number" = "Die PR-Nummer (GitHub) oder MR-`iid` (GitLab)"
"hosting checkout-pr --remote" = "Der Remote, auf dem der Request liegt. Standard ist der, aus dem das Projekt ermittelt wurde, sonst der Standard-Remote des Repositorys"
"hosting clone" = "Klont ein Projekt aus `projects` über seinen vollständigen Pfad und ermittelt die Clone-URL über den Host, statt den Benutzer eine einfügen zu lassen"
"hosting clone --https" = "Über HTTPS statt SSH klonen"
"hosting clone --project" = "Der vollständige Pfad des Projekts, wie `hosting projects` ihn ausgibt"
"hosting edit-url" = "Gibt die URL aus, unter der ein Pull-/Merge-Request bearbeitet wird (GitLabs `.../edit`-Ansicht; GitHub bearbeitet direkt auf der Seite des Requests). Mit einer Nummer dieser Request; sonst der für `--branch` (Standard: der ausgecheckte Branch). Folgt der Pull-/Merge-Request-Verknüpfung des Repositorys wie `prs`. Startet den Browser nur mit `--open`"
"hosting edit-url --branch" = "Den Request stattdessen über seinen Quell-Branch finden"
"hosting edit-url --number" = "Die Nummer des Requests (`53` für `!53` / `#53`)"
"hosting edit-url --open" = "Öffnet die URL zusätzlich im System-Browser"
"hosting file" = "Liest eine Datei eines Projekts in einer Revision über die API des Hosts, ohne Klon: Text unverändert, andere Bytes als Base64 (`encoding`). Exit 1 und ein Fehler, wenn die Datei in dieser Revision nicht existiert"
"hosting file --id" = "Welche Integration (siehe `hosting list`); optional, wenn nur eine konfiguriert ist"
"hosting file --path" = "Der Pfad im Projekt, etwa `CLAUDE.md` oder `src/main.rs`"
"hosting file --project" = "Das Projekt: `owner/name` bei GitHub, `group/sub/project` bei GitLab"
"hosting file --rev" = "Die Revision: ein Branch, Tag oder Commit. Standard ist der Standardbranch des Projekts"
"hosting integrations" = "Verwaltet die konfigurierten Integrationsprofile (`[[integrations]]`)"
"hosting integrations add" = "Fügt ein Profil jeder Art hinzu, für die es einen Client gibt"
"hosting integrations add --id" = "Standard ist der Name der Art (`gitlab`, `gitlab-2`, ...)"
"hosting integrations add --kind" = "`github`, `github_enterprise`, `gitlab`, `gitlab_self_managed`, `azure_devops`, `azure_devops_server`, `bitbucket`, `jira_cloud`, `jira_data_center`, `trello`, `gitea`, `forgejo`, `linear`, `youtrack`, `redmine`, `gerrit` oder `local_markdown`"
"hosting integrations add --name" = "Anzeigename"
"hosting integrations add --url" = "Die Web-Wurzel der Instanz. Für selbstverwaltete Arten und Jira erforderlich"
"hosting integrations list" = "Die konfigurierten Profile, ohne ihre Tokens"
"hosting integrations radar" = "Zeigt oder ändert die Radar-Einstellungen eines Profils (`[integrations.radar]`): welche kontoweiten Listen `hosting radar` und das Radar abrufen, die zu durchsuchenden Namespaces und was ein Review eines Requests aus einem nicht geklonten Repository tut. Ohne Option werden nur die aktuellen Einstellungen ausgegeben"
"hosting integrations radar --assigned_issues" = "Offene Issues, die dir zugewiesen sind, in jedem Repository"
"hosting integrations radar --clear_namespaces" = "Die gespeicherten Namespaces verwerfen: deinen eigenen plus jede Mitgliedschaft"
"hosting integrations radar --id" = "Das Profil"
"hosting integrations radar --include_drafts" = "Entwurfs-Requests in den kontoweiten Listen behalten"
"hosting integrations radar --namespaces" = "Ein Namespace (Organisation, Gruppe), der nach offenen Requests durchsucht wird; das Flag wiederholen oder mit Komma trennen. Ersetzt die gespeicherte Liste"
"hosting integrations radar --open_requests" = "Jeder offene Request deiner Namespaces"
"hosting integrations radar --review_mode" = "Was das Prüfen eines Requests aus einem nicht geklonten Repository tut"
"hosting integrations radar --review_requests" = "Requests, die auf dein Review warten, in jedem Repository"
"hosting integrations remove" = "Entfernt ein Profil und löscht sein gespeichertes Token"
"hosting integrations test" = "Prüft das Token des Profils gegen seinen Host: Benutzer, Scopes, Ablauf"
"hosting issue" = "Erstellt Issues im verknüpften Projekt des aktuellen Repositorys"
"hosting issue create" = "Eröffnet ein Issue im Projekt, mit dem die ISSUES-Quelle des Repositorys verknüpft ist (`hosting link issues`), oder in dem, das `--id` aus dem Remote ermittelt. Nach außen wirkende Aktion: sie schreibt auf den Host"
"hosting issue create --body" = "Die Issue-Beschreibung"
"hosting issue create --body_file" = "Liest die Beschreibung aus dieser Datei (`-` liest stdin)"
"hosting issue create --id" = "Welche Integration (siehe `hosting issues`)"
"hosting issue create --labels" = "Ein anzuwendendes Label; Flag wiederholen oder per Komma trennen"
"hosting issue create --title" = "Der Issue-Titel"
"hosting issue create --web" = "Gibt die vorausgefüllte Neues-Issue-Seite des Hosts aus, statt dessen API aufzurufen (kein Token nötig)"
"hosting issues" = "Issues des Projekts des aktuellen Repositorys"
"hosting issues --assigned" = "Nur die, die dir zugewiesen sind"
"hosting board --id" = "Welche Integration (siehe `hosting issues`)"
"hosting board move --column" = "Der Name der Spalte, wie `hosting board` ihn ausgibt"
"hosting board move --id" = "Welche Integration (siehe `hosting issues`)"
"hosting board move --reference" = "Die Karte: ihre Nummer oder ihre eigene Referenz (`12`, `#12`, `ABC-12`, `AB#12`)"
"hosting board move" = "Verschiebt eine Karte in eine Spalte: eine Statusänderung, ein Workflow-Übergang (Jira), ein Work-Item-Status (Azure DevOps), eine Liste (Trello) oder ein Label-Tausch (GitHub, GitLab, Gitea, Forgejo). Ein Verschieben, für das der Anbieter keinen Weg hat, wird mit Begründung abgelehnt. Wirkt nach außen: schreibt auf den Host"
"hosting board show --id" = "Welche Integration (siehe `hosting issues`)"
"hosting board show" = "Die Spalten des Boards mit ihren Karten. Nur lesend"
"hosting board" = "Das Issue-Board des verknüpften Projekts des aktuellen Repositorys: seine Spalten mit ihren Karten, dieselben Spalten wie im Board der TUI (pro Spalte ein Status, eine Liste oder ein Label). Ohne Unterbefehl dasselbe wie `board show`"
"hosting link" = "Verknüpft die Pull-/Merge-Request-Liste oder Issue-Liste dieses Repositorys mit einem Anbieterprofil und einem seiner Repositorys oder hebt die Verknüpfung auf (ohne Flag wird die Verknüpfung angezeigt). `prs` / `issues` holen nichts, bevor eine Quelle verknüpft ist; es ist dieselbe Verknüpfung, die die Seitenleisten-Bereiche der TUI speichern (`pulls_source` / `issues_source` in `.gitpoulpi/repo-state.toml`)"
"hosting link --clear" = "Hebt die Verknüpfung der Liste auf: nichts wird geholt, bis sie wieder verknüpft ist"
"hosting link --id" = "Das zu verknüpfende Profil. Ohne `--project` wird das Repository verwendet, das seine Remotes auf dem Host dieses Profils nennen"
"hosting link --kind" = "Welche Liste"
"hosting link --project" = "Das Repository des Anbieters (`owner/name`, `group/sub/proj`)"
"hosting list" = "Die konfigurierten Integrationen, ohne ihre Tokens"
"hosting login" = "Validiert ein Token und speichert es unter dem `token_ref` des Profils, wobei gemerkt wird, wem es gehört. Das Token wird von stdin gelesen (`--token-stdin`), nie aus einem Argument, damit es nicht in der Shell-Historie landet. Nicht über MCP verfügbar: ein Geheimnis darf nicht durch das Tool-Call-Protokoll eines Agenten laufen"
"hosting login --id" = "Welche Integration. Optional, wenn nur eine konfiguriert ist"
"hosting login --token_stdin" = "Liest das Token von stdin (erforderlich; eine Zeile, abschließender Zeilenumbruch wird ignoriert)"
"hosting logout" = "Löscht das gespeicherte Token des Profils und vergisst den verbundenen Benutzer; das Profil selbst bleibt"
"hosting open" = "Gibt die Web-URL eines Pull-Requests oder Issues des Projekts des aktuellen Repositorys aus. Startet den System-Browser nur mit `--browser`"
"hosting open --browser" = "Öffnet die URL zusätzlich im System-Browser"
"hosting pr" = "Eröffnet einen Pull-Request (GitHub, Gitea, Forgejo, Bitbucket, Azure DevOps) oder Merge-Request (GitLab) aus einem Branch des aktuellen Repositorys"
"hosting pr --id" = "Welche Integration (`[[integrations]] id`). Optional, wenn nur eine konfiguriert ist"
"hosting pr --source" = "Der Branch, aus dem er eröffnet wird. Standard ist der ausgecheckte Branch"
"hosting pr --target" = "Der Branch, gegen den er eröffnet wird. Standard ist der Standard-Branch des Remotes, wenn er sich ermitteln lässt, sonst `main`/`master`, falls einer davon existiert"
"hosting pr --title" = "Standard ist die Betreffzeile des Tip-Commits des Quell-Branches"
"hosting pr --web" = "Gibt die Vergleichs-/Neuer-Request-URL aus, statt die API des Hosts aufzurufen. Das passiert auch automatisch, wenn für diesen Remote keine Integration konfiguriert ist oder kein Token dafür vorliegt"
"hosting pr-for-branch" = "Der Pull-/Merge-Request, der einen Branch am besten repräsentiert (offen, dann Entwurf, dann gemergt, dann geschlossen; neueste zuerst)"
"hosting pr-for-branch --branch" = "Standard ist der ausgecheckte Branch"
"hosting projects" = "Jedes Projekt, das das Token der Integration sehen kann"
"hosting projects --filter" = "Teilzeichenkette ohne Beachtung der Groß-/Kleinschreibung im Projektpfad"
"hosting projects --id" = "Welche Integration (`[[integrations]] id`). Optional, wenn nur eine konfiguriert ist"
"hosting prs" = "Pull-/Merge-Requests des Projekts des aktuellen Repositorys"
"hosting prs --id" = "Welche Integration. Ohne sie wird die verknüpfte Pull-/Merge-Request-Quelle des Repositorys verwendet (siehe `hosting link`); ein nicht verknüpftes Repository holt nichts. Mit ihr das Projekt, das der Remote dieses Repositorys auf diesem Profil nennt"
"hosting prs --mine" = "Nur die, die du eröffnet hast"
"hosting prs --review_requested" = "Nur die, die auf dein Review warten"
"hosting prs --state" = "`open` (Standard), `closed` (inklusive gemergter) oder `all`"
"hosting radar" = "Die kontoweiten Listen für das Radar: die Requests, die auf dein Review warten, jeder offene Request deiner Namespaces und die dir zugewiesenen Issues, über alle Repositories jedes Profils (GitHub, GitLab, Gitea, Forgejo, Azure DevOps, Bitbucket Data Center, Gerrit), geklont oder nicht. Ohne `--what` entscheiden die `[integrations.radar]`-Einstellungen jedes Profils (siehe `hosting integrations radar`); die Antwort wird fünf Minuten wiederverwendet, außer mit `--refresh`. Nur lesend"
"hosting radar --ids" = "Welches Profil; das Flag für mehrere wiederholen. Ohne es jedes aktivierte Profil einer unterstützten Art"
"hosting radar --include_drafts" = "Auch Entwurfs-Requests behalten"
"hosting radar --refresh" = "Den Host auch dann fragen, wenn eine aktuelle Antwort im Cache liegt"
"hosting radar --what" = "Was aufgelistet wird, unabhängig von den Einstellungen des Profils: `review` (wartet auf dein Review), `open` (jeder offene Request), `issues` (dir zugewiesen) oder `all`"
"hosting review comment --project" = "Ein Projekt prüfen, das nicht das aktuelle Repository ist (kein Klon nötig): `owner/name` bei GitHub, `group/sub/project` bei GitLab. `--id` nennt dann die Integration, falls mehrere konfiguriert sind"
"hosting review diff" = "Der Diff eines Pull-/Merge-Requests, Datei für Datei mit seinen Hunks (`files[].diff.hunks`). In einem Repository ruft er die Refs des Requests ab und bildet den Diff lokal; mit `--api` oder mit `--project` (kein Repository) liest er den Diff stattdessen über die API des Hosts, was keinen Klon braucht. Eine Datei, deren Patch der Host ausgelassen hat (zu groß), hat `omitted` gesetzt und keine Hunks"
"hosting review diff --api" = "Den Diff über die API des Hosts lesen, auch innerhalb eines Klons"
"hosting review diff --file" = "Nur der Diff dieser Datei"
"hosting review diff --id" = "Welche Integration (siehe `hosting prs`)"
"hosting review diff --number" = "Die PR-Nummer (GitHub) oder die `iid` des MR (GitLab)"
"hosting review diff --project" = "Ein Projekt prüfen, das nicht das aktuelle Repository ist (kein Klon nötig): `owner/name` bei GitHub, `group/sub/project` bei GitLab. `--id` nennt dann die Integration, falls mehrere konfiguriert sind"
"hosting review diff --remote" = "Das Remote, auf dem der Request liegt (nur lokaler Diff). Standard: das, aus dem das Projekt ermittelt wurde, sonst das Standard-Remote des Repositorys"
"hosting review reply --project" = "Ein Projekt prüfen, das nicht das aktuelle Repository ist (kein Klon nötig): `owner/name` bei GitHub, `group/sub/project` bei GitLab. `--id` nennt dann die Integration, falls mehrere konfiguriert sind"
"hosting review resolve --project" = "Ein Projekt prüfen, das nicht das aktuelle Repository ist (kein Klon nötig): `owner/name` bei GitHub, `group/sub/project` bei GitLab. `--id` nennt dann die Integration, falls mehrere konfiguriert sind"
"hosting review show --project" = "Ein Projekt prüfen, das nicht das aktuelle Repository ist (kein Klon nötig): `owner/name` bei GitHub, `group/sub/project` bei GitLab. `--id` nennt dann die Integration, falls mehrere konfiguriert sind"
"hosting review submit --project" = "Ein Projekt prüfen, das nicht das aktuelle Repository ist (kein Klon nötig): `owner/name` bei GitHub, `group/sub/project` bei GitLab. `--id` nennt dann die Integration, falls mehrere konfiguriert sind"
"hosting review suggest --agents_md" = "Dem Modell die AGENTS.md des Repositorys geben, für diesen Lauf"
"hosting review suggest --claude_md" = "Dem Modell die CLAUDE.md des Repositorys geben (gelesen auf dem Branch, auf den der Request zielt), für diesen Lauf"
"hosting review suggest --context_file" = "Eine weitere Datei für diesen Lauf: ein Pfad relativ zur Repository-Wurzel, ein absoluter Pfad oder ein Link auf eine Datei eines Code-Hosts"
"hosting review suggest --no_context_file" = "Keine zusätzliche Datei für diesen Lauf, was auch immer die Standardwerte sagen"
"hosting review suggest --project" = "Ein Projekt prüfen, das nicht das aktuelle Repository ist (kein Klon nötig): `owner/name` bei GitHub, `group/sub/project` bei GitLab. `--id` nennt dann die Integration, falls mehrere konfiguriert sind"
"hosting review suggest --run_in_repo" = "Einen lokalen Agenten im Repository ausführen (`yes`), nicht dort (`no`) oder wie sein KI-Profil es sagt (`profile`), für diesen Lauf. Nicht mit `--project` (es gibt keinen Checkout)"
"hosting review threads --project" = "Ein Projekt prüfen, das nicht das aktuelle Repository ist (kein Klon nötig): `owner/name` bei GitHub, `group/sub/project` bei GitLab. `--id` nennt dann die Integration, falls mehrere konfiguriert sind"
"hosting ssh-key" = "Erzeugt ein ed25519-Schlüsselpaar und lädt die öffentliche Hälfte hoch"
"hosting ssh-key create" = "Erzeugt ein neues Paar und lädt die öffentliche Hälfte hoch. Überschreibt keine vorhandene Schlüsseldatei"
"hosting ssh-key create --no_upload" = "Erzeugt das Paar, sendet es aber nirgendwohin"
"hosting ssh-key create --path" = "Wohin der private Schlüssel geschrieben wird. Standard ist `~/.ssh/id_ed25519`"
"hosting ssh-key create --title" = "Der Name, unter dem der Schlüssel auf dem Host erscheint. Standard ist `gitpoulpi@<hostname>`"
"hosting ssh-key delete" = "Entfernt einen öffentlichen Schlüssel vom Konto auf dem Host (über die ID, die `ssh-key list` meldet). Lokale Schlüsseldateien bleiben unangetastet"
"hosting ssh-key delete --id" = "Welche Integration"
"hosting ssh-key delete --key_id" = "Die ID des Schlüssels auf dem Host"
"hosting ssh-key list" = "Die öffentlichen Schlüssel, die bereits auf dem Konto liegen"
"hosting use" = "Legt fest, welches Integrationsprofil für das aktuelle Repository zuständig ist (oder zeigt ohne beide Flags, was gerade gilt)"
"hosting use --clear" = "Entfernt die Festlegung und kehrt zur Ermittlung über den Remote-Host zurück"
"hosting use --id" = "Das festzulegende Profil"
ignore = "Hängt ein Muster an eine `.gitignore` an (standardmäßig die im Stammverzeichnis des Repositorys). Tut nichts, wenn das Muster bereits eine Zeile davon ist. Rückgängig machbar mit `gitpoulpi undo`, das die Datei wiederherstellt, wie sie war (oder sie entfernt, wenn sie nicht existierte)"
"ignore --file" = "Repo-relative `.gitignore`, an die angehängt wird (Standard `.gitignore`)"
"ignore --pattern" = "Die hinzuzufügende Zeile, z. B. `*.log`, `/build` oder `docs/tmp/`"
lfs = "Git LFS: große Dateien, die außerhalb des Verlaufs des Repositorys liegen. Erfordert das Programm `git-lfs` für alles, was Dateien verschiebt oder konvertiert; `status` und `files` funktionieren ohne"
"lfs fetch" = "Lädt LFS-Objekte in den lokalen Speicher (`git lfs fetch`) und lässt das Arbeitsverzeichnis unberührt"
"lfs fetch --all" = "Jede Ref, nicht nur die aktuelle"
"lfs fetch --remote" = "Ohne Angabe: der Standard-Remote des Repositorys (siehe `remote default`)"
"lfs files" = "Die LFS-Pointer-Dateien im Index (oder bei `--at`), samt Angabe, ob das echte Objekt im lokalen LFS-Speicher liegt"
"lfs files --at" = "Aufzulistende Revision (Standard: der Index)"
"lfs install" = "Richtet die LFS-Filter und -Hooks ein (`git lfs install`), nur für dieses Repository, außer mit `--user`"
"lfs install --user" = "In der globalen Git-Konfiguration des Benutzers installieren statt in diesem Repository"
"lfs lock" = "Sperrt eine Datei, damit niemand sonst sie ändern kann, bis du sie entsperrst"
"lfs lock --remote" = "Ohne Angabe: der Standard-Remote des Repositorys"
"lfs locks" = "Die LFS-Dateisperren auf dem Server: wer welche Datei hält. Erfordert einen Server mit Sperrunterstützung (GitHub, GitLab, Gitea, ...); verwendet die eigenen Zugangsdaten des Remotes"
"lfs locks --remote" = "Ohne Angabe: der Standard-Remote des Repositorys"
"lfs prune" = "Löscht alte, bereits gepushte Objekte aus dem lokalen LFS-Speicher"
"lfs pull" = "Lädt LFS-Objekte herunter und ersetzt die Pointer-Dateien im Arbeitsverzeichnis durch den echten Inhalt (`git lfs pull`)"
"lfs pull --remote" = "Ohne Angabe: der Standard-Remote des Repositorys"
"lfs checkout" = "Schreibt den echten Inhalt der LFS-Zeigerdateien im Arbeitsverzeichnis aus dem lokalen LFS-Speicher (`git lfs checkout`). Offline"
"lfs checkout --paths" = "Nur diese Pfade (relativ zur Repository-Wurzel); weggelassen: alle Zeiger im Arbeitsverzeichnis"
"lfs push" = "Lädt LFS-Objekte hoch (`git lfs push`)"
"lfs push --all" = "Jede Ref, nicht nur der aktuelle Branch"
"lfs push --remote" = "Ohne Angabe: der Standard-Remote des Repositorys"
"lfs status" = "Ist `git-lfs` installiert, nutzt dieses Repository LFS, welche Muster werden verfolgt, sind die Filter und der Hook installiert. Schlägt nie fehl, weil `git-lfs` fehlt: die Antwort sagt es"
"lfs track" = "Leitet Dateimuster über LFS (`git lfs track`). Bearbeitet `.gitattributes` und lässt sie ungestaget"
"lfs track --lockable" = "Macht die Dateien schreibgeschützt, bis sie gesperrt werden"
"lfs track --renormalize" = "Staget zusätzlich bereits committete passende Dateien neu, sodass ihr nächster Commit Pointer speichert (der Verlauf wird nicht umgeschrieben)"
"lfs unlock" = "Gibt eine Sperre frei. Die Sperre eines anderen erfordert `--force`, das sie bricht"
"lfs unlock --force" = "Bricht eine Sperre, die jemand anderes hält"
"lfs unlock --remote" = "Ohne Angabe: der Standard-Remote des Repositorys"
"lfs untrack" = "Leitet Muster nicht mehr über LFS (`git lfs untrack`)"
"log --count" = "Gibt nur aus, wie viele Commits der Durchlauf umfasst (`{\"total\": N}`), und ignoriert `--limit` und `--skip`: die Zahl, die die Statusleiste der TUI nach dem Schrägstrich zeigt. Zählt, ohne einen Commit zu laden"
"log --path" = "Nur Commits, die diesen Pfad berühren (wiederholbar) - `git log -- <path>`. Das ist die Abfrage der Dateiverlauf-Ansicht"
"log --skip" = "Überspringt die ersten N Commits des Durchlaufs, bevor `--limit` angewendet wird. Zusammen mit `--limit` blättert das durch den Verlauf: Seite `n` ist `--skip <n*limit> --limit <limit>`, und die Seiten decken den Durchlauf lückenlos ab (per Vertrag geprüft durch `check_log_skip_pages_history`)"
"log --format" = "Gibt die Commits in einem anderen Format aus. `mermaid` gibt ein Mermaid-`gitGraph`-Skript aus (in eine Markdown-Datei, einen PR oder mermaid.live einfügen); mit `--json` `{format, detail, commits, text}`. Die Commits sind `--range`, sonst die ersten `--limit` (Standard 30) des Durchlaufs"
"log --detail" = "Mermaid-Detailstufe: `structure` (Commits, Branches, Merges), `refs` (+ Branch-Namen, Tags, HEAD), `subjects` (+ Commit-Betreffzeilen) oder `full` (+ Autor und Datum). Standard: `ui.mermaid_detail` (`refs`)"
"log --orientation" = "Richtung des Mermaid-Graphen. Standard: `ui.mermaid_orientation` (`lr`)"
"log --fence" = "Umschließt das Mermaid-Skript mit einem ```mermaid-Block"
"log --range" = "Mermaid: die Commits `A..B` (von B aus erreichbar, von A aus nicht), wie `git log A..B`; ein einzelnes `A` bedeutet `A..HEAD`"
"log --subject_width" = "Mermaid: kürzt Commit-Betreffzeilen auf so viele Zeichen. Standard: `ui.mermaid_subject_width` (40)"
"mcp serve --allow_remote" = "Erlaubt `--http` auf einer Nicht-Loopback-Adresse. Wird abgelehnt, außer `[mcp] http_auth` ist an und ein Token ist vorhanden und der Datenverkehr ist verschlüsselt (`[mcp] tls` oder `behind_proxy` für einen Tunnel oder Reverse-Proxy, für den du einstehst); `ssh -L` auf einen Loopback-Endpunkt ist sicherer"
"mcp serve --http" = "Lauschadresse für Streamable HTTP, z. B. 127.0.0.1:8808 (Endpunkt `/mcp`); ohne Adresse `[mcp] bind` (Standard 127.0.0.1:8808). Anfragen brauchen das Bearer-Token (`mcp token`), außer `[mcp] http_auth` ist aus. Nur Loopback, außer mit `--allow-remote`"
"mcp serve --ui_control" = "Wie weit der Agent das Fenster des Benutzers mit den `ui_*`-Tools bewegen darf: `ask` (Standard: das Fenster zeigt einen Chip, den der Benutzer bestätigt), `auto` oder `off`. Überschreibt `[mcp] ui_control`"
"mcp token" = "Das Bearer-Token des HTTP-Endpunkts (`mcp serve --http`): zeigt es maskiert als JSON `{token_hint, path, rotated}` und erzeugt es bei der ersten Nutzung. Ein Client sendet es als `Authorization: Bearer <token>`. Kein MCP-Tool: Ein Agent liest oder rotiert seinen eigenen Schlüssel nie"
"mcp token --copy" = "Kopiert das vollständige Token über das Terminal (OSC 52) in die Zwischenablage, ohne es auszugeben"
"mcp token --rotate" = "Ersetzt das Token durch ein neues; Clients mit dem alten Token werden sofort abgewiesen"
"mcp token --show" = "Gibt das vollständige Token ebenfalls aus, damit du es in die Konfiguration eines Clients einfügen kannst"
"merge --autostash" = 'Stasht lokale Änderungen, die dem im Weg stehen, führt die Aktion aus und poppt dann den Stash (was `general.auto_stash = "always"` bewirkt)'
"merge --ff" = "Fast-Forward, wenn der Branch es zulässt, sonst ein Merge-Commit (Gits Standard). Überschreibt `git.merge_fast_forward` für diesen Merge"
"merge --ff_only" = "Nur Fast-Forward: bricht ab, wenn der Branch auseinandergelaufen ist. Überschreibt `git.merge_fast_forward` für diesen Merge"
"merge --no_ff" = "Immer einen Merge-Commit erzeugen, auch wenn ein Fast-Forward möglich wäre. Überschreibt `git.merge_fast_forward` für diesen Merge"
"merge --squash" = "Fasst die Commits des Branches zusammen (Squash): staget ihre Änderungen und erzeugt keinen Merge-Commit (`merge --squash`), sodass danach ein `commit` folgt. Der Squash-Modus der Einstellung „Merge-Verhalten“. Nicht rückgängig zu machen: nichts wurde verschoben, zum Zurücknehmen die gestageten Änderungen verwerfen"
patch = "Schreibt eine Patch-Datei oder wendet eine auf das Arbeitsverzeichnis an"
"patch apply" = "Wendet eine Patch-Datei auf das Arbeitsverzeichnis an"
"patch create" = "Schreibt eine Patch-Datei. `<revs>` sind ein oder mehrere Commits (älteste zuerst), aus denen je ein Patch wird; mit `--range a..b` stattdessen jeder Nicht-Merge-Commit eines Bereichs; mit `--wip` stattdessen die aktuellen Änderungen des Arbeitsverzeichnisses (gestaget und ungestaget), optional begrenzt auf `<paths>`"
"patch create --revs" = "Commit-Revisionen (älteste zuerst) ohne `--range`/`--wip`; mit `--wip` Pfade, auf die der Patch begrenzt wird (leer bedeutet jede geänderte Datei); bei `--range` ignoriert"
"pull --autostash" = 'Stasht lokale Änderungen, die dem im Weg stehen, führt die Aktion aus und poppt dann den Stash (was `general.auto_stash = "always"` bewirkt)'
"pull --mode" = "Wie integriert wird: `merge` (Fast-Forward, wenn möglich), `ff-only` oder `rebase`. Wird immer ausdrücklich an git übergeben"
"pull --remote" = "Pullt den gleichnamigen Branch von diesem Remote statt vom Upstream des Branches"
"push --branch" = "Der zu pushende lokale Branch; ohne Angabe der ausgecheckte"
"push --force_with_lease" = "Überschreibt den Remote-Branch, aber nur, wenn er dort steht, wo unser letzter Fetch ihn gesehen hat. Ein einfaches `--force` gibt es nicht"
"push --remote" = "Ohne Angabe: der Standard-Remote des Repositorys (siehe `remote default`)"
"push --set_upstream" = "Merkt `<remote>/<branch>` als Upstream des Branches"
"rebase --abort" = "Bricht einen laufenden Rebase ab und stellt Branch und HEAD wieder her"
"rebase --autosquash" = "Ordnet die Schritte von `--plan` zuerst mit dem Algorithmus von `git rebase --autosquash` neu; ohne `--plan` wird ein einfaches `git rebase -i --autosquash` ausgeführt"
"rebase --autostash" = 'Stasht lokale Änderungen, die dem im Weg stehen, führt die Aktion aus und poppt dann den Stash (was `general.auto_stash = "always"` bewirkt)'
"rebase --continue_" = "Setzt einen Rebase fort, der wegen eines Konflikts oder eines `edit`-Schritts angehalten wurde"
"rebase --interactive" = "Führt `git rebase -i` aus. Ohne `--plan` ist nur `--autosquash` allein sinnvoll (hier gibt es keinen interaktiven Editor); mit `--plan` für eine ausdrückliche Todo-Liste kombinieren"
"rebase --onto" = "Der Branch/Commit, auf den neu aufgesetzt wird, oder (mit `--plan`) der Upstream, nach dem der Bereich des Plans beginnt. Entfällt bei `--root` oder einem von `--continue`/`--skip`/`--abort`/`--status`"
"rebase --onto_commit" = "Spielt auf diesem Commit statt auf dem Upstream selbst neu ab (`git rebase --onto`)"
"rebase --plan" = "Ein JSON-Plan `Vec<RebaseStep>` (siehe `rebase-plan`), aus einem Dateipfad oder `-` für stdin"
"rebase --root" = "Setzt den gesamten Verlauf neu auf (`--root`) statt eines Bereichs nach `onto`/einem ausdrücklichen Upstream"
"rebase --skip" = "Überspringt den Commit, an dem ein Rebase angehalten hat"
"rebase --status" = "Meldet den aktuell laufenden Rebase, falls vorhanden"
rebase-plan = "Der Bereich, den ein interaktiver Rebase ab `upstream` (oder des gesamten Verlaufs, mit `--root`) abspielen würde, älteste zuerst - Material, aus dem sich eine `rebase --plan`-JSON-Datei bauen lässt"
redo = "Wiederholt die Operation, die `undo` gerade zurückgenommen hat, im exakt aufgezeichneten Zustand (die Operation wird nie erneut ausgeführt). Exit-Code 2, wenn abgelehnt"
"redo --dry_run" = "Zeigt, was passieren würde, und ändert nichts"
"redo --expect" = "Nur wiederholen, wenn dies noch der letzte rückgängig gemachte Eintrag ist"
"redo --yes" = "Fortfahren, wenn das Wiederholen riskant ist; ohne dies Exit-Code 3"
"refs hide" = '''Blendet Refs im Commit-Graphen aus (das "Hide" der TUI): der Anzeigefilter pro Repo in `repo-state.toml`, dem eine geöffnete TUI live folgt. Namen werden so geschrieben, wie die Ref-Liste sie schreibt (`feature/x`, `origin/main`, ein Tag-Name)'''
"refs hide --clear" = "Blendet jede ausgeblendete Ref und jedes ausgeblendete Remote wieder ein (zusätzlich zu allen genannten)"
"refs hide --names" = "Auszublendende Refs"
"refs hide#long" = """
Blendet Refs im Commit-Graphen aus (das "Hide" der TUI): der Anzeigefilter pro Repo in `repo-state.toml`, dem eine geöffnete TUI live folgt. Namen werden so geschrieben, wie die Ref-Liste sie schreibt (`feature/x`, `origin/main`, ein Tag-Name).

`--remote <name>...` blendet ein ganzes Remote aus (jeden seiner Branches, auch die später abgerufenen): so betrachten Sie einen Verlauf ohne den eines separaten Archiv-Remotes."""
"refs hide --remote" = "Ganz auszublendende Remotes (Namen, wie `remote list` sie schreibt)"
"refs show" = "Zeigt Refs wieder an: entfernt sie aus den Mengen der ausgeblendeten und der solo gezeigten"
"refs show --clear" = "Setzt den gesamten Filter zurück: nichts ausgeblendet (Remotes eingeschlossen), nichts solo"
"refs show --names" = "Wieder anzuzeigende Refs"
"refs show#long" = """
Zeigt Refs wieder an: entfernt sie aus den Mengen der ausgeblendeten und der solo gezeigten.

`--remote <name>...` zeigt ein ganzes Remote wieder an, samt jedem seiner Branches, der einzeln ausgeblendet war."""
"refs show --remote" = "Wieder anzuzeigende Remotes"
"refs solo" = "Zeigt im Commit-Graphen nur diese Refs (und was sie erreichen)"
"refs solo --clear" = "Hebt Solo für jede solo gezeigte Ref auf (zusätzlich zu allen genannten)"
"refs solo --names" = "Solo zu zeigende Refs"
"remote add --push_url" = "Eine separate URL zum Pushen"
"remote clear-push-url" = "Entfernt die separate Push-URL, sodass Pushes wieder die Fetch-URL nutzen"
"remote default" = "Zeigt den Standard-Remote des Repositorys oder setzt ihn über einen Namen"
"remote set-url" = "Setzt die Fetch-URL oder mit `--push` die separate Push-URL"
repo = "Repositorys öffnen, untersuchen und merken - die Oberfläche für mehrere Repositorys. Siehe `gitpoulpi repo --help`"
"repo close" = "Schließt den Tab eines Repositorys in dieser Sitzung. Das Repository selbst bleibt unberührt"
"repo discover" = "Liegt dieser Pfad in einem Git-Repository, und wo ist dessen Stammverzeichnis? Läuft über `GitBackend::discover` und beantwortet daher genau das, was der Repository-öffnen-Ablauf der TUI beantworten würde"
"repo discover --path" = "Standard ist das aktuelle Verzeichnis"
"repo init" = "Erstellt ein Repository unter `path` und öffnet es als Tab dieser Sitzung. Läuft über `GitBackend::init` und erzeugt daher genau das Repository, das das Create-Formular der TUI erzeugen würde"
"repo init --bare" = "Ein Repository ohne Arbeitsverzeichnis"
"repo init --initial_branch" = "Der Branch, auf dem der erste Commit landet. Standard ist `general.default_branch_name`; leer belässt Gits eigenen"
"repo list" = "Die in dieser Sitzung geöffneten Tabs, der aktive markiert"
"repo open" = "Öffnet ein Repository als Tab dieser Sitzung und trägt es in die Liste der zuletzt geöffneten ein. Gibt aus, was geöffnet wurde; startet keine UI"
"repo recent" = "Die zuletzt geöffneten Repositorys, neueste zuerst"
"repo recent --forget" = "Einen Eintrag vergessen"
"repo recent --prune" = "Entfernt Einträge, deren Verzeichnis nicht mehr auf der Platte ist"
revert = "Macht einen Commit mit einem neuen Commit rückgängig, der die umgekehrte Änderung anwendet"
"revert --commit" = "Der rückgängig zu machende Commit (beliebige Revision: ein SHA, `HEAD~2`, ...)"
"revert --mainline" = "Bei einem Merge-Commit: die Nummer (ab 1) des Elternteils, der die Hauptlinie bleibt, wie bei `git revert -m`. `1` ist der Branch, auf dem der Merge erstellt wurde. Erforderlich, um einen Merge-Commit rückgängig zu machen"
reword = "Gibt einem Commit des aktuellen Branches eine neue Nachricht (seine Nachfolger werden darüber neu erzeugt; Index und Arbeitsverzeichnis bleiben unberührt). Ein bereits gepushter Commit braucht danach einen Force-Push"
"reword --commit" = "Der zu bearbeitende Commit (beliebige Revision: ein SHA, `HEAD~2`, ...)"
"reword --message" = "Die vollständige neue Nachricht (Betreff, Leerzeile, Text)"
amend = "Ändert die Eigenschaften eines Commits des aktuellen Branches: Nachricht, Name, E-Mail und Datum des Autors, Name, E-Mail und Datum des Committers (beliebige Teilmenge; was weggelassen wird, bleibt erhalten). Seine Nachfolger werden darüber mit ihren eigenen Autoren neu erstellt; Index und Arbeitsverzeichnis bleiben unberührt. Rückgängig machbar; ein bereits gepushter Commit braucht danach einen Force-Push"
"amend --author_date" = "Rohes Git-Datum (`1700000000 +0100`) oder ISO 8601 (`2001-02-03T04:05:06+05:30`)"
"amend --author_email" = "Die neue E-Mail des Autors"
"amend --author_name" = "Der neue Name des Autors"
"amend --commit" = "Der zu ändernde Commit (beliebige Revision: ein SHA, `HEAD~2`, ...)"
"amend --committer_date" = "Dieselben Formate wie --author-date (Standard: jetzt)"
"amend --committer_email" = "Die neue E-Mail des Committers (Standard: Ihre E-Mail)"
"amend --committer_name" = "Der neue Name des Committers (Standard: Ihr Name)"
"amend --description" = "Nur der Text (was auf die Zusammenfassung folgt): die Zusammenfassung bleibt erhalten. Ein leerer Wert entfernt den Text"
"amend --message" = "Die vollständige neue Nachricht (Betreff, Leerzeile, Text)"
"amend --summary" = "Nur die Zusammenfassung (erste Zeile): der Text bleibt erhalten"
rm-file = "Löscht Dateien (oder Verzeichnisse) aus dem Arbeitsverzeichnis; der Index bleibt unberührt, eine verfolgte Datei erscheint also als gelöschte Änderung. Rückgängig machbar mit `gitpoulpi undo`, das die exakten Bytes wiederherstellt"
"rewrite apply --target" = "Der Ordner des neuen Repositorys, wenn der Plan ein Unterverzeichnis als Klon oder Submodul herauslöst (siehe `--extract-mode`)"
"rewrite maps" = "Die `commit-map` und `ref-map` des Laufs (im Format von git-filter-repo: eine Kopfzeile, dann `alt neu` pro Zeile; die Repository-Bereinigung von GitLab nimmt die Commit-Map). Gibt ihre Pfade aus oder kopiert sie nach `--out`"
"rewrite maps --out" = "Kopiert beide Dateien in dieses Verzeichnis (wird bei Bedarf angelegt)"
"rewrite maps --run" = "Die Lauf-ID; `latest` (Standard) ist der zuletzt angewendete Lauf"
"rewrite note" = "Der Hinweis an alle, die den alten Verlauf haben: pro gepushtem Branch und Tag die alte und die neue Spitze und was zu tun ist (`git fetch`, dann `git reset --hard origin/<branch>` oder `git rebase --onto`). Nur lesend"
"rewrite note --run" = "Die Lauf-ID; `latest` (Standard) ist der zuletzt angewendete Lauf"
"rewrite preview --extract" = "Pfadregel: nur dieses Unterverzeichnis behalten, das zur Wurzel wird; Commits, die es nicht berühren, entfallen, und Merges werden vereinfacht. Wird jedes Mal abgefragt: `--extract-mode` angeben, sonst ist der Exit-Code 3 und nichts wird in der Vorschau gezeigt. Das Herauslösen läuft vor den übrigen Pfad-Flags"
"rewrite preview --extract_mode" = "Wie `--extract` endet: `clone` (ein neuer lokaler Klon in `--target`, das Original bleibt unberührt; jeder lokale Branch und Tag), `in-place` (der Verlauf dieses Repositorys wird umgeschrieben, ein Undo-Eintrag) oder `submodule` (der Klon wie bei `clone`, und ein neuer Commit auf dem aktuellen Branch ersetzt den Ordner durch ein Submodul davon; dieser Verlauf bleibt erhalten)"
"rewrite preview --into_subdir" = "Pfadregel: das ganze Repository in jedem Commit in dieses Unterverzeichnis verschieben (um Repositorys ohne Pfadkonflikte zusammenzuführen)"
"rewrite preview --move_paths" = "Pfadregel `FROM=TO`: in jedem Commit eine Datei oder einen Ordner umbenennen, mit denselben Blobs und Trees am neuen Pfad (wiederholbar, der Reihe nach, nach den Inhaltsregeln). Ein Commit, in dem `TO` schon existiert, bleibt unverändert: Die Vorschau wird abgelehnt (Exit-Code 2, `path_collision`) und listet die Commits und Pfade auf"
"rewrite preview --target" = "Der Ordner des neuen Repositorys für `--extract-mode clone` oder `submodule`: Er darf nicht existieren oder muss leer sein und nicht in diesem Repository liegen. Gilt für `rewrite run`; `rewrite apply` hat ein eigenes"
"rewrite push" = "Pusht die Refs, die ein angewendeter Lauf verschoben hat und die auf einem Remote lagen, jede mit `--force-with-lease=<ref>:<die ID, die das Remote bei der Vorschau hatte>` (nie ein einfaches Force), pro Remote ein `--atomic`-Push, wo der Server es erlaubt (sonst ein Push pro Ref, und die Antwort sagt es). Tags sind eingeschlossen. Geschützte Branches (`rewrite.protected_branches`) bleiben außen vor, außer sie stehen bei `--include-protected` oder alle bei `--include-all-protected`. Eine Ref, deren Remote sich seit der Vorschau bewegt hat, wird einzeln abgelehnt (fetchen und prüfen, dann erneut ausführen). Nicht rückgängig zu machen: Das Remote behält den neuen Verlauf, auch wenn Sie das Umschreiben lokal mit `undo` zurücknehmen. Ohne `--yes` (oder mit `--dry-run`) wird nichts gesendet: Die Antwort listet, was gepusht würde, und der Exit-Code ist ohne `--yes` 3. Exit-Code 2, wenn der Lauf nicht mehr existiert, 4, wenn eine Ref abgelehnt oder nicht gepusht wurde"
"rewrite push --dry_run" = "Beim Remote nachfragen, was passieren würde (Leases werden geprüft), und nichts senden"
"rewrite push --include_all_protected" = "Auch jeden geschützten Branch des Laufs pushen"
"rewrite push --include_protected" = "Auch diesen geschützten Branch pushen (wiederholbar)"
"rewrite push --no_atomic" = "Ein Push pro Ref statt eines einzigen `--atomic`-Pushs, der ganz oder gar nicht gilt"
"rewrite push --remote" = "Nur die Refs dieses Remotes"
"rewrite push --run" = "Die Lauf-ID, die `rewrite apply` ausgegeben hat; `latest` (Standard) ist der zuletzt angewendete Lauf"
"rewrite push --yes" = "Wirklich pushen. Ohne diese Option wird nichts gesendet (Exit-Code 3)"
"rewrite purge" = "Löscht den alten Verlauf eines Umschreibens endgültig aus diesem Klon: entfernt die Undo-Pins des Umschreibens (und jeder früheren Operation, deren Pins den alten Verlauf ebenfalls halten), lässt die Reflog-Einträge ablaufen, die ihn nennen, löscht die Objekte (`gc --prune=now`) und prüft, dass sie weg sind. Undo ist für diese Operationen danach nicht mehr möglich (sie bleiben in `undo --list` als bereinigt stehen). Nach dem Start lässt es sich weder anhalten noch rückgängig machen. Alles, was den alten Verlauf noch hält (ein Branch außerhalb des Umschreibens, ein Stash, das HEAD eines anderen Worktrees, eine Remote-Tracking-Ref: nach dem Push fetchen), blockiert es, und nichts wird geändert. Es wird nichts an ein Remote gesendet; die Antwort listet die Schritte, die der Host braucht (GitHub, GitLab, Azure DevOps, Bitbucket). Ohne `--yes` passiert nichts: Die Antwort nennt, was gelöscht würde und verloren ginge, und der Exit-Code ist 3. Exit-Code 2, wenn der Eintrag kein Umschreiben ist, 4, wenn etwas blockiert oder Objekte übrig bleiben. Über MCP nur mit `[mcp] allow_history_purge = true`"
"rewrite purge --all" = "Jedes Umschreiben des Verlaufs im Undo-Verlauf"
"rewrite purge --entries" = "Ein Eintrag zum Umschreiben des Verlaufs im Undo-Verlauf (`undo --list`; wiederholbar). Standard: das neueste Umschreiben, das noch nicht bereinigt ist"
"rewrite purge --latest" = "Das neueste Umschreiben, das noch nicht bereinigt ist (der Standard)"
"rewrite purge --yes" = "Wirklich löschen. Ohne diese Option wird nichts geändert (Exit-Code 3)"
"rewrite run --extract" = "Pfadregel: nur dieses Unterverzeichnis behalten, das zur Wurzel wird; Commits, die es nicht berühren, entfallen, und Merges werden vereinfacht. Wird jedes Mal abgefragt: `--extract-mode` angeben, sonst ist der Exit-Code 3 und nichts wird in der Vorschau gezeigt. Das Herauslösen läuft vor den übrigen Pfad-Flags"
"rewrite run --extract_mode" = "Wie `--extract` endet: `clone` (ein neuer lokaler Klon in `--target`, das Original bleibt unberührt; jeder lokale Branch und Tag), `in-place` (der Verlauf dieses Repositorys wird umgeschrieben, ein Undo-Eintrag) oder `submodule` (der Klon wie bei `clone`, und ein neuer Commit auf dem aktuellen Branch ersetzt den Ordner durch ein Submodul davon; dieser Verlauf bleibt erhalten)"
"rewrite run --into_subdir" = "Pfadregel: das ganze Repository in jedem Commit in dieses Unterverzeichnis verschieben (um Repositorys ohne Pfadkonflikte zusammenzuführen)"
"rewrite run --move_paths" = "Pfadregel `FROM=TO`: in jedem Commit eine Datei oder einen Ordner umbenennen, mit denselben Blobs und Trees am neuen Pfad (wiederholbar, der Reihe nach, nach den Inhaltsregeln). Ein Commit, in dem `TO` schon existiert, bleibt unverändert: Die Vorschau wird abgelehnt (Exit-Code 2, `path_collision`) und listet die Commits und Pfade auf"
"rewrite run --target" = "Der Ordner des neuen Repositorys für `--extract-mode clone` oder `submodule`: Er darf nicht existieren oder muss leer sein und nicht in diesem Repository liegen. Gilt für `rewrite run`; `rewrite apply` hat ein eigenes"
"rm-file --paths" = "Repo-relative Pfade, die gelöscht werden"
shell-init = '''Gibt eine Shell-Wrapper-Funktion aus (Standardname `gp`), die gitpoulpi ausführt und, wenn du mit "Quit and cd here" beendest, deine Shell im Ordner des aktiven Tabs zurücklässt. In die rc-Datei deiner Shell einfügen: `eval "$(gitpoulpi shell-init bash)"`. Es wird nichts installiert oder bearbeitet'''
"shell-init --name" = "Der Name der Funktion. Ein vorhandener Befehl dieses Namens wird nicht überschrieben"
show = "Der Inhalt einer Datei in einer Revision, im Index oder im Arbeitsverzeichnis"
"show --at" = "Revision, in der gelesen wird (Standard: HEAD). Schließt --staged und --worktree aus"
"show --output" = "Mit --raw: schreibt die Bytes in diese Datei statt nach stdout"
"show --path" = "Repo-relativer Pfad, der gelesen wird"
"show --raw" = "Schreibt die exakten Bytes der Datei (ohne Dekodierung, ohne JSON) nach stdout oder nach --output. Für Skripte und Binärdateien wie Bilder. Nur auf der Kommandozeile: nicht über MCP verfügbar"
"show --staged" = "Liest den gestageten Inhalt statt den eines Commits"
"show --worktree" = "Liest die Datei so, wie sie auf der Platte liegt, statt die eines Commits"
repo-config = "Die repository-lokalen `core.autocrlf` und `core.eol` (was Einstellungen > Git & Kodierung bearbeitet). Rückgängig machbar wie jede andere Operation"
"repo-config set" = "Setzt einen Schlüssel: `core.autocrlf` nimmt true | input | false, `core.eol` nimmt lf | crlf | native"
"repo-config show" = "Zeigt den repository-lokalen Wert eines Schlüssels (`core.autocrlf` oder `core.eol`) oder beider; null heißt nicht gesetzt (der globale Wert gilt)"
"repo-config show --key" = "`core.autocrlf` oder `core.eol`; beide, wenn weggelassen"
"repo-config unset" = "Entfernt den repository-lokalen Wert, sodass wieder der globale gilt"
ssh-command = "Die repository-lokale Festlegung von `core.sshCommand`: welchen SSH-Schlüssel dieses Repository verwendet. Die ganze Identität steht unter `repo-auth`"
"ssh-command clear" = "Entfernt die Festlegung, sodass das Repository wieder die umgebende SSH-Einrichtung nutzt"
"ssh-command set" = "Legt das Repository auf einen privaten Schlüssel oder auf einen wörtlichen Befehl fest"
"ssh-command set --command" = "Ein wörtlicher Wert für `core.sshCommand`"
"ssh-command set --key" = 'Private Schlüsseldatei: legt `ssh -i "<key>" -o IdentitiesOnly=yes` fest'
"ssh-command show" = "Zeigt das festgelegte `core.sshCommand` des Repositorys (null, wenn nicht gesetzt)"
"stage --allow_sensitive" = "Stagt auch Dateien, die sensibel aussehen (ein privater Schlüssel, eine `.env`, ein erkanntes Token). Ohne das wird ein solches Staging abgelehnt und nichts gestaget (`[privacy] staging_guard`)"
"stage --hunk" = "Index eines Hunks im Diff von `--file`, so nummeriert, wie `gitpoulpi diff --json` sie nummeriert"
"stage --lines" = "Kommagetrennte Zeilenindizes innerhalb von `--hunk`"
"stash push --ai" = "Lässt die KI den Stash anhand der Änderungen im Arbeitsverzeichnis benennen (erfordert `ai.enabled = true`, siehe `docs/user/ai.md`)"
submodule = "Submodule: sie samt Zustand auflisten, registrieren (`init`) oder auschecken (`update`)"
"submodule init" = "Registriert Submodule in `.git/config`, ohne sie zu klonen (`git submodule init`). Ohne Pfade: alle"
"submodule init --paths" = "Repo-relative Submodul-Pfade"
"submodule list" = "Jedes Submodul mit seinem Zustand: `uninitialized` (nicht geklont), `up_to_date`, `modified` (auf einem anderen Commit ausgecheckt als dem aufgezeichneten) oder `conflicted`"
"submodule update" = "Checkt Submodule auf den Commits aus, die das Repository aufzeichnet (`git submodule update`). Ohne Pfade: alle"
"submodule update --init" = "Klont und registriert die, die es noch nicht sind (`--init`)"
"submodule update --paths" = "Repo-relative Submodul-Pfade"
"submodule update --recursive" = "Aktualisiert auch die eigenen Submodule der Submodule"
"tag annotate" = "Ersetzt ein vorhandenes Tag an Ort und Stelle durch ein annotiertes. Das Tag behält den Commit, auf den es bereits zeigt"
"tag create --message" = "Erstellt ein *annotiertes* Tag mit dieser Nachricht statt eines leichtgewichtigen - `git tag -a -m`"
"tag delete" = "Löscht einen Tag. Standardmäßig nur den lokalen (`--local`): Hat ein Remote den Tag auch, bringt ihn der nächste `fetch` zurück, und die Antwort sagt das. `--remote <R>` löscht ihn nur auf diesem Remote (nach außen wirksam: andere verlieren ihn), `--both` löscht ihn hier und auf dem Remote, das ihn hat (`--both --remote <R>` nennt eines)"
"tag delete --both" = "Hier und auf dem Remote löschen, das den Tag hat"
"tag delete --local" = "Nur den lokalen Tag löschen (Standard)"
"tag delete --remote" = "Auf diesem Remote löschen (allein, außer mit `--both`)"
"tag delete-remote" = "Löscht ein Tag auf einem Remote und behält das lokale"
"tag fetch" = "Fetcht einen Tag von einem Remote in die lokalen Tags: was ein Tag braucht, der in `tag list` nur auf dem `remote` liegt. Überschreibt nie einen lokalen Tag an einem anderen Commit"
"tag fetch --remote" = "Weggelassen: das eine Remote, das den Tag hat"
"tag list" = "Jeder Tag mit seinem Aufenthaltsort: `local` (hier), `remote` (die Remotes, die ihn haben), `differs_on` (Remotes, die ihn an einem anderen Commit halten) und `where`: `local`, `remote` (nicht gefetcht oder hier gelöscht), `both` oder `differs`. Vom letzten Fetch oder Push gelernt, nicht aus dem Netzwerk"
"tag list --unpushed" = "Nur die Tags, die bekanntermaßen kein Remote hat"
"tag push" = "Sendet Tags an einen Remote. Ohne Namen werden alle Tags gesendet, die bekanntermaßen kein Remote hat - ein Push, nicht einer pro Tag"
"tag push --names" = "Zu sendende Tags. Weglassen, um jedes ungepushte Tag zu pushen"
theme = "Die Farbthemen: auflisten oder eines als Themendatei ausgeben"
licenses = "Gibt die in dieses Programm eingebauten Lizenzhinweise und Danksagungen Dritter aus (derselbe Text wie unter Über > Lizenzen und in der Datei THIRD-PARTY-LICENSES.txt des Release-Archivs)"
"theme export" = "Gibt eine vollständige Themendatei auf stdout aus, als Ausgangspunkt für ein eigenes Thema (speichern als `<config>/themes/<name>.toml`)"
"theme export --slug" = "Der Slug des Themas (siehe `theme list`)"
"theme list" = "Listet alle Themen: die eingebauten Voreinstellungen und die Dateien im Ordner `themes/` des Konfigurationsverzeichnisses (Slug, Bezeichnung, Quelle, hell, Spurpalette). `ui.theme` akzeptiert jeden dieser Slugs"
desktop = "Verknüpfungen, die GitPoulpi über den Starter des Systems im Terminal aus `ui.launch_terminal` starten"
"desktop folder-menu" = "Der Eintrag „In GitPoulpi öffnen“ im Rechtsklickmenü des Dateimanagers: Datei-Explorer (Windows), GNOME Dateien, Dolphin, Nemo, Thunar, Caja und PCManFM (Linux), Finder (macOS)"
"desktop folder-menu install" = "Fügt den Eintrag zu jedem hier gefundenen Dateimanager hinzu (eine fremde Datei wird nie überschrieben)"
"desktop folder-menu remove" = "Entfernt genau das, was `install` geschrieben hat, aus jedem Dateimanager"
"desktop folder-menu status" = "Zeigt jeden Dateimanager dieses Systems: ob er gefunden wurde und ob der Eintrag not_installed, installed, outdated oder foreign ist (eine Datei, die nicht von GitPoulpi stammt)"
"desktop shortcut" = "Listet die Verknüpfungen von Starter, Startmenü und Desktop auf, legt sie an oder entfernt sie"
"desktop shortcut install" = "Legt eine Verknüpfung an oder aktualisiert sie (Standard: der Starter des Systems)"
"desktop shortcut install --place" = "`launcher`, `desktop` oder `startmenu`"
"desktop shortcut remove" = "Entfernt die von GitPoulpi angelegten Verknüpfungen (Standard: alle); eine Datei, die nicht von GitPoulpi stammt, wird nie angefasst"
"desktop shortcut remove --place" = "`launcher`, `desktop` oder `startmenu`"
"desktop shortcut status" = "Zeigt jede Verknüpfung, die dieses System bietet: not_installed, installed, outdated oder foreign (eine Datei, die nicht von GitPoulpi stammt), und das verwendete Terminal"
treat = "Lässt git Dateien als Binär- oder als Textdateien behandeln, indem eine `.gitattributes`-Regel (`binary` oder `text diff`) für die Pfade geschrieben wird: standardmäßig die Datei im Repository-Wurzelverzeichnis, mit `--file` die eines Ordners oder `.git/info/attributes` (nur dieser Klon). Eine Regel für dasselbe Muster wird neu geschrieben, nicht widersprochen. Die Antwort sagt, ob git die Pfade jetzt wirklich so behandelt (`effective`). Mit `gitpoulpi undo` rückgängig zu machen, außer bei `.git/info/attributes`"
"treat --kind" = "Als was git die Pfade behandeln soll"
"treat --paths" = "Repository-relative Pfade (Ordner mit `--folder`)"
"treat --extension" = "Benennt alle Dateien mit der Endung jedes Pfads (`*.ext`) statt der Datei selbst"
"treat --folder" = "Die Pfade sind Ordner: die Regel gilt für alles darunter"
"treat --file" = "Repository-relative `.gitattributes`-Datei zum Schreiben oder `.git/info/attributes` (Standard: die `.gitattributes` im Wurzelverzeichnis)"
convert = "Schreibt Kodierung, Zeilenenden oder Einrückung von Dateien im Arbeitsverzeichnis neu, mit den Funktionen des TUI-Editors und seines Menüs Konvertieren. Genau eine der Optionen `--encoding`, `--eol` und `--indent`. Binärdateien, fehlende Dateien und Dateien, die die Zielkodierung nicht darstellen kann, werden übersprungen und gemeldet, nie beschädigt. Ein Journaleintrag für den ganzen Stapel: `gitpoulpi undo` bringt alle Dateien zurück"
"convert --paths" = "Zu konvertierende Dateien, Pfade relativ zum Repository"
"convert --encoding" = "Die Zielkodierung, wie der Editor sie nennt (`UTF-8`, `UTF-8 BOM`, `UTF-16 LE`, `Windows-1252`, `ISO-8859-1`, `Shift_JIS`, ...)"
"convert --eol" = "Das Ziel-Zeilenende"
"convert --indent" = "Führende Leerzeichen als `spaces:<n>` oder Tabs als `tabs:<n>`, `<n>` ist die Breite eines Tabs (1-8)"
ui = "Zeigt dem Benutzer Dinge in seinem geöffneten GitPoulpi-Fenster: einen Commit, einen Diff an einer Zeile, eine Datei, eine Einstellungsseite. Nur Ansicht: nichts hier ändert das Repository oder tippt ins Fenster, außer `ui propose`, das einen vorausgefüllten Dialog zur Bestätigung durch den Benutzer öffnet (aus, außer bei `[mcp] allow_ui_propose = true`). Erfordert eine in der Sitzung geöffnete GitPoulpi-TUI"
"ui --launch" = "Wenn nirgends ein Fenster offen ist, öffnet eines mit dem konfigurierten Startbefehl (`[ui] launch` / `launch_command`; standardmäßig aus) und wartet bis zu 10 s, bis es sich verbindet. Ohne dieses Flag wird ein Fenster nur gestartet, wenn `[ui] launch` gesetzt ist UND `ui_control` `auto` ist"
"ui --viewer" = "An dieses Fenster senden (`ui viewers` listet sie auf), statt den Daemon wählen zu lassen"
"ui back" = "Macht die letzte Ansichtsänderung des Agenten rückgängig (stellt die vorherige Ansicht wieder her)"
"ui highlight" = "Färbt einen Zeilenbereich im Diff oder in der Datei ein, die das Fenster geöffnet hat"
"ui highlight --no_scroll" = "Den Bereich nicht in den sichtbaren Bereich scrollen"
"ui highlight --range" = "`A-B` oder `A:C-B:C` mit Spalten (ab 1)"
"ui notify" = "Zeigt dem Benutzer eine kurze Toast-Meldung"
"ui notify --message" = "Höchstens 200 Zeichen; Steuerzeichen werden entfernt"
"ui propose" = '''Schlägt dem Benutzer eine Änderung zur Bestätigung vor: ein Dialog öffnet sich vorausgefüllt, mit "Proposed by" markiert, und nichts passiert, bis der Benutzer dessen eigene Bestätigung drückt. Erfordert `[mcp] allow_ui_propose = true`. Die `proposal`-ID der Antwort in den `proposals` von `ui state` verfolgen'''
"ui propose branch" = "Öffnet das Feld „Neuer Branch“ mit eingetragenem Namen"
"ui propose branch --start_point" = "Wo der Branch beginnt (Standard: HEAD)"
"ui propose commit-message" = "Füllt Summary und Description des Commit-Composers aus; committet nie"
"ui propose resolution" = "Öffnet den Merge-Editor auf einer Konfliktdatei mit bereits eingetragener Lösung, damit der Benutzer sie prüft und mit Save & Mark Resolved bestätigt (sein Strg+S ist die einzige Bestätigung; hier wird nichts geschrieben oder gestaget). Die Wahl als `--pick` angeben oder die ganze Datei als `--content-file`"
"ui propose resolution --content_file" = "Der endgültige Dateitext, exakt (`-` liest die Standardeingabe)"
"ui propose resolution --path" = "Repository-relativer Pfad der Konfliktdatei"
