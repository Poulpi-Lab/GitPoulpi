"hosting review show" = "Liest einen Pull-/Merge-Request zum Prüfen: Beschreibung, Head- und Base-Commit, Merge-Status, Checks, was der Host bei einem Review erlaubt (`capabilities`) und seine geänderten Dateien. Der Diff selbst kommt aus dem Repository (`review fetch`, dann Diff von `refs/gitpoulpi/pr/<n>`)"
