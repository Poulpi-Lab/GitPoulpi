"flow issue" = "Vom Host gesteuerte Flows: ein Issue aus der Vorlage des Workflows anlegen, den Host oder einen Bot den Branch und den Merge Request erstellen lassen und beides dann aufgreifen. `issue new` legt das Issue an; `issue wait` fragt ab, was der Host erstellt hat"
