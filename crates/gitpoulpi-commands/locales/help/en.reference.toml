ai = "AI helpers (off unless `ai.enabled = true`): print a generated commit message, or explain a commit or the working changes"
"ai --print_sent" = "Print what would be sent to the model (the system and user text after secrets are redacted and sensitive files left out) and send nothing. Needs `ai.enabled = true`, but no key and no network"
"ai --send_all" = "Send every input whole, even over its `ai.limits.*` cap. Without it an input over a cap is truncated (a conflict is refused) and the answer says what was cut in `truncated: [{part, detail?, bytes, limit, setting}]`"
"commit --send_all" = "With `--ai`: send the whole diff even when it is over `ai.limits.diff_bytes`. Without it a larger diff is truncated and the answer says so (`truncated`)"
"hosting review suggest --send_all" = "Send every input whole, even over its `ai.limits.*` cap (the diff, a file's diff, the description, the existing comments, the context files). Without it an input over a cap is truncated and the answer says what was cut in `truncated`"
"stash push --send_all" = "With `--ai`: send the whole diff even when it is over `ai.limits.diff_bytes`. Without it a larger diff is truncated and the answer says so (`truncated`)"
"ai commit-message" = "Print the commit message the AI proposes for the staged changes (or every change when nothing is staged). Commits nothing"
"ai explain" = "Explain a commit (default HEAD) or, with --wip, the working changes"
"ai resolve-conflict" = "Print the resolution the AI suggests for ONE merge conflict of a conflicted file (`--conflict N`, 1-based; optional when the file has a single conflict). Prints only: nothing is written or staged, so the caller decides (`conflicts resolve --content-file` applies a whole-file result). Needs `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Which conflict of the file, 1-based"
"ai resolve-conflict --path" = "The conflicted file, relative to the repository root"
autostash = "The pending auto-stash: GitPoulpi stashed local changes to run a checkout, merge, rebase or pull and has not put them back"
"ai review-context" = "Show or set what a ✦ code review draft is given besides the diff (`[ai.review]`): the repository's CLAUDE.md and AGENTS.md, one more file (a path or a link), and whether a local agent runs in the repository. With neither `--repo` nor `--project` it is the global default; `--repo PATH` is one cloned repository's own value, `--project HOST/PROJECT` the one of a repository that is not cloned. Without a setting flag it prints the values (`effective` is what a review gets); with one it saves it and prints the result. Needs no model and works with AI turned off"
"ai review-context --agents_md" = "Give the model the repository's AGENTS.md"
"ai review-context --claude_md" = "Give the model the repository's CLAUDE.md"
"ai review-context --context_file" = "One more file: a path relative to the repository root, an absolute path, or a link to a file of a code host"
"ai review-context --no_context_file" = "No extra file"
"ai review-context --no_extra_file" = "No extra file for the repository or project, whatever the global value says (`on`, the default when given alone); `off` makes it follow the global value again"
"ai review-context --project" = "A repository that is not cloned, as `HOST/PROJECT` (`github.com/owner/name`)"
"ai review-context --reset" = "With `--repo` or `--project`: forget the repository's own values (it follows the global ones again) before applying the flags"
"ai review-context --run_in_repo" = "Run a local agent in the repository (`yes`), not there (`no`) or as its AI profile says (`profile`). Not for `--project`"
"autostash start-over" = "Start over: discard the working-tree changes on the stash's files (a copy is kept under `refs/gitpoulpi-backup/`), undo the operation that auto-stashed (pull, checkout, merge, rebase), then pop the stash on the original commit. Stops with the stash intact if any step fails. Exit code 1 when refused, 3 when it needs `--yes`"
"autostash start-over --dry_run" = "Show what would happen and change nothing"
"autostash start-over --yes" = "Go ahead; without it nothing changes and the exit code is 3"
blame = "Per-line attribution for a file at a revision"
"blame --at" = "Revision to blame (default: HEAD)"
"branch delete-remote" = "Delete a branch from a remote, keeping any local branch of that name"
"branch fast-forward" = "Move `<branch>` forward to `<target>`, only if that is a fast-forward (diverged history is refused, nothing moves). The checked-out branch takes its working tree along, like `git merge --ff-only`; any other branch just has its ref moved"
"branch fast-forward --target" = "Any revision (default: HEAD)"
"branch set-upstream" = "Make `<branch>` track `<upstream>` (`origin/main`)"
"branch track" = "Create a local branch tracking a remote-tracking branch and check it out. `<upstream>` is spelled as the refs listing spells it (`origin/feature/login`); `--name` defaults to the branch part"
"branch unset-upstream" = "Remove `<branch>`'s upstream"
"checkout --autostash" = 'Stash local changes that block this, run it, then pop the stash (what `general.auto_stash = "always"` does)'
"cherry-pick --commits" = "Commits to apply, in order. Omitted when `--plan` is given"
"cherry-pick --plan" = "A JSON `Vec<RebaseStep>` (same shape as `rebase --plan`; see `rebase-plan`), from a file path or `-` for stdin: the steps are cherry-picked in list order. Only the `Pick` and `Drop` actions make sense here (`Drop` skips the commit); any other action is refused. Cannot be combined with positional commits"
"clone --branch" = "Check out this branch instead of the remote's default HEAD"
"clone --depth" = "Truncate history to this many commits (`git clone --depth`)"
"clone --no_lfs" = "Leave Git LFS files as pointers instead of downloading their content after the clone"
"clone --origin" = "Name the new remote something other than `origin`"
"clone --recurse_submodules" = "Clone submodules too"
"commit --ai" = "Let the AI write the message from the staged diff, using the repository's Commit message instructions (Settings > AI). Needs `ai.enabled = true` and a configured profile"
"commit --message" = "The commit message. Required unless --ai writes it"
"commit --no_verify" = "Skip the commit hooks (`pre-commit`, `commit-msg`), like `commit --no-verify`"
completions = "Prints a shell completion script to stdout (bash, zsh, fish, powershell or elvish), e.g. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Abort the operation in progress: HEAD, the index and the working tree return to before it. Throws away the resolutions made since"
"conflicts skip" = "Skip the cherry-pick or revert in progress (or the commit a rebase is stopped at): HEAD, the index and the working tree return to HEAD. The way out of one that became empty (the change is already applied). A merge has nothing to skip"
"conflicts check" = "Would a merge of HEAD into the branch it started from conflict, and on which files? Nothing is touched (an in-memory merge). The base is the target of the branch's known pull request, else the branch the Base branches patterns allow with the fewest commits since the fork. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Off when `general.conflict_detection` or the repository's switch is off"
"conflicts list" = "The conflicted files, each with the text of its three sides. With `--names-only`: just the path, the kind of conflict and the stage oids (no blob is read; cheap on a big merge)"
"conflicts resolve" = 'Resolve one file and stage it (the file stops being conflicted). Exactly one of `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` or `--delete`. A and "ours" are the current side (`HEAD`; during a rebase, the branch being rebased onto), B and "theirs" the incoming side. Never edit conflict markers by hand: pick, or write the final text to a file'
"conflicts resolve --both" = "Keep both sides of every conflict (A then B), and git's own merge everywhere else"
"conflicts resolve --content_file" = "The final file text, exactly (`-` reads standard input)"
"conflicts resolve --delete" = "Accept the deletion: remove the file (`git rm`)"
"conflicts resolve --encoding" = "With `--content-file`: write the text in this encoding (a WHATWG label such as `windows-1252`) instead of UTF-8"
"conflicts resolve --expect" = "The stage oids the decision was made against, `base,ours,theirs` (use `-` for a missing stage). The call is refused as `stale` when the index no longer holds exactly these. `--both` and `--pick` always check the stages they read"
"conflicts resolve --no_stage" = "Write the working tree file but leave it conflicted (a plain save)"
"conflicts resolve --ours" = "Same as `--side ours`"
"conflicts resolve --pick" = "A choice per conflict number: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = both in that order). Every conflict needs one, unless `--default` covers the rest"
"conflicts resolve --pick_default" = "With `--pick`: the choice for every conflict not listed"
"conflicts resolve --side" = "Take the whole file from one stage, no auto-merge"
"conflicts resolve --theirs" = "Same as `--side theirs`"
"conflicts resolve --theirs_first" = "With `--both`: B then A"
"conflicts show" = "One conflicted file as the merge editor sees it: the pane labels, the three sides and the numbered conflict regions (`--json` is the full document). Merged regions git settled by itself are not listed; they stay in the result of `resolve --both`/`--pick`"
"conflicts show --conflict" = "Only conflict N (1-based)"
"conflicts state" = "The merge, rebase, cherry-pick or revert in progress (`null` when none)"
"conflicts unresolve" = "Put a file resolved during this operation back to conflicted (markers again). Refused when it is still conflicted or was not resolved while the operation ran"
daemon = '`gitpoulpi server ...` is a visible alias - the owner calls this group "the server" and types `gp server stop`'
"daemon restart" = "`daemon stop` followed by `daemon start`"
"daemon run" = "Runs this session's daemon in the foreground (blocks; Ctrl-C to stop, or a `daemon stop`/`daemon restart` sent from elsewhere). This is what `daemon start` spawns detached, and what a dedicated terminal can also run directly"
"daemon start" = "Starts this session's daemon as a detached background process (or reports it as already running). `--backend` pins the backend the spawned process is told to use; omitted, the spawned process resolves `general.default_backend` itself"
"daemon status" = "Whether this session's daemon is listening, and if so its port, PID, uptime, backend and build version"
"daemon stop" = "Asks this session's daemon to shut down gracefully, falling back to killing its recorded PID only if it doesn't answer in time and only if it is a standalone daemon (never one embedded in a running TUI)"
"daemon stop --all" = "Stop every session's daemon that `session list` reports a port file for, not just this one"
discard = "Throw away a file's *unstaged* changes in the working tree: one hunk (`--hunk`), some of its lines (`--hunk --lines`), or - with `--file` alone - every uncommitted change to the file, staged ones included (an untracked file is deleted). Hunks and lines are numbered as `gitpoulpi diff --json` numbers the unstaged diff. Everything it throws away is kept in a safety snapshot, so `gitpoulpi undo` brings it back (untracked files included). Not confirmed: this is the scripting surface"
"discard --lines" = "Comma-separated line indices within `--hunk`"
"fetch --all" = "Fetch every configured remote"
"fetch --prune" = "Drop remote-tracking branches the remote no longer has"
"fetch --prune_tags" = "Also delete the local tags the remote has deleted (only tags that were on it: a tag never pushed is left alone). Git's `fetch.pruneTags`, narrower; off unless asked"
"fetch --remote" = "Omitted: the repository's default remote (see `remote default`)"
"file-history" = "The commits that changed a file, newest first, following renames (the path at each commit, change kind and line counts)"
"file-history --at" = "Revision to start from (default: HEAD)"
"file-history --limit" = "Entries per page; `more` in the answer says whether older ones exist"
"file-history --skip" = "Entries to skip (page n is `--skip <n*limit> --limit <limit>`)"
gitpoulpi = "Lightweight cross-platform TUI Git client, scriptable via CLI/MCP."
"gitpoulpi --add" = "Open a folder as a new tab of the GitPoulpi that is already running, instead of starting another one (`gp -a`, `gp --add ../other`). PATH defaults to the current directory and resolves to its enclosing repository. One running session: it gets the tab and its window comes forward when the desktop allows it. Several: you pick one from a numbered list (or pass `--session NAME`). None: GitPoulpi starts normally, on that folder. Takes no subcommand; with `--json` it prints one object (`action` is `joined` or `cancelled`), exit code 0 when the tab is open, 3 when a busy window offered it on its status line chip"
"gitpoulpi --no_raise" = "With `--add`: do not ask the window to bring its terminal forward"
"gitpoulpi --backend" = "Which `GitBackend` this command's daemon runs on, overriding `general.default_backend` in config.toml and `GITPOULPI_GENERAL_DEFAULT_BACKEND` (flags are the top of the precedence ladder - see docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
Which `GitBackend` this command's daemon runs on, overriding `general.default_backend` in config.toml and `GITPOULPI_GENERAL_DEFAULT_BACKEND` (flags are the top of the precedence ladder - see docs/user/config-reference.md).

It selects the backend for a daemon this command *starts*. A session whose daemon is already running keeps the backend that daemon was built with; `gitpoulpi` has no way to swap a live daemon's backend out from under the clients already subscribed to it, and pretending otherwise would be the same silent no-op this flag exists to avoid."""
"gitpoulpi --cwd_file" = """File the TUI writes the active tab's folder to when it quits ("Quit and cd here", or always with `ui.tab_dir_follow = "auto"`). Meant for the wrapper `gitpoulpi shell-init` prints; ignored by every subcommand, since only the TUI has tabs"""
"gitpoulpi --json" = "Emit structured JSON instead of human-readable output"
"gitpoulpi --lang" = "Language of the `--help` text (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
Language of the `--help` text (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Only explanations are translated - command and flag names never change - and `--help` stays English unless this is given (the environment is deliberately ignored, so scripts get stable output). Example: `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Repository to act on. Defaults to the repository enclosing the current directory, so `gitpoulpi status` behaves like `git status`; an agent driving several repos passes this instead of chdir-ing"
"gitpoulpi --session" = "Named session to target. Omitted, it is derived from the current repository's root (see `gitpoulpi_config::default_session_name`), so two repositories get two independent daemons while everything opened inside one repository shares one. Pass this to force two repositories onto one session, or to name a session explicitly. The value is sanitised before use - it becomes a filename"
"hosting checkout-pr" = "Checks out a pull/merge request, including one from a fork: fetches its head (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) into the local branch `pr/<n>` (`mr/<n>` on GitLab), tracking it, and switches to it"
"hosting checkout-pr --id" = "Which integration (see `hosting prs`)"
"hosting checkout-pr --no_checkout" = "Only fetch and create/update the branch; stay where you are"
"hosting checkout-pr --number" = "The PR number (GitHub) or MR `iid` (GitLab)"
"hosting checkout-pr --remote" = "The remote the request lives on. Defaults to the one the project was resolved from, else the repository's default"
"hosting clone" = "Clones a project from `projects` by its full path, resolving the clone URL through the host rather than making the user paste one"
"hosting clone --https" = "Clone over HTTPS rather than SSH"
"hosting clone --project" = "The project's full path, as `hosting projects` prints it"
"hosting edit-url" = "Prints the URL where a pull/merge request is edited (GitLab's `.../edit` view; GitHub edits in place on the request's page). With a number, that request; otherwise the one for `--branch` (default: the checked-out branch). Follows the repository's pull/merge request link like `prs`. Launches the browser only with `--open`"
"hosting edit-url --branch" = "Find the request by its source branch instead"
"hosting edit-url --number" = "The request's number (`53` for `!53` / `#53`)"
"hosting edit-url --open" = "Also open the URL in the system browser"
"hosting file" = "Reads one file of a project at a revision from the host's API, with no clone: text as is, other bytes as base64 (`encoding`). Exit 1 and an error when the file does not exist at that revision"
"hosting file --id" = "Which integration (see `hosting list`); optional when only one is configured"
"hosting file --path" = "The path inside the project, like `CLAUDE.md` or `src/main.rs`"
"hosting file --project" = "The project: `owner/name` on GitHub, `group/sub/project` on GitLab"
"hosting file --rev" = "The revision: a branch, tag or commit. Defaults to the project's default branch"
"hosting integrations" = "Manages the configured integration profiles (`[[integrations]]`)"
"hosting integrations add" = "Adds a profile of any kind that has a client"
"hosting integrations add --id" = "Defaults to the kind's name (`gitlab`, `gitlab-2`, ...)"
"hosting integrations add --kind" = "`github`, `github_enterprise`, `gitlab`, `gitlab_self_managed`, `azure_devops`, `azure_devops_server`, `bitbucket`, `jira_cloud`, `jira_data_center`, `trello`, `gitea`, `forgejo`, `linear`, `youtrack`, `redmine`, `gerrit` or `local_markdown`"
"hosting integrations add --name" = "Display name"
"hosting integrations add --url" = "The instance's web root. Required for the self-managed kinds and Jira"
"hosting integrations list" = "The configured profiles, without their tokens"
"hosting integrations radar" = "Shows or changes a profile's Radar settings (`[integrations.radar]`): which account-wide lists `hosting radar` and the Radar fetch, the namespaces to search and what a review of a request that is not cloned does. With no option it only prints the current settings"
"hosting integrations radar --assigned_issues" = "Open issues assigned to you, every repository"
"hosting integrations radar --clear_namespaces" = "Forget the saved namespaces: your own plus every membership"
"hosting integrations radar --id" = "The profile"
"hosting integrations radar --include_drafts" = "Keep draft requests in the account lists"
"hosting integrations radar --namespaces" = "A namespace (org, group) to search for open requests; repeat the flag or comma-separate. Replaces the saved list"
"hosting integrations radar --open_requests" = "Every open request of your namespaces"
"hosting integrations radar --review_mode" = "What reviewing a request that is not cloned does"
"hosting integrations radar --review_requests" = "Requests waiting for your review, every repository"
"hosting integrations remove" = "Removes a profile and deletes its stored token"
"hosting integrations test" = "Checks the profile's token against its host: user, scopes, expiry"
"hosting issue" = "Creates issues on the current repository's linked project"
"hosting issue create" = "Opens an issue on the project the repository's ISSUES source is linked to (`hosting link issues`), or the one `--id` resolves from the remote. Outward action: it posts to the host"
"hosting issue create --body" = "The issue description"
"hosting issue create --body_file" = "Read the description from this file (`-` reads stdin)"
"hosting issue create --id" = "Which integration (see `hosting issues`)"
"hosting issue create --labels" = "A label to apply; repeat the flag or comma-separate"
"hosting issue create --title" = "The issue title"
"hosting issue create --web" = "Print the host's own prefilled new-issue page instead of calling its API (needs no token)"
"hosting issues" = "Issues of the current repository's project"
"hosting issues --assigned" = "Only those assigned to you"
"hosting board --id" = "Which integration (see `hosting issues`)"
"hosting board move --column" = "The column's name, as `hosting board` prints it"
"hosting board move --id" = "Which integration (see `hosting issues`)"
"hosting board move --reference" = "The card: its number or its own reference (`12`, `#12`, `ABC-12`, `AB#12`)"
"hosting board move" = "Moves a card to a column: a status change, a workflow transition (Jira), a work item state (Azure DevOps), a list (Trello) or a label swap (GitHub, GitLab, Gitea, Forgejo). A move the provider has no path for is refused with the reason. Outward action: it writes to the host"
"hosting board show --id" = "Which integration (see `hosting issues`)"
"hosting board show" = "The board's columns, each with its cards. Read-only"
"hosting board" = "The issue board of the current repository's linked project: its columns with their cards, the same columns as the TUI board (a status, a list or a label per column). Without a subcommand, the same as `board show`"
"hosting link" = "Links this repository's pull/merge request list or issue list to a provider profile and one of its repositories, or unlinks it (with no flag, shows the link). Nothing is fetched by `prs` / `issues` until a source is linked; the same link the TUI's sidebar sections save (`pulls_source` / `issues_source` in `.gitpoulpi/repo-state.toml`)"
"hosting link --clear" = "Unlinks the list: nothing is fetched until it is linked again"
"hosting link --id" = "The profile to link. With no `--project`, the repository its remotes name on that profile's host is used"
"hosting link --kind" = "Which list"
"hosting link --project" = "The provider's repository (`owner/name`, `group/sub/proj`)"
"hosting list" = "The configured integrations, without their tokens"
"hosting login" = "Validates a token and stores it under the profile's `token_ref`, caching who it belongs to. The token is read from stdin (`--token-stdin`), never from an argument, so it stays out of shell history. Not exposed over MCP: a secret must not pass through an agent's tool-call transcript"
"hosting login --id" = "Which integration. Optional when only one is configured"
"hosting login --token_stdin" = "Read the token from stdin (required; one line, trailing newline ignored)"
"hosting logout" = "Deletes the profile's stored token and forgets the connected user; the profile itself stays"
"hosting open" = "Prints the web URL of a pull request or issue of the current repository's project. Launches the system browser only with `--browser`"
"hosting open --browser" = "Also open the URL in the system browser"
"hosting pr" = "Opens a pull request (GitHub, Gitea, Forgejo, Bitbucket, Azure DevOps) or merge request (GitLab) from a branch of the current repository"
"hosting pr --id" = "Which integration (`[[integrations]] id`). Optional when only one is configured"
"hosting pr --source" = "The branch to open it from. Defaults to the checked-out branch"
"hosting pr --target" = "The branch to open it against. Defaults to the remote's default branch when it can be told, else `main`/`master` when one of those exists"
"hosting pr --title" = "Defaults to the source branch's tip commit's subject line"
"hosting pr --web" = "Print the compare/new-request URL instead of calling the host's API. Also what happens automatically with no integration configured for this remote, or no token for it"
"hosting pr-for-branch" = "The pull/merge request that best represents a branch (open, then draft, then merged, then closed; newest first)"
"hosting pr-for-branch --branch" = "Defaults to the checked-out branch"
"hosting projects" = "Every project the integration's token can see"
"hosting projects --filter" = "Case-insensitive substring over the project path"
"hosting projects --id" = "Which integration (`[[integrations]] id`). Optional when only one is configured"
"hosting prs" = "Pull/merge requests of the current repository's project"
"hosting prs --id" = "Which integration. Without it the repository's linked pull/merge request source is used (see `hosting link`); an unlinked repository fetches nothing. With it, the project this repository's remote names on that profile"
"hosting prs --mine" = "Only those you opened"
"hosting prs --review_requested" = "Only those awaiting your review"
"hosting prs --state" = "`open` (default), `closed` (includes merged) or `all`"
"hosting radar" = "The account-wide lists for the Radar: the requests waiting for your review, every open request of your namespaces and the issues assigned to you, across all repositories of each profile (GitHub, GitLab, Gitea, Forgejo, Azure DevOps, Bitbucket Data Center, Gerrit), cloned or not. Without `--what`, each profile's `[integrations.radar]` settings decide (see `hosting integrations radar`); the answer is reused for five minutes unless `--refresh`. Read-only"
"hosting radar --ids" = "Which profile; repeat the flag for several. Without it, every enabled profile of a supported kind"
"hosting radar --include_drafts" = "Keep draft requests too"
"hosting radar --refresh" = "Ask the host even when a recent answer is cached"
"hosting radar --what" = "What to list, whatever the profile's settings say: `review` (waiting for your review), `open` (every open request), `issues` (assigned to you) or `all`"
"hosting review comment --project" = "Review a project that is not the current repository (no clone needed): `owner/name` on GitHub, `group/sub/project` on GitLab. `--id` then names the integration, if several are configured"
"hosting review diff" = "The diff of a pull/merge request, file by file with its hunks (`files[].diff.hunks`). In a repository it fetches the request's refs and diffs them locally; with `--api`, or with `--project` (no repository), it reads the diff from the host's API instead, which needs no clone. A file whose patch the host left out (too big) has `omitted` set and no hunks"
"hosting review diff --api" = "Read the diff from the host's API even inside a clone"
"hosting review diff --file" = "Only this file's diff"
"hosting review diff --id" = "Which integration (see `hosting prs`)"
"hosting review diff --number" = "The PR number (GitHub) or MR `iid` (GitLab)"
"hosting review diff --project" = "Review a project that is not the current repository (no clone needed): `owner/name` on GitHub, `group/sub/project` on GitLab. `--id` then names the integration, if several are configured"
"hosting review diff --remote" = "The remote the request lives on (local diff only). Defaults to the one the project was resolved from, else the repository's default"
"hosting review reply --project" = "Review a project that is not the current repository (no clone needed): `owner/name` on GitHub, `group/sub/project` on GitLab. `--id` then names the integration, if several are configured"
"hosting review resolve --project" = "Review a project that is not the current repository (no clone needed): `owner/name` on GitHub, `group/sub/project` on GitLab. `--id` then names the integration, if several are configured"
"hosting review show --project" = "Review a project that is not the current repository (no clone needed): `owner/name` on GitHub, `group/sub/project` on GitLab. `--id` then names the integration, if several are configured"
"hosting review submit --project" = "Review a project that is not the current repository (no clone needed): `owner/name` on GitHub, `group/sub/project` on GitLab. `--id` then names the integration, if several are configured"
"hosting review suggest --agents_md" = "Give the model the repository's AGENTS.md, for this run"
"hosting review suggest --claude_md" = "Give the model the repository's CLAUDE.md (read at the branch the request targets), for this run"
"hosting review suggest --context_file" = "One more file for this run: a path relative to the repository root, an absolute path, or a link to a file of a code host"
"hosting review suggest --no_context_file" = "No extra file for this run, whatever the defaults say"
"hosting review suggest --project" = "Review a project that is not the current repository (no clone needed): `owner/name` on GitHub, `group/sub/project` on GitLab. `--id` then names the integration, if several are configured"
"hosting review suggest --run_in_repo" = "Run a local agent in the repository (`yes`), not there (`no`) or as its AI profile says (`profile`), for this run. Not with `--project` (there is no checkout)"
"hosting review threads --project" = "Review a project that is not the current repository (no clone needed): `owner/name` on GitHub, `group/sub/project` on GitLab. `--id` then names the integration, if several are configured"
"hosting ssh-key" = "Generates an ed25519 key pair and uploads the public half"
"hosting ssh-key create" = "Generates a new pair and uploads the public half. Refuses to overwrite an existing key file"
"hosting ssh-key create --no_upload" = "Generate the pair but do not send it anywhere"
"hosting ssh-key create --path" = "Where to write the private key. Defaults to `~/.ssh/id_ed25519`"
"hosting ssh-key create --title" = "The name the key appears under on the host. Defaults to `gitpoulpi@<hostname>`"
"hosting ssh-key delete" = "Removes a public key from the account on the host (by the id `ssh-key list` reports). Local key files are left alone"
"hosting ssh-key delete --id" = "Which integration"
"hosting ssh-key delete --key_id" = "The host's id of the key"
"hosting ssh-key list" = "The public keys already on the account"
"hosting use" = "Pins which integration profile answers for the current repository (or, with neither flag, shows what is in force)"
"hosting use --clear" = "Removes the pin, going back to resolving by remote host"
"hosting use --id" = "The profile to pin"
"hosting assignment" = "Shows, blocks or allows assigning people in the current repository's issues and pull requests (with neither flag, shows what is in force). Blocked: every assignment is refused (exit code 2, reason `assignment_blocked`), whatever the surface; existing assignees stay visible. Only a person can allow again"
"hosting assignment --allow" = "Allow assignment again (a person only)"
"hosting assignment --block" = "Refuse every assignment in this repository"
ignore = "Append a pattern to a `.gitignore` (the repository's root one by default). Does nothing when the pattern is already a line of it. Undoable with `gitpoulpi undo`, which puts the file back as it was (or removes it when it did not exist)"
"ignore --file" = "Repo-relative `.gitignore` to append to (default `.gitignore`)"
"ignore --pattern" = "The line to add, e.g. `*.log`, `/build` or `docs/tmp/`"
lfs = "Git LFS: large files stored outside the repository's history. Needs the `git-lfs` program for anything that moves or converts files; `status` and `files` work without it"
"lfs fetch" = "Download LFS objects into the local store (`git lfs fetch`), leaving the working tree alone"
"lfs fetch --all" = "Every ref, not only the current one"
"lfs fetch --remote" = "Omitted: the repository's default remote (see `remote default`)"
"lfs files" = "The LFS pointer files in the index (or at `--at`), with whether each real object is in the local LFS store"
"lfs files --at" = "Revision to list (default: the index)"
"lfs install" = "Set up the LFS filters and hooks (`git lfs install`), for this repository only unless `--user`"
"lfs install --user" = "Install into the user's global git config instead of this repository"
"lfs lock" = "Lock a file so nobody else can change it until you unlock it"
"lfs lock --remote" = "Omitted: the repository's default remote"
"lfs locks" = "The LFS file locks on the server: who holds which file. Needs a server with locking (GitHub, GitLab, Gitea, ...); uses the remote's own credentials"
"lfs locks --remote" = "Omitted: the repository's default remote"
"lfs prune" = "Delete old, already-pushed objects from the local LFS store"
"lfs pull" = "Download LFS objects and replace the pointer files in the working tree with the real content (`git lfs pull`)"
"lfs pull --remote" = "Omitted: the repository's default remote"
"lfs checkout" = "Write the real content of the LFS pointer files in the working tree from the local LFS store (`git lfs checkout`). Offline"
"lfs checkout --paths" = "Only these paths (relative to the repository root); omitted: every pointer in the working tree"
"lfs push" = "Upload LFS objects (`git lfs push`)"
"lfs push --all" = "Every ref, not only the current branch"
"lfs push --remote" = "Omitted: the repository's default remote"
"lfs status" = "Is `git-lfs` installed, does this repository use LFS, which patterns are tracked, are the filters and the hook installed. Never fails because `git-lfs` is missing: the answer says so"
"lfs track" = "Route file patterns through LFS (`git lfs track`). Edits `.gitattributes` and leaves it unstaged"
"lfs track --lockable" = "Make the files read-only until locked"
"lfs track --renormalize" = "Also re-stage already-committed files that match, so their next commit stores pointers (history is not rewritten)"
"lfs unlock" = "Release a lock. Someone else's lock needs `--force`, which breaks it"
"lfs unlock --force" = "Break a lock held by someone else"
"lfs unlock --remote" = "Omitted: the repository's default remote"
"lfs untrack" = "Stop routing patterns through LFS (`git lfs untrack`)"
"log --count" = "Print only how many commits the walk holds (`{\"total\": N}`), ignoring `--limit` and `--skip`: what the TUI's status line shows after the slash. Counts without loading any commit"
"log --path" = "Only commits touching this path (repeatable) - `git log -- <path>`. This is the File History view's query"
"log --skip" = "Drop the first N commits of the walk before applying `--limit`. With `--limit` this pages history: page `n` is `--skip <n*limit> --limit <limit>`, and the pages tile the walk exactly (contract-checked by `check_log_skip_pages_history`)"
"log --format" = "Render the commits as another format. `mermaid` prints a Mermaid `gitGraph` script (paste it into a Markdown file, a PR or mermaid.live); with `--json`, `{format, detail, commits, text}`. The commits are `--range`, else the first `--limit` (default 30) of the walk"
"log --detail" = "Mermaid detail level: `structure` (commits, branches, merges), `refs` (+ branch names, tags, HEAD), `subjects` (+ commit subjects) or `full` (+ author and date). Default: `ui.mermaid_detail` (`refs`)"
"log --orientation" = "Mermaid graph direction. Default: `ui.mermaid_orientation` (`lr`)"
"log --fence" = "Wrap the Mermaid script in a ```mermaid fence"
"log --range" = "Mermaid: the commits `A..B` (reachable from B, not from A), like `git log A..B`; a bare `A` means `A..HEAD`"
"log --subject_width" = "Mermaid: cut commit subjects to this many characters. Default: `ui.mermaid_subject_width` (40)"
"mcp serve --allow_remote" = "Allow `--http` on a non-loopback address. Refused unless `[mcp] http_auth` is on with a token in place and the traffic is encrypted (`[mcp] tls`, or `behind_proxy` for a tunnel or reverse proxy you vouch for); `ssh -L` to a loopback endpoint is safer"
"mcp serve --bind" = "Address for `--http` (same as `--http ADDR`; wins over it)"
"mcp serve --http" = "Listen address for streamable HTTP, e.g. 127.0.0.1:8808 (endpoint `/mcp`); without an address, `[mcp] bind` (default 127.0.0.1:8808). Requests need the bearer token (`mcp token`) unless `[mcp] http_auth` is off. Loopback only unless `--allow-remote`"
"mcp serve --ui_control" = "How far the agent may move the user's window with the `ui_*` tools: `ask` (default: the window shows a chip the user confirms), `auto` or `off`. Overrides `[mcp] ui_control`"
"mcp token" = "The bearer token of the HTTP endpoint (`mcp serve --http`): shows it masked as JSON `{token_hint, path, rotated}`, creating it on first use. A client sends it as `Authorization: Bearer <token>`. Not an MCP tool: an agent never reads or rotates its own key"
"mcp token --copy" = "Copy the full token to the clipboard through the terminal (OSC 52), without printing it"
"mcp token --rotate" = "Replace the token with a new one; clients holding the old one are refused at once"
"mcp token --show" = "Print the full token too, for you to paste into a client's configuration"
"merge --autostash" = 'Stash local changes that block this, run it, then pop the stash (what `general.auto_stash = "always"` does)'
"merge --ff" = "Fast-forward when the branch allows it, a merge commit otherwise (git's default). Overrides `git.merge_fast_forward` for this merge"
"merge --ff_only" = "Fast-forward only: refuse when the branch has diverged. Overrides `git.merge_fast_forward` for this merge"
"merge --no_ff" = "Always make a merge commit, even when a fast-forward is possible. Overrides `git.merge_fast_forward` for this merge"
"merge --squash" = "Squash the branch's commits: stage their changes and make no merge commit (`merge --squash`), so a `commit` follows. The Merge behavior setting's Squash mode. Not undoable: nothing moved, discard the staged changes to back out"
patch = "Write a patch file, or apply one to the working tree"
"patch apply" = "Apply a patch file to the working tree"
"patch create" = "Write a patch file. `<revs>` are one or more commits (oldest-first) to turn into a patch each; combine with `--range a..b` instead to cover every non-merge commit in a range; combine with `--wip` instead to patch the working tree's current changes (staged and unstaged), optionally limited to `<paths>`"
"patch create --revs" = "Commit revisions (oldest-first) with no `--range`/`--wip`; with `--wip`, paths to limit the patch to (empty means every changed file); ignored with `--range`"
"pull --autostash" = 'Stash local changes that block this, run it, then pop the stash (what `general.auto_stash = "always"` does)'
"pull --mode" = "How to integrate: `merge` (fast-forward if possible), `ff-only` or `rebase`. Always passed to git explicitly"
"pull --remote" = "Pull the same-named branch from this remote instead of the branch's upstream"
"push --branch" = "The local branch to push; the checked-out one when omitted"
"push --force_with_lease" = "Overwrite the remote branch, only if it is where our last fetch saw it. There is no plain `--force`"
"push --remote" = "Omitted: the repository's default remote (see `remote default`)"
"push --set_upstream" = "Record `<remote>/<branch>` as the branch's upstream"
"rebase --abort" = "Abort a rebase in progress, restoring the branch and HEAD"
"rebase --autosquash" = "Reorder `--plan`'s steps with `git rebase --autosquash`'s algorithm first; with no `--plan`, run a plain `git rebase -i --autosquash`"
"rebase --autostash" = 'Stash local changes that block this, run it, then pop the stash (what `general.auto_stash = "always"` does)'
"rebase --continue_" = "Resume a rebase stopped by a conflict or an `edit` step"
"rebase --interactive" = "Run `git rebase -i`. Without `--plan`, only `--autosquash` alone is meaningful (there is no interactive editor here); combine with `--plan` for an explicit todo list"
"rebase --onto" = "The branch/commit to rebase onto, or (with `--plan`) the upstream the plan's range starts after. Omitted with `--root` or one of `--continue`/`--skip`/`--abort`/`--status`"
"rebase --onto_commit" = "Replay onto this commit instead of the upstream itself (`git rebase --onto`)"
"rebase --plan" = "A JSON `Vec<RebaseStep>` plan (see `rebase-plan`), from a file path or `-` for stdin"
"rebase --root" = "Rebase the whole history (`--root`) instead of a range after `onto`/an explicit upstream"
"rebase --skip" = "Skip the commit a rebase is stopped at"
"rebase --status" = "Report the rebase currently in progress, if any"
rebase-plan = "The range an interactive rebase from `upstream` (or the whole history, with `--root`) would replay, oldest first - material to build a `rebase --plan` JSON file from"
redo = "Redo the operation `undo` just took back, to the exact state recorded (it never re-runs the operation). Exit code 2 when refused"
"redo --dry_run" = "Show what would happen and change nothing"
"redo --expect" = "Only redo if this is still the latest undone entry"
"redo --yes" = "Go ahead when the redo is risky; without it exit code 3"
"refs hide" = """Hide refs from the commit graph (the TUI's "Hide"): the per-repo display filter in `repo-state.toml`, which an open TUI follows live. Names are spelled as the refs listing spells them (`feature/x`, `origin/main`, a tag name)"""
"refs hide --clear" = "Un-hide every hidden ref and remote (in addition to any named)"
"refs hide --names" = "Refs to hide"
"refs hide --remote" = "Remotes to hide as a whole (names as `remote list` spells them)"
"refs hide#long" = """
Hide refs from the commit graph (the TUI's "Hide"): the per-repo display filter in `repo-state.toml`, which an open TUI follows live. Names are spelled as the refs listing spells them (`feature/x`, `origin/main`, a tag name).

`--remote <name>...` hides a whole remote (every branch of it, the ones fetched later too): the way to look at one history without the history of a separate archive remote."""
"refs show" = "Show refs again: removes them from the hidden and solo sets"
"refs show --clear" = "Reset the whole filter: nothing hidden (remotes included), nothing soloed"
"refs show --names" = "Refs to show again"
"refs show --remote" = "Remotes to show again"
"refs show#long" = """
Show refs again: removes them from the hidden and solo sets.

`--remote <name>...` shows a whole remote again, with every branch of it that was hidden one by one."""
"refs solo" = "Show only these refs (and what they reach) in the commit graph"
"refs solo --clear" = "Un-solo every soloed ref (in addition to any named)"
"refs solo --names" = "Refs to solo"
"remote add --push_url" = "A separate URL to push to"
"remote clear-push-url" = "Remove the separate push URL, so pushes use the fetch URL again"
"remote default" = "Show the repository's default remote, or set it with a name"
"remote set-url" = "Set the fetch URL, or with `--push` the separate push URL"
repo = "Opening, inspecting and remembering repositories - the multi-repository surface. See `gitpoulpi repo --help`"
"repo close" = "Closes a repository's tab in this session. The repository itself is untouched"
"repo discover" = "Is this path in a git repository, and where is its root? Goes through `GitBackend::discover`, so it answers exactly what the TUI's open-repository flow would"
"repo discover --path" = "Defaults to the current directory"
"repo init" = "Creates a repository at `path` and opens it as a tab of this session. Goes through `GitBackend::init`, so it produces exactly the repository the TUI's Create form would"
"repo init --bare" = "A repository with no working tree"
"repo init --initial_branch" = "The branch the first commit lands on. Defaults to `general.default_branch_name`; empty leaves git's own"
"repo list" = "The tabs open in this session, active one flagged"
"repo open" = "Opens a repository as a tab of this session, and records it in the recent list. Prints what was opened; it does not launch a UI"
"repo recent" = "The recently-opened repositories, newest first"
"repo recent --forget" = "Forget one entry"
"repo recent --prune" = "Drop entries whose directory is gone from disk"
revert = "Undo a commit with a new commit that applies the inverse change"
"revert --commit" = "The commit to revert (any revision: a sha, `HEAD~2`, ...)"
"revert --mainline" = "For a merge commit: the number (1-based) of the parent that stays the mainline, as `git revert -m`. `1` is the branch the merge was made on. Required to revert a merge commit"
reword = "Give a commit of the current branch a new message (its descendants are re-created on top; index and working tree are left alone). A pushed commit then needs a force push"
"reword --commit" = "The commit to edit (any revision: a sha, `HEAD~2`, ...)"
"reword --message" = "The full new message (summary, blank line, body)"
amend = "Change the properties of a commit on the current branch: message, author name, email and date, committer name, email and date (any subset; what you leave out is kept). Its descendants are re-created on top with their own authors; index and working tree are left alone. Undoable; a pushed commit then needs a force push"
"amend --author_date" = "Raw git date (`1700000000 +0100`) or ISO 8601 (`2001-02-03T04:05:06+05:30`)"
"amend --author_email" = "The new author email"
"amend --author_name" = "The new author name"
"amend --commit" = "The commit to change (any revision: a sha, `HEAD~2`, ...)"
"amend --committer_date" = "Same formats as --author-date (default: now)"
"amend --committer_email" = "The new committer email (default: yours)"
"amend --committer_name" = "The new committer name (default: yours)"
"amend --description" = "Only the body (what follows the summary): the summary is kept. An empty value removes the body"
"amend --message" = "The full new message (summary, blank line, body)"
"amend --summary" = "Only the summary (first line): the body is kept"
rm-file = "Delete files (or directories) from the working tree; the index is untouched, so a tracked file shows as a deleted change. Undoable with `gitpoulpi undo`, which restores the exact bytes"
"rewrite apply --target" = "The folder of the new repository when the plan extracts a subdirectory as a clone or a submodule (see `--extract-mode`)"
"rewrite maps" = "The run's `commit-map` and `ref-map` (git-filter-repo's format: a header line, then `old new` per line; GitLab's repository cleanup takes the commit map). Prints their paths, or copies them to `--out`"
"rewrite maps --out" = "Copy both files into this directory (created when missing)"
"rewrite maps --run" = "The run id; `latest` (default) is the most recently applied run"
"rewrite note" = "The note to send to the people who have the old history: per pushed branch and tag the old and new tip and what to run (`git fetch`, then `git reset --hard origin/<branch>` or `git rebase --onto`). Reads only"
"rewrite note --run" = "The run id; `latest` (default) is the most recently applied run"
"rewrite preview --extract" = "Path rule: keep only this subdirectory, which becomes the root; the commits that do not touch it are dropped and merges are simplified. Asked each time: give `--extract-mode`, else the exit code is 3 and nothing is previewed. The extraction runs before the other path flags"
"rewrite preview --extract_mode" = "How `--extract` ends up: `clone` (a new local clone in `--target`, the original is not touched; every local branch and tag), `in-place` (this repository's history is rewritten, one undo entry) or `submodule` (the clone as in `clone`, and one new commit on the current branch replaces the folder by a submodule of it; this history is kept)"
"rewrite preview --into_subdir" = "Path rule: move the whole repository into this subdirectory in every commit (to merge repositories without path clashes)"
"rewrite preview --move_paths" = "Path rule `FROM=TO`: rename a file or folder in every commit, the same blobs and trees at the new path (repeatable, in order, after the content rules). A commit where `TO` already exists is not changed: the preview is refused (exit code 2, `path_collision`) and lists the commits and paths"
"rewrite preview --target" = "The folder of the new repository for `--extract-mode clone` or `submodule`: it must not exist or be empty, and not be inside this repository. Used by `rewrite run`; `rewrite apply` takes its own"
"rewrite push" = "Push the refs an applied run moved that were on a remote, each with `--force-with-lease=<ref>:<the id the remote had when you previewed>` (never a plain force), one `--atomic` push per remote where the server allows it (one push per ref otherwise, and the answer says so). Tags are included. Protected branches (`rewrite.protected_branches`) are left out unless listed with `--include-protected` or all of them with `--include-all-protected`. A ref whose remote moved since the preview is rejected for that ref (fetch and review, then run it again). Not undoable: the remote keeps the new history even if you `undo` the rewrite locally. Without `--yes` (or with `--dry-run`) nothing is sent: the answer lists what would be pushed, and the exit code is 3 without `--yes`. Exit code 2 when the run is gone, 4 when a ref was rejected or not pushed"
"rewrite push --dry_run" = "Ask the remote what would happen (leases checked) and send nothing"
"rewrite push --include_all_protected" = "Push every protected branch of the run too"
"rewrite push --include_protected" = "Push this protected branch too (repeatable)"
"rewrite push --no_atomic" = "One push per ref instead of one all-or-nothing `--atomic` push"
"rewrite push --remote" = "Only the refs of this remote"
"rewrite push --run" = "The run id `rewrite apply` printed; `latest` (default) is the most recently applied run"
"rewrite push --yes" = "Go ahead and push. Without it nothing is sent (exit code 3)"
"rewrite purge" = "Delete the old history of a rewrite from this clone for good: drops the undo pins of the rewrite (and of any earlier operation whose pins also hold the old history), expires the reflog entries that name it, prunes the objects (`gc --prune=now`) and checks that they are gone. Undo is no longer possible for those operations (they stay in `undo --list` as purged). It cannot be stopped once it starts and it cannot be undone. Anything that still holds the old history (a branch outside the rewrite, a stash, another worktree's HEAD, a remote-tracking ref: fetch after the push) blocks it and nothing is changed. Nothing is sent to any remote; the answer lists the steps the host needs (GitHub, GitLab, Azure DevOps, Bitbucket). Without `--yes` nothing happens: the answer says what would be deleted and lost, and the exit code is 3. Exit code 2 when the entry is not a rewrite, 4 when something blocks it or objects remain. Over MCP only with `[mcp] allow_history_purge = true`"
"rewrite purge --all" = "Every history rewrite of the undo history"
"rewrite purge --entries" = "A history rewrite entry of the undo history (`undo --list`; repeatable). Default: the newest rewrite that is not purged"
"rewrite purge --latest" = "The newest rewrite that is not purged yet (the default)"
"rewrite purge --yes" = "Go ahead and delete. Without it nothing is changed (exit code 3)"
"rewrite run --extract" = "Path rule: keep only this subdirectory, which becomes the root; the commits that do not touch it are dropped and merges are simplified. Asked each time: give `--extract-mode`, else the exit code is 3 and nothing is previewed. The extraction runs before the other path flags"
"rewrite run --extract_mode" = "How `--extract` ends up: `clone` (a new local clone in `--target`, the original is not touched; every local branch and tag), `in-place` (this repository's history is rewritten, one undo entry) or `submodule` (the clone as in `clone`, and one new commit on the current branch replaces the folder by a submodule of it; this history is kept)"
"rewrite run --into_subdir" = "Path rule: move the whole repository into this subdirectory in every commit (to merge repositories without path clashes)"
"rewrite run --move_paths" = "Path rule `FROM=TO`: rename a file or folder in every commit, the same blobs and trees at the new path (repeatable, in order, after the content rules). A commit where `TO` already exists is not changed: the preview is refused (exit code 2, `path_collision`) and lists the commits and paths"
"rewrite run --target" = "The folder of the new repository for `--extract-mode clone` or `submodule`: it must not exist or be empty, and not be inside this repository. Used by `rewrite run`; `rewrite apply` takes its own"
"rm-file --paths" = "Repo-relative paths to delete"
shell-init = """Prints a shell wrapper function (default name `gp`) that runs gitpoulpi and, when you quit with "Quit and cd here", leaves your shell in the active tab's folder. Add it to your shell's rc file: `eval "$(gitpoulpi shell-init bash)"`. Nothing is installed or edited"""
"shell-init --name" = "The function's name. An existing command of that name is not overridden"
show = "A file's contents at a revision, the index, or the working tree"
