"submodule init --paths" = "Repo-relative submodule paths"
"submodule list" = "Every submodule with its state: `uninitialized` (not cloned), `up_to_date`, `modified` (checked out at another commit than the recorded one) or `conflicted`"
"submodule update" = "Check submodules out at the commits the repository records (`git submodule update`). No paths: all of them"
"submodule update --init" = "Clone and register the ones that are not yet (`--init`)"
"submodule update --paths" = "Repo-relative submodule paths"
"submodule update --recursive" = "Also update the submodules' own submodules"
"tag annotate" = "Replace an existing tag with an annotated one, in place. The tag keeps the commit it already points at"
"tag create --message" = "Make an *annotated* tag with this message instead of a lightweight one - `git tag -a -m`"
"tag delete" = "Delete a tag. By default only the local one (`--local`): when a remote has the tag too, the next `fetch` brings it back, so the answer says so. `--remote <R>` deletes it on that remote only (outward-facing: other people lose it), `--both` deletes it here and on the remote that has it (`--both --remote <R>` names one)"
"tag delete --both" = "Delete here and on the remote that has the tag"
"tag delete --local" = "Delete only the local tag (the default)"
"tag delete --remote" = "Delete on this remote (alone, unless `--both`)"
"tag delete-remote" = "Delete a tag from a remote, keeping the local one"
"tag fetch" = "Fetch one tag from a remote into the local tags - what a `remote`-only tag in `tag list` needs. Never overwrites a local tag at another commit"
"tag fetch --remote" = "Omitted: the one remote that has the tag"
"tag list" = "Every tag with where it lives: `local` (here), `remote` (the remotes that have it), `differs_on` (remotes holding it at another commit) and `where`: `local`, `remote` (not fetched or deleted here), `both` or `differs`. Learned from the last fetch or push, not from the network"
"tag list --unpushed" = "Only the tags no remote is known to have"
"tag push" = "Send tags to a remote. With no names, sends every tag no remote is known to have - one push, not one per tag"
"tag push --names" = "Tags to send. Omit to push every unpushed tag"
theme = "The color themes: list them, or print one as a theme file"
licenses = "Prints the third-party license notices and credits built into this program (the same text as About > Licenses and the THIRD-PARTY-LICENSES.txt file of the release archive)"
"theme export" = "Prints a complete theme file for a theme on stdout, to start a user theme from (save it as `<config>/themes/<name>.toml`)"
"theme export --slug" = "The theme's slug (see `theme list`)"
"theme list" = "Lists every theme: the built-in presets and the files of the config directory's `themes/` folder (slug, label, source, light, lane palette). `ui.theme` takes any of these slugs"
desktop = "Shortcuts that start GitPoulpi from the OS launcher, in the terminal `ui.launch_terminal` names"
"desktop folder-menu" = """The "Open in GitPoulpi" entry of the file manager's right-click menu: File Explorer (Windows), GNOME Files, Dolphin, Nemo, Thunar, Caja and PCManFM (Linux), Finder (macOS)"""
"desktop folder-menu install" = "Adds the entry to every file manager found here (a foreign file is never overwritten)"
"desktop folder-menu remove" = "Removes exactly what `install` wrote, from every file manager"
"desktop folder-menu status" = "Shows each file manager of this system: whether it is found and whether the entry is not_installed, installed, outdated or foreign (a file that is not GitPoulpi's)"
"desktop shortcut" = "Lists, creates or removes the launcher, Start menu and Desktop shortcuts"
"desktop shortcut install" = "Creates or updates a shortcut (default: the OS launcher)"
"desktop shortcut install --place" = "`launcher`, `desktop` or `startmenu`"
"desktop shortcut remove" = "Removes the shortcuts GitPoulpi made (default: all); a file that is not GitPoulpi's is never touched"
"desktop shortcut remove --place" = "`launcher`, `desktop` or `startmenu`"
"desktop shortcut status" = "Shows each shortcut this system offers: not_installed, installed, outdated or foreign (a file that is not GitPoulpi's), and the terminal in use"
treat = "Make git diff files as binary or as text, by writing a `.gitattributes` rule (`binary`, or `text diff`) for the paths: the repository's root file by default, `--file` for a folder's own or `.git/info/attributes` (this clone only). A rule already naming the same pattern is rewritten, not contradicted. The answer says whether git now really treats the paths that way (`effective`). Undoable with `gitpoulpi undo`, except for `.git/info/attributes`"
"treat --kind" = "What git should treat the paths as"
"treat --paths" = "Repo-relative paths to treat (folders with `--folder`)"
"treat --extension" = "Name every file with each path's extension (`*.ext`) instead of the file itself"
"treat --folder" = "The paths are folders: the rule covers everything below them"
"treat --file" = "Repo-relative `.gitattributes` to write, or `.git/info/attributes` (default: the root `.gitattributes`)"
convert = "Rewrite the encoding, the line endings or the indentation of files in the working tree, with the functions the TUI's editor and its Convert menu use. Exactly one of `--encoding`, `--eol` and `--indent`. Binary files, missing files and files the target encoding cannot hold are skipped and reported, never damaged. One journal entry for the whole batch: `gitpoulpi undo` puts every file back"
"convert --paths" = "Repo-relative files to convert"
"convert --encoding" = "The target encoding, as the editor names it (`UTF-8`, `UTF-8 BOM`, `UTF-16 LE`, `Windows-1252`, `ISO-8859-1`, `Shift_JIS`, ...)"
"convert --eol" = "The target line break"
"convert --indent" = "Leading whitespace as `spaces:<n>` or `tabs:<n>`, `<n>` being the width of a tab (1-8)"
ui = "Show things to the user in their open GitPoulpi window: a commit, a diff at a line, a file, a settings page. View-only: nothing here changes the repository or types into the window, except `ui propose`, which opens a dialog pre-filled for the user to confirm (off unless `[mcp] allow_ui_propose = true`). Needs a GitPoulpi TUI open on the session"
"ui --launch" = "When no window is open anywhere, open one with the configured launch command (`[ui] launch` / `launch_command`; off by default) and wait up to 10 s for it to attach. Without this flag a window is only launched when `[ui] launch` is set AND `ui_control` is `auto`"
"ui --viewer" = "Send to this window (`ui viewers` lists them) instead of letting the daemon choose"
"ui back" = "Undo the agent's last view change (restore the previous view)"
"ui highlight" = "Tint a line range in the diff or file the window has open"
"ui highlight --no_scroll" = "Do not scroll the range into view"
"ui highlight --range" = "`A-B`, or `A:C-B:C` with columns (1-based)"
"ui notify" = "Show a short toast message to the user"
"ui notify --message" = "At most 200 characters; control characters are stripped"
"ui propose" = """Propose a change for the user to confirm: a dialog opens pre-filled, marked "Proposed by", and nothing happens until the user presses its own confirm. Needs `[mcp] allow_ui_propose = true`. Follow the answer's `proposal` id in `ui state`'s `proposals`"""
"ui propose branch" = "Open the New Branch box with a name filled in"
"ui propose branch --start_point" = "Where the branch starts (default: HEAD)"
"ui propose commit-message" = "Fill the commit composer's Summary and Description; never commits"
"ui propose resolution" = "Open the merge editor on a conflicted file with a resolution already in it, for the user to review and confirm with Save & Mark Resolved (their Ctrl+S is the only confirm; nothing is written or staged here). Give the choices as `--pick`, or the whole file as `--content-file`"
"ui propose resolution --content_file" = "The final file text, exactly (`-` reads standard input)"
"ui propose resolution --path" = "Repository-relative path of the conflicted file"
"ui propose resolution --pick" = "A choice per conflict number: `1=a,2=b,3=ab,4=ba,5=none` (a = current, b = incoming, ab / ba = both in that order)"
"ui propose resolution --pick_default" = "With `--pick`: the choice for every conflict not listed"
"ui propose reword" = "Open the Reword popup over a commit with a new message filled in"
"ui propose rewrite" = "Open the history rewrite workbench with a recipe already in it, for the user to preview and apply; never rewrites, purges or pushes anything itself. A recipe has at most 50 rules and no script, and secret values are dropped from it"
"ui propose rewrite --recipe" = "The recipe (TOML or JSON, as `rewrite preview --recipe` takes it), from a file path or `-` for stdin"
"ui propose reword --message" = "The proposed message: summary, blank line, body"
"ui propose reword --rev" = "The commit (on the checked-out branch)"
"ui propose split" = "Open the split editor over a commit, filled with a plan, for the user to review, edit and apply; never splits anything itself"
"ui propose split --plan" = "The plan (JSON), from a file path or `-` for stdin, as `split-commit --plan` takes it"
"ui propose split --rev" = "The commit to split (on the checked-out branch)"
"ui propose tag" = "Open the New Tag box with a name (and, annotated, a message) filled in"
"ui propose tag --message" = "Makes it an annotated tag with this message"
"ui propose tag --target" = "The commit to tag (default: HEAD)"
"ui show" = "Move the user's view to something"
"ui show commit" = "Select a commit in the Log"
"ui show commit --also" = "More commits to select with it (at most 9)"
"ui show commit --files" = "Expand the commit's changed-files list"
"ui show commit --focus" = "Move the keyboard focus to this pane"
"ui show commit --rev" = "Any revision (branch, tag, `HEAD~2`, a sha)"
"ui show conflict" = "Open the merge conflict editor on a conflicted file, at a conflict. View-only: nothing is picked and nothing is saved"
"ui show conflict --conflict" = "Scroll to conflict N (1-based)"
"ui show conflict --path" = "Repository-relative path of the conflicted file"
"ui show diff" = "Open a file's diff, at a line"
"ui show diff --highlight" = "Tint a range: `A-B`, or `A:C-B:C`"
"ui show diff --line" = "Scroll to this line (1-based)"
"ui show diff --path" = "Repository-relative path, forward slashes"
"ui show diff --rev" = "Diff of this commit against its parent (default: HEAD)"
"ui show diff --side" = "Which side's numbering `--line` uses"
"ui show diff --staged" = "The index against HEAD"
"ui show diff --unstaged" = "The working tree against the index"
"ui show diff --whole_file" = "Show the whole file rather than only the hunks"
"ui show file" = "Open a file (content, blame or history) at a position"
"ui show file --highlight" = "Tint a range: `A-B`, or `A:C-B:C`"
"ui show file --index" = "The file as staged"
"ui show file --rev" = "The file at this revision (default: HEAD)"
"ui show file --worktree" = "The file on disk"
"ui show home" = "Show Repository Management (the home screen)"
"ui show home --filter" = "Text for its search box"
"ui show issue" = "Select an issue in the sidebar"
"ui show keys" = "Open the help overlay (the key bindings; named `keys` because clap reserves `help` as a subcommand name)"
"ui show palette" = "Open the command palette with a query filled in; never runs it"
"ui show pr" = "Select a pull request / merge request in the sidebar"
"ui show ref" = "Select a ref (branch, tag, stash) in the sidebar; never checks it out"
"ui show ref --name" = "A full (`refs/heads/x`) or short (`main`, `origin/main`) name"
"ui show search" = "Open the Log find bar with a query (dims, never filters)"
"ui show settings" = "Open a Settings page and flash a setting; never edits a value"
"ui show settings --setting" = "A config key such as `ui.minimap`"
"ui show tab" = "Switch to (or open) a repository tab"
"ui show tab --path" = "The repository to show; defaults to `--repo` / the current one"
"ui show wip" = "Show the working-tree changes (the WIP row)"
"ui show wip --composer" = "Put the keyboard focus in the commit summary field (types nothing)"
"ui show wip --path" = "Select this file's row"
"ui show wip --staged" = "The staged side of `path`"
"ui state" = "Read what a window currently shows (the most recently focused one, or `--viewer`)"
"ui state --text" = "Also return the plain text of the main pane's visible rows (200 lines at most; secret fields stay masked)"
"ui viewers" = "List the GitPoulpi windows attached to this session"
"ui viewers --all_sessions" = "Also list the windows of every other running session (read from `sessions/*.port`, loopback only)"
undo = "Undo the latest journaled operation (commit, amend, checkout, branch create/delete). Refuses, changing nothing, if anything the operation touched has moved since. Exit code 2 when refused, 3 when it needs `--yes` (a risky undo)"
"undo --all" = "With `--list`: include entries no longer redoable"
"undo --dry_run" = "Show what would happen and change nothing"
"undo --expect" = "Only undo if this is still the latest entry (its id, as `--list` shows it); otherwise refused as stale"
"undo --list" = "List the journal instead (newest last); `--all` adds the entries that are no longer redoable but still pinned"
"undo --yes" = "Go ahead when the undo is risky (the commit is already on its upstream, or working-tree files would be overwritten). Without it such an undo changes nothing and exits with code 3"
worktree = "Linked worktrees: list them, add one on a branch or a commit"
"worktree add" = "Add a linked worktree at `<path>`. `<start>` naming a local branch checks that branch out there (or starts `--branch` at it); any other revision gives a detached HEAD (or starts `--branch` there)"
"worktree add --branch" = "Create this new branch at `<start>` and check it out there"
"worktree add --start" = "A local branch, or any revision"
"worktree list" = "Every worktree of the repository, the main one first"
"worktree changes" = "The uncommitted changes of the worktree at `<path>` (tracked and untracked, not ignored); an empty list means it is clean"
"worktree remove" = "Remove the linked worktree at `<path>`. A worktree with uncommitted changes is refused unless `--force` (they are lost), `--commit-message` (commit every change on its branch first; a detached worktree also needs `--commit-branch`) or `--stash-message` (stash every change, untracked included, first; the stash is shared by all worktrees). `--delete-branch` also deletes its branch (journaled: undo brings the branch back; the folder stays gone). The removal itself is not undoable"
"worktree remove --commit_branch" = "The branch to create for that commit when the worktree is detached"
"worktree remove --commit_message" = "Commit every change with this message before removing"
"worktree remove --delete_branch" = "Also delete the worktree's branch after removing it"
"worktree remove --force" = "Remove even with uncommitted changes; they are lost"
"worktree remove --stash_message" = "Stash every change with this message before removing"
_usage = "Usage:"
_options = "Options"
_arguments = "Arguments"
_commands = "Commands"
_help_flag = "Print help (see more with '--help')"
_version_flag = "Print version"
"conflicts am-abort" = "Abort the `git am` in progress: the branch returns to its tip from before the `am`, and the patches applied so far are dropped"
"conflicts am-continue" = "Continue the `git am` in progress: apply the patch it stopped on (resolve and stage its files first) and the rest of the mailbox. `{\"outcome\":\"Completed\"}` or `\"Stopped\"` (another patch conflicted)"
"conflicts am-skip" = "Skip the patch the `git am` in progress stopped on and go on with the next one"
"hosting integrations add --account" = "The account email (`jira_cloud`, `bitbucket`), the API key (`trello`) or the user name (`gerrit`). Not a secret: the token goes in with `hosting login`"
"hosting integrations add --org" = "The Azure DevOps organization (`azure_devops`), a shortcut for `--url https://dev.azure.com/<org>`"
"hosting issue create --issue_type" = "The issue type, by name or id (Jira, Azure DevOps; see `hosting issue options`). Defaults to the provider's own pick"
"hosting issue create --list" = "The list the card goes in, by name or id (Trello; see `hosting issue options`). Defaults to the first open list"
"hosting issue options" = "The issue types and lists the linked project offers to `issue create --type` / `--list`. Read-only"
"hosting issue options --id" = "Which integration (see `hosting issues`)"
"hosting link --filter" = "Narrows the issue list with the provider's own syntax (a Jira JQL clause, an Azure WIQL condition, Trello list names)"
"hosting open --reference" = "A number (`12`, `#12`, `!12`), or an issue's own reference (`AB#12`, `ABC-12`, a Trello short link)"
"hosting refs" = "The issue and pull request references a commit message or a branch name holds, read through this repository's links (an unlinked repository has none): `[{text, kind, reference, url}]`"
