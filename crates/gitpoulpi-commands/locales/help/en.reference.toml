"flow" = "Branching workflows (Git Flow, GitHub Flow, GitLab Flow, Trunk-based or your own): which branches are long-lived bases, which are topic branches of which type, their parents and how far they are from them. `status`, `templates`, `detect` and `config` read; `config init` and `import` print a workflow file and create it only with `--write`. `start`, `finish`, `sync`, `promote` and `set-parent` act: each prints the steps it will do (`--dry-run` prints them as JSON and stops), needs `--yes` to run, and is one undoable entry (a merge request or a push cannot be undone)"
