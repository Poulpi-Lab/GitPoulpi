"rewrite preview --trust" = "Trust the external scripts (shell, Python, external Lua) of this recipe, by their content: remembered for this repository, and asked again if a script changes. A person's decision: the MCP server refuses it, and an agent can only run scripts a person trusted"
"rewrite run --script_language" = "The language of every `--script`: `lua` (embedded, sandboxed), `shell`, `python` or `lua-external`. Default: by the file's extension (`.lua`; `.sh`, `.bash`, `.ps1`; `.py`), else `lua`. Python and external Lua must be switched on in `rewrite.external_scripts`"
"rewrite run --trust" = "Trust the external scripts (shell, Python, external Lua) of this recipe, by their content: remembered for this repository, and asked again if a script changes. A person's decision: the MCP server refuses it, and an agent can only run scripts a person trusted"
"rewrite script check --language" = "`lua`, `shell`, `python` or `lua-external`; default by extension"
"rewrite script check --trust" = "Trust this script first (a person's decision, refused over MCP)"
"rewrite script check#long" = """
Compile a Lua script and print its header (name, window, parameters), the functions it defines and every problem. Exit code 2 when it has problems. Reads only; nothing runs on a commit.

For a shell, Python or external Lua script (not sandboxed) it also says whether the interpreter was found and the script is trusted, and for a trusted one does a dry handshake: it starts the script once with a made-up commit (`"dry_run": true`) and checks the answer. An untrusted script is never started."""
"rewrite script test --language" = "`lua`, `shell`, `python` or `lua-external`; default by extension"
"rewrite script test --trust" = "Trust this script first (a person's decision, refused over MCP)"
"rewrite script trust" = "Trust an external script (shell, Python, external Lua) by its content: the SHA-256 of the file is remembered for this repository, so the script may run (preview, run, test); a changed file asks again. These scripts are not sandboxed: they run with your rights, so read the file first. Only a person can do this: there is no MCP tool for it"
"rewrite script trust --file" = "The script file"
"rewrite tools" = "Which tools the rewrite features need (gpg / ssh-keygen / gpgsm for re-signing, script interpreters, git-lfs) and whether each is found. Reads only"
"rewrite tools --fresh" = "Probe again instead of answering from the one-minute cache"
"mailmap" = "The `.mailmap`: one canonical name and email for people who committed under several. The Log, blame and file history show the mapped names (`log.use_mailmap`) without touching a commit. `list` counts the identities of the history and shows which are mapped, `check` shows how some identities resolve, `add` merges identities into one by appending lines to the `.mailmap` (edited, not committed; undoable)"
"mailmap add" = "Merge identities into one canonical identity by appending lines to the `.mailmap` (created when missing; a line already there is not repeated). The file is edited, not committed: commit it yourself. One undoable entry (`gitpoulpi undo` puts the previous file back). The Log shows the canonical identity at once (`log.use_mailmap`); the stored commits are not changed, so nothing needs a force push. To rewrite the commits themselves use a `mailmap` rule in `rewrite`"
"mailmap add --canonical" = "The identity to keep, `Name <email>`"
"mailmap add --file" = "The `.mailmap` to write, relative to the repository root (default: the root `.mailmap`)"
"mailmap add --from" = "An identity to map to it, `Name <email>` (repeatable, at least one)"
"mailmap check" = "Show how identities (`Name <email>`, or `<email>`) appear through the repository's `.mailmap`: the canonical name and email, or the same identity when nothing maps it. Reads only"
"mailmap check --identities" = "The identities to resolve, each `Name <email>` or `<email>`"
"mailmap list" = "List every name and email that authored or committed a commit of the scope, with how many commits each has as author and as committer, most commits first, and the identity the `.mailmap` already maps it to (`mapped_to`). Reads only"
"mailmap list --all_local" = "Every local branch and tag instead of the current branch"
"mailmap list --mapped" = "Only the identities the `.mailmap` already maps"
"mailmap list --refs" = "Only these local branches or tags (repeatable)"
"mailmap list --unmapped" = "Only the identities the `.mailmap` does not map"
"rewrite preview --mailmap" = "Mailmap rule: rewrite authors and committers to what the worktree's `.mailmap` names them (the history ends up showing what `git log --use-mailmap` shows). `--who` picks author, committer or both. For a display-only fix without rewriting, use `mailmap add` instead"
"rewrite preview --mailmap_file" = "With `--mailmap`: apply this file instead of the worktree's `.mailmap` (relative to the repository root, or absolute)"
"rewrite run --mailmap" = "Mailmap rule: rewrite authors and committers to what the worktree's `.mailmap` names them (the history ends up showing what `git log --use-mailmap` shows). `--who` picks author, committer or both. For a display-only fix without rewriting, use `mailmap add` instead"
"rewrite run --mailmap_file" = "With `--mailmap`: apply this file instead of the worktree's `.mailmap` (relative to the repository root, or absolute)"
"rewrite analyze" = "Size analysis of the history, like `filter-repo --analyze`: the largest blobs with their path, size, first and last commit and whether they are still in HEAD, the biggest folders, the files deleted from HEAD that the history still holds, and the totals with what removing the history-only part would free (an estimate: after a purge and a gc only). Remove what it shows with `rewrite preview --remove-paths PATH` or `--remove-blobs-over BYTES`. Reads only"
"rewrite analyze --all_local" = "Analyse every local branch and tag instead of the current branch"
"rewrite analyze --refs" = "Analyse only these local branches or tags (repeatable)"
"rewrite analyze --since" = "With the current branch: only the commits after this revision"
"rewrite analyze --top" = "Rows kept in each list (default 50, at most 5000)"
"rewrite check-signing" = "Sign a dummy payload once with the repository's signing setup (`gpg.format`, `user.signingkey`, `gpg.*.program`) and verify it, as the smoke test before a run that re-signs (`--signatures resign-signed` or `resign-all`). Prints the program, whether it works and how long one signature took (multiply by the commits to re-sign for the estimate). May open a passphrase prompt. Exits 2 when it does not work, with the reason (`tool_missing` or `signing_failed`)"
"rewrite preview --remove_signatures" = "Signature rule: strip the signature of every commit in scope, even where nothing else changes. Those commits need no `--signatures` answer"
"rewrite preview --fix_message_encoding" = "Message rule: re-encode commit messages to UTF-8. A message with an `encoding` header (ISO-8859-1, Shift_JIS...) is decoded and the header goes; UTF-8 once read as Latin-1 or Windows-1252 (\"RÃ©Ã©criture\") is repaired only when the round trip is exact. What cannot be decided is left alone and counted (`encoding_left`)"
"rewrite preview --fix_name_encoding" = "With `--fix-message-encoding`: also repair mangled author and committer names (the names of a commit whose header goes are always decoded with it)"
"rewrite run --remove_signatures" = "Signature rule: strip the signature of every commit in scope, even where nothing else changes. Those commits need no `--signatures` answer"
"rewrite run --fix_message_encoding" = "Message rule: re-encode commit messages to UTF-8. A message with an `encoding` header (ISO-8859-1, Shift_JIS...) is decoded and the header goes; UTF-8 once read as Latin-1 or Windows-1252 (\"RÃ©Ã©criture\") is repaired only when the round trip is exact. What cannot be decided is left alone and counted (`encoding_left`)"
"rewrite run --fix_name_encoding" = "With `--fix-message-encoding`: also repair mangled author and committer names (the names of a commit whose header goes are always decoded with it)"
"rewrite preview --map_trailers" = "With an identity rule: also map the identity trailers (`Name <email>` in `Signed-off-by`, `Co-authored-by`...) that match, not only the author and committer"
"rewrite preview --trailer_add" = "Trailer rule `KEY=VALUE`: add this trailer to every message (repeatable; a message that already has exactly that trailer is left alone)"
"rewrite preview --trailer_map" = "Trailer rule `KEY:OLD=NEW`: replace literal text in the values of the trailers with this key, for instance `Signed-off-by:@old.org=@new.org` (repeatable)"
"rewrite preview --trailer_remove" = "Trailer rule: remove every trailer with this key (repeatable)"
"rewrite preview --update_message_hashes" = "Replace abbreviated commit ids (7 or more hex characters) in messages by the new ids; ambiguous or unknown ones are left and counted"
"rewrite run --map_trailers" = "With an identity rule: also map the identity trailers (`Name <email>` in `Signed-off-by`, `Co-authored-by`...) that match, not only the author and committer"
"rewrite run --trailer_add" = "Trailer rule `KEY=VALUE`: add this trailer to every message (repeatable; a message that already has exactly that trailer is left alone)"
"rewrite run --trailer_map" = "Trailer rule `KEY:OLD=NEW`: replace literal text in the values of the trailers with this key, for instance `Signed-off-by:@old.org=@new.org` (repeatable)"
"rewrite run --trailer_remove" = "Trailer rule: remove every trailer with this key (repeatable)"
"rewrite run --update_message_hashes" = "Replace abbreviated commit ids (7 or more hex characters) in messages by the new ids; ambiguous or unknown ones are left and counted"
"ai trust" = "Binds a profile's API key to the address it was stored for: shows what is trusted, or accepts the profile's current address (after its base URL changed), a self-hosted server's certificate, or plain http. Only a person runs this (it is not an agent tool)"
"ai trust --accept_certificate" = "Accept the certificate with this key fingerprint (SHA-256, hex)"
"ai trust --accept_origin" = "Accept the profile's current base URL (spelled exactly as the refusal printed it)"
"ai trust --allow_insecure_http" = "Allow a plain `http://` base URL that is not on this machine"
"ai trust --profile" = "The AI profile id"
"hosting integrations trust" = "Reviews the security check of a profile and accepts what it stopped: a new address, another account, a new certificate, plain http. Only a person runs this (it is not an agent tool). With no option it prints what is trusted and what is stopped"
"hosting integrations trust --accept_account" = "Accept this account id as the owner of the token"
"hosting integrations trust --accept_certificate" = "Accept the certificate with this key fingerprint (SHA-256, hex), exactly as the refusal printed it"
"hosting integrations trust --accept_origin" = "Accept the profile's current address (it must be spelled exactly as the refusal printed it)"
"hosting integrations trust --allow_insecure_http" = "Allow a plain `http://` address that is not on this machine"
"hosting integrations trust --id" = "The profile"
"hosting integrations trust --strict_tls" = "Hold the pinned certificate strictly: the key must match even when the certificate chains to a public root"
repo-auth = "Which identity this repository authenticates with (HTTPS and SSH): the machine's own, a GitPoulpi account, or a key file. `show` and `test` read; `set` and `clear` are a person's decision"
"repo-auth clear" = "Forget the profile: the repository goes back to the machine's own identity. Only a person can: an agent is refused"
"repo-auth set" = "Choose the identity this repository authenticates with, per protocol: `--https` for HTTPS remotes, `--ssh` for SSH remotes. The profile is kept in GitPoulpi's private directory, never in the repository. Only a person can set it: an agent is refused (exit code 2)"
"repo-auth set --cache_minutes" = "With `token-command`: how long its token is reused, in minutes"
"repo-auth set --use_for_hosting" = "With `token-command`: the same command also supplies the token of this repository's hosting API calls (issues, pull requests), in place of the personal token, for example a GitHub App installation token"
"repo-auth set --command" = "With `--https token-command`: the command and its arguments (the first word is the program). Write `--command` last: every word after it, dashes included (`sh -c ...`), belongs to the command"
"repo-auth set --helper" = "With `--https helper`: the credential helper command. A person confirms it, with its hash (or passes `--yes`)"
"repo-auth set --hosts" = "With `helper` or `token-command`: the hosts it may serve (comma-separated or repeated)"
"repo-auth set --https" = "HTTPS identity: `system` (git's own helpers), `integration:<id>` (a GitPoulpi account's token), `helper` (one credential helper, with `--helper`) or `token-command` (a command that prints a token, with `--command` and `--hosts`)"
"repo-auth set --ignore_repo_helpers" = "With `--https system`: drop the credential helpers this repository sets itself and keep the system and global ones"
"repo-auth set --known_hosts" = "With `--ssh key:` or `integration-key:`: the `known_hosts` file"
"repo-auth set --ssh" = "SSH identity: `system` (ssh's own configuration and agent), `key:<path>` (a private key file, offered alone) or `integration-key:<id>` (the key of a GitPoulpi account)"
"repo-auth set --strict" = "With `--ssh key:` or `integration-key:`: refuse unknown host keys (`StrictHostKeyChecking=yes`)"
"repo-auth set --username" = "A user name: with `system`, `credential.username` (lets a credential manager pick one of several accounts); with `integration:<id>`, the user name sent with the token"
"repo-auth set --yes" = "Confirm a helper or token command without the interactive question (the command and its hash are still printed)"
"repo-auth show" = "Show which identity this repository authenticates with: the stored profile, the identity each remote will use, the settings the profile overrides and any warning. Never prints a secret; a helper or token command is printed only to a person (an agent gets `{set, sha256}`)"
"repo-auth test" = "Test the connection to each remote (or one) with the profile applied, without changing anything: lists the remote's branches, or with `--push` asks whether a push would be accepted. Reports the result for each remote and the identity it used. Reaches the network"
"repo-auth test --push" = "Also check that a push would be accepted"
"repo-auth test --remote" = "Only this remote (default: every remote)"
"apply-commit" = "Apply the changes one commit made (even a lost one) to the working tree only: the index and HEAD stay. All or nothing: when a file does not apply cleanly nothing changes (`stash from-commit` keeps the changes as a stash instead). A merge commit is refused. `undo` takes it back"
"apply-commit --commit" = "The commit whose changes to apply (any revision: a sha, `HEAD~2`, ...)"
"stash from-commit" = "Save the changes one commit made (even a lost one) as a new stash, without touching the working tree. `undo` drops it again"
"stash from-commit --commit" = "The commit whose changes to keep (any revision: a sha, `HEAD~2`, ...)"
"stash from-commit --message" = "The stash message; omitted, one naming the commit"
"branch upstream" = "A branch's several remotes: the primary upstream plus extra push targets and opt-in pull sources, kept in its own config section"
"branch upstream add" = "Add `<remote>[:<dst>]` as an extra push target (`<dst>` is the branch name on that remote, default the same name). Undoable"
"branch upstream add --branch" = "The branch (default: the current one)"
"branch upstream add --pull" = "Also make it a pull source"
"branch upstream add --target" = "`<remote>` or `<remote>:<dst>`"
"branch upstream list" = "The branch's primary upstream, its extra push targets and pull sources, each with where it stands (ahead, behind, relation) from the remote-tracking refs as they are. Reads only, no network"
"branch upstream list --branch" = "The branch (default: the current one)"
"branch upstream primary" = "Set the primary upstream (`origin/main`): the same request as `branch set-upstream`"
"branch upstream primary --branch" = "The branch (default: the current one)"
"branch upstream pull" = "Turn `<remote>[:<dst>]` on or off as a pull source: a plain pull then integrates it too"
"branch upstream pull --branch" = "The branch (default: the current one)"
"branch upstream pull --off" = "Stop pulling from it"
"branch upstream pull --on" = "Make it a pull source"
"branch upstream pull --target" = "`<remote>` or `<remote>:<branch>`"
"branch upstream remove" = "Remove every extra push target and pull source naming `<remote>`. The primary upstream is left alone (use `unset-upstream`). Undoable"
"branch upstream remove --branch" = "The branch (default: the current one)"
"remote-group" = "A branch with several remotes (extra push targets, pull sources): where it stands against each. See `branch upstream` to change them"
"remote-group status" = "Where the current branch (or `--branch`) stands against each of its remotes: primary upstream, extra push targets, pull sources. Reads only, no network"
"remote-group status --branch" = "The branch (default: the current one)"
"pull --all_sources" = "Pull the primary upstream and every pull source of the branch (see `branch upstream pull`), each with `--mode`. Plans first: anything but a fast-forward or the mode's own integration asks for `--resolve` (exit 3, nothing changed). A stop on conflicts exits 4 with `stopped`; resume with `remote-group continue`"
"pull --branch" = "With `--all-sources`: the branch (default: the current one)"
"pull --no_preflight" = "With `--all-sources`: do not ask the remotes first"
"pull --resolve" = "With `--all-sources`: `REMOTE=ff|merge|rebase|skip` (repeatable), the decision for a remote the plan asked about"
"push --all_targets" = "Push to the primary upstream and every extra push target of the branch (see `branch upstream add`). Plans first: when every remote is a plain push or up to date it runs, otherwise it answers `needs_resolution` (exit 3, nothing changed). Exit 4: some remote failed or a merge stopped on conflicts (`stopped`)"
"push --no_preflight" = "Do not ask the remotes first (use the remote-tracking refs)"
"push --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (repeatable): the decision for a remote the plan asked about"
"push --tags" = "Also push the unpushed tags to every remote that took the branch"
"push --to" = "Push to exactly these remotes (`<remote>` or `<remote>:<dst>`, repeatable) for this push only; the config is not changed. Same plan, `--resolve` and run as `--all-targets`"
"push --yes" = "Confirm a force push chosen with `--resolve REMOTE=force`. Without it such a push changes nothing and exits with code 3"
"remote-group abort" = "Drop the saved grouped run: aborts the merge or rebase it started. Pushes already done stay"
"remote-group abort --run" = "The saved run's id, to be sure it is still the one meant"
"remote-group continue" = "Resume the saved grouped run once its merge or rebase is concluded (never automatic). Answers a `needs_resolution` with `--resolve`"
"remote-group continue --branch" = "The branch (default: the current one); only read with `--resolve`"
"remote-group continue --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (repeatable): the decision for a remote the previous answer asked about"
"remote-group continue --run" = "The saved run's id, to be sure it is still the one meant"
"remote-group continue --yes" = "Confirm the force pushes named by `--resolve`"
"remote-group plan" = "What a grouped push (or, with `--pull`, a grouped pull) would do, remote by remote: where each stands, the suggested action and the others allowed. Asks the remotes (`ls-remote`, a fetch of the ones whose tip is unknown) unless `--no-preflight`; changes nothing"
"remote-group plan --branch" = "The branch (default: the current one)"
"remote-group plan --no_preflight" = "Do not ask the remotes: use the remote-tracking refs as they are"
"remote-group plan --pull" = "Plan the grouped pull (the primary and the pull sources)"
"remote-group plan --to" = "Plan a push to exactly these remotes (`<remote>` or `<remote>:<dst>`, repeatable) instead of the configured targets"
"remote-group retry" = "Run again the targets of the saved run that failed, were canceled mid-push or were never attempted"
"remote-group retry --run" = "The saved run's id, to be sure it is still the one meant"
