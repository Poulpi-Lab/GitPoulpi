"hosting refs --commit" = "Scan this commit's message"
"hosting refs --message" = "Scan this text"
"hosting review" = "Reviews a pull/merge request in place (GitHub, GitLab, Gitea, Forgejo): read it, its threads and its files, comment, reply, resolve, submit a review, and fetch its head for the diff. Same commands for a person, a script and an AI agent"
"hosting review comment" = "Posts a comment in the conversation of a pull/merge request (not on code). Outward action: it is posted at once"
"hosting review comment --body" = "The comment (markdown)"
"hosting review comment --body_file" = "Read the comment from this file (`-` reads stdin)"
"hosting review comment --id" = "Which integration (see `hosting prs`)"
"hosting review comment --number" = "The PR number (GitHub) or MR `iid` (GitLab)"
"hosting review fetch" = "Fetches a pull/merge request's head into `refs/gitpoulpi/pr/<n>` and its target branch into `refs/gitpoulpi/pr/<n>-base`, to review the diff between them. Neither is a branch, nothing is checked out"
"hosting review fetch --id" = "Which integration (see `hosting prs`)"
"hosting review fetch --number" = "The PR number (GitHub) or MR `iid` (GitLab)"
"hosting review fetch --remote" = "The remote the request lives on. Defaults to the one the project was resolved from, else the repository's default"
"hosting review reply" = "Answers a review thread (its id from `review threads`). Outward action: it is posted at once"
"hosting review reply --body" = "The reply (markdown)"
"hosting review reply --body_file" = "Read the reply from this file (`-` reads stdin)"
"hosting review reply --id" = "Which integration (see `hosting prs`)"
"hosting review reply --number" = "The PR number (GitHub) or MR `iid` (GitLab)"
"hosting review reply --thread" = "The thread's id, as `review threads` prints it"
"hosting review resolve" = "Resolves a review thread, or reopens it with `--unresolve`"
"hosting review resolve --id" = "Which integration (see `hosting prs`)"
"hosting review resolve --number" = "The PR number (GitHub) or MR `iid` (GitLab)"
"hosting review resolve --thread" = "The thread's id, as `review threads` prints it"
"hosting review resolve --unresolve" = "Reopen the thread instead"
"hosting review show" = "Reads one pull/merge request for review: description, head and base commits, merge state, checks, what the host lets a review do (`capabilities`) and its changed files. The diff itself comes from the repository (`review fetch`, then diff `refs/gitpoulpi/pr/<n>`)"
"hosting review show --id" = "Which integration (see `hosting prs`)"
"hosting review show --number" = "The PR number (GitHub) or MR `iid` (GitLab), the change number (Gerrit)"
"hosting review submit" = "Submits a review: every `--comment` and the verdict in one go. `request-changes` is not offered by GitLab (it has no such review state: it is refused there, with nothing sent)"
"hosting review submit --body" = "The review's summary (markdown). Required for `request-changes` and `comment` unless a `--comment` carries the message"
"hosting review submit --body_file" = "Read the summary from this file (`-` reads stdin)"
"hosting review submit --comments" = "A comment on code, `path:line[:side]:text`; repeat the flag. `line` is `N` or a range `N-M` (GitHub; GitLab keeps the last line), `side` is `new` (the line at the head, the default) or `old` (the line at the merge base)"
"hosting review submit --event" = "The verdict"
"hosting review submit --id" = "Which integration (see `hosting prs`)"
"hosting review submit --number" = "The PR number (GitHub) or MR `iid` (GitLab)"
"hosting review threads" = "The review threads of a pull/merge request (resolved ones too, each with its path, line, side, outdated flag and comments) and its conversation comments. Lines are in the diff of `refs/gitpoulpi/pr/<n>`: `new` is the line at the head, `old` the line at the merge base"
"hosting review threads --id" = "Which integration (see `hosting prs`)"
"hosting review threads --number" = "The PR number (GitHub) or MR `iid` (GitLab)"
"hosting review threads --unresolved" = "Leave out the resolved threads"
index-lock = "A stale `.git/index.lock`, which makes every write fail: look at it, or remove it once it is old enough"
"index-lock remove" = "Delete a stale `index.lock` (left by a git command that died). Refused while it is younger than 10 s or when there is none. Only the lock file is removed; check that no git command is running"
"index-lock show" = "The repository's `index.lock` (`null` when there is none): its path, age in seconds, and whether it is stale (older than 10 s)"
"job" = "The daemon's background jobs: every fetch, push, pull, clone and LFS transfer is one from the moment it is received. `list` shows them, `cancel` stops one, `wait` blocks until one ends. Ctrl+C on a command that started a job cancels that job"
"job list" = "The jobs of this session's daemon, oldest first: running, queued behind another, and the ones that ended in the last 30 seconds"
"job cancel" = "Stop a job. Refused (exit code 1, nothing changes) once it is past the point where stopping is safe, for instance a pull that has begun merging. A canceled push may already have reached the remote"
"job cancel --id" = "The job's id, from `job list`"
"job wait" = "Block until a job ends and print its final state. Exit code 0 when it is `Done`, 1 when it failed or was canceled"
"job wait --id" = "The job's id, from `job list`"
"job wait --timeout" = "Give up after this many seconds (exit code 1, the job keeps running). Omitted: wait as long as it takes"
"undo-forget" = "Drop the blocked top entry of the undo journal (an interrupted operation, or one the repository moved on from) so the entries under it can be undone. Never touches the repository, only the journal; the entry cannot be undone or redone afterwards. Exit code 2 when the top entry is not blocked, 3 without `--yes`"
"undo-forget --dry_run" = "Show what would be dropped and change nothing"
"undo-forget --expect" = "Only forget if this is still the top entry (its id, as `undo --list` shows it); otherwise refused as stale"
"undo-forget --redo" = "Forget the top redo entry instead of the top undo entry"
"undo-forget --yes" = "Confirm. Without it nothing changes and the exit code is 3"
"clone --sparse" = "Sparse checkout: check out only these directories (plus the files at the root); the whole history is still downloaded"
sparse-checkout = "Sparse checkout (cone mode): keep only some directories in the working tree of a big repository. `gitpoulpi clone --sparse` starts one"
"sparse-checkout add" = "Show these directories too, keeping the ones already shown"
"sparse-checkout disable" = "Check every file out again (a full checkout)"
"sparse-checkout set" = "Show exactly these directories (plus the files at the repository root); every other directory leaves the working tree. Turns sparse checkout on when it is off. History is untouched"
"sparse-checkout set --dirs" = "Directories relative to the repository root, e.g. `src docs/guide`"
"sparse-checkout status" = "Whether the working tree is a sparse checkout and which directories it shows: `{ \"enabled\", \"cone\", \"dirs\" }`"
"diff --from" = "Compare from this revision (older end) instead of the working tree against the index. Pair with `--to`"
"diff --name_only" = "List only the changed files and their status, without hunks"
"diff --to" = "The other end of `--from`: a revision, or `worktree` (the default) for the working tree, staged and unstaged changes of tracked files. The Log's Compare Selection lists the same files"
"lost-commits" = "Commits no branch, tag, remote or stash reaches: what a deleted branch left behind (named by a reflog, or kept only by an undo pin) and, unless `--no-deep`, the dangling commits of the object database. Newest first. Create a branch at one to get it back"
"lost-commits --budget_ms" = "Stop scanning after this many milliseconds (0: no limit); the answer then says `partial`"
"lost-commits --limit" = "Commits to list"
"lost-commits --no_deep" = "Only commits a reflog or an undo pin still names (fast on any size)"
"lost-commits --skip" = "Commits to skip"
"reflog" = "List a reflog, newest first: where `HEAD` or a branch was before, with the date and git's reason, including moves made in a shell. A branch that was deleted has no reflog left. Also spelled `reflog restore` for `reflog-restore`"
"reflog --limit" = "Entries to list"
"reflog --ref" = "`HEAD` (the default) or a branch (or a full ref name)"
"reflog --skip" = "Entries to skip"
"reflog-restore" = "Move a branch (or `HEAD`) to a position of its reflog. A branch that is not checked out just moves. For the checked-out branch the working tree stays safe: with uncommitted changes it refuses unless `--mode` is given. One journal entry: `undo` takes it back. Also spelled `gitpoulpi reflog restore`"
"reflog-restore --dry_run" = "Show what would happen and change nothing"
"reflog-restore --mode" = "With uncommitted changes: `keep` moves and keeps them (refusing if one is in the way), `soft`, `mixed` and `hard` are the reset modes"
"reflog-restore --oid" = "The commit to move it to (a reflog entry's `new`)"
"reflog-restore --ref" = "`HEAD` or a branch"
"undo-restore" = "\"Restore only this\": bring back what one earlier operation removed (a deleted branch or tag, a dropped stash, a discarded or deleted file, a removed remote, an ignore line) without undoing the operations after it. The restore is a new journal entry, so `undo` takes it back. Nothing is overwritten: a file that changed since gets the kept version next to it as `<name>.restored`; a reset, amend or rebase comes back as a new branch at the old tip. Also spelled `gitpoulpi undo restore <id>`. Exit code 2 when it cannot be done (the JSON names the reason)"
"undo-restore --dry_run" = "Show what would happen and change nothing"
"undo-restore --id" = "The entry to restore, as `undo --list` shows its id"
"undo-restore --name" = "Restore the branch or tag under this name (when its old name is taken, or for the branch a reset/amend/rebase restores)"
"commit --workspace" = "Commit as this workspace's default profile (a workspace id; also `GITPOULPI_WORKSPACE`). Applies when the repository is in the workspace and the workspace names a profile that exists; else `general.active_profile`; else the identity of the repository's own git configuration. Without it, that last one is used"
"search" = "Fuzzy search over the branches, tags, worktrees, stashes and commit messages of the current repository, or of every repository of a workspace, plus the cached pull requests and issues. Hits come best first with the characters that matched. A prefix narrows the search: `b:` branches, `t:` tags, `c:` commits, `s:` stashes, `w:` worktrees, `pr:` pull requests, `i:` issues, `r:` repositories (workspace only)"
"search --kinds" = "Only these kinds (repeatable); default all. A prefix in the query narrows further"
"search --limit" = "At most this many hits"
"search --query" = "What to look for, prefix included (`c: fix login`)"
"search --workspace" = "Search every repository of this workspace (an id; also `GITPOULPI_WORKSPACE`). Without one, the current repository"
"workspace" = "Workspaces: named groups of repositories, optionally with a default commit profile. Stored in `workspaces.toml` beside `config.toml`, shared with the TUI"
