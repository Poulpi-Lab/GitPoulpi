"installation set --value" = "The new value (empty clears it)"
path = "Puts GitPoulpi on the user PATH, for new terminals"
"path add" = "Puts the folder GitPoulpi lives in and the alias folder on the user PATH for new terminals: a marked block in the shell startup files (Linux, macOS) or the user PATH of the registry (Windows). Folders already on PATH are left alone"
"path remove" = "Takes out exactly what `path add` put there"
"path status" = "Shows whether the folder GitPoulpi lives in and the alias folder are on the user PATH, and what GitPoulpi added"
uninstall = "Removes what the installer and Settings made (command aliases, the PATH entries, the shortcuts) and, from a release install, the program files. Refuses on a build that is not a release install (no `.gitpoulpi-dist` marker next to the exe). Your config, sessions and repositories are never touched"
"uninstall --keep_files" = "Leave the program files in place (the Windows uninstaller deletes them itself, because a running exe cannot)"
launch = "What the GitPoulpi shortcuts run: shows the window of a GitPoulpi that is already open (`ui.reuse_window`), else starts COMMAND (the terminal that runs GitPoulpi). Starts nothing and starts no daemon when it can show a window"
"launch --command" = "The command to start when there is no window to show, after `--`"
"launch --folder" = """Open this folder: with `ui.reuse_window` on and a window open, the repository that holds it becomes a tab of the most recently focused window (no question asked); otherwise GitPoulpi starts in the chosen terminal on that folder. What the file manager's "Open in GitPoulpi" entry runs"""
"launch --new_window" = "Start a new window even when one is open"
"ai split-plan" = "Print a plan the AI proposes for splitting a commit into several commits, in the JSON form `split-commit --plan` accepts. Applies nothing: review it, then pass it to `split-commit`. Needs `ai.enabled = true`"
"ai split-plan --rev" = "The commit to split (any revision: a sha, `HEAD~2`, ...)"
"ai rewrite-script" = "Print a Lua script the AI writes for a history rewrite from your instruction (\"move every commit made at night to the next morning\"), with the result of `rewrite script check` on it. Runs nothing and changes nothing: read the script, then `rewrite script test` and `rewrite preview --script`. Sends only your instruction, plus, with `--sample N`, the author, date and subject of N commits (never file contents). Needs `ai.enabled = true`"
"ai rewrite-script --instruction" = "What the script must do, in your own words"
"ai rewrite-script --sample" = "Also send the author, date and subject of the newest N commits (at most 50) so the model sees what the data looks like. Off by default: without it no commit data leaves the machine"
"ai rewrite-rules" = "Print the rules and settings the AI proposes for a history rewrite from your description (\"replace my old email a@b with c@d on every commit\", \"remove secrets.txt from all history\"), as the JSON recipe `rewrite preview --recipe-json` reads (save the `recipe` field to a file for `--recipe`), plus what it left out and why. Previews nothing and applies nothing: read the rules, then run `rewrite preview` and `rewrite apply` yourself. Sends only your description, plus, with `--context`, the current branch, the branch and tag names and the authors of the newest 200 commits (never file contents). Needs `ai.enabled = true`"
"ai rewrite-rules --description" = "How the history must be rewritten, in your own words"
"ai rewrite-rules --context" = "Also send the branch and tag names and the authors of the newest 200 commits (at most 100 branch and tag names and 100 authors) so the model can name them exactly. Off by default: without it nothing but your description leaves the machine"
"ai worktree-name" = """Print the worktree name and branch name the AI proposes for a task ("fix the crash when the config is empty"): `{ name, worktree, branch }`, where `worktree` is the name the Create worktree dialog would fill (`worktree-<name>`) and `branch` follows the repository's own branch naming. Creates nothing: pass them to `worktree add`. Sends only your description and the local branch names. Needs `ai.enabled = true`"""
"ai worktree-name --describe" = "The feature, bug or task, in your own words"
"ai hosting-reply" = "Print a draft the AI writes for a conversation on a code host: a comment, an answer in a thread (`--reply-to`), a comment on a line of code (`--path`), a review summary (`--review-summary`), or the description of a new issue (`--issue-title`). The conversation is read from `--conversation` (the JSON `hosting issue comments --json` or `hosting review conversation --json` prints, so `hosting issue comments 7 --json | ai hosting-reply --conversation -` works) or fetched by `--item`; the AI sees the item, the thread, the recent comments within `ai.limits.hosting_reply_context_bytes` and your `--hint`. **It only drafts: the answer is `{ draft, posted: false, ... }` and nothing is posted, edited or deleted**; posting is a separate command you run yourself. The base prompt is `ai.hosting_reply.base_prompt` (edit it in Settings > AI). Needs `ai.enabled = true`"
"ai hosting-reply --conversation" = "The conversation as JSON, as a `hosting` conversation command prints it: a file, `-` for standard input, or the JSON itself. Not for `--issue-title`"
"ai hosting-reply --draft" = "Your own text to improve instead of writing a new one"
"ai hosting-reply --flavor" = "The markup the host takes: `gfm`, `gitlab_md`, `gitea_md`, `common_mark`, `azure_md`, `bitbucket_md`, `html`, `jira_wiki`, `textile`, `youtrack_md`, `trello_md`, `plain_text`, `obsidian_md`. Default: the item's own"
"ai hosting-reply --hint" = "What you want in this answer (\"say I will look at it tomorrow\")"
"ai hosting-reply --issue_title" = "Draft the description of a new issue with this title (no conversation)"
"ai hosting-reply --item" = "The issue or pull request to answer, read from the host itself in the repository's linked source (`7` or `#7` an issue, `!7` a pull request): the same conversation `hosting issue comments 7 --json` prints, without the system events. Instead of `--conversation`"
"ai hosting-reply --line" = "With `--path`: the line"
"ai hosting-reply --path" = "Draft a new review comment on this file of the pull request"
"ai hosting-reply --read_repo" = "Let the AI read the repository for this draft (off unless given or `ai.hosting_reply.read_repository` is true). A local agent reads it itself with read-only tools in the repository folder; an API profile gets a context GitPoulpi builds (the files the conversation names, search hits, the map) within `ai.limits.hosting_reply_*`. The AI only drafts either way; nothing is posted"
"ai hosting-reply --refresh_context" = "Forget the context and the agent session kept from earlier drafts of this repository and read it again (with `--read-repo`)"
"ai hosting-reply --continue_exchange" = 'Continue the exchange of the last `hosting-reply` for this same target (same `--item`, `--reply-to`, `--path`/`--line` or `--issue-title`): the earlier hints and drafts of it go back to the model as earlier turns, so "make it shorter" works. Not needed for a local Claude agent whose session is kept (it remembers). Without the flag a new exchange starts. Kept in the state folder'
"ai hosting-reply --pr_base" = "With `--read-repo`: the base revision of the pull request, to put its diff (against the merge base) in the context"
"ai hosting-reply --pr_head" = "With `--read-repo`: the head revision of the pull request"
"ai hosting-reply --reply_to" = "Answer in the thread with this id (a code thread, a comment or a discussion)"
"ai hosting-reply --review_summary" = "Draft the summary of the review being submitted"
"split-commit" = "Break a commit of the current branch into several, oldest first, following a JSON plan (see `split-source` for the numbering). The last new commit carries the original tree, so descendants and the working tree are unchanged; a pushed commit then needs a force push. One `undo` puts it back. Exit code 2 when refused"
"split-commit --commit" = "The commit to split (any revision: a sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Validate the plan and list what is unassigned; change nothing"
"split-commit --plan" = "The plan (JSON), from a file path or `-` for stdin. A piece is `path` plus an optional `hunk` plus optional `lines` (indices into the hunk's `lines`); a piece with only a `path` is the whole file"
"split-commit --rest_message" = "Put every change the plan leaves unassigned into one final commit with this message"
"split-commit --sign" = "Sign the new commits (and the replayed descendants)"
"split-source" = "The changes of a commit numbered for `split-commit`: every file with its hunks (`id`, lines) or, for files that can only be assigned whole (binary, mode-only, added, deleted, submodule, LFS), the reason. Read-only"
"split-source --commit" = "The commit (any revision: a sha, `HEAD~2`, ...)"
"rewrite" = "Rewrite history in bulk (identities, dates, messages) from a recipe: `preview` plans it without changing anything, `apply` runs the plan you reviewed as ONE undo entry, `run` does both for scripts. Only `push` sends anything: it force-pushes the rewritten refs, each with a lease"
"rewrite apply" = "Apply a previewed run: moves the refs as ONE undo entry (`gitpoulpi undo` puts everything back). Never pushes. Exit code 2 when refused (the repository changed since the preview, wrong digest, ...), 3 when the plan moves refs that are on a remote and `--yes` is missing"
"rewrite apply --digest" = "The digest `rewrite preview` printed: the plan you reviewed"
"rewrite apply --run" = "The run id `rewrite preview` printed"
"rewrite apply --yes" = "Confirm moving refs that are already pushed. Without it such a plan changes nothing and the exit code is 3"
"rewrite diff" = "What a content rule did to one file of one commit of a previewed run: the old and the new file diffed. The lines a secret rule removes are hidden. Reads only"
"rewrite diff --commit" = "The commit as it is before the rewrite (an id from the rows)"
"rewrite diff --path" = "The file, relative to the repository root"
"rewrite diff --run" = "The run id `rewrite preview` printed"
"rewrite discard" = "Drop a previewed run without applying it. Discarding twice is fine"
"rewrite discard --run" = "The run id `rewrite preview` printed"
"rewrite preview" = "Plan a history rewrite without changing anything: counts, the refs that would move, warnings and the first rows. Keeps the plan in the daemon as a run (`run`, `digest`) for `rewrite rows` and `rewrite apply`. The preview also lives on disk in the repository's git dir, so `rewrite apply` works from a later command, after a daemon restart or from another frontend, without starting a daemon; only `rewrite rows` needs the daemon that previewed (a running one, or use `--all` on the preview). Exit code 2 when the recipe is refused"
"rewrite preview --all" = "Print every changed commit"
"rewrite preview --all_local" = "Rewrite every local branch and tag instead of the current branch"
"rewrite preview --committer" = "Committer of rewritten commits: `keep` (default) or `me-now`"
"rewrite preview --include_protected" = "Also rewrite these protected branches that are already pushed (excluded by default; repeatable)"
"rewrite preview --lfs_export" = "LFS rule: turn the LFS pointers matching this glob back into the real files in every commit (repeatable). The objects must be in the local LFS store (`lfs fetch` first); refused with the list otherwise"
"rewrite preview --encoding_exclude" = "With `--reencode`: files it leaves alone (globs, repeatable)"
"rewrite preview --encoding_fallback" = "With `--reencode`: what a file that is neither marked nor UTF-8 is read as when the source is detected (default `windows-1252`)"
"rewrite preview --encoding_paths" = "With `--reencode`: the files it converts (globs, repeatable)"
"rewrite preview --eol" = "Line-ending rule: every text file matching `--eol-paths` gets this ending (`lf` for Linux and macOS, `crlf` for Windows, `cr` for classic Mac); mixed endings are made uniform and binary files are skipped"
"rewrite preview --eol_exclude" = "With `--eol`: files it leaves alone (globs, repeatable)"
"rewrite preview --eol_follow_attributes" = "With `--eol`: read each commit's root `.gitattributes`: `-text` and `binary` files are skipped, `eol=lf` and `eol=crlf` files keep their own ending"
"rewrite preview --eol_paths" = "With `--eol`: the files it converts (globs, repeatable; a pattern without a slash matches at any depth)"
"rewrite preview --reencode" = "Encoding rule: the text files matching `--encoding-paths` are converted to this encoding (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). Binary files, files the source encoding cannot read and characters the target cannot hold are left as they are and counted"
"rewrite preview --reencode_from" = "With `--reencode`: the encoding the files are in. Omitted: detected per file (byte order mark, valid UTF-8, else `--encoding-fallback`)"
