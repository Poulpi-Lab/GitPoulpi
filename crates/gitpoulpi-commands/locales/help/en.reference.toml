"rewrite preview --recipe_json" = "A recipe as a JSON string (for callers that cannot write a file)"
"rewrite preview --refs" = "Rewrite only these local branches or tags (repeatable)"
"rewrite preview --remove_blobs_over" = "Content rule: remove every file larger than this many bytes from every commit"
