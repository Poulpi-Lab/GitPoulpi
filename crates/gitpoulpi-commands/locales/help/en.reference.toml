"hosting issue comment-delete --id" = "Which integration (see `hosting issues`)"
"hosting issue comment-delete --project" = "The project, when it is not the current repository"
"hosting issue comment-delete --reference" = "The item (see `comments`)"
"hosting issue comment-edit" = "Edits one of your own comments on an issue. Outward action"
