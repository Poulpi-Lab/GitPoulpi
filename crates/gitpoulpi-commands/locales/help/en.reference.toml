"show --output" = "With --raw: write the bytes to this file instead of stdout"
"show --path" = "Repo-relative path to read"
"show --raw" = "Write the file's exact bytes (no decoding, no JSON) to stdout, or to --output. For scripts and binary files such as images. Command line only: not available over MCP"
"show --staged" = "Read the staged content instead of a commit's"
"show --worktree" = "Read the file as it is on disk instead of a commit's"
repo-config = "The repository-local `core.autocrlf` and `core.eol` (what Settings > Git & Encoding edits). Undoable like any other operation"
