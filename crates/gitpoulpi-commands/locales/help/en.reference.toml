"ssh-command clear" = "Remove the pin, so the repository uses the ambient ssh setup again"
"ssh-command set" = "Pin the repository to a private key, or to a literal command"
"ssh-command set --command" = "A literal `core.sshCommand` value"
"ssh-command set --key" = 'Private key file: pins `ssh -i "<key>" -o IdentitiesOnly=yes`'
"ssh-command show" = "Show the repository's pinned `core.sshCommand` (null when unset)"
"stage --allow_sensitive" = "Stage files that look sensitive (a private key, a `.env`, a recognized token) too. Without it such a stage is refused and nothing is staged (`[privacy] staging_guard`)"
"stage --hunk" = "Index of a hunk within `--file`'s diff, as `gitpoulpi diff --json` numbers them"
"stage --lines" = "Comma-separated line indices within `--hunk`"
"stage --paths" = "Several paths (files or folders) as ONE operation: one journal entry, one `undo` step (a renamed file is its old and new path)"
"unstage --paths" = "Several paths (files or folders) as ONE operation: one journal entry, one `undo` step (a renamed file is its old and new path)"
"stash push --ai" = "Let the AI name the stash from the working changes (needs `ai.enabled = true`, see `docs/user/ai.md`)"
submodule = "Submodules: list them with their state, register (`init`) or check out (`update`) them"
