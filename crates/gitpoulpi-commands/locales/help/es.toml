"repo-auth set" = "Elige la identidad con la que se autentica este repositorio, por protocolo: `--https` para los remotos HTTPS, `--ssh` para los remotos SSH. El perfil se guarda en el directorio privado de GitPoulpi, nunca en el repositorio. Solo una persona puede definirlo: a un agente se le rechaza (código de salida 2)"
"repo-auth set --cache_minutes" = "Con `token-command`: cuánto tiempo se reutiliza su token, en minutos"
"repo-auth set --use_for_hosting" = "Con `token-command`: el mismo comando también da el token de las llamadas a la API del host de este repositorio (issues, pull requests), en lugar del token personal, por ejemplo un token de instalación de una GitHub App"
"repo-auth set --command" = "Con `--https token-command`: el comando y sus argumentos (la primera palabra es el programa). Escribe `--command` al final: todas las palabras que le siguen, guiones incluidos (`sh -c ...`), forman parte del comando"
"repo-auth set --helper" = "Con `--https helper`: el comando del credential helper. Una persona lo confirma, con su hash (o pasa `--yes`)"
"repo-auth set --hosts" = "Con `helper` o `token-command`: los hosts a los que puede servir (separados por comas o repetidos)"
"repo-auth set --https" = "Identidad HTTPS: `system` (los helpers propios de git), `integration:<id>` (el token de una cuenta de GitPoulpi), `helper` (un credential helper, con `--helper`) o `token-command` (un comando que imprime un token, con `--command` y `--hosts`)"
"repo-auth set --ignore_repo_helpers" = "Con `--https system`: descarta los credential helpers que define el propio repositorio y conserva los del sistema y los globales"
"repo-auth set --known_hosts" = "Con `--ssh key:` o `integration-key:`: el archivo `known_hosts`"
"repo-auth set --ssh" = "Identidad SSH: `system` (la configuración y el agente propios de ssh), `key:<ruta>` (un archivo de clave privada, ofrecido en exclusiva) o `integration-key:<id>` (la clave de una cuenta de GitPoulpi)"
"repo-auth set --strict" = "Con `--ssh key:` o `integration-key:`: rechaza las claves de host desconocidas (`StrictHostKeyChecking=yes`)"
"repo-auth set --username" = "Un nombre de usuario: con `system`, `credential.username` (permite que un gestor de credenciales elija una de varias cuentas); con `integration:<id>`, el nombre de usuario que se envía con el token"
"repo-auth set --yes" = "Confirma un helper o un comando de token sin la pregunta interactiva (el comando y su hash se siguen imprimiendo)"
"repo-auth show" = "Muestra con qué identidad se autentica este repositorio: el perfil guardado, la identidad que usará cada remoto, los ajustes que el perfil anula y cualquier aviso. Nunca imprime un secreto; un helper o un comando de token solo se imprime a una persona (un agente recibe `{set, sha256}`)"
"repo-auth test" = "Prueba la conexión de cada remoto (o de uno) con el perfil aplicado, sin cambiar nada: lista las ramas del remoto o, con `--push`, pregunta si se aceptaría un push. Responde con el informe de cada remoto y la identidad que usó. Accede a la red"
"repo-auth test --push" = "Comprueba también que se aceptaría un push"
"repo-auth test --remote" = "Solo este remoto (por defecto: todos los remotos)"
"apply-commit" = "Aplica solo al árbol de trabajo los cambios que hizo un commit (incluso uno perdido): el índice y HEAD no cambian. Todo o nada: si un archivo no se aplica limpiamente, no cambia nada (`stash from-commit` guarda los cambios como stash en su lugar). Un commit de merge se rechaza. `undo` lo revierte"
"apply-commit --commit" = "El commit cuyos cambios se aplican (cualquier revisión: un sha, `HEAD~2`, ...)"
"stash from-commit" = "Guarda los cambios que hizo un commit (incluso uno perdido) como un stash nuevo, sin tocar el árbol de trabajo. `undo` lo vuelve a eliminar"
"stash from-commit --commit" = "El commit cuyos cambios se conservan (cualquier revisión: un sha, `HEAD~2`, ...)"
"stash from-commit --message" = "El mensaje del stash; si se omite, uno que nombra el commit"
"branch upstream" = "Los varios remotos de una rama: el upstream principal más destinos de push adicionales y fuentes de pull opcionales, guardados en su propia sección de configuración"
"branch upstream add" = "Añade `<remote>[:<dst>]` como destino de push adicional (`<dst>` es el nombre de la rama en ese remoto, por defecto el mismo nombre). Se puede deshacer"
"branch upstream add --branch" = "La rama (por defecto, la activa)"
"branch upstream add --pull" = "Lo convierte también en fuente de pull"
"branch upstream add --target" = "`<remote>` o `<remote>:<dst>`"
"branch upstream list" = "El upstream principal de la rama, sus destinos de push adicionales y sus fuentes de pull, cada uno con su situación (por delante, por detrás, relación) según las refs de seguimiento remoto tal como están. Solo lectura, sin red"
"branch upstream list --branch" = "La rama (por defecto, la activa)"
"branch upstream primary" = "Define el upstream principal (`origin/main`): la misma petición que `branch set-upstream`"
"branch upstream primary --branch" = "La rama (por defecto, la activa)"
"branch upstream pull" = "Activa o desactiva `<remote>[:<dst>]` como fuente de pull: un pull normal también lo integra"
"branch upstream pull --branch" = "La rama (por defecto, la activa)"
"branch upstream pull --off" = "Deja de hacer pull desde él"
"branch upstream pull --on" = "Lo convierte en fuente de pull"
"branch upstream pull --target" = "`<remote>` o `<remote>:<branch>`"
"branch upstream remove" = "Quita todos los destinos de push adicionales y fuentes de pull que nombran `<remote>`. El upstream principal no se toca (usa `unset-upstream`). Se puede deshacer"
"branch upstream remove --branch" = "La rama (por defecto, la activa)"
"remote-group" = "Una rama con varios remotos (destinos de push adicionales, fuentes de pull): su situación frente a cada uno. Consulta `branch upstream` para cambiarlos"
"remote-group status" = "La situación de la rama activa (o de `--branch`) frente a cada uno de sus remotos: upstream principal, destinos de push adicionales, fuentes de pull. Solo lectura, sin red"
"remote-group status --branch" = "La rama (por defecto, la activa)"
"pull --all_sources" = "Hace pull del upstream principal y de cada fuente de pull de la rama (ver `branch upstream pull`), cada uno con `--mode`. Primero planifica: todo lo que no sea un fast-forward o la integración propia del modo pide `--resolve` (código 3, nada cambia). Una parada por conflictos sale con código 4 y `stopped`; se retoma con `remote-group continue`"
"pull --branch" = "Con `--all-sources`: la rama (por defecto, la activa)"
"pull --no_preflight" = "Con `--all-sources`: no consulta antes a los remotos"
"pull --resolve" = "Con `--all-sources`: `REMOTE=ff|merge|rebase|skip` (repetible), la decisión para un remoto sobre el que preguntó el plan"
"pull --all_branches" = "Hace pull de cada rama local que tiene upstream: hace fetch de sus remotos, avanza con fast-forward las ramas que solo van por detrás (a esas nunca se les aplica merge ni rebase) y después integra la rama activa como un pull normal, con `--mode` (por defecto, el modo de pull configurado). Las ramas divergentes se omiten y se informa de ellas. Un conflicto en la rama activa deja el mismo estado que un pull con conflictos; las demás ramas ya están actualizadas. Una sola entrada de deshacer cubre las ramas movidas. Código de salida 4: falló una rama o un fetch; 2: rechazado (hay un auto-stash pendiente o hace falta uno)"
"pull --no_fetch" = "Con `--all-branches`: no hace fetch antes y usa las ramas de seguimiento remoto tal como están"
"pull --prune" = "Con `--all-branches`: al hacer fetch, elimina las ramas de seguimiento remoto que ya no existen en el remoto"
"pull --worktrees" = "Con `--all-branches`: qué hacer con una rama atrasada que está activa en otro worktree: `skip` (por defecto) solo la informa, `update` la avanza allí con fast-forward"
"push --all_targets" = "Hace push al upstream principal y a cada destino de push adicional de la rama (ver `branch upstream add`). Primero planifica: si todos los remotos son un push simple o están al día, se ejecuta; si no, responde `needs_resolution` (código 3, nada cambia). Código 4: algún remoto falló o un merge se detuvo por conflictos (`stopped`)"
"push --no_preflight" = "No consulta antes a los remotos (usa las refs de seguimiento remoto)"
"push --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (repetible): la decisión para un remoto sobre el que preguntó el plan"
"push --tags" = "Hace push también de los tags sin enviar a cada remoto que aceptó la rama"
"push --to" = "Hace push exactamente a estos remotos (`<remote>` o `<remote>:<dst>`, repetible), solo para este push; la configuración no cambia. Mismo plan, `--resolve` y ejecución que `--all-targets`"
"push --yes" = "Confirma un force push elegido con `--resolve REMOTE=force`. Sin esto, un push así no cambia nada y sale con código 3"
"remote-group abort" = "Descarta la ejecución agrupada guardada: aborta el merge o rebase que inició. Los push ya hechos se quedan"
"remote-group abort --run" = "El id de la ejecución guardada, para asegurarse de que sigue siendo la que se quiere"
"remote-group continue" = "Retoma la ejecución agrupada guardada cuando su merge o rebase está concluido (nunca es automático). Responde a un `needs_resolution` con `--resolve`"
"remote-group continue --branch" = "La rama (por defecto, la activa); solo se lee con `--resolve`"
"remote-group continue --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (repetible): la decisión para un remoto sobre el que preguntó la respuesta anterior"
"remote-group continue --run" = "El id de la ejecución guardada, para asegurarse de que sigue siendo la que se quiere"
"remote-group continue --yes" = "Confirma los force push nombrados por `--resolve`"
"remote-group plan" = "Lo que haría un push agrupado (o, con `--pull`, un pull agrupado), remoto por remoto: la situación de cada uno, la acción sugerida y las demás permitidas. Consulta a los remotos (`ls-remote`, un fetch de aquellos cuya punta se desconoce) salvo con `--no-preflight`; no cambia nada"
"remote-group plan --branch" = "La rama (por defecto, la activa)"
"remote-group plan --no_preflight" = "No consulta a los remotos: usa las refs de seguimiento remoto tal como están"
"remote-group plan --pull" = "Planifica el pull agrupado (el principal y las fuentes de pull)"
"remote-group plan --to" = "Planifica un push exactamente a estos remotos (`<remote>` o `<remote>:<dst>`, repetible) en lugar de los destinos configurados"
"remote-group retry" = "Vuelve a ejecutar los destinos de la ejecución guardada que fallaron, se cancelaron a mitad de push o nunca se intentaron"
"remote-group retry --run" = "El id de la ejecución guardada, para asegurarse de que sigue siendo la que se quiere"
"hosting issue comment" = "Publica un comentario en un issue, o responde a una discusión con `--reply-to`. Acción hacia el exterior: se publica al instante, con la identidad que tiene el token (`posted_as`), y no se puede deshacer aquí"
"hosting issue comment --body" = "El comentario (markdown)"
"hosting issue comment --body_file" = "Lee el comentario de este archivo (`-` lee stdin)"
"hosting issue comment --id" = "Qué integración (ver `hosting issues`)"
"hosting issue comment --internal" = "Solo lo ven los miembros del proyecto (GitLab)"
"hosting issue comment --project" = "Publica en un proyecto que no es el repositorio actual"
"hosting issue comment --reference" = "El elemento (ver `comments`)"
"hosting issue comment --reply_to" = "Responde a esta discusión (su `discussion_id` de `comments`) en lugar de publicar un comentario nuevo"
"hosting issue comment-delete" = "Elimina definitivamente uno de tus propios comentarios en un issue. Acción hacia el exterior"
"hosting issue comment-delete --comment_id" = "El id del comentario, tal como lo imprime `comments`"
"hosting issue comment-delete --id" = "Qué integración (ver `hosting issues`)"
"hosting issue comment-delete --project" = "El proyecto, cuando no es el repositorio actual"
"hosting issue comment-delete --reference" = "El elemento (ver `comments`)"
"hosting issue comment-edit" = "Edita uno de tus propios comentarios en un issue. Acción hacia el exterior"
"hosting issue comment-edit --body" = "El texto nuevo (markdown)"
"hosting issue comment-edit --body_file" = "Lee el texto nuevo de este archivo (`-` lee stdin)"
"hosting issue comment-edit --comment_id" = "El id del comentario, tal como lo imprime `comments`"
"hosting issue comment-edit --id" = "Qué integración (ver `hosting issues`)"
"hosting issue comment-edit --project" = "El proyecto, cuando no es el repositorio actual"
"hosting issue comment-edit --reference" = "El elemento (ver `comments`)"
"hosting issue comments" = "La conversación completa de un issue: su descripción, comentarios y eventos, con quién publica como quién y qué te deja hacer el host (`capabilities`). Solo lectura; páginas de hasta 300 entradas (`--older`)"
"hosting issue comments --id" = "Qué integración (ver `hosting issues`)"
"hosting issue comments --limit" = "Imprime como máximo este número de entradas (las más recientes). La ventana que responde el host contiene hasta 300; las que se dejan fuera se cuentan en `trimmed_older`"
"hosting issue comments --no_events" = "Deja fuera los eventos del sistema (etiquetas, asignaciones, cambios de estado)"
"hosting issue comments --older" = "El cursor `older` de la respuesta anterior: carga la ventana previa"
"hosting issue comments --project" = "Lee un proyecto que no es el repositorio actual (no hace falta clonarlo)"
"hosting issue comments --reference" = "El elemento: un número (`142`, `#142`, `!12`) o la clave propia del tracker (`ABC-12`, `ENG-7`, un id de tarjeta de Trello o su enlace corto)"
"hosting markdown" = "Qué es el texto de un issue o pull request una vez limpiado y leído como lo lee la app: secuencias de control eliminadas, referencias que contiene (`#12`, `@login`, ids de commit, enlaces) halladas y el texto ajustado a un ancho. No lee nada del host y no cambia nada"
"hosting markdown --body" = "El texto"
"hosting markdown --body_file" = "Lee el texto de este archivo (`-` lee stdin)"
"hosting markdown --for_item" = "A qué tipo de elemento pertenece el texto (`#12` es un issue o una solicitud en algunos hosts)"
"hosting markdown --id" = "La integración cuya gramática siguen las referencias (ver `hosting list`). Sin ella solo se resuelven enlaces y menciones"
"hosting markdown --project" = "El proyecto al que pertenece el texto, para que `#12` apunte a su página (`owner/name`, `group/project`)"
"hosting markdown --width" = "Ajusta las líneas a este número de columnas (por defecto 80)"
"hosting review comment-delete" = "Elimina definitivamente uno de tus propios comentarios en un pull/merge request. Acción hacia el exterior"
"hosting review comment-delete --comment_id" = "El id del comentario, tal como lo imprime `comments`"
"hosting review comment-delete --id" = "Qué integración (ver `hosting issues`)"
"hosting review comment-delete --project" = "El proyecto, cuando no es el repositorio actual"
"hosting review comment-delete --reference" = "El elemento (ver `comments`)"
"hosting review comment-edit" = "Edita uno de tus propios comentarios en un pull/merge request. Acción hacia el exterior"
"hosting review comment-edit --body" = "El texto nuevo (markdown)"
"hosting review comment-edit --body_file" = "Lee el texto nuevo de este archivo (`-` lee stdin)"
"hosting review comment-edit --comment_id" = "El id del comentario, tal como lo imprime `comments`"
"hosting review comment-edit --id" = "Qué integración (ver `hosting issues`)"
"hosting review comment-edit --project" = "El proyecto, cuando no es el repositorio actual"
"hosting review comment-edit --reference" = "El elemento (ver `comments`)"
"hosting review conversation" = "La conversación completa de un pull/merge request: comentarios, revisiones, hilos de código y eventos, del más antiguo al más reciente, con la ventana más reciente primero (`--older` para la anterior). Solo lectura"
"hosting review conversation --id" = "Qué integración (ver `hosting issues`)"
"hosting review conversation --limit" = "Imprime como máximo este número de entradas (las más recientes). La ventana que responde el host contiene hasta 300; las que se dejan fuera se cuentan en `trimmed_older`"
"hosting review conversation --no_events" = "Deja fuera los eventos del sistema (etiquetas, asignaciones, cambios de estado)"
"hosting review conversation --older" = "El cursor `older` de la respuesta anterior: carga la ventana previa"
"hosting review conversation --project" = "Lee un proyecto que no es el repositorio actual (no hace falta clonarlo)"
"hosting review conversation --reference" = "El elemento: un número (`142`, `#142`, `!12`) o la clave propia del tracker (`ABC-12`, `ENG-7`, un id de tarjeta de Trello o su enlace corto)"
"ui show issue --view" = "Qué abrir: los detalles (por defecto) o la conversación"
"ui show pr --view" = "Qué abrir: los detalles (por defecto) o la conversación"
"sequence" = "Secuencias con nombre de comandos de la paleta (macros) como \"Backup\": stage de todo, escribir el mensaje de commit con la IA, commit, push. Permite listarlas, comprobarlas, añadirlas y eliminarlas, o ejecutar una sin interfaz"
"sequence add" = "Añade o sustituye secuencias desde un archivo TOML (`[[sequences]]` con `id`, `name`, `steps`, como `config.toml`; también sirve un archivo con una sola secuencia en el nivel superior). Cada una se valida antes: un solo problema y no se escribe nada (código de salida 2). Se conservan las demás claves del archivo en el que se escribe"
"sequence add --file" = "El archivo TOML"
"sequence add --replace" = "Sustituye una secuencia que tenga el mismo id en el mismo lugar"
"sequence add --scope" = "Dónde guardar, por encima del `scope` propio del archivo (por defecto `installation`)"
"sequence list" = "Las secuencias que ve esta instalación (las propias y las de todo el equipo en `config.toml`), cada una con sus pasos, sus problemas de validación y si puede ejecutarse sin interfaz. También se lista el `.gitpoulpi/sequences.toml` del repositorio actual, con `trusted` según lo decidió el usuario (`sequence trust`) y un resumen `repo_trust`: las secuencias de un repositorio son comandos de otra persona, así que solo se ejecutan mientras el archivo sea de confianza exactamente como está ahora. No necesita daemon"
"sequence remove" = "Elimina una secuencia de la configuración de esta instalación o del equipo (o, con `--scope repo`, del archivo del repositorio actual)"
"sequence remove --id" = "El id de la secuencia"
"sequence remove --scope" = "De dónde eliminarla. Omitido: la propia de esta instalación y, si no, la de todo el equipo"
"sequence run" = "Ejecuta una secuencia sin interfaz a través del daemon, una petición por paso con la misma correspondencia que el comando equivalente (`stage --all`, `commit`, `push`, ...). Todo se comprueba antes y no se ejecuta nada cuando un paso es desconocido, solo válido en la interfaz de terminal (terminal, abrir en, abrir pestaña, agente aquí) o `force_push_with_lease` (nunca sin interfaz): código de salida 2 con `problems`. Un paso que se pausa (su pausa es `always`, o `default` en un paso que normalmente pregunta: la revisión del mensaje de la IA, un diálogo de nombre) necesita `--yes`; si no, código de salida 3 y nada cambia; `--yes` acepta la propuesta tal cual (el mensaje de la IA, la plantilla de nombre). Un paso que falla detiene la ejecución con el código de salida 2 y los pasos anteriores se quedan hechos (cada uno se puede deshacer por separado)"
"sequence run --dry_run" = "Imprime el plan resuelto (el comando de cada paso, con las plantillas expandidas) y no cambia nada"
"sequence run --id" = "El id de la secuencia"
"sequence run --yes" = "Acepta tal como se proponen los pasos que se pausarían"
"sequence show" = "Una secuencia con sus pasos y, para cada paso, qué hace y si puede ejecutarse sin interfaz"
"sequence show --id" = "El id de la secuencia (`gitpoulpi sequence list`)"
"sequence trust" = "Confía en las secuencias del `.gitpoulpi/sequences.toml` del repositorio tal como están ahora (usa `--repo PATH` para otro repositorio): a partir de entonces se listan, se enlazan a un atajo y se ejecutan como las tuyas. Cualquier cambio de un id, un comando, una pausa o una opción vuelve a preguntar; un nombre nuevo no. No hace falta mostrar antes las secuencias y lo que hacen en un terminal: el JSON lista cada paso. Código de salida 2 cuando el repositorio no tiene ese archivo"
"sequence untrust" = "Olvida la confianza concedida con `sequence trust`: las secuencias del repositorio se vuelven a listar pero nunca se ejecutan"
"sequence validate" = "Comprueba una secuencia con el vocabulario de pasos: pasos desconocidos o excluidos, opciones erróneas, una pausa forzada. Sin id ni archivo, todas las secuencias visibles. Código de salida 2 cuando algo tiene un problema"
"sequence validate --file" = "Comprueba en su lugar las secuencias de este archivo TOML (`[[sequences]]`)"
"sequence validate --id" = "El id de la secuencia"
