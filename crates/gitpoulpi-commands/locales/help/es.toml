"rewrite script check#long" = """
Compila un script Lua e imprime su cabecera (nombre, ventana, parámetros), las funciones que define y cada problema. Código de salida 2 si tiene problemas. Solo lee; no se ejecuta nada sobre ningún commit.

Para un script de shell, Python o Lua externo (sin aislar) dice además si se encontró el intérprete y si se confía en el script, y para uno de confianza hace un handshake de prueba: arranca el script una vez con un commit inventado (`"dry_run": true`) y comprueba la respuesta. Un script en el que no se confía nunca se arranca."""
"rewrite script test --language" = "`lua`, `shell`, `python` o `lua-external`; por defecto, según la extensión"
"rewrite script test --trust" = "Confía antes en este script (decisión de una persona, rechazada por MCP)"
"rewrite script trust" = "Confía en un script externo (shell, Python, Lua externo) según su contenido: se recuerda el SHA-256 del archivo para este repositorio, así que el script puede ejecutarse (preview, run, test); si el archivo cambia, se vuelve a preguntar. Estos scripts no están aislados: se ejecutan con tus permisos, así que lee antes el archivo. Solo una persona puede hacerlo: no existe herramienta MCP para ello"
"rewrite script trust --file" = "El archivo del script"
