"mailmap check" = "Muestra cómo aparecen las identidades (`Nombre <correo>` o `<correo>`) a través del `.mailmap` del repositorio: el nombre y el correo canónicos, o la misma identidad si nada la asigna. Solo lee"
"mailmap check --identities" = "Las identidades a resolver, cada una `Nombre <correo>` o `<correo>`"
"mailmap list" = "Lista cada nombre y correo que fue autor o committer de algún commit del alcance, con cuántos commits tiene como autor y como committer, de más a menos, y la identidad a la que el `.mailmap` ya lo asigna (`mapped_to`). Solo lee"
