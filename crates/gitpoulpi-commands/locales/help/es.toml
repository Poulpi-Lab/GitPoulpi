"flow set-parent --parent" = "Su padre (una rama local existente)"
"flow set-parent --run_hooks" = "Ejecuta los hooks que el flujo de trabajo configura para esta acción (comandos de shell del archivo del flujo de trabajo, mostrados con su salida). Nunca se ejecutan salvo que se pidan; si falta esta opción se pregunta en un terminal"
"flow set-parent --yes" = "Ejecuta el plan sin preguntar. Sin ella se pregunta en un terminal; en cualquier otro caso imprime el plan y sale con el código 3"
"flow start" = "Empieza una rama temática de un tipo del flujo de trabajo: la nombra según el patrón del tipo (`feature/{slug}`, `release/{version}`, ...), la crea desde el padre del tipo (o `--from`), hace checkout de ella y registra el padre. Imprime los pasos que hará; solo los ejecuta con `--yes` (o tras la pregunta interactiva en un terminal). Deshacer lo revierte todo"
"flow start --autostash" = "Hace stash de los cambios locales que bloquean un checkout o un merge y los devuelve después, diga lo que diga `general.auto_stash`"
"flow start --dry_run" = "Imprime el plan (cada paso, bloqueos, avisos) como JSON y no cambia nada"
"flow start --fields" = "Valores de los tokens del patrón como `nombre=valor` (`slug=login`, `version=1.2.0`, `issue=42`); una palabra suelta es el `slug`. `user` y `date` toman por defecto tu usuario y hoy"
"flow start --from" = "Empieza desde esta rama, rama remota o tag en lugar del padre del tipo"
"flow start --no_hooks" = "Omite los hooks configurados sin preguntar"
"flow start --publish" = "Hace push de la rama nueva y fija su upstream"
"flow start --run_hooks" = "Ejecuta los hooks que el flujo de trabajo configura para esta acción (comandos de shell del archivo del flujo de trabajo, mostrados con su salida). Nunca se ejecutan salvo que se pidan; si falta esta opción se pregunta en un terminal"
"flow start --type" = "El tipo de rama (`feature`, `hotfix`, `release`, ...): ver `flow config --show-effective`"
"flow start --yes" = "Ejecuta el plan sin preguntar. Sin ella se pregunta en un terminal; en cualquier otro caso imprime el plan y sale con el código 3"
"flow status" = "Cada rama del repositorio clasificada según su flujo de trabajo de ramas: base o temática (con su tipo), padre y cuántos commits le lleva de ventaja y de retraso respecto a ese padre. Sin archivo de flujo de trabajo, todas las ramas quedan sin clasificar; `flow detect` propone uno"
"flow sync" = "Pone una rama al día con su padre (merge o rebase, según la estrategia configurada de la rama) y, con `--stack`, las ramas construidas sobre ella, en orden. Imprime el plan y necesita `--yes`; código de salida 3 sin ella"
"flow sync --abort" = "Renuncia a la acción detenida: aborta el merge o el rebase en curso y vuelve a la rama en la que empezó. Los pasos ya completados se quedan (deshazlos con `undo`)"
"flow sync --autostash" = "Hace stash de los cambios locales que bloquean un checkout o un merge y los devuelve después, diga lo que diga `general.auto_stash`"
"flow sync --branch" = "La rama que actualizar. Por defecto, la activa"
"flow sync --continue_" = "Continúa tras resolver el conflicto: hace commit del merge o continúa el rebase y ejecuta los pasos restantes. Tras un hook fallido, vuelve a ejecutar ese paso"
"flow sync --dry_run" = "Imprime el plan (cada paso, bloqueos, avisos) como JSON y no cambia nada"
"flow sync --merge" = "Hace merge en lugar de rebase"
"flow sync --no_hooks" = "Omite los hooks configurados sin preguntar"
"flow sync --rebase" = "Hace rebase en lugar de merge"
"flow sync --run_hooks" = "Ejecuta los hooks que el flujo de trabajo configura para esta acción (comandos de shell del archivo del flujo de trabajo, mostrados con su salida). Nunca se ejecutan salvo que se pidan; si falta esta opción se pregunta en un terminal"
"flow sync --stack" = "Actualiza también las ramas cuyo padre es esta, de forma recursiva"
"flow sync --yes" = "Ejecuta el plan sin preguntar. Sin ella se pregunta en un terminal; en cualquier otro caso imprime el plan y sale con el código 3"
"flow templates" = "Las plantillas de flujo de trabajo incorporadas (Git Flow, GitHub Flow, GitLab Flow, Trunk-based, Custom) con sus ramas base y tipos de rama"
"flow trust-hooks" = "Revisa y da por fiables los hooks de flujo de trabajo que confirma el repositorio (los `[hooks]` de `.gitpoulpi/workflow.toml`): comandos de shell que se ejecutarían en tu equipo. Sin `--hash` solo imprime `{hash, hooks, trusted}`; con el hash recuerda la confianza, pero solo si el archivo en disco sigue teniendo exactamente ese hash, de modo que lo que lees es lo que se da por fiable. Un archivo modificado vuelve a preguntar. Los hooks de tu propio override nunca lo necesitan. Solo una persona puede hacerlo: no hay herramienta MCP para ello"
"flow trust-hooks --hash" = "El hash que imprime `flow trust-hooks` (o un `--run-hooks` rechazado): confía en los hooks con ese hash"
alias = "El alias de comando (`gp` o cualquier nombre) que inicia GitPoulpi desde un terminal: el equivalente para scripts de Ajustes > Lanzador"
"alias create" = "Crea `<name>` (por ejemplo `gp`) para iniciar GitPoulpi: un enlace en Linux y macOS, un archivo `.cmd` en Windows, en una carpeta bin de cada usuario. Nunca se reemplaza un archivo que no sea de GitPoulpi. Añade la carpeta al PATH con `path add`"
"alias create --add" = "Crea la variante de añadir (por ejemplo `gpa`): ejecuta `gitpoulpi --add`, que abre la carpeta actual en una pestaña nueva del GitPoulpi que ya está en marcha"
"alias create --name" = "El nombre del comando: solo letras, dígitos, `-`, `_` y `.`"
"alias remove" = "Elimina los alias de comando que creó GitPoulpi (todos, o solo `<name>`); nunca se toca un archivo que no sea de GitPoulpi"
"alias remove --name" = "El alias que se elimina (por defecto: todos los que creó GitPoulpi)"
"alias status" = "Muestra los alias de comando que creó GitPoulpi (y qué ejecuta cada uno) y los nombres de `ui.command_alias` y `ui.command_alias_add`"
installation = "Qué instalación de GitPoulpi es esta y sus ajustes propios (color, nombre, alias, entorno). Varias instalaciones pueden convivir en un mismo equipo"
"installation show" = "Muestra qué instalación de GitPoulpi es esta (su id, tipo, carpeta y entorno), si es la principal, sus propios ajustes y las demás instalaciones de este equipo"
"installation set" = "Establece un ajuste propio de esta instalación: `name`, `name_with_version`, `logo_color`, `command_alias`, `command_alias_add`, `folder_menu_submenu`, `env` o `mcp_bind`. Un valor vacío lo borra. El color y los alias de la instalación principal también se escriben en las claves compartidas `ui.*` que leen las versiones anteriores"
"installation set --field" = "El campo que se establece"
"installation set --value" = "El nuevo valor (vacío lo borra)"
path = "Añade GitPoulpi al PATH del usuario, para los terminales nuevos"
"path add" = "Añade al PATH del usuario, para los terminales nuevos, la carpeta donde vive GitPoulpi y la carpeta de alias: un bloque marcado en los archivos de arranque del shell (Linux, macOS) o el PATH de usuario del registro (Windows). Las carpetas que ya están en el PATH se dejan como están"
"path remove" = "Quita exactamente lo que añadió `path add`"
"path status" = "Muestra si la carpeta donde vive GitPoulpi y la carpeta de alias están en el PATH del usuario, y qué añadió GitPoulpi"
uninstall = "Elimina lo que crearon el instalador y Ajustes (los alias de comando, las entradas del PATH, los accesos directos) y, en una instalación de versión publicada, los archivos del programa. Se rechaza en una compilación que no sea una instalación de versión publicada (sin marca `.gitpoulpi-dist` junto al ejecutable). Nunca se tocan tu configuración, tus sesiones ni tus repositorios"
"uninstall --keep_files" = "Deja en su sitio los archivos del programa (el desinstalador de Windows los elimina él mismo, porque un ejecutable en marcha no puede)"
launch = "Lo que ejecutan los accesos directos de GitPoulpi: muestra la ventana de un GitPoulpi que ya está abierto (`ui.reuse_window`) o, si no hay ninguno, inicia COMMAND (el terminal que ejecuta GitPoulpi). Si puede mostrar una ventana, no inicia nada ni arranca ningún daemon"
"launch --command" = "El comando que se inicia cuando no hay ventana que mostrar, tras `--`"
"launch --folder" = """Abre esta carpeta: con `ui.reuse_window` activado y una ventana abierta, el repositorio que la contiene pasa a ser una pestaña de la ventana usada más recientemente (sin preguntar); si no, GitPoulpi se inicia en el terminal elegido sobre esa carpeta. Es lo que ejecuta la entrada «Abrir en GitPoulpi» del administrador de archivos"""
"launch --new_window" = "Inicia una ventana nueva aunque haya una abierta"
"ai split-plan" = "Muestra el plan con el que la IA propone dividir un commit en varios, en el JSON que acepta `split-commit --plan`. No aplica nada: revísalo y pásalo a `split-commit`. Requiere `ai.enabled = true`"
"ai split-plan --rev" = "El commit a dividir (cualquier revisión: un sha, `HEAD~2`, ...)"
"ai rewrite-script" = "Imprime un script Lua que la IA escribe para una reescritura del historial a partir de tu instrucción («pasar a la mañana siguiente todos los commits hechos de noche»), con el resultado de `rewrite script check` sobre él. No ejecuta ni cambia nada: lee el script, luego usa `rewrite script test` y `rewrite preview --script`. Envía solo tu instrucción y, con `--sample N`, el autor, la fecha y el asunto de N commits (nunca el contenido de los archivos). Requiere `ai.enabled = true`"
"ai rewrite-script --instruction" = "Lo que debe hacer el script, con tus propias palabras"
"ai rewrite-script --sample" = "Envía también el autor, la fecha y el asunto de los N commits más recientes (como máximo 50) para que el modelo vea cómo son los datos. Desactivado por defecto: sin esto ningún dato de commits sale de la máquina"
"ai rewrite-rules" = "Muestra las reglas y ajustes que la IA propone para reescribir el historial a partir de tu descripción (\"cambiar mi antiguo correo a@b por c@d en todos los commits\", \"quitar secrets.txt de todo el historial\"), como la receta JSON que lee `rewrite preview --recipe-json` (guarda el campo `recipe` en un archivo para `--recipe`), con lo que dejó fuera y por qué. No previsualiza ni aplica nada: lee las reglas y luego ejecuta tú mismo `rewrite preview` y `rewrite apply`. Solo envía tu descripción y, con `--context`, la rama actual, los nombres de ramas y etiquetas y los autores de los 200 commits más recientes (nunca el contenido de los archivos). Requiere `ai.enabled = true`"
"ai rewrite-rules --description" = "Cómo debe reescribirse el historial, con tus palabras"
"ai rewrite-rules --context" = "Envía también los nombres de ramas y etiquetas y los autores de los 200 commits más recientes (como máximo 100 nombres de ramas y etiquetas y 100 autores) para que el modelo pueda nombrarlos con exactitud. Desactivado por defecto: sin esto, solo tu descripción sale de la máquina"
"ai sequence-draft" = "Imprime la secuencia de acciones que la IA redacta a partir de tu descripción (\"stage de todo, escribir el mensaje con la IA, commit y push\") o, con `--edit <id>`, la versión modificada de una secuencia existente: `{ sequence, toml, problems, notes, suggested_shortcut, shortcut_conflict, retried, context, applied: false }`. Cada paso se comprueba por separado con el vocabulario de pasos: un paso desconocido, destructivo, anidado o con una pausa imposible se deja fuera y se lista en `problems` (código de salida 2). No guarda ni ejecuta nada: lee la secuencia y guárdala tú con `sequence add --file`. Solo envía tu descripción y, con `--edit`, esa secuencia; con `--context` también los nombres de los remotos, los ids de los perfiles de IA y las etiquetas de Abrir en. Requiere `ai.enabled = true`"
"ai sequence-draft --description" = "Lo que debe hacer la secuencia o, con `--edit`, cómo cambiarla, con tus propias palabras"
"ai sequence-draft --edit" = "Modifica esta secuencia (su id, `sequence list`) en lugar de crear una: se envía junto con la petición, y la propuesta conserva su id y su ámbito"
"ai sequence-draft --context" = "Envía también los nombres de los remotos, los ids de los perfiles de IA y las etiquetas de Abrir en para que el modelo pueda nombrarlos con exactitud. Desactivado por defecto: sin ello, de la máquina no sale nada salvo tu descripción (y la secuencia que se edita)"
"ai worktree-name" = "Muestra el nombre de worktree y el nombre de rama que la IA propone para una tarea (\"corregir el fallo cuando la configuración está vacía\"): `{ name, worktree, branch }`, donde `worktree` es el nombre que rellenaría el diálogo Crear worktree (`worktree-<name>`) y `branch` sigue los nombres de rama del propio repositorio. No crea nada: pásalos a `worktree add`. Solo envía tu descripción y los nombres de las ramas locales. Requiere `ai.enabled = true`"
"ai worktree-name --describe" = "La función, el error o la tarea, con tus palabras"
"ai hosting-reply" = "Imprime un borrador que la IA escribe para una conversación en un host de código: un comentario, una respuesta en un hilo (`--reply-to`), un comentario sobre una línea de código (`--path`), un resumen de revisión (`--review-summary`) o la descripción de un issue nuevo (`--issue-title`). La conversación se lee de `--conversation` (el JSON que imprimen `hosting issue comments --json` o `hosting review conversation --json`, así que `hosting issue comments 7 --json | ai hosting-reply --conversation -` funciona) o se obtiene con `--item`; la IA ve el elemento, el hilo, los comentarios recientes dentro de `ai.limits.hosting_reply_context_bytes` y tu `--hint`. **Solo redacta: la respuesta es `{ draft, posted: false, ... }` y no se publica, edita ni elimina nada**; publicar es otro comando que ejecutas tú. El prompt base es `ai.hosting_reply.base_prompt` (edítalo en Ajustes > IA). Requiere `ai.enabled = true`"
"ai hosting-reply --conversation" = "La conversación en JSON, tal como la imprime un comando de conversación de `hosting`: un archivo, `-` para la entrada estándar o el propio JSON. No sirve con `--issue-title`"
"ai hosting-reply --draft" = "Tu propio texto a mejorar en lugar de escribir uno nuevo"
"ai hosting-reply --flavor" = "El markup que admite el host: `gfm`, `gitlab_md`, `gitea_md`, `common_mark`, `azure_md`, `bitbucket_md`, `html`, `jira_wiki`, `textile`, `youtrack_md`, `trello_md`, `plain_text`, `obsidian_md`. Por defecto: el propio del elemento"
"ai hosting-reply --hint" = "Qué quieres en esta respuesta (\"di que lo miraré mañana\")"
"ai hosting-reply --issue_title" = "Redacta la descripción de un issue nuevo con este título (sin conversación)"
"ai hosting-reply --item" = "El issue o pull request al que responder, leído del propio host en la fuente enlazada del repositorio (`7` o `#7` un issue, `!7` un pull request): la misma conversación que imprime `hosting issue comments 7 --json`, sin los eventos del sistema. En lugar de `--conversation`"
"ai hosting-reply --line" = "Con `--path`: la línea"
"ai hosting-reply --path" = "Redacta un comentario de revisión nuevo sobre este archivo del pull request"
"ai hosting-reply --read_repo" = "Deja que la IA lea el repositorio para este borrador (desactivado salvo que se indique o `ai.hosting_reply.read_repository` sea true). Un agente local lo lee por sí mismo con herramientas de solo lectura en la carpeta del repositorio; un perfil de API recibe un contexto que GitPoulpi construye (los archivos que nombra la conversación, resultados de búsqueda, el mapa) dentro de `ai.limits.hosting_reply_*`. En ambos casos la IA solo redacta; no se publica nada"
"ai hosting-reply --refresh_context" = "Olvida el contexto y la sesión del agente guardados de borradores anteriores de este repositorio y lo lee de nuevo (con `--read-repo`)"
"ai hosting-reply --continue_exchange" = 'Continúa el intercambio del último `hosting-reply` para este mismo destino (mismo `--item`, `--reply-to`, `--path`/`--line` o `--issue-title`): sus pistas y borradores anteriores vuelven al modelo como turnos previos, así que "hazlo más corto" funciona. No hace falta con un agente local de Claude cuya sesión se conserva (él recuerda). Sin la opción empieza un intercambio nuevo. Se guarda en la carpeta de estado'
"ai hosting-reply --pr_base" = "Con `--read-repo`: la revisión base del pull request, para poner su diff (contra el merge base) en el contexto"
"ai hosting-reply --pr_head" = "Con `--read-repo`: la revisión head del pull request"
"ai hosting-reply --reply_to" = "Responde en el hilo con este id (un hilo de código, un comentario o una discusión)"
"ai hosting-reply --review_summary" = "Redacta el resumen de la revisión que se está enviando"
"split-commit" = "Divide un commit de la rama actual en varios, del más antiguo al más reciente, según un plan JSON (ver `split-source` para la numeración). El último commit nuevo conserva el árbol original, así que los descendientes y el árbol de trabajo no cambian; un commit ya enviado necesita después un force push. Un `undo` lo deja todo como estaba. Código de salida 2 si se rechaza"
"split-commit --commit" = "El commit a dividir (cualquier revisión: un sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Valida el plan y lista lo que queda sin asignar; no cambia nada"
"split-commit --plan" = "El plan (JSON), desde una ruta de archivo o `-` para stdin. Una pieza es un `path` con un `hunk` opcional y, si se quiere, `lines` (índices en las `lines` del hunk); una pieza con solo `path` es el archivo entero"
"split-commit --rest_message" = "Pone en un último commit, con este mensaje, todo lo que el plan deja sin asignar"
"split-commit --sign" = "Firma los commits nuevos (y los descendientes reaplicados)"
"split-source" = "Los cambios de un commit numerados para `split-commit`: cada archivo con sus hunks (`id`, líneas) o, para los archivos que solo pueden asignarse enteros (binario, solo modo, añadido, eliminado, submódulo, LFS), el motivo. Solo lectura"
"split-source --commit" = "El commit (cualquier revisión: un sha, `HEAD~2`, ...)"
"rewrite" = "Reescribe el historial en bloque (identidades, fechas, mensajes) a partir de una receta: `preview` la planifica sin cambiar nada, `apply` ejecuta el plan que revisaste como UNA sola entrada de deshacer, y `run` hace ambas cosas para los scripts. Solo `push` envía algo: hace push forzado de las refs reescritas, cada una con un lease"
"rewrite apply" = "Aplica una ejecución con vista previa: mueve las refs como UNA sola entrada de deshacer (`gitpoulpi undo` lo deja todo como estaba). Nunca hace push. Código de salida 2 si se rechaza (el repositorio cambió desde la vista previa, resumen incorrecto, ...) y 3 si el plan mueve refs que están en un remoto y falta `--yes`"
"rewrite apply --digest" = "El resumen (digest) que imprimió `rewrite preview`: el plan que revisaste"
"rewrite apply --run" = "El id de ejecución que imprimió `rewrite preview`"
"rewrite apply --yes" = "Confirma mover refs que ya están publicadas. Sin esto, un plan así no cambia nada y el código de salida es 3"
"rewrite diff" = "Qué hizo una regla de contenido a un archivo de un commit de una ejecución con vista previa: el diff entre el archivo antiguo y el nuevo. Las líneas que elimina una regla de secretos se ocultan. Solo lee"
"rewrite diff --commit" = "El commit tal como está antes de la reescritura (un id de las filas)"
"rewrite diff --path" = "El archivo, relativo a la raíz del repositorio"
"rewrite diff --run" = "El id de ejecución que imprimió `rewrite preview`"
"rewrite discard" = "Descarta una ejecución con vista previa sin aplicarla. Descartarla dos veces no da problemas"
"rewrite discard --run" = "El id de ejecución que imprimió `rewrite preview`"
"rewrite preview" = "Planifica una reescritura del historial sin cambiar nada: recuentos, las refs que se moverían, avisos y las primeras filas. Guarda el plan en el daemon como una ejecución (`run`, `digest`) para `rewrite rows` y `rewrite apply`. La vista previa también se guarda en disco, en el directorio git del repositorio, así que `rewrite apply` funciona desde un comando posterior, tras reiniciar el daemon o desde otro frontend, sin arrancar un daemon; solo `rewrite rows` necesita el daemon que generó la vista previa (uno en marcha, o usa `--all` en la vista previa). Código de salida 2 si se rechaza la receta"
"rewrite preview --all" = "Imprime todos los commits modificados"
"rewrite preview --all_local" = "Reescribe todas las ramas locales y tags en lugar de la rama actual"
"rewrite preview --committer" = "Committer de los commits reescritos: `keep` (por defecto) o `me-now`"
"rewrite preview --include_protected" = "Reescribe también estas ramas protegidas que ya están publicadas (excluidas por defecto; repetible)"
"rewrite preview --lfs_export" = "Regla de LFS: los punteros LFS que coinciden con este glob vuelven a ser los archivos reales en cada commit (repetible). Los objetos deben estar en el almacén LFS local (antes, `lfs fetch`); si no, se rechaza con la lista"
"rewrite preview --encoding_exclude" = "Con `--reencode`: archivos que deja como están (globs, repetible)"
"rewrite preview --encoding_fallback" = "Con `--reencode`: la codificación con la que se lee un archivo que no está marcado ni es UTF-8 cuando se detecta el origen (por defecto `windows-1252`)"
"rewrite preview --encoding_paths" = "Con `--reencode`: los archivos que convierte (globs, repetible)"
"rewrite preview --eol" = "Regla de fines de línea: cada archivo de texto que coincide con `--eol-paths` recibe este fin de línea (`lf` para Linux y macOS, `crlf` para Windows, `cr` para el Mac clásico); los fines mezclados se uniformizan y los archivos binarios se omiten"
"rewrite preview --eol_exclude" = "Con `--eol`: archivos que deja como están (globs, repetible)"
"rewrite preview --eol_follow_attributes" = "Con `--eol`: lee el `.gitattributes` de la raíz de cada commit: los archivos `-text` y `binary` se omiten, y los de `eol=lf` y `eol=crlf` conservan su propio fin de línea"
"rewrite preview --eol_paths" = "Con `--eol`: los archivos que convierte (globs, repetible; un patrón sin barra coincide a cualquier profundidad)"
"rewrite preview --reencode" = "Regla de codificación: los archivos de texto que coinciden con `--encoding-paths` se convierten a esta codificación (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). Los archivos binarios, los que la codificación de origen no puede leer y los caracteres que el destino no puede representar se dejan como están y se cuentan"
"rewrite preview --reencode_from" = "Con `--reencode`: la codificación en la que están los archivos. Si se omite, se detecta por archivo (marca de orden de bytes, UTF-8 válido o, si no, `--encoding-fallback`)"
"rewrite preview --strip_exec" = "Regla de modo de archivo: el bit de ejecución (100755 pasa a 100644) se quita de los archivos que coinciden con estos globs (repetible). El contenido no se toca"
"rewrite preview --strip_exec_exclude" = "Con `--strip-exec`: archivos que conservan su bit de ejecución (globs)"
"rewrite preview --lfs_import" = "Regla de LFS: mueve a Git LFS, en cada commit, los archivos que coinciden con este glob (repetible; al estilo de `.gitattributes`: sin barra coincide a cualquier profundidad). Requiere git-lfs. El contenido va al almacén LFS local y `.gitattributes` recibe la línea `filter=lfs`; después, haz push de los objetos"
"rewrite preview --lfs_min_size" = "Con `--lfs-import`: solo se mueven los archivos de al menos este número de bytes"
"rewrite preview --limit" = "Cuántos commits modificados imprimir (por defecto 50)"
"rewrite preview --match_email" = "Regla de identidad: coincide con este correo de autor / committer"
"rewrite preview --match_name" = "Regla de identidad: coincide con este nombre de autor / committer"
"rewrite preview --prune_empty" = "Commits que una regla de contenido deja vacíos: `auto` los elimina (por defecto), `never` los conserva"
"rewrite preview --recipe" = "Un archivo de receta (TOML o JSON, el formato del editor de la TUI), o `-` para JSON por la entrada estándar"
"rewrite preview --recipe_json" = "Una receta como cadena JSON (para quien no puede escribir un archivo)"
"rewrite preview --refs" = "Reescribe solo estas ramas locales o tags (repetible)"
"rewrite preview --remove_blobs_over" = "Regla de contenido: quita de todos los commits cada archivo mayor que este número de bytes"
"rewrite preview --remove_findings" = "Regla de contenido: quita un secreto que encontró `rewrite scan-secrets`, por el id del hallazgo (repetible), o `all` para todos los hallazgos del alcance. El daemon vuelve a analizar y resuelve los ids él mismo: el valor nunca llega a la línea de comandos, a una receta ni a un registro"
