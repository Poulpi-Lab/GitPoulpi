"mailmap" = "El `.mailmap`: un nombre y un correo canónicos para quienes hicieron commits con varios. El Log, el blame y el historial de archivos muestran los nombres asignados (`log.use_mailmap`) sin tocar ningún commit. `list` cuenta las identidades del historial y muestra cuáles están asignadas, `check` muestra cómo se resuelven algunas identidades, `add` fusiona identidades en una añadiendo líneas al `.mailmap` (se edita, no se hace commit; se puede deshacer)"
"mailmap add" = "Fusiona identidades en una identidad canónica añadiendo líneas al `.mailmap` (se crea si falta; una línea que ya esté no se repite). El archivo se edita, no se hace commit: hazlo tú. Una sola entrada deshacible (`gitpoulpi undo` devuelve el archivo anterior). El Log muestra al instante la identidad canónica (`log.use_mailmap`); los commits guardados no cambian, así que no hace falta ningún push forzado. Para reescribir los propios commits usa una regla `mailmap` en `rewrite`"
"mailmap add --canonical" = "La identidad que se conserva, `Nombre <correo>`"
"mailmap add --file" = "El `.mailmap` donde escribir, relativo a la raíz del repositorio (por defecto: el `.mailmap` de la raíz)"
