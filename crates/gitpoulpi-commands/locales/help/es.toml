"flow" = "Flujos de trabajo de ramas (Git Flow, GitHub Flow, GitLab Flow, Trunk-based o el tuyo): qué ramas son bases de larga vida, cuáles son ramas temáticas de qué tipo, sus padres y a qué distancia están de ellos. `status`, `templates`, `detect` y `config` leen; `config init` e `import` imprimen un archivo de flujo de trabajo y solo lo crean con `--write`. `start`, `finish`, `sync`, `promote` y `set-parent` actúan: cada uno imprime los pasos que hará (`--dry-run` los imprime como JSON y se detiene), necesita `--yes` para ejecutarse y es una única entrada deshacible (un merge request o un push no se pueden deshacer)"
