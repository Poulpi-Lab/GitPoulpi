ai = "Ayudantes de IA (desactivados salvo `ai.enabled = true`): imprimen un mensaje de commit generado, o explican un commit o los cambios de trabajo"
"ai --print_sent" = "Imprime lo que se enviaría al modelo (el texto de sistema y de usuario una vez ocultados los secretos y dejados fuera los archivos sensibles) y no envía nada. Requiere `ai.enabled = true`, pero ni clave ni red"
"ai --send_all" = "Envía cada entrada completa, aunque supere su tope `ai.limits.*`. Sin esto, una entrada por encima de un tope se trunca (un conflicto se rechaza) y la respuesta indica qué se cortó en `truncated: [{part, detail?, bytes, limit, setting}]`"
"commit --send_all" = "Con `--ai`: envía el diff completo aunque supere `ai.limits.diff_bytes`. Sin esto, un diff mayor se trunca y la respuesta lo indica (`truncated`)"
"hosting review suggest --send_all" = "Envía cada entrada completa, aunque supere su tope `ai.limits.*` (el diff, el diff de un archivo, la descripción, los comentarios existentes, los archivos de contexto). Sin esto, una entrada por encima de un tope se trunca y la respuesta indica qué se cortó en `truncated`"
"stash push --send_all" = "Con `--ai`: envía el diff completo aunque supere `ai.limits.diff_bytes`. Sin esto, un diff mayor se trunca y la respuesta lo indica (`truncated`)"
"ai commit-message" = "Imprime el mensaje de commit que propone la IA para los cambios en stage (o para todos los cambios si no hay nada en stage). No hace commit de nada"
"ai explain" = "Explica un commit (por defecto HEAD) o, con --wip, los cambios de trabajo"
"ai resolve-conflict" = "Imprime la resolución que sugiere la IA para UN conflicto de merge de un archivo en conflicto (`--conflict N`, desde 1; opcional si el archivo tiene un único conflicto). Solo imprime: no se escribe ni se pone en stage nada, así que decide quien llama (`conflicts resolve --content-file` aplica un resultado de archivo completo). Requiere `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Qué conflicto del archivo, desde 1"
"ai resolve-conflict --path" = "El archivo en conflicto, relativo a la raíz del repositorio"
autostash = "El auto-stash pendiente: GitPoulpi apartó cambios locales para ejecutar un checkout, merge, rebase o pull y no los ha devuelto"
"ai review-context" = "Muestra o fija lo que recibe un borrador de revisión de código ✦ además del diff (`[ai.review]`): el CLAUDE.md y el AGENTS.md del repositorio, un archivo más (una ruta o un enlace) y si un agente local se ejecuta en el repositorio. Sin `--repo` ni `--project` es el valor global por defecto; `--repo PATH` es el valor propio de un repositorio clonado, `--project HOST/PROJECT` el de un repositorio que no está clonado. Sin un flag de ajuste imprime los valores (`effective` es lo que recibe una revisión); con uno lo guarda e imprime el resultado. No necesita modelo y funciona con la IA desactivada"
"ai review-context --agents_md" = "Da al modelo el AGENTS.md del repositorio"
"ai review-context --claude_md" = "Da al modelo el CLAUDE.md del repositorio"
"ai review-context --context_file" = "Un archivo más: una ruta relativa a la raíz del repositorio, una ruta absoluta o un enlace a un archivo de un host de código"
"ai review-context --no_context_file" = "Ningún archivo adicional"
"ai review-context --no_extra_file" = "Ningún archivo adicional para el repositorio o proyecto, diga lo que diga el valor global (`on`, el valor por defecto si se da solo); `off` hace que vuelva a seguir el valor global"
"ai review-context --project" = "Un repositorio que no está clonado, como `HOST/PROJECT` (`github.com/owner/name`)"
"ai review-context --reset" = "Con `--repo` o `--project`: olvida los valores propios del repositorio (vuelve a seguir los globales) antes de aplicar los flags"
"ai review-context --run_in_repo" = "Ejecuta un agente local en el repositorio (`yes`), no lo hace (`no`) o sigue lo que dice su perfil de IA (`profile`). No sirve con `--project`"
"autostash start-over" = "Empezar de nuevo: descarta los cambios del árbol de trabajo en los archivos del stash (se guarda una copia en `refs/gitpoulpi-backup/`), deshace la operación que hizo el auto-stash (pull, checkout, merge, rebase) y luego hace pop del stash sobre el commit original. Se detiene con el stash intacto si un paso falla. Código de salida 1 si se rechaza, 3 cuando hace falta `--yes`"
"autostash start-over --dry_run" = "Muestra lo que ocurriría y no cambia nada"
"autostash start-over --yes" = "Continúa; sin ello no cambia nada y el código de salida es 3"
blame = "Atribución línea por línea de un archivo en una revisión"
"blame --at" = "Revisión sobre la que hacer blame (por defecto: HEAD)"
"branch delete-remote" = "Elimina una rama de un remoto, conservando cualquier rama local con ese nombre"
"branch fast-forward" = "Avanza `<branch>` hasta `<target>`, solo si es un fast-forward (un historial divergente se rechaza y nada se mueve). La rama activa lleva consigo su árbol de trabajo, como `git merge --ff-only`; en cualquier otra rama solo se mueve la referencia"
"branch fast-forward --target" = "Cualquier revisión (por defecto: HEAD)"
"branch set-upstream" = "Hace que `<branch>` siga a `<upstream>` (`origin/main`)"
"branch track" = "Crea una rama local que sigue a una rama de seguimiento remoto y la activa. `<upstream>` se escribe como lo escribe el listado de refs (`origin/feature/login`); `--name` toma por defecto la parte de la rama"
"branch unset-upstream" = "Quita el upstream de `<branch>`"
"checkout --autostash" = 'Guarda en stash los cambios locales que lo impiden, ejecuta la operación y luego recupera el stash (lo que hace `general.auto_stash = "always"`)'
"cherry-pick --commits" = "Commits a aplicar, en orden. Se omite cuando se indica `--plan`"
"cherry-pick --plan" = "Un JSON `Vec<RebaseStep>` (misma forma que `rebase --plan`; ver `rebase-plan`), desde una ruta de archivo o `-` para stdin: los pasos se aplican con cherry-pick en el orden de la lista. Aquí solo tienen sentido las acciones `Pick` y `Drop` (`Drop` omite el commit); cualquier otra acción se rechaza. No se puede combinar con commits posicionales"
"clone --branch" = "Activa esta rama en lugar del HEAD por defecto del remoto"
"clone --depth" = "Trunca el historial a este número de commits (`git clone --depth`)"
"clone --no_lfs" = "Deja los archivos de Git LFS como punteros en lugar de descargar su contenido tras el clon"
"clone --origin" = "Da al nuevo remoto un nombre distinto de `origin`"
"clone --recurse_submodules" = "Clona también los submódulos"
"commit --ai" = "Deja que la IA escriba el mensaje a partir del diff en stage, usando las instrucciones de mensaje de commit del repositorio (Ajustes > IA). Requiere `ai.enabled = true` y un perfil configurado"
"commit --message" = "El mensaje del commit. Obligatorio salvo que --ai lo escriba"
"commit --no_verify" = "Omite los hooks de commit (`pre-commit`, `commit-msg`), como `commit --no-verify`"
completions = "Imprime en stdout un script de autocompletado para el shell (bash, zsh, fish, powershell o elvish), p. ej. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Aborta la operación en curso: HEAD, el índice y el árbol de trabajo vuelven a como estaban antes. Descarta las resoluciones hechas desde entonces"
"conflicts skip" = "Omite el cherry-pick o el revert en curso (o el commit en el que se detuvo un rebase): HEAD, el índice y el árbol de trabajo vuelven a HEAD. La salida cuando quedó vacío (el cambio ya está aplicado). Un merge no tiene nada que omitir"
"conflicts check" = "¿Daría conflicto fusionar HEAD en la rama de la que partió, y en qué archivos? No se toca nada (es un merge en memoria). La base es el destino de la pull request conocida de la rama; si no la hay, la rama permitida por los patrones de Ramas base que tenga menos commits desde la bifurcación. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Queda desactivado si lo están `general.conflict_detection` o el interruptor del repositorio"
"conflicts list" = "Los archivos en conflicto, cada uno con el texto de sus tres lados. Con `--names-only`: solo la ruta, el tipo de conflicto y los oids de stage (no se lee ningún blob; barato en un merge grande)"
"conflicts resolve" = 'Resuelve un archivo y lo pone en stage (el archivo deja de estar en conflicto). Exactamente uno de `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` o `--delete`. A y "ours" son el lado actual (`HEAD`; durante un rebase, la rama sobre la que se hace el rebase), B y "theirs" el lado entrante. No edites nunca los marcadores de conflicto a mano: elige, o escribe el texto final en un archivo'
"conflicts resolve --both" = "Conserva ambos lados de cada conflicto (A y luego B), y el merge propio de git en el resto"
"conflicts resolve --content_file" = "El texto final del archivo, exactamente (`-` lee la entrada estándar)"
"conflicts resolve --delete" = "Acepta la eliminación: borra el archivo (`git rm`)"
"conflicts resolve --encoding" = "Con `--content-file`: escribe el texto en esta codificación (una etiqueta WHATWG como `windows-1252`) en lugar de UTF-8"
"conflicts resolve --expect" = "Los oids de stage sobre los que se tomó la decisión, `base,ours,theirs` (usa `-` para un stage ausente). La llamada se rechaza como `stale` cuando el índice ya no contiene exactamente estos. `--both` y `--pick` siempre comprueban los stages que leen"
"conflicts resolve --no_stage" = "Escribe el archivo del árbol de trabajo pero lo deja en conflicto (un simple guardado)"
"conflicts resolve --ours" = "Igual que `--side ours`"
"conflicts resolve --pick" = "Una elección por número de conflicto: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = ambos en ese orden). Cada conflicto necesita una, salvo que `--default` cubra el resto"
"conflicts resolve --pick_default" = "Con `--pick`: la elección para cada conflicto no listado"
"conflicts resolve --side" = "Toma el archivo entero de un stage, sin merge automático"
"conflicts resolve --theirs" = "Igual que `--side theirs`"
"conflicts resolve --theirs_first" = "Con `--both`: B y luego A"
"conflicts show" = "Un archivo en conflicto tal como lo ve el editor de merge: las etiquetas de los paneles, los tres lados y las regiones de conflicto numeradas (`--json` es el documento completo). Las regiones fusionadas que git resolvió por sí mismo no se listan; quedan en el resultado de `resolve --both`/`--pick`"
"conflicts show --conflict" = "Solo el conflicto N (desde 1)"
"conflicts state" = "El merge, rebase, cherry-pick o revert en curso (`null` si no hay ninguno)"
"conflicts unresolve" = "Devuelve a conflicto (de nuevo con marcadores) un archivo resuelto durante esta operación. Se rechaza si sigue en conflicto o si no se resolvió mientras se ejecutaba la operación"
daemon = '`gitpoulpi server ...` es un alias visible - el propietario llama a este grupo "el servidor" y escribe `gp server stop`'
"daemon restart" = "`daemon stop` seguido de `daemon start`"
"daemon run" = "Ejecuta el daemon de esta sesión en primer plano (bloquea; Ctrl-C para detenerlo, o un `daemon stop`/`daemon restart` enviado desde otro sitio). Es lo que `daemon start` lanza desacoplado, y lo que también puede ejecutar directamente un terminal dedicado"
"daemon start" = "Inicia el daemon de esta sesión como proceso desacoplado en segundo plano (o informa de que ya se está ejecutando). `--backend` fija el backend que debe usar el proceso lanzado; si se omite, el proceso resuelve `general.default_backend` por sí mismo"
"daemon status" = "Si el daemon de esta sesión está escuchando y, en ese caso, su puerto, PID, tiempo de actividad, backend y versión de compilación"
"daemon stop" = "Pide al daemon de esta sesión que se apague de forma ordenada; solo si no responde a tiempo, y solo si es un daemon independiente (nunca uno integrado en una TUI en ejecución), recurre a matar su PID registrado"
"daemon stop --all" = "Detiene el daemon de todas las sesiones para las que `session list` informa de un archivo de puerto, no solo el de esta"
discard = "Descarta los cambios *sin stage* de un archivo en el árbol de trabajo: un hunk (`--hunk`), algunas de sus líneas (`--hunk --lines`) o - con `--file` solo - todos los cambios sin commit del archivo, incluidos los que están en stage (un archivo sin seguimiento se elimina). Los hunks y las líneas se numeran como los numera `gitpoulpi diff --json` en el diff sin stage. Todo lo que descarta se conserva en una instantánea de seguridad, así que `gitpoulpi undo` lo recupera (incluidos los archivos sin seguimiento). Sin confirmación: esta es la superficie de scripting"
"discard --lines" = "Índices de línea separados por comas dentro de `--hunk`"
"fetch --all" = "Hace fetch de todos los remotos configurados"
"fetch --prune" = "Elimina las ramas de seguimiento remoto que el remoto ya no tiene"
"fetch --prune_tags" = "Elimina también los tags locales que el remoto ha eliminado (solo los que estaban en él: un tag que nunca se envió se deja en paz). El `fetch.pruneTags` de Git, más acotado; desactivado salvo que se pida"
"fetch --remote" = "Si se omite: el remoto por defecto del repositorio (ver `remote default`)"
gitpoulpi = "Cliente Git TUI ligero y multiplataforma, automatizable mediante CLI/MCP."
"gitpoulpi --add" = "Abre una carpeta en una pestaña nueva del GitPoulpi que ya está en marcha, en lugar de iniciar otro (`gp -a`, `gp --add ../otra`). PATH es por defecto el directorio actual y se resuelve al repositorio que lo contiene. Una sesión en marcha: recibe la pestaña y su ventana pasa al frente si el escritorio lo permite. Varias: eliges una en una lista numerada (o pasas `--session NOMBRE`). Ninguna: GitPoulpi se inicia con normalidad, en esa carpeta. No admite subcomando; con `--json` imprime un objeto (`action` es `joined` o `cancelled`), código de salida 0 cuando la pestaña está abierta, 3 cuando una ventana ocupada la ofreció en el chip de su barra de estado"
"gitpoulpi --no_raise" = "Con `--add`: no pide a la ventana que traiga su terminal al frente"
"gitpoulpi --backend" = "Qué `GitBackend` usa el daemon de este comando, anulando `general.default_backend` en config.toml y `GITPOULPI_GENERAL_DEFAULT_BACKEND` (los flags están en lo más alto de la escala de precedencia - ver docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
Qué `GitBackend` usa el daemon de este comando, anulando `general.default_backend` en config.toml y `GITPOULPI_GENERAL_DEFAULT_BACKEND` (los flags están en lo más alto de la escala de precedencia - ver docs/user/config-reference.md).

Selecciona el backend de un daemon que este comando *inicia*. Una sesión cuyo daemon ya se está ejecutando conserva el backend con el que se construyó ese daemon; `gitpoulpi` no puede cambiar el backend de un daemon en marcha bajo los pies de los clientes ya suscritos a él, y fingir lo contrario sería el mismo no-op silencioso que este flag existe para evitar."""
"gitpoulpi --cwd_file" = """Archivo en el que la TUI escribe la carpeta de la pestaña activa al salir ("Salir y cd aquí", o siempre con `ui.tab_dir_follow = "auto"`). Pensado para el wrapper que imprime `gitpoulpi shell-init`; lo ignoran todos los subcomandos, ya que solo la TUI tiene pestañas"""
"gitpoulpi --json" = "Emite JSON estructurado en lugar de una salida legible"
"gitpoulpi --lang" = "Idioma del texto de `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
Idioma del texto de `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Solo se traducen las explicaciones - los nombres de comandos y flags nunca cambian - y `--help` sigue en inglés salvo que se indique esto (el entorno se ignora a propósito, para que los scripts obtengan una salida estable). Ejemplo: `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Repositorio sobre el que actuar. Por defecto, el repositorio que contiene el directorio actual, así que `gitpoulpi status` se comporta como `git status`; un agente que maneja varios repos pasa esto en lugar de hacer chdir"
"gitpoulpi --session" = "Sesión con nombre a la que dirigirse. Si se omite, se deriva de la raíz del repositorio actual (ver `gitpoulpi_config::default_session_name`), de modo que dos repositorios obtienen dos daemons independientes mientras que todo lo abierto dentro de un mismo repositorio comparte uno. Pásalo para forzar dos repositorios en una sesión, o para nombrar una sesión explícitamente. El valor se sanea antes de usarlo - se convierte en un nombre de archivo"
"hosting checkout-pr" = "Activa un pull/merge request, incluso uno de un fork: hace fetch de su head (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) en la rama local `pr/<n>` (`mr/<n>` en GitLab), con seguimiento, y cambia a ella"
"hosting checkout-pr --id" = "Qué integración (ver `hosting prs`)"
"hosting checkout-pr --no_checkout" = "Solo hace fetch y crea/actualiza la rama; te quedas donde estás"
"hosting checkout-pr --number" = "El número de PR (GitHub) o el `iid` del MR (GitLab)"
"hosting checkout-pr --remote" = "El remoto en el que está la solicitud. Por defecto, aquel desde el que se resolvió el proyecto; si no, el predeterminado del repositorio"
"hosting clone" = "Clona un proyecto de `projects` por su ruta completa, resolviendo la URL de clonado a través del host en lugar de obligar al usuario a pegar una"
"hosting clone --https" = "Clona por HTTPS en lugar de SSH"
"hosting clone --project" = "La ruta completa del proyecto, tal como la imprime `hosting projects`"
"hosting edit-url" = "Imprime la URL donde se edita un pull / merge request (la vista `.../edit` de GitLab; GitHub edita en la propia página de la solicitud). Con un número, esa solicitud; si no, la de `--branch` (por defecto: la rama activa). Sigue el enlace de pull / merge request del repositorio como `prs`. Solo abre el navegador con `--open`"
"hosting edit-url --branch" = "Busca la solicitud por su rama de origen"
"hosting edit-url --number" = "El número de la solicitud (`53` para `!53` / `#53`)"
"hosting edit-url --open" = "Abre además la URL en el navegador del sistema"
"hosting file" = "Lee un archivo de un proyecto en una revisión desde la API del host, sin clonar: el texto tal cual, otros bytes en base64 (`encoding`). Sale con código 1 y un error si el archivo no existe en esa revisión"
"hosting file --id" = "Qué integración (ver `hosting list`); opcional si solo hay una configurada"
"hosting file --path" = "La ruta dentro del proyecto, como `CLAUDE.md` o `src/main.rs`"
"hosting file --project" = "El proyecto: `owner/name` en GitHub, `group/sub/project` en GitLab"
"hosting file --rev" = "La revisión: una rama, una etiqueta o un commit. Por defecto, la rama predeterminada del proyecto"
"hosting integrations" = "Gestiona los perfiles de integración configurados (`[[integrations]]`)"
"hosting integrations add" = "Añade un perfil de cualquier tipo que tenga un cliente"
"hosting integrations add --id" = "Por defecto, el nombre del tipo (`gitlab`, `gitlab-2`, ...)"
"hosting integrations add --kind" = "`github`, `github_enterprise`, `gitlab`, `gitlab_self_managed`, `azure_devops`, `azure_devops_server`, `bitbucket`, `jira_cloud`, `jira_data_center`, `trello`, `gitea`, `forgejo`, `linear`, `youtrack`, `redmine`, `gerrit` o `local_markdown`"
"hosting integrations add --name" = "Nombre para mostrar"
"hosting integrations add --url" = "La raíz web de la instancia. Obligatoria para los tipos autoalojados y Jira"
"hosting integrations list" = "Los perfiles configurados, sin sus tokens"
"hosting integrations radar" = "Muestra o cambia los ajustes del Radar de un perfil (`[integrations.radar]`): qué listas de toda la cuenta obtienen `hosting radar` y el Radar, los espacios de nombres donde buscar y qué hace la revisión de una solicitud que no está clonada. Sin opciones solo imprime los ajustes actuales"
"hosting integrations radar --assigned_issues" = "Issues abiertos asignados a ti, de todos los repositorios"
"hosting integrations radar --clear_namespaces" = "Olvida los espacios de nombres guardados: el tuyo más todas tus pertenencias"
"hosting integrations radar --id" = "El perfil"
"hosting integrations radar --include_drafts" = "Mantiene las solicitudes en borrador en las listas de la cuenta"
"hosting integrations radar --namespaces" = "Un espacio de nombres (organización, grupo) donde buscar solicitudes abiertas; repite el flag o sepáralos con comas. Sustituye la lista guardada"
"hosting integrations radar --open_requests" = "Todas las solicitudes abiertas de tus espacios de nombres"
"hosting integrations radar --review_mode" = "Qué hace revisar una solicitud que no está clonada"
"hosting integrations radar --review_requests" = "Solicitudes que esperan tu revisión, de todos los repositorios"
"hosting integrations remove" = "Elimina un perfil y borra su token almacenado"
"hosting integrations test" = "Comprueba el token del perfil contra su host: usuario, scopes, caducidad"
"hosting issue" = "Crea issues en el proyecto enlazado del repositorio actual"
"hosting issue create" = "Abre un issue en el proyecto al que está enlazada la fuente ISSUES del repositorio (`hosting link issues`), o en el que `--id` resuelve a partir del remoto. Acción hacia el exterior: publica en el host"
"hosting issue create --body" = "La descripción del issue"
"hosting issue create --body_file" = "Lee la descripción de este archivo (`-` lee stdin)"
"hosting issue create --id" = "Qué integración (ver `hosting issues`)"
"hosting issue create --labels" = "Una etiqueta a aplicar; repite el flag o sepáralas con comas"
"hosting issue create --title" = "El título del issue"
"hosting issue create --web" = "Imprime la página de nuevo issue prerrellenada del host en lugar de llamar a su API (no requiere token)"
"hosting issues" = "Issues del proyecto del repositorio actual"
"hosting issues --assigned" = "Solo los asignados a ti"
"hosting board --id" = "Qué integración (ver `hosting issues`)"
"hosting board move --column" = "El nombre de la columna, tal como lo imprime `hosting board`"
"hosting board move --id" = "Qué integración (ver `hosting issues`)"
"hosting board move --reference" = "La tarjeta: su número o su propia referencia (`12`, `#12`, `ABC-12`, `AB#12`)"
"hosting board move" = "Mueve una tarjeta a una columna: un cambio de estado, una transición de flujo de trabajo (Jira), un estado de work item (Azure DevOps), una lista (Trello) o un cambio de etiqueta (GitHub, GitLab, Gitea, Forgejo). Un movimiento para el que el proveedor no tiene camino se rechaza indicando el motivo. Acción hacia el exterior: escribe en el host"
"hosting board show --id" = "Qué integración (ver `hosting issues`)"
"hosting board show" = "Las columnas del tablero, cada una con sus tarjetas. Solo lectura"
"hosting board" = "El tablero de issues del proyecto vinculado al repositorio actual: sus columnas con sus tarjetas, las mismas columnas que el tablero de la TUI (un estado, una lista o una etiqueta por columna). Sin subcomando, equivale a `board show`"
"hosting link" = "Enlaza la lista de pull/merge requests o la lista de issues de este repositorio con un perfil de proveedor y uno de sus repositorios, o la desenlaza (sin ningún flag, muestra el enlace). `prs` / `issues` no obtienen nada hasta que se enlaza una fuente; es el mismo enlace que guardan las secciones de la barra lateral de la TUI (`pulls_source` / `issues_source` en `.gitpoulpi/repo-state.toml`)"
"hosting link --clear" = "Desenlaza la lista: no se obtiene nada hasta que se vuelva a enlazar"
"hosting link --id" = "El perfil a enlazar. Sin `--project`, se usa el repositorio que sus remotos nombran en el host de ese perfil"
"hosting link --kind" = "Qué lista"
"hosting link --project" = "El repositorio del proveedor (`owner/name`, `group/sub/proj`)"
"hosting list" = "Las integraciones configuradas, sin sus tokens"
"hosting login" = "Valida un token y lo guarda bajo el `token_ref` del perfil, almacenando en caché a quién pertenece. El token se lee de stdin (`--token-stdin`), nunca de un argumento, para que no quede en el historial del shell. No se expone por MCP: un secreto no debe pasar por la transcripción de llamadas a herramientas de un agente"
"hosting login --id" = "Qué integración. Opcional si solo hay una configurada"
"hosting login --token_stdin" = "Lee el token de stdin (obligatorio; una línea, se ignora el salto de línea final)"
"hosting logout" = "Borra el token almacenado del perfil y olvida el usuario conectado; el perfil en sí se conserva"
"hosting open" = "Imprime la URL web de un pull request o issue del proyecto del repositorio actual. Solo abre el navegador del sistema con `--browser`"
"hosting open --browser" = "Abre además la URL en el navegador del sistema"
"hosting pr" = "Abre un pull request (GitHub, Gitea, Forgejo, Bitbucket, Azure DevOps) o merge request (GitLab) desde una rama del repositorio actual"
"hosting pr --id" = "Qué integración (`[[integrations]] id`). Opcional si solo hay una configurada"
"hosting pr --source" = "La rama desde la que abrirlo. Por defecto, la rama activa"
"hosting pr --target" = "La rama contra la que abrirlo. Por defecto, la rama predeterminada del remoto cuando se puede saber; si no, `main`/`master` si existe alguna"
"hosting pr --title" = "Por defecto, la primera línea del mensaje del commit en la punta de la rama de origen"
"hosting pr --web" = "Imprime la URL de comparación/nueva solicitud en lugar de llamar a la API del host. Es también lo que ocurre automáticamente si no hay integración configurada para este remoto, o no hay token para ella"
"hosting pr-for-branch" = "El pull/merge request que mejor representa una rama (abierto, luego borrador, luego fusionado, luego cerrado; el más reciente primero)"
"hosting pr-for-branch --branch" = "Por defecto, la rama activa"
"hosting projects" = "Todos los proyectos que puede ver el token de la integración"
"hosting projects --filter" = "Subcadena sin distinguir mayúsculas de la ruta del proyecto"
"hosting projects --id" = "Qué integración (`[[integrations]] id`). Opcional si solo hay una configurada"
"hosting prs" = "Pull/merge requests del proyecto del repositorio actual"
"hosting prs --id" = "Qué integración. Sin esto se usa la fuente de pull/merge requests enlazada del repositorio (ver `hosting link`); un repositorio sin enlazar no obtiene nada. Con esto, el proyecto que el remoto de este repositorio nombra en ese perfil"
"hosting prs --mine" = "Solo los que abriste tú"
"hosting prs --review_requested" = "Solo los que esperan tu revisión"
"hosting prs --state" = "`open` (por defecto), `closed` (incluye los fusionados) o `all`"
"hosting radar" = "Las listas de toda la cuenta para el Radar: las solicitudes que esperan tu revisión, todas las solicitudes abiertas de tus espacios de nombres y los issues asignados a ti, en todos los repositorios de cada perfil (GitHub, GitLab, Gitea, Forgejo, Azure DevOps, Bitbucket Data Center, Gerrit), estén clonados o no. Sin `--what`, deciden los ajustes `[integrations.radar]` de cada perfil (ver `hosting integrations radar`); la respuesta se reutiliza cinco minutos salvo con `--refresh`. Solo lectura"
"hosting radar --ids" = "Qué perfil; repite el flag para varios. Sin él, todos los perfiles activados de un tipo compatible"
"hosting radar --include_drafts" = "Mantiene también las solicitudes en borrador"
"hosting radar --refresh" = "Consulta al host aunque haya una respuesta reciente en caché"
"hosting radar --what" = "Qué listar, diga lo que diga el ajuste del perfil: `review` (esperan tu revisión), `open` (todas las solicitudes abiertas), `issues` (asignados a ti) o `all`"
"hosting review comment --project" = "Revisa un proyecto que no es el repositorio actual (no hace falta clonar): `owner/name` en GitHub, `group/sub/project` en GitLab. `--id` indica entonces la integración, si hay varias configuradas"
"hosting review diff" = "El diff de una pull/merge request, archivo por archivo con sus hunks (`files[].diff.hunks`). En un repositorio descarga las refs de la solicitud y las compara en local; con `--api`, o con `--project` (sin repositorio), lee el diff desde la API del host, que no necesita clon. Un archivo cuyo parche el host omitió (demasiado grande) tiene `omitted` y ningún hunk"
"hosting review diff --api" = "Lee el diff desde la API del host aunque estés dentro de un clon"
"hosting review diff --file" = "Solo el diff de este archivo"
"hosting review diff --id" = "Qué integración (ver `hosting prs`)"
"hosting review diff --number" = "El número de la PR (GitHub) o el `iid` de la MR (GitLab)"
"hosting review diff --project" = "Revisa un proyecto que no es el repositorio actual (no hace falta clonar): `owner/name` en GitHub, `group/sub/project` en GitLab. `--id` indica entonces la integración, si hay varias configuradas"
"hosting review diff --remote" = "El remoto donde vive la solicitud (solo diff local). Por defecto, aquel del que se resolvió el proyecto; si no, el predeterminado del repositorio"
"hosting review reply --project" = "Revisa un proyecto que no es el repositorio actual (no hace falta clonar): `owner/name` en GitHub, `group/sub/project` en GitLab. `--id` indica entonces la integración, si hay varias configuradas"
"hosting review resolve --project" = "Revisa un proyecto que no es el repositorio actual (no hace falta clonar): `owner/name` en GitHub, `group/sub/project` en GitLab. `--id` indica entonces la integración, si hay varias configuradas"
"hosting review show --project" = "Revisa un proyecto que no es el repositorio actual (no hace falta clonar): `owner/name` en GitHub, `group/sub/project` en GitLab. `--id` indica entonces la integración, si hay varias configuradas"
"hosting review submit --project" = "Revisa un proyecto que no es el repositorio actual (no hace falta clonar): `owner/name` en GitHub, `group/sub/project` en GitLab. `--id` indica entonces la integración, si hay varias configuradas"
"hosting review suggest --agents_md" = "Da al modelo el AGENTS.md del repositorio, para esta ejecución"
"hosting review suggest --claude_md" = "Da al modelo el CLAUDE.md del repositorio (leído en la rama a la que apunta la solicitud), para esta ejecución"
"hosting review suggest --context_file" = "Un archivo más para esta ejecución: una ruta relativa a la raíz del repositorio, una ruta absoluta o un enlace a un archivo de un host de código"
"hosting review suggest --no_context_file" = "Ningún archivo adicional en esta ejecución, digan lo que digan los valores por defecto"
"hosting review suggest --project" = "Revisa un proyecto que no es el repositorio actual (no hace falta clonar): `owner/name` en GitHub, `group/sub/project` en GitLab. `--id` indica entonces la integración, si hay varias configuradas"
"hosting review suggest --run_in_repo" = "Ejecuta un agente local en el repositorio (`yes`), no lo hace (`no`) o sigue lo que dice su perfil de IA (`profile`), para esta ejecución. No con `--project` (no hay checkout)"
"hosting review threads --project" = "Revisa un proyecto que no es el repositorio actual (no hace falta clonar): `owner/name` en GitHub, `group/sub/project` en GitLab. `--id` indica entonces la integración, si hay varias configuradas"
"hosting ssh-key" = "Genera un par de claves ed25519 y sube la mitad pública"
"hosting ssh-key create" = "Genera un nuevo par y sube la mitad pública. Se niega a sobrescribir un archivo de clave existente"
"hosting ssh-key create --no_upload" = "Genera el par pero no lo envía a ninguna parte"
"hosting ssh-key create --path" = "Dónde escribir la clave privada. Por defecto, `~/.ssh/id_ed25519`"
"hosting ssh-key create --title" = "El nombre con el que aparece la clave en el host. Por defecto, `gitpoulpi@<hostname>`"
"hosting ssh-key delete" = "Elimina una clave pública de la cuenta en el host (por el id que informa `ssh-key list`). Los archivos de clave locales no se tocan"
"hosting ssh-key delete --id" = "Qué integración"
"hosting ssh-key delete --key_id" = "El id de la clave en el host"
"hosting ssh-key list" = "Las claves públicas que ya hay en la cuenta"
"hosting use" = "Fija qué perfil de integración responde por el repositorio actual (o, sin ningún flag, muestra el que está en vigor)"
"hosting use --clear" = "Quita la fijación y vuelve a resolver por host del remoto"
"hosting use --id" = "El perfil a fijar"
"hosting assignment" = "Muestra, bloquea o permite asignar personas en los issues y pull requests del repositorio actual (sin ningún flag, muestra lo que está en vigor). Bloqueada: toda asignación se rechaza (código de salida 2, motivo `assignment_blocked`), sea cual sea la superficie; los asignados existentes siguen visibles. Solo una persona puede volver a permitirla"
"hosting assignment --allow" = "Vuelve a permitir la asignación (solo una persona)"
"hosting assignment --block" = "Rechaza toda asignación en este repositorio"
ignore = "Añade un patrón a un `.gitignore` (por defecto el de la raíz del repositorio). No hace nada si el patrón ya es una línea del archivo. Se puede deshacer con `gitpoulpi undo`, que deja el archivo como estaba (o lo elimina si no existía)"
"ignore --file" = "`.gitignore` relativo al repositorio al que añadir (por defecto `.gitignore`)"
"ignore --pattern" = "La línea a añadir, p. ej. `*.log`, `/build` o `docs/tmp/`"
lfs = "Git LFS: archivos grandes almacenados fuera del historial del repositorio. Requiere el programa `git-lfs` para todo lo que mueva o convierta archivos; `status` y `files` funcionan sin él"
"lfs fetch" = "Descarga objetos LFS al almacén local (`git lfs fetch`), sin tocar el árbol de trabajo"
"lfs fetch --all" = "Todas las refs, no solo la actual"
"lfs fetch --remote" = "Si se omite: el remoto por defecto del repositorio (ver `remote default`)"
"lfs files" = "Los archivos puntero LFS del índice (o en `--at`), indicando si cada objeto real está en el almacén LFS local"
"lfs files --at" = "Revisión a listar (por defecto: el índice)"
"lfs install" = "Configura los filtros y hooks de LFS (`git lfs install`), solo para este repositorio salvo con `--user`"
"lfs install --user" = "Instala en la configuración global de git del usuario en lugar de en este repositorio"
"lfs lock" = "Bloquea un archivo para que nadie más pueda cambiarlo hasta que lo desbloquees"
"lfs lock --remote" = "Si se omite: el remoto por defecto del repositorio"
"lfs locks" = "Los bloqueos de archivos LFS en el servidor: quién tiene qué archivo. Requiere un servidor con bloqueo (GitHub, GitLab, Gitea, ...); usa las credenciales propias del remoto"
"lfs locks --remote" = "Si se omite: el remoto por defecto del repositorio"
"lfs prune" = "Elimina del almacén LFS local los objetos antiguos que ya se enviaron"
"lfs pull" = "Descarga objetos LFS y sustituye los archivos puntero del árbol de trabajo por el contenido real (`git lfs pull`)"
"lfs pull --remote" = "Si se omite: el remoto por defecto del repositorio"
"lfs checkout" = "Escribe el contenido real de los archivos puntero LFS del árbol de trabajo desde el almacén LFS local (`git lfs checkout`). Sin conexión"
"lfs checkout --paths" = "Solo estas rutas (relativas a la raíz del repositorio); omitido: todos los punteros del árbol de trabajo"
"lfs push" = "Sube objetos LFS (`git lfs push`)"
"lfs push --all" = "Todas las refs, no solo la rama actual"
"lfs push --remote" = "Si se omite: el remoto por defecto del repositorio"
"lfs status" = "Si `git-lfs` está instalado, si este repositorio usa LFS, qué patrones se siguen, si los filtros y el hook están instalados. Nunca falla porque falte `git-lfs`: la respuesta lo indica"
"lfs track" = "Dirige patrones de archivo a través de LFS (`git lfs track`). Edita `.gitattributes` y lo deja sin stage"
"lfs track --lockable" = "Deja los archivos en solo lectura hasta que se bloqueen"
"lfs track --renormalize" = "Vuelve a poner también en stage los archivos ya confirmados que coincidan, para que su próximo commit almacene punteros (no se reescribe el historial)"
"lfs unlock" = "Libera un bloqueo. El bloqueo de otra persona requiere `--force`, que lo rompe"
"lfs unlock --force" = "Rompe un bloqueo que tiene otra persona"
"lfs unlock --remote" = "Si se omite: el remoto por defecto del repositorio"
"lfs untrack" = "Deja de dirigir patrones a través de LFS (`git lfs untrack`)"
"log --count" = "Imprime solo cuántos commits recorre la consulta (`{\"total\": N}`), sin tener en cuenta `--limit` ni `--skip`: lo que muestra la barra de estado de la TUI tras la barra oblicua. Cuenta sin cargar ningún commit"
"log --path" = "Solo los commits que tocan esta ruta (repetible) - `git log -- <path>`. Es la consulta de la vista Historial de archivo"
"log --skip" = "Omite los primeros N commits del recorrido antes de aplicar `--limit`. Junto con `--limit` pagina el historial: la página `n` es `--skip <n*limit> --limit <limit>`, y las páginas cubren el recorrido exactamente (comprobado por contrato en `check_log_skip_pages_history`)"
"log --format" = "Muestra los commits en otro formato. `mermaid` imprime un script `gitGraph` de Mermaid (pégalo en un archivo Markdown, un PR o mermaid.live); con `--json`, `{format, detail, commits, text}`. Los commits son `--range`, o si no los primeros `--limit` (30 por defecto) del recorrido"
"log --detail" = "Nivel de detalle de Mermaid: `structure` (commits, ramas, merges), `refs` (+ nombres de rama, tags, HEAD), `subjects` (+ asuntos de los commits) o `full` (+ autor y fecha). Por defecto: `ui.mermaid_detail` (`refs`)"
"log --orientation" = "Dirección del grafo de Mermaid. Por defecto: `ui.mermaid_orientation` (`lr`)"
"log --fence" = "Envuelve el script de Mermaid en un bloque ```mermaid"
"log --range" = "Mermaid: los commits `A..B` (alcanzables desde B, no desde A), como `git log A..B`; un `A` solo significa `A..HEAD`"
"log --subject_width" = "Mermaid: recorta los asuntos de los commits a este número de caracteres. Por defecto: `ui.mermaid_subject_width` (40)"
"mcp serve --allow_remote" = "Permite `--http` en una dirección que no es de loopback. Se rechaza salvo que `[mcp] http_auth` esté activado con un token en su sitio y el tráfico esté cifrado (`[mcp] tls`, o `behind_proxy` para un túnel o proxy inverso del que respondes); `ssh -L` hacia un endpoint de loopback es más seguro"
"mcp serve --bind" = "Dirección para `--http` (equivale a `--http ADDR`; prevalece sobre ella)"
"mcp serve --http" = "Dirección de escucha para HTTP en streaming, p. ej. 127.0.0.1:8808 (endpoint `/mcp`); sin dirección, `[mcp] bind` (por defecto 127.0.0.1:8808). Las solicitudes necesitan el token bearer (`mcp token`) salvo que `[mcp] http_auth` esté desactivado. Solo loopback salvo con `--allow-remote`"
"mcp serve --ui_control" = "Hasta dónde puede el agente mover la ventana del usuario con las herramientas `ui_*`: `ask` (por defecto: la ventana muestra un chip que el usuario confirma), `auto` u `off`. Anula `[mcp] ui_control`"
"mcp token" = "El token bearer del endpoint HTTP (`mcp serve --http`): lo muestra enmascarado como JSON `{token_hint, path, rotated}` y lo crea en el primer uso. Un cliente lo envía como `Authorization: Bearer <token>`. No es una herramienta MCP: un agente nunca lee ni renueva su propia clave"
"mcp token --copy" = "Copia el token completo al portapapeles a través del terminal (OSC 52), sin imprimirlo"
"mcp token --rotate" = "Reemplaza el token por uno nuevo; los clientes que tengan el anterior se rechazan al instante"
"mcp token --show" = "Imprime también el token completo, para que lo pegues en la configuración de un cliente"
"merge --autostash" = 'Guarda en stash los cambios locales que lo impiden, ejecuta la operación y luego recupera el stash (lo que hace `general.auto_stash = "always"`)'
"merge --ff" = "Fast-forward cuando la rama lo permite, un commit de merge en caso contrario (el comportamiento por defecto de git). Anula `git.merge_fast_forward` para este merge"
"merge --ff_only" = "Solo fast-forward: se rechaza si la rama ha divergido. Anula `git.merge_fast_forward` para este merge"
"merge --no_ff" = "Crea siempre un commit de merge, aunque un fast-forward sea posible. Anula `git.merge_fast_forward` para este merge"
"merge --squash" = "Aplasta los commits de la rama (squash): deja sus cambios en stage y no crea ningún commit de merge (`merge --squash`), de modo que después hay que hacer un `commit`. Es el modo Squash del ajuste de comportamiento de Merge. No se puede deshacer: nada se movió; para retroceder, descarta los cambios en stage"
patch = "Escribe un archivo de parche, o aplica uno al árbol de trabajo"
"patch apply" = "Aplica un archivo de parche al árbol de trabajo"
"patch create" = "Escribe un archivo de parche. `<revs>` son uno o más commits (del más antiguo al más reciente) de los que sacar un parche cada uno; combínalo con `--range a..b` para cubrir en su lugar todos los commits que no son merge de un rango; combínalo con `--wip` para parchear en su lugar los cambios actuales del árbol de trabajo (en stage y sin stage), opcionalmente limitados a `<paths>`"
"patch create --revs" = "Revisiones de commit (del más antiguo al más reciente) sin `--range`/`--wip`; con `--wip`, rutas a las que limitar el parche (vacío significa todos los archivos cambiados); se ignora con `--range`"
"pull --autostash" = 'Guarda en stash los cambios locales que lo impiden, ejecuta la operación y luego recupera el stash (lo que hace `general.auto_stash = "always"`)'
"pull --mode" = "Cómo integrar: `merge` (fast-forward si es posible), `ff-only` o `rebase`. Siempre se pasa a git de forma explícita"
"pull --remote" = "Hace pull de la rama del mismo nombre de este remoto en lugar del upstream de la rama"
"push --branch" = "La rama local a enviar; la activa si se omite"
"push --force_with_lease" = "Sobrescribe la rama remota, solo si está donde la vio nuestro último fetch. No existe un `--force` simple"
"push --remote" = "Si se omite: el remoto por defecto del repositorio (ver `remote default`)"
"push --set_upstream" = "Registra `<remote>/<branch>` como upstream de la rama"
"rebase --abort" = "Aborta un rebase en curso, restaurando la rama y HEAD"
"rebase --autosquash" = "Reordena primero los pasos de `--plan` con el algoritmo de `git rebase --autosquash`; sin `--plan`, ejecuta un simple `git rebase -i --autosquash`"
"rebase --autostash" = 'Guarda en stash los cambios locales que lo impiden, ejecuta la operación y luego recupera el stash (lo que hace `general.auto_stash = "always"`)'
"rebase --continue_" = "Reanuda un rebase detenido por un conflicto o un paso `edit`"
"rebase --interactive" = "Ejecuta `git rebase -i`. Sin `--plan`, solo tiene sentido `--autosquash` por sí solo (aquí no hay editor interactivo); combínalo con `--plan` para una lista de tareas explícita"
"rebase --onto" = "La rama/commit sobre el que hacer rebase, o (con `--plan`) el upstream después del cual empieza el rango del plan. Se omite con `--root` o con uno de `--continue`/`--skip`/`--abort`/`--status`"
"rebase --onto_commit" = "Reaplica sobre este commit en lugar de sobre el propio upstream (`git rebase --onto`)"
"rebase --plan" = "Un plan JSON `Vec<RebaseStep>` (ver `rebase-plan`), desde una ruta de archivo o `-` para stdin"
"rebase --root" = "Hace rebase de todo el historial (`--root`) en lugar de un rango posterior a `onto`/un upstream explícito"
"rebase --skip" = "Omite el commit en el que está detenido un rebase"
"rebase --status" = "Informa del rebase actualmente en curso, si lo hay"
rebase-plan = "El rango que reaplicaría un rebase interactivo desde `upstream` (o todo el historial, con `--root`), del más antiguo al más reciente - material para construir un archivo JSON de `rebase --plan`"
redo = "Rehace la operación que `undo` acaba de deshacer, hasta el estado exacto registrado (nunca vuelve a ejecutar la operación). Código de salida 2 si se rechaza"
"redo --dry_run" = "Muestra lo que ocurriría y no cambia nada"
"redo --expect" = "Rehace solo si esta sigue siendo la última entrada deshecha"
"redo --yes" = "Continúa cuando el redo es arriesgado; sin esto, código de salida 3"
"refs hide" = """Oculta refs del grafo de commits (el "Ocultar" de la TUI): el filtro de visualización por repositorio en `repo-state.toml`, que una TUI abierta sigue en vivo. Los nombres se escriben como los escribe el listado de refs (`feature/x`, `origin/main`, un nombre de tag)"""
"refs hide --clear" = "Deja de ocultar todas las refs y remotos ocultos (además de los indicados)"
"refs hide --names" = "Refs a ocultar"
"refs hide#long" = """
Oculta refs del grafo de commits (el "Ocultar" de la TUI): el filtro de visualización por repositorio en `repo-state.toml`, que una TUI abierta sigue en vivo. Los nombres se escriben como los escribe el listado de refs (`feature/x`, `origin/main`, un nombre de tag).

`--remote <name>...` oculta un remoto entero (todas sus ramas, también las que se obtengan después): la forma de mirar una historia sin la de un remoto de archivo aparte."""
"refs hide --remote" = "Remotos a ocultar enteros (nombres como los escribe `remote list`)"
"refs show" = "Vuelve a mostrar refs: las quita de los conjuntos de ocultas y de solo"
"refs show --clear" = "Reinicia todo el filtro: nada oculto (remotos incluidos), nada en solo"
"refs show --names" = "Refs a volver a mostrar"
"refs show#long" = """
Vuelve a mostrar refs: las quita de los conjuntos de ocultas y de solo.

`--remote <name>...` vuelve a mostrar un remoto entero, con todas sus ramas que se habían ocultado una a una."""
"refs show --remote" = "Remotos a volver a mostrar"
"refs solo" = "Muestra solo estas refs (y lo que alcanzan) en el grafo de commits"
"refs solo --clear" = "Deja de mostrar en solo todas las refs en solo (además de las indicadas)"
"refs solo --names" = "Refs a mostrar en solo"
"remote add --push_url" = "Una URL aparte a la que hacer push"
"remote clear-push-url" = "Quita la URL de push aparte, de modo que los push vuelvan a usar la URL de fetch"
"remote default" = "Muestra el remoto por defecto del repositorio, o lo establece con un nombre"
"remote set-url" = "Establece la URL de fetch, o con `--push` la URL de push aparte"
repo = "Abrir, inspeccionar y recordar repositorios - la superficie multirrepositorio. Ver `gitpoulpi repo --help`"
"repo close" = "Cierra la pestaña de un repositorio en esta sesión. El repositorio en sí no se toca"
"repo discover" = "¿Está esta ruta en un repositorio git y dónde está su raíz? Pasa por `GitBackend::discover`, así que responde exactamente lo que respondería el flujo de apertura de repositorio de la TUI"
"repo discover --path" = "Por defecto, el directorio actual"
"repo init" = "Crea un repositorio en `path` y lo abre como pestaña de esta sesión. Pasa por `GitBackend::init`, así que produce exactamente el repositorio que produciría el formulario Crear de la TUI"
"repo init --bare" = "Un repositorio sin árbol de trabajo"
"repo init --initial_branch" = "La rama en la que cae el primer commit. Por defecto, `general.default_branch_name`; vacío deja la propia de git"
"repo list" = "Las pestañas abiertas en esta sesión, con la activa señalada"
"repo open" = "Abre un repositorio como pestaña de esta sesión y lo registra en la lista de recientes. Imprime lo que se abrió; no lanza una interfaz"
"repo recent" = "Los repositorios abiertos recientemente, del más reciente al más antiguo"
"repo recent --forget" = "Olvida una entrada"
"repo recent --prune" = "Elimina las entradas cuyo directorio ya no está en disco"
revert = "Revierte un commit con un nuevo commit que aplica el cambio inverso"
"revert --commit" = "El commit a revertir (cualquier revisión: un sha, `HEAD~2`, ...)"
"revert --mainline" = "Para un commit de merge: el número (desde 1) del padre que sigue siendo la línea principal, como `git revert -m`. `1` es la rama sobre la que se hizo el merge. Obligatorio para revertir un commit de merge"
reword = "Da un nuevo mensaje a un commit de la rama actual (sus descendientes se recrean encima; el índice y el árbol de trabajo no se tocan). Un commit ya enviado necesita después un force push"
"reword --commit" = "El commit a editar (cualquier revisión: un sha, `HEAD~2`, ...)"
"reword --message" = "El nuevo mensaje completo (resumen, línea en blanco, cuerpo)"
amend = "Cambia las propiedades de un commit de la rama actual: mensaje, nombre, correo y fecha del autor, nombre, correo y fecha del committer (cualquier subconjunto; lo que omitas se conserva). Sus descendientes se recrean encima con sus propios autores; el índice y el árbol de trabajo no se tocan. Se puede deshacer; un commit ya enviado necesita después un force push"
"amend --author_date" = "Fecha git en bruto (`1700000000 +0100`) o ISO 8601 (`2001-02-03T04:05:06+05:30`)"
"amend --author_email" = "El nuevo correo del autor"
"amend --author_name" = "El nuevo nombre del autor"
"amend --commit" = "El commit a modificar (cualquier revisión: un sha, `HEAD~2`, ...)"
"amend --committer_date" = "Los mismos formatos que --author-date (por defecto: ahora)"
"amend --committer_email" = "El nuevo correo del committer (por defecto: el tuyo)"
"amend --committer_name" = "El nuevo nombre del committer (por defecto: el tuyo)"
"amend --description" = "Solo el cuerpo (lo que sigue al resumen): el resumen se conserva. Un valor vacío quita el cuerpo"
"amend --message" = "El nuevo mensaje completo (resumen, línea en blanco, cuerpo)"
"amend --summary" = "Solo el resumen (primera línea): el cuerpo se conserva"
rm-file = "Elimina archivos (o directorios) del árbol de trabajo; el índice no se toca, así que un archivo con seguimiento aparece como un cambio eliminado. Se puede deshacer con `gitpoulpi undo`, que restaura los bytes exactos"
"rewrite apply --target" = "La carpeta del repositorio nuevo cuando el plan extrae un subdirectorio como clon o submódulo (véase `--extract-mode`)"
"rewrite maps" = "El `commit-map` y el `ref-map` de la ejecución (formato de git-filter-repo: una línea de cabecera y luego `antiguo nuevo` por línea; la limpieza de repositorio de GitLab usa el commit map). Imprime sus rutas, o los copia en `--out`"
"rewrite maps --out" = "Copia ambos archivos en esta carpeta (se crea si no existe)"
"rewrite maps --run" = "El id de la ejecución; `latest` (por defecto) es la ejecución aplicada más reciente"
"rewrite note" = "La nota para enviar a quienes tienen el historial antiguo: por cada rama y tag publicados, la punta antigua y la nueva, y qué ejecutar (`git fetch`, luego `git reset --hard origin/<branch>` o `git rebase --onto`). Solo lee"
"rewrite note --run" = "El id de la ejecución; `latest` (por defecto) es la ejecución aplicada más reciente"
"rewrite preview --extract" = "Regla de rutas: conserva solo este subdirectorio, que pasa a ser la raíz; los commits que no lo tocan se descartan y los merges se simplifican. Se pregunta cada vez: indica `--extract-mode`, o el código de salida será 3 y no se previsualizará nada. La extracción se ejecuta antes que los demás indicadores de rutas"
"rewrite preview --extract_mode" = "Cómo termina `--extract`: `clone` (un clon local nuevo en `--target`, sin tocar el original; con todos los branches y tags locales), `in-place` (se reescribe el historial de este repositorio, con una entrada de deshacer) o `submodule` (el clon como en `clone`, y un commit nuevo en la rama actual reemplaza la carpeta por un submódulo que apunta a él; este historial se conserva)"
"rewrite preview --into_subdir" = "Regla de rutas: mueve todo el repositorio a este subdirectorio en cada commit (para combinar repositorios sin choques de rutas)"
"rewrite preview --move_paths" = "Regla de rutas `ORIGEN=DESTINO`: renombra un archivo o carpeta en cada commit, con los mismos blobs y trees en la ruta nueva (repetible, en orden, después de las reglas de contenido). Un commit donde `DESTINO` ya existe no se cambia: la vista previa se rechaza (código de salida 2, `path_collision`) y lista los commits y las rutas"
"rewrite preview --target" = "La carpeta del repositorio nuevo para `--extract-mode clone` o `submodule`: no debe existir o debe estar vacía, y no puede estar dentro de este repositorio. La usa `rewrite run`; `rewrite apply` tiene la suya"
"rewrite push" = "Hace push de las refs que movió una ejecución aplicada y que estaban en un remoto, cada una con `--force-with-lease=<ref>:<el id que tenía el remoto cuando hiciste la vista previa>` (nunca un force simple), con un único push `--atomic` por remoto cuando el servidor lo permite (si no, un push por ref, y la respuesta lo indica). Los tags se incluyen. Las ramas protegidas (`rewrite.protected_branches`) se dejan fuera salvo que las indiques con `--include-protected`, o todas con `--include-all-protected`. Una ref cuyo remoto cambió desde la vista previa se rechaza solo para esa ref (haz fetch, revisa y vuelve a ejecutarlo). No se puede deshacer: el remoto conserva el historial nuevo aunque hagas `undo` de la reescritura en local. Sin `--yes` (o con `--dry-run`) no se envía nada: la respuesta lista lo que se enviaría, y el código de salida es 3 sin `--yes`. Código de salida 2 si la ejecución ya no existe, 4 si se rechazó una ref o no se envió"
"rewrite push --dry_run" = "Pregunta al remoto qué pasaría (se comprueban los leases) y no envía nada"
"rewrite push --include_all_protected" = "Hace push también de todas las ramas protegidas de la ejecución"
"rewrite push --include_protected" = "Hace push también de esta rama protegida (repetible)"
"rewrite push --no_atomic" = "Un push por ref, en lugar de un único push `--atomic` de todo o nada"
"rewrite push --remote" = "Solo las refs de este remoto"
"rewrite push --run" = "El id de ejecución que imprimió `rewrite apply`; `latest` (por defecto) es la ejecución aplicada más reciente"
"rewrite push --yes" = "Sigue adelante y hace el push. Sin esto no se envía nada (código de salida 3)"
"rewrite purge" = "Elimina del clon, para siempre, el historial antiguo de una reescritura: suelta las anclas de deshacer de la reescritura (y de cualquier operación anterior cuyas anclas también retengan el historial antiguo), caduca las entradas del reflog que lo nombran, poda los objetos (`gc --prune=now`) y comprueba que han desaparecido. Después ya no se puede deshacer esas operaciones (siguen en `undo --list` como purgadas). Una vez iniciada, no se puede detener ni deshacer. Cualquier cosa que aún retenga el historial antiguo (una rama fuera de la reescritura, un stash, el HEAD de otro worktree, una ref de seguimiento remoto: haz fetch tras el push) la bloquea y no se cambia nada. No se envía nada a ningún remoto; la respuesta lista los pasos que necesita el host (GitHub, GitLab, Azure DevOps, Bitbucket). Sin `--yes` no ocurre nada: la respuesta indica qué se eliminaría y qué se perdería, y el código de salida es 3. Código de salida 2 si la entrada no es una reescritura, 4 si algo la bloquea o quedan objetos. Por MCP solo con `[mcp] allow_history_purge = true`"
"rewrite purge --all" = "Todas las reescrituras del historial de deshacer"
"rewrite purge --entries" = "Una entrada de reescritura del historial de deshacer (`undo --list`; repetible). Por defecto: la reescritura más reciente que no esté purgada"
"rewrite purge --latest" = "La reescritura más reciente que aún no esté purgada (por defecto)"
"rewrite purge --yes" = "Sigue adelante y elimina. Sin esto no se cambia nada (código de salida 3)"
"rewrite run --extract" = "Regla de rutas: conserva solo este subdirectorio, que pasa a ser la raíz; los commits que no lo tocan se descartan y los merges se simplifican. Se pregunta cada vez: indica `--extract-mode`, o el código de salida será 3 y no se previsualizará nada. La extracción se ejecuta antes que los demás indicadores de rutas"
"rewrite run --extract_mode" = "Cómo termina `--extract`: `clone` (un clon local nuevo en `--target`, sin tocar el original; con todos los branches y tags locales), `in-place` (se reescribe el historial de este repositorio, con una entrada de deshacer) o `submodule` (el clon como en `clone`, y un commit nuevo en la rama actual reemplaza la carpeta por un submódulo que apunta a él; este historial se conserva)"
"rewrite run --into_subdir" = "Regla de rutas: mueve todo el repositorio a este subdirectorio en cada commit (para combinar repositorios sin choques de rutas)"
"rewrite run --move_paths" = "Regla de rutas `ORIGEN=DESTINO`: renombra un archivo o carpeta en cada commit, con los mismos blobs y trees en la ruta nueva (repetible, en orden, después de las reglas de contenido). Un commit donde `DESTINO` ya existe no se cambia: la vista previa se rechaza (código de salida 2, `path_collision`) y lista los commits y las rutas"
"rewrite run --target" = "La carpeta del repositorio nuevo para `--extract-mode clone` o `submodule`: no debe existir o debe estar vacía, y no puede estar dentro de este repositorio. La usa `rewrite run`; `rewrite apply` tiene la suya"
"rm-file --paths" = "Rutas relativas al repositorio a eliminar"
shell-init = """Imprime una función wrapper de shell (nombre por defecto `gp`) que ejecuta gitpoulpi y, al salir con "Salir y cd aquí", deja tu shell en la carpeta de la pestaña activa. Añádela al archivo rc de tu shell: `eval "$(gitpoulpi shell-init bash)"`. No se instala ni se edita nada"""
"shell-init --name" = "El nombre de la función. Un comando existente con ese nombre no se sobrescribe"
show = "El contenido de un archivo en una revisión, en el índice o en el árbol de trabajo"
"show --at" = "Revisión en la que leerlo (por defecto: HEAD). Mutuamente excluyente con --staged y --worktree"
"show --output" = "Con --raw: escribe los bytes en este archivo en lugar de stdout"
"show --path" = "Ruta relativa al repositorio a leer"
"show --raw" = "Escribe los bytes exactos del archivo (sin decodificar, sin JSON) en stdout o en --output. Para scripts y archivos binarios como imágenes. Solo en la línea de comandos: no disponible por MCP"
"show --staged" = "Lee el contenido en stage en lugar del de un commit"
"show --worktree" = "Lee el archivo tal como está en disco en lugar del de un commit"
repo-config = "Los `core.autocrlf` y `core.eol` locales del repositorio (lo que edita Ajustes > Git y codificación). Se puede deshacer como cualquier otra operación"
"repo-config set" = "Establece una clave: `core.autocrlf` admite true | input | false, `core.eol` admite lf | crlf | native"
"repo-config show" = "Muestra el valor local del repositorio de una clave (`core.autocrlf` o `core.eol`), o de ambas; null significa sin definir (se aplica el valor global)"
"repo-config show --key" = "`core.autocrlf` o `core.eol`; ambas si se omite"
"repo-config unset" = "Quita el valor local del repositorio, para que vuelva a aplicarse el global"
ssh-command = "La fijación local al repositorio de `core.sshCommand`: qué clave SSH usa este repositorio. Consulta `repo-auth` para ver toda la identidad"
"ssh-command clear" = "Quita la fijación, de modo que el repositorio vuelve a usar la configuración ssh del entorno"
"ssh-command set" = "Fija el repositorio a una clave privada, o a un comando literal"
"ssh-command set --command" = "Un valor literal de `core.sshCommand`"
"ssh-command set --key" = 'Archivo de clave privada: fija `ssh -i "<key>" -o IdentitiesOnly=yes`'
"ssh-command show" = "Muestra el `core.sshCommand` fijado del repositorio (null si no está definido)"
"stage --allow_sensitive" = "Hace stage también de archivos que parecen sensibles (una clave privada, un `.env`, un token reconocido). Sin esto, ese stage se rechaza y no se hace stage de nada (`[privacy] staging_guard`)"
"stage --hunk" = "Índice de un hunk dentro del diff de `--file`, tal como los numera `gitpoulpi diff --json`"
"stage --lines" = "Índices de línea separados por comas dentro de `--hunk`"
"stage --paths" = "Varias rutas (archivos o carpetas) como UNA sola operación: una entrada en el diario y un paso de `undo` (un archivo movido es su ruta antigua y la nueva)"
"unstage --paths" = "Varias rutas (archivos o carpetas) como UNA sola operación: una entrada en el diario y un paso de `undo` (un archivo movido es su ruta antigua y la nueva)"
"stash push --ai" = "Deja que la IA ponga nombre al stash a partir de los cambios de trabajo (requiere `ai.enabled = true`, ver `docs/user/ai.md`)"
submodule = "Submódulos: lístalos con su estado, regístralos (`init`) o actívalos (`update`)"
"submodule init" = "Registra submódulos en `.git/config` sin clonarlos (`git submodule init`). Sin rutas: todos"
"submodule init --paths" = "Rutas de submódulo relativas al repositorio"
"submodule list" = "Todos los submódulos con su estado: `uninitialized` (sin clonar), `up_to_date`, `modified` (activado en un commit distinto del registrado) o `conflicted`"
"submodule update" = "Activa los submódulos en los commits que registra el repositorio (`git submodule update`). Sin rutas: todos"
"submodule update --init" = "Clona y registra los que aún no lo están (`--init`)"
"submodule update --paths" = "Rutas de submódulo relativas al repositorio"
"submodule update --recursive" = "Actualiza también los submódulos de los propios submódulos"
"tag annotate" = "Sustituye un tag existente por uno anotado, en su sitio. El tag conserva el commit al que ya apunta"
"tag move" = "Mueve un tag existente a otro commit, conservando su tipo (un tag anotado conserva su mensaje y su autor). Solo local: un remoto conserva la posición anterior hasta que hagas push"
"tag move --force_non_ff" = "Permite un movimiento que no es un fast-forward (el commit actual del tag no es un ancestro del destino)"
"tag move --target" = "El commit, la rama o el tag al que moverlo"
"tag merge-branch" = "Hace merge de una rama en el commit al que apunta un tag (detached, ninguna rama se mueve) y luego mueve el tag al commit de merge"
"tag merge-branch --branch" = "La rama (o cualquier revisión) de la que hacer merge en el tag"
"tag merge-branch --message" = "Mensaje del commit de merge"
"tag create --message" = "Crea un tag *anotado* con este mensaje en lugar de uno ligero - `git tag -a -m`"
"tag delete" = "Elimina un tag. Por defecto solo el local (`--local`): si un remoto también tiene el tag, el próximo `fetch` lo recupera, y la respuesta lo avisa. `--remote <R>` lo elimina solo en ese remoto (afecta a otras personas: lo pierden), `--both` lo elimina aquí y en el remoto que lo tiene (`--both --remote <R>` indica cuál)"
"tag delete --both" = "Elimina aquí y en el remoto que tiene el tag"
"tag delete --local" = "Elimina solo el tag local (el valor por defecto)"
"tag delete --remote" = "Elimina en este remoto (solo allí, salvo con `--both`)"
"tag delete-remote" = "Elimina un tag de un remoto, conservando el local"
"tag take-remote" = "Usa la versión del remoto de un tag que `differs` (está aquí y en un remoto en otro commit): el tag local pasa a lo que tiene el remoto, según se conoce del último fetch o push (sin red). Un tag anotado pasa a ser ese mismo objeto tag. Se puede deshacer"
"tag take-remote --remote" = "Omitido: el único remoto en el que el tag difiere"
"tag force-push" = "Hace push forzado del tag local a un remoto que lo tiene en otro commit (un tag que `differs`), con lease sobre el valor que vio el último fetch: un remoto que se movió desde entonces se rechaza (\"fetch first\") y no se sobrescribe nada. Afecta al exterior: sin `--yes` no cambia nada y el código de salida es 3. Se puede deshacer (el valor anterior se vuelve a enviar, con lease)"
"tag force-push --remote" = "Omitido: el único remoto en el que el tag difiere"
"tag force-push --yes" = "Continúa; sin ello no cambia nada y el código de salida es 3"
"tag fetch" = "Trae un tag de un remoto a los tags locales: lo que necesita un tag que `tag list` marca como solo `remote`. Nunca sobrescribe un tag local que apunte a otro commit"
"tag fetch --remote" = "Si se omite: el único remoto que tiene el tag"
"tag list" = "Todos los tags y dónde están: `local` (aquí), `remote` (los remotos que lo tienen), `differs_on` (remotos que lo tienen en otro commit) y `where`: `local`, `remote` (no traído o eliminado aquí), `both` o `differs`. Se sabe por el último fetch o push, no por la red"
"tag list --unpushed" = "Solo los tags que no se sabe que tenga ningún remoto"
"tag push" = "Envía tags a un remoto. Sin nombres, envía todos los tags que no se sabe que tenga ningún remoto - un único push, no uno por tag"
"tag push --names" = "Tags a enviar. Omítelo para enviar todos los tags sin enviar"
theme = "Los temas de color: listarlos o imprimir uno como archivo de tema"
licenses = "Muestra las licencias de terceros y los créditos incluidos en este programa (el mismo texto que Acerca de > Licencias y que el archivo THIRD-PARTY-LICENSES.txt del archivo de la versión)"
"theme export" = "Imprime en stdout un archivo de tema completo, para partir de él al crear un tema propio (guárdalo como `<config>/themes/<nombre>.toml`)"
"theme export --slug" = "El slug del tema (ver `theme list`)"
"theme list" = "Lista todos los temas: los preajustes integrados y los archivos de la carpeta `themes/` del directorio de configuración (slug, etiqueta, origen, claro, paleta de carriles). `ui.theme` acepta cualquiera de estos slugs"
desktop = "Accesos directos que inician GitPoulpi desde el lanzador del sistema, en el terminal que indica `ui.launch_terminal`"
"desktop folder-menu" = """La entrada «Abrir en GitPoulpi» del menú contextual del administrador de archivos: Explorador de archivos (Windows), GNOME Files, Dolphin, Nemo, Thunar, Caja y PCManFM (Linux), Finder (macOS)"""
"desktop folder-menu install" = "Añade la entrada a cada administrador de archivos que encuentre (un archivo ajeno no se sobrescribe nunca)"
"desktop folder-menu remove" = "Quita exactamente lo que escribió `install`, de cada administrador de archivos"
"desktop folder-menu status" = "Muestra cada administrador de archivos de este sistema: si se encuentra y si la entrada está not_installed, installed, outdated o foreign (un archivo que no es de GitPoulpi)"
"desktop shortcut" = "Lista, crea o quita los accesos directos del lanzador, del menú Inicio y del escritorio"
"desktop shortcut install" = "Crea o actualiza un acceso directo (por defecto: el lanzador del sistema)"
"desktop shortcut install --place" = "`launcher`, `desktop` o `startmenu`"
"desktop shortcut remove" = "Quita los accesos directos creados por GitPoulpi (por defecto: todos); un archivo que no es de GitPoulpi nunca se toca"
"desktop shortcut remove --place" = "`launcher`, `desktop` o `startmenu`"
"desktop shortcut status" = "Muestra cada acceso directo que ofrece este sistema: not_installed, installed, outdated o foreign (un archivo que no es de GitPoulpi), y el terminal en uso"
treat = "Hace que git trate archivos como binarios o como texto, escribiendo una regla de `.gitattributes` (`binary` o `text diff`) para las rutas: el archivo de la raíz del repositorio por defecto, `--file` para el de una carpeta o `.git/info/attributes` (solo este clon). Una regla que ya nombra el mismo patrón se reescribe, no se contradice. La respuesta indica si git trata ahora realmente las rutas así (`effective`). Se deshace con `gitpoulpi undo`, salvo para `.git/info/attributes`"
"treat --kind" = "Cómo debe tratar git las rutas"
"treat --paths" = "Rutas relativas al repositorio (carpetas con `--folder`)"
"treat --extension" = "Nombra todos los archivos con la extensión de cada ruta (`*.ext`) en lugar del archivo mismo"
"treat --folder" = "Las rutas son carpetas: la regla cubre todo lo que contienen"
"treat --file" = "`.gitattributes` relativo al repositorio donde escribir, o `.git/info/attributes` (por defecto: el `.gitattributes` de la raíz)"
convert = "Reescribe la codificación, los finales de línea o la sangría de archivos del directorio de trabajo, con las funciones del editor de la TUI y de su menú Convertir. Exactamente una de `--encoding`, `--eol` y `--indent`. Los archivos binarios, ausentes o que la codificación de destino no puede representar se omiten y se informa de ello, nunca se dañan. Una sola entrada del diario para todo el lote: `gitpoulpi undo` devuelve todos los archivos"
"convert --paths" = "Archivos por convertir, rutas relativas al repositorio"
"convert --encoding" = "La codificación de destino, como la nombra el editor (`UTF-8`, `UTF-8 BOM`, `UTF-16 LE`, `Windows-1252`, `ISO-8859-1`, `Shift_JIS`, ...)"
"convert --eol" = "El final de línea de destino"
"convert --indent" = "Espacios o tabulaciones al principio de la línea: `spaces:<n>` o `tabs:<n>`, siendo `<n>` el ancho de una tabulación (1-8)"
ui = "Muestra cosas al usuario en su ventana de GitPoulpi abierta: un commit, un diff en una línea, un archivo, una página de ajustes. Solo visualización: nada de esto cambia el repositorio ni escribe en la ventana, salvo `ui propose`, que abre un diálogo rellenado de antemano para que el usuario lo confirme (desactivado salvo `[mcp] allow_ui_propose = true`). Requiere una TUI de GitPoulpi abierta en la sesión"
"ui --launch" = "Si no hay ninguna ventana abierta en ningún sitio, abre una con el comando de lanzamiento configurado (`[ui] launch` / `launch_command`; desactivado por defecto) y espera hasta 10 s a que se conecte. Sin este flag, solo se lanza una ventana cuando `[ui] launch` está definido Y `ui_control` es `auto`"
"ui --viewer" = "Envía a esta ventana (`ui viewers` las lista) en lugar de dejar que elija el daemon"
"ui back" = "Deshace el último cambio de vista del agente (restaura la vista anterior)"
"ui highlight" = "Resalta un rango de líneas en el diff o archivo que tiene abierto la ventana"
"ui highlight --no_scroll" = "No desplaza el rango hasta dejarlo a la vista"
"ui highlight --range" = "`A-B`, o `A:C-B:C` con columnas (desde 1)"
"ui notify" = "Muestra un mensaje breve tipo toast al usuario"
"ui notify --message" = "Como máximo 200 caracteres; los caracteres de control se eliminan"
"ui propose" = """Propone un cambio para que el usuario lo confirme: se abre un diálogo rellenado de antemano, marcado "Propuesto por", y no ocurre nada hasta que el usuario pulsa su propia confirmación. Requiere `[mcp] allow_ui_propose = true`. Sigue el id `proposal` de la respuesta en las `proposals` de `ui state`"""
"ui propose branch" = "Abre el cuadro Nueva rama con un nombre rellenado"
"ui propose branch --start_point" = "Dónde empieza la rama (por defecto: HEAD)"
"ui propose commit-message" = "Rellena el Resumen y la Descripción del compositor de commits; nunca hace commit"
"ui propose resolution" = "Abre el editor de merge en un archivo en conflicto con una resolución ya aplicada, para que el usuario la revise y la confirme con Guardar y marcar como resuelto (su Ctrl+S es la única confirmación; aquí no se escribe ni se pone en stage nada). Da las elecciones con `--pick`, o el archivo completo con `--content-file`"
"ui propose resolution --content_file" = "El texto final del archivo, exactamente (`-` lee la entrada estándar)"
"ui propose resolution --path" = "Ruta relativa al repositorio del archivo en conflicto"
"ui propose resolution --pick" = "Una elección por número de conflicto: `1=a,2=b,3=ab,4=ba,5=none` (a = actual, b = entrante, ab / ba = ambos en ese orden)"
"ui propose resolution --pick_default" = "Con `--pick`: la elección para cada conflicto no listado"
"ui propose reword" = "Abre el popup Reword sobre un commit con un nuevo mensaje rellenado"
"ui propose rewrite" = "Abre el editor de reescritura del historial con una receta ya puesta, para que el usuario la revise con la vista previa y la aplique; nunca reescribe, purga ni hace push de nada por su cuenta. Una receta tiene como máximo 50 reglas y ningún script, y se le quitan los valores secretos"
"ui propose rewrite --recipe" = "La receta (TOML o JSON, como la acepta `rewrite preview --recipe`), desde una ruta de archivo o `-` para la entrada estándar"
"ui propose reword --message" = "El mensaje propuesto: resumen, línea en blanco, cuerpo"
"ui propose reword --rev" = "El commit (en la rama activa)"
"ui propose split" = "Abre el editor de división para un commit, con un plan ya rellenado que el usuario revisa, edita y aplica; no divide nada por su cuenta"
"ui propose split --plan" = "El plan (JSON), desde una ruta de archivo o `-` para stdin, tal como lo acepta `split-commit --plan`"
"ui propose split --rev" = "El commit a dividir (en la rama activa)"
"ui propose tag" = "Abre el cuadro Nuevo tag con un nombre (y, si es anotado, un mensaje) rellenado"
"ui propose tag --message" = "Lo convierte en un tag anotado con este mensaje"
"ui propose tag --target" = "El commit a etiquetar (por defecto: HEAD)"
"ui sequence" = "Pide a la ventana del usuario que ejecute una secuencia: se abre un aviso \"Propuesto por <cliente>: ejecutar la secuencia <nombre>\" con Ejecutar y Descartar, y no se ejecuta nada hasta que el usuario pulsa Ejecutar (la ejecución se pausa después donde lo indique la secuencia, como una que él mismo hubiera iniciado). Se rechaza cuando la secuencia no existe, no es válida o proviene de un archivo del repositorio en el que el usuario no ha confiado. Requiere `[mcp] allow_ui_propose = true`. Sigue el id `proposal` de la respuesta en las `proposals` de `ui state`"
"ui sequence run" = "Propone ejecutar la secuencia con este id (`gitpoulpi sequence list`)"
"ui sequence run --id" = "El id de la secuencia"
"ui show" = "Lleva la vista del usuario a algo"
"ui show commit" = "Selecciona un commit en el Log"
"ui show commit --also" = "Más commits a seleccionar con él (como máximo 9)"
"ui show commit --files" = "Expande la lista de archivos cambiados del commit"
"ui show commit --focus" = "Lleva el foco del teclado a este panel"
"ui show commit --rev" = "Cualquier revisión (rama, tag, `HEAD~2`, un sha)"
"ui show conflict" = "Abre el editor de conflictos de merge en un archivo en conflicto, en un conflicto. Solo visualización: no se elige nada y no se guarda nada"
"ui show conflict --conflict" = "Desplaza hasta el conflicto N (desde 1)"
"ui show conflict --path" = "Ruta relativa al repositorio del archivo en conflicto"
"ui show diff" = "Abre el diff de un archivo, en una línea"
"ui show diff --highlight" = "Resalta un rango: `A-B`, o `A:C-B:C`"
"ui show diff --line" = "Desplaza hasta esta línea (desde 1)"
"ui show diff --path" = "Ruta relativa al repositorio, con barras normales"
"ui show diff --rev" = "Diff de este commit contra su padre (por defecto: HEAD)"
"ui show diff --side" = "La numeración de qué lado usa `--line`"
"ui show diff --staged" = "El índice contra HEAD"
"ui show diff --unstaged" = "El árbol de trabajo contra el índice"
"ui show diff --whole_file" = "Muestra el archivo entero en lugar de solo los hunks"
"ui show file" = "Abre un archivo (contenido, blame o historial) en una posición"
"ui show file --highlight" = "Resalta un rango: `A-B`, o `A:C-B:C`"
"ui show file --index" = "El archivo tal como está en stage"
"ui show file --rev" = "El archivo en esta revisión (por defecto: HEAD)"
"ui show file --worktree" = "El archivo en disco"
"ui show home" = "Muestra la Gestión de repositorios (la pantalla de inicio)"
"ui show home --filter" = "Texto para su cuadro de búsqueda"
"ui show issue" = "Selecciona un issue en la barra lateral"
"ui show keys" = "Abre la superposición de ayuda (los atajos de teclado; se llama `keys` porque clap reserva `help` como nombre de subcomando)"
"ui show palette" = "Abre la paleta de comandos con una consulta rellenada; nunca la ejecuta"
"ui show pr" = "Selecciona un pull request / merge request en la barra lateral"
"ui show ref" = "Selecciona una ref (rama, tag, stash) en la barra lateral; nunca la activa"
"ui show ref --name" = "Un nombre completo (`refs/heads/x`) o corto (`main`, `origin/main`)"
"ui show search" = "Abre la barra de búsqueda del Log con una consulta (atenúa, nunca filtra)"
"ui show settings" = "Abre una página de Ajustes y destaca un ajuste; nunca edita un valor"
"ui show settings --setting" = "Una clave de configuración como `ui.minimap`"
"ui show tab" = "Cambia a (o abre) una pestaña de repositorio"
"ui show tab --path" = "El repositorio a mostrar; por defecto `--repo` / el actual"
"ui show wip" = "Muestra los cambios del árbol de trabajo (la fila WIP)"
"ui show wip --composer" = "Pone el foco del teclado en el campo de resumen del commit (no escribe nada)"
"ui show wip --path" = "Selecciona la fila de este archivo"
"ui show wip --staged" = "El lado en stage de `path`"
"ui state" = "Lee lo que muestra actualmente una ventana (la enfocada más recientemente, o `--viewer`)"
"ui state --text" = "Devuelve además el texto plano de las filas visibles del panel principal (200 líneas como máximo; los campos secretos siguen enmascarados)"
"ui viewers" = "Lista las ventanas de GitPoulpi conectadas a esta sesión"
"ui viewers --all_sessions" = "Lista además las ventanas de todas las demás sesiones en ejecución (leído de `sessions/*.port`, solo loopback)"
undo = "Deshace la última operación registrada en el journal (commit, amend, checkout, creación/eliminación de rama). Se rechaza, sin cambiar nada, si algo de lo que tocó la operación se ha movido desde entonces. Código de salida 2 si se rechaza, 3 si necesita `--yes` (un undo arriesgado)"
"undo --all" = "Con `--list`: incluye las entradas que ya no se pueden rehacer"
"undo --dry_run" = "Muestra lo que ocurriría y no cambia nada"
"undo --expect" = "Deshace solo si esta sigue siendo la última entrada (su id, como lo muestra `--list`); si no, se rechaza por obsoleta"
"undo --list" = "Lista el journal en lugar de deshacer (la más reciente al final); `--all` añade las entradas que ya no se pueden rehacer pero siguen ancladas"
"undo --sequence" = "Deshace toda la ejecución de secuencia que está arriba del diario en lugar de una sola entrada: las entradas consecutivas más recientes que hizo un `sequence run`, de la más reciente a la más antigua, cada una un deshacer normal con sus propias comprobaciones. Se detiene en la primera negativa (código 2) o entrada que necesita `--yes` (código 3), indica qué paso y deja las entradas más antiguas. Solo se toca el diario de este repositorio: un paso hecho en otro repositorio (un worktree) no se deshace. Rehacer sigue siendo por entrada"
"undo --yes" = "Continúa cuando el undo es arriesgado (el commit ya está en su upstream, o se sobrescribirían archivos del árbol de trabajo). Sin esto, un undo así no cambia nada y sale con código 3"
worktree = "Worktrees enlazados: lístalos, añade uno en una rama o en un commit"
"worktree add" = "Añade un worktree enlazado en `<path>`. Si `<start>` nombra una rama local, activa esa rama allí (o inicia `--branch` en ella); cualquier otra revisión da un HEAD desacoplado (o inicia `--branch` allí)"
"worktree add --branch" = "Crea esta nueva rama en `<start>` y la activa allí"
"worktree add --start" = "Una rama local, o cualquier revisión"
"worktree list" = "Todos los worktrees del repositorio, el principal primero"
"worktree changes" = "Los cambios sin confirmar del worktree en `<path>` (con seguimiento y sin él, no ignorados); una lista vacía significa que está limpio"
"worktree remove" = "Elimina el worktree enlazado en `<path>`. Un worktree con cambios sin confirmar se rechaza salvo con `--force` (se pierden), `--commit-message` (hace commit de todos los cambios en su rama antes) o `--stash-message` (hace stash de todos los cambios, también los sin seguimiento, antes; el stash lo comparten todos los worktrees); un worktree desacoplado necesita además `--commit-branch`. `--delete-branch` también borra su rama (queda en el diario: deshacer recupera la rama; la carpeta sigue eliminada). La eliminación en sí no se puede deshacer"
"worktree remove --commit_branch" = "La rama que se crea para ese commit cuando el worktree está desacoplado"
"worktree remove --commit_message" = "Hace commit de todos los cambios con este mensaje antes de eliminar"
"worktree remove --delete_branch" = "Borra también la rama del worktree tras eliminarlo"
"worktree remove --force" = "Elimina incluso con cambios sin confirmar; se pierden"
"worktree remove --stash_message" = "Hace stash de todos los cambios con este mensaje antes de eliminar"
_usage = "Uso:"
_options = "Opciones"
_arguments = "Argumentos"
_commands = "Comandos"
_help_flag = "Mostrar la ayuda (más detalles con '--help')"
_version_flag = "Mostrar la versión"
"conflicts am-abort" = "Aborta el `git am` en curso: la rama vuelve a su punta de antes del `am` y se descartan los parches aplicados hasta ahora"
"conflicts am-continue" = "Continúa el `git am` en curso: aplica el parche en el que se detuvo (resuelva y añada antes sus archivos al índice) y el resto del buzón. `{\"outcome\":\"Completed\"}` o `\"Stopped\"` (otro parche entró en conflicto)"
"conflicts am-skip" = "Omite el parche en el que se detuvo el `git am` en curso y sigue con el siguiente"
"hosting integrations add --account" = "El email de la cuenta (`jira_cloud`, `bitbucket`), la clave de API (`trello`) o el nombre de usuario (`gerrit`). No es un secreto: el token se introduce con `hosting login`"
"hosting integrations add --org" = "La organización de Azure DevOps (`azure_devops`), atajo de `--url https://dev.azure.com/<org>`"
"hosting issue create --issue_type" = "El tipo de incidencia, por nombre o id (Jira, Azure DevOps; véase `hosting issue options`). Por defecto, la elección del proveedor"
"hosting issue create --list" = "La lista donde va la tarjeta, por nombre o id (Trello; véase `hosting issue options`). Por defecto, la primera lista abierta"
"hosting issue options" = "Los tipos de incidencia y las listas que el proyecto vinculado ofrece a `issue create --type` / `--list`. Solo lectura"
"hosting issue options --id" = "Qué integración (ver `hosting issues`)"
"hosting link --filter" = "Acota la lista de incidencias con la sintaxis propia del proveedor (una cláusula JQL de Jira, una condición WIQL de Azure, nombres de listas de Trello)"
"hosting open --reference" = "Un número (`12`, `#12`, `!12`) o la referencia propia de una incidencia (`AB#12`, `ABC-12`, un enlace corto de Trello)"
"hosting refs" = "Las referencias a incidencias y pull requests que contiene un mensaje de commit o un nombre de rama, leídas a través de los vínculos de este repositorio (uno sin vincular no tiene ninguna): `[{text, kind, reference, url}]`"
"hosting refs --branch" = "Lee la incidencia que nombra un nombre de rama (`ABC-123-fix`, `123-fix`)"
"hosting refs --commit" = "Analiza el mensaje de este commit"
"hosting refs --message" = "Analiza este texto"
"hosting review" = "Revisa un pull / merge request sin salir del terminal (GitHub, GitLab, Gitea, Forgejo): léelo, con sus hilos y sus archivos, comenta, responde, resuelve, envía una revisión y trae su head para ver el diff. Los mismos comandos para una persona, un script y un agente de IA"
"hosting review comment" = "Publica un comentario en la conversación de un pull / merge request (no sobre el código). Acción hacia el exterior: se publica al instante"
"hosting review comment --body" = "El comentario (markdown)"
"hosting review comment --body_file" = "Lee el comentario de este archivo (`-` lee stdin)"
"hosting review comment --id" = "Qué integración (ver `hosting prs`)"
"hosting review comment --number" = "El número de la PR (GitHub) o el `iid` de la MR (GitLab)"
"hosting review fetch" = "Hace fetch del head de un pull / merge request a `refs/gitpoulpi/pr/<n>` y de su rama de destino a `refs/gitpoulpi/pr/<n>-base`, para revisar el diff entre ambos. Ninguno es una rama y no se hace checkout de nada"
"hosting review fetch --id" = "Qué integración (ver `hosting prs`)"
"hosting review fetch --number" = "El número de la PR (GitHub) o el `iid` de la MR (GitLab)"
"hosting review fetch --remote" = "El remoto donde vive la solicitud. Por defecto, aquel del que se resolvió el proyecto; si no, el predeterminado del repositorio"
"hosting review reply" = "Responde a un hilo de revisión (su id viene de `review threads`). Acción hacia el exterior: se publica al instante"
"hosting review reply --body" = "La respuesta (markdown)"
"hosting review reply --body_file" = "Lee la respuesta de este archivo (`-` lee stdin)"
"hosting review reply --id" = "Qué integración (ver `hosting prs`)"
"hosting review reply --number" = "El número de la PR (GitHub) o el `iid` de la MR (GitLab)"
"hosting review reply --thread" = "El id del hilo, como lo imprime `review threads`"
"hosting review resolve" = "Resuelve un hilo de revisión, o lo reabre con `--unresolve`"
"hosting review resolve --id" = "Qué integración (ver `hosting prs`)"
"hosting review resolve --number" = "El número de la PR (GitHub) o el `iid` de la MR (GitLab)"
"hosting review resolve --thread" = "El id del hilo, como lo imprime `review threads`"
"hosting review resolve --unresolve" = "Reabre el hilo en su lugar"
"hosting review show" = "Lee un pull / merge request para revisarlo: descripción, commits de head y de base, estado del merge, comprobaciones, lo que el host permite hacer en una revisión (`capabilities`) y sus archivos cambiados. El diff en sí viene del repositorio (`review fetch`, y luego diff de `refs/gitpoulpi/pr/<n>`)"
"hosting review show --id" = "Qué integración (ver `hosting prs`)"
"hosting review show --number" = "El número de la PR (GitHub) o el `iid` de la MR (GitLab), el número del cambio (Gerrit)"
"hosting review submit" = "Envía una revisión: todos los `--comment` y el veredicto de una vez. GitLab no ofrece `request-changes` (no tiene ese estado de revisión: allí se rechaza sin enviar nada)"
"hosting review submit --body" = "El resumen de la revisión (markdown). Obligatorio para `request-changes` y `comment`, salvo que un `--comment` lleve el mensaje"
"hosting review submit --body_file" = "Lee el resumen de este archivo (`-` lee stdin)"
"hosting review submit --comments" = "Un comentario sobre el código, `path:line[:side]:text`; repite el flag. `line` es `N` o un rango `N-M` (GitHub; GitLab se queda con la última línea), `side` es `new` (la línea en el head, por defecto) u `old` (la línea en la base del merge)"
"hosting review submit --event" = "El veredicto"
"hosting review submit --id" = "Qué integración (ver `hosting prs`)"
"hosting review submit --number" = "El número de la PR (GitHub) o el `iid` de la MR (GitLab)"
"hosting review threads" = "Los hilos de revisión de un pull / merge request (también los resueltos, cada uno con su ruta, línea, lado, marca de obsoleto y comentarios) y los comentarios de su conversación. Las líneas son las del diff de `refs/gitpoulpi/pr/<n>`: `new` es la línea en el head y `old` la línea en la base del merge"
"hosting review threads --id" = "Qué integración (ver `hosting prs`)"
"hosting review threads --number" = "El número de la PR (GitHub) o el `iid` de la MR (GitLab)"
"hosting review threads --unresolved" = "Omite los hilos resueltos"
index-lock = "Un `.git/index.lock` obsoleto, que hace fallar toda escritura: mostrarlo o eliminarlo cuando sea lo bastante antiguo"
"index-lock remove" = "Elimina un `index.lock` obsoleto (dejado por un comando git que murió). Se rechaza mientras tenga menos de 10 s o si no hay ninguno. Solo se elimina el archivo de bloqueo; compruebe que no se esté ejecutando ningún comando git"
"index-lock show" = "El `index.lock` del repositorio (`null` si no hay): su ruta, su antigüedad en segundos y si está obsoleto (más de 10 s)"
"job" = "Las tareas en segundo plano del demonio: cada fetch, push, pull, clone y transferencia LFS lo es desde que se recibe. `list` las muestra, `cancel` detiene una, `wait` espera a que termine una. Ctrl+C en un comando que inició una tarea la cancela"
"job list" = "Las tareas del demonio de esta sesión, de la más antigua a la más reciente: en curso, en cola tras otra y las terminadas en los últimos 30 segundos"
"job cancel" = "Detiene una tarea. Rechazado (código de salida 1, nada cambia) una vez pasado el punto en que detenerla es seguro, por ejemplo un pull que ya empezó a fusionar. Un push cancelado puede haber llegado ya al remoto"
"job cancel --id" = "El id de la tarea, de `job list`"
"job wait" = "Espera a que termine una tarea e imprime su estado final. Código de salida 0 si es `Done`, 1 si falló o se canceló"
"job wait --id" = "El id de la tarea, de `job list`"
"job wait --timeout" = "Se rinde tras estos segundos (código de salida 1, la tarea sigue). Omitido: espera lo que haga falta"
"undo-forget" = "Quita del diario de deshacer la entrada bloqueada de arriba (operación interrumpida, o el repositorio avanzó desde entonces) para poder deshacer las de debajo. Nunca toca el repositorio, solo el diario; la entrada ya no se puede deshacer ni rehacer. Código de salida 2 si la entrada de arriba no está bloqueada, 3 sin `--yes`"
"undo-forget --dry_run" = "Muestra lo que se quitaría sin cambiar nada"
"undo-forget --expect" = "Solo la olvida si sigue siendo la entrada de arriba (su id, como la muestra `undo --list`); si no, se rechaza por obsoleta"
"undo-forget --redo" = "Olvida la entrada de arriba de rehacer en lugar de la de deshacer"
"undo-forget --yes" = "Confirma. Sin esto nada cambia y el código de salida es 3"
"clone --sparse" = "Checkout parcial (sparse): hace checkout solo de estos directorios (más los archivos de la raíz); el historial completo se descarga igualmente"
sparse-checkout = "Checkout parcial (modo cone): conserva solo algunos directorios en el árbol de trabajo de un repositorio grande. `gitpoulpi clone --sparse` inicia uno"
"sparse-checkout add" = "Muestra también estos directorios, conservando los que ya se muestran"
"sparse-checkout disable" = "Vuelve a hacer checkout de todos los archivos (checkout completo)"
"sparse-checkout set" = "Muestra exactamente estos directorios (más los archivos de la raíz del repositorio); todos los demás salen del árbol de trabajo. Activa el checkout parcial si estaba desactivado. El historial no se toca"
"sparse-checkout set --dirs" = "Directorios relativos a la raíz del repositorio, p. ej. `src docs/guide`"
"sparse-checkout status" = "Indica si el árbol de trabajo es un checkout parcial y qué directorios muestra: `{ \"enabled\", \"cone\", \"dirs\" }`"
"diff --from" = "Compara desde esta revisión (extremo más antiguo) en lugar del árbol de trabajo contra el índice. Se usa junto con `--to`"
"diff --name_only" = "Lista solo los archivos modificados y su estado, sin hunks"
"diff --to" = "El otro extremo de `--from`: una revisión, o `worktree` (por defecto) para el árbol de trabajo, con cambios en stage y sin stage de los archivos seguidos. Comparar la selección del Log lista los mismos archivos"
"file-history" = "Los commits que cambiaron un archivo, del más reciente al más antiguo, siguiendo los renombrados (la ruta en cada commit, el tipo de cambio y los recuentos de líneas)"
"file-history --at" = "Revisión desde la que empezar (por defecto: HEAD)"
"file-history --limit" = "Entradas por página; `more` en la respuesta indica si existen más antiguas"
"file-history --skip" = "Entradas a omitir (la página n es `--skip <n*limit> --limit <limit>`)"
"lost-commits" = "Commits a los que no llega ninguna rama, tag, remoto ni stash: lo que dejó atrás una rama eliminada (nombrada por un reflog, o conservada solo por un anclaje de deshacer) y, salvo con `--no-deep`, los commits huérfanos de la base de objetos. Del más reciente al más antiguo. Crea una rama en uno de ellos para recuperarlo"
"lost-commits --budget_ms" = "Deja de buscar tras esta cantidad de milisegundos (0: sin límite); la respuesta indica entonces `partial`"
"lost-commits --limit" = "Commits que listar"
"lost-commits --no_deep" = "Solo los commits que aún nombra un reflog o un anclaje de deshacer (rápido con cualquier tamaño)"
"lost-commits --skip" = "Commits que omitir"
"reflog" = "Lista un reflog, del más reciente al más antiguo: dónde estuvo antes `HEAD` o una rama, con la fecha y el motivo que da git, incluidos los movimientos hechos desde un shell. Una rama eliminada ya no tiene reflog. También se escribe `reflog restore` para `reflog-restore`"
"reflog --limit" = "Entradas que listar"
"reflog --ref" = "`HEAD` (por defecto) o una rama (o un nombre de ref completo)"
"reflog --skip" = "Entradas que omitir"
"reflog-restore" = "Mueve una rama (o `HEAD`) a una posición de su reflog. Una rama que no está activa simplemente se mueve. Con la rama activa, el árbol de trabajo queda a salvo: si hay cambios sin confirmar, se rechaza salvo que se indique `--mode`. Genera una sola entrada en el diario: `undo` la deshace. También se escribe `gitpoulpi reflog restore`"
"reflog-restore --dry_run" = "Muestra lo que ocurriría y no cambia nada"
"reflog-restore --mode" = "Con cambios sin confirmar: `keep` mueve y los conserva (se rechaza si alguno estorba); `soft`, `mixed` y `hard` son los modos de reset"
"reflog-restore --oid" = "El commit al que moverla (el `new` de una entrada del reflog)"
"reflog-restore --ref" = "`HEAD` o una rama"
"undo-restore" = "\"Restaurar solo esta\": recupera lo que quitó una operación anterior (una rama o tag eliminado, un stash descartado, un archivo descartado o eliminado, un remoto quitado, una línea de ignore) sin deshacer las operaciones posteriores. La restauración es una nueva entrada del journal, así que `undo` la revierte. Nada se sobrescribe: un archivo que cambió desde entonces recibe la versión conservada a su lado como `<nombre>.restored`; un reset, amend o rebase vuelve como una rama nueva en la punta antigua. También se escribe `gitpoulpi undo restore <id>`. Código de salida 2 cuando no se puede hacer (el JSON indica el motivo)"
"undo-restore --dry_run" = "Muestra lo que ocurriría y no cambia nada"
"undo-restore --id" = "La entrada que restaurar, con el id que muestra `undo --list`"
"undo-restore --name" = "Restaura la rama o el tag con este nombre (cuando su nombre antiguo está ocupado, o para la rama que restaura un reset/amend/rebase)"
"commit --workspace" = "Haz el commit con el perfil predeterminado de este espacio de trabajo (un id de espacio de trabajo; también `GITPOULPI_WORKSPACE`). Se aplica cuando el repositorio está en el espacio de trabajo y este indica un perfil que existe; si no, `general.active_profile`; si no, la identidad de la configuración de git del propio repositorio. Sin esta opción se usa esta última"
"search" = "Búsqueda aproximada en las ramas, tags, worktrees, stashes y mensajes de commit del repositorio actual, o de todos los repositorios de un espacio de trabajo, además de las pull requests y los issues en caché. Los resultados llegan ordenados de mejor a peor, con los caracteres que coincidieron. Un prefijo acota la búsqueda: `b:` ramas, `t:` tags, `c:` commits, `s:` stashes, `w:` worktrees, `pr:` pull requests, `i:` issues, `r:` repositorios (solo en un espacio de trabajo)"
"search --kinds" = "Solo estos tipos (repetible); por defecto todos. Un prefijo en la consulta acota aún más"
"search --limit" = "Como máximo este número de resultados"
"search --query" = "Qué buscar, prefijo incluido (`c: fix login`)"
"search --workspace" = "Busca en todos los repositorios de este espacio de trabajo (un id; también `GITPOULPI_WORKSPACE`). Sin él, en el repositorio actual"
"workspace" = "Espacios de trabajo: grupos con nombre de repositorios, con un perfil de commit predeterminado opcional. Se guardan en `workspaces.toml`, junto a `config.toml`, y se comparten con la TUI"
"workspace add" = "Añade repositorios a un espacio de trabajo y registra la URL de `origin` de cada uno"
"workspace create" = "Crea un espacio de trabajo y lo imprime, con su nuevo id. Cada `--add` se registra con su URL de `origin`"
"workspace create --color" = "Nombre de un color de acento del tema para su punto en la barra de pestañas"
"workspace create --name" = "Cómo lo llama la gente. El id es un slug hecho a partir de él"
"workspace create --profile" = "El perfil de commit predeterminado (un id de `[[profiles]]`)"
"workspace create --repos" = "Un repositorio que poner en él (repetible). No `--repo`: esa opción elige el repositorio donde se ejecuta un comando"
"workspace delete" = "Elimina un espacio de trabajo. Los repositorios no se tocan"
"workspace list" = "Los espacios de trabajo, con sus repositorios y su perfil predeterminado"
