"rewrite preview --mailmap" = "Regla mailmap: reescribe autores y committers con el nombre que les da el `.mailmap` del worktree (el historial acaba mostrando lo que muestra `git log --use-mailmap`). `--who` elige autor, committer o ambos. Para corregir solo la visualización, sin reescribir, usa `mailmap add`"
