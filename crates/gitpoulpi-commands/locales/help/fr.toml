convert = "Réécrit l'encodage, les fins de ligne ou l'indentation de fichiers de l'arbre de travail, avec les fonctions de l'éditeur de la TUI et de son menu Convertir. Exactement une des options `--encoding`, `--eol` et `--indent`. Les fichiers binaires, absents ou que l'encodage cible ne peut pas représenter sont ignorés et signalés, jamais abîmés. Une seule entrée du journal pour tout le lot : `gitpoulpi undo` remet tous les fichiers"
