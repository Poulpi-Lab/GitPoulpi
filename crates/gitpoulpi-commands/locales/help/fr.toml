undo = "Annule la dernière opération journalisée (commit, amend, checkout, création/suppression de branche). Refuse, sans rien changer, si quoi que ce soit que l'opération a touché a bougé depuis. Code de sortie 2 en cas de refus, 3 quand il faut `--yes` (un undo risqué)"
"undo --all" = "Avec `--list` : inclut les entrées qui ne sont plus refaisables"
"undo --dry_run" = "Montre ce qui se passerait sans rien changer"
"undo --expect" = "N'annule que si c'est encore la dernière entrée (son id, tel que `--list` l'affiche) ; sinon refusé comme obsolète"
"undo --list" = "Liste le journal à la place (le plus récent en dernier) ; `--all` ajoute les entrées qui ne sont plus refaisables mais encore épinglées"
"undo --yes" = "Poursuit quand l'undo est risqué (le commit est déjà sur son amont, ou des fichiers de l'arbre de travail seraient écrasés). Sans cela, un tel undo ne change rien et sort avec le code 3"
worktree = "Worktrees liés : les lister, en ajouter un sur une branche ou un commit"
