"rewrite run --replace_content" = "Règle de contenu `RECHERCHE=REMPLACEMENT` : remplace un texte littéral dans chaque fichier texte (répétable ; les fichiers binaires sont ignorés et comptés). Pour des secrets, utilisez une règle `content_replace` dans la recette avec `--secrets-file`"
"rewrite run --replace_message" = "Règle de message `RECHERCHE=REMPLACEMENT` (texte littéral, répétable)"
"rewrite run --script_params" = "Un paramètre de script `NOM=VALEUR`, transmis à chaque `--script` (répétable). Les noms sont ceux que déclare l'en-tête du script"
"rewrite run --scripts" = "Règle de script : exécute ce fichier de script sur chaque commit (répétable, dans l'ordre, après les règles des autres options). Le fichier est lu ici puis intégré à la recette ; voir `rewrite script check` pour le format. Un fichier `.lua` s'exécute dans le Lua intégré et isolé ; un script shell, Python ou Lua externe n'est pas isolé et demande confiance (`--trust`, ou `rewrite script trust FILE` avant)"
"rewrite run --secrets_file" = "Un fichier contenant un secret par ligne (lignes vides ignorées). Les secrets sont ajoutés aux règles `content_replace` de la recette qui cherchent des secrets : ils ne passent donc jamais par la ligne de commande, une recette enregistrée ou un journal"
"rewrite run --set_email" = "Règle d'identité : l'e-mail à appliquer"
"rewrite run --set_name" = "Règle d'identité : le nom à appliquer (avec `--set-email`, au moins l'un des deux)"
"rewrite run --shift_dates" = "Règle de date : décale chaque date de ce nombre de secondes (négatif : vers le passé), en gardant le fuseau horaire propre à chaque commit"
"rewrite run --signatures" = "Que faire des signatures des commits réécrits : `strip`, `resign-signed` ou `resign-all`. Obligatoire quand des commits signés changent"
"rewrite run --since" = "Avec la branche courante : seulement les commits après cette révision"
"rewrite run --who" = "Règle d'identité : `author`, `committer` ou `both` (par défaut)"
"rewrite run --yes" = "Confirme le déplacement de refs déjà poussées"
"rewrite scan-secrets" = "Cherche des secrets dans l'historique : préfixes de jetons connus (GitHub, GitLab, Slack, AWS, Stripe, npm, Google, OpenAI, Anthropic), blocs de clé privée, JWT, mots de passe dans des URL et lignes `password = valeur` qui semblent aléatoires. Affiche pour chaque résultat la règle, le fichier, le premier et le dernier commit, les compteurs et un aperçu MASQUÉ (`ghp_****abcd`) ; la valeur n'est jamais affichée, journalisée ni stockée. Non exhaustif. Un secret qui a été poussé est compromis : renouvelez-le d'abord. Lecture seule"
"rewrite scan-secrets --all_local" = "Analyse toutes les branches et tous les tags locaux au lieu de la branche courante"
"rewrite scan-secrets --refs" = "Analyse seulement ces branches ou tags locaux (répétable)"
"rewrite scan-secrets --since" = "Avec la branche courante : seulement les commits après cette révision"
"rewrite script" = "Scripts pour réécrire l'historique : en vérifier un, l'essayer sur quelques commits, ou approuver un script externe. Le Lua intégré est isolé ; les scripts shell, Python et Lua externe ne le sont pas (voir `rewrite.external_scripts`). Pour en exécuter un pour de bon : `rewrite preview --script FILE`"
"rewrite script check" = "Compile un script Lua et affiche son en-tête (nom, plage, paramètres), les fonctions qu'il définit et chaque problème. Code de sortie 2 s'il a des problèmes. Lecture seule ; rien ne s'exécute sur un commit"
"rewrite script check --file" = "Le fichier du script"
"rewrite script check --params" = "Un paramètre `NOM=VALEUR` (répétable), vérifié par rapport à l'en-tête"
"rewrite script test" = "Exécute un script sur quelques commits et affiche ce qu'il modifierait et ce qu'il a journalisé, dans l'ordre de l'historique, l'état passant d'un commit au suivant. Lecture seule : rien n'est écrit. Code de sortie 2 si le script échoue (la réponse indique le commit et la raison)"
"rewrite script test --commits" = "Un commit sur lequel l'exécuter (répétable ; une révision ou un identifiant)"
"rewrite script test --file" = "Le fichier du script"
"rewrite script test --params" = "Un paramètre `NOM=VALEUR` (répétable)"
"rewrite preview --script_language" = "Le langage de chaque `--script` : `lua` (intégré, isolé), `shell`, `python` ou `lua-external`. Par défaut : selon l'extension du fichier (`.lua` ; `.sh`, `.bash`, `.ps1` ; `.py`), sinon `lua`. Python et Lua externe doivent être activés dans `rewrite.external_scripts`"
"rewrite preview --trust" = "Faire confiance aux scripts externes (shell, Python, Lua externe) de cette recette, d'après leur contenu : mémorisé pour ce dépôt, et redemandé si un script change. Une décision de personne : le serveur MCP la refuse, et un agent ne peut exécuter que des scripts approuvés par une personne"
"rewrite run --script_language" = "Le langage de chaque `--script` : `lua` (intégré, isolé), `shell`, `python` ou `lua-external`. Par défaut : selon l'extension du fichier (`.lua` ; `.sh`, `.bash`, `.ps1` ; `.py`), sinon `lua`. Python et Lua externe doivent être activés dans `rewrite.external_scripts`"
"rewrite run --trust" = "Faire confiance aux scripts externes (shell, Python, Lua externe) de cette recette, d'après leur contenu : mémorisé pour ce dépôt, et redemandé si un script change. Une décision de personne : le serveur MCP la refuse, et un agent ne peut exécuter que des scripts approuvés par une personne"
"rewrite script check --language" = "`lua`, `shell`, `python` ou `lua-external` ; par défaut selon l'extension"
"rewrite script check --trust" = "Approuver d'abord ce script (une décision de personne, refusée via MCP)"
"rewrite script check#long" = """
Compile un script et affiche son en-tête (nom, plage, paramètres), les fonctions qu'il définit et chaque problème. Code de sortie 2 s'il a des problèmes. Lecture seule ; rien ne s'exécute sur un commit.

Pour un script shell, Python ou Lua externe (non isolé), indique aussi si l'interpréteur a été trouvé et si le script est approuvé, et, pour un script approuvé, fait un essai à blanc : il le lance une fois avec un commit fictif (`"dry_run": true`) et vérifie la réponse. Un script non approuvé n'est jamais lancé."""
"rewrite script test --language" = "`lua`, `shell`, `python` ou `lua-external` ; par défaut selon l'extension"
"rewrite script test --trust" = "Approuver d'abord ce script (une décision de personne, refusée via MCP)"
"rewrite script trust" = "Faire confiance à un script externe (shell, Python, Lua externe) d'après son contenu : le SHA-256 du fichier est mémorisé pour ce dépôt, le script peut donc s'exécuter (aperçu, run, test) ; un fichier modifié redemande. Ces scripts ne sont pas isolés : ils s'exécutent avec vos droits, lisez donc le fichier d'abord. Seule une personne peut le faire : il n'y a pas d'outil MCP pour cela"
"rewrite script trust --file" = "Le fichier du script"
"rewrite tools" = "Les outils dont les fonctions de réécriture ont besoin (gpg / ssh-keygen / gpgsm pour re-signer, interpréteurs de scripts, git-lfs) et si chacun est trouvé. Lecture seule"
"rewrite tools --fresh" = "Sonde de nouveau au lieu de répondre depuis le cache d'une minute"
"mailmap" = "Le `.mailmap` : un seul nom et une seule adresse pour les personnes qui ont commité sous plusieurs identités. Le journal, le blame et l'historique d'un fichier affichent les noms associés (`log.use_mailmap`) sans toucher à un commit. `list` compte les identités de l'historique et montre lesquelles sont associées, `check` montre comment des identités sont résolues, `add` fusionne des identités en une seule en ajoutant des lignes au `.mailmap` (modifié, pas commité ; annulable)"
"mailmap add" = "Fusionne des identités en une identité canonique en ajoutant des lignes au `.mailmap` (créé s'il manque ; une ligne déjà présente n'est pas répétée). Le fichier est modifié, pas commité : commitez-le vous-même. Une seule entrée annulable (`gitpoulpi undo` remet l'ancien fichier). Le journal affiche tout de suite l'identité canonique (`log.use_mailmap`) ; les commits enregistrés ne changent pas, donc aucun push forcé n'est nécessaire. Pour réécrire les commits eux-mêmes, utilisez une règle `mailmap` dans `rewrite`"
"mailmap add --canonical" = "L'identité à conserver, `Nom <email>`"
"mailmap add --file" = "Le `.mailmap` à écrire, relatif à la racine du dépôt (par défaut : le `.mailmap` de la racine)"
"mailmap add --from" = "Une identité à associer à celle-ci, `Nom <email>` (répétable, au moins une)"
"mailmap check" = "Montre comment des identités (`Nom <email>`, ou `<email>`) apparaissent à travers le `.mailmap` du dépôt : le nom et l'adresse canoniques, ou la même identité si rien ne l'associe. Lecture seule"
"mailmap check --identities" = "Les identités à résoudre, chacune `Nom <email>` ou `<email>`"
"mailmap list" = "Liste chaque nom et adresse qui a écrit ou commité un commit du périmètre, avec le nombre de commits comme auteur et comme committer, les plus fréquents d'abord, et l'identité à laquelle le `.mailmap` l'associe déjà (`mapped_to`). Lecture seule"
"mailmap list --all_local" = "Toutes les branches et étiquettes locales au lieu de la branche courante"
"mailmap list --mapped" = "Seulement les identités que le `.mailmap` associe déjà"
"mailmap list --refs" = "Seulement ces branches ou étiquettes locales (répétable)"
"mailmap list --unmapped" = "Seulement les identités que le `.mailmap` n'associe pas"
"rewrite preview --mailmap" = "Règle mailmap : réécrit les auteurs et committers selon le `.mailmap` de l'arbre de travail (l'historique affiche ensuite ce que montre `git log --use-mailmap`). `--who` choisit auteur, committer ou les deux. Pour corriger l'affichage sans réécrire, utilisez plutôt `mailmap add`"
"rewrite preview --mailmap_file" = "Avec `--mailmap` : applique ce fichier plutôt que le `.mailmap` de l'arbre de travail (relatif à la racine du dépôt, ou absolu)"
"rewrite run --mailmap" = "Règle mailmap : réécrit les auteurs et committers selon le `.mailmap` de l'arbre de travail (l'historique affiche ensuite ce que montre `git log --use-mailmap`). `--who` choisit auteur, committer ou les deux. Pour corriger l'affichage sans réécrire, utilisez plutôt `mailmap add`"
"rewrite run --mailmap_file" = "Avec `--mailmap` : applique ce fichier plutôt que le `.mailmap` de l'arbre de travail (relatif à la racine du dépôt, ou absolu)"
"rewrite analyze" = "Analyse de taille de l'historique, comme `filter-repo --analyze` : les plus gros blobs avec leur chemin, leur taille, leur premier et dernier commit et s'ils sont encore dans HEAD, les dossiers les plus lourds, les fichiers supprimés de HEAD que l'historique conserve, et les totaux avec ce que libérerait le retrait de la part qui ne vit que dans l'historique (une estimation : après une purge et un gc seulement). Retirez ce qu'elle montre avec `rewrite preview --remove-paths CHEMIN` ou `--remove-blobs-over OCTETS`. Lecture seule"
"rewrite analyze --all_local" = "Analyse toutes les branches locales et tous les tags au lieu de la branche courante"
"rewrite analyze --refs" = "Analyse seulement ces branches locales ou ces tags (répétable)"
"rewrite analyze --since" = "Avec la branche courante : seulement les commits après cette révision"
"rewrite analyze --top" = "Nombre de lignes gardées dans chaque liste (50 par défaut, 5000 au plus)"
"rewrite check-signing" = "Signe une fois une donnée factice avec la configuration de signature du dépôt (`gpg.format`, `user.signingkey`, `gpg.*.program`) puis la vérifie : le test avant une exécution qui re-signe (`--signatures resign-signed` ou `resign-all`). Affiche le programme, s'il fonctionne et le temps d'une signature (à multiplier par le nombre de commits à re-signer pour l'estimation). Peut ouvrir une demande de phrase secrète. Sort avec le code 2 s'il ne fonctionne pas, en donnant la raison (`tool_missing` ou `signing_failed`)"
"rewrite preview --remove_signatures" = "Règle de signature : retire la signature de chaque commit du périmètre, même quand rien d'autre ne change. Ces commits n'ont pas besoin de réponse à `--signatures`"
"rewrite preview --fix_message_encoding" = "Règle de message : réencode les messages de commit en UTF-8. Un message avec un en-tête `encoding` (ISO-8859-1, Shift_JIS...) est décodé et l'en-tête disparaît ; l'UTF-8 lu autrefois comme du Latin-1 ou du Windows-1252 (« RÃ©Ã©criture ») n'est réparé que si l'aller-retour est exact. Ce qui ne peut pas être décidé reste tel quel et est compté (`encoding_left`)"
"rewrite preview --fix_name_encoding" = "Avec `--fix-message-encoding` : répare aussi les noms d'auteur et de committer abîmés (les noms d'un commit dont l'en-tête disparaît sont toujours décodés avec lui)"
"rewrite run --remove_signatures" = "Règle de signature : retire la signature de chaque commit du périmètre, même quand rien d'autre ne change. Ces commits n'ont pas besoin de réponse à `--signatures`"
"rewrite run --fix_message_encoding" = "Règle de message : réencode les messages de commit en UTF-8. Un message avec un en-tête `encoding` (ISO-8859-1, Shift_JIS...) est décodé et l'en-tête disparaît ; l'UTF-8 lu autrefois comme du Latin-1 ou du Windows-1252 (« RÃ©Ã©criture ») n'est réparé que si l'aller-retour est exact. Ce qui ne peut pas être décidé reste tel quel et est compté (`encoding_left`)"
"rewrite run --fix_name_encoding" = "Avec `--fix-message-encoding` : répare aussi les noms d'auteur et de committer abîmés (les noms d'un commit dont l'en-tête disparaît sont toujours décodés avec lui)"
"rewrite preview --map_trailers" = "Avec une règle d'identité : applique aussi la règle aux trailers d'identité (`Nom <e-mail>` dans `Signed-off-by`, `Co-authored-by`...) qui correspondent, pas seulement à l'auteur et au committer"
"rewrite preview --trailer_add" = "Règle de trailer `CLÉ=VALEUR` : ajoute ce trailer à chaque message (répétable ; un message qui a déjà exactement ce trailer est laissé tel quel)"
"rewrite preview --trailer_map" = "Règle de trailer `CLÉ:ANCIEN=NOUVEAU` : remplace un texte littéral dans les valeurs des trailers de cette clé, par exemple `Signed-off-by:@old.org=@new.org` (répétable)"
"rewrite preview --trailer_remove" = "Règle de trailer : retire tous les trailers de cette clé (répétable)"
"rewrite preview --update_message_hashes" = "Remplace les identifiants de commit abrégés (7 caractères hexadécimaux ou plus) dans les messages par les nouveaux identifiants ; les ambigus ou inconnus sont laissés et comptés"
"rewrite run --map_trailers" = "Avec une règle d'identité : applique aussi la règle aux trailers d'identité (`Nom <e-mail>` dans `Signed-off-by`, `Co-authored-by`...) qui correspondent, pas seulement à l'auteur et au committer"
"rewrite run --trailer_add" = "Règle de trailer `CLÉ=VALEUR` : ajoute ce trailer à chaque message (répétable ; un message qui a déjà exactement ce trailer est laissé tel quel)"
"rewrite run --trailer_map" = "Règle de trailer `CLÉ:ANCIEN=NOUVEAU` : remplace un texte littéral dans les valeurs des trailers de cette clé, par exemple `Signed-off-by:@old.org=@new.org` (répétable)"
"rewrite run --trailer_remove" = "Règle de trailer : retire tous les trailers de cette clé (répétable)"
"rewrite run --update_message_hashes" = "Remplace les identifiants de commit abrégés (7 caractères hexadécimaux ou plus) dans les messages par les nouveaux identifiants ; les ambigus ou inconnus sont laissés et comptés"
"ai trust" = "Lie la clé d'API d'un profil à l'adresse pour laquelle elle a été enregistrée : montre ce qui est approuvé, ou accepte l'adresse actuelle du profil (après un changement de son URL de base), le certificat d'un serveur auto-hébergé, ou http simple. Seule une personne le lance (ce n'est pas un outil d'agent)"
"ai trust --accept_certificate" = "Accepte le certificat portant cette empreinte de clé (SHA-256, hexadécimal)"
"ai trust --accept_origin" = "Accepte l'URL de base actuelle du profil (écrite exactement comme le refus l'a affichée)"
"ai trust --allow_insecure_http" = "Autorise une URL de base `http://` simple qui n'est pas sur cette machine"
"ai trust --profile" = "L'identifiant du profil d'IA"
"hosting integrations trust" = "Relit le contrôle de sécurité d'un profil et accepte ce qu'il a bloqué : une nouvelle adresse, un autre compte, un nouveau certificat, http simple. Seule une personne le lance (ce n'est pas un outil d'agent). Sans option, affiche ce qui est approuvé et ce qui est bloqué"
"hosting integrations trust --accept_account" = "Accepte cet identifiant de compte comme propriétaire du jeton"
"hosting integrations trust --accept_certificate" = "Accepte le certificat portant cette empreinte de clé (SHA-256, hexadécimal), exactement comme le refus l'a affichée"
"hosting integrations trust --accept_origin" = "Accepte l'adresse actuelle du profil (elle doit être écrite exactement comme le refus l'a affichée)"
"hosting integrations trust --allow_insecure_http" = "Autorise une adresse `http://` simple qui n'est pas sur cette machine"
"hosting integrations trust --id" = "Le profil"
"hosting integrations trust --strict_tls" = "Tient le certificat épinglé strictement : la clé doit correspondre même quand le certificat remonte à une racine publique"
repo-auth = "Which identity this repository authenticates with (HTTPS and SSH): the machine's own, a GitPoulpi account, or a key file. `show` and `test` read; `set` and `clear` are a person's decision"
"repo-auth clear" = "Forget the profile: the repository goes back to the machine's own identity. Only a person can: an agent is refused"
"repo-auth set" = "Choose the identity this repository authenticates with, per protocol: `--https` for HTTPS remotes, `--ssh` for SSH remotes. The profile is kept in GitPoulpi's private directory, never in the repository. Only a person can set it: an agent is refused (exit code 2)"
"repo-auth set --cache_minutes" = "With `token-command`: how long its token is reused, in minutes"
"repo-auth set --command" = "With `--https token-command`: the command and its arguments (the first word is the program). Write `--command` last, or put `--` before words that start with a dash"
"repo-auth set --helper" = "With `--https helper`: the credential helper command. A person confirms it, with its hash (or passes `--yes`)"
"repo-auth set --hosts" = "With `helper` or `token-command`: the hosts it may serve (comma-separated or repeated)"
"repo-auth set --https" = "HTTPS identity: `system` (git's own helpers), `integration:<id>` (a GitPoulpi account's token), `helper` (one credential helper, with `--helper`) or `token-command` (a command that prints a token, with `--command` and `--hosts`)"
"repo-auth set --ignore_repo_helpers" = "With `--https system`: drop the credential helpers this repository sets itself and keep the system and global ones"
"repo-auth set --known_hosts" = "With `--ssh key:` or `integration-key:`: the `known_hosts` file"
"repo-auth set --ssh" = "SSH identity: `system` (ssh's own configuration and agent), `key:<path>` (a private key file, offered alone) or `integration-key:<id>` (the key of a GitPoulpi account)"
"repo-auth set --strict" = "With `--ssh key:` or `integration-key:`: refuse unknown host keys (`StrictHostKeyChecking=yes`)"
"repo-auth set --username" = "A user name: with `system`, `credential.username` (lets a credential manager pick one of several accounts); with `integration:<id>`, the user name sent with the token"
"repo-auth set --yes" = "Confirm a helper or token command without the interactive question (the command and its hash are still printed)"
"repo-auth show" = "Show which identity this repository authenticates with: the stored profile, the identity each remote will use, the settings the profile overrides and any warning. Never prints a secret; a helper or token command is printed only to a person (an agent gets `{set, sha256}`)"
"repo-auth test" = "Test the connection of each remote (or one) with the profile applied, without changing anything: lists the remote's branches, or with `--push` asks whether a push would be accepted. Answers the report of each remote plus the identity it used. Reaches the network"
"repo-auth test --push" = "Also check that a push would be accepted"
"repo-auth test --remote" = "Only this remote (default: every remote)"
