ai = "Assistants IA (désactivés sauf si `ai.enabled = true`) : afficher un message de commit généré, ou expliquer un commit ou les modifications en cours"
"ai --print_sent" = "Affiche ce qui serait envoyé au modèle (le texte système et utilisateur, une fois les secrets masqués et les fichiers sensibles exclus) sans rien envoyer. Nécessite `ai.enabled = true`, mais ni clé ni réseau"
"ai --send_all" = "Envoie chaque entrée en entier, même au-delà de sa limite `ai.limits.*`. Sans cette option, une entrée qui dépasse une limite est tronquée (un conflit est refusé) et la réponse indique ce qui a été coupé dans `truncated: [{part, detail?, bytes, limit, setting}]`"
"commit --send_all" = "Avec `--ai` : envoie tout le diff même au-delà de `ai.limits.diff_bytes`. Sans cette option, un diff plus gros est tronqué et la réponse le signale (`truncated`)"
"hosting review suggest --send_all" = "Envoie chaque entrée en entier, même au-delà de sa limite `ai.limits.*` (le diff, le diff d'un fichier, la description, les commentaires existants, les fichiers de contexte). Sans cette option, une entrée qui dépasse une limite est tronquée et la réponse indique ce qui a été coupé dans `truncated`"
"stash push --send_all" = "Avec `--ai` : envoie tout le diff même au-delà de `ai.limits.diff_bytes`. Sans cette option, un diff plus gros est tronqué et la réponse le signale (`truncated`)"
"ai commit-message" = "Affiche le message de commit que l'IA propose pour les modifications indexées (ou pour toutes les modifications si rien n'est indexé). Ne commite rien"
"ai explain" = "Explique un commit (HEAD par défaut) ou, avec --wip, les modifications en cours"
"ai resolve-conflict" = "Affiche la résolution que l'IA suggère pour UN conflit de fusion d'un fichier en conflit (`--conflict N`, à partir de 1 ; facultatif quand le fichier n'a qu'un seul conflit). Affiche seulement : rien n'est écrit ni indexé, c'est à l'appelant de décider (`conflicts resolve --content-file` applique un résultat pour tout le fichier). Nécessite `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Quel conflit du fichier, à partir de 1"
"ai resolve-conflict --path" = "Le fichier en conflit, relatif à la racine du dépôt"
autostash = "L'auto-stash en attente : GitPoulpi a mis des modifications locales de côté pour lancer un checkout, merge, rebase ou pull et ne les a pas remises"
"ai review-context" = "Affiche ou définit ce que reçoit un brouillon de revue de code ✦ en plus du diff (`[ai.review]`) : les fichiers CLAUDE.md et AGENTS.md du dépôt, un fichier de plus (un chemin ou un lien) et si un agent local travaille dans le dépôt. Sans `--repo` ni `--project`, c'est la valeur globale par défaut ; `--repo CHEMIN` est la valeur propre à un dépôt cloné, `--project HÉBERGEUR/PROJET` celle d'un dépôt qui n'est pas cloné. Sans option de réglage, affiche les valeurs (`effective` est ce que reçoit une revue) ; avec une option, l'enregistre et affiche le résultat. Ne nécessite aucun modèle et fonctionne avec l'IA désactivée"
"ai review-context --agents_md" = "Donne au modèle le fichier AGENTS.md du dépôt"
"ai review-context --claude_md" = "Donne au modèle le fichier CLAUDE.md du dépôt"
"ai review-context --context_file" = "Un fichier de plus : un chemin relatif à la racine du dépôt, un chemin absolu ou un lien vers un fichier d'un hébergeur"
"ai review-context --no_context_file" = "Aucun fichier supplémentaire"
"ai review-context --no_extra_file" = "Aucun fichier supplémentaire pour le dépôt ou le projet, quelle que soit la valeur globale (`on`, par défaut quand l'option est seule) ; `off` lui fait suivre de nouveau la valeur globale"
"ai review-context --project" = "Un dépôt qui n'est pas cloné, sous la forme `HÉBERGEUR/PROJET` (`github.com/owner/name`)"
"ai review-context --reset" = "Avec `--repo` ou `--project` : oublie les valeurs propres au dépôt (il suit de nouveau les globales) avant d'appliquer les options"
"ai review-context --run_in_repo" = "Agent local : dans le dépôt (`yes`), hors du dépôt (`no`) ou selon le dossier de travail de son profil IA (`profile`). Sans effet avec `--project`"
"autostash start-over" = "Repartir de zéro : abandonne les modifications de l'arbre de travail sur les fichiers du stash (une copie est gardée sous `refs/gitpoulpi-backup/`), annule l'opération qui a lancé l'auto-stash (pull, checkout, merge, rebase), puis fait un pop du stash sur le commit d'origine. S'arrête avec le stash intact si une étape échoue. Code de sortie 1 en cas de refus, 3 quand il faut `--yes`"
"autostash start-over --dry_run" = "Montre ce qui se passerait sans rien changer"
"autostash start-over --yes" = "Poursuit ; sans cela rien ne change et le code de sortie est 3"
blame = "Attribution ligne par ligne d'un fichier à une révision"
"blame --at" = "Révision à analyser (par défaut : HEAD)"
"branch delete-remote" = "Supprime une branche d'un dépôt distant, en conservant toute branche locale du même nom"
"branch fast-forward" = "Avance `<branch>` jusqu'à `<target>`, seulement si c'est un fast-forward (un historique divergent est refusé, rien ne bouge). La branche extraite entraîne son arbre de travail, comme `git merge --ff-only` ; toute autre branche voit simplement sa référence déplacée"
"branch fast-forward --target" = "Toute révision (par défaut : HEAD)"
"branch set-upstream" = "Fait suivre `<upstream>` (`origin/main`) à `<branch>`"
"branch track" = "Crée une branche locale suivant une branche de suivi distante et l'extrait. `<upstream>` s'écrit comme la liste des références l'écrit (`origin/feature/login`) ; `--name` vaut par défaut la partie branche"
"branch unset-upstream" = "Retire l'amont de `<branch>`"
"checkout --autostash" = "Met de côté les modifications locales qui bloquent l'opération, l'exécute, puis restaure la mise de côté (ce que fait `general.auto_stash = \"always\"`)"
"cherry-pick --commits" = "Commits à appliquer, dans l'ordre. Omis quand `--plan` est donné"
"cherry-pick --plan" = "Un `Vec<RebaseStep>` JSON (même forme que `rebase --plan` ; voir `rebase-plan`), depuis un chemin de fichier ou `-` pour l'entrée standard : les étapes sont cherry-pickées dans l'ordre de la liste. Seules les actions `Pick` et `Drop` ont un sens ici (`Drop` ignore le commit) ; toute autre action est refusée. Ne peut pas être combiné avec des commits positionnels"
"clone --branch" = "Extrait cette branche au lieu du HEAD par défaut du dépôt distant"
"clone --depth" = "Tronque l'historique à ce nombre de commits (`git clone --depth`)"
"clone --no_lfs" = "Laisse les fichiers Git LFS sous forme de pointeurs au lieu de télécharger leur contenu après le clonage"
"clone --origin" = "Nomme le nouveau dépôt distant autrement que `origin`"
"clone --recurse_submodules" = "Clone aussi les sous-modules"
"commit --ai" = "Laisse l'IA écrire le message à partir du diff indexé, en suivant les instructions de message de commit du dépôt (Paramètres > IA). Nécessite `ai.enabled = true` et un profil configuré"
"commit --message" = "Le message de commit. Obligatoire sauf si --ai l'écrit"
"commit --no_verify" = "Ignore les hooks de commit (`pre-commit`, `commit-msg`), comme `commit --no-verify`"
completions = "Affiche sur la sortie standard un script de complétion pour le shell (bash, zsh, fish, powershell ou elvish), p. ex. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Abandonne l'opération en cours : HEAD, l'index et l'arbre de travail reviennent à l'état d'avant. Jette les résolutions faites depuis"
"conflicts skip" = "Saute le cherry-pick ou le revert en cours (ou le commit sur lequel un rebase est arrêté) : HEAD, l'index et l'arbre de travail reviennent à HEAD. La sortie quand il est devenu vide (la modification est déjà appliquée). Un merge n'a rien à sauter"
"conflicts check" = "Un merge de HEAD dans la branche d'où elle est partie provoquerait-il des conflits, et sur quels fichiers ? Rien n'est modifié (merge en mémoire). La base est la cible de la pull request connue de la branche, sinon la branche autorisée par les motifs de branches de base qui a le moins de commits depuis la bifurcation. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Désactivé quand `general.conflict_detection` ou le réglage du dépôt est désactivé"
"conflicts list" = "Les fichiers en conflit, chacun avec le texte de ses trois côtés. Avec `--names-only` : seulement le chemin, le type de conflit et les oids des étapes (aucun blob n'est lu ; peu coûteux sur une grosse fusion)"
"conflicts resolve" = "Résout un fichier et l'indexe (le fichier n'est plus en conflit). Exactement un parmi `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` ou `--delete`. A et \"ours\" sont le côté courant (`HEAD` ; pendant un rebase, la branche sur laquelle on rebase), B et \"theirs\" le côté entrant. N'éditez jamais les marqueurs de conflit à la main : choisissez, ou écrivez le texte final dans un fichier"
"conflicts resolve --both" = "Garde les deux côtés de chaque conflit (A puis B), et la fusion propre à git partout ailleurs"
"conflicts resolve --content_file" = "Le texte final du fichier, tel quel (`-` lit l'entrée standard)"
"conflicts resolve --delete" = "Accepte la suppression : retire le fichier (`git rm`)"
"conflicts resolve --encoding" = "Avec `--content-file` : écrit le texte dans cet encodage (un libellé WHATWG comme `windows-1252`) au lieu d'UTF-8"
"conflicts resolve --expect" = "Les oids d'étapes sur lesquels la décision a été prise, `base,ours,theirs` (utilisez `-` pour une étape absente). L'appel est refusé comme `stale` quand l'index ne contient plus exactement ceux-ci. `--both` et `--pick` vérifient toujours les étapes qu'ils lisent"
"conflicts resolve --no_stage" = "Écrit le fichier de l'arbre de travail mais le laisse en conflit (une simple sauvegarde)"
"conflicts resolve --ours" = "Équivaut à `--side ours`"
"conflicts resolve --pick" = "Un choix par numéro de conflit : `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = les deux dans cet ordre). Chaque conflit en demande un, sauf si `--default` couvre le reste"
"conflicts resolve --pick_default" = "Avec `--pick` : le choix pour chaque conflit non listé"
"conflicts resolve --side" = "Prend tout le fichier depuis une seule étape, sans fusion automatique"
"conflicts resolve --theirs" = "Équivaut à `--side theirs`"
"conflicts resolve --theirs_first" = "Avec `--both` : B puis A"
"conflicts show" = "Un fichier en conflit tel que le voit l'éditeur de fusion : les libellés des panneaux, les trois côtés et les régions de conflit numérotées (`--json` donne le document complet). Les régions fusionnées que git a réglées seul ne sont pas listées ; elles restent dans le résultat de `resolve --both`/`--pick`"
"conflicts show --conflict" = "Seulement le conflit N (à partir de 1)"
"conflicts state" = "La fusion, le rebase, le cherry-pick ou le revert en cours (`null` s'il n'y en a pas)"
"conflicts unresolve" = "Remet en conflit un fichier résolu pendant cette opération (les marqueurs reviennent). Refusé quand il est encore en conflit ou n'a pas été résolu pendant l'opération"
daemon = "`gitpoulpi server ...` est un alias visible - le propriétaire appelle ce groupe « le serveur » et tape `gp server stop`"
"daemon restart" = "`daemon stop` suivi de `daemon start`"
"daemon run" = "Exécute le démon de cette session au premier plan (bloquant ; Ctrl-C pour l'arrêter, ou un `daemon stop`/`daemon restart` envoyé d'ailleurs). C'est ce que `daemon start` lance en détaché, et ce qu'un terminal dédié peut aussi exécuter directement"
"daemon start" = "Démarre le démon de cette session comme processus d'arrière-plan détaché (ou indique qu'il tourne déjà). `--backend` impose le backend que le processus lancé doit utiliser ; omis, le processus lancé résout lui-même `general.default_backend`"
"daemon status" = "Indique si le démon de cette session écoute et, le cas échéant, son port, son PID, sa durée de fonctionnement, son backend et sa version"
"daemon stop" = "Demande au démon de cette session de s'arrêter proprement, en tuant son PID enregistré seulement s'il ne répond pas à temps et seulement s'il s'agit d'un démon autonome (jamais un démon intégré à un TUI en cours)"
"daemon stop --all" = "Arrête le démon de toutes les sessions dont `session list` signale un fichier de port, pas seulement celle-ci"
discard = "Abandonne les modifications *non indexées* d'un fichier dans l'arbre de travail : un hunk (`--hunk`), certaines de ses lignes (`--hunk --lines`), ou - avec `--file` seul - toutes les modifications non commitées du fichier, y compris les indexées (un fichier non suivi est supprimé). Hunks et lignes sont numérotés comme `gitpoulpi diff --json` numérote le diff non indexé. Tout ce qui est abandonné est conservé dans un instantané de sécurité, donc `gitpoulpi undo` le restaure (fichiers non suivis inclus). Sans confirmation : c'est la surface de scripting"
"discard --lines" = "Indices de lignes séparés par des virgules dans `--hunk`"
"fetch --all" = "Récupère tous les dépôts distants configurés"
"fetch --prune" = "Supprime les branches de suivi distantes que le dépôt distant n'a plus"
"fetch --prune_tags" = "Supprime aussi les tags locaux que le distant a supprimés (seulement ceux qui y étaient : un tag jamais envoyé est conservé). Équivalent resserré de `fetch.pruneTags` ; désactivé par défaut"
"fetch --remote" = "Omis : le dépôt distant par défaut du dépôt (voir `remote default`)"
gitpoulpi = "Client Git TUI léger et multiplateforme, pilotable via CLI/MCP."
"gitpoulpi --add" = "Ouvre un dossier dans un nouvel onglet du GitPoulpi déjà lancé, au lieu d'en démarrer un autre (`gp -a`, `gp --add ../autre`). PATH vaut par défaut le dossier courant et se résout en son dépôt englobant. Une seule session lancée : elle reçoit l'onglet et sa fenêtre passe au premier plan si le bureau le permet. Plusieurs : vous en choisissez une dans une liste numérotée (ou passez `--session NOM`). Aucune : GitPoulpi démarre normalement, sur ce dossier. N'accepte aucune sous-commande ; avec `--json` il affiche un objet (`action` vaut `joined` ou `cancelled`), code de sortie 0 quand l'onglet est ouvert, 3 quand une fenêtre occupée l'a proposé dans la pastille de sa ligne d'état"
"gitpoulpi --no_raise" = "Avec `--add` : ne demande pas à la fenêtre de passer son terminal au premier plan"
"gitpoulpi --backend" = "Quel `GitBackend` le démon de cette commande utilise, en remplaçant `general.default_backend` de config.toml et `GITPOULPI_GENERAL_DEFAULT_BACKEND` (les options sont au sommet de l'échelle de priorité - voir docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
Quel `GitBackend` le démon de cette commande utilise, en remplaçant `general.default_backend` de config.toml et `GITPOULPI_GENERAL_DEFAULT_BACKEND` (les options sont au sommet de l'échelle de priorité - voir docs/user/config-reference.md).

Cela choisit le backend d'un démon que cette commande *démarre*. Une session dont le démon tourne déjà garde le backend avec lequel ce démon a été construit ; `gitpoulpi` ne peut pas changer à chaud le backend d'un démon sous les clients déjà abonnés, et prétendre le contraire serait le même non-effet silencieux que cette option existe pour éviter."""
"gitpoulpi --cwd_file" = """Fichier dans lequel le TUI écrit le dossier de l'onglet actif en quittant (« Quit and cd here », ou toujours avec `ui.tab_dir_follow = "auto"`). Destiné au wrapper qu'imprime `gitpoulpi shell-init` ; ignoré par toutes les sous-commandes, puisque seul le TUI a des onglets"""
"gitpoulpi --json" = "Émet du JSON structuré au lieu d'une sortie lisible"
"gitpoulpi --lang" = "Langue du texte de `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
Langue du texte de `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Seules les explications sont traduites - les noms de commandes et d'options ne changent jamais - et `--help` reste en anglais sauf si ceci est donné (l'environnement est volontairement ignoré, pour que les scripts aient une sortie stable). Exemple : `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Dépôt sur lequel agir. Par défaut, le dépôt qui contient le répertoire courant, si bien que `gitpoulpi status` se comporte comme `git status` ; un agent qui pilote plusieurs dépôts passe ceci plutôt que de changer de répertoire"
"gitpoulpi --session" = "Session nommée à cibler. Omise, elle est dérivée de la racine du dépôt courant (voir `gitpoulpi_config::default_session_name`), si bien que deux dépôts ont deux démons indépendants tandis que tout ce qui est ouvert dans un même dépôt en partage un. Passez ceci pour forcer deux dépôts sur une même session, ou pour nommer une session explicitement. La valeur est assainie avant usage - elle devient un nom de fichier"
"hosting checkout-pr" = "Extrait une pull/merge request, y compris depuis un fork : récupère son head (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) dans la branche locale `pr/<n>` (`mr/<n>` sur GitLab), la suit, et bascule dessus"
"hosting checkout-pr --id" = "Quelle intégration (voir `hosting prs`)"
"hosting checkout-pr --no_checkout" = "Récupère seulement et crée/met à jour la branche ; reste où vous êtes"
"hosting checkout-pr --number" = "Le numéro de PR (GitHub) ou l'`iid` de MR (GitLab)"
"hosting checkout-pr --remote" = "Le dépôt distant où vit la requête. Par défaut celui dont le projet a été résolu, sinon celui par défaut du dépôt"
"hosting clone" = "Clone un projet de `projects` par son chemin complet, en résolvant l'URL de clonage via l'hébergeur plutôt que de faire coller une URL à l'utilisateur"
"hosting clone --https" = "Clone en HTTPS plutôt qu'en SSH"
"hosting clone --project" = "Le chemin complet du projet, tel que l'affiche `hosting projects`"
"hosting edit-url" = "Affiche l'URL où se modifie une pull/merge request (la vue `.../edit` de GitLab ; GitHub modifie sur place, sur la page de la demande). Avec un numéro, cette demande ; sinon celle de `--branch` (par défaut : la branche extraite). Suit le lien de pull/merge request du dépôt comme `prs`. Ne lance le navigateur qu'avec `--open`"
"hosting edit-url --branch" = "Trouve la requête par sa branche source à la place"
"hosting edit-url --number" = "Le numéro de la requête (`53` pour `!53` / `#53`)"
"hosting edit-url --open" = "Ouvre aussi l'URL dans le navigateur du système"
"hosting file" = "Lit un fichier d'un projet à une révision depuis l'API de l'hébergeur, sans clone : le texte tel quel, les autres octets en base64 (`encoding`). Code de sortie 1 et une erreur si le fichier n'existe pas à cette révision"
"hosting file --id" = "Quelle intégration (voir `hosting list`) ; facultatif si une seule est configurée"
"hosting file --path" = "Le chemin dans le projet, comme `CLAUDE.md` ou `src/main.rs`"
"hosting file --project" = "Le projet : `owner/name` sur GitHub, `group/sub/project` sur GitLab"
"hosting file --rev" = "La révision : une branche, un tag ou un commit. Par défaut, la branche par défaut du projet"
"hosting integrations" = "Gère les profils d'intégration configurés (`[[integrations]]`)"
"hosting integrations add" = "Ajoute un profil de n'importe quel type disposant d'un client"
"hosting integrations add --id" = "Par défaut le nom du type (`gitlab`, `gitlab-2`, ...)"
"hosting integrations add --kind" = "`github`, `github_enterprise`, `gitlab`, `gitlab_self_managed`, `azure_devops`, `azure_devops_server`, `bitbucket`, `jira_cloud`, `jira_data_center`, `trello`, `gitea`, `forgejo`, `linear`, `youtrack`, `redmine`, `gerrit` ou `local_markdown`"
"hosting integrations add --name" = "Nom d'affichage"
"hosting integrations add --url" = "La racine web de l'instance. Obligatoire pour les types auto-hébergés et Jira"
"hosting integrations list" = "Les profils configurés, sans leurs jetons"
"hosting integrations radar" = "Affiche ou modifie les réglages Radar d'un profil (`[integrations.radar]`) : quelles listes à l'échelle du compte `hosting radar` et le Radar récupèrent, les espaces de noms à interroger et ce que fait la relecture d'une demande qui n'est pas clonée. Sans option, affiche seulement les réglages actuels"
"hosting integrations radar --assigned_issues" = "Tickets ouverts qui vous sont assignés, tous dépôts confondus"
"hosting integrations radar --clear_namespaces" = "Oublie les espaces de noms enregistrés : le vôtre et toutes vos appartenances"
"hosting integrations radar --id" = "Le profil"
"hosting integrations radar --include_drafts" = "Garde les demandes en brouillon dans les listes du compte"
"hosting integrations radar --namespaces" = "Un espace de noms (organisation, groupe) où chercher les demandes ouvertes ; répétez l'option ou séparez par des virgules. Remplace la liste enregistrée"
"hosting integrations radar --open_requests" = "Toutes les demandes ouvertes de vos espaces de noms"
"hosting integrations radar --review_mode" = "Ce que fait la relecture d'une demande qui n'est pas clonée"
"hosting integrations radar --review_requests" = "Demandes en attente de votre relecture, tous dépôts confondus"
"hosting integrations remove" = "Supprime un profil et efface son jeton stocké"
"hosting integrations test" = "Vérifie le jeton du profil auprès de son hébergeur : utilisateur, portées, expiration"
"hosting issue" = "Crée des tickets sur le projet lié au dépôt courant"
"hosting issue create" = "Ouvre un ticket sur le projet auquel la source de TICKETS du dépôt est liée (`hosting link issues`), ou celui que `--id` résout depuis le dépôt distant. Action sortante : elle publie sur l'hébergeur"
"hosting issue create --body" = "La description du ticket"
"hosting issue create --body_file" = "Lit la description depuis ce fichier (`-` lit l'entrée standard)"
"hosting issue create --id" = "Quelle intégration (voir `hosting issues`)"
"hosting issue create --labels" = "Une étiquette à appliquer ; répétez l'option ou séparez par des virgules"
"hosting issue create --title" = "Le titre du ticket"
"hosting issue create --web" = "Affiche la page de nouveau ticket préremplie de l'hébergeur au lieu d'appeler son API (aucun jeton requis)"
"hosting issues" = "Tickets du projet du dépôt courant"
"hosting issues --assigned" = "Seulement ceux qui vous sont assignés"
"hosting board --id" = "Quelle intégration (voir `hosting issues`)"
"hosting board move --column" = "Le nom de la colonne, tel que l'affiche `hosting board`"
"hosting board move --id" = "Quelle intégration (voir `hosting issues`)"
"hosting board move --reference" = "La carte : son numéro ou sa propre référence (`12`, `#12`, `ABC-12`, `AB#12`)"
"hosting board move" = "Déplace une carte vers une colonne : un changement de statut, une transition de workflow (Jira), un état d'élément de travail (Azure DevOps), une liste (Trello) ou un échange d'étiquette (GitHub, GitLab, Gitea, Forgejo). Un déplacement pour lequel le fournisseur n'a pas de chemin est refusé avec la raison. Action sortante : elle écrit sur l'hébergeur"
"hosting board show --id" = "Quelle intégration (voir `hosting issues`)"
"hosting board show" = "Les colonnes du tableau, chacune avec ses cartes. Lecture seule"
"hosting board" = "Le tableau des tickets du projet lié au dépôt courant : ses colonnes avec leurs cartes, les mêmes colonnes que le tableau du TUI (un statut, une liste ou une étiquette par colonne). Sans sous-commande, comme `board show`"
"hosting link" = "Lie la liste de pull/merge requests ou de tickets de ce dépôt à un profil de fournisseur et à l'un de ses dépôts, ou la délie (sans option, affiche le lien). Rien n'est récupéré par `prs` / `issues` tant qu'une source n'est pas liée ; c'est le même lien qu'enregistrent les sections de la barre latérale du TUI (`pulls_source` / `issues_source` dans `.gitpoulpi/repo-state.toml`)"
"hosting link --clear" = "Délie la liste : rien n'est récupéré tant qu'elle n'est pas reliée"
"hosting link --id" = "Le profil à lier. Sans `--project`, on utilise le dépôt que ses dépôts distants désignent sur l'hôte de ce profil"
"hosting link --kind" = "Quelle liste"
"hosting link --project" = "Le dépôt du fournisseur (`owner/name`, `group/sub/proj`)"
"hosting list" = "Les intégrations configurées, sans leurs jetons"
"hosting login" = "Valide un jeton et le stocke sous le `token_ref` du profil, en mémorisant à qui il appartient. Le jeton est lu sur l'entrée standard (`--token-stdin`), jamais en argument, pour qu'il reste hors de l'historique du shell. Non exposé via MCP : un secret ne doit pas passer par la transcription d'appels d'outils d'un agent"
"hosting login --id" = "Quelle intégration. Facultatif quand une seule est configurée"
"hosting login --token_stdin" = "Lit le jeton sur l'entrée standard (obligatoire ; une ligne, retour à la ligne final ignoré)"
"hosting logout" = "Efface le jeton stocké du profil et oublie l'utilisateur connecté ; le profil lui-même reste"
"hosting open" = "Affiche l'URL web d'une pull request ou d'un ticket du projet du dépôt courant. Ne lance le navigateur du système qu'avec `--browser`"
"hosting open --browser" = "Ouvre aussi l'URL dans le navigateur du système"
"hosting pr" = "Ouvre une pull request (GitHub, Gitea, Forgejo, Bitbucket, Azure DevOps) ou merge request (GitLab) depuis une branche du dépôt courant"
"hosting pr --id" = "Quelle intégration (`[[integrations]] id`). Facultatif quand une seule est configurée"
"hosting pr --source" = "La branche depuis laquelle l'ouvrir. Par défaut la branche extraite"
"hosting pr --target" = "La branche vers laquelle l'ouvrir. Par défaut la branche par défaut du dépôt distant quand on peut la connaître, sinon `main`/`master` si l'une existe"
"hosting pr --title" = "Par défaut la ligne de sujet du commit en pointe de la branche source"
"hosting pr --web" = "Affiche l'URL de comparaison/nouvelle requête au lieu d'appeler l'API de l'hébergeur. C'est aussi ce qui se passe automatiquement sans intégration configurée pour ce dépôt distant, ou sans jeton pour lui"
"hosting pr-for-branch" = "La pull/merge request qui représente le mieux une branche (ouverte, puis brouillon, puis fusionnée, puis fermée ; la plus récente d'abord)"
"hosting pr-for-branch --branch" = "Par défaut la branche extraite"
"hosting projects" = "Tous les projets que le jeton de l'intégration peut voir"
"hosting projects --filter" = "Sous-chaîne insensible à la casse dans le chemin du projet"
"hosting projects --id" = "Quelle intégration (`[[integrations]] id`). Facultatif quand une seule est configurée"
"hosting prs" = "Pull/merge requests du projet du dépôt courant"
"hosting prs --id" = "Quelle intégration. Sans elle, la source de pull/merge requests liée au dépôt est utilisée (voir `hosting link`) ; un dépôt non lié ne récupère rien. Avec elle, le projet que le dépôt distant de ce dépôt désigne sur ce profil"
"hosting prs --mine" = "Seulement celles que vous avez ouvertes"
"hosting prs --review_requested" = "Seulement celles qui attendent votre relecture"
"hosting prs --state" = "`open` (par défaut), `closed` (inclut les fusionnées) ou `all`"
"hosting radar" = "Les listes à l'échelle du compte pour le Radar : les demandes en attente de votre relecture, toutes les demandes ouvertes de vos espaces de noms et les tickets qui vous sont assignés, dans tous les dépôts de chaque profil (GitHub, GitLab, Gitea, Forgejo, Azure DevOps, Bitbucket Data Center, Gerrit), clonés ou non. Sans `--what`, les réglages `[integrations.radar]` de chaque profil décident (voir `hosting integrations radar`) ; la réponse est réutilisée pendant cinq minutes sauf avec `--refresh`. Lecture seule"
"hosting radar --ids" = "Quel profil ; répétez l'option pour plusieurs. Sans elle, tous les profils activés d'un type pris en charge"
"hosting radar --include_drafts" = "Garde aussi les demandes en brouillon"
"hosting radar --refresh" = "Interroge l'hébergeur même si une réponse récente est en cache"
"hosting radar --what" = "Quoi lister, quels que soient les réglages du profil : `review` (en attente de votre relecture), `open` (toutes les demandes ouvertes), `issues` (qui vous sont assignés) ou `all`"
"hosting review comment --project" = "Relire un projet qui n'est pas le dépôt courant (aucun clone nécessaire) : `owner/name` sur GitHub, `group/sub/project` sur GitLab. `--id` désigne alors l'intégration, si plusieurs sont configurées"
"hosting review diff" = "Le diff d'une pull/demande de fusion, fichier par fichier avec ses hunks (`files[].diff.hunks`). Dans un dépôt, récupère les refs de la demande et les compare en local ; avec `--api`, ou avec `--project` (sans dépôt), lit le diff depuis l'API de l'hébergeur, ce qui ne demande aucun clone. Un fichier dont l'hébergeur a omis le patch (trop gros) a `omitted` à vrai et aucun hunk"
"hosting review diff --api" = "Lit le diff depuis l'API de l'hébergeur, même dans un clone"
"hosting review diff --file" = "Seulement le diff de ce fichier"
"hosting review diff --id" = "Quelle intégration (voir `hosting prs`)"
"hosting review diff --number" = "Le numéro de la PR (GitHub) ou l'`iid` de la MR (GitLab)"
"hosting review diff --project" = "Relire un projet qui n'est pas le dépôt courant (aucun clone nécessaire) : `owner/name` sur GitHub, `group/sub/project` sur GitLab. `--id` désigne alors l'intégration, si plusieurs sont configurées"
"hosting review diff --remote" = "Le distant où se trouve la demande (diff local uniquement). Par défaut, celui d'où le projet a été résolu, sinon celui du dépôt par défaut"
"hosting review reply --project" = "Relire un projet qui n'est pas le dépôt courant (aucun clone nécessaire) : `owner/name` sur GitHub, `group/sub/project` sur GitLab. `--id` désigne alors l'intégration, si plusieurs sont configurées"
"hosting review resolve --project" = "Relire un projet qui n'est pas le dépôt courant (aucun clone nécessaire) : `owner/name` sur GitHub, `group/sub/project` sur GitLab. `--id` désigne alors l'intégration, si plusieurs sont configurées"
"hosting review show --project" = "Relire un projet qui n'est pas le dépôt courant (aucun clone nécessaire) : `owner/name` sur GitHub, `group/sub/project` sur GitLab. `--id` désigne alors l'intégration, si plusieurs sont configurées"
"hosting review submit --project" = "Relire un projet qui n'est pas le dépôt courant (aucun clone nécessaire) : `owner/name` sur GitHub, `group/sub/project` sur GitLab. `--id` désigne alors l'intégration, si plusieurs sont configurées"
"hosting review suggest --agents_md" = "Donne au modèle le fichier AGENTS.md du dépôt, pour cette exécution"
"hosting review suggest --claude_md" = "Donne au modèle le fichier CLAUDE.md du dépôt (lu sur la branche visée par la demande), pour cette exécution"
"hosting review suggest --context_file" = "Un fichier de plus pour cette exécution : un chemin relatif à la racine du dépôt, un chemin absolu ou un lien vers un fichier d'un hébergeur"
"hosting review suggest --no_context_file" = "Aucun fichier supplémentaire pour cette exécution, quels que soient les réglages par défaut"
"hosting review suggest --project" = "Relire un projet qui n'est pas le dépôt courant (aucun clone nécessaire) : `owner/name` sur GitHub, `group/sub/project` sur GitLab. `--id` désigne alors l'intégration, si plusieurs sont configurées"
"hosting review suggest --run_in_repo" = "Agent local : dans le dépôt (`yes`), hors du dépôt (`no`) ou selon le dossier de travail de son profil IA (`profile`), pour cette exécution. Impossible avec `--project` (il n'y a pas de copie de travail)"
"hosting review threads --project" = "Relire un projet qui n'est pas le dépôt courant (aucun clone nécessaire) : `owner/name` sur GitHub, `group/sub/project` sur GitLab. `--id` désigne alors l'intégration, si plusieurs sont configurées"
"hosting ssh-key" = "Génère une paire de clés ed25519 et envoie la moitié publique"
"hosting ssh-key create" = "Génère une nouvelle paire et envoie la moitié publique. Refuse d'écraser un fichier de clé existant"
"hosting ssh-key create --no_upload" = "Génère la paire mais ne l'envoie nulle part"
"hosting ssh-key create --path" = "Où écrire la clé privée. Par défaut `~/.ssh/id_ed25519`"
"hosting ssh-key create --title" = "Le nom sous lequel la clé apparaît chez l'hébergeur. Par défaut `gitpoulpi@<hostname>`"
"hosting ssh-key delete" = "Retire une clé publique du compte chez l'hébergeur (par l'id que rapporte `ssh-key list`). Les fichiers de clé locaux sont laissés tels quels"
"hosting ssh-key delete --id" = "Quelle intégration"
"hosting ssh-key delete --key_id" = "L'id de la clé chez l'hébergeur"
"hosting ssh-key list" = "Les clés publiques déjà présentes sur le compte"
"hosting use" = "Épingle quel profil d'intégration répond pour le dépôt courant (ou, sans aucune des deux options, affiche celui en vigueur)"
"hosting use --clear" = "Retire l'épingle, et revient à la résolution par hôte distant"
"hosting use --id" = "Le profil à épingler"
ignore = "Ajoute un motif à un `.gitignore` (celui de la racine du dépôt par défaut). Ne fait rien si le motif est déjà une ligne du fichier. Annulable avec `gitpoulpi undo`, qui remet le fichier tel qu'il était (ou le supprime s'il n'existait pas)"
"ignore --file" = "`.gitignore` relatif au dépôt où ajouter (par défaut `.gitignore`)"
"ignore --pattern" = "La ligne à ajouter, p. ex. `*.log`, `/build` ou `docs/tmp/`"
lfs = "Git LFS : gros fichiers stockés hors de l'historique du dépôt. Nécessite le programme `git-lfs` pour tout ce qui déplace ou convertit des fichiers ; `status` et `files` fonctionnent sans lui"
"lfs fetch" = "Télécharge les objets LFS dans le stockage local (`git lfs fetch`), sans toucher à l'arbre de travail"
"lfs fetch --all" = "Toutes les références, pas seulement l'actuelle"
"lfs fetch --remote" = "Omis : le dépôt distant par défaut du dépôt (voir `remote default`)"
"lfs files" = "Les fichiers pointeurs LFS de l'index (ou à `--at`), avec l'indication de la présence de chaque objet réel dans le stockage LFS local"
"lfs files --at" = "Révision à lister (par défaut : l'index)"
"lfs install" = "Installe les filtres et hooks LFS (`git lfs install`), pour ce dépôt seulement sauf avec `--user`"
"lfs install --user" = "Installe dans la configuration git globale de l'utilisateur au lieu de ce dépôt"
"lfs lock" = "Verrouille un fichier pour que personne d'autre ne puisse le modifier tant que vous ne l'avez pas déverrouillé"
"lfs lock --remote" = "Omis : le dépôt distant par défaut du dépôt"
"lfs locks" = "Les verrous de fichiers LFS sur le serveur : qui détient quel fichier. Nécessite un serveur avec verrouillage (GitHub, GitLab, Gitea, ...) ; utilise les identifiants propres du dépôt distant"
"lfs locks --remote" = "Omis : le dépôt distant par défaut du dépôt"
"lfs prune" = "Supprime du stockage LFS local les anciens objets déjà poussés"
"lfs pull" = "Télécharge les objets LFS et remplace les fichiers pointeurs de l'arbre de travail par le vrai contenu (`git lfs pull`)"
"lfs pull --remote" = "Omis : le dépôt distant par défaut du dépôt"
"lfs checkout" = "Écrit le vrai contenu des fichiers pointeurs LFS de l'arbre de travail depuis le stockage LFS local (`git lfs checkout`). Hors ligne"
"lfs checkout --paths" = "Seulement ces chemins (relatifs à la racine du dépôt) ; omis : tous les pointeurs de l'arbre de travail"
"lfs push" = "Envoie les objets LFS (`git lfs push`)"
"lfs push --all" = "Toutes les références, pas seulement la branche courante"
"lfs push --remote" = "Omis : le dépôt distant par défaut du dépôt"
"lfs status" = "`git-lfs` est-il installé, ce dépôt utilise-t-il LFS, quels motifs sont suivis, les filtres et le hook sont-ils installés. N'échoue jamais parce que `git-lfs` manque : la réponse le dit"
"lfs track" = "Fait passer des motifs de fichiers par LFS (`git lfs track`). Modifie `.gitattributes` et le laisse non indexé"
"lfs track --lockable" = "Rend les fichiers en lecture seule tant qu'ils ne sont pas verrouillés"
"lfs track --renormalize" = "Ré-indexe aussi les fichiers déjà commités qui correspondent, pour que leur prochain commit stocke des pointeurs (l'historique n'est pas réécrit)"
"lfs unlock" = "Libère un verrou. Le verrou de quelqu'un d'autre demande `--force`, qui le brise"
"lfs unlock --force" = "Brise un verrou détenu par quelqu'un d'autre"
"lfs unlock --remote" = "Omis : le dépôt distant par défaut du dépôt"
"lfs untrack" = "Cesse de faire passer des motifs par LFS (`git lfs untrack`)"
"log --count" = "Affiche seulement le nombre de commits du parcours (`{\"total\": N}`), sans tenir compte de `--limit` ni de `--skip` : ce que la barre d'état de la TUI montre après la barre oblique. Compte sans charger aucun commit"
"log --path" = "Seulement les commits touchant ce chemin (répétable) - `git log -- <path>`. C'est la requête de la vue Historique du fichier"
"log --skip" = "Ignore les N premiers commits du parcours avant d'appliquer `--limit`. Avec `--limit`, cela pagine l'historique : la page `n` est `--skip <n*limit> --limit <limit>`, et les pages pavent exactement le parcours (vérifié par contrat via `check_log_skip_pages_history`)"
"log --format" = "Rend les commits dans un autre format. `mermaid` affiche un script Mermaid `gitGraph` (à coller dans un fichier Markdown, une PR ou mermaid.live) ; avec `--json`, `{format, detail, commits, text}`. Les commits sont ceux de `--range`, sinon les `--limit` premiers (30 par défaut) du parcours"
"log --detail" = "Niveau de détail Mermaid : `structure` (commits, branches, fusions), `refs` (+ noms de branches, tags, HEAD), `subjects` (+ sujets des commits) ou `full` (+ auteur et date). Par défaut : `ui.mermaid_detail` (`refs`)"
"log --orientation" = "Direction du graphe Mermaid. Par défaut : `ui.mermaid_orientation` (`lr`)"
"log --fence" = "Entoure le script Mermaid d'une clôture ```mermaid"
"log --range" = "Mermaid : les commits `A..B` (accessibles depuis B, pas depuis A), comme `git log A..B` ; un simple `A` signifie `A..HEAD`"
"log --subject_width" = "Mermaid : coupe les sujets des commits à ce nombre de caractères. Par défaut : `ui.mermaid_subject_width` (40)"
"mcp serve --allow_remote" = "Autorise `--http` sur une adresse non loopback. Refusé sauf si `[mcp] http_auth` est activé avec un jeton en place et si le trafic est chiffré (`[mcp] tls`, ou `behind_proxy` pour un tunnel ou un proxy inverse dont vous répondez) ; `ssh -L` vers un point d'accès loopback est plus sûr"
"mcp serve --http" = "Adresse d'écoute pour le HTTP streamable, p. ex. 127.0.0.1:8808 (point d'accès `/mcp`) ; sans adresse, `[mcp] bind` (par défaut 127.0.0.1:8808). Les requêtes exigent le jeton bearer (`mcp token`) sauf si `[mcp] http_auth` est désactivé. Loopback uniquement sauf avec `--allow-remote`"
"mcp serve --ui_control" = "Jusqu'où l'agent peut manipuler la fenêtre de l'utilisateur avec les outils `ui_*` : `ask` (par défaut : la fenêtre affiche une pastille que l'utilisateur confirme), `auto` ou `off`. Remplace `[mcp] ui_control`"
"mcp token" = "Le jeton bearer du point d'accès HTTP (`mcp serve --http`) : l'affiche masqué en JSON `{token_hint, path, rotated}`, en le créant au premier usage. Un client l'envoie sous la forme `Authorization: Bearer <token>`. Ce n'est pas un outil MCP : un agent ne lit ni ne renouvelle jamais sa propre clé"
"mcp token --copy" = "Copie le jeton complet dans le presse-papiers via le terminal (OSC 52), sans l'afficher"
"mcp token --rotate" = "Remplace le jeton par un nouveau ; les clients qui détiennent l'ancien sont refusés immédiatement"
"mcp token --show" = "Affiche aussi le jeton complet, à coller dans la configuration d'un client"
"merge --autostash" = "Met de côté les modifications locales qui bloquent l'opération, l'exécute, puis restaure la mise de côté (ce que fait `general.auto_stash = \"always\"`)"
"merge --squash" = "Écrase les commits de la branche : indexe leurs modifications sans créer de commit de merge (`merge --squash`), un `commit` doit suivre. C'est le mode Squash du réglage Merge behavior. Non annulable : rien n'a bougé, abandonnez les modifications indexées pour revenir en arrière"
patch = "Écrit un fichier patch, ou en applique un à l'arbre de travail"
"patch apply" = "Applique un fichier patch à l'arbre de travail"
"patch create" = "Écrit un fichier patch. `<revs>` sont un ou plusieurs commits (du plus ancien au plus récent) dont on fait un patch chacun ; à combiner avec `--range a..b` pour couvrir à la place tous les commits non-fusion d'une plage ; à combiner avec `--wip` pour patcher à la place les modifications en cours de l'arbre de travail (indexées et non indexées), éventuellement limitées à `<paths>`"
"patch create --revs" = "Révisions de commits (du plus ancien au plus récent) sans `--range`/`--wip` ; avec `--wip`, chemins auxquels limiter le patch (vide : tous les fichiers modifiés) ; ignoré avec `--range`"
"pull --autostash" = "Met de côté les modifications locales qui bloquent l'opération, l'exécute, puis restaure la mise de côté (ce que fait `general.auto_stash = \"always\"`)"
"pull --mode" = "Comment intégrer : `merge` (fast-forward si possible), `ff-only` ou `rebase`. Toujours passé explicitement à git"
"pull --remote" = "Tire la branche du même nom depuis ce dépôt distant au lieu de l'amont de la branche"
"push --branch" = "La branche locale à pousser ; la branche extraite si omise"
"push --force_with_lease" = "Écrase la branche distante, seulement si elle est là où notre dernier fetch l'a vue. Il n'y a pas de `--force` simple"
"push --remote" = "Omis : le dépôt distant par défaut du dépôt (voir `remote default`)"
"push --set_upstream" = "Enregistre `<remote>/<branch>` comme amont de la branche"
"rebase --abort" = "Abandonne un rebase en cours, en restaurant la branche et HEAD"
"rebase --autosquash" = "Réordonne d'abord les étapes de `--plan` avec l'algorithme de `git rebase --autosquash` ; sans `--plan`, exécute un simple `git rebase -i --autosquash`"
"rebase --autostash" = "Met de côté les modifications locales qui bloquent l'opération, l'exécute, puis restaure la mise de côté (ce que fait `general.auto_stash = \"always\"`)"
"rebase --continue_" = "Reprend un rebase arrêté par un conflit ou une étape `edit`"
"rebase --interactive" = "Exécute `git rebase -i`. Sans `--plan`, seul `--autosquash` seul a un sens (il n'y a pas d'éditeur interactif ici) ; à combiner avec `--plan` pour une liste de tâches explicite"
"rebase --onto" = "La branche/le commit sur lequel rebaser, ou (avec `--plan`) l'amont après lequel commence la plage du plan. Omis avec `--root` ou l'un de `--continue`/`--skip`/`--abort`/`--status`"
"rebase --onto_commit" = "Rejoue sur ce commit au lieu de l'amont lui-même (`git rebase --onto`)"
"rebase --plan" = "Un plan `Vec<RebaseStep>` JSON (voir `rebase-plan`), depuis un chemin de fichier ou `-` pour l'entrée standard"
"rebase --root" = "Rebase tout l'historique (`--root`) au lieu d'une plage après `onto`/un amont explicite"
"rebase --skip" = "Ignore le commit sur lequel un rebase est arrêté"
"rebase --status" = "Indique le rebase actuellement en cours, le cas échéant"
rebase-plan = "La plage qu'un rebase interactif depuis `upstream` (ou tout l'historique, avec `--root`) rejouerait, du plus ancien au plus récent - de quoi construire un fichier JSON pour `rebase --plan`"
redo = "Refait l'opération que `undo` vient d'annuler, jusqu'à l'état exact enregistré (elle ne ré-exécute jamais l'opération). Code de sortie 2 en cas de refus"
"redo --dry_run" = "Montre ce qui se passerait sans rien changer"
"redo --expect" = "Ne refait que si c'est encore la dernière entrée annulée"
"redo --yes" = "Poursuit quand le redo est risqué ; sans cela, code de sortie 3"
"refs hide" = """Masque des références du graphe de commits (le « Hide » du TUI) : le filtre d'affichage par dépôt dans `repo-state.toml`, qu'un TUI ouvert suit en direct. Les noms s'écrivent comme la liste des références les écrit (`feature/x`, `origin/main`, un nom de tag)"""
"refs hide --clear" = "Réaffiche toutes les références et tous les distants masqués (en plus de ceux nommés)"
"refs hide --names" = "Références à masquer"
"refs hide#long" = """
Masque des références du graphe de commits (le « Hide » du TUI) : le filtre d'affichage par dépôt dans `repo-state.toml`, qu'un TUI ouvert suit en direct. Les noms s'écrivent comme la liste des références les écrit (`feature/x`, `origin/main`, un nom de tag).

`--remote <name>...` masque un distant en entier (toutes ses branches, y compris celles récupérées plus tard) : le moyen de regarder un historique sans celui d'un distant d'archive à part."""
"refs hide --remote" = "Distants à masquer en entier (noms écrits comme `remote list` les écrit)"
"refs show" = "Réaffiche des références : les retire des ensembles masqué et solo"
"refs show --clear" = "Réinitialise tout le filtre : rien de masqué (distants compris), rien en solo"
"refs show --names" = "Références à réafficher"
"refs show#long" = """
Réaffiche des références : les retire des ensembles masqué et solo.

`--remote <name>...` réaffiche un distant en entier, avec toutes ses branches qui avaient été masquées une par une."""
"refs show --remote" = "Distants à réafficher"
"refs solo" = "N'affiche que ces références (et ce qu'elles atteignent) dans le graphe de commits"
"refs solo --clear" = "Retire le solo de toutes les références en solo (en plus de celles nommées)"
"refs solo --names" = "Références à mettre en solo"
"remote add --push_url" = "Une URL distincte vers laquelle pousser"
"remote clear-push-url" = "Retire l'URL de push distincte, pour que les push reprennent l'URL de fetch"
"remote default" = "Affiche le dépôt distant par défaut du dépôt, ou le définit avec un nom"
"remote set-url" = "Définit l'URL de fetch, ou avec `--push` l'URL de push distincte"
repo = "Ouvrir, inspecter et mémoriser des dépôts - la surface multi-dépôts. Voir `gitpoulpi repo --help`"
"repo close" = "Ferme l'onglet d'un dépôt dans cette session. Le dépôt lui-même n'est pas touché"
