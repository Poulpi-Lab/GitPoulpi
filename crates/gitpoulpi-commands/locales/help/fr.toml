"flow status" = "Chaque branche du dépôt classée selon son workflow de branches : base ou thématique (avec son type), parent, et de combien de commits elle est en avance et en retard sur ce parent. Sans fichier de workflow, toute branche est non classée ; `flow detect` en propose un"
"flow sync" = "Met une branche à jour avec son parent (fusion ou rebase, selon la stratégie configurée de la branche), et avec `--stack` les branches construites dessus, dans l'ordre. Affiche le plan et demande `--yes` ; code de sortie 3 sans lui"
"flow sync --abort" = "Abandonne l'action arrêtée : abandonne la fusion ou le rebase en cours et revient à la branche de départ. Les étapes déjà terminées restent (annulez-les avec `undo`)"
"flow sync --autostash" = "Met de côté les modifications locales qui bloquent un checkout ou une fusion et les remet ensuite, quel que soit `general.auto_stash`"
"flow sync --branch" = "La branche à mettre à jour. Par défaut, celle qui est extraite"
"flow sync --continue_" = "Continue après la résolution du conflit : valide la fusion ou continue le rebase, puis exécute les étapes restantes. Après un hook en échec, relance cette étape"
"flow sync --dry_run" = "Affiche le plan (chaque étape, blocages, avertissements) en JSON et ne change rien"
"flow sync --merge" = "Fusionne plutôt que de faire un rebase"
"flow sync --no_hooks" = "Ignore les hooks configurés sans demander"
"flow sync --rebase" = "Fait un rebase plutôt qu'une fusion"
"flow sync --run_hooks" = "Exécute les hooks que le workflow configure pour cette action (commandes shell du fichier de workflow, affichées avec leur sortie). Jamais exécutés sans demande ; un terminal est interrogé en l'absence de cette option"
"flow sync --stack" = "Met aussi à jour les branches dont le parent est celle-ci, récursivement"
"flow sync --yes" = "Exécute le plan sans demander. Sans cette option, un terminal est interrogé, tout le reste affiche le plan et sort avec le code 3"
"flow templates" = "Les modèles de workflow intégrés (Git Flow, GitHub Flow, GitLab Flow, Trunk-based, Custom) avec leurs branches de base et leurs types de branche"
"flow trust-hooks" = "Relit et approuve les hooks de workflow que le dépôt commite (les `[hooks]` de `.gitpoulpi/workflow.toml`) : des commandes shell qui s'exécuteraient sur votre machine. Sans `--hash`, affiche seulement `{hash, hooks, trusted}` ; avec le hash, mémorise l'approbation, mais seulement si le fichier sur le disque a encore exactement ce hash, de sorte que ce que vous avez lu est ce qui est approuvé. Un fichier modifié redemande. Les hooks de votre propre surcharge n'en ont jamais besoin. Seule une personne peut le faire : il n'existe pas d'outil MCP pour cela"
"flow trust-hooks --hash" = "Le hash affiché par `flow trust-hooks` (ou par un `--run-hooks` refusé) : approuve les hooks portant ce hash"
alias = "L'alias de commande (`gp` ou tout autre nom) qui lance GitPoulpi depuis un terminal : l'équivalent en ligne de commande de Paramètres > Général > Lanceur"
"alias create" = "Fait de `<name>` (par exemple `gp`) une commande qui lance GitPoulpi : un lien sous Linux et macOS, un fichier `.cmd` sous Windows, dans un dossier bin propre à l'utilisateur. Un fichier qui n'est pas celui de GitPoulpi n'est jamais remplacé. Ajoutez ce dossier au PATH avec `path add`"
"alias create --add" = "Crée la variante « ajout » (par exemple `gpa`) : elle exécute `gitpoulpi --add`, qui ouvre le dossier courant dans un nouvel onglet du GitPoulpi déjà lancé"
"alias create --name" = "Le nom de la commande : lettres, chiffres, `-`, `_` et `.` uniquement"
"alias remove" = "Supprime les alias de commande créés par GitPoulpi (tous, ou seulement `<name>`) ; un fichier qui n'est pas celui de GitPoulpi n'est jamais touché"
"alias remove --name" = "L'alias à supprimer (par défaut : tous ceux que GitPoulpi a créés)"
"alias status" = "Affiche les alias de commande créés par GitPoulpi (et ce que chacun exécute) et les noms définis dans `ui.command_alias` et `ui.command_alias_add`"
path = "Ajoute GitPoulpi au PATH de l'utilisateur, pour les nouveaux terminaux"
"path add" = "Ajoute au PATH de l'utilisateur, pour les nouveaux terminaux, le dossier où se trouve GitPoulpi et le dossier des alias : un bloc balisé dans les fichiers de démarrage du shell (Linux, macOS) ou le PATH utilisateur du registre (Windows). Les dossiers déjà dans le PATH sont laissés tels quels"
"path remove" = "Retire exactement ce que `path add` a ajouté"
"path status" = "Indique si le dossier où se trouve GitPoulpi et le dossier des alias sont dans le PATH de l'utilisateur, et ce que GitPoulpi y a ajouté"
uninstall = "Supprime ce que l'installateur et les Paramètres ont créé (alias de commande, entrées du PATH, raccourcis) et, pour une installation issue d'une release, les fichiers du programme. Refuse de s'exécuter sur une build qui n'est pas une installation de release (pas de marqueur `.gitpoulpi-dist` à côté de l'exécutable). Votre configuration, vos sessions et vos dépôts ne sont jamais touchés"
"uninstall --keep_files" = "Laisse les fichiers du programme en place (le désinstallateur Windows les supprime lui-même, car un exécutable en cours d'exécution ne peut pas le faire)"
launch = "Ce que lancent les raccourcis GitPoulpi : affiche la fenêtre d'un GitPoulpi déjà ouvert (`ui.reuse_window`), sinon démarre COMMAND (le terminal qui exécute GitPoulpi). Ne démarre rien, pas même un démon, quand il peut afficher une fenêtre"
"launch --command" = "La commande à démarrer quand il n'y a aucune fenêtre à afficher, après `--`"
"launch --new_window" = "Démarre une nouvelle fenêtre même si une est déjà ouverte"
"ai split-plan" = "Affiche un plan que l'IA propose pour scinder un commit en plusieurs commits, au format JSON accepté par `split-commit --plan`. N'applique rien : relisez-le, puis passez-le à `split-commit`. Nécessite `ai.enabled = true`"
"ai split-plan --rev" = "Le commit à scinder (toute révision : un sha, `HEAD~2`, ...)"
"ai rewrite-script" = "Affiche un script Lua que l'IA écrit pour une réécriture d'historique à partir de votre consigne (\"décaler au lendemain matin les commits faits la nuit\"), accompagné du résultat de `rewrite script check`. N'exécute rien et ne change rien : relisez le script, puis `rewrite script test` et `rewrite preview --script`. N'envoie que votre consigne et, avec `--sample N`, l'auteur, la date et le sujet de N commits (jamais le contenu des fichiers). Nécessite `ai.enabled = true`"
"ai rewrite-script --instruction" = "Ce que le script doit faire, avec vos mots"
"ai rewrite-script --sample" = "Envoie aussi l'auteur, la date et le sujet des N derniers commits (50 au maximum) pour que le modèle voie à quoi ressemblent les données. Désactivé par défaut : sans cela, aucune donnée de commit ne quitte la machine"
"ai rewrite-rules" = "Affiche les règles et réglages que l'IA propose pour une réécriture d'historique à partir de votre description (« remplacer mon ancien e-mail a@b par c@d sur tous les commits », « retirer secrets.txt de tout l'historique »), sous la forme de la recette JSON que lit `rewrite preview --recipe-json` (enregistrez le champ `recipe` dans un fichier pour `--recipe`), avec ce qui a été écarté et pourquoi. Ne prévisualise rien et n'applique rien : relisez les règles, puis lancez vous-même `rewrite preview` et `rewrite apply`. N'envoie que votre description et, avec `--context`, la branche courante, les noms des branches et des tags et les auteurs des 200 derniers commits (jamais le contenu des fichiers). Nécessite `ai.enabled = true`"
"ai rewrite-rules --description" = "Comment l'historique doit être réécrit, avec vos mots"
"ai rewrite-rules --context" = "Envoie aussi les noms des branches et des tags et les auteurs des 200 commits les plus récents (au maximum 100 noms de branches et de tags et 100 auteurs) pour que le modèle puisse les nommer exactement. Désactivé par défaut : sans cela, seule votre description quitte la machine"
"split-commit" = "Scinde un commit de la branche courante en plusieurs, du plus ancien au plus récent, selon un plan JSON (voir `split-source` pour la numérotation). Le dernier nouveau commit garde l'arbre d'origine : les descendants et l'arbre de travail sont inchangés ; un commit déjà poussé demande ensuite un push forcé. Un `undo` remet tout en place. Code de sortie 2 en cas de refus"
"split-commit --commit" = "Le commit à scinder (toute révision : un sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Valide le plan et liste ce qui n'est pas affecté, sans rien changer"
"split-commit --plan" = "Le plan (JSON), depuis un chemin de fichier ou `-` pour l'entrée standard. Un fragment est un `path` suivi d'un `hunk` et de `lines` facultatifs (indices dans les `lines` du hunk) ; un fragment avec seulement un `path` désigne le fichier entier"
"split-commit --rest_message" = "Met tout ce que le plan laisse non affecté dans un dernier commit avec ce message"
"split-commit --sign" = "Signe les nouveaux commits (et les descendants rejoués)"
"split-source" = "Les modifications d'un commit numérotées pour `split-commit` : chaque fichier avec ses hunks (`id`, lignes) ou, pour les fichiers qui ne peuvent être affectés qu'en entier (binaire, mode seul, ajouté, supprimé, sous-module, LFS), la raison. Lecture seule"
"split-source --commit" = "Le commit (toute révision : un sha, `HEAD~2`, ...)"
"rewrite" = "Réécrit l'historique en masse (identités, dates, messages...) à partir d'une recette : `preview` établit le plan sans rien modifier, `apply` exécute le plan que vous avez relu en UNE seule entrée d'annulation, `run` fait les deux pour les scripts. Seul `push` envoie quelque chose : il pousse de force les refs réécrites, avec un bail par ref"
"rewrite apply" = "Applique une exécution prévisualisée : déplace les refs en UNE seule entrée d'annulation (`gitpoulpi undo` remet tout en place). Ne pousse jamais. Code de sortie 2 en cas de refus (le dépôt a changé depuis l'aperçu, empreinte incorrecte...), 3 si le plan déplace des refs présentes sur un distant et que `--yes` manque"
"rewrite apply --digest" = "L'empreinte affichée par `rewrite preview` : le plan que vous avez relu"
"rewrite apply --run" = "L'identifiant d'exécution affiché par `rewrite preview`"
"rewrite apply --yes" = "Confirme le déplacement de refs déjà poussées. Sans cette option, un tel plan ne change rien et le code de sortie est 3"
"rewrite diff" = "Ce qu'une règle de contenu a fait à un fichier d'un commit d'une exécution prévisualisée : la différence entre l'ancien et le nouveau fichier. Les lignes qu'une règle de secrets retire sont masquées. Lecture seule"
"rewrite diff --commit" = "Le commit tel qu'il est avant la réécriture (un identifiant tiré des lignes)"
"rewrite diff --path" = "Le fichier, relatif à la racine du dépôt"
"rewrite diff --run" = "L'identifiant d'exécution affiché par `rewrite preview`"
"rewrite discard" = "Abandonne une exécution prévisualisée sans l'appliquer. Abandonner deux fois est sans danger"
"rewrite discard --run" = "L'identifiant d'exécution affiché par `rewrite preview`"
"rewrite preview" = "Établit le plan d'une réécriture de l'historique sans rien modifier : totaux, refs qui bougeraient, avertissements et premières lignes. Garde le plan dans le démon sous forme d'exécution (`run`, `digest`) pour `rewrite rows` et `rewrite apply`. L'aperçu est aussi écrit sur disque dans le dossier git du dépôt : `rewrite apply` fonctionne donc depuis une commande ultérieure, après un redémarrage du démon ou depuis une autre interface, sans lancer de démon ; seul `rewrite rows` a besoin du démon qui a fait l'aperçu (un démon en cours d'exécution, ou utilisez `--all` avec l'aperçu). Code de sortie 2 si la recette est refusée"
"rewrite preview --all" = "Affiche tous les commits modifiés"
"rewrite preview --all_local" = "Réécrit toutes les branches locales et tous les tags au lieu de la branche courante"
"rewrite preview --committer" = "Committer des commits réécrits : `keep` (par défaut) ou `me-now`"
"rewrite preview --include_protected" = "Réécrit aussi ces branches protégées déjà poussées (exclues par défaut ; répétable)"
"rewrite preview --lfs_export" = "Règle LFS : remet en vrais fichiers, dans chaque commit, les pointeurs LFS qui correspondent à ce motif (répétable). Les objets doivent être dans le stockage LFS local (récupérez-les d'abord) ; sinon refus avec la liste de ceux qui manquent"
"rewrite preview --eol" = "Règle de fins de ligne : les fichiers texte qui correspondent à `--eol-paths` prennent cette fin de ligne (`lf` Linux et macOS, `crlf` Windows, `cr` Mac classique) ; les fins de ligne mélangées sont uniformisées et les fichiers binaires ignorés"
"rewrite preview --eol_paths" = "Avec `--eol` : les fichiers à convertir (motifs glob, répétable ; un motif sans barre oblique s'applique à toute profondeur)"
"rewrite preview --eol_exclude" = "Avec `--eol` : les fichiers à laisser tels quels (motifs glob, répétable)"
"rewrite preview --eol_follow_attributes" = "Avec `--eol` : lit le `.gitattributes` racine de chaque commit : les fichiers `-text` et `binary` sont ignorés, ceux en `eol=lf` et `eol=crlf` gardent leur propre fin de ligne"
"rewrite preview --strip_exec" = "Règle de mode de fichier : le bit exécutable (100755 devient 100644) est retiré des fichiers qui correspondent à ces motifs (répétable) ; le contenu n'est pas touché"
"rewrite preview --strip_exec_exclude" = "Avec `--strip-exec` : les fichiers qui gardent leur bit exécutable (motifs glob)"
"rewrite preview --reencode" = "Règle d'encodage : les fichiers texte qui correspondent à `--encoding-paths` sont convertis dans cet encodage (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`) ; les fichiers binaires, illisibles ou non représentables restent tels quels et sont comptés"
"rewrite preview --reencode_from" = "Avec `--reencode` : l'encodage des fichiers ; omis, il est détecté fichier par fichier (marque d'ordre des octets, UTF-8 valide, sinon `--encoding-fallback`)"
"rewrite preview --encoding_fallback" = "Avec `--reencode` : l'encodage dans lequel est lu un fichier ni marqué ni en UTF-8 quand la source est détectée (`windows-1252` par défaut)"
"rewrite preview --encoding_paths" = "Avec `--reencode` : les fichiers à convertir (motifs glob, répétable)"
"rewrite preview --encoding_exclude" = "Avec `--reencode` : les fichiers à laisser tels quels (motifs glob, répétable)"
"rewrite preview --lfs_import" = "Règle LFS : déplace vers Git LFS, dans chaque commit, les fichiers qui correspondent à ce motif (répétable ; un motif sans barre oblique correspond à toute profondeur). Nécessite git-lfs. Le contenu va dans le stockage LFS local et `.gitattributes` reçoit la ligne `filter=lfs` ; poussez ensuite les objets LFS"
"rewrite preview --lfs_min_size" = "Avec `--lfs-import` : seuls les fichiers d'au moins ce nombre d'octets sont déplacés"
"rewrite preview --limit" = "Nombre de commits modifiés à afficher (50 par défaut)"
"rewrite preview --match_email" = "Règle d'identité : cible cet e-mail d'auteur ou de committer"
"rewrite preview --match_name" = "Règle d'identité : cible ce nom d'auteur ou de committer"
"rewrite preview --prune_empty" = "Commits qu'une règle de contenu laisse vides : `auto` les supprime (par défaut), `never` les garde"
"rewrite preview --recipe" = "Un fichier de recette (TOML ou JSON, le format de l'atelier du TUI), ou `-` pour du JSON sur l'entrée standard"
"rewrite preview --recipe_json" = "Une recette sous forme de chaîne JSON (pour les appelants qui ne peuvent pas écrire de fichier)"
"rewrite preview --refs" = "Réécrit seulement ces branches locales ou ces tags (répétable)"
"rewrite preview --remove_blobs_over" = "Règle de contenu : retire de chaque commit tout fichier dépassant ce nombre d'octets"
"rewrite preview --remove_findings" = "Règle de contenu : retire un secret trouvé par `rewrite scan-secrets`, désigné par l'identifiant du résultat (répétable), ou `all` pour tous les résultats du périmètre. Le daemon relance l'analyse et résout lui-même les identifiants : la valeur n'atteint jamais la ligne de commande, une recette ni un journal"
"rewrite preview --remove_paths" = "Règle de contenu : retire de chaque commit les fichiers et dossiers correspondant à ce motif glob (répétable ; un motif sans barre oblique correspond à n'importe quelle profondeur)"
"rewrite preview --replace_content" = "Règle de contenu `RECHERCHE=REMPLACEMENT` : remplace un texte littéral dans chaque fichier texte (répétable ; les fichiers binaires sont ignorés et comptés). Pour des secrets, utilisez une règle `content_replace` dans la recette avec `--secrets-file`"
"rewrite preview --replace_message" = "Règle de message `RECHERCHE=REMPLACEMENT` (texte littéral, répétable)"
"rewrite preview --script_params" = "Un paramètre de script `NOM=VALEUR`, transmis à chaque `--script` (répétable). Les noms sont ceux que déclare l'en-tête du script"
"rewrite preview --scripts" = "Règle de script : exécute ce fichier de script sur chaque commit (répétable, dans l'ordre, après les règles des autres options). Le fichier est lu ici puis intégré à la recette ; voir `rewrite script check` pour le format. Un fichier `.lua` s'exécute dans le Lua intégré et isolé ; un script shell, Python ou Lua externe n'est pas isolé et demande confiance (`--trust`, ou `rewrite script trust FILE` avant)"
"rewrite preview --secrets_file" = "Un fichier contenant un secret par ligne (lignes vides ignorées). Les secrets sont ajoutés aux règles `content_replace` de la recette qui cherchent des secrets : ils ne passent donc jamais par la ligne de commande, une recette enregistrée ou un journal"
"rewrite preview --set_email" = "Règle d'identité : l'e-mail à appliquer"
"rewrite preview --set_name" = "Règle d'identité : le nom à appliquer (avec `--set-email`, au moins l'un des deux)"
"rewrite preview --shift_dates" = "Règle de date : décale chaque date de ce nombre de secondes (négatif : vers le passé), en gardant le fuseau horaire propre à chaque commit"
"rewrite preview --signatures" = "Que faire des signatures des commits réécrits : `strip`, `resign-signed` ou `resign-all`. Obligatoire quand des commits signés changent"
"rewrite preview --since" = "Avec la branche courante : seulement les commits après cette révision"
"rewrite preview --who" = "Règle d'identité : `author`, `committer` ou `both` (par défaut)"
"rewrite rows" = "Parcourt page par page les commits d'une exécution prévisualisée"
"rewrite rows --filter" = "`changed` (par défaut), `dropped`, `pushed` ou `all`"
"rewrite rows --limit" = "Lignes par page (200 au plus)"
"rewrite rows --offset" = "Lignes à sauter"
"rewrite rows --run" = "L'identifiant d'exécution affiché par `rewrite preview`"
"rewrite run" = "Aperçu puis application en un seul appel, pour les scripts. Mêmes refus et mêmes codes de sortie que `preview` et `apply` ; avec le code de sortie 3, l'aperçu est abandonné et rien n'a changé"
"rewrite run --all_local" = "Réécrit toutes les branches locales et tous les tags au lieu de la branche courante"
"rewrite run --committer" = "Committer des commits réécrits : `keep` (par défaut) ou `me-now`"
