"revert --mainline" = "Pour un commit de merge : le numéro (à partir de 1) du parent qui reste la ligne principale, comme `git revert -m`. `1` est la branche sur laquelle le merge a été fait. Obligatoire pour annuler un commit de merge"
reword = "Donne un nouveau message à un commit de la branche courante (ses descendants sont recréés par-dessus ; l'index et l'arbre de travail sont laissés tels quels). Un commit déjà poussé demande ensuite un push forcé"
"reword --commit" = "Le commit à modifier (toute révision : un sha, `HEAD~2`, ...)"
"reword --message" = "Le nouveau message complet (résumé, ligne vide, corps)"
amend = "Modifie les propriétés d'un commit de la branche courante : message, nom, e-mail et date de l'auteur, nom, e-mail et date du committer (n'importe quel sous-ensemble ; ce que vous omettez est conservé). Ses descendants sont recréés par-dessus avec leurs propres auteurs ; l'index et l'arbre de travail sont laissés tels quels. Annulable ; un commit déjà poussé demande ensuite un push forcé"
"amend --author_date" = "Date git brute (`1700000000 +0100`) ou ISO 8601 (`2001-02-03T04:05:06+05:30`)"
"amend --author_email" = "Le nouvel e-mail de l'auteur"
"amend --author_name" = "Le nouveau nom de l'auteur"
"amend --commit" = "Le commit à modifier (toute révision : un sha, `HEAD~2`, ...)"
"amend --committer_date" = "Mêmes formats que --author-date (par défaut : maintenant)"
"amend --committer_email" = "Le nouvel e-mail du committer (par défaut : le vôtre)"
"amend --committer_name" = "Le nouveau nom du committer (par défaut : le vôtre)"
"amend --description" = "Seulement le corps (ce qui suit le résumé) : le résumé est conservé. Une valeur vide supprime le corps"
"amend --message" = "Le nouveau message complet (résumé, ligne vide, corps)"
"amend --summary" = "Seulement le résumé (première ligne) : le corps est conservé"
rm-file = "Supprime des fichiers (ou répertoires) de l'arbre de travail ; l'index n'est pas touché, donc un fichier suivi apparaît comme une modification supprimée. Annulable avec `gitpoulpi undo`, qui restaure les octets exacts"
"rewrite apply --target" = "Le dossier du nouveau dépôt quand le plan extrait un sous-dossier en clone ou en sous-module (voir `--extract-mode`)"
"rewrite maps" = "Les fichiers `commit-map` et `ref-map` de l'exécution (format de git-filter-repo : une ligne d'en-tête, puis `ancien nouveau` par ligne ; le nettoyage de dépôt de GitLab utilise la carte des commits). Affiche leurs chemins, ou les copie dans `--out`"
"rewrite maps --out" = "Copie les deux fichiers dans ce dossier (créé s'il manque)"
"rewrite maps --run" = "L'identifiant de l'exécution ; `latest` (par défaut) désigne la dernière exécution appliquée"
"rewrite note" = "La note à envoyer aux personnes qui ont l'ancien historique : pour chaque branche et tag poussé, l'ancien et le nouveau sommet et la commande à lancer (`git fetch`, puis `git reset --hard origin/<branch>` ou `git rebase --onto`). Lecture seule"
"rewrite note --run" = "L'identifiant de l'exécution ; `latest` (par défaut) désigne la dernière exécution appliquée"
"rewrite preview --extract" = "Règle de chemin : ne garde que ce sous-dossier, qui devient la racine ; les commits qui ne le touchent pas sont supprimés et les merges simplifiés. Demandé à chaque fois : donnez `--extract-mode`, sinon le code de sortie est 3 et rien n'est prévisualisé. L'extraction s'exécute avant les autres options de chemin"
"rewrite preview --extract_mode" = "Comment finit `--extract` : `clone` (un nouveau clone local dans `--target`, l'original n'est pas touché ; toutes les branches et tous les tags locaux), `in-place` (l'historique de ce dépôt est réécrit, une entrée d'annulation) ou `submodule` (le clone comme avec `clone`, puis un nouveau commit sur la branche courante remplace le dossier par un sous-module qui pointe vers lui ; cet historique est conservé)"
"rewrite preview --into_subdir" = "Règle de chemin : déplace tout le dépôt dans ce sous-dossier dans chaque commit (pour fusionner des dépôts sans conflit de chemins)"
"rewrite preview --move_paths" = "Règle de chemin `DE=VERS` : renomme un fichier ou un dossier dans chaque commit, les mêmes blobs et arbres au nouveau chemin (répétable, dans l'ordre, après les règles de contenu). Un commit où `VERS` existe déjà n'est pas modifié : l'aperçu est refusé (code de sortie 2, `path_collision`) et liste les commits et les chemins"
"rewrite preview --target" = "Le dossier du nouveau dépôt pour `--extract-mode clone` ou `submodule` : il ne doit pas exister ou doit être vide, et ne pas se trouver dans ce dépôt. Utilisé par `rewrite run` ; `rewrite apply` a le sien"
"rewrite push" = "Pousse les références qu'une exécution appliquée a déplacées et qui étaient sur un distant, chacune avec `--force-with-lease=<ref>:<l'identifiant que le distant avait à l'aperçu>` (jamais un force brut), avec un seul push `--atomic` par distant quand le serveur le permet (sinon un push par référence, et la réponse le dit). Les tags sont inclus. Les branches protégées (`rewrite.protected_branches`) sont exclues, sauf celles données avec `--include-protected` ou toutes avec `--include-all-protected`. Une référence dont le distant a bougé depuis l'aperçu est refusée seule (faites un fetch, relisez, puis relancez). Non annulable : le distant garde le nouvel historique même si vous faites un `undo` de la réécriture en local. Sans `--yes` (ou avec `--dry-run`), rien n'est envoyé : la réponse liste ce qui serait poussé, et le code de sortie est 3 sans `--yes`. Code de sortie 2 si l'exécution n'existe plus, 4 si une référence a été refusée ou n'a pas été poussée"
"rewrite push --dry_run" = "Demande au distant ce qui se passerait (les leases sont vérifiés) et n'envoie rien"
"rewrite push --include_all_protected" = "Pousse aussi toutes les branches protégées de l'exécution"
"rewrite push --include_protected" = "Pousse aussi cette branche protégée (répétable)"
"rewrite push --no_atomic" = "Un push par référence au lieu d'un seul push `--atomic`, tout ou rien"
"rewrite push --remote" = "Seulement les références de ce distant"
"rewrite push --run" = "L'identifiant d'exécution affiché par `rewrite apply` ; `latest` (par défaut) désigne la dernière exécution appliquée"
"rewrite push --yes" = "Pousse pour de bon. Sans cela rien n'est envoyé (code de sortie 3)"
"rewrite purge" = "Supprime définitivement de ce clone l'ancien historique d'une réécriture : retire les épingles d'annulation de la réécriture (et de toute opération antérieure dont les épingles retiennent aussi l'ancien historique), fait expirer les entrées de reflog qui le citent, élague les objets (`gc --prune=now`) et vérifie qu'ils ont disparu. L'annulation n'est plus possible pour ces opérations (elles restent dans `undo --list`, marquées purgées). Une fois lancée, la purge ne peut ni être interrompue ni être annulée. Tout ce qui retient encore l'ancien historique (une branche hors de la réécriture, un stash, le HEAD d'un autre arbre de travail, une référence de suivi distant : faites un fetch après le push) la bloque, et rien n'est modifié. Rien n'est envoyé à un distant ; la réponse liste les étapes à faire côté hébergeur (GitHub, GitLab, Azure DevOps, Bitbucket). Sans `--yes` il ne se passe rien : la réponse indique ce qui serait supprimé et perdu, et le code de sortie est 3. Code de sortie 2 si l'entrée n'est pas une réécriture, 4 si quelque chose la bloque ou s'il reste des objets. Via MCP, seulement avec `[mcp] allow_history_purge = true`"
"rewrite purge --all" = "Toutes les réécritures d'historique de l'historique d'annulation"
"rewrite purge --entries" = "Une entrée de réécriture d'historique de l'historique d'annulation (`undo --list` ; répétable). Par défaut : la plus récente qui n'est pas purgée"
"rewrite purge --latest" = "La réécriture la plus récente qui n'est pas encore purgée (par défaut)"
"rewrite purge --yes" = "Supprime pour de bon. Sans cela rien n'est modifié (code de sortie 3)"
"rewrite run --extract" = "Règle de chemin : ne garde que ce sous-dossier, qui devient la racine ; les commits qui ne le touchent pas sont supprimés et les merges simplifiés. Demandé à chaque fois : donnez `--extract-mode`, sinon le code de sortie est 3 et rien n'est prévisualisé. L'extraction s'exécute avant les autres options de chemin"
"rewrite run --extract_mode" = "Comment finit `--extract` : `clone` (un nouveau clone local dans `--target`, l'original n'est pas touché ; toutes les branches et tous les tags locaux), `in-place` (l'historique de ce dépôt est réécrit, une entrée d'annulation) ou `submodule` (le clone comme avec `clone`, puis un nouveau commit sur la branche courante remplace le dossier par un sous-module qui pointe vers lui ; cet historique est conservé)"
"rewrite run --into_subdir" = "Règle de chemin : déplace tout le dépôt dans ce sous-dossier dans chaque commit (pour fusionner des dépôts sans conflit de chemins)"
"rewrite run --move_paths" = "Règle de chemin `DE=VERS` : renomme un fichier ou un dossier dans chaque commit, les mêmes blobs et arbres au nouveau chemin (répétable, dans l'ordre, après les règles de contenu). Un commit où `VERS` existe déjà n'est pas modifié : l'aperçu est refusé (code de sortie 2, `path_collision`) et liste les commits et les chemins"
"rewrite run --target" = "Le dossier du nouveau dépôt pour `--extract-mode clone` ou `submodule` : il ne doit pas exister ou doit être vide, et ne pas se trouver dans ce dépôt. Utilisé par `rewrite run` ; `rewrite apply` a le sien"
"rm-file --paths" = "Chemins relatifs au dépôt à supprimer"
shell-init = """Affiche une fonction wrapper pour le shell (nom par défaut `gp`) qui lance gitpoulpi et, quand vous quittez avec « Quit and cd here », laisse votre shell dans le dossier de l'onglet actif. Ajoutez-la au fichier rc de votre shell : `eval "$(gitpoulpi shell-init bash)"`. Rien n'est installé ni modifié"""
