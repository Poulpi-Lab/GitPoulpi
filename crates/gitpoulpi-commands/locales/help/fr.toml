index-lock = "Un `.git/index.lock` périmé, qui fait échouer toute écriture : l'afficher, ou le supprimer une fois assez ancien"
"index-lock remove" = "Supprime un `index.lock` périmé (laissé par une commande git morte). Refusé tant qu'il a moins de 10 s ou s'il n'y en a pas. Seul le fichier de verrou est supprimé ; vérifiez qu'aucune commande git ne tourne"
"index-lock show" = "L'`index.lock` du dépôt (`null` s'il n'y en a pas) : son chemin, son âge en secondes et s'il est périmé (plus de 10 s)"
"job" = "Les tâches d'arrière-plan du démon : chaque fetch, push, pull, clone et transfert LFS en est une dès sa réception. `list` les montre, `cancel` en arrête une, `wait` attend la fin d'une. Ctrl+C sur une commande qui a lancé une tâche l'annule"
"job list" = "Les tâches du démon de cette session, de la plus ancienne à la plus récente : en cours, en attente derrière une autre, et celles terminées depuis moins de 30 secondes"
"job cancel" = "Arrête une tâche. Refusé (code de sortie 1, rien ne change) une fois passé le point où l'arrêt est sûr, par exemple un pull qui a commencé à fusionner. Un push annulé a pu déjà atteindre le dépôt distant"
"job cancel --id" = "L'identifiant de la tâche, donné par `job list`"
"job wait" = "Attend la fin d'une tâche et affiche son état final. Code de sortie 0 si elle est `Done`, 1 si elle a échoué ou a été annulée"
"job wait --id" = "L'identifiant de la tâche, donné par `job list`"
"job wait --timeout" = "Abandonne après ce nombre de secondes (code de sortie 1, la tâche continue). Omis : attend aussi longtemps qu'il faut"
"undo-forget" = "Retire du journal d'annulation l'entrée bloquée du dessus (opération interrompue, ou dépôt qui a évolué depuis) pour pouvoir annuler celles en dessous. Ne touche jamais au dépôt, seulement au journal ; l'entrée ne peut plus être annulée ni rétablie. Code de sortie 2 si l'entrée du dessus n'est pas bloquée, 3 sans `--yes`"
"undo-forget --dry_run" = "Montre ce qui serait retiré sans rien changer"
"undo-forget --expect" = "Ne l'oublie que si c'est toujours l'entrée du dessus (son id, comme l'affiche `undo --list`) ; sinon refusé comme périmé"
"undo-forget --redo" = "Oublie l'entrée du dessus de la pile de rétablissement au lieu de celle d'annulation"
"undo-forget --yes" = "Confirme. Sans cela rien ne change et le code de sortie est 3"
"clone --sparse" = "Extraction partielle : n'extrait que ces dossiers (plus les fichiers à la racine) ; tout l'historique est quand même téléchargé"
sparse-checkout = "Extraction partielle (mode cone) : ne garde que certains dossiers dans l'arbre de travail d'un gros dépôt. `gitpoulpi clone --sparse` en démarre une"
"sparse-checkout add" = "Affiche aussi ces dossiers, en gardant ceux déjà affichés"
"sparse-checkout disable" = "Extrait de nouveau tous les fichiers (extraction complète)"
"sparse-checkout set" = "Affiche exactement ces dossiers (plus les fichiers à la racine du dépôt) ; tous les autres quittent l'arbre de travail. Active l'extraction partielle si elle est désactivée. L'historique n'est pas touché"
"sparse-checkout set --dirs" = "Dossiers relatifs à la racine du dépôt, p. ex. `src docs/guide`"
"sparse-checkout status" = "Indique si l'arbre de travail est une extraction partielle et quels dossiers il montre : `{ \"enabled\", \"cone\", \"dirs\" }`"
"diff --from" = "Compare à partir de cette révision (extrémité la plus ancienne) au lieu de l'arbre de travail contre l'index. À associer à `--to`"
"diff --name_only" = "Liste seulement les fichiers modifiés et leur statut, sans les blocs de modifications"
"diff --to" = "L'autre extrémité de `--from` : une révision, ou `worktree` (par défaut) pour l'arbre de travail, modifications indexées et non indexées des fichiers suivis. « Comparer la sélection » du Log liste les mêmes fichiers"
"file-history" = "Les commits qui ont modifié un fichier, du plus récent au plus ancien, en suivant les renommages (chemin à chaque commit, type de changement et nombre de lignes)"
"file-history --at" = "Révision de départ (par défaut : HEAD)"
"file-history --limit" = "Entrées par page ; `more` dans la réponse indique s'il en existe de plus anciennes"
"file-history --skip" = "Entrées à ignorer (la page n est `--skip <n*limit> --limit <limit>`)"
"lost-commits" = "Commits qu'aucune branche, aucun tag, aucun distant ni aucun stash n'atteint : ce qu'une branche supprimée a laissé (nommé par un reflog, ou gardé seulement par une ancre d'annulation) et, sauf `--no-deep`, les commits orphelins de la base d'objets. Du plus récent au plus ancien. Créez une branche sur l'un d'eux pour le récupérer"
"lost-commits --budget_ms" = "Arrête l'analyse après ce nombre de millisecondes (0 : sans limite) ; la réponse indique alors `partial`"
"lost-commits --limit" = "Nombre de commits à lister"
"lost-commits --no_deep" = "Seulement les commits qu'un reflog ou une ancre d'annulation nomme encore (rapide quelle que soit la taille)"
"lost-commits --skip" = "Nombre de commits à ignorer"
"reflog" = "Liste un reflog, du plus récent au plus ancien : où se trouvaient `HEAD` ou une branche avant, avec la date et la raison de git, y compris les déplacements faits dans un shell. Une branche supprimée n'a plus de reflog. S'écrit aussi `reflog restore` pour `reflog-restore`"
"reflog --limit" = "Nombre d'entrées à lister"
"reflog --ref" = "`HEAD` (par défaut) ou une branche (ou un nom de référence complet)"
"reflog --skip" = "Nombre d'entrées à ignorer"
"reflog-restore" = "Déplace une branche (ou `HEAD`) vers une position de son reflog. Une branche qui n'est pas extraite est simplement déplacée. Pour la branche extraite, l'arbre de travail reste à l'abri : avec des modifications non commitées, la commande refuse sauf si `--mode` est donné. Une seule entrée de journal : `undo` l'annule. S'écrit aussi `gitpoulpi reflog restore`"
"reflog-restore --dry_run" = "Montre ce qui se passerait sans rien changer"
"reflog-restore --mode" = "Avec des modifications non commitées : `keep` déplace et les garde (en refusant si l'une gêne), `soft`, `mixed` et `hard` sont les modes de reset"
"reflog-restore --oid" = "Le commit vers lequel la déplacer (le `new` d'une entrée de reflog)"
"reflog-restore --ref" = "`HEAD` ou une branche"
"undo-restore" = "« Restaurer seulement celle-ci » : ramène ce qu'une opération antérieure a supprimé (une branche ou un tag supprimé, un stash abandonné, un fichier abandonné ou supprimé, un distant retiré, une ligne d'ignore) sans annuler les opérations qui l'ont suivie. La restauration est une nouvelle entrée de journal, donc `undo` l'annule. Rien n'est écrasé : un fichier modifié depuis reçoit la version conservée à côté, sous le nom `<nom>.restored` ; un reset, un amend ou un rebase revient sous forme de nouvelle branche à l'ancienne pointe. S'écrit aussi `gitpoulpi undo restore <id>`. Code de sortie 2 quand c'est impossible (le JSON en donne la raison)"
"undo-restore --dry_run" = "Montre ce qui se passerait sans rien changer"
"undo-restore --id" = "L'entrée à restaurer, telle que `undo --list` affiche son id"
"undo-restore --name" = "Restaure la branche ou le tag sous ce nom (quand son ancien nom est pris, ou pour la branche qu'un reset, un amend ou un rebase restaure)"
"commit --workspace" = "Commite avec le profil par défaut de cet espace de travail (un id d'espace de travail ; aussi `GITPOULPI_WORKSPACE`). S'applique quand le dépôt est dans l'espace de travail et que celui-ci désigne un profil existant ; sinon `general.active_profile` ; sinon l'identité de la configuration git propre au dépôt. Sans cette option, c'est cette dernière qui est utilisée"
