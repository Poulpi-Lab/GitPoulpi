"flow" = "Workflows de branches (git-flow, GitHub Flow, GitLab Flow, trunk-based ou le vôtre) : quelles branches sont des bases durables, lesquelles sont des branches thématiques de quel type, leurs parents et leur écart avec eux. `status`, `templates`, `detect` et `config` lisent ; `config init` et `import` affichent un fichier de workflow et ne le créent qu'avec `--write`. `start`, `finish`, `sync`, `promote` et `set-parent` agissent : chacun affiche les étapes qu'il va faire (`--dry-run` les affiche en JSON et s'arrête), demande `--yes` pour s'exécuter et forme une seule entrée annulable (une demande de fusion ou un push ne s'annulent pas)"
