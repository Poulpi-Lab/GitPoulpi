"hosting review" = "Revue d'une pull/demande de fusion sur place (GitHub, GitLab, Gitea, Forgejo) : la lire, avec ses fils de discussion et ses fichiers, commenter, répondre, résoudre, envoyer une revue et récupérer sa tête pour le diff. Les mêmes commandes pour une personne, un script et un agent IA"
