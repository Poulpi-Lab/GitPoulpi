ui = "Montre des choses à l'utilisateur dans sa fenêtre GitPoulpi ouverte : un commit, un diff à une ligne, un fichier, une page de paramètres. Lecture seule : rien ici ne change le dépôt ni ne saisit dans la fenêtre, sauf `ui propose`, qui ouvre une boîte de dialogue pré-remplie que l'utilisateur confirme (désactivé sauf si `[mcp] allow_ui_propose = true`). Nécessite un TUI GitPoulpi ouvert sur la session"
