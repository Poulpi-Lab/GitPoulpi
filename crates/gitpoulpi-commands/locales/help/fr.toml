treat = "Fait traiter des fichiers comme binaires ou comme texte par git, en écrivant une règle `.gitattributes` (`binary`, ou `text diff`) pour les chemins : le fichier de la racine du dépôt par défaut, `--file` pour celui d'un dossier ou `.git/info/attributes` (ce clone uniquement). Une règle qui nomme déjà le même motif est réécrite, pas contredite. La réponse dit si git traite maintenant vraiment les chemins ainsi (`effective`). Annulable avec `gitpoulpi undo`, sauf pour `.git/info/attributes`"
