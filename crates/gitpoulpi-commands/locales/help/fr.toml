"search --kinds" = "Seulement ces types (répétable) ; tous par défaut. Un préfixe dans la requête restreint encore"
"search --limit" = "Au plus ce nombre de résultats"
"search --query" = "Ce qu'il faut chercher, préfixe compris (`c: fix login`)"
"search --workspace" = "Cherche dans tous les dépôts de cet espace de travail (un id ; aussi `GITPOULPI_WORKSPACE`). Sans cette option, dans le dépôt courant"
"workspace" = "Espaces de travail : des groupes nommés de dépôts, avec éventuellement un profil de commit par défaut. Stockés dans `workspaces.toml` à côté de `config.toml`, partagés avec la TUI"
