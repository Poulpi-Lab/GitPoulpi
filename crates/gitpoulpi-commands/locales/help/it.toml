"reflog" = "Elenca un reflog, dal più recente: dove si trovava prima `HEAD` o un branch, con la data e il motivo dato da git, comprese le mosse fatte in una shell. Un branch eliminato non ha più un reflog. Si scrive anche `reflog restore` per `reflog-restore`"
