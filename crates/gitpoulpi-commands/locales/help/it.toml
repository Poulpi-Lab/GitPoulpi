amend = "Cambia le proprietà di un commit del branch corrente: messaggio, nome, e-mail e data dell'autore, nome, e-mail e data del committer (qualsiasi sottoinsieme; ciò che ometti viene mantenuto). I suoi discendenti vengono ricreati sopra con i propri autori; indice e directory di lavoro restano com'erano. Annullabile; un commit già pubblicato richiede poi un push forzato"
