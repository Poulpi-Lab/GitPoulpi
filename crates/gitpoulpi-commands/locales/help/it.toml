"undo-restore" = "\"Ripristina solo questa\": riporta indietro ciò che una singola operazione precedente ha rimosso (un branch o un tag eliminato, uno stash scartato, un file scartato o eliminato, un remoto rimosso, una riga di ignore) senza annullare le operazioni successive. Il ripristino è una nuova voce del journal, quindi `undo` lo annulla. Nulla viene sovrascritto: un file cambiato nel frattempo riceve accanto la versione conservata come `<nome>.restored`; un reset, un amend o un rebase torna come nuovo branch sulla vecchia punta. Si scrive anche `gitpoulpi undo restore <id>`. Codice di uscita 2 quando non si può fare (il JSON ne indica il motivo)"
