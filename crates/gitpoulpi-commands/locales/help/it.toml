treat = "Fa trattare a git i file come binari o come testo, scrivendo una regola `.gitattributes` (`binary` o `text diff`) per i percorsi: il file nella radice del repository per impostazione predefinita, `--file` per quello di una cartella o `.git/info/attributes` (solo questo clone). Una regola che nomina già lo stesso pattern viene riscritta, non contraddetta. La risposta dice se git ora tratta davvero i percorsi così (`effective`). Annullabile con `gitpoulpi undo`, tranne per `.git/info/attributes`"
