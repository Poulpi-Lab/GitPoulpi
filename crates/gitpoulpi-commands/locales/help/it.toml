"rewrite scan-secrets" = "Cerca segreti nella cronologia: prefissi noti di token (GitHub, GitLab, Slack, AWS, Stripe, npm, Google, OpenAI, Anthropic), blocchi di chiavi private, JWT, password negli URL e righe `password = valore` che sembrano casuali. Stampa per ogni risultato la regola, il file, il primo e l'ultimo commit, i conteggi e un'anteprima OSCURATA (`ghp_****abcd`); il valore non viene mai stampato, registrato né salvato. Non è esaustiva. Un segreto già inviato è compromesso: sostituiscilo subito. Solo lettura"
