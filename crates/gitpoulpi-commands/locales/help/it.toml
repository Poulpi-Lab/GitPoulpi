rm-file = "Elimina file (o directory) dalla working tree; l'indice resta intatto, quindi un file tracciato appare come modifica eliminata. Annullabile con `gitpoulpi undo`, che ripristina i byte esatti"
"rewrite apply --target" = "La cartella del nuovo repository quando il piano estrae una sottocartella come clone o come submodule (vedi `--extract-mode`)"
"rewrite maps" = "Le mappe `commit-map` e `ref-map` dell'esecuzione (formato di git-filter-repo: una riga di intestazione, poi `vecchio nuovo` per riga; la pulizia del repository di GitLab usa la mappa dei commit). Stampa i loro percorsi, oppure le copia in `--out`"
"rewrite maps --out" = "Copia entrambi i file in questa cartella (creata se manca)"
"rewrite maps --run" = "L'id dell'esecuzione; `latest` (predefinito) è l'ultima applicata"
"rewrite note" = "La nota da mandare a chi ha la vecchia cronologia: per ogni branch e tag inviato, la vecchia e la nuova punta e cosa eseguire (`git fetch`, poi `git reset --hard origin/<branch>` oppure `git rebase --onto`). Solo lettura"
"rewrite note --run" = "L'id dell'esecuzione; `latest` (predefinito) è l'ultima applicata"
"rewrite preview --extract" = "Regola sui percorsi: tiene solo questa sottocartella, che diventa la radice; i commit che non la toccano vengono scartati e i merge semplificati. Viene chiesto ogni volta: indica `--extract-mode`, altrimenti il codice di uscita è 3 e non viene mostrata alcuna anteprima. L'estrazione avviene prima delle altre opzioni sui percorsi"
"rewrite preview --extract_mode" = "Come termina `--extract`: `clone` (un nuovo clone locale in `--target`, l'originale non viene toccato; con ogni branch e tag locale), `in-place` (la cronologia di questo repository viene riscritta, con una voce di annullamento) o `submodule` (il clone come in `clone`, e un nuovo commit sul branch corrente sostituisce la cartella con un submodule che lo punta; questa cronologia resta)"
"rewrite preview --into_subdir" = "Regola sui percorsi: sposta l'intero repository in questa sottocartella in ogni commit (per unire repository senza conflitti di percorso)"
"rewrite preview --move_paths" = "Regola sui percorsi `DA=A`: rinomina un file o una cartella in ogni commit, con gli stessi blob e tree al nuovo percorso (ripetibile, in ordine, dopo le regole sul contenuto). Un commit in cui `A` esiste già non viene modificato: l'anteprima viene rifiutata (codice di uscita 2, `path_collision`) ed elenca i commit e i percorsi"
"rewrite preview --target" = "La cartella del nuovo repository per `--extract-mode clone` o `submodule`: non deve esistere o deve essere vuota, e non deve trovarsi dentro questo repository. Usata da `rewrite run`; `rewrite apply` ha la propria"
"rewrite push" = "Invia i ref spostati da un'esecuzione applicata che erano su un remote, ciascuno con `--force-with-lease=<ref>:<l'id che il remote aveva durante l'anteprima>` (mai un force semplice), con un push `--atomic` per remote dove il server lo consente (altrimenti un push per ref, e la risposta lo dice). I tag sono inclusi. I branch protetti (`rewrite.protected_branches`) restano esclusi, a meno che non siano indicati con `--include-protected` o tutti insieme con `--include-all-protected`. Un ref il cui remote è cambiato dopo l'anteprima viene rifiutato per quel ref (fai un fetch, controlla, poi riesegui). Non annullabile: il remote mantiene la nuova cronologia anche se fai `undo` della riscrittura in locale. Senza `--yes` (o con `--dry-run`) non viene inviato nulla: la risposta elenca cosa verrebbe inviato e il codice di uscita è 3 senza `--yes`. Codice di uscita 2 se l'esecuzione non esiste più, 4 se un ref è stato rifiutato o non è stato inviato"
"rewrite push --dry_run" = "Chiede al remote cosa succederebbe (lease verificati) e non invia nulla"
"rewrite push --include_all_protected" = "Invia anche tutti i branch protetti dell'esecuzione"
"rewrite push --include_protected" = "Invia anche questo branch protetto (ripetibile)"
"rewrite push --no_atomic" = "Un push per ref invece di un unico push `--atomic` tutto o niente"
"rewrite push --remote" = "Solo i ref di questo remote"
"rewrite push --run" = "L'id dell'esecuzione stampato da `rewrite apply`; `latest` (predefinito) è l'ultima applicata"
"rewrite push --yes" = "Procede con l'invio. Senza, non viene inviato nulla (codice di uscita 3)"
"rewrite purge" = "Elimina definitivamente da questo clone la vecchia cronologia di una riscrittura: rimuove gli ancoraggi di annullamento della riscrittura (e di ogni operazione precedente i cui ancoraggi tengono in vita la vecchia cronologia), fa scadere le voci del reflog che la nominano, elimina gli oggetti (`gc --prune=now`) e verifica che siano spariti. Per quelle operazioni l'annullamento non è più possibile (restano in `undo --list` come eliminate). Una volta avviata non si può interrompere né annullare. Tutto ciò che trattiene ancora la vecchia cronologia (un branch fuori dalla riscrittura, uno stash, l'HEAD di un altro worktree, un ref di tracciamento remoto: fai un fetch dopo il push) la blocca e non viene modificato nulla. Non viene inviato nulla ad alcun remote; la risposta elenca i passi che servono sull'host (GitHub, GitLab, Azure DevOps, Bitbucket). Senza `--yes` non succede nulla: la risposta dice cosa verrebbe eliminato e perso, e il codice di uscita è 3. Codice di uscita 2 se la voce non è una riscrittura, 4 se qualcosa la blocca o restano degli oggetti. Via MCP solo con `[mcp] allow_history_purge = true`"
"rewrite purge --all" = "Ogni riscrittura della cronologia presente nella cronologia di annullamento"
"rewrite purge --entries" = "Una voce di riscrittura della cronologia di annullamento (`undo --list`; ripetibile). Predefinito: l'ultima riscrittura non ancora eliminata"
"rewrite purge --latest" = "L'ultima riscrittura non ancora eliminata (il predefinito)"
"rewrite purge --yes" = "Procede con l'eliminazione. Senza, non viene modificato nulla (codice di uscita 3)"
"rewrite run --extract" = "Regola sui percorsi: tiene solo questa sottocartella, che diventa la radice; i commit che non la toccano vengono scartati e i merge semplificati. Viene chiesto ogni volta: indica `--extract-mode`, altrimenti il codice di uscita è 3 e non viene mostrata alcuna anteprima. L'estrazione avviene prima delle altre opzioni sui percorsi"
"rewrite run --extract_mode" = "Come termina `--extract`: `clone` (un nuovo clone locale in `--target`, l'originale non viene toccato; con ogni branch e tag locale), `in-place` (la cronologia di questo repository viene riscritta, con una voce di annullamento) o `submodule` (il clone come in `clone`, e un nuovo commit sul branch corrente sostituisce la cartella con un submodule che lo punta; questa cronologia resta)"
"rewrite run --into_subdir" = "Regola sui percorsi: sposta l'intero repository in questa sottocartella in ogni commit (per unire repository senza conflitti di percorso)"
"rewrite run --move_paths" = "Regola sui percorsi `DA=A`: rinomina un file o una cartella in ogni commit, con gli stessi blob e tree al nuovo percorso (ripetibile, in ordine, dopo le regole sul contenuto). Un commit in cui `A` esiste già non viene modificato: l'anteprima viene rifiutata (codice di uscita 2, `path_collision`) ed elenca i commit e i percorsi"
"rewrite run --target" = "La cartella del nuovo repository per `--extract-mode clone` o `submodule`: non deve esistere o deve essere vuota, e non deve trovarsi dentro questo repository. Usata da `rewrite run`; `rewrite apply` ha la propria"
"rm-file --paths" = "Percorsi relativi al repository da eliminare"
shell-init = """Stampa una funzione wrapper per la shell (nome predefinito `gp`) che esegue gitpoulpi e, quando esci con "Esci e cd qui", lascia la tua shell nella cartella della scheda attiva. Aggiungila al file rc della tua shell: `eval "$(gitpoulpi shell-init bash)"`. Non viene installato né modificato nulla"""
