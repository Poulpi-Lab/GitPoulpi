"rewrite script test --params" = "Un parametro `NAME=VALUE` (ripetibile)"
"rewrite preview --script_language" = "Il linguaggio di ogni `--script`: `lua` (integrato, isolato), `shell`, `python` o `lua-external`. Predefinito: in base all'estensione del file (`.lua`; `.sh`, `.bash`, `.ps1`; `.py`), altrimenti `lua`. Python e Lua esterno vanno attivati in `rewrite.external_scripts`"
"rewrite preview --trust" = "Considera attendibili gli script esterni (shell, Python, Lua esterno) di questa ricetta, in base al loro contenuto: viene ricordato per questo repository e richiesto di nuovo se uno script cambia. È una decisione di una persona: il server MCP la rifiuta, e un agente può eseguire solo script che una persona ha ritenuto attendibili"
"rewrite run --script_language" = "Il linguaggio di ogni `--script`: `lua` (integrato, isolato), `shell`, `python` o `lua-external`. Predefinito: in base all'estensione del file (`.lua`; `.sh`, `.bash`, `.ps1`; `.py`), altrimenti `lua`. Python e Lua esterno vanno attivati in `rewrite.external_scripts`"
"rewrite run --trust" = "Considera attendibili gli script esterni (shell, Python, Lua esterno) di questa ricetta, in base al loro contenuto: viene ricordato per questo repository e richiesto di nuovo se uno script cambia. È una decisione di una persona: il server MCP la rifiuta, e un agente può eseguire solo script che una persona ha ritenuto attendibili"
"rewrite script check --language" = "`lua`, `shell`, `python` o `lua-external`; predefinito in base all'estensione"
"rewrite script check --trust" = "Considera prima attendibile questo script (decisione di una persona, rifiutata via MCP)"
"rewrite script check#long" = """
Compila uno script Lua e stampa la sua intestazione (nome, finestra, parametri), le funzioni che definisce e ogni problema. Codice di uscita 2 se ci sono problemi. Solo lettura; nessuno script viene eseguito su un commit.

Per uno script shell, Python o Lua esterno (non isolato) dice anche se l'interprete è stato trovato e se lo script è attendibile; per uno attendibile fa una stretta di mano di prova: avvia lo script una volta con un commit inventato (`"dry_run": true`) e controlla la risposta. Uno script non attendibile non viene mai avviato.
"""
"rewrite script test --language" = "`lua`, `shell`, `python` o `lua-external`; predefinito in base all'estensione"
"rewrite script test --trust" = "Considera prima attendibile questo script (decisione di una persona, rifiutata via MCP)"
"rewrite script trust" = "Considera attendibile uno script esterno (shell, Python, Lua esterno) in base al suo contenuto: lo SHA-256 del file viene ricordato per questo repository, così lo script può essere eseguito (anteprima, run, test); se il file cambia, viene richiesto di nuovo. Questi script non sono isolati: vengono eseguiti con i tuoi permessi, quindi leggi prima il file. Può farlo solo una persona: non esiste uno strumento MCP per questo"
"rewrite script trust --file" = "Il file dello script"
"rewrite tools" = "Quali strumenti richiedono le funzioni di riscrittura (gpg / ssh-keygen / gpgsm per rifirmare, interpreti di script, git-lfs) e se ciascuno è stato trovato. Solo lettura"
"rewrite tools --fresh" = "Controlla di nuovo invece di rispondere dalla cache di un minuto"
"mailmap" = "Il `.mailmap`: un nome e un'e-mail canonici per chi ha fatto commit con più identità. Il Log, blame e la cronologia del file mostrano i nomi associati (`log.use_mailmap`) senza toccare alcun commit. `list` conta le identità della cronologia e mostra quali sono associate, `check` mostra come si risolvono alcune identità, `add` unisce più identità in una aggiungendo righe al `.mailmap` (modificato, non committato; annullabile)"
"mailmap add" = "Unisce più identità in un'unica identità canonica aggiungendo righe al `.mailmap` (creato se manca; una riga già presente non viene ripetuta). Il file viene modificato, non committato: fai tu il commit. Una sola voce annullabile (`gitpoulpi undo` ripristina il file precedente). Il Log mostra subito l'identità canonica (`log.use_mailmap`); i commit salvati non cambiano, quindi non serve alcun force push. Per riscrivere i commit stessi usa una regola `mailmap` in `rewrite`"
"mailmap add --canonical" = "L'identità da mantenere, `Nome <e-mail>`"
"mailmap add --file" = "Il `.mailmap` da scrivere, relativo alla radice del repository (predefinito: il `.mailmap` nella radice)"
"mailmap add --from" = "Un'identità da associare ad essa, `Nome <e-mail>` (ripetibile, almeno una)"
"mailmap check" = "Mostra come compaiono le identità (`Nome <e-mail>`, oppure `<e-mail>`) attraverso il `.mailmap` del repository: nome ed e-mail canonici, oppure la stessa identità se nulla la associa. Solo lettura"
"mailmap check --identities" = "Le identità da risolvere, ciascuna `Nome <e-mail>` oppure `<e-mail>`"
"mailmap list" = "Elenca ogni nome ed e-mail che ha creato o registrato un commit dell'ambito, con il numero di commit di ciascuno come autore e come committer, prima quelli con più commit, e l'identità a cui il `.mailmap` già lo associa (`mapped_to`). Solo lettura"
"mailmap list --all_local" = "Ogni branch e tag locale invece del branch corrente"
"mailmap list --mapped" = "Solo le identità che il `.mailmap` già associa"
"mailmap list --refs" = "Solo questi branch o tag locali (ripetibile)"
"mailmap list --unmapped" = "Solo le identità che il `.mailmap` non associa"
"rewrite preview --mailmap" = "Regola mailmap: riscrive autori e committer con i nomi indicati dal `.mailmap` del worktree (alla fine la cronologia mostra ciò che mostra `git log --use-mailmap`). `--who` sceglie autore, committer o entrambi. Per una correzione solo di visualizzazione, senza riscrivere, usa invece `mailmap add`"
"rewrite preview --mailmap_file" = "Con `--mailmap`: applica questo file invece del `.mailmap` del worktree (relativo alla radice del repository, oppure assoluto)"
