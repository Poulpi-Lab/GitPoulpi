"rewrite check-signing" = "Firma una volta un contenuto fittizio con la configurazione di firma del repository (`gpg.format`, `user.signingkey`, `gpg.*.program`) e la verifica, come prova prima di un'esecuzione che rifirma (`--signatures resign-signed` o `resign-all`). Stampa il programma, se funziona e quanto è durata una firma (moltiplica per i commit da rifirmare per la stima). Può aprire una richiesta di passphrase. Termina con codice 2 se non funziona, indicando il motivo (`tool_missing` o `signing_failed`)"
