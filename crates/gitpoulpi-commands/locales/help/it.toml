ai = "Assistenti IA (disattivati se non `ai.enabled = true`): stampa un messaggio di commit generato, oppure spiega un commit o le modifiche in corso"
"ai --print_sent" = "Stampa ciò che verrebbe inviato al modello (il testo di sistema e dell'utente dopo l'oscuramento dei segreti e l'esclusione dei file sensibili) senza inviare nulla. Richiede `ai.enabled = true`, ma nessuna chiave e nessuna rete"
"ai --send_all" = "Invia ogni input per intero, anche oltre il suo limite `ai.limits.*`. Senza, un input oltre un limite viene troncato (un conflitto viene rifiutato) e la risposta dice cosa è stato tagliato in `truncated: [{part, detail?, bytes, limit, setting}]`"
"commit --send_all" = "Con `--ai`: invia l'intero diff anche oltre `ai.limits.diff_bytes`. Senza, un diff più grande viene troncato e la risposta lo dice (`truncated`)"
"hosting review suggest --send_all" = "Invia ogni input per intero, anche oltre il suo limite `ai.limits.*` (il diff, il diff di un file, la descrizione, i commenti esistenti, i file di contesto). Senza, un input oltre un limite viene troncato e la risposta dice cosa è stato tagliato in `truncated`"
"stash push --send_all" = "Con `--ai`: invia l'intero diff anche oltre `ai.limits.diff_bytes`. Senza, un diff più grande viene troncato e la risposta lo dice (`truncated`)"
"ai commit-message" = "Stampa il messaggio di commit proposto dall'IA per le modifiche in stage (o per tutte le modifiche se nulla è in stage). Non crea alcun commit"
"ai explain" = "Spiega un commit (predefinito HEAD) oppure, con --wip, le modifiche in corso"
"ai resolve-conflict" = "Stampa la risoluzione suggerita dall'IA per UN conflitto di merge di un file in conflitto (`--conflict N`, da 1; facoltativo quando il file ha un solo conflitto). Stampa soltanto: nulla viene scritto o messo in stage, quindi decide chi chiama (`conflicts resolve --content-file` applica un risultato per l'intero file). Richiede `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Quale conflitto del file, da 1"
"ai resolve-conflict --path" = "Il file in conflitto, relativo alla radice del repository"
autostash = "L'auto-stash in sospeso: GitPoulpi ha messo da parte modifiche locali per eseguire un checkout, merge, rebase o pull e non le ha ancora rimesse"
"ai review-context" = "Mostra o imposta ciò che una bozza di revisione del codice ✦ riceve oltre al diff (`[ai.review]`): il CLAUDE.md e l'AGENTS.md del repository, un file in più (un percorso o un link) e se un agente locale viene eseguito nel repository. Senza `--repo` né `--project` è il valore predefinito globale; `--repo PATH` è il valore proprio di un repository clonato, `--project HOST/PROJECT` quello di un repository non clonato. Senza un flag di impostazione stampa i valori (`effective` è ciò che riceve una revisione); con uno lo salva e stampa il risultato. Non richiede alcun modello e funziona anche con l'IA disattivata"
"ai review-context --agents_md" = "Fornisce al modello l'AGENTS.md del repository"
"ai review-context --claude_md" = "Fornisce al modello il CLAUDE.md del repository"
"ai review-context --context_file" = "Un file in più: un percorso relativo alla radice del repository, un percorso assoluto o un link a un file di un host di codice"
"ai review-context --no_context_file" = "Nessun file in più"
"ai review-context --no_extra_file" = "Nessun file in più per il repository o il progetto, qualunque cosa dica il valore globale (`on`, il valore predefinito se dato da solo); `off` fa seguire di nuovo il valore globale"
"ai review-context --project" = "Un repository non clonato, come `HOST/PROJECT` (`github.com/owner/name`)"
"ai review-context --reset" = "Con `--repo` o `--project`: dimentica i valori propri del repository (torna a seguire quelli globali) prima di applicare i flag"
"ai review-context --run_in_repo" = "Esegue un agente locale nel repository (`yes`), non lì (`no`) o come dice il suo profilo IA (`profile`). Non per `--project`"
"autostash start-over" = "Ricomincia: scarta le modifiche della working tree sui file dello stash (una copia resta sotto `refs/gitpoulpi-backup/`), annulla l'operazione che ha fatto l'auto-stash (pull, checkout, merge, rebase), poi fa il pop dello stash sul commit originale. Si ferma con lo stash intatto se un passaggio fallisce. Codice di uscita 1 se rifiutato, 3 quando serve `--yes`"
"autostash start-over --dry_run" = "Mostra cosa succederebbe senza cambiare nulla"
"autostash start-over --yes" = "Procede; senza non cambia nulla e il codice di uscita è 3"
blame = "Attribuzione riga per riga di un file a una revisione"
"blame --at" = "Revisione su cui fare il blame (predefinita: HEAD)"
"branch delete-remote" = "Elimina un branch da un remote, mantenendo l'eventuale branch locale con lo stesso nome"
"branch fast-forward" = "Sposta `<branch>` in avanti fino a `<target>`, solo se è un fast-forward (una cronologia divergente viene rifiutata, nulla si sposta). Il branch con checkout porta con sé la working tree, come `git merge --ff-only`; per qualsiasi altro branch viene solo spostato il riferimento"
"branch fast-forward --target" = "Qualsiasi revisione (predefinita: HEAD)"
"branch set-upstream" = "Fa tracciare `<upstream>` (`origin/main`) a `<branch>`"
"branch track" = "Crea un branch locale che traccia un branch di tracciamento remoto e ne fa il checkout. `<upstream>` si scrive come nell'elenco dei riferimenti (`origin/feature/login`); `--name` ha come predefinito la parte del branch"
"branch unset-upstream" = "Rimuove l'upstream di `<branch>`"
"checkout --autostash" = "Mette in stash le modifiche locali che lo bloccano, esegue l'operazione, poi ripristina lo stash (ciò che fa `general.auto_stash = \"always\"`)"
"cherry-pick --commits" = "Commit da applicare, in ordine. Omesso quando è indicato `--plan`"
"cherry-pick --plan" = "Un `Vec<RebaseStep>` JSON (stessa forma di `rebase --plan`; vedi `rebase-plan`), da un percorso di file o `-` per stdin: i passaggi vengono applicati con cherry-pick nell'ordine della lista. Hanno senso solo le azioni `Pick` e `Drop` (`Drop` salta il commit); ogni altra azione viene rifiutata. Non può essere combinato con commit posizionali"
"clone --branch" = "Esegue il checkout di questo branch invece dell'HEAD predefinito del remote"
"clone --depth" = "Tronca la cronologia a questo numero di commit (`git clone --depth`)"
"clone --no_lfs" = "Lascia i file Git LFS come puntatori invece di scaricarne il contenuto dopo il clone"
"clone --origin" = "Dà al nuovo remote un nome diverso da `origin`"
"clone --recurse_submodules" = "Clona anche i submodule"
"commit --ai" = "Lascia che l'IA scriva il messaggio a partire dal diff in stage, usando le istruzioni per i messaggi di commit del repository (Impostazioni > IA). Richiede `ai.enabled = true` e un profilo configurato"
"commit --message" = "Il messaggio di commit. Obbligatorio a meno che non lo scriva --ai"
"commit --no_verify" = "Salta gli hook di commit (`pre-commit`, `commit-msg`), come `commit --no-verify`"
completions = "Stampa su stdout uno script di completamento per la shell (bash, zsh, fish, powershell o elvish), ad es. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Interrompe l'operazione in corso: HEAD, indice e working tree tornano allo stato precedente. Scarta le risoluzioni fatte nel frattempo"
"conflicts skip" = "Salta il cherry-pick o il revert in corso (o il commit su cui si è fermato un rebase): HEAD, indice e working tree tornano a HEAD. La via d'uscita quando è diventato vuoto (la modifica è già applicata). Un merge non ha nulla da saltare"
"conflicts check" = "Un merge di HEAD nel branch da cui è partito andrebbe in conflitto, e su quali file? Non viene toccato nulla (un merge in memoria). La base è la destinazione della pull request nota del branch, altrimenti il branch ammesso dai pattern dei branch base con meno commit dal punto di diramazione. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Disattivato quando `general.conflict_detection` o l'interruttore del repository è spento"
"conflicts list" = "I file in conflitto, ciascuno con il testo dei suoi tre lati. Con `--names-only`: solo il percorso, il tipo di conflitto e gli oid degli stage (nessun blob viene letto; economico su un merge grande)"
"conflicts resolve" = "Risolve un file e lo mette in stage (il file smette di essere in conflitto). Esattamente uno tra `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` o `--delete`. A e \"ours\" sono il lato corrente (`HEAD`; durante un rebase, il branch su cui si fa il rebase), B e \"theirs\" il lato in arrivo. Non modificare mai a mano i marcatori di conflitto: scegli, oppure scrivi il testo finale in un file"
"conflicts resolve --both" = "Mantiene entrambi i lati di ogni conflitto (A poi B), e il merge di git ovunque altro"
"conflicts resolve --content_file" = "Il testo finale del file, esattamente (`-` legge lo standard input)"
"conflicts resolve --delete" = "Accetta l'eliminazione: rimuove il file (`git rm`)"
"conflicts resolve --encoding" = "Con `--content-file`: scrive il testo in questa codifica (un'etichetta WHATWG come `windows-1252`) invece di UTF-8"
"conflicts resolve --expect" = "Gli oid degli stage su cui è stata presa la decisione, `base,ours,theirs` (usa `-` per uno stage mancante). La chiamata viene rifiutata come `stale` quando l'indice non contiene più esattamente questi. `--both` e `--pick` controllano sempre gli stage che leggono"
"conflicts resolve --no_stage" = "Scrive il file nella working tree ma lo lascia in conflitto (un semplice salvataggio)"
"conflicts resolve --ours" = "Come `--side ours`"
"conflicts resolve --pick" = "Una scelta per numero di conflitto: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = entrambi in quell'ordine). Ogni conflitto ne richiede una, a meno che `--default` non copra il resto"
"conflicts resolve --pick_default" = "Con `--pick`: la scelta per ogni conflitto non elencato"
"conflicts resolve --side" = "Prende l'intero file da uno stage, senza auto-merge"
"conflicts resolve --theirs" = "Come `--side theirs`"
"conflicts resolve --theirs_first" = "Con `--both`: B poi A"
"conflicts show" = "Un file in conflitto come lo vede l'editor di merge: le etichette dei pannelli, i tre lati e le regioni di conflitto numerate (`--json` è il documento completo). Le regioni unite che git ha risolto da solo non sono elencate; restano nel risultato di `resolve --both`/`--pick`"
"conflicts show --conflict" = "Solo il conflitto N (da 1)"
"conflicts state" = "Il merge, rebase, cherry-pick o revert in corso (`null` se nessuno)"
"conflicts unresolve" = "Riporta in conflitto un file risolto durante questa operazione (di nuovo con i marcatori). Rifiutato quando è ancora in conflitto o non è stato risolto mentre l'operazione era in corso"
daemon = "`gitpoulpi server ...` è un alias visibile - il proprietario chiama questo gruppo \"il server\" e digita `gp server stop`"
"daemon restart" = "`daemon stop` seguito da `daemon start`"
"daemon run" = "Esegue il daemon di questa sessione in primo piano (bloccante; Ctrl-C per fermarlo, oppure un `daemon stop`/`daemon restart` inviato da altrove). È ciò che `daemon start` avvia in background, e che un terminale dedicato può anche eseguire direttamente"
"daemon start" = "Avvia il daemon di questa sessione come processo in background scollegato (oppure segnala che è già in esecuzione). `--backend` fissa il backend che il processo avviato deve usare; se omesso, il processo avviato risolve da solo `general.default_backend`"
"daemon status" = "Se il daemon di questa sessione è in ascolto e, in tal caso, la sua porta, PID, uptime, backend e versione di build"
"daemon stop" = "Chiede al daemon di questa sessione di arrestarsi in modo ordinato, ripiegando sull'uccisione del PID registrato solo se non risponde in tempo e solo se è un daemon autonomo (mai uno incorporato in una TUI in esecuzione)"
"daemon stop --all" = "Ferma il daemon di ogni sessione per cui `session list` riporta un file di porta, non solo questa"
discard = "Scarta le modifiche *non in stage* di un file nell'albero di lavoro: un hunk (`--hunk`), alcune sue righe (`--hunk --lines`) oppure - con il solo `--file` - ogni modifica non committata al file, comprese quelle in stage (un file non tracciato viene eliminato). Hunk e righe sono numerati come li numera `gitpoulpi diff --json` per il diff non in stage. Tutto ciò che viene scartato è conservato in uno snapshot di sicurezza, quindi `gitpoulpi undo` lo ripristina (file non tracciati inclusi). Senza conferma: questa è la superficie per gli script"
"discard --lines" = "Indici di riga separati da virgola all'interno di `--hunk`"
"fetch --all" = "Esegue il fetch di ogni remote configurato"
"fetch --prune" = "Elimina i branch di tracciamento remoto che il remote non ha più"
"fetch --prune_tags" = "Elimina anche i tag locali che il remote ha eliminato (solo i tag che erano su di esso: un tag mai inviato resta). È `fetch.pruneTags` di Git, ma più mirato; disattivato salvo richiesta"
"fetch --remote" = "Se omesso: il remote predefinito del repository (vedi `remote default`)"
gitpoulpi = "Client Git TUI leggero e multipiattaforma, scriptabile via CLI/MCP."
"gitpoulpi --add" = "Apre una cartella in una nuova scheda del GitPoulpi già avviato, invece di avviarne un altro (`gp -a`, `gp --add ../altra`). PATH è per impostazione predefinita la cartella corrente e si risolve nel repository che la contiene. Una sessione avviata: riceve la scheda e la sua finestra passa in primo piano se il desktop lo consente. Più sessioni: ne scegli una da un elenco numerato (o passi `--session NOME`). Nessuna: GitPoulpi si avvia normalmente, su quella cartella. Non accetta sottocomandi; con `--json` stampa un oggetto (`action` è `joined` o `cancelled`), codice di uscita 0 quando la scheda è aperta, 3 quando una finestra occupata l'ha proposta nel chip della sua barra di stato"
"gitpoulpi --no_raise" = "Con `--add`: non chiede alla finestra di portare il suo terminale in primo piano"
"gitpoulpi --backend" = "Su quale `GitBackend` gira il daemon di questo comando, sovrascrivendo `general.default_backend` in config.toml e `GITPOULPI_GENERAL_DEFAULT_BACKEND` (i flag sono al vertice della scala di precedenza - vedi docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
Su quale `GitBackend` gira il daemon di questo comando, sovrascrivendo `general.default_backend` in config.toml e `GITPOULPI_GENERAL_DEFAULT_BACKEND` (i flag sono al vertice della scala di precedenza - vedi docs/user/config-reference.md).

Seleziona il backend per un daemon che questo comando *avvia*. Una sessione il cui daemon è già in esecuzione mantiene il backend con cui quel daemon è stato costruito; `gitpoulpi` non ha modo di sostituire il backend di un daemon attivo sotto i client già sottoscritti, e fingere il contrario sarebbe lo stesso silenzioso non-effetto che questo flag esiste per evitare."""
"gitpoulpi --cwd_file" = """File in cui la TUI scrive la cartella della scheda attiva quando esce ("Esci e cd qui", o sempre con `ui.tab_dir_follow = "auto"`). Pensato per il wrapper stampato da `gitpoulpi shell-init`; ignorato da ogni sottocomando, dato che solo la TUI ha le schede"""
"gitpoulpi --json" = "Emette JSON strutturato invece dell'output leggibile"
"gitpoulpi --lang" = "Lingua del testo di `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
Lingua del testo di `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Vengono tradotte solo le spiegazioni - i nomi di comandi e flag non cambiano mai - e `--help` resta in inglese a meno che questo flag sia indicato (l'ambiente viene ignorato di proposito, così gli script ottengono un output stabile). Esempio: `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Repository su cui agire. Per impostazione predefinita è il repository che contiene la directory corrente, quindi `gitpoulpi status` si comporta come `git status`; un agente che pilota più repository passa questo flag invece di fare chdir"
"gitpoulpi --session" = "Sessione con nome da usare. Se omesso, deriva dalla radice del repository corrente (vedi `gitpoulpi_config::default_session_name`), quindi due repository ottengono due daemon indipendenti mentre tutto ciò che si apre dentro un repository ne condivide uno. Passalo per forzare due repository su una sessione, o per dare un nome esplicito a una sessione. Il valore viene ripulito prima dell'uso - diventa un nome di file"
"hosting checkout-pr" = "Esegue il checkout di una pull/merge request, anche da un fork: scarica la sua head (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) nel branch locale `pr/<n>` (`mr/<n>` su GitLab), lo traccia e vi passa"
"hosting checkout-pr --id" = "Quale integrazione (vedi `hosting prs`)"
"hosting checkout-pr --no_checkout" = "Esegue solo il fetch e crea/aggiorna il branch; resta dove sei"
"hosting checkout-pr --number" = "Il numero della PR (GitHub) o l'`iid` della MR (GitLab)"
"hosting checkout-pr --remote" = "Il remote su cui si trova la richiesta. Per impostazione predefinita quello da cui è stato risolto il progetto, altrimenti quello predefinito del repository"
"hosting clone" = "Clona un progetto da `projects` tramite il suo percorso completo, risolvendo l'URL di clone attraverso l'host invece di far incollare un URL all'utente"
"hosting clone --https" = "Clona via HTTPS invece che SSH"
"hosting clone --project" = "Il percorso completo del progetto, come lo stampa `hosting projects`"
"hosting edit-url" = "Stampa l'URL in cui si modifica una pull/merge request (la vista `.../edit` di GitLab; GitHub modifica direttamente nella pagina della richiesta). Con un numero, quella richiesta; altrimenti quella per `--branch` (predefinito: il branch con checkout). Segue il collegamento del repository alla pull/merge request come `prs`. Avvia il browser solo con `--open`"
"hosting edit-url --branch" = "Trova la richiesta dal suo branch di origine"
"hosting edit-url --number" = "Il numero della richiesta (`53` per `!53` / `#53`)"
"hosting edit-url --open" = "Apre anche l'URL nel browser di sistema"
"hosting file" = "Legge un file di un progetto a una revisione tramite l'API dell'host, senza clone: il testo così com'è, gli altri byte in base64 (`encoding`). Esce con codice 1 e un errore se il file non esiste a quella revisione"
"hosting file --id" = "Quale integrazione (vedi `hosting list`); facoltativa quando ce n'è una sola configurata"
"hosting file --path" = "Il percorso dentro il progetto, come `CLAUDE.md` o `src/main.rs`"
"hosting file --project" = "Il progetto: `owner/name` su GitHub, `group/sub/project` su GitLab"
"hosting file --rev" = "La revisione: un branch, un tag o un commit. Predefinita: il branch predefinito del progetto"
"hosting integrations" = "Gestisce i profili di integrazione configurati (`[[integrations]]`)"
"hosting integrations add" = "Aggiunge un profilo di qualsiasi tipo che abbia un client"
"hosting integrations add --id" = "Per impostazione predefinita il nome del tipo (`gitlab`, `gitlab-2`, ...)"
"hosting integrations add --kind" = "`github`, `github_enterprise`, `gitlab`, `gitlab_self_managed`, `azure_devops`, `azure_devops_server`, `bitbucket`, `jira_cloud`, `jira_data_center`, `trello`, `gitea`, `forgejo`, `linear`, `youtrack`, `redmine`, `gerrit` o `local_markdown`"
"hosting integrations add --name" = "Nome visualizzato"
"hosting integrations add --url" = "La radice web dell'istanza. Obbligatoria per i tipi self-managed e Jira"
"hosting integrations list" = "I profili configurati, senza i loro token"
"hosting integrations radar" = "Mostra o modifica le impostazioni del Radar di un profilo (`[integrations.radar]`): quali elenchi a livello di account recuperano `hosting radar` e il Radar, i namespace in cui cercare e cosa fa la revisione di una richiesta non clonata. Senza opzioni stampa solo le impostazioni attuali"
"hosting integrations radar --assigned_issues" = "Issue aperte assegnate a te, in ogni repository"
"hosting integrations radar --clear_namespaces" = "Dimentica i namespace salvati: il tuo più tutte le appartenenze"
"hosting integrations radar --id" = "Il profilo"
"hosting integrations radar --include_drafts" = "Mantiene le richieste in bozza negli elenchi dell'account"
"hosting integrations radar --namespaces" = "Un namespace (organizzazione, gruppo) in cui cercare le richieste aperte; ripeti il flag o separa con virgole. Sostituisce l'elenco salvato"
"hosting integrations radar --open_requests" = "Ogni richiesta aperta dei tuoi namespace"
"hosting integrations radar --review_mode" = "Cosa fa la revisione di una richiesta non clonata"
"hosting integrations radar --review_requests" = "Richieste in attesa della tua revisione, in ogni repository"
"hosting integrations remove" = "Rimuove un profilo ed elimina il suo token memorizzato"
"hosting integrations test" = "Verifica il token del profilo sul suo host: utente, scope, scadenza"
"hosting issue" = "Crea issue nel progetto collegato al repository corrente"
"hosting issue create" = "Apre una issue nel progetto a cui è collegata la sorgente ISSUES del repository (`hosting link issues`), o in quello che `--id` risolve dal remote. Azione verso l'esterno: pubblica sull'host"
"hosting issue create --body" = "La descrizione della issue"
"hosting issue create --body_file" = "Legge la descrizione da questo file (`-` legge stdin)"
"hosting issue create --id" = "Quale integrazione (vedi `hosting issues`)"
"hosting issue create --labels" = "Un'etichetta da applicare; ripeti il flag o separa con virgole"
"hosting issue create --title" = "Il titolo della issue"
"hosting issue create --web" = "Stampa la pagina di nuova issue precompilata dell'host invece di chiamare la sua API (nessun token)"
"hosting issues" = "Issue del progetto del repository corrente"
"hosting issues --assigned" = "Solo quelle assegnate a te"
"hosting board --id" = "Quale integrazione (vedi `hosting issues`)"
"hosting board move --column" = "Il nome della colonna, come lo stampa `hosting board`"
"hosting board move --id" = "Quale integrazione (vedi `hosting issues`)"
"hosting board move --reference" = "La card: il suo numero o il suo riferimento (`12`, `#12`, `ABC-12`, `AB#12`)"
"hosting board move" = "Sposta una card in una colonna: un cambio di stato, una transizione di workflow (Jira), uno stato di work item (Azure DevOps), una lista (Trello) o uno scambio di etichetta (GitHub, GitLab, Gitea, Forgejo). Uno spostamento per cui il provider non ha un percorso viene rifiutato con il motivo. Azione verso l'esterno: scrive sull'host"
"hosting board show --id" = "Quale integrazione (vedi `hosting issues`)"
"hosting board show" = "Le colonne della bacheca, ciascuna con le sue card. Sola lettura"
"hosting board" = "La bacheca delle issue del progetto collegato al repository corrente: le sue colonne con le loro card, le stesse colonne della bacheca della TUI (uno stato, una lista o un'etichetta per colonna). Senza sottocomando, equivale a `board show`"
"hosting link" = "Collega l'elenco delle pull/merge request o delle issue di questo repository a un profilo provider e a uno dei suoi repository, oppure lo scollega (senza flag, mostra il collegamento). `prs` / `issues` non scaricano nulla finché una sorgente non è collegata; è lo stesso collegamento salvato dalle sezioni della barra laterale della TUI (`pulls_source` / `issues_source` in `.gitpoulpi/repo-state.toml`)"
"hosting link --clear" = "Scollega l'elenco: nulla viene scaricato finché non viene ricollegato"
"hosting link --id" = "Il profilo da collegare. Senza `--project`, si usa il repository che i suoi remote indicano sull'host di quel profilo"
"hosting link --kind" = "Quale elenco"
"hosting link --project" = "Il repository del provider (`owner/name`, `group/sub/proj`)"
"hosting list" = "Le integrazioni configurate, senza i loro token"
"hosting login" = "Convalida un token e lo memorizza sotto il `token_ref` del profilo, salvando a chi appartiene. Il token si legge da stdin (`--token-stdin`), mai da un argomento, così resta fuori dalla cronologia della shell. Non esposto via MCP: un segreto non deve passare attraverso la trascrizione delle chiamate di strumento di un agente"
"hosting login --id" = "Quale integrazione. Facoltativo quando ne è configurata una sola"
"hosting login --token_stdin" = "Legge il token da stdin (obbligatorio; una riga, il newline finale è ignorato)"
"hosting logout" = "Elimina il token memorizzato del profilo e dimentica l'utente connesso; il profilo resta"
"hosting open" = "Stampa l'URL web di una pull request o issue del progetto del repository corrente. Avvia il browser di sistema solo con `--browser`"
"hosting open --browser" = "Apre anche l'URL nel browser di sistema"
"hosting pr" = "Apre una pull request (GitHub, Gitea, Forgejo, Bitbucket, Azure DevOps) o merge request (GitLab) da un branch del repository corrente"
"hosting pr --id" = "Quale integrazione (`[[integrations]] id`). Facoltativo quando ne è configurata una sola"
"hosting pr --source" = "Il branch da cui aprirla. Per impostazione predefinita il branch con checkout"
"hosting pr --target" = "Il branch verso cui aprirla. Per impostazione predefinita il branch predefinito del remote quando è determinabile, altrimenti `main`/`master` se uno dei due esiste"
"hosting pr --title" = "Per impostazione predefinita la riga di oggetto del commit in punta al branch di origine"
"hosting pr --web" = "Stampa l'URL di confronto/nuova richiesta invece di chiamare l'API dell'host. È anche ciò che accade automaticamente senza integrazione configurata per questo remote, o senza token per essa"
"hosting pr-for-branch" = "La pull/merge request che rappresenta meglio un branch (aperta, poi bozza, poi unita, poi chiusa; la più recente per prima)"
"hosting pr-for-branch --branch" = "Per impostazione predefinita il branch con checkout"
"hosting projects" = "Ogni progetto che il token dell'integrazione può vedere"
"hosting projects --filter" = "Sottostringa senza distinzione tra maiuscole e minuscole sul percorso del progetto"
"hosting projects --id" = "Quale integrazione (`[[integrations]] id`). Facoltativo quando ne è configurata una sola"
"hosting prs" = "Pull/merge request del progetto del repository corrente"
"hosting prs --id" = "Quale integrazione. Senza, si usa la sorgente di pull/merge request collegata al repository (vedi `hosting link`); un repository non collegato non scarica nulla. Con esso, il progetto che il remote di questo repository indica su quel profilo"
"hosting prs --mine" = "Solo quelle che hai aperto tu"
"hosting prs --review_requested" = "Solo quelle in attesa della tua revisione"
"hosting prs --state" = "`open` (predefinito), `closed` (include le unite) o `all`"
"hosting radar" = "Gli elenchi a livello di account per il Radar: le richieste in attesa della tua revisione, ogni richiesta aperta dei tuoi namespace e le issue assegnate a te, in tutti i repository di ciascun profilo (GitHub, GitLab, Gitea, Forgejo, Azure DevOps, Bitbucket Data Center, Gerrit), clonati o no. Senza `--what` decidono le impostazioni `[integrations.radar]` di ciascun profilo (vedi `hosting integrations radar`); la risposta viene riusata per cinque minuti salvo `--refresh`. Sola lettura"
"hosting radar --ids" = "Quale profilo; ripeti il flag per più profili. Senza, ogni profilo abilitato di un tipo supportato"
"hosting radar --include_drafts" = "Mantiene anche le richieste in bozza"
"hosting radar --refresh" = "Interroga l'host anche quando c'è una risposta recente in cache"
"hosting radar --what" = "Cosa elencare, qualunque cosa dicano le impostazioni del profilo: `review` (in attesa della tua revisione), `open` (ogni richiesta aperta), `issues` (assegnate a te) o `all`"
"hosting review comment --project" = "Rivede un progetto che non è il repository corrente (nessun clone necessario): `owner/name` su GitHub, `group/sub/project` su GitLab. `--id` indica poi l'integrazione, se ne sono configurate più d'una"
"hosting review diff" = "Il diff di una pull/merge request, file per file con i suoi hunk (`files[].diff.hunks`). In un repository recupera i ref della richiesta e ne fa il diff in locale; con `--api`, o con `--project` (nessun repository), legge invece il diff dall'API dell'host, che non richiede alcun clone. Un file di cui l'host ha omesso la patch (troppo grande) ha `omitted` impostato e nessun hunk"
"hosting review diff --api" = "Legge il diff dall'API dell'host anche dentro un clone"
"hosting review diff --file" = "Solo il diff di questo file"
"hosting review diff --id" = "Quale integrazione (vedi `hosting prs`)"
"hosting review diff --number" = "Il numero della PR (GitHub) o l'`iid` della MR (GitLab)"
"hosting review diff --project" = "Rivede un progetto che non è il repository corrente (nessun clone necessario): `owner/name` su GitHub, `group/sub/project` su GitLab. `--id` indica poi l'integrazione, se ne sono configurate più d'una"
"hosting review diff --remote" = "Il remoto su cui si trova la richiesta (solo diff locale). Predefinito: quello da cui è stato risolto il progetto, altrimenti quello predefinito del repository"
"hosting review reply --project" = "Rivede un progetto che non è il repository corrente (nessun clone necessario): `owner/name` su GitHub, `group/sub/project` su GitLab. `--id` indica poi l'integrazione, se ne sono configurate più d'una"
"hosting review resolve --project" = "Rivede un progetto che non è il repository corrente (nessun clone necessario): `owner/name` su GitHub, `group/sub/project` su GitLab. `--id` indica poi l'integrazione, se ne sono configurate più d'una"
"hosting review show --project" = "Rivede un progetto che non è il repository corrente (nessun clone necessario): `owner/name` su GitHub, `group/sub/project` su GitLab. `--id` indica poi l'integrazione, se ne sono configurate più d'una"
"hosting review submit --project" = "Rivede un progetto che non è il repository corrente (nessun clone necessario): `owner/name` su GitHub, `group/sub/project` su GitLab. `--id` indica poi l'integrazione, se ne sono configurate più d'una"
"hosting review suggest --agents_md" = "Fornisce al modello l'AGENTS.md del repository, per questa esecuzione"
"hosting review suggest --claude_md" = "Fornisce al modello il CLAUDE.md del repository (letto sul branch di destinazione della richiesta), per questa esecuzione"
"hosting review suggest --context_file" = "Un file in più per questa esecuzione: un percorso relativo alla radice del repository, un percorso assoluto o un link a un file di un host di codice"
"hosting review suggest --no_context_file" = "Nessun file in più per questa esecuzione, qualunque cosa dicano i valori predefiniti"
"hosting review suggest --project" = "Rivede un progetto che non è il repository corrente (nessun clone necessario): `owner/name` su GitHub, `group/sub/project` su GitLab. `--id` indica poi l'integrazione, se ne sono configurate più d'una"
"hosting review suggest --run_in_repo" = "Esegue un agente locale nel repository (`yes`), non lì (`no`) o come dice il suo profilo IA (`profile`), per questa esecuzione. Non con `--project` (non c'è alcun checkout)"
"hosting review threads --project" = "Rivede un progetto che non è il repository corrente (nessun clone necessario): `owner/name` su GitHub, `group/sub/project` su GitLab. `--id` indica poi l'integrazione, se ne sono configurate più d'una"
"hosting ssh-key" = "Genera una coppia di chiavi ed25519 e carica la metà pubblica"
"hosting ssh-key create" = "Genera una nuova coppia e carica la metà pubblica. Rifiuta di sovrascrivere un file di chiave esistente"
"hosting ssh-key create --no_upload" = "Genera la coppia ma non la invia da nessuna parte"
"hosting ssh-key create --path" = "Dove scrivere la chiave privata. Per impostazione predefinita `~/.ssh/id_ed25519`"
"hosting ssh-key create --title" = "Il nome con cui la chiave appare sull'host. Per impostazione predefinita `gitpoulpi@<hostname>`"
"hosting ssh-key delete" = "Rimuove una chiave pubblica dall'account sull'host (tramite l'id riportato da `ssh-key list`). I file di chiave locali restano intatti"
"hosting ssh-key delete --id" = "Quale integrazione"
"hosting ssh-key delete --key_id" = "L'id della chiave sull'host"
"hosting ssh-key list" = "Le chiavi pubbliche già presenti sull'account"
"hosting use" = "Fissa quale profilo di integrazione risponde per il repository corrente (o, senza alcun flag, mostra quello in vigore)"
"hosting use --clear" = "Rimuove il blocco, tornando alla risoluzione tramite l'host del remote"
"hosting use --id" = "Il profilo da fissare"
"hosting assignment" = "Shows, blocks or allows assigning people in the current repository's issues and pull requests (with neither flag, shows what is in force). Blocked: every assignment is refused (exit code 2, reason `assignment_blocked`), whatever the surface; existing assignees stay visible. Only a person can allow again"
"hosting assignment --allow" = "Allow assignment again (a person only)"
"hosting assignment --block" = "Refuse every assignment in this repository"
ignore = "Aggiunge un pattern a un `.gitignore` (per impostazione predefinita quello nella radice del repository). Non fa nulla quando il pattern è già una riga del file. Annullabile con `gitpoulpi undo`, che ripristina il file com'era (o lo rimuove se non esisteva)"
"ignore --file" = "`.gitignore` relativo al repository a cui aggiungere (predefinito `.gitignore`)"
"ignore --pattern" = "La riga da aggiungere, ad es. `*.log`, `/build` o `docs/tmp/`"
lfs = "Git LFS: file di grandi dimensioni archiviati fuori dalla cronologia del repository. Richiede il programma `git-lfs` per tutto ciò che sposta o converte file; `status` e `files` funzionano senza"
"lfs fetch" = "Scarica gli oggetti LFS nell'archivio locale (`git lfs fetch`), lasciando intatta la working tree"
"lfs fetch --all" = "Ogni riferimento, non solo quello corrente"
"lfs fetch --remote" = "Se omesso: il remote predefinito del repository (vedi `remote default`)"
"lfs files" = "I file puntatore LFS nell'indice (o in `--at`), indicando se ciascun oggetto reale è nell'archivio LFS locale"
"lfs files --at" = "Revisione da elencare (predefinita: l'indice)"
"lfs install" = "Configura i filtri e gli hook LFS (`git lfs install`), solo per questo repository a meno di `--user`"
"lfs install --user" = "Installa nella configurazione git globale dell'utente invece che in questo repository"
"lfs lock" = "Blocca un file in modo che nessun altro possa modificarlo finché non lo sblocchi"
"lfs lock --remote" = "Se omesso: il remote predefinito del repository"
"lfs locks" = "I blocchi di file LFS sul server: chi detiene quale file. Richiede un server con supporto ai blocchi (GitHub, GitLab, Gitea, ...); usa le credenziali del remote stesso"
"lfs locks --remote" = "Se omesso: il remote predefinito del repository"
"lfs prune" = "Elimina dall'archivio LFS locale i vecchi oggetti già inviati con push"
"lfs pull" = "Scarica gli oggetti LFS e sostituisce i file puntatore nella working tree con il contenuto reale (`git lfs pull`)"
"lfs pull --remote" = "Se omesso: il remote predefinito del repository"
"lfs checkout" = "Scrive il contenuto reale dei file puntatore LFS dell'albero di lavoro dall'archivio LFS locale (`git lfs checkout`). Offline"
"lfs checkout --paths" = "Solo questi percorsi (relativi alla radice del repository); omesso: tutti i puntatori dell'albero di lavoro"
"lfs push" = "Carica gli oggetti LFS (`git lfs push`)"
"lfs push --all" = "Ogni riferimento, non solo il branch corrente"
"lfs push --remote" = "Se omesso: il remote predefinito del repository"
"lfs status" = "`git-lfs` è installato, questo repository usa LFS, quali pattern sono tracciati, i filtri e l'hook sono installati. Non fallisce mai se `git-lfs` manca: la risposta lo dice"
"lfs track" = "Instrada dei pattern di file attraverso LFS (`git lfs track`). Modifica `.gitattributes` e lo lascia non in stage"
"lfs track --lockable" = "Rende i file di sola lettura finché non sono bloccati"
"lfs track --renormalize" = "Rimette in stage anche i file già committati che corrispondono, così il loro prossimo commit archivia i puntatori (la cronologia non viene riscritta)"
"lfs unlock" = "Rilascia un blocco. Il blocco di qualcun altro richiede `--force`, che lo spezza"
"lfs unlock --force" = "Spezza un blocco detenuto da qualcun altro"
"lfs unlock --remote" = "Se omesso: il remote predefinito del repository"
"lfs untrack" = "Smette di instradare dei pattern attraverso LFS (`git lfs untrack`)"
"log --count" = "Stampa soltanto quanti commit contiene la visita (`{\"total\": N}`), ignorando `--limit` e `--skip`: ciò che la barra di stato della TUI mostra dopo la barra obliqua. Conta senza caricare alcun commit"
"log --path" = "Solo i commit che toccano questo percorso (ripetibile) - `git log -- <path>`. È la query della vista Cronologia file"
"log --skip" = "Scarta i primi N commit del percorso prima di applicare `--limit`. Insieme a `--limit` pagina la cronologia: la pagina `n` è `--skip <n*limit> --limit <limit>`, e le pagine coprono esattamente il percorso (verificato dal contratto `check_log_skip_pages_history`)"
"log --format" = "Mostra i commit in un altro formato. `mermaid` stampa uno script Mermaid `gitGraph` (incollalo in un file Markdown, in una PR o su mermaid.live); con `--json`, `{format, detail, commits, text}`. I commit sono `--range`, altrimenti i primi `--limit` (predefinito 30) del percorso"
"log --detail" = "Livello di dettaglio di Mermaid: `structure` (commit, branch, merge), `refs` (+ nomi dei branch, tag, HEAD), `subjects` (+ oggetti dei commit) o `full` (+ autore e data). Predefinito: `ui.mermaid_detail` (`refs`)"
"log --orientation" = "Direzione del grafo Mermaid. Predefinito: `ui.mermaid_orientation` (`lr`)"
"log --fence" = "Racchiude lo script Mermaid in un blocco ```mermaid"
"log --range" = "Mermaid: i commit `A..B` (raggiungibili da B, non da A), come `git log A..B`; un semplice `A` significa `A..HEAD`"
"log --subject_width" = "Mermaid: taglia gli oggetti dei commit a questo numero di caratteri. Predefinito: `ui.mermaid_subject_width` (40)"
"mcp serve --allow_remote" = "Consente `--http` su un indirizzo non loopback. Rifiutato a meno che `[mcp] http_auth` sia attivo con un token presente e il traffico sia cifrato (`[mcp] tls`, oppure `behind_proxy` per un tunnel o un reverse proxy di cui ti assumi la responsabilità); `ssh -L` verso un endpoint loopback è più sicuro"
"mcp serve --http" = "Indirizzo di ascolto per lo streamable HTTP, ad es. 127.0.0.1:8808 (endpoint `/mcp`); senza indirizzo, `[mcp] bind` (predefinito 127.0.0.1:8808). Le richieste richiedono il token bearer (`mcp token`) a meno che `[mcp] http_auth` sia disattivato. Solo loopback, salvo `--allow-remote`"
"mcp serve --ui_control" = "Fino a che punto l'agente può muovere la finestra dell'utente con gli strumenti `ui_*`: `ask` (predefinito: la finestra mostra un chip che l'utente conferma), `auto` o `off`. Sovrascrive `[mcp] ui_control`"
"mcp token" = "Il token bearer dell'endpoint HTTP (`mcp serve --http`): lo mostra mascherato come JSON `{token_hint, path, rotated}`, creandolo al primo utilizzo. Un client lo invia come `Authorization: Bearer <token>`. Non è uno strumento MCP: un agente non legge né ruota mai la propria chiave"
"mcp token --copy" = "Copia il token completo negli appunti tramite il terminale (OSC 52), senza stamparlo"
"mcp token --rotate" = "Sostituisce il token con uno nuovo; i client che hanno quello vecchio vengono rifiutati subito"
"mcp token --show" = "Stampa anche il token completo, da incollare nella configurazione di un client"
"merge --autostash" = "Mette in stash le modifiche locali che lo bloccano, esegue l'operazione, poi ripristina lo stash (ciò che fa `general.auto_stash = \"always\"`)"
"merge --ff" = "Fast-forward se il branch lo permette, altrimenti un commit di merge (il comportamento predefinito di git). Sostituisce `git.merge_fast_forward` per questo merge"
"merge --ff_only" = "Solo fast-forward: rifiuta se il branch è divergente. Sostituisce `git.merge_fast_forward` per questo merge"
"merge --no_ff" = "Crea sempre un commit di merge, anche quando un fast-forward sarebbe possibile. Sostituisce `git.merge_fast_forward` per questo merge"
"merge --squash" = "Fa lo squash dei commit del branch: mette in stage le loro modifiche e non crea alcun commit di merge (`merge --squash`), quindi segue un `commit`. È la modalità Squash dell'impostazione Comportamento del merge. Non annullabile: nulla si è spostato, scarta le modifiche in stage per tornare indietro"
patch = "Scrive un file patch, oppure ne applica uno alla working tree"
"patch apply" = "Applica un file patch alla working tree"
"patch create" = "Scrive un file patch. `<revs>` sono uno o più commit (dal più vecchio) da trasformare in una patch ciascuno; combinalo con `--range a..b` per coprire invece ogni commit non di merge in un intervallo; combinalo con `--wip` per creare invece la patch delle modifiche correnti della working tree (in stage e non), eventualmente limitata a `<paths>`"
"patch create --revs" = "Revisioni di commit (dal più vecchio) senza `--range`/`--wip`; con `--wip`, percorsi a cui limitare la patch (vuoto significa ogni file modificato); ignorato con `--range`"
"pull --autostash" = "Mette in stash le modifiche locali che lo bloccano, esegue l'operazione, poi ripristina lo stash (ciò che fa `general.auto_stash = \"always\"`)"
"pull --mode" = "Come integrare: `merge` (fast-forward se possibile), `ff-only` o `rebase`. Sempre passato a git esplicitamente"
"pull --remote" = "Esegue il pull del branch con lo stesso nome da questo remote invece che dall'upstream del branch"
"push --branch" = "Il branch locale da inviare; quello con checkout se omesso"
"push --force_with_lease" = "Sovrascrive il branch remoto, solo se è dove l'ha visto il nostro ultimo fetch. Non esiste un semplice `--force`"
"push --remote" = "Se omesso: il remote predefinito del repository (vedi `remote default`)"
"push --set_upstream" = "Registra `<remote>/<branch>` come upstream del branch"
"rebase --abort" = "Interrompe un rebase in corso, ripristinando il branch e HEAD"
"rebase --autosquash" = "Riordina prima i passaggi di `--plan` con l'algoritmo di `git rebase --autosquash`; senza `--plan`, esegue un semplice `git rebase -i --autosquash`"
"rebase --autostash" = "Mette in stash le modifiche locali che lo bloccano, esegue l'operazione, poi ripristina lo stash (ciò che fa `general.auto_stash = \"always\"`)"
"rebase --continue_" = "Riprende un rebase fermato da un conflitto o da un passaggio `edit`"
"rebase --interactive" = "Esegue `git rebase -i`. Senza `--plan`, ha senso solo `--autosquash` da solo (qui non c'è un editor interattivo); combinalo con `--plan` per una todo list esplicita"
"rebase --onto" = "Il branch/commit su cui fare il rebase, oppure (con `--plan`) l'upstream dopo cui parte l'intervallo del piano. Omesso con `--root` o con uno tra `--continue`/`--skip`/`--abort`/`--status`"
"rebase --onto_commit" = "Riapplica su questo commit invece che sull'upstream stesso (`git rebase --onto`)"
"rebase --plan" = "Un piano JSON `Vec<RebaseStep>` (vedi `rebase-plan`), da un percorso di file o `-` per stdin"
"rebase --root" = "Fa il rebase dell'intera cronologia (`--root`) invece di un intervallo dopo `onto`/un upstream esplicito"
"rebase --skip" = "Salta il commit su cui si è fermato un rebase"
"rebase --status" = "Riporta il rebase attualmente in corso, se presente"
rebase-plan = "L'intervallo che un rebase interattivo da `upstream` (o dall'intera cronologia, con `--root`) riapplicherebbe, dal più vecchio - materiale con cui costruire un file JSON per `rebase --plan`"
redo = "Rifà l'operazione che `undo` ha appena annullato, allo stato esatto registrato (non riesegue mai l'operazione). Codice di uscita 2 se rifiutato"
"redo --dry_run" = "Mostra cosa succederebbe senza cambiare nulla"
"redo --expect" = "Rifà solo se questa è ancora l'ultima voce annullata"
"redo --yes" = "Procede quando il redo è rischioso; senza, codice di uscita 3"
"refs hide" = """Nasconde dei riferimenti dal grafo dei commit ("Nascondi" della TUI): il filtro di visualizzazione per repository in `repo-state.toml`, che una TUI aperta segue in tempo reale. I nomi si scrivono come nell'elenco dei riferimenti (`feature/x`, `origin/main`, il nome di un tag)"""
"refs hide --clear" = "Mostra di nuovo ogni riferimento e ogni remoto nascosto (oltre a quelli indicati)"
"refs hide --names" = "Riferimenti da nascondere"
"refs hide#long" = """
Nasconde dei riferimenti dal grafo dei commit ("Nascondi" della TUI): il filtro di visualizzazione per repository in `repo-state.toml`, che una TUI aperta segue in tempo reale. I nomi si scrivono come nell'elenco dei riferimenti (`feature/x`, `origin/main`, il nome di un tag).

`--remote <name>...` nasconde un intero remoto (tutti i suoi branch, anche quelli recuperati in seguito): il modo per guardare una cronologia senza quella di un remoto d'archivio a parte."""
"refs hide --remote" = "Remoti da nascondere per intero (nomi scritti come li scrive `remote list`)"
"refs show" = "Mostra di nuovo dei riferimenti: li rimuove dagli insiemi nascosti e solo"
"refs show --clear" = "Reimposta l'intero filtro: niente nascosto (remoti inclusi), niente in solo"
"refs show --names" = "Riferimenti da mostrare di nuovo"
"refs show#long" = """
Mostra di nuovo dei riferimenti: li rimuove dagli insiemi nascosti e solo.

`--remote <name>...` mostra di nuovo un intero remoto, con tutti i suoi branch che erano stati nascosti uno per uno."""
"refs show --remote" = "Remoti da mostrare di nuovo"
"refs solo" = "Mostra solo questi riferimenti (e ciò che raggiungono) nel grafo dei commit"
"refs solo --clear" = "Toglie il solo da ogni riferimento in solo (oltre a quelli indicati)"
"refs solo --names" = "Riferimenti da mettere in solo"
"remote add --push_url" = "Un URL separato verso cui fare il push"
"remote clear-push-url" = "Rimuove l'URL di push separato, così i push usano di nuovo l'URL di fetch"
"remote default" = "Mostra il remote predefinito del repository, o lo imposta con un nome"
"remote set-url" = "Imposta l'URL di fetch, o con `--push` l'URL di push separato"
repo = "Aprire, ispezionare e ricordare i repository - la superficie multi-repository. Vedi `gitpoulpi repo --help`"
