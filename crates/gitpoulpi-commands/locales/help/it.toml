"amend --author_email" = "La nuova e-mail dell'autore"
"amend --author_name" = "Il nuovo nome dell'autore"
"amend --commit" = "Il commit da cambiare (qualsiasi revisione: uno sha, `HEAD~2`, ...)"
"amend --committer_date" = "Gli stessi formati di --author-date (predefinito: adesso)"
"amend --committer_email" = "La nuova e-mail del committer (predefinito: la tua)"
"amend --committer_name" = "Il nuovo nome del committer (predefinito: il tuo)"
