"undo --dry_run" = "Mostra cosa succederebbe senza cambiare nulla"
"undo --expect" = "Annulla solo se questa è ancora l'ultima voce (il suo id, come lo mostra `--list`); altrimenti rifiutato come obsoleto"
"undo --list" = "Elenca il journal invece (la più recente per ultima); `--all` aggiunge le voci non più ripristinabili con redo ma ancora fissate"
"undo --yes" = "Procede quando l'undo è rischioso (il commit è già sul suo upstream, o dei file della working tree verrebbero sovrascritti). Senza, un undo del genere non cambia nulla ed esce con codice 3"
worktree = "Worktree collegati: li elenca, ne aggiunge uno su un branch o su un commit"
"worktree add" = "Aggiunge un worktree collegato in `<path>`. Se `<start>` indica un branch locale, ne fa il checkout lì (o fa partire `--branch` da esso); qualsiasi altra revisione dà un HEAD scollegato (o fa partire `--branch` da lì)"
"worktree add --branch" = "Crea questo nuovo branch in `<start>` e ne fa il checkout lì"
"worktree add --start" = "Un branch locale, o qualsiasi revisione"
"worktree list" = "Ogni worktree del repository, il principale per primo"
"worktree changes" = "Le modifiche non salvate del worktree in `<path>` (tracciate e non tracciate, non ignorate); un elenco vuoto significa che è pulito"
"worktree remove" = "Rimuove il worktree collegato in `<path>`. Un worktree con modifiche non salvate viene rifiutato, a meno di `--force` (le modifiche vanno perse), `--commit-message` (prima fa il commit di ogni modifica sul suo branch; un worktree con HEAD scollegato richiede anche `--commit-branch`) o `--stash-message` (prima mette in stash ogni modifica, file non tracciati inclusi; lo stash è condiviso da tutti i worktree). `--delete-branch` elimina anche il suo branch (registrato nel journal: l'annullamento ripristina il branch; la cartella resta eliminata). La rimozione in sé non si può annullare"
"worktree remove --commit_branch" = "Il branch da creare per quel commit quando il worktree ha HEAD scollegato"
"worktree remove --commit_message" = "Prima di rimuovere, fa il commit di ogni modifica con questo messaggio"
"worktree remove --delete_branch" = "Dopo la rimozione elimina anche il branch del worktree"
"worktree remove --force" = "Rimuove anche con modifiche non salvate; vanno perse"
"worktree remove --stash_message" = "Prima di rimuovere, mette in stash ogni modifica con questo messaggio"
