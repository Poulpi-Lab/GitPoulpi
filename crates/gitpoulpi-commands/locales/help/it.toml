"remote-group status" = "La posizione del branch corrente (o di `--branch`) rispetto a ciascuno dei suoi remoti: upstream primario, destinatari di push aggiuntivi, origini di pull. Solo lettura, nessuna rete"
"remote-group status --branch" = "Il branch (predefinito: quello corrente)"
"pull --all_sources" = "Fa pull dell'upstream primario e di ogni origine di pull del branch (vedi `branch upstream pull`), ciascuno con `--mode`. Prima pianifica: tutto ciò che non è un fast-forward o l'integrazione propria della modalità richiede `--resolve` (uscita 3, nulla cambia). Un arresto per conflitti esce con 4 e `stopped`; riprendi con `remote-group continue`"
"pull --branch" = "Con `--all-sources`: il branch (predefinito: quello corrente)"
"pull --no_preflight" = "Con `--all-sources`: non interroga prima i remoti"
"pull --resolve" = "Con `--all-sources`: `REMOTE=ff|merge|rebase|skip` (ripetibile), la decisione per un remoto su cui il piano ha chiesto"
"push --all_targets" = "Fa push sull'upstream primario e su ogni destinatario di push aggiuntivo del branch (vedi `branch upstream add`). Prima pianifica: se ogni remoto è un push semplice o già aggiornato, esegue, altrimenti risponde `needs_resolution` (uscita 3, nulla cambia). Uscita 4: qualche remoto è fallito o un merge si è fermato per conflitti (`stopped`)"
"push --no_preflight" = "Non interroga prima i remoti (usa i ref di tracking remoto)"
"push --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (ripetibile): la decisione per un remoto su cui il piano ha chiesto"
"push --tags" = "Fa push anche dei tag non ancora inviati su ogni remoto che ha accettato il branch"
"push --to" = "Fa push esattamente su questi remoti (`<remote>` o `<remote>:<dst>`, ripetibile) solo per questo push; la configurazione non cambia. Stesso piano, `--resolve` ed esecuzione di `--all-targets`"
"push --yes" = "Conferma un push forzato scelto con `--resolve REMOTE=force`. Senza, un tale push non cambia nulla ed esce con codice 3"
"remote-group abort" = "Scarta l'esecuzione di gruppo salvata: interrompe il merge o il rebase che ha avviato. I push già fatti restano"
"remote-group abort --run" = "L'id dell'esecuzione salvata, per essere sicuri che sia ancora quella voluta"
"remote-group continue" = "Riprende l'esecuzione di gruppo salvata una volta concluso il suo merge o rebase (mai automatico). Risponde a un `needs_resolution` con `--resolve`"
"remote-group continue --branch" = "Il branch (predefinito: quello corrente); letto solo con `--resolve`"
"remote-group continue --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (ripetibile): la decisione per un remoto su cui la risposta precedente ha chiesto"
"remote-group continue --run" = "L'id dell'esecuzione salvata, per essere sicuri che sia ancora quella voluta"
"remote-group continue --yes" = "Conferma i push forzati indicati da `--resolve`"
"remote-group plan" = "Cosa farebbe un push di gruppo (o, con `--pull`, un pull di gruppo), remoto per remoto: la posizione di ciascuno, l'azione suggerita e le altre consentite. Interroga i remoti (`ls-remote`, un fetch di quelli di cui la punta è ignota) salvo `--no-preflight`; non cambia nulla"
"remote-group plan --branch" = "Il branch (predefinito: quello corrente)"
"remote-group plan --no_preflight" = "Non interroga i remoti: usa i ref di tracking remoto così come sono"
"remote-group plan --pull" = "Pianifica il pull di gruppo (il primario e le origini di pull)"
"remote-group plan --to" = "Pianifica un push esattamente su questi remoti (`<remote>` o `<remote>:<dst>`, ripetibile) invece dei destinatari configurati"
"remote-group retry" = "Riesegue i destinatari dell'esecuzione salvata che sono falliti, sono stati annullati a metà push o non sono mai stati tentati"
"remote-group retry --run" = "L'id dell'esecuzione salvata, per essere sicuri che sia ancora quella voluta"
