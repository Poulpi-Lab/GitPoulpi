"flow status" = "Ogni branch del repository classificato secondo il suo workflow di branching: base o topic (con il suo tipo), genitore e di quanti commit è avanti e indietro rispetto a quel genitore. Senza un file di workflow ogni branch è non classificato; `flow detect` ne propone uno"
"flow sync" = "Porta un branch al passo con il suo genitore (merge o rebase, secondo la strategia configurata del branch) e, con `--stack`, anche i branch costruiti su di esso, in ordine. Stampa il piano e richiede `--yes`; codice di uscita 3 senza"
"flow sync --abort" = "Rinuncia all'azione interrotta: interrompe il merge o il rebase in corso e torna al branch da cui era partita. I passaggi già completati restano (annullali con `undo`)"
"flow sync --autostash" = "Mette in stash le modifiche locali che bloccano un checkout o un merge e le ripristina dopo, qualunque sia il valore di `general.auto_stash`"
"flow sync --branch" = "Il branch da aggiornare. Predefinito: quello attivo"
"flow sync --continue_" = "Continua dopo che il conflitto è stato risolto: fa il commit del merge o continua il rebase, poi esegue i passaggi rimanenti. Dopo un hook fallito, ripete quel passaggio"
"flow sync --dry_run" = "Stampa il piano (ogni passaggio, blocchi, avvisi) come JSON e non cambia nulla"
"flow sync --merge" = "Fa il merge invece del rebase"
"flow sync --no_hooks" = "Salta gli hook configurati senza chiedere"
"flow sync --rebase" = "Fa il rebase invece del merge"
"flow sync --run_hooks" = "Esegue gli hook che il workflow configura per questa azione (comandi di shell dal file del workflow, mostrati con il loro output). Mai eseguiti se non richiesti; senza questo flag viene chiesto in un terminale"
"flow sync --stack" = "Aggiorna anche i branch il cui genitore è questo, in modo ricorsivo"
"flow sync --yes" = "Esegue il piano senza chiedere. Senza, in un terminale viene chiesto; altrimenti stampa il piano ed esce con codice 3"
"flow templates" = "I modelli di workflow integrati (Git Flow, GitHub Flow, GitLab Flow, Trunk-based, Custom) con i loro branch base e tipi di topic"
"flow trust-hooks" = "Controlla e considera attendibili gli hook del workflow di cui il repository fa il commit (gli `[hooks]` di `.gitpoulpi/workflow.toml`): comandi di shell che verrebbero eseguiti sul tuo computer. Senza `--hash` stampa solo `{hash, hooks, trusted}`; con l'hash ricorda l'attendibilità, ma solo se il file su disco ha ancora esattamente quell'hash, così ciò che hai letto è ciò che viene considerato attendibile. Un file modificato chiede di nuovo. Gli hook del tuo override non ne hanno mai bisogno. Solo una persona può farlo: non esiste alcuno strumento MCP per questo"
"flow trust-hooks --hash" = "L'hash stampato da `flow trust-hooks` (o da un `--run-hooks` rifiutato): considera attendibili gli hook con quell'hash"
alias = "L'alias di comando (`gp` o un nome qualsiasi) che avvia GitPoulpi da un terminale: il gemello scriptabile di Impostazioni > Launcher"
"alias create" = "Fa in modo che `<name>` (ad esempio `gp`) avvii GitPoulpi: un link su Linux e macOS, un file `.cmd` su Windows, in una cartella bin dell'utente. Un file che non è di GitPoulpi non viene mai sostituito. Metti la cartella nel PATH con `path add`"
"alias create --add" = "Crea la variante di aggiunta (per esempio `gpa`): esegue `gitpoulpi --add`, che apre la cartella corrente in una nuova scheda del GitPoulpi già avviato"
"alias create --name" = "Il nome del comando: solo lettere, cifre, `-`, `_` e `.`"
"alias remove" = "Rimuove gli alias di comando creati da GitPoulpi (tutti, oppure solo `<name>`); un file che non è di GitPoulpi non viene mai toccato"
"alias remove --name" = "L'alias da rimuovere (predefinito: ogni alias creato da GitPoulpi)"
"alias status" = "Mostra gli alias di comando creati da GitPoulpi (e cosa esegue ciascuno) e i nomi in `ui.command_alias` e `ui.command_alias_add`"
path = "Mette GitPoulpi nel PATH dell'utente, per i nuovi terminali"
"path add" = "Mette la cartella in cui si trova GitPoulpi e la cartella degli alias nel PATH dell'utente, per i nuovi terminali: un blocco contrassegnato nei file di avvio della shell (Linux, macOS) o il PATH utente del registro (Windows). Le cartelle già nel PATH restano come sono"
"path remove" = "Toglie esattamente ciò che `path add` ha messo"
"path status" = "Mostra se la cartella in cui si trova GitPoulpi e la cartella degli alias sono nel PATH dell'utente, e che cosa ha aggiunto GitPoulpi"
uninstall = "Rimuove ciò che hanno creato il programma di installazione e le Impostazioni (alias di comando, voci del PATH, collegamenti) e, in un'installazione da release, i file del programma. Si rifiuta su una build che non è un'installazione da release (nessun marcatore `.gitpoulpi-dist` accanto all'eseguibile). La tua configurazione, le sessioni e i repository non vengono mai toccati"
"uninstall --keep_files" = "Lascia al loro posto i file del programma (il disinstallatore di Windows li elimina da sé, perché un eseguibile in esecuzione non può)"
launch = "Ciò che eseguono i collegamenti di GitPoulpi: mostra la finestra di un GitPoulpi già aperto (`ui.reuse_window`), altrimenti avvia COMMAND (il terminale che esegue GitPoulpi). Non avvia nulla, nemmeno un daemon, quando può mostrare una finestra"
"launch --command" = "Il comando da avviare quando non c'è nessuna finestra da mostrare, dopo `--`"
"launch --folder" = """Apri questa cartella: con `ui.reuse_window` attivo e una finestra aperta, il repository che la contiene diventa una scheda della finestra attiva più di recente (senza fare domande); altrimenti GitPoulpi si avvia nel terminale scelto su quella cartella. Ciò che esegue la voce "Apri in GitPoulpi" del file manager"""
"launch --new_window" = "Avvia una nuova finestra anche quando ce n'è una aperta"
"ai split-plan" = "Stampa un piano che l'IA propone per dividere un commit in più commit, nel JSON accettato da `split-commit --plan`. Non applica nulla: rivedilo e passalo a `split-commit`. Richiede `ai.enabled = true`"
"ai split-plan --rev" = "Il commit da dividere (qualsiasi revisione: uno sha, `HEAD~2`, ...)"
"ai rewrite-script" = "Stampa uno script Lua che l'IA scrive per una riscrittura della cronologia a partire dalla tua istruzione («sposta alla mattina dopo ogni commit fatto di notte»), con il risultato di `rewrite script check` su di esso. Non esegue e non modifica nulla: leggi lo script, poi usa `rewrite script test` e `rewrite preview --script`. Invia solo la tua istruzione e, con `--sample N`, autore, data e oggetto di N commit (mai il contenuto dei file). Richiede `ai.enabled = true`"
"ai rewrite-script --instruction" = "Cosa deve fare lo script, con parole tue"
"ai rewrite-script --sample" = "Invia anche autore, data e oggetto degli N commit più recenti (al massimo 50), così il modello vede com'è fatto il dato. Disattivato per impostazione predefinita: senza, nessun dato dei commit lascia la macchina"
"ai rewrite-rules" = "Stampa le regole e le impostazioni che l'IA propone per riscrivere la cronologia a partire dalla tua descrizione («sostituisci la mia vecchia email a@b con c@d in tutti i commit», «rimuovi secrets.txt da tutta la cronologia»), come la ricetta JSON che legge `rewrite preview --recipe-json` (salva il campo `recipe` in un file per `--recipe`), più ciò che ha scartato e perché. Non mostra anteprime e non applica nulla: leggi le regole, poi esegui tu `rewrite preview` e `rewrite apply`. Invia solo la tua descrizione e, con `--context`, il branch corrente, i nomi dei branch e dei tag e gli autori degli ultimi 200 commit (mai il contenuto dei file). Richiede `ai.enabled = true`"
"ai rewrite-rules --description" = "Come deve essere riscritta la cronologia, con parole tue"
"ai rewrite-rules --context" = "Invia anche i nomi dei branch e dei tag e gli autori dei 200 commit più recenti (al massimo 100 nomi di branch e tag e 100 autori), così il modello può citarli esattamente. Disattivato per impostazione predefinita: senza, dalla macchina esce solo la tua descrizione"
"ai worktree-name" = "Stampa il nome del worktree e il nome del branch che l'IA propone per un'attività («correggi il crash quando la configurazione è vuota»): `{ name, worktree, branch }`, dove `worktree` è il nome che la finestra Crea un worktree compilerebbe (`worktree-<name>`) e `branch` segue la denominazione dei branch del repository. Non crea nulla: passali a `worktree add`. Invia solo la tua descrizione e i nomi dei branch locali. Richiede `ai.enabled = true`"
"ai worktree-name --describe" = "La funzionalità, il bug o l'attività, con parole tue"
"ai hosting-reply" = "Print a draft the AI writes for a conversation on a code host: a comment, an answer in a thread (`--reply-to`), a comment on a line of code (`--path`), a review summary (`--review-summary`), or the description of a new issue (`--issue-title`). The conversation is read from `--conversation` (the JSON a `hosting` conversation command prints: `header` and `entries`); the AI sees the item, the thread, the recent comments within `ai.limits.hosting_reply_context_bytes` and your `--hint`. **It only drafts: the answer is `{ draft, posted: false, ... }` and nothing is posted, edited or deleted**; posting is a separate command you run yourself. The base prompt is `ai.hosting_reply.base_prompt` (edit it in Settings > AI). Needs `ai.enabled = true`"
"ai hosting-reply --conversation" = "The conversation as JSON: a file, `-` for standard input, or the JSON itself. Not for `--issue-title`"
"ai hosting-reply --draft" = "Your own text to improve instead of writing a new one"
"ai hosting-reply --flavor" = "The markup the host takes: `gfm`, `gitlab_md`, `gitea_md`, `common_mark`, `azure_md`, `bitbucket_md`, `html`, `jira_wiki`, `textile`, `youtrack_md`, `trello_md`, `plain_text`, `obsidian_md`. Default: the item's own"
"ai hosting-reply --hint" = "What you want in this answer (\"say I will look at it tomorrow\")"
"ai hosting-reply --issue_title" = "Draft the description of a new issue with this title (no conversation)"
"ai hosting-reply --line" = "With `--path`: the line"
"ai hosting-reply --path" = "Draft a new review comment on this file of the pull request"
"ai hosting-reply --read_repo" = "Let the AI read the repository. Not built yet: refused"
"ai hosting-reply --reply_to" = "Answer in the thread with this id (a code thread, a comment or a discussion)"
"ai hosting-reply --review_summary" = "Draft the summary of the review being submitted"
"split-commit" = "Divide un commit del branch corrente in più commit, dal più vecchio al più recente, secondo un piano JSON (vedi `split-source` per la numerazione). L'ultimo nuovo commit mantiene l'albero originale, quindi discendenti e working tree restano invariati; un commit già inviato richiede poi un force push. Un `undo` rimette tutto a posto. Codice di uscita 2 se rifiutato"
"split-commit --commit" = "Il commit da dividere (qualsiasi revisione: uno sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Convalida il piano ed elenca ciò che non è assegnato; non cambia nulla"
"split-commit --plan" = "Il piano (JSON), da un percorso di file o `-` per stdin. Un pezzo è `path` più un `hunk` facoltativo più `lines` facoltative (indici nelle `lines` dell'hunk); un pezzo con solo `path` è l'intero file"
"split-commit --rest_message" = "Mette tutto ciò che il piano lascia non assegnato in un ultimo commit con questo messaggio"
"split-commit --sign" = "Firma i nuovi commit (e i discendenti rieseguiti)"
"split-source" = "Le modifiche di un commit numerate per `split-commit`: ogni file con i suoi hunk (`id`, righe) o, per i file assegnabili solo per intero (binario, solo modo, aggiunto, eliminato, sottomodulo, LFS), il motivo. Sola lettura"
"split-source --commit" = "Il commit (qualsiasi revisione: uno sha, `HEAD~2`, ...)"
"rewrite" = "Riscrive la cronologia in blocco (identità, date, messaggi) da una ricetta: `preview` la pianifica senza cambiare nulla, `apply` esegue il piano che hai controllato come UNA sola voce di annullamento, `run` fa entrambe le cose per gli script. Solo `push` invia qualcosa: fa un force push dei ref riscritti, ciascuno con un lease"
"rewrite apply" = "Applica un'esecuzione in anteprima: sposta i riferimenti come UNA SOLA voce di annullamento (`gitpoulpi undo` rimette tutto a posto). Non invia mai nulla. Codice di uscita 2 se rifiutato (il repository è cambiato dopo l'anteprima, digest sbagliato, ...), 3 se il piano sposta riferimenti che sono su un remote e manca `--yes`"
"rewrite apply --digest" = "Il digest stampato da `rewrite preview`: il piano che hai controllato"
"rewrite apply --run" = "L'id dell'esecuzione stampato da `rewrite preview`"
"rewrite apply --yes" = "Conferma lo spostamento di riferimenti già inviati. Senza, un piano simile non cambia nulla e il codice di uscita è 3"
"rewrite diff" = "Cosa ha fatto una regola sul contenuto a un file di un commit di un'esecuzione in anteprima: il confronto tra il vecchio e il nuovo file. Le righe rimosse da una regola sui segreti sono nascoste. Solo lettura"
"rewrite diff --commit" = "Il commit com'è prima della riscrittura (un id preso dalle righe)"
"rewrite diff --path" = "Il file, relativo alla radice del repository"
"rewrite diff --run" = "L'id dell'esecuzione stampato da `rewrite preview`"
"rewrite discard" = "Scarta un'esecuzione in anteprima senza applicarla. Scartarla due volte non è un problema"
"rewrite discard --run" = "L'id dell'esecuzione stampato da `rewrite preview`"
"rewrite preview" = "Pianifica una riscrittura della cronologia senza cambiare nulla: conteggi, riferimenti che si sposterebbero, avvisi e le prime righe. Conserva il piano nel daemon come esecuzione (`run`, `digest`) per `rewrite rows` e `rewrite apply`. L'anteprima vive anche su disco, nella directory git del repository: così `rewrite apply` funziona da un comando successivo, dopo un riavvio del daemon o da un altro frontend, senza avviare un daemon; solo `rewrite rows` richiede il daemon che ha fatto l'anteprima (uno in esecuzione, oppure usa `--all` nell'anteprima). Codice di uscita 2 se la ricetta viene rifiutata"
"rewrite preview --all" = "Stampa ogni commit modificato"
"rewrite preview --all_local" = "Riscrive ogni branch locale e ogni tag invece del solo branch corrente"
"rewrite preview --committer" = "Committer dei commit riscritti: `keep` (predefinito) o `me-now`"
"rewrite preview --include_protected" = "Riscrive anche questi branch protetti già inviati (esclusi per impostazione predefinita; ripetibile)"
"rewrite preview --lfs_export" = "Regola LFS: riporta i puntatori LFS che corrispondono a questo glob ai file veri in ogni commit (ripetibile). Gli oggetti devono essere nell'archivio LFS locale (prima `lfs fetch`); altrimenti viene rifiutato, con l'elenco"
"rewrite preview --encoding_exclude" = "Con `--reencode`: i file che lascia stare (glob, ripetibile)"
"rewrite preview --encoding_fallback" = "Con `--reencode`: come viene letto un file che non è né marcato né UTF-8 quando l'origine viene rilevata (predefinito `windows-1252`)"
"rewrite preview --encoding_paths" = "Con `--reencode`: i file che converte (glob, ripetibile)"
"rewrite preview --eol" = "Regola sui fine riga: ogni file di testo che corrisponde a `--eol-paths` riceve questo fine riga (`lf` per Linux e macOS, `crlf` per Windows, `cr` per il Mac classico); i fine riga misti vengono uniformati e i file binari saltati"
"rewrite preview --eol_exclude" = "Con `--eol`: i file che lascia stare (glob, ripetibile)"
"rewrite preview --eol_follow_attributes" = "Con `--eol`: legge il `.gitattributes` nella radice di ogni commit: i file `-text` e `binary` vengono saltati, quelli con `eol=lf` e `eol=crlf` mantengono il proprio fine riga"
"rewrite preview --eol_paths" = "Con `--eol`: i file che converte (glob, ripetibile; un pattern senza barra corrisponde a qualsiasi profondità)"
"rewrite preview --reencode" = "Regola sulla codifica: i file di testo che corrispondono a `--encoding-paths` vengono convertiti in questa codifica (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). I file binari, quelli che la codifica di origine non sa leggere e i caratteri che la destinazione non può contenere restano come sono e vengono conteggiati"
"rewrite preview --reencode_from" = "Con `--reencode`: la codifica in cui sono i file. Se omesso, viene rilevata file per file (marca dell'ordine dei byte, UTF-8 valido, altrimenti `--encoding-fallback`)"
"rewrite preview --strip_exec" = "Regola sulla modalità dei file: il bit eseguibile (100755 diventa 100644) viene tolto ai file che corrispondono a questi glob (ripetibile). Il contenuto non viene toccato"
"rewrite preview --strip_exec_exclude" = "Con `--strip-exec`: i file che mantengono il bit eseguibile (glob)"
"rewrite preview --lfs_import" = "Regola LFS: sposta in Git LFS, in ogni commit, i file che corrispondono a questo glob (ripetibile; stile `.gitattributes`: senza barra corrisponde a qualsiasi profondità). Richiede git-lfs. Il contenuto va nell'archivio LFS locale e `.gitattributes` riceve la riga `filter=lfs`; dopo, invia gli oggetti"
"rewrite preview --lfs_min_size" = "Con `--lfs-import`: si spostano solo i file di almeno questo numero di byte"
"rewrite preview --limit" = "Quanti commit modificati stampare (predefinito 50)"
"rewrite preview --match_email" = "Regola sull'identità: corrisponde a questa e-mail di autore / committer"
"rewrite preview --match_name" = "Regola sull'identità: corrisponde a questo nome di autore / committer"
"rewrite preview --prune_empty" = "Commit che una regola sul contenuto lascia vuoti: `auto` li elimina (predefinito), `never` li mantiene"
"rewrite preview --recipe" = "Un file di ricetta (TOML o JSON, il formato del pannello della TUI), oppure `-` per JSON da standard input"
"rewrite preview --recipe_json" = "Una ricetta come stringa JSON (per chi non può scrivere un file)"
"rewrite preview --refs" = "Riscrive solo questi branch locali o tag (ripetibile)"
"rewrite preview --remove_blobs_over" = "Regola sul contenuto: rimuove da ogni commit i file più grandi di questo numero di byte"
"rewrite preview --remove_findings" = "Regola sul contenuto: rimuove un segreto trovato da `rewrite scan-secrets`, tramite l'id del risultato (ripetibile), oppure `all` per ogni risultato dell'ambito. Il daemon ripete la ricerca e risolve da sé gli id: il valore non arriva mai alla riga di comando, a una ricetta o a un log"
"rewrite preview --remove_paths" = "Regola sul contenuto: rimuove da ogni commit i file e le cartelle che corrispondono a questo glob (ripetibile; un pattern senza barra corrisponde a qualsiasi profondità)"
"rewrite preview --replace_content" = "Regola sul contenuto `FIND=WITH`: sostituisce testo letterale in ogni file di testo (ripetibile; i file binari vengono saltati e contati). Per i segreti usa una regola `content_replace` nella ricetta con `--secrets-file`"
"rewrite preview --replace_message" = "Regola sui messaggi `FIND=WITH` (testo letterale, ripetibile)"
"rewrite preview --script_params" = "Un parametro dello script `NAME=VALUE`, passato a ogni `--script` (ripetibile). I nomi sono quelli dichiarati nell'intestazione dello script"
"rewrite preview --scripts" = "Regola di script: esegue questo file di script Lua su ogni commit (ripetibile, in ordine, dopo le regole degli altri flag). Il file viene letto qui e incorporato nella ricetta; per il formato vedi `rewrite script check`"
"rewrite preview --secrets_file" = "Un file con un segreto per riga (le righe vuote vengono ignorate). I segreti vengono aggiunti alle regole `content_replace` della ricetta che cercano segreti, così non passano mai dalla riga di comando, da una ricetta salvata o da un log"
"rewrite preview --set_email" = "Regola sull'identità: l'e-mail da impostare"
"rewrite preview --set_name" = "Regola sull'identità: il nome da impostare (con `--set-email`, almeno uno dei due)"
"rewrite preview --shift_dates" = "Regola sulle date: sposta ogni data di questo numero di secondi (negativo: indietro), mantenendo l'offset del fuso orario di ciascun commit"
"rewrite preview --signatures" = "Cosa fare delle firme dei commit riscritti: `strip`, `resign-signed` o `resign-all`. Obbligatorio quando cambiano commit firmati"
"rewrite preview --since" = "Con il branch corrente: solo i commit dopo questa revisione"
"rewrite preview --who" = "Regola sull'identità: `author`, `committer` o `both` (predefinito)"
"rewrite rows" = "Scorre a pagine i commit di un'esecuzione in anteprima"
"rewrite rows --filter" = "`changed` (predefinito), `dropped`, `pushed` o `all`"
"rewrite rows --limit" = "Righe per pagina (al massimo 200)"
"rewrite rows --offset" = "Righe da saltare"
"rewrite rows --run" = "L'id dell'esecuzione stampato da `rewrite preview`"
"rewrite run" = "Anteprima e applicazione in una sola chiamata, per gli script. Stessi rifiuti e stessi codici di uscita di `preview` e `apply`; con codice di uscita 3 l'anteprima viene scartata e nulla cambia"
"rewrite run --all_local" = "Riscrive ogni branch locale e ogni tag invece del solo branch corrente"
