ui = "Mostra cose all'utente nella sua finestra GitPoulpi aperta: un commit, un diff a una riga, un file, una pagina di impostazioni. Sola visualizzazione: nulla qui modifica il repository o scrive nella finestra, tranne `ui propose`, che apre una finestra di dialogo precompilata che l'utente deve confermare (disattivato se non `[mcp] allow_ui_propose = true`). Richiede una TUI GitPoulpi aperta sulla sessione"
