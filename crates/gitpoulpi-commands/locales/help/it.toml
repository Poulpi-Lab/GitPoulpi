"rewrite script check" = "Compila uno script Lua e stampa la sua intestazione (nome, finestra, parametri), le funzioni che definisce e ogni problema. Codice di uscita 2 se ci sono problemi. Solo lettura; nessuno script viene eseguito su un commit"
