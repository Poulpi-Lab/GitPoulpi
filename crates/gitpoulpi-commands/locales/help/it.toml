undo = "Annulla l'ultima operazione registrata nel journal (commit, amend, checkout, creazione/eliminazione di branch). Rifiuta, senza cambiare nulla, se qualcosa che l'operazione ha toccato si è spostato da allora. Codice di uscita 2 se rifiutato, 3 se richiede `--yes` (un undo rischioso)"
