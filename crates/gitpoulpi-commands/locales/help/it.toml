"rewrite analyze" = "Analisi delle dimensioni della cronologia, come `filter-repo --analyze`: i blob più grandi con percorso, dimensione, primo e ultimo commit e se sono ancora in HEAD, le cartelle più grandi, i file eliminati da HEAD che la cronologia conserva ancora, e i totali con ciò che libererebbe la rimozione della sola parte presente nella cronologia (una stima: solo dopo un'eliminazione e un gc). Rimuovi ciò che mostra con `rewrite preview --remove-paths PERCORSO` oppure `--remove-blobs-over BYTE`. Solo lettura"
