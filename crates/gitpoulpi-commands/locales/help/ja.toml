"tag delete" = "タグを削除します。既定ではローカルのみ（`--local`）です。リモートにも同じタグがある場合、次の `fetch` で戻ってくるため、結果にもその旨が出ます。`--remote <R>` はそのリモートだけで削除し（外部に影響し、ほかの人もタグを失います）、`--both` はローカルと、そのタグを持つリモートの両方で削除します（`--both --remote <R>` でリモートを指定）"
