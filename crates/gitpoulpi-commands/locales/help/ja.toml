ai = "AI ヘルパー（`ai.enabled = true` のときのみ有効）：生成したコミットメッセージを出力、またはコミットや作業ツリーの変更を説明します"
"ai --print_sent" = "モデルに送信される内容（シークレットを伏せ、機密ファイルを除外した後の system テキストと user テキスト）を出力し、何も送信しません。`ai.enabled = true` が必要ですが、キーもネットワークも不要です"
"ai --send_all" = "すべての入力を、`ai.limits.*` の上限を超えていても全体のまま送信します。指定しない場合、上限を超えた入力は切り詰められ（競合は拒否され）、何を切り詰めたかが回答の `truncated: [{part, detail?, bytes, limit, setting}]` に示されます"
"commit --send_all" = "`--ai` と併用：差分が `ai.limits.diff_bytes` を超えていても、差分全体を送信します。指定しない場合、大きい差分は切り詰められ、その旨が回答（`truncated`）に示されます"
"hosting review suggest --send_all" = "すべての入力（差分、ファイルごとの差分、説明、既存のコメント、コンテキストファイル）を、`ai.limits.*` の上限を超えていても全体のまま送信します。指定しない場合、上限を超えた入力は切り詰められ、何を切り詰めたかが回答の `truncated` に示されます"
"stash push --send_all" = "`--ai` と併用：差分が `ai.limits.diff_bytes` を超えていても、差分全体を送信します。指定しない場合、大きい差分は切り詰められ、その旨が回答（`truncated`）に示されます"
"ai commit-message" = "ステージ済みの変更（何もステージされていなければすべての変更）に対して AI が提案するコミットメッセージを出力します。コミットはしません"
"ai explain" = "コミット（既定は HEAD）、または --wip を付けると作業ツリーの変更を説明します"
"ai resolve-conflict" = "競合したファイルの 1 つのマージ競合に対して AI が提案する解決案を出力します（`--conflict N`、1 始まり。ファイルに競合が 1 つだけなら省略可）。出力のみで、何も書き込まずステージもしないため、判断は呼び出し側に任されます（`conflicts resolve --content-file` でファイル全体の結果を適用できます）。`ai.enabled = true` が必要です"
"ai resolve-conflict --conflict" = "ファイルのどの競合か（1 始まり）"
"ai resolve-conflict --path" = "競合したファイル（リポジトリのルートからの相対パス）"
autostash = "保留中の auto-stash：GitPoulpi が checkout、merge、rebase、pull を実行するためにローカルの変更を退避し、まだ戻していません"
"ai review-context" = "✦ コードレビューのドラフトに、diff 以外に何を渡すかを表示または設定します（`[ai.review]`）：リポジトリの CLAUDE.md と AGENTS.md、追加ファイル1つ（パスまたはリンク）、ローカルエージェントをリポジトリ内で実行するかどうか。`--repo` も `--project` も指定しなければ全体の既定値です。`--repo PATH` はクローン済みの1つのリポジトリ固有の値、`--project HOST/PROJECT` はクローンしていないリポジトリの値です。設定フラグがなければ値を表示し（`effective` がレビューで実際に使われる値）、あれば保存して結果を表示します。モデルは不要で、AI をオフにしていても使えます"
"ai review-context --agents_md" = "リポジトリの AGENTS.md をモデルに渡す"
"ai review-context --claude_md" = "リポジトリの CLAUDE.md をモデルに渡す"
"ai review-context --context_file" = "追加ファイル1つ：リポジトリルートからの相対パス、絶対パス、またはコードホスト上のファイルへのリンク"
"ai review-context --no_context_file" = "追加ファイルなし"
"ai review-context --no_extra_file" = "全体設定の値にかかわらず、リポジトリまたはプロジェクトで追加ファイルなしにする（`on`、単独で指定した場合の既定）。`off` で再び全体設定に従う"
"ai review-context --project" = "クローンしていないリポジトリを `HOST/PROJECT`（`github.com/owner/name`）の形式で指定"
"ai review-context --reset" = "`--repo` または `--project` と併用：フラグを適用する前に、そのリポジトリ固有の値を破棄します（再び全体の値に従います）"
"ai review-context --run_in_repo" = "ローカルエージェントをリポジトリ内で実行する（`yes`）、しない（`no`）、AI プロファイルの設定に従う（`profile`）。`--project` では使えません"
"autostash start-over" = "最初からやり直します：stash のファイルに対する作業ツリーの変更を破棄し（コピーは `refs/gitpoulpi-backup/` に残ります）、auto-stash を行った操作（pull、checkout、merge、rebase）を取り消してから、元のコミット上で stash を pop します。どれかの手順が失敗した場合は stash を保ったまま停止します。拒否された場合の終了コードは 1、`--yes` が必要な場合は 3"
"autostash start-over --dry_run" = "何が起きるかを表示し、何も変更しません"
"autostash start-over --yes" = "実行します。付けない場合は何も変更せず、終了コード 3 で終了します"
blame = "リビジョン時点のファイルの行ごとの作成者を表示します"
"blame --at" = "Blame するリビジョン（既定：HEAD）"
"branch delete-remote" = "リモートのブランチを削除します（同名のローカルブランチは残します）"
"branch fast-forward" = "`<branch>` を `<target>` まで早送りします（早送りの場合のみ。分岐した履歴は拒否され、何も動きません）。チェックアウト中のブランチは `git merge --ff-only` と同様に作業ツリーも一緒に進み、それ以外のブランチは参照が移動するだけです"
"branch fast-forward --target" = "任意のリビジョン（既定：HEAD）"
"branch set-upstream" = "`<branch>` が `<upstream>`（`origin/main`）を追跡するようにします"
"branch track" = "リモート追跡ブランチを追跡するローカルブランチを作成してチェックアウトします。`<upstream>` は参照一覧の表記（`origin/feature/login`）で指定します。`--name` の既定はブランチ部分です"
"branch unset-upstream" = "`<branch>` のアップストリームを解除します"
"checkout --autostash" = 'この操作を妨げるローカルの変更をスタッシュし、操作を実行してから、スタッシュを pop します（`general.auto_stash = "always"` と同じ動作）'
"cherry-pick --commits" = "適用するコミット（順番どおり）。`--plan` を指定した場合は省略します"
"cherry-pick --plan" = "JSON の `Vec<RebaseStep>`（`rebase --plan` と同じ形式。`rebase-plan` を参照）。ファイルパス、または標準入力を表す `-` で指定します：ステップは一覧の順にチェリーピックされます。ここで意味があるのは `Pick` と `Drop` のみです（`Drop` はそのコミットをスキップ）。それ以外の操作は拒否されます。位置引数のコミットとは併用できません"
"clone --branch" = "リモートの既定の HEAD ではなく、このブランチをチェックアウトします"
"clone --depth" = "履歴をこのコミット数に切り詰めます（`git clone --depth`）"
"clone --no_lfs" = "クローン後に Git LFS ファイルの内容をダウンロードせず、ポインターのままにします"
"clone --origin" = "新しいリモートに `origin` 以外の名前を付けます"
"clone --recurse_submodules" = "サブモジュールもクローンします"
"commit --ai" = "ステージ済みの差分から、リポジトリのコミットメッセージ指示（設定 > AI）に従って AI がメッセージを書きます。`ai.enabled = true` と設定済みのプロファイルが必要です"
"commit --message" = "コミットメッセージ。--ai が書く場合を除き必須です"
"commit --no_verify" = "コミットフック（`pre-commit`、`commit-msg`）を実行しません。`commit --no-verify` と同じです"
completions = "シェル補完スクリプト（bash、zsh、fish、powershell、elvish）を標準出力に出力します。例：`gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "進行中の操作を中止します：HEAD、インデックス、作業ツリーが操作前の状態に戻ります。それまでに行った解決は破棄されます"
"conflicts skip" = "進行中のチェリーピックまたはリバート（またはリベースが止まっているコミット）をスキップします：HEAD、インデックス、作業ツリーが HEAD に戻ります。空になった場合（変更がすでに適用済み）の抜け道です。マージにはスキップするものがありません"
"conflicts check" = "HEAD を、現在のブランチの派生元へマージしたら競合するか、競合するならどのファイルかを調べます。何も変更しません（メモリ上でのマージ）。派生元は、ブランチに対応する既知のプルリクエストの宛先です。なければ、Base branches のパターンが許すブランチのうち、分岐以降のコミットが最も少ないものです。`{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`。`general.conflict_detection` またはリポジトリごとのスイッチがオフのときは無効です"
"conflicts list" = "競合したファイルを、3 つの側のテキスト付きで一覧表示します。`--names-only` を付けると、パス、競合の種類、ステージの oid のみ（blob は読み込まないため、大きなマージでも軽量）"
"conflicts resolve" = '1 つのファイルを解決してステージします（そのファイルは競合状態でなくなります）。`--side/--ours/--theirs`、`--both`、`--pick`、`--content-file`、`--delete` のうちちょうど 1 つを指定します。A と「ours」は現在の側（`HEAD`。リベース中はリベース先のブランチ）、B と「theirs」は取り込む側です。競合マーカーを手で編集せず、選択するか、最終的なテキストをファイルに書いてください'
"conflicts resolve --both" = "すべての競合で両方の側を残し（A、次に B）、それ以外の箇所は git 自身のマージ結果を使います"
"conflicts resolve --content_file" = "最終的なファイルのテキストそのもの（`-` は標準入力から読み込み）"
"conflicts resolve --delete" = "削除を受け入れます：ファイルを削除します（`git rm`）"
"conflicts resolve --encoding" = "`--content-file` と併用：テキストを UTF-8 ではなくこのエンコーディング（`windows-1252` などの WHATWG ラベル）で書き込みます"
"conflicts resolve --expect" = "判断の根拠としたステージの oid を `base,ours,theirs` の形式で指定します（存在しないステージは `-`）。インデックスがこれと完全に一致しなくなっている場合、呼び出しは `stale` として拒否されます。`--both` と `--pick` は、読み取ったステージを常に確認します"
"conflicts resolve --no_stage" = "作業ツリーのファイルを書き込みますが、競合状態のままにします（単なる保存）"
"conflicts resolve --ours" = "`--side ours` と同じ"
"conflicts resolve --pick" = "競合番号ごとの選択：`1=a,2=b,3=ab,4=ba,5=none`（a = ours、b = theirs、ab / ba = その順で両方）。`--default` が残りをカバーしない限り、すべての競合に指定が必要です"
"conflicts resolve --pick_default" = "`--pick` と併用：一覧にないすべての競合の選択"
"conflicts resolve --side" = "ファイル全体を 1 つのステージから採用します（自動マージなし）"
"conflicts resolve --theirs" = "`--side theirs` と同じ"
"conflicts resolve --theirs_first" = "`--both` と併用：B、次に A"
"conflicts show" = "マージエディターが見るとおりの、競合した 1 つのファイル：ペインのラベル、3 つの側、番号付きの競合領域（`--json` で完全なドキュメント）。git が自力で解決したマージ済みの領域は一覧に出ません。それらは `resolve --both`/`--pick` の結果に残ります"
"conflicts show --conflict" = "競合 N のみ（1 始まり）"
"conflicts state" = "進行中のマージ、リベース、チェリーピック、リバート（なければ `null`）"
"conflicts unresolve" = "この操作中に解決したファイルを競合状態（マーカー付き）に戻します。まだ競合中、または操作の実行中に解決されていないファイルは拒否されます"
daemon = '`gitpoulpi server ...` は表示されるエイリアスです - オーナーはこのグループを「サーバー」と呼び、`gp server stop` と入力します'
"daemon restart" = "`daemon stop` に続けて `daemon start` を実行します"
"daemon run" = "このセッションのデーモンをフォアグラウンドで実行します（ブロックします。Ctrl-C、または別の場所から送られた `daemon stop`/`daemon restart` で停止）。`daemon start` がデタッチして起動するのはこれで、専用のターミナルから直接実行することもできます"
"daemon start" = "このセッションのデーモンを、デタッチしたバックグラウンドプロセスとして起動します（すでに実行中ならそう報告します）。`--backend` は起動するプロセスが使うバックエンドを固定します。省略すると、起動したプロセスが `general.default_backend` を自分で解決します"
"daemon status" = "このセッションのデーモンが待ち受けているか。待ち受けている場合は、そのポート、PID、稼働時間、バックエンド、ビルドバージョン"
"daemon stop" = "このセッションのデーモンに正常な終了を依頼します。時間内に応答がなく、かつ単独のデーモン（実行中の TUI に組み込まれたものは対象外）の場合のみ、記録された PID を強制終了する方法にフォールバックします"
"daemon stop --all" = "このセッションだけでなく、`session list` がポートファイルを報告するすべてのセッションのデーモンを停止します"
discard = "作業ツリーのファイルの*未ステージ*の変更を破棄します：1 つのハンク（`--hunk`）、その一部の行（`--hunk --lines`）、または `--file` のみを指定した場合は、そのファイルのコミットされていないすべての変更（ステージ済みも含む。未追跡ファイルは削除）を破棄します。ハンクと行の番号は、`gitpoulpi diff --json` が未ステージの差分に付ける番号です。破棄したものはすべて安全のためのスナップショットに保存されるため、`gitpoulpi undo` で戻せます（未追跡ファイルも含む）。確認はありません：これはスクリプト用のインターフェースです"
"discard --lines" = "`--hunk` 内の行インデックス（カンマ区切り）"
"fetch --all" = "設定済みのすべてのリモートをフェッチします"
"fetch --prune" = "リモートにもうないリモート追跡ブランチを削除します"
"fetch --prune_tags" = "リモートで削除されたタグを、ローカルからも削除します（対象はリモートにあったタグだけで、一度も push していないタグは残ります）。Git の `fetch.pruneTags` より対象が狭く、指定しない限りオフです"
"fetch --remote" = "省略時：リポジトリの既定のリモート（`remote default` を参照）"
gitpoulpi = "軽量なクロスプラットフォームの TUI Git クライアント。CLI/MCP からスクリプト操作できます。"
"gitpoulpi --add" = "新しい GitPoulpi を起動する代わりに、すでに起動中の GitPoulpi にフォルダーを新しいタブとして開きます（`gp -a`、`gp --add ../other`）。PATH の既定は現在のディレクトリで、それを含むリポジトリに解決されます。起動中のセッションが1つ：そのセッションがタブを受け取り、デスクトップが許せばウィンドウが前面に出ます。複数：番号付きの一覧から選びます（または `--session NAME` を指定）。なし：そのフォルダーで通常どおり GitPoulpi を起動します。サブコマンドは受け付けません。`--json` では1つのオブジェクトを出力し（`action` は `joined` か `cancelled`）、タブが開けば終了コード 0、ビジー中のウィンドウがステータスバーのチップで提示したときは 3 です"
"gitpoulpi --no_raise" = "`--add` と併用：ウィンドウにターミナルを前面へ出すよう頼みません"
"gitpoulpi --backend" = "このコマンドのデーモンが動作する `GitBackend`。config.toml の `general.default_backend` と `GITPOULPI_GENERAL_DEFAULT_BACKEND` を上書きします（フラグは優先順位の最上位です - docs/user/config-reference.md を参照）"
"gitpoulpi --backend#long" = """
このコマンドのデーモンが動作する `GitBackend`。config.toml の `general.default_backend` と `GITPOULPI_GENERAL_DEFAULT_BACKEND` を上書きします（フラグは優先順位の最上位です - docs/user/config-reference.md を参照）。

これは、このコマンドが*起動する*デーモンのバックエンドを選びます。すでにデーモンが実行中のセッションは、そのデーモンが作られたときのバックエンドを保持します。`gitpoulpi` には、すでに接続しているクライアントの足元で実行中のデーモンのバックエンドを入れ替える手段がなく、そうしたふりをすることは、このフラグが避けようとしている黙って何も起きない状況と同じになってしまいます。"""
"gitpoulpi --cwd_file" = """TUI が終了するときに、アクティブなタブのフォルダーを書き込むファイル（「終了して cd」、または `ui.tab_dir_follow = "auto"` のときは常に）。`gitpoulpi shell-init` が出力するラッパー用です。タブを持つのは TUI だけなので、すべてのサブコマンドでは無視されます"""
"gitpoulpi --json" = "人が読める形式ではなく、構造化された JSON を出力します"
"gitpoulpi --lang" = "`--help` のテキストの言語（en、fr、es、pt-BR、pt-PT、it、de、zh-CN、ja、ko、ru、uk、pl、cs、nl、sv、tr）"
"gitpoulpi --lang#long" = """
`--help` のテキストの言語（en、fr、es、pt-BR、pt-PT、it、de、zh-CN、ja、ko、ru、uk、pl、cs、nl、sv、tr）。

翻訳されるのは説明のみで、コマンド名とフラグ名は変わりません。これを指定しない限り `--help` は英語のままです（環境変数は意図的に無視されるため、スクリプトは安定した出力を得られます）。例：`gitpoulpi -l fr --help`。"""
"gitpoulpi --repo" = "対象のリポジトリ。既定はカレントディレクトリを含むリポジトリなので、`gitpoulpi status` は `git status` のように動作します。複数のリポジトリを操作するエージェントは、chdir する代わりにこれを指定します"
"gitpoulpi --session" = "対象のセッション名。省略すると現在のリポジトリのルートから導出されるため（`gitpoulpi_config::default_session_name` を参照）、2 つのリポジトリには 2 つの独立したデーモンが割り当てられ、1 つのリポジトリ内で開いたものはすべて 1 つのデーモンを共有します。2 つのリポジトリを 1 つのセッションに強制したり、セッションに明示的に名前を付けたりするときに指定します。値はファイル名になるため、使用前にサニタイズされます"
"hosting checkout-pr" = "プル/マージリクエスト（フォークからのものも含む）をチェックアウトします：その head（`refs/pull/<n>/head`、`refs/merge-requests/<n>/head`）をローカルブランチ `pr/<n>`（GitLab では `mr/<n>`）にフェッチして追跡させ、そこへ切り替えます"
"hosting checkout-pr --id" = "どの連携か（`hosting prs` を参照）"
"hosting checkout-pr --no_checkout" = "フェッチしてブランチを作成/更新するだけで、今の場所にとどまります"
"hosting checkout-pr --number" = "PR 番号（GitHub）または MR の `iid`（GitLab）"
"hosting checkout-pr --remote" = "リクエストが存在するリモート。既定は、プロジェクトの解決元になったリモート、なければリポジトリの既定のリモートです"
"hosting clone" = "`projects` にあるプロジェクトを完全なパスで指定してクローンします。クローン URL はユーザーに貼り付けさせず、ホストを通じて解決します"
"hosting clone --https" = "SSH ではなく HTTPS でクローンします"
"hosting clone --project" = "プロジェクトの完全なパス（`hosting projects` が出力するもの）"
"hosting edit-url" = "プル/マージリクエストを編集する URL を出力します（GitLab の `.../edit` ビュー。GitHub はリクエストのページ上で直接編集）。番号を指定するとそのリクエスト、それ以外は `--branch`（既定：チェックアウト中のブランチ）のリクエストです。`prs` と同様に、リポジトリのプル/マージリクエストのリンクに従います。`--open` を付けたときのみブラウザーを起動します"
"hosting edit-url --branch" = "代わりに、ソースブランチでリクエストを探します"
