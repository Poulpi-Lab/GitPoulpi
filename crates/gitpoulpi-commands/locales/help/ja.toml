"ai rewrite-script" = "指示（「夜間に作成したコミットをすべて翌朝に移す」など）をもとに、AI が履歴書き換え用に書いた Lua スクリプトを、`rewrite script check` の結果とともに出力します。何も実行せず、何も変更しません：スクリプトを読んでから、`rewrite script test` と `rewrite preview --script` を使ってください。送信するのは指示だけで、`--sample N` を付けると、N 件のコミットの作成者、日付、件名も送ります（ファイルの内容は送りません）。`ai.enabled = true` が必要です"
"ai rewrite-script --instruction" = "スクリプトにさせたいことを、自分の言葉で"
"ai rewrite-script --sample" = "データの見た目をモデルが把握できるよう、最新 N 件（最大 50）のコミットの作成者、日付、件名も送ります。既定はオフで、付けなければコミットのデータはこのマシンの外に出ません"
"ai rewrite-rules" = "説明（例: \"古いメールアドレス a@b をすべてのコミットで c@d に置き換える\"、\"secrets.txt を全履歴から削除\"）から AI が提案する履歴書き換えのルールと設定を、`rewrite preview --recipe-json` が読む JSON レシピとして出力します（`--recipe` 用には `recipe` フィールドをファイルに保存）。除外された内容とその理由も出力します。プレビューも適用も行いません。ルールを読んでから、自分で `rewrite preview` と `rewrite apply` を実行してください。送信するのは説明だけで、`--context` を付けると現在のブランチ、ブランチとタグの名前、最新 200 件のコミットの作成者も送ります（ファイルの内容は送りません）。`ai.enabled = true` が必要です"
"ai rewrite-rules --description" = "履歴をどのように書き換えるか、自分の言葉で"
"ai rewrite-rules --context" = "ブランチとタグの名前、最新 200 件のコミットの作成者（ブランチとタグの名前は最大 100 件、作成者は最大 100 人）も送り、モデルが正確に名前を挙げられるようにします。既定ではオフ: 付けなければ説明だけがマシンの外に出ます"
"ai worktree-name" = "作業内容（「設定ファイルが空のときのクラッシュを修正」など）をもとに AI が提案する worktree 名とブランチ名を、`{ name, worktree, branch }` として出力します。`worktree` は worktree の作成ダイアログが入力する名前（`worktree-<name>`）で、`branch` はリポジトリ自身のブランチ名の付け方に沿ったものです。何も作成しません：結果を `worktree add` に渡してください。送信するのは説明とローカルブランチの名前だけです。`ai.enabled = true` が必要です"
"ai worktree-name --describe" = "機能、バグ、作業内容を、自分の言葉で"
"ai hosting-reply" = "コードホスト上の会話に対して AI が書く下書きを出力します：コメント、スレッドへの返答（`--reply-to`）、コード行へのコメント（`--path`）、レビューの要約（`--review-summary`）、新規 Issue の説明（`--issue-title`）。会話は `--conversation`（`hosting issue comments --json` または `hosting review conversation --json` が出力する JSON。そのため `hosting issue comments 7 --json | ai hosting-reply --conversation -` が使えます）から読み込むか、`--item` で取得します。AI が見るのは、項目、スレッド、`ai.limits.hosting_reply_context_bytes` 以内の最近のコメント、そして `--hint` です。**下書きを書くだけです。回答は `{ draft, posted: false, ... }` で、何も投稿、編集、削除されません**。投稿は別のコマンドで自分で実行します。ベースプロンプトは `ai.hosting_reply.base_prompt` です（設定 > AI で編集）。`ai.enabled = true` が必要です"
"ai hosting-reply --conversation" = "`hosting` の会話コマンドが出力する形式の、JSON の会話：ファイル、標準入力は `-`、または JSON そのもの。`--issue-title` とは併用できません"
"ai hosting-reply --draft" = "新しく書く代わりに改善する、自分のテキスト"
"ai hosting-reply --flavor" = "ホストが受け付けるマークアップ：`gfm`、`gitlab_md`、`gitea_md`、`common_mark`、`azure_md`、`bitbucket_md`、`html`、`jira_wiki`、`textile`、`youtrack_md`、`trello_md`、`plain_text`、`obsidian_md`。既定は項目自身の形式"
"ai hosting-reply --hint" = "この返答に入れたい内容（「明日確認します、と伝える」）"
"ai hosting-reply --issue_title" = "このタイトルの新規 Issue の説明の下書きを作る（会話なし）"
"ai hosting-reply --item" = "返答する Issue または pull request。リポジトリにリンクされたソースのホストから直接読み込みます（`7` または `#7` は Issue、`!7` は pull request）：`hosting issue comments 7 --json` が出力するのと同じ会話で、システムイベントは含みません。`--conversation` の代わりに使います"
"ai hosting-reply --line" = "`--path` と併用：行番号"
"ai hosting-reply --path" = "pull request のこのファイルへの新しいレビューコメントの下書きを作る"
"ai hosting-reply --read_repo" = "この下書きのために AI にリポジトリを読ませる（指定するか `ai.hosting_reply.read_repository` が true の場合のみ）。ローカルエージェントはリポジトリのフォルダーで読み取り専用のツールを使って自分で読み、API プロファイルには GitPoulpi が作ったコンテキスト（会話に出てくるファイル、検索ヒット、マップ）を `ai.limits.hosting_reply_*` の範囲で渡します。どちらの場合も AI は下書きを書くだけで、何も投稿されません"
"ai hosting-reply --refresh_context" = "このリポジトリの以前の下書きで保持されたコンテキストとエージェントのセッションを破棄し、読み直す（`--read-repo` と併用）"
"ai hosting-reply --continue_exchange" = "同じ対象（同じ `--item`、`--reply-to`、`--path`/`--line`、または `--issue-title`）に対する直近の `hosting-reply` のやり取りを続けます。それまでのヒントと下書きが以前のターンとしてモデルに戻されるため、「もっと短くして」が通じます。セッションが保持される（記憶している）ローカルの Claude エージェントでは不要です。このフラグがなければ新しいやり取りを始めます。状態フォルダーに保存されます"
"ai hosting-reply --pr_base" = "`--read-repo` と併用：pull request のベースのリビジョン。その差分（マージベースとの差分）をコンテキストに入れます"
"ai hosting-reply --pr_head" = "`--read-repo` と併用：pull request の head のリビジョン"
"ai hosting-reply --reply_to" = "この ID のスレッドに返答する（コードスレッド、コメント、ディスカッション）"
"ai hosting-reply --review_summary" = "提出するレビューの要約の下書きを作る"
"split-commit" = "現在のブランチのコミットを、JSON の計画に従って古い順に複数のコミットへ分割します（番号付けは `split-source` を参照）。最後の新しいコミットは元のツリーを保つため、子孫と作業ツリーは変わりません。プッシュ済みのコミットは、その後に強制プッシュが必要です。`undo` を 1 回実行すると元に戻ります。拒否された場合の終了コードは 2"
"split-commit --commit" = "分割するコミット（任意のリビジョン：sha、`HEAD~2` など）"
"split-commit --dry_run" = "計画を検証し、未割り当ての内容を一覧表示します。何も変更しません"
"split-commit --plan" = "計画（JSON）。ファイルパス、または標準入力を表す `-`。ピースは `path` に、任意の `hunk` と任意の `lines`（ハンクの `lines` へのインデックス）を加えたものです。`path` だけのピースはファイル全体を指します"
"split-commit --rest_message" = "計画が割り当てなかった変更をすべて、このメッセージの最後のコミットにまとめます"
"split-commit --sign" = "新しいコミット（と再作成された子孫）に署名します"
"split-source" = "`split-commit` 用に番号付けされたコミットの変更：各ファイルとそのハンク（`id`、行）、または全体としてしか割り当てられないファイル（バイナリ、モードのみ、追加、削除、サブモジュール、LFS）ではその理由。読み取り専用"
"split-source --commit" = "コミット（任意のリビジョン：sha、`HEAD~2` など）"
"rewrite" = "レシピをもとに、履歴を一括で書き換えます（ID、日付、メッセージ）。`preview` は何も変更せずに計画を立て、`apply` は確認済みの計画を 1 回分の undo として実行し、`run` はスクリプト向けに両方を行います。何かを送信するのは `push` だけで、書き換えた ref をそれぞれリース付きで強制プッシュします"
"rewrite apply" = "プレビュー済みの実行を適用します：参照の移動を元に戻す操作 1 回分として行います（`gitpoulpi undo` ですべて元に戻ります）。プッシュはしません。拒否された場合（プレビュー後にリポジトリが変わった、ダイジェストが違うなど）の終了コードは 2、計画がリモートにある参照を動かすのに `--yes` が無い場合は 3"
"rewrite apply --digest" = "`rewrite preview` が表示したダイジェスト（確認済みの計画）"
"rewrite apply --run" = "`rewrite preview` が表示した実行 ID"
"rewrite apply --yes" = "プッシュ済みの参照を動かすことを承認します。付けない場合、そのような計画は何も変更せず、終了コードは 3"
"rewrite diff" = "プレビュー済みの実行で、内容ルールが 1 つのコミットの 1 つのファイルに行った変更を、書き換え前後のファイルの差分で表示します。シークレットルールが削除した行は非表示です。読み取り専用"
"rewrite diff --commit" = "書き換え前のコミット（行一覧にある ID）"
"rewrite diff --path" = "ファイル（リポジトリのルートからの相対パス）"
"rewrite diff --run" = "`rewrite preview` が表示した実行 ID"
"rewrite discard" = "プレビュー済みの実行を、適用せずに破棄します。2 回破棄しても問題ありません"
"rewrite discard --run" = "`rewrite preview` が表示した実行 ID"
"rewrite preview" = "何も変更せずに履歴の書き換えを計画します：件数、移動する参照、警告、先頭の数行を表示します。計画は実行（`run`、`digest`）としてデーモンに保持され、`rewrite rows` と `rewrite apply` で使われます。プレビューはリポジトリの git ディレクトリのディスク上にも保存されるため、`rewrite apply` は後のコマンド、デーモンの再起動後、別のフロントエンドからでも、デーモンを起動せずに動作します。デーモンが必要なのは `rewrite rows` だけです（プレビューしたデーモンが動作中であること。または、プレビュー時に `--all` を使います）。レシピが拒否された場合の終了コードは 2"
"rewrite preview --all" = "変更されたコミットをすべて表示します"
"rewrite preview --all_local" = "現在のブランチの代わりに、すべてのローカルブランチとタグを書き換えます"
"rewrite preview --committer" = "書き換えたコミットのコミッター：`keep`（既定）または `me-now`"
"rewrite preview --include_protected" = "プッシュ済みの保護ブランチも書き換えます（既定では除外。複数指定可）"
"rewrite preview --lfs_export" = "LFS ルール：このグロブに一致する LFS ポインターを、すべてのコミットで実際のファイルに戻します（複数指定可）。オブジェクトがローカルの LFS ストアにある必要があります（先に `lfs fetch`）。ない場合は一覧を表示して拒否します"
"rewrite preview --encoding_exclude" = "`--reencode` と併用：変換しないファイル（グロブ、複数指定可）"
"rewrite preview --encoding_fallback" = "`--reencode` と併用：変換元を自動検出するとき、BOM もなく UTF-8 でもないファイルを何として読むか（既定は `windows-1252`）"
"rewrite preview --encoding_paths" = "`--reencode` と併用：変換するファイル（グロブ、複数指定可）"
"rewrite preview --eol" = "改行ルール：`--eol-paths` に一致するすべてのテキストファイルを、この改行にします（Linux と macOS は `lf`、Windows は `crlf`、旧 Mac は `cr`）。混在した改行は統一され、バイナリファイルはスキップされます"
"rewrite preview --eol_exclude" = "`--eol` と併用：変更しないファイル（グロブ、複数指定可）"
"rewrite preview --eol_follow_attributes" = "`--eol` と併用：各コミットのルートの `.gitattributes` を読みます。`-text` と `binary` のファイルはスキップし、`eol=lf` と `eol=crlf` のファイルは自身の改行を保ちます"
"rewrite preview --eol_paths" = "`--eol` と併用：変換するファイル（グロブ、複数指定可。スラッシュのないパターンはどの階層にも一致します）"
"rewrite preview --reencode" = "エンコーディングルール：`--encoding-paths` に一致するテキストファイルを、このエンコーディングに変換します（`utf-8`、`utf-8-bom`、`utf-16le`、`utf-16be`、`windows-1252`、`iso-8859-1`）。バイナリファイル、変換元のエンコーディングで読めないファイル、変換先で表現できない文字は、そのまま残して件数を表示します"
"rewrite preview --reencode_from" = "`--reencode` と併用：ファイルのエンコーディング。省略時はファイルごとに検出します（バイトオーダーマーク、有効な UTF-8、それ以外は `--encoding-fallback`）"
"rewrite preview --strip_exec" = "ファイルモードルール：これらのグロブに一致するファイルから実行ビットを外します（100755 が 100644 になります。複数指定可）。内容は変更しません"
"rewrite preview --strip_exec_exclude" = "`--strip-exec` と併用：実行ビットを保つファイル（グロブ）"
"rewrite preview --lfs_import" = "LFS ルール：このグロブに一致するファイルを、すべてのコミットで Git LFS に移します（複数指定可。`.gitattributes` と同じ書式で、スラッシュがなければどの階層にも一致します）。git-lfs が必要です。内容はローカルの LFS ストアに入り、`.gitattributes` に `filter=lfs` の行が追加されます。その後でオブジェクトを push してください"
"rewrite preview --lfs_min_size" = "`--lfs-import` と併用：このバイト数以上のファイルだけを移します"
"rewrite preview --limit" = "表示する変更後のコミット数（既定 50）"
"rewrite preview --match_email" = "ID ルール：この作成者 / コミッターのメールアドレスに一致させます"
"rewrite preview --match_name" = "ID ルール：この作成者 / コミッターの名前に一致させます"
"rewrite preview --prune_empty" = "内容ルールの結果、空になるコミット：`auto` は削除（既定）、`never` は残します"
"rewrite preview --recipe" = "レシピファイル（TOML または JSON。TUI ワークベンチと同じ形式）。`-` を指定すると標準入力の JSON を読みます"
"rewrite preview --recipe_json" = "JSON 文字列のレシピ（ファイルを書けない呼び出し側向け）"
"rewrite preview --refs" = "指定したローカルブランチまたはタグだけを書き換えます（複数指定可）"
"rewrite preview --remove_blobs_over" = "内容ルール：このバイト数より大きいファイルを、すべてのコミットから削除します"
"rewrite preview --remove_findings" = "内容ルール：`rewrite scan-secrets` が見つけたシークレットを、検出 ID（複数指定可）で削除します。`all` ならスコープ内のすべての検出結果が対象です。デーモンが再度スキャンして ID を自分で解決するため、値がコマンドライン、レシピ、ログに現れることはありません"
"rewrite preview --remove_paths" = "内容ルール：この glob に一致するファイルとフォルダーを、すべてのコミットから削除します（複数指定可。スラッシュのないパターンはどの階層にも一致します）"
"rewrite preview --replace_content" = "内容ルール `FIND=WITH`：すべてのテキストファイル内の文字列をそのまま置換します（複数指定可。バイナリファイルはスキップされ、件数に数えられます）。シークレットには、レシピの `content_replace` ルールと `--secrets-file` を使ってください"
"rewrite preview --replace_message" = "メッセージルール `FIND=WITH`（文字列そのまま。複数指定可）"
"rewrite preview --script_params" = "スクリプトのパラメーター `NAME=VALUE`。すべての `--script` に渡されます（複数指定可）。名前はスクリプトのヘッダーで宣言したものです"
"rewrite preview --scripts" = "スクリプトルール：この Lua スクリプトファイルをすべてのコミットで実行します（複数指定可。他のフラグのルールの後に、指定した順に実行）。ファイルはここで読み込まれてレシピに埋め込まれます。形式は `rewrite script check` を参照"
"rewrite preview --secrets_file" = "1 行に 1 つシークレットを書いたファイル（空行は無視）。シークレットはレシピの、シークレットを検索する `content_replace` ルールに追加されるため、コマンドライン、保存したレシピ、ログには現れません"
"rewrite preview --set_email" = "ID ルール：設定するメールアドレス"
"rewrite preview --set_name" = "ID ルール：設定する名前（`--set-email` と合わせて、少なくとも一方を指定）"
"rewrite preview --shift_dates" = "日付ルール：すべての日付をこの秒数だけずらします（負の値で過去へ）。各コミットのタイムゾーンオフセットは保ちます"
"rewrite preview --signatures" = "書き換えたコミットの署名の扱い：`strip`、`resign-signed`、`resign-all`。署名付きコミットが変わる場合は必須です"
"rewrite preview --since" = "現在のブランチを対象にする場合：このリビジョンより後のコミットだけを書き換えます"
"rewrite preview --who" = "ID ルール：`author`、`committer`、`both`（既定）"
"rewrite rows" = "プレビュー済みの実行のコミットをページ単位で表示します"
"rewrite rows --filter" = "`changed`（既定）、`dropped`、`pushed`、`all`"
"rewrite rows --limit" = "1 ページの行数（最大 200）"
"rewrite rows --offset" = "スキップする行数"
"rewrite rows --run" = "`rewrite preview` が表示した実行 ID"
