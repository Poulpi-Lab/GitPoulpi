"sequence run" = "Run a sequence headless through the daemon, one request per step with the same mapping as the matching command (`stage --all`, `commit`, `push`, ...). Everything is checked first and nothing runs when a step is unknown, valid only in the terminal UI (terminal, open in, open tab, agent here), or `force_push_with_lease` (never headless): exit code 2 with `problems`. A step that pauses (its pause is `always`, or `default` on a step that normally asks: the AI message review, a name dialog) needs `--yes`, else exit code 3 and nothing changed; `--yes` accepts the proposal as is (the AI message, the name template). A step that fails stops the run, exit code 2, the earlier steps stay done (each is undoable on its own)"
"sequence run --dry_run" = "Print the resolved plan (the command of each step, templates expanded) and change nothing"
"sequence run --id" = "The sequence id"
"sequence run --yes" = "Accept the steps that would pause, as proposed"
"sequence show" = "One sequence with its steps and, for each step, what it does and whether it can run headless"
"sequence show --id" = "The sequence id (`gitpoulpi sequence list`)"
"sequence validate" = "Check a sequence against the step vocabulary: unknown or excluded steps, bad options, a forced pause. Without an id or a file, every visible sequence. Exit code 2 when anything has a problem"
"sequence validate --file" = "Check the sequences in this TOML file (`[[sequences]]`) instead"
"sequence validate --id" = "The sequence id"
