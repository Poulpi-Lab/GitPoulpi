"rewrite run --encoding_paths" = "`--reencode` と併用：変換するファイル（グロブ、複数指定可）"
"rewrite run --eol" = "改行ルール：`--eol-paths` に一致するすべてのテキストファイルを、この改行にします（Linux と macOS は `lf`、Windows は `crlf`、旧 Mac は `cr`）。混在した改行は統一され、バイナリファイルはスキップされます"
"rewrite run --eol_exclude" = "`--eol` と併用：変更しないファイル（グロブ、複数指定可）"
