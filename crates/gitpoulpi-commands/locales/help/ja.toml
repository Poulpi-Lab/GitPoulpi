"rewrite run --reencode" = "エンコーディングルール：`--encoding-paths` に一致するテキストファイルを、このエンコーディングに変換します（`utf-8`、`utf-8-bom`、`utf-16le`、`utf-16be`、`windows-1252`、`iso-8859-1`）。バイナリファイル、変換元のエンコーディングで読めないファイル、変換先で表現できない文字は、そのまま残して件数を表示します"
