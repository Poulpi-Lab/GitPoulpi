"mailmap" = "`.mailmap`：複数の名前でコミットした人に、正規の名前とメールアドレスを 1 つ割り当てます。Log、blame、ファイル履歴は、コミットに触れずに対応付け後の名前を表示します（`log.use_mailmap`）。`list` は履歴内の名義を数えて、対応付け済みかどうかを示し、`check` は指定した名義がどう解決されるかを示し、`add` は `.mailmap` に行を追記して名義を 1 つにまとめます（編集するだけでコミットはせず、元に戻せます）"
"mailmap add" = "`.mailmap` に行を追記して、複数の名義を 1 つの正規の名義にまとめます（なければ作成し、すでにある行は繰り返しません）。ファイルは編集するだけでコミットしないため、自分でコミットしてください。元に戻せる 1 件のエントリになります（`gitpoulpi undo` で以前のファイルに戻ります）。Log には正規の名義がすぐに表示されます（`log.use_mailmap`）。保存済みのコミットは変更されないため、強制プッシュは不要です。コミット自体を書き換えるには、`rewrite` の `mailmap` ルールを使います"
