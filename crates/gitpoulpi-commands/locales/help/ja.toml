"hosting integrations trust --accept_certificate" = "このキーのフィンガープリント（SHA-256、16 進数）の証明書を、拒否時に出力されたとおりに受け入れます"
"hosting integrations trust --accept_origin" = "プロファイルの現在のアドレスを受け入れます（拒否時に出力された表記のとおりに指定する必要があります）"
"hosting integrations trust --allow_insecure_http" = "このマシン上にない平文の `http://` アドレスを許可します"
"hosting integrations trust --id" = "プロファイル"
"hosting integrations trust --strict_tls" = "ピン留めした証明書を厳密に扱います：証明書が公的ルートにつながっていても、鍵が一致する必要があります"
repo-auth = "このリポジトリが認証に使う ID（HTTPS と SSH）：マシン自身のもの、GitPoulpi アカウント、または鍵ファイル。`show` と `test` は読み取り、`set` と `clear` は人が決めます"
"repo-auth clear" = "プロファイルを破棄し、リポジトリをマシン自身の ID に戻します。実行できるのは人だけで、エージェントは拒否されます"
"repo-auth set" = "このリポジトリが認証に使う ID をプロトコルごとに選びます：HTTPS リモートには `--https`、SSH リモートには `--ssh`。プロファイルは GitPoulpi の専用ディレクトリに保存され、リポジトリには保存されません。設定できるのは人だけで、エージェントは拒否されます（終了コード 2）"
"repo-auth set --cache_minutes" = "`token-command` と併用：そのトークンを再利用する時間（分）"
"repo-auth set --use_for_hosting" = "`token-command` と併用：同じコマンドが、このリポジトリのホスティング API 呼び出し（Issue、pull request）のトークンも、個人トークンの代わりに渡します。たとえば GitHub App のインストールトークンです"
"repo-auth set --command" = "`--https token-command` と併用：コマンドとその引数（最初の語がプログラム）。`--command` は最後に書いてください。後ろの語はすべて、ダッシュで始まるもの（`sh -c ...`）も含めてコマンドの一部になります"
"repo-auth set --helper" = "`--https helper` と併用：認証情報ヘルパーのコマンド。人がハッシュとともに確認します（または `--yes` を指定）"
"repo-auth set --hosts" = "`helper` または `token-command` と併用：対象にできるホスト（カンマ区切り、または繰り返し指定）"
"repo-auth set --https" = "HTTPS の ID：`system`（git 自身のヘルパー）、`integration:<id>`（GitPoulpi アカウントのトークン）、`helper`（認証情報ヘルパー 1 つ、`--helper` と併用）、`token-command`（トークンを出力するコマンド、`--command` と `--hosts` と併用）"
"repo-auth set --ignore_repo_helpers" = "`--https system` と併用：このリポジトリ自身が設定した認証情報ヘルパーを外し、システムとグローバルのものは残します"
"repo-auth set --known_hosts" = "`--ssh key:` または `integration-key:` と併用：`known_hosts` ファイル"
"repo-auth set --ssh" = "SSH の ID：`system`（ssh 自身の設定とエージェント）、`key:<path>`（秘密鍵ファイル、その鍵だけを提示）、`integration-key:<id>`（GitPoulpi アカウントの鍵）"
"repo-auth set --strict" = "`--ssh key:` または `integration-key:` と併用：未知のホスト鍵を拒否します（`StrictHostKeyChecking=yes`）"
"repo-auth set --username" = "ユーザー名：`system` では `credential.username`（認証情報マネージャーが複数のアカウントから 1 つを選べるようにします）、`integration:<id>` ではトークンとともに送るユーザー名"
"repo-auth set --yes" = "ヘルパーまたはトークンコマンドを対話的な質問なしで確認します（コマンドとそのハッシュは引き続き表示されます）"
"repo-auth show" = "このリポジトリが認証に使う ID を表示します：保存されたプロファイル、各リモートが使う ID、プロファイルが上書きする設定、警告。秘密は表示しません。ヘルパーやトークンコマンドを表示するのは人に対してのみです（エージェントには `{set, sha256}`）"
"repo-auth test" = "プロファイルを適用して、各リモート（または 1 つ）の接続を、何も変更せずにテストします：リモートのブランチを一覧表示し、`--push` を付けると push が受け入れられるかを問い合わせます。各リモートのレポートと、使われた ID を返します。ネットワークに接続します"
"repo-auth test --push" = "push が受け入れられるかも確認します"
"repo-auth test --remote" = "このリモートのみ（既定：すべてのリモート）"
"apply-commit" = "1 つのコミット（失われたコミットでも可）が加えた変更を、作業ツリーにだけ適用します。インデックスと HEAD はそのままです。全部適用するか何もしないかのどちらかで、ファイルが問題なく適用できないときは何も変更しません（代わりに変更をスタッシュとして残すには `stash from-commit`）。マージコミットは拒否されます。`undo` で取り消せます"
"apply-commit --commit" = "変更を適用するコミット（任意のリビジョン：sha、`HEAD~2` など）"
"stash from-commit" = "1 つのコミット（失われたコミットでも可）が加えた変更を、作業ツリーには触れずに新しいスタッシュとして保存します。`undo` で再び破棄できます"
"stash from-commit --commit" = "変更を残すコミット（任意のリビジョン：sha、`HEAD~2` など）"
"stash from-commit --message" = "スタッシュのメッセージ。省略すると、そのコミットを示すメッセージになります"
"branch upstream" = "ブランチの複数のリモート：主アップストリームに加え、追加のプッシュ先とオプトインのプル元を、専用の設定セクションに保持します"
"branch upstream add" = "`<remote>[:<dst>]` を追加のプッシュ先として加えます（`<dst>` はそのリモート上のブランチ名で、省略時は同名）。元に戻せます"
"branch upstream add --branch" = "ブランチ（省略時はチェックアウト中のブランチ）"
"branch upstream add --pull" = "プル元にもします"
"branch upstream add --target" = "`<remote>` または `<remote>:<dst>`"
"branch upstream list" = "ブランチの主アップストリーム、追加のプッシュ先とプル元を、リモート追跡 ref の現状に基づく位置関係（先行、遅れ、関係）とともに表示します。読み取り専用で、ネットワークは使いません"
"branch upstream list --branch" = "ブランチ（省略時はチェックアウト中のブランチ）"
"branch upstream primary" = "主アップストリーム（`origin/main`）を設定します：`branch set-upstream` と同じリクエストです"
"branch upstream primary --branch" = "ブランチ（省略時はチェックアウト中のブランチ）"
"branch upstream pull" = "`<remote>[:<dst>]` をプル元としてオン／オフします：オンにすると、通常の pull でもそのリモートを取り込みます"
"branch upstream pull --branch" = "ブランチ（省略時はチェックアウト中のブランチ）"
"branch upstream pull --off" = "そこからのプルをやめます"
"branch upstream pull --on" = "プル元にします"
"branch upstream pull --target" = "`<remote>` または `<remote>:<branch>`"
"branch upstream remove" = "`<remote>` を指す追加のプッシュ先とプル元をすべて削除します。主アップストリームはそのままです（`unset-upstream` を使用）。元に戻せます"
"branch upstream remove --branch" = "ブランチ（省略時はチェックアウト中のブランチ）"
"remote-group" = "複数のリモート（追加のプッシュ先、プル元）を持つブランチ：各リモートとの位置関係を表示します。変更は `branch upstream` を参照"
"remote-group status" = "現在のブランチ（または `--branch`）の、各リモート（主アップストリーム、追加のプッシュ先、プル元）との位置関係。読み取り専用で、ネットワークは使いません"
"remote-group status --branch" = "ブランチ（省略時はチェックアウト中のブランチ）"
"pull --all_sources" = "主アップストリームとブランチのすべてのプル元（`branch upstream pull` を参照）から、それぞれ `--mode` でプルします。先に計画を立て、早送りやモード本来の統合以外がある場合は `--resolve` を求めます（終了コード 3、何も変更しません）。競合で止まると `stopped` を返して終了コード 4。`remote-group continue` で再開します"
"pull --branch" = "`--all-sources` と併用：ブランチ（省略時はチェックアウト中のブランチ）"
"pull --no_preflight" = "`--all-sources` と併用：先にリモートへ問い合わせません"
"pull --resolve" = "`--all-sources` と併用：`REMOTE=ff|merge|rebase|skip`（繰り返し可）。計画が確認を求めたリモートへの判断"
"pull --all_branches" = "アップストリームを持つすべてのローカルブランチを pull します。それらのリモートを fetch し、遅れているだけのブランチは早送りで進め（そうしたブランチには merge も rebase もしません）、続いてチェックアウト中のブランチを通常の pull と同様に `--mode` で統合します（既定：設定済みの pull モード）。分岐したブランチはスキップして報告します。チェックアウト中のブランチで競合すると、競合した pull と同じ状態が残り、他のブランチは更新済みです。元に戻す履歴は、動かしたブランチ全体で 1 件です。終了コード 4：ブランチまたは fetch が失敗、2：拒否（自動 stash が保留中、または必要）"
"pull --no_fetch" = "`--all-branches` と併用：先に fetch せず、リモート追跡ブランチをそのまま使います"
"pull --prune" = "`--all-branches` と併用：fetch 時に、リモートにもう無いリモート追跡ブランチを削除します"
"pull --worktrees" = "`--all-branches` と併用：別の worktree でチェックアウト中の遅れたブランチの扱い：`skip`（既定）は報告のみ、`update` はその worktree で早送りします"
"push --all_targets" = "主アップストリームとブランチのすべての追加プッシュ先（`branch upstream add` を参照）にプッシュします。先に計画を立て、すべてのリモートが通常のプッシュか最新なら実行し、そうでなければ `needs_resolution` を返します（終了コード 3、何も変更しません）。終了コード 4：いずれかのリモートが失敗した、またはマージが競合で止まりました（`stopped`）"
"push --no_preflight" = "先にリモートへ問い合わせません（リモート追跡 ref を使用）"
"push --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip`（繰り返し可）：計画が確認を求めたリモートへの判断"
"push --tags" = "ブランチを受け取ったすべてのリモートに、未プッシュのタグもプッシュします"
"push --to" = "今回のプッシュに限り、ちょうどこれらのリモート（`<remote>` または `<remote>:<dst>`、繰り返し可）へプッシュします。設定は変更されません。計画、`--resolve`、実行は `--all-targets` と同じです"
"push --yes" = "`--resolve REMOTE=force` で選んだ強制プッシュを確定します。これがないと、その強制プッシュは何も変更せず終了コード 3 で終わります"
"remote-group abort" = "保存済みのグループ実行を破棄します：開始したマージまたはリベースを中止します。完了済みのプッシュはそのまま残ります"
"remote-group abort --run" = "保存済み実行の ID（意図した実行であることの確認用）"
"remote-group continue" = "マージまたはリベースが完了した後、保存済みのグループ実行を再開します（自動では行いません）。`needs_resolution` には `--resolve` で答えます"
"remote-group continue --branch" = "ブランチ（省略時はチェックアウト中のブランチ）。`--resolve` と併用したときのみ読まれます"
"remote-group continue --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip`（繰り返し可）：前の応答が確認を求めたリモートへの判断"
"remote-group continue --run" = "保存済み実行の ID（意図した実行であることの確認用）"
"remote-group continue --yes" = "`--resolve` で指定した強制プッシュを確定します"
"remote-group plan" = "グループのプッシュ（`--pull` 付きならグループのプル）が、リモートごとに何をするか：各リモートの位置関係、推奨する操作、選べるその他の操作。`--no-preflight` がなければリモートへ問い合わせます（`ls-remote`、先端が不明なものはフェッチ）。何も変更しません"
"remote-group plan --branch" = "ブランチ（省略時はチェックアウト中のブランチ）"
"remote-group plan --no_preflight" = "リモートへ問い合わせず、リモート追跡 ref をそのまま使います"
"remote-group plan --pull" = "グループのプル（主アップストリームとプル元）を計画します"
"remote-group plan --to" = "設定されたプッシュ先ではなく、ちょうどこれらのリモート（`<remote>` または `<remote>:<dst>`、繰り返し可）へのプッシュを計画します"
"remote-group retry" = "保存済み実行のうち、失敗した、プッシュ中にキャンセルされた、または未実行のプッシュ先をもう一度実行します"
"remote-group retry --run" = "保存済み実行の ID（意図した実行であることの確認用）"
