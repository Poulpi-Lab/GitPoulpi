"rewrite push --run" = "`rewrite apply` が出力した実行 ID。`latest`（既定）は、最後に適用した実行"
"rewrite push --yes" = "プッシュを実行します。付けなければ何も送りません（終了コード 3）"
"rewrite purge" = "書き換えの古い履歴を、このクローンから完全に削除します。書き換えの undo ピン（および、同じく古い履歴を保持している以前の操作のピン）を外し、古い履歴を指す reflog の項目を期限切れにし、オブジェクトを prune し（`gc --prune=now`）、消えたことを確認します。これらの操作は元に戻せなくなります（`undo --list` には消去済みとして残ります）。開始すると中断できず、元に戻すこともできません。古い履歴をまだ保持しているもの（書き換え対象外のブランチ、stash、別の worktree の HEAD、リモート追跡 ref：プッシュのあとに fetch します）があると実行できず、何も変更されません。どのリモートにも何も送りません。ホスト側で必要な手順（GitHub、GitLab、Azure DevOps、Bitbucket）は応答に列挙されます。`--yes` なしでは何も行わず、削除されるものと失われるものを応答で示し、終了コードは 3 です。エントリが書き換えでない場合の終了コードは 2、何かに阻まれた、またはオブジェクトが残った場合は 4。MCP 経由では `[mcp] allow_history_purge = true` のときだけ使えます"
"rewrite purge --all" = "undo 履歴にあるすべての履歴書き換え"
"rewrite purge --entries" = "undo 履歴にある履歴書き換えのエントリ（`undo --list`。複数指定可）。既定は、まだ消去されていない最新の書き換え"
"rewrite purge --latest" = "まだ消去されていない最新の書き換え（既定）"
"rewrite purge --yes" = "削除を実行します。付けなければ何も変更しません（終了コード 3）"
"rewrite run --extract" = "パスルール：このサブディレクトリだけを残してルートにします。これに触れないコミットは削除され、マージは単純化されます。毎回確認が入るため、`--extract-mode` を指定してください。指定しないと終了コード 3 で終了し、何もプレビューされません。取り出しは、ほかのパス系フラグより先に実行されます"
"rewrite run --extract_mode" = "`--extract` の結果の形：`clone`（`--target` に新しいローカルクローンを作り、元のリポジトリには触れません。すべてのローカルブランチとタグを含みます）、`in-place`（このリポジトリの履歴を書き換えます。元に戻す項目は 1 件）、`submodule`（`clone` と同じクローンを作り、現在のブランチにコミットを 1 件追加して、フォルダーをそのサブモジュールに置き換えます。このリポジトリの履歴は残ります）"
"rewrite run --into_subdir" = "パスルール：すべてのコミットで、リポジトリ全体をこのサブディレクトリに移動します（パスが衝突しないようにリポジトリを統合するため）"
"rewrite run --move_paths" = "パスルール `FROM=TO`：すべてのコミットで、ファイルまたはフォルダーの名前を変更します。blob と tree は同じまま、新しいパスに置かれます（複数指定可。内容ルールの後に、指定順に実行）。`TO` がすでに存在するコミットは変更されず、プレビューは拒否され（終了コード 2、`path_collision`）、該当するコミットとパスが一覧されます"
"rewrite run --target" = "`--extract-mode clone` または `submodule` で作る新しいリポジトリのフォルダー。存在しないか空である必要があり、このリポジトリの中は指定できません。`rewrite run` で使います。`rewrite apply` は独自の指定を取ります"
"rm-file --paths" = "削除する、リポジトリからの相対パス"
shell-init = """シェルのラッパー関数（既定の名前は `gp`）を出力します。gitpoulpi を実行し、「終了して cd」で終了したときにシェルをアクティブなタブのフォルダーに置きます。シェルの rc ファイルに追加してください：`eval "$(gitpoulpi shell-init bash)"`。何もインストールや編集はされません"""
