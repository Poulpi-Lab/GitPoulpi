"rewrite" = "레시피로 기록(작성자 정보, 날짜, 메시지)을 일괄 다시 씁니다: `preview`는 아무것도 바꾸지 않고 계획만 세우고, `apply`는 검토한 계획을 실행 취소 항목 하나로 실행하며, `run`은 스크립트용으로 둘을 한 번에 합니다. `push`만 무언가를 보내며, 다시 쓴 ref를 lease와 함께 force push합니다"
"rewrite apply" = "미리 본 실행을 적용합니다. ref를 실행 취소 항목 하나로 옮기며 (`gitpoulpi undo`로 전부 되돌림) push는 하지 않습니다. 거부되면 종료 코드 2 (미리 본 뒤 저장소가 바뀜, 다이제스트 불일치 등), 계획이 리모트에 있는 ref를 옮기는데 `--yes`가 없으면 3"
"rewrite apply --digest" = "`rewrite preview`가 출력한 다이제스트: 검토한 계획"
"rewrite apply --run" = "`rewrite preview`가 출력한 실행 ID"
"rewrite apply --yes" = "이미 push된 ref를 옮기는 것을 확인합니다. 없으면 그런 계획은 아무것도 바꾸지 않고 종료 코드 3으로 끝납니다"
"rewrite diff" = "미리 본 실행에서 내용 규칙이 한 커밋의 한 파일에 한 일을 이전 파일과 새 파일의 diff로 보여 줍니다. 비밀 값 규칙이 제거하는 줄은 숨깁니다. 읽기 전용"
"rewrite diff --commit" = "다시 쓰기 전의 커밋 (행 목록에 나온 ID)"
"rewrite diff --path" = "저장소 루트 기준 파일 경로"
"rewrite diff --run" = "`rewrite preview`가 출력한 실행 ID"
"rewrite discard" = "적용하지 않고 미리 본 실행을 버립니다. 두 번 버려도 괜찮습니다"
"rewrite discard --run" = "`rewrite preview`가 출력한 실행 ID"
"rewrite preview" = "아무것도 바꾸지 않고 기록 다시 쓰기를 계획합니다: 개수, 옮겨질 ref, 경고, 처음 몇 행. 계획은 데몬에 실행(`run`, `digest`)으로 남아 `rewrite rows`와 `rewrite apply`가 사용합니다. 미리보기는 저장소의 git 디렉터리에도 저장되므로, `rewrite apply`는 나중의 명령, 데몬을 다시 시작한 뒤, 다른 프런트엔드에서도 데몬 없이 동작합니다. 미리 본 데몬(실행 중인 것, 또는 미리보기에 `--all`)이 필요한 것은 `rewrite rows`뿐입니다. 레시피가 거부되면 종료 코드 2"
"rewrite preview --all" = "변경된 커밋을 모두 출력합니다"
"rewrite preview --all_local" = "현재 브랜치 대신 모든 로컬 브랜치와 태그를 다시 씁니다"
