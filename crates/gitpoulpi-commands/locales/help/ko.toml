`--help` 텍스트의 언어 (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

설명만 번역되며 - 명령과 플래그 이름은 절대 바뀌지 않습니다 - 이 옵션을 주지 않으면 `--help`는 영어로 유지됩니다 (스크립트가 안정적인 출력을 얻도록 환경 변수는 일부러 무시합니다). 예: `gitpoulpi -l fr --help`."""
