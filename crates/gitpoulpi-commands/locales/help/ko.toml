"rewrite preview --include_protected" = "이미 push된 보호 브랜치도 다시 씁니다 (기본값은 제외, 여러 번 지정 가능)"
"rewrite preview --lfs_export" = "LFS 규칙: 이 glob과 일치하는 LFS 포인터를 모든 커밋에서 실제 파일로 되돌립니다 (여러 번 지정 가능). 객체가 로컬 LFS 저장소에 있어야 하며 (먼저 `lfs fetch`), 없으면 목록과 함께 거부합니다"
