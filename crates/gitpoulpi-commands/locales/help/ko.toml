"rewrite preview --extract_mode" = "`--extract`의 처리 방식: `clone` (`--target`에 새 로컬 클론을 만들며 원본은 건드리지 않고, 모든 로컬 브랜치와 태그를 가져옴), `in-place` (이 저장소의 기록을 다시 쓰며 실행 취소 항목 하나), `submodule` (`clone`처럼 클론을 만들고, 현재 브랜치에 새 커밋 하나를 추가해 폴더를 그 서브모듈로 바꿈. 이 기록은 유지됨)"
"rewrite preview --into_subdir" = "경로 규칙: 모든 커밋에서 저장소 전체를 이 하위 폴더 안으로 옮깁니다 (경로 충돌 없이 저장소를 합칠 때)"
"rewrite preview --move_paths" = "경로 규칙 `FROM=TO`: 모든 커밋에서 파일이나 폴더의 이름을 바꿉니다. 같은 blob과 트리가 새 경로에 놓입니다 (여러 번 지정 가능, 내용 규칙 다음에 순서대로). `TO`가 이미 있는 커밋이 있으면 바꾸지 않고 미리보기를 거부하며 (종료 코드 2, `path_collision`) 해당 커밋과 경로를 나열합니다"
"rewrite preview --target" = "새 저장소의 폴더. `--extract-mode clone` 또는 `submodule`에서 쓰며, 존재하지 않거나 비어 있어야 하고 이 저장소 안에 있으면 안 됩니다. `rewrite run`에서 쓰이며, `rewrite apply`는 자체 값을 받습니다"
"rewrite push" = "적용한 실행이 옮긴 ref 중 리모트에 있던 것을 push합니다. 각각 `--force-with-lease=<ref>:<미리볼 때 리모트가 가진 ID>`를 붙이며(단순 force는 쓰지 않음), 서버가 허용하면 리모트당 `--atomic` push 한 번으로 보냅니다 (아니면 ref마다 한 번씩 보내며 응답에 그렇게 표시). 태그도 포함합니다. 보호 브랜치(`rewrite.protected_branches`)는 `--include-protected`로 지정하거나 `--include-all-protected`로 전부 포함하지 않으면 제외됩니다. 미리본 뒤 리모트가 움직인 ref는 그 ref만 거부됩니다 (fetch하고 검토한 뒤 다시 실행). 되돌릴 수 없음: 로컬에서 `undo`로 다시 쓰기를 취소해도 리모트에는 새 기록이 남습니다. `--yes`가 없거나 `--dry-run`이면 아무것도 보내지 않고 응답에 push될 목록만 나오며, `--yes`가 없을 때 종료 코드는 3입니다. 실행이 없으면 종료 코드 2, ref가 거부되었거나 push되지 않았으면 4"
"rewrite push --dry_run" = "리모트에 어떻게 될지 물어보고(lease 확인) 아무것도 보내지 않습니다"
