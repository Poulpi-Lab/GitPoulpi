"rewrite script check#long" = "Lua 스크립트를 컴파일해 머리말(이름, 시간대, 매개변수), 정의된 함수, 모든 문제를 출력합니다. 문제가 있으면 종료 코드 2. 읽기 전용이며 커밋에는 아무것도 실행하지 않습니다.\n\nshell, Python, 외부 Lua 스크립트(샌드박스 없음)는 인터프리터를 찾았는지와 스크립트를 신뢰하는지도 알려 주며, 신뢰하는 스크립트에는 모의 핸드셰이크를 합니다: 가짜 커밋(`\"dry_run\": true`)으로 스크립트를 한 번 시작해 응답을 확인합니다. 신뢰하지 않는 스크립트는 절대 시작하지 않습니다."
