ai = "AI 도우미 (`ai.enabled = true`가 아니면 꺼짐): 생성된 커밋 메시지를 출력하거나 커밋 또는 작업 변경 사항을 설명합니다"
"ai commit-message" = "스테이징된 변경 사항(스테이징된 것이 없으면 모든 변경 사항)에 대해 AI가 제안하는 커밋 메시지를 출력합니다. 아무것도 커밋하지 않습니다"
"ai explain" = "커밋(기본값 HEAD)을 설명하거나, --wip를 쓰면 작업 변경 사항을 설명합니다"
"ai resolve-conflict" = "충돌한 파일의 병합 충돌 하나에 대해 AI가 제안하는 해결안을 출력합니다 (`--conflict N`, 1부터 시작. 파일에 충돌이 하나뿐이면 생략 가능). 출력만 하며 아무것도 기록하거나 스테이징하지 않으므로 판단은 호출자에게 있습니다 (`conflicts resolve --content-file`로 파일 전체 결과를 적용). `ai.enabled = true`가 필요합니다"
"ai resolve-conflict --conflict" = "파일의 몇 번째 충돌인지, 1부터 시작"
"ai resolve-conflict --path" = "충돌한 파일, 저장소 루트 기준 경로"
autostash = "보류 중인 auto-stash: GitPoulpi가 checkout, merge, rebase 또는 pull을 실행하려고 로컬 변경을 따로 보관했고 아직 되돌려 놓지 않았습니다"
"ai review-context" = "✦ 코드 리뷰 초안에 diff 외에 무엇을 줄지 표시하거나 설정합니다(`[ai.review]`): 저장소의 CLAUDE.md와 AGENTS.md, 파일 하나 더(경로 또는 링크), 로컬 에이전트를 저장소에서 실행할지 여부. `--repo`도 `--project`도 없으면 전역 기본값이고, `--repo PATH`는 클론된 저장소 하나의 고유 값, `--project HOST/PROJECT`는 클론되지 않은 저장소의 고유 값입니다. 설정 플래그가 없으면 값을 출력하고(`effective`가 리뷰에 실제로 적용되는 값), 있으면 저장한 뒤 결과를 출력합니다. 모델이 필요 없으며 AI를 꺼도 동작합니다"
"ai review-context --agents_md" = "모델에 저장소의 AGENTS.md를 전달합니다"
"ai review-context --claude_md" = "모델에 저장소의 CLAUDE.md를 전달합니다"
"ai review-context --context_file" = "추가 파일 하나: 저장소 루트 기준 경로, 절대 경로 또는 코드 호스트 파일의 링크"
"ai review-context --no_context_file" = "추가 파일 없음"
"ai review-context --no_extra_file" = "전역 값과 관계없이 이 저장소 또는 프로젝트에는 추가 파일 없음 (`on`, 단독으로 쓰면 기본값). `off`는 다시 전역 값을 따르게 함"
"ai review-context --project" = "클론되지 않은 저장소, `HOST/PROJECT` 형식(`github.com/owner/name`)"
"ai review-context --reset" = "`--repo` 또는 `--project`와 함께: 플래그를 적용하기 전에 저장소의 고유 값을 지웁니다(다시 전역 값을 따릅니다)"
"ai review-context --run_in_repo" = "로컬 에이전트를 저장소에서 실행(`yes`), 실행 안 함(`no`), 또는 AI 프로필 설정을 따름(`profile`). `--project`에는 해당 없음"
"autostash start-over" = "처음부터 다시 시작: stash에 들어 있는 파일의 작업 트리 변경을 버리고(사본은 `refs/gitpoulpi-backup/`에 남습니다), auto-stash를 만든 작업(pull, checkout, merge, rebase)을 되돌린 다음, 원래 커밋에서 stash를 pop합니다. 어느 단계든 실패하면 stash를 그대로 둔 채 멈춥니다. 거부되면 종료 코드 1, `--yes`가 필요하면 3"
"autostash start-over --dry_run" = "무슨 일이 일어날지 표시하고 아무것도 변경하지 않습니다"
"autostash start-over --yes" = "진행합니다. 없으면 아무것도 변경하지 않고 종료 코드 3으로 끝납니다"
blame = "리비전 시점의 파일에 대한 줄 단위 작성자 정보"
"blame --at" = "blame할 리비전 (기본값: HEAD)"
"branch delete-remote" = "리모트의 브랜치를 삭제하며, 같은 이름의 로컬 브랜치는 유지합니다"
"branch fast-forward" = "`<branch>`를 `<target>`까지 앞으로 이동합니다. fast-forward일 때만 가능합니다 (갈라진 기록은 거부되며 아무것도 이동하지 않습니다). 체크아웃된 브랜치는 `git merge --ff-only`처럼 작업 트리도 함께 이동하고, 다른 브랜치는 ref만 이동합니다"
"branch fast-forward --target" = "임의의 리비전 (기본값: HEAD)"
"branch set-upstream" = "`<branch>`가 `<upstream>`(`origin/main`)을 추적하게 합니다"
"branch track" = "리모트 추적 브랜치를 추적하는 로컬 브랜치를 만들고 체크아웃합니다. `<upstream>`은 ref 목록에 표시되는 방식(`origin/feature/login`)으로 씁니다. `--name`의 기본값은 브랜치 부분입니다"
"branch unset-upstream" = "`<branch>`의 업스트림을 제거합니다"
"checkout --autostash" = '이 작업을 막는 로컬 변경 사항을 stash하고 작업을 실행한 뒤 stash를 pop합니다 (`general.auto_stash = "always"`가 하는 일)'
"cherry-pick --commits" = "적용할 커밋을 순서대로. `--plan`을 주면 생략합니다"
"cherry-pick --plan" = "JSON `Vec<RebaseStep>` (`rebase --plan`과 같은 형식. `rebase-plan` 참조). 파일 경로 또는 표준 입력을 뜻하는 `-`: 단계는 목록 순서대로 cherry-pick됩니다. 여기서는 `Pick`과 `Drop` 동작만 의미가 있고 (`Drop`은 커밋을 건너뜀) 다른 동작은 거부됩니다. 위치 인자 커밋과 함께 쓸 수 없습니다"
"clone --branch" = "리모트의 기본 HEAD 대신 이 브랜치를 체크아웃합니다"
"clone --depth" = "기록을 이 개수의 커밋으로 줄입니다 (`git clone --depth`)"
"clone --no_lfs" = "클론 후 Git LFS 파일의 내용을 다운로드하지 않고 포인터 상태로 둡니다"
"clone --origin" = "새 리모트에 `origin`이 아닌 다른 이름을 붙입니다"
"clone --recurse_submodules" = "서브모듈도 클론합니다"
"commit --ai" = "스테이징된 diff로 저장소의 커밋 메시지 지침(설정 > AI)을 사용해 AI가 메시지를 작성하게 합니다. `ai.enabled = true`와 구성된 프로필이 필요합니다"
"commit --message" = "커밋 메시지. --ai가 작성하는 경우가 아니면 필수입니다"
"commit --no_verify" = "커밋 훅(`pre-commit`, `commit-msg`)을 건너뜁니다. `commit --no-verify`와 같습니다"
completions = "셸 자동 완성 스크립트를 표준 출력으로 출력합니다 (bash, zsh, fish, powershell 또는 elvish). 예: `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "진행 중인 작업을 중단합니다: HEAD, 인덱스, 작업 트리가 작업 이전 상태로 돌아갑니다. 그동안 한 해결 내용은 버려집니다"
"conflicts skip" = "진행 중인 체리픽 또는 리버트(또는 리베이스가 멈춘 커밋)를 건너뜁니다: HEAD, 인덱스, 작업 트리가 HEAD로 돌아갑니다. 비어 버린 경우(변경이 이미 적용됨)의 탈출구입니다. 병합에는 건너뛸 것이 없습니다"
"conflicts check" = "HEAD를 처음 갈라져 나온 브랜치에 병합하면 충돌할지, 충돌한다면 어떤 파일인지 알려 줍니다. 아무것도 변경하지 않습니다 (메모리 안에서의 병합). 기준은 그 브랜치의 알려진 pull request의 대상 브랜치이고, 없으면 Base branches 패턴이 허용하는 브랜치 중 갈라진 뒤 커밋이 가장 적은 것입니다. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. `general.conflict_detection` 또는 저장소의 스위치가 꺼져 있으면 동작하지 않습니다"
"conflicts list" = "충돌한 파일을 각각 세 쪽의 텍스트와 함께 나열합니다. `--names-only`를 쓰면 경로, 충돌 종류, 스테이지 oid만 표시합니다 (블롭을 읽지 않으므로 큰 병합에서도 부담이 적음)"
"conflicts resolve" = '파일 하나를 해결하고 스테이징합니다 (파일은 더 이상 충돌 상태가 아님). `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file`, `--delete` 중 정확히 하나를 지정합니다. A와 "ours"는 현재 쪽(`HEAD`. rebase 중에는 rebase 대상 브랜치), B와 "theirs"는 수신 쪽입니다. 충돌 표시를 직접 편집하지 말고 선택하거나 최종 텍스트를 파일에 쓰세요'
"conflicts resolve --both" = "모든 충돌에서 양쪽을 유지하고 (A 다음 B), 그 외에는 git 자체의 병합을 따릅니다"
"conflicts resolve --content_file" = "최종 파일 텍스트를 그대로 (`-`는 표준 입력을 읽음)"
"conflicts resolve --delete" = "삭제 수락: 파일을 제거합니다 (`git rm`)"
"conflicts resolve --encoding" = "`--content-file`과 함께: 텍스트를 UTF-8 대신 이 인코딩으로 씁니다 (`windows-1252` 같은 WHATWG 레이블)"
"conflicts resolve --expect" = "결정의 근거가 된 스테이지 oid, `base,ours,theirs` (없는 스테이지는 `-`). 인덱스가 더 이상 정확히 이것들을 갖고 있지 않으면 호출은 `stale`로 거부됩니다. `--both`와 `--pick`은 읽은 스테이지를 항상 확인합니다"
"conflicts resolve --no_stage" = "작업 트리 파일을 쓰되 충돌 상태로 둡니다 (단순 저장)"
"conflicts resolve --ours" = "`--side ours`와 같음"
"conflicts resolve --pick" = "충돌 번호별 선택: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = 둘 다 그 순서로). `--default`가 나머지를 처리하지 않는 한 모든 충돌에 선택이 필요합니다"
"conflicts resolve --pick_default" = "`--pick`과 함께: 나열하지 않은 모든 충돌에 대한 선택"
"conflicts resolve --side" = "자동 병합 없이 한 스테이지에서 파일 전체를 가져옵니다"
"conflicts resolve --theirs" = "`--side theirs`와 같음"
"conflicts resolve --theirs_first" = "`--both`와 함께: B 다음 A"
"conflicts show" = "병합 편집기가 보는 대로 충돌한 파일 하나를 보여줍니다: 창 레이블, 세 쪽, 번호가 붙은 충돌 영역 (`--json`은 전체 문서). git이 스스로 해결한 병합 영역은 나열되지 않으며 `resolve --both`/`--pick`의 결과에 남습니다"
"conflicts show --conflict" = "N번째 충돌만 (1부터 시작)"
"conflicts state" = "진행 중인 merge, rebase, cherry-pick 또는 revert (없으면 `null`)"
"conflicts unresolve" = "이 작업 중에 해결한 파일을 다시 충돌 상태로 되돌립니다 (표시가 다시 생김). 아직 충돌 상태이거나 작업이 실행되는 동안 해결되지 않은 경우 거부됩니다"
daemon = '`gitpoulpi server ...`는 눈에 보이는 별칭입니다 - 소유자는 이 그룹을 "서버"라 부르고 `gp server stop`을 입력합니다'
"daemon restart" = "`daemon stop` 다음에 `daemon start`"
"daemon run" = "이 세션의 데몬을 포그라운드에서 실행합니다 (블로킹. Ctrl-C 또는 다른 곳에서 보낸 `daemon stop`/`daemon restart`로 중지). `daemon start`가 분리하여 띄우는 것이며 전용 터미널에서 직접 실행할 수도 있습니다"
"daemon start" = "이 세션의 데몬을 분리된 백그라운드 프로세스로 시작합니다 (이미 실행 중이면 그렇다고 알림). `--backend`는 띄우는 프로세스가 사용할 백엔드를 고정하며, 생략하면 프로세스가 `general.default_backend`를 직접 결정합니다"
"daemon status" = "이 세션의 데몬이 수신 대기 중인지, 그렇다면 포트, PID, 가동 시간, 백엔드, 빌드 버전을 표시합니다"
"daemon stop" = "이 세션의 데몬에 정상 종료를 요청하며, 제때 응답하지 않고 독립 실행형 데몬(실행 중인 TUI에 내장된 것은 절대 아님)인 경우에만 기록된 PID를 종료하는 방식으로 대체합니다"
"daemon stop --all" = "이 세션뿐 아니라 `session list`가 포트 파일을 보고하는 모든 세션의 데몬을 중지합니다"
discard = "작업 트리에서 파일의 *스테이징되지 않은* 변경 사항을 버립니다: hunk 하나 (`--hunk`), 그 일부 줄 (`--hunk --lines`), 또는 `--file`만 쓰면 파일의 커밋하지 않은 모든 변경 사항 (스테이징된 것 포함, 추적되지 않는 파일은 삭제). hunk와 줄은 `gitpoulpi diff --json`이 스테이징되지 않은 diff에 매기는 번호를 따릅니다. 버리는 모든 내용은 안전 스냅샷에 보관되므로 `gitpoulpi undo`로 되돌릴 수 있습니다 (추적되지 않는 파일 포함). 확인하지 않음: 스크립트용 인터페이스입니다"
"discard --lines" = "`--hunk` 안의 줄 인덱스를 쉼표로 구분"
"fetch --all" = "구성된 모든 리모트를 fetch합니다"
"fetch --prune" = "리모트에 더 이상 없는 리모트 추적 브랜치를 제거합니다"
"fetch --prune_tags" = "리모트에서 삭제된 로컬 태그도 함께 삭제합니다 (리모트에 있었던 태그만 대상이며, 푸시한 적 없는 태그는 그대로 둡니다). Git의 `fetch.pruneTags`보다 범위가 좁고, 요청할 때만 동작합니다"
"fetch --remote" = "생략하면 저장소의 기본 리모트 (`remote default` 참조)"
gitpoulpi = "가벼운 크로스 플랫폼 TUI Git 클라이언트. CLI/MCP로 스크립트 작성이 가능합니다."
"gitpoulpi --add" = "새 GitPoulpi를 시작하는 대신, 이미 실행 중인 GitPoulpi에 폴더를 새 탭으로 엽니다(`gp -a`, `gp --add ../other`). PATH의 기본값은 현재 디렉터리이며 그것을 포함하는 저장소로 확인됩니다. 실행 중인 세션이 하나면 그 세션이 탭을 받고, 데스크톱이 허용하면 창이 앞으로 나옵니다. 여러 개면 번호가 붙은 목록에서 하나를 고릅니다(또는 `--session NAME` 지정). 없으면 그 폴더에서 평소처럼 GitPoulpi를 시작합니다. 하위 명령은 받지 않습니다. `--json`을 쓰면 객체 하나를 출력하며(`action`은 `joined` 또는 `cancelled`), 탭이 열리면 종료 코드 0, 바쁜 창이 상태 표시줄 칩으로 제안했다면 3입니다"
"gitpoulpi --no_raise" = "`--add`와 함께: 창에 터미널을 앞으로 가져오라고 요청하지 않습니다"
"gitpoulpi --backend" = "이 명령의 데몬이 실행되는 `GitBackend`. config.toml의 `general.default_backend`와 `GITPOULPI_GENERAL_DEFAULT_BACKEND`보다 우선합니다 (플래그가 우선순위의 최상위 - docs/user/config-reference.md 참조)"
"gitpoulpi --backend#long" = """
이 명령의 데몬이 실행되는 `GitBackend`. config.toml의 `general.default_backend`와 `GITPOULPI_GENERAL_DEFAULT_BACKEND`보다 우선합니다 (플래그가 우선순위의 최상위 - docs/user/config-reference.md 참조).

이 명령이 *시작하는* 데몬의 백엔드를 선택합니다. 데몬이 이미 실행 중인 세션은 그 데몬이 만들어질 때의 백엔드를 유지합니다. `gitpoulpi`는 이미 구독 중인 클라이언트 아래에서 실행 중인 데몬의 백엔드를 바꿔 끼울 방법이 없으며, 그런 척하는 것은 이 플래그가 피하려는 조용한 무동작과 같습니다."""
"gitpoulpi --cwd_file" = '''TUI가 종료할 때 활성 탭의 폴더를 쓰는 파일 ("Quit and cd here", 또는 `ui.tab_dir_follow = "auto"`일 때는 항상). `gitpoulpi shell-init`이 출력하는 래퍼용이며 탭이 있는 것은 TUI뿐이므로 모든 하위 명령에서는 무시됩니다'''
