ui = "Toon dingen aan de gebruiker in zijn geopende GitPoulpi-venster: een commit, een diff bij een regel, een bestand, een instellingenpagina. Alleen weergave: niets hier wijzigt de repository of typt in het venster, behalve `ui propose`, dat een vooraf ingevuld dialoogvenster opent dat de gebruiker bevestigt (uit tenzij `[mcp] allow_ui_propose = true`). Vereist een geopende GitPoulpi-TUI op de sessie"
"ui --launch" = "Als er nergens een venster open is, open er een met het ingestelde startcommando (`[ui] launch` / `launch_command`; standaard uit) en wacht tot 10 s tot het zich aansluit. Zonder deze vlag wordt een venster alleen gestart als `[ui] launch` is ingesteld EN `ui_control` `auto` is"
