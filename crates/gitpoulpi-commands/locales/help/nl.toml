"mailmap" = "De `.mailmap`: één canonieke naam en e-mailadres voor mensen die onder meerdere hebben gecommit. De Log, blame en bestandsgeschiedenis tonen de toegewezen namen (`log.use_mailmap`) zonder een commit aan te raken. `list` telt de identiteiten van de geschiedenis en toont welke zijn toegewezen, `check` toont hoe enkele identiteiten worden omgezet, `add` voegt identiteiten samen tot één door regels aan de `.mailmap` toe te voegen (bewerkt, niet gecommit; ongedaan te maken)"
"mailmap add" = "Voeg identiteiten samen tot één canonieke identiteit door regels aan de `.mailmap` toe te voegen (aangemaakt als hij ontbreekt; een regel die er al staat, wordt niet herhaald). Het bestand wordt bewerkt, niet gecommit: commit het zelf. Eén ongedaan te maken item (`gitpoulpi undo` zet het vorige bestand terug). De Log toont de canonieke identiteit meteen (`log.use_mailmap`); de opgeslagen commits veranderen niet, dus er is geen force push nodig. Om de commits zelf te herschrijven gebruik je een `mailmap`-regel in `rewrite`"
