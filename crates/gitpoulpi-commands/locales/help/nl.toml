"repo-auth set --command" = "Bij `--https token-command`: het commando en zijn argumenten (het eerste woord is het programma). Schrijf `--command` als laatste: elk woord erna, streepjes inbegrepen (`sh -c ...`), hoort bij het commando"
"repo-auth set --helper" = "Bij `--https helper`: het commando van de credential helper. Een persoon bevestigt het, met zijn hash (of geeft `--yes` mee)"
"repo-auth set --hosts" = "Bij `helper` of `token-command`: de hosts die het mag bedienen (kommagescheiden of herhaald)"
"repo-auth set --https" = "HTTPS-identiteit: `system` (de eigen helpers van git), `integration:<id>` (het token van een GitPoulpi-account), `helper` (één credential helper, met `--helper`) of `token-command` (een commando dat een token afdrukt, met `--command` en `--hosts`)"
"repo-auth set --ignore_repo_helpers" = "Bij `--https system`: laat de credential helpers weg die deze repository zelf instelt en behoud die van het systeem en de globale"
"repo-auth set --known_hosts" = "Bij `--ssh key:` of `integration-key:`: het `known_hosts`-bestand"
"repo-auth set --ssh" = "SSH-identiteit: `system` (de eigen configuratie en agent van ssh), `key:<pad>` (een bestand met privésleutel, alleen die wordt aangeboden) of `integration-key:<id>` (de sleutel van een GitPoulpi-account)"
"repo-auth set --strict" = "Bij `--ssh key:` of `integration-key:`: weiger onbekende hostsleutels (`StrictHostKeyChecking=yes`)"
"repo-auth set --username" = "Een gebruikersnaam: bij `system` `credential.username` (laat een credential manager een van meerdere accounts kiezen); bij `integration:<id>` de gebruikersnaam die met het token wordt verstuurd"
"repo-auth set --yes" = "Bevestig een helper of tokencommando zonder de interactieve vraag (het commando en zijn hash worden nog steeds afgedrukt)"
"repo-auth show" = "Toon met welke identiteit deze repository zich authenticeert: het opgeslagen profiel, de identiteit die elke remote gebruikt, de instellingen die het profiel overschrijft en eventuele waarschuwingen. Drukt nooit een geheim af; een helper of tokencommando wordt alleen aan een persoon getoond (een agent krijgt `{set, sha256}`)"
"repo-auth test" = "Test de verbinding van elke remote (of één) met het profiel toegepast, zonder iets te wijzigen: toont de branches van de remote, of vraagt met `--push` of een push zou worden geaccepteerd. Geeft het rapport van elke remote plus de gebruikte identiteit. Gebruikt het netwerk"
"repo-auth test --push" = "Controleer ook of een push zou worden geaccepteerd"
"repo-auth test --remote" = "Alleen deze remote (standaard: elke remote)"
"apply-commit" = "Past de wijzigingen van één commit (ook een verloren commit) alleen toe op de werkmap: de index en HEAD blijven staan. Alles of niets: als een bestand niet netjes past, verandert er niets (`stash from-commit` bewaart de wijzigingen dan als stash). Een merge-commit wordt geweigerd. `undo` maakt het ongedaan"
"apply-commit --commit" = "De commit waarvan de wijzigingen worden toegepast (elke revisie: een sha, `HEAD~2`, ...)"
"stash from-commit" = "Bewaart de wijzigingen van één commit (ook een verloren commit) als nieuwe stash, zonder de werkmap aan te raken. `undo` laat hem weer vallen"
"stash from-commit --commit" = "De commit waarvan de wijzigingen worden bewaard (elke revisie: een sha, `HEAD~2`, ...)"
"stash from-commit --message" = "Het stashbericht; weggelaten, een bericht met de naam van de commit"
"branch upstream" = "De meerdere remotes van een branch: de primaire upstream plus extra push-doelen en pull-bronnen die je zelf aanzet, bewaard in een eigen configuratiesectie"
"branch upstream add" = "Voeg `<remote>[:<dst>]` toe als extra push-doel (`<dst>` is de branchnaam op die remote, standaard dezelfde naam). Ongedaan te maken"
"branch upstream add --branch" = "De branch (standaard: de huidige)"
"branch upstream add --pull" = "Maak er ook een pull-bron van"
"branch upstream add --target" = "`<remote>` of `<remote>:<dst>`"
"branch upstream list" = "De primaire upstream van de branch, zijn extra push-doelen en pull-bronnen, elk met zijn stand (voor, achter, verhouding) volgens de remote-tracking refs zoals ze nu zijn. Leest alleen, geen netwerk"
"branch upstream list --branch" = "De branch (standaard: de huidige)"
"branch upstream primary" = "Stel de primaire upstream in (`origin/main`): hetzelfde verzoek als `branch set-upstream`"
"branch upstream primary --branch" = "De branch (standaard: de huidige)"
"branch upstream pull" = "Zet `<remote>[:<dst>]` aan of uit als pull-bron: een gewone pull neemt hem dan ook mee"
"branch upstream pull --branch" = "De branch (standaard: de huidige)"
"branch upstream pull --off" = "Stop met pullen ervan"
"branch upstream pull --on" = "Maak er een pull-bron van"
"branch upstream pull --target" = "`<remote>` of `<remote>:<branch>`"
"branch upstream remove" = "Verwijder elk extra push-doel en elke pull-bron met de naam `<remote>`. De primaire upstream blijft staan (gebruik `unset-upstream`). Ongedaan te maken"
"branch upstream remove --branch" = "De branch (standaard: de huidige)"
"remote-group" = "Een branch met meerdere remotes (extra push-doelen, pull-bronnen): hoe hij ten opzichte van elk staat. Zie `branch upstream` om ze te wijzigen"
"remote-group status" = "Hoe de huidige branch (of `--branch`) ten opzichte van elk van zijn remotes staat: primaire upstream, extra push-doelen, pull-bronnen. Leest alleen, geen netwerk"
"remote-group status --branch" = "De branch (standaard: de huidige)"
"pull --all_sources" = "Pull de primaire upstream en elke pull-bron van de branch (zie `branch upstream pull`), elk met `--mode`. Maakt eerst een plan: alles behalve een fast-forward of de eigen integratie van de modus vraagt om `--resolve` (exitcode 3, niets gewijzigd). Een stop bij conflicten geeft exitcode 4 met `stopped`; hervat met `remote-group continue`"
"pull --branch" = "Met `--all-sources`: de branch (standaard: de huidige)"
"pull --no_preflight" = "Met `--all-sources`: de remotes niet eerst bevragen"
"pull --resolve" = "Met `--all-sources`: `REMOTE=ff|merge|rebase|skip` (herhaalbaar), de beslissing voor een remote waarover het plan vroeg"
"push --all_targets" = "Push naar de primaire upstream en elk extra push-doel van de branch (zie `branch upstream add`). Maakt eerst een plan: is elke remote een gewone push of al actueel, dan wordt het uitgevoerd, anders volgt het antwoord `needs_resolution` (exitcode 3, niets gewijzigd). Exitcode 4: een remote is mislukt of een merge stopte bij conflicten (`stopped`)"
"push --no_preflight" = "De remotes niet eerst bevragen (gebruik de remote-tracking refs)"
"push --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (herhaalbaar): de beslissing voor een remote waarover het plan vroeg"
"push --tags" = "Push ook de nog niet gepushte tags naar elke remote die de branch heeft aangenomen"
"push --to" = "Push naar precies deze remotes (`<remote>` of `<remote>:<dst>`, herhaalbaar), alleen voor deze push; de configuratie verandert niet. Hetzelfde plan, `--resolve` en dezelfde uitvoering als bij `--all-targets`"
"push --yes" = "Bevestig een force push gekozen met `--resolve REMOTE=force`. Zonder dit wijzigt zo'n push niets en eindigt hij met exitcode 3"
"remote-group abort" = "Laat de bewaarde groepsuitvoering vallen: breekt de merge of rebase af die ze startte. Al gedane pushes blijven"
"remote-group abort --run" = "De id van de bewaarde uitvoering, om zeker te zijn dat het nog de bedoelde is"
"remote-group continue" = "Hervat de bewaarde groepsuitvoering zodra haar merge of rebase is afgerond (nooit automatisch). Beantwoordt een `needs_resolution` met `--resolve`"
"remote-group continue --branch" = "De branch (standaard: de huidige); alleen gelezen met `--resolve`"
"remote-group continue --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (herhaalbaar): de beslissing voor een remote waarover het vorige antwoord vroeg"
"remote-group continue --run" = "De id van de bewaarde uitvoering, om zeker te zijn dat het nog de bedoelde is"
"remote-group continue --yes" = "Bevestig de force pushes die `--resolve` noemt"
"remote-group plan" = "Wat een gegroepeerde push (of, met `--pull`, een gegroepeerde pull) per remote zou doen: hoe elke remote staat, de voorgestelde actie en de andere toegestane. Bevraagt de remotes (`ls-remote`, een fetch van de remotes waarvan de tip onbekend is) tenzij `--no-preflight`; wijzigt niets"
"remote-group plan --branch" = "De branch (standaard: de huidige)"
"remote-group plan --no_preflight" = "De remotes niet bevragen: gebruik de remote-tracking refs zoals ze zijn"
"remote-group plan --pull" = "Plan de gegroepeerde pull (de primaire en de pull-bronnen)"
