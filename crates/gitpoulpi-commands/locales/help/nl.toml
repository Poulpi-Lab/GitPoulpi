rm-file = "Verwijder bestanden (of mappen) uit de werkmap; de index blijft ongemoeid, dus een gevolgd bestand verschijnt als verwijderde wijziging. Ongedaan te maken met `gitpoulpi undo`, dat de exacte bytes herstelt"
"rewrite apply --target" = "De map van de nieuwe repository wanneer het plan een submap als kloon of als submodule extraheert (zie `--extract-mode`)"
"rewrite maps" = "De `commit-map` en `ref-map` van de run (formaat van git-filter-repo: een koptekstregel, daarna `oud nieuw` per regel; de repositoryopruiming van GitLab neemt de commit-map). Drukt hun paden af, of kopieert ze naar `--out`"
"rewrite maps --out" = "Kopieer beide bestanden naar deze map (wordt aangemaakt als hij ontbreekt)"
"rewrite maps --run" = "De run-id; `latest` (standaard) is de laatst toegepaste run"
"rewrite note" = "De notitie voor wie de oude geschiedenis heeft: per gepushte branch en tag de oude en nieuwe tip en wat er moet gebeuren (`git fetch`, dan `git reset --hard origin/<branch>` of `git rebase --onto`). Leest alleen"
"rewrite note --run" = "De run-id; `latest` (standaard) is de laatst toegepaste run"
"rewrite preview --extract" = "Padregel: bewaar alleen deze submap, die de root wordt; de commits die haar niet raken vervallen en merges worden vereenvoudigd. Wordt elke keer gevraagd: geef `--extract-mode` op, anders is de afsluitcode 3 en wordt er niets in voorbeeld getoond. De extractie loopt vóór de andere padvlaggen"
"rewrite preview --extract_mode" = "Hoe `--extract` eindigt: `clone` (een nieuwe lokale kloon in `--target`, het origineel blijft ongemoeid; elke lokale branch en tag), `in-place` (de geschiedenis van deze repository wordt herschreven, één ongedaanmaak-item) of `submodule` (de kloon zoals bij `clone`, en één nieuwe commit op de huidige branch vervangt de map door een submodule ervan; deze geschiedenis blijft behouden)"
"rewrite preview --into_subdir" = "Padregel: verplaats de hele repository in elke commit naar deze submap (om repositories samen te voegen zonder padconflicten)"
"rewrite preview --move_paths" = "Padregel `VAN=NAAR`: hernoem een bestand of map in elke commit, met dezelfde blobs en trees op het nieuwe pad (herhaalbaar, op volgorde, na de inhoudsregels). Een commit waarin `NAAR` al bestaat, wordt niet gewijzigd: het voorbeeld wordt geweigerd (afsluitcode 2, `path_collision`) en toont de commits en paden"
"rewrite preview --target" = "De map van de nieuwe repository voor `--extract-mode clone` of `submodule`: ze mag niet bestaan of moet leeg zijn, en mag niet in deze repository liggen. Gebruikt door `rewrite run`; `rewrite apply` heeft een eigen vlag"
"rewrite push" = "Pusht de refs die een toegepaste run heeft verplaatst en die op een remote stonden, elk met `--force-with-lease=<ref>:<de id die de remote had toen je het voorbeeld bekeek>` (nooit een gewone force), met één `--atomic` push per remote waar de server dat toestaat (anders één push per ref, en het antwoord zegt dat). Tags zijn inbegrepen. Beschermde branches (`rewrite.protected_branches`) blijven buiten beschouwing, tenzij ze met `--include-protected` worden genoemd, of allemaal met `--include-all-protected`. Een ref waarvan de remote sinds het voorbeeld is verschoven, wordt voor die ref geweigerd (fetch en bekijk opnieuw, voer het dan nog eens uit). Niet ongedaan te maken: de remote houdt de nieuwe geschiedenis, ook als je de herschrijving lokaal met `undo` terugdraait. Zonder `--yes` (of met `--dry-run`) wordt er niets verstuurd: het antwoord toont wat er gepusht zou worden, en de afsluitcode is 3 zonder `--yes`. Afsluitcode 2 als de run weg is, 4 als een ref is geweigerd of niet gepusht"
"rewrite push --dry_run" = "Vraag de remote wat er zou gebeuren (leases gecontroleerd) en verstuur niets"
"rewrite push --include_all_protected" = "Push ook elke beschermde branch van de run"
"rewrite push --include_protected" = "Push ook deze beschermde branch (herhaalbaar)"
"rewrite push --no_atomic" = "Eén push per ref in plaats van één alles-of-niets `--atomic` push"
"rewrite push --remote" = "Alleen de refs van deze remote"
"rewrite push --run" = "De run-id die `rewrite apply` heeft afgedrukt; `latest` (standaard) is de laatst toegepaste run"
"rewrite push --yes" = "Ga door en push. Zonder dit wordt er niets verstuurd (afsluitcode 3)"
"rewrite purge" = "Verwijdert de oude geschiedenis van een herschrijving voorgoed uit deze kloon: laat de pins voor ongedaan maken van de herschrijving vallen (en die van elke eerdere bewerking waarvan de pins ook de oude geschiedenis vasthouden), laat de reflog-items die ernaar verwijzen verlopen, ruimt de objecten op (`gc --prune=now`) en controleert dat ze weg zijn. Ongedaan maken is daarna niet meer mogelijk voor die bewerkingen (ze blijven in `undo --list` staan als opgeruimd). Het kan niet worden gestopt zodra het begint en het kan niet ongedaan worden gemaakt. Alles wat de oude geschiedenis nog vasthoudt (een branch buiten de herschrijving, een stash, de HEAD van een andere worktree, een remote-tracking ref: fetch na de push) houdt het tegen en er wordt niets gewijzigd. Er wordt niets naar een remote gestuurd; het antwoord somt de stappen op die de host nodig heeft (GitHub, GitLab, Azure DevOps, Bitbucket). Zonder `--yes` gebeurt er niets: het antwoord zegt wat er zou worden verwijderd en verloren gaat, en de afsluitcode is 3. Afsluitcode 2 als het item geen herschrijving is, 4 als iets het tegenhoudt of er objecten overblijven. Via MCP alleen met `[mcp] allow_history_purge = true`"
"rewrite purge --all" = "Elke herschrijving van de geschiedenis in de ongedaanmaakgeschiedenis"
"rewrite purge --entries" = "Een herschrijving van de geschiedenis uit de ongedaanmaakgeschiedenis (`undo --list`; herhaalbaar). Standaard: de nieuwste herschrijving die nog niet is opgeruimd"
"rewrite purge --latest" = "De nieuwste herschrijving die nog niet is opgeruimd (de standaard)"
"rewrite purge --yes" = "Ga door en verwijder. Zonder dit verandert er niets (afsluitcode 3)"
"rewrite run --extract" = "Padregel: bewaar alleen deze submap, die de root wordt; de commits die haar niet raken vervallen en merges worden vereenvoudigd. Wordt elke keer gevraagd: geef `--extract-mode` op, anders is de afsluitcode 3 en wordt er niets in voorbeeld getoond. De extractie loopt vóór de andere padvlaggen"
"rewrite run --extract_mode" = "Hoe `--extract` eindigt: `clone` (een nieuwe lokale kloon in `--target`, het origineel blijft ongemoeid; elke lokale branch en tag), `in-place` (de geschiedenis van deze repository wordt herschreven, één ongedaanmaak-item) of `submodule` (de kloon zoals bij `clone`, en één nieuwe commit op de huidige branch vervangt de map door een submodule ervan; deze geschiedenis blijft behouden)"
"rewrite run --into_subdir" = "Padregel: verplaats de hele repository in elke commit naar deze submap (om repositories samen te voegen zonder padconflicten)"
"rewrite run --move_paths" = "Padregel `VAN=NAAR`: hernoem een bestand of map in elke commit, met dezelfde blobs en trees op het nieuwe pad (herhaalbaar, op volgorde, na de inhoudsregels). Een commit waarin `NAAR` al bestaat, wordt niet gewijzigd: het voorbeeld wordt geweigerd (afsluitcode 2, `path_collision`) en toont de commits en paden"
"rewrite run --target" = "De map van de nieuwe repository voor `--extract-mode clone` of `submodule`: ze mag niet bestaan of moet leeg zijn, en mag niet in deze repository liggen. Gebruikt door `rewrite run`; `rewrite apply` heeft een eigen vlag"
"rm-file --paths" = "Repo-relatieve te verwijderen paden"
shell-init = """Drukt een shell-wrapperfunctie af (standaardnaam `gp`) die gitpoulpi uitvoert en, als je afsluit met "Afsluiten & cd hier", je shell in de map van het actieve tabblad achterlaat. Voeg hem toe aan het rc-bestand van je shell: `eval "$(gitpoulpi shell-init bash)"`. Er wordt niets geïnstalleerd of bewerkt"""
