"hosting integrations radar" = "Toont of wijzigt de Radar-instellingen van een profiel (`[integrations.radar]`): welke accountbrede lijsten `hosting radar` en de Radar ophalen, de namespaces om in te zoeken en wat een review van een niet-gekloond verzoek doet. Zonder optie drukt het alleen de huidige instellingen af"
