"flow sync --merge" = "Merge in plaats van te rebasen"
"flow sync --no_hooks" = "Slaat de geconfigureerde hooks over zonder te vragen"
"flow sync --rebase" = "Rebase in plaats van te mergen"
"flow sync --run_hooks" = "Voert de hooks uit die de workflow voor deze actie configureert (shellopdrachten uit het workflowbestand, getoond met hun uitvoer). Nooit uitgevoerd tenzij erom gevraagd wordt; zonder deze vlag wordt het in een terminal gevraagd"
"flow sync --stack" = "Werkt ook de branches bij waarvan deze de bovenliggende branch is, recursief"
"flow sync --yes" = "Voert het plan uit zonder te vragen. Zonder deze vlag wordt het in een terminal gevraagd; anders drukt het plan af en eindigt met afsluitcode 3"
"flow templates" = "De ingebouwde workflowsjablonen (Git Flow, GitHub Flow, GitLab Flow, Trunk-based, Custom) met hun basisbranches en branchtypen"
"flow trust-hooks" = "Bekijk en vertrouw de workflowhooks die de repository commit (de `[hooks]` van `.gitpoulpi/workflow.toml`): shellopdrachten die op je computer zouden draaien. Zonder `--hash` drukt het alleen `{hash, hooks, trusted}` af; met de hash onthoudt het het vertrouwen, maar alleen als het bestand op schijf nog precies die hash heeft, zodat vertrouwd wordt wat je las. Een gewijzigd bestand vraagt opnieuw. Hooks van je eigen override hebben dit nooit nodig. Alleen een persoon kan dit doen: er is geen MCP-tool voor"
"flow trust-hooks --hash" = "De hash die `flow trust-hooks` afdrukt (of een geweigerde `--run-hooks`): vertrouw de hooks met die hash"
"alias" = "De opdrachtalias (`gp` of een andere naam) waarmee GitPoulpi vanuit een terminal start: het scriptbare equivalent van Instellingen > Starter"
"alias create" = "Zorgt dat `<name>` (bijvoorbeeld `gp`) GitPoulpi start: een link op Linux en macOS, een `.cmd`-bestand op Windows, in een bin-map per gebruiker. Een bestand dat niet van GitPoulpi is, wordt nooit vervangen. Zet de map op PATH met `path add`"
"alias create --add" = "Maakt de toevoegvariant (bijvoorbeeld `gpa`): die voert `gitpoulpi --add` uit, dat de huidige map als nieuw tabblad opent in het al draaiende GitPoulpi"
"alias create --name" = "De opdrachtnaam: alleen letters, cijfers, `-`, `_` en `.`"
