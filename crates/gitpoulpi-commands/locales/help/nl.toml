convert = "Herschrijft de codering, de regeleinden of de inspringing van bestanden in de werkmap, met de functies van de editor van de TUI en zijn menu Converteren. Precies één van `--encoding`, `--eol` en `--indent`. Binaire bestanden, ontbrekende bestanden en bestanden die de doelcodering niet kan weergeven worden overgeslagen en gemeld, nooit beschadigd. Eén journaalitem voor de hele reeks: `gitpoulpi undo` zet alle bestanden terug"
