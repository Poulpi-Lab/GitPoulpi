"rewrite script check#long" = """
Compileer een Lua-script en druk de header af (naam, venster, parameters), de functies die het definieert en elk probleem. Afsluitcode 2 bij problemen. Leest alleen; er draait niets op een commit.

Bij een shell-, Python- of externe Lua-script (geen sandbox) zegt het ook of de interpreter is gevonden en het script wordt vertrouwd, en bij een vertrouwd script voert het een droge handdruk uit: het start het script één keer met een verzonnen commit (`"dry_run": true`) en controleert het antwoord. Een niet-vertrouwd script wordt nooit gestart."""
