ai = "AI-hulpjes (uit, tenzij `ai.enabled = true`): een gegenereerd commitbericht afdrukken, of een commit of de werkwijzigingen uitleggen"
"ai --print_sent" = "Drukt af wat naar het model zou worden verstuurd (de systeem- en gebruikerstekst nadat geheimen zijn gemaskeerd en gevoelige bestanden zijn weggelaten) en verstuurt niets. Vereist `ai.enabled = true`, maar geen sleutel en geen netwerk"
"ai --send_all" = "Verstuurt elke invoer volledig, ook boven zijn `ai.limits.*`-limiet. Zonder deze optie wordt een invoer boven een limiet ingekort (een conflict wordt geweigerd) en meldt het antwoord wat is weggelaten in `truncated: [{part, detail?, bytes, limit, setting}]`"
"commit --send_all" = "Met `--ai`: verstuurt de hele diff, ook boven `ai.limits.diff_bytes`. Zonder deze optie wordt een grotere diff ingekort en meldt het antwoord dat (`truncated`)"
"hosting review suggest --send_all" = "Verstuurt elke invoer volledig, ook boven zijn `ai.limits.*`-limiet (de diff, de diff van een bestand, de beschrijving, de bestaande opmerkingen, de contextbestanden). Zonder deze optie wordt een invoer boven een limiet ingekort en meldt het antwoord wat is weggelaten in `truncated`"
"stash push --send_all" = "Met `--ai`: verstuurt de hele diff, ook boven `ai.limits.diff_bytes`. Zonder deze optie wordt een grotere diff ingekort en meldt het antwoord dat (`truncated`)"
"ai commit-message" = "Drukt het commitbericht af dat de AI voorstelt voor de gestagede wijzigingen (of alle wijzigingen als er niets gestaged is). Commit niets"
"ai explain" = "Legt een commit uit (standaard HEAD) of, met --wip, de werkwijzigingen"
"ai resolve-conflict" = "Drukt de oplossing af die de AI voorstelt voor ÉÉN merge-conflict van een bestand met conflict (`--conflict N`, vanaf 1; optioneel als het bestand één conflict heeft). Drukt alleen af: er wordt niets geschreven of gestaged, dus de aanroeper beslist (`conflicts resolve --content-file` past een resultaat voor het hele bestand toe). Vereist `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Welk conflict van het bestand, vanaf 1"
"ai resolve-conflict --path" = "Het bestand met conflict, relatief aan de repositorywortel"
autostash = "De openstaande auto-stash: GitPoulpi heeft lokale wijzigingen opzijgezet om een checkout, merge, rebase of pull uit te voeren en heeft ze nog niet teruggezet"
"ai review-context" = "Toont of stelt in wat een ✦ codereviewconcept krijgt naast de diff (`[ai.review]`): de CLAUDE.md en AGENTS.md van de repository, nog een bestand (een pad of een link) en of een lokale agent in de repository draait. Zonder `--repo` en `--project` is het de globale standaard; `--repo PATH` is de eigen waarde van één gekloonde repository, `--project HOST/PROJECT` die van een niet-gekloonde repository. Zonder instelvlag drukt het de waarden af (`effective` is wat een review krijgt); met een vlag slaat het die op en drukt het het resultaat af. Heeft geen model nodig en werkt ook met AI uit"
"ai review-context --agents_md" = "Geef het model de AGENTS.md van de repository"
"ai review-context --claude_md" = "Geef het model de CLAUDE.md van de repository"
"ai review-context --context_file" = "Nog een bestand: een pad relatief aan de repositorywortel, een absoluut pad of een link naar een bestand van een codehost"
"ai review-context --no_context_file" = "Geen extra bestand"
"ai review-context --no_extra_file" = "Geen extra bestand voor de repository of het project, wat de globale waarde ook zegt (`on`, de standaard als het alleen staat); `off` laat het de globale waarde weer volgen"
"ai review-context --project" = "Een niet-gekloonde repository, als `HOST/PROJECT` (`github.com/owner/name`)"
"ai review-context --reset" = "Met `--repo` of `--project`: vergeet de eigen waarden van de repository (ze volgt de globale weer) voordat de vlaggen worden toegepast"
"ai review-context --run_in_repo" = "Een lokale agent in de repository laten draaien (`yes`), niet daar (`no`) of zoals zijn AI-profiel zegt (`profile`). Niet voor `--project`"
"autostash start-over" = "Opnieuw beginnen: gooit de wijzigingen in de werkmap op de bestanden van de stash weg (een kopie blijft onder `refs/gitpoulpi-backup/`), maakt de bewerking ongedaan die de auto-stash maakte (pull, checkout, merge, rebase) en doet dan een pop van de stash op de oorspronkelijke commit. Stopt met de stash intact als een stap mislukt. Afsluitcode 1 bij weigering, 3 als `--yes` nodig is"
"autostash start-over --dry_run" = "Toon wat er zou gebeuren en wijzig niets"
"autostash start-over --yes" = "Ga door; zonder verandert er niets en is de afsluitcode 3"
blame = "Toeschrijving per regel voor een bestand bij een revisie"
"blame --at" = "Revisie om te blamen (standaard: HEAD)"
"branch delete-remote" = "Verwijdert een branch van een remote en behoudt een lokale branch met die naam"
"branch fast-forward" = "Verplaatst `<branch>` vooruit naar `<target>`, alleen als dat een fast-forward is (uiteengelopen geschiedenis wordt geweigerd, er beweegt niets). De uitgecheckte branch neemt zijn werkmap mee, zoals `git merge --ff-only`; bij elke andere branch wordt alleen zijn ref verplaatst"
"branch fast-forward --target" = "Een willekeurige revisie (standaard: HEAD)"
"branch set-upstream" = "Laat `<branch>` `<upstream>` volgen (`origin/main`)"
"branch track" = "Maakt een lokale branch die een remote-tracking branch volgt en checkt hem uit. `<upstream>` wordt gespeld zoals de refslijst het spelt (`origin/feature/login`); `--name` is standaard het branchgedeelte"
"branch unset-upstream" = "Verwijdert de upstream van `<branch>`"
"checkout --autostash" = 'Stasht lokale wijzigingen die dit blokkeren, voert het uit en popt dan de stash (wat `general.auto_stash = "always"` doet)'
"cherry-pick --commits" = "Toe te passen commits, in volgorde. Weggelaten als `--plan` is opgegeven"
"cherry-pick --plan" = "Een JSON `Vec<RebaseStep>` (zelfde vorm als `rebase --plan`; zie `rebase-plan`), uit een bestandspad of `-` voor stdin: de stappen worden in lijstvolgorde gecherry-pickt. Alleen de acties `Pick` en `Drop` zijn hier zinvol (`Drop` slaat de commit over); elke andere actie wordt geweigerd. Kan niet worden gecombineerd met positionele commits"
"clone --branch" = "Check deze branch uit in plaats van de standaard-HEAD van de remote"
"clone --depth" = "Kap de geschiedenis af tot dit aantal commits (`git clone --depth`)"
"clone --no_lfs" = "Laat Git LFS-bestanden als pointers staan in plaats van hun inhoud na het klonen te downloaden"
"clone --origin" = "Geef de nieuwe remote een andere naam dan `origin`"
"clone --recurse_submodules" = "Kloon ook submodules"
"commit --ai" = "Laat de AI het bericht schrijven op basis van de gestagede diff, met de Commitbericht-instructies van de repository (Instellingen > AI). Vereist `ai.enabled = true` en een ingesteld profiel"
"commit --message" = "Het commitbericht. Vereist, tenzij --ai het schrijft"
"commit --no_verify" = "Slaat de commit-hooks (`pre-commit`, `commit-msg`) over, zoals `commit --no-verify`"
completions = "Drukt een shell-aanvullingsscript af op stdout (bash, zsh, fish, powershell of elvish), bijv. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Breekt de lopende bewerking af: HEAD, de index en de werkmap keren terug naar vóór de bewerking. Gooit de sindsdien gemaakte oplossingen weg"
"conflicts skip" = "Slaat de lopende cherry-pick of revert over (of de commit waar een rebase op staat): HEAD, de index en de werkmap keren terug naar HEAD. De uitweg als hij leeg is geworden (de wijziging is al toegepast). Een merge heeft niets om over te slaan"
"conflicts check" = "Zou een merge van HEAD in de branch waarvan hij is vertrokken een conflict geven, en in welke bestanden? Er wordt niets aangeraakt (een merge in het geheugen). De basis is het doel van de bekende pull request van de branch, anders de branch die de patronen van Basisbranches toelaten met de minste commits sinds de afsplitsing. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Uit als `general.conflict_detection` of de schakelaar van de repository uit staat"
"conflicts list" = "De bestanden met conflict, elk met de tekst van zijn drie kanten. Met `--names-only`: alleen het pad, het soort conflict en de stage-oids (er wordt geen blob gelezen; goedkoop bij een grote merge)"
"conflicts resolve" = 'Lost één bestand op en staget het (het bestand is niet langer in conflict). Precies één van `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` of `--delete`. A en "ours" zijn de huidige kant (`HEAD`; tijdens een rebase de branch waarop wordt gerebased), B en "theirs" de inkomende kant. Bewerk conflictmarkeringen nooit met de hand: kies, of schrijf de definitieve tekst naar een bestand'
"conflicts resolve --both" = "Behoud beide kanten van elk conflict (A dan B), en de eigen merge van git overal elders"
"conflicts resolve --content_file" = "De definitieve bestandstekst, exact (`-` leest standaardinvoer)"
"conflicts resolve --delete" = "Accepteer de verwijdering: verwijder het bestand (`git rm`)"
"conflicts resolve --encoding" = "Met `--content-file`: schrijf de tekst in deze codering (een WHATWG-label zoals `windows-1252`) in plaats van UTF-8"
"conflicts resolve --expect" = "De stage-oids waartegen de beslissing is genomen, `base,ours,theirs` (gebruik `-` voor een ontbrekende stage). De aanroep wordt als `stale` geweigerd als de index niet meer precies deze bevat. `--both` en `--pick` controleren altijd de stages die ze lezen"
"conflicts resolve --no_stage" = "Schrijf het bestand in de werkmap maar laat het in conflict (een gewone opslag)"
"conflicts resolve --ours" = "Hetzelfde als `--side ours`"
"conflicts resolve --pick" = "Een keuze per conflictnummer: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = beide in die volgorde). Elk conflict heeft er een nodig, tenzij `--default` de rest dekt"
"conflicts resolve --pick_default" = "Met `--pick`: de keuze voor elk conflict dat niet is vermeld"
"conflicts resolve --side" = "Neem het hele bestand van één stage, geen auto-merge"
"conflicts resolve --theirs" = "Hetzelfde als `--side theirs`"
"conflicts resolve --theirs_first" = "Met `--both`: B dan A"
"conflicts show" = "Eén bestand met conflict zoals de merge-editor het ziet: de paneellabels, de drie kanten en de genummerde conflictgebieden (`--json` is het volledige document). Samengevoegde gebieden die git zelf heeft opgelost worden niet getoond; ze blijven in het resultaat van `resolve --both`/`--pick`"
"conflicts show --conflict" = "Alleen conflict N (vanaf 1)"
"conflicts state" = "De lopende merge, rebase, cherry-pick of revert (`null` als er geen is)"
"conflicts unresolve" = "Zet een tijdens deze bewerking opgelost bestand terug in conflict (weer markeringen). Geweigerd als het nog in conflict is of niet werd opgelost terwijl de bewerking liep"
daemon = '`gitpoulpi server ...` is een zichtbare alias - de eigenaar noemt deze groep "de server" en typt `gp server stop`'
"daemon restart" = "`daemon stop` gevolgd door `daemon start`"
"daemon run" = "Draait de daemon van deze sessie op de voorgrond (blokkeert; Ctrl-C om te stoppen, of een `daemon stop`/`daemon restart` van elders). Dit is wat `daemon start` losgekoppeld start, en wat een eigen terminal ook direct kan uitvoeren"
"daemon start" = "Start de daemon van deze sessie als losgekoppeld achtergrondproces (of meldt dat hij al draait). `--backend` pint de backend die het gestarte proces moet gebruiken; weggelaten bepaalt het gestarte proces `general.default_backend` zelf"
"daemon status" = "Of de daemon van deze sessie luistert en zo ja zijn poort, PID, uptime, backend en buildversie"
"daemon stop" = "Vraagt de daemon van deze sessie netjes af te sluiten, en valt alleen terug op het doden van zijn vastgelegde PID als hij niet op tijd antwoordt en alleen als het een zelfstandige daemon is (nooit een die in een draaiende TUI is ingebed)"
"daemon stop --all" = "Stop de daemon van elke sessie waarvoor `session list` een poortbestand meldt, niet alleen deze"
discard = "Verwerp de *unstaged* wijzigingen van een bestand in de werkmap: één hunk (`--hunk`), enkele regels ervan (`--hunk --lines`), of - met alleen `--file` - elke niet-gecommitte wijziging aan het bestand, ook gestagede (een niet-gevolgd bestand wordt verwijderd). Hunks en regels worden genummerd zoals `gitpoulpi diff --json` de unstaged diff nummert. Alles wat wordt verworpen blijft bewaard in een veiligheidssnapshot, zodat `gitpoulpi undo` het terugbrengt (niet-gevolgde bestanden inbegrepen). Niet bevestigd: dit is de scripting-interface"
"discard --lines" = "Door komma's gescheiden regelindices binnen `--hunk`"
"fetch --all" = "Haal elke ingestelde remote op"
"fetch --prune" = "Laat remote-tracking branches vallen die de remote niet meer heeft"
"fetch --prune_tags" = "Verwijder ook de lokale tags die de remote heeft verwijderd (alleen tags die erop stonden: een tag die nooit is gepusht blijft staan). Git's `fetch.pruneTags`, maar beperkter; uit tenzij gevraagd"
"fetch --remote" = "Weggelaten: de standaardremote van de repository (zie `remote default`)"
gitpoulpi = "Lichtgewicht platformonafhankelijke TUI-Git-client, scriptbaar via CLI/MCP."
"gitpoulpi --add" = "Opent een map als nieuw tabblad in het al draaiende GitPoulpi, in plaats van er nog een te starten (`gp -a`, `gp --add ../andere`). PATH is standaard de huidige map en wordt omgezet naar de repository eromheen. Eén draaiende sessie: die krijgt het tabblad en haar venster komt naar voren als het bureaublad dat toestaat. Meerdere: je kiest er een uit een genummerde lijst (of geeft `--session NAAM` mee). Geen: GitPoulpi start gewoon, op die map. Neemt geen subopdracht; met `--json` komt er één object (`action` is `joined` of `cancelled`), afsluitcode 0 als het tabblad open is, 3 als een bezet venster het aanbood op zijn statusbalkchip"
"gitpoulpi --no_raise" = "Met `--add`: vraag het venster niet zijn terminal naar voren te halen"
"gitpoulpi --backend" = "Op welke `GitBackend` de daemon van dit commando draait, wat `general.default_backend` in config.toml en `GITPOULPI_GENERAL_DEFAULT_BACKEND` overschrijft (vlaggen staan bovenaan de voorrangsladder - zie docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
Op welke `GitBackend` de daemon van dit commando draait, wat `general.default_backend` in config.toml en `GITPOULPI_GENERAL_DEFAULT_BACKEND` overschrijft (vlaggen staan bovenaan de voorrangsladder - zie docs/user/config-reference.md).

Het kiest de backend voor een daemon die dit commando *start*. Een sessie waarvan de daemon al draait behoudt de backend waarmee die daemon is gebouwd; `gitpoulpi` kan de backend van een draaiende daemon niet onder de al geabonneerde clients vandaan verwisselen, en doen alsof zou dezelfde stille no-op zijn die deze vlag juist wil vermijden."""
"gitpoulpi --cwd_file" = """Bestand waarnaar de TUI de map van het actieve tabblad schrijft bij het afsluiten ("Afsluiten & cd hier", of altijd met `ui.tab_dir_follow = "auto"`). Bedoeld voor de wrapper die `gitpoulpi shell-init` afdrukt; genegeerd door elk subcommando, omdat alleen de TUI tabbladen heeft"""
"gitpoulpi --json" = "Geef gestructureerde JSON in plaats van voor mensen leesbare uitvoer"
"gitpoulpi --lang" = "Taal van de `--help`-tekst (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
Taal van de `--help`-tekst (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Alleen uitleg wordt vertaald - commando- en vlagnamen veranderen nooit - en `--help` blijft Engels tenzij dit is opgegeven (de omgeving wordt bewust genegeerd, zodat scripts stabiele uitvoer krijgen). Voorbeeld: `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Repository waarop te handelen. Standaard de repository die de huidige map omvat, dus `gitpoulpi status` gedraagt zich als `git status`; een agent die meerdere repo's bestuurt geeft dit door in plaats van te chdir'en"
"gitpoulpi --session" = "Benoemde sessie om te targeten. Weggelaten wordt hij afgeleid van de wortel van de huidige repository (zie `gitpoulpi_config::default_session_name`), dus twee repositories krijgen twee onafhankelijke daemons terwijl alles wat binnen één repository wordt geopend er één deelt. Geef dit door om twee repositories op één sessie te dwingen, of om een sessie expliciet te benoemen. De waarde wordt vóór gebruik opgeschoond - hij wordt een bestandsnaam"
"hosting checkout-pr" = "Checkt een pull/merge request uit, ook een uit een fork: haalt zijn head op (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) in de lokale branch `pr/<n>` (`mr/<n>` op GitLab), volgt hem en schakelt ernaar over"
"hosting checkout-pr --id" = "Welke integratie (zie `hosting prs`)"
"hosting checkout-pr --no_checkout" = "Alleen ophalen en de branch maken/bijwerken; blijf waar je bent"
"hosting checkout-pr --number" = "Het PR-nummer (GitHub) of de MR-`iid` (GitLab)"
"hosting checkout-pr --remote" = "De remote waarop het verzoek staat. Standaard degene waaruit het project is bepaald, anders de standaard van de repository"
