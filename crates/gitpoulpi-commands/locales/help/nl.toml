"hosting clone --project" = "Het volledige pad van het project, zoals `hosting projects` het afdrukt"
"hosting edit-url" = "Drukt de URL af waar een pull/merge request wordt bewerkt (GitLabs weergave `.../edit`; GitHub bewerkt ter plaatse op de pagina van het verzoek). Met een nummer dat verzoek; anders dat voor `--branch` (standaard: de uitgecheckte branch). Volgt de pull/merge-requestlink van de repository zoals `prs`. Start de browser alleen met `--open`"
