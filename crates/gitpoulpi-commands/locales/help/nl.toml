"alias remove --name" = "De te verwijderen alias (standaard: elke alias die GitPoulpi heeft gemaakt)"
"alias status" = "Toont de opdrachtaliassen die GitPoulpi heeft gemaakt (en wat elk uitvoert) en de namen in `ui.command_alias` en `ui.command_alias_add`"
"path" = "Zet GitPoulpi op het PATH van de gebruiker, voor nieuwe terminals"
"path add" = "Zet de map waarin GitPoulpi staat en de aliasmap op het PATH van de gebruiker voor nieuwe terminals: een gemarkeerd blok in de opstartbestanden van de shell (Linux, macOS) of het gebruikers-PATH in het register (Windows). Mappen die al op PATH staan, blijven ongemoeid"
"path remove" = "Haalt precies weg wat `path add` daar heeft gezet"
"path status" = "Toont of de map waarin GitPoulpi staat en de aliasmap op het PATH van de gebruiker staan, en wat GitPoulpi heeft toegevoegd"
"uninstall" = "Verwijdert wat het installatieprogramma en Instellingen hebben gemaakt (opdrachtaliassen, de PATH-vermeldingen, de snelkoppelingen) en, bij een release-installatie, de programmabestanden. Weigert bij een build die geen release-installatie is (geen markering `.gitpoulpi-dist` naast het exe-bestand). Je configuratie, sessies en repositories worden nooit aangeraakt"
"uninstall --keep_files" = "Laat de programmabestanden staan (het Windows-verwijderprogramma verwijdert ze zelf, omdat een draaiend exe-bestand dat niet kan)"
"launch" = "Wat de snelkoppelingen van GitPoulpi uitvoeren: toont het venster van een al geopende GitPoulpi (`ui.reuse_window`), anders start het COMMAND (de terminal waarin GitPoulpi draait). Start niets en geen daemon als het een venster kan tonen"
"launch --command" = "De opdracht om te starten als er geen venster is om te tonen, na `--`"
"launch --folder" = "Open deze map: met `ui.reuse_window` aan en een open venster wordt de repository die de map bevat een tabblad van het laatst gefocuste venster (zonder vraag); anders start GitPoulpi in de gekozen terminal op die map. Wat het item \"Openen in GitPoulpi\" van de bestandsbeheerder uitvoert"
"launch --new_window" = "Start een nieuw venster, ook als er al een open is"
"ai split-plan" = "Toont een plan dat de AI voorstelt om een commit in meerdere commits te splitsen, in de JSON die `split-commit --plan` accepteert. Past niets toe: bekijk het en geef het door aan `split-commit`. Vereist `ai.enabled = true`"
"ai split-plan --rev" = "De te splitsen commit (elke revisie: een sha, `HEAD~2`, ...)"
"ai rewrite-script" = "Drukt een Lua-script af dat de AI schrijft voor een herschrijving van de geschiedenis op basis van jouw instructie (\"verplaats elke commit die 's nachts is gemaakt naar de volgende ochtend\"), met het resultaat van `rewrite script check` erop. Voert niets uit en wijzigt niets: lees het script, dan `rewrite script test` en `rewrite preview --script`. Stuurt alleen jouw instructie mee, plus, met `--sample N`, de auteur, datum en het onderwerp van N commits (nooit bestandsinhoud). Vereist `ai.enabled = true`"
"ai rewrite-script --instruction" = "Wat het script moet doen, in je eigen woorden"
"ai rewrite-script --sample" = "Stuur ook de auteur, datum en het onderwerp van de nieuwste N commits mee (maximaal 50), zodat het model ziet hoe de gegevens eruitzien. Standaard uit: zonder dit verlaat er geen commitgegeven de machine"
"ai rewrite-rules" = "Toont de regels en instellingen die de AI voorstelt voor het herschrijven van de geschiedenis op basis van je beschrijving (\"mijn oude e-mail a@b in alle commits vervangen door c@d\", \"secrets.txt uit de hele geschiedenis verwijderen\"), als het JSON-recept dat `rewrite preview --recipe-json` leest (bewaar het veld `recipe` in een bestand voor `--recipe`), plus wat is weggelaten en waarom. Maakt geen voorbeeld en past niets toe: lees de regels en voer dan zelf `rewrite preview` en `rewrite apply` uit. Stuurt alleen je beschrijving en, met `--context`, de huidige branch, de namen van branches en tags en de auteurs van de nieuwste 200 commits (nooit bestandsinhoud). Vereist `ai.enabled = true`"
"ai rewrite-rules --description" = "Hoe de geschiedenis moet worden herschreven, in je eigen woorden"
"ai rewrite-rules --context" = "Stuur ook de namen van branches en tags en de auteurs van de nieuwste 200 commits mee (maximaal 100 branch- en tagnamen en 100 auteurs), zodat het model ze exact kan noemen. Standaard uit: zonder dit verlaat alleen je beschrijving de machine"
"ai worktree-name" = """Drukt de worktreenaam en branchnaam af die de AI voorstelt voor een taak ("de crash oplossen als de config leeg is"): `{ name, worktree, branch }`, waarbij `worktree` de naam is die het dialoogvenster Worktree maken zou invullen (`worktree-<name>`) en `branch` de eigen branchnamen van de repository volgt. Maakt niets: geef ze door aan `worktree add`. Stuurt alleen je beschrijving en de lokale branchnamen mee. Vereist `ai.enabled = true`"""
"ai worktree-name --describe" = "De functie, bug of taak, in je eigen woorden"
"ai hosting-reply" = "Drukt een concept af dat de AI schrijft voor een gesprek op een codehost: een opmerking, een antwoord in een discussie (`--reply-to`), een opmerking bij een regel code (`--path`), een reviewsamenvatting (`--review-summary`) of de beschrijving van een nieuw issue (`--issue-title`). Het gesprek wordt gelezen uit `--conversation` (de JSON die `hosting issue comments --json` of `hosting review conversation --json` afdrukt, dus `hosting issue comments 7 --json | ai hosting-reply --conversation -` werkt) of opgehaald met `--item`; de AI ziet het item, de discussie, de recente opmerkingen binnen `ai.limits.hosting_reply_context_bytes` en je `--hint`. **Het schrijft alleen een concept: het antwoord is `{ draft, posted: false, ... }` en er wordt niets geplaatst, bewerkt of verwijderd**; plaatsen is een apart commando dat je zelf uitvoert. De basisprompt is `ai.hosting_reply.base_prompt` (bewerk hem in Instellingen > AI). Vereist `ai.enabled = true`"
"ai hosting-reply --conversation" = "Het gesprek als JSON, zoals een `hosting`-gesprekscommando het afdrukt: een bestand, `-` voor standaardinvoer, of de JSON zelf. Niet voor `--issue-title`"
"ai hosting-reply --draft" = "Je eigen tekst om te verbeteren in plaats van een nieuwe te schrijven"
"ai hosting-reply --flavor" = "De opmaak die de host aanneemt: `gfm`, `gitlab_md`, `gitea_md`, `common_mark`, `azure_md`, `bitbucket_md`, `html`, `jira_wiki`, `textile`, `youtrack_md`, `trello_md`, `plain_text`, `obsidian_md`. Standaard: die van het item zelf"
"ai hosting-reply --hint" = "Wat je in dit antwoord wilt (\"zeg dat ik er morgen naar kijk\")"
"ai hosting-reply --issue_title" = "Het concept van de beschrijving van een nieuw issue met deze titel schrijven (geen gesprek)"
"ai hosting-reply --item" = "Het issue of de pull request om op te antwoorden, door de host zelf gelezen in de gekoppelde bron van de repository (`7` of `#7` een issue, `!7` een pull request): hetzelfde gesprek dat `hosting issue comments 7 --json` afdrukt, zonder de systeemgebeurtenissen. In plaats van `--conversation`"
"ai hosting-reply --line" = "Met `--path`: de regel"
"ai hosting-reply --path" = "Een nieuwe reviewopmerking bij dit bestand van de pull request opstellen"
"ai hosting-reply --read_repo" = "De AI de repository laten lezen voor dit concept (uit, tenzij opgegeven of `ai.hosting_reply.read_repository` waar is). Een lokale agent leest hem zelf met alleen-lezen-hulpmiddelen in de repositorymap; een API-profiel krijgt een context die GitPoulpi opbouwt (de bestanden die het gesprek noemt, zoekresultaten, het overzicht) binnen `ai.limits.hosting_reply_*`. De AI schrijft hoe dan ook alleen een concept; er wordt niets geplaatst"
"ai hosting-reply --refresh_context" = "De context en de agentsessie van eerdere concepten voor deze repository vergeten en hem opnieuw lezen (met `--read-repo`)"
"ai hosting-reply --continue_exchange" = 'De uitwisseling van de laatste `hosting-reply` voor ditzelfde doel voortzetten (dezelfde `--item`, `--reply-to`, `--path`/`--line` of `--issue-title`): de eerdere hints en concepten ervan gaan als eerdere beurten terug naar het model, zodat "maak het korter" werkt. Niet nodig voor een lokale Claude-agent waarvan de sessie bewaard blijft (die onthoudt het). Zonder de vlag begint een nieuwe uitwisseling. Bewaard in de statusmap'
"ai hosting-reply --pr_base" = "Met `--read-repo`: de basisrevisie van de pull request, om zijn diff (tegen de merge-basis) in de context te zetten"
"ai hosting-reply --pr_head" = "Met `--read-repo`: de head-revisie van de pull request"
"ai hosting-reply --reply_to" = "Antwoorden in de discussie met deze id (een codediscussie, een opmerking of een gesprek)"
"ai hosting-reply --review_summary" = "Het concept van de samenvatting van de review die wordt ingediend schrijven"
"split-commit" = "Splitst een commit van de huidige branch in meerdere, oudste eerst, volgens een JSON-plan (zie `split-source` voor de nummering). De laatste nieuwe commit behoudt de oorspronkelijke boom, dus afstammelingen en werkmap blijven ongewijzigd; een gepushte commit heeft daarna een force push nodig. Eén `undo` zet alles terug. Exitcode 2 bij weigering"
"split-commit --commit" = "De te splitsen commit (elke revisie: een sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Valideert het plan en toont wat niet is toegewezen; wijzigt niets"
"split-commit --plan" = "Het plan (JSON), uit een bestandspad of `-` voor stdin. Een stuk is `path` plus een optionele `hunk` plus optionele `lines` (indexen in de `lines` van de hunk); een stuk met alleen `path` is het hele bestand"
"split-commit --rest_message" = "Zet alles wat het plan niet toewijst in een laatste commit met dit bericht"
"split-commit --sign" = "Ondertekent de nieuwe commits (en de opnieuw afgespeelde afstammelingen)"
"split-source" = "De wijzigingen van een commit genummerd voor `split-commit`: elk bestand met zijn hunks (`id`, regels) of, voor bestanden die alleen als geheel kunnen worden toegewezen (binair, alleen modus, toegevoegd, verwijderd, submodule, LFS), de reden. Alleen lezen"
"split-source --commit" = "De commit (elke revisie: een sha, `HEAD~2`, ...)"
"rewrite" = "Herschrijf de geschiedenis in bulk (identiteiten, datums, berichten) vanuit een recept: `preview` plant het zonder iets te wijzigen, `apply` voert het bekeken plan uit als ÉÉN ongedaanmaakstap, `run` doet beide voor scripts. Alleen `push` verstuurt iets: het force-pusht de herschreven refs, elk met een lease"
"rewrite apply" = "Pas een bekeken run toe: verplaatst de refs als ÉÉN ongedaanmaakstap (`gitpoulpi undo` zet alles terug). Pusht nooit. Afsluitcode 2 bij weigering (de repository is gewijzigd sinds het voorbeeld, verkeerde digest, ...), 3 als het plan refs verplaatst die op een remote staan en `--yes` ontbreekt"
"rewrite apply --digest" = "De digest die `rewrite preview` heeft afgedrukt: het plan dat je hebt bekeken"
"rewrite apply --run" = "De run-id die `rewrite preview` heeft afgedrukt"
"rewrite apply --yes" = "Bevestig het verplaatsen van refs die al gepusht zijn. Zonder dit verandert zo'n plan niets en is de afsluitcode 3"
"rewrite diff" = "Wat een inhoudsregel met één bestand van één commit van een bekeken run deed: het oude en het nieuwe bestand naast elkaar vergeleken. Regels die een geheimregel verwijdert, blijven verborgen. Leest alleen"
"rewrite diff --commit" = "De commit zoals hij vóór de herschrijving is (een id uit de rijen)"
"rewrite diff --path" = "Het bestand, relatief aan de repositorywortel"
"rewrite diff --run" = "De run-id die `rewrite preview` heeft afgedrukt"
"rewrite discard" = "Gooi een bekeken run weg zonder hem toe te passen. Twee keer weggooien is geen probleem"
"rewrite discard --run" = "De run-id die `rewrite preview` heeft afgedrukt"
"rewrite preview" = "Plan een herschrijving van de geschiedenis zonder iets te wijzigen: aantallen, de refs die zouden verschuiven, waarschuwingen en de eerste rijen. Bewaart het plan in de daemon als run (`run`, `digest`) voor `rewrite rows` en `rewrite apply`. Het voorbeeld staat ook op schijf, in de git-map van de repository, zodat `rewrite apply` werkt vanuit een latere opdracht, na een herstart van de daemon of vanuit een andere frontend, zonder een daemon te starten; alleen `rewrite rows` heeft de daemon nodig die het voorbeeld maakte (een lopende, of gebruik `--all` bij het voorbeeld). Afsluitcode 2 als het recept wordt geweigerd"
"rewrite preview --all" = "Druk elke gewijzigde commit af"
"rewrite preview --all_local" = "Herschrijf elke lokale branch en tag in plaats van alleen de huidige branch"
"rewrite preview --committer" = "Committer van herschreven commits: `keep` (standaard) of `me-now`"
"rewrite preview --include_protected" = "Herschrijf ook deze beschermde branches die al gepusht zijn (standaard uitgesloten; herhaalbaar)"
"rewrite preview --lfs_export" = "LFS-regel: zet de LFS-pointers die bij deze glob passen in elke commit weer om in de echte bestanden (herhaalbaar). De objecten moeten in de lokale LFS-opslag staan (eerst `lfs fetch`); anders wordt het geweigerd, met de lijst"
"rewrite preview --encoding_exclude" = "Met `--reencode`: bestanden die het met rust laat (globs, herhaalbaar)"
"rewrite preview --encoding_fallback" = "Met `--reencode`: als wat een bestand dat geen BOM heeft en geen UTF-8 is wordt gelezen wanneer de bron wordt gedetecteerd (standaard `windows-1252`)"
"rewrite preview --encoding_paths" = "Met `--reencode`: de bestanden die het omzet (globs, herhaalbaar)"
"rewrite preview --eol" = "Regeleinderegel: elk tekstbestand dat bij `--eol-paths` past, krijgt dit regeleinde (`lf` voor Linux en macOS, `crlf` voor Windows, `cr` voor de klassieke Mac); gemengde regeleindes worden uniform en binaire bestanden worden overgeslagen"
"rewrite preview --eol_exclude" = "Met `--eol`: bestanden die het met rust laat (globs, herhaalbaar)"
"rewrite preview --eol_follow_attributes" = "Met `--eol`: leest de `.gitattributes` in de root van elke commit: `-text`- en `binary`-bestanden worden overgeslagen, `eol=lf`- en `eol=crlf`-bestanden houden hun eigen regeleinde"
"rewrite preview --eol_paths" = "Met `--eol`: de bestanden die het omzet (globs, herhaalbaar; een patroon zonder slash komt op elk niveau overeen)"
"rewrite preview --reencode" = "Coderingsregel: de tekstbestanden die bij `--encoding-paths` passen, worden omgezet naar deze codering (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). Binaire bestanden, bestanden die de broncodering niet kan lezen en tekens die het doel niet kan bevatten blijven zoals ze zijn en worden geteld"
"rewrite preview --reencode_from" = "Met `--reencode`: de codering waarin de bestanden staan. Weggelaten: per bestand gedetecteerd (BOM, geldig UTF-8, anders `--encoding-fallback`)"
"rewrite preview --strip_exec" = "Bestandsmodusregel: het uitvoerbaarheidsbit (100755 wordt 100644) verdwijnt bij de bestanden die bij deze globs passen (herhaalbaar). De inhoud blijft ongemoeid"
"rewrite preview --strip_exec_exclude" = "Met `--strip-exec`: bestanden die hun uitvoerbaarheidsbit houden (globs)"
"rewrite preview --lfs_import" = "LFS-regel: verplaats de bestanden die bij deze glob passen in elke commit naar Git LFS (herhaalbaar; in `.gitattributes`-stijl: zonder slash op elk niveau). Heeft git-lfs nodig. De inhoud gaat naar de lokale LFS-opslag en `.gitattributes` krijgt de regel `filter=lfs`; push de objecten daarna"
"rewrite preview --lfs_min_size" = "Met `--lfs-import`: alleen bestanden van minstens zoveel bytes gaan mee"
"rewrite preview --limit" = "Hoeveel gewijzigde commits worden afgedrukt (standaard 50)"
"rewrite preview --match_email" = "Identiteitsregel: kies op dit e-mailadres van auteur / committer"
"rewrite preview --match_name" = "Identiteitsregel: kies op deze naam van auteur / committer"
"rewrite preview --prune_empty" = "Commits die een inhoudsregel leeg achterlaat: `auto` laat ze vallen (standaard), `never` houdt ze"
"rewrite preview --recipe" = "Een receptbestand (TOML of JSON, het formaat van de TUI-werkbank), of `-` voor JSON via standaardinvoer"
"rewrite preview --recipe_json" = "Een recept als JSON-tekst (voor aanroepers die geen bestand kunnen schrijven)"
"rewrite preview --refs" = "Herschrijf alleen deze lokale branches of tags (herhaalbaar)"
"rewrite preview --remove_blobs_over" = "Inhoudsregel: verwijder elk bestand dat groter is dan zoveel bytes uit elke commit"
"rewrite preview --remove_findings" = "Inhoudsregel: verwijder een geheim dat `rewrite scan-secrets` vond, met de id van de treffer (herhaalbaar), of `all` voor elke treffer in het bereik. De daemon scant opnieuw en zet de ids zelf om: de waarde komt nooit op de opdrachtregel, in een recept of in een log"
"rewrite preview --remove_paths" = "Inhoudsregel: verwijder bestanden en mappen die bij deze glob passen uit elke commit (herhaalbaar; een patroon zonder slash komt op elk niveau overeen)"
"rewrite preview --replace_content" = "Inhoudsregel `ZOEK=VERVANG`: vervang letterlijke tekst in elk tekstbestand (herhaalbaar; binaire bestanden worden overgeslagen en geteld). Gebruik voor geheimen een `content_replace`-regel in het recept met `--secrets-file`"
"rewrite preview --replace_message" = "Berichtregel `ZOEK=VERVANG` (letterlijke tekst, herhaalbaar)"
"rewrite preview --script_params" = "Een scriptparameter `NAAM=WAARDE`, aan elke `--script` meegegeven (herhaalbaar). De namen zijn die uit de header van het script"
"rewrite preview --scripts" = "Scriptregel: voer dit Lua-scriptbestand uit op elke commit (herhaalbaar, op volgorde, na de regels van de andere opties). Het bestand wordt hier gelezen en in het recept ingebed; zie `rewrite script check` voor het formaat"
