"flow sync" = "Brengt een branch bij met zijn bovenliggende branch (merge of rebase, volgens de ingestelde strategie van de branch), en met `--stack` de branches die erop voortbouwen, in volgorde. Drukt het plan af en heeft `--yes` nodig; afsluitcode 3 zonder"
