treat = "Laat git bestanden als binair of als tekst behandelen door een `.gitattributes`-regel (`binary` of `text diff`) voor de paden te schrijven: standaard het bestand in de hoofdmap van de repository, met `--file` dat van een map of `.git/info/attributes` (alleen deze kloon). Een regel die al hetzelfde patroon noemt wordt herschreven, niet tegengesproken. Het antwoord zegt of git de paden nu echt zo behandelt (`effective`). Ongedaan te maken met `gitpoulpi undo`, behalve voor `.git/info/attributes`"
