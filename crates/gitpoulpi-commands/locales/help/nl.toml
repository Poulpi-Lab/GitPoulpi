"flow start --run_hooks" = "Voert de hooks uit die de workflow voor deze actie configureert (shellopdrachten uit het workflowbestand, getoond met hun uitvoer). Nooit uitgevoerd tenzij erom gevraagd wordt; zonder deze vlag wordt het in een terminal gevraagd"
"flow start --type" = "Het branchtype (`feature`, `hotfix`, `release`, ...): zie `flow config --show-effective`"
"flow start --yes" = "Voert het plan uit zonder te vragen. Zonder deze vlag wordt het in een terminal gevraagd; anders drukt het plan af en eindigt met afsluitcode 3"
