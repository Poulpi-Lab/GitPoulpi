ai = "Pomocnik AI (działa tylko przy `ai.enabled = true`): wypisuje wygenerowany opis commita albo wyjaśnia commit lub zmiany robocze"
"ai --print_sent" = "Wypisuje, co zostałoby wysłane do modelu (tekst systemowy i użytkownika po zastąpieniu sekretów i pominięciu wrażliwych plików), i niczego nie wysyła. Wymaga `ai.enabled = true`, ale nie klucza ani sieci"
"ai --send_all" = "Wysyła każde wejście w całości, nawet powyżej jego limitu `ai.limits.*`. Bez tego wejście powyżej limitu jest obcinane (konflikt jest odrzucany), a odpowiedź podaje, co obcięto, w `truncated: [{part, detail?, bytes, limit, setting}]`"
"commit --send_all" = "Z `--ai`: wysyła cały diff, nawet gdy przekracza `ai.limits.diff_bytes`. Bez tego większy diff jest obcinany, a odpowiedź to zaznacza (`truncated`)"
"hosting review suggest --send_all" = "Wysyła każde wejście w całości, nawet powyżej jego limitu `ai.limits.*` (diff, diff pliku, opis, istniejące komentarze, pliki kontekstu). Bez tego wejście powyżej limitu jest obcinane, a odpowiedź podaje, co obcięto, w `truncated`"
"stash push --send_all" = "Z `--ai`: wysyła cały diff, nawet gdy przekracza `ai.limits.diff_bytes`. Bez tego większy diff jest obcinany, a odpowiedź to zaznacza (`truncated`)"
"ai commit-message" = "Wypisuje opis commita zaproponowany przez AI dla zmian w poczekalni (lub wszystkich zmian, gdy nic nie ma w poczekalni). Niczego nie zatwierdza"
"ai explain" = "Wyjaśnia commit (domyślnie HEAD) lub, z --wip, zmiany robocze"
"ai resolve-conflict" = "Wypisuje rozwiązanie, które AI sugeruje dla JEDNEGO konfliktu scalania w pliku z konfliktem (`--conflict N`, liczone od 1; opcjonalne, gdy plik ma jeden konflikt). Tylko wypisuje: nic nie jest zapisywane ani dodawane do poczekalni, więc decyduje wywołujący (`conflicts resolve --content-file` stosuje wynik dla całego pliku). Wymaga `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Który konflikt pliku, liczony od 1"
"ai resolve-conflict --path" = "Plik z konfliktem, względem korzenia repozytorium"
autostash = "Oczekujący auto-stash: GitPoulpi odłożył zmiany lokalne, by wykonać checkout, merge, rebase lub pull, i jeszcze ich nie przywrócił"
"ai review-context" = "Pokazuje lub ustawia to, co szkic przeglądu kodu ✦ dostaje poza diffem (`[ai.review]`): pliki CLAUDE.md i AGENTS.md repozytorium, jeszcze jeden plik (ścieżkę lub link) oraz to, czy lokalny agent działa w repozytorium. Bez `--repo` i `--project` to wartość globalna; `--repo PATH` to wartość jednego sklonowanego repozytorium, `--project HOST/PROJECT` wartość repozytorium, które nie jest sklonowane. Bez flagi ustawienia wypisuje wartości (`effective` to to, co dostanie przegląd); z flagą zapisuje je i wypisuje wynik. Nie wymaga modelu i działa przy wyłączonym AI"
"ai review-context --agents_md" = "Przekaż modelowi plik AGENTS.md repozytorium"
"ai review-context --claude_md" = "Przekaż modelowi plik CLAUDE.md repozytorium"
"ai review-context --context_file" = "Jeszcze jeden plik: ścieżka względem katalogu głównego repozytorium, ścieżka bezwzględna lub link do pliku na hoście kodu"
"ai review-context --no_context_file" = "Bez dodatkowego pliku"
"ai review-context --no_extra_file" = "Brak dodatkowego pliku dla repozytorium lub projektu, niezależnie od wartości globalnej (`on`, domyślnie, gdy podano samo); `off` znów każe jej podążać za wartością globalną"
"ai review-context --project" = "Repozytorium, które nie jest sklonowane, jako `HOST/PROJECT` (`github.com/owner/name`)"
"ai review-context --reset" = "Z `--repo` lub `--project`: zapomina własne wartości repozytorium (znów podąża za globalnymi) przed zastosowaniem flag"
"ai review-context --run_in_repo" = "Uruchom lokalnego agenta w repozytorium (`yes`), nie tam (`no`) albo zgodnie z jego profilem AI (`profile`). Nie dla `--project`"
"autostash start-over" = "Zacznij od nowa: odrzuca zmiany w drzewie roboczym w plikach stasha (kopia zostaje w `refs/gitpoulpi-backup/`), cofa operację, która zrobiła auto-stash (pull, checkout, merge, rebase), a potem robi pop stasha na pierwotnym commicie. Zatrzymuje się z nienaruszonym stashem, gdy któryś krok się nie powiedzie. Kod wyjścia 1 przy odmowie, 3 gdy potrzebne jest `--yes`"
"autostash start-over --dry_run" = "Pokazuje, co by się stało, i niczego nie zmienia"
"autostash start-over --yes" = "Kontynuuje; bez tego nic się nie zmienia, a kod wyjścia to 3"
blame = "Autorstwo każdej linii pliku w danej rewizji"
"blame --at" = "Rewizja do blame (domyślnie: HEAD)"
"branch delete-remote" = "Usuwa gałąź ze zdalnego, zostawiając lokalną gałąź o tej nazwie"
"branch fast-forward" = "Przesuwa `<branch>` do przodu do `<target>`, tylko jeśli to fast-forward (rozbieżna historia jest odrzucana, nic się nie rusza). Wybrana gałąź zabiera ze sobą drzewo robocze, jak `git merge --ff-only`; w każdej innej gałęzi przesuwany jest tylko ref"
"branch fast-forward --target" = "Dowolna rewizja (domyślnie: HEAD)"
"branch set-upstream" = "Ustawia `<branch>` tak, by śledziła `<upstream>` (`origin/main`)"
"branch track" = "Tworzy lokalną gałąź śledzącą zdalną gałąź i robi na nią checkout. `<upstream>` zapisuje się tak jak na liście refów (`origin/feature/login`); `--name` domyślnie to część z nazwą gałęzi"
"branch unset-upstream" = "Usuwa upstream gałęzi `<branch>`"
"checkout --autostash" = 'Robi stash lokalnych zmian, które to blokują, wykonuje operację, a potem robi pop stasha (to, co robi `general.auto_stash = "always"`)'
"cherry-pick --commits" = "Commity do zastosowania, po kolei. Pomijane, gdy podano `--plan`"
"cherry-pick --plan" = "JSON `Vec<RebaseStep>` (ten sam kształt co `rebase --plan`; zob. `rebase-plan`), ze ścieżki pliku lub `-` dla stdin: kroki są cherry-pickowane w kolejności listy. Sensowne są tu tylko akcje `Pick` i `Drop` (`Drop` pomija commit); każda inna jest odrzucana. Nie można łączyć z commitami podanymi pozycyjnie"
"clone --branch" = "Robi checkout tej gałęzi zamiast domyślnego HEAD zdalnego"
"clone --depth" = "Obcina historię do tylu commitów (`git clone --depth`)"
"clone --no_lfs" = "Zostawia pliki Git LFS jako wskaźniki zamiast pobierać ich zawartość po sklonowaniu"
"clone --origin" = "Nadaje nowemu zdalnemu inną nazwę niż `origin`"
"clone --recurse_submodules" = "Klonuje też submoduły"
"commit --ai" = "Pozwala AI napisać opis na podstawie diffa z poczekalni, według instrukcji opisów commitów repozytorium (Ustawienia > AI). Wymaga `ai.enabled = true` i skonfigurowanego profilu"
"commit --message" = "Opis commita. Wymagany, chyba że pisze go --ai"
"commit --no_verify" = "Pomija hooki commita (`pre-commit`, `commit-msg`), jak `commit --no-verify`"
completions = "Wypisuje na stdout skrypt uzupełniania powłoki (bash, zsh, fish, powershell lub elvish), np. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Przerywa trwającą operację: HEAD, indeks i drzewo robocze wracają do stanu sprzed niej. Odrzuca rozwiązania zrobione od tego czasu"
"conflicts skip" = "Pomija trwający cherry-pick lub revert (albo commit, na którym zatrzymał się rebase): HEAD, indeks i drzewo robocze wracają do HEAD. Wyjście, gdy stał się pusty (zmiana jest już zastosowana). Merge nie ma czego pomijać"
"conflicts check" = "Czy merge HEAD do gałęzi, z której ta powstała, spowoduje konflikt, i w których plikach? Niczego nie zmienia (merge w pamięci). Bazą jest cel znanego pull requesta gałęzi, a w razie braku gałąź dozwolona przez wzorce Gałęzi bazowych, do której jest najmniej commitów od rozgałęzienia. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Wyłączone, gdy `general.conflict_detection` lub przełącznik repozytorium jest wyłączony"
"conflicts list" = "Pliki z konfliktem, każdy z tekstem swoich trzech stron. Z `--names-only`: tylko ścieżka, rodzaj konfliktu i oidy etapów (żaden blob nie jest czytany; tanie przy dużym scaleniu)"
"conflicts resolve" = 'Rozwiązuje jeden plik i dodaje go do poczekalni (plik przestaje mieć konflikt). Dokładnie jedno z `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` lub `--delete`. A i „ours” to strona bieżąca (`HEAD`; podczas rebase gałąź, na którą robi się rebase), B i „theirs” to strona przychodząca. Nigdy nie edytuj znaczników konfliktu ręcznie: wybierz albo zapisz ostateczny tekst do pliku'
"conflicts resolve --both" = "Zachowuje obie strony każdego konfliktu (A, potem B), a wszędzie indziej własny merge gita"
"conflicts resolve --content_file" = "Dokładny, ostateczny tekst pliku (`-` czyta standardowe wejście)"
"conflicts resolve --delete" = "Akceptuje usunięcie: usuwa plik (`git rm`)"
"conflicts resolve --encoding" = "Z `--content-file`: zapisuje tekst w tym kodowaniu (etykieta WHATWG, np. `windows-1252`) zamiast UTF-8"
"conflicts resolve --expect" = "Oidy etapów, względem których podjęto decyzję, `base,ours,theirs` (`-` dla brakującego etapu). Wywołanie jest odrzucane jako `stale`, gdy indeks nie zawiera już dokładnie tych. `--both` i `--pick` zawsze sprawdzają etapy, które czytają"
"conflicts resolve --no_stage" = "Zapisuje plik drzewa roboczego, ale zostawia go z konfliktem (zwykły zapis)"
"conflicts resolve --ours" = "To samo co `--side ours`"
"conflicts resolve --pick" = "Wybór dla numeru konfliktu: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = obie w tej kolejności). Każdy konflikt wymaga wyboru, chyba że `--default` pokrywa resztę"
"conflicts resolve --pick_default" = "Z `--pick`: wybór dla każdego konfliktu, którego nie wymieniono"
"conflicts resolve --side" = "Bierze cały plik z jednego etapu, bez auto-merge"
"conflicts resolve --theirs" = "To samo co `--side theirs`"
"conflicts resolve --theirs_first" = "Z `--both`: B, potem A"
"conflicts show" = "Jeden plik z konfliktem tak, jak widzi go edytor scalania: etykiety paneli, trzy strony i ponumerowane regiony konfliktu (`--json` to pełny dokument). Scalone regiony, które git rozstrzygnął sam, nie są wymienione; zostają w wyniku `resolve --both`/`--pick`"
"conflicts show --conflict" = "Tylko konflikt N (liczony od 1)"
"conflicts state" = "Trwający merge, rebase, cherry-pick lub revert (`null`, gdy nic nie trwa)"
"conflicts unresolve" = "Przywraca konflikt w pliku rozwiązanym podczas tej operacji (znów ze znacznikami). Odrzucane, gdy nadal ma konflikt lub nie został rozwiązany w trakcie operacji"
daemon = '`gitpoulpi server ...` to widoczny alias - właściciel nazywa tę grupę „serwerem” i wpisuje `gp server stop`'
"daemon restart" = "`daemon stop`, a potem `daemon start`"
"daemon run" = "Uruchamia demona tej sesji na pierwszym planie (blokuje; Ctrl-C zatrzymuje, podobnie `daemon stop`/`daemon restart` wysłane skądinąd). To właśnie `daemon start` uruchamia odłączone, i można to też uruchomić bezpośrednio w dedykowanym terminalu"
"daemon start" = "Uruchamia demona tej sesji jako odłączony proces w tle (lub zgłasza, że już działa). `--backend` przypina backend, którego ma użyć uruchomiony proces; bez niego uruchomiony proces sam ustala `general.default_backend`"
"daemon status" = "Czy demon tej sesji nasłuchuje, a jeśli tak, jego port, PID, czas działania, backend i wersja builda"
"daemon stop" = "Prosi demona tej sesji o łagodne zamknięcie; tylko jeśli nie odpowie na czas i jest samodzielnym demonem (nigdy wbudowanym w działające TUI), ucieka się do zabicia jego zapisanego PID"
"daemon stop --all" = "Zatrzymuje demona każdej sesji, dla której `session list` zgłasza plik portu, nie tylko tej"
discard = "Odrzuca zmiany pliku *spoza poczekalni* w drzewie roboczym: jeden hunk (`--hunk`), niektóre jego linie (`--hunk --lines`) albo - z samym `--file` - każdą niezatwierdzoną zmianę pliku, także tę w poczekalni (nieśledzony plik jest usuwany). Hunki i linie są numerowane tak, jak numeruje je `gitpoulpi diff --json` dla diffa spoza poczekalni. Wszystko, co odrzuca, trafia do migawki bezpieczeństwa, więc `gitpoulpi undo` to przywraca (także nieśledzone pliki). Bez potwierdzenia: to interfejs skryptowy"
"discard --lines" = "Indeksy linii w `--hunk`, oddzielone przecinkami"
"fetch --all" = "Fetch każdego skonfigurowanego zdalnego"
"fetch --prune" = "Usuwa gałęzie śledzące zdalne, których zdalny już nie ma"
"fetch --prune_tags" = "Usuwa też lokalne tagi, które zniknęły ze zdalnego repozytorium (tylko te, które na nim były: tag, którego nigdy nie wypchnięto, zostaje). To `fetch.pruneTags` z git, ale węższe; domyślnie wyłączone"
"fetch --remote" = "Pominięte: domyślne zdalne repozytorium (zob. `remote default`)"
gitpoulpi = "Lekki, wieloplatformowy klient Git w TUI, skryptowalny przez CLI/MCP."
"gitpoulpi --add" = "Otwiera folder jako nową kartę w już uruchomionym GitPoulpi zamiast uruchamiać kolejny (`gp -a`, `gp --add ../inny`). PATH domyślnie to bieżący katalog i jest rozwiązywany do otaczającego go repozytorium. Jedna uruchomiona sesja: dostaje kartę, a jej okno wychodzi na wierzch, jeśli pulpit na to pozwala. Kilka: wybierasz jedną z numerowanej listy (lub podajesz `--session NAZWA`). Żadna: GitPoulpi uruchamia się normalnie w tym folderze. Nie przyjmuje podpolecenia; z `--json` wypisuje jeden obiekt (`action` to `joined` lub `cancelled`), kod wyjścia 0, gdy karta jest otwarta, 3, gdy zajęte okno zaproponowało ją w chipie na pasku stanu"
"gitpoulpi --no_raise" = "Z `--add`: nie prosi okna o przeniesienie terminala na wierzch"
"gitpoulpi --backend" = "Na którym `GitBackend` działa demon tego polecenia, nadpisując `general.default_backend` w config.toml i `GITPOULPI_GENERAL_DEFAULT_BACKEND` (flagi są na szczycie drabiny pierwszeństwa - zob. docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
Na którym `GitBackend` działa demon tego polecenia, nadpisując `general.default_backend` w config.toml i `GITPOULPI_GENERAL_DEFAULT_BACKEND` (flagi są na szczycie drabiny pierwszeństwa - zob. docs/user/config-reference.md).

Wybiera backend dla demona, który to polecenie *uruchamia*. Sesja, której demon już działa, zachowuje backend, z którym go zbudowano; `gitpoulpi` nie ma sposobu, by podmienić backend działającego demona pod już podłączonymi klientami, a udawanie, że jest inaczej, byłoby tym samym cichym brakiem działania, któremu ta flaga ma zapobiegać."""
"gitpoulpi --cwd_file" = """Plik, do którego TUI zapisuje folder aktywnej karty przy wyjściu („Zakończ i cd tutaj” lub zawsze przy `ui.tab_dir_follow = "auto"`). Przeznaczony dla wrappera, który wypisuje `gitpoulpi shell-init`; ignorowany przez każde podpolecenie, bo tylko TUI ma karty"""
"gitpoulpi --json" = "Wypisuje ustrukturyzowany JSON zamiast tekstu czytelnego dla człowieka"
"gitpoulpi --lang" = "Język tekstu `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
Język tekstu `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Tłumaczone są tylko objaśnienia - nazwy poleceń i flag nigdy się nie zmieniają - a `--help` pozostaje po angielsku, chyba że podano tę flagę (środowisko jest celowo ignorowane, by skrypty dostawały stabilny wynik). Przykład: `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Repozytorium, na którym działać. Domyślnie repozytorium obejmujące bieżący katalog, więc `gitpoulpi status` zachowuje się jak `git status`; agent obsługujący kilka repozytoriów podaje to zamiast zmieniać katalog"
"gitpoulpi --session" = "Nazwana sesja, do której się odwołać. Pominięta, jest wyprowadzana z korzenia bieżącego repozytorium (zob. `gitpoulpi_config::default_session_name`), więc dwa repozytoria dostają dwa niezależne demony, a wszystko otwarte w jednym repozytorium dzieli jednego. Podaj to, by wymusić dwa repozytoria na jednej sesji lub nazwać sesję jawnie. Wartość jest oczyszczana przed użyciem - staje się nazwą pliku"
"hosting checkout-pr" = "Robi checkout pull/merge requesta, także z forka: pobiera jego head (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) do lokalnej gałęzi `pr/<n>` (`mr/<n>` w GitLab), śledząc go, i przełącza się na nią"
"hosting checkout-pr --id" = "Która integracja (zob. `hosting prs`)"
"hosting checkout-pr --no_checkout" = "Tylko pobiera i tworzy/aktualizuje gałąź; zostajesz tam, gdzie jesteś"
"hosting checkout-pr --number" = "Numer PR (GitHub) lub `iid` MR (GitLab)"
"hosting checkout-pr --remote" = "Zdalne, na którym jest żądanie. Domyślnie to, z którego ustalono projekt, w przeciwnym razie domyślne repozytorium"
"hosting clone" = "Klonuje projekt z `projects` po jego pełnej ścieżce, ustalając URL klonowania przez hosta zamiast kazać użytkownikowi go wklejać"
"hosting clone --https" = "Klonuje przez HTTPS zamiast SSH"
"hosting clone --project" = "Pełna ścieżka projektu, tak jak wypisuje ją `hosting projects`"
"hosting edit-url" = "Wypisuje URL, pod którym edytuje się pull/merge request (widok `.../edit` w GitLab; GitHub edytuje na miejscu na stronie żądania). Z numerem to żądanie; inaczej to dla `--branch` (domyślnie: wybrana gałąź). Podąża za powiązaniem repozytorium z żądaniami, jak `prs`. Uruchamia przeglądarkę tylko z `--open`"
"hosting edit-url --branch" = "Znajduje żądanie po jego gałęzi źródłowej"
"hosting edit-url --number" = "Numer żądania (`53` dla `!53` / `#53`)"
"hosting edit-url --open" = "Otwiera też URL w przeglądarce systemowej"
"hosting file" = "Czyta z API hosta jeden plik projektu w danej rewizji, bez klonu: tekst bez zmian, inne bajty jako base64 (`encoding`). Kod wyjścia 1 i błąd, gdy pliku nie ma w tej rewizji"
"hosting file --id" = "Która integracja (zob. `hosting list`); opcjonalne, gdy skonfigurowano tylko jedną"
"hosting file --path" = "Ścieżka wewnątrz projektu, np. `CLAUDE.md` lub `src/main.rs`"
"hosting file --project" = "Projekt: `owner/name` na GitHubie, `group/sub/project` na GitLabie"
"hosting file --rev" = "Rewizja: gałąź, tag lub commit. Domyślnie domyślna gałąź projektu"
"hosting integrations" = "Zarządza skonfigurowanymi profilami integracji (`[[integrations]]`)"
"hosting integrations add" = "Dodaje profil dowolnego rodzaju, dla którego istnieje klient"
"hosting integrations add --id" = "Domyślnie nazwa rodzaju (`gitlab`, `gitlab-2`, ...)"
"hosting integrations add --kind" = "`github`, `github_enterprise`, `gitlab`, `gitlab_self_managed`, `azure_devops`, `azure_devops_server`, `bitbucket`, `jira_cloud`, `jira_data_center`, `trello`, `gitea`, `forgejo`, `linear`, `youtrack`, `redmine`, `gerrit` lub `local_markdown`"
"hosting integrations add --name" = "Nazwa wyświetlana"
"hosting integrations add --url" = "Główny adres WWW instancji. Wymagany dla rodzajów samodzielnie hostowanych i Jiry"
"hosting integrations list" = "Skonfigurowane profile, bez ich tokenów"
"hosting integrations radar" = "Pokazuje lub zmienia ustawienia Radaru profilu (`[integrations.radar]`): które listy obejmujące całe konto pobierają `hosting radar` i Radar, które przestrzenie nazw przeszukiwać oraz co robi przegląd żądania, które nie jest sklonowane. Bez opcji tylko wypisuje bieżące ustawienia"
"hosting integrations radar --assigned_issues" = "Otwarte zgłoszenia przypisane do ciebie, we wszystkich repozytoriach"
"hosting integrations radar --clear_namespaces" = "Zapomina zapisane przestrzenie nazw: twoje własne oraz wszystkie, do których należysz"
"hosting integrations radar --id" = "Profil"
"hosting integrations radar --include_drafts" = "Zachowaj szkice żądań na listach konta"
