"lost-commits --skip" = "Ile commitów pominąć"
"reflog" = "Wypisuje reflog od najnowszego wpisu: gdzie `HEAD` lub gałąź była wcześniej, z datą i powodem podanym przez gita, także przesunięcia zrobione w powłoce. Usunięta gałąź nie ma już reflogu. Zapis `reflog restore` oznacza `reflog-restore`"
"reflog --limit" = "Ile wpisów wypisać"
"reflog --ref" = "`HEAD` (domyślnie) albo gałąź (lub pełna nazwa refa)"
"reflog --skip" = "Ile wpisów pominąć"
"reflog-restore" = "Przesuwa gałąź (lub `HEAD`) do pozycji z jej reflogu. Gałąź, na której nie jest zrobiony checkout, po prostu się przesuwa. Dla bieżącej gałęzi drzewo robocze pozostaje bezpieczne: przy niezatwierdzonych zmianach odmawia, chyba że podano `--mode`. Jeden wpis w dzienniku: `undo` go cofa. Zapis `gitpoulpi reflog restore` oznacza to samo"
"reflog-restore --dry_run" = "Pokazuje, co by się stało, i niczego nie zmienia"
