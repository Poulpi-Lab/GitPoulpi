ignore = "Dopisuje wzorzec do `.gitignore` (domyślnie głównego w korzeniu repozytorium). Nic nie robi, gdy wzorzec jest już linią tego pliku. Można cofnąć przez `gitpoulpi undo`, które przywraca plik jak był (lub usuwa go, gdy nie istniał)"
