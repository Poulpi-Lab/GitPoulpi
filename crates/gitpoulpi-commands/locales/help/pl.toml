"rewrite check-signing" = "Podpisuje raz próbny ładunek ustawieniami podpisywania repozytorium (`gpg.format`, `user.signingkey`, `gpg.*.program`) i weryfikuje go, jako test dymny przed uruchomieniem, które podpisuje ponownie (`--signatures resign-signed` lub `resign-all`). Wypisuje program, czy działa i ile trwał jeden podpis (pomnóż przez liczbę commitów do ponownego podpisania, by oszacować czas). Może otworzyć prośbę o hasło. Kończy się kodem 2, gdy nie działa, podając powód (`tool_missing` lub `signing_failed`)"
"rewrite preview --remove_signatures" = "Reguła podpisów: usuwa podpis z każdego commita w zakresie, nawet tam, gdzie nic innego się nie zmienia. Te commity nie wymagają odpowiedzi `--signatures`"
"rewrite preview --fix_message_encoding" = "Reguła opisów: koduje opisy commitów na nowo w UTF-8. Opis z nagłówkiem `encoding` (ISO-8859-1, Shift_JIS...) jest dekodowany, a nagłówek znika; UTF-8 odczytane kiedyś jako Latin-1 lub Windows-1252 („RÃ©Ã©criture”) jest naprawiane tylko wtedy, gdy konwersja w obie strony daje dokładnie to samo. Czego nie da się rozstrzygnąć, zostaje bez zmian i jest zliczane (`encoding_left`)"
"rewrite preview --fix_name_encoding" = "Z `--fix-message-encoding`: naprawia też zepsute nazwy autorów i committerów (nazwy commitu, któremu znika nagłówek, są zawsze dekodowane razem z nim)"
"rewrite run --remove_signatures" = "Reguła podpisów: usuwa podpis z każdego commita w zakresie, nawet tam, gdzie nic innego się nie zmienia. Te commity nie wymagają odpowiedzi `--signatures`"
"rewrite run --fix_message_encoding" = "Reguła opisów: koduje opisy commitów na nowo w UTF-8. Opis z nagłówkiem `encoding` (ISO-8859-1, Shift_JIS...) jest dekodowany, a nagłówek znika; UTF-8 odczytane kiedyś jako Latin-1 lub Windows-1252 („RÃ©Ã©criture”) jest naprawiane tylko wtedy, gdy konwersja w obie strony daje dokładnie to samo. Czego nie da się rozstrzygnąć, zostaje bez zmian i jest zliczane (`encoding_left`)"
"rewrite run --fix_name_encoding" = "Z `--fix-message-encoding`: naprawia też zepsute nazwy autorów i committerów (nazwy commitu, któremu znika nagłówek, są zawsze dekodowane razem z nim)"
"rewrite preview --map_trailers" = "Z regułą tożsamości: mapuje też pasujące trailery tożsamości (`Imię <e-mail>` w `Signed-off-by`, `Co-authored-by`...), a nie tylko autora i committera"
"rewrite preview --trailer_add" = "Reguła trailerów `KLUCZ=WARTOŚĆ`: dodaje ten trailer do każdego opisu (można powtarzać; opis, który ma już dokładnie taki trailer, zostaje bez zmian)"
