"ui propose resolution --pick_default" = "Z `--pick`: wybór dla każdego konfliktu, którego nie wymieniono"
"ui propose reword" = "Otwiera okno Reword nad commitem z wpisanym nowym opisem"
"ui propose rewrite" = "Otwiera warsztat przepisywania historii z gotowym przepisem, aby użytkownik zrobił podgląd i go zastosował; sam niczego nie przepisuje, nie czyści ani nie wypycha. Przepis ma najwyżej 50 reguł i żadnego skryptu, a wartości tajne są z niego usuwane"
"ui propose rewrite --recipe" = "Przepis (TOML lub JSON, tak jak przyjmuje go `rewrite preview --recipe`), ze ścieżki pliku albo `-` dla stdin"
