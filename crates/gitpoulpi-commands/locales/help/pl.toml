"lfs lock" = "Blokuje plik, by nikt inny nie mógł go zmienić, dopóki go nie odblokujesz"
"lfs lock --remote" = "Pominięte: domyślne zdalne repozytorium"
"lfs locks" = "Blokady plików LFS na serwerze: kto trzyma który plik. Wymaga serwera z blokowaniem (GitHub, GitLab, Gitea, ...); używa własnych poświadczeń zdalnego"
"lfs locks --remote" = "Pominięte: domyślne zdalne repozytorium"
"lfs prune" = "Usuwa stare, już wypchnięte obiekty z lokalnego magazynu LFS"
"lfs pull" = "Pobiera obiekty LFS i zastępuje pliki wskaźnikowe w drzewie roboczym prawdziwą zawartością (`git lfs pull`)"
"lfs pull --remote" = "Pominięte: domyślne zdalne repozytorium"
"lfs checkout" = "Zapisuje prawdziwą zawartość w plikach wskaźnikowych LFS w drzewie roboczym, z lokalnego magazynu LFS (`git lfs checkout`). Offline"
"lfs checkout --paths" = "Tylko te ścieżki (względem katalogu głównego repozytorium); pominięte: wszystkie wskaźniki w drzewie roboczym"
"lfs push" = "Wysyła obiekty LFS (`git lfs push`)"
"lfs push --all" = "Każdy ref, nie tylko bieżąca gałąź"
"lfs push --remote" = "Pominięte: domyślne zdalne repozytorium"
"lfs status" = "Czy `git-lfs` jest zainstalowany, czy to repozytorium używa LFS, które wzorce są śledzone, czy filtry i hook są zainstalowane. Nigdy nie kończy się błędem z powodu braku `git-lfs`: odpowiedź to mówi"
"lfs track" = "Kieruje wzorce plików przez LFS (`git lfs track`). Edytuje `.gitattributes` i zostawia go poza poczekalnią"
"lfs track --lockable" = "Ustawia pliki tylko do odczytu, dopóki nie zostaną zablokowane"
"lfs track --renormalize" = "Dodaje też ponownie do poczekalni już zatwierdzone pasujące pliki, by ich następny commit zapisał wskaźniki (historia nie jest przepisywana)"
"lfs unlock" = "Zwalnia blokadę. Cudza blokada wymaga `--force`, które ją zrywa"
"lfs unlock --force" = "Zrywa blokadę trzymaną przez kogoś innego"
"lfs unlock --remote" = "Pominięte: domyślne zdalne repozytorium"
"lfs untrack" = "Przestaje kierować wzorce przez LFS (`git lfs untrack`)"
"log --count" = "Wypisuje tylko liczbę commitów w przejściu (`{\"total\": N}`), ignorując `--limit` i `--skip`: to, co pasek stanu TUI pokazuje po ukośniku. Liczy bez wczytywania jakiegokolwiek commita"
"log --path" = "Tylko commity dotykające tej ścieżki (powtarzalne) - `git log -- <path>`. To zapytanie widoku Historia pliku"
"log --skip" = "Pomija pierwsze N commitów przejścia przed zastosowaniem `--limit`. Z `--limit` stronicuje historię: strona `n` to `--skip <n*limit> --limit <limit>`, a strony dokładnie pokrywają przejście (sprawdzane kontraktem `check_log_skip_pages_history`)"
"log --format" = "Wypisuje commity w innym formacie. `mermaid` wypisuje skrypt Mermaid `gitGraph` (wklej go do pliku Markdown, PR lub mermaid.live); z `--json` zwraca `{format, detail, commits, text}`. Commity to `--range`, a bez niego pierwsze `--limit` (domyślnie 30) z przejścia po historii"
"log --detail" = "Poziom szczegółów Mermaid: `structure` (commity, gałęzie, merge), `refs` (+ nazwy gałęzi, tagi, HEAD), `subjects` (+ opisy commitów) lub `full` (+ autor i data). Domyślnie: `ui.mermaid_detail` (`refs`)"
"log --orientation" = "Kierunek grafu Mermaid. Domyślnie: `ui.mermaid_orientation` (`lr`)"
"log --fence" = "Opakowuje skrypt Mermaid w blok ```mermaid"
"log --range" = "Mermaid: commity `A..B` (osiągalne z B, nie z A), jak `git log A..B`; samo `A` oznacza `A..HEAD`"
"log --subject_width" = "Mermaid: przycina opisy commitów do tylu znaków. Domyślnie: `ui.mermaid_subject_width` (40)"
"mcp serve --allow_remote" = "Zezwala na `--http` pod adresem innym niż pętla zwrotna. Odmowa, chyba że `[mcp] http_auth` jest włączone i token istnieje, a ruch jest szyfrowany (`[mcp] tls`, albo `behind_proxy` dla tunelu lub zwrotnego proxy, za które ręczysz); bezpieczniejsze jest `ssh -L` do punktu końcowego na pętli zwrotnej"
"mcp serve --http" = "Adres nasłuchu dla streamable HTTP, np. 127.0.0.1:8808 (punkt końcowy `/mcp`); bez adresu `[mcp] bind` (domyślnie 127.0.0.1:8808). Żądania wymagają tokenu bearer (`mcp token`), chyba że `[mcp] http_auth` jest wyłączone. Tylko pętla zwrotna, chyba że `--allow-remote`"
"mcp serve --ui_control" = "Jak daleko agent może poruszać oknem użytkownika narzędziami `ui_*`: `ask` (domyślnie: okno pokazuje chip, który użytkownik potwierdza), `auto` lub `off`. Nadpisuje `[mcp] ui_control`"
"mcp token" = "Token bearer punktu końcowego HTTP (`mcp serve --http`): pokazuje go zamaskowany jako JSON `{token_hint, path, rotated}`, tworząc go przy pierwszym użyciu. Klient wysyła go jako `Authorization: Bearer <token>`. To nie jest narzędzie MCP: agent nigdy nie odczytuje ani nie wymienia własnego klucza"
"mcp token --copy" = "Kopiuje pełny token do schowka przez terminal (OSC 52), bez wypisywania go"
"mcp token --rotate" = "Zastępuje token nowym; klienci z poprzednim są odrzucani od razu"
"mcp token --show" = "Wypisuje także pełny token, do wklejenia w konfiguracji klienta"
"merge --autostash" = 'Robi stash lokalnych zmian, które to blokują, wykonuje operację, a potem robi pop stasha (to, co robi `general.auto_stash = "always"`)'
"merge --ff" = "Robi fast-forward, gdy gałąź na to pozwala, w przeciwnym razie merge commit (domyślne zachowanie gita). Nadpisuje `git.merge_fast_forward` dla tego merge"
"merge --ff_only" = "Tylko fast-forward: odmawia, gdy gałąź się rozeszła. Nadpisuje `git.merge_fast_forward` dla tego merge"
"merge --no_ff" = "Zawsze tworzy merge commit, nawet gdy możliwy jest fast-forward. Nadpisuje `git.merge_fast_forward` dla tego merge"
"merge --squash" = "Robi squash commitów gałęzi: dodaje ich zmiany do poczekalni i nie tworzy merge commita (`merge --squash`), więc po nim następuje `commit`. To ustawienie Squash w sekcji „Opcje: merge” w Ustawieniach. Nie można cofnąć: nic się nie przesunęło, aby się wycofać, odrzuć zmiany z poczekalni"
patch = "Zapisuje plik patcha lub stosuje go do drzewa roboczego"
"patch apply" = "Stosuje plik patcha do drzewa roboczego"
"patch create" = "Zapisuje plik patcha. `<revs>` to jeden lub więcej commitów (od najstarszego), z których powstaje po patchu; w połączeniu z `--range a..b` zamiast tego obejmuje każdy commit niebędący merge w zakresie; w połączeniu z `--wip` zamiast tego tworzy patch bieżących zmian drzewa roboczego (w poczekalni i poza nią), opcjonalnie ograniczony do `<paths>`"
