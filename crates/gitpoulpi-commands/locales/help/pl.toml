"lfs fetch --remote" = "Pominięte: domyślne zdalne repozytorium (zob. `remote default`)"
"lfs files" = "Pliki wskaźnikowe LFS w indeksie (lub w `--at`), z informacją, czy prawdziwy obiekt jest w lokalnym magazynie LFS"
