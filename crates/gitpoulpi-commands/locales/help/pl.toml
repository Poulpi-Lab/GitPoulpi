path = "Dodaje GitPoulpi do PATH użytkownika, dla nowych terminali"
"path add" = "Dodaje folder, w którym leży GitPoulpi, oraz folder aliasów do PATH użytkownika dla nowych terminali: oznaczony blok w plikach startowych powłoki (Linux, macOS) albo PATH użytkownika w rejestrze (Windows). Foldery już obecne w PATH są pomijane"
"path remove" = "Usuwa dokładnie to, co dodało `path add`"
"path status" = "Pokazuje, czy folder, w którym leży GitPoulpi, i folder aliasów są w PATH użytkownika oraz co dodał GitPoulpi"
uninstall = "Usuwa to, co utworzyły instalator i Ustawienia (aliasy poleceń, wpisy PATH, skróty) oraz, w instalacji z wydania, pliki programu. Odmawia w kompilacji, która nie jest instalacją z wydania (brak znacznika `.gitpoulpi-dist` obok pliku exe). Twoja konfiguracja, sesje i repozytoria nigdy nie są ruszane"
"uninstall --keep_files" = "Zostawia pliki programu na miejscu (deinstalator Windows usuwa je sam, bo działający plik exe nie może)"
launch = "To, co uruchamiają skróty GitPoulpi: pokazuje okno już otwartego GitPoulpi (`ui.reuse_window`), a w przeciwnym razie uruchamia COMMAND (terminal, w którym działa GitPoulpi). Gdy może pokazać okno, niczego nie uruchamia i nie startuje demona"
"launch --command" = "Polecenie do uruchomienia, gdy nie ma okna do pokazania, podawane po `--`"
"launch --folder" = """Otwiera ten folder: gdy `ui.reuse_window` jest włączone i okno jest otwarte, repozytorium zawierające folder staje się kartą ostatnio aktywnego okna (bez pytania); w przeciwnym razie GitPoulpi uruchamia się w wybranym terminalu na tym folderze. To uruchamia wpis „Otwórz w GitPoulpi” menedżera plików"""
"launch --new_window" = "Uruchamia nowe okno, nawet gdy jakieś jest otwarte"
"ai split-plan" = "Wypisuje plan, który AI proponuje do podziału commita na kilka commitów, w formacie JSON akceptowanym przez `split-commit --plan`. Niczego nie stosuje: przejrzyj go i przekaż do `split-commit`. Wymaga `ai.enabled = true`"
"ai split-plan --rev" = "Commit do podziału (dowolna rewizja: sha, `HEAD~2`, ...)"
"ai rewrite-script" = "Wypisuje skrypt Lua, który AI pisze do przepisania historii na podstawie twojego polecenia (\"przenieś każdy commit zrobiony nocą na następny ranek\"), razem z wynikiem `rewrite script check` dla niego. Niczego nie uruchamia i niczego nie zmienia: przeczytaj skrypt, potem `rewrite script test` i `rewrite preview --script`. Wysyła tylko twoje polecenie oraz, z `--sample N`, autora, datę i temat N commitów (nigdy zawartości plików). Wymaga `ai.enabled = true`"
"ai rewrite-script --instruction" = "Co skrypt ma robić, własnymi słowami"
"ai rewrite-script --sample" = "Wysyła też autora, datę i temat N najnowszych commitów (najwyżej 50), żeby model zobaczył, jak wyglądają dane. Domyślnie wyłączone: bez tego żadne dane o commitach nie opuszczają komputera"
"ai rewrite-rules" = "Wypisuje reguły i ustawienia, które AI proponuje do przepisania historii na podstawie twojego opisu (\"zamień mój stary e-mail a@b na c@d we wszystkich commitach\", \"usuń secrets.txt z całej historii\"), jako przepis JSON czytany przez `rewrite preview --recipe-json` (zapisz pole `recipe` do pliku dla `--recipe`), razem z tym, co pominięto, i dlaczego. Niczego nie podgląda ani nie stosuje: przeczytaj reguły, potem sam uruchom `rewrite preview` i `rewrite apply`. Wysyła tylko twój opis, a z `--context` także bieżącą gałąź, nazwy gałęzi i tagów oraz autorów 200 najnowszych commitów (nigdy zawartości plików). Wymaga `ai.enabled = true`"
"ai rewrite-rules --description" = "Jak przepisać historię, własnymi słowami"
"ai rewrite-rules --context" = "Wysyła także nazwy gałęzi i tagów oraz autorów 200 najnowszych commitów (najwyżej 100 nazw gałęzi i tagów oraz 100 autorów), aby model mógł je dokładnie nazwać. Domyślnie wyłączone: bez tego komputera nie opuszcza nic poza twoim opisem"
"split-commit" = "Dzieli commit bieżącej gałęzi na kilka, od najstarszego, według planu JSON (numeracja: `split-source`). Ostatni nowy commit zachowuje oryginalne drzewo, więc potomkowie i drzewo robocze pozostają bez zmian; wypchnięty commit wymaga potem force push. Jedno `undo` przywraca wszystko. Kod wyjścia 2 przy odmowie"
"split-commit --commit" = "Commit do podziału (dowolna rewizja: sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Sprawdza plan i wypisuje to, co nie zostało przypisane; niczego nie zmienia"
"split-commit --plan" = "Plan (JSON), ze ścieżki pliku lub `-` dla stdin. Element to `path` plus opcjonalny `hunk` plus opcjonalne `lines` (indeksy w `lines` hunka); element tylko z `path` oznacza cały plik"
"split-commit --rest_message" = "Umieszcza wszystko, czego plan nie przypisuje, w ostatnim commicie z tym opisem"
"split-commit --sign" = "Podpisuje nowe commity (i ponownie odtworzonych potomków)"
"split-source" = "Zmiany commita ponumerowane dla `split-commit`: każdy plik z jego hunkami (`id`, linie) albo, dla plików, które można przypisać tylko w całości (binarny, tylko tryb, dodany, usunięty, podmoduł, LFS), powód. Tylko do odczytu"
"split-source --commit" = "Commit (dowolna rewizja: sha, `HEAD~2`, ...)"
"rewrite" = "Przepisuje historię zbiorczo (tożsamości, daty, opisy) według przepisu: `preview` planuje to bez zmieniania czegokolwiek, `apply` wykonuje sprawdzony plan jako JEDEN wpis cofania, `run` robi jedno i drugie dla skryptów. Wysyła cokolwiek tylko `push`: wypycha przepisane refy siłą, każdy z leasem"
"rewrite apply" = "Stosuje podgląd: przesuwa refy jako JEDEN wpis cofania (`gitpoulpi undo` przywraca wszystko). Nigdy nie wypycha. Kod wyjścia 2 przy odmowie (repozytorium zmieniło się od podglądu, zły digest, ...), 3 gdy plan przesuwa refy będące na zdalnym, a brakuje `--yes`"
"rewrite apply --digest" = "Digest wypisany przez `rewrite preview`: przejrzany plan"
"rewrite apply --run" = "Identyfikator uruchomienia wypisany przez `rewrite preview`"
"rewrite apply --yes" = "Potwierdza przesunięcie refów, które są już wypchnięte. Bez tego taki plan niczego nie zmienia, a kod wyjścia to 3"
"rewrite diff" = "Co reguła zawartości zrobiła z jednym plikiem jednego commita w podglądzie: różnice między starym a nowym plikiem. Linie usuwane przez regułę sekretów są ukryte. Tylko do odczytu"
"rewrite diff --commit" = "Commit w stanie sprzed przepisania (identyfikator z wierszy)"
"rewrite diff --path" = "Plik, względem korzenia repozytorium"
"rewrite diff --run" = "Identyfikator uruchomienia wypisany przez `rewrite preview`"
"rewrite discard" = "Porzuca podgląd bez stosowania. Dwukrotne porzucenie jest w porządku"
"rewrite discard --run" = "Identyfikator uruchomienia wypisany przez `rewrite preview`"
"rewrite preview" = "Planuje przepisanie historii bez zmieniania czegokolwiek: liczby, refy, które by się przesunęły, ostrzeżenia i pierwsze wiersze. Zachowuje plan w demonie jako uruchomienie (`run`, `digest`) dla `rewrite rows` i `rewrite apply`. Podgląd leży też na dysku w katalogu git repozytorium, więc `rewrite apply` działa z późniejszego polecenia, po restarcie demona lub z innego frontendu, bez uruchamiania demona; tylko `rewrite rows` potrzebuje demona, który zrobił podgląd (działającego albo użyj `--all` przy podglądzie). Kod wyjścia 2, gdy przepis zostaje odrzucony"
"rewrite preview --all" = "Wypisuje każdy zmieniony commit"
"rewrite preview --all_local" = "Przepisuje każdą gałąź lokalną i tag zamiast bieżącej gałęzi"
"rewrite preview --committer" = "Committer przepisanych commitów: `keep` (domyślnie) lub `me-now`"
"rewrite preview --include_protected" = "Przepisuje też te chronione gałęzie, które są już wypchnięte (domyślnie pominięte; można powtarzać)"
"rewrite preview --lfs_export" = "Reguła LFS: zamienia wskaźniki LFS pasujące do tego wzorca glob z powrotem w prawdziwe pliki w każdym commicie (można powtarzać). Obiekty muszą być w lokalnym magazynie LFS (najpierw `lfs fetch`); w przeciwnym razie odmowa z listą"
"rewrite preview --encoding_exclude" = "Z `--reencode`: pliki, których nie rusza (wzorce glob, można powtarzać)"
"rewrite preview --encoding_fallback" = "Z `--reencode`: jako co czytany jest plik, który nie ma znacznika ani nie jest UTF-8, gdy źródło jest wykrywane (domyślnie `windows-1252`)"
"rewrite preview --encoding_paths" = "Z `--reencode`: pliki, które konwertuje (wzorce glob, można powtarzać)"
"rewrite preview --eol" = "Reguła końców linii: każdy plik tekstowy pasujący do `--eol-paths` dostaje ten koniec linii (`lf` dla Linuxa i macOS, `crlf` dla Windows, `cr` dla klasycznego Maca); mieszane końce są ujednolicane, a pliki binarne pomijane"
"rewrite preview --eol_exclude" = "Z `--eol`: pliki, których nie rusza (wzorce glob, można powtarzać)"
"rewrite preview --eol_follow_attributes" = "Z `--eol`: czyta główny `.gitattributes` każdego commita: pliki z `-text` i `binary` są pomijane, a pliki z `eol=lf` i `eol=crlf` zachowują własny koniec linii"
"rewrite preview --eol_paths" = "Z `--eol`: pliki, które konwertuje (wzorce glob, można powtarzać; wzorzec bez ukośnika pasuje na dowolnej głębokości)"
"rewrite preview --reencode" = "Reguła kodowania: pliki tekstowe pasujące do `--encoding-paths` są konwertowane na to kodowanie (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). Pliki binarne, pliki nieczytelne w kodowaniu źródłowym i znaki, których kodowanie docelowe nie pomieści, zostają bez zmian i są zliczane"
"rewrite preview --reencode_from" = "Z `--reencode`: kodowanie, w którym są pliki. Pominięte: wykrywane dla każdego pliku (znacznik kolejności bajtów, poprawny UTF-8, w przeciwnym razie `--encoding-fallback`)"
"rewrite preview --strip_exec" = "Reguła trybu pliku: bit wykonywalności (100755 zmienia się w 100644) znika z plików pasujących do tych wzorców glob (można powtarzać). Zawartość nietknięta"
"rewrite preview --strip_exec_exclude" = "Z `--strip-exec`: pliki, które zachowują bit wykonywalności (wzorce glob)"
"rewrite preview --lfs_import" = "Reguła LFS: przenosi pliki pasujące do tego wzorca glob do Git LFS w każdym commicie (można powtarzać; w stylu `.gitattributes`: wzorzec bez ukośnika pasuje na dowolnej głębokości). Wymaga git-lfs. Zawartość trafia do lokalnego magazynu LFS, a `.gitattributes` dostaje linię `filter=lfs`; potem wypchnij obiekty"
"rewrite preview --lfs_min_size" = "Z `--lfs-import`: przenoszone są tylko pliki o rozmiarze co najmniej tylu bajtów"
"rewrite preview --limit" = "Ile zmienionych commitów wypisać (domyślnie 50)"
"rewrite preview --match_email" = "Reguła tożsamości: dopasuj ten e-mail autora / committera"
"rewrite preview --match_name" = "Reguła tożsamości: dopasuj tę nazwę autora / committera"
"rewrite preview --prune_empty" = "Commity, które reguła zawartości zostawia puste: `auto` je usuwa (domyślnie), `never` zachowuje"
"rewrite preview --recipe" = "Plik przepisu (TOML lub JSON, format warsztatu w TUI) albo `-` dla JSON na standardowym wejściu"
"rewrite preview --recipe_json" = "Przepis jako ciąg JSON (dla wywołujących, którzy nie mogą zapisać pliku)"
"rewrite preview --refs" = "Przepisuje tylko te gałęzie lokalne lub tagi (można powtarzać)"
"rewrite preview --remove_blobs_over" = "Reguła zawartości: usuwa z każdego commita każdy plik większy niż tyle bajtów"
"rewrite preview --remove_findings" = "Reguła zawartości: usuwa sekret znaleziony przez `rewrite scan-secrets`, według id znaleziska (powtarzalne), albo `all` dla każdego znaleziska w zakresie. Demon skanuje ponownie i sam rozwiązuje id: wartość nigdy nie trafia do wiersza poleceń, przepisu ani logu"
"rewrite preview --remove_paths" = "Reguła zawartości: usuwa z każdego commita pliki i foldery pasujące do tego wzorca glob (można powtarzać; wzorzec bez ukośnika pasuje na dowolnej głębokości)"
"rewrite preview --replace_content" = "Reguła zawartości `SZUKANE=ZAMIENNIK`: zamienia dosłowny tekst w każdym pliku tekstowym (można powtarzać; pliki binarne są pomijane i zliczane). Dla sekretów użyj reguły `content_replace` w przepisie z `--secrets-file`"
"rewrite preview --replace_message" = "Reguła opisu `SZUKANE=ZAMIENNIK` (dosłowny tekst, można powtarzać)"
"rewrite preview --script_params" = "Parametr skryptu `NAZWA=WARTOŚĆ`, przekazywany każdemu `--script` (można powtarzać). Nazwy to te, które deklaruje nagłówek skryptu"
"rewrite preview --scripts" = "Reguła skryptu: uruchamia ten plik skryptu Lua na każdym commicie (można powtarzać, po kolei, po regułach z pozostałych flag). Plik jest czytany tutaj i osadzany w przepisie; format opisuje `rewrite script check`"
"rewrite preview --secrets_file" = "Plik z jednym sekretem w wierszu (puste wiersze są pomijane). Sekrety trafiają do reguł `content_replace` przepisu, które szukają sekretów, więc nigdy nie wędrują w wierszu poleceń, zapisanym przepisie ani logu"
"rewrite preview --set_email" = "Reguła tożsamości: e-mail do ustawienia"
"rewrite preview --set_name" = "Reguła tożsamości: nazwa do ustawienia (z `--set-email` wymagane przynajmniej jedno)"
"rewrite preview --shift_dates" = "Reguła dat: przesuwa każdą datę o tyle sekund (ujemne: wcześniej), zachowując przesunięcie strefy czasowej każdego commita"
"rewrite preview --signatures" = "Co zrobić z podpisami przepisanych commitów: `strip`, `resign-signed` lub `resign-all`. Wymagane, gdy zmieniają się podpisane commity"
"rewrite preview --since" = "Z bieżącą gałęzią: tylko commity po tej rewizji"
