"lost-commits" = "Commity, do których nie prowadzi żadna gałąź, tag, zdalne repozytorium ani stash: to, co zostawiła po sobie usunięta gałąź (nazwane przez reflog albo trzymane tylko przez pin cofania) oraz, chyba że podano `--no-deep`, osierocone commity z bazy obiektów. Od najnowszego. Utwórz gałąź na jednym z nich, by go odzyskać"
