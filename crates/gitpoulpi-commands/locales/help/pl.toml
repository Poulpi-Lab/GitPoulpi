"tag delete" = "Usuwa tag. Domyślnie tylko lokalny (`--local`): gdy zdalne repozytorium też go ma, następny `fetch` go przywróci, o czym mówi odpowiedź. `--remote <R>` usuwa go tylko na tym zdalnym (skutek na zewnątrz: inni go tracą), `--both` usuwa go tutaj i na zdalnym, które go ma (`--both --remote <R>` wskazuje jedno)"
"tag delete --both" = "Usuwa tutaj i na zdalnym, które ma ten tag"
"tag delete --local" = "Usuwa tylko tag lokalny (domyślnie)"
"tag delete --remote" = "Usuwa na tym zdalnym (samodzielnie, chyba że z `--both`)"
"tag delete-remote" = "Usuwa tag ze zdalnego, zachowując lokalny"
"tag fetch" = "Pobiera jeden tag ze zdalnego do lokalnych tagów - tego potrzebuje tag oznaczony `remote` w `tag list`. Nigdy nie nadpisuje lokalnego tagu wskazującego inny commit"
"tag fetch --remote" = "Pominięte: jedyne zdalne, które ma ten tag"
"tag list" = "Każdy tag z informacją, gdzie istnieje: `local` (tutaj), `remote` (zdalne, które go mają), `differs_on` (zdalne trzymające go na innym commicie) i `where`: `local`, `remote` (niepobrany lub usunięty tutaj), `both` albo `differs`. Dane z ostatniego fetcha lub pusha, nie z sieci"
"tag list --unpushed" = "Tylko tagi, których żadne znane zdalne nie ma"
"tag push" = "Wysyła tagi do zdalnego. Bez nazw wysyła każdy tag, którego żadne znane zdalne nie ma - jeden push, nie jeden na tag"
"tag push --names" = "Tagi do wysłania. Pomiń, by wypchnąć każdy niewypchnięty tag"
theme = "Motywy kolorystyczne: wyświetl listę lub wypisz jeden jako plik motywu"
licenses = "Wypisuje licencje stron trzecich i podziękowania wbudowane w ten program (ten sam tekst co w O programie > Licencje i w pliku THIRD-PARTY-LICENSES.txt w archiwum wydania)"
