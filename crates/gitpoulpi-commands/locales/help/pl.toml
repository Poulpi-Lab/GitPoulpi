"ai trust" = "Wiąże klucz API profilu z adresem, dla którego go zapisano: pokazuje, co jest zaufane, albo akceptuje bieżący adres profilu (po zmianie jego base URL), certyfikat serwera na własnym hostingu lub zwykłe http. Uruchamia to tylko człowiek (to nie jest narzędzie agenta)"
