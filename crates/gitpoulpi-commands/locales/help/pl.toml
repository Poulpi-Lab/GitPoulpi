"reflog-restore --oid" = "Commit, do którego przesunąć (pole `new` wpisu reflogu)"
"reflog-restore --ref" = "`HEAD` albo gałąź"
"undo-restore" = "„Przywróć tylko tę”: przywraca to, co usunęła jedna wcześniejsza operacja (usuniętą gałąź lub tag, porzucony stash, odrzucony lub usunięty plik, usunięte zdalne repozytorium, linię ignorowania), bez cofania operacji, które były po niej. Przywrócenie to nowy wpis w dzienniku, więc `undo` je cofa. Nic nie jest nadpisywane: plik zmieniony od tamtej pory dostaje zachowaną wersję obok, jako `<nazwa>.restored`; reset, amend lub rebase wracają jako nowa gałąź na dawnym wierzchołku. Zapis `gitpoulpi undo restore <id>` oznacza to samo. Kod wyjścia 2, gdy się nie da (JSON podaje powód)"
