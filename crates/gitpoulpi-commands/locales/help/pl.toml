"hosting integrations trust" = "Przegląda kontrolę bezpieczeństwa profilu i akceptuje to, co zatrzymała: nowy adres, inne konto, nowy certyfikat, zwykłe http. Uruchamia to tylko człowiek (to nie jest narzędzie agenta). Bez opcji wypisuje, co jest zaufane, a co zatrzymane"
"hosting integrations trust --accept_account" = "Akceptuje to id konta jako właściciela tokenu"
