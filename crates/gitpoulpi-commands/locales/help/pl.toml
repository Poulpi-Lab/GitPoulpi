"hosting integrations trust --id" = "Profil"
"hosting integrations trust --strict_tls" = "Trzyma przypięty certyfikat ściśle: klucz musi pasować, nawet gdy certyfikat łączy się z publicznym korzeniem"
repo-auth = "Którą tożsamością to repozytorium się uwierzytelnia (HTTPS i SSH): własną tożsamością komputera, kontem GitPoulpi albo plikiem klucza. `show` i `test` tylko czytają; `set` i `clear` to decyzja człowieka"
"repo-auth clear" = "Zapomnij profil: repozytorium wraca do własnej tożsamości komputera. Może to zrobić tylko człowiek: agent zostaje odrzucony"
"repo-auth set" = "Wybierz tożsamość, którą to repozytorium się uwierzytelnia, osobno dla każdego protokołu: `--https` dla zdalnych repozytoriów HTTPS, `--ssh` dla SSH. Profil jest przechowywany w prywatnym katalogu GitPoulpi, nigdy w repozytorium. Ustawić go może tylko człowiek: agent zostaje odrzucony (kod wyjścia 2)"
"repo-auth set --cache_minutes" = "Z `token-command`: jak długo jego token jest używany ponownie, w minutach"
"repo-auth set --command" = "Z `--https token-command`: polecenie i jego argumenty (pierwsze słowo to program). Wpisz `--command` na końcu: każde słowo po nim, także z myślnikiem (`sh -c ...`), należy do polecenia"
"repo-auth set --helper" = "Z `--https helper`: polecenie pomocnika poświadczeń. Człowiek potwierdza je razem z jego skrótem (albo podaje `--yes`)"
"repo-auth set --hosts" = "Z `helper` lub `token-command`: hosty, które może obsługiwać (po przecinku lub powtórzone)"
"repo-auth set --https" = "Tożsamość HTTPS: `system` (własni pomocnicy gita), `integration:<id>` (token konta GitPoulpi), `helper` (jeden pomocnik poświadczeń, z `--helper`) albo `token-command` (polecenie wypisujące token, z `--command` i `--hosts`)"
"repo-auth set --ignore_repo_helpers" = "Z `--https system`: pomiń pomocników poświadczeń, które ustawia samo repozytorium, i zachowaj systemowych i globalnych"
"repo-auth set --known_hosts" = "Z `--ssh key:` lub `integration-key:`: plik `known_hosts`"
"repo-auth set --ssh" = "Tożsamość SSH: `system` (własna konfiguracja i agent ssh), `key:<ścieżka>` (plik klucza prywatnego, podawany samodzielnie) albo `integration-key:<id>` (klucz konta GitPoulpi)"
"repo-auth set --strict" = "Z `--ssh key:` lub `integration-key:`: odrzucaj nieznane klucze hostów (`StrictHostKeyChecking=yes`)"
"repo-auth set --username" = "Nazwa użytkownika: z `system` to `credential.username` (pozwala menedżerowi poświadczeń wybrać jedno z kilku kont); z `integration:<id>` to nazwa użytkownika wysyłana z tokenem"
"repo-auth set --yes" = "Potwierdź pomocnika lub polecenie tokenu bez interaktywnego pytania (polecenie i jego skrót nadal są wypisywane)"
"repo-auth show" = "Pokaż, którą tożsamością to repozytorium się uwierzytelnia: zapisany profil, tożsamość, której użyje każde zdalne repozytorium, ustawienia zastępowane przez profil i ewentualne ostrzeżenia. Nigdy nie wypisuje sekretu; pomocnik lub polecenie tokenu jest wypisywane tylko człowiekowi (agent dostaje `{set, sha256}`)"
"repo-auth test" = "Przetestuj połączenie każdego zdalnego repozytorium (lub jednego) z zastosowanym profilem, niczego nie zmieniając: wypisuje jego gałęzie, a z `--push` pyta, czy push zostałby przyjęty. Zwraca raport każdego zdalnego repozytorium oraz użytą tożsamość. Korzysta z sieci"
"repo-auth test --push" = "Sprawdź też, czy push zostałby przyjęty"
"repo-auth test --remote" = "Tylko to zdalne repozytorium (domyślnie: każde)"
"apply-commit" = "Zastosuj zmiany wprowadzone przez jeden commit (także utracony) tylko w drzewie roboczym: indeks i HEAD zostają bez zmian. Wszystko albo nic: gdy któryś plik nie daje się zastosować czysto, nic się nie zmienia (`stash from-commit` zachowuje zmiany jako stash). Merge commit jest odrzucany. `undo` to cofa"
"apply-commit --commit" = "Commit, którego zmiany zastosować (dowolna rewizja: sha, `HEAD~2`, ...)"
"stash from-commit" = "Zapisz zmiany wprowadzone przez jeden commit (także utracony) jako nowy stash, nie ruszając drzewa roboczego. `undo` znów go porzuca"
"stash from-commit --commit" = "Commit, którego zmiany zachować (dowolna rewizja: sha, `HEAD~2`, ...)"
"stash from-commit --message" = "Opis stasha; bez niego powstaje opis wskazujący commit"
