"rewrite apply --target" = "Folder nowego repozytorium, gdy plan wyodrębnia podkatalog jako klon lub submoduł (zob. `--extract-mode`)"
"rewrite maps" = "Pliki `commit-map` i `ref-map` danego uruchomienia (format git-filter-repo: wiersz nagłówka, potem `old new` w każdej linii; czyszczenie repozytorium w GitLab przyjmuje mapę commitów). Wypisuje ich ścieżki albo kopiuje je do `--out`"
