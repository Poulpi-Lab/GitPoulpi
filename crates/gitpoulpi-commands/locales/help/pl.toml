desktop = "Skróty uruchamiające GitPoulpi z launchera systemu w terminalu wskazanym przez `ui.launch_terminal`"
"desktop folder-menu" = """Wpis „Otwórz w GitPoulpi” w menu prawego przycisku menedżera plików: Eksplorator plików (Windows), GNOME Files, Dolphin, Nemo, Thunar, Caja i PCManFM (Linux), Finder (macOS)"""
