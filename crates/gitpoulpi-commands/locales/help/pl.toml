"rewrite scan-secrets" = "Skanuje historię w poszukiwaniu sekretów: znanych prefiksów tokenów (GitHub, GitLab, Slack, AWS, Stripe, npm, Google, OpenAI, Anthropic), bloków kluczy prywatnych, JWT, haseł w adresach URL i linii `password = value`, które wyglądają na losowe. Wypisuje dla każdego znaleziska regułę, plik, pierwszy i ostatni commit, liczniki i ZAMASKOWANY podgląd (`ghp_****abcd`); wartość nigdy nie jest wypisywana, logowana ani zapisywana. Nie jest wyczerpujące. Sekret, który został wypchnięty, jest ujawniony: najpierw wymień go na nowy. Tylko do odczytu"
"rewrite scan-secrets --all_local" = "Skanuje każdą gałąź lokalną i tag zamiast bieżącej gałęzi"
"rewrite scan-secrets --refs" = "Skanuje tylko te gałęzie lokalne lub tagi (powtarzalne)"
"rewrite scan-secrets --since" = "Dla bieżącej gałęzi: tylko commity po tej rewizji"
"rewrite script" = "Wbudowane skrypty Lua do przepisywania historii: sprawdź skrypt albo wypróbuj go na kilku commitach. Prawdziwe uruchomienie: `rewrite preview --script PLIK`"
"rewrite script check" = "Kompiluje skrypt Lua i wypisuje jego nagłówek (nazwa, okno, parametry), zdefiniowane funkcje i wszystkie problemy. Kod wyjścia 2, gdy są problemy. Tylko do odczytu; nic nie jest uruchamiane na commicie"
"rewrite script check --file" = "Plik skryptu"
"rewrite script check --params" = "Parametr `NAZWA=WARTOŚĆ` (można powtarzać), sprawdzany względem nagłówka"
"rewrite script test" = "Uruchamia skrypt na kilku commitach i wypisuje, co by zmienił i co zalogował, w kolejności historii, ze stanem przenoszonym z commita na commit. Tylko do odczytu: nic nie jest zapisywane. Kod wyjścia 2, gdy skrypt się nie powiedzie (odpowiedź wskazuje commit i powód)"
"rewrite script test --commits" = "Commit, na którym uruchomić (można powtarzać; rewizja lub identyfikator)"
"rewrite script test --file" = "Plik skryptu"
"rewrite script test --params" = "Parametr `NAZWA=WARTOŚĆ` (można powtarzać)"
"rewrite preview --script_language" = "Język każdego `--script`: `lua` (wbudowany, w piaskownicy), `shell`, `python` lub `lua-external`. Domyślnie: według rozszerzenia pliku (`.lua`; `.sh`, `.bash`, `.ps1`; `.py`), w przeciwnym razie `lua`. Python i zewnętrzny Lua trzeba włączyć w `rewrite.external_scripts`"
"rewrite preview --trust" = "Ufa zewnętrznym skryptom (shell, Python, zewnętrzny Lua) tego przepisu, według ich zawartości: zapamiętane dla tego repozytorium i pytanie wraca, gdy skrypt się zmieni. Decyzja człowieka: serwer MCP jej odmawia, a agent może uruchamiać tylko skrypty, którym człowiek zaufał"
"rewrite run --script_language" = "Język każdego `--script`: `lua` (wbudowany, w piaskownicy), `shell`, `python` lub `lua-external`. Domyślnie: według rozszerzenia pliku (`.lua`; `.sh`, `.bash`, `.ps1`; `.py`), w przeciwnym razie `lua`. Python i zewnętrzny Lua trzeba włączyć w `rewrite.external_scripts`"
"rewrite run --trust" = "Ufa zewnętrznym skryptom (shell, Python, zewnętrzny Lua) tego przepisu, według ich zawartości: zapamiętane dla tego repozytorium i pytanie wraca, gdy skrypt się zmieni. Decyzja człowieka: serwer MCP jej odmawia, a agent może uruchamiać tylko skrypty, którym człowiek zaufał"
"rewrite script check --language" = "`lua`, `shell`, `python` lub `lua-external`; domyślnie według rozszerzenia"
"rewrite script check --trust" = "Najpierw zaufaj temu skryptowi (decyzja człowieka, odrzucana przez MCP)"
"rewrite script check#long" = """
Kompiluje skrypt Lua i wypisuje jego nagłówek (nazwa, okno, parametry), zdefiniowane funkcje i wszystkie problemy. Kod wyjścia 2, gdy są problemy. Tylko do odczytu; nic nie jest uruchamiane na commicie.

Dla skryptu shell, Python lub zewnętrznego Lua (bez piaskownicy) mówi też, czy znaleziono interpreter i czy skrypt ma zaufanie, a dla zaufanego robi próbny handshake: uruchamia skrypt raz z wymyślonym commitem (`"dry_run": true`) i sprawdza odpowiedź. Skrypt bez zaufania nigdy nie jest uruchamiany."""
"rewrite script test --language" = "`lua`, `shell`, `python` lub `lua-external`; domyślnie według rozszerzenia"
"rewrite script test --trust" = "Najpierw zaufaj temu skryptowi (decyzja człowieka, odrzucana przez MCP)"
"rewrite script trust" = "Ufa zewnętrznemu skryptowi (shell, Python, zewnętrzny Lua) według jego zawartości: SHA-256 pliku jest zapamiętany dla tego repozytorium, więc skrypt może działać (preview, run, test); zmieniony plik pyta ponownie. Te skrypty nie są w piaskownicy: działają z twoimi uprawnieniami, więc najpierw przeczytaj plik. Może to zrobić tylko człowiek: nie ma na to narzędzia MCP"
"rewrite script trust --file" = "Plik skryptu"
"rewrite tools" = "Jakich narzędzi potrzebują funkcje przepisywania (gpg / ssh-keygen / gpgsm do ponownego podpisywania, interpretery skryptów, git-lfs) i czy każde zostało znalezione. Tylko do odczytu"
"rewrite tools --fresh" = "Sprawdza ponownie zamiast odpowiadać z jednominutowej pamięci podręcznej"
"mailmap" = "Plik `.mailmap`: jedna kanoniczna nazwa i jeden e-mail dla osób, które commitowały pod kilkoma. Log, blame i historia pliku pokazują przypisane nazwy (`log.use_mailmap`) bez ruszania commitów. `list` liczy tożsamości w historii i pokazuje, które są przypisane, `check` pokazuje, jak rozwiązują się wybrane tożsamości, `add` łączy tożsamości w jedną przez dopisanie linii do `.mailmap` (edytowany, nie zatwierdzany; można cofnąć)"
"mailmap add" = "Łączy tożsamości w jedną kanoniczną przez dopisanie linii do `.mailmap` (tworzonego, gdy go brak; linia, która już tam jest, nie jest powtarzana). Plik jest edytowany, nie zatwierdzany: zrób jego commit samodzielnie. Jeden wpis do cofnięcia (`gitpoulpi undo` przywraca poprzedni plik). Log od razu pokazuje tożsamość kanoniczną (`log.use_mailmap`); zapisane commity się nie zmieniają, więc nie potrzeba force push. Aby przepisać same commity, użyj reguły `mailmap` w `rewrite`"
"mailmap add --canonical" = "Tożsamość do zachowania, `Name <email>`"
"mailmap add --file" = "Plik `.mailmap` do zapisu, względem korzenia repozytorium (domyślnie: `.mailmap` w korzeniu)"
"mailmap add --from" = "Tożsamość do przypisania do niej, `Name <email>` (powtarzalne, co najmniej jedna)"
"mailmap check" = "Pokazuje, jak tożsamości (`Name <email>` lub `<email>`) wyglądają przez `.mailmap` repozytorium: nazwa i e-mail kanoniczne albo ta sama tożsamość, gdy nic jej nie przypisuje. Tylko do odczytu"
"mailmap check --identities" = "Tożsamości do rozwiązania, każda `Name <email>` lub `<email>`"
"mailmap list" = "Wymienia każdą nazwę i e-mail, które były autorem lub committerem commita z zakresu, z liczbą commitów każdej jako autor i jako committer, od największej, oraz tożsamością, do której `.mailmap` już ją przypisuje (`mapped_to`). Tylko do odczytu"
"mailmap list --all_local" = "Każda gałąź lokalna i tag zamiast bieżącej gałęzi"
"mailmap list --mapped" = "Tylko tożsamości, które `.mailmap` już przypisuje"
"mailmap list --refs" = "Tylko te gałęzie lokalne lub tagi (powtarzalne)"
"mailmap list --unmapped" = "Tylko tożsamości, których `.mailmap` nie przypisuje"
"rewrite preview --mailmap" = "Reguła mailmap: przepisuje autorów i committerów na to, jak nazywa ich `.mailmap` drzewa roboczego (historia pokazuje wtedy to, co `git log --use-mailmap`). `--who` wybiera autora, committera lub obu. Do poprawki samego wyświetlania, bez przepisywania, użyj zamiast tego `mailmap add`"
"rewrite preview --mailmap_file" = "Z `--mailmap`: stosuje ten plik zamiast `.mailmap` drzewa roboczego (względem korzenia repozytorium albo bezwzględny)"
"rewrite run --mailmap" = "Reguła mailmap: przepisuje autorów i committerów na to, jak nazywa ich `.mailmap` drzewa roboczego (historia pokazuje wtedy to, co `git log --use-mailmap`). `--who` wybiera autora, committera lub obu. Do poprawki samego wyświetlania, bez przepisywania, użyj zamiast tego `mailmap add`"
"rewrite run --mailmap_file" = "Z `--mailmap`: stosuje ten plik zamiast `.mailmap` drzewa roboczego (względem korzenia repozytorium albo bezwzględny)"
"rewrite analyze" = "Analiza rozmiaru historii, jak `filter-repo --analyze`: największe bloby ze ścieżką, rozmiarem, pierwszym i ostatnim commitem oraz informacją, czy nadal są w HEAD, największe foldery, pliki usunięte z HEAD, które historia wciąż przechowuje, i sumy z tym, ile zwolniłoby usunięcie części obecnej tylko w historii (szacunek: dopiero po purge i gc). To, co pokazuje, usuniesz przez `rewrite preview --remove-paths PATH` lub `--remove-blobs-over BYTES`. Tylko do odczytu"
"rewrite analyze --all_local" = "Analizuje każdą gałąź lokalną i tag zamiast bieżącej gałęzi"
"rewrite analyze --refs" = "Analizuje tylko te gałęzie lokalne lub tagi (powtarzalne)"
