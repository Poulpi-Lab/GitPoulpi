treat = "Sprawia, że git traktuje pliki jako binarne lub tekstowe, zapisując regułę `.gitattributes` (`binary` lub `text diff`) dla ścieżek: domyślnie plik w katalogu głównym repozytorium, `--file` dla pliku folderu lub `.git/info/attributes` (tylko ten klon). Reguła, która już nazywa ten sam wzorzec, jest przepisywana, nie przeczona. Odpowiedź mówi, czy git naprawdę traktuje teraz ścieżki w ten sposób (`effective`). Można cofnąć przez `gitpoulpi undo`, z wyjątkiem `.git/info/attributes`"
"treat --kind" = "Jak git ma traktować ścieżki"
"treat --paths" = "Ścieżki względem repozytorium (foldery z `--folder`)"
"treat --extension" = "Nazywa wszystkie pliki z rozszerzeniem każdej ścieżki (`*.ext`) zamiast samego pliku"
"treat --folder" = "Ścieżki są folderami: reguła obejmuje wszystko pod nimi"
"treat --file" = "`.gitattributes` względem repozytorium do zapisu lub `.git/info/attributes` (domyślnie: `.gitattributes` w katalogu głównym)"
convert = "Przepisuje kodowanie, zakończenia wierszy lub wcięcia plików w katalogu roboczym funkcjami edytora TUI i jego menu Konwertuj. Dokładnie jedna z opcji `--encoding`, `--eol` i `--indent`. Pliki binarne, brakujące i takie, których kodowanie docelowe nie potrafi przedstawić, są pomijane i zgłaszane, nigdy uszkadzane. Jeden wpis w dzienniku na całą partię: `gitpoulpi undo` przywraca wszystkie pliki"
"convert --paths" = "Pliki do konwersji, ścieżki względem repozytorium"
"convert --encoding" = "Kodowanie docelowe, tak jak nazywa je edytor (`UTF-8`, `UTF-8 BOM`, `UTF-16 LE`, `Windows-1252`, `ISO-8859-1`, `Shift_JIS`, ...)"
"convert --eol" = "Docelowe zakończenie wiersza"
"convert --indent" = "Białe znaki na początku wiersza jako `spaces:<n>` (spacje) lub `tabs:<n>` (tabulatory), `<n>` to szerokość tabulatora (1-8)"
ui = "Pokazuje rzeczy użytkownikowi w jego otwartym oknie GitPoulpi: commit, diff przy linii, plik, stronę ustawień. Tylko widok: nic tu nie zmienia repozytorium ani nie wpisuje niczego w okno, poza `ui propose`, które otwiera wstępnie wypełnione okno do potwierdzenia przez użytkownika (wyłączone, chyba że `[mcp] allow_ui_propose = true`). Wymaga otwartego TUI GitPoulpi w sesji"
"ui --launch" = "Gdy nigdzie nie jest otwarte okno, otwiera je skonfigurowanym poleceniem uruchomienia (`[ui] launch` / `launch_command`; domyślnie wyłączone) i czeka do 10 s, aż się podłączy. Bez tej flagi okno jest uruchamiane tylko wtedy, gdy ustawiono `[ui] launch` ORAZ `ui_control` to `auto`"
"ui --viewer" = "Wysyła do tego okna (`ui viewers` je wylicza) zamiast pozwalać demonowi wybrać"
"ui back" = "Cofa ostatnią zmianę widoku przez agenta (przywraca poprzedni widok)"
"ui highlight" = "Podświetla zakres linii w diffie lub pliku otwartym w oknie"
"ui highlight --no_scroll" = "Nie przewija zakresu do widoku"
"ui highlight --range" = "`A-B` lub `A:C-B:C` z kolumnami (liczone od 1)"
"ui notify" = "Pokazuje użytkownikowi krótką wiadomość toast"
"ui notify --message" = "Najwyżej 200 znaków; znaki sterujące są usuwane"
"ui propose" = """Proponuje zmianę do potwierdzenia przez użytkownika: otwiera się wstępnie wypełnione okno z oznaczeniem „Proposed by”, a nic się nie dzieje, dopóki użytkownik nie naciśnie jego własnego potwierdzenia. Wymaga `[mcp] allow_ui_propose = true`. Śledź id `proposal` z odpowiedzi w `proposals` polecenia `ui state`"""
"ui propose branch" = "Otwiera pole Nowa gałąź z wpisaną nazwą"
"ui propose branch --start_point" = "Gdzie gałąź się zaczyna (domyślnie: HEAD)"
"ui propose commit-message" = "Wypełnia Summary i Description kompozytora commita; nigdy nie zatwierdza"
"ui propose resolution" = "Otwiera edytor scalania na pliku z konfliktem z już wpisanym rozwiązaniem, do przejrzenia i potwierdzenia przez użytkownika przez Zapisz i oznacz jako rozwiązany (jego Ctrl+S to jedyne potwierdzenie; nic nie jest tu zapisywane ani dodawane do poczekalni). Wybory podaj jako `--pick` lub cały plik jako `--content-file`"
"ui propose resolution --content_file" = "Dokładny, ostateczny tekst pliku (`-` czyta standardowe wejście)"
"ui propose resolution --path" = "Ścieżka pliku z konfliktem względem repozytorium"
