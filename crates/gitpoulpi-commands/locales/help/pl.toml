"rewrite note" = "Notatka do wysłania osobom, które mają starą historię: dla każdej wypchniętej gałęzi i tagu stary i nowy czubek oraz co uruchomić (`git fetch`, potem `git reset --hard origin/<branch>` lub `git rebase --onto`). Tylko do odczytu"
"rewrite note --run" = "Id uruchomienia; `latest` (domyślnie) to ostatnio zastosowane uruchomienie"
"rewrite preview --extract" = "Reguła ścieżek: zostawia tylko ten podkatalog, który staje się korzeniem; commity, które go nie dotykają, są pomijane, a merge'e upraszczane. Pytanie za każdym razem: podaj `--extract-mode`, inaczej kod wyjścia to 3 i nic nie jest podglądane. Wyodrębnianie działa przed pozostałymi flagami ścieżek"
"rewrite preview --extract_mode" = "Jak kończy się `--extract`: `clone` (nowy lokalny klon w `--target`, oryginał nietknięty; każda lokalna gałąź i tag), `in-place` (historia tego repozytorium jest przepisywana, jeden wpis cofania) lub `submodule` (klon jak w `clone` i jeden nowy commit na bieżącej gałęzi zastępuje folder jego submodułem; ta historia zostaje)"
"rewrite preview --into_subdir" = "Reguła ścieżek: przenosi całe repozytorium do tego podkatalogu w każdym commicie (do łączenia repozytoriów bez kolizji ścieżek)"
"rewrite preview --move_paths" = "Reguła ścieżek `Z=DO`: zmienia nazwę pliku lub folderu w każdym commicie, te same bloby i drzewa pod nową ścieżką (można powtarzać, po kolei, po regułach zawartości). Commit, w którym `DO` już istnieje, nie jest zmieniany: podgląd zostaje odrzucony (kod wyjścia 2, `path_collision`) z listą commitów i ścieżek"
"rewrite preview --target" = "Folder nowego repozytorium dla `--extract-mode clone` lub `submodule`: nie może istnieć (lub musi być pusty) i nie może leżeć wewnątrz tego repozytorium. Używane przez `rewrite run`; `rewrite apply` ma własne"
"rewrite push" = "Wypycha refy przesunięte przez zastosowane uruchomienie, które były na zdalnym, każdy z `--force-with-lease=<ref>:<the id the remote had when you previewed>` (nigdy zwykły force), jednym wypchnięciem `--atomic` na zdalne tam, gdzie serwer na to pozwala (w przeciwnym razie jedno wypchnięcie na ref, o czym mówi odpowiedź). Tagi są uwzględnione. Gałęzie chronione (`rewrite.protected_branches`) są pomijane, chyba że wymieni się je przez `--include-protected` albo wszystkie przez `--include-all-protected`. Ref, którego zdalne zmieniło się od podglądu, jest dla tego refa odrzucany (zrób fetch i sprawdź, potem uruchom ponownie). Nie do cofnięcia: zdalne zachowuje nową historię, nawet jeśli zrobisz lokalnie `undo` przepisania. Bez `--yes` (albo z `--dry-run`) nic nie jest wysyłane: odpowiedź wymienia, co by wypchnięto, a bez `--yes` kod wyjścia to 3. Kod wyjścia 2, gdy uruchomienia już nie ma, 4, gdy ref został odrzucony lub nie wypchnięty"
"rewrite push --dry_run" = "Pyta zdalne, co by się stało (leasy sprawdzone), i niczego nie wysyła"
"rewrite push --include_all_protected" = "Wypycha też każdą chronioną gałąź tego uruchomienia"
"rewrite push --include_protected" = "Wypycha też tę chronioną gałąź (powtarzalne)"
"rewrite push --no_atomic" = "Jedno wypchnięcie na ref zamiast jednego wypchnięcia `--atomic` typu wszystko albo nic"
"rewrite push --remote" = "Tylko refy tego zdalnego"
"rewrite push --run" = "Id uruchomienia wypisane przez `rewrite apply`; `latest` (domyślnie) to ostatnio zastosowane uruchomienie"
"rewrite push --yes" = "Wykonuje wypchnięcie. Bez tego nic nie jest wysyłane (kod wyjścia 3)"
"rewrite purge" = "Usuwa z tego klona na stałe starą historię przepisania: porzuca przypięcia cofania tego przepisania (i każdej wcześniejszej operacji, której przypięcia też trzymają starą historię), wygasza wpisy reflogu, które ją wskazują, przycina obiekty (`gc --prune=now`) i sprawdza, czy zniknęły. Cofnięcie tych operacji przestaje być możliwe (zostają w `undo --list` jako usunięte na stałe). Po rozpoczęciu nie da się tego zatrzymać ani cofnąć. Blokuje to wszystko, co nadal trzyma starą historię (gałąź poza przepisaniem, stash, HEAD innego worktree, ref śledzący zdalne: zrób fetch po wypchnięciu), i wtedy nic się nie zmienia. Nic nie jest wysyłane do żadnego zdalnego; odpowiedź wymienia kroki, których potrzebuje host (GitHub, GitLab, Azure DevOps, Bitbucket). Bez `--yes` nic się nie dzieje: odpowiedź mówi, co zostałoby usunięte i utracone, a kod wyjścia to 3. Kod wyjścia 2, gdy wpis nie jest przepisaniem, 4, gdy coś blokuje lub obiekty pozostają. Przez MCP tylko z `[mcp] allow_history_purge = true`"
"rewrite purge --all" = "Każde przepisanie historii z historii cofania"
"rewrite purge --entries" = "Wpis przepisania historii z historii cofania (`undo --list`; powtarzalne). Domyślnie: najnowsze przepisanie, które nie zostało usunięte na stałe"
"rewrite purge --latest" = "Najnowsze przepisanie, które jeszcze nie zostało usunięte na stałe (domyślnie)"
"rewrite purge --yes" = "Wykonuje usunięcie. Bez tego nic się nie zmienia (kod wyjścia 3)"
"rewrite run --extract" = "Reguła ścieżek: zostawia tylko ten podkatalog, który staje się korzeniem; commity, które go nie dotykają, są pomijane, a merge'e upraszczane. Pytanie za każdym razem: podaj `--extract-mode`, inaczej kod wyjścia to 3 i nic nie jest podglądane. Wyodrębnianie działa przed pozostałymi flagami ścieżek"
"rewrite run --extract_mode" = "Jak kończy się `--extract`: `clone` (nowy lokalny klon w `--target`, oryginał nietknięty; każda lokalna gałąź i tag), `in-place` (historia tego repozytorium jest przepisywana, jeden wpis cofania) lub `submodule` (klon jak w `clone` i jeden nowy commit na bieżącej gałęzi zastępuje folder jego submodułem; ta historia zostaje)"
"rewrite run --into_subdir" = "Reguła ścieżek: przenosi całe repozytorium do tego podkatalogu w każdym commicie (do łączenia repozytoriów bez kolizji ścieżek)"
"rewrite run --move_paths" = "Reguła ścieżek `Z=DO`: zmienia nazwę pliku lub folderu w każdym commicie, te same bloby i drzewa pod nową ścieżką (można powtarzać, po kolei, po regułach zawartości). Commit, w którym `DO` już istnieje, nie jest zmieniany: podgląd zostaje odrzucony (kod wyjścia 2, `path_collision`) z listą commitów i ścieżek"
"rewrite run --target" = "Folder nowego repozytorium dla `--extract-mode clone` lub `submodule`: nie może istnieć (lub musi być pusty) i nie może leżeć wewnątrz tego repozytorium. Używane przez `rewrite run`; `rewrite apply` ma własne"
"rm-file --paths" = "Ścieżki względem repozytorium do usunięcia"
