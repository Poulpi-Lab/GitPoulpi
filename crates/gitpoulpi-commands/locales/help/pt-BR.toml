"flow start --fields" = "Valores para os tokens do padrão como `nome=valor` (`slug=login`, `version=1.2.0`, `issue=42`); uma palavra solta é o `slug`. `user` e `date` assumem por padrão você e hoje"
"flow start --from" = "Começa a partir desta branch, branch remota ou tag em vez do pai do tipo"
"flow start --no_hooks" = "Pula os hooks configurados sem perguntar"
"flow start --publish" = "Faz push da nova branch e define o upstream dela"
"flow start --run_hooks" = "Executa os hooks que o fluxo de trabalho configura para esta ação (comandos de shell do arquivo do fluxo de trabalho, mostrados com a saída deles). Nunca executa sem ser pedido; um terminal é consultado quando isto está ausente"
"flow start --type" = "O tipo de branch (`feature`, `hotfix`, `release`, ...): veja `flow config --show-effective`"
"flow start --yes" = "Executa o plano sem perguntar. Sem isto, um terminal é consultado e qualquer outro contexto imprime o plano e sai com o código 3"
"flow status" = "Cada branch do repositório classificada pelo fluxo de trabalho de branches: base ou tópico (com o tipo), pai e quantos commits ela tem à frente e atrás desse pai. Sem um arquivo de fluxo de trabalho, toda branch fica sem classificação; `flow detect` propõe um"
"flow sync" = "Atualiza uma branch com o pai dela (merge ou rebase, conforme a estratégia configurada da branch) e, com `--stack`, as branches construídas sobre ela, em ordem. Imprime o plano e precisa de `--yes`; código de saída 3 sem ele"
"flow sync --abort" = "Desiste da ação interrompida: aborta o merge ou rebase em andamento e volta para a branch em que ela começou. Os passos já concluídos permanecem (desfaça-os com `undo`)"
"flow sync --autostash" = "Faz stash das alterações locais que bloqueiam um checkout ou merge e as devolve depois, seja qual for o valor de `general.auto_stash`"
"flow sync --branch" = "A branch a atualizar. Por padrão, a que está em checkout"
"flow sync --continue_" = "Continua depois que o conflito foi resolvido: faz o commit do merge ou continua o rebase e depois executa os passos restantes. Depois de um hook com falha, executa esse passo de novo"
"flow sync --dry_run" = "Imprime o plano (cada passo, bloqueios, avisos) como JSON e não altera nada"
"flow sync --merge" = "Faz merge em vez de rebase"
"flow sync --no_hooks" = "Pula os hooks configurados sem perguntar"
"flow sync --rebase" = "Faz rebase em vez de merge"
"flow sync --run_hooks" = "Executa os hooks que o fluxo de trabalho configura para esta ação (comandos de shell do arquivo do fluxo de trabalho, mostrados com a saída deles). Nunca executa sem ser pedido; um terminal é consultado quando isto está ausente"
"flow sync --stack" = "Também atualiza as branches cujo pai é esta, recursivamente"
"flow sync --yes" = "Executa o plano sem perguntar. Sem isto, um terminal é consultado e qualquer outro contexto imprime o plano e sai com o código 3"
"flow templates" = "Os modelos de fluxo de trabalho embutidos (Git Flow, GitHub Flow, GitLab Flow, Trunk-based, Custom) com suas branches base e tipos de tópico"
"flow trust-hooks" = "Revisa e aprova os hooks de workflow que o repositório versiona (o `[hooks]` de `.gitpoulpi/workflow.toml`): comandos de shell que seriam executados na sua máquina. Sem `--hash`, só imprime `{hash, hooks, trusted}`; com o hash, lembra a aprovação, mas só quando o arquivo em disco ainda tem exatamente esse hash, de modo que o que você leu é o que fica aprovado. Um arquivo alterado pergunta de novo. Os hooks do seu próprio override nunca precisam disso. Só uma pessoa pode fazer isso: não existe ferramenta MCP para isso"
"flow trust-hooks --hash" = "O hash impresso por `flow trust-hooks` (ou por um `--run-hooks` recusado): aprova os hooks com esse hash"
alias = "O alias de comando (`gp` ou qualquer nome) que inicia o GitPoulpi a partir de um terminal: o equivalente por script de Configurações > Lançador"
"alias create" = "Faz `<name>` (por exemplo `gp`) iniciar o GitPoulpi: um link no Linux e no macOS, um arquivo `.cmd` no Windows, em uma pasta bin por usuário. Um arquivo que não é do GitPoulpi nunca é substituído. Coloque a pasta no PATH com `path add`"
"alias create --add" = "Cria a variante de adicionar (por exemplo `gpa`): ela executa `gitpoulpi --add`, que abre a pasta atual em uma nova aba do GitPoulpi que já está aberto"
"alias create --name" = "O nome do comando: só letras, dígitos, `-`, `_` e `.`"
"alias remove" = "Remove os aliases de comando que o GitPoulpi criou (todos, ou só `<name>`); um arquivo que não é do GitPoulpi nunca é tocado"
"alias remove --name" = "O alias a remover (padrão: todos os que o GitPoulpi criou)"
"alias status" = "Mostra os aliases de comando que o GitPoulpi criou (e o que cada um executa) e os nomes em `ui.command_alias` e `ui.command_alias_add`"
installation = "Qual instalação do GitPoulpi é esta e suas próprias configurações (cor, nome, aliases, ambiente). Várias instalações podem conviver na mesma máquina"
"installation show" = "Mostra qual instalação do GitPoulpi é esta (seu id, tipo, pasta e ambiente), se é a principal, suas próprias configurações e as outras instalações desta máquina"
"installation set" = "Define uma configuração própria desta instalação: `name`, `name_with_version`, `logo_color`, `command_alias`, `command_alias_add`, `folder_menu_submenu`, `env` ou `mcp_bind`. Um valor vazio limpa o campo. A cor e os aliases da instalação principal também são gravados nas chaves compartilhadas `ui.*` que as versões mais antigas leem"
"installation set --field" = "O campo a definir"
"installation set --value" = "O novo valor (vazio apaga)"
path = "Coloca o GitPoulpi no PATH do usuário, para novos terminais"
"path add" = "Coloca a pasta onde o GitPoulpi está e a pasta dos aliases no PATH do usuário, para novos terminais: um bloco marcado nos arquivos de inicialização do shell (Linux, macOS) ou o PATH do usuário no registro (Windows). Pastas que já estão no PATH ficam como estão"
"path remove" = "Remove exatamente o que `path add` colocou"
"path status" = "Mostra se a pasta onde o GitPoulpi está e a pasta dos aliases estão no PATH do usuário, e o que o GitPoulpi adicionou"
uninstall = "Remove o que o instalador e as Configurações criaram (aliases de comando, entradas do PATH, atalhos) e, em uma instalação de release, os arquivos do programa. Recusa em uma build que não seja uma instalação de release (sem o marcador `.gitpoulpi-dist` ao lado do executável). Sua configuração, suas sessões e seus repositórios nunca são tocados"
"uninstall --keep_files" = "Mantém os arquivos do programa no lugar (o desinstalador do Windows os exclui por conta própria, porque um executável em uso não pode)"
launch = "O que os atalhos do GitPoulpi executam: mostra a janela de um GitPoulpi que já está aberto (`ui.reuse_window`); caso contrário, inicia COMMAND (o terminal que executa o GitPoulpi). Não inicia nada, nem o daemon, quando consegue mostrar uma janela"
"launch --command" = "O comando a iniciar quando não há janela para mostrar, depois de `--`"
"launch --folder" = """Abre esta pasta: com `ui.reuse_window` ativado e uma janela aberta, o repositório que a contém vira uma aba da janela focada mais recentemente (sem perguntar nada); caso contrário, o GitPoulpi inicia no terminal escolhido, nessa pasta. É o que a entrada "Abrir no GitPoulpi" do gerenciador de arquivos executa"""
"launch --new_window" = "Inicia uma nova janela mesmo com uma já aberta"
"ai split-plan" = "Mostra um plano que a IA propõe para dividir um commit em vários commits, no JSON aceito por `split-commit --plan`. Não aplica nada: revise e passe para `split-commit`. Exige `ai.enabled = true`"
"ai split-plan --rev" = "O commit a dividir (qualquer revisão: um sha, `HEAD~2`, ...)"
"ai rewrite-script" = "Imprime um script Lua que a IA escreve para uma reescrita de histórico a partir da sua instrução (\"mover cada commit feito à noite para a manhã seguinte\"), com o resultado de `rewrite script check` sobre ele. Não executa nem altera nada: leia o script e depois use `rewrite script test` e `rewrite preview --script`. Envia só a sua instrução e, com `--sample N`, o autor, a data e o assunto de N commits (nunca o conteúdo dos arquivos). Requer `ai.enabled = true`"
"ai rewrite-script --instruction" = "O que o script deve fazer, com as suas palavras"
"ai rewrite-script --sample" = "Envia também o autor, a data e o assunto dos N commits mais recentes (no máximo 50), para o modelo ver como são os dados. Desligado por padrão: sem isso nenhum dado de commit sai da máquina"
"ai rewrite-rules" = "Imprime as regras e configurações que a IA propõe para reescrever o histórico a partir da sua descrição (\"trocar meu e-mail antigo a@b por c@d em todos os commits\", \"remover secrets.txt de todo o histórico\"), como a receita JSON que `rewrite preview --recipe-json` lê (salve o campo `recipe` em um arquivo para `--recipe`), além do que ficou de fora e por quê. Não gera prévia nem aplica nada: leia as regras e depois execute você mesmo `rewrite preview` e `rewrite apply`. Envia só a sua descrição e, com `--context`, a branch atual, os nomes de branches e tags e os autores dos 200 commits mais recentes (nunca o conteúdo dos arquivos). Requer `ai.enabled = true`"
"ai rewrite-rules --description" = "Como o histórico deve ser reescrito, com as suas palavras"
"ai rewrite-rules --context" = "Envia também os nomes de branches e tags e os autores dos 200 commits mais recentes (no máximo 100 nomes de branches e tags e 100 autores), para o modelo poder citá-los com exatidão. Desligado por padrão: sem isso, nada além da sua descrição sai da máquina"
"ai sequence-draft" = "Print the action sequence the AI drafts from your description (\"stage everything, write the message with the AI, commit and push\"), or, with `--edit <id>`, the changed version of an existing sequence: `{ sequence, toml, problems, notes, suggested_shortcut, shortcut_conflict, retried, context, applied: false }`. Every step is checked on its own against the step vocabulary: a step that is unknown, destructive, nested or has an impossible pause is left out and listed in `problems` (exit code 2). Saves and runs nothing: read the sequence, then save it yourself with `sequence add --file`. Sends only your description and, with `--edit`, that sequence; with `--context` also the remote names, the AI profile ids and the Open in labels. Needs `ai.enabled = true`"
"ai sequence-draft --description" = "What the sequence must do, or with `--edit` how to change it, in your own words"
"ai sequence-draft --edit" = "Change this sequence (its id, `sequence list`) instead of creating one: it is sent along, and the proposal keeps its id and scope"
"ai sequence-draft --context" = "Also send the remote names, the AI profile ids and the Open in labels so the model can name them exactly. Off by default: without it nothing but your description (and the sequence being edited) leaves the machine"
"ai worktree-name" = """Imprime o nome do worktree e o nome da branch que a IA propõe para uma tarefa (\"corrigir a falha quando a configuração está vazia\"): `{ name, worktree, branch }`, em que `worktree` é o nome que o diálogo Criar worktree preencheria (`worktree-<name>`) e `branch` segue a nomenclatura de branches do próprio repositório. Não cria nada: passe-os a `worktree add`. Envia só a sua descrição e os nomes das branches locais. Exige `ai.enabled = true`"""
"ai worktree-name --describe" = "A funcionalidade, o bug ou a tarefa, com as suas palavras"
"ai hosting-reply" = "Imprime um rascunho que a IA escreve para uma conversa em um host de código: um comentário, uma resposta em uma thread (`--reply-to`), um comentário em uma linha de código (`--path`), um resumo de revisão (`--review-summary`) ou a descrição de uma nova issue (`--issue-title`). A conversa é lida de `--conversation` (o JSON que `hosting issue comments --json` ou `hosting review conversation --json` imprime, então `hosting issue comments 7 --json | ai hosting-reply --conversation -` funciona) ou buscada por `--item`; a IA vê o item, a thread, os comentários recentes dentro de `ai.limits.hosting_reply_context_bytes` e a sua `--hint`. **Ela só redige: a resposta é `{ draft, posted: false, ... }` e nada é publicado, editado nem excluído**; publicar é um comando à parte que você executa por conta própria. O prompt base é `ai.hosting_reply.base_prompt` (edite-o em Configurações > IA). Exige `ai.enabled = true`"
"ai hosting-reply --conversation" = "A conversa em JSON, como um comando de conversa de `hosting` a imprime: um arquivo, `-` para a entrada padrão, ou o próprio JSON. Não vale para `--issue-title`"
"ai hosting-reply --draft" = "Seu próprio texto a melhorar, em vez de escrever um novo"
"ai hosting-reply --flavor" = "A marcação que o host aceita: `gfm`, `gitlab_md`, `gitea_md`, `common_mark`, `azure_md`, `bitbucket_md`, `html`, `jira_wiki`, `textile`, `youtrack_md`, `trello_md`, `plain_text`, `obsidian_md`. Padrão: a do próprio item"
"ai hosting-reply --hint" = "O que você quer nesta resposta (\"diga que vou ver isso amanhã\")"
"ai hosting-reply --issue_title" = "Redige a descrição de uma nova issue com este título (sem conversa)"
"ai hosting-reply --item" = "A issue ou o pull request a responder, lido do próprio host na origem vinculada do repositório (`7` ou `#7` uma issue, `!7` um pull request): a mesma conversa que `hosting issue comments 7 --json` imprime, sem os eventos do sistema. No lugar de `--conversation`"
"ai hosting-reply --line" = "Com `--path`: a linha"
"ai hosting-reply --path" = "Redige um novo comentário de revisão neste arquivo do pull request"
"ai hosting-reply --read_repo" = "Deixa a IA ler o repositório neste rascunho (desligado, a menos que seja dado ou `ai.hosting_reply.read_repository` seja true). Um agente local o lê por conta própria, com ferramentas somente leitura, na pasta do repositório; um perfil de API recebe um contexto que o GitPoulpi monta (os arquivos que a conversa cita, resultados de busca, o mapa) dentro de `ai.limits.hosting_reply_*`. Nos dois casos a IA só redige; nada é publicado"
"ai hosting-reply --refresh_context" = "Esquece o contexto e a sessão do agente guardados de rascunhos anteriores deste repositório e o lê de novo (com `--read-repo`)"
"ai hosting-reply --continue_exchange" = 'Continua a troca do último `hosting-reply` para este mesmo alvo (mesmo `--item`, `--reply-to`, `--path`/`--line` ou `--issue-title`): as dicas e os rascunhos anteriores voltam ao modelo como turnos anteriores, então "deixe mais curto" funciona. Desnecessário para um agente Claude local cuja sessão é mantida (ele se lembra). Sem a flag, começa uma nova troca. Guardada na pasta de estado'
"ai hosting-reply --pr_base" = "Com `--read-repo`: a revisão base do pull request, para pôr o diff dele (contra a base da mesclagem) no contexto"
"ai hosting-reply --pr_head" = "Com `--read-repo`: a revisão de ponta (head) do pull request"
"ai hosting-reply --reply_to" = "Responde na thread com este id (uma thread de código, um comentário ou uma discussão)"
"ai hosting-reply --review_summary" = "Redige o resumo da revisão que está sendo enviada"
"split-commit" = "Divide um commit da branch atual em vários, do mais antigo ao mais novo, conforme um plano JSON (veja `split-source` para a numeração). O último commit novo mantém a árvore original, então descendentes e árvore de trabalho ficam inalterados; um commit já enviado exige depois um push forçado. Um `undo` desfaz tudo. Código de saída 2 se recusado"
"split-commit --commit" = "O commit a dividir (qualquer revisão: um sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Valida o plano e lista o que ficou sem atribuição; não altera nada"
"split-commit --plan" = "O plano (JSON), de um caminho de arquivo ou `-` para stdin. Uma peça é `path` mais um `hunk` opcional mais `lines` opcionais (índices nas `lines` do hunk); uma peça só com `path` é o arquivo inteiro"
"split-commit --rest_message" = "Coloca tudo o que o plano deixa sem atribuição em um último commit com esta mensagem"
"split-commit --sign" = "Assina os novos commits (e os descendentes reaplicados)"
"split-source" = "As alterações de um commit numeradas para `split-commit`: cada arquivo com seus hunks (`id`, linhas) ou, para arquivos que só podem ser atribuídos inteiros (binário, só modo, adicionado, excluído, submódulo, LFS), o motivo. Somente leitura"
"split-source --commit" = "O commit (qualquer revisão: um sha, `HEAD~2`, ...)"
"rewrite" = "Reescreve o histórico em lote (identidades, datas, mensagens) a partir de uma receita: `preview` monta o plano sem alterar nada, `apply` executa o plano que você revisou como UMA entrada de desfazer, `run` faz os dois para scripts. Só `push` envia alguma coisa: ele faz push forçado das refs reescritas, cada uma com um lease"
"rewrite apply" = "Aplica uma execução já visualizada: move as refs como UMA entrada de desfazer (`gitpoulpi undo` devolve tudo). Nunca faz push. Código de saída 2 quando recusado (o repositório mudou desde a prévia, digest incorreto, ...), 3 quando o plano move refs que estão em um remoto e falta `--yes`"
"rewrite apply --digest" = "O digest que `rewrite preview` imprimiu: o plano que você revisou"
"rewrite apply --run" = "O id da execução que `rewrite preview` imprimiu"
"rewrite apply --yes" = "Confirma mover refs que já foram enviadas. Sem isso, um plano assim não altera nada e o código de saída é 3"
"rewrite diff" = "O que uma regra de conteúdo fez em um arquivo de um commit de uma execução visualizada: o arquivo antigo e o novo comparados. As linhas que uma regra de segredos remove ficam ocultas. Só leitura"
"rewrite diff --commit" = "O commit como ele é antes da reescrita (um id das linhas)"
"rewrite diff --path" = "O arquivo, relativo à raiz do repositório"
"rewrite diff --run" = "O id da execução que `rewrite preview` imprimiu"
"rewrite discard" = "Descarta uma execução visualizada sem aplicá-la. Descartar duas vezes não causa problema"
"rewrite discard --run" = "O id da execução que `rewrite preview` imprimiu"
"rewrite preview" = "Monta o plano de uma reescrita de histórico sem alterar nada: contagens, as refs que se moveriam, avisos e as primeiras linhas. Guarda o plano no daemon como uma execução (`run`, `digest`) para `rewrite rows` e `rewrite apply`. A prévia também fica em disco, no diretório git do repositório, então `rewrite apply` funciona em um comando posterior, após reiniciar o daemon ou a partir de outra interface, sem iniciar um daemon; só `rewrite rows` precisa do daemon que fez a prévia (um em execução, ou use `--all` na prévia). Código de saída 2 quando a receita é recusada"
"rewrite preview --all" = "Imprime todos os commits alterados"
"rewrite preview --all_local" = "Reescreve todas as branches locais e tags em vez de só a branch atual"
"rewrite preview --committer" = "Quem consta como committer dos commits reescritos: `keep` (padrão) ou `me-now`"
"rewrite preview --include_protected" = "Reescreve também estas branches protegidas que já foram enviadas (excluídas por padrão; pode repetir)"
"rewrite preview --lfs_export" = "Regra de LFS: transforma de volta em arquivos reais, em cada commit, os ponteiros LFS que casam com este padrão glob (pode repetir). Os objetos precisam estar no armazenamento LFS local (faça antes `lfs fetch`); caso contrário é recusado, com a lista"
"rewrite preview --encoding_exclude" = "Com `--reencode`: arquivos que ele deixa como estão (padrões glob, pode repetir)"
"rewrite preview --encoding_fallback" = "Com `--reencode`: como é lido um arquivo sem marca e que não é UTF-8 quando a origem é detectada (padrão `windows-1252`)"
"rewrite preview --encoding_paths" = "Com `--reencode`: os arquivos que ele converte (padrões glob, pode repetir)"
"rewrite preview --eol" = "Regra de final de linha: todo arquivo de texto que casa com `--eol-paths` recebe este final (`lf` para Linux e macOS, `crlf` para Windows, `cr` para Mac clássico); finais mistos ficam uniformes e arquivos binários são ignorados"
"rewrite preview --eol_exclude" = "Com `--eol`: arquivos que ele deixa como estão (padrões glob, pode repetir)"
"rewrite preview --eol_follow_attributes" = "Com `--eol`: lê o `.gitattributes` da raiz de cada commit: arquivos `-text` e `binary` são ignorados, e arquivos `eol=lf` e `eol=crlf` mantêm o próprio final"
"rewrite preview --eol_paths" = "Com `--eol`: os arquivos que ele converte (padrões glob, pode repetir; um padrão sem barra casa em qualquer profundidade)"
"rewrite preview --reencode" = "Regra de codificação: os arquivos de texto que casam com `--encoding-paths` são convertidos para esta codificação (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). Arquivos binários, arquivos que a codificação de origem não consegue ler e caracteres que o destino não comporta ficam como estão e são contados"
"rewrite preview --reencode_from" = "Com `--reencode`: a codificação em que os arquivos estão. Omitida: detectada por arquivo (marca de ordem de bytes, UTF-8 válido, senão `--encoding-fallback`)"
"rewrite preview --strip_exec" = "Regra de modo de arquivo: o bit de execução (100755 vira 100644) sai dos arquivos que casam com estes padrões glob (pode repetir). O conteúdo não é tocado"
"rewrite preview --strip_exec_exclude" = "Com `--strip-exec`: arquivos que mantêm o bit de execução (padrões glob)"
"rewrite preview --lfs_import" = "Regra de LFS: move para o Git LFS, em cada commit, os arquivos que casam com este padrão glob (pode repetir; estilo `.gitattributes`: sem barra casa em qualquer profundidade). Requer git-lfs. O conteúdo vai para o armazenamento LFS local e o `.gitattributes` ganha a linha `filter=lfs`; envie os objetos depois"
"rewrite preview --lfs_min_size" = "Com `--lfs-import`: só os arquivos com pelo menos este número de bytes são movidos"
"rewrite preview --limit" = "Quantos commits alterados imprimir (padrão 50)"
"rewrite preview --match_email" = "Regra de identidade: casa com este e-mail de autor / committer"
"rewrite preview --match_name" = "Regra de identidade: casa com este nome de autor / committer"
"rewrite preview --prune_empty" = "Commits que uma regra de conteúdo deixa vazios: `auto` os descarta (padrão), `never` os mantém"
"rewrite preview --recipe" = "Um arquivo de receita (TOML ou JSON, o formato do painel de reescrita da TUI), ou `-` para JSON na entrada padrão"
"rewrite preview --recipe_json" = "Uma receita como string JSON (para quem não consegue gravar um arquivo)"
"rewrite preview --refs" = "Reescreve só estas branches locais ou tags (pode repetir)"
"rewrite preview --remove_blobs_over" = "Regra de conteúdo: remove de todos os commits cada arquivo maior que este número de bytes"
"rewrite preview --remove_findings" = "Regra de conteúdo: remove um segredo que `rewrite scan-secrets` encontrou, pelo id do achado (pode repetir), ou `all` para todos os achados do escopo. O daemon varre de novo e resolve os ids sozinho: o valor nunca chega à linha de comando, a uma receita ou a um log"
"rewrite preview --remove_paths" = "Regra de conteúdo: remove de todos os commits os arquivos e pastas que casam com este padrão glob (pode repetir; um padrão sem barra casa em qualquer profundidade)"
"rewrite preview --replace_content" = "Regra de conteúdo `PROCURAR=SUBSTITUIR`: troca um texto literal em todo arquivo de texto (pode repetir; arquivos binários são ignorados e contados). Para segredos, use uma regra `content_replace` na receita com `--secrets-file`"
"rewrite preview --replace_message" = "Regra de mensagem `PROCURAR=SUBSTITUIR` (texto literal, pode repetir)"
"rewrite preview --script_params" = "Um parâmetro de script `NOME=VALOR`, passado a cada `--script` (pode repetir). Os nomes são os declarados no cabeçalho do script"
"rewrite preview --scripts" = "Regra de script: executa este arquivo de script Lua em cada commit (pode repetir, em ordem, depois das regras das outras opções). O arquivo é lido aqui e embutido na receita; veja `rewrite script check` para o formato"
"rewrite preview --secrets_file" = "Um arquivo com um segredo por linha (linhas em branco são ignoradas). Os segredos entram nas regras `content_replace` da receita que procuram segredos, e assim nunca passam pela linha de comando, por uma receita salva nem por um log"
