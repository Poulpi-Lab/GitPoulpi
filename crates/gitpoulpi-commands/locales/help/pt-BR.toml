"workspace create --repos" = "Um repositório a incluir (repetível). Não é `--repo`: esse escolhe o repositório em que um comando roda"
"workspace delete" = "Exclui um espaço de trabalho. Os repositórios não são tocados"
"workspace list" = "Os espaços de trabalho, com seus repositórios e o perfil padrão"
"workspace remove" = "Retira repositórios de um espaço de trabalho. Nada muda no disco"
"workspace rename" = "Altera o nome de um espaço de trabalho; o id permanece"
"workspace set-profile" = "Define (ou, com `--none`, remove) o perfil com que os commits são feitos nos repositórios do espaço de trabalho"
