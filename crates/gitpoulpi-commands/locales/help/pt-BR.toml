index-lock = "Um `.git/index.lock` obsoleto, que faz toda escrita falhar: mostrá-lo ou removê-lo quando for antigo o bastante"
"index-lock remove" = "Exclui um `index.lock` obsoleto (deixado por um comando git que morreu). Recusado enquanto tiver menos de 10 s ou se não houver nenhum. Só o arquivo de bloqueio é removido; confirme que nenhum comando git está rodando"
"index-lock show" = "O `index.lock` do repositório (`null` se não houver): seu caminho, sua idade em segundos e se está obsoleto (mais de 10 s)"
"job" = "As tarefas em segundo plano do daemon: todo fetch, push, pull, clone e transferência LFS é uma desde o recebimento. `list` as mostra, `cancel` interrompe uma, `wait` espera uma terminar. Ctrl+C em um comando que iniciou uma tarefa a cancela"
"job list" = "As tarefas do daemon desta sessão, da mais antiga: em execução, na fila atrás de outra e as terminadas nos últimos 30 segundos"
"job cancel" = "Interrompe uma tarefa. Recusado (código de saída 1, nada muda) depois do ponto em que parar é seguro, por exemplo um pull que já começou a mesclar. Um push cancelado pode já ter chegado ao remoto"
"job cancel --id" = "O id da tarefa, de `job list`"
"job wait" = "Espera uma tarefa terminar e imprime seu estado final. Código de saída 0 se `Done`, 1 se falhou ou foi cancelada"
"job wait --id" = "O id da tarefa, de `job list`"
"job wait --timeout" = "Desiste após esse número de segundos (código de saída 1, a tarefa continua). Omitido: espera o quanto for preciso"
"undo-forget" = "Remove do diário de desfazer a entrada bloqueada do topo (operação interrompida, ou o repositório seguiu em frente) para poder desfazer as de baixo. Nunca toca no repositório, só no diário; a entrada não pode mais ser desfeita nem refeita. Código de saída 2 se a entrada do topo não está bloqueada, 3 sem `--yes`"
"undo-forget --dry_run" = "Mostra o que seria removido sem alterar nada"
"undo-forget --expect" = "Só esquece se ainda for a entrada do topo (seu id, como `undo --list` mostra); senão é recusado como obsoleto"
"undo-forget --redo" = "Esquece a entrada do topo de refazer em vez da de desfazer"
"undo-forget --yes" = "Confirma. Sem isso nada muda e o código de saída é 3"
"clone --sparse" = "Checkout parcial: extrai apenas estes diretórios (mais os arquivos da raiz); todo o histórico ainda é baixado"
sparse-checkout = "Checkout parcial (modo cone): mantém apenas alguns diretórios na árvore de trabalho de um repositório grande. `gitpoulpi clone --sparse` inicia um"
"sparse-checkout add" = "Mostra também estes diretórios, mantendo os já exibidos"
"sparse-checkout disable" = "Extrai todos os arquivos de novo (checkout completo)"
"sparse-checkout set" = "Mostra exatamente estes diretórios (mais os arquivos da raiz do repositório); todos os outros saem da árvore de trabalho. Ativa o checkout parcial se estiver desativado. O histórico não é alterado"
"sparse-checkout set --dirs" = "Diretórios relativos à raiz do repositório, p. ex. `src docs/guide`"
"sparse-checkout status" = "Informa se a árvore de trabalho é um checkout parcial e quais diretórios ela mostra: `{ \"enabled\", \"cone\", \"dirs\" }`"
"diff --from" = "Compara a partir desta revisão (extremidade mais antiga) em vez da árvore de trabalho contra o índice. Use junto com `--to`"
"diff --name_only" = "Lista apenas os arquivos alterados e o status deles, sem hunks"
"diff --to" = "A outra extremidade de `--from`: uma revisão, ou `worktree` (o padrão) para a árvore de trabalho, com alterações preparadas e não preparadas dos arquivos rastreados. Comparar a seleção do Log lista os mesmos arquivos"
"file-history" = "Os commits que alteraram um arquivo, do mais recente ao mais antigo, acompanhando renomeações (o caminho em cada commit, o tipo de mudança e a contagem de linhas)"
"file-history --at" = "Revisão de onde começar (padrão: HEAD)"
"file-history --limit" = "Entradas por página; `more` na resposta indica se existem mais antigas"
"file-history --skip" = "Entradas a pular (a página n é `--skip <n*limit> --limit <limit>`)"
"lost-commits" = "Commits que nenhuma branch, tag, remoto ou stash alcança: o que uma branch excluída deixou para trás (nomeado por um reflog, ou mantido apenas por um pin de desfazer) e, a menos que `--no-deep` seja usado, os commits soltos do banco de objetos. Do mais recente ao mais antigo. Crie uma branch em um deles para recuperá-lo"
"lost-commits --budget_ms" = "Para a busca depois deste número de milissegundos (0: sem limite); a resposta então indica `partial`"
"lost-commits --limit" = "Commits a listar"
"lost-commits --no_deep" = "Somente commits que um reflog ou um pin de desfazer ainda nomeia (rápido em qualquer tamanho)"
"lost-commits --skip" = "Commits a pular"
"reflog" = "Lista um reflog, do mais recente ao mais antigo: onde `HEAD` ou uma branch estava antes, com a data e o motivo do git, inclusive movimentos feitos em um shell. Uma branch excluída não tem mais reflog. Também escrito `reflog restore` para `reflog-restore`"
"reflog --limit" = "Entradas a listar"
"reflog --ref" = "`HEAD` (o padrão) ou uma branch (ou um nome de ref completo)"
"reflog --skip" = "Entradas a pular"
"reflog-restore" = "Move uma branch (ou `HEAD`) para uma posição do seu reflog. Uma branch que não está em checkout simplesmente se move. Para a branch em checkout a árvore de trabalho fica protegida: com alterações não commitadas ele recusa, a menos que `--mode` seja informado. Uma entrada do diário: `undo` a desfaz. Também escrito `gitpoulpi reflog restore`"
"reflog-restore --dry_run" = "Mostra o que aconteceria e não altera nada"
"reflog-restore --mode" = "Com alterações não commitadas: `keep` move e as mantém (recusando se uma estiver no caminho); `soft`, `mixed` e `hard` são os modos do reset"
"reflog-restore --oid" = "O commit para onde movê-la (o `new` de uma entrada do reflog)"
"reflog-restore --ref" = "`HEAD` ou uma branch"
"undo-restore" = "\"Restaurar só esta\": traz de volta o que uma operação anterior removeu (uma branch ou tag excluída, um stash descartado, um arquivo descartado ou excluído, um remoto removido, uma linha de ignore) sem desfazer as operações posteriores a ela. A restauração é uma nova entrada do diário, então `undo` a desfaz. Nada é sobrescrito: um arquivo que mudou desde então recebe a versão guardada ao lado, como `<nome>.restored`; um reset, amend ou rebase volta como uma nova branch na ponta antiga. Também escrito `gitpoulpi undo restore <id>`. Código de saída 2 quando não é possível (o JSON nomeia o motivo)"
"undo-restore --dry_run" = "Mostra o que aconteceria e não altera nada"
"undo-restore --id" = "A entrada a restaurar, como `undo --list` mostra o seu id"
"undo-restore --name" = "Restaura a branch ou tag com este nome (quando o nome antigo já está em uso, ou para a branch que um reset/amend/rebase restaura)"
"commit --workspace" = "Faz o commit com o perfil padrão deste espaço de trabalho (um id de espaço de trabalho; também `GITPOULPI_WORKSPACE`). Vale quando o repositório está no espaço de trabalho e este indica um perfil que existe; senão `general.active_profile`; senão a identidade da própria configuração git do repositório. Sem isso, usa-se esta última"
"search" = "Busca aproximada (fuzzy) nas branches, tags, worktrees, stashes e mensagens de commit do repositório atual, ou de todos os repositórios de um espaço de trabalho, mais as pull requests e issues em cache. Os resultados vêm do melhor para o pior, com os caracteres que coincidiram. Um prefixo restringe a busca: `b:` branches, `t:` tags, `c:` commits, `s:` stashes, `w:` worktrees, `pr:` pull requests, `i:` issues, `r:` repositórios (só em espaço de trabalho)"
"search --kinds" = "Somente estes tipos (repetível); o padrão é todos. Um prefixo na consulta restringe ainda mais"
"search --limit" = "No máximo este número de resultados"
"search --query" = "O que procurar, com o prefixo (`c: fix login`)"
"search --workspace" = "Busca em todos os repositórios deste espaço de trabalho (um id; também `GITPOULPI_WORKSPACE`). Sem ele, o repositório atual"
"workspace" = "Espaços de trabalho: grupos nomeados de repositórios, com um perfil de commit padrão opcional. Guardados em `workspaces.toml`, ao lado de `config.toml`, e compartilhados com a TUI"
"workspace add" = "Adiciona repositórios a um espaço de trabalho, registrando a URL `origin` de cada um"
