undo = "Desfaz a última operação registrada no diário (commit, amend, checkout, criação/exclusão de branch). Recusa, sem alterar nada, se algo que a operação tocou mudou desde então. Código de saída 2 quando recusado, 3 quando precisa de `--yes` (um undo arriscado)"
"undo --all" = "Com `--list`: inclui entradas que não podem mais ser refeitas"
"undo --dry_run" = "Mostra o que aconteceria e não altera nada"
"undo --expect" = "Só desfaz se esta ainda for a última entrada (seu id, como `--list` o mostra); caso contrário, recusado como stale"
"undo --list" = "Lista o diário em vez disso (o mais novo por último); `--all` acrescenta as entradas que não podem mais ser refeitas mas continuam fixadas"
"undo --yes" = "Prossegue quando o undo é arriscado (o commit já está em seu upstream, ou arquivos da árvore de trabalho seriam sobrescritos). Sem isso, tal undo não altera nada e sai com código 3"
worktree = "Worktrees vinculados: liste-as, adicione uma em uma branch ou em um commit"
"worktree add" = "Adiciona um worktree vinculado em `<path>`. Se `<start>` nomeia uma branch local, faz checkout dela ali (ou inicia `--branch` nela); qualquer outra revisão dá um HEAD desanexado (ou inicia `--branch` ali)"
"worktree add --branch" = "Cria esta nova branch em `<start>` e faz checkout dela ali"
"worktree add --start" = "Uma branch local, ou qualquer revisão"
"worktree list" = "Todo worktree do repositório, o principal primeiro"
"worktree changes" = "As alterações pendentes do worktree em `<path>` (rastreadas e não rastreadas, sem as ignoradas); uma lista vazia significa que ele está limpo"
"worktree remove" = "Remove o worktree vinculado em `<path>`. Um worktree com alterações pendentes é recusado, a menos que haja `--force` (elas se perdem), `--commit-message` (faz commit de todas as alterações na branch dele antes; um worktree desanexado também exige `--commit-branch`) ou `--stash-message` (faz stash de todas as alterações, inclusive as não rastreadas, antes; o stash é compartilhado por todos os worktrees). `--delete-branch` também exclui a branch dele (registrado no diário: desfazer traz a branch de volta; a pasta continua removida). A remoção em si não pode ser desfeita"
"worktree remove --commit_branch" = "A branch a criar para esse commit quando o worktree está desanexado"
"worktree remove --commit_message" = "Faz commit de todas as alterações com esta mensagem antes de remover"
"worktree remove --delete_branch" = "Exclui também a branch do worktree depois de removê-la"
"worktree remove --force" = "Remove mesmo com alterações pendentes; elas se perdem"
"worktree remove --stash_message" = "Faz stash de todas as alterações com esta mensagem antes de remover"
_usage = "Uso:"
