"rebase --autosquash" = "Reordena antes os passos de `--plan` com o algoritmo de `git rebase --autosquash`; sem `--plan`, executa um simples `git rebase -i --autosquash`"
"rebase --autostash" = 'Faz stash das alterações locais que impedem a operação, executa-a e depois aplica o stash (o que `general.auto_stash = "always"` faz)'
"rebase --continue_" = "Retoma um rebase interrompido por um conflito ou por um passo `edit`"
