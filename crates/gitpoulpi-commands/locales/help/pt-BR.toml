ai = "Auxiliares de IA (desativados, a menos que `ai.enabled = true`): imprimem uma mensagem de commit gerada ou explicam um commit ou as alterações de trabalho"
"ai --print_sent" = "Imprime o que seria enviado ao modelo (o texto de sistema e de usuário depois que os segredos são ocultados e os arquivos sensíveis são deixados de fora) e não envia nada. Exige `ai.enabled = true`, mas nenhuma chave e nenhuma rede"
"ai --send_all" = "Envia cada entrada inteira, mesmo acima do limite `ai.limits.*` dela. Sem isso, uma entrada acima do limite é truncada (um conflito é recusado) e a resposta diz o que foi cortado em `truncated: [{part, detail?, bytes, limit, setting}]`"
"commit --send_all" = "Com `--ai`: envia o diff inteiro mesmo acima de `ai.limits.diff_bytes`. Sem isso, um diff maior é truncado e a resposta avisa (`truncated`)"
"hosting review suggest --send_all" = "Envia cada entrada inteira, mesmo acima do limite `ai.limits.*` dela (o diff, o diff de um arquivo, a descrição, os comentários existentes, os arquivos de contexto). Sem isso, uma entrada acima do limite é truncada e a resposta diz o que foi cortado em `truncated`"
"stash push --send_all" = "Com `--ai`: envia o diff inteiro mesmo acima de `ai.limits.diff_bytes`. Sem isso, um diff maior é truncado e a resposta avisa (`truncated`)"
"ai commit-message" = "Imprime a mensagem de commit que a IA propõe para as alterações preparadas (ou para todas as alterações, se nada estiver preparado). Não faz commit de nada"
"ai explain" = "Explica um commit (padrão HEAD) ou, com --wip, as alterações de trabalho"
"ai resolve-conflict" = "Imprime a resolução que a IA sugere para UM conflito de merge de um arquivo em conflito (`--conflict N`, a partir de 1; opcional quando o arquivo tem um único conflito). Apenas imprime: nada é gravado nem preparado, então quem chamou decide (`conflicts resolve --content-file` aplica um resultado de arquivo inteiro). Requer `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Qual conflito do arquivo, a partir de 1"
"ai resolve-conflict --path" = "O arquivo em conflito, relativo à raiz do repositório"
autostash = "O auto-stash pendente: o GitPoulpi guardou alterações locais para executar um checkout, merge, rebase ou pull e ainda não as devolveu"
"ai review-context" = "Mostra ou define o que um rascunho de revisão de código ✦ recebe além do diff (`[ai.review]`): o CLAUDE.md e o AGENTS.md do repositório, mais um arquivo (um caminho ou um link) e se um agente local roda no repositório. Sem `--repo` nem `--project`, é o padrão global; `--repo PATH` é o valor próprio de um repositório clonado, `--project HOST/PROJECT` o de um repositório que não está clonado. Sem flag de definição, imprime os valores (`effective` é o que uma revisão recebe); com uma, salva e imprime o resultado. Não precisa de modelo e funciona com a IA desativada"
"ai review-context --agents_md" = "Entrega ao modelo o AGENTS.md do repositório"
"ai review-context --claude_md" = "Entrega ao modelo o CLAUDE.md do repositório"
"ai review-context --context_file" = "Mais um arquivo: um caminho relativo à raiz do repositório, um caminho absoluto ou um link para um arquivo de um host de código"
"ai review-context --no_context_file" = "Nenhum arquivo extra"
"ai review-context --no_extra_file" = "Nenhum arquivo extra para o repositório ou projeto, seja qual for o valor global (`on`, o padrão quando dado sozinho); `off` volta a seguir o valor global"
"ai review-context --project" = "Um repositório que não está clonado, como `HOST/PROJECT` (`github.com/owner/name`)"
"ai review-context --reset" = "Com `--repo` ou `--project`: esquece os valores próprios do repositório (ele volta a seguir os globais) antes de aplicar as flags"
"ai review-context --run_in_repo" = "Roda um agente local no repositório (`yes`), não roda (`no`) ou conforme o perfil de IA (`profile`). Não vale para `--project`"
"autostash start-over" = "Recomeçar: descarta as alterações da árvore de trabalho nos arquivos do stash (uma cópia fica em `refs/gitpoulpi-backup/`), desfaz a operação que fez o auto-stash (pull, checkout, merge, rebase) e depois faz o pop do stash no commit original. Para com o stash intacto se algum passo falhar. Código de saída 1 se recusado, 3 quando é preciso `--yes`"
"autostash start-over --dry_run" = "Mostra o que aconteceria e não altera nada"
"autostash start-over --yes" = "Prossegue; sem isso nada muda e o código de saída é 3"
blame = "Autoria linha a linha de um arquivo em uma revisão"
"blame --at" = "Revisão a analisar (padrão: HEAD)"
"branch delete-remote" = "Exclui uma branch de um remoto, mantendo qualquer branch local com esse nome"
"branch fast-forward" = "Avança `<branch>` até `<target>`, somente se for um fast-forward (histórico divergente é recusado, nada se move). A branch em checkout leva a árvore de trabalho junto, como `git merge --ff-only`; em qualquer outra branch apenas a ref é movida"
"branch fast-forward --target" = "Qualquer revisão (padrão: HEAD)"
"branch set-upstream" = "Faz `<branch>` acompanhar `<upstream>` (`origin/main`)"
"branch track" = "Cria uma branch local que acompanha uma branch de rastreamento remoto e faz checkout dela. `<upstream>` é escrito como a listagem de refs o escreve (`origin/feature/login`); `--name` usa por padrão a parte da branch"
"branch unset-upstream" = "Remove o upstream de `<branch>`"
"checkout --autostash" = 'Faz stash das alterações locais que impedem a operação, executa-a e depois aplica o stash (o que `general.auto_stash = "always"` faz)'
"cherry-pick --commits" = "Commits a aplicar, em ordem. Omitido quando `--plan` é informado"
"cherry-pick --plan" = "Um `Vec<RebaseStep>` JSON (mesmo formato de `rebase --plan`; veja `rebase-plan`), de um caminho de arquivo ou `-` para stdin: os passos são aplicados com cherry-pick na ordem da lista. Aqui só fazem sentido as ações `Pick` e `Drop` (`Drop` pula o commit); qualquer outra ação é recusada. Não pode ser combinado com commits posicionais"
"clone --branch" = "Faz checkout desta branch em vez do HEAD padrão do remoto"
"clone --depth" = "Trunca o histórico para este número de commits (`git clone --depth`)"
"clone --no_lfs" = "Deixa os arquivos Git LFS como ponteiros em vez de baixar o conteúdo deles após o clone"
"clone --origin" = "Dá ao novo remoto um nome diferente de `origin`"
"clone --recurse_submodules" = "Clona os submódulos também"
"commit --ai" = "Deixa a IA escrever a mensagem a partir do diff preparado, usando as instruções de mensagem de commit do repositório (Configurações > IA). Requer `ai.enabled = true` e um perfil configurado"
"commit --message" = "A mensagem do commit. Obrigatória, a menos que --ai a escreva"
"commit --no_verify" = "Ignora os hooks de commit (`pre-commit`, `commit-msg`), como `commit --no-verify`"
completions = "Imprime um script de autocompletar do shell na saída padrão (bash, zsh, fish, powershell ou elvish), p. ex. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Aborta a operação em andamento: HEAD, índice e árvore de trabalho voltam ao estado anterior a ela. Descarta as resoluções feitas desde então"
"conflicts skip" = "Pula o cherry-pick ou o revert em andamento (ou o commit em que um rebase parou): HEAD, índice e árvore de trabalho voltam ao HEAD. A saída quando ficou vazio (a mudança já está aplicada). Um merge não tem nada para pular"
"conflicts check" = "Um merge de HEAD na branch de onde ela partiu daria conflito, e em quais arquivos? Nada é alterado (um merge em memória). A base é o destino do pull request conhecido da branch; na falta dele, a branch permitida pelos padrões de Branches base com menos commits desde a bifurcação. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Desativado quando `general.conflict_detection` ou a chave do repositório está desligada"
"conflicts list" = "Os arquivos em conflito, cada um com o texto de seus três lados. Com `--names-only`: apenas o caminho, o tipo de conflito e os oids dos estágios (nenhum blob é lido; barato em um merge grande)"
"conflicts resolve" = 'Resolve um arquivo e o prepara (o arquivo deixa de estar em conflito). Exatamente um entre `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` ou `--delete`. A e "ours" são o lado atual (`HEAD`; durante um rebase, a branch sobre a qual se faz o rebase), B e "theirs" o lado recebido. Nunca edite marcadores de conflito à mão: escolha, ou escreva o texto final em um arquivo'
"conflicts resolve --both" = "Mantém os dois lados de cada conflito (A depois B), e o merge do próprio git em todo o resto"
"conflicts resolve --content_file" = "O texto final do arquivo, exatamente (`-` lê a entrada padrão)"
"conflicts resolve --delete" = "Aceita a exclusão: remove o arquivo (`git rm`)"
"conflicts resolve --encoding" = "Com `--content-file`: grava o texto nesta codificação (um rótulo WHATWG como `windows-1252`) em vez de UTF-8"
"conflicts resolve --expect" = "Os oids dos estágios sobre os quais a decisão foi tomada, `base,ours,theirs` (use `-` para um estágio ausente). A chamada é recusada como `stale` quando o índice não contém mais exatamente estes. `--both` e `--pick` sempre verificam os estágios que leem"
"conflicts resolve --no_stage" = "Grava o arquivo da árvore de trabalho mas o deixa em conflito (um simples salvar)"
"conflicts resolve --ours" = "Igual a `--side ours`"
"conflicts resolve --pick" = "Uma escolha por número de conflito: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = ambos nessa ordem). Todo conflito precisa de uma, a menos que `--default` cubra o resto"
"conflicts resolve --pick_default" = "Com `--pick`: a escolha para todo conflito não listado"
"conflicts resolve --side" = "Pega o arquivo inteiro de um estágio, sem merge automático"
"conflicts resolve --theirs" = "Igual a `--side theirs`"
"conflicts resolve --theirs_first" = "Com `--both`: B depois A"
"conflicts show" = "Um arquivo em conflito como o editor de merge o vê: os rótulos dos painéis, os três lados e as regiões de conflito numeradas (`--json` é o documento completo). As regiões mescladas que o git resolveu sozinho não são listadas; elas ficam no resultado de `resolve --both`/`--pick`"
"conflicts show --conflict" = "Apenas o conflito N (a partir de 1)"
"conflicts state" = "O merge, rebase, cherry-pick ou revert em andamento (`null` quando não há nenhum)"
"conflicts unresolve" = "Devolve ao estado de conflito (com marcadores novamente) um arquivo resolvido durante esta operação. Recusado quando ele ainda está em conflito ou não foi resolvido enquanto a operação rodava"
daemon = '`gitpoulpi server ...` é um alias visível - o dono chama este grupo de "o servidor" e digita `gp server stop`'
"daemon restart" = "`daemon stop` seguido de `daemon start`"
"daemon run" = "Executa o daemon desta sessão em primeiro plano (bloqueia; Ctrl-C para parar, ou um `daemon stop`/`daemon restart` enviado de outro lugar). É o que `daemon start` inicia em segundo plano, e o que um terminal dedicado também pode executar diretamente"
"daemon start" = "Inicia o daemon desta sessão como um processo em segundo plano desvinculado (ou informa que já está em execução). `--backend` fixa o backend que o processo iniciado deve usar; se omitido, o processo iniciado resolve `general.default_backend` por conta própria"
"daemon status" = "Se o daemon desta sessão está escutando e, em caso afirmativo, sua porta, PID, tempo de atividade, backend e versão do build"
"daemon stop" = "Pede ao daemon desta sessão que encerre normalmente, recorrendo a matar o PID registrado só se ele não responder a tempo e só se for um daemon independente (nunca um embutido em um TUI em execução)"
"daemon stop --all" = "Para o daemon de todas as sessões para as quais `session list` informa um arquivo de porta, não apenas desta"
discard = "Descarta as alterações *não preparadas* de um arquivo na árvore de trabalho: um hunk (`--hunk`), algumas de suas linhas (`--hunk --lines`) ou - com `--file` sozinho - toda alteração não commitada do arquivo, inclusive as preparadas (um arquivo não rastreado é excluído). Hunks e linhas são numerados como `gitpoulpi diff --json` numera o diff não preparado. Tudo o que é descartado fica guardado em um snapshot de segurança, então `gitpoulpi undo` o traz de volta (inclusive arquivos não rastreados). Sem confirmação: esta é a superfície de scripts"
"discard --lines" = "Índices de linhas separados por vírgula dentro de `--hunk`"
"fetch --all" = "Faz fetch de todos os remotos configurados"
"fetch --prune" = "Remove branches de rastreamento remoto que o remoto não tem mais"
"fetch --prune_tags" = "Exclui também as tags locais que o remoto excluiu (só as que estavam nele: uma tag nunca enviada é preservada). É o `fetch.pruneTags` do Git, mais restrito; desativado a menos que seja pedido"
"fetch --remote" = "Omitido: o remoto padrão do repositório (veja `remote default`)"
gitpoulpi = "Cliente Git TUI leve e multiplataforma, automatizável via CLI/MCP."
"gitpoulpi --add" = "Abre uma pasta em uma nova aba do GitPoulpi que já está aberto, em vez de iniciar outro (`gp -a`, `gp --add ../outra`). PATH é, por padrão, o diretório atual e se resolve para o repositório que o contém. Uma sessão aberta: ela recebe a aba e sua janela vem para a frente se a área de trabalho permitir. Várias: você escolhe uma em uma lista numerada (ou passa `--session NOME`). Nenhuma: o GitPoulpi inicia normalmente, nessa pasta. Não aceita subcomando; com `--json` imprime um objeto (`action` é `joined` ou `cancelled`), código de saída 0 quando a aba está aberta, 3 quando uma janela ocupada a ofereceu no chip da linha de status"
"gitpoulpi --no_raise" = "Com `--add`: não pede à janela que traga seu terminal para a frente"
"gitpoulpi --backend" = "Em qual `GitBackend` o daemon deste comando roda, sobrepondo `general.default_backend` no config.toml e `GITPOULPI_GENERAL_DEFAULT_BACKEND` (as flags ficam no topo da escada de precedência - veja docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
Em qual `GitBackend` o daemon deste comando roda, sobrepondo `general.default_backend` no config.toml e `GITPOULPI_GENERAL_DEFAULT_BACKEND` (as flags ficam no topo da escada de precedência - veja docs/user/config-reference.md).

Ela escolhe o backend de um daemon que este comando *inicia*. Uma sessão cujo daemon já está em execução mantém o backend com que esse daemon foi criado; `gitpoulpi` não tem como trocar o backend de um daemon ativo debaixo dos clientes já inscritos nele, e fingir o contrário seria o mesmo não-fazer-nada silencioso que esta flag existe para evitar."""
"gitpoulpi --cwd_file" = """Arquivo no qual o TUI grava a pasta da aba ativa ao sair ("Sair e fazer cd aqui", ou sempre com `ui.tab_dir_follow = "auto"`). Destinado ao wrapper que `gitpoulpi shell-init` imprime; ignorado por todos os subcomandos, já que só o TUI tem abas"""
"gitpoulpi --json" = "Emite JSON estruturado em vez de saída legível por humanos"
"gitpoulpi --lang" = "Idioma do texto de `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
Idioma do texto de `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Só as explicações são traduzidas - nomes de comandos e flags nunca mudam - e `--help` continua em inglês a menos que isto seja informado (o ambiente é deliberadamente ignorado, para que scripts tenham saída estável). Exemplo: `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Repositório no qual agir. Por padrão, o repositório que contém o diretório atual, então `gitpoulpi status` se comporta como `git status`; um agente que controla vários repositórios passa isto em vez de usar chdir"
"gitpoulpi --session" = "Sessão nomeada a usar. Se omitida, é derivada da raiz do repositório atual (veja `gitpoulpi_config::default_session_name`), de modo que dois repositórios têm dois daemons independentes enquanto tudo o que é aberto dentro de um repositório compartilha um só. Informe-a para forçar dois repositórios em uma sessão, ou para nomear uma sessão explicitamente. O valor é sanitizado antes do uso - ele vira um nome de arquivo"
"hosting checkout-pr" = "Faz checkout de um pull/merge request, inclusive de um fork: busca seu head (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) na branch local `pr/<n>` (`mr/<n>` no GitLab), acompanhando-o, e muda para ela"
"hosting checkout-pr --id" = "Qual integração (veja `hosting prs`)"
"hosting checkout-pr --no_checkout" = "Apenas busca e cria/atualiza a branch; permanece onde está"
"hosting checkout-pr --number" = "O número do PR (GitHub) ou o `iid` do MR (GitLab)"
"hosting checkout-pr --remote" = "O remoto onde o request existe. Por padrão, aquele de onde o projeto foi resolvido; senão, o padrão do repositório"
"hosting clone" = "Clona um projeto de `projects` pelo seu caminho completo, resolvendo a URL de clone pelo host em vez de fazer o usuário colar uma"
"hosting clone --https" = "Clona por HTTPS em vez de SSH"
"hosting clone --project" = "O caminho completo do projeto, como `hosting projects` o imprime"
"hosting edit-url" = "Imprime a URL onde um pull/merge request é editado (a visão `.../edit` do GitLab; o GitHub edita na própria página do request). Com um número, esse request; caso contrário, o de `--branch` (padrão: a branch em checkout). Segue o vínculo do repositório com o pull/merge request como `prs`. Só abre o navegador com `--open`"
"hosting edit-url --branch" = "Encontra o request pela sua branch de origem"
"hosting edit-url --number" = "O número do request (`53` para `!53` / `#53`)"
"hosting edit-url --open" = "Também abre a URL no navegador do sistema"
"hosting file" = "Lê um arquivo de um projeto em uma revisão pela API do host, sem clone: texto como está, outros bytes em base64 (`encoding`). Sai com código 1 e um erro quando o arquivo não existe nessa revisão"
"hosting file --id" = "Qual integração (veja `hosting list`); opcional quando só há uma configurada"
"hosting file --path" = "O caminho dentro do projeto, como `CLAUDE.md` ou `src/main.rs`"
"hosting file --project" = "O projeto: `owner/name` no GitHub, `group/sub/project` no GitLab"
"hosting file --rev" = "A revisão: uma branch, tag ou commit. Por padrão, a branch padrão do projeto"
"hosting integrations" = "Gerencia os perfis de integração configurados (`[[integrations]]`)"
"hosting integrations add" = "Adiciona um perfil de qualquer tipo que tenha um cliente"
"hosting integrations add --id" = "Por padrão, o nome do tipo (`gitlab`, `gitlab-2`, ...)"
"hosting integrations add --kind" = "`github`, `github_enterprise`, `gitlab`, `gitlab_self_managed`, `azure_devops`, `azure_devops_server`, `bitbucket`, `jira_cloud`, `jira_data_center`, `trello`, `gitea`, `forgejo`, `linear`, `youtrack`, `redmine`, `gerrit` ou `local_markdown`"
"hosting integrations add --name" = "Nome de exibição"
"hosting integrations add --url" = "A raiz web da instância. Obrigatória para os tipos auto-hospedados e o Jira"
"hosting integrations list" = "Os perfis configurados, sem seus tokens"
"hosting integrations radar" = "Mostra ou altera as configurações do Radar de um perfil (`[integrations.radar]`): quais listas de toda a conta o `hosting radar` e a busca do Radar trazem, os namespaces a pesquisar e o que faz a revisão de uma solicitação que não está clonada. Sem opções, só imprime as configurações atuais"
"hosting integrations radar --assigned_issues" = "Issues abertas atribuídas a você, em todos os repositórios"
"hosting integrations radar --clear_namespaces" = "Esquece os namespaces salvos: o seu e todos aos quais você pertence"
"hosting integrations radar --id" = "O perfil"
"hosting integrations radar --include_drafts" = "Mantém as solicitações em rascunho nas listas da conta"
"hosting integrations radar --namespaces" = "Um namespace (org, grupo) onde pesquisar solicitações abertas; repita a flag ou separe por vírgulas. Substitui a lista salva"
"hosting integrations radar --open_requests" = "Todas as solicitações abertas dos seus namespaces"
"hosting integrations radar --review_mode" = "O que faz revisar uma solicitação que não está clonada"
"hosting integrations radar --review_requests" = "Solicitações que aguardam sua revisão, em todos os repositórios"
"hosting integrations remove" = "Remove um perfil e exclui o token armazenado dele"
"hosting integrations test" = "Verifica o token do perfil no seu host: usuário, escopos, validade"
"hosting issue" = "Cria issues no projeto vinculado ao repositório atual"
"hosting issue create" = "Abre uma issue no projeto ao qual a fonte ISSUES do repositório está vinculada (`hosting link issues`), ou no que `--id` resolve a partir do remoto. Ação externa: publica no host"
"hosting issue create --body" = "A descrição da issue"
"hosting issue create --body_file" = "Lê a descrição deste arquivo (`-` lê stdin)"
"hosting issue create --id" = "Qual integração (veja `hosting issues`)"
"hosting issue create --labels" = "Um rótulo a aplicar; repita a flag ou separe por vírgulas"
"hosting issue create --title" = "O título da issue"
"hosting issue create --web" = "Imprime a página de nova issue pré-preenchida do host em vez de chamar a API (não exige token)"
"hosting issues" = "Issues do projeto do repositório atual"
"hosting issues --assigned" = "Somente as atribuídas a você"
"hosting board --id" = "Qual integração (veja `hosting issues`)"
"hosting board move --column" = "O nome da coluna, como `hosting board` o imprime"
"hosting board move --id" = "Qual integração (veja `hosting issues`)"
"hosting board move --reference" = "O cartão: o número dele ou a referência própria (`12`, `#12`, `ABC-12`, `AB#12`)"
"hosting board move" = "Move um cartão para uma coluna: uma mudança de status, uma transição de fluxo de trabalho (Jira), um estado de work item (Azure DevOps), uma lista (Trello) ou a troca de um rótulo (GitHub, GitLab, Gitea, Forgejo). Um movimento para o qual o provedor não tem caminho é recusado com o motivo. Ação externa: grava no host"
"hosting board show --id" = "Qual integração (veja `hosting issues`)"
"hosting board show" = "As colunas do quadro, cada uma com seus cartões. Somente leitura"
"hosting board" = "O quadro de issues do projeto vinculado ao repositório atual: as colunas com seus cartões, as mesmas colunas do quadro da TUI (um status, uma lista ou um rótulo por coluna). Sem subcomando, o mesmo que `board show`"
"hosting link" = "Vincula a lista de pull/merge requests ou a lista de issues deste repositório a um perfil de provedor e a um de seus repositórios, ou desvincula (sem nenhuma flag, mostra o vínculo). Nada é buscado por `prs` / `issues` até que uma fonte seja vinculada; é o mesmo vínculo que as seções da barra lateral do TUI salvam (`pulls_source` / `issues_source` em `.gitpoulpi/repo-state.toml`)"
"hosting link --clear" = "Desvincula a lista: nada é buscado até que seja vinculada de novo"
"hosting link --id" = "O perfil a vincular. Sem `--project`, usa-se o repositório que os remotos dele nomeiam no host desse perfil"
"hosting link --kind" = "Qual lista"
"hosting link --project" = "O repositório do provedor (`owner/name`, `group/sub/proj`)"
"hosting list" = "As integrações configuradas, sem seus tokens"
"hosting login" = "Valida um token e o armazena sob o `token_ref` do perfil, guardando em cache a quem ele pertence. O token é lido de stdin (`--token-stdin`), nunca de um argumento, para ficar fora do histórico do shell. Não exposto via MCP: um segredo não deve passar pela transcrição de chamadas de ferramenta de um agente"
"hosting login --id" = "Qual integração. Opcional quando só há uma configurada"
"hosting login --token_stdin" = "Lê o token de stdin (obrigatório; uma linha, quebra de linha final ignorada)"
