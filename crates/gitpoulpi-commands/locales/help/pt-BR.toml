"hosting review" = "Revisa um pull/merge request no próprio lugar (GitHub, GitLab, Gitea, Forgejo): lê-lo, ver suas threads e seus arquivos, comentar, responder, resolver, enviar uma revisão e buscar seu head para o diff. Os mesmos comandos para uma pessoa, um script e um agente de IA"
