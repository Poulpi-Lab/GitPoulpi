"hosting review resolve --unresolve" = "Reabre a thread em vez disso"
"hosting review show" = "Lê um pull/merge request para revisão: descrição, commits de head e de base, estado do merge, verificações, o que o host permite fazer numa revisão (`capabilities`) e seus arquivos alterados. O diff em si vem do repositório (`review fetch`, depois diff de `refs/gitpoulpi/pr/<n>`)"
