"hosting review resolve" = "Resolve uma thread de revisão, ou a reabre com `--unresolve`"
"hosting review resolve --id" = "Qual integração (veja `hosting prs`)"
"hosting review resolve --number" = "O número do PR (GitHub) ou o `iid` do MR (GitLab)"
