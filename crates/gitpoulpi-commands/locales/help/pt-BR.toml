"rewrite script check#long" = """
Compila um script Lua e imprime seu cabeçalho (nome, janela, parâmetros), as funções que ele define e todos os problemas. Código de saída 2 quando há problemas. Só leitura; nada é executado em um commit.

Para um script de shell, Python ou Lua externo (sem isolamento), diz também se o interpretador foi encontrado e se o script é confiável e, para um script confiável, faz um handshake de teste: inicia o script uma vez com um commit inventado (`"dry_run": true`) e confere a resposta. Um script em que não se confia nunca é iniciado.
"""
"rewrite script test --language" = "`lua`, `shell`, `python` ou `lua-external`; padrão pela extensão"
"rewrite script test --trust" = "Confia antes neste script (decisão de pessoa, recusada via MCP)"
