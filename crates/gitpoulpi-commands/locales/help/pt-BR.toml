"mailmap" = "O `.mailmap`: um nome e um e-mail canônicos para quem fez commits sob vários. O Log, o blame e o histórico de arquivo mostram os nomes mapeados (`log.use_mailmap`) sem tocar em nenhum commit. `list` conta as identidades do histórico e mostra quais estão mapeadas, `check` mostra como algumas identidades são resolvidas, `add` une identidades em uma só acrescentando linhas ao `.mailmap` (editado, não commitado; dá para desfazer)"
