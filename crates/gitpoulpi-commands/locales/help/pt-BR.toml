"repo-auth set --hosts" = "Com `helper` ou `token-command`: os hosts que ele pode atender (separados por vírgula ou repetidos)"
"repo-auth set --https" = "Identidade HTTPS: `system` (os auxiliares do próprio git), `integration:<id>` (o token de uma conta do GitPoulpi), `helper` (um auxiliar de credenciais, com `--helper`) ou `token-command` (um comando que imprime um token, com `--command` e `--hosts`)"
"repo-auth set --ignore_repo_helpers" = "Com `--https system`: descarta os auxiliares de credenciais que este repositório define para si e mantém os do sistema e os globais"
"repo-auth set --known_hosts" = "Com `--ssh key:` ou `integration-key:`: o arquivo `known_hosts`"
"repo-auth set --ssh" = "Identidade SSH: `system` (a configuração e o agente do próprio ssh), `key:<caminho>` (um arquivo de chave privada, oferecido sozinho) ou `integration-key:<id>` (a chave de uma conta do GitPoulpi)"
"repo-auth set --strict" = "Com `--ssh key:` ou `integration-key:`: recusa chaves de host desconhecidas (`StrictHostKeyChecking=yes`)"
"repo-auth set --username" = "Um nome de usuário: com `system`, `credential.username` (permite que um gerenciador de credenciais escolha uma de várias contas); com `integration:<id>`, o nome de usuário enviado com o token"
"repo-auth set --yes" = "Confirma um auxiliar ou comando de token sem a pergunta interativa (o comando e o seu hash continuam sendo impressos)"
"repo-auth show" = "Mostra com qual identidade este repositório se autentica: o perfil guardado, a identidade que cada remoto usará, as configurações que o perfil substitui e qualquer aviso. Nunca imprime um segredo; um auxiliar ou comando de token só é impresso para uma pessoa (um agente recebe `{set, sha256}`)"
"repo-auth test" = "Testa a conexão de cada remoto (ou de um) com o perfil aplicado, sem alterar nada: lista as branches do remoto ou, com `--push`, pergunta se um push seria aceito. Responde com o relatório de cada remoto mais a identidade usada. Acessa a rede"
"repo-auth test --push" = "Verifica também se um push seria aceito"
"repo-auth test --remote" = "Somente este remoto (padrão: todos os remotos)"
"apply-commit" = "Aplica só à árvore de trabalho as alterações feitas por um commit (mesmo um perdido): o índice e o HEAD ficam como estão. Tudo ou nada: se um arquivo não aplicar limpo, nada muda (`stash from-commit` guarda as alterações em um stash). Um commit de merge é recusado. `undo` desfaz"
"apply-commit --commit" = "O commit cujas alterações aplicar (qualquer revisão: um sha, `HEAD~2`, ...)"
"stash from-commit" = "Guarda as alterações feitas por um commit (mesmo um perdido) em um novo stash, sem tocar na árvore de trabalho. `undo` o descarta de novo"
"stash from-commit --commit" = "O commit cujas alterações guardar (qualquer revisão: um sha, `HEAD~2`, ...)"
"stash from-commit --message" = "A mensagem do stash; se omitida, uma que nomeia o commit"
"branch upstream" = "Os vários remotos de uma branch: o upstream primário mais destinos de push extras e fontes de pull opcionais, guardados em uma seção própria da configuração"
"branch upstream add" = "Adiciona `<remote>[:<dst>]` como destino de push extra (`<dst>` é o nome da branch nesse remoto, por padrão o mesmo nome). Pode ser desfeito"
"branch upstream add --branch" = "A branch (padrão: a atual)"
"branch upstream add --pull" = "Também o torna uma fonte de pull"
"branch upstream add --target" = "`<remote>` ou `<remote>:<dst>`"
"branch upstream list" = "O upstream primário da branch, seus destinos de push extras e fontes de pull, cada um com sua situação (à frente, atrás, relação) a partir das refs de rastreamento remoto como estão. Somente leitura, sem rede"
"branch upstream list --branch" = "A branch (padrão: a atual)"
"branch upstream primary" = "Define o upstream primário (`origin/main`): a mesma requisição de `branch set-upstream`"
"branch upstream primary --branch" = "A branch (padrão: a atual)"
"branch upstream pull" = "Ativa ou desativa `<remote>[:<dst>]` como fonte de pull: um pull simples passa a integrá-lo também"
"branch upstream pull --branch" = "A branch (padrão: a atual)"
"branch upstream pull --off" = "Deixa de fazer pull dele"
"branch upstream pull --on" = "Torna-o uma fonte de pull"
"branch upstream pull --target" = "`<remote>` ou `<remote>:<branch>`"
"branch upstream remove" = "Remove todo destino de push extra e fonte de pull que cite `<remote>`. O upstream primário é preservado (use `unset-upstream`). Pode ser desfeito"
"branch upstream remove --branch" = "A branch (padrão: a atual)"
"remote-group" = "Uma branch com vários remotos (destinos de push extras, fontes de pull): onde ela está em relação a cada um. Veja `branch upstream` para alterá-los"
"remote-group status" = "Onde a branch atual (ou `--branch`) está em relação a cada um de seus remotos: upstream primário, destinos de push extras, fontes de pull. Somente leitura, sem rede"
"remote-group status --branch" = "A branch (padrão: a atual)"
"pull --all_sources" = "Faz pull do upstream primário e de toda fonte de pull da branch (veja `branch upstream pull`), cada um com `--mode`. Planeja primeiro: qualquer coisa além de um fast-forward ou da integração do próprio modo pede `--resolve` (saída 3, nada alterado). Uma parada por conflitos sai com 4 e `stopped`; retome com `remote-group continue`"
"pull --branch" = "Com `--all-sources`: a branch (padrão: a atual)"
"pull --no_preflight" = "Com `--all-sources`: não consulta os remotos antes"
"pull --resolve" = "Com `--all-sources`: `REMOTE=ff|merge|rebase|skip` (repetível), a decisão para um remoto sobre o qual o plano perguntou"
"pull --all_branches" = "Faz pull de toda branch local que tem upstream: faz fetch dos remotos delas, avança em fast-forward as branches que só estão atrás (para elas nunca há merge nem rebase) e depois integra a branch atual como um pull normal, com `--mode` (padrão: o modo de pull configurado). Branches divergentes são puladas e informadas. Um conflito na branch atual deixa o estado de um pull com conflitos; as outras branches já estão atualizadas. Uma única entrada de desfazer cobre as branches movidas. Saída 4: uma branch ou um fetch falhou; 2: recusado (há um auto-stash pendente ou necessário)"
"pull --no_fetch" = "Com `--all-branches`: não faz fetch antes, usa as branches de rastreamento remoto como estão"
"pull --prune" = "Com `--all-branches`: durante o fetch, remove as branches de rastreamento remoto que o remoto não tem mais"
"pull --worktrees" = "Com `--all-branches`: o que fazer com uma branch atrasada que está em checkout em outro worktree: `skip` (padrão) só a informa, `update` avança a branch lá em fast-forward"
"push --all_targets" = "Faz push para o upstream primário e para todo destino de push extra da branch (veja `branch upstream add`). Planeja primeiro: quando todo remoto é um push simples ou já está em dia, executa; caso contrário responde `needs_resolution` (saída 3, nada alterado). Saída 4: algum remoto falhou ou um merge parou por conflitos (`stopped`)"
"push --no_preflight" = "Não consulta os remotos antes (usa as refs de rastreamento remoto)"
"push --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (repetível): a decisão para um remoto sobre o qual o plano perguntou"
"push --tags" = "Também faz push das tags ainda não enviadas para todo remoto que aceitou a branch"
"push --to" = "Faz push exatamente para estes remotos (`<remote>` ou `<remote>:<dst>`, repetível), somente neste push; a configuração não é alterada. Mesmo plano, `--resolve` e execução de `--all-targets`"
"push --yes" = "Confirma um force push escolhido com `--resolve REMOTE=force`. Sem isso, tal push não altera nada e sai com o código 3"
"remote-group abort" = "Descarta a execução em grupo salva: aborta o merge ou rebase que ela iniciou. Os pushes já feitos permanecem"
"remote-group abort --run" = "O id da execução salva, para ter certeza de que ainda é a pretendida"
"remote-group continue" = "Retoma a execução em grupo salva depois que seu merge ou rebase for concluído (nunca automático). Responde a um `needs_resolution` com `--resolve`"
"remote-group continue --branch" = "A branch (padrão: a atual); só lida com `--resolve`"
"remote-group continue --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (repetível): a decisão para um remoto sobre o qual a resposta anterior perguntou"
"remote-group continue --run" = "O id da execução salva, para ter certeza de que ainda é a pretendida"
"remote-group continue --yes" = "Confirma os force pushes citados por `--resolve`"
"remote-group plan" = "O que um push em grupo (ou, com `--pull`, um pull em grupo) faria, remoto por remoto: onde cada um está, a ação sugerida e as outras permitidas. Consulta os remotos (`ls-remote`, e um fetch dos que têm ponta desconhecida), a menos que use `--no-preflight`; não altera nada"
"remote-group plan --branch" = "A branch (padrão: a atual)"
"remote-group plan --no_preflight" = "Não consulta os remotos: usa as refs de rastreamento remoto como estão"
"remote-group plan --pull" = "Planeja o pull em grupo (o primário e as fontes de pull)"
"remote-group plan --to" = "Planeja um push exatamente para estes remotos (`<remote>` ou `<remote>:<dst>`, repetível) em vez dos destinos configurados"
"remote-group retry" = "Executa de novo os destinos da execução salva que falharam, foram cancelados no meio do push ou nunca foram tentados"
"remote-group retry --run" = "O id da execução salva, para ter certeza de que ainda é a pretendida"
