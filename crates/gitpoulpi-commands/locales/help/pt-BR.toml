"log --format" = "Exibe os commits em outro formato. `mermaid` imprime um script `gitGraph` do Mermaid (cole-o em um arquivo Markdown, em um PR ou no mermaid.live); com `--json`, `{format, detail, commits, text}`. Os commits são os de `--range`, senão os primeiros `--limit` (padrão 30) do percurso"
"log --detail" = "Nível de detalhe do Mermaid: `structure` (commits, branches, merges), `refs` (+ nomes de branch, tags, HEAD), `subjects` (+ assuntos dos commits) ou `full` (+ autor e data). Padrão: `ui.mermaid_detail` (`refs`)"
"log --orientation" = "Direção do grafo do Mermaid. Padrão: `ui.mermaid_orientation` (`lr`)"
"log --fence" = "Envolve o script do Mermaid em um bloco ```mermaid"
"log --range" = "Mermaid: os commits `A..B` (alcançáveis a partir de B, não de A), como em `git log A..B`; um `A` sozinho significa `A..HEAD`"
"log --subject_width" = "Mermaid: corta os assuntos dos commits neste número de caracteres. Padrão: `ui.mermaid_subject_width` (40)"
"mcp serve --allow_remote" = "Permite `--http` em um endereço que não seja loopback. Recusado, a menos que `[mcp] http_auth` esteja ativado com um token definido e o tráfego seja criptografado (`[mcp] tls`, ou `behind_proxy` para um túnel ou proxy reverso pelo qual você responde); `ssh -L` para um endpoint loopback é mais seguro"
"mcp serve --bind" = "Endereço de escuta para `--http` (equivale a `--http ADDR`; tem precedência sobre ele)"
"mcp serve --http" = "Endereço de escuta para HTTP em streaming, por exemplo 127.0.0.1:8808 (endpoint `/mcp`); sem endereço, `[mcp] bind` (padrão 127.0.0.1:8808). As requisições precisam do token bearer (`mcp token`), a menos que `[mcp] http_auth` esteja desativado. Somente loopback, a menos que `--allow-remote`"
"mcp serve --ui_control" = "Até onde o agente pode mover a janela do usuário com as ferramentas `ui_*`: `ask` (padrão: a janela mostra um chip que o usuário confirma), `auto` ou `off`. Sobrepõe `[mcp] ui_control`"
"mcp token" = "O token bearer do endpoint HTTP (`mcp serve --http`): mostra-o mascarado como JSON `{token_hint, path, rotated}`, criando-o no primeiro uso. Um cliente o envia como `Authorization: Bearer <token>`. Não é uma ferramenta MCP: um agente nunca lê nem substitui a própria chave"
