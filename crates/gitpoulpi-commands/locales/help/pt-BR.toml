"mcp token --rotate" = "Substitui o token por um novo; os clientes que têm o antigo são recusados na hora"
"mcp token --show" = "Imprime também o token completo, para você colá-lo na configuração de um cliente"
"merge --autostash" = 'Faz stash das alterações locais que impedem a operação, executa-a e depois aplica o stash (o que `general.auto_stash = "always"` faz)'
