"conflicts am-abort" = "Aborta o `git am` em andamento: a branch volta à ponta de antes do `am` e os patches já aplicados são descartados"
"conflicts am-continue" = "Continua o `git am` em andamento: aplica o patch em que parou (resolva e adicione antes seus arquivos ao índice) e o restante da caixa. `{\"outcome\":\"Completed\"}` ou `\"Stopped\"` (outro patch entrou em conflito)"
"conflicts am-skip" = "Pula o patch em que o `git am` em andamento parou e segue para o próximo"
"hosting integrations add --account" = "O e-mail da conta (`jira_cloud`, `bitbucket`), a chave de API (`trello`) ou o nome de usuário (`gerrit`). Não é um segredo: o token é gravado com `hosting login`"
"hosting integrations add --org" = "A organização do Azure DevOps (`azure_devops`), atalho para `--url https://dev.azure.com/<org>`"
"hosting issue create --issue_type" = "O tipo da issue, por nome ou id (Jira, Azure DevOps; veja `hosting issue options`). Por padrão, a escolha do provedor"
"hosting issue create --list" = "A lista onde o cartão entra, por nome ou id (Trello; veja `hosting issue options`). Por padrão, a primeira lista aberta"
