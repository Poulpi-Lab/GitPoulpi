"hosting review submit --body_file" = "Lê o resumo deste arquivo (`-` lê da entrada padrão)"
"hosting review submit --comments" = "Um comentário no código, `path:line[:side]:text`; repita a opção. `line` é `N` ou um intervalo `N-M` (GitHub; o GitLab fica com a última linha), `side` é `new` (a linha no head, o padrão) ou `old` (a linha na base do merge)"
