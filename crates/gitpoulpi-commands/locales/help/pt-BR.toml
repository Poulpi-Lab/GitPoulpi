reword = "Dá a um commit da branch atual uma nova mensagem (seus descendentes são recriados por cima; índice e árvore de trabalho não são tocados). Um commit já enviado exige então um push forçado"
"reword --commit" = "O commit a editar (qualquer revisão: um sha, `HEAD~2`, ...)"
"reword --message" = "A nova mensagem completa (resumo, linha em branco, corpo)"
amend = "Altera as propriedades de um commit da branch atual: mensagem, nome, e-mail e data do autor, nome, e-mail e data do committer (qualquer subconjunto; o que você omitir é mantido). Seus descendentes são recriados por cima com seus próprios autores; o índice e a árvore de trabalho ficam como estão. Pode ser desfeito; um commit já enviado precisará depois de um push forçado"
"amend --author_date" = "Data git bruta (`1700000000 +0100`) ou ISO 8601 (`2001-02-03T04:05:06+05:30`)"
"amend --author_email" = "O novo e-mail do autor"
"amend --author_name" = "O novo nome do autor"
"amend --commit" = "O commit a alterar (qualquer revisão: um sha, `HEAD~2`, ...)"
"amend --committer_date" = "Os mesmos formatos de --author-date (padrão: agora)"
"amend --committer_email" = "O novo e-mail do committer (padrão: o seu)"
"amend --committer_name" = "O novo nome do committer (padrão: o seu)"
"amend --description" = "Somente o corpo (o que vem depois do resumo): o resumo é mantido. Um valor vazio remove o corpo"
"amend --message" = "A nova mensagem completa (resumo, linha em branco, corpo)"
"amend --summary" = "Somente o resumo (primeira linha): o corpo é mantido"
rm-file = "Exclui arquivos (ou diretórios) da árvore de trabalho; o índice não é tocado, então um arquivo rastreado aparece como uma alteração excluída. Pode ser desfeito com `gitpoulpi undo`, que restaura os bytes exatos"
"rewrite apply --target" = "A pasta do novo repositório quando o plano extrai um subdiretório como clone ou submódulo (veja `--extract-mode`)"
"rewrite maps" = "Os arquivos `commit-map` e `ref-map` da execução (formato do git-filter-repo: uma linha de cabeçalho e depois `antigo novo` por linha; a limpeza de repositório do GitLab usa o mapa de commits). Imprime os caminhos deles, ou os copia para `--out`"
"rewrite maps --out" = "Copia os dois arquivos para este diretório (criado se não existir)"
"rewrite maps --run" = "O id da execução; `latest` (padrão) é a execução aplicada mais recentemente"
"rewrite note" = "A nota para as pessoas que têm o histórico antigo: para cada branch e tag publicada, a ponta antiga e a nova e o que executar (`git fetch`, depois `git reset --hard origin/<branch>` ou `git rebase --onto`). Só leitura"
"rewrite note --run" = "O id da execução; `latest` (padrão) é a execução aplicada mais recentemente"
"rewrite preview --extract" = "Regra de caminho: mantém só este subdiretório, que vira a raiz; os commits que não o tocam são descartados e os merges são simplificados. Perguntado a cada vez: informe `--extract-mode`, senão o código de saída é 3 e nada é pré-visualizado. A extração roda antes das outras opções de caminho"
"rewrite preview --extract_mode" = "Como `--extract` termina: `clone` (um novo clone local em `--target`, o original não é tocado; todas as branches locais e tags), `in-place` (o histórico deste repositório é reescrito, uma entrada de desfazer) ou `submodule` (o clone como em `clone`, e um novo commit na branch atual troca a pasta por um submódulo dele; este histórico é mantido)"
"rewrite preview --into_subdir" = "Regra de caminho: move o repositório inteiro para este subdiretório em cada commit (para juntar repositórios sem conflito de caminhos)"
"rewrite preview --move_paths" = "Regra de caminho `DE=PARA`: renomeia um arquivo ou pasta em cada commit, com os mesmos blobs e trees no novo caminho (pode repetir, em ordem, depois das regras de conteúdo). Um commit em que `PARA` já existe não é alterado: a prévia é recusada (código de saída 2, `path_collision`) e lista os commits e caminhos"
"rewrite preview --target" = "A pasta do novo repositório para `--extract-mode clone` ou `submodule`: não pode existir (ou deve estar vazia) nem ficar dentro deste repositório. Usada por `rewrite run`; `rewrite apply` tem a sua"
"rewrite push" = "Faz push das refs que uma execução aplicada moveu e que estavam em um remoto, cada uma com `--force-with-lease=<ref>:<o id que o remoto tinha quando você gerou a prévia>` (nunca um force simples), em um único push `--atomic` por remoto quando o servidor permite (senão um push por ref, e a resposta avisa). As tags entram. As branches protegidas (`rewrite.protected_branches`) ficam de fora, a menos que sejam citadas com `--include-protected` ou todas com `--include-all-protected`. Uma ref cujo remoto mudou desde a prévia é rejeitada (faça fetch e revise, depois rode de novo). Não pode ser desfeito: o remoto mantém o novo histórico mesmo que você use `undo` na reescrita local. Sem `--yes` (ou com `--dry-run`) nada é enviado: a resposta lista o que seria enviado, e o código de saída é 3 sem `--yes`. Código de saída 2 quando a execução não existe mais, 4 quando uma ref foi rejeitada ou não foi enviada"
"rewrite push --dry_run" = "Pergunta ao remoto o que aconteceria (os leases são conferidos) e não envia nada"
"rewrite push --include_all_protected" = "Faz push de todas as branches protegidas da execução também"
"rewrite push --include_protected" = "Faz push desta branch protegida também (pode repetir)"
"rewrite push --no_atomic" = "Um push por ref em vez de um único push `--atomic`, tudo ou nada"
"rewrite push --remote" = "Só as refs deste remoto"
"rewrite push --run" = "O id da execução que `rewrite apply` imprimiu; `latest` (padrão) é a execução aplicada mais recentemente"
"rewrite push --yes" = "Prossegue com o push. Sem isso nada é enviado (código de saída 3)"
"rewrite purge" = "Apaga de vez deste clone o histórico antigo de uma reescrita: remove os pontos de desfazer da reescrita (e de qualquer operação anterior cujos pontos também guardem o histórico antigo), expira as entradas do reflog que o citam, poda os objetos (`gc --prune=now`) e confere que sumiram. Depois disso, desfazer deixa de ser possível para essas operações (elas continuam em `undo --list` como apagadas). Depois de iniciado, não dá para interromper nem desfazer. Tudo o que ainda guarda o histórico antigo (uma branch fora da reescrita, um stash, o HEAD de outro worktree, uma ref de rastreamento remoto: faça fetch depois do push) bloqueia a operação, e nada é alterado. Nada é enviado a nenhum remoto; a resposta lista os passos que o host exige (GitHub, GitLab, Azure DevOps, Bitbucket). Sem `--yes` nada acontece: a resposta diz o que seria apagado e perdido, e o código de saída é 3. Código de saída 2 quando a entrada não é uma reescrita, 4 quando algo bloqueia ou restam objetos. Via MCP somente com `[mcp] allow_history_purge = true`"
"rewrite purge --all" = "Todas as reescritas de histórico do histórico de desfazer"
"rewrite purge --entries" = "Uma entrada de reescrita de histórico do histórico de desfazer (`undo --list`; pode repetir). Padrão: a reescrita mais recente que ainda não foi apagada"
"rewrite purge --latest" = "A reescrita mais recente que ainda não foi apagada (o padrão)"
"rewrite purge --yes" = "Prossegue com a exclusão. Sem isso nada é alterado (código de saída 3)"
"rewrite run --extract" = "Regra de caminho: mantém só este subdiretório, que vira a raiz; os commits que não o tocam são descartados e os merges são simplificados. Perguntado a cada vez: informe `--extract-mode`, senão o código de saída é 3 e nada é pré-visualizado. A extração roda antes das outras opções de caminho"
"rewrite run --extract_mode" = "Como `--extract` termina: `clone` (um novo clone local em `--target`, o original não é tocado; todas as branches locais e tags), `in-place` (o histórico deste repositório é reescrito, uma entrada de desfazer) ou `submodule` (o clone como em `clone`, e um novo commit na branch atual troca a pasta por um submódulo dele; este histórico é mantido)"
"rewrite run --into_subdir" = "Regra de caminho: move o repositório inteiro para este subdiretório em cada commit (para juntar repositórios sem conflito de caminhos)"
"rewrite run --move_paths" = "Regra de caminho `DE=PARA`: renomeia um arquivo ou pasta em cada commit, com os mesmos blobs e trees no novo caminho (pode repetir, em ordem, depois das regras de conteúdo). Um commit em que `PARA` já existe não é alterado: a prévia é recusada (código de saída 2, `path_collision`) e lista os commits e caminhos"
"rewrite run --target" = "A pasta do novo repositório para `--extract-mode clone` ou `submodule`: não pode existir (ou deve estar vazia) nem ficar dentro deste repositório. Usada por `rewrite run`; `rewrite apply` tem a sua"
"rm-file --paths" = "Caminhos relativos ao repositório a excluir"
shell-init = """Imprime uma função wrapper de shell (nome padrão `gp`) que executa o gitpoulpi e, quando você sai com "Sair e fazer cd aqui", deixa seu shell na pasta da aba ativa. Adicione-a ao arquivo rc do seu shell: `eval "$(gitpoulpi shell-init bash)"`. Nada é instalado nem editado"""
"shell-init --name" = "O nome da função. Um comando existente com esse nome não é sobrescrito"
show = "O conteúdo de um arquivo em uma revisão, no índice ou na árvore de trabalho"
"show --at" = "Revisão em que lê-lo (padrão: HEAD). Mutuamente exclusivo com --staged e --worktree"
"show --output" = "Com --raw: grava os bytes neste arquivo em vez de stdout"
"show --path" = "Caminho relativo ao repositório a ler"
"show --raw" = "Grava os bytes exatos do arquivo (sem decodificar, sem JSON) em stdout ou em --output. Para scripts e arquivos binários como imagens. Somente na linha de comando: indisponível via MCP"
"show --staged" = "Lê o conteúdo preparado em vez do de um commit"
"show --worktree" = "Lê o arquivo como está no disco em vez do de um commit"
repo-config = "Os `core.autocrlf` e `core.eol` locais do repositório (o que Configurações > Git e codificação edita). Pode ser desfeito como qualquer outra operação"
"repo-config set" = "Define uma chave: `core.autocrlf` aceita true | input | false, `core.eol` aceita lf | crlf | native"
"repo-config show" = "Mostra o valor local do repositório de uma chave (`core.autocrlf` ou `core.eol`), ou das duas; null significa não definido (vale o valor global)"
"repo-config show --key" = "`core.autocrlf` ou `core.eol`; as duas se omitido"
"repo-config unset" = "Remove o valor local do repositório, para voltar a valer o global"
ssh-command = "A fixação local do repositório em `core.sshCommand`: qual chave SSH este repositório usa. Veja `repo-auth` para a identidade completa"
"ssh-command clear" = "Remove a fixação, para que o repositório volte a usar a configuração ssh do ambiente"
"ssh-command set" = "Fixa o repositório em uma chave privada, ou em um comando literal"
"ssh-command set --command" = "Um valor literal de `core.sshCommand`"
"ssh-command set --key" = 'Arquivo de chave privada: fixa `ssh -i "<key>" -o IdentitiesOnly=yes`'
"ssh-command show" = "Mostra o `core.sshCommand` fixado do repositório (null quando não definido)"
"stage --allow_sensitive" = "Prepara também arquivos que parecem sensíveis (uma chave privada, um `.env`, um token reconhecido). Sem isso, esse stage é recusado e nada é preparado (`[privacy] staging_guard`)"
"stage --hunk" = "Índice de um hunk dentro do diff de `--file`, como `gitpoulpi diff --json` os numera"
"stage --lines" = "Índices de linhas separados por vírgula dentro de `--hunk`"
"stage --paths" = "Vários caminhos (arquivos ou pastas) como UMA operação: uma entrada no diário, um passo de `undo` (um arquivo movido é o caminho antigo e o novo)"
"unstage --paths" = "Vários caminhos (arquivos ou pastas) como UMA operação: uma entrada no diário, um passo de `undo` (um arquivo movido é o caminho antigo e o novo)"
"stash push --ai" = "Deixa a IA dar nome ao stash a partir das alterações de trabalho (requer `ai.enabled = true`, veja `docs/user/ai.md`)"
submodule = "Submódulos: liste-os com seu estado, registre (`init`) ou faça checkout (`update`) deles"
"submodule init" = "Registra submódulos em `.git/config` sem cloná-los (`git submodule init`). Sem caminhos: todos"
"submodule init --paths" = "Caminhos de submódulos relativos ao repositório"
"submodule list" = "Todo submódulo com seu estado: `uninitialized` (não clonado), `up_to_date`, `modified` (em checkout em outro commit que o registrado) ou `conflicted`"
"submodule update" = "Faz checkout dos submódulos nos commits que o repositório registra (`git submodule update`). Sem caminhos: todos"
"submodule update --init" = "Clona e registra os que ainda não estão (`--init`)"
"submodule update --paths" = "Caminhos de submódulos relativos ao repositório"
"submodule update --recursive" = "Também atualiza os submódulos dos próprios submódulos"
"tag annotate" = "Substitui uma tag existente por uma anotada, no mesmo lugar. A tag mantém o commit para o qual já aponta"
"tag move" = "Move an existing tag to another commit, keeping its kind (an annotated tag keeps its message and tagger). Local only: a remote keeps the old position until you push"
"tag move --force_non_ff" = "Allow a move that is not a fast-forward (the tag's current commit is not an ancestor of the target)"
"tag move --target" = "The commit, branch or tag to move it to"
"tag merge-branch" = "Merge a branch into the commit a tag points at (detached, no branch moves), then move the tag onto the merge commit"
"tag merge-branch --branch" = "The branch (or any revision) to merge into the tag"
"tag merge-branch --message" = "Message of the merge commit"
"tag create --message" = "Cria uma tag *anotada* com esta mensagem em vez de uma leve - `git tag -a -m`"
"tag delete" = "Exclui uma tag. Por padrão só a local (`--local`): quando um remoto também tem a tag, o próximo `fetch` a traz de volta, e a resposta avisa isso. `--remote <R>` a exclui só nesse remoto (visível a outras pessoas: elas a perdem), `--both` a exclui aqui e no remoto que a tem (`--both --remote <R>` indica um)"
"tag delete --both" = "Exclui aqui e no remoto que tem a tag"
"tag delete --local" = "Exclui só a tag local (o padrão)"
"tag delete --remote" = "Exclui neste remoto (sozinha, a menos que haja `--both`)"
"tag delete-remote" = "Exclui uma tag de um remoto, mantendo a local"
"tag take-remote" = "Use the remote's version of a tag that `differs` (here and on a remote at another commit): the local tag moves to what the remote has, as known from the last fetch or push (no network). An annotated tag becomes that same tag object. Undoable"
"tag take-remote --remote" = "Omitted: the one remote the tag differs on"
"tag force-push" = "Force-push the local tag to a remote that has it at another commit (a tag that `differs`), leased on the value the last fetch saw: a remote that moved since is refused (\"fetch first\") and nothing is overwritten. Outward-facing: without `--yes` nothing changes and the exit code is 3. Undoable (the old value is pushed back, with a lease)"
"tag force-push --remote" = "Omitted: the one remote the tag differs on"
"tag force-push --yes" = "Go ahead; without it nothing changes and the exit code is 3"
"tag fetch" = "Faz fetch de uma tag de um remoto para as tags locais - o que uma tag só `remote` em `tag list` precisa. Nunca sobrescreve uma tag local em outro commit"
"tag fetch --remote" = "Omitido: o único remoto que tem a tag"
"tag list" = "Toda tag com o lugar onde ela está: `local` (aqui), `remote` (os remotos que a têm), `differs_on` (remotos que a têm em outro commit) e `where`: `local`, `remote` (não baixada ou excluída aqui), `both` ou `differs`. Obtido do último fetch ou push, não da rede"
"tag list --unpushed" = "Somente as tags que nenhum remoto sabidamente tem"
"tag push" = "Envia tags a um remoto. Sem nomes, envia toda tag que nenhum remoto sabidamente tem - um único push, não um por tag"
"tag push --names" = "Tags a enviar. Omita para enviar toda tag não enviada"
theme = "Os temas de cores: liste-os ou imprima um como arquivo de tema"
licenses = "Exibe as licenças de terceiros e os créditos embutidos neste programa (o mesmo texto de Sobre > Licenças e do arquivo THIRD-PARTY-LICENSES.txt do pacote da versão)"
"theme export" = "Imprime em stdout um arquivo de tema completo, para começar um tema próprio (salve como `<config>/themes/<nome>.toml`)"
"theme export --slug" = "O slug do tema (veja `theme list`)"
"theme list" = "Lista todos os temas: as predefinições embutidas e os arquivos da pasta `themes/` do diretório de configuração (slug, rótulo, origem, claro, paleta de faixas). `ui.theme` aceita qualquer um destes slugs"
desktop = "Atalhos que iniciam o GitPoulpi pelo lançador do sistema, no terminal que `ui.launch_terminal` indica"
"desktop folder-menu" = """A entrada "Abrir no GitPoulpi" do menu de clique direito do gerenciador de arquivos: Explorador de Arquivos (Windows), Arquivos do GNOME, Dolphin, Nemo, Thunar, Caja e PCManFM (Linux), Finder (macOS)"""
"desktop folder-menu install" = "Adiciona a entrada a todos os gerenciadores de arquivos encontrados aqui (um arquivo de terceiros nunca é sobrescrito)"
"desktop folder-menu remove" = "Remove exatamente o que `install` gravou, de todos os gerenciadores de arquivos"
"desktop folder-menu status" = "Mostra cada gerenciador de arquivos deste sistema: se foi encontrado e se a entrada está not_installed, installed, outdated ou foreign (um arquivo que não é do GitPoulpi)"
"desktop shortcut" = "Lista, cria ou remove os atalhos do lançador, do menu Iniciar e da área de trabalho"
"desktop shortcut install" = "Cria ou atualiza um atalho (padrão: o lançador do sistema)"
"desktop shortcut install --place" = "`launcher`, `desktop` ou `startmenu`"
"desktop shortcut remove" = "Remove os atalhos criados pelo GitPoulpi (padrão: todos); um arquivo que não é do GitPoulpi nunca é tocado"
"desktop shortcut remove --place" = "`launcher`, `desktop` ou `startmenu`"
"desktop shortcut status" = "Mostra cada atalho que este sistema oferece: not_installed, installed, outdated ou foreign (um arquivo que não é do GitPoulpi), e o terminal em uso"
treat = "Faz o git tratar arquivos como binários ou como texto, escrevendo uma regra de `.gitattributes` (`binary` ou `text diff`) para os caminhos: o arquivo da raiz do repositório por padrão, `--file` para o de uma pasta ou `.git/info/attributes` (somente este clone). Uma regra que já nomeia o mesmo padrão é reescrita, não contradita. A resposta diz se o git agora realmente trata os caminhos assim (`effective`). Desfazível com `gitpoulpi undo`, exceto para `.git/info/attributes`"
"treat --kind" = "Como o git deve tratar os caminhos"
"treat --paths" = "Caminhos relativos ao repositório (pastas com `--folder`)"
"treat --extension" = "Nomeia todos os arquivos com a extensão de cada caminho (`*.ext`) em vez do próprio arquivo"
"treat --folder" = "Os caminhos são pastas: a regra cobre tudo que há dentro"
"treat --file" = "`.gitattributes` relativo ao repositório onde escrever, ou `.git/info/attributes` (padrão: o `.gitattributes` da raiz)"
convert = "Reescreve a codificação, os fins de linha ou a indentação de arquivos da árvore de trabalho, com as funções do editor da TUI e do seu menu Converter. Exatamente uma entre `--encoding`, `--eol` e `--indent`. Arquivos binários, ausentes ou que a codificação de destino não consegue representar são ignorados e relatados, nunca danificados. Uma única entrada do diário para todo o lote: `gitpoulpi undo` devolve todos os arquivos"
"convert --paths" = "Arquivos a converter, caminhos relativos ao repositório"
"convert --encoding" = "A codificação de destino, como o editor a nomeia (`UTF-8`, `UTF-8 BOM`, `UTF-16 LE`, `Windows-1252`, `ISO-8859-1`, `Shift_JIS`, ...)"
"convert --eol" = "O fim de linha de destino"
"convert --indent" = "Espaços ou tabulações no início da linha: `spaces:<n>` ou `tabs:<n>`, sendo `<n>` a largura de uma tabulação (1-8)"
ui = "Mostra coisas ao usuário em sua janela aberta do GitPoulpi: um commit, um diff em uma linha, um arquivo, uma página de configurações. Somente visualização: nada aqui altera o repositório nem digita na janela, exceto `ui propose`, que abre um diálogo pré-preenchido para o usuário confirmar (desativado, a menos que `[mcp] allow_ui_propose = true`). Requer um TUI do GitPoulpi aberto na sessão"
"ui --launch" = "Quando nenhuma janela está aberta em lugar nenhum, abre uma com o comando de inicialização configurado (`[ui] launch` / `launch_command`; desativado por padrão) e espera até 10 s que ela se conecte. Sem esta flag, uma janela só é iniciada quando `[ui] launch` está definido E `ui_control` é `auto`"
"ui --viewer" = "Envia a esta janela (`ui viewers` as lista) em vez de deixar o daemon escolher"
"ui back" = "Desfaz a última mudança de visão do agente (restaura a visão anterior)"
"ui highlight" = "Destaca um intervalo de linhas no diff ou arquivo que a janela tem aberto"
"ui highlight --no_scroll" = "Não rola o intervalo até ficar visível"
"ui highlight --range" = "`A-B`, ou `A:C-B:C` com colunas (a partir de 1)"
"ui notify" = "Mostra uma mensagem curta em toast ao usuário"
"ui notify --message" = "No máximo 200 caracteres; caracteres de controle são removidos"
"ui propose" = """Propõe uma alteração para o usuário confirmar: um diálogo abre pré-preenchido, marcado "Proposto por", e nada acontece até o usuário pressionar a confirmação dele. Requer `[mcp] allow_ui_propose = true`. Acompanhe o id `proposal` da resposta em `proposals` de `ui state`"""
"ui propose branch" = "Abre a caixa Nova Branch com um nome preenchido"
"ui propose branch --start_point" = "Onde a branch começa (padrão: HEAD)"
"ui propose commit-message" = "Preenche o Resumo e a Descrição do compositor de commit; nunca faz commit"
"ui propose resolution" = "Abre o editor de merge em um arquivo em conflito com uma resolução já preenchida, para o usuário revisar e confirmar com Salvar e Marcar como Resolvido (o Ctrl+S dele é a única confirmação; nada é gravado nem preparado aqui). Informe as escolhas com `--pick`, ou o arquivo inteiro com `--content-file`"
"ui propose resolution --content_file" = "O texto final do arquivo, exatamente (`-` lê a entrada padrão)"
"ui propose resolution --path" = "Caminho do arquivo em conflito, relativo ao repositório"
"ui propose resolution --pick" = "Uma escolha por número de conflito: `1=a,2=b,3=ab,4=ba,5=none` (a = atual, b = recebido, ab / ba = ambos nessa ordem)"
"ui propose resolution --pick_default" = "Com `--pick`: a escolha para todo conflito não listado"
"ui propose reword" = "Abre o popup Reescrever sobre um commit com uma nova mensagem preenchida"
"ui propose rewrite" = "Abre o painel de reescrita de histórico com uma receita já preenchida, para o usuário pré-visualizar e aplicar; nunca reescreve, apaga nem envia nada por conta própria. Uma receita tem no máximo 50 regras e nenhum script, e os valores secretos são removidos dela"
"ui propose rewrite --recipe" = "A receita (TOML ou JSON, como `rewrite preview --recipe` aceita), de um caminho de arquivo ou `-` para stdin"
"ui propose reword --message" = "A mensagem proposta: resumo, linha em branco, corpo"
"ui propose reword --rev" = "O commit (na branch em checkout)"
"ui propose split" = "Abre o editor de divisão sobre um commit, preenchido com um plano que o usuário revisa, edita e aplica; nunca divide nada por conta própria"
"ui propose split --plan" = "O plano (JSON), de um caminho de arquivo ou `-` para stdin, como `split-commit --plan` o aceita"
"ui propose split --rev" = "O commit a dividir (na branch em checkout)"
"ui propose tag" = "Abre a caixa Nova Tag com um nome (e, se anotada, uma mensagem) preenchido"
"ui propose tag --message" = "Torna-a uma tag anotada com esta mensagem"
"ui propose tag --target" = "O commit a marcar (padrão: HEAD)"
