"diff --name_only" = "Lista apenas os ficheiros alterados e o respetivo estado, sem hunks"
"diff --to" = "A outra extremidade de `--from`: uma revisão, ou `worktree` (a predefinição) para a árvore de trabalho, com as alterações em stage e não staged dos ficheiros rastreados. Comparar a seleção do Log lista os mesmos ficheiros"
