"hosting review" = "Revê um pull/merge request no local (GitHub, GitLab, Gitea, Forgejo): lê-o, com as suas discussões e os seus ficheiros, comenta, responde, resolve, submete uma revisão e obtém o respetivo head para o diff. Os mesmos comandos para uma pessoa, um script e um agente de IA"
