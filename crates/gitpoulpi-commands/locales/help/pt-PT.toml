"file-history --skip" = "Entradas a saltar (a página n é `--skip <n*limit> --limit <limit>`)"
"lost-commits" = "Commits que nenhuma branch, tag, remoto ou stash alcança: o que uma branch eliminada deixou para trás (nomeado por um reflog, ou mantido apenas por um pin de desfazer) e, salvo com `--no-deep`, os commits soltos da base de objetos. Do mais recente para o mais antigo. Crie uma branch num deles para o recuperar"
"lost-commits --budget_ms" = "Para a pesquisa após estes milissegundos (0: sem limite); a resposta indica então `partial`"
"lost-commits --limit" = "Commits a listar"
"lost-commits --no_deep" = "Só os commits que um reflog ou um pin de desfazer ainda nomeia (rápido em qualquer tamanho)"
"lost-commits --skip" = "Commits a saltar"
"reflog" = "Lista um reflog, do mais recente para o mais antigo: onde `HEAD` ou uma branch esteve antes, com a data e o motivo do git, incluindo movimentos feitos numa shell. Uma branch eliminada já não tem reflog. Também escrito `reflog restore` para `reflog-restore`"
