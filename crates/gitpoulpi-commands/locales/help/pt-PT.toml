"undo-forget --expect" = "Só esquece se ainda for a entrada do topo (o seu id, como `undo --list` mostra); caso contrário é recusado por obsoleto"
"undo-forget --redo" = "Esquece a entrada do topo de refazer em vez da de anular"
"undo-forget --yes" = "Confirma. Sem isto nada muda e o código de saída é 3"
"clone --sparse" = "Checkout parcial: extrai apenas estas pastas (mais os ficheiros da raiz); todo o histórico é na mesma transferido"
sparse-checkout = "Checkout parcial (modo cone): mantém apenas algumas pastas na árvore de trabalho de um repositório grande. `gitpoulpi clone --sparse` inicia um"
"sparse-checkout add" = "Mostra também estas pastas, mantendo as já apresentadas"
"sparse-checkout disable" = "Extrai todos os ficheiros de novo (checkout completo)"
"sparse-checkout set" = "Mostra exatamente estas pastas (mais os ficheiros da raiz do repositório); todas as outras saem da árvore de trabalho. Ativa o checkout parcial se estiver desativado. O histórico não é alterado"
"sparse-checkout set --dirs" = "Pastas relativas à raiz do repositório, p. ex. `src docs/guide`"
"sparse-checkout status" = "Indica se a árvore de trabalho é um checkout parcial e que pastas mostra: `{ \"enabled\", \"cone\", \"dirs\" }`"
