"flow start --yes" = "Executa o plano sem perguntar. Sem isto, num terminal é feita uma pergunta e em qualquer outro caso o plano é impresso e o código de saída é 3"
"flow status" = "Cada branch do repositório classificada pelo seu fluxo de trabalho de branches: base ou tópico (com o seu tipo), pai, e quantos commits está à frente e atrás desse pai. Sem ficheiro de fluxo de trabalho todas as branches ficam por classificar; `flow detect` propõe um"
"flow sync" = "Atualiza uma branch em relação ao seu pai (merge ou rebase, conforme a estratégia configurada da branch) e, com `--stack`, as branches construídas sobre ela, por ordem. Imprime o plano e precisa de `--yes`; código de saída 3 sem ele"
"flow sync --abort" = "Desiste da ação interrompida: aborta o merge ou rebase em curso e volta à branch onde começou. Os passos já concluídos mantêm-se (reverta-os com `undo`)"
"flow sync --autostash" = "Guarda em stash as alterações locais que bloqueiam um checkout ou merge e repõe-nas depois, seja qual for o valor de `general.auto_stash`"
"flow sync --branch" = "A branch a atualizar. Por omissão, a que tem checkout"
"flow sync --continue_" = "Continua depois de o conflito estar resolvido: faz commit do merge ou continua o rebase e depois executa os passos restantes. Após um hook falhado, executa esse passo de novo"
"flow sync --dry_run" = "Imprime o plano (cada passo, bloqueios, avisos) em JSON e não altera nada"
"flow sync --merge" = "Faz merge em vez de rebase"
"flow sync --no_hooks" = "Ignora os hooks configurados sem perguntar"
"flow sync --rebase" = "Faz rebase em vez de merge"
"flow sync --run_hooks" = "Executa os hooks que o fluxo de trabalho configura para esta ação (comandos de shell do ficheiro do fluxo de trabalho, mostrados com a respetiva saída). Nunca são executados sem serem pedidos; num terminal é feita uma pergunta quando isto falta"
"flow sync --stack" = "Atualiza também as branches cujo pai é esta, recursivamente"
"flow sync --yes" = "Executa o plano sem perguntar. Sem isto, num terminal é feita uma pergunta e em qualquer outro caso o plano é impresso e o código de saída é 3"
"flow templates" = "Os modelos de fluxo de trabalho incluídos (Git Flow, GitHub Flow, GitLab Flow, Trunk-based, Custom) com as suas branches base e tipos de tópico"
"flow trust-hooks" = "Revê e aprova os hooks do fluxo de trabalho que o repositório inclui nos seus commits (o `[hooks]` de `.gitpoulpi/workflow.toml`): comandos de shell que seriam executados no seu computador. Sem `--hash` apenas mostra `{hash, hooks, trusted}`; com o hash memoriza a aprovação, mas só quando o ficheiro em disco ainda tem exatamente esse hash, pelo que o que leu é o que fica aprovado. Um ficheiro alterado volta a perguntar. Os hooks da sua própria substituição nunca precisam disto. Só uma pessoa o pode fazer: não existe nenhuma ferramenta MCP para isso"
"flow trust-hooks --hash" = "O hash mostrado por `flow trust-hooks` (ou por um `--run-hooks` recusado): aprova os hooks com esse hash"
alias = "O alias de comando (`gp` ou outro nome) que inicia o GitPoulpi a partir de um terminal: o equivalente por script de Definições > Lançador"
"alias create" = "Faz com que `<name>` (por exemplo `gp`) inicie o GitPoulpi: uma ligação no Linux e no macOS, um ficheiro `.cmd` no Windows, numa pasta bin do utilizador. Um ficheiro que não seja do GitPoulpi nunca é substituído. Ponha a pasta no PATH com `path add`"
"alias create --add" = "Cria a variante de adicionar (por exemplo `gpa`): executa `gitpoulpi --add`, que abre a pasta atual num novo separador do GitPoulpi que já está aberto"
"alias create --name" = "O nome do comando: só letras, dígitos, `-`, `_` e `.`"
"alias remove" = "Remove os aliases de comando criados pelo GitPoulpi (todos, ou só `<name>`); um ficheiro que não seja do GitPoulpi nunca é tocado"
"alias remove --name" = "O alias a remover (predefinição: todos os que o GitPoulpi criou)"
"alias status" = "Mostra os aliases de comando que o GitPoulpi criou (e o que cada um executa) e os nomes em `ui.command_alias` e `ui.command_alias_add`"
installation = "Que instalação do GitPoulpi é esta e as definições próprias (cor, nome, aliases, ambiente). Várias instalações podem coexistir no mesmo computador"
"installation show" = "Mostra que instalação do GitPoulpi é esta (o identificador, o tipo, a pasta e o ambiente), se é a principal, as definições próprias e as outras instalações deste computador"
"installation set" = "Altera uma das definições próprias desta instalação: `name`, `name_with_version`, `logo_color`, `command_alias`, `command_alias_add`, `folder_menu_submenu`, `env` ou `mcp_bind`. Um valor vazio limpa-a. A cor e os aliases da instalação principal também são gravados nas chaves partilhadas `ui.*` que as versões mais antigas leem"
"installation set --field" = "O campo a definir"
"installation set --value" = "O novo valor (vazio limpa)"
path = "Põe o GitPoulpi no PATH do utilizador, para os novos terminais"
"path add" = "Põe a pasta onde o GitPoulpi está e a pasta dos aliases no PATH do utilizador, para os novos terminais: um bloco marcado nos ficheiros de arranque da shell (Linux, macOS) ou o PATH do utilizador no registo (Windows). As pastas que já estão no PATH ficam como estão"
"path remove" = "Retira exatamente o que `path add` lá pôs"
"path status" = "Mostra se a pasta onde o GitPoulpi está e a pasta dos aliases estão no PATH do utilizador, e o que o GitPoulpi acrescentou"
uninstall = "Remove o que o instalador e as Definições criaram (aliases de comando, entradas do PATH, atalhos) e, numa instalação a partir de uma versão, os ficheiros do programa. Recusa numa compilação que não seja uma instalação de versão (sem marcador `.gitpoulpi-dist` junto ao executável). A sua configuração, sessões e repositórios nunca são tocados"
"uninstall --keep_files" = "Deixa os ficheiros do programa no lugar (o desinstalador do Windows apaga-os ele próprio, porque um executável em execução não o consegue fazer)"
launch = "O que os atalhos do GitPoulpi executam: mostra a janela de um GitPoulpi que já está aberto (`ui.reuse_window`) ou, na falta dela, inicia COMMAND (o terminal que executa o GitPoulpi). Não inicia nada, nem o daemon, quando consegue mostrar uma janela"
"launch --command" = "O comando a iniciar quando não há janela para mostrar, depois de `--`"
"launch --folder" = """Abre esta pasta: com `ui.reuse_window` ativo e uma janela aberta, o repositório que a contém passa a separador da janela focada mais recentemente (sem perguntar); caso contrário, o GitPoulpi arranca nessa pasta no terminal escolhido. O que a entrada "Abrir no GitPoulpi" do gestor de ficheiros executa"""
"launch --new_window" = "Inicia uma nova janela mesmo que já haja uma aberta"
"ai split-plan" = "Mostra um plano que a IA propõe para dividir um commit em vários commits, no JSON aceite por `split-commit --plan`. Não aplica nada: reveja e passe a `split-commit`. Requer `ai.enabled = true`"
"ai split-plan --rev" = "O commit a dividir (qualquer revisão: um sha, `HEAD~2`, ...)"
"ai rewrite-script" = "Mostra um script Lua que a IA escreve para uma reescrita do histórico a partir da sua instrução (\"mover para a manhã seguinte todos os commits feitos de noite\"), com o resultado de `rewrite script check` sobre ele. Não executa nem altera nada: leia o script, depois use `rewrite script test` e `rewrite preview --script`. Envia apenas a sua instrução e, com `--sample N`, o autor, a data e o assunto de N commits (nunca o conteúdo dos ficheiros). Requer `ai.enabled = true`"
"ai rewrite-script --instruction" = "O que o script deve fazer, por palavras suas"
"ai rewrite-script --sample" = "Envia também o autor, a data e o assunto dos N commits mais recentes (no máximo 50) para que o modelo veja o aspeto dos dados. Desativado por predefinição: sem isto nenhum dado de commits sai da máquina"
"ai rewrite-rules" = "Mostra as regras e definições que a IA propõe para reescrever o histórico a partir da sua descrição (\"trocar o meu antigo e-mail a@b por c@d em todos os commits\", \"remover secrets.txt de todo o histórico\"), como a receita JSON que `rewrite preview --recipe-json` lê (guarde o campo `recipe` num ficheiro para `--recipe`), com o que ficou de fora e porquê. Não pré-visualiza nem aplica nada: leia as regras e depois execute por si `rewrite preview` e `rewrite apply`. Envia só a sua descrição e, com `--context`, a branch atual, os nomes das branches e das tags e os autores dos 200 commits mais recentes (nunca o conteúdo dos ficheiros). Requer `ai.enabled = true`"
"ai rewrite-rules --description" = "Como deve ser reescrito o histórico, por palavras suas"
"ai rewrite-rules --context" = "Envia também os nomes das branches e das tags e os autores dos 200 commits mais recentes (até 100 nomes de branches e tags e 100 autores) para que o modelo os possa nomear exatamente. Desativado por predefinição: sem isto, nada além da sua descrição sai da máquina"
"ai worktree-name" = """Mostra o nome do worktree e o nome da branch que a IA propõe para uma tarefa (\"corrigir a falha quando a configuração está vazia\"): `{ name, worktree, branch }`, em que `worktree` é o nome que a caixa de diálogo Criar worktree preencheria (`worktree-<name>`) e `branch` segue a convenção de nomes de branches do próprio repositório. Não cria nada: passe-os a `worktree add`. Envia apenas a sua descrição e os nomes das branches locais. Requer `ai.enabled = true`"""
"ai worktree-name --describe" = "A funcionalidade, o erro ou a tarefa, por palavras suas"
"ai hosting-reply" = "Mostra um rascunho que a IA escreve para uma conversa num host de código: um comentário, uma resposta num tópico (`--reply-to`), um comentário numa linha de código (`--path`), um resumo de revisão (`--review-summary`) ou a descrição de uma nova issue (`--issue-title`). A conversa é lida de `--conversation` (o JSON que `hosting issue comments --json` ou `hosting review conversation --json` mostra, pelo que `hosting issue comments 7 --json | ai hosting-reply --conversation -` funciona) ou obtida com `--item`; a IA vê o item, o tópico, os comentários recentes dentro de `ai.limits.hosting_reply_context_bytes` e o seu `--hint`. **Só redige: a resposta é `{ draft, posted: false, ... }` e nada é publicado, editado nem eliminado**; publicar é um comando à parte que executa você mesmo. O prompt base é `ai.hosting_reply.base_prompt` (edite-o em Definições > IA). Requer `ai.enabled = true`"
"ai hosting-reply --conversation" = "A conversa em JSON, tal como um comando de conversa do `hosting` a mostra: um ficheiro, `-` para o stdin, ou o próprio JSON. Não serve para `--issue-title`"
"ai hosting-reply --draft" = "O seu próprio texto a melhorar, em vez de escrever um novo"
"ai hosting-reply --flavor" = "A marcação que o host aceita: `gfm`, `gitlab_md`, `gitea_md`, `common_mark`, `azure_md`, `bitbucket_md`, `html`, `jira_wiki`, `textile`, `youtrack_md`, `trello_md`, `plain_text`, `obsidian_md`. Por omissão: a do próprio item"
"ai hosting-reply --hint" = "O que quer nesta resposta (\"diga que vou ver isto amanhã\")"
"ai hosting-reply --issue_title" = "Redige a descrição de uma nova issue com este título (sem conversa)"
"ai hosting-reply --item" = "A issue ou o pull request a que responder, lido do próprio host na fonte ligada do repositório (`7` ou `#7` uma issue, `!7` um pedido): a mesma conversa que `hosting issue comments 7 --json` mostra, sem os eventos do sistema. Em vez de `--conversation`"
"ai hosting-reply --line" = "Com `--path`: a linha"
"ai hosting-reply --path" = "Redige um novo comentário de revisão neste ficheiro do pull request"
"ai hosting-reply --read_repo" = "Deixa a IA ler o repositório para este rascunho (desligado, a não ser que seja indicado ou `ai.hosting_reply.read_repository` seja true). Um agente local lê-o por si, com ferramentas só de leitura na pasta do repositório; um perfil de API recebe um contexto que o GitPoulpi constrói (os ficheiros que a conversa nomeia, resultados de pesquisa, o mapa) dentro de `ai.limits.hosting_reply_*`. De qualquer forma a IA só redige; nada é publicado"
"ai hosting-reply --refresh_context" = "Esquece o contexto e a sessão do agente guardados de rascunhos anteriores deste repositório e lê-o de novo (com `--read-repo`)"
"ai hosting-reply --continue_exchange" = "Continua a troca do último `hosting-reply` para este mesmo alvo (o mesmo `--item`, `--reply-to`, `--path`/`--line` ou `--issue-title`): as sugestões e os rascunhos anteriores voltam ao modelo como turnos anteriores, pelo que \"mais curto\" funciona. Dispensável com um agente Claude local cuja sessão é mantida (ele lembra-se). Sem a opção começa uma troca nova. Guardada na pasta de estado"
"ai hosting-reply --pr_base" = "Com `--read-repo`: a revisão base do pull request, para pôr o seu diff (contra a base de merge) no contexto"
"ai hosting-reply --pr_head" = "Com `--read-repo`: a revisão de topo (head) do pull request"
"ai hosting-reply --reply_to" = "Responde no tópico com este id (um tópico de código, um comentário ou uma discussão)"
"ai hosting-reply --review_summary" = "Redige o resumo da revisão que está a ser submetida"
"split-commit" = "Divide um commit da branch atual em vários, do mais antigo ao mais recente, segundo um plano JSON (veja `split-source` para a numeração). O último commit novo mantém a árvore original, pelo que os descendentes e a árvore de trabalho ficam inalterados; um commit já enviado precisa depois de um push forçado. Um `undo` repõe tudo. Código de saída 2 se recusado"
"split-commit --commit" = "O commit a dividir (qualquer revisão: um sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Valida o plano e lista o que ficou por atribuir; não altera nada"
"split-commit --plan" = "O plano (JSON), a partir de um caminho de ficheiro ou `-` para stdin. Uma peça é `path` mais um `hunk` opcional mais `lines` opcionais (índices nas `lines` do hunk); uma peça só com `path` é o ficheiro inteiro"
"split-commit --rest_message" = "Coloca tudo o que o plano deixa por atribuir num último commit com esta mensagem"
"split-commit --sign" = "Assina os novos commits (e os descendentes reaplicados)"
"split-source" = "As alterações de um commit numeradas para `split-commit`: cada ficheiro com os seus hunks (`id`, linhas) ou, para ficheiros que só podem ser atribuídos inteiros (binário, só modo, adicionado, eliminado, submódulo, LFS), o motivo. Só de leitura"
"split-source --commit" = "O commit (qualquer revisão: um sha, `HEAD~2`, ...)"
"rewrite" = "Reescreve o histórico em massa (identidades, datas, mensagens) a partir de uma receita: `preview` planeia sem alterar nada, `apply` executa o plano que reviu como UMA entrada de desfazer, `run` faz as duas coisas para scripts. Só `push` envia alguma coisa: faz force push das refs reescritas, cada uma com um lease"
"rewrite apply" = "Aplica uma execução pré-visualizada: move as refs como UMA entrada de desfazer (`gitpoulpi undo` repõe tudo). Nunca envia. Código de saída 2 quando é recusada (o repositório mudou desde a pré-visualização, digest errado, ...), 3 quando o plano move refs que estão num remoto e falta `--yes`"
"rewrite apply --digest" = "O digest que `rewrite preview` mostrou: o plano que reviu"
"rewrite apply --run" = "O id da execução que `rewrite preview` mostrou"
"rewrite apply --yes" = "Confirma mover refs que já foram enviadas. Sem isto, um plano assim não altera nada e o código de saída é 3"
"rewrite diff" = "O que uma regra de conteúdo fez a um ficheiro de um commit de uma execução pré-visualizada: o ficheiro antigo e o novo comparados. As linhas que uma regra de segredos remove ficam ocultas. Só leitura"
"rewrite diff --commit" = "O commit tal como está antes da reescrita (um id das linhas)"
"rewrite diff --path" = "O ficheiro, relativo à raiz do repositório"
"rewrite diff --run" = "O id da execução que `rewrite preview` mostrou"
"rewrite discard" = "Descarta uma execução pré-visualizada sem a aplicar. Descartar duas vezes não faz mal"
"rewrite discard --run" = "O id da execução que `rewrite preview` mostrou"
"rewrite preview" = "Planeia uma reescrita do histórico sem alterar nada: contagens, as refs que se moveriam, avisos e as primeiras linhas. Guarda o plano no daemon como uma execução (`run`, `digest`) para `rewrite rows` e `rewrite apply`. A pré-visualização fica também em disco, na pasta git do repositório, pelo que `rewrite apply` funciona a partir de um comando posterior, depois de reiniciar o daemon ou a partir de outra interface, sem iniciar um daemon; só `rewrite rows` precisa do daemon que pré-visualizou (um em execução, ou use `--all` na pré-visualização). Código de saída 2 quando a receita é recusada"
"rewrite preview --all" = "Mostra todos os commits alterados"
"rewrite preview --all_local" = "Reescreve todas as branches locais e tags em vez da branch atual"
"rewrite preview --committer" = "Committer dos commits reescritos: `keep` (predefinição) ou `me-now`"
"rewrite preview --include_protected" = "Reescreve também estas branches protegidas que já foram enviadas (excluídas por predefinição; repetível)"
"rewrite preview --lfs_export" = "Regra LFS: volta a transformar em ficheiros reais, em cada commit, os ponteiros LFS que correspondem a este glob (repetível). Os objetos têm de estar no armazenamento LFS local (antes, `lfs fetch`); caso contrário é recusado, com a lista"
"rewrite preview --encoding_exclude" = "Com `--reencode`: os ficheiros que deixa em paz (globs, repetível)"
"rewrite preview --encoding_fallback" = "Com `--reencode`: como é lido um ficheiro sem marca e que não é UTF-8 quando a origem é detetada (por omissão `windows-1252`)"
"rewrite preview --encoding_paths" = "Com `--reencode`: os ficheiros que converte (globs, repetível)"
"rewrite preview --eol" = "Regra de fins de linha: todos os ficheiros de texto que correspondem a `--eol-paths` passam a ter este fim de linha (`lf` para Linux e macOS, `crlf` para Windows, `cr` para o Mac clássico); os fins de linha misturados ficam uniformes e os ficheiros binários são ignorados"
"rewrite preview --eol_exclude" = "Com `--eol`: os ficheiros que deixa em paz (globs, repetível)"
"rewrite preview --eol_follow_attributes" = "Com `--eol`: lê o `.gitattributes` da raiz de cada commit: os ficheiros `-text` e `binary` são ignorados e os `eol=lf` e `eol=crlf` mantêm o seu próprio fim de linha"
"rewrite preview --eol_paths" = "Com `--eol`: os ficheiros que converte (globs, repetível; um padrão sem barra corresponde a qualquer profundidade)"
"rewrite preview --reencode" = "Regra de codificação: os ficheiros de texto que correspondem a `--encoding-paths` são convertidos para esta codificação (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). Os ficheiros binários, os que a codificação de origem não consegue ler e os carateres que o destino não consegue guardar ficam como estão e são contados"
"rewrite preview --reencode_from" = "Com `--reencode`: a codificação em que os ficheiros estão. Omitido: detetada por ficheiro (marca de ordem de bytes, UTF-8 válido, senão `--encoding-fallback`)"
"rewrite preview --strip_exec" = "Regra de modo de ficheiro: o bit de execução (100755 passa a 100644) é retirado aos ficheiros que correspondem a estes globs (repetível). O conteúdo não é tocado"
"rewrite preview --strip_exec_exclude" = "Com `--strip-exec`: os ficheiros que mantêm o bit de execução (globs)"
"rewrite preview --lfs_import" = "Regra LFS: move para o Git LFS, em cada commit, os ficheiros que correspondem a este glob (repetível; estilo `.gitattributes`: sem barra corresponde a qualquer profundidade). Precisa do git-lfs. O conteúdo vai para o armazenamento LFS local e o `.gitattributes` ganha a linha `filter=lfs`; envie os objetos depois"
"rewrite preview --lfs_min_size" = "Com `--lfs-import`: só são movidos os ficheiros com pelo menos este número de bytes"
"rewrite preview --limit" = "Quantos commits alterados mostrar (predefinição 50)"
"rewrite preview --match_email" = "Regra de identidade: corresponde a este e-mail de autor / committer"
"rewrite preview --match_name" = "Regra de identidade: corresponde a este nome de autor / committer"
"rewrite preview --prune_empty" = "Commits que uma regra de conteúdo deixa vazios: `auto` descarta-os (predefinição), `never` mantém-nos"
"rewrite preview --recipe" = "Um ficheiro de receita (TOML ou JSON, o formato do painel do TUI), ou `-` para JSON na entrada padrão"
"rewrite preview --recipe_json" = "Uma receita como texto JSON (para quem não pode escrever um ficheiro)"
"rewrite preview --refs" = "Reescreve só estas branches locais ou tags (repetível)"
"rewrite preview --remove_blobs_over" = "Regra de conteúdo: remove de todos os commits todos os ficheiros maiores do que este número de bytes"
"rewrite preview --remove_findings" = "Regra de conteúdo: remove um segredo que `rewrite scan-secrets` encontrou, pelo id do resultado (repetível), ou `all` para todos os resultados do âmbito. O daemon pesquisa de novo e resolve os ids por si: o valor nunca chega à linha de comandos, a uma receita nem a um registo"
"rewrite preview --remove_paths" = "Regra de conteúdo: remove de todos os commits os ficheiros e pastas que correspondam a este glob (repetível; um padrão sem barra corresponde a qualquer profundidade)"
"rewrite preview --replace_content" = "Regra de conteúdo `FIND=WITH`: substitui texto literal em todos os ficheiros de texto (repetível; os ficheiros binários são ignorados e contados). Para segredos, use uma regra `content_replace` na receita com `--secrets-file`"
"rewrite preview --replace_message" = "Regra de mensagem `FIND=WITH` (texto literal, repetível)"
"rewrite preview --script_params" = "Um parâmetro de script `NAME=VALUE`, dado a cada `--script` (repetível). Os nomes são os que o cabeçalho do script declara"
"rewrite preview --scripts" = "Regra de script: executa este ficheiro de script Lua em cada commit (repetível, por ordem, depois das regras das outras opções). O ficheiro é lido aqui e incorporado na receita; veja `rewrite script check` para o formato"
"rewrite preview --secrets_file" = "Um ficheiro com um segredo por linha (linhas em branco ignoradas). Os segredos são acrescentados às regras `content_replace` da receita que procuram segredos, pelo que nunca viajam na linha de comandos, numa receita guardada nem num registo"
"rewrite preview --set_email" = "Regra de identidade: o e-mail a definir"
"rewrite preview --set_name" = "Regra de identidade: o nome a definir (com `--set-email`, pelo menos um)"
"rewrite preview --shift_dates" = "Regra de data: move todas as datas por este número de segundos (negativo: para trás), mantendo o desfasamento do fuso horário de cada commit"
"rewrite preview --signatures" = "O que fazer às assinaturas dos commits reescritos: `strip`, `resign-signed` ou `resign-all`. Obrigatório quando commits assinados mudam"
"rewrite preview --since" = "Com a branch atual: só os commits depois desta revisão"
"rewrite preview --who" = "Regra de identidade: `author`, `committer` ou `both` (predefinição)"
"rewrite rows" = "Percorre por páginas os commits de uma execução pré-visualizada"
"rewrite rows --filter" = "`changed` (predefinição), `dropped`, `pushed` ou `all`"
"rewrite rows --limit" = "Linhas por página (no máximo 200)"
"rewrite rows --offset" = "Linhas a saltar"
"rewrite rows --run" = "O id da execução que `rewrite preview` mostrou"
"rewrite run" = "Pré-visualiza e aplica numa só chamada, para scripts. As mesmas recusas e códigos de saída que `preview` e `apply`; com o código de saída 3 a pré-visualização é descartada e nada muda"
"rewrite run --all_local" = "Reescreve todas as branches locais e tags em vez da branch atual"
"rewrite run --committer" = "Committer dos commits reescritos: `keep` (predefinição) ou `me-now`"
