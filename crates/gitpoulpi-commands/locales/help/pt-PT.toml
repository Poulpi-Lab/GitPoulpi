undo = "Desfaz a última operação registada no diário (commit, amend, checkout, criação/eliminação de branch). Recusa, sem alterar nada, se algo em que a operação tocou se tiver movido desde então. Código de saída 2 quando recusado, 3 quando precisa de `--yes` (um undo arriscado)"
"undo --all" = "Com `--list`: inclui as entradas que já não podem ser refeitas"
"undo --dry_run" = "Mostra o que aconteceria e não altera nada"
"undo --expect" = "Só desfaz se esta ainda for a última entrada (o seu id, como `--list` o mostra); caso contrário recusado como stale"
"undo --list" = "Lista o diário em vez disso (a mais recente por último); `--all` acrescenta as entradas que já não podem ser refeitas mas continuam fixadas"
"undo --yes" = "Avança quando o undo é arriscado (o commit já está no seu upstream, ou ficheiros da árvore de trabalho seriam substituídos). Sem isto, esse undo não altera nada e termina com o código 3"
worktree = "Worktrees ligados: lista-os, adiciona um numa branch ou num commit"
"worktree add" = "Adiciona um worktree ligado em `<path>`. Se `<start>` nomear uma branch local, faz checkout dessa branch lá (ou inicia `--branch` nela); qualquer outra revisão dá um HEAD destacado (ou inicia `--branch` aí)"
"worktree add --branch" = "Cria esta nova branch em `<start>` e faz checkout dela lá"
"worktree add --start" = "Uma branch local, ou qualquer revisão"
"worktree list" = "Todos os worktrees do repositório, o principal primeiro"
"worktree changes" = "As alterações por registar do worktree em `<path>` (com e sem seguimento, sem as ignoradas); uma lista vazia significa que está limpo"
"worktree remove" = "Remove o worktree ligado em `<path>`. Um worktree com alterações por registar é recusado, salvo com `--force` (perdem-se), `--commit-message` (faz commit de todas as alterações na sua branch primeiro; um worktree com HEAD destacado precisa também de `--commit-branch`) ou `--stash-message` (faz stash de todas as alterações, incluindo as sem seguimento, primeiro; o stash é partilhado por todos os worktrees). `--delete-branch` elimina também a sua branch (registado no diário: desfazer repõe a branch; a pasta continua apagada). A remoção em si não se pode desfazer"
"worktree remove --commit_branch" = "A branch a criar para esse commit quando o worktree tem HEAD destacado"
"worktree remove --commit_message" = "Faz commit de todas as alterações com esta mensagem antes de remover"
"worktree remove --delete_branch" = "Elimina também a branch do worktree depois de a remover"
"worktree remove --force" = "Remove mesmo com alterações por registar; perdem-se"
"worktree remove --stash_message" = "Faz stash de todas as alterações com esta mensagem antes de remover"
