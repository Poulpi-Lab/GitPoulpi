"rewrite run --refs" = "Reescreve só estas branches locais ou tags (repetível)"
"rewrite run --remove_blobs_over" = "Regra de conteúdo: remove de todos os commits todos os ficheiros maiores do que este número de bytes"
"rewrite run --remove_findings" = "Regra de conteúdo: remove um segredo que `rewrite scan-secrets` encontrou, pelo id do resultado (repetível), ou `all` para todos os resultados do âmbito. O daemon pesquisa de novo e resolve os ids por si: o valor nunca chega à linha de comandos, a uma receita nem a um registo"
