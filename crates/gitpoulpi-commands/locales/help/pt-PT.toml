"rewrite run --eol_follow_attributes" = "Com `--eol`: lê o `.gitattributes` da raiz de cada commit: os ficheiros `-text` e `binary` são ignorados e os `eol=lf` e `eol=crlf` mantêm o seu próprio fim de linha"
