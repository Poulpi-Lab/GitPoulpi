"submodule init --paths" = "Caminhos de submódulos relativos ao repositório"
"submodule list" = "Todos os submódulos com o seu estado: `uninitialized` (não clonado), `up_to_date`, `modified` (com checkout noutro commit que não o registado) ou `conflicted`"
"submodule update" = "Faz checkout dos submódulos nos commits que o repositório regista (`git submodule update`). Sem caminhos: todos"
