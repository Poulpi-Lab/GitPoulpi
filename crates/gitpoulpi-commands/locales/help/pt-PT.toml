"job cancel" = "Pára uma tarefa. Recusado (código de saída 1, nada muda) depois do ponto em que parar é seguro, por exemplo um pull que já começou a fundir. Um push cancelado pode já ter chegado ao remoto"
"job cancel --id" = "O id da tarefa, de `job list`"
"job wait" = "Espera que uma tarefa termine e mostra o seu estado final. Código de saída 0 se `Done`, 1 se falhou ou foi cancelada"
"job wait --id" = "O id da tarefa, de `job list`"
"job wait --timeout" = "Desiste após este número de segundos (código de saída 1, a tarefa continua). Omitido: espera o tempo que for preciso"
"undo-forget" = "Remove do diário de anular a entrada bloqueada do topo (operação interrompida, ou o repositório avançou entretanto) para poder anular as de baixo. Nunca toca no repositório, só no diário; a entrada já não pode ser anulada nem refeita. Código de saída 2 se a entrada do topo não está bloqueada, 3 sem `--yes`"
