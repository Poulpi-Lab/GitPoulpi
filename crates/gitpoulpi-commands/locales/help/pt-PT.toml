"search" = "Pesquisa aproximada nas branches, tags, worktrees, stashes e mensagens de commit do repositório atual, ou de todos os repositórios de uma área de trabalho, mais os pull requests e issues em cache. Os resultados vêm do melhor para o pior, com os carateres que coincidiram. Um prefixo restringe a pesquisa: `b:` branches, `t:` tags, `c:` commits, `s:` stashes, `w:` worktrees, `pr:` pull requests, `i:` issues, `r:` repositórios (só em áreas de trabalho)"
"search --kinds" = "Apenas estes tipos (repetível); por omissão todos. Um prefixo na consulta restringe ainda mais"
"search --limit" = "No máximo este número de resultados"
"search --query" = "O que procurar, prefixo incluído (`c: fix login`)"
"search --workspace" = "Pesquisa em todos os repositórios desta área de trabalho (um id; também `GITPOULPI_WORKSPACE`). Sem a opção, o repositório atual"
"workspace" = "Áreas de trabalho: grupos nomeados de repositórios, com um perfil de commit predefinido opcional. Guardadas em `workspaces.toml`, junto a `config.toml`, e partilhadas com a TUI"
