"rewrite check-signing" = "Assina uma vez um conteúdo fictício com a configuração de assinatura do repositório (`gpg.format`, `user.signingkey`, `gpg.*.program`) e verifica-o, como teste rápido antes de uma execução que volta a assinar (`--signatures resign-signed` ou `resign-all`). Mostra o programa, se funciona e quanto demorou uma assinatura (multiplique pelos commits a voltar a assinar para obter a estimativa). Pode abrir um pedido de frase-passe. Termina com 2 quando não funciona, com o motivo (`tool_missing` ou `signing_failed`)"
