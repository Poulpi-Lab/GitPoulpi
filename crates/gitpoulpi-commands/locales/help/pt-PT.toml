"ui propose split --rev" = "O commit a dividir (na branch com checkout)"
"ui propose tag" = "Abre a caixa Nova Tag com um nome (e, se anotada, uma mensagem) preenchido"
"ui propose tag --message" = "Torna-a uma tag anotada com esta mensagem"
"ui propose tag --target" = "O commit a etiquetar (por omissão: HEAD)"
"ui show" = "Move a vista do utilizador para algo"
"ui show commit" = "Seleciona um commit no Log"
"ui show commit --also" = "Mais commits a selecionar com ele (no máximo 9)"
"ui show commit --files" = "Expande a lista de ficheiros alterados do commit"
"ui show commit --focus" = "Move o foco do teclado para este painel"
"ui show commit --rev" = "Qualquer revisão (branch, tag, `HEAD~2`, um sha)"
"ui show conflict" = "Abre o editor de conflitos de merge num ficheiro em conflito, num conflito. Apenas de visualização: nada é escolhido e nada é guardado"
"ui show conflict --conflict" = "Desloca para o conflito N (a partir de 1)"
