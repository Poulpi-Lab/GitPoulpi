ai = "Auxiliares de IA (desativados salvo `ai.enabled = true`): mostram uma mensagem de commit gerada, ou explicam um commit ou as alterações de trabalho"
"ai --print_sent" = "Mostra o que seria enviado ao modelo (o texto do sistema e do utilizador depois de os segredos serem ocultados e os ficheiros sensíveis excluídos) e não envia nada. Requer `ai.enabled = true`, mas nenhuma chave nem rede"
"ai --send_all" = "Envia cada entrada por inteiro, mesmo acima do seu limite `ai.limits.*`. Sem isto, uma entrada acima de um limite é truncada (um conflito é recusado) e a resposta diz o que foi cortado em `truncated: [{part, detail?, bytes, limit, setting}]`"
"commit --send_all" = "Com `--ai`: envia o diff completo mesmo acima de `ai.limits.diff_bytes`. Sem isto, um diff maior é truncado e a resposta di-lo (`truncated`)"
"hosting review suggest --send_all" = "Envia cada entrada por inteiro, mesmo acima do seu limite `ai.limits.*` (o diff, o diff de um ficheiro, a descrição, os comentários existentes, os ficheiros de contexto). Sem isto, uma entrada acima de um limite é truncada e a resposta diz o que foi cortado em `truncated`"
"stash push --send_all" = "Com `--ai`: envia o diff completo mesmo acima de `ai.limits.diff_bytes`. Sem isto, um diff maior é truncado e a resposta di-lo (`truncated`)"
"ai commit-message" = "Mostra a mensagem de commit que a IA propõe para as alterações em stage (ou para todas as alterações quando nada está em stage). Não faz commit de nada"
"ai explain" = "Explica um commit (por omissão HEAD) ou, com --wip, as alterações de trabalho"
"ai resolve-conflict" = "Mostra a resolução que a IA sugere para UM conflito de merge de um ficheiro em conflito (`--conflict N`, a partir de 1; opcional quando o ficheiro tem um único conflito). Apenas mostra: nada é escrito nem colocado em stage, pelo que a decisão cabe a quem chama (`conflicts resolve --content-file` aplica um resultado de ficheiro completo). Requer `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Qual conflito do ficheiro, a partir de 1"
"ai resolve-conflict --path" = "O ficheiro em conflito, relativo à raiz do repositório"
autostash = "O auto-stash pendente: o GitPoulpi guardou alterações locais para executar um checkout, merge, rebase ou pull e ainda não as devolveu"
"ai review-context" = "Mostra ou define o que um rascunho de revisão de código ✦ recebe além do diff (`[ai.review]`): o CLAUDE.md e o AGENTS.md do repositório, mais um ficheiro (um caminho ou uma ligação) e se um agente local é executado no repositório. Sem `--repo` nem `--project` é a predefinição global; `--repo PATH` é o valor próprio de um repositório clonado, `--project HOST/PROJECT` o de um repositório não clonado. Sem uma opção de definição, mostra os valores (`effective` é o que uma revisão recebe); com uma, guarda-a e mostra o resultado. Não precisa de modelo e funciona com a IA desativada"
"ai review-context --agents_md" = "Dar ao modelo o AGENTS.md do repositório"
"ai review-context --claude_md" = "Dar ao modelo o CLAUDE.md do repositório"
"ai review-context --context_file" = "Mais um ficheiro: um caminho relativo à raiz do repositório, um caminho absoluto ou uma ligação para um ficheiro de um servidor de código"
"ai review-context --no_context_file" = "Nenhum ficheiro extra"
"ai review-context --no_extra_file" = "Nenhum ficheiro extra para o repositório ou projeto, diga o que disser o valor global (`on`, o predefinido quando indicado sozinho); `off` volta a seguir o valor global"
"ai review-context --project" = "Um repositório não clonado, como `HOST/PROJECT` (`github.com/owner/name`)"
"ai review-context --reset" = "Com `--repo` ou `--project`: esquece os valores próprios do repositório (volta a seguir os globais) antes de aplicar as opções"
"ai review-context --run_in_repo" = "Executar um agente local no repositório (`yes`), não o executar aí (`no`) ou conforme o seu perfil de IA (`profile`). Não se aplica a `--project`"
"autostash start-over" = "Recomeçar: descarta as alterações da árvore de trabalho nos ficheiros do stash (fica uma cópia em `refs/gitpoulpi-backup/`), desfaz a operação que fez o auto-stash (pull, checkout, merge, rebase) e depois faz o pop do stash no commit original. Pára com o stash intacto se algum passo falhar. Código de saída 1 se recusado, 3 quando é preciso `--yes`"
"autostash start-over --dry_run" = "Mostra o que aconteceria e não altera nada"
"autostash start-over --yes" = "Avança; sem isso nada muda e o código de saída é 3"
blame = "Atribuição linha a linha de um ficheiro numa revisão"
"blame --at" = "Revisão a analisar (por omissão: HEAD)"
"branch delete-remote" = "Elimina uma branch de um remoto, mantendo qualquer branch local com esse nome"
"branch fast-forward" = "Avança `<branch>` até `<target>`, apenas se for um fast-forward (um histórico divergente é recusado, nada se move). A branch com checkout leva consigo a árvore de trabalho, como `git merge --ff-only`; em qualquer outra branch só a referência é movida"
"branch fast-forward --target" = "Qualquer revisão (por omissão: HEAD)"
"branch set-upstream" = "Faz `<branch>` seguir `<upstream>` (`origin/main`)"
"branch track" = "Cria uma branch local que segue uma branch de seguimento remoto e faz checkout dela. `<upstream>` escreve-se como a listagem de referências o escreve (`origin/feature/login`); `--name` assume por omissão a parte da branch"
"branch unset-upstream" = "Remove o upstream de `<branch>`"
"checkout --autostash" = 'Guarda em stash as alterações locais que impedem a operação, executa-a e depois aplica o stash (o que `general.auto_stash = "always"` faz)'
"cherry-pick --commits" = "Commits a aplicar, por ordem. Omitido quando `--plan` é indicado"
"cherry-pick --plan" = "Um `Vec<RebaseStep>` em JSON (mesmo formato de `rebase --plan`; ver `rebase-plan`), a partir de um caminho de ficheiro ou `-` para stdin: os passos são aplicados com cherry-pick pela ordem da lista. Só as ações `Pick` e `Drop` fazem sentido aqui (`Drop` ignora o commit); qualquer outra ação é recusada. Não pode ser combinado com commits posicionais"
"clone --branch" = "Faz checkout desta branch em vez do HEAD por omissão do remoto"
"clone --depth" = "Trunca o histórico a este número de commits (`git clone --depth`)"
"clone --no_lfs" = "Deixa os ficheiros Git LFS como ponteiros em vez de descarregar o seu conteúdo após o clone"
"clone --origin" = "Dá ao novo remoto um nome diferente de `origin`"
"clone --recurse_submodules" = "Clona também os submódulos"
"commit --ai" = "Deixa a IA escrever a mensagem a partir do diff em stage, usando as instruções de mensagem de commit do repositório (Definições > IA). Requer `ai.enabled = true` e um perfil configurado"
"commit --message" = "A mensagem de commit. Obrigatória, salvo se --ai a escrever"
"commit --no_verify" = "Ignora os hooks do commit (`pre-commit`, `commit-msg`), como `commit --no-verify`"
completions = "Imprime um script de completação da shell no stdout (bash, zsh, fish, powershell ou elvish), por ex. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Aborta a operação em curso: HEAD, o índice e a árvore de trabalho voltam ao estado anterior. Descarta as resoluções feitas entretanto"
"conflicts skip" = "Salta o cherry-pick ou o revert em curso (ou o commit em que um rebase parou): HEAD, o índice e a árvore de trabalho voltam ao HEAD. A saída quando ficou vazio (a alteração já está aplicada). Um merge não tem nada a saltar"
"conflicts check" = "Um merge de HEAD na branch de onde partiu daria conflitos, e em que ficheiros? Nada é alterado (é um merge em memória). A base é o destino do pull request conhecido da branch; na falta dele, a branch que os padrões de Branches base permitem com menos commits desde a bifurcação. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Desativado quando `general.conflict_detection` ou o interruptor do repositório está desligado"
"conflicts list" = "Os ficheiros em conflito, cada um com o texto dos seus três lados. Com `--names-only`: apenas o caminho, o tipo de conflito e os oids dos stages (nenhum blob é lido; barato num merge grande)"
"conflicts resolve" = 'Resolve um ficheiro e coloca-o em stage (o ficheiro deixa de estar em conflito). Exatamente um de `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` ou `--delete`. A e "ours" são o lado atual (`HEAD`; durante um rebase, a branch sobre a qual se faz rebase), B e "theirs" o lado recebido. Nunca edite os marcadores de conflito à mão: escolha, ou escreva o texto final num ficheiro'
"conflicts resolve --both" = "Mantém os dois lados de cada conflito (A depois B), e o merge do próprio git em todo o resto"
"conflicts resolve --content_file" = "O texto final do ficheiro, exatamente (`-` lê o standard input)"
"conflicts resolve --delete" = "Aceita a eliminação: remove o ficheiro (`git rm`)"
"conflicts resolve --encoding" = "Com `--content-file`: escreve o texto nesta codificação (uma etiqueta WHATWG como `windows-1252`) em vez de UTF-8"
"conflicts resolve --expect" = "Os oids dos stages com base nos quais a decisão foi tomada, `base,ours,theirs` (use `-` para um stage em falta). A chamada é recusada como `stale` quando o índice já não contém exatamente estes. `--both` e `--pick` verificam sempre os stages que leem"
"conflicts resolve --no_stage" = "Escreve o ficheiro da árvore de trabalho mas deixa-o em conflito (uma gravação simples)"
"conflicts resolve --ours" = "Igual a `--side ours`"
"conflicts resolve --pick" = "Uma escolha por número de conflito: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = ambos por essa ordem). Todos os conflitos precisam de uma, salvo se `--default` cobrir os restantes"
"conflicts resolve --pick_default" = "Com `--pick`: a escolha para todos os conflitos não listados"
"conflicts resolve --side" = "Toma o ficheiro inteiro de um stage, sem fusão automática"
"conflicts resolve --theirs" = "Igual a `--side theirs`"
"conflicts resolve --theirs_first" = "Com `--both`: B depois A"
"conflicts show" = "Um ficheiro em conflito tal como o editor de merge o vê: as etiquetas dos painéis, os três lados e as regiões de conflito numeradas (`--json` é o documento completo). As regiões fundidas que o git resolveu sozinho não são listadas; ficam no resultado de `resolve --both`/`--pick`"
"conflicts show --conflict" = "Apenas o conflito N (a partir de 1)"
"conflicts state" = "O merge, rebase, cherry-pick ou revert em curso (`null` quando não há nenhum)"
"conflicts unresolve" = "Volta a pôr em conflito um ficheiro resolvido durante esta operação (marcadores de novo). Recusado quando ainda está em conflito ou não foi resolvido enquanto a operação decorria"
daemon = '`gitpoulpi server ...` é um alias visível - o proprietário chama a este grupo "o servidor" e escreve `gp server stop`'
"daemon restart" = "`daemon stop` seguido de `daemon start`"
"daemon run" = "Executa o daemon desta sessão em primeiro plano (bloqueia; Ctrl-C para parar, ou um `daemon stop`/`daemon restart` enviado de outro lado). É o que `daemon start` lança em separado, e que um terminal dedicado também pode executar diretamente"
"daemon start" = "Inicia o daemon desta sessão como processo em segundo plano separado (ou indica que já está em execução). `--backend` fixa o backend que o processo lançado deve usar; se omitido, o processo lançado resolve `general.default_backend` por si"
"daemon status" = "Indica se o daemon desta sessão está à escuta e, se sim, a sua porta, PID, tempo de atividade, backend e versão de compilação"
"daemon stop" = "Pede ao daemon desta sessão que termine de forma ordenada, recorrendo a terminar o PID registado apenas se não responder a tempo e apenas se for um daemon autónomo (nunca um embutido num TUI em execução)"
"daemon stop --all" = "Para o daemon de todas as sessões para as quais `session list` indica um ficheiro de porta, não apenas este"
discard = "Descarta as alterações *não staged* de um ficheiro na árvore de trabalho: um hunk (`--hunk`), algumas das suas linhas (`--hunk --lines`), ou - só com `--file` - todas as alterações não commitadas ao ficheiro, incluindo as que estão em stage (um ficheiro não rastreado é eliminado). Os hunks e as linhas são numerados como `gitpoulpi diff --json` numera o diff não staged. Tudo o que é descartado fica guardado num snapshot de segurança, pelo que `gitpoulpi undo` o recupera (incluindo ficheiros não rastreados). Sem confirmação: esta é a interface para scripts"
"discard --lines" = "Índices de linhas separados por vírgulas dentro de `--hunk`"
"fetch --all" = "Faz fetch de todos os remotos configurados"
"fetch --prune" = "Remove as branches de seguimento remoto que o remoto já não tem"
"fetch --prune_tags" = "Elimina também as tags locais que o remoto eliminou (só as que estavam nele: uma tag que nunca foi enviada fica como está). É o `fetch.pruneTags` do Git, mais restrito; desativado salvo pedido"
"fetch --remote" = "Omitido: o remoto por omissão do repositório (ver `remote default`)"
gitpoulpi = "Cliente Git TUI leve e multiplataforma, utilizável por script via CLI/MCP."
"gitpoulpi --add" = "Abre uma pasta num novo separador do GitPoulpi que já está aberto, em vez de iniciar outro (`gp -a`, `gp --add ../outra`). PATH é, por omissão, a pasta atual e resolve-se para o repositório que a contém. Uma sessão aberta: recebe o separador e a sua janela passa para a frente se o ambiente de trabalho o permitir. Várias: escolha uma numa lista numerada (ou indique `--session NOME`). Nenhuma: o GitPoulpi inicia normalmente, nessa pasta. Não aceita subcomando; com `--json` imprime um objeto (`action` é `joined` ou `cancelled`), código de saída 0 quando o separador está aberto, 3 quando uma janela ocupada o ofereceu no chip da barra de estado"
"gitpoulpi --no_raise" = "Com `--add`: não pede à janela que traga o seu terminal para a frente"
"gitpoulpi --backend" = "Em que `GitBackend` corre o daemon deste comando, substituindo `general.default_backend` em config.toml e `GITPOULPI_GENERAL_DEFAULT_BACKEND` (as flags estão no topo da escala de precedência - ver docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
Em que `GitBackend` corre o daemon deste comando, substituindo `general.default_backend` em config.toml e `GITPOULPI_GENERAL_DEFAULT_BACKEND` (as flags estão no topo da escala de precedência - ver docs/user/config-reference.md).

Seleciona o backend de um daemon que este comando *inicia*. Uma sessão cujo daemon já está em execução mantém o backend com que esse daemon foi construído; o `gitpoulpi` não tem forma de trocar o backend de um daemon ativo por baixo dos clientes que já o subscreveram, e fingir o contrário seria o mesmo não-efeito silencioso que esta flag existe para evitar."""
"gitpoulpi --cwd_file" = """Ficheiro onde o TUI escreve a pasta do separador ativo ao sair ("Quit and cd here", ou sempre com `ui.tab_dir_follow = "auto"`). Destinado ao wrapper que `gitpoulpi shell-init` imprime; ignorado por todos os subcomandos, pois só o TUI tem separadores"""
"gitpoulpi --json" = "Emite JSON estruturado em vez de saída legível por humanos"
"gitpoulpi --lang" = "Idioma do texto de `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
Idioma do texto de `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Só as explicações são traduzidas - os nomes de comandos e flags nunca mudam - e `--help` fica em inglês salvo se isto for indicado (o ambiente é deliberadamente ignorado, para que os scripts tenham uma saída estável). Exemplo: `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Repositório sobre o qual atuar. Por omissão, o repositório que contém a pasta atual, pelo que `gitpoulpi status` se comporta como `git status`; um agente que controle vários repositórios passa isto em vez de mudar de pasta"
"gitpoulpi --session" = "Sessão nomeada a usar. Se omitida, é derivada da raiz do repositório atual (ver `gitpoulpi_config::default_session_name`), pelo que dois repositórios têm dois daemons independentes enquanto tudo o que é aberto dentro de um repositório partilha um só. Indique-a para forçar dois repositórios numa só sessão, ou para nomear uma sessão explicitamente. O valor é sanitizado antes de ser usado - passa a ser um nome de ficheiro"
"hosting checkout-pr" = "Faz checkout de um pull/merge request, incluindo um vindo de um fork: obtém o seu head (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) para a branch local `pr/<n>` (`mr/<n>` no GitLab), a segui-la, e muda para ela"
"hosting checkout-pr --id" = "Qual integração (ver `hosting prs`)"
"hosting checkout-pr --no_checkout" = "Apenas faz fetch e cria/atualiza a branch; fica onde está"
"hosting checkout-pr --number" = "O número do PR (GitHub) ou o `iid` do MR (GitLab)"
"hosting checkout-pr --remote" = "O remoto onde o pedido existe. Por omissão, aquele de onde o projeto foi resolvido, senão o do repositório"
"hosting clone" = "Clona um projeto de `projects` pelo seu caminho completo, resolvendo o URL de clone através do alojamento em vez de obrigar o utilizador a colar um"
"hosting clone --https" = "Clona por HTTPS em vez de SSH"
"hosting clone --project" = "O caminho completo do projeto, tal como `hosting projects` o imprime"
"hosting edit-url" = "Imprime o URL onde um pull/merge request é editado (a vista `.../edit` do GitLab; o GitHub edita no próprio local, na página do pedido). Com um número, esse pedido; caso contrário, o de `--branch` (por omissão: a branch com checkout). Segue a ligação do repositório ao pull/merge request como `prs`. Só abre o navegador com `--open`"
"hosting edit-url --branch" = "Encontra o pedido pela sua branch de origem"
"hosting edit-url --number" = "O número do pedido (`53` para `!53` / `#53`)"
"hosting edit-url --open" = "Abre também o URL no navegador do sistema"
"hosting file" = "Lê um ficheiro de um projeto numa revisão através da API do servidor, sem clone: texto tal como está, outros bytes em base64 (`encoding`). Termina com o código 1 e um erro quando o ficheiro não existe nessa revisão"
"hosting file --id" = "Qual a integração (ver `hosting list`); opcional quando só há uma configurada"
"hosting file --path" = "O caminho dentro do projeto, como `CLAUDE.md` ou `src/main.rs`"
"hosting file --project" = "O projeto: `owner/name` no GitHub, `group/sub/project` no GitLab"
"hosting file --rev" = "A revisão: uma branch, tag ou commit. Por omissão, a branch predefinida do projeto"
"hosting integrations" = "Gere os perfis de integração configurados (`[[integrations]]`)"
"hosting integrations add" = "Adiciona um perfil de qualquer tipo que tenha um cliente"
"hosting integrations add --id" = "Por omissão, o nome do tipo (`gitlab`, `gitlab-2`, ...)"
"hosting integrations add --kind" = "`github`, `github_enterprise`, `gitlab`, `gitlab_self_managed`, `azure_devops`, `azure_devops_server`, `bitbucket`, `jira_cloud`, `jira_data_center`, `trello`, `gitea`, `forgejo`, `linear`, `youtrack`, `redmine`, `gerrit` ou `local_markdown`"
"hosting integrations add --name" = "Nome a apresentar"
"hosting integrations add --url" = "A raiz web da instância. Obrigatória para os tipos auto-alojados e o Jira"
"hosting integrations list" = "Os perfis configurados, sem os seus tokens"
"hosting integrations radar" = "Mostra ou altera as definições do Radar de um perfil (`[integrations.radar]`): que listas de toda a conta o `hosting radar` e a obtenção do Radar vão buscar, os namespaces a pesquisar e o que faz a revisão de um pedido não clonado. Sem opções, apenas mostra as definições atuais"
"hosting integrations radar --assigned_issues" = "Issues abertas atribuídas a si, em todos os repositórios"
"hosting integrations radar --clear_namespaces" = "Esquecer os namespaces guardados: os seus mais todas as associações"
"hosting integrations radar --id" = "O perfil"
"hosting integrations radar --include_drafts" = "Manter os pedidos em rascunho nas listas da conta"
"hosting integrations radar --namespaces" = "Um namespace (organização, grupo) onde pesquisar pedidos abertos; repita a opção ou separe por vírgulas. Substitui a lista guardada"
"hosting integrations radar --open_requests" = "Todos os pedidos abertos dos seus namespaces"
"hosting integrations radar --review_mode" = "O que faz a revisão de um pedido não clonado"
"hosting integrations radar --review_requests" = "Pedidos à espera da sua revisão, em todos os repositórios"
"hosting integrations remove" = "Remove um perfil e elimina o seu token guardado"
"hosting integrations test" = "Verifica o token do perfil junto do seu alojamento: utilizador, âmbitos, validade"
"hosting issue" = "Cria issues no projeto ligado ao repositório atual"
"hosting issue create" = "Abre uma issue no projeto a que a fonte de ISSUES do repositório está ligada (`hosting link issues`), ou naquele que `--id` resolve a partir do remoto. Ação para o exterior: publica no alojamento"
"hosting issue create --body" = "A descrição da issue"
"hosting issue create --body_file" = "Lê a descrição deste ficheiro (`-` lê o stdin)"
"hosting issue create --id" = "Qual integração (ver `hosting issues`)"
"hosting issue create --labels" = "Uma etiqueta a aplicar; repita a flag ou separe por vírgulas"
"hosting issue create --title" = "O título da issue"
"hosting issue create --web" = "Imprime a página de nova issue pré-preenchida do alojamento em vez de chamar a API (não exige token)"
"hosting issues" = "Issues do projeto do repositório atual"
"hosting issues --assigned" = "Apenas as atribuídas a si"
"hosting board --id" = "Qual a integração (ver `hosting issues`)"
"hosting board move --column" = "O nome da coluna, como o `hosting board` o imprime"
"hosting board move --id" = "Qual a integração (ver `hosting issues`)"
"hosting board move --reference" = "O cartão: o seu número ou a sua própria referência (`12`, `#12`, `ABC-12`, `AB#12`)"
"hosting board move" = "Move um cartão para uma coluna: uma mudança de estado, uma transição do fluxo de trabalho (Jira), um estado do work item (Azure DevOps), uma lista (Trello) ou uma troca de etiqueta (GitHub, GitLab, Gitea, Forgejo). Um movimento para o qual o fornecedor não tem caminho é recusado com o motivo. Ação para o exterior: escreve no host"
"hosting board show --id" = "Qual a integração (ver `hosting issues`)"
"hosting board show" = "As colunas do quadro, cada uma com os seus cartões. Só de leitura"
"hosting board" = "O quadro de issues do projeto associado ao repositório atual: as suas colunas com os respetivos cartões, as mesmas colunas do quadro da TUI (um estado, uma lista ou uma etiqueta por coluna). Sem subcomando, o mesmo que `board show`"
"hosting link" = "Liga a lista de pull/merge requests ou de issues deste repositório a um perfil de fornecedor e a um dos seus repositórios, ou remove a ligação (sem flag, mostra a ligação). `prs` / `issues` não obtêm nada até uma fonte ser ligada; é a mesma ligação que as secções da barra lateral do TUI guardam (`pulls_source` / `issues_source` em `.gitpoulpi/repo-state.toml`)"
"hosting link --clear" = "Remove a ligação da lista: nada é obtido até voltar a ser ligada"
"hosting link --id" = "O perfil a ligar. Sem `--project`, usa-se o repositório que os remotos nomeiam no alojamento desse perfil"
"hosting link --kind" = "Qual lista"
"hosting link --project" = "O repositório do fornecedor (`owner/name`, `group/sub/proj`)"
"hosting list" = "As integrações configuradas, sem os seus tokens"
"hosting login" = "Valida um token e guarda-o sob o `token_ref` do perfil, memorizando a quem pertence. O token é lido do stdin (`--token-stdin`), nunca de um argumento, para não ficar no histórico da shell. Não exposto por MCP: um segredo não deve passar pelo registo de chamadas de ferramentas de um agente"
"hosting login --id" = "Qual integração. Opcional quando só existe uma configurada"
"hosting login --token_stdin" = "Lê o token do stdin (obrigatório; uma linha, a mudança de linha final é ignorada)"
"hosting logout" = "Elimina o token guardado do perfil e esquece o utilizador ligado; o próprio perfil mantém-se"
"hosting open" = "Imprime o URL web de um pull request ou issue do projeto do repositório atual. Só abre o navegador do sistema com `--browser`"
"hosting open --browser" = "Abre também o URL no navegador do sistema"
"hosting pr" = "Abre um pull request (GitHub, Gitea, Forgejo, Bitbucket, Azure DevOps) ou merge request (GitLab) a partir de uma branch do repositório atual"
"hosting pr --id" = "Qual integração (`[[integrations]] id`). Opcional quando só existe uma configurada"
"hosting pr --source" = "A branch a partir da qual o abrir. Por omissão, a branch com checkout"
"hosting pr --target" = "A branch contra a qual o abrir. Por omissão, a branch por omissão do remoto quando é possível saber, senão `main`/`master` quando um deles existe"
"hosting pr --title" = "Por omissão, a linha de assunto do commit de ponta da branch de origem"
"hosting pr --web" = "Imprime o URL de comparação/novo pedido em vez de chamar a API do alojamento. É também o que acontece automaticamente sem integração configurada para este remoto, ou sem token para ela"
"hosting pr-for-branch" = "O pull/merge request que melhor representa uma branch (aberto, depois rascunho, depois integrado, depois fechado; o mais recente primeiro)"
"hosting pr-for-branch --branch" = "Por omissão, a branch com checkout"
"hosting projects" = "Todos os projetos que o token da integração consegue ver"
"hosting projects --filter" = "Substring sem distinção de maiúsculas/minúsculas sobre o caminho do projeto"
"hosting projects --id" = "Qual integração (`[[integrations]] id`). Opcional quando só existe uma configurada"
"hosting prs" = "Pull/merge requests do projeto do repositório atual"
"hosting prs --id" = "Qual integração. Sem isto usa-se a fonte de pull/merge requests ligada ao repositório (ver `hosting link`); um repositório sem ligação não obtém nada. Com isto, o projeto que o remoto deste repositório nomeia nesse perfil"
"hosting prs --mine" = "Apenas os que abriu"
"hosting prs --review_requested" = "Apenas os que aguardam a sua revisão"
"hosting prs --state" = "`open` (por omissão), `closed` (inclui integrados) ou `all`"
"hosting radar" = "As listas de toda a conta para o Radar: os pedidos à espera da sua revisão, todos os pedidos abertos dos seus namespaces e as issues atribuídas a si, em todos os repositórios de cada perfil (GitHub, GitLab, Gitea, Forgejo, Azure DevOps, Bitbucket Data Center, Gerrit), clonados ou não. Sem `--what`, decidem as definições `[integrations.radar]` de cada perfil (ver `hosting integrations radar`); a resposta é reutilizada durante cinco minutos, salvo com `--refresh`. Só de leitura"
"hosting radar --ids" = "Que perfil; repita a opção para vários. Sem ela, todos os perfis ativos de um tipo suportado"
"hosting radar --include_drafts" = "Manter também os pedidos em rascunho"
"hosting radar --refresh" = "Perguntar ao servidor mesmo que exista uma resposta recente em cache"
"hosting radar --what" = "O que listar, sejam quais forem as definições do perfil: `review` (à espera da sua revisão), `open` (todos os pedidos abertos), `issues` (atribuídas a si) ou `all`"
"hosting review comment --project" = "Reveja um projeto que não é o repositório atual (sem necessidade de clone): `owner/name` no GitHub, `group/sub/project` no GitLab. `--id` indica então a integração, se houver várias configuradas"
"hosting review diff" = "O diff de um pull/merge request, ficheiro a ficheiro com os respetivos hunks (`files[].diff.hunks`). Num repositório, obtém as refs do pedido e faz o diff localmente; com `--api`, ou com `--project` (sem repositório), lê antes o diff através da API do servidor, o que dispensa o clone. Um ficheiro cujo patch o servidor deixou de fora (demasiado grande) tem `omitted` definido e não tem hunks"
"hosting review diff --api" = "Ler o diff através da API do servidor, mesmo dentro de um clone"
"hosting review diff --file" = "Apenas o diff deste ficheiro"
"hosting review diff --id" = "Qual a integração (ver `hosting prs`)"
"hosting review diff --number" = "O número do PR (GitHub) ou o `iid` do MR (GitLab)"
"hosting review diff --project" = "Reveja um projeto que não é o repositório atual (sem necessidade de clone): `owner/name` no GitHub, `group/sub/project` no GitLab. `--id` indica então a integração, se houver várias configuradas"
"hosting review diff --remote" = "O remoto onde o pedido existe (apenas diff local). Por omissão, aquele de onde o projeto foi resolvido, senão o predefinido do repositório"
"hosting review reply --project" = "Reveja um projeto que não é o repositório atual (sem necessidade de clone): `owner/name` no GitHub, `group/sub/project` no GitLab. `--id` indica então a integração, se houver várias configuradas"
"hosting review resolve --project" = "Reveja um projeto que não é o repositório atual (sem necessidade de clone): `owner/name` no GitHub, `group/sub/project` no GitLab. `--id` indica então a integração, se houver várias configuradas"
"hosting review show --project" = "Reveja um projeto que não é o repositório atual (sem necessidade de clone): `owner/name` no GitHub, `group/sub/project` no GitLab. `--id` indica então a integração, se houver várias configuradas"
"hosting review submit --project" = "Reveja um projeto que não é o repositório atual (sem necessidade de clone): `owner/name` no GitHub, `group/sub/project` no GitLab. `--id` indica então a integração, se houver várias configuradas"
"hosting review suggest --agents_md" = "Dar ao modelo o AGENTS.md do repositório, nesta execução"
"hosting review suggest --claude_md" = "Dar ao modelo o CLAUDE.md do repositório (lido na branch a que o pedido se destina), nesta execução"
"hosting review suggest --context_file" = "Mais um ficheiro para esta execução: um caminho relativo à raiz do repositório, um caminho absoluto ou uma ligação para um ficheiro de um servidor de código"
"hosting review suggest --no_context_file" = "Nenhum ficheiro extra nesta execução, diga o que disserem as predefinições"
"hosting review suggest --project" = "Reveja um projeto que não é o repositório atual (sem necessidade de clone): `owner/name` no GitHub, `group/sub/project` no GitLab. `--id` indica então a integração, se houver várias configuradas"
"hosting review suggest --run_in_repo" = "Executar um agente local no repositório (`yes`), não o executar aí (`no`) ou conforme o seu perfil de IA (`profile`), nesta execução. Não se aplica a `--project` (não há checkout)"
"hosting review threads --project" = "Reveja um projeto que não é o repositório atual (sem necessidade de clone): `owner/name` no GitHub, `group/sub/project` no GitLab. `--id` indica então a integração, se houver várias configuradas"
"hosting ssh-key" = "Gera um par de chaves ed25519 e envia a metade pública"
"hosting ssh-key create" = "Gera um novo par e envia a metade pública. Recusa substituir um ficheiro de chave existente"
"hosting ssh-key create --no_upload" = "Gera o par mas não o envia para lado nenhum"
"hosting ssh-key create --path" = "Onde escrever a chave privada. Por omissão `~/.ssh/id_ed25519`"
"hosting ssh-key create --title" = "O nome com que a chave aparece no alojamento. Por omissão `gitpoulpi@<hostname>`"
"hosting ssh-key delete" = "Remove uma chave pública da conta no alojamento (pelo id que `ssh-key list` indica). Os ficheiros de chave locais não são tocados"
"hosting ssh-key delete --id" = "Qual integração"
"hosting ssh-key delete --key_id" = "O id da chave no alojamento"
"hosting ssh-key list" = "As chaves públicas já presentes na conta"
"hosting use" = "Fixa qual perfil de integração responde pelo repositório atual (ou, sem nenhuma flag, mostra o que está em vigor)"
"hosting use --clear" = "Remove a fixação, voltando a resolver pelo alojamento do remoto"
"hosting use --id" = "O perfil a fixar"
"hosting assignment" = "Mostra, bloqueia ou permite a atribuição de pessoas nas issues e pull request do repositório atual (sem nenhuma das opções, mostra o que está em vigor). Bloqueada: toda a atribuição é recusada (código de saída 2, motivo `assignment_blocked`), seja qual for a superfície; os responsáveis existentes continuam visíveis. Só uma pessoa pode voltar a permitir"
"hosting assignment --allow" = "Voltar a permitir a atribuição (só uma pessoa)"
"hosting assignment --block" = "Recusar toda a atribuição neste repositório"
ignore = "Acrescenta um padrão a um `.gitignore` (por omissão o da raiz do repositório). Não faz nada quando o padrão já é uma linha dele. Reversível com `gitpoulpi undo`, que repõe o ficheiro como estava (ou o remove quando não existia)"
"ignore --file" = "`.gitignore` relativo ao repositório a que acrescentar (por omissão `.gitignore`)"
"ignore --pattern" = "A linha a adicionar, por ex. `*.log`, `/build` ou `docs/tmp/`"
lfs = "Git LFS: ficheiros grandes guardados fora do histórico do repositório. Requer o programa `git-lfs` para tudo o que move ou converte ficheiros; `status` e `files` funcionam sem ele"
"lfs fetch" = "Descarrega objetos LFS para o armazém local (`git lfs fetch`), sem tocar na árvore de trabalho"
"lfs fetch --all" = "Todas as referências, não apenas a atual"
"lfs fetch --remote" = "Omitido: o remoto por omissão do repositório (ver `remote default`)"
"lfs files" = "Os ficheiros ponteiro LFS no índice (ou em `--at`), indicando se cada objeto real está no armazém LFS local"
"lfs files --at" = "Revisão a listar (por omissão: o índice)"
"lfs install" = "Configura os filtros e hooks do LFS (`git lfs install`), apenas para este repositório salvo `--user`"
"lfs install --user" = "Instala na configuração global do git do utilizador em vez deste repositório"
"lfs lock" = "Bloqueia um ficheiro para que mais ninguém o possa alterar até o desbloquear"
"lfs lock --remote" = "Omitido: o remoto por omissão do repositório"
"lfs locks" = "Os bloqueios de ficheiros LFS no servidor: quem detém que ficheiro. Requer um servidor com suporte de bloqueio (GitHub, GitLab, Gitea, ...); usa as credenciais do próprio remoto"
"lfs locks --remote" = "Omitido: o remoto por omissão do repositório"
"lfs prune" = "Elimina objetos antigos, já enviados, do armazém LFS local"
"lfs pull" = "Descarrega objetos LFS e substitui os ficheiros ponteiro na árvore de trabalho pelo conteúdo real (`git lfs pull`)"
"lfs pull --remote" = "Omitido: o remoto por omissão do repositório"
"lfs checkout" = "Escreve o conteúdo real dos ficheiros ponteiro LFS da árvore de trabalho a partir do armazém LFS local (`git lfs checkout`). Offline"
"lfs checkout --paths" = "Apenas estes caminhos (relativos à raiz do repositório); omitido: todos os ponteiros da árvore de trabalho"
"lfs push" = "Envia objetos LFS (`git lfs push`)"
"lfs push --all" = "Todas as referências, não apenas a branch atual"
"lfs push --remote" = "Omitido: o remoto por omissão do repositório"
"lfs status" = "O `git-lfs` está instalado, este repositório usa LFS, que padrões estão rastreados, os filtros e o hook estão instalados. Nunca falha por faltar o `git-lfs`: a resposta di-lo"
"lfs track" = "Encaminha padrões de ficheiros através do LFS (`git lfs track`). Edita `.gitattributes` e deixa-o fora de stage"
"lfs track --lockable" = "Torna os ficheiros só de leitura até serem bloqueados"
"lfs track --renormalize" = "Volta também a pôr em stage os ficheiros já commitados que correspondam, para que o próximo commit guarde ponteiros (o histórico não é reescrito)"
"lfs unlock" = "Liberta um bloqueio. O bloqueio de outra pessoa exige `--force`, que o quebra"
"lfs unlock --force" = "Quebra um bloqueio detido por outra pessoa"
"lfs unlock --remote" = "Omitido: o remoto por omissão do repositório"
"lfs untrack" = "Deixa de encaminhar padrões através do LFS (`git lfs untrack`)"
"log --count" = "Mostra só quantos commits tem o percurso (`{\"total\": N}`), ignorando `--limit` e `--skip`: o que a barra de estado do TUI mostra a seguir à barra. Conta sem carregar nenhum commit"
"log --path" = "Apenas commits que tocam neste caminho (repetível) - `git log -- <path>`. É a consulta da vista de Histórico do Ficheiro"
"log --skip" = "Ignora os primeiros N commits da travessia antes de aplicar `--limit`. Com `--limit` pagina o histórico: a página `n` é `--skip <n*limit> --limit <limit>`, e as páginas cobrem a travessia exatamente (verificado por contrato em `check_log_skip_pages_history`)"
"log --format" = "Apresenta os commits noutro formato. `mermaid` imprime um script Mermaid `gitGraph` (cole-o num ficheiro Markdown, num PR ou em mermaid.live); com `--json`, `{format, detail, commits, text}`. Os commits são os de `--range` ou, na falta, os primeiros `--limit` (por omissão 30) da travessia"
"log --detail" = "Nível de detalhe do Mermaid: `structure` (commits, branches, merges), `refs` (+ nomes de branches, tags, HEAD), `subjects` (+ assuntos dos commits) ou `full` (+ autor e data). Por omissão: `ui.mermaid_detail` (`refs`)"
"log --orientation" = "Direção do grafo Mermaid. Por omissão: `ui.mermaid_orientation` (`lr`)"
"log --fence" = "Envolve o script Mermaid num delimitador ```mermaid"
"log --range" = "Mermaid: os commits `A..B` (alcançáveis a partir de B, não de A), como `git log A..B`; um simples `A` significa `A..HEAD`"
"log --subject_width" = "Mermaid: corta os assuntos dos commits neste número de carateres. Por omissão: `ui.mermaid_subject_width` (40)"
"mcp serve --allow_remote" = "Permite `--http` num endereço que não é de loopback. Recusado a menos que `[mcp] http_auth` esteja ativo com um token disponível e o tráfego esteja cifrado (`[mcp] tls`, ou `behind_proxy` para um túnel ou proxy inverso de que se responsabiliza); `ssh -L` para um endpoint de loopback é mais seguro"
"mcp serve --bind" = "Endereço de escuta para `--http` (equivale a `--http ADDR`; prevalece sobre ele)"
"mcp serve --http" = "Endereço de escuta para HTTP em streaming, p. ex. 127.0.0.1:8808 (endpoint `/mcp`); sem endereço, `[mcp] bind` (por omissão 127.0.0.1:8808). Os pedidos exigem o token bearer (`mcp token`), salvo se `[mcp] http_auth` estiver desativado. Só loopback, salvo com `--allow-remote`"
"mcp serve --ui_control" = "Até onde o agente pode mover a janela do utilizador com as ferramentas `ui_*`: `ask` (por omissão: a janela mostra um chip que o utilizador confirma), `auto` ou `off`. Substitui `[mcp] ui_control`"
"mcp token" = "O token bearer do endpoint HTTP (`mcp serve --http`): mostra-o mascarado como JSON `{token_hint, path, rotated}`, criando-o na primeira utilização. Um cliente envia-o como `Authorization: Bearer <token>`. Não é uma ferramenta MCP: um agente nunca lê nem renova a sua própria chave"
"mcp token --copy" = "Copia o token completo para a área de transferência através do terminal (OSC 52), sem o mostrar"
"mcp token --rotate" = "Substitui o token por um novo; os clientes que tenham o antigo são recusados de imediato"
"mcp token --show" = "Mostra também o token completo, para o colar na configuração de um cliente"
"merge --autostash" = 'Guarda em stash as alterações locais que impedem a operação, executa-a e depois aplica o stash (o que `general.auto_stash = "always"` faz)'
"merge --ff" = "Fast-forward quando a branch o permite, um commit de merge caso contrário (a predefinição do git). Substitui `git.merge_fast_forward` neste merge"
"merge --ff_only" = "Apenas fast-forward: recusa quando a branch divergiu. Substitui `git.merge_fast_forward` neste merge"
"merge --no_ff" = "Faz sempre um commit de merge, mesmo quando um fast-forward é possível. Substitui `git.merge_fast_forward` neste merge"
"merge --squash" = "Faz squash dos commits da branch: prepara as alterações e não cria commit de merge (`merge --squash`), pelo que um `commit` se segue. É o modo Squash da definição Comportamento do merge. Não se pode desfazer: nada se moveu, descarte as alterações preparadas para recuar"
patch = "Escreve um ficheiro de patch, ou aplica um à árvore de trabalho"
"patch apply" = "Aplica um ficheiro de patch à árvore de trabalho"
"patch create" = "Escreve um ficheiro de patch. `<revs>` são um ou mais commits (do mais antigo para o mais recente) a transformar num patch cada; combine com `--range a..b` para cobrir todos os commits que não são merges num intervalo; combine com `--wip` para fazer patch das alterações atuais da árvore de trabalho (em stage e fora dele), opcionalmente limitadas a `<paths>`"
"patch create --revs" = "Revisões de commits (do mais antigo para o mais recente) sem `--range`/`--wip`; com `--wip`, caminhos a que limitar o patch (vazio significa todos os ficheiros alterados); ignorado com `--range`"
"pull --autostash" = 'Guarda em stash as alterações locais que impedem a operação, executa-a e depois aplica o stash (o que `general.auto_stash = "always"` faz)'
"pull --mode" = "Como integrar: `merge` (fast-forward se possível), `ff-only` ou `rebase`. Passado sempre explicitamente ao git"
"pull --remote" = "Faz pull da branch com o mesmo nome deste remoto em vez do upstream da branch"
"push --branch" = "A branch local a enviar; a que tem checkout quando omitida"
"push --force_with_lease" = "Substitui a branch remota, apenas se estiver onde o nosso último fetch a viu. Não existe um `--force` simples"
"push --remote" = "Omitido: o remoto por omissão do repositório (ver `remote default`)"
"push --set_upstream" = "Regista `<remote>/<branch>` como upstream da branch"
"rebase --abort" = "Aborta um rebase em curso, restaurando a branch e o HEAD"
"rebase --autosquash" = "Reordena primeiro os passos de `--plan` com o algoritmo de `git rebase --autosquash`; sem `--plan`, executa um simples `git rebase -i --autosquash`"
"rebase --autostash" = 'Guarda em stash as alterações locais que impedem a operação, executa-a e depois aplica o stash (o que `general.auto_stash = "always"` faz)'
"rebase --continue_" = "Retoma um rebase parado por um conflito ou por um passo `edit`"
"rebase --interactive" = "Executa `git rebase -i`. Sem `--plan`, só `--autosquash` isolado faz sentido (aqui não há editor interativo); combine com `--plan` para uma lista de tarefas explícita"
"rebase --onto" = "A branch/o commit sobre que fazer rebase, ou (com `--plan`) o upstream após o qual o intervalo do plano começa. Omitido com `--root` ou um de `--continue`/`--skip`/`--abort`/`--status`"
"rebase --onto_commit" = "Reaplica sobre este commit em vez do próprio upstream (`git rebase --onto`)"
"rebase --plan" = "Um plano `Vec<RebaseStep>` em JSON (ver `rebase-plan`), a partir de um caminho de ficheiro ou `-` para stdin"
"rebase --root" = "Faz rebase de todo o histórico (`--root`) em vez de um intervalo após `onto`/um upstream explícito"
"rebase --skip" = "Ignora o commit em que um rebase está parado"
"rebase --status" = "Indica o rebase atualmente em curso, se existir"
rebase-plan = "O intervalo que um rebase interativo a partir de `upstream` (ou de todo o histórico, com `--root`) reaplicaria, do mais antigo para o mais recente - matéria-prima para construir um ficheiro JSON de `rebase --plan`"
redo = "Refaz a operação que `undo` acabou de desfazer, para o estado exato registado (nunca volta a executar a operação). Código de saída 2 quando recusado"
"redo --dry_run" = "Mostra o que aconteceria e não altera nada"
"redo --expect" = "Só refaz se esta ainda for a última entrada desfeita"
"redo --yes" = "Avança quando o redo é arriscado; sem isto, código de saída 3"
"refs hide" = """Oculta referências do grafo de commits (o "Hide" do TUI): o filtro de visualização por repositório em `repo-state.toml`, que um TUI aberto segue em direto. Os nomes escrevem-se como a listagem de referências os escreve (`feature/x`, `origin/main`, o nome de uma tag)"""
"refs hide --clear" = "Deixa de ocultar todas as referências e remotos ocultos (além dos indicados)"
"refs hide --names" = "Referências a ocultar"
"refs hide#long" = """
Oculta referências do grafo de commits (o "Hide" do TUI): o filtro de visualização por repositório em `repo-state.toml`, que um TUI aberto segue em direto. Os nomes escrevem-se como a listagem de referências os escreve (`feature/x`, `origin/main`, o nome de uma tag).

`--remote <name>...` oculta um remoto por inteiro (todas as suas branches, também as obtidas mais tarde): a forma de ver um histórico sem o histórico de um remoto de arquivo à parte."""
"refs hide --remote" = "Remotos a ocultar por inteiro (nomes como `remote list` os escreve)"
"refs show" = "Volta a mostrar referências: remove-as dos conjuntos de ocultas e de solo"
"refs show --clear" = "Repõe todo o filtro: nada oculto (remotos incluídos), nada em solo"
"refs show --names" = "Referências a voltar a mostrar"
"refs show#long" = """
Volta a mostrar referências: remove-as dos conjuntos de ocultas e de solo.

`--remote <name>...` volta a mostrar um remoto por inteiro, com todas as suas branches que tinham sido ocultadas uma a uma."""
"refs show --remote" = "Remotos a voltar a mostrar"
"refs solo" = "Mostra apenas estas referências (e o que elas alcançam) no grafo de commits"
"refs solo --clear" = "Deixa de pôr em solo todas as referências em solo (além das indicadas)"
"refs solo --names" = "Referências a pôr em solo"
"remote add --push_url" = "Um URL separado para onde enviar"
"remote clear-push-url" = "Remove o URL de push separado, para que os pushes voltem a usar o URL de fetch"
"remote default" = "Mostra o remoto por omissão do repositório, ou define-o com um nome"
"remote set-url" = "Define o URL de fetch ou, com `--push`, o URL de push separado"
repo = "Abrir, inspecionar e memorizar repositórios - a interface multi-repositório. Ver `gitpoulpi repo --help`"
"repo close" = "Fecha o separador de um repositório nesta sessão. O repositório em si não é tocado"
"repo discover" = "Este caminho está num repositório git e onde fica a sua raiz? Passa por `GitBackend::discover`, pelo que responde exatamente o que o fluxo de abertura de repositório do TUI responderia"
"repo discover --path" = "Por omissão, a pasta atual"
"repo init" = "Cria um repositório em `path` e abre-o como separador desta sessão. Passa por `GitBackend::init`, pelo que produz exatamente o repositório que o formulário Criar do TUI produziria"
"repo init --bare" = "Um repositório sem árvore de trabalho"
"repo init --initial_branch" = "A branch onde o primeiro commit aterra. Por omissão `general.default_branch_name`; vazio deixa a do próprio git"
"repo list" = "Os separadores abertos nesta sessão, com o ativo assinalado"
"repo open" = "Abre um repositório como separador desta sessão e regista-o na lista de recentes. Imprime o que foi aberto; não lança uma UI"
"repo recent" = "Os repositórios abertos recentemente, o mais recente primeiro"
"repo recent --forget" = "Esquece uma entrada"
"repo recent --prune" = "Remove as entradas cuja pasta já não existe no disco"
revert = "Desfaz um commit com um novo commit que aplica a alteração inversa"
"revert --commit" = "O commit a reverter (qualquer revisão: um sha, `HEAD~2`, ...)"
"revert --mainline" = "Para um commit de merge: o número (a partir de 1) do pai que fica como linha principal, como `git revert -m`. `1` é a branch em que o merge foi feito. Obrigatório para reverter um commit de merge"
reword = "Dá uma nova mensagem a um commit da branch atual (os seus descendentes são recriados por cima; o índice e a árvore de trabalho não são tocados). Um commit já enviado precisa depois de um push forçado"
"reword --commit" = "O commit a editar (qualquer revisão: um sha, `HEAD~2`, ...)"
"reword --message" = "A nova mensagem completa (resumo, linha em branco, corpo)"
amend = "Altera as propriedades de um commit da branch atual: mensagem, nome, e-mail e data do autor, nome, e-mail e data do committer (qualquer subconjunto; o que omitir é mantido). Os seus descendentes são recriados por cima com os seus próprios autores; o índice e a árvore de trabalho ficam como estão. Pode ser desfeito; um commit já enviado precisará depois de um push forçado"
"amend --author_date" = "Data git em bruto (`1700000000 +0100`) ou ISO 8601 (`2001-02-03T04:05:06+05:30`)"
"amend --author_email" = "O novo e-mail do autor"
"amend --author_name" = "O novo nome do autor"
"amend --commit" = "O commit a alterar (qualquer revisão: um sha, `HEAD~2`, ...)"
"amend --committer_date" = "Os mesmos formatos de --author-date (predefinição: agora)"
"amend --committer_email" = "O novo e-mail do committer (predefinição: o seu)"
"amend --committer_name" = "O novo nome do committer (predefinição: o seu)"
"amend --description" = "Apenas o corpo (o que vem depois do resumo): o resumo é mantido. Um valor vazio remove o corpo"
"amend --message" = "A nova mensagem completa (resumo, linha em branco, corpo)"
"amend --summary" = "Apenas o resumo (primeira linha): o corpo é mantido"
rm-file = "Elimina ficheiros (ou pastas) da árvore de trabalho; o índice não é tocado, pelo que um ficheiro rastreado aparece como alteração eliminada. Reversível com `gitpoulpi undo`, que restaura os bytes exatos"
"rewrite apply --target" = "A pasta do novo repositório quando o plano extrai uma subpasta como clone ou como submódulo (ver `--extract-mode`)"
"rewrite maps" = "O `commit-map` e o `ref-map` da execução (formato do git-filter-repo: uma linha de cabeçalho e depois `antigo novo` por linha; a limpeza de repositório do GitLab usa o mapa de commits). Mostra os respetivos caminhos ou copia-os para `--out`"
"rewrite maps --out" = "Copia os dois ficheiros para esta pasta (criada se não existir)"
"rewrite maps --run" = "O id da execução; `latest` (predefinição) é a execução aplicada mais recentemente"
"rewrite note" = "A nota a enviar a quem tem o histórico antigo: por cada branch e tag enviada, a ponta antiga e a nova e o que executar (`git fetch`, depois `git reset --hard origin/<branch>` ou `git rebase --onto`). Só leitura"
"rewrite note --run" = "O id da execução; `latest` (predefinição) é a execução aplicada mais recentemente"
"rewrite preview --extract" = "Regra de caminhos: mantém só esta subpasta, que passa a ser a raiz; os commits que não lhe tocam são descartados e os merges simplificados. Pergunta de cada vez: indique `--extract-mode`, senão o código de saída é 3 e nada é pré-visualizado. A extração corre antes das outras opções de caminhos"
"rewrite preview --extract_mode" = "Como termina `--extract`: `clone` (um novo clone local em `--target`, o original não é tocado; todas as branches e tags locais), `in-place` (o histórico deste repositório é reescrito, uma entrada de desfazer) ou `submodule` (o clone como em `clone`, e um novo commit na branch atual substitui a pasta por um submódulo desse clone; este histórico é mantido)"
"rewrite preview --into_subdir" = "Regra de caminhos: move todo o repositório para esta subpasta em cada commit (para juntar repositórios sem conflitos de caminhos)"
"rewrite preview --move_paths" = "Regra de caminhos `DE=PARA`: renomeia um ficheiro ou pasta em cada commit, com os mesmos blobs e árvores no novo caminho (repetível, por ordem, depois das regras de conteúdo). Um commit em que `PARA` já existe não é alterado: a pré-visualização é recusada (código de saída 2, `path_collision`) e lista os commits e os caminhos"
"rewrite preview --target" = "A pasta do novo repositório para `--extract-mode clone` ou `submodule`: não pode existir (ou tem de estar vazia) nem estar dentro deste repositório. Usada por `rewrite run`; `rewrite apply` tem a sua própria"
"rewrite push" = "Faz push das refs que uma execução aplicada moveu e que estavam num remoto, cada uma com `--force-with-lease=<ref>:<o id que o remoto tinha quando pré-visualizou>` (nunca um force simples), com um push `--atomic` por remoto quando o servidor o permite (um push por ref caso contrário, e a resposta di-lo). As tags estão incluídas. As branches protegidas (`rewrite.protected_branches`) ficam de fora, a menos que sejam indicadas com `--include-protected` ou todas com `--include-all-protected`. Uma ref cujo remoto mudou desde a pré-visualização é rejeitada para essa ref (faça fetch e reveja, depois execute de novo). Não se desfaz: o remoto mantém o novo histórico mesmo que faça `undo` da reescrita localmente. Sem `--yes` (ou com `--dry-run`) nada é enviado: a resposta lista o que seria enviado e o código de saída é 3 sem `--yes`. Código de saída 2 quando a execução já não existe, 4 quando uma ref foi rejeitada ou não foi enviada"
"rewrite push --dry_run" = "Pergunta ao remoto o que aconteceria (leases verificados) e não envia nada"
"rewrite push --include_all_protected" = "Faz também push de todas as branches protegidas da execução"
"rewrite push --include_protected" = "Faz também push desta branch protegida (repetível)"
"rewrite push --no_atomic" = "Um push por ref, em vez de um único push `--atomic` do tipo tudo ou nada"
"rewrite push --remote" = "Apenas as refs deste remoto"
"rewrite push --run" = "O id da execução que `rewrite apply` mostrou; `latest` (predefinição) é a execução aplicada mais recentemente"
"rewrite push --yes" = "Avança e faz o push. Sem isto nada é enviado (código de saída 3)"
"rewrite purge" = "Elimina definitivamente deste clone o histórico antigo de uma reescrita: descarta os pins de desfazer da reescrita (e de qualquer operação anterior cujos pins também retenham o histórico antigo), faz expirar as entradas do reflog que o referem, poda os objetos (`gc --prune=now`) e confirma que desapareceram. O desfazer deixa de ser possível para essas operações (ficam em `undo --list` como purgadas). Depois de começar, não pode ser interrompida nem desfeita. Tudo o que ainda retenha o histórico antigo (uma branch fora da reescrita, um stash, o HEAD de outro worktree, uma ref de seguimento remoto: faça fetch depois do push) bloqueia-a e nada é alterado. Nada é enviado para nenhum remoto; a resposta lista os passos de que o alojamento precisa (GitHub, GitLab, Azure DevOps, Bitbucket). Sem `--yes` nada acontece: a resposta diz o que seria eliminado e perdido, e o código de saída é 3. Código de saída 2 quando a entrada não é uma reescrita, 4 quando algo a bloqueia ou restam objetos. Por MCP só com `[mcp] allow_history_purge = true`"
"rewrite purge --all" = "Todas as reescritas de histórico do histórico de desfazer"
"rewrite purge --entries" = "Uma entrada de reescrita de histórico do histórico de desfazer (`undo --list`; repetível). Predefinição: a reescrita mais recente que ainda não foi purgada"
"rewrite purge --latest" = "A reescrita mais recente que ainda não foi purgada (a predefinição)"
"rewrite purge --yes" = "Avança e elimina. Sem isto nada é alterado (código de saída 3)"
"rewrite run --extract" = "Regra de caminhos: mantém só esta subpasta, que passa a ser a raiz; os commits que não lhe tocam são descartados e os merges simplificados. Pergunta de cada vez: indique `--extract-mode`, senão o código de saída é 3 e nada é pré-visualizado. A extração corre antes das outras opções de caminhos"
"rewrite run --extract_mode" = "Como termina `--extract`: `clone` (um novo clone local em `--target`, o original não é tocado; todas as branches e tags locais), `in-place` (o histórico deste repositório é reescrito, uma entrada de desfazer) ou `submodule` (o clone como em `clone`, e um novo commit na branch atual substitui a pasta por um submódulo desse clone; este histórico é mantido)"
"rewrite run --into_subdir" = "Regra de caminhos: move todo o repositório para esta subpasta em cada commit (para juntar repositórios sem conflitos de caminhos)"
"rewrite run --move_paths" = "Regra de caminhos `DE=PARA`: renomeia um ficheiro ou pasta em cada commit, com os mesmos blobs e árvores no novo caminho (repetível, por ordem, depois das regras de conteúdo). Um commit em que `PARA` já existe não é alterado: a pré-visualização é recusada (código de saída 2, `path_collision`) e lista os commits e os caminhos"
"rewrite run --target" = "A pasta do novo repositório para `--extract-mode clone` ou `submodule`: não pode existir (ou tem de estar vazia) nem estar dentro deste repositório. Usada por `rewrite run`; `rewrite apply` tem a sua própria"
"rm-file --paths" = "Caminhos relativos ao repositório a eliminar"
shell-init = """Imprime uma função wrapper de shell (nome por omissão `gp`) que executa o gitpoulpi e, quando sai com "Quit and cd here", deixa a sua shell na pasta do separador ativo. Adicione-a ao ficheiro rc da sua shell: `eval "$(gitpoulpi shell-init bash)"`. Nada é instalado nem editado"""
"shell-init --name" = "O nome da função. Um comando existente com esse nome não é substituído"
show = "O conteúdo de um ficheiro numa revisão, no índice ou na árvore de trabalho"
"show --at" = "Revisão em que o ler (por omissão: HEAD). Mutuamente exclusivo com --staged e --worktree"
"show --output" = "Com --raw: grava os bytes neste ficheiro em vez de stdout"
"show --path" = "Caminho relativo ao repositório a ler"
"show --raw" = "Grava os bytes exatos do ficheiro (sem descodificar, sem JSON) em stdout ou em --output. Para scripts e ficheiros binários como imagens. Apenas na linha de comandos: indisponível via MCP"
"show --staged" = "Lê o conteúdo em stage em vez do de um commit"
"show --worktree" = "Lê o ficheiro tal como está no disco em vez do de um commit"
repo-config = "Os `core.autocrlf` e `core.eol` locais do repositório (o que Definições > Git e codificação edita). Pode ser anulado como qualquer outra operação"
"repo-config set" = "Define uma chave: `core.autocrlf` aceita true | input | false, `core.eol` aceita lf | crlf | native"
"repo-config show" = "Mostra o valor local do repositório de uma chave (`core.autocrlf` ou `core.eol`), ou das duas; null significa não definido (aplica-se o valor global)"
"repo-config show --key" = "`core.autocrlf` ou `core.eol`; as duas se omitido"
"repo-config unset" = "Remove o valor local do repositório, para voltar a aplicar-se o global"
ssh-command = "A fixação local ao repositório de `core.sshCommand`: que chave SSH este repositório usa. Veja `repo-auth` para a identidade completa"
"ssh-command clear" = "Remove a fixação, para que o repositório volte a usar a configuração ssh do ambiente"
"ssh-command set" = "Fixa o repositório a uma chave privada, ou a um comando literal"
"ssh-command set --command" = "Um valor literal de `core.sshCommand`"
"ssh-command set --key" = 'Ficheiro de chave privada: fixa `ssh -i "<key>" -o IdentitiesOnly=yes`'
"ssh-command show" = "Mostra o `core.sshCommand` fixado do repositório (null quando não definido)"
"stage --allow_sensitive" = "Coloca em stage também os ficheiros que parecem sensíveis (uma chave privada, um `.env`, um token reconhecido). Sem esta opção, esse stage é recusado e nada é colocado em stage (`[privacy] staging_guard`)"
"stage --hunk" = "Índice de um hunk dentro do diff de `--file`, como `gitpoulpi diff --json` os numera"
"stage --lines" = "Índices de linhas separados por vírgulas dentro de `--hunk`"
"stage --paths" = "Vários caminhos (ficheiros ou pastas) como UMA só operação: uma entrada no registo, um passo de `undo` (um ficheiro movido são o seu caminho antigo e o novo)"
"unstage --paths" = "Vários caminhos (ficheiros ou pastas) como UMA só operação: uma entrada no registo, um passo de `undo` (um ficheiro movido são o seu caminho antigo e o novo)"
"stash push --ai" = "Deixa a IA dar nome ao stash a partir das alterações de trabalho (requer `ai.enabled = true`, ver `docs/user/ai.md`)"
submodule = "Submódulos: lista-os com o seu estado, regista-os (`init`) ou faz checkout deles (`update`)"
