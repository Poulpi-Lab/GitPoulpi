"mailmap list --mapped" = "Só as identidades que o `.mailmap` já mapeia"
"mailmap list --refs" = "Só estas branches ou tags locais (repetível)"
"mailmap list --unmapped" = "Só as identidades que o `.mailmap` não mapeia"
"rewrite preview --mailmap" = "Regra de mailmap: reescreve autores e committers para o nome que o `.mailmap` da árvore de trabalho lhes dá (o histórico passa a mostrar o que `git log --use-mailmap` mostra). `--who` escolhe autor, committer ou ambos. Para corrigir só a apresentação, sem reescrever, use antes `mailmap add`"
"rewrite preview --mailmap_file" = "Com `--mailmap`: aplica este ficheiro em vez do `.mailmap` da árvore de trabalho (relativo à raiz do repositório, ou absoluto)"
"rewrite run --mailmap" = "Regra de mailmap: reescreve autores e committers para o nome que o `.mailmap` da árvore de trabalho lhes dá (o histórico passa a mostrar o que `git log --use-mailmap` mostra). `--who` escolhe autor, committer ou ambos. Para corrigir só a apresentação, sem reescrever, use antes `mailmap add`"
"rewrite run --mailmap_file" = "Com `--mailmap`: aplica este ficheiro em vez do `.mailmap` da árvore de trabalho (relativo à raiz do repositório, ou absoluto)"
"rewrite analyze" = "Análise de tamanhos do histórico, como `filter-repo --analyze`: os maiores blobs com o caminho, o tamanho, o primeiro e o último commit e se ainda estão em HEAD, as maiores pastas, os ficheiros eliminados de HEAD que o histórico ainda guarda e os totais, com o que remover a parte que só existe no histórico libertaria (uma estimativa: só depois de uma purga e de um gc). Remova o que mostra com `rewrite preview --remove-paths CAMINHO` ou `--remove-blobs-over BYTES`. Só leitura"
