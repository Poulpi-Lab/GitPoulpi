"ai trust" = "Associa a chave de API de um perfil ao endereço para o qual foi guardada: mostra o que é de confiança, ou aceita o endereço atual do perfil (depois de o seu URL base mudar), o certificado de um servidor auto-alojado, ou http simples. Só uma pessoa o executa (não é uma ferramenta de agente)"
