"reflog-restore --ref" = "`HEAD` ou uma branch"
"undo-restore" = "\"Restaurar só esta\": repõe o que uma operação anterior removeu (uma branch ou tag eliminada, um stash descartado, um ficheiro descartado ou eliminado, um remoto removido, uma linha de ignorar) sem desfazer as operações seguintes. O restauro é uma nova entrada do diário, pelo que `undo` o desfaz. Nada é substituído: um ficheiro que entretanto mudou recebe a versão guardada ao lado, como `<nome>.restored`; um reset, amend ou rebase volta como uma nova branch no topo antigo. Também escrito `gitpoulpi undo restore <id>`. Código de saída 2 quando não é possível (o JSON indica o motivo)"
"undo-restore --dry_run" = "Mostra o que aconteceria e não altera nada"
"undo-restore --id" = "A entrada a restaurar, tal como `undo --list` mostra o seu id"
"undo-restore --name" = "Restaura a branch ou a tag com este nome (quando o nome antigo já está em uso, ou para a branch que um reset/amend/rebase restaura)"
