"reflog-restore --dry_run" = "Mostra o que aconteceria e não altera nada"
"reflog-restore --mode" = "Com alterações não commitadas: `keep` move e mantém-nas (recusando se alguma estiver no caminho); `soft`, `mixed` e `hard` são os modos do reset"
