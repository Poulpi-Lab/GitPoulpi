repo-auth = "Com que identidade este repositório se autentica (HTTPS e SSH): a da própria máquina, uma conta GitPoulpi ou um ficheiro de chave. `show` e `test` só leem; `set` e `clear` são uma decisão de uma pessoa"
"repo-auth clear" = "Esquece o perfil: o repositório volta à identidade própria da máquina. Só uma pessoa o pode fazer: um agente é recusado"
"repo-auth set" = "Escolhe a identidade com que este repositório se autentica, por protocolo: `--https` para remotos HTTPS, `--ssh` para remotos SSH. O perfil fica na pasta privada do GitPoulpi, nunca no repositório. Só uma pessoa o pode definir: um agente é recusado (código de saída 2)"
