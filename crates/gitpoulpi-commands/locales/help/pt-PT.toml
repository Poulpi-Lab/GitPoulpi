"rewrite run --set_name" = "Regra de identidade: o nome a definir (com `--set-email`, pelo menos um)"
"rewrite run --shift_dates" = "Regra de data: move todas as datas por este número de segundos (negativo: para trás), mantendo o desfasamento do fuso horário de cada commit"
