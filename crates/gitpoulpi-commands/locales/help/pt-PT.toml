"job" = "As tarefas em segundo plano do daemon: cada fetch, push, pull, clone e transferência LFS é uma desde a receção. `list` mostra-as, `cancel` pára uma, `wait` espera que uma termine. Ctrl+C num comando que iniciou uma tarefa cancela-a"
