"rewrite run --yes" = "Confirma mover refs que já foram enviadas"
"rewrite scan-secrets" = "Pesquisa segredos no histórico: prefixos conhecidos de tokens (GitHub, GitLab, Slack, AWS, Stripe, npm, Google, OpenAI, Anthropic), blocos de chaves privadas, JWTs, palavras-passe em URLs e linhas `password = valor` que parecem aleatórias. Mostra, por cada resultado, a regra, o ficheiro, o primeiro e o último commit, as contagens e uma pré-visualização OCULTADA (`ghp_****abcd`); o valor nunca é mostrado, registado nem guardado. Não é exaustiva. Um segredo que foi enviado está comprometido: renove-o primeiro. Só leitura"
"rewrite scan-secrets --all_local" = "Pesquisa todas as branches e tags locais em vez da branch atual"
"rewrite scan-secrets --refs" = "Pesquisa só estas branches ou tags locais (repetível)"
"rewrite scan-secrets --since" = "Com a branch atual: só os commits depois desta revisão"
"rewrite script" = "Scripts Lua incorporados para reescritas do histórico: verifique um ou experimente-o em alguns commits. Execute um a sério com `rewrite preview --script FILE`"
"rewrite script check" = "Compila um script Lua e mostra o seu cabeçalho (nome, janela, parâmetros), as funções que define e cada problema. Código de saída 2 quando tem problemas. Só leitura; nada é executado num commit"
"rewrite script check --file" = "O ficheiro de script"
"rewrite script check --params" = "Um parâmetro `NAME=VALUE` (repetível), verificado contra o cabeçalho"
"rewrite script test" = "Executa um script em alguns commits e mostra o que alteraria e o que registou, pela ordem do histórico, com o estado a passar de um commit para o seguinte. Só leitura: nada é escrito. Código de saída 2 quando o script falha (a resposta indica o commit e o motivo)"
"rewrite script test --commits" = "Um commit onde executar (repetível; uma revisão ou um id)"
"rewrite script test --file" = "O ficheiro de script"
"rewrite script test --params" = "Um parâmetro `NAME=VALUE` (repetível)"
"rewrite preview --script_language" = "A linguagem de cada `--script`: `lua` (integrado, em sandbox), `shell`, `python` ou `lua-external`. Predefinição: pela extensão do ficheiro (`.lua`; `.sh`, `.bash`, `.ps1`; `.py`), senão `lua`. O Python e o Lua externo têm de ser ativados em `rewrite.external_scripts`"
"rewrite preview --trust" = "Confia nos scripts externos (shell, Python, Lua externo) desta receita, pelo respetivo conteúdo: fica registado para este repositório e volta a perguntar se um script mudar. Decisão de uma pessoa: o servidor MCP recusa-a, e um agente só pode executar scripts em que uma pessoa confiou"
"rewrite run --script_language" = "A linguagem de cada `--script`: `lua` (integrado, em sandbox), `shell`, `python` ou `lua-external`. Predefinição: pela extensão do ficheiro (`.lua`; `.sh`, `.bash`, `.ps1`; `.py`), senão `lua`. O Python e o Lua externo têm de ser ativados em `rewrite.external_scripts`"
"rewrite run --trust" = "Confia nos scripts externos (shell, Python, Lua externo) desta receita, pelo respetivo conteúdo: fica registado para este repositório e volta a perguntar se um script mudar. Decisão de uma pessoa: o servidor MCP recusa-a, e um agente só pode executar scripts em que uma pessoa confiou"
"rewrite script check --language" = "`lua`, `shell`, `python` ou `lua-external`; por omissão pela extensão"
"rewrite script check --trust" = "Confia primeiro neste script (decisão de uma pessoa, recusada por MCP)"
"rewrite script check#long" = """
Compila um script Lua e mostra o seu cabeçalho (nome, janela, parâmetros), as funções que define e cada problema. Código de saída 2 quando tem problemas. Só leitura; nada é executado sobre um commit.

Para um script de shell, Python ou Lua externo (sem sandbox) diz também se o interpretador foi encontrado e se o script é de confiança e, para um script de confiança, faz um handshake de ensaio: inicia o script uma vez com um commit fictício (`"dry_run": true`) e verifica a resposta. Um script sem confiança nunca é iniciado."""
"rewrite script test --language" = "`lua`, `shell`, `python` ou `lua-external`; por omissão pela extensão"
"rewrite script test --trust" = "Confia primeiro neste script (decisão de uma pessoa, recusada por MCP)"
"rewrite script trust" = "Confia num script externo (shell, Python, Lua externo) pelo respetivo conteúdo: o SHA-256 do ficheiro fica registado para este repositório, pelo que o script pode correr (preview, run, test); um ficheiro alterado volta a perguntar. Estes scripts não correm em sandbox: executam-se com as suas permissões, por isso leia primeiro o ficheiro. Só uma pessoa o pode fazer: não existe ferramenta MCP para isso"
"rewrite script trust --file" = "O ficheiro do script"
"rewrite tools" = "As ferramentas de que as funcionalidades de reescrita precisam (gpg / ssh-keygen / gpgsm para voltar a assinar, interpretadores de scripts, git-lfs) e se cada uma foi encontrada. Só leitura"
"rewrite tools --fresh" = "Sonda de novo em vez de responder com a cache de um minuto"
"mailmap" = "O `.mailmap`: um nome e e-mail canónicos para quem fez commits sob vários. O Log, o blame e o histórico de um ficheiro mostram os nomes mapeados (`log.use_mailmap`) sem tocar em nenhum commit. `list` conta as identidades do histórico e mostra quais estão mapeadas, `check` mostra como algumas identidades são resolvidas, `add` junta identidades numa só acrescentando linhas ao `.mailmap` (editado, não commitado; pode ser desfeito)"
"mailmap add" = "Junta identidades numa única identidade canónica acrescentando linhas ao `.mailmap` (criado se não existir; uma linha que já lá esteja não se repete). O ficheiro é editado, não commitado: faça o commit você mesmo. Uma só entrada que pode ser desfeita (`gitpoulpi undo` repõe o ficheiro anterior). O Log mostra logo a identidade canónica (`log.use_mailmap`); os commits guardados não são alterados, por isso nada exige um force push. Para reescrever os próprios commits use uma regra `mailmap` em `rewrite`"
"mailmap add --canonical" = "A identidade a manter, `Nome <e-mail>`"
"mailmap add --file" = "O `.mailmap` a escrever, relativo à raiz do repositório (predefinição: o `.mailmap` da raiz)"
"mailmap add --from" = "Uma identidade a mapear para ela, `Nome <e-mail>` (repetível, pelo menos uma)"
"mailmap check" = "Mostra como as identidades (`Nome <e-mail>` ou `<e-mail>`) aparecem através do `.mailmap` do repositório: o nome e e-mail canónicos, ou a mesma identidade quando nada a mapeia. Só leitura"
"mailmap check --identities" = "As identidades a resolver, cada uma `Nome <e-mail>` ou `<e-mail>`"
"mailmap list" = "Lista todos os nomes e e-mails que foram autor ou committer de um commit do âmbito, com quantos commits cada um tem como autor e como committer, do que tem mais commits para o que tem menos, e a identidade para a qual o `.mailmap` já o mapeia (`mapped_to`). Só leitura"
