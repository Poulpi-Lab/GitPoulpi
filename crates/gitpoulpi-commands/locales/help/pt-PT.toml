"repo-auth set --command" = "Com `--https token-command`: o comando e os seus argumentos (a primeira palavra é o programa). Escreva `--command` em último lugar: todas as palavras a seguir, hífenes incluídos (`sh -c ...`), pertencem ao comando"
"repo-auth set --helper" = "Com `--https helper`: o comando do assistente de credenciais. Uma pessoa confirma-o, com o seu hash (ou passa `--yes`)"
"repo-auth set --hosts" = "Com `helper` ou `token-command`: os hosts a que pode servir (separados por vírgulas ou repetidos)"
"repo-auth set --https" = "Identidade HTTPS: `system` (os assistentes do próprio git), `integration:<id>` (o token de uma conta GitPoulpi), `helper` (um assistente de credenciais, com `--helper`) ou `token-command` (um comando que imprime um token, com `--command` e `--hosts`)"
"repo-auth set --ignore_repo_helpers" = "Com `--https system`: descarta os assistentes de credenciais que este repositório define para si e mantém os do sistema e os globais"
"repo-auth set --known_hosts" = "Com `--ssh key:` ou `integration-key:`: o ficheiro `known_hosts`"
"repo-auth set --ssh" = "Identidade SSH: `system` (a configuração e o agente do próprio ssh), `key:<caminho>` (um ficheiro de chave privada, oferecido sozinho) ou `integration-key:<id>` (a chave de uma conta GitPoulpi)"
"repo-auth set --strict" = "Com `--ssh key:` ou `integration-key:`: recusa chaves de host desconhecidas (`StrictHostKeyChecking=yes`)"
"repo-auth set --username" = "Um nome de utilizador: com `system`, `credential.username` (permite a um gestor de credenciais escolher uma de várias contas); com `integration:<id>`, o nome de utilizador enviado com o token"
"repo-auth set --yes" = "Confirma um assistente ou um comando de token sem a pergunta interativa (o comando e o seu hash continuam a ser impressos)"
"repo-auth show" = "Mostra com que identidade este repositório se autentica: o perfil guardado, a identidade que cada remoto vai usar, as definições que o perfil substitui e qualquer aviso. Nunca imprime um segredo; um assistente ou comando de token só é impresso para uma pessoa (um agente recebe `{set, sha256}`)"
"repo-auth test" = "Testa a ligação de cada remoto (ou de um) com o perfil aplicado, sem alterar nada: lista as branches do remoto ou, com `--push`, pergunta se um push seria aceite. Responde com o relatório de cada remoto e a identidade que usou. Acede à rede"
"repo-auth test --push" = "Verifica também se um push seria aceite"
"repo-auth test --remote" = "Só este remoto (por omissão: todos os remotos)"
"apply-commit" = "Aplica só à árvore de trabalho as alterações feitas por um commit (mesmo perdido): o índice e HEAD ficam como estão. Tudo ou nada: se um ficheiro não se aplicar limpo, nada muda (`stash from-commit` guarda antes as alterações como stash). Um commit de merge é recusado. `undo` desfaz"
"apply-commit --commit" = "O commit cujas alterações se aplicam (qualquer revisão: um sha, `HEAD~2`, ...)"
"stash from-commit" = "Guarda as alterações feitas por um commit (mesmo perdido) como um novo stash, sem tocar na árvore de trabalho. `undo` elimina-o de novo"
"stash from-commit --commit" = "O commit cujas alterações se guardam (qualquer revisão: um sha, `HEAD~2`, ...)"
"stash from-commit --message" = "A mensagem do stash; omitida, usa uma que nomeia o commit"
"branch upstream" = "Os vários remotos de uma branch: o upstream principal mais destinos de push adicionais e fontes de pull opcionais, guardados na sua própria secção de configuração"
"branch upstream add" = "Adiciona `<remote>[:<dst>]` como destino de push adicional (`<dst>` é o nome da branch nesse remoto, por omissão o mesmo nome). Pode ser desfeito"
"branch upstream add --branch" = "A branch (por omissão, a atual)"
"branch upstream add --pull" = "Torna-o também uma fonte de pull"
"branch upstream add --target" = "`<remote>` ou `<remote>:<dst>`"
"branch upstream list" = "O upstream principal da branch, os seus destinos de push adicionais e fontes de pull, cada um com a sua situação (à frente, atrás, relação) segundo as refs de acompanhamento remoto tal como estão. Só lê, sem rede"
"branch upstream list --branch" = "A branch (por omissão, a atual)"
"branch upstream primary" = "Define o upstream principal (`origin/main`): o mesmo pedido que `branch set-upstream`"
"branch upstream primary --branch" = "A branch (por omissão, a atual)"
"branch upstream pull" = "Ativa ou desativa `<remote>[:<dst>]` como fonte de pull: um pull simples passa a integrá-lo também"
"branch upstream pull --branch" = "A branch (por omissão, a atual)"
"branch upstream pull --off" = "Deixa de fazer pull dele"
"branch upstream pull --on" = "Torna-o uma fonte de pull"
"branch upstream pull --target" = "`<remote>` ou `<remote>:<branch>`"
"branch upstream remove" = "Remove todos os destinos de push adicionais e fontes de pull que nomeiem `<remote>`. O upstream principal fica como está (use `unset-upstream`). Pode ser desfeito"
"branch upstream remove --branch" = "A branch (por omissão, a atual)"
"remote-group" = "Uma branch com vários remotos (destinos de push adicionais, fontes de pull): a situação em relação a cada um. Veja `branch upstream` para os alterar"
"remote-group status" = "A situação da branch atual (ou de `--branch`) em relação a cada um dos seus remotos: upstream principal, destinos de push adicionais, fontes de pull. Só lê, sem rede"
"remote-group status --branch" = "A branch (por omissão, a atual)"
"pull --all_sources" = "Faz pull do upstream principal e de todas as fontes de pull da branch (ver `branch upstream pull`), cada um com `--mode`. Planeia primeiro: tudo o que não seja um fast-forward ou a integração do próprio modo pede `--resolve` (código 3, nada alterado). Uma paragem por conflitos termina com 4 e `stopped`; retome com `remote-group continue`"
"pull --branch" = "Com `--all-sources`: a branch (por omissão, a atual)"
"pull --no_preflight" = "Com `--all-sources`: não consultar primeiro os remotos"
"pull --resolve" = "Com `--all-sources`: `REMOTE=ff|merge|rebase|skip` (repetível), a decisão para um remoto sobre o qual o plano perguntou"
"push --all_targets" = "Faz push para o upstream principal e para todos os destinos de push adicionais da branch (ver `branch upstream add`). Planeia primeiro: quando todos os remotos são um push simples ou estão atualizados, executa; caso contrário responde `needs_resolution` (código 3, nada alterado). Código 4: algum remoto falhou ou um merge parou por conflitos (`stopped`)"
"push --no_preflight" = "Não consultar primeiro os remotos (usar as refs de acompanhamento remoto)"
"push --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (repetível): a decisão para um remoto sobre o qual o plano perguntou"
"push --tags" = "Envia também as tags ainda não enviadas para todos os remotos que aceitaram a branch"
"push --to" = "Faz push exatamente para estes remotos (`<remote>` ou `<remote>:<dst>`, repetível) só neste push; a configuração não é alterada. Mesmo plano, `--resolve` e execução que `--all-targets`"
"push --yes" = "Confirma um push forçado escolhido com `--resolve REMOTE=force`. Sem isto, esse push não altera nada e termina com o código 3"
"remote-group abort" = "Descarta a execução em grupo guardada: aborta o merge ou rebase que ela iniciou. Os pushes já feitos ficam"
"remote-group abort --run" = "O id da execução guardada, para ter a certeza de que ainda é a pretendida"
"remote-group continue" = "Retoma a execução em grupo guardada depois de o merge ou rebase estar concluído (nunca é automático). Responde a um `needs_resolution` com `--resolve`"
"remote-group continue --branch" = "A branch (por omissão, a atual); só é lida com `--resolve`"
"remote-group continue --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (repetível): a decisão para um remoto sobre o qual a resposta anterior perguntou"
"remote-group continue --run" = "O id da execução guardada, para ter a certeza de que ainda é a pretendida"
"remote-group continue --yes" = "Confirma os pushes forçados nomeados por `--resolve`"
"remote-group plan" = "O que faria um push em grupo (ou, com `--pull`, um pull em grupo), remoto a remoto: a situação de cada um, a ação sugerida e as outras permitidas. Consulta os remotos (`ls-remote`, um fetch dos que têm a ponta desconhecida) exceto com `--no-preflight`; não altera nada"
"remote-group plan --branch" = "A branch (por omissão, a atual)"
"remote-group plan --no_preflight" = "Não consultar os remotos: usar as refs de acompanhamento remoto tal como estão"
"remote-group plan --pull" = "Planeia o pull em grupo (o principal e as fontes de pull)"
"remote-group plan --to" = "Planeia um push exatamente para estes remotos (`<remote>` ou `<remote>:<dst>`, repetível) em vez dos destinos configurados"
"remote-group retry" = "Executa de novo os destinos da execução guardada que falharam, foram cancelados a meio do push ou nunca foram tentados"
"remote-group retry --run" = "O id da execução guardada, para ter a certeza de que ainda é a pretendida"
