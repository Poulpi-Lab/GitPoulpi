"rewrite run --reencode" = "Regra de codificação: os ficheiros de texto que correspondem a `--encoding-paths` são convertidos para esta codificação (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). Os ficheiros binários, os que a codificação de origem não consegue ler e os carateres que o destino não consegue guardar ficam como estão e são contados"
"rewrite run --reencode_from" = "Com `--reencode`: a codificação em que os ficheiros estão. Omitido: detetada por ficheiro (marca de ordem de bytes, UTF-8 válido, senão `--encoding-fallback`)"
"rewrite run --strip_exec" = "Regra de modo de ficheiro: o bit de execução (100755 passa a 100644) é retirado aos ficheiros que correspondem a estes globs (repetível). O conteúdo não é tocado"
"rewrite run --strip_exec_exclude" = "Com `--strip-exec`: os ficheiros que mantêm o bit de execução (globs)"
"rewrite run --lfs_import" = "Regra LFS: move para o Git LFS, em cada commit, os ficheiros que correspondem a este glob (repetível; estilo `.gitattributes`: sem barra corresponde a qualquer profundidade). Precisa do git-lfs. O conteúdo vai para o armazenamento LFS local e o `.gitattributes` ganha a linha `filter=lfs`; envie os objetos depois"
