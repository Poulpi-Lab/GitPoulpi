"submodule update --paths" = "Caminhos de submódulos relativos ao repositório"
"submodule update --recursive" = "Atualiza também os submódulos dos próprios submódulos"
"tag annotate" = "Substitui uma tag existente por uma anotada, no próprio local. A tag mantém o commit para o qual já aponta"
"tag create --message" = "Cria uma tag *anotada* com esta mensagem em vez de uma leve - `git tag -a -m`"
"tag delete" = "Elimina uma tag. Por omissão só a local (`--local`): quando um remoto também a tem, o próximo `fetch` traz-a de volta, e a resposta di-lo. `--remote <R>` elimina-a só nesse remoto (visível para fora: os outros perdem-na), `--both` elimina-a aqui e no remoto que a tem (`--both --remote <R>` indica um)"
"tag delete --both" = "Elimina aqui e no remoto que tem a tag"
"tag delete --local" = "Elimina só a tag local (por omissão)"
"tag delete --remote" = "Elimina neste remoto (só nele, salvo `--both`)"
"tag delete-remote" = "Elimina uma tag de um remoto, mantendo a local"
"tag fetch" = "Obtém uma tag de um remoto para as tags locais - o que uma tag só `remote` em `tag list` precisa. Nunca substitui uma tag local noutro commit"
"tag fetch --remote" = "Omitido: o único remoto que tem a tag"
"tag list" = "Cada tag com o sítio onde está: `local` (aqui), `remote` (os remotos que a têm), `differs_on` (remotos que a têm noutro commit) e `where`: `local`, `remote` (não obtida ou eliminada aqui), `both` ou `differs`. Vem do último fetch ou push, não da rede"
"tag list --unpushed" = "Apenas as tags que nenhum remoto se sabe ter"
"tag push" = "Envia tags para um remoto. Sem nomes, envia todas as tags que nenhum remoto se sabe ter - um só push, não um por tag"
"tag push --names" = "Tags a enviar. Omita para enviar todas as tags por enviar"
theme = "Os temas de cores: liste-os ou imprima um como ficheiro de tema"
licenses = "Apresenta as licenças de terceiros e os créditos incorporados neste programa (o mesmo texto de Acerca de > Licenças e do ficheiro THIRD-PARTY-LICENSES.txt do arquivo da versão)"
"theme export" = "Imprime em stdout um ficheiro de tema completo, para começar um tema próprio (guarde como `<config>/themes/<nome>.toml`)"
"theme export --slug" = "O slug do tema (veja `theme list`)"
"theme list" = "Lista todos os temas: as predefinições integradas e os ficheiros da pasta `themes/` do diretório de configuração (slug, etiqueta, origem, claro, paleta de faixas). `ui.theme` aceita qualquer um destes slugs"
desktop = "Atalhos que iniciam o GitPoulpi a partir do lançador do sistema, no terminal que `ui.launch_terminal` indica"
"desktop folder-menu" = """A entrada "Abrir no GitPoulpi" do menu de contexto do gestor de ficheiros: Explorador de Ficheiros (Windows), GNOME Files, Dolphin, Nemo, Thunar, Caja e PCManFM (Linux), Finder (macOS)"""
"desktop folder-menu install" = "Adiciona a entrada a todos os gestores de ficheiros encontrados aqui (um ficheiro que não é do GitPoulpi nunca é substituído)"
"desktop folder-menu remove" = "Remove exatamente o que `install` gravou, em todos os gestores de ficheiros"
"desktop folder-menu status" = "Mostra cada gestor de ficheiros deste sistema: se foi encontrado e se a entrada está not_installed, installed, outdated ou foreign (um ficheiro que não é do GitPoulpi)"
"desktop shortcut" = "Lista, cria ou remove os atalhos do lançador, do menu Iniciar e do ambiente de trabalho"
"desktop shortcut install" = "Cria ou atualiza um atalho (predefinição: o lançador do sistema)"
"desktop shortcut install --place" = "`launcher`, `desktop` ou `startmenu`"
"desktop shortcut remove" = "Remove os atalhos criados pelo GitPoulpi (predefinição: todos); um ficheiro que não é do GitPoulpi nunca é tocado"
"desktop shortcut remove --place" = "`launcher`, `desktop` ou `startmenu`"
"desktop shortcut status" = "Mostra cada atalho que este sistema oferece: not_installed, installed, outdated ou foreign (um ficheiro que não é do GitPoulpi), e o terminal em uso"
treat = "Faz o git tratar ficheiros como binários ou como texto, escrevendo uma regra de `.gitattributes` (`binary` ou `text diff`) para os caminhos: o ficheiro da raiz do repositório por predefinição, `--file` para o de uma pasta ou `.git/info/attributes` (apenas este clone). Uma regra que já nomeia o mesmo padrão é reescrita, não contradita. A resposta diz se o git trata agora realmente os caminhos assim (`effective`). Anulável com `gitpoulpi undo`, exceto para `.git/info/attributes`"
"treat --kind" = "Como o git deve tratar os caminhos"
"treat --paths" = "Caminhos relativos ao repositório (pastas com `--folder`)"
"treat --extension" = "Nomeia todos os ficheiros com a extensão de cada caminho (`*.ext`) em vez do próprio ficheiro"
"treat --folder" = "Os caminhos são pastas: a regra cobre tudo o que contêm"
"treat --file" = "`.gitattributes` relativo ao repositório onde escrever, ou `.git/info/attributes` (predefinição: o `.gitattributes` da raiz)"
convert = "Reescreve a codificação, os fins de linha ou a indentação de ficheiros da árvore de trabalho, com as funções do editor da TUI e do seu menu Converter. Exatamente uma entre `--encoding`, `--eol` e `--indent`. Os ficheiros binários, ausentes ou que a codificação de destino não consegue representar são ignorados e comunicados, nunca danificados. Uma única entrada do diário para todo o lote: `gitpoulpi undo` repõe todos os ficheiros"
"convert --paths" = "Ficheiros a converter, caminhos relativos ao repositório"
"convert --encoding" = "A codificação de destino, como o editor a nomeia (`UTF-8`, `UTF-8 BOM`, `UTF-16 LE`, `Windows-1252`, `ISO-8859-1`, `Shift_JIS`, ...)"
"convert --eol" = "O fim de linha de destino"
"convert --indent" = "Espaços ou tabulações no início da linha: `spaces:<n>` ou `tabs:<n>`, sendo `<n>` a largura de uma tabulação (1-8)"
ui = "Mostra coisas ao utilizador na sua janela GitPoulpi aberta: um commit, um diff numa linha, um ficheiro, uma página de definições. Apenas de visualização: nada aqui altera o repositório nem escreve na janela, exceto `ui propose`, que abre um diálogo pré-preenchido para o utilizador confirmar (desativado salvo `[mcp] allow_ui_propose = true`). Requer um TUI do GitPoulpi aberto na sessão"
"ui --launch" = "Quando não há nenhuma janela aberta em lado nenhum, abre uma com o comando de lançamento configurado (`[ui] launch` / `launch_command`; desativado por omissão) e espera até 10 s que se ligue. Sem esta flag só se lança uma janela quando `[ui] launch` está definido E `ui_control` é `auto`"
"ui --viewer" = "Envia para esta janela (`ui viewers` lista-as) em vez de deixar o daemon escolher"
"ui back" = "Desfaz a última mudança de vista do agente (restaura a vista anterior)"
"ui highlight" = "Realça um intervalo de linhas no diff ou ficheiro que a janela tem aberto"
"ui highlight --no_scroll" = "Não desloca o intervalo para a vista"
"ui highlight --range" = "`A-B`, ou `A:C-B:C` com colunas (a partir de 1)"
"ui notify" = "Mostra uma mensagem breve (toast) ao utilizador"
"ui notify --message" = "No máximo 200 caracteres; os caracteres de controlo são removidos"
"ui propose" = """Propõe uma alteração para o utilizador confirmar: abre-se um diálogo pré-preenchido, marcado "Proposed by", e nada acontece até o utilizador premir o seu próprio confirmar. Requer `[mcp] allow_ui_propose = true`. Siga o id `proposal` da resposta em `proposals` de `ui state`"""
"ui propose branch" = "Abre a caixa Nova Branch com um nome preenchido"
"ui propose branch --start_point" = "Onde a branch começa (por omissão: HEAD)"
"ui propose commit-message" = "Preenche o Resumo e a Descrição do compositor de commit; nunca faz commit"
"ui propose resolution" = "Abre o editor de merge num ficheiro em conflito com uma resolução já preenchida, para o utilizador rever e confirmar com Save & Mark Resolved (o seu Ctrl+S é a única confirmação; nada é escrito nem colocado em stage aqui). Indique as escolhas com `--pick`, ou o ficheiro inteiro com `--content-file`"
"ui propose resolution --content_file" = "O texto final do ficheiro, exatamente (`-` lê o standard input)"
"ui propose resolution --path" = "Caminho do ficheiro em conflito relativo ao repositório"
"ui propose resolution --pick" = "Uma escolha por número de conflito: `1=a,2=b,3=ab,4=ba,5=none` (a = atual, b = recebido, ab / ba = ambos por essa ordem)"
"ui propose resolution --pick_default" = "Com `--pick`: a escolha para todos os conflitos não listados"
"ui propose reword" = "Abre o popup Reword sobre um commit com uma nova mensagem preenchida"
"ui propose rewrite" = "Abre o painel de reescrita do histórico com uma receita já preenchida, para o utilizador pré-visualizar e aplicar; nunca reescreve, expurga nem envia nada por si. Uma receita tem no máximo 50 regras e nenhum script, e os valores secretos são retirados"
"ui propose rewrite --recipe" = "A receita (TOML ou JSON, como `rewrite preview --recipe` a aceita), a partir de um caminho de ficheiro ou `-` para stdin"
"ui propose reword --message" = "A mensagem proposta: resumo, linha em branco, corpo"
"ui propose reword --rev" = "O commit (na branch com checkout)"
"ui propose split" = "Abre o editor de divisão sobre um commit, preenchido com um plano que o utilizador revê, edita e aplica; nunca divide nada por si"
