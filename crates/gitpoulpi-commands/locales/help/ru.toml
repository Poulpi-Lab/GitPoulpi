reflog = "Показывает reflog, сначала новейшие: где раньше были `HEAD` или ветка, с датой и причиной от git, включая перемещения, сделанные в оболочке. У удалённой ветки reflog не остаётся. Пишется также `reflog restore` вместо `reflog-restore`"
