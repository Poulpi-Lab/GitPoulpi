"mcp serve --allow_remote" = "Разрешить `--http` на адресе, не являющемся loopback. Отклоняется, пока не включён `[mcp] http_auth` с готовым токеном и трафик не зашифрован (`[mcp] tls` или `behind_proxy` для туннеля либо обратного прокси, за которые вы ручаетесь); безопаснее `ssh -L` к эндпоинту на loopback"
