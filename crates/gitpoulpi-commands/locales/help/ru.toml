ai = "Помощники ИИ (выключены, пока нет `ai.enabled = true`): выводят созданное сообщение коммита или объясняют коммит либо рабочие изменения"
"ai --print_sent" = "Выводит, что было бы отправлено модели (системный и пользовательский текст после замены секретов и исключения конфиденциальных файлов), и ничего не отправляет. Нужен `ai.enabled = true`, но не нужны ни ключ, ни сеть"
"ai --send_all" = "Отправляет каждый ввод целиком, даже сверх его предела `ai.limits.*`. Без этого ввод сверх предела обрезается (конфликт отклоняется), а ответ сообщает, что обрезано, в `truncated: [{part, detail?, bytes, limit, setting}]`"
"commit --send_all" = "С `--ai`: отправляет весь diff, даже если он превышает `ai.limits.diff_bytes`. Без этого больший diff обрезается, и ответ сообщает об этом (`truncated`)"
"hosting review suggest --send_all" = "Отправляет каждый ввод целиком, даже сверх его предела `ai.limits.*` (diff, diff файла, описание, существующие комментарии, файлы контекста). Без этого ввод сверх предела обрезается, а ответ сообщает, что обрезано, в `truncated`"
"stash push --send_all" = "С `--ai`: отправляет весь diff, даже если он превышает `ai.limits.diff_bytes`. Без этого больший diff обрезается, и ответ сообщает об этом (`truncated`)"
"ai commit-message" = "Выводит сообщение коммита, которое ИИ предлагает для проиндексированных изменений (или для всех изменений, если ничего не в индексе). Ничего не коммитит"
"ai explain" = "Объясняет коммит (по умолчанию HEAD) или, с --wip, рабочие изменения"
"ai resolve-conflict" = "Выводит решение, которое ИИ предлагает для ОДНОГО конфликта слияния в файле с конфликтами (`--conflict N`, с 1; необязательно, если в файле один конфликт). Только выводит: ничего не записывается и не добавляется в индекс, решает вызывающий (`conflicts resolve --content-file` применяет результат для всего файла). Нужен `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Какой конфликт файла, с 1"
"ai resolve-conflict --path" = "Файл с конфликтом, относительно корня репозитория"
autostash = "Ожидающий auto-stash: GitPoulpi отложил локальные изменения, чтобы выполнить checkout, merge, rebase или pull, и ещё не вернул их"
"ai review-context" = "Показывает или задаёт, что получает черновик код-ревью ✦ помимо diff (`[ai.review]`): CLAUDE.md и AGENTS.md репозитория, ещё один файл (путь или ссылка) и запускается ли локальный агент в репозитории. Без `--repo` и `--project` это глобальное значение по умолчанию; `--repo PATH` - собственное значение одного клонированного репозитория, `--project HOST/PROJECT` - значение репозитория, который не клонирован. Без флага настройки выводит значения (`effective` - то, что получит ревью); с ним сохраняет значение и выводит результат. Модель не нужна, работает и при выключенном ИИ"
"ai review-context --agents_md" = "Передавать модели AGENTS.md репозитория"
"ai review-context --claude_md" = "Передавать модели CLAUDE.md репозитория"
"ai review-context --context_file" = "Ещё один файл: путь относительно корня репозитория, абсолютный путь или ссылка на файл на хостинге кода"
"ai review-context --no_context_file" = "Без дополнительного файла"
"ai review-context --no_extra_file" = "Без дополнительного файла для репозитория или проекта, что бы ни говорило общее значение (`on`, по умолчанию, если флаг один); `off` снова следует общему значению"
"ai review-context --project" = "Репозиторий, который не клонирован, в виде `HOST/PROJECT` (`github.com/owner/name`)"
"ai review-context --reset" = "Вместе с `--repo` или `--project`: забыть собственные значения репозитория (он снова следует глобальным) до применения флагов"
"ai review-context --run_in_repo" = "Запускать локального агента в репозитории (`yes`), не запускать (`no`) или по настройке его профиля ИИ (`profile`). Не для `--project`"
"autostash start-over" = "Начать заново: отбрасывает изменения в рабочем дереве у файлов stash (копия остаётся в `refs/gitpoulpi-backup/`), отменяет операцию, создавшую auto-stash (pull, checkout, merge, rebase), затем делает pop stash на исходном коммите. Останавливается с нетронутым stash, если какой-то шаг не удался. Код выхода 1 при отказе, 3 когда нужен `--yes`"
"autostash start-over --dry_run" = "Показать, что произойдёт, ничего не меняя"
"autostash start-over --yes" = "Продолжить; без этого ничего не меняется, а код выхода равен 3"
blame = "Авторство каждой строки файла в указанной ревизии"
"blame --at" = "Ревизия для blame (по умолчанию: HEAD)"
"branch delete-remote" = "Удаляет ветку на remote, сохраняя локальную ветку с тем же именем"
"branch fast-forward" = "Двигает `<branch>` вперёд до `<target>`, только если это fast-forward (разошедшаяся история отклоняется, ничего не сдвигается). Текущая ветка тянет за собой рабочее дерево, как `git merge --ff-only`; у любой другой ветки просто перемещается ссылка"
"branch fast-forward --target" = "Любая ревизия (по умолчанию: HEAD)"
"branch set-upstream" = "Заставляет `<branch>` отслеживать `<upstream>` (`origin/main`)"
"branch track" = "Создаёт локальную ветку, отслеживающую удалённую, и переключается на неё. `<upstream>` пишется так, как в списке ссылок (`origin/feature/login`); `--name` по умолчанию - часть с именем ветки"
"branch unset-upstream" = "Убирает upstream у `<branch>`"
"checkout --autostash" = 'Прячет локальные изменения, мешающие операции, выполняет её, затем делает pop stash (то же, что `general.auto_stash = "always"`)'
"cherry-pick --commits" = "Коммиты для применения, по порядку. Не указываются, если задан `--plan`"
"cherry-pick --plan" = "JSON `Vec<RebaseStep>` (формат как у `rebase --plan`; см. `rebase-plan`), из пути к файлу или `-` для stdin: шаги cherry-pick выполняются в порядке списка. Здесь имеют смысл только действия `Pick` и `Drop` (`Drop` пропускает коммит); любое другое отклоняется. Нельзя сочетать с коммитами в позиционных аргументах"
"clone --branch" = "Переключиться на эту ветку вместо HEAD по умолчанию на remote"
"clone --depth" = "Обрезать историю до этого числа коммитов (`git clone --depth`)"
"clone --no_lfs" = "Оставить файлы Git LFS указателями, не загружая их содержимое после клонирования"
"clone --origin" = "Назвать новый remote иначе, чем `origin`"
"clone --recurse_submodules" = "Клонировать также подмодули"
"commit --ai" = "Пусть ИИ напишет сообщение по проиндексированному diff, следуя инструкциям репозитория для сообщений коммитов (Настройки > ИИ). Нужны `ai.enabled = true` и настроенный профиль"
"commit --message" = "Сообщение коммита. Обязательно, если его не пишет --ai"
"commit --no_verify" = "Пропускает хуки коммита (`pre-commit`, `commit-msg`), как `commit --no-verify`"
completions = "Выводит в stdout скрипт автодополнения для оболочки (bash, zsh, fish, powershell или elvish), например `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Прерывает текущую операцию: HEAD, индекс и рабочее дерево возвращаются к состоянию до неё. Отбрасывает все разрешения, сделанные с тех пор"
"conflicts skip" = "Пропускает текущий cherry-pick или revert (или коммит, на котором остановился rebase): HEAD, индекс и рабочее дерево возвращаются к HEAD. Выход, когда он стал пустым (изменение уже применено). У merge нечего пропускать"
"conflicts check" = "Возник бы конфликт при слиянии HEAD в ветку, от которой он отошёл, и в каких файлах? Ничего не затрагивается (слияние в памяти). Базой служит цель известного pull request ветки, иначе ветка из разрешённых шаблонами «Базовые ветки» с наименьшим числом коммитов после ответвления. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Выключено, если выключен `general.conflict_detection` или переключатель репозитория"
"conflicts list" = "Файлы с конфликтами, у каждого - текст трёх сторон. С `--names-only`: только путь, вид конфликта и oid стадий (blob не читаются; дёшево для большого слияния)"
"conflicts resolve" = 'Разрешает один файл и добавляет его в индекс (файл перестаёт быть конфликтным). Ровно один из `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` или `--delete`. A и «ours» - текущая сторона (`HEAD`; при rebase - ветка, на которую перебазируют), B и «theirs» - входящая. Никогда не правьте маркеры конфликта вручную: выбирайте или записывайте итоговый текст в файл'
"conflicts resolve --both" = "Оставить обе стороны каждого конфликта (A, затем B) и собственное слияние git во всех остальных местах"
"conflicts resolve --content_file" = "Итоговый текст файла точно как есть (`-` читает стандартный ввод)"
"conflicts resolve --delete" = "Принять удаление: удалить файл (`git rm`)"
"conflicts resolve --encoding" = "С `--content-file`: записать текст в этой кодировке (метка WHATWG, например `windows-1252`) вместо UTF-8"
"conflicts resolve --expect" = "oid стадий, по которым принималось решение, `base,ours,theirs` (для отсутствующей стадии `-`). Вызов отклоняется как `stale`, если индекс больше не содержит ровно их. `--both` и `--pick` всегда проверяют читаемые стадии"
"conflicts resolve --no_stage" = "Записать файл рабочего дерева, но оставить его конфликтным (простое сохранение)"
"conflicts resolve --ours" = "То же, что `--side ours`"
"conflicts resolve --pick" = "Выбор для каждого номера конфликта: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = обе в таком порядке). Нужен для каждого конфликта, если `--default` не покрывает остальные"
"conflicts resolve --pick_default" = "С `--pick`: выбор для каждого конфликта, не указанного в списке"
"conflicts resolve --side" = "Взять весь файл из одной стадии, без автослияния"
"conflicts resolve --theirs" = "То же, что `--side theirs`"
"conflicts resolve --theirs_first" = "С `--both`: B, затем A"
"conflicts show" = "Один файл с конфликтом так, как его видит редактор слияния: подписи панелей, три стороны и пронумерованные области конфликта (`--json` - полный документ). Слитые области, которые git решил сам, не перечисляются; они остаются в результате `resolve --both`/`--pick`"
"conflicts show --conflict" = "Только конфликт N (с 1)"
"conflicts state" = "Текущие merge, rebase, cherry-pick или revert (`null`, если нет)"
"conflicts unresolve" = "Возвращает файл, разрешённый во время этой операции, в состояние конфликта (снова с маркерами). Отклоняется, если он всё ещё в конфликте или не был разрешён во время операции"
daemon = '`gitpoulpi server ...` - видимый псевдоним: владелец называет эту группу «сервер» и вводит `gp server stop`'
"daemon restart" = "`daemon stop`, затем `daemon start`"
"daemon run" = "Запускает демон этого сеанса на переднем плане (блокирует; Ctrl-C для остановки или `daemon stop`/`daemon restart`, отправленный откуда-то ещё). Именно это `daemon start` запускает отсоединённо, и это же можно выполнить напрямую в отдельном терминале"
"daemon start" = "Запускает демон этого сеанса как отсоединённый фоновый процесс (или сообщает, что он уже запущен). `--backend` закрепляет бэкенд, который указывается запущенному процессу; если не задан, запущенный процесс сам определяет `general.default_backend`"
"daemon status" = "Слушает ли демон этого сеанса и, если да, его порт, PID, время работы, бэкенд и версия сборки"
"daemon stop" = "Просит демон этого сеанса корректно завершиться; завершает записанный PID принудительно, только если он не ответил вовремя и только если это автономный демон (никогда не встроенный в работающий TUI)"
"daemon stop --all" = "Остановить демоны всех сеансов, для которых `session list` показывает файл порта, а не только этого"
discard = "Отбрасывает *неиндексированные* изменения файла в рабочем дереве: один hunk (`--hunk`), часть его строк (`--hunk --lines`) или - с одним `--file` - все незафиксированные изменения файла, включая проиндексированные (неотслеживаемый файл удаляется). Hunk'и и строки нумеруются так, как `gitpoulpi diff --json` нумерует неиндексированный diff. Всё отброшенное сохраняется в страховочном снимке, так что `gitpoulpi undo` вернёт это (включая неотслеживаемые файлы). Без подтверждения: это интерфейс для скриптов"
"discard --lines" = "Индексы строк через запятую внутри `--hunk`"
"fetch --all" = "Выполнить fetch для всех настроенных remote"
"fetch --prune" = "Удалить remote-tracking ветки, которых на remote больше нет"
"fetch --prune_tags" = "Также удаляет локальные теги, удалённые на remote (только те, что там были: тег, который никогда не отправляли, остаётся). Это `fetch.pruneTags` из Git, но уже по смыслу; без запроса выключено"
"fetch --remote" = "Если не указан: remote репозитория по умолчанию (см. `remote default`)"
gitpoulpi = "Лёгкий кроссплатформенный TUI-клиент Git, управляемый также через CLI/MCP."
"gitpoulpi --add" = "Открывает папку новой вкладкой уже запущенного GitPoulpi вместо запуска ещё одного (`gp -a`, `gp --add ../другая`). PATH по умолчанию - текущая папка, она приводится к содержащему её репозиторию. Одна запущенная сессия: она получает вкладку, а её окно выходит на передний план, если рабочий стол это позволяет. Несколько: вы выбираете одну из нумерованного списка (или задаёте `--session ИМЯ`). Ни одной: GitPoulpi запускается как обычно, в этой папке. Подкоманд не принимает; с `--json` выводит один объект (`action` равно `joined` или `cancelled`), код выхода 0, когда вкладка открыта, 3, когда занятое окно предложило её в чипе своей строки состояния"
"gitpoulpi --no_raise" = "С `--add`: не просит окно вывести свой терминал на передний план"
"gitpoulpi --backend" = "На каком `GitBackend` работает демон этой команды, с приоритетом над `general.default_backend` в config.toml и `GITPOULPI_GENERAL_DEFAULT_BACKEND` (флаги - вершина лестницы приоритетов - см. docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
На каком `GitBackend` работает демон этой команды, с приоритетом над `general.default_backend` в config.toml и `GITPOULPI_GENERAL_DEFAULT_BACKEND` (флаги - вершина лестницы приоритетов - см. docs/user/config-reference.md).

Выбирает бэкенд для демона, который эта команда *запускает*. Сеанс, демон которого уже работает, сохраняет бэкенд, с которым этот демон построен; у `gitpoulpi` нет способа подменить бэкенд живого демона под уже подписанными на него клиентами, а делать вид, что есть, было бы тем же молчаливым пустым действием, которого этот флаг призван избегать."""
"gitpoulpi --cwd_file" = """Файл, в который TUI записывает папку активной вкладки при выходе («Выйти и cd сюда» или всегда при `ui.tab_dir_follow = "auto"`). Предназначен для обёртки, которую выводит `gitpoulpi shell-init`; все подкоманды его игнорируют, так как вкладки есть только в TUI"""
"gitpoulpi --json" = "Выводить структурированный JSON вместо вывода для человека"
"gitpoulpi --lang" = "Язык текста `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
Язык текста `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Переводятся только пояснения - имена команд и флагов не меняются, - и `--help` остаётся английским, если это не указано (окружение намеренно игнорируется, чтобы у скриптов был стабильный вывод). Пример: `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Репозиторий, с которым работать. По умолчанию - репозиторий, содержащий текущую папку, так что `gitpoulpi status` ведёт себя как `git status`; агент, работающий с несколькими репозиториями, передаёт этот параметр вместо смены папки"
"gitpoulpi --session" = "Именованный сеанс. Если не указан, выводится из корня текущего репозитория (см. `gitpoulpi_config::default_session_name`), так что два репозитория получают два независимых демона, а всё, открытое внутри одного репозитория, делит один. Укажите, чтобы принудительно использовать один сеанс для двух репозиториев или назвать сеанс явно. Значение очищается перед использованием - оно становится именем файла"
"hosting checkout-pr" = "Переключается на pull/merge request, в том числе из форка: загружает его head (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) в локальную ветку `pr/<n>` (`mr/<n>` в GitLab), отслеживая его, и переключается на неё"
"hosting checkout-pr --id" = "Какая интеграция (см. `hosting prs`)"
"hosting checkout-pr --no_checkout" = "Только загрузить и создать/обновить ветку; остаться на месте"
"hosting checkout-pr --number" = "Номер PR (GitHub) или `iid` MR (GitLab)"
"hosting checkout-pr --remote" = "Remote, на котором находится запрос. По умолчанию - тот, по которому определён проект, иначе remote репозитория по умолчанию"
"hosting clone" = "Клонирует проект из `projects` по его полному пути, определяя URL клонирования через хостинг, а не заставляя пользователя вставлять его"
"hosting clone --https" = "Клонировать по HTTPS, а не по SSH"
"hosting clone --project" = "Полный путь проекта, как его выводит `hosting projects`"
"hosting edit-url" = "Выводит URL, где правится pull/merge request (представление `.../edit` в GitLab; GitHub правит на месте на странице запроса). С номером - этот запрос; иначе тот, что для `--branch` (по умолчанию: текущая ветка). Следует связи репозитория с pull/merge request, как `prs`. Запускает браузер только с `--open`"
"hosting edit-url --branch" = "Найти запрос по его исходной ветке"
"hosting edit-url --number" = "Номер запроса (`53` для `!53` / `#53`)"
"hosting edit-url --open" = "Также открыть URL в системном браузере"
"hosting file" = "Читает один файл проекта в заданной ревизии через API хостинга, без клона: текст как есть, остальные байты в base64 (`encoding`). Код выхода 1 и ошибка, если файла в этой ревизии нет"
"hosting file --id" = "Какая интеграция (см. `hosting list`); необязательно, если настроена только одна"
