"ai worktree-name --describe" = "Функция, ошибка или задача своими словами"
"ai hosting-reply" = "Print a draft the AI writes for a conversation on a code host: a comment, an answer in a thread (`--reply-to`), a comment on a line of code (`--path`), a review summary (`--review-summary`), or the description of a new issue (`--issue-title`). The conversation is read from `--conversation` (the JSON `hosting issue comments --json` or `hosting review conversation --json` prints, so `hosting issue comments 7 --json | ai hosting-reply --conversation -` works) or fetched by `--item`; the AI sees the item, the thread, the recent comments within `ai.limits.hosting_reply_context_bytes` and your `--hint`. **It only drafts: the answer is `{ draft, posted: false, ... }` and nothing is posted, edited or deleted**; posting is a separate command you run yourself. The base prompt is `ai.hosting_reply.base_prompt` (edit it in Settings > AI). Needs `ai.enabled = true`"
"ai hosting-reply --conversation" = "The conversation as JSON, as a `hosting` conversation command prints it: a file, `-` for standard input, or the JSON itself. Not for `--issue-title`"
"ai hosting-reply --draft" = "Your own text to improve instead of writing a new one"
"ai hosting-reply --flavor" = "The markup the host takes: `gfm`, `gitlab_md`, `gitea_md`, `common_mark`, `azure_md`, `bitbucket_md`, `html`, `jira_wiki`, `textile`, `youtrack_md`, `trello_md`, `plain_text`, `obsidian_md`. Default: the item's own"
"ai hosting-reply --hint" = "What you want in this answer (\"say I will look at it tomorrow\")"
"ai hosting-reply --issue_title" = "Draft the description of a new issue with this title (no conversation)"
"ai hosting-reply --item" = "The issue or pull request to answer, read from the host itself in the repository's linked source (`7` or `#7` an issue, `!7` a pull request): the same conversation `hosting issue comments 7 --json` prints, without the system events. Instead of `--conversation`"
"ai hosting-reply --line" = "With `--path`: the line"
"ai hosting-reply --path" = "Draft a new review comment on this file of the pull request"
"ai hosting-reply --read_repo" = "Let the AI read the repository for this draft (off unless given or `ai.hosting_reply.read_repository` is true). A local agent reads it itself with read-only tools in the repository folder; an API profile gets a context GitPoulpi builds (the files the conversation names, search hits, the map) within `ai.limits.hosting_reply_*`. The AI only drafts either way; nothing is posted"
"ai hosting-reply --refresh_context" = "Forget the context and the agent session kept from earlier drafts of this repository and read it again (with `--read-repo`)"
"ai hosting-reply --pr_base" = "With `--read-repo`: the base revision of the pull request, to put its diff (against the merge base) in the context"
"ai hosting-reply --pr_head" = "With `--read-repo`: the head revision of the pull request"
"ai hosting-reply --reply_to" = "Answer in the thread with this id (a code thread, a comment or a discussion)"
"ai hosting-reply --review_summary" = "Draft the summary of the review being submitted"
"split-commit" = "Разделяет коммит текущей ветки на несколько, от старого к новому, по JSON-плану (нумерацию см. в `split-source`). Последний новый коммит сохраняет исходное дерево, поэтому потомки и рабочее дерево не меняются; для отправленного коммита затем нужен force push. Один `undo` возвращает всё. Код выхода 2 при отказе"
"split-commit --commit" = "Коммит для разделения (любая ревизия: sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Проверяет план и перечисляет неназначенное; ничего не меняет"
"split-commit --plan" = "План (JSON) из пути к файлу или `-` для stdin. Элемент - это `path` плюс необязательный `hunk` плюс необязательные `lines` (индексы в `lines` hunk'а); элемент только с `path` - весь файл"
"split-commit --rest_message" = "Помещает всё, что план не назначил, в последний коммит с этим сообщением"
"split-commit --sign" = "Подписывает новые коммиты (и повторно созданных потомков)"
"split-source" = "Изменения коммита, пронумерованные для `split-commit`: каждый файл с его hunk'ами (`id`, строки) или, для файлов, которые можно назначить только целиком (двоичный, только режим, добавленный, удалённый, подмодуль, LFS), причина. Только чтение"
"split-source --commit" = "Коммит (любая ревизия: sha, `HEAD~2`, ...)"
rewrite = "Массовое переписывание истории (личности, даты, сообщения) по рецепту: `preview` строит план, ничего не меняя, `apply` выполняет проверенный вами план ОДНОЙ записью отмены, `run` делает и то и другое для скриптов. Отправляет что-либо только `push`: он принудительно отправляет переписанные ссылки, каждую с lease"
"rewrite apply" = "Применяет проверенный предпросмотр: сдвигает ссылки ОДНОЙ записью отмены (`gitpoulpi undo` вернёт всё). Ничего не отправляет. Код выхода 2 при отказе (репозиторий изменился после предпросмотра, неверный дайджест, ...), 3 если план двигает ссылки, которые есть на remote, а `--yes` не указан"
"rewrite apply --digest" = "Дайджест, который напечатал `rewrite preview`: проверенный вами план"
"rewrite apply --run" = "Идентификатор запуска, который напечатал `rewrite preview`"
"rewrite apply --yes" = "Подтверждает сдвиг ссылок, которые уже отправлены. Без него такой план ничего не меняет, а код выхода равен 3"
"rewrite diff" = "Что правило содержимого сделало с одним файлом одного коммита из проверенного запуска: сравнение старого и нового файла. Строки, которые удаляет правило секретов, скрыты. Только чтение"
"rewrite diff --commit" = "Коммит в том виде, какой он до переписывания (id из строк)"
"rewrite diff --path" = "Файл относительно корня репозитория"
"rewrite diff --run" = "Идентификатор запуска, который напечатал `rewrite preview`"
"rewrite discard" = "Отбрасывает проверенный запуск, не применяя его. Повторное отбрасывание не страшно"
"rewrite discard --run" = "Идентификатор запуска, который напечатал `rewrite preview`"
"rewrite preview" = "Строит план переписывания истории, ничего не меняя: счётчики, ссылки, которые сдвинутся, предупреждения и первые строки. Держит план в демоне как запуск (`run`, `digest`) для `rewrite rows` и `rewrite apply`. Предпросмотр хранится и на диске, в git-каталоге репозитория, поэтому `rewrite apply` работает из более поздней команды, после перезапуска демона или из другого интерфейса, не запуская демон; демон, делавший предпросмотр, нужен только для `rewrite rows` (работающий, либо укажите `--all` в предпросмотре). Код выхода 2, если рецепт отклонён"
"rewrite preview --all" = "Печатает каждый изменённый коммит"
"rewrite preview --all_local" = "Переписывает все локальные ветки и теги, а не только текущую ветку"
"rewrite preview --committer" = "Коммитер переписанных коммитов: `keep` (по умолчанию) или `me-now`"
"rewrite preview --include_protected" = "Переписывает также эти защищённые ветки, уже отправленные (по умолчанию исключены; можно повторять)"
"rewrite preview --lfs_export" = "Правило LFS: превратить указатели LFS, подходящие под этот glob, обратно в настоящие файлы в каждом коммите (можно повторять). Объекты должны быть в локальном хранилище LFS (сначала `lfs fetch`); иначе отказ со списком"
"rewrite preview --encoding_exclude" = "Вместе с `--reencode`: файлы, которые не трогать (globs, можно повторять)"
"rewrite preview --encoding_fallback" = "Вместе с `--reencode`: в какой кодировке читать файл без метки и не в UTF-8, когда исходная кодировка определяется (по умолчанию `windows-1252`)"
"rewrite preview --encoding_paths" = "Вместе с `--reencode`: файлы, которые преобразовать (globs, можно повторять)"
"rewrite preview --eol" = "Правило окончаний строк: каждый текстовый файл, подходящий под `--eol-paths`, получает это окончание (`lf` для Linux и macOS, `crlf` для Windows, `cr` для классического Mac); смешанные окончания приводятся к одному, двоичные файлы пропускаются"
"rewrite preview --eol_exclude" = "Вместе с `--eol`: файлы, которые не трогать (globs, можно повторять)"
"rewrite preview --eol_follow_attributes" = "Вместе с `--eol`: читать корневой `.gitattributes` каждого коммита: файлы с `-text` и `binary` пропускаются, а файлы с `eol=lf` и `eol=crlf` сохраняют своё окончание"
"rewrite preview --eol_paths" = "Вместе с `--eol`: файлы, которые преобразовать (globs, можно повторять; шаблон без слеша совпадает на любой глубине)"
"rewrite preview --reencode" = "Правило кодировки: текстовые файлы, подходящие под `--encoding-paths`, преобразуются в эту кодировку (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). Двоичные файлы, файлы, которые не читаются в исходной кодировке, и символы, которые не вмещает целевая, остаются как есть и подсчитываются"
"rewrite preview --reencode_from" = "Вместе с `--reencode`: кодировка, в которой записаны файлы. Если не указана, определяется для каждого файла (метка порядка байтов, корректный UTF-8, иначе `--encoding-fallback`)"
"rewrite preview --strip_exec" = "Правило режима файла: бит исполняемости (100755 становится 100644) снимается с файлов, подходящих под эти globs (можно повторять). Содержимое не меняется"
"rewrite preview --strip_exec_exclude" = "Вместе с `--strip-exec`: файлы, у которых бит исполняемости остаётся (globs)"
"rewrite preview --lfs_import" = "Правило LFS: перенести файлы, подходящие под этот glob, в Git LFS в каждом коммите (можно повторять; в стиле `.gitattributes`: шаблон без слеша совпадает на любой глубине). Нужен git-lfs. Содержимое попадает в локальное хранилище LFS, а в `.gitattributes` добавляется строка `filter=lfs`; объекты затем нужно отправить"
"rewrite preview --lfs_min_size" = "Вместе с `--lfs-import`: переносятся только файлы не меньше этого числа байт"
"rewrite preview --limit" = "Сколько изменённых коммитов печатать (по умолчанию 50)"
"rewrite preview --match_email" = "Правило личности: совпадение с этим email автора или коммитера"
"rewrite preview --match_name" = "Правило личности: совпадение с этим именем автора или коммитера"
"rewrite preview --prune_empty" = "Коммиты, которые правило содержимого делает пустыми: `auto` удаляет их (по умолчанию), `never` оставляет"
"rewrite preview --recipe" = "Файл рецепта (TOML или JSON, формат окна переписывания в TUI) или `-` для JSON со стандартного ввода"
"rewrite preview --recipe_json" = "Рецепт в виде JSON-строки (для вызывающих, которые не могут записать файл)"
"rewrite preview --refs" = "Переписывает только эти локальные ветки или теги (можно повторять)"
"rewrite preview --remove_blobs_over" = "Правило содержимого: убирает из каждого коммита все файлы больше этого числа байт"
"rewrite preview --remove_findings" = "Правило содержимого: удалить секрет, найденный командой `rewrite scan-secrets`, по id находки (можно повторять) или `all` для всех находок в области. Демон сканирует заново и сам разрешает id: значение не попадает ни в командную строку, ни в рецепт, ни в журнал"
"rewrite preview --remove_paths" = "Правило содержимого: убирает из каждого коммита файлы и папки, подходящие под этот glob (можно повторять; шаблон без слеша совпадает на любой глубине)"
"rewrite preview --replace_content" = "Правило содержимого `НАЙТИ=НА_ЧТО`: заменяет дословный текст во всех текстовых файлах (можно повторять; двоичные файлы пропускаются и считаются). Для секретов используйте в рецепте правило `content_replace` вместе с `--secrets-file`"
