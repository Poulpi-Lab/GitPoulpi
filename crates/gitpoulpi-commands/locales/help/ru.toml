rm-file = "Удаляет файлы (или каталоги) из рабочего дерева; индекс не затрагивается, так что отслеживаемый файл показывается как удалённое изменение. Отменяется через `gitpoulpi undo`, который восстанавливает точные байты"
"rewrite apply --target" = "Папка нового репозитория, если план выносит подпапку как клон или подмодуль (см. `--extract-mode`)"
"rewrite maps" = "`commit-map` и `ref-map` запуска (формат git-filter-repo: строка заголовка, затем `old new` в строке; очистка репозитория в GitLab принимает карту коммитов). Выводит их пути или копирует в `--out`"
"rewrite maps --out" = "Скопировать оба файла в эту папку (создаётся, если её нет)"
"rewrite maps --run" = "Идентификатор запуска; `latest` (по умолчанию) - последний применённый запуск"
"rewrite note" = "Памятка для тех, у кого осталась старая история: для каждой отправленной ветки и тега - старая и новая вершина и что выполнить (`git fetch`, затем `git reset --hard origin/<branch>` или `git rebase --onto`). Только чтение"
"rewrite note --run" = "Идентификатор запуска; `latest` (по умолчанию) - последний применённый запуск"
"rewrite preview --extract" = "Правило путей: оставить только эту подпапку, она становится корнем; коммиты, не затрагивающие её, отбрасываются, а слияния упрощаются. Спрашивается каждый раз: укажите `--extract-mode`, иначе код выхода 3 и предпросмотра не будет. Вынос выполняется раньше остальных флагов путей"
"rewrite preview --extract_mode" = "Чем закончится `--extract`: `clone` (новый локальный клон в `--target`, оригинал не трогается; все локальные ветки и теги), `in-place` (история этого репозитория переписывается, одна запись отмены) или `submodule` (клон, как в `clone`, а один новый коммит в текущей ветке заменяет папку подмодулем на его основе; эта история сохраняется)"
"rewrite preview --into_subdir" = "Правило путей: перенести весь репозиторий в эту подпапку в каждом коммите (чтобы объединять репозитории без конфликтов путей)"
"rewrite preview --move_paths" = "Правило путей `ОТКУДА=КУДА`: переименовать файл или папку в каждом коммите, те же блобы и деревья по новому пути (можно повторять, по порядку, после правил содержимого). Коммит, где `КУДА` уже существует, не меняется: предпросмотр отклоняется (код выхода 2, `path_collision`) со списком коммитов и путей"
"rewrite preview --target" = "Папка нового репозитория для `--extract-mode clone` или `submodule`: она не должна существовать (или должна быть пустой) и не может лежать внутри этого репозитория. Используется командой `rewrite run`; у `rewrite apply` свой"
"rewrite push" = "Отправляет ссылки, сдвинутые применённым запуском и бывшие на remote, каждую с `--force-with-lease=<ref>:<id, который был на remote при предпросмотре>` (никогда не простой force), одним `--atomic` push на remote, если сервер это позволяет (иначе по одному push на ссылку, и ответ об этом скажет). Теги включены. Защищённые ветки (`rewrite.protected_branches`) не отправляются, пока не названы через `--include-protected` или не выбраны все через `--include-all-protected`. Ссылка, чей remote сдвинулся после предпросмотра, отклоняется (сделайте fetch, проверьте и запустите снова). Необратимо: remote сохранит новую историю, даже если вы сделаете `undo` переписывания локально. Без `--yes` (или с `--dry-run`) ничего не отправляется: ответ перечисляет, что было бы отправлено, а код выхода без `--yes` равен 3. Код выхода 2, если запуска уже нет, и 4, если ссылка отклонена или не отправлена"
"rewrite push --dry_run" = "Спросить remote, что произойдёт (lease проверяются), и ничего не отправлять"
"rewrite push --include_all_protected" = "Отправить также все защищённые ветки запуска"
"rewrite push --include_protected" = "Отправить также эту защищённую ветку (можно повторять)"
"rewrite push --no_atomic" = "Один push на ссылку вместо одного `--atomic` push по принципу «всё или ничего»"
"rewrite push --remote" = "Только ссылки этого remote"
"rewrite push --run" = "Идентификатор запуска, который вывел `rewrite apply`; `latest` (по умолчанию) - последний применённый запуск"
"rewrite push --yes" = "Выполнить отправку. Без него ничего не отправляется (код выхода 3)"
"rewrite purge" = "Навсегда удаляет из этого клона старую историю переписывания: снимает точки отмены этого переписывания (и любой более ранней операции, чьи точки тоже удерживают старую историю), истекает записи reflog, которые на неё ссылаются, удаляет объекты (`gc --prune=now`) и проверяет, что их больше нет. Отмена для этих операций больше невозможна (в `undo --list` они остаются как очищенные). После запуска это нельзя остановить и нельзя отменить. Всё, что ещё удерживает старую историю (ветка вне переписывания, stash, HEAD другого рабочего дерева, remote-tracking ссылка: сделайте fetch после push), блокирует очистку, и ничего не меняется. Ничего не отправляется ни на один remote; ответ перечисляет шаги, которые нужны на хосте (GitHub, GitLab, Azure DevOps, Bitbucket). Без `--yes` ничего не происходит: ответ говорит, что было бы удалено и потеряно, а код выхода равен 3. Код выхода 2, если запись не является переписыванием, и 4, если что-то блокирует очистку или объекты остались. Через MCP - только при `[mcp] allow_history_purge = true`"
"rewrite purge --all" = "Все переписывания истории из истории отмены"
"rewrite purge --entries" = "Запись о переписывании истории из истории отмены (`undo --list`; можно повторять). По умолчанию - последнее переписывание, которое ещё не очищено"
"rewrite purge --latest" = "Последнее переписывание, которое ещё не очищено (по умолчанию)"
"rewrite purge --yes" = "Выполнить удаление. Без него ничего не меняется (код выхода 3)"
"rewrite run --extract" = "Правило путей: оставить только эту подпапку, она становится корнем; коммиты, не затрагивающие её, отбрасываются, а слияния упрощаются. Спрашивается каждый раз: укажите `--extract-mode`, иначе код выхода 3 и предпросмотра не будет. Вынос выполняется раньше остальных флагов путей"
"rewrite run --extract_mode" = "Чем закончится `--extract`: `clone` (новый локальный клон в `--target`, оригинал не трогается; все локальные ветки и теги), `in-place` (история этого репозитория переписывается, одна запись отмены) или `submodule` (клон, как в `clone`, а один новый коммит в текущей ветке заменяет папку подмодулем на его основе; эта история сохраняется)"
"rewrite run --into_subdir" = "Правило путей: перенести весь репозиторий в эту подпапку в каждом коммите (чтобы объединять репозитории без конфликтов путей)"
"rewrite run --move_paths" = "Правило путей `ОТКУДА=КУДА`: переименовать файл или папку в каждом коммите, те же блобы и деревья по новому пути (можно повторять, по порядку, после правил содержимого). Коммит, где `КУДА` уже существует, не меняется: предпросмотр отклоняется (код выхода 2, `path_collision`) со списком коммитов и путей"
"rewrite run --target" = "Папка нового репозитория для `--extract-mode clone` или `submodule`: она не должна существовать (или должна быть пустой) и не может лежать внутри этого репозитория. Используется командой `rewrite run`; у `rewrite apply` свой"
"rm-file --paths" = "Пути относительно репозитория для удаления"
