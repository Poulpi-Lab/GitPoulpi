treat = "Заставляет git считать файлы двоичными или текстовыми, записывая правило `.gitattributes` (`binary` или `text diff`) для путей: по умолчанию файл в корне репозитория, `--file` для файла папки или `.git/info/attributes` (только этот клон). Правило, уже называющее тот же шаблон, переписывается, а не противоречит. Ответ говорит, действительно ли git теперь так считает пути (`effective`). Отменяется через `gitpoulpi undo`, кроме `.git/info/attributes`"
