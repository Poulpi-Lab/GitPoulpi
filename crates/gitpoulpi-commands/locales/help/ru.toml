"repo-auth set --yes" = "Подтверждает помощник или команду токена без интерактивного вопроса (команда и её хэш всё равно печатаются)"
"repo-auth show" = "Показывает, под какой учётной записью этот репозиторий проходит аутентификацию: сохранённый профиль, данные, которые будет использовать каждый remote, настройки, которые профиль переопределяет, и предупреждения. Секреты не печатаются никогда; помощник или команда токена печатаются только человеку (агент получает `{set, sha256}`)"
"repo-auth test" = "Проверяет подключение каждого remote (или одного) с применённым профилем, ничего не меняя: перечисляет ветки remote или, с `--push`, спрашивает, будет ли push принят. Отвечает отчётом по каждому remote и использованной учётной записью. Обращается к сети"
"repo-auth test --push" = "Также проверить, будет ли push принят"
"repo-auth test --remote" = "Только этот remote (по умолчанию: каждый remote)"
"apply-commit" = "Применить изменения, сделанные одним коммитом (даже потерянным), только к рабочему дереву: индекс и HEAD не меняются. Всё или ничего: если файл не применяется чисто, ничего не меняется (`stash from-commit` сохранит изменения как stash). Merge-коммит отклоняется. `undo` возвращает всё назад"
"apply-commit --commit" = "Коммит, изменения которого применить (любая ревизия: sha, `HEAD~2`, ...)"
"stash from-commit" = "Сохранить изменения, сделанные одним коммитом (даже потерянным), как новый stash, не трогая рабочее дерево. `undo` снова удаляет его"
"stash from-commit --commit" = "Коммит, изменения которого сохранить (любая ревизия: sha, `HEAD~2`, ...)"
"stash from-commit --message" = "Сообщение stash; если не указано, берётся сообщение с названием коммита"
"branch upstream" = "Несколько remote одной ветки: основной upstream, дополнительные цели push и необязательные источники pull; хранятся в отдельном разделе конфигурации"
"branch upstream add" = "Добавляет `<remote>[:<dst>]` как дополнительную цель push (`<dst>` - имя ветки на этом remote, по умолчанию то же). Можно отменить"
"branch upstream add --branch" = "Ветка (по умолчанию текущая)"
"branch upstream add --pull" = "Сделать её также источником pull"
"branch upstream add --target" = "`<remote>` или `<remote>:<dst>`"
"branch upstream list" = "Основной upstream ветки, её дополнительные цели push и источники pull, у каждого его состояние (впереди, позади, отношение) по ссылкам удалённого отслеживания как есть. Только чтение, без сети"
"branch upstream list --branch" = "Ветка (по умолчанию текущая)"
"branch upstream primary" = "Задать основной upstream (`origin/main`): тот же запрос, что и `branch set-upstream`"
"branch upstream primary --branch" = "Ветка (по умолчанию текущая)"
"branch upstream pull" = "Включает или выключает `<remote>[:<dst>]` как источник pull: обычный pull тогда подтягивает и его"
"branch upstream pull --branch" = "Ветка (по умолчанию текущая)"
"branch upstream pull --off" = "Больше не подтягивать с него"
"branch upstream pull --on" = "Сделать его источником pull"
"branch upstream pull --target" = "`<remote>` или `<remote>:<branch>`"
"branch upstream remove" = "Убирает все дополнительные цели push и источники pull, названные `<remote>`. Основной upstream не меняется (используйте `unset-upstream`). Можно отменить"
"branch upstream remove --branch" = "Ветка (по умолчанию текущая)"
"remote-group" = "Ветка с несколькими remote (дополнительные цели push, источники pull): её состояние относительно каждого. Менять их - `branch upstream`"
"remote-group status" = "Состояние текущей ветки (или `--branch`) относительно каждого её remote: основной upstream, дополнительные цели push, источники pull. Только чтение, без сети"
"remote-group status --branch" = "Ветка (по умолчанию текущая)"
"pull --all_sources" = "Выполняет pull основного upstream и каждого источника pull ветки (см. `branch upstream pull`), каждого с `--mode`. Сначала строит план: всё, кроме fast-forward или собственной интеграции режима, требует `--resolve` (код выхода 3, ничего не изменено). Остановка на конфликтах завершается кодом 4 и `stopped`; продолжить можно через `remote-group continue`"
"pull --branch" = "С `--all-sources`: ветка (по умолчанию текущая)"
"pull --no_preflight" = "С `--all-sources`: не опрашивать remote заранее"
"pull --resolve" = "С `--all-sources`: `REMOTE=ff|merge|rebase|skip` (можно повторять), решение для remote, о котором спросил план"
"push --all_targets" = "Выполняет push в основной upstream и каждую дополнительную цель push ветки (см. `branch upstream add`). Сначала строит план: если каждый remote - простой push или уже актуален, выполняет, иначе отвечает `needs_resolution` (код выхода 3, ничего не изменено). Код 4: какой-то remote завершился ошибкой или merge остановился на конфликтах (`stopped`)"
"push --no_preflight" = "Не опрашивать remote заранее (использовать ссылки удалённого отслеживания)"
"push --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (можно повторять): решение для remote, о котором спросил план"
"push --tags" = "Также выполнить push ещё не отправленных тегов на каждый remote, принявший ветку"
"push --to" = "Выполнить push ровно на эти remote (`<remote>` или `<remote>:<dst>`, можно повторять) только для этого push; конфигурация не меняется. Тот же план, `--resolve` и выполнение, что у `--all-targets`"
"push --yes" = "Подтверждает force push, выбранный через `--resolve REMOTE=force`. Без этого такой push ничего не меняет и завершается кодом 3"
"remote-group abort" = "Отбрасывает сохранённый групповой запуск: прерывает начатые им merge или rebase. Уже выполненные push остаются"
"remote-group abort --run" = "Id сохранённого запуска, чтобы убедиться, что это тот самый"
"remote-group continue" = "Возобновляет сохранённый групповой запуск после завершения его merge или rebase (никогда не автоматически). На `needs_resolution` отвечает через `--resolve`"
"remote-group continue --branch" = "Ветка (по умолчанию текущая); учитывается только с `--resolve`"
"remote-group continue --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (можно повторять): решение для remote, о котором спросил предыдущий ответ"
"remote-group continue --run" = "Id сохранённого запуска, чтобы убедиться, что это тот самый"
"remote-group continue --yes" = "Подтверждает force push, названные в `--resolve`"
"remote-group plan" = "Что сделал бы групповой push (или, с `--pull`, групповой pull) по каждому remote: состояние каждого, предлагаемое действие и остальные допустимые. Опрашивает remote (`ls-remote`, fetch для тех, чья вершина неизвестна), если нет `--no-preflight`; ничего не меняет"
"remote-group plan --branch" = "Ветка (по умолчанию текущая)"
"remote-group plan --no_preflight" = "Не опрашивать remote: использовать ссылки удалённого отслеживания как есть"
"remote-group plan --pull" = "Построить план группового pull (основной upstream и источники pull)"
"remote-group plan --to" = "Построить план push ровно на эти remote (`<remote>` или `<remote>:<dst>`, можно повторять) вместо настроенных целей"
"remote-group retry" = "Повторно выполняет цели сохранённого запуска, которые завершились ошибкой, были отменены посреди push или ни разу не пробовались"
"remote-group retry --run" = "Id сохранённого запуска, чтобы убедиться, что это тот самый"
