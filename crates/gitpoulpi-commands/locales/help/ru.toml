undo-restore = "«Восстановить только это»: возвращает то, что удалила одна из прежних операций (удалённую ветку или тег, сброшенный stash, отброшенный или удалённый файл, удалённый remote, строку игнорирования), не отменяя операции после неё. Восстановление - новая запись журнала, поэтому `undo` откатывает и его. Ничего не перезаписывается: у файла, изменившегося с тех пор, сохранённая версия кладётся рядом как `<name>.restored`; reset, amend или rebase возвращаются новой веткой на прежней вершине. Пишется также `gitpoulpi undo restore <id>`. Код выхода 2, когда это невозможно (в JSON названа причина)"
"undo-restore --dry_run" = "Показать, что произойдёт, ничего не меняя"
"undo-restore --id" = "Запись для восстановления, с id из `undo --list`"
"undo-restore --name" = "Восстановить ветку или тег под этим именем (когда прежнее имя занято или для ветки, которую восстанавливают после reset, amend или rebase)"
