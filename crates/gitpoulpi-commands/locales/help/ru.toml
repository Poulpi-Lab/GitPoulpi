"rebase --autostash" = 'Прячет локальные изменения, мешающие операции, выполняет её, затем делает pop stash (то же, что `general.auto_stash = "always"`)'
"rebase --continue_" = "Продолжить rebase, остановленный конфликтом или шагом `edit`"
