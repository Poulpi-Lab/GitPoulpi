"search" = "Нечёткий поиск по веткам, тегам, worktree, stash'ам и сообщениям коммитов текущего репозитория или всех репозиториев рабочего пространства, а также по кешированным запросам на слияние и задачам. Результаты идут от лучшего к худшему, с совпавшими символами. Префикс сужает поиск: `b:` ветки, `t:` теги, `c:` коммиты, `s:` stash'и, `w:` worktree, `pr:` запросы на слияние, `i:` задачи, `r:` репозитории (только для рабочего пространства)"
"search --kinds" = "Только эти типы (можно повторять); по умолчанию все. Префикс в запросе сужает поиск ещё сильнее"
"search --limit" = "Не больше стольких результатов"
"search --query" = "Что искать, вместе с префиксом (`c: fix login`)"
"search --workspace" = "Искать во всех репозиториях этого рабочего пространства (id; также `GITPOULPI_WORKSPACE`). Без него - в текущем репозитории"
