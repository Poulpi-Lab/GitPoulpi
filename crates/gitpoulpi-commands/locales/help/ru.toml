"mailmap list" = "Перечисляет все имена и email, которые были автором или коммитером коммита из области, с числом коммитов как автора и как коммитера, сначала с наибольшим числом, и личность, с которой их уже сопоставляет `.mailmap` (`mapped_to`). Только чтение"
