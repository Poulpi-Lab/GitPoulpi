"rewrite script check#long" = """
Компилирует Lua-скрипт и печатает его заголовок (имя, окно, параметры), определённые функции и все проблемы. Код выхода 2, если есть проблемы. Только чтение; ни один коммит не обрабатывается.

Для скрипта shell, Python или внешнего Lua (не в песочнице) он также сообщает, найден ли интерпретатор и доверяют ли скрипту, а для доверенного делает пробное рукопожатие: запускает скрипт один раз с выдуманным коммитом (`"dry_run": true`) и проверяет ответ. Недоверенный скрипт не запускается никогда."""
