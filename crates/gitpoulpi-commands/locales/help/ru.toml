"mcp serve --ui_control" = "Насколько далеко агент может двигать окно пользователя инструментами `ui_*`: `ask` (по умолчанию: окно показывает плашку, которую пользователь подтверждает), `auto` или `off`. Переопределяет `[mcp] ui_control`"
"mcp token" = "Bearer-токен HTTP-эндпоинта (`mcp serve --http`): показывает его в маскированном виде как JSON `{token_hint, path, rotated}`, создавая при первом использовании. Клиент отправляет его как `Authorization: Bearer <token>`. Это не инструмент MCP: агент никогда не читает и не заменяет свой ключ"
