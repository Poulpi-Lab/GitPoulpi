"rewrite tools --fresh" = "Проверить заново, а не отвечать из минутного кэша"
mailmap = "`.mailmap`: одно каноническое имя и email для людей, коммитивших под несколькими. Log, blame и история файла показывают сопоставленные имена (`log.use_mailmap`), не затрагивая коммиты. `list` считает личности в истории и показывает, какие уже сопоставлены, `check` показывает, как разрешаются некоторые личности, `add` сводит личности в одну, дописывая строки в `.mailmap` (файл правится, но не коммитится; отменяемо)"
"mailmap add" = "Сводит личности в одну каноническую, дописывая строки в `.mailmap` (файл создаётся, если его нет; уже имеющаяся строка не повторяется). Файл правится, но не коммитится: закоммитьте его сами. Одна отменяемая запись (`gitpoulpi undo` вернёт прежний файл). Log сразу показывает каноническую личность (`log.use_mailmap`); сохранённые коммиты не меняются, поэтому force push не нужен. Чтобы переписать сами коммиты, используйте правило `mailmap` в `rewrite`"
