"undo-forget" = "Tar bort den blockerade översta posten ur ångra-journalen (avbruten åtgärd, eller så har arkivet gått vidare) så att posterna under kan ångras. Rör aldrig arkivet, bara journalen; posten kan sedan varken ångras eller göras om. Slutkod 2 om översta posten inte är blockerad, 3 utan `--yes`"
