"rewrite preview --extract" = "Sökvägsregel: behåll bara den här undermappen, som blir roten; commits som inte rör den tas bort och merges förenklas. Frågas varje gång: ange `--extract-mode`, annars blir slutkoden 3 och ingenting förhandsgranskas. Extraktionen körs före de andra sökvägsflaggorna"
"rewrite preview --extract_mode" = "Hur `--extract` slutförs: `clone` (en ny lokal klon i `--target`, originalet rörs inte; varje lokal gren och tag), `in-place` (det här repositoryts historik skrivs om, en ångrapost) eller `submodule` (klonen som i `clone`, och en ny commit på aktuell gren ersätter mappen med en submodul av den; den här historiken behålls)"
"rewrite preview --into_subdir" = "Sökvägsregel: flytta hela repositoryt in i den här undermappen i varje commit (för att slå ihop repositories utan sökvägskrockar)"
"rewrite preview --move_paths" = "Sökvägsregel `FROM=TO`: byt namn på en fil eller mapp i varje commit, med samma blobbar och träd på den nya sökvägen (kan upprepas, i ordning, efter innehållsreglerna). En commit där `TO` redan finns ändras inte: förhandsgranskningen avvisas (slutkod 2, `path_collision`) och listar commits och sökvägar"
"rewrite preview --target" = "Mappen för det nya repositoryt vid `--extract-mode clone` eller `submodule`: den får inte finnas eller måste vara tom, och får inte ligga inuti det här repositoryt. Används av `rewrite run`; `rewrite apply` tar sin egen"
"rewrite push" = "Pusha de refs som en tillämpad körning flyttade och som fanns på en remote, var och en med `--force-with-lease=<ref>:<the id the remote had when you previewed>` (aldrig en vanlig force), en `--atomic`-push per remote där servern tillåter det (annars en push per ref, och svaret säger det). Taggar ingår. Skyddade grenar (`rewrite.protected_branches`) utelämnas om de inte anges med `--include-protected`, eller alla med `--include-all-protected`. En ref vars remote har flyttats sedan förhandsgranskningen avvisas för just den refen (gör fetch och granska, kör sedan igen). Går inte att ångra: remoten behåller den nya historiken även om du gör `undo` på omskrivningen lokalt. Utan `--yes` (eller med `--dry-run`) skickas ingenting: svaret listar vad som skulle pushas, och slutkoden är 3 utan `--yes`. Slutkod 2 när körningen inte finns kvar, 4 när en ref avvisades eller inte pushades"
"rewrite push --dry_run" = "Fråga remoten vad som skulle hända (lease kontrolleras) och skicka ingenting"
"rewrite push --include_all_protected" = "Pusha även varje skyddad gren i körningen"
"rewrite push --include_protected" = "Pusha även den här skyddade grenen (kan upprepas)"
"rewrite push --no_atomic" = "En push per ref i stället för en enda allt-eller-inget-push med `--atomic`"
"rewrite push --remote" = "Bara refs för den här remoten"
"rewrite push --run" = "Körningens id som `rewrite apply` skrev ut; `latest` (standard) är den senast tillämpade körningen"
"rewrite push --yes" = "Kör på och pusha. Utan den skickas ingenting (slutkod 3)"
"rewrite purge" = "Radera den gamla historiken från en omskrivning ur den här klonen för gott: tar bort omskrivningens ångra-fästen (och de hos tidigare åtgärder vars fästen också håller den gamla historiken), låter de reflog-poster som nämner den gå ut, rensar objekten (`gc --prune=now`) och kontrollerar att de är borta. Ångra går inte längre för de åtgärderna (de finns kvar i `undo --list` som rensade). Det går inte att stoppa när det väl har börjat och det går inte att ångra. Allt som fortfarande håller den gamla historiken (en gren utanför omskrivningen, en stash, en annan worktrees HEAD, en remote-spårande ref: gör fetch efter pushen) stoppar den, och ingenting ändras. Inget skickas till någon remote; svaret listar de steg värden kräver (GitHub, GitLab, Azure DevOps, Bitbucket). Utan `--yes` händer ingenting: svaret säger vad som skulle raderas och gå förlorat, och slutkoden är 3. Slutkod 2 när posten inte är en omskrivning, 4 när något stoppar den eller objekt finns kvar. Via MCP bara med `[mcp] allow_history_purge = true`"
"rewrite purge --all" = "Varje historikomskrivning i ångrahistoriken"
"rewrite purge --entries" = "En historikomskrivning i ångrahistoriken (`undo --list`; kan upprepas). Standard: den nyaste omskrivningen som inte är rensad"
"rewrite purge --latest" = "Den nyaste omskrivningen som ännu inte är rensad (standard)"
"rewrite purge --yes" = "Kör på och radera. Utan den ändras ingenting (slutkod 3)"
"rewrite run --extract" = "Sökvägsregel: behåll bara den här undermappen, som blir roten; commits som inte rör den tas bort och merges förenklas. Frågas varje gång: ange `--extract-mode`, annars blir slutkoden 3 och ingenting förhandsgranskas. Extraktionen körs före de andra sökvägsflaggorna"
"rewrite run --extract_mode" = "Hur `--extract` slutförs: `clone` (en ny lokal klon i `--target`, originalet rörs inte; varje lokal gren och tag), `in-place` (det här repositoryts historik skrivs om, en ångrapost) eller `submodule` (klonen som i `clone`, och en ny commit på aktuell gren ersätter mappen med en submodul av den; den här historiken behålls)"
"rewrite run --into_subdir" = "Sökvägsregel: flytta hela repositoryt in i den här undermappen i varje commit (för att slå ihop repositories utan sökvägskrockar)"
"rewrite run --move_paths" = "Sökvägsregel `FROM=TO`: byt namn på en fil eller mapp i varje commit, med samma blobbar och träd på den nya sökvägen (kan upprepas, i ordning, efter innehållsreglerna). En commit där `TO` redan finns ändras inte: förhandsgranskningen avvisas (slutkod 2, `path_collision`) och listar commits och sökvägar"
"rewrite run --target" = "Mappen för det nya repositoryt vid `--extract-mode clone` eller `submodule`: den får inte finnas eller måste vara tom, och får inte ligga inuti det här repositoryt. Används av `rewrite run`; `rewrite apply` tar sin egen"
"rm-file --paths" = "Repo-relativa sökvägar att radera"
