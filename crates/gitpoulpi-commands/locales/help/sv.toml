"rewrite preview" = "Planera en historikomskrivning utan att ändra något: antal, refs som skulle flyttas, varningar och de första raderna. Behåller planen i daemonen som en körning (`run`, `digest`) för `rewrite rows` och `rewrite apply`. Förhandsgranskningen finns också på disk i repositoryts git-katalog, så `rewrite apply` fungerar från ett senare kommando, efter en omstart av daemonen eller från ett annat gränssnitt, utan att starta någon daemon; bara `rewrite rows` behöver daemonen som förhandsgranskade (en som körs, eller använd `--all` på förhandsgranskningen). Slutkod 2 när receptet avvisas"
