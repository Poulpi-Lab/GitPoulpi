"rewrite tools --fresh" = "Sondera igen i stället för att svara från minutcachen"
"mailmap" = "`.mailmap`: ett kanoniskt namn och en kanonisk e-postadress för personer som har committat under flera. Log, blame och filhistorik visar de mappade namnen (`log.use_mailmap`) utan att röra en commit. `list` räknar historikens identiteter och visar vilka som är mappade, `check` visar hur några identiteter löses, `add` slår ihop identiteter till en genom att lägga till rader i `.mailmap` (redigeras, committas inte; kan ångras)"
"mailmap add" = "Slå ihop identiteter till en kanonisk identitet genom att lägga till rader i `.mailmap` (skapas om den saknas; en rad som redan finns upprepas inte). Filen redigeras men committas inte: gör det själv. En enda ångra-post (`gitpoulpi undo` sätter tillbaka den tidigare filen). Log visar den kanoniska identiteten direkt (`log.use_mailmap`); de lagrade commits ändras inte, så ingen force push behövs. För att skriva om själva commits, använd en `mailmap`-regel i `rewrite`"
"mailmap add --canonical" = "Identiteten som ska behållas, `Name <email>`"
"mailmap add --file" = "`.mailmap` att skriva, relativt repositoryts rot (standard: rotens `.mailmap`)"
"mailmap add --from" = "En identitet att mappa till den, `Name <email>` (kan upprepas, minst en)"
"mailmap check" = "Visa hur identiteter (`Name <email>`, eller `<email>`) ser ut via repositoryts `.mailmap`: det kanoniska namnet och e-postadressen, eller samma identitet när inget mappar den. Skrivskyddat"
"mailmap check --identities" = "Identiteterna som ska lösas, var och en `Name <email>` eller `<email>`"
"mailmap list" = "Lista varje namn och e-postadress som har skrivit eller committat en commit i omfånget, med hur många commits var och en har som författare och som committer, flest först, samt identiteten som `.mailmap` redan mappar den till (`mapped_to`). Skrivskyddat"
"mailmap list --all_local" = "Varje lokal gren och tag i stället för den aktuella grenen"
"mailmap list --mapped" = "Bara identiteter som `.mailmap` redan mappar"
"mailmap list --refs" = "Bara dessa lokala grenar eller taggar (kan upprepas)"
"mailmap list --unmapped" = "Bara identiteter som `.mailmap` inte mappar"
"rewrite preview --mailmap" = "Mailmap-regel: skriv om författare och committers till de namn som worktreens `.mailmap` anger (historiken visar sedan det `git log --use-mailmap` visar). `--who` väljer författare, committer eller båda. För en rättning som bara gäller visningen, utan omskrivning, använd `mailmap add` i stället"
"rewrite preview --mailmap_file" = "Med `--mailmap`: använd den här filen i stället för worktreens `.mailmap` (relativt repositoryts rot, eller absolut)"
"rewrite run --mailmap" = "Mailmap-regel: skriv om författare och committers till de namn som worktreens `.mailmap` anger (historiken visar sedan det `git log --use-mailmap` visar). `--who` väljer författare, committer eller båda. För en rättning som bara gäller visningen, utan omskrivning, använd `mailmap add` i stället"
"rewrite run --mailmap_file" = "Med `--mailmap`: använd den här filen i stället för worktreens `.mailmap` (relativt repositoryts rot, eller absolut)"
"rewrite analyze" = "Storleksanalys av historiken, som `filter-repo --analyze`: de största blobbarna med sökväg, storlek, första och sista commit och om de fortfarande finns i HEAD, de största mapparna, filerna som tagits bort från HEAD men som historiken fortfarande håller, samt totalerna med vad som skulle frigöras om den del som bara finns i historiken togs bort (en uppskattning: först efter en rensning och en gc). Ta bort det den visar med `rewrite preview --remove-paths PATH` eller `--remove-blobs-over BYTES`. Skrivskyddat"
"rewrite analyze --all_local" = "Analysera varje lokal gren och tag i stället för den aktuella grenen"
"rewrite analyze --refs" = "Analysera bara dessa lokala grenar eller taggar (kan upprepas)"
"rewrite analyze --since" = "Med den aktuella grenen: bara commits efter den här revisionen"
"rewrite analyze --top" = "Rader som behålls i varje lista (standard 50, högst 5000)"
"rewrite check-signing" = "Signera en dummy-nyttolast en gång med repositoryts signeringsuppsättning (`gpg.format`, `user.signingkey`, `gpg.*.program`) och verifiera den, som rökprov före en körning som signerar om (`--signatures resign-signed` eller `resign-all`). Skriver ut programmet, om det fungerar och hur lång tid en signatur tog (multiplicera med antalet commits som ska signeras om för att få en uppskattning). Kan öppna en lösenfrasfråga. Slutar med kod 2 när det inte fungerar, med orsaken (`tool_missing` eller `signing_failed`)"
"rewrite preview --remove_signatures" = "Signaturregel: ta bort signaturen på varje commit i omfånget, även där inget annat ändras. De commits behöver inget `--signatures`-svar"
"rewrite preview --fix_message_encoding" = "Meddelanderegel: koda om commit-meddelanden till UTF-8. Ett meddelande med en `encoding`-rubrik (ISO-8859-1, Shift_JIS...) avkodas och rubriken tas bort; UTF-8 som en gång lästs som Latin-1 eller Windows-1252 (”RÃ©Ã©criture”) lagas bara när omvandlingen går att göra om exakt. Det som inte går att avgöra lämnas orört och räknas (`encoding_left`)"
"rewrite preview --fix_name_encoding" = "Med `--fix-message-encoding`: laga även förvanskade författar- och committernamn (namnen i en commit vars rubrik tas bort avkodas alltid med den)"
"rewrite run --remove_signatures" = "Signaturregel: ta bort signaturen på varje commit i omfånget, även där inget annat ändras. De commits behöver inget `--signatures`-svar"
"rewrite run --fix_message_encoding" = "Meddelanderegel: koda om commit-meddelanden till UTF-8. Ett meddelande med en `encoding`-rubrik (ISO-8859-1, Shift_JIS...) avkodas och rubriken tas bort; UTF-8 som en gång lästs som Latin-1 eller Windows-1252 (”RÃ©Ã©criture”) lagas bara när omvandlingen går att göra om exakt. Det som inte går att avgöra lämnas orört och räknas (`encoding_left`)"
"rewrite run --fix_name_encoding" = "Med `--fix-message-encoding`: laga även förvanskade författar- och committernamn (namnen i en commit vars rubrik tas bort avkodas alltid med den)"
"rewrite preview --map_trailers" = "Med en identitetsregel: ändra även de identitetstrailers (`Name <email>` i `Signed-off-by`, `Co-authored-by`...) som matchar, inte bara författaren och committern"
"rewrite preview --trailer_add" = "Trailerregel `KEY=VALUE`: lägg till den här trailern i varje meddelande (kan upprepas; ett meddelande som redan har exakt den trailern lämnas orört)"
"rewrite preview --trailer_map" = "Trailerregel `KEY:OLD=NEW`: ersätt bokstavlig text i värdena för trailers med den här nyckeln, till exempel `Signed-off-by:@old.org=@new.org` (kan upprepas)"
"rewrite preview --trailer_remove" = "Trailerregel: ta bort varje trailer med den här nyckeln (kan upprepas)"
"rewrite preview --update_message_hashes" = "Ersätt förkortade commit-id:n (7 eller fler hextecken) i meddelanden med de nya id:na; tvetydiga eller okända lämnas kvar och räknas"
"rewrite run --map_trailers" = "Med en identitetsregel: ändra även de identitetstrailers (`Name <email>` i `Signed-off-by`, `Co-authored-by`...) som matchar, inte bara författaren och committern"
"rewrite run --trailer_add" = "Trailerregel `KEY=VALUE`: lägg till den här trailern i varje meddelande (kan upprepas; ett meddelande som redan har exakt den trailern lämnas orört)"
"rewrite run --trailer_map" = "Trailerregel `KEY:OLD=NEW`: ersätt bokstavlig text i värdena för trailers med den här nyckeln, till exempel `Signed-off-by:@old.org=@new.org` (kan upprepas)"
"rewrite run --trailer_remove" = "Trailerregel: ta bort varje trailer med den här nyckeln (kan upprepas)"
"rewrite run --update_message_hashes" = "Ersätt förkortade commit-id:n (7 eller fler hextecken) i meddelanden med de nya id:na; tvetydiga eller okända lämnas kvar och räknas"
"ai trust" = "Binds a profile's API key to the address it was stored for: shows what is trusted, or accepts the profile's current address (after its base URL changed), a self-hosted server's certificate, or plain http. Only a person runs this (it is not an agent tool)"
"ai trust --accept_certificate" = "Accept the certificate with this key fingerprint (SHA-256, hex)"
"ai trust --accept_origin" = "Accept the profile's current base URL (spelled exactly as the refusal printed it)"
"ai trust --allow_insecure_http" = "Allow a plain `http://` base URL that is not on this machine"
"ai trust --profile" = "The AI profile id"
"hosting integrations trust" = "Reviews the security check of a profile and accepts what it stopped: a new address, another account, a new certificate, plain http. Only a person runs this (it is not an agent tool). With no option it prints what is trusted and what is stopped"
"hosting integrations trust --accept_account" = "Accept this account id as the owner of the token"
"hosting integrations trust --accept_certificate" = "Accept the certificate with this key fingerprint (SHA-256, hex), exactly as the refusal printed it"
"hosting integrations trust --accept_origin" = "Accept the profile's current address (it must be spelled exactly as the refusal printed it)"
"hosting integrations trust --allow_insecure_http" = "Allow a plain `http://` address that is not on this machine"
"hosting integrations trust --id" = "The profile"
"hosting integrations trust --strict_tls" = "Hold the pinned certificate strictly: the key must match even when the certificate chains to a public root"
