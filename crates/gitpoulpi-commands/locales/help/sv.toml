"rewrite script trust" = "Lita på ett externt skript (shell, Python, externt Lua) utifrån dess innehåll: filens SHA-256 kommer ihåg för det här repositoryt, så skriptet får köras (preview, run, test); en ändrad fil frågar igen. De här skripten körs utan sandlåda: de körs med dina rättigheter, så läs filen först. Bara en människa kan göra detta: det finns inget MCP-verktyg för det"
"rewrite script trust --file" = "Skriptfilen"
