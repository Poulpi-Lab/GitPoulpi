ai = "AI-hjälpmedel (av om inte `ai.enabled = true`): skriver ut ett genererat commit-meddelande, eller förklarar en commit eller ändringarna i arbetskatalogen"
"ai commit-message" = "Skriver ut commit-meddelandet som AI:n föreslår för de stagade ändringarna (eller alla ändringar när inget är stagat). Commitar ingenting"
"ai explain" = "Förklarar en commit (standard HEAD) eller, med --wip, ändringarna i arbetskatalogen"
"ai resolve-conflict" = "Skriver ut lösningen AI:n föreslår för EN merge-konflikt i en fil med konflikt (`--conflict N`, från 1; valfritt när filen har en enda konflikt). Skriver bara ut: inget skrivs eller stagas, så anroparen avgör (`conflicts resolve --content-file` tillämpar ett resultat för hela filen). Kräver `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Vilken konflikt i filen, från 1"
"ai resolve-conflict --path" = "Filen med konflikt, relativt repositoryts rot"
autostash = "Den väntande auto-stashen: GitPoulpi ställde undan lokala ändringar för att köra en checkout, merge, rebase eller pull och har inte lagt tillbaka dem"
"ai review-context" = "Visa eller ange vad ett ✦ kodgranskningsutkast får förutom diffen (`[ai.review]`): repositoryts CLAUDE.md och AGENTS.md, en fil till (en sökväg eller en länk) och om en lokal agent körs i repositoryt. Utan `--repo` och `--project` gäller det globala standardvärdet; `--repo PATH` är ett klonat repositorys egna värde, `--project HOST/PROJECT` värdet för ett repository som inte är klonat. Utan inställningsflagga skrivs värdena ut (`effective` är vad en granskning får); med en sparas den och resultatet skrivs ut. Kräver ingen modell och fungerar med AI avstängd"
"ai review-context --agents_md" = "Ge modellen repositoryts AGENTS.md"
"ai review-context --claude_md" = "Ge modellen repositoryts CLAUDE.md"
"ai review-context --context_file" = "En fil till: en sökväg relativt repositoryts rot, en absolut sökväg eller en länk till en fil hos en kodvärd"
"ai review-context --no_context_file" = "Ingen extra fil"
"ai review-context --no_extra_file" = "Ingen extra fil för repositoryt eller projektet, oavsett vad det globala värdet säger (`on`, standard när flaggan ges ensam); `off` får det att följa det globala värdet igen"
"ai review-context --project" = "Ett repository som inte är klonat, som `HOST/PROJECT` (`github.com/owner/name`)"
"ai review-context --reset" = "Med `--repo` eller `--project`: glöm repositoryts egna värden (det följer de globala igen) innan flaggorna tillämpas"
"ai review-context --run_in_repo" = "Kör en lokal agent i repositoryt (`yes`), inte där (`no`) eller som dess AI-profil säger (`profile`). Inte för `--project`"
"autostash start-over" = "Börja om: förkastar ändringarna i arbetskatalogen på stashens filer (en kopia sparas under `refs/gitpoulpi-backup/`), ångrar åtgärden som skapade auto-stashen (pull, checkout, merge, rebase) och gör sedan pop på stashen på den ursprungliga commiten. Stannar med stashen intakt om ett steg misslyckas. Slutkod 1 vid avslag, 3 när `--yes` behövs"
"autostash start-over --dry_run" = "Visa vad som skulle hända och ändra ingenting"
"autostash start-over --yes" = "Fortsätt; utan den ändras ingenting och slutkoden är 3"
blame = "Radvis upphovsinformation för en fil vid en revision"
"blame --at" = "Revision att göra blame på (standard: HEAD)"
"branch delete-remote" = "Tar bort en gren från en remote och behåller en lokal gren med det namnet"
"branch fast-forward" = "Flyttar `<branch>` framåt till `<target>`, bara om det är en fast-forward (divergerad historik avvisas, inget flyttas). Den utcheckade grenen tar med sig sin arbetskatalog, som `git merge --ff-only`; för varje annan gren flyttas bara dess ref"
"branch fast-forward --target" = "Valfri revision (standard: HEAD)"
"branch set-upstream" = "Låter `<branch>` spåra `<upstream>` (`origin/main`)"
"branch track" = "Skapar en lokal gren som spårar en remote-spårande gren och checkar ut den. `<upstream>` skrivs som refs-listan skriver den (`origin/feature/login`); `--name` är som standard grendelen"
"branch unset-upstream" = "Tar bort `<branch>`s upstream"
"checkout --autostash" = 'Stashar lokala ändringar som blockerar detta, kör åtgärden och poppar sedan stashen (vad `general.auto_stash = "always"` gör)'
"cherry-pick --commits" = "Commits att tillämpa, i ordning. Utelämnas när `--plan` anges"
"cherry-pick --plan" = "En JSON `Vec<RebaseStep>` (samma form som `rebase --plan`; se `rebase-plan`), från en filsökväg eller `-` för stdin: stegen cherry-pickas i listans ordning. Bara åtgärderna `Pick` och `Drop` är meningsfulla här (`Drop` hoppar över commiten); varje annan åtgärd avvisas. Kan inte kombineras med positionella commits"
"clone --branch" = "Checka ut den här grenen i stället för remotens standard-HEAD"
"clone --depth" = "Korta av historiken till så här många commits (`git clone --depth`)"
"clone --no_lfs" = "Lämna Git LFS-filer som pekare i stället för att ladda ner deras innehåll efter kloningen"
"clone --origin" = "Ge den nya remoten ett annat namn än `origin`"
"clone --recurse_submodules" = "Klona även submodulerna"
"commit --ai" = "Låt AI:n skriva meddelandet från den stagade diffen, med repositoryts Commit message instructions (Settings > AI). Kräver `ai.enabled = true` och en konfigurerad profil"
"commit --message" = "Commit-meddelandet. Krävs om inte --ai skriver det"
"commit --no_verify" = "Hoppa över commit-hooks (`pre-commit`, `commit-msg`), som `commit --no-verify`"
completions = "Skriver ut ett skript för skalkomplettering till stdout (bash, zsh, fish, powershell eller elvish), t.ex. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Avbryter operationen som pågår: HEAD, indexet och arbetskatalogen återgår till hur de var före den. Kastar bort lösningarna som gjorts sedan dess"
"conflicts skip" = "Hoppar över den pågående cherry-pick eller revert (eller den commit en rebase stannat på): HEAD, indexet och arbetskatalogen återgår till HEAD. Utvägen när den blivit tom (ändringen är redan tillämpad). En merge har inget att hoppa över"
"conflicts check" = "Skulle en merge av HEAD in i grenen den utgick från ge konflikter, och i vilka filer? Inget rörs (en merge i minnet). Basen är målet för grenens kända pull request, annars den gren som mönstren under Base branches tillåter och med minst antal commits sedan förgreningen. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Avstängd när `general.conflict_detection` eller repositoryts egen omkopplare är av"
"conflicts list" = "Filerna med konflikt, var och en med texten från sina tre sidor. Med `--names-only`: bara sökväg, konflikttyp och stage-oid:er (ingen blob läses; billigt vid en stor merge)"
"conflicts resolve" = 'Löser en fil och stagar den (filen är inte längre i konflikt). Exakt en av `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` eller `--delete`. A och "ours" är den aktuella sidan (`HEAD`; under en rebase grenen som rebasen görs på), B och "theirs" den inkommande sidan. Redigera aldrig konfliktmarkörer för hand: välj, eller skriv slutlig text till en fil'
"conflicts resolve --both" = "Behåll båda sidor av varje konflikt (A, sedan B), och gits egen merge överallt annars"
"conflicts resolve --content_file" = "Filens slutliga text, exakt (`-` läser standardinmatningen)"
"conflicts resolve --delete" = "Godta borttagningen: ta bort filen (`git rm`)"
"conflicts resolve --encoding" = "Med `--content-file`: skriv texten i den här teckenkodningen (en WHATWG-etikett som `windows-1252`) i stället för UTF-8"
"conflicts resolve --expect" = "Stage-oid:erna beslutet fattades mot, `base,ours,theirs` (använd `-` för en saknad stage). Anropet avvisas som `stale` när indexet inte längre innehåller exakt dessa. `--both` och `--pick` kontrollerar alltid de stages de läser"
"conflicts resolve --no_stage" = "Skriv filen i arbetskatalogen men lämna den i konflikt (ett vanligt sparande)"
"conflicts resolve --ours" = "Samma som `--side ours`"
"conflicts resolve --pick" = "Ett val per konfliktnummer: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = båda i den ordningen). Varje konflikt behöver ett, om inte `--default` täcker resten"
"conflicts resolve --pick_default" = "Med `--pick`: valet för varje konflikt som inte listas"
"conflicts resolve --side" = "Ta hela filen från en stage, ingen automatisk merge"
"conflicts resolve --theirs" = "Samma som `--side theirs`"
"conflicts resolve --theirs_first" = "Med `--both`: B, sedan A"
"conflicts show" = "En fil med konflikt som merge-redigeraren ser den: rutornas etiketter, de tre sidorna och de numrerade konfliktområdena (`--json` är hela dokumentet). Sammanslagna områden som git löste själv listas inte; de finns kvar i resultatet av `resolve --both`/`--pick`"
"conflicts show --conflict" = "Bara konflikt N (från 1)"
"conflicts state" = "Den merge, rebase, cherry-pick eller revert som pågår (`null` när ingen)"
"conflicts unresolve" = "Sätter tillbaka en fil som lösts under den här operationen i konflikt (med markörer igen). Avvisas när den fortfarande är i konflikt eller inte löstes medan operationen pågick"
daemon = "`gitpoulpi server ...` är ett synligt alias - ägaren kallar den här gruppen ”servern” och skriver `gp server stop`"
"daemon restart" = "`daemon stop` följt av `daemon start`"
"daemon run" = "Kör den här sessionens daemon i förgrunden (blockerar; Ctrl-C för att stoppa, eller ett `daemon stop`/`daemon restart` skickat från annat håll). Det är vad `daemon start` startar frikopplat, och vad en egen terminal också kan köra direkt"
"daemon start" = "Startar den här sessionens daemon som en frikopplad bakgrundsprocess (eller rapporterar att den redan körs). `--backend` fäster backend som den startade processen ska använda; utelämnat löser den startade processen `general.default_backend` själv"
"daemon status" = "Om den här sessionens daemon lyssnar, och i så fall dess port, PID, drifttid, backend och build-version"
"daemon stop" = "Ber den här sessionens daemon att stänga ner sig ordnat, och dödar sitt sparade PID bara om den inte svarar i tid och bara om den är en fristående daemon (aldrig en inbäddad i ett körande TUI)"
"daemon stop --all" = "Stoppa varje sessions daemon som `session list` rapporterar en portfil för, inte bara den här"
discard = "Förkastar en fils *unstaged* ändringar i arbetskatalogen: en hunk (`--hunk`), några av dess rader (`--hunk --lines`), eller - med enbart `--file` - varje ocommittad ändring i filen, även stagade (en ospårad fil raderas). Hunkar och rader numreras som `gitpoulpi diff --json` numrerar den unstaged diffen. Allt som förkastas sparas i en säkerhetskopia, så `gitpoulpi undo` hämtar tillbaka det (även ospårade filer). Inte bekräftat: det här är skriptgränssnittet"
"discard --lines" = "Kommaseparerade radindex inom `--hunk`"
"fetch --all" = "Hämta från varje konfigurerad remote"
"fetch --prune" = "Ta bort remote-spårande grenar som remoten inte längre har"
"fetch --prune_tags" = "Ta även bort de lokala tags som remoten har tagit bort (bara tags som fanns på den: en tag som aldrig publicerats lämnas ifred). Gits `fetch.pruneTags`, snävare; av om du inte ber om det"
"fetch --remote" = "Utelämnat: repositoryts standard-remote (se `remote default`)"
gitpoulpi = "Lättviktigt plattformsoberoende TUI-Git-klient, skriptbar via CLI/MCP."
"gitpoulpi --add" = "Öppnar en mapp som en ny flik i den GitPoulpi som redan körs, i stället för att starta en till (`gp -a`, `gp --add ../annan`). PATH är som standard den aktuella mappen och löses upp till det omgivande repositoryt. En körande session: den får fliken och dess fönster kommer fram om skrivbordet tillåter det. Flera: du väljer en ur en numrerad lista (eller anger `--session NAMN`). Ingen: GitPoulpi startar som vanligt, på den mappen. Tar inget underkommando; med `--json` skrivs ett objekt ut (`action` är `joined` eller `cancelled`), slutkod 0 när fliken är öppen, 3 när ett upptaget fönster erbjöd den i chipet på sin statusrad"
"gitpoulpi --no_raise" = "Med `--add`: be inte fönstret att ta fram sin terminal"
"gitpoulpi --backend" = "Vilken `GitBackend` det här kommandots daemon kör på, och åsidosätter `general.default_backend` i config.toml och `GITPOULPI_GENERAL_DEFAULT_BACKEND` (flaggor är överst i företrädesordningen - se docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
Vilken `GitBackend` det här kommandots daemon kör på, och åsidosätter `general.default_backend` i config.toml och `GITPOULPI_GENERAL_DEFAULT_BACKEND` (flaggor är överst i företrädesordningen - se docs/user/config-reference.md).

Den väljer backend för en daemon som det här kommandot *startar*. En session vars daemon redan körs behåller den backend som daemon byggdes med; `gitpoulpi` kan inte byta ut en körande daemons backend under de klienter som redan är anslutna till den, och att låtsas annat vore samma tysta no-op som den här flaggan finns för att undvika."""
"gitpoulpi --cwd_file" = """Fil som TUI:t skriver den aktiva flikens mapp till när det avslutas ("Avsluta, cd hit", eller alltid med `ui.tab_dir_follow = "auto"`). Avsedd för omslaget `gitpoulpi shell-init` skriver ut; ignoreras av varje underkommando, eftersom bara TUI:t har flikar"""
"gitpoulpi --json" = "Ge strukturerad JSON i stället för läsbar utdata"
"gitpoulpi --lang" = "Språk för `--help`-texten (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
Språk för `--help`-texten (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Bara förklaringar översätts - kommando- och flaggnamn ändras aldrig - och `--help` förblir engelsk om inte detta anges (miljön ignoreras med flit, så skript får stabil utdata). Exempel: `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Repository att arbeta på. Standard är repositoryt som omger aktuell katalog, så `gitpoulpi status` beter sig som `git status`; en agent som styr flera repos anger detta i stället för att göra chdir"
"gitpoulpi --session" = "Namngiven session att rikta in sig på. Utelämnad härleds den från aktuellt repositorys rot (se `gitpoulpi_config::default_session_name`), så två repositories får två oberoende daemons medan allt som öppnas inom ett repository delar en. Ange detta för att tvinga två repositories på en session, eller för att namnge en session uttryckligen. Värdet saneras före användning - det blir ett filnamn"
"hosting checkout-pr" = "Checkar ut en pull/merge request, även en från en fork: hämtar dess huvud (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) till den lokala grenen `pr/<n>` (`mr/<n>` på GitLab), spårar den och byter till den"
"hosting checkout-pr --id" = "Vilken integration (se `hosting prs`)"
"hosting checkout-pr --no_checkout" = "Bara hämta och skapa/uppdatera grenen; stanna där du är"
"hosting checkout-pr --number" = "PR-numret (GitHub) eller MR-`iid` (GitLab)"
"hosting checkout-pr --remote" = "Remoten begäran finns på. Standard är den projektet löstes från, annars repositoryts standard"
"hosting clone" = "Klonar ett projekt från `projects` via dess fullständiga sökväg, och löser klon-URL:en via värden i stället för att låta användaren klistra in en"
"hosting clone --https" = "Klona över HTTPS i stället för SSH"
"hosting clone --project" = "Projektets fullständiga sökväg, som `hosting projects` skriver ut den"
"hosting edit-url" = "Skriver ut URL:en där en pull/merge request redigeras (GitLabs `.../edit`-vy; GitHub redigerar på plats på begärans sida). Med ett nummer den begäran; annars den för `--branch` (standard: den utcheckade grenen). Följer repositoryts pull/merge request-länk som `prs`. Startar webbläsaren bara med `--open`"
"hosting edit-url --branch" = "Hitta begäran via dess källgren i stället"
"hosting edit-url --number" = "Begärans nummer (`53` för `!53` / `#53`)"
"hosting edit-url --open" = "Öppna också URL:en i systemets webbläsare"
"hosting file" = "Läser en fil i ett projekt vid en revision via värdens API, utan klon: text som den är, andra byte som base64 (`encoding`). Avslutas med 1 och ett fel när filen inte finns i den revisionen"
"hosting file --id" = "Vilken integration (se `hosting list`); valfritt när bara en är konfigurerad"
"hosting file --path" = "Sökvägen i projektet, som `CLAUDE.md` eller `src/main.rs`"
"hosting file --project" = "Projektet: `owner/name` på GitHub, `group/sub/project` på GitLab"
"hosting file --rev" = "Revisionen: en gren, tagg eller commit. Standard är projektets standardgren"
"hosting integrations" = "Hanterar de konfigurerade integrationsprofilerna (`[[integrations]]`)"
"hosting integrations add" = "Lägger till en profil av valfri typ som har en klient"
"hosting integrations add --id" = "Standard är sortens namn (`gitlab`, `gitlab-2`, ...)"
"hosting integrations add --kind" = "`github`, `github_enterprise`, `gitlab`, `gitlab_self_managed`, `azure_devops`, `azure_devops_server`, `bitbucket`, `jira_cloud`, `jira_data_center`, `trello`, `gitea`, `forgejo`, `linear`, `youtrack`, `redmine`, `gerrit` eller `local_markdown`"
"hosting integrations add --name" = "Visningsnamn"
"hosting integrations add --url" = "Instansens webbrot. Krävs för de egenhostade typerna och Jira"
"hosting integrations list" = "De konfigurerade profilerna, utan deras tokens"
"hosting integrations radar" = "Visar eller ändrar en profils Radar-inställningar (`[integrations.radar]`): vilka kontoövergripande listor `hosting radar` och Radar hämtar, vilka namnrymder som söks och vad en granskning av en begäran som inte är klonad gör. Utan alternativ skrivs bara de nuvarande inställningarna ut"
"hosting integrations radar --assigned_issues" = "Öppna ärenden tilldelade dig, i alla repositories"
"hosting integrations radar --clear_namespaces" = "Glöm de sparade namnrymderna: din egen plus alla medlemskap"
"hosting integrations radar --id" = "Profilen"
"hosting integrations radar --include_drafts" = "Behåll utkast till begäranden i kontolistorna"
"hosting integrations radar --namespaces" = "En namnrymd (organisation, grupp) att söka efter öppna begäranden i; upprepa flaggan eller separera med komma. Ersätter den sparade listan"
"hosting integrations radar --open_requests" = "Alla öppna begäranden i dina namnrymder"
"hosting integrations radar --review_mode" = "Vad en granskning av en begäran som inte är klonad gör"
"hosting integrations radar --review_requests" = "Begäranden som väntar på din granskning, i alla repositories"
"hosting integrations remove" = "Tar bort en profil och raderar dess lagrade token"
"hosting integrations test" = "Kontrollerar profilens token mot dess värd: användare, behörigheter, utgång"
"hosting issue" = "Skapar ärenden i det aktuella repositoryts länkade projekt"
"hosting issue create" = "Öppnar ett ärende i projektet repositoryts ISSUES-källa är länkad till (`hosting link issues`), eller det `--id` löser från remoten. Utåtriktad åtgärd: den postar till värden"
"hosting issue create --body" = "Ärendets beskrivning"
"hosting issue create --body_file" = "Läs beskrivningen från den här filen (`-` läser stdin)"
"hosting issue create --id" = "Vilken integration (se `hosting issues`)"
"hosting issue create --labels" = "En etikett att sätta; upprepa flaggan eller kommaseparera"
"hosting issue create --title" = "Ärendets titel"
"hosting issue create --web" = "Skriver ut värdens förifyllda sida för nytt ärende i stället för att anropa dess API (ingen token krävs)"
"hosting issues" = "Ärenden i det aktuella repositoryts projekt"
"hosting issues --assigned" = "Bara de som tilldelats dig"
"hosting board --id" = "Vilken integration (se `hosting issues`)"
"hosting board move --column" = "Kolumnens namn, som `hosting board` skriver ut det"
"hosting board move --id" = "Vilken integration (se `hosting issues`)"
"hosting board move --reference" = "Kortet: dess nummer eller egen referens (`12`, `#12`, `ABC-12`, `AB#12`)"
"hosting board move" = "Flyttar ett kort till en kolumn: en statusändring, en arbetsflödesövergång (Jira), ett work item-tillstånd (Azure DevOps), en lista (Trello) eller ett etikettbyte (GitHub, GitLab, Gitea, Forgejo). En flytt som leverantören inte har någon väg för avvisas med orsaken. Åtgärd utåt: den skriver till hosten"
"hosting board show --id" = "Vilken integration (se `hosting issues`)"
"hosting board show" = "Tavlans kolumner, var och en med sina kort. Skrivskyddad"
"hosting board" = "Ärendetavlan för det aktuella repositoryts länkade projekt: dess kolumner med sina kort, samma kolumner som i TUI:ns tavla (en status, en lista eller en etikett per kolumn). Utan underkommando samma som `board show`"
"hosting link" = "Länkar det här repositoryts lista över pull/merge requests eller ärenden till en leverantörsprofil och ett av dess repositories, eller kopplar bort den (utan flagga visas länken). Inget hämtas av `prs` / `issues` förrän en källa är länkad; samma länk som TUI:ts sidopanelsavsnitt sparar (`pulls_source` / `issues_source` i `.gitpoulpi/repo-state.toml`)"
"hosting link --clear" = "Kopplar bort listan: inget hämtas förrän den länkas igen"
"hosting link --id" = "Profilen att länka. Utan `--project` används repositoryt dess remotes nämner på den profilens värd"
"hosting link --kind" = "Vilken lista"
"hosting link --project" = "Leverantörens repository (`owner/name`, `group/sub/proj`)"
"hosting list" = "De konfigurerade integrationerna, utan deras tokens"
"hosting login" = "Validerar en token och lagrar den under profilens `token_ref`, och cachar vem den tillhör. Token läses från stdin (`--token-stdin`), aldrig från ett argument, så den hålls utanför skalhistoriken. Exponeras inte via MCP: en hemlighet får inte passera genom en agents verktygsanropstranskript"
"hosting login --id" = "Vilken integration. Valfritt när bara en är konfigurerad"
"hosting login --token_stdin" = "Läs token från stdin (krävs; en rad, avslutande radbrytning ignoreras)"
"hosting logout" = "Raderar profilens lagrade token och glömmer den anslutna användaren; själva profilen finns kvar"
"hosting open" = "Skriver ut webb-URL:en för en pull request eller ett ärende i det aktuella repositoryts projekt. Startar systemets webbläsare bara med `--browser`"
"hosting open --browser" = "Öppna också URL:en i systemets webbläsare"
