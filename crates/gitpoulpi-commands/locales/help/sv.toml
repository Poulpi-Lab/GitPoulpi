"ai rewrite-script --instruction" = "Vad skriptet ska göra, med dina egna ord"
"ai rewrite-script --sample" = "Skicka även författare, datum och ämne för de N nyaste commits (högst 50) så att modellen ser hur data ser ut. Av som standard: utan den lämnar inga commitdata datorn"
"ai rewrite-rules" = "Skriv ut reglerna och inställningarna som AI:n föreslår för en historikomskrivning utifrån din beskrivning (”ersätt min gamla e-postadress a@b med c@d i alla commits”, ”ta bort secrets.txt ur hela historiken”), som det JSON-recept som `rewrite preview --recipe-json` läser (spara fältet `recipe` i en fil för `--recipe`), plus vad som utelämnades och varför. Förhandsgranskar ingenting och tillämpar ingenting: läs reglerna och kör sedan själv `rewrite preview` och `rewrite apply`. Skickar bara din beskrivning, plus, med `--context`, den aktuella grenen, namnen på grenar och taggar och författarna till de 200 nyaste commits (aldrig filinnehåll). Kräver `ai.enabled = true`"
"ai rewrite-rules --description" = "Hur historiken ska skrivas om, med dina egna ord"
"ai rewrite-rules --context" = "Skicka även namnen på grenar och taggar och författarna till de 200 nyaste commits (högst 100 namn på grenar och taggar och 100 författare) så att modellen kan ange dem exakt. Av som standard: utan den lämnar inget annat än din beskrivning datorn"
"split-commit" = "Delar upp en commit på aktuell gren i flera, äldst först, enligt en JSON-plan (se `split-source` för numreringen). Den sista nya commiten behåller det ursprungliga trädet, så ättlingar och arbetskatalog förblir oförändrade; en pushad commit behöver sedan en force push. Ett `undo` återställer allt. Slutkod 2 när planen avvisas"
"split-commit --commit" = "Commiten att dela upp (valfri revision: en sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Validerar planen och listar det som inte tilldelats; ändrar ingenting"
"split-commit --plan" = "Planen (JSON), från en filsökväg eller `-` för stdin. En bit är `path` plus en valfri `hunk` plus valfria `lines` (index i hunkens `lines`); en bit med bara `path` är hela filen"
"split-commit --rest_message" = "Lägger allt som planen lämnar otilldelat i en sista commit med detta meddelande"
"split-commit --sign" = "Signerar de nya commits (och de återspelade ättlingarna)"
"split-source" = "Ändringarna i en commit numrerade för `split-commit`: varje fil med sina hunks (`id`, rader) eller, för filer som bara kan tilldelas hela (binär, bara läge, tillagd, borttagen, submodul, LFS), orsaken. Skrivskyddat"
"split-source --commit" = "Commiten (valfri revision: en sha, `HEAD~2`, ...)"
"rewrite" = "Skriv om historiken i bulk (identiteter, datum, meddelanden) utifrån ett recept: `preview` planerar utan att ändra något, `apply` kör den granskade planen som EN ångra-post, `run` gör båda för skript. Bara `push` skickar något: den force-pushar de omskrivna refs, var och en med en lease"
"rewrite apply" = "Tillämpa en förhandsgranskad körning: flyttar refs som EN ångra-post (`gitpoulpi undo` sätter tillbaka allt). Pushar aldrig. Slutkod 2 vid avslag (repositoryt har ändrats sedan förhandsgranskningen, fel digest, ...), 3 när planen flyttar refs som finns på en remote och `--yes` saknas"
"rewrite apply --digest" = "Digesten som `rewrite preview` skrev ut: planen du granskade"
"rewrite apply --run" = "Körnings-id:t som `rewrite preview` skrev ut"
"rewrite apply --yes" = "Bekräfta att refs som redan är pushade flyttas. Utan den ändrar en sådan plan ingenting och slutkoden är 3"
"rewrite diff" = "Vad en innehållsregel gjorde med en fil i en commit i en förhandsgranskad körning: den gamla och den nya filen som diff. Raderna som en hemlighetsregel tar bort döljs. Skrivskyddat"
