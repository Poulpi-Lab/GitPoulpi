"rewrite script check#long" = """
Kompilera ett Lua-skript och skriv ut dess huvud (namn, fönster, parametrar), funktionerna det definierar och varje problem. Slutkod 2 när det har problem. Skrivskyddat; inget körs på någon commit.

För ett shell-, Python- eller externt Lua-skript (utan sandlåda) säger den också om tolken hittades och om skriptet är betrott, och för ett betrott skript görs en torr handskakning: skriptet startas en gång med en påhittad commit (`"dry_run": true`) och svaret kontrolleras. Ett obetrott skript startas aldrig."""
