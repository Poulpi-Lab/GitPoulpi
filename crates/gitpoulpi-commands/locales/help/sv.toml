"undo-restore" = "”Återställ bara den här”: får tillbaka det en tidigare operation tog bort (en borttagen gren eller tagg, en droppad stash, en förkastad eller borttagen fil, en borttagen remote, en ignore-rad) utan att ångra operationerna efter den. Återställningen är en ny journalpost, så `undo` ångrar den. Inget skrivs över: en fil som har ändrats sedan dess får den bevarade versionen bredvid sig som `<name>.restored`; en reset, amend eller rebase kommer tillbaka som en ny gren vid den gamla toppen. Kan också skrivas `gitpoulpi undo restore <id>`. Slutkod 2 när det inte går att göra (JSON-svaret anger orsaken)"
