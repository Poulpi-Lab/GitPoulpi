"hosting pr --id" = "Vilken integration (`[[integrations]] id`). Valfritt när bara en är konfigurerad"
"hosting pr --source" = "Grenen att öppna den från. Standard är den utcheckade grenen"
"hosting pr --target" = "Grenen att öppna den mot. Standard är remotens standardgren när den kan avgöras, annars `main`/`master` om någon av dem finns"
"hosting pr --title" = "Standard är ämnesraden i källgrenens spets-commit"
