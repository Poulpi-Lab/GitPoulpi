uninstall = "Yükleyicinin ve Ayarlar'ın oluşturduklarını (komut takma adları, PATH girdileri, kısayollar) ve bir sürüm kurulumundaysa program dosyalarını kaldırır. Sürüm kurulumu olmayan bir derlemede reddeder (exe'nin yanında `.gitpoulpi-dist` işareti yok). Yapılandırmanıza, oturumlarınıza ve depolarınıza asla dokunulmaz"
"uninstall --keep_files" = "Program dosyalarını yerinde bırakır (çalışan bir exe kendini silemediği için Windows kaldırıcısı onları kendisi siler)"
launch = "GitPoulpi kısayollarının çalıştırdığı komut: zaten açık olan bir GitPoulpi'nin penceresini gösterir (`ui.reuse_window`), yoksa COMMAND'ı (GitPoulpi'yi çalıştıran terminal) başlatır. Gösterilecek bir pencere varsa hiçbir şey ve hiçbir daemon başlatmaz"
"launch --command" = "Gösterilecek pencere yokken `--` sonrasında başlatılacak komut"
"launch --new_window" = "Açık bir pencere olsa bile yeni bir pencere başlatır"
"ai split-plan" = "Yapay zekanın bir commit'i birkaç commit'e bölmek için önerdiği planı, `split-commit --plan` komutunun kabul ettiği JSON biçiminde yazdırır. Hiçbir şey uygulamaz: gözden geçirin, sonra `split-commit`'e verin. `ai.enabled = true` gerektirir"
"ai split-plan --rev" = "Bölünecek commit (herhangi bir revizyon: bir sha, `HEAD~2`, ...)"
"ai rewrite-script" = "YZ'nin yönergenizden (\"geceleri yapılan her commit'i sonraki sabaha taşı\") bir geçmiş yeniden yazma için yazdığı Lua betiğini, üzerinde `rewrite script check` sonucuyla birlikte yazdırır. Hiçbir şey çalıştırmaz ve hiçbir şeyi değiştirmez: betiği okuyun, sonra `rewrite script test` ve `rewrite preview --script` kullanın. Yalnızca yönergenizi gönderir; `--sample N` ile ayrıca N commit'in yazarını, tarihini ve konusunu gönderir (dosya içeriği asla). `ai.enabled = true` gerekir"
"ai rewrite-script --instruction" = "Betiğin ne yapması gerektiği, kendi sözlerinizle"
"ai rewrite-script --sample" = "Modelin verinin nasıl göründüğünü görmesi için en yeni N commit'in (en çok 50) yazarını, tarihini ve konusunu da gönderir. Varsayılan olarak kapalı: olmadan makineden hiçbir commit verisi çıkmaz"
"ai rewrite-rules" = "YZ'nin açıklamanızdan (\"tüm commit'lerde eski e-postam a@b yerine c@d yaz\", \"secrets.txt dosyasını tüm geçmişten sil\") bir geçmiş yeniden yazma için önerdiği kuralları ve ayarları, `rewrite preview --recipe-json` komutunun okuduğu JSON tarifi olarak yazdırır (`--recipe` için `recipe` alanını bir dosyaya kaydedin); dışarıda bıraktıklarını ve nedenlerini de gösterir. Hiçbir şeyi önizlemez ve uygulamaz: kuralları okuyun, sonra `rewrite preview` ve `rewrite apply` komutlarını kendiniz çalıştırın. Yalnızca açıklamanızı gönderir; `--context` ile ayrıca geçerli dalı, dal ve etiket adlarını ve en yeni 200 commit'in yazarlarını gönderir (dosya içeriği asla). `ai.enabled = true` gerekir"
"ai rewrite-rules --description" = "Geçmişin nasıl yeniden yazılacağı, kendi sözlerinizle"
"ai rewrite-rules --context" = "Modelin bunları tam adıyla yazabilmesi için dal ve etiket adlarını ve en yeni 200 commit'in yazarlarını da gönderir (en çok 100 dal ve etiket adı ile 100 yazar). Varsayılan olarak kapalı: olmadan makineden açıklamanızdan başka hiçbir şey çıkmaz"
"split-commit" = "Geçerli dalın bir commit'ini, JSON planına göre en eskiden başlayarak birkaç commit'e böler (numaralandırma için `split-source`). Son yeni commit özgün ağacı korur; bu yüzden torunlar ve çalışma ağacı değişmez; push edilmiş bir commit sonrasında force push gerektirir. Tek bir `undo` her şeyi geri alır. Reddedilirse çıkış kodu 2"
"split-commit --commit" = "Bölünecek commit (herhangi bir revizyon: bir sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Planı doğrular ve atanmamış olanları listeler; hiçbir şeyi değiştirmez"
"split-commit --plan" = "Plan (JSON), bir dosya yolundan veya stdin için `-`. Bir parça `path` artı isteğe bağlı `hunk` artı isteğe bağlı `lines` (hunk'ın `lines` içindeki dizinler); yalnızca `path` olan parça tüm dosyadır"
"split-commit --rest_message" = "Planın atamadığı her şeyi bu mesajla son bir commit'e koyar"
"split-commit --sign" = "Yeni commit'leri (ve yeniden oynatılan torunları) imzalar"
"split-source" = "Bir commit'in `split-commit` için numaralanmış değişiklikleri: her dosya hunk'larıyla (`id`, satırlar) veya yalnızca bütün olarak atanabilen dosyalar (ikili, yalnızca kip, eklenen, silinen, alt modül, LFS) için nedeni. Salt okunur"
"split-source --commit" = "Commit (herhangi bir revizyon: bir sha, `HEAD~2`, ...)"
"rewrite" = "Geçmişi bir kural setinden toplu olarak yeniden yazar (kimlikler, tarihler, mesajlar): `preview` hiçbir şeyi değiştirmeden planlar, `apply` gözden geçirdiğiniz planı TEK bir geri alma girdisi olarak çalıştırır, `run` betikler için ikisini birden yapar. Yalnızca `push` bir şey gönderir: yeniden yazılan ref'leri her biri bir lease ile zorla push eder"
"rewrite apply" = "Önizlenmiş bir çalıştırmayı uygular: ref'leri TEK bir geri alma girdisi olarak taşır (`gitpoulpi undo` her şeyi geri koyar). Asla push etmez. Reddedildiğinde çıkış kodu 2 (önizlemeden sonra depo değişti, yanlış özet, ...), plan uzak depodaki ref'leri taşıyorsa ve `--yes` yoksa 3"
"rewrite apply --digest" = "`rewrite preview` çıktısındaki özet: gözden geçirdiğiniz plan"
"rewrite apply --run" = "`rewrite preview` çıktısındaki çalıştırma kimliği"
"rewrite apply --yes" = "Zaten gönderilmiş ref'lerin taşınmasını onaylar. Onay olmadan böyle bir plan hiçbir şeyi değiştirmez ve çıkış kodu 3 olur"
"rewrite diff" = "Önizlenmiş bir çalıştırmada bir içerik kuralının bir commit'teki tek bir dosyaya ne yaptığını gösterir: eski ve yeni dosyanın farkı. Gizli değer kuralının kaldırdığı satırlar gizlenir. Yalnızca okur"
"rewrite diff --commit" = "Yeniden yazmadan önceki hâliyle commit (satırlardaki bir kimlik)"
"rewrite diff --path" = "Depo kökünden göreli dosya yolu"
"rewrite diff --run" = "`rewrite preview` çıktısındaki çalıştırma kimliği"
"rewrite discard" = "Önizlenmiş bir çalıştırmayı uygulamadan atar. İki kez atmak sorun değildir"
"rewrite discard --run" = "`rewrite preview` çıktısındaki çalıştırma kimliği"
"rewrite preview" = "Hiçbir şeyi değiştirmeden geçmişin yeniden yazılmasını planlar: sayılar, taşınacak ref'ler, uyarılar ve ilk satırlar. Planı, `rewrite rows` ve `rewrite apply` için daemon'da bir çalıştırma (`run`, `digest`) olarak tutar. Önizleme ayrıca deponun git dizininde diskte de durur; böylece `rewrite apply`, daha sonraki bir komutta, daemon yeniden başladıktan sonra veya başka bir arayüzden daemon başlatmadan çalışır; yalnızca `rewrite rows` önizlemeyi yapan daemon'a ihtiyaç duyar (çalışan bir daemon ya da önizlemede `--all`). Kural seti reddedilirse çıkış kodu 2"
"rewrite preview --all" = "Değişen her commit'i yazdırır"
"rewrite preview --all_local" = "Geçerli dal yerine tüm yerel dalları ve etiketleri yeniden yazar"
"rewrite preview --committer" = "Yeniden yazılan commit'lerin commit edeni: `keep` (varsayılan) veya `me-now`"
"rewrite preview --include_protected" = "Zaten gönderilmiş şu korumalı dalları da yeniden yazar (varsayılan olarak hariç; tekrarlanabilir)"
"rewrite preview --lfs_export" = "LFS kuralı: bu glob desenine uyan LFS işaretçilerini her commit'te yeniden gerçek dosyalara çevirir (tekrarlanabilir). Nesneler yerel LFS deposunda olmalı (önce `lfs fetch`); aksi halde liste ile birlikte reddedilir"
"rewrite preview --encoding_exclude" = "`--reencode` ile: dokunmadığı dosyalar (glob desenleri, tekrarlanabilir)"
"rewrite preview --encoding_fallback" = "`--reencode` ile: kaynak algılanırken ne işaretli ne de UTF-8 olan bir dosyanın hangi kodlamayla okunacağı (varsayılan `windows-1252`)"
"rewrite preview --encoding_paths" = "`--reencode` ile: dönüştürdüğü dosyalar (glob desenleri, tekrarlanabilir)"
"rewrite preview --eol" = "Satır sonu kuralı: `--eol-paths` ile eşleşen her metin dosyası bu satır sonunu alır (Linux ve macOS için `lf`, Windows için `crlf`, klasik Mac için `cr`); karışık satır sonları tek tip yapılır ve ikili dosyalar atlanır"
"rewrite preview --eol_exclude" = "`--eol` ile: dokunmadığı dosyalar (glob desenleri, tekrarlanabilir)"
"rewrite preview --eol_follow_attributes" = "`--eol` ile: her commit'in kökündeki `.gitattributes` okunur: `-text` ve `binary` dosyalar atlanır, `eol=lf` ve `eol=crlf` dosyalar kendi satır sonunu korur"
"rewrite preview --eol_paths" = "`--eol` ile: dönüştürdüğü dosyalar (glob desenleri, tekrarlanabilir; eğik çizgisiz desen her derinlikte eşleşir)"
"rewrite preview --reencode" = "Kodlama kuralı: `--encoding-paths` ile eşleşen metin dosyaları bu kodlamaya dönüştürülür (`utf-8`, `utf-8-bom`, `utf-16le`, `utf-16be`, `windows-1252`, `iso-8859-1`). İkili dosyalar, kaynak kodlamanın okuyamadığı dosyalar ve hedefin tutamadığı karakterler olduğu gibi bırakılır ve sayılır"
"rewrite preview --reencode_from" = "`--reencode` ile: dosyaların kodlaması. Verilmezse dosya başına algılanır (bayt sırası işareti, geçerli UTF-8, yoksa `--encoding-fallback`)"
"rewrite preview --strip_exec" = "Dosya modu kuralı: bu glob desenlerine uyan dosyalar çalıştırma bitini kaybeder (100755 olan 100644 olur; tekrarlanabilir). İçeriğe dokunulmaz"
"rewrite preview --strip_exec_exclude" = "`--strip-exec` ile: çalıştırma bitini koruyan dosyalar (glob desenleri)"
"rewrite preview --lfs_import" = "LFS kuralı: bu glob desenine uyan dosyaları her commit'te Git LFS'ye taşır (tekrarlanabilir; `.gitattributes` biçimi: eğik çizgisiz desen her derinlikte eşleşir). git-lfs gerekir. İçerik yerel LFS deposuna gider ve `.gitattributes` dosyasına `filter=lfs` satırı eklenir; nesneleri sonra gönderin"
"rewrite preview --lfs_min_size" = "`--lfs-import` ile: yalnızca en az bu kadar bayt olan dosyalar taşınır"
"rewrite preview --limit" = "Yazdırılacak değişen commit sayısı (varsayılan 50)"
"rewrite preview --match_email" = "Kimlik kuralı: bu yazar / commit eden e-postasıyla eşleşir"
"rewrite preview --match_name" = "Kimlik kuralı: bu yazar / commit eden adıyla eşleşir"
"rewrite preview --prune_empty" = "Bir içerik kuralının boş bıraktığı commit'ler: `auto` bunları atar (varsayılan), `never` korur"
"rewrite preview --recipe" = "Bir kural seti dosyası (TOML veya JSON, TUI ekranının biçimi) ya da standart girdiden JSON için `-`"
"rewrite preview --recipe_json" = "JSON dizesi olarak bir kural seti (dosya yazamayan çağıranlar için)"
"rewrite preview --refs" = "Yalnızca bu yerel dalları veya etiketleri yeniden yazar (tekrarlanabilir)"
"rewrite preview --remove_blobs_over" = "İçerik kuralı: bu bayt sayısından büyük her dosyayı her commit'ten kaldırır"
