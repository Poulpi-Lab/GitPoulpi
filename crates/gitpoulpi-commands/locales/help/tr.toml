"mailmap" = "`.mailmap`: birden fazla adla commit yapmış kişiler için tek bir kanonik ad ve e-posta. Log, blame ve dosya geçmişi eşlenmiş adları gösterir (`log.use_mailmap`); hiçbir commit'e dokunulmaz. `list` geçmişin kimliklerini sayar ve hangilerinin eşlendiğini gösterir, `check` bazı kimliklerin nasıl çözüldüğünü gösterir, `add` `.mailmap` dosyasına satır ekleyerek kimlikleri tek bir kimlikte birleştirir (dosya düzenlenir, commit edilmez; geri alınabilir)"
"mailmap add" = "`.mailmap` dosyasına satır ekleyerek kimlikleri tek bir kanonik kimlikte birleştirir (yoksa oluşturulur; zaten var olan satır tekrarlanmaz). Dosya düzenlenir, commit edilmez: onu kendiniz commit edin. Geri alınabilir tek bir girdi (`gitpoulpi undo` önceki dosyayı geri koyar). Log kanonik kimliği hemen gösterir (`log.use_mailmap`); saklanan commit'ler değişmez, bu yüzden hiçbir şey için zorla push gerekmez. Commit'lerin kendisini yeniden yazmak için `rewrite` içindeki `mailmap` kuralını kullanın"
