"rewrite preview --move_paths" = "Yol kuralı `FROM=TO`: her commit'te bir dosyayı ya da klasörü yeniden adlandırır; aynı blob ve ağaçlar yeni yolda durur (tekrarlanabilir, sırayla, içerik kurallarından sonra). `TO` zaten var olan bir commit değiştirilmez: önizleme reddedilir (çıkış kodu 2, `path_collision`) ve commit'lerle yolları listeler"
