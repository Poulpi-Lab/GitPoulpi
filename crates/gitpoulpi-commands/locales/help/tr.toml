repo-auth = "Bu deponun hangi kimlikle doğrulandığı (HTTPS ve SSH): makinenin kendi kimliği, bir GitPoulpi hesabı veya bir anahtar dosyası. `show` ve `test` okur; `set` ve `clear` bir kişinin kararıdır"
"repo-auth clear" = "Profili unutur: depo yeniden makinenin kendi kimliğine döner. Yalnızca bir kişi yapabilir: bir ajan reddedilir"
"repo-auth set" = "Bu deponun doğrulandığı kimliği protokol başına seçer: HTTPS uzak depoları için `--https`, SSH uzak depoları için `--ssh`. Profil, depoda değil GitPoulpi'nin özel dizininde tutulur. Yalnızca bir kişi ayarlayabilir: bir ajan reddedilir (çıkış kodu 2)"
"repo-auth set --cache_minutes" = "`token-command` ile: token'ının kaç dakika yeniden kullanılacağı"
"repo-auth set --command" = "`--https token-command` ile: komut ve bağımsız değişkenleri (ilk sözcük programdır). `--command` seçeneğini sona yazın: ondan sonraki her sözcük, tireli olanlar dahil (`sh -c ...`), komuta aittir"
"repo-auth set --helper" = "`--https helper` ile: kimlik bilgisi yardımcısı komutu. Bir kişi onu karma değeriyle birlikte onaylar (veya `--yes` verir)"
"repo-auth set --hosts" = "`helper` veya `token-command` ile: hizmet verebileceği sunucular (virgülle ayrılmış veya tekrarlanmış)"
"repo-auth set --https" = "HTTPS kimliği: `system` (git'in kendi yardımcıları), `integration:<id>` (bir GitPoulpi hesabının token'ı), `helper` (tek bir kimlik bilgisi yardımcısı, `--helper` ile) veya `token-command` (token yazdıran bir komut, `--command` ve `--hosts` ile)"
"repo-auth set --ignore_repo_helpers" = "`--https system` ile: bu deponun kendisinin ayarladığı kimlik bilgisi yardımcılarını bırakır, sistem ve genel olanları korur"
"repo-auth set --known_hosts" = "`--ssh key:` veya `integration-key:` ile: `known_hosts` dosyası"
"repo-auth set --ssh" = "SSH kimliği: `system` (ssh'ın kendi yapılandırması ve ajanı), `key:<path>` (tek başına sunulan bir özel anahtar dosyası) veya `integration-key:<id>` (bir GitPoulpi hesabının anahtarı)"
"repo-auth set --strict" = "`--ssh key:` veya `integration-key:` ile: bilinmeyen sunucu anahtarlarını reddeder (`StrictHostKeyChecking=yes`)"
"repo-auth set --username" = "Bir kullanıcı adı: `system` ile `credential.username` (bir kimlik bilgisi yöneticisinin birkaç hesaptan birini seçmesini sağlar); `integration:<id>` ile token'la birlikte gönderilen kullanıcı adı"
"repo-auth set --yes" = "Bir yardımcıyı veya token komutunu etkileşimli soru olmadan onaylar (komut ve karma değeri yine de yazdırılır)"
"repo-auth show" = "Bu deponun hangi kimlikle doğrulandığını gösterir: saklanan profil, her uzak deponun kullanacağı kimlik, profilin geçersiz kıldığı ayarlar ve varsa uyarılar. Asla bir sır yazdırmaz; yardımcı veya token komutu yalnızca bir kişiye yazdırılır (ajan `{set, sha256}` alır)"
"repo-auth test" = "Profil uygulanmışken her uzak deponun (veya birinin) bağlantısını hiçbir şeyi değiştirmeden sınar: uzak deponun dallarını listeler, `--push` ile bir push'un kabul edilip edilmeyeceğini sorar. Her uzak deponun raporunu ve kullandığı kimliği yanıtlar. Ağa erişir"
"repo-auth test --push" = "Ayrıca bir push'un kabul edileceğini denetler"
"repo-auth test --remote" = "Yalnızca bu uzak depo (varsayılan: her uzak depo)"
"apply-commit" = "Apply the changes one commit made (even a lost one) to the working tree only: the index and HEAD stay. All or nothing: when a file does not apply cleanly nothing changes (`stash from-commit` keeps the changes as a stash instead). A merge commit is refused. `undo` takes it back"
"apply-commit --commit" = "The commit whose changes to apply (any revision: a sha, `HEAD~2`, ...)"
"stash from-commit" = "Save the changes one commit made (even a lost one) as a new stash, without touching the working tree. `undo` drops it again"
"stash from-commit --commit" = "The commit whose changes to keep (any revision: a sha, `HEAD~2`, ...)"
"stash from-commit --message" = "The stash message; omitted, one naming the commit"
