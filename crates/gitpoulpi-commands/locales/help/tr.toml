"mailmap check --identities" = "Çözülecek kimlikler, her biri `Name <email>` veya `<email>`"
"mailmap list" = "Kapsamdaki bir commit'in yazarı veya commit edeni olan her adı ve e-postayı, her birinin yazar ve commit eden olarak kaç commit'i olduğuyla (en çok commit'liden başlayarak) ve `.mailmap` dosyasının onu şimdiden eşlediği kimlikle (`mapped_to`) listeler. Yalnızca okur"
