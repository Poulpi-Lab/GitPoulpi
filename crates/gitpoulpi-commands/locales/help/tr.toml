Bir Lua betiğini derler; başlığını (ad, pencere, parametreler), tanımladığı işlevleri ve her sorunu yazdırır. Sorun varsa çıkış kodu 2. Yalnızca okur; hiçbir commit üzerinde bir şey çalışmaz.

Bir shell, Python veya harici Lua betiği için (korumalı alanda değil) ayrıca yorumlayıcının bulunup bulunmadığını ve betiğe güvenilip güvenilmediğini söyler; güvenilen bir betik için kuru bir el sıkışma yapar: betiği uydurma bir commit ile (`"dry_run": true`) bir kez başlatır ve yanıtı denetler. Güvenilmeyen bir betik asla başlatılmaz."""
