"mcp serve --allow_remote" = "`--http` için loopback olmayan bir adrese izin verir. `[mcp] http_auth` açık ve bir token hazır değilse ve trafik şifreli değilse (`[mcp] tls`, ya da sorumluluğunu üstlendiğiniz bir tünel veya ters vekil sunucu için `behind_proxy`) reddedilir; loopback uç noktasına `ssh -L` daha güvenlidir"
"mcp serve --http" = "Akışlı HTTP için dinleme adresi, örn. 127.0.0.1:8808 (uç nokta `/mcp`); adres verilmezse `[mcp] bind` (varsayılan 127.0.0.1:8808). `[mcp] http_auth` kapalı olmadıkça istekler bearer token'ı gerektirir (`mcp token`). `--allow-remote` olmadıkça yalnızca loopback"
"mcp serve --ui_control" = "Ajanın `ui_*` araçlarıyla kullanıcının penceresini ne kadar oynatabileceği: `ask` (varsayılan: pencere kullanıcının onayladığı bir çip gösterir), `auto` veya `off`. `[mcp] ui_control` ayarını geçersiz kılar"
"mcp token" = "HTTP uç noktasının (`mcp serve --http`) bearer token'ı: JSON `{token_hint, path, rotated}` olarak maskeli gösterir, ilk kullanımda oluşturur. İstemci bunu `Authorization: Bearer <token>` olarak gönderir. Bir MCP aracı değildir: bir ajan kendi anahtarını asla okuyamaz veya döndüremez"
