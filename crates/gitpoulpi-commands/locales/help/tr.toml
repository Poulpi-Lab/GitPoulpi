"rewrite preview --remove_paths" = "İçerik kuralı: bu glob desenine uyan dosya ve klasörleri her commit'ten kaldırır (tekrarlanabilir; eğik çizgisiz desen her derinlikte eşleşir)"
"rewrite preview --replace_content" = "İçerik kuralı `ARANAN=YENİ`: her metin dosyasındaki düz metni değiştirir (tekrarlanabilir; ikili dosyalar atlanır ve sayılır). Gizli değerler için kural setinde `content_replace` kuralını `--secrets-file` ile kullanın"
