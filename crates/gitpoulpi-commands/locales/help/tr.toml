"log --count" = "Yalnızca yürüyüşün kaç commit içerdiğini yazdırır (`{\"total\": N}`); `--limit` ve `--skip` yok sayılır: TUI'nin durum çubuğunun eğik çizgiden sonra gösterdiği sayı. Hiçbir commit yüklenmeden sayar"
