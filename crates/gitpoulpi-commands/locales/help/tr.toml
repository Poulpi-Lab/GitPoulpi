ai = "YZ yardımcıları (`ai.enabled = true` olmadıkça kapalı): üretilen bir commit mesajını yazdır veya bir commit'i ya da çalışma değişikliklerini açıkla"
"ai --print_sent" = "Modele gönderilecek olanı yazdırır (gizli bilgiler sansürlendikten ve hassas dosyalar çıkarıldıktan sonraki sistem ve kullanıcı metni) ve hiçbir şey göndermez. `ai.enabled = true` gerekir, ama anahtar ve ağ gerekmez"
"ai --send_all" = "Her girdiyi, `ai.limits.*` sınırını aşsa bile bütün olarak gönderir. Bu olmadan sınırı aşan girdi kısaltılır (çakışma ise reddedilir) ve yanıt neyin kesildiğini `truncated: [{part, detail?, bytes, limit, setting}]` içinde söyler"
"commit --send_all" = "`--ai` ile: diff `ai.limits.diff_bytes` değerini aşsa bile tamamını gönderir. Bu olmadan daha büyük bir diff kısaltılır ve yanıt bunu söyler (`truncated`)"
"hosting review suggest --send_all" = "Her girdiyi, `ai.limits.*` sınırını aşsa bile bütün olarak gönderir (diff, bir dosyanın diff'i, açıklama, mevcut yorumlar, bağlam dosyaları). Bu olmadan sınırı aşan girdi kısaltılır ve yanıt neyin kesildiğini `truncated` içinde söyler"
"stash push --send_all" = "`--ai` ile: diff `ai.limits.diff_bytes` değerini aşsa bile tamamını gönderir. Bu olmadan daha büyük bir diff kısaltılır ve yanıt bunu söyler (`truncated`)"
"ai commit-message" = "YZ'nin hazırlanmış değişiklikler için önerdiği commit mesajını yazdırır (hiçbir şey hazırlanmamışsa tüm değişiklikler için). Hiçbir şey commit etmez"
"ai explain" = "Bir commit'i (varsayılan HEAD) veya --wip ile çalışma değişikliklerini açıklar"
"ai resolve-conflict" = "Çakışmalı bir dosyanın TEK bir merge çakışması için YZ'nin önerdiği çözümü yazdırır (`--conflict N`, 1'den başlar; dosyada tek çakışma varsa isteğe bağlı). Yalnızca yazdırır: hiçbir şey yazılmaz veya hazırlanmaz, kararı çağıran verir (`conflicts resolve --content-file` tüm dosya sonucunu uygular). `ai.enabled = true` gerekir"
"ai resolve-conflict --conflict" = "Dosyanın hangi çakışması, 1'den başlar"
"ai resolve-conflict --path" = "Çakışmalı dosya, depo köküne göre"
autostash = "Bekleyen auto-stash: GitPoulpi bir checkout, merge, rebase veya pull çalıştırmak için yerel değişiklikleri kenara aldı ve henüz geri koymadı"
"ai review-context" = "Bir ✦ kod inceleme taslağına diff dışında nelerin verildiğini gösterir veya ayarlar (`[ai.review]`): deponun CLAUDE.md ve AGENTS.md dosyaları, bir dosya daha (yol veya bağlantı) ve yerel bir ajanın depoda çalışıp çalışmayacağı. `--repo` da `--project` de verilmezse genel varsayılandır; `--repo PATH` klonlanmış bir deponun kendi değeri, `--project HOST/PROJECT` klonlanmamış bir deponun değeridir. Ayar bayrağı yoksa değerleri yazdırır (`effective`, bir incelemenin aldığı değerdir); varsa kaydeder ve sonucu yazdırır. Model gerekmez ve YZ kapalıyken de çalışır"
"ai review-context --agents_md" = "Modele deponun AGENTS.md dosyasını ver"
"ai review-context --claude_md" = "Modele deponun CLAUDE.md dosyasını ver"
"ai review-context --context_file" = "Bir dosya daha: depo köküne göre bir yol, mutlak bir yol veya bir kod barındırıcısındaki dosyaya bağlantı"
"ai review-context --no_context_file" = "Ek dosya yok"
"ai review-context --no_extra_file" = "Genel değer ne derse desin depo veya proje için ek dosya yok (`on`, tek başına verildiğinde varsayılan); `off` genel değeri yeniden izletir"
"ai review-context --project" = "Klonlanmamış bir depo, `HOST/PROJECT` olarak (`github.com/owner/name`)"
"ai review-context --reset" = "`--repo` veya `--project` ile: bayrakları uygulamadan önce deponun kendi değerlerini unut (yeniden genel değerleri izler)"
"ai review-context --run_in_repo" = "Yerel bir ajanı depoda çalıştır (`yes`), orada çalıştırma (`no`) ya da YZ profilinin dediği gibi yap (`profile`). `--project` için geçerli değil"
"autostash start-over" = "Baştan başla: stash'in dosyalarındaki çalışma ağacı değişikliklerini atar (bir kopya `refs/gitpoulpi-backup/` altında kalır), auto-stash'i yapan işlemi (pull, checkout, merge, rebase) geri alır, sonra stash'i özgün commit üzerinde pop eder. Bir adım başarısız olursa stash bozulmadan durur. Reddedilirse çıkış kodu 1, `--yes` gerekirse 3"
"autostash start-over --dry_run" = "Ne olacağını göster ve hiçbir şeyi değiştirme"
"autostash start-over --yes" = "Devam eder; olmadan hiçbir şey değişmez ve çıkış kodu 3 olur"
blame = "Bir revizyondaki dosyanın satır satır kime ait olduğu"
"blame --at" = "Blame yapılacak revizyon (varsayılan: HEAD)"
"branch delete-remote" = "Bir dalı uzak depodan siler, aynı adlı yerel dalı korur"
"branch fast-forward" = "`<branch>` dalını yalnızca fast-forward ise `<target>` noktasına ilerletir (ayrışmış geçmiş reddedilir, hiçbir şey taşınmaz). Çıkış yapılmış dal, `git merge --ff-only` gibi çalışma ağacını da götürür; başka bir dalın yalnızca ref'i taşınır"
"branch fast-forward --target" = "Herhangi bir revizyon (varsayılan: HEAD)"
"branch set-upstream" = "`<branch>` dalının `<upstream>` (`origin/main`) dalını izlemesini sağlar"
"branch track" = "Uzak izleme dalını izleyen yerel bir dal oluşturur ve checkout yapar. `<upstream>`, ref listesinin yazdığı gibi yazılır (`origin/feature/login`); `--name` varsayılan olarak dal kısmıdır"
"branch unset-upstream" = "`<branch>` dalının upstream'ini kaldırır"
"checkout --autostash" = "Bunu engelleyen yerel değişiklikleri stash eder, işlemi çalıştırır, sonra stash'i geri alır (`general.auto_stash = \"always\"` ayarının yaptığı)"
"cherry-pick --commits" = "Sırayla uygulanacak commit'ler. `--plan` verildiğinde atlanır"
"cherry-pick --plan" = "Bir JSON `Vec<RebaseStep>` (`rebase --plan` ile aynı biçim; bkz. `rebase-plan`), dosya yolundan veya stdin için `-`: adımlar liste sırasıyla cherry-pick edilir. Burada yalnızca `Pick` ve `Drop` eylemleri anlamlıdır (`Drop` commit'i atlar); diğer her eylem reddedilir. Konumsal commit'lerle birleştirilemez"
"clone --branch" = "Uzak deponun varsayılan HEAD'i yerine bu dalda checkout yap"
"clone --depth" = "Geçmişi bu kadar commit'e kısalt (`git clone --depth`)"
"clone --no_lfs" = "Klondan sonra Git LFS dosyalarının içeriğini indirmek yerine işaretçi olarak bırak"
"clone --origin" = "Yeni uzak depoya `origin` dışında bir ad ver"
"clone --recurse_submodules" = "Alt modülleri de klonla"
"commit --ai" = "Mesajı, deponun Commit mesajı talimatlarını (Ayarlar > YZ) kullanarak hazırlanmış diff'ten YZ'ye yazdır. `ai.enabled = true` ve yapılandırılmış bir profil gerekir"
"commit --message" = "Commit mesajı. --ai yazmıyorsa zorunlu"
"commit --no_verify" = "Commit hook'larını (`pre-commit`, `commit-msg`) atlar, `commit --no-verify` gibi"
completions = "Bir kabuk tamamlama betiğini stdout'a yazdırır (bash, zsh, fish, powershell veya elvish), örn. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Süren işlemi iptal eder: HEAD, indeks ve çalışma ağacı işlemden öncesine döner. O zamandan beri yapılan çözümleri atar"
"conflicts skip" = "Süren cherry-pick veya revert işlemini (ya da bir rebase'in durduğu commit'i) atlar: HEAD, indeks ve çalışma ağacı HEAD'e döner. Boş kaldığında çıkış yolu (değişiklik zaten uygulanmış). Bir merge'in atlanacak bir şeyi yoktur"
"conflicts check" = "HEAD'in, çıktığı dala merge edilmesi çakışır mı ve hangi dosyalarda? Hiçbir şeye dokunulmaz (bellekte yapılan bir merge). Taban, dalın bilinen pull request'inin hedefidir; yoksa Temel dallar desenlerinin izin verdiği, çatallanmadan beri en az commit'i olan daldır. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. `general.conflict_detection` ya da deponun kendi anahtarı kapalıysa devre dışıdır"
"conflicts list" = "Çakışmalı dosyalar, her biri üç tarafının metniyle. `--names-only` ile: yalnızca yol, çakışma türü ve aşama oid'leri (hiçbir blob okunmaz; büyük bir merge'de ucuz)"
"conflicts resolve" = 'Bir dosyayı çözer ve hazırlar (dosya çakışmalı olmaktan çıkar). Tam olarak biri: `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` veya `--delete`. A ve "ours" mevcut taraf (`HEAD`; rebase sırasında üstüne rebase edilen dal), B ve "theirs" gelen taraftır. Çakışma işaretlerini asla elle düzenleme: seç veya son metni bir dosyaya yaz'
"conflicts resolve --both" = "Her çakışmanın iki tarafını da koru (önce A sonra B), başka her yerde git'in kendi merge'ini"
"conflicts resolve --content_file" = "Son dosya metni, aynen (`-` standart girdiyi okur)"
"conflicts resolve --delete" = "Silmeyi kabul et: dosyayı kaldır (`git rm`)"
"conflicts resolve --encoding" = "`--content-file` ile: metni UTF-8 yerine bu kodlamada yaz (`windows-1252` gibi bir WHATWG etiketi)"
"conflicts resolve --expect" = "Kararın verildiği aşama oid'leri, `base,ours,theirs` (eksik aşama için `-`). İndeks artık tam olarak bunları tutmuyorsa çağrı `stale` olarak reddedilir. `--both` ve `--pick` okudukları aşamaları her zaman denetler"
"conflicts resolve --no_stage" = "Çalışma ağacı dosyasını yaz ama çakışmalı bırak (düz kaydetme)"
"conflicts resolve --ours" = "`--side ours` ile aynı"
"conflicts resolve --pick" = "Çakışma numarası başına bir seçim: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = ikisi de o sırayla). `--default` kalanları kapsamıyorsa her çakışmanın bir seçimi olmalı"
"conflicts resolve --pick_default" = "`--pick` ile: listelenmeyen her çakışma için seçim"
"conflicts resolve --side" = "Tüm dosyayı tek bir aşamadan al, otomatik merge yok"
"conflicts resolve --theirs" = "`--side theirs` ile aynı"
"conflicts resolve --theirs_first" = "`--both` ile: önce B sonra A"
"conflicts show" = "Merge düzenleyicinin gördüğü gibi tek bir çakışmalı dosya: bölme etiketleri, üç taraf ve numaralı çakışma bölgeleri (`--json` tam belgedir). Git'in kendi başına çözdüğü birleşmiş bölgeler listelenmez; `resolve --both`/`--pick` sonucunda kalırlar"
"conflicts show --conflict" = "Yalnızca N. çakışma (1'den başlar)"
"conflicts state" = "Süren merge, rebase, cherry-pick veya revert (yoksa `null`)"
"conflicts unresolve" = "Bu işlem sırasında çözülen bir dosyayı yeniden çakışmalı yapar (işaretler geri gelir). Hâlâ çakışmalıysa veya işlem sürerken çözülmediyse reddedilir"
daemon = '`gitpoulpi server ...` görünür bir takma addır - sahibi bu gruba "sunucu" der ve `gp server stop` yazar'
"daemon restart" = "`daemon stop`, ardından `daemon start`"
"daemon run" = "Bu oturumun daemon'ını ön planda çalıştırır (bloklar; durdurmak için Ctrl-C veya başka yerden gönderilen `daemon stop`/`daemon restart`). `daemon start` bunu ayrık başlatır, ayrılmış bir terminal de doğrudan çalıştırabilir"
"daemon start" = "Bu oturumun daemon'ını ayrık bir arka plan süreci olarak başlatır (veya zaten çalışıyorsa bunu bildirir). `--backend` başlatılan sürece kullanması söylenen arka ucu sabitler; verilmezse süreç `general.default_backend` ayarını kendisi çözer"
"daemon status" = "Bu oturumun daemon'ının dinleyip dinlemediği ve dinliyorsa bağlantı noktası, PID, çalışma süresi, arka uç ve derleme sürümü"
"daemon stop" = "Bu oturumun daemon'ından düzgünce kapanmasını ister; yalnızca zamanında yanıt vermezse ve yalnızca bağımsız bir daemon ise (çalışan bir TUI'ye gömülü olana asla) kayıtlı PID'ini öldürmeye başvurur"
"daemon stop --all" = "Yalnızca bunu değil, `session list` komutunun bağlantı noktası dosyası bildirdiği her oturumun daemon'ını durdur"
discard = "Bir dosyanın çalışma ağacındaki *hazırlanmamış* değişikliklerini atar: bir hunk (`--hunk`), satırlarından bazıları (`--hunk --lines`) veya - yalnızca `--file` ile - dosyadaki hazırlananlar dahil her commit'lenmemiş değişiklik (izlenmeyen bir dosya silinir). Hunk'lar ve satırlar, `gitpoulpi diff --json` komutunun hazırlanmamış diff'i numaralandırdığı gibi numaralanır. Attığı her şey bir güvenlik anlık görüntüsünde saklanır, böylece `gitpoulpi undo` onu geri getirir (izlenmeyen dosyalar dahil). Onaylanmaz: bu betik yüzeyidir"
"discard --lines" = "`--hunk` içindeki virgülle ayrılmış satır dizinleri"
"fetch --all" = "Yapılandırılmış her uzak depoyu fetch et"
"fetch --prune" = "Uzak deponun artık sahip olmadığı uzak izleme dallarını at"
"fetch --prune_tags" = "Uzak deponun sildiği yerel tag'leri de siler (yalnızca onda bulunmuş tag'ler: hiç gönderilmemiş bir tag'e dokunulmaz). Git'in `fetch.pruneTags` ayarı, ama daha dar; istenmedikçe kapalıdır"
"fetch --remote" = "Verilmezse: deponun varsayılan uzak deposu (bkz. `remote default`)"
gitpoulpi = "Hafif, platformlar arası TUI Git istemcisi; CLI/MCP ile betiklenebilir."
"gitpoulpi --add" = "Bir klasörü, yenisini başlatmak yerine zaten çalışan GitPoulpi'de yeni sekme olarak açar (`gp -a`, `gp --add ../baska`). PATH varsayılan olarak geçerli klasördür ve onu içeren depoya çözümlenir. Çalışan tek oturum: sekmeyi alır ve masaüstü izin veriyorsa penceresi öne gelir. Birden çok: numaralı bir listeden birini seçersiniz (ya da `--session AD` verirsiniz). Hiçbiri: GitPoulpi o klasörde normal şekilde başlar. Alt komut almaz; `--json` ile tek bir nesne yazdırır (`action` değeri `joined` veya `cancelled`), sekme açıldığında çıkış kodu 0, meşgul bir pencere sekmeyi durum çubuğu çipinde önerdiğinde 3"
"gitpoulpi --no_raise" = "`--add` ile: pencereden terminalini öne getirmesini istemez"
"gitpoulpi --backend" = "Bu komutun daemon'ının hangi `GitBackend` üzerinde çalışacağı; config.toml'daki `general.default_backend` ve `GITPOULPI_GENERAL_DEFAULT_BACKEND` ayarını geçersiz kılar (bayraklar öncelik merdiveninin en üstündedir - bkz. docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
Bu komutun daemon'ının hangi `GitBackend` üzerinde çalışacağı; config.toml'daki `general.default_backend` ve `GITPOULPI_GENERAL_DEFAULT_BACKEND` ayarını geçersiz kılar (bayraklar öncelik merdiveninin en üstündedir - bkz. docs/user/config-reference.md).

Bu komutun *başlattığı* bir daemon için arka ucu seçer. Daemon'ı zaten çalışan bir oturum, daemon'ın derlendiği arka ucu korur; `gitpoulpi` canlı bir daemon'ın arka ucunu ona abone olmuş istemcilerin altından değiştirmenin bir yolunu sunmaz ve aksini iddia etmek, bu bayrağın önlemek için var olduğu sessiz etkisizliğin aynısı olurdu."""
"gitpoulpi --cwd_file" = """TUI çıkarken etkin sekmenin klasörünü yazdığı dosya ("Çık ve cd yap" ile veya `ui.tab_dir_follow = "auto"` ile her zaman). `gitpoulpi shell-init` komutunun yazdırdığı sarmalayıcı için; yalnızca TUI'nin sekmeleri olduğundan her alt komut tarafından yok sayılır"""
"gitpoulpi --json" = "İnsan tarafından okunur çıktı yerine yapılandırılmış JSON üret"
"gitpoulpi --lang" = "`--help` metninin dili (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
`--help` metninin dili (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Yalnızca açıklamalar çevrilir - komut ve bayrak adları asla değişmez - ve bu verilmedikçe `--help` İngilizce kalır (ortam bilerek yok sayılır, böylece betikler kararlı çıktı alır). Örnek: `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Üzerinde işlem yapılacak depo. Varsayılan olarak geçerli dizini kapsayan depodur, bu yüzden `gitpoulpi status` `git status` gibi davranır; birkaç depoyu süren bir ajan chdir yapmak yerine bunu verir"
