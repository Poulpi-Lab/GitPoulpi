"hosting checkout-pr" = "Bir pull/merge request'te checkout yapar, bir fork'tan geleni de: head'ini (`refs/pull/<n>/head`, `refs/merge-requests/<n>/head`) yerel `pr/<n>` dalına (GitLab'da `mr/<n>`) fetch eder, onu izleyerek ona geçer"
