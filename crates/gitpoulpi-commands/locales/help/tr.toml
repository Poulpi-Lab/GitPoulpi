"rewrite preview --extract_mode" = "`--extract` işleminin nasıl biteceği: `clone` (`--target` içinde yeni bir yerel klon, özgün depoya dokunulmaz; her yerel dal ve tag), `in-place` (bu deponun geçmişi yeniden yazılır, tek bir geri alma kaydı) veya `submodule` (`clone` gibi bir klon ve geçerli daldaki yeni bir commit klasörün yerine onun alt modülünü koyar; bu geçmiş korunur)"
