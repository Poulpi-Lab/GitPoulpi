show = "Вміст файлу на ревізії, в індексі чи в робочому дереві"
"show --at" = "Ревізія для читання (типово: HEAD). Взаємовиключне з --staged і --worktree"
"show --output" = "З --raw: записує байти в цей файл замість stdout"
