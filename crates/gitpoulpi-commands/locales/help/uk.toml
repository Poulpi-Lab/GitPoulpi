"rewrite note" = "Нотатка для людей, які мають стару історію: для кожної надісланої гілки й тега - старий і новий кінець та що виконати (`git fetch`, потім `git reset --hard origin/<branch>` або `git rebase --onto`). Лише читає"
"rewrite note --run" = "Ідентифікатор запуску; `latest` (типово) - останній застосований запуск"
"rewrite preview --extract" = "Правило шляхів: залишити лише цю підпапку, яка стає коренем; коміти, що її не зачіпають, відкидаються, а злиття спрощуються. Питається щоразу: вкажіть `--extract-mode`, інакше код виходу 3 і нічого не переглядається. Винесення виконується раніше за інші прапорці шляхів"
"rewrite preview --extract_mode" = "Чим закінчується `--extract`: `clone` (новий локальний клон у `--target`, оригінал не чіпається; усі локальні гілки й теги), `in-place` (історію цього репозиторію переписано, один запис скасування) або `submodule` (клон, як у `clone`, а один новий коміт у поточній гілці замінює папку підмодулем із нього; ця історія зберігається)"
"rewrite preview --into_subdir" = "Правило шляхів: перенести весь репозиторій у цю підпапку в кожному коміті (щоб об'єднувати репозиторії без конфліктів шляхів)"
"rewrite preview --move_paths" = "Правило шляхів `FROM=TO`: перейменувати файл чи папку в кожному коміті, ті самі blob і tree за новим шляхом (можна повторювати, по порядку, після правил вмісту). Коміт, де `TO` уже існує, не змінюється: перегляд відхиляється (код виходу 2, `path_collision`) зі списком комітів і шляхів"
"rewrite preview --target" = "Папка нового репозиторію для `--extract-mode clone` або `submodule`: її не має існувати або вона має бути порожньою, і не всередині цього репозиторію. Використовується в `rewrite run`; `rewrite apply` бере власну"
"rewrite push" = "Надсилає ref, які застосований запуск пересунув і які були на remote, кожен із `--force-with-lease=<ref>:<id, який був на remote під час перегляду>` (ніколи не звичайний force), по одному `--atomic` push на remote, де сервер це дозволяє (інакше по одному push на ref, і відповідь про це скаже). Теги включено. Захищені гілки (`rewrite.protected_branches`) пропускаються, якщо їх не вказано через `--include-protected` або всі разом через `--include-all-protected`. Ref, чий remote змінився після перегляду, відхиляється (виконайте fetch, перевірте й запустіть знову). Не скасовується: remote зберігає нову історію, навіть якщо ви зробите `undo` переписування локально. Без `--yes` (або з `--dry-run`) нічого не надсилається: відповідь перелічує, що було б надіслано, а код виходу без `--yes` - 3. Код виходу 2, коли запуску вже немає, 4, коли ref відхилено або не надіслано"
"rewrite push --dry_run" = "Спитати remote, що станеться (lease перевіряються), і нічого не надсилати"
"rewrite push --include_all_protected" = "Надіслати також усі захищені гілки запуску"
"rewrite push --include_protected" = "Надіслати також цю захищену гілку (можна повторювати)"
"rewrite push --no_atomic" = "По одному push на ref замість одного push `--atomic` «все або нічого»"
"rewrite push --remote" = "Лише ref цього remote"
"rewrite push --run" = "Ідентифікатор запуску, який вивів `rewrite apply`; `latest` (типово) - останній застосований запуск"
"rewrite push --yes" = "Виконати push. Без цього нічого не надсилається (код виходу 3)"
"rewrite purge" = "Остаточно видаляє з цього клона стару історію переписування: скидає закріплення скасування цього переписування (і будь-якої ранішої операції, чиї закріплення теж тримають стару історію), закінчує дію записів reflog, що на неї посилаються, очищає об'єкти (`gc --prune=now`) і перевіряє, що їх більше немає. Скасувати ці операції стане неможливо (вони лишаються в `undo --list` як очищені). Після початку це не можна зупинити й не можна скасувати. Усе, що ще тримає стару історію (гілка поза переписуванням, stash, HEAD іншого worktree, remote-tracking ref: після push зробіть fetch), блокує очищення, і нічого не змінюється. Нічого не надсилається на жоден remote; відповідь перелічує кроки, потрібні на хості (GitHub, GitLab, Azure DevOps, Bitbucket). Без `--yes` нічого не відбувається: відповідь каже, що було б видалено й втрачено, а код виходу - 3. Код виходу 2, коли запис не є переписуванням, 4, коли щось блокує очищення або об'єкти лишаються. Через MCP лише з `[mcp] allow_history_purge = true`"
"rewrite purge --all" = "Усі переписування історії з історії скасувань"
"rewrite purge --entries" = "Запис переписування історії з історії скасувань (`undo --list`; можна повторювати). Типово: найновіше переписування, яке ще не очищено"
"rewrite purge --latest" = "Найновіше переписування, яке ще не очищено (типово)"
"rewrite purge --yes" = "Виконати видалення. Без цього нічого не змінюється (код виходу 3)"
"rewrite run --extract" = "Правило шляхів: залишити лише цю підпапку, яка стає коренем; коміти, що її не зачіпають, відкидаються, а злиття спрощуються. Питається щоразу: вкажіть `--extract-mode`, інакше код виходу 3 і нічого не переглядається. Винесення виконується раніше за інші прапорці шляхів"
"rewrite run --extract_mode" = "Чим закінчується `--extract`: `clone` (новий локальний клон у `--target`, оригінал не чіпається; усі локальні гілки й теги), `in-place` (історію цього репозиторію переписано, один запис скасування) або `submodule` (клон, як у `clone`, а один новий коміт у поточній гілці замінює папку підмодулем із нього; ця історія зберігається)"
"rewrite run --into_subdir" = "Правило шляхів: перенести весь репозиторій у цю підпапку в кожному коміті (щоб об'єднувати репозиторії без конфліктів шляхів)"
"rewrite run --move_paths" = "Правило шляхів `FROM=TO`: перейменувати файл чи папку в кожному коміті, ті самі blob і tree за новим шляхом (можна повторювати, по порядку, після правил вмісту). Коміт, де `TO` уже існує, не змінюється: перегляд відхиляється (код виходу 2, `path_collision`) зі списком комітів і шляхів"
"rewrite run --target" = "Папка нового репозиторію для `--extract-mode clone` або `submodule`: її не має існувати або вона має бути порожньою, і не всередині цього репозиторію. Використовується в `rewrite run`; `rewrite apply` бере власну"
"rm-file --paths" = "Шляхи відносно репозиторію для видалення"
shell-init = """Виводить функцію-обгортку оболонки (типова назва `gp`), що запускає gitpoulpi і, коли ви виходите через «Quit and cd here», лишає вашу оболонку в теці активної вкладки. Додайте її в rc-файл вашої оболонки: `eval "$(gitpoulpi shell-init bash)"`. Нічого не встановлюється й не редагується"""
