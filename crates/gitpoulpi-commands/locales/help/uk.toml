"rewrite script check#long" = "Компілює скрипт Lua й виводить його заголовок (назва, вікно, параметри), функції, які він оголошує, і всі проблеми. Код виходу 2, якщо є проблеми. Лише читає; на комітах нічого не запускається.\n\nДля скрипту shell, Python або зовнішньої Lua (без пісочниці) також повідомляє, чи знайдено інтерпретатор і чи скрипту довіряють, а для того, якому довіряють, робить пробне рукостискання: запускає скрипт один раз з вигаданим комітом (`\"dry_run\": true`) і перевіряє відповідь. Скрипт, якому не довіряють, ніколи не запускається."
"rewrite script test --language" = "`lua`, `shell`, `python` або `lua-external`; типово за розширенням"
"rewrite script test --trust" = "Спершу довіритися цьому скрипту (рішення людини, через MCP відхиляється)"
"rewrite script trust" = "Довіряти зовнішньому скрипту (shell, Python, зовнішня Lua) за його вмістом: SHA-256 файлу запам'ятовується для цього репозиторію, тож скрипт може працювати (перегляд, запуск, тест); після зміни файлу запитують знову. Ці скрипти працюють без пісочниці, з вашими правами, тому спершу прочитайте файл. Це може зробити лише людина: інструмента MCP для цього немає"
"rewrite script trust --file" = "Файл скрипту"
"rewrite tools" = "Які інструменти потрібні можливостям переписування (gpg / ssh-keygen / gpgsm для повторного підписування, інтерпретатори скриптів, git-lfs) і чи знайдено кожен із них. Лише читання"
"rewrite tools --fresh" = "Перевірити знову замість відповіді з однохвилинного кешу"
mailmap = "`.mailmap`: одне канонічне ім'я та email для людей, які робили коміти під кількома. Log, blame та історія файлу показують зіставлені імена (`log.use_mailmap`), не чіпаючи комітів. `list` рахує особи в історії й показує, які вже зіставлено, `check` показує, як розв'язуються певні особи, `add` зводить особи в одну, дописуючи рядки до `.mailmap` (файл редагується, не комітиться; скасовується)"
"mailmap add" = "Зводить особи в одну канонічну, дописуючи рядки до `.mailmap` (файл створюється, якщо його немає; рядок, що вже є, не повторюється). Файл редагується, не комітиться: закомітьте його самі. Один запис скасування (`gitpoulpi undo` повертає попередній файл). Log одразу показує канонічну особу (`log.use_mailmap`); збережені коміти не змінюються, тож force push не потрібен. Щоб переписати самі коміти, використайте правило `mailmap` у `rewrite`"
"mailmap add --canonical" = "Особа, яку зберегти, `Name <email>`"
"mailmap add --file" = "`.mailmap` для запису, відносно кореня репозиторію (типово: `.mailmap` у корені)"
"mailmap add --from" = "Особа, яку на неї зіставити, `Name <email>` (можна повторювати, щонайменше одна)"
"mailmap check" = "Показує, як особи (`Name <email>` або `<email>`) виглядають через `.mailmap` репозиторію: канонічне ім'я та email або та сама особа, якщо нічого не зіставляє. Лише читає"
"mailmap check --identities" = "Особи для розв'язання, кожна `Name <email>` або `<email>`"
"mailmap list" = "Перелічує кожне ім'я й email, що були автором або комітером коміту з області, з кількістю комітів кожного як автора і як комітера, спершу з найбільшою кількістю, та особу, на яку `.mailmap` уже її зіставляє (`mapped_to`). Лише читає"
"mailmap list --all_local" = "Усі локальні гілки й теги замість поточної гілки"
"mailmap list --mapped" = "Лише особи, які `.mailmap` уже зіставляє"
"mailmap list --refs" = "Лише ці локальні гілки або теги (можна повторювати)"
"mailmap list --unmapped" = "Лише особи, яких `.mailmap` не зіставляє"
"rewrite preview --mailmap" = "Правило mailmap: переписує авторів і комітерів на те, як їх називає `.mailmap` робочого дерева (історія врешті показує те, що показує `git log --use-mailmap`). `--who` вибирає автора, комітера або обох. Для виправлення лише відображення, без переписування, скористайтеся `mailmap add`"
"rewrite preview --mailmap_file" = "З `--mailmap`: застосувати цей файл замість `.mailmap` робочого дерева (відносно кореня репозиторію або абсолютний шлях)"
"rewrite run --mailmap" = "Правило mailmap: переписує авторів і комітерів на те, як їх називає `.mailmap` робочого дерева (історія врешті показує те, що показує `git log --use-mailmap`). `--who` вибирає автора, комітера або обох. Для виправлення лише відображення, без переписування, скористайтеся `mailmap add`"
"rewrite run --mailmap_file" = "З `--mailmap`: застосувати цей файл замість `.mailmap` робочого дерева (відносно кореня репозиторію або абсолютний шлях)"
"rewrite analyze" = "Аналіз розмірів історії, як `filter-repo --analyze`: найбільші blob із шляхом, розміром, першим і останнім комітом та ознакою, чи вони ще є в HEAD, найбільші папки, файли, видалені з HEAD, які історія досі тримає, і підсумки з тим, що звільнило б видалення лише історичної частини (оцінка: лише після очищення та gc). Те, що воно показує, прибирається через `rewrite preview --remove-paths PATH` або `--remove-blobs-over BYTES`. Лише читає"
"rewrite analyze --all_local" = "Аналізувати всі локальні гілки й теги замість поточної гілки"
"rewrite analyze --refs" = "Аналізувати лише ці локальні гілки або теги (можна повторювати)"
"rewrite analyze --since" = "З поточною гілкою: лише коміти після цієї ревізії"
"rewrite analyze --top" = "Рядків у кожному списку (типово 50, не більше 5000)"
"rewrite check-signing" = "Один раз підписує пробні дані налаштуванням підпису репозиторію (`gpg.format`, `user.signingkey`, `gpg.*.program`) і перевіряє підпис - димова перевірка перед запуском, що підписує знову (`--signatures resign-signed` або `resign-all`). Виводить програму, чи працює вона й скільки тривав один підпис (помножте на кількість комітів для оцінки). Може відкрити запит парольної фрази. Код виходу 2, якщо не працює, з причиною (`tool_missing` або `signing_failed`)"
"rewrite preview --remove_signatures" = "Правило підписів: прибрати підпис кожного коміту в області, навіть де більше нічого не змінюється. Для цих комітів відповідь `--signatures` не потрібна"
"rewrite preview --fix_message_encoding" = "Правило повідомлень: перекодувати повідомлення комітів у UTF-8. Повідомлення із заголовком `encoding` (ISO-8859-1, Shift_JIS...) декодується, а заголовок зникає; UTF-8, колись прочитане як Latin-1 чи Windows-1252 («RÃ©Ã©criture»), виправляється лише тоді, коли круговий перехід точний. Те, що не вдається визначити, лишається як є й підраховується (`encoding_left`)"
"rewrite preview --fix_name_encoding" = "З `--fix-message-encoding`: виправити також зіпсовані імена автора й комітера (імена коміту, чий заголовок зникає, завжди декодуються разом із ним)"
"rewrite run --remove_signatures" = "Правило підписів: прибрати підпис кожного коміту в області, навіть де більше нічого не змінюється. Для цих комітів відповідь `--signatures` не потрібна"
"rewrite run --fix_message_encoding" = "Правило повідомлень: перекодувати повідомлення комітів у UTF-8. Повідомлення із заголовком `encoding` (ISO-8859-1, Shift_JIS...) декодується, а заголовок зникає; UTF-8, колись прочитане як Latin-1 чи Windows-1252 («RÃ©Ã©criture»), виправляється лише тоді, коли круговий перехід точний. Те, що не вдається визначити, лишається як є й підраховується (`encoding_left`)"
"rewrite run --fix_name_encoding" = "З `--fix-message-encoding`: виправити також зіпсовані імена автора й комітера (імена коміту, чий заголовок зникає, завжди декодуються разом із ним)"
"rewrite preview --map_trailers" = "З правилом особи: також замінювати трейлери з особою (`Name <email>` у `Signed-off-by`, `Co-authored-by`...), що збігаються, а не лише автора й комітера"
"rewrite preview --trailer_add" = "Правило трейлерів `KEY=VALUE`: додати цей трейлер до кожного повідомлення (можна повторювати; повідомлення, що вже має саме такий трейлер, не чіпається)"
"rewrite preview --trailer_map" = "Правило трейлерів `KEY:OLD=NEW`: замінити буквальний текст у значеннях трейлерів з цим ключем, наприклад `Signed-off-by:@old.org=@new.org` (можна повторювати)"
"rewrite preview --trailer_remove" = "Правило трейлерів: видалити кожен трейлер з цим ключем (можна повторювати)"
"rewrite preview --update_message_hashes" = "Замінити скорочені id комітів (7 і більше шістнадцяткових символів) у повідомленнях на нові id; неоднозначні чи невідомі лишаються й підраховуються"
"rewrite run --map_trailers" = "З правилом особи: також замінювати трейлери з особою (`Name <email>` у `Signed-off-by`, `Co-authored-by`...), що збігаються, а не лише автора й комітера"
"rewrite run --trailer_add" = "Правило трейлерів `KEY=VALUE`: додати цей трейлер до кожного повідомлення (можна повторювати; повідомлення, що вже має саме такий трейлер, не чіпається)"
"rewrite run --trailer_map" = "Правило трейлерів `KEY:OLD=NEW`: замінити буквальний текст у значеннях трейлерів з цим ключем, наприклад `Signed-off-by:@old.org=@new.org` (можна повторювати)"
"rewrite run --trailer_remove" = "Правило трейлерів: видалити кожен трейлер з цим ключем (можна повторювати)"
"rewrite run --update_message_hashes" = "Замінити скорочені id комітів (7 і більше шістнадцяткових символів) у повідомленнях на нові id; неоднозначні чи невідомі лишаються й підраховуються"
"ai trust" = "Прив'язує API-ключ профілю до адреси, для якої його збережено: показує, чому довіряють, або приймає поточну адресу профілю (після зміни його базового URL), сертифікат самостійно розміщеного сервера чи звичайний http. Виконує лише людина (це не інструмент агента)"
"ai trust --accept_certificate" = "Прийняти сертифікат із цим відбитком ключа (SHA-256, hex)"
"ai trust --accept_origin" = "Прийняти поточний базовий URL профілю (записаний точно так, як його вивела відмова)"
"ai trust --allow_insecure_http" = "Дозволити звичайний базовий URL `http://`, що не на цій машині"
"ai trust --profile" = "Id профілю ШІ"
"hosting integrations trust" = "Переглядає перевірку безпеки профілю й приймає те, що її зупинило: нову адресу, інший обліковий запис, новий сертифікат, звичайний http. Виконує лише людина (це не інструмент агента). Без параметрів виводить, чому довіряють і що зупинено"
"hosting integrations trust --accept_account" = "Прийняти цей id облікового запису як власника токена"
"hosting integrations trust --accept_certificate" = "Прийняти сертифікат із цим відбитком ключа (SHA-256, hex), точно так, як його вивела відмова"
"hosting integrations trust --accept_origin" = "Прийняти поточну адресу профілю (її треба записати точно так, як її вивела відмова)"
"hosting integrations trust --allow_insecure_http" = "Дозволити звичайну адресу `http://`, що не на цій машині"
"hosting integrations trust --id" = "Профіль"
"hosting integrations trust --strict_tls" = "Суворо тримати закріплений сертифікат: ключ має збігатися, навіть якщо сертифікат прив'язаний до публічного кореня"
repo-auth = "Яку ідентичність використовує цей репозиторій для автентифікації (HTTPS і SSH): власну ідентичність машини, обліковий запис GitPoulpi або файл ключа. `show` і `test` лише читають; `set` і `clear` - рішення людини"
"repo-auth clear" = "Забути профіль: репозиторій повертається до власної ідентичності машини. Може лише людина: агенту відмовляють"
"repo-auth set" = "Вибрати ідентичність, якою цей репозиторій автентифікується, окремо для кожного протоколу: `--https` для HTTPS remote, `--ssh` для SSH remote. Профіль зберігається в приватному каталозі GitPoulpi, ніколи в репозиторії. Задати його може лише людина: агенту відмовляють (код виходу 2)"
"repo-auth set --cache_minutes" = "З `token-command`: як довго його токен використовується повторно, у хвилинах"
"repo-auth set --use_for_hosting" = "With `token-command`: the same command also supplies the token of this repository's hosting API calls (issues, pull requests), in place of the personal token. For a GitHub App installation token"
"repo-auth set --command" = "З `--https token-command`: команда та її аргументи (перше слово - програма). Пишіть `--command` останнім: кожне слово після нього, включно з тими, що починаються з дефіса (`sh -c ...`), належить команді"
"repo-auth set --helper" = "З `--https helper`: команда помічника облікових даних. Людина підтверджує її разом із хешем (або передає `--yes`)"
"repo-auth set --hosts" = "З `helper` або `token-command`: хости, яким він може служити (через кому або повторюючи опцію)"
"repo-auth set --https" = "Ідентичність HTTPS: `system` (власні помічники git), `integration:<id>` (токен облікового запису GitPoulpi), `helper` (один помічник облікових даних, з `--helper`) або `token-command` (команда, що виводить токен, з `--command` і `--hosts`)"
"repo-auth set --ignore_repo_helpers" = "З `--https system`: відкинути помічників облікових даних, які репозиторій задає сам, і залишити системних та глобальних"
"repo-auth set --known_hosts" = "З `--ssh key:` або `integration-key:`: файл `known_hosts`"
"repo-auth set --ssh" = "Ідентичність SSH: `system` (власна конфігурація ssh і агент), `key:<path>` (файл приватного ключа, пропонується єдиним) або `integration-key:<id>` (ключ облікового запису GitPoulpi)"
"repo-auth set --strict" = "З `--ssh key:` або `integration-key:`: відхиляти невідомі ключі хостів (`StrictHostKeyChecking=yes`)"
"repo-auth set --username" = "Ім'я користувача: із `system` - `credential.username` (дає змогу менеджеру облікових даних вибрати один з кількох облікових записів); з `integration:<id>` - ім'я користувача, що надсилається разом із токеном"
"repo-auth set --yes" = "Підтвердити помічника або команду токена без інтерактивного запитання (команда та її хеш усе одно виводяться)"
"repo-auth show" = "Показати, якою ідентичністю цей репозиторій автентифікується: збережений профіль, ідентичність, яку використає кожен remote, налаштування, які профіль перевизначає, і будь-яке попередження. Ніколи не виводить секрет; помічник або команда токена виводяться лише людині (агент отримує `{set, sha256}`)"
"repo-auth test" = "Перевірити з'єднання кожного remote (або одного) із застосованим профілем, нічого не змінюючи: перелічує гілки remote або, з `--push`, запитує, чи буде прийнято push. Відповідь - звіт кожного remote та використана ідентичність. Звертається до мережі"
"repo-auth test --push" = "Також перевірити, чи буде прийнято push"
"repo-auth test --remote" = "Лише цей remote (типово: кожен remote)"
"apply-commit" = "Застосовує зміни, зроблені одним комітом (навіть втраченим), лише до робочого дерева: індекс і HEAD лишаються. Все або нічого: якщо файл не застосовується чисто, нічого не змінюється (`stash from-commit` натомість зберігає зміни як stash). Merge-коміт відхиляється. `undo` повертає все назад"
"apply-commit --commit" = "Коміт, зміни якого застосувати (будь-яка ревізія: sha, `HEAD~2`, ...)"
"stash from-commit" = "Зберігає зміни, зроблені одним комітом (навіть втраченим), як новий stash, не чіпаючи робочого дерева. `undo` знову його видаляє"
"stash from-commit --commit" = "Коміт, зміни якого зберегти (будь-яка ревізія: sha, `HEAD~2`, ...)"
"stash from-commit --message" = "Повідомлення stash; якщо не вказано, повідомлення з назвою коміту"
"branch upstream" = "Кілька remote однієї гілки: основний upstream, додаткові цілі push і підключувані джерела pull; зберігаються в її власній секції конфігурації"
"branch upstream add" = "Додає `<remote>[:<dst>]` як додаткову ціль push (`<dst>` - назва гілки на цьому remote, типово та сама). Можна скасувати"
"branch upstream add --branch" = "Гілка (типово поточна)"
"branch upstream add --pull" = "Зробити його також джерелом pull"
"branch upstream add --target" = "`<remote>` або `<remote>:<dst>`"
"branch upstream list" = "Основний upstream гілки, її додаткові цілі push і джерела pull, кожне з поточним станом (попереду, позаду, співвідношення) за remote-tracking ref'ами як вони є. Лише читання, без мережі"
"branch upstream list --branch" = "Гілка (типово поточна)"
"branch upstream primary" = "Задає основний upstream (`origin/main`): той самий запит, що й `branch set-upstream`"
"branch upstream primary --branch" = "Гілка (типово поточна)"
"branch upstream pull" = "Вмикає або вимикає `<remote>[:<dst>]` як джерело pull: звичайний pull тоді інтегрує й його"
"branch upstream pull --branch" = "Гілка (типово поточна)"
"branch upstream pull --off" = "Перестати отримувати з нього"
"branch upstream pull --on" = "Зробити його джерелом pull"
"branch upstream pull --target" = "`<remote>` або `<remote>:<branch>`"
"branch upstream remove" = "Прибирає всі додаткові цілі push і джерела pull з назвою `<remote>`. Основний upstream не чіпає (для нього є `unset-upstream`). Можна скасувати"
"branch upstream remove --branch" = "Гілка (типово поточна)"
"remote-group" = "Гілка з кількома remote (додаткові цілі push, джерела pull): де вона стоїть відносно кожного. Змінювати їх - `branch upstream`"
"remote-group status" = "Де поточна гілка (або `--branch`) стоїть відносно кожного зі своїх remote: основний upstream, додаткові цілі push, джерела pull. Лише читання, без мережі"
"remote-group status --branch" = "Гілка (типово поточна)"
"pull --all_sources" = "Pull основного upstream і кожного джерела pull гілки (див. `branch upstream pull`), кожного з `--mode`. Спершу складає план: усе, крім fast-forward чи власної інтеграції режиму, вимагає `--resolve` (код виходу 3, нічого не змінено). Зупинка на конфліктах завершується з кодом 4 і `stopped`; продовжити - `remote-group continue`"
"pull --branch" = "З `--all-sources`: гілка (типово поточна)"
"pull --no_preflight" = "З `--all-sources`: не опитувати remote заздалегідь"
"pull --resolve" = "З `--all-sources`: `REMOTE=ff|merge|rebase|skip` (можна повторювати), рішення для remote, про який спитав план"
"push --all_targets" = "Push на основний upstream і кожну додаткову ціль push гілки (див. `branch upstream add`). Спершу складає план: коли кожен remote - звичайний push або вже актуальний, виконує; інакше відповідає `needs_resolution` (код виходу 3, нічого не змінено). Код 4: якийсь remote завершився помилкою або merge зупинився на конфліктах (`stopped`)"
"push --no_preflight" = "Не опитувати remote заздалегідь (використати remote-tracking ref'и)"
"push --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (можна повторювати): рішення для remote, про який спитав план"
"push --tags" = "Також push ненадісланих тегів на кожен remote, що прийняв гілку"
"push --to" = "Push рівно на ці remote (`<remote>` або `<remote>:<dst>`, можна повторювати) лише для цього push; конфігурацію не змінює. Той самий план, `--resolve` і виконання, що й `--all-targets`"
"push --yes" = "Підтверджує force push, обраний через `--resolve REMOTE=force`. Без цього такий push нічого не змінює й завершується з кодом 3"
"remote-group abort" = "Відкидає збережений груповий запуск: скасовує merge або rebase, який він почав. Уже виконані push залишаються"
"remote-group abort --run" = "Ідентифікатор збереженого запуску, щоб переконатися, що це саме той"
"remote-group continue" = "Відновлює збережений груповий запуск після завершення його merge або rebase (ніколи не автоматично). На `needs_resolution` відповідає через `--resolve`"
"remote-group continue --branch" = "Гілка (типово поточна); читається лише з `--resolve`"
"remote-group continue --resolve" = "`REMOTE=push|ff|merge|rebase|force|skip` (можна повторювати): рішення для remote, про який спитала попередня відповідь"
"remote-group continue --run" = "Ідентифікатор збереженого запуску, щоб переконатися, що це саме той"
"remote-group continue --yes" = "Підтверджує force push, названі в `--resolve`"
"remote-group plan" = "Що зробив би груповий push (або, з `--pull`, груповий pull), remote за remote: де кожен стоїть, запропонована дія та інші дозволені. Опитує remote (`ls-remote`, fetch тих, чий кінчик невідомий), якщо немає `--no-preflight`; нічого не змінює"
"remote-group plan --branch" = "Гілка (типово поточна)"
"remote-group plan --no_preflight" = "Не опитувати remote: використати remote-tracking ref'и як вони є"
"remote-group plan --pull" = "Спланувати груповий pull (основний і джерела pull)"
"remote-group plan --to" = "Спланувати push рівно на ці remote (`<remote>` або `<remote>:<dst>`, можна повторювати) замість налаштованих цілей"
"remote-group retry" = "Знову виконує цілі збереженого запуску, що завершилися помилкою, були скасовані посеред push або їх так і не пробували"
"remote-group retry --run" = "Ідентифікатор збереженого запуску, щоб переконатися, що це саме той"
