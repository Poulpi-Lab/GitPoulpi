"index-lock remove" = "Видаляє застарілий `index.lock` (залишений завершеною командою git). Відмова, поки йому менше 10 с або якщо його немає. Видаляється лише файл блокування; переконайтеся, що жодна команда git не виконується"
"index-lock show" = "`index.lock` репозиторію (`null`, якщо його немає): шлях, вік у секундах і чи він застарів (старший за 10 с)"
"job" = "Фонові завдання демона: кожен fetch, push, pull, clone і передавання LFS стає завданням із моменту отримання. `list` показує їх, `cancel` зупиняє одне, `wait` чекає завершення одного. Ctrl+C у команди, що запустила завдання, скасовує його"
"job list" = "Завдання демона цього сеансу, від найстаріших: виконувані, у черзі за іншим і завершені за останні 30 секунд"
"job cancel" = "Зупиняє завдання. Відмова (код виходу 1, нічого не змінюється) після точки, де зупинка безпечна, наприклад pull, що почав злиття. Скасований push міг уже дійти до віддаленого репозиторію"
"job cancel --id" = "Ідентифікатор завдання з `job list`"
"job wait" = "Чекає завершення завдання і друкує його підсумковий стан. Код виходу 0 для `Done`, 1 при збої або скасуванні"
"job wait --id" = "Ідентифікатор завдання з `job list`"
"job wait --timeout" = "Здається через стільки секунд (код виходу 1, завдання триває). Не вказано: чекати скільки потрібно"
"undo-forget" = "Прибирає з журналу скасування заблокований верхній запис (перервана операція або репозиторій відтоді змінився), щоб можна було скасувати записи під нею. Ніколи не торкається репозиторію, лише журналу; запис більше не можна ні скасувати, ні повторити. Код виходу 2, якщо верхній запис не заблокований, 3 без `--yes`"
"undo-forget --dry_run" = "Показує, що було б прибрано, нічого не змінюючи"
"undo-forget --expect" = "Забуває, лише якщо це досі верхній запис (його id, як показує `undo --list`); інакше відмова як застарілого"
"undo-forget --redo" = "Забуває верхній запис повтору замість запису скасування"
"undo-forget --yes" = "Підтверджує. Без цього нічого не змінюється, код виходу 3"
"clone --sparse" = "Частковий checkout: робить checkout лише цих каталогів (плюс файли в корені); уся історія все одно завантажується"
sparse-checkout = "Частковий checkout (режим cone): залишає в робочому дереві великого репозиторію лише деякі каталоги. `gitpoulpi clone --sparse` запускає його"
"sparse-checkout add" = "Показує також ці каталоги, зберігаючи вже показані"
"sparse-checkout disable" = "Знову робить checkout усіх файлів (повний checkout)"
"sparse-checkout set" = "Показує рівно ці каталоги (плюс файли в корені репозиторію); усі інші зникають із робочого дерева. Вмикає частковий checkout, якщо він вимкнений. Історію не змінює"
"sparse-checkout set --dirs" = "Каталоги відносно кореня репозиторію, наприклад `src docs/guide`"
"sparse-checkout status" = "Чи є робоче дерево частковим checkout і які каталоги воно показує: `{ \"enabled\", \"cone\", \"dirs\" }`"
"diff --from" = "Порівнює починаючи з цієї ревізії (старіший кінець) замість робочого дерева з індексом. Використовується разом із `--to`"
"diff --name_only" = "Виводить лише змінені файли та їхній стан, без блоків змін"
"diff --to" = "Інший кінець для `--from`: ревізія або `worktree` (за замовчуванням) для робочого дерева, із проіндексованими й непроіндексованими змінами відстежуваних файлів. «Порівняти вибране» в Log показує ті самі файли"
"file-history" = "Коміти, що змінювали файл, від нових до старих, з урахуванням перейменувань (шлях у кожному коміті, вид зміни та кількість рядків)"
"file-history --at" = "Ревізія, з якої почати (типово: HEAD)"
"file-history --limit" = "Записів на сторінку; `more` у відповіді показує, чи є старіші"
"file-history --skip" = "Скільки записів пропустити (сторінка n це `--skip <n*limit> --limit <limit>`)"
"lost-commits" = "Коміти, до яких не веде жодна гілка, тег, remote чи схованка: те, що залишила видалена гілка (названа reflog'ом або втримана лише закріпленням скасування), а без `--no-deep` ще й висячі коміти бази об'єктів. Найновіші першими. Створіть гілку на одному з них, щоб його повернути"
"lost-commits --budget_ms" = "Припинити сканування після стількох мілісекунд (0: без обмежень); тоді у відповіді буде `partial`"
"lost-commits --limit" = "Скільки комітів перелічити"
"lost-commits --no_deep" = "Лише коміти, які ще називає reflog або закріплення скасування (швидко за будь-якого розміру)"
"lost-commits --skip" = "Скільки комітів пропустити"
"reflog" = "Перелічує reflog, найновіші першими: де раніше були `HEAD` чи гілка, з датою та причиною від git, зокрема переміщення з оболонки. У видаленої гілки reflog не лишається. Також записується як `reflog restore` для `reflog-restore`"
"reflog --limit" = "Скільки записів перелічити"
"reflog --ref" = "`HEAD` (типово) або гілка (чи повна назва ref)"
"reflog --skip" = "Скільки записів пропустити"
"reflog-restore" = "Переміщує гілку (або `HEAD`) на позицію з її reflog. Гілка, на якій ви не перебуваєте, просто переміщується. Для поточної гілки робоче дерево лишається в безпеці: за наявності незакомічених змін команда відмовляє, якщо не задано `--mode`. Один запис журналу: `undo` його скасовує. Також записується як `gitpoulpi reflog restore`"
"reflog-restore --dry_run" = "Показати, що станеться, і нічого не змінювати"
"reflog-restore --mode" = "За наявності незакомічених змін: `keep` переміщує й зберігає їх (відмовляє, якщо щось заважає), `soft`, `mixed` і `hard` - режими reset"
"reflog-restore --oid" = "Коміт, на який переміщувати (поле `new` запису reflog)"
"reflog-restore --ref" = "`HEAD` або гілка"
"undo-restore" = "«Відновити лише це»: повертає те, що видалила одна з попередніх операцій (видалену гілку чи тег, відкинуту схованку, відкинутий або видалений файл, вилучений remote, рядок ignore), не скасовуючи наступних операцій. Відновлення - новий запис журналу, тож `undo` його скасовує. Нічого не перезаписується: файл, що відтоді змінився, отримує збережену версію поруч як `<name>.restored`; reset, amend або rebase повертаються як нова гілка на старій верхівці. Також записується як `gitpoulpi undo restore <id>`. Код виходу 2, коли це неможливо (JSON називає причину)"
"undo-restore --dry_run" = "Показати, що станеться, і нічого не змінювати"
"undo-restore --id" = "Запис для відновлення, як показує його id `undo --list`"
"undo-restore --name" = "Відновити гілку чи тег під цією назвою (коли стара назва зайнята або для гілки, яку відновлюють reset/amend/rebase)"
"commit --workspace" = "Робити коміт від імені типового профілю цього робочого простору (id робочого простору; також `GITPOULPI_WORKSPACE`). Діє, коли репозиторій входить до робочого простору, а той називає наявний профіль; інакше `general.active_profile`; інакше особа з власної git-конфігурації репозиторію. Без цього параметра діє саме остання"
"search" = "Нечіткий пошук за гілками, тегами, worktrees, stash'ами та повідомленнями комітів поточного репозиторію або всіх репозиторіїв робочого простору, а також за кешованими запитами на злиття та issues. Збіги йдуть від найкращого, із символами, що збіглися. Префікс звужує пошук: `b:` гілки, `t:` теги, `c:` коміти, `s:` stash'і, `w:` worktrees, `pr:` запити на злиття, `i:` issues, `r:` репозиторії (лише для робочого простору)"
