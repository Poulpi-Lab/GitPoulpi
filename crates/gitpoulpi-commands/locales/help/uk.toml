"flow" = "Робочі процеси гілок (git-flow, GitHub Flow, GitLab Flow, trunk-based або власний): які гілки є довгоживучими базами, які - тематичними гілками якого типу, їхні батьківські гілки і наскільки вони від них відстали. `status`, `templates`, `detect` і `config` читають; `config init` та `import` виводять файл робочого процесу і створюють його лише з `--write`. `start`, `finish`, `sync`, `promote` і `set-parent` діють: кожна виводить кроки, які виконає (`--dry-run` виводить їх як JSON і зупиняється), для виконання потребує `--yes` і є одним записом, який можна скасувати (merge request чи push скасувати не можна)"
