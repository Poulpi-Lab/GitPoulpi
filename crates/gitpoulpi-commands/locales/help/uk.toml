"repo-config show" = "Показує локальне для репозиторію значення одного ключа (`core.autocrlf` або `core.eol`) або обох; null означає «не задано» (діє глобальне значення)"
"repo-config show --key" = "`core.autocrlf` або `core.eol`; обидва, якщо не вказано"
