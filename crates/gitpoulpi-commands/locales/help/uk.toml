treat = "Змушує git вважати файли двійковими або текстовими, записуючи правило `.gitattributes` (`binary` або `text diff`) для шляхів: за замовчуванням файл у корені репозиторію, `--file` для файлу теки або `.git/info/attributes` (лише цей клон). Правило, що вже називає той самий шаблон, переписується, а не суперечить. Відповідь каже, чи git справді тепер так вважає шляхи (`effective`). Скасовується через `gitpoulpi undo`, крім `.git/info/attributes`"
"treat --kind" = "Чим git має вважати шляхи"
"treat --paths" = "Шляхи відносно репозиторію (теки з `--folder`)"
"treat --extension" = "Називає всі файли з розширенням кожного шляху (`*.ext`) замість самого файлу"
"treat --folder" = "Шляхи - теки: правило охоплює все всередині них"
"treat --file" = "`.gitattributes` відносно репозиторію для запису або `.git/info/attributes` (за замовчуванням: `.gitattributes` у корені)"
convert = "Переписує кодування, закінчення рядків або відступи файлів робочого каталогу функціями редактора TUI та його меню «Перетворити». Рівно один з параметрів `--encoding`, `--eol` і `--indent`. Двійкові, відсутні файли та файли, які цільове кодування не може подати, пропускаються й зазначаються у звіті, але не псуються. Один запис журналу на всю партію: `gitpoulpi undo` повертає всі файли"
"convert --paths" = "Файли для перетворення, шляхи відносно репозиторію"
"convert --encoding" = "Цільове кодування в написанні редактора (`UTF-8`, `UTF-8 BOM`, `UTF-16 LE`, `Windows-1252`, `ISO-8859-1`, `Shift_JIS`, ...)"
"convert --eol" = "Цільове закінчення рядків"
"convert --indent" = "Початкові пробіли як `spaces:<n>` (пробіли) або `tabs:<n>` (табуляції), `<n>` - ширина табуляції (1-8)"
ui = "Показує речі користувачеві у його відкритому вікні GitPoulpi: коміт, diff на рядку, файл, сторінку налаштувань. Лише перегляд: нічого тут не змінює репозиторій і не вводить у вікно, окрім `ui propose`, що відкриває наперед заповнений діалог для підтвердження користувачем (вимкнено, доки не `[mcp] allow_ui_propose = true`). Потрібен відкритий TUI GitPoulpi у сесії"
"ui --launch" = "Коли ніде не відкрито вікна, відкрити його налаштованою командою запуску (`[ui] launch` / `launch_command`; типово вимкнено) і чекати до 10 с, поки воно під'єднається. Без цього прапора вікно запускається, лише коли задано `[ui] launch` І `ui_control` має значення `auto`"
"ui --viewer" = "Надіслати в це вікно (`ui viewers` їх перелічує) замість вибору демоном"
"ui back" = "Скасовує останню зміну вигляду від агента (відновлює попередній вигляд)"
"ui highlight" = "Підсвічує діапазон рядків у diff чи файлі, відкритому у вікні"
"ui highlight --no_scroll" = "Не прокручувати діапазон у видиму область"
"ui highlight --range" = "`A-B` або `A:C-B:C` зі стовпцями (нумерація з 1)"
"ui notify" = "Показує користувачеві коротке повідомлення-toast"
"ui notify --message" = "Не більше 200 символів; керівні символи вилучаються"
"ui propose" = """Пропонує зміну для підтвердження користувачем: відкривається наперед заповнений діалог із позначкою «Proposed by», і нічого не відбувається, доки користувач не натисне його власне підтвердження. Потрібен `[mcp] allow_ui_propose = true`. Слідкуйте за id `proposal` з відповіді в `proposals` команди `ui state`"""
"ui propose branch" = "Відкриває поле Нова гілка із заповненою назвою"
"ui propose branch --start_point" = "Звідки починається гілка (типово: HEAD)"
"ui propose commit-message" = "Заповнює Summary і Description композера комітів; ніколи не комітить"
"ui propose resolution" = "Відкриває редактор злиття на файлі з конфліктом із уже готовим вирішенням, щоб користувач переглянув і підтвердив його через Save & Mark Resolved (його Ctrl+S - єдине підтвердження; нічого тут не записується й не додається в індекс). Вкажіть вибір через `--pick` або весь файл через `--content-file`"
"ui propose resolution --content_file" = "Остаточний текст файлу, точно (`-` читає стандартний ввід)"
"ui propose resolution --path" = "Шлях файлу з конфліктом відносно репозиторію"
"ui propose resolution --pick" = "Вибір для кожного номера конфлікту: `1=a,2=b,3=ab,4=ba,5=none` (a = поточне, b = вхідне, ab / ba = обидва в такому порядку)"
"ui propose resolution --pick_default" = "З `--pick`: вибір для кожного конфлікту, якого немає в переліку"
"ui propose reword" = "Відкриває вікно Reword над комітом із заповненим новим повідомленням"
"ui propose rewrite" = "Відкриває майстерню переписування історії з уже готовим рецептом, щоб користувач переглянув і застосував його; сам нічого не переписує, не очищає й не надсилає. Рецепт має щонайбільше 50 правил і не містить скрипта, а секретні значення з нього прибираються"
"ui propose rewrite --recipe" = "Рецепт (TOML або JSON, як його приймає `rewrite preview --recipe`) зі шляху до файлу або `-` для stdin"
"ui propose reword --message" = "Запропоноване повідомлення: підсумок, порожній рядок, тіло"
"ui propose reword --rev" = "Коміт (на поточній гілці)"
"ui propose split" = "Відкриває редактор розділення над комітом, заповнений планом, який користувач переглядає, змінює й застосовує; сам нічого не розділяє"
"ui propose split --plan" = "План (JSON) зі шляху до файлу або `-` для stdin, у вигляді, який приймає `split-commit --plan`"
"ui propose split --rev" = "Коміт для розділення (на поточній гілці)"
