"tag list --unpushed" = "Лише теги, яких, наскільки відомо, не має жоден remote"
"tag push" = "Надсилає теги на remote. Без назв надсилає кожен тег, якого, наскільки відомо, не має жоден remote - один push, а не по одному на тег"
"tag push --names" = "Теги для надсилання. Пропустіть, щоб надіслати кожен ненадісланий тег"
