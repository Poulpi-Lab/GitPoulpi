"tag annotate" = "Замінює наявний тег анотованим, на місці. Тег лишає коміт, на який уже вказує"
"tag create --message" = "Створити *анотований* тег із цим повідомленням замість легковагового - `git tag -a -m`"
"tag delete" = "Видаляє тег. Типово лише локальний (`--local`): якщо тег є й на remote, наступний `fetch` поверне його, про що й повідомляє відповідь. `--remote <R>` видаляє його лише на цьому remote (дія назовні: інші люди його втрачають), `--both` видаляє тут і на remote, що його має (`--both --remote <R>` називає один)"
