ai = "Помічники ШІ (вимкнено, доки не `ai.enabled = true`): виводять згенероване повідомлення коміту або пояснюють коміт чи робочі зміни"
"ai --print_sent" = "Виводить, що було б надіслано моделі (системний і користувацький текст після заміни секретів і виключення чутливих файлів), і нічого не надсилає. Потрібен `ai.enabled = true`, але не потрібні ні ключ, ні мережа"
"ai --send_all" = "Надіслати кожен вхід повністю, навіть понад його ліміт `ai.limits.*`. Без цього вхід понад ліміт обрізається (конфлікт відхиляється), а у відповіді сказано, що відрізано, у `truncated: [{part, detail?, bytes, limit, setting}]`"
"commit --send_all" = "З `--ai`: надіслати всю різницю, навіть якщо вона перевищує `ai.limits.diff_bytes`. Без цього більша різниця обрізається, і відповідь повідомляє про це (`truncated`)"
"hosting review suggest --send_all" = "Надіслати кожен вхід повністю, навіть понад його ліміт `ai.limits.*` (різницю, різницю файлу, опис, наявні коментарі, файли контексту). Без цього вхід понад ліміт обрізається, а у відповіді сказано, що відрізано, у `truncated`"
"stash push --send_all" = "З `--ai`: надіслати всю різницю, навіть якщо вона перевищує `ai.limits.diff_bytes`. Без цього більша різниця обрізається, і відповідь повідомляє про це (`truncated`)"
"ai commit-message" = "Виводить повідомлення коміту, яке ШІ пропонує для змін в індексі (або для всіх змін, якщо в індексі нічого немає). Нічого не комітить"
"ai explain" = "Пояснює коміт (типово HEAD) або, з --wip, робочі зміни"
"ai resolve-conflict" = "Виводить вирішення, яке ШІ пропонує для ОДНОГО конфлікту злиття у файлі з конфліктом (`--conflict N`, нумерація з 1; необов'язково, якщо в файлі один конфлікт). Лише виводить: нічого не записується й не додається в індекс, тож рішення за викликачем (`conflicts resolve --content-file` застосовує результат для всього файлу). Потрібен `ai.enabled = true`"
"ai resolve-conflict --conflict" = "Який конфлікт файлу, нумерація з 1"
"ai resolve-conflict --path" = "Файл із конфліктом, відносно кореня репозиторію"
autostash = "Auto-stash, що очікує: GitPoulpi відклав локальні зміни, щоб виконати checkout, merge, rebase або pull, і ще не повернув їх"
"ai review-context" = "Показує або задає, що ✦ чернетка рев'ю коду отримує крім diff (`[ai.review]`): CLAUDE.md і AGENTS.md репозиторію, ще один файл (шлях або посилання) і чи працює локальний агент у репозиторії. Без `--repo` і `--project` це глобальне типове значення; `--repo PATH` - власне значення одного клонованого репозиторію, `--project HOST/PROJECT` - значення репозиторію, який не клоновано. Без прапорця налаштування виводить значення (`effective` - те, що отримує рев'ю); з ним зберігає й виводить результат. Модель не потрібна, працює й при вимкненому ШІ"
"ai review-context --agents_md" = "Передати моделі AGENTS.md репозиторію"
"ai review-context --claude_md" = "Передати моделі CLAUDE.md репозиторію"
"ai review-context --context_file" = "Ще один файл: шлях відносно кореня репозиторію, абсолютний шлях або посилання на файл хостингу коду"
"ai review-context --no_context_file" = "Без додаткового файлу"
"ai review-context --no_extra_file" = "Без додаткового файлу для репозиторію чи проєкту, що б не казало глобальне значення (`on`, типово, якщо вказано без значення); `off` знову підпорядковує його глобальному значенню"
"ai review-context --project" = "Репозиторій, який не клоновано, у вигляді `HOST/PROJECT` (`github.com/owner/name`)"
"ai review-context --reset" = "З `--repo` або `--project`: забути власні значення репозиторію (він знову слідує за глобальними) перед застосуванням прапорців"
"ai review-context --run_in_repo" = "Запускати локального агента в репозиторії (`yes`), не в ньому (`no`) або як каже його профіль ШІ (`profile`). Не для `--project`"
"autostash start-over" = "Почати спочатку: відкидає зміни в робочому дереві для файлів stash (копія лишається в `refs/gitpoulpi-backup/`), скасовує операцію, що створила auto-stash (pull, checkout, merge, rebase), потім робить pop stash на початковому коміті. Зупиняється з незайманим stash, якщо якийсь крок не вдався. Код виходу 1 при відмові, 3 коли потрібен `--yes`"
"autostash start-over --dry_run" = "Показати, що станеться, і нічого не змінювати"
"autostash start-over --yes" = "Виконати; без цього нічого не змінюється, а код виходу дорівнює 3"
blame = "Авторство кожного рядка файлу на певній ревізії"
"blame --at" = "Ревізія для blame (типово: HEAD)"
"branch delete-remote" = "Видаляє гілку з remote, лишаючи локальну гілку з такою назвою"
"branch fast-forward" = "Посуває `<branch>` вперед до `<target>`, лише якщо це fast-forward (розбіжну історію відхиляє, нічого не рухається). Поточна гілка тягне за собою робоче дерево, як `git merge --ff-only`; в інших гілок просто пересувається ref"
"branch fast-forward --target" = "Будь-яка ревізія (типово: HEAD)"
"branch set-upstream" = "Робить так, щоб `<branch>` відстежувала `<upstream>` (`origin/main`)"
"branch track" = "Створює локальну гілку, що відстежує гілку віддаленого відстеження, і переходить на неї. `<upstream>` записується так, як його показує список refs (`origin/feature/login`); `--name` типово - частина з назвою гілки"
"branch unset-upstream" = "Прибирає upstream у `<branch>`"
"checkout --autostash" = 'Ховає локальні зміни, що блокують це, виконує дію, потім робить pop схованки (те саме, що `general.auto_stash = "always"`)'
"cherry-pick --commits" = "Коміти для застосування, по порядку. Не вказуються, якщо задано `--plan`"
"cherry-pick --plan" = "JSON `Vec<RebaseStep>` (така ж форма, як у `rebase --plan`; див. `rebase-plan`), зі шляху до файлу або `-` для stdin: кроки виконуються cherry-pick у порядку списку. Тут мають сенс лише дії `Pick` і `Drop` (`Drop` пропускає коміт); будь-яка інша дія відхиляється. Не можна поєднувати з позиційними комітами"
"clone --branch" = "Перейти на цю гілку замість типового HEAD remote"
"clone --depth" = "Обрізати історію до цієї кількості комітів (`git clone --depth`)"
"clone --no_lfs" = "Лишити файли Git LFS вказівниками, не завантажуючи їхній вміст після клонування"
"clone --origin" = "Назвати новий remote інакше, ніж `origin`"
"clone --recurse_submodules" = "Клонувати також підмодулі"
"commit --ai" = "Дозволити ШІ написати повідомлення за різницею в індексі, використовуючи інструкції до повідомлень комітів репозиторію (Налаштування > ШІ). Потрібні `ai.enabled = true` і налаштований профіль"
"commit --message" = "Повідомлення коміту. Обов'язкове, якщо його не пише --ai"
"commit --no_verify" = "Пропускає хуки коміту (`pre-commit`, `commit-msg`), як `commit --no-verify`"
completions = "Виводить у stdout скрипт автодоповнення оболонки (bash, zsh, fish, powershell або elvish), напр. `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "Скасовує поточну операцію: HEAD, індекс і робоче дерево повертаються до стану до неї. Відкидає вирішення, зроблені відтоді"
"conflicts skip" = "Пропускає поточний cherry-pick або revert (або коміт, на якому зупинився rebase): HEAD, індекс і робоче дерево повертаються до HEAD. Вихід, коли він став порожнім (зміну вже застосовано). У merge нічого пропускати"
"conflicts check" = "Чи призведе злиття HEAD у гілку, від якої він відгалузився, до конфлікту, і в яких файлах? Нічого не змінюється (злиття в пам'яті). Основа - ціль відомого запиту на злиття цієї гілки, інакше гілка, дозволена шаблонами «Базові гілки», з найменшою кількістю комітів після відгалуження. `{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`. Вимкнено, коли вимкнено `general.conflict_detection` або перемикач репозиторію"
"conflicts list" = "Файли з конфліктами, кожен із текстом трьох сторін. З `--names-only`: лише шлях, вид конфлікту та oid stages (жоден blob не читається; дешево для великого merge)"
"conflicts resolve" = 'Вирішує один файл і додає його в індекс (файл перестає бути конфліктним). Рівно один із `--side/--ours/--theirs`, `--both`, `--pick`, `--content-file` або `--delete`. A та "ours" - поточна сторона (`HEAD`; під час rebase - гілка, на яку перебазують), B та "theirs" - вхідна. Ніколи не редагуйте маркери конфлікту вручну: оберіть або запишіть остаточний текст у файл'
"conflicts resolve --both" = "Лишити обидві сторони кожного конфлікту (A, потім B), а скрізь інде - власний merge git"
"conflicts resolve --content_file" = "Остаточний текст файлу, точно (`-` читає стандартний ввід)"
"conflicts resolve --delete" = "Прийняти видалення: видалити файл (`git rm`)"
"conflicts resolve --encoding" = "З `--content-file`: записати текст у цьому кодуванні (мітка WHATWG, напр. `windows-1252`) замість UTF-8"
"conflicts resolve --expect" = "oid stages, відносно яких приймалося рішення, `base,ours,theirs` (`-` для відсутнього stage). Виклик відхиляється як `stale`, якщо індекс уже містить не точно їх. `--both` і `--pick` завжди перевіряють stages, які читають"
"conflicts resolve --no_stage" = "Записати файл робочого дерева, але лишити його конфліктним (звичайне збереження)"
"conflicts resolve --ours" = "Те саме, що `--side ours`"
"conflicts resolve --pick" = "Вибір для кожного номера конфлікту: `1=a,2=b,3=ab,4=ba,5=none` (a = ours, b = theirs, ab / ba = обидва в такому порядку). Кожен конфлікт потребує вибору, якщо `--default` не покриває решту"
"conflicts resolve --pick_default" = "З `--pick`: вибір для кожного конфлікту, якого немає в переліку"
"conflicts resolve --side" = "Взяти весь файл з одного stage, без автозлиття"
"conflicts resolve --theirs" = "Те саме, що `--side theirs`"
"conflicts resolve --theirs_first" = "З `--both`: B, потім A"
"conflicts show" = "Один файл із конфліктом так, як його бачить редактор злиття: підписи панелей, три сторони й пронумеровані області конфліктів (`--json` - повний документ). Злиті області, які git вирішив сам, не перелічуються; вони лишаються в результаті `resolve --both`/`--pick`"
"conflicts show --conflict" = "Лише конфлікт N (нумерація з 1)"
"conflicts state" = "Поточний merge, rebase, cherry-pick чи revert (`null`, якщо немає)"
"conflicts unresolve" = "Повертає файл, вирішений під час цієї операції, у стан конфлікту (знову з маркерами). Відхиляється, якщо файл ще в конфлікті або не був вирішений, поки операція тривала"
daemon = '`gitpoulpi server ...` - видимий псевдонім - власник називає цю групу «сервером» і вводить `gp server stop`'
"daemon restart" = "`daemon stop`, а потім `daemon start`"
"daemon run" = "Запускає демон цієї сесії на передньому плані (блокує; Ctrl-C для зупинки або `daemon stop`/`daemon restart`, надіслані звідкись ще). Це те, що `daemon start` запускає відокремлено, і що також можна запустити напряму з окремого терміналу"
"daemon start" = "Запускає демон цієї сесії як відокремлений фоновий процес (або повідомляє, що він уже працює). `--backend` закріплює бекенд, який має використовувати запущений процес; без нього запущений процес сам визначає `general.default_backend`"
"daemon status" = "Чи слухає демон цієї сесії, і якщо так - його порт, PID, час роботи, бекенд і версію збірки"
"daemon stop" = "Просить демон цієї сесії коректно завершитися, а до примусового завершення за записаним PID переходить лише якщо він не відповів вчасно й лише якщо це самостійний демон (ніколи не вбудований у працюючий TUI)"
"daemon stop --all" = "Зупинити демон кожної сесії, для якої `session list` повідомляє файл порту, а не лише цієї"
discard = "Відкидає *неіндексовані* зміни файлу в робочому дереві: один hunk (`--hunk`), кілька його рядків (`--hunk --lines`) або - із самим `--file` - усі незакомічені зміни файлу, у тому числі в індексі (невідстежуваний файл видаляється). Hunks і рядки нумеруються так, як `gitpoulpi diff --json` нумерує неіндексований diff. Усе відкинуте зберігається в страховому знімку, тож `gitpoulpi undo` повертає це (невідстежувані файли включно). Без підтвердження: це інтерфейс для скриптів"
"discard --lines" = "Індекси рядків через кому в межах `--hunk`"
"fetch --all" = "Fetch кожного налаштованого remote"
"fetch --prune" = "Прибрати гілки віддаленого відстеження, яких remote більше не має"
"fetch --prune_tags" = "Також видаляти локальні теги, які видалив remote (лише ті, що були на ньому: тег, якого ви ніколи не надсилали, лишається). Вужчий аналог `fetch.pruneTags` у git; без запиту вимкнено"
"fetch --remote" = "Якщо не вказано: типовий remote репозиторію (див. `remote default`)"
gitpoulpi = "Легкий кросплатформний TUI-клієнт Git зі скриптуванням через CLI/MCP."
"gitpoulpi --add" = "Відкриває теку новою вкладкою вже запущеного GitPoulpi замість запуску ще одного (`gp -a`, `gp --add ../інша`). PATH за замовчуванням - поточна тека, вона зводиться до репозиторію, що її містить. Одна запущена сесія: вона отримує вкладку, а її вікно виходить на передній план, якщо стільниця це дозволяє. Кілька: ви обираєте одну з нумерованого списку (або вказуєте `--session ІМ'Я`). Жодної: GitPoulpi запускається як звичайно, у цій теці. Підкоманд не приймає; з `--json` виводить один об'єкт (`action` дорівнює `joined` або `cancelled`), код виходу 0, коли вкладку відкрито, 3, коли зайняте вікно запропонувало її в чипі рядка стану"
"gitpoulpi --no_raise" = "З `--add`: не просить вікно винести свій термінал на передній план"
"gitpoulpi --backend" = "На якому `GitBackend` працює демон цієї команди, перевизначає `general.default_backend` у config.toml і `GITPOULPI_GENERAL_DEFAULT_BACKEND` (прапори - на вершині пріоритету - див. docs/user/config-reference.md)"
"gitpoulpi --backend#long" = """
На якому `GitBackend` працює демон цієї команди, перевизначає `general.default_backend` у config.toml і `GITPOULPI_GENERAL_DEFAULT_BACKEND` (прапори - на вершині пріоритету - див. docs/user/config-reference.md).

Він обирає бекенд для демона, який ця команда *запускає*. Сесія, демон якої вже працює, лишається з бекендом, із яким цей демон зібрано; `gitpoulpi` не вміє підмінити бекенд живого демона під уже підписаними клієнтами, а вдавати інакше було б тим самим мовчазним нічого-не-робленням, якого цей прапор має уникати."""
"gitpoulpi --cwd_file" = """Файл, у який TUI записує теку активної вкладки при виході («Quit and cd here» або завжди з `ui.tab_dir_follow = "auto"`). Призначений для обгортки, яку виводить `gitpoulpi shell-init`; усі підкоманди його ігнорують, бо вкладки є лише в TUI"""
"gitpoulpi --json" = "Виводити структурований JSON замість зручного для людини виводу"
"gitpoulpi --lang" = "Мова тексту `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr)"
"gitpoulpi --lang#long" = """
Мова тексту `--help` (en, fr, es, pt-BR, pt-PT, it, de, zh-CN, ja, ko, ru, uk, pl, cs, nl, sv, tr).

Перекладаються лише пояснення - назви команд і прапорів ніколи не змінюються - а `--help` лишається англійською, доки це не вказано (середовище навмисно ігнорується, щоб скрипти отримували стабільний вивід). Приклад: `gitpoulpi -l fr --help`."""
"gitpoulpi --repo" = "Репозиторій для дій. Типово - репозиторій, що містить поточну теку, тож `gitpoulpi status` поводиться як `git status`; агент, що керує кількома репозиторіями, передає це замість chdir"
