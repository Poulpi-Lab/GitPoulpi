undo = "Скасовує останню записану в журнал операцію (commit, amend, checkout, створення/видалення гілки). Відмовляє, нічого не змінюючи, якщо щось із зачепленого операцією відтоді змінилося. Код виходу 2, коли відхилено, 3, коли потрібен `--yes` (ризиковане скасування)"
"undo --all" = "З `--list`: включити записи, що більше не можна повторити"
"undo --dry_run" = "Показати, що станеться, і нічого не змінювати"
"undo --expect" = "Скасувати, лише якщо це все ще останній запис (його id, як показує `--list`); інакше відхиляється як stale"
"undo --list" = "Перелічити журнал замість цього (найновіші останніми); `--all` додає записи, що вже не можуть бути повторені, але ще закріплені"
"undo --yes" = "Виконати, коли скасування ризиковане (коміт уже на своєму upstream або файли робочого дерева було б перезаписано). Без нього таке скасування нічого не змінює й завершується з кодом 3"
worktree = "Прив'язані worktrees: перелічує їх, додає один на гілці чи коміті"
"worktree add" = "Додає прив'язаний worktree в `<path>`. Якщо `<start>` називає локальну гілку, на ній там і роблять checkout (або `--branch` починається з неї); будь-яка інша ревізія дає відокремлений HEAD (або `--branch` починається там)"
"worktree add --branch" = "Створити цю нову гілку на `<start>` і зробити там checkout"
"worktree add --start" = "Локальна гілка або будь-яка ревізія"
"worktree list" = "Кожен worktree репозиторію, основний першим"
"worktree changes" = "Незакомічені зміни worktree в `<path>` (відстежувані й невідстежувані, без ігнорованих); порожній список означає, що worktree чистий"
"worktree remove" = "Видаляє прив'язаний worktree в `<path>`. Worktree з незакоміченими змінами відхиляється, якщо немає `--force` (зміни втрачаються), `--commit-message` (спершу закомітити всі зміни на його гілці; відокремлений worktree потребує ще й `--commit-branch`) або `--stash-message` (спершу сховати всі зміни, разом з невідстежуваними, у stash; stash спільний для всіх worktree). `--delete-branch` додатково видаляє його гілку (журналюється: скасування повертає гілку, але папка лишається видаленою). Саме видалення не скасовується"
"worktree remove --commit_branch" = "Гілка, яку створити для цього коміту, коли worktree відокремлений"
"worktree remove --commit_message" = "Закомітити всі зміни з цим повідомленням перед видаленням"
"worktree remove --delete_branch" = "Після видалення також видалити гілку worktree"
"worktree remove --force" = "Видалити, навіть якщо є незакомічені зміни; вони втрачаються"
"worktree remove --stash_message" = "Сховати всі зміни з цим повідомленням у stash перед видаленням"
