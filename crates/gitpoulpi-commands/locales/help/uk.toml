"flow start" = "Почати тематичну гілку типу робочого процесу: називає її за шаблоном типу (`feature/{slug}`, `release/{version}`, ...), створює від батьківської гілки типу (або `--from`), робить checkout і записує батьківську гілку. Виводить кроки, які виконає; виконує їх лише з `--yes` (або після інтерактивного запитання в терміналі). Undo повертає все"
"flow start --autostash" = "Сховати локальні зміни, що заважають checkout чи merge, і повернути їх після, що б не казало `general.auto_stash`"
"flow start --dry_run" = "Вивести план (кожен крок, перешкоди, попередження) як JSON і нічого не змінювати"
"flow start --fields" = "Значення токенів шаблону як `name=value` (`slug=login`, `version=1.2.0`, `issue=42`); голе слово - це `slug`. `user` і `date` типово беруться від вас і з сьогоднішньої дати"
"flow start --from" = "Почати з цієї гілки, віддаленої гілки чи tag'а замість батьківської гілки типу"
"flow start --no_hooks" = "Пропустити налаштовані хуки без запиту"
"flow start --publish" = "Зробити push нової гілки і задати її upstream"
"flow start --run_hooks" = "Виконати хуки, які робочий процес налаштовує для цієї дії (команди оболонки з файлу робочого процесу, показані разом з виводом). Ніколи не виконуються без прохання; за відсутності цього прапорця питає термінал"
"flow start --type" = "Тип гілки (`feature`, `hotfix`, `release`, ...): див. `flow config --show-effective`"
"flow start --yes" = "Виконати план без запиту. Без цього питає термінал, а в іншому разі план виводиться і виконання завершується з кодом 3"
"flow status" = "Кожна гілка репозиторію, класифікована за робочим процесом гілок: базова чи тематична (з типом), батьківська гілка і на скільки commit'ів вона випереджає батьківську та відстає від неї. Без файлу робочого процесу кожна гілка некласифікована; `flow detect` пропонує його"
"flow sync" = "Підтягнути гілку з її батьківської (merge або rebase, за налаштованою стратегією гілки), а з `--stack` - і гілки, побудовані на ній, по черзі. Виводить план і потребує `--yes`; без нього код виходу 3"
"flow sync --abort" = "Відмовитися від зупиненого flow: перервати merge або rebase, що триває, і повернутися на гілку, з якої все почалося. Уже виконані кроки лишаються (поверніть їх через `undo`)"
"flow sync --autostash" = "Сховати локальні зміни, що заважають checkout чи merge, і повернути їх після, що б не казало `general.auto_stash`"
"flow sync --branch" = "Гілка для оновлення. Типово поточна"
"flow sync --continue_" = "Продовжити після вирішення конфлікту: робить commit merge або продовжує rebase, потім виконує решту кроків. Після невдалого хука виконує цей крок знову"
"flow sync --dry_run" = "Вивести план (кожен крок, перешкоди, попередження) як JSON і нічого не змінювати"
"flow sync --merge" = "Зробити merge замість rebase"
"flow sync --no_hooks" = "Пропустити налаштовані хуки без запиту"
"flow sync --rebase" = "Зробити rebase замість merge"
"flow sync --run_hooks" = "Виконати хуки, які робочий процес налаштовує для цієї дії (команди оболонки з файлу робочого процесу, показані разом з виводом). Ніколи не виконуються без прохання; за відсутності цього прапорця питає термінал"
"flow sync --stack" = "Також оновити гілки, батьківська гілка яких - ця, рекурсивно"
"flow sync --yes" = "Виконати план без запиту. Без цього питає термінал, а в іншому разі план виводиться і виконання завершується з кодом 3"
"flow templates" = "Вбудовані шаблони робочих процесів (Git Flow, GitHub Flow, GitLab Flow, Trunk-based, Custom) з їхніми базовими гілками й типами гілок"
"flow trust-hooks" = "Переглянути й довірити хуки робочого процесу, які комітить репозиторій (`[hooks]` у `.gitpoulpi/workflow.toml`): команди оболонки, що виконувалися б на вашій машині. Без `--hash` лише виводить `{hash, hooks, trusted}`; з хешем запам'ятовує довіру, але лише якщо файл на диску має саме цей хеш, тож довіряється те, що ви прочитали. Змінений файл питає знову. Хукам вашого власного override це ніколи не потрібне. Це може зробити лише людина: для цього немає інструмента MCP"
"flow trust-hooks --hash" = "Хеш, виведений `flow trust-hooks` (або відхиленим `--run-hooks`): довірити хукам із цим хешем"
"alias" = "Псевдонім команди (`gp` чи будь-яка назва), що запускає GitPoulpi з терміналу: скриптовий двійник Налаштувань > Лаунчер"
"alias create" = "Робить так, що `<name>` (наприклад, `gp`) запускає GitPoulpi: посилання в Linux і macOS, файл `.cmd` у Windows, у користувацькій папці bin. Файл, який не належить GitPoulpi, ніколи не замінюється. Додайте папку до PATH командою `path add`"
"alias create --add" = "Створює варіант додавання (наприклад `gpa`): він виконує `gitpoulpi --add`, що відкриває поточну теку новою вкладкою вже запущеного GitPoulpi"
"alias create --name" = "Назва команди: лише літери, цифри, `-`, `_` і `.`"
"alias remove" = "Видаляє псевдоніми команд, створені GitPoulpi (усі або лише `<name>`); файл, який не належить GitPoulpi, не чіпається"
"alias remove --name" = "Псевдонім для видалення (типово: усі, створені GitPoulpi)"
"alias status" = "Показує псевдоніми команд, створені GitPoulpi (і що запускає кожен), та імена з `ui.command_alias` і `ui.command_alias_add`"
"path" = "Додає GitPoulpi до користувацького PATH для нових терміналів"
"path add" = "Додає до користувацького PATH для нових терміналів папку, де лежить GitPoulpi, і папку псевдонімів: позначений блок у файлах запуску оболонки (Linux, macOS) або користувацький PATH у реєстрі (Windows). Папки, що вже є в PATH, не чіпаються"
"path remove" = "Прибирає рівно те, що додала команда `path add`"
"path status" = "Показує, чи є в користувацькому PATH папка, де лежить GitPoulpi, і папка псевдонімів, а також що саме додав GitPoulpi"
"uninstall" = "Видаляє те, що створили інсталятор і Налаштування (псевдоніми команд, записи PATH, ярлики), а для встановлення з релізу - і файли програми. Відмовляє для збірки, яка не є встановленням з релізу (поруч з exe немає маркера `.gitpoulpi-dist`). Ваша конфігурація, сесії та репозиторії не чіпаються"
"uninstall --keep_files" = "Залишає файли програми на місці (деінсталятор Windows видаляє їх сам, бо запущений exe видалити не можна)"
"launch" = "Що запускають ярлики GitPoulpi: показує вікно вже відкритого GitPoulpi (`ui.reuse_window`), інакше запускає COMMAND (термінал, що виконує GitPoulpi). Нічого не запускає, зокрема демона, якщо може показати вікно"
"launch --command" = "Команда, яку запустити, коли немає вікна для показу, після `--`"
"launch --folder" = """Відкрити цю папку: якщо `ui.reuse_window` увімкнено й вікно відкрите, репозиторій, що її містить, стає вкладкою вікна, яке мало фокус останнім (без запитань); інакше GitPoulpi запускається в обраному терміналі на цій папці. Це запускає пункт «Відкрити в GitPoulpi» файлового менеджера"""
"launch --new_window" = "Запускає нове вікно, навіть якщо одне вже відкрите"
"ai split-plan" = "Виводить план, який ШІ пропонує для розділення коміту на кілька комітів, у JSON, що приймає `split-commit --plan`. Нічого не застосовує: перегляньте й передайте в `split-commit`. Потрібен `ai.enabled = true`"
"ai split-plan --rev" = "Коміт для розділення (будь-яка ревізія: sha, `HEAD~2`, ...)"
"ai rewrite-script" = "Виводить скрипт Lua, який ШІ пише для переписування історії за вашою вказівкою («перенести кожен коміт, зроблений уночі, на наступний ранок»), разом із результатом `rewrite script check` для нього. Нічого не запускає й не змінює: прочитайте скрипт, потім виконайте `rewrite script test` і `rewrite preview --script`. Надсилає лише вашу вказівку та, з `--sample N`, автора, дату й тему N комітів (ніколи вміст файлів). Потрібен `ai.enabled = true`"
"ai rewrite-script --instruction" = "Що має робити скрипт, вашими словами"
"ai rewrite-script --sample" = "Надіслати також автора, дату й тему N найновіших комітів (не більше 50), щоб модель бачила, як виглядають дані. Типово вимкнено: без цього дані комітів не залишають комп'ютер"
"ai rewrite-rules" = "Виводить правила й налаштування, які ШІ пропонує для переписування історії за вашим описом («замінити мою стару адресу a@b на c@d у кожному коміті», «прибрати secrets.txt з усієї історії»), у вигляді JSON-рецепта, який читає `rewrite preview --recipe-json` (збережіть поле `recipe` у файл для `--recipe`), а також що пропущено і чому. Нічого не переглядає й не застосовує: прочитайте правила, потім самі виконайте `rewrite preview` і `rewrite apply`. Надсилає лише ваш опис та, з `--context`, поточну гілку, назви гілок і тегів та авторів 200 найновіших комітів (ніколи вміст файлів). Потрібен `ai.enabled = true`"
"ai rewrite-rules --description" = "Як потрібно переписати історію, вашими словами"
"ai rewrite-rules --context" = "Надіслати також назви гілок і тегів та авторів 200 найновіших комітів (не більше 100 назв гілок і тегів та 100 авторів), щоб модель могла назвати їх точно. Типово вимкнено: без цього з комп'ютера виходить лише ваш опис"
"ai worktree-name" = "Виводить назву worktree і назву гілки, які ШІ пропонує для завдання («виправити збій, коли конфігурація порожня»): `{ name, worktree, branch }`, де `worktree` - назва, яку заповнив би діалог створення worktree (`worktree-<name>`), а `branch` відповідає власним назвам гілок репозиторію. Нічого не створює: передайте їх у `worktree add`. Надсилає лише ваш опис і назви локальних гілок. Потрібен `ai.enabled = true`"
"ai worktree-name --describe" = "Функція, помилка чи завдання вашими словами"
"ai hosting-reply" = "Print a draft the AI writes for a conversation on a code host: a comment, an answer in a thread (`--reply-to`), a comment on a line of code (`--path`), a review summary (`--review-summary`), or the description of a new issue (`--issue-title`). The conversation is read from `--conversation` (the JSON `hosting issue comments --json` or `hosting review conversation --json` prints, so `hosting issue comments 7 --json | ai hosting-reply --conversation -` works) or fetched by `--item`; the AI sees the item, the thread, the recent comments within `ai.limits.hosting_reply_context_bytes` and your `--hint`. **It only drafts: the answer is `{ draft, posted: false, ... }` and nothing is posted, edited or deleted**; posting is a separate command you run yourself. The base prompt is `ai.hosting_reply.base_prompt` (edit it in Settings > AI). Needs `ai.enabled = true`"
"ai hosting-reply --conversation" = "The conversation as JSON, as a `hosting` conversation command prints it: a file, `-` for standard input, or the JSON itself. Not for `--issue-title`"
"ai hosting-reply --draft" = "Your own text to improve instead of writing a new one"
"ai hosting-reply --flavor" = "The markup the host takes: `gfm`, `gitlab_md`, `gitea_md`, `common_mark`, `azure_md`, `bitbucket_md`, `html`, `jira_wiki`, `textile`, `youtrack_md`, `trello_md`, `plain_text`, `obsidian_md`. Default: the item's own"
"ai hosting-reply --hint" = "What you want in this answer (\"say I will look at it tomorrow\")"
"ai hosting-reply --issue_title" = "Draft the description of a new issue with this title (no conversation)"
"ai hosting-reply --item" = "The issue or pull request to answer, read from the host itself in the repository's linked source (`7` or `#7` an issue, `!7` a pull request): the same conversation `hosting issue comments 7 --json` prints, without the system events. Instead of `--conversation`"
"ai hosting-reply --line" = "With `--path`: the line"
"ai hosting-reply --path" = "Draft a new review comment on this file of the pull request"
"ai hosting-reply --read_repo" = "Let the AI read the repository for this draft (off unless given or `ai.hosting_reply.read_repository` is true). A local agent reads it itself with read-only tools in the repository folder; an API profile gets a context GitPoulpi builds (the files the conversation names, search hits, the map) within `ai.limits.hosting_reply_*`. The AI only drafts either way; nothing is posted"
"ai hosting-reply --refresh_context" = "Forget the context and the agent session kept from earlier drafts of this repository and read it again (with `--read-repo`)"
"ai hosting-reply --pr_base" = "With `--read-repo`: the base revision of the pull request, to put its diff (against the merge base) in the context"
"ai hosting-reply --pr_head" = "With `--read-repo`: the head revision of the pull request"
"ai hosting-reply --reply_to" = "Answer in the thread with this id (a code thread, a comment or a discussion)"
"ai hosting-reply --review_summary" = "Draft the summary of the review being submitted"
"split-commit" = "Розділяє коміт поточної гілки на кілька, від найстарішого, за JSON-планом (нумерацію див. у `split-source`). Останній новий коміт зберігає початкове дерево, тож нащадки й робоче дерево не змінюються; для надісланого коміту потім потрібен force push. Один `undo` повертає все. Код виходу 2 у разі відмови"
"split-commit --commit" = "Коміт для розділення (будь-яка ревізія: sha, `HEAD~2`, ...)"
"split-commit --dry_run" = "Перевіряє план і перелічує непризначене; нічого не змінює"
"split-commit --plan" = "План (JSON) зі шляху до файлу або `-` для stdin. Елемент - це `path` плюс необов'язковий `hunk` плюс необов'язкові `lines` (індекси в `lines` hunk'а); елемент лише з `path` - весь файл"
"split-commit --rest_message" = "Поміщає все, що план не призначив, в останній коміт із цим повідомленням"
"split-commit --sign" = "Підписує нові коміти (і повторно створених нащадків)"
"split-source" = "Зміни коміту, пронумеровані для `split-commit`: кожен файл з його hunk'ами (`id`, рядки) або, для файлів, які можна призначити лише цілком (двійковий, лише режим, доданий, видалений, підмодуль, LFS), причина. Лише читання"
"split-source --commit" = "Коміт (будь-яка ревізія: sha, `HEAD~2`, ...)"
rewrite = "Масове переписування історії (особи, дати, повідомлення) за рецептом: `preview` планує його, нічого не змінюючи, `apply` виконує переглянутий вами план як ОДИН запис скасування, `run` робить обидва кроки для скриптів. Надсилає щось лише `push`: він примусово надсилає переписані ref, кожен із lease"
"rewrite apply" = "Застосовує переглянутий запуск: переміщує ref одним записом скасування (`gitpoulpi undo` повертає все назад). Нічого не надсилає. Код виходу 2 при відмові (репозиторій змінився після перегляду, хибний digest, ...), 3 якщо план переміщує ref, що є на remote, а `--yes` не вказано"
"rewrite apply --digest" = "Digest, який вивів `rewrite preview`: план, який ви переглянули"
"rewrite apply --run" = "Ідентифікатор запуску, який вивів `rewrite preview`"
"rewrite apply --yes" = "Підтвердити переміщення ref, які вже надіслано. Без цього такий план нічого не змінює, а код виходу дорівнює 3"
"rewrite diff" = "Що правило вмісту зробило з одним файлом одного коміту в переглянутому запуску: порівняння старого й нового файлу. Рядки, які прибирає правило секретів, приховано. Лише читання"
"rewrite diff --commit" = "Коміт у вигляді до переписування (ідентифікатор із рядків)"
"rewrite diff --path" = "Файл, відносно кореня репозиторію"
"rewrite diff --run" = "Ідентифікатор запуску, який вивів `rewrite preview`"
"rewrite discard" = "Відкидає переглянутий запуск, не застосовуючи його. Відкинути двічі - не помилка"
"rewrite discard --run" = "Ідентифікатор запуску, який вивів `rewrite preview`"
"rewrite preview" = "Планує переписування історії, нічого не змінюючи: кількості, ref, які були б переміщені, попередження й перші рядки. Зберігає план у демоні як запуск (`run`, `digest`) для `rewrite rows` і `rewrite apply`. Перегляд також лежить на диску в git-каталозі репозиторію, тож `rewrite apply` працює з пізнішої команди, після перезапуску демона або з іншого фронтенду, не запускаючи демон; демон, що робив перегляд, потрібен лише для `rewrite rows` (запущений, або вкажіть `--all` у перегляді). Код виходу 2, якщо рецепт відхилено"
"rewrite preview --all" = "Вивести кожен змінений коміт"
"rewrite preview --all_local" = "Переписати кожну локальну гілку й tag замість поточної гілки"
"rewrite preview --committer" = "Комітер переписаних комітів: `keep` (типово) або `me-now`"
"rewrite preview --include_protected" = "Переписати також ці захищені гілки, які вже надіслано (типово виключені; можна повторювати)"
