"mcp serve --http" = "Адреса прослуховування для streamable HTTP, напр. 127.0.0.1:8808 (точка `/mcp`); без адреси береться `[mcp] bind` (типово 127.0.0.1:8808). Запити потребують bearer-токена (`mcp token`), якщо не вимкнено `[mcp] http_auth`. Лише loopback, якщо немає `--allow-remote`"
