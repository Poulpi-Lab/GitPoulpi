"workspace" = "Робочі простори: іменовані групи репозиторіїв, за потреби з типовим профілем комітів. Зберігаються у `workspaces.toml` поруч із `config.toml` і спільні з TUI"
"workspace add" = "Додає репозиторії до робочого простору, записуючи URL `origin` кожного"
"workspace create" = "Створює робочий простір і виводить його з новим id. Кожен `--add` записується з його URL `origin`"
