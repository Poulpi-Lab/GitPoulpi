"ai split-plan" = "输出 AI 建议的、将一个提交拆分为多个提交的计划，格式为 `split-commit --plan` 接受的 JSON。不会应用任何内容：先检查，再交给 `split-commit`。需要 `ai.enabled = true`"
"ai split-plan --rev" = "要拆分的提交（任意版本：sha、`HEAD~2` 等）"
"ai rewrite-script" = "根据你的指令，输出 AI 为历史重写编写的 Lua 脚本（例如“把所有在夜间创建的提交移到第二天早上”），并附上对它运行 `rewrite script check` 的结果。不运行也不改动任何内容：请先阅读脚本，再用 `rewrite script test` 和 `rewrite preview --script` 试用。只发送你的指令；加 `--sample N` 时还会发送 N 个提交的作者、日期和标题（绝不发送文件内容）。需要 `ai.enabled = true`"
"ai rewrite-script --instruction" = "用你自己的话说明脚本要做什么"
"ai rewrite-script --sample" = "同时发送最新 N 个提交（最多 50 个）的作者、日期和标题，让模型了解数据的样子。默认关闭：不加它就没有任何提交数据离开本机"
"ai rewrite-rules" = "输出 AI 根据你的描述为历史重写提出的规则和设置（例如“在所有提交中把我的旧邮箱 a@b 换成 c@d”“从全部历史中移除 secrets.txt”），格式为 `rewrite preview --recipe-json` 读取的 JSON 配方（把 `recipe` 字段存入文件即可用于 `--recipe`），并列出未采用的内容及原因。不会预览也不会应用任何内容：请先阅读规则，再自行运行 `rewrite preview` 和 `rewrite apply`。只发送你的描述；使用 `--context` 时还会发送当前分支、分支和标签名称以及最近 200 个提交的作者（绝不发送文件内容）。需要 `ai.enabled = true`"
"ai rewrite-rules --description" = "用你自己的话描述历史应如何重写"
"ai rewrite-rules --context" = "同时发送分支和标签名称以及最新 200 个提交的作者（最多 100 个分支和标签名称、100 位作者），以便模型准确写出这些名称。默认关闭：不加此项时，只有你的描述会离开本机"
"split-commit" = "按 JSON 计划，把当前分支上的一个提交拆分为多个，顺序从旧到新（编号见 `split-source`）。最后一个新提交保留原始树，因此后代提交和工作区都不变；已 push 的提交拆分后需要强制 push。一次 `undo` 即可还原。被拒绝时退出码为 2"
"split-commit --commit" = "要拆分的提交（任意版本：sha、`HEAD~2` 等）"
"split-commit --dry_run" = "校验计划并列出未分配的内容，不做任何更改"
"split-commit --plan" = "计划（JSON），来自文件路径或表示标准输入的 `-`。一个片段是 `path` 加可选的 `hunk` 加可选的 `lines`（hunk 的 `lines` 中的索引）；只有 `path` 的片段表示整个文件"
"split-commit --rest_message" = "把计划未分配的所有更改放入使用此消息的最后一个提交"
"split-commit --sign" = "为新提交（以及重新创建的后代）签名"
"split-source" = "为 `split-commit` 编号的提交更改：每个文件及其 hunk（`id`、行），对于只能整体分配的文件（二进制、仅模式、新增、删除、子模块、LFS）则给出原因。只读"
"split-source --commit" = "提交（任意版本：sha、`HEAD~2` 等）"
"rewrite" = "按方案批量重写历史（身份、日期、消息）：`preview` 只规划而不改动任何内容，`apply` 把你审阅过的规划作为一条撤销记录执行，`run` 为脚本一次完成这两步。只有 `push` 会向外发送内容：它强制 push 重写后的引用，每个都带 lease"
"rewrite apply" = "应用已预览的运行：把各引用作为一条撤销记录移动（`gitpoulpi undo` 可全部还原）。绝不会 push。被拒绝时退出码为 2（预览之后仓库有变化、摘要不符等）；规划要移动已在远程上的引用而缺少 `--yes` 时为 3"
