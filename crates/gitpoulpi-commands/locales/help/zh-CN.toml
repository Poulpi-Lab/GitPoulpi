launch = "GitPoulpi 快捷方式实际运行的命令：如果已有打开的 GitPoulpi 窗口（`ui.reuse_window`），就把该窗口显示出来；否则启动 COMMAND（运行 GitPoulpi 的终端）。能显示窗口时，不会启动任何程序，也不会启动守护进程"
