ai = "AI 助手（除非 `ai.enabled = true`，否则关闭）：输出生成的提交消息，或解释某个提交或工作区更改"
"ai commit-message" = "输出 AI 为已暂存更改（未暂存任何内容时则为所有更改）提议的提交消息。不会提交任何内容"
"ai explain" = "解释一个提交（默认 HEAD），或用 --wip 解释工作区更改"
"ai resolve-conflict" = "输出 AI 为冲突文件中的某一个合并冲突建议的解决方案（`--conflict N`，从 1 起；文件只有一个冲突时可省略）。只输出：不会写入或暂存任何内容，由调用方决定（`conflicts resolve --content-file` 可应用整个文件的结果）。需要 `ai.enabled = true`"
"ai resolve-conflict --conflict" = "文件的第几个冲突，从 1 起"
"ai resolve-conflict --path" = "有冲突的文件，相对于仓库根目录"
autostash = "待处理的 auto-stash：GitPoulpi 为了执行 checkout、merge、rebase 或 pull 暂存了本地更改，但尚未恢复"
"ai review-context" = "显示或设置 ✦ 代码评审草稿除 diff 外还会得到什么（`[ai.review]`）：仓库的 CLAUDE.md 和 AGENTS.md、另一个文件（路径或链接），以及是否在仓库中运行本地代理。`--repo` 和 `--project` 都不给时是全局默认值；`--repo PATH` 是某个已克隆仓库自己的值，`--project HOST/PROJECT` 是未克隆仓库的值。不带设置标志时输出这些值（`effective` 是评审实际得到的）；带设置标志时保存并输出结果。不需要模型，AI 关闭时也能用"
"ai review-context --agents_md" = "将仓库的 AGENTS.md 提供给模型"
"ai review-context --claude_md" = "将仓库的 CLAUDE.md 提供给模型"
"ai review-context --context_file" = "另一个文件：相对于仓库根目录的路径、绝对路径，或指向代码托管平台上某文件的链接"
"ai review-context --no_context_file" = "不要额外文件"
"ai review-context --no_extra_file" = "此仓库或项目不使用额外文件，无论全局值如何（`on`，单独给出时的默认值）；`off` 让它重新沿用全局值"
"ai review-context --project" = "未克隆的仓库，写作 `HOST/PROJECT`（`github.com/owner/name`）"
"ai review-context --reset" = "与 `--repo` 或 `--project` 一起用：在应用标志之前，忘掉该仓库自己的值（重新跟随全局值）"
"ai review-context --run_in_repo" = "在仓库中运行本地代理（`yes`）、不在其中运行（`no`），或按其 AI 配置决定（`profile`）。不适用于 `--project`"
"autostash start-over" = "重新开始：丢弃 stash 所含文件在工作区中的更改（副本保存在 `refs/gitpoulpi-backup/` 下），撤销触发 auto-stash 的操作（pull、checkout、merge、rebase），然后在原提交上 pop 该 stash。任一步失败时会在 stash 完好的情况下停止。被拒绝时退出码为 1，需要 `--yes` 时为 3"
"autostash start-over --dry_run" = "显示将会发生什么，但不做任何更改"
"autostash start-over --yes" = "继续执行；不带它时不会改变任何内容，并以退出码 3 退出"
blame = "某个版本中文件的逐行归属信息"
"blame --at" = "要 blame 的版本（默认：HEAD）"
"branch delete-remote" = "从远程删除一个分支，保留同名的本地分支"
"branch fast-forward" = "仅在可以快进时，将 `<branch>` 向前移动到 `<target>`（历史已分叉则拒绝，不会移动任何内容）。已检出的分支会连同工作区一起更新，类似 `git merge --ff-only`；其他分支则只移动其引用"
"branch fast-forward --target" = "任意版本（默认：HEAD）"
"branch set-upstream" = "让 `<branch>` 跟踪 `<upstream>`（`origin/main`）"
"branch track" = "创建一个跟踪远程跟踪分支的本地分支并检出它。`<upstream>` 的写法与引用列表一致（`origin/feature/login`）；`--name` 默认取分支部分"
"branch unset-upstream" = "移除 `<branch>` 的 upstream"
"checkout --autostash" = '暂存妨碍此操作的本地更改，执行操作后再 pop 该 stash（即 `general.auto_stash = "always"` 的行为）'
"cherry-pick --commits" = "要应用的提交，按顺序。给出 `--plan` 时省略"
"cherry-pick --plan" = "一个 JSON `Vec<RebaseStep>`（形式与 `rebase --plan` 相同；见 `rebase-plan`），来自文件路径，或用 `-` 表示 stdin：各步骤按列表顺序 cherry-pick。此处只有 `Pick` 和 `Drop` 操作有意义（`Drop` 跳过该提交）；其他操作会被拒绝。不能与位置参数中的提交同时使用"
"clone --branch" = "检出此分支，而不是远程的默认 HEAD"
"clone --depth" = "将历史截断为这么多个提交（`git clone --depth`）"
"clone --no_lfs" = "克隆后保留 Git LFS 文件为指针，不下载其内容"
"clone --origin" = "给新远程起一个 `origin` 以外的名字"
"clone --recurse_submodules" = "同时克隆子模块"
"commit --ai" = "让 AI 根据已暂存的 diff 撰写消息，使用该仓库的提交消息指令（设置 > AI）。需要 `ai.enabled = true` 和已配置的配置文件"
"commit --message" = "提交消息。除非由 --ai 撰写，否则必填"
"commit --no_verify" = "跳过提交钩子（`pre-commit`、`commit-msg`），等同于 `commit --no-verify`"
completions = "将 shell 补全脚本输出到 stdout（bash、zsh、fish、powershell 或 elvish），例如 `gitpoulpi completions bash > ~/.local/share/bash-completion/completions/gitpoulpi`"
"conflicts abort" = "中止正在进行的操作：HEAD、索引和工作区恢复到操作之前。此后所做的解决会被丢弃"
"conflicts skip" = "跳过正在进行的 cherry-pick 或 revert（或 rebase 停下的提交）：HEAD、索引和工作区恢复到 HEAD。变为空时（更改已应用）的出路。merge 没有可跳过的内容"
"conflicts check" = "把 HEAD 合并进当前分支的来源分支会冲突吗？冲突在哪些文件？不会改动任何内容（在内存中合并）。基础分支取该分支已知 pull request 的目标分支；没有则取“基础分支”模式允许的分支中自分叉以来提交最少的那个。`{\"status\":\"conflicts\"|\"clean\"|\"no-base\"|\"disabled\", \"base_ref\", \"files\": [...]}`。`general.conflict_detection` 或该仓库的开关关闭时为 disabled"
"conflicts list" = "有冲突的文件，每个都附带其三侧的文本。使用 `--names-only` 时：只给出路径、冲突类型和各阶段的 oid（不读取任何 blob；对大型合并开销很小）"
"conflicts resolve" = '解决一个文件并暂存它（该文件不再有冲突）。必须恰好使用 `--side/--ours/--theirs`、`--both`、`--pick`、`--content-file` 或 `--delete` 之一。A 和 "ours" 是当前一侧（`HEAD`；rebase 期间是被 rebase 到的分支），B 和 "theirs" 是传入一侧。不要手动编辑冲突标记：请选择，或把最终文本写入文件'
"conflicts resolve --both" = "保留每个冲突的两侧（先 A 后 B），其他地方使用 git 自己的合并"
"conflicts resolve --content_file" = "最终的文件文本，原样使用（`-` 读取标准输入）"
"conflicts resolve --delete" = "接受删除：移除该文件（`git rm`）"
"conflicts resolve --encoding" = "配合 `--content-file`：以此编码（WHATWG 标签，如 `windows-1252`）而非 UTF-8 写入文本"
"conflicts resolve --expect" = "做出决定时所依据的各阶段 oid，`base,ours,theirs`（缺失的阶段用 `-`）。当索引不再恰好包含这些内容时，调用会以 `stale` 被拒绝。`--both` 和 `--pick` 总是会检查它们读取的阶段"
"conflicts resolve --no_stage" = "写入工作区文件，但保持其冲突状态（普通保存）"
"conflicts resolve --ours" = "等同于 `--side ours`"
"conflicts resolve --pick" = "为每个冲突编号指定一个选择：`1=a,2=b,3=ab,4=ba,5=none`（a = ours，b = theirs，ab / ba = 两者按该顺序）。每个冲突都需要一个选择，除非 `--default` 涵盖其余冲突"
"conflicts resolve --pick_default" = "配合 `--pick`：未列出的每个冲突所用的选择"
"conflicts resolve --side" = "从某一阶段获取整个文件，不自动合并"
"conflicts resolve --theirs" = "等同于 `--side theirs`"
"conflicts resolve --theirs_first" = "配合 `--both`：先 B 后 A"
"conflicts show" = "合并编辑器所见的某个有冲突文件：窗格标签、三侧内容和带编号的冲突区域（`--json` 为完整文档）。git 自己已解决的合并区域不会列出；它们保留在 `resolve --both`/`--pick` 的结果中"
"conflicts show --conflict" = "只显示第 N 个冲突（从 1 起）"
"conflicts state" = "正在进行的 merge、rebase、cherry-pick 或 revert（没有时为 `null`）"
"conflicts unresolve" = "将此操作期间已解决的文件恢复为冲突状态（重新带上标记）。若它仍有冲突，或并非在该操作运行期间解决的，则会被拒绝"
daemon = '`gitpoulpi server ...` 是一个可见的别名 - 所有者把这个命令组称为“服务器”，并输入 `gp server stop`'
"daemon restart" = "先 `daemon stop`，再 `daemon start`"
"daemon run" = "在前台运行本会话的守护进程（会阻塞；按 Ctrl-C 停止，或从别处发送 `daemon stop`/`daemon restart`）。这是 `daemon start` 以分离方式启动的内容，也可以在专用终端中直接运行"
"daemon start" = "以分离的后台进程启动本会话的守护进程（若已在运行则报告这一点）。`--backend` 固定所启动进程使用的后端；省略时，所启动的进程自行解析 `general.default_backend`"
"daemon status" = "本会话的守护进程是否在监听，若在监听则给出其端口、PID、运行时间、后端和构建版本"
"daemon stop" = "请求本会话的守护进程正常关闭；仅当它未在规定时间内应答、且它是独立守护进程（绝不是内嵌在运行中 TUI 里的）时，才退而终止其记录的 PID"
"daemon stop --all" = "停止 `session list` 报告了端口文件的每个会话的守护进程，而不仅仅是本会话的"
discard = "丢弃文件在工作区中的*未暂存*更改：一个 hunk（`--hunk`）、其中的若干行（`--hunk --lines`），或者 - 只用 `--file` 时 - 该文件的所有未提交更改，包括已暂存的（未跟踪文件会被删除）。hunk 和行的编号与 `gitpoulpi diff --json` 对未暂存 diff 的编号一致。被丢弃的所有内容都会保存在安全快照中，因此 `gitpoulpi undo` 可以找回（包括未跟踪文件）。无需确认：这是脚本接口"
"discard --lines" = "`--hunk` 内以逗号分隔的行索引"
"fetch --all" = "fetch 所有已配置的远程"
"fetch --prune" = "删除远程已不再拥有的远程跟踪分支"
"fetch --prune_tags" = "同时删除远程已经删除的本地标签（只涉及曾存在于远程的标签：从未 push 过的标签不会动）。比 git 的 `fetch.pruneTags` 范围更窄；除非指定，否则关闭"
"fetch --remote" = "省略时：仓库的默认远程（见 `remote default`）"
gitpoulpi = "轻量级跨平台 TUI Git 客户端，可通过 CLI/MCP 编写脚本。"
"gitpoulpi --add" = "把文件夹作为新标签页在已运行的 GitPoulpi 中打开，而不是再启动一个（`gp -a`、`gp --add ../other`）。PATH 默认为当前目录，并解析为包含它的仓库。有一个运行中的会话：该会话获得标签页，桌面允许时其窗口会移到前台。有多个：从编号列表中选一个（或传入 `--session NAME`）。没有：在该文件夹中照常启动 GitPoulpi。不接受子命令；加 `--json` 时输出一个对象（`action` 为 `joined` 或 `cancelled`），标签页已打开时退出码为 0，忙碌的窗口在状态栏的提示块中提出该标签页时为 3"
"gitpoulpi --no_raise" = "与 `--add` 一起使用：不请求窗口把其终端移到前台"
"gitpoulpi --backend" = "此命令的守护进程运行在哪个 `GitBackend` 上，覆盖 config.toml 中的 `general.default_backend` 和 `GITPOULPI_GENERAL_DEFAULT_BACKEND`（命令行参数位于优先级最高处 - 见 docs/user/config-reference.md）"
"gitpoulpi --backend#long" = """
此命令的守护进程运行在哪个 `GitBackend` 上，覆盖 config.toml 中的 `general.default_backend` 和 `GITPOULPI_GENERAL_DEFAULT_BACKEND`（命令行参数位于优先级最高处 - 见 docs/user/config-reference.md）。

它为此命令*启动*的守护进程选择后端。守护进程已在运行的会话会保持该守护进程构建时所用的后端；`gitpoulpi` 无法在已订阅的客户端之下替换运行中守护进程的后端，假装能做到只会重蹈此参数本要避免的那种静默无效。"""
"gitpoulpi --cwd_file" = """TUI 退出时（“退出并 cd 到此处”，或在 `ui.tab_dir_follow = "auto"` 时总是如此）写入活动标签页文件夹的文件。供 `gitpoulpi shell-init` 输出的包装器使用；所有子命令都会忽略它，因为只有 TUI 才有标签页"""
"gitpoulpi --json" = "输出结构化 JSON，而不是供人阅读的输出"
"gitpoulpi --lang" = "`--help` 文本的语言（en、fr、es、pt-BR、pt-PT、it、de、zh-CN、ja、ko、ru、uk、pl、cs、nl、sv、tr）"
"gitpoulpi --lang#long" = """
`--help` 文本的语言（en、fr、es、pt-BR、pt-PT、it、de、zh-CN、ja、ko、ru、uk、pl、cs、nl、sv、tr）。

只翻译说明 - 命令和参数名永不改变 - 并且除非给出此参数，`--help` 保持英文（有意忽略环境变量，使脚本得到稳定的输出）。示例：`gitpoulpi -l fr --help`。"""
"gitpoulpi --repo" = "要操作的仓库。默认为包含当前目录的仓库，因此 `gitpoulpi status` 的行为与 `git status` 类似；同时驱动多个仓库的代理应传入此参数，而不是 chdir"
"gitpoulpi --session" = "要使用的具名会话。省略时由当前仓库的根目录推导（见 `gitpoulpi_config::default_session_name`），因此两个仓库会得到两个独立的守护进程，而在同一仓库内打开的所有内容共享一个。传入此参数可强制让两个仓库使用同一会话，或显式命名会话。该值在使用前会被净化 - 它会变成文件名"
"hosting checkout-pr" = "检出一个 pull/merge request，包括来自 fork 的：将其 head（`refs/pull/<n>/head`、`refs/merge-requests/<n>/head`）fetch 到本地分支 `pr/<n>`（GitLab 上为 `mr/<n>`），跟踪它，并切换过去"
"hosting checkout-pr --id" = "哪个集成（见 `hosting prs`）"
"hosting checkout-pr --no_checkout" = "只 fetch 并创建/更新分支；留在原处"
"hosting checkout-pr --number" = "PR 编号（GitHub）或 MR 的 `iid`（GitLab）"
"hosting checkout-pr --remote" = "该请求所在的远程。默认为解析出该项目的那个远程，否则为仓库的默认远程"
"hosting clone" = "按完整路径从 `projects` 中克隆一个项目，通过托管平台解析克隆 URL，而不是让用户粘贴"
"hosting clone --https" = "通过 HTTPS 而不是 SSH 克隆"
"hosting clone --project" = "项目的完整路径，与 `hosting projects` 输出的一致"
"hosting edit-url" = "输出编辑某个 pull/merge request 的 URL（GitLab 的 `.../edit` 视图；GitHub 在请求页面上就地编辑）。给出编号时对应该请求；否则对应 `--branch`（默认：已检出的分支）的请求。与 `prs` 一样遵循仓库的 pull/merge request 关联。仅在使用 `--open` 时才启动浏览器"
"hosting edit-url --branch" = "改为按源分支查找请求"
"hosting edit-url --number" = "请求的编号（`!53` / `#53` 对应 `53`）"
"hosting edit-url --open" = "同时在系统浏览器中打开该 URL"
"hosting file" = "通过托管平台的 API 读取项目在某个修订下的一个文件，无需克隆：文本原样返回，其他字节以 base64 返回（`encoding`）。该修订下文件不存在时退出码为 1 并报错"
"hosting file --id" = "哪个集成（见 `hosting list`）；只配置了一个时可省略"
"hosting file --path" = "项目内的路径，如 `CLAUDE.md` 或 `src/main.rs`"
"hosting file --project" = "项目：GitHub 上为 `owner/name`，GitLab 上为 `group/sub/project`"
"hosting file --rev" = "修订：分支、标签或提交。默认为项目的默认分支"
"hosting integrations" = "管理已配置的集成配置（`[[integrations]]`）"
"hosting integrations add" = "添加任何已有客户端的类型的配置"
"hosting integrations add --id" = "默认为该类型的名称（`gitlab`、`gitlab-2`……）"
"hosting integrations add --kind" = "`github`, `github_enterprise`, `gitlab`, `gitlab_self_managed`, `azure_devops`, `azure_devops_server`, `bitbucket`, `jira_cloud`, `jira_data_center`, `trello`, `gitea`, `forgejo`, `linear`, `youtrack`, `redmine`, `gerrit` 或 `local_markdown`"
"hosting integrations add --name" = "显示名称"
"hosting integrations add --url" = "实例的网页根地址。自托管类型和 Jira 必填"
"hosting integrations list" = "已配置的配置，不含其令牌"
"hosting integrations radar" = "显示或更改某个配置的 Radar 设置（`[integrations.radar]`）：`hosting radar` 和 Radar 获取哪些账户范围的列表、要搜索的命名空间，以及评审未克隆仓库的请求时怎么做。不带选项时只输出当前设置"
"hosting integrations radar --assigned_issues" = "指派给你的未关闭议题，所有仓库"
"hosting integrations radar --clear_namespaces" = "忘掉已保存的命名空间：你自己的以及所有所属的"
"hosting integrations radar --id" = "配置"
"hosting integrations radar --include_drafts" = "在账户列表中保留草稿请求"
"hosting integrations radar --namespaces" = "要搜索未关闭请求的命名空间（组织、群组）；可重复该标志或用逗号分隔。会替换已保存的列表"
"hosting integrations radar --open_requests" = "你的命名空间中的所有未关闭请求"
"hosting integrations radar --review_mode" = "评审未克隆仓库的请求时怎么做"
"hosting integrations radar --review_requests" = "等待你评审的请求，所有仓库"
"hosting integrations remove" = "移除一个配置并删除其已存储的令牌"
"hosting integrations test" = "用该配置的令牌向其主机检查：用户、权限范围、过期时间"
"hosting issue" = "在当前仓库关联的项目上创建议题"
"hosting issue create" = "在仓库的“议题”来源所关联的项目（`hosting link issues`）上，或由 `--id` 根据远程解析出的项目上创建议题。对外的操作：会向托管平台发布内容"
"hosting issue create --body" = "议题描述"
"hosting issue create --body_file" = "从此文件读取描述（`-` 读取 stdin）"
"hosting issue create --id" = "哪个集成（见 `hosting issues`）"
"hosting issue create --labels" = "要应用的一个标签；可重复该参数，或用逗号分隔"
"hosting issue create --title" = "议题标题"
"hosting issue create --web" = "打印主机自带的预填新建议题页面，而不调用其 API（无需令牌）"
"hosting issues" = "当前仓库项目的议题"
