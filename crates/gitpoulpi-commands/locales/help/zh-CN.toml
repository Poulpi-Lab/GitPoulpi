"mailmap check" = "显示若干身份（`Name <email>` 或 `<email>`）经过仓库的 `.mailmap` 后的样子：规范姓名和邮箱，或在没有映射时仍是原身份。只读"
"mailmap check --identities" = "要解析的身份，每个为 `Name <email>` 或 `<email>`"
"mailmap list" = "列出范围内所有曾作为作者或提交者的姓名和邮箱，以及每个身份作为作者和作为提交者的提交数（按提交数从多到少），和 `.mailmap` 已把它映射到的身份（`mapped_to`）。只读"
"mailmap list --all_local" = "所有本地分支和 tag，而不只是当前分支"
"mailmap list --mapped" = "只显示 `.mailmap` 已映射的身份"
"mailmap list --refs" = "只处理这些本地分支或 tag（可重复）"
"mailmap list --unmapped" = "只显示 `.mailmap` 尚未映射的身份"
"rewrite preview --mailmap" = "mailmap 规则：把作者和提交者重写为工作树的 `.mailmap` 所指定的名字（历史最终显示的内容与 `git log --use-mailmap` 相同）。`--who` 选择作者、提交者或两者。若只想修正显示而不重写，请改用 `mailmap add`"
"rewrite preview --mailmap_file" = "配合 `--mailmap`：应用此文件，而不是工作树的 `.mailmap`（相对于仓库根目录，或绝对路径）"
"rewrite run --mailmap" = "mailmap 规则：把作者和提交者重写为工作树的 `.mailmap` 所指定的名字（历史最终显示的内容与 `git log --use-mailmap` 相同）。`--who` 选择作者、提交者或两者。若只想修正显示而不重写，请改用 `mailmap add`"
"rewrite run --mailmap_file" = "配合 `--mailmap`：应用此文件，而不是工作树的 `.mailmap`（相对于仓库根目录，或绝对路径）"
"rewrite analyze" = "历史的大小分析，类似 `filter-repo --analyze`：最大的 blob 及其路径、大小、首个和最后一个提交、是否仍在 HEAD 中，最大的文件夹，已从 HEAD 删除但历史仍保留的文件，以及合计值和删除仅存于历史的部分能释放多少（只是估计：仅在清除并 gc 之后才会生效）。用 `rewrite preview --remove-paths PATH` 或 `--remove-blobs-over BYTES` 删除它列出的内容。只读"
"rewrite analyze --all_local" = "分析所有本地分支和 tag，而不只是当前分支"
"rewrite analyze --refs" = "只分析这些本地分支或 tag（可重复）"
"rewrite analyze --since" = "配合当前分支：只分析此版本之后的提交"
"rewrite analyze --top" = "每个列表保留的行数（默认 50，最多 5000）"
"rewrite check-signing" = "用仓库的签名配置（`gpg.format`、`user.signingkey`、`gpg.*.program`）对一段测试数据签名一次并验证，作为重新签名的运行（`--signatures resign-signed` 或 `resign-all`）之前的冒烟测试。输出所用的程序、是否可用以及一次签名耗时（乘以要重新签名的提交数即可估算总时间）。可能会弹出口令输入。不可用时退出码为 2，并给出原因（`tool_missing` 或 `signing_failed`）"
"rewrite preview --remove_signatures" = "签名规则：移除范围内每个提交的签名，即使没有其他改动也一样。这些提交不需要回答 `--signatures`"
"rewrite preview --fix_message_encoding" = "消息规则：把提交消息重新编码为 UTF-8。带有 `encoding` 头（ISO-8859-1、Shift_JIS……）的消息会被解码并移除该头；曾被当作 Latin-1 或 Windows-1252 读取的 UTF-8（“RÃ©Ã©criture”）只有在往返转换完全一致时才会修复。无法判断的内容保持原样并计入统计（`encoding_left`）"
"rewrite preview --fix_name_encoding" = "配合 `--fix-message-encoding`：同时修复已乱码的作者和提交者姓名（头被移除的提交，其姓名总会随之解码）"
"rewrite run --remove_signatures" = "签名规则：移除范围内每个提交的签名，即使没有其他改动也一样。这些提交不需要回答 `--signatures`"
"rewrite run --fix_message_encoding" = "消息规则：把提交消息重新编码为 UTF-8。带有 `encoding` 头（ISO-8859-1、Shift_JIS……）的消息会被解码并移除该头；曾被当作 Latin-1 或 Windows-1252 读取的 UTF-8（“RÃ©Ã©criture”）只有在往返转换完全一致时才会修复。无法判断的内容保持原样并计入统计（`encoding_left`）"
"rewrite run --fix_name_encoding" = "配合 `--fix-message-encoding`：同时修复已乱码的作者和提交者姓名（头被移除的提交，其姓名总会随之解码）"
"rewrite preview --map_trailers" = "配合身份规则：除作者和提交者外，也映射匹配的身份尾部字段（`Signed-off-by`、`Co-authored-by` 等中的 `Name <email>`）"
"rewrite preview --trailer_add" = "尾部字段规则 `KEY=VALUE`：给每条消息添加此尾部字段（可重复；已有完全相同尾部字段的消息保持不变）"
"rewrite preview --trailer_map" = "尾部字段规则 `KEY:OLD=NEW`：替换该键的尾部字段值中的字面文本，例如 `Signed-off-by:@old.org=@new.org`（可重复）"
"rewrite preview --trailer_remove" = "尾部字段规则：移除所有该键的尾部字段（可重复）"
"rewrite preview --update_message_hashes" = "把消息中的缩写提交 id（7 位或更多十六进制字符）替换为新的 id；有歧义或未知的会保持原样并计入统计"
"rewrite run --map_trailers" = "配合身份规则：除作者和提交者外，也映射匹配的身份尾部字段（`Signed-off-by`、`Co-authored-by` 等中的 `Name <email>`）"
"rewrite run --trailer_add" = "尾部字段规则 `KEY=VALUE`：给每条消息添加此尾部字段（可重复；已有完全相同尾部字段的消息保持不变）"
"rewrite run --trailer_map" = "尾部字段规则 `KEY:OLD=NEW`：替换该键的尾部字段值中的字面文本，例如 `Signed-off-by:@old.org=@new.org`（可重复）"
"rewrite run --trailer_remove" = "尾部字段规则：移除所有该键的尾部字段（可重复）"
"rewrite run --update_message_hashes" = "把消息中的缩写提交 id（7 位或更多十六进制字符）替换为新的 id；有歧义或未知的会保持原样并计入统计"
"ai trust" = "Binds a profile's API key to the address it was stored for: shows what is trusted, or accepts the profile's current address (after its base URL changed), a self-hosted server's certificate, or plain http. Only a person runs this (it is not an agent tool)"
"ai trust --accept_certificate" = "Accept the certificate with this key fingerprint (SHA-256, hex)"
"ai trust --accept_origin" = "Accept the profile's current base URL (spelled exactly as the refusal printed it)"
"ai trust --allow_insecure_http" = "Allow a plain `http://` base URL that is not on this machine"
"ai trust --profile" = "The AI profile id"
"hosting integrations trust" = "Reviews the security check of a profile and accepts what it stopped: a new address, another account, a new certificate, plain http. Only a person runs this (it is not an agent tool). With no option it prints what is trusted and what is stopped"
"hosting integrations trust --accept_account" = "Accept this account id as the owner of the token"
"hosting integrations trust --accept_certificate" = "Accept the certificate with this key fingerprint (SHA-256, hex), exactly as the refusal printed it"
"hosting integrations trust --accept_origin" = "Accept the profile's current address (it must be spelled exactly as the refusal printed it)"
"hosting integrations trust --allow_insecure_http" = "Allow a plain `http://` address that is not on this machine"
"hosting integrations trust --id" = "The profile"
"hosting integrations trust --strict_tls" = "Hold the pinned certificate strictly: the key must match even when the certificate chains to a public root"
