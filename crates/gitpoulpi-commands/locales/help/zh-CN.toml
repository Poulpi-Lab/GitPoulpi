path = "把 GitPoulpi 加入用户 PATH，供新打开的终端使用"
"path add" = "把 GitPoulpi 所在的文件夹和别名文件夹加入用户 PATH，供新打开的终端使用：在 shell 启动文件中写入带标记的代码块（Linux、macOS），或写入注册表中的用户 PATH（Windows）。已在 PATH 中的文件夹不会改动"
