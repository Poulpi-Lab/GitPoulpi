[credentials]
https_mode = "credential_helper"

[ssh]
key_type = "ed25519"

[git]
default_encoding = "utf-8"
autocrlf = "unset"
eol = "native"
lfs_enabled = true
lfs_autofix_filters = true
pull_mode = "merge"
push_behavior = "direct"
push_group_preflight = true
merge_fast_forward = "never"

[mcp]
