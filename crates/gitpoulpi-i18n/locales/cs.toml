[help_text]
git_actions_then_amend = "upravit vybraný {$commit}: souhrn, popis, jméno, e-mail a datum autora v jednom okně"
git_actions_then_edit_author = "upravit jen autora vybraného {$commit}u (jméno, e-mail, datum)"
rewrite_1 = "otevře nástroj pro přepis historie: změna autorů, dat, zpráv, obsahu souborů nebo cest v celé historii nebo ve výběru"
rewrite_2 = "ukáže náhled změn podle pravidel a pak je provede jako jediný krok, který Zpět vezme zpět; Provést zůstává neaktivní, dokud je náhled zastaralý"
rewrite_3 = "zruší běžící náhled (totéž dělá Esc; druhé Esc zavře nástroj)"
rewrite_4 = "přidá pravidlo, smaže pravidlo pod kurzorem, obnoví naposledy smazané, duplikuje pravidlo"
rewrite_5 = "zapne nebo vypne pravidlo, nebo ho posune nahoru či dolů (pravidla se provádějí shora dolů)"
rewrite_6 = "přepíná mezi kartami náhledu"
rewrite_7 = "uloží sadu do repozitáře nebo jen pro vás, načte uloženou, přejmenuje ji; tajné hodnoty se nikdy neukládají"
rewrite_8 = "zahrne nebo vynechá všechny chráněné větve, které už jsou publikované; znovu zkontroluje externí nástroje"
file_history_1 = "přejít na {$commit} řádku v Logu a případně dočíst další Log, pokud tam ještě není"
file_history_2 = "posunout výběr; {$diff} vpravo ho okamžitě následuje"
file_history_3 = "rozšířit výběr na rozsah: vpravo se pak ukáže {$diff} souboru mezi oběma konci (Shift+klik dělá totéž)"
file_history_4 = "předat klávesnici {$diff}u, nebo ji vrátit seznamu"
file_history_5 = "kopírovat SHA {$commit}u nebo jeho shrnutí"
file_history_6 = "pravá strana: {$diff}, soubor tak, jak byl u tohoto {$commit}u, nebo jeho blame; sleduje výběr a pamatuje si režim"
file_history_7 = "porovnat verzi z řádku s pracovním stromem (dalším stiskem se vrátíte)"
file_history_8 = "obnovit soubor na tuto verzi v pracovním stromu (nejdřív se zeptá; Zpět vrátí staré bajty)"
file_history_9 = "změnit velikost seznamu (oddělovač jde také přetáhnout; šířka se pamatuje)"
file_history_10 = "myš: klik na řádek, Shift+klik pro rozsah, dvojklik ho ukáže v Logu, pravé tlačítko otevře nabídku"
commit_column_1 = "posouvat řádky do stran (Shift+kolečko nebo vodorovné kolečko dělá totéž); posouvají se jen tehdy, když je některá část širší než dostupné místo"
commit_column_2 = "vybrat část (dráhy, autor, datum), pak ji rozšířit nebo zúžit, nebo vrátit všechny části na automatickou šířku; hranice v záhlaví jdou také táhnout a šířky se pamatují"
commit_column_3 = "myš: klik na řádek vybere jeho commit, pravý klik otevře jeho nabídku (klávesa nabídky také, po výběru řádku šipkami Nahoru/Dolů)"
commit_column_4 = "přesune vybranou část doleva nebo doprava; totéž udělá přetažení její hlavičky a pořadí se zapamatuje"
log_columns_1 = "vyberte sloupec Logu (jeho buňka v hlavičce se rozsvítí); pak ho přesuňte doleva nebo doprava (totéž udělá přetažení hlavičky), rozšiřte nebo zúžte (totéž udělá přetažení jeho hranice), vraťte automatickou šířku, nebo ho přizpůsobte obsahu (totéž udělá dvojklik na jeho hranici; + přizpůsobí všechny sloupce). Tab / Shift+Tab vyberou jiný sloupec, Esc ukončí; rozložení se zapamatuje"
global_1 = "otevře paletu příkazů - každý příkaz aplikace i s jeho zkratkou; psaním filtrujete, Up/Down nebo Ctrl+P/Ctrl+N pohybují (ne j/k: ta se píší), Enter spustí. Zašedlé řádky říkají, proč teď nelze spustit"
global_2 = "předpona navigace - viz její vlastní sekce níže"
global_3 = "předpona akcí gitu - viz její vlastní sekce níže"
global_4 = "přepne tuto nápovědu - otevře se nad čímkoli dalším (Nastavení, Správa repozitářů, ...), nejen nad prostým grafem"
global_5 = "vynutí obnovení"
global_6 = { git = "fetch, nové ověření {$prs} a issues, znovu načtení", local = "načtení, nové ověření {$prs} a issues, znovu načtení" }
global_7 = "vrátí / zopakuje poslední operaci (commit, amend, checkout, vytvoření/smazání větve); u rizikových se nejdřív zeptá"
global_9 = { git = "ukončí - z grafu; nad diffem nebo pohledem na soubor místo toho zavře tento pohled. Každé ukončení se zapisuje do gitpoulpi-tui-exit.log vedle konfigurace", local = "ukončí - z grafu; nad rozdílem nebo pohledem na soubor místo toho zavře tento pohled. Každé ukončení se zapisuje do gitpoulpi-tui-exit.log vedle konfigurace" }
global_10 = "otevře kontextovou nabídku, kdekoli níže existuje - klávesy jsou zaměnitelné (klávesa Menu/Apps do této aplikace ve Windows málokdy dorazí, takže tam spolehlivě funguje kombinace F10)"
global_11 = "přepne fokus na další / předchozí panel"
global_12 = "posune výběr (každý panel a seznam)"
global_13 = "předpona počtu ve stylu vimu pro j/k/Up/Down (a PageUp/PageDown, jako počet obrazovek) - napsané číslice se ve stavovém řádku ukazují jako „4...“, dokud pohyb nedoběhne; Esc nebo jiná klávesa ji zruší a úvodní 0 ji nikdy nezačne (číslice se tak dál normálně píší do composeru, filtru Refs i každého jiného textového pole)"
global_14 = "Refs: přepne sekci LOKÁLNÍ/REMOTE/{$TAGS}"
global_15 = "Log: h = zpět ze seznamu / l = do seznamu souborů commitu"
global_16 = { git = "Stav: skok na Unstaged / Staged", local = "Stav: skok na Mimo index / V indexu" }
mouse_basics_1 = "vybere a zaostří řádek (každý panel, seznam, nabídku, dialog); kolečko posouvá to, nad čím je ukazatel"
mouse_basics_2 = "otevře/aktivuje: ref v LOKÁLNÍ/{$TAGS} nebo pilulka refu v řádku Logu provede checkout, změněný soubor otevře {$diff}, řádek repozitáře otevře ten repozitář"
mouse_basics_3 = "jediný signál „na toto lze kliknout“, který většina terminálů dává (viz „Najetí a tooltipy“ níže) - také úplné tooltipy nad buňkami Logu a zkrácenými odznaky refů"
mouse_basics_4 = "dělič panelu, hranice sloupce Logu, spodní okraj sekce Refs nebo spodní okraj bloku zprávy commitu mění velikost (pod minimem se místo toho sbalí); záhlaví sloupce Logu přetažené přes souseda sloupec přeřadí"
mouse_basics_5 = "(pravý horní roh) ukončí, stejně jako q - zobrazí se jen, když je okno dost široké, aby se nepřekrývalo s textem titulku"
navigation_prefix_then_1 = "sbalí/obnoví panel Refs (vlevo)"
navigation_prefix_then_2 = "sbalí/obnoví panel Stav (vpravo) - myší klikněte na šipku na okraji panelu nebo na tenký pruh, který po sbalení zůstane"
