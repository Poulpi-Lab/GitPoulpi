start_1 = "Okno|Karty nahoře (Domů vypisuje, otevírá a klonuje repozitáře), pak panel nástrojů, vlevo postranní panel Refs, uprostřed Log a vpravo změny a formulář commitu."
start_2 = "Paleta příkazů|Ctrl+P vypíše každou akci s její zkratkou. Pište pro hledání, Enter ji spustí. Cokoli umí myš, umí i paleta."
start_3 = "Předpony zkratek|Ctrl+G a pak klávesa spustí akci gitu ({$stage}, {$commit}, {$pull}, {$push}...). Ctrl+N a pak klávesa přesune nebo změní zobrazení. Stavový řádek vypisuje volby."
start_4 = "Karty|Jedna karta na repozitář. Ctrl+PgUp / Ctrl+PgDn přepínají, Ctrl+W zavře, t otevře výběr karet, pravé tlačítko na kartě nebo Ctrl+T otevře její nabídku."
start_5 = "Myš a klávesy|Klik vybere, dvojklik otevře nebo provede checkout, pravé tlačítko (nebo .) otevře nabídku, tažení přesouvá refy a řádky {$rebase}. Každá akce myší má klávesu."
start_6 = "Obnovit a vrátit|r obnoví, F5 vše znovu načte, Ctrl+Z / Ctrl+Y vrátí a zopakuje poslední operaci, q ukončí."
log_1 = "Čtení grafu|Jeden řádek na commit, jedna větev na dráhu. První řádek je vaše necommitnutá práce (WIP): vyberte ho a uvidíte změny. Klik na řádek ukáže podrobnosti vpravo."
log_2 = "Hledání|f (nebo tlačítko Hledat) ztlumí řádky, které neodpovídají zprávě, autorovi, hashi nebo refu. Enter / Shift+Enter skočí na další / předchozí shodu. / filtruje panel Refs."
log_3 = { git = "Nabídka commitu|Pravé tlačítko na commit nebo . na něm: cherry-pick, revert, reset, úprava zprávy, vytvoření větve nebo tagu, checkout, worktree, patch, kopírování.", local = "Nabídka commitu|Pravé tlačítko na commit nebo . na něm: cherry-pick, revert, reset, úprava zprávy, vytvoření větve nebo značky, checkout, worktree, patch, kopírování." }
log_4 = "Interaktivní {$rebase}|„Interaktivní rebase odsud...“ v nabídce commitu: nastavte každý commit na {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} nebo {$edit}, přeuspořádejte Ctrl+Up/Down, spusťte Ctrl+S, opusťte Esc."
log_5 = "Více commitů|Ctrl+klik přepne commit, Shift+klik (Alt+klik) vybere rozsah, Space přepne aktuální, Esc zruší. Pak pravé tlačítko pro {$cherry_pick} nebo revert celého výběru."
log_6 = { git = "Tažení refů|Přetáhněte větev na jinou pro merge, rebase nebo fast-forward, nebo na vzdálenou větev pro push; pusťte a vyberte z nabídky, Esc zruší. Klávesnice: paleta, „Refs: Pustit vybraný ref na přepnutou větev...“.", local = "Tažení refů|Přetáhněte větev na jinou pro sloučení, rebase nebo fast-forward, nebo na vzdálenou větev pro odeslání; pusťte a vyberte z nabídky, Esc zruší. Klávesnice: paleta, „Refs: Pustit vybraný ref na přepnutou větev...“." }
changes_1 = "Probíhající změny|Vyberte první řádek Logu (WIP): soubory {$unstaged} a {$staged} se objeví vpravo. m přepíná Cesta / Strom, a ukáže všechny soubory, z sbalí složky."
changes_2 = { git = "Stage a unstage|Ctrl+Space na souboru, jeho tlačítko nebo Ctrl+G s; Ctrl+G a pro vše, Ctrl+G u pro unstage. Pravé tlačítko na souboru: zahodit, historie či blame, otevřít v editoru.", local = "Přidání a odebrání z indexu|Ctrl+Space na souboru, jeho tlačítko nebo Ctrl+G s; Ctrl+G a pro vše, Ctrl+G u pro odebrání z indexu. Pravé tlačítko na souboru: zahodit, historie či blame, otevřít v editoru." }
changes_3 = { git = "Čtení diffu|Klikněte na soubor nebo stiskněte d. m přepíná sjednocené / vedle sebe, w zalamuje řádky, s ignoruje mezery, n / p skáčou mezi hunky, Esc nebo q vrátí do Logu.", local = "Čtení rozdílu|Klikněte na soubor nebo stiskněte d. m přepíná sjednocené / vedle sebe, w zalamuje řádky, s ignoruje mezery, n / p skáčou mezi hunky, Esc nebo q vrátí do Logu." }
changes_4 = { git = "Hunky a řádky|V diffu: Space = stage hunku, v pak j / k pak Enter = stage vybraných řádků, x = zahodit hunk. Zahození se nejprve ptá; Ctrl+Z vrátí.", local = "Hunky a řádky|V rozdílu: Space = přidat hunk do indexu, v pak j / k pak Enter = přidat vybrané řádky do indexu, x = zahodit hunk. Zahození se nejprve ptá; Ctrl+Z vrátí." }
changes_5 = "Psaní commitu|Napište souhrn a popis, pak Ctrl+Enter nebo zelené tlačítko. Shift+A opraví poslední commit. Ctrl+G c přesune kurzor do formuláře, Esc ho opustí."
changes_6 = { git = "Konflikty merge|Lišta nabízí „Vyřešit konflikty...“. V editoru merge vyberte A, B nebo obojí pro každý konflikt (a / b / c), upravte Výstup, uložte, pak Pokračovat.", local = "Konflikty při slučování|Lišta nabízí „Vyřešit konflikty...“. V editoru konfliktů vyberte A, B nebo obojí pro každý konflikt (a / b / c), upravte Výstup, uložte, pak Pokračovat." }
changes_7 = { git = "Zpět a znovu|Ctrl+Z / Ctrl+Y nebo tlačítka panelu vrací a opakují většinu operací: commity, větve, checkouty, resety, stashe, zahození. Při riziku se nejprve zeptá.", local = "Zpět a znovu|Ctrl+Z / Ctrl+Y nebo tlačítka panelu vrací a opakují většinu operací: commity, větve, checkouty, resety, odložené změny, zahození. Při riziku se nejprve zeptá." }
refs_1 = { git = "Větve a tagy|Dvojklik na lokální větev nebo tag provede checkout; pravé tlačítko otevře nabídku (merge, rebase, přejmenování, smazání...). Ctrl+G b a Ctrl+G t vytvoří větev nebo tag na aktuálním commitu.", local = "Větve a značky|Dvojklik na lokální větev nebo značku provede checkout; pravé tlačítko otevře nabídku (sloučení, rebase, přejmenování, smazání...). Ctrl+G b a Ctrl+G t vytvoří větev nebo značku na aktuálním commitu." }
refs_2 = "Solo a skrytí|Klávesa o ukáže jen commity vybraného refu, Shift+O skončí. Nabídka refu ho skryje v grafu; Shift+H ukáže vše znovu. Jen zobrazení: repozitář se nemění."
refs_3 = { git = "Fetch, pull, push|Ctrl+G f: fetch všech remote. Ctrl+G p: pull. Ctrl+G Shift+P: push. Šipka u tlačítka vybere jiný způsob nebo jiný vzdálený repozitář.", local = "Načtení, stažení, odeslání|Ctrl+G f: načte všechny remote. Ctrl+G p: stáhne. Ctrl+G Shift+P: odešle. Šipka u tlačítka vybere jiný způsob nebo jiný vzdálený repozitář." }
refs_4 = "Remote|Plus v nadpisu REMOTE jeden přidá. Pravé tlačítko na remote: {$fetch}, kopírování odkazu, úprava URL nebo odebrání."
refs_5 = { git = "Stashe a worktrees|Tlačítka Stash a Pop; Ctrl+G m se nejprve zeptá na zprávu. Pravé tlačítko na stashi pro apply nebo drop. „Vytvořit worktree z...“ otevře větev ve vlastní kartě.", local = "Odložené změny a worktrees|Tlačítka Odložit a Pop; Ctrl+G m se nejprve zeptá na zprávu. Pravé tlačítko na odložených změnách pro jejich použití nebo zahození. „Vytvořit worktree z...“ otevře větev ve vlastní kartě." }
refs_6 = "Submoduly a LFS|Sekce SUBMODULY se objeví, pokud nějaké jsou: dvojklik otevře submodul jako kartu, pravé tlačítko ho aktualizuje. Akce Git LFS: tlačítko LFS nebo Ctrl+G l."
hosting_1 = "Připojení|Nastavení > Integrace: vložte osobní token pro GitHub nebo GitLab. Účet není potřeba; token jde do systémového správce přihlašovacích údajů."
hosting_2 = "Propojení repozitáře|V sekcích {$PRS} a ISSUES postranního panelu vyberte jednoho z nabízených poskytovatelů. Nic se nepropojí samo; propojení se ukládá pro každý repozitář."
hosting_3 = "Vytvoření {$pr_abbr}|Plus v záhlaví {$PRS} nebo n v této sekci otevře formulář; nabídka větve má „Založit {$pr} z...“. AI umí napsat název a popis."
hosting_4 = "Issues|Sekce ISSUES je vypisuje; + nebo n vytvoří nové. Nabídka řádku ho otevře v prohlížeči nebo na něm něco provede."
hosting_5 = "Odkazy|Odkazy na issues a {$prs} (#12, !53, ABC-7) ve zprávě commitu nebo názvu větve se rozpoznají. Alt+R ve formuláři commitu jeden vloží."
hosting_6 = "Čip v panelu|Vlevo v panelu nástrojů čip ukazuje {$pr} aktuální větve (GH #12, GL !53) nebo ztlumené „+ {$pr_abbr}“ pro založení. Klikněte na něj."
hosting_7 = "Klíče SSH|Vyberte klíč SSH pro profil (Nastavení > Profily) nebo pro repozitář (nabídka karty > „Klíč SSH...“). Hesla zůstávají v systémovém ssh-agentu."
setup_1 = "Nastavení|Ctrl+, nebo ozubené kolo. Tab přepíná mezi seznamem stránek a volbami, j / k posouvají, Enter nebo Space změní hodnotu, / nebo Ctrl+F hledá ve všech volbách, Esc zavře."
setup_2 = "Motivy|Nastavení > Vzhled > Motiv: tmavý, světlý, podle terminálu nebo jedna z mnoha předvoleb. Ctrl+N a klávesa změní i motiv, jazyk a barvy grafu bez otevření Nastavení."
setup_3 = "Jazyk|Nastavení > Obecné > Jazyk nabízí 17 jazyků. „Překládat výrazy gitu“ určuje, zda se přeloží i vlastní slova gitu ({$commit}, {$push}...)."
setup_4 = "Profily|Nastavení > Profily obsahuje identity pro commity (jméno, e-mail, klíč SSH). Pole profilu v panelu nástrojů vybere identitu pro tento repozitář."
setup_5 = "Otevřít v|Tlačítko Otevřít v (Alt+O) otevře složku této karty v terminálu, editoru nebo správci souborů. Nastavení > Otevřít v upravuje seznam."
setup_6 = "Klávesové zkratky|Nastavení > Klávesnice a myš přiřadí libovolnou klávesu jinak. Karta Klávesy v této nápovědě ukazuje vaše vlastní zkratky."
tools_1 = "AI (volitelná)|Vypnutá, dokud ji nenastavíte v Nastavení > AI: služba kompatibilní s OpenAI, Anthropic nebo místní agent jako claude -p. Účet GitPoulpi není nikdy potřeba."
tools_2 = "Akce AI|Tlačítko jiskry u souhrnu nebo Ctrl+G i napíše zprávu commitu; Ctrl+G w vysvětlí změny; Ctrl+G C rozdělí práci na více commitů; Alt+I navrhne řešení konfliktu. Nic se nepoužije bez vašeho potvrzení."
tools_3 = "CLI|gitpoulpi <příkaz> ze skriptu dělá to, co okno, přes stejného démona, takže se změny objeví živě. --json dává strojový výstup, --help vypíše volby."
tools_4 = "MCP|gitpoulpi mcp serve --stdio dává agentům AI jeden nástroj na příkaz CLI. Nastavení > Agenti a MCP určuje, co smějí měnit."
tools_5 = "Obal shellu|S obalem shellu gp nechá „Konec a cd sem“ váš shell ve složce aktivní karty, když se GitPoulpi ukončí."

