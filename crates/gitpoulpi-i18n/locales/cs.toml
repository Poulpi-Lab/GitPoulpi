review_threads_help = "Stávající komentáře se uvádějí, aby je model neopakoval. Nad touto velikostí se seznam ořízne, až po otázce: odeslat celý, odeslat zkráceně, otevřít toto nastavení, nebo zrušit. Výchozí je 6000."
# context: Settings > AI, label of a number: the most bytes of one project context file (CLAUDE.md, AGENTS.md, the extra file) given to a code review
