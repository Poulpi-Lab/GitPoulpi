diff_help = { git = "Nad touto velikostí se nic neořezává potichu: dostanete otázku, zda odeslat celý {$diff}, odeslat ho zkráceně, otevřít toto nastavení, nebo zrušit. Platí pro zprávu {$commit}u, vysvětlení, název stashe, popis žádosti, plán {$commits} a rozdělení, a pro celý {$diff} revize kódu. Výchozí je 60000.", local = "Nad touto velikostí se nic neořezává potichu: dostanete otázku, zda odeslat celý {$diff}, odeslat ho zkráceně, otevřít toto nastavení, nebo zrušit. Platí pro zprávu {$commit}u, vysvětlení, název odložených změn, popis žádosti, plán {$commits} a rozdělení, a pro celý {$diff} revize kódu. Výchozí je 60000." }
# context: Settings > AI, label of a number: the most bytes of one file's {$diff} in a code review
review_file_label = "Největší {$diff} souboru v revizi (bajty)"
# context: help under that number
review_file_help = "Nad touto velikostí se {$diff} jednoho souboru v revizi kódu ořízne, až po otázce: odeslat celý, odeslat zkráceně, otevřít toto nastavení, nebo zrušit. Výchozí je 12000."
# context: Settings > AI, label of a number: the most bytes of the description of the reviewed request
