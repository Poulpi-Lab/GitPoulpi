[settings_ssh]
private_key_path = "Cesta k soukromému klíči"
private_key_path_help = { git = "Soubor klíče, který fetch, pull, push a clone nabízejí ssh (ssh -i <klíč> -o IdentitiesOnly=yes). Prázdné: ssh-agent a vaše konfigurace ssh jako obvykle. Ignoruje se, je-li nastaveno GIT_SSH_COMMAND nebo core.sshCommand (např. klíč SSH pro tento repozitář). Platí od dalšího přenosu.", local = "Soubor klíče, který načítání, stahování, odesílání a klonování nabízejí ssh (ssh -i <klíč> -o IdentitiesOnly=yes). Prázdné: ssh-agent a vaše konfigurace ssh jako obvykle. Ignoruje se, je-li nastaveno GIT_SSH_COMMAND nebo core.sshCommand (např. klíč SSH pro tento repozitář). Platí od dalšího přenosu." }
public_key_path = "Cesta k veřejnému klíči"
public_key_path_help = "Použije se jen když je cesta k soukromému klíči prázdná: ssh pak vybere odpovídající klíč z ssh-agentu (nebo hardwarový klíč) místo nabízení všech klíčů agenta. Vygenerovat pár klíčů vyplní obojí. Stejná přednost jako cesta k soukromému klíči."
key_type = "Typ klíče"
heading_https_credentials = "Přihlašovací údaje HTTPS"
https_mode = "Přihlašovací údaje HTTPS"
https_mode_help = { git = "Jak se fetch, pull, push a clone ověřují přes HTTPS. credential_helper: vlastní helper gitu (Git Credential Manager, libsecret, Keychain). prompt: ignoruje helper a nechá git ptát se v terminálu. none: žádné přihlašovací údaje, jen veřejné remote. Platí od dalšího přenosu.", local = "Jak se načítání, stahování, odesílání a klonování ověřují přes HTTPS. credential_helper: vlastní helper gitu (Git Credential Manager, libsecret, Keychain). prompt: ignoruje helper a nechá git ptát se v terminálu. none: žádné přihlašovací údaje, jen veřejné remote. Platí od dalšího přenosu." }
heading_keys = "Klíče"
generate_key_pair = "Vygenerovat pár klíčů"
generate_key_pair_help = "Vygeneruje pár klíčů ed25519 přímo v programu (bez ssh-keygen a bez hesla) jako ~/.ssh/gitpoulpi_ed25519, nikdy nepřepíše soubor a zaznamená obě cesty výše. Veřejný klíč přidáte k hostiteli v Integracích."

[settings_editor]
tab_size = "Velikost tabulátoru"
tab_size_help = { git = "Počet sloupců mezi zarážkami tabulátoru ve vestavěném editoru (kreslení, Shift+Tab) a v zobrazeních diff. Zobrazení blame kreslí tabulátor jako jednu mezeru a ignoruje ho.", local = "Počet sloupců mezi zarážkami tabulátoru ve vestavěném editoru (kreslení, Shift+Tab) a v zobrazeních rozdílů. Zobrazení blame kreslí tabulátor jako jednu mezeru a ignoruje ho." }
eol = "Konec řádku"
eol_help = "Co vestavěný editor zapisuje při ukládání. Auto ponechá konec řádku souboru (LF u nového); LF nebo CRLF soubor při uložení převede. Stavový řádek editoru ukazuje, co zapíše další uložení."
syntax_highlighting = "Zvýrazňování syntaxe"
syntax_highlighting_help = { git = "Obarví vestavěný editor podle jazyka. Zobrazení diff a blame se syntaxí nebarví.", local = "Obarví vestavěný editor podle jazyka. Zobrazení rozdílů a blame se syntaxí nebarví." }
line_numbers = "Čísla řádků"
line_numbers_help = { git = "Sloupec čísel ve vestavěném editoru a v zobrazeních diff (tam je prázdný, sloupce zůstanou na místě). Zobrazení blame žádná nemá.", local = "Sloupec čísel ve vestavěném editoru a v zobrazeních rozdílů (tam je prázdný, sloupce zůstanou na místě). Zobrazení blame žádná nemá." }
follow_selection = "Sledovat výběr v editoru"
follow_selection_help = "Dokud je editor otevřený, výběr jiného souboru v pravém panelu jej otevře i v editoru, a to po dotazu, zda uložit neuložené změny. Soubor, který nelze upravovat, se otevře v obvyklém zobrazení."
merge_side_by_side_min_width = { git = "Editor merge: vedle sebe od (sloupců)", local = "Editor sloučení: vedle sebe od (sloupců)" }
merge_side_by_side_min_width_help = { git = "Editor konfliktů merge ukazuje A a B vedle sebe, má-li jeho plocha alespoň tolik sloupců (dlouhé řádky se posouvají do stran Shift+kolečkem nebo Shift+šipkami); užší ukazuje vždy jednu stranu za záložkami. Výchozí 100; nejnižší hodnota je 40, 0 znamená vždy vedle sebe. Editor při otevření skrývá panely Refs a Stav, takže má obvykle celé okno.", local = "Editor konfliktů při sloučení ukazuje A a B vedle sebe, má-li jeho plocha alespoň tolik sloupců (dlouhé řádky se posouvají do stran Shift+kolečkem nebo Shift+šipkami); užší ukazuje vždy jednu stranu za záložkami. Výchozí 100; nejnižší hodnota je 40, 0 znamená vždy vedle sebe. Editor při otevření skrývá panely Refs a Stav, takže má obvykle celé okno." }
diff_word_wrap = "Zalamování řádků"
diff_word_wrap_help = { git = "Zalomí dlouhé řádky v zobrazeních diff místo oříznutí třemi tečkami. Vestavěný editor a zobrazení blame se posouvají do stran a nezalamují. Je to i vlastní přepínač zalamování diffu.", local = "Zalomí dlouhé řádky v zobrazeních rozdílů místo oříznutí třemi tečkami. Vestavěný editor a zobrazení blame se posouvají do stran a nezalamují. Je to i vlastní přepínač zalamování rozdílu." }

[settings_ui]
theme = "Motiv"
theme_help = "Barvy celého rozhraní. Procházení seznamem zobrazuje náhled každého motivu; Enter ho ponechá, Esc se vrátí. Systém následuje terminál (jeho světlé nebo tmavé pozadí, zjištěné jednou při spuštění; Tmavý, pokud ho nelze zjistit). Vaše vlastní soubory motivů ve složce themes/ konfigurace jsou na konci."
theme_system = "Systém (podle terminálu)"
follow_theme = "Podle motivu"
theme_swatches = "Barvy"
graph_lane_background = "Pozadí drah grafu"
graph_lane_background_help = "Vypnuto: průhledné, za drahami nic (výchozí). Podbarvení řádku: slabý pruh barvy dráhy commitu uvnitř sloupce Graph a tenký proužek této barvy na pravém okraji sloupce. Uložená hodnota lane se čte jako Podbarvení řádku. Platí po zavření Předvoleb."
graph_row_tint_strength = "Síla podbarvení řádku"
graph_row_tint_strength_help = "Jak vyblednutý je pruh podbarvení řádku: Silné (původní), Střední (výchozí) nebo Jemné. Bledne jen pruh; proužek na pravém okraji sloupce má plnou barvu. Platí po zavření Předvoleb."
graph_row_tint_strength_coming = "nejdřív nastavte Pozadí drah grafu na Podbarvení řádku"
toolbar_position = "Umístění panelu nástrojů"
toolbar_position_help = "Kde je panel nástrojů: Nahoře, Dole (výchozí), Vlevo nebo Vpravo. Vlevo a Vpravo z něj udělají sloupec vedle panelů; v okně užším než 80 sloupců se kreslí dole. Projeví se hned."
toolbar_align = "Zarovnání tlačítek panelu nástrojů"
toolbar_align_help = "Kde leží tlačítka podél panelu: Začátek (výchozí), Střed nebo Konec. Začátek je levá strana řádku a horní část sloupce; konec je pravá strana a spodek. Projeví se hned."
toolbar_pr_pinned = "Připnout tlačítko {$pr} na konec"
toolbar_pr_pinned_help = "Zapnuto (výchozí): tlačítko {$pr} leží na samém konci panelu nástrojů (vpravo, ve sloupci dole) při jakémkoli zarovnání. Vypnuto: plyne spolu s ostatními tlačítky a zarovnává se s nimi. Projeví se hned."
statusbar_position = "Umístění stavového řádku"
statusbar_position_help = "Kde je stavový řádek (větev, počty, zprávy, nápověda kláves): Nahoře, nad kartami repozitářů, nebo Dole (výchozí). Karta Domů si ponechává vlastní stavový řádek dole. Projeví se hned."
tabs_position = "Umístění lišty karet"
tabs_position_help = "Kde jsou karty repozitářů: Nahoře (výchozí), Dole nebo Vlevo, seznam s jednou kartou na řádek u levého okraje okna. V okně užším než 80 sloupců se kreslí nahoře. Vedle panelu nástrojů jako sloupce zůstávají karty nejvíc vně. Projeví se hned."
graph_color_theme = "Barevný motiv grafu"
graph_color_theme_help = "Paleta barev drah grafu v Logu. „Podle motivu“ použije paletu zvoleného motivu; jakákoli jiná položka ji přepíše, takže lze spojit libovolný motiv s libovolnou paletou. Platí po zavření předvoleb."
graph_renderer = "Vykreslování grafu"
graph_renderer_help = "auto kreslí graf jako skutečný obrázek v terminálu, který to umí, a jinde znaky - i uvnitř tmux nebo zellij, které dědí prostředí terminálu, ale obrázek nepropouštějí, a uvnitř herdr, pokud není zapnuto jeho kitty_graphics. obrázek vynutí obrázek, text ho zakáže. Vyžaduje restart."
image_protocol = "Protokol obrázků"
image_protocol_help = "Jak se obrázky (obrázek grafu, avatary autorů) dostanou do terminálu. auto: protokol Kitty graphics v kitty, Ghostty a herdr, jehož konfigurace nastavuje kitty_graphics = true; vložené obrázky iTerm2 ve WezTerm, iTerm2 a mintty; obrázky sixel (jen avatary autorů, graf zůstává ze znaků) ve Windows Terminal, foot, Konsole a mlterm; jinde znaky. kitty, iterm2 nebo sixel vynutí protokol (kitty pro herdr s konfigurací jinde; sixel pro terminál, který sixel kreslí, ale nepozná se); none obrázky vypne. Vyžaduje restart."
kitty_keyboard = "Klávesnicový protokol Kitty"
kitty_keyboard_help = "auto se při startu do asi 100 ms zeptá terminálu, zda umí klávesnicový protokol kitty, a pokud ano, použije ho: akordy, které starší terminály nerozliší (Control s interpunkcí, číslicemi, Shiftem nebo Enterem), pak dorazí samy za sebe místo kolize s řídicími kódy. Terminál, který neodpoví, zůstane u starých kláves. off se klávesnicového režimu terminálu nikdy nedotkne. Vyžaduje restart."
color_depth = "Barevná hloubka"
color_depth_help = "auto používá 24bitové barvy, kromě terminálů, které je nezobrazují (Apple Terminal, konzole Linuxu nebo 256barevný terminál bez COLORTERM), kde se barvy převedou na nejbližší z 256 nebo 16 položek. truecolor, 256 a 16 hloubku vynutí. Platí okamžitě."
graph_show_stashes = { git = "Zobrazit stashe v grafu", local = "Zobrazit odložené změny v grafu" }
graph_show_stashes_help = { git = "Každý stash dostane v Logu vlastní řádek v čase svého vzniku: malý box na dráze vedle commitu, na kterém vznikl, spojený s ním čárkovanou čárou. Výběr ukáže, co změnil; pravé tlačítko (nebo .) nabídne Pop, Apply a Drop. Vypnuto nechá stashe jen v sekci STASHES. Při solo se nekreslí.", local = "Každé odložení dostane v Logu vlastní řádek v čase svého vzniku: malý box na dráze vedle commitu, na kterém vzniklo, spojený s ním čárkovanou čárou. Výběr ukáže, co změnilo; pravé tlačítko (nebo .) nabídne Obnovit, Použít a Zahodit. Vypnuto nechá odložené změny jen v sekci ODLOŽENÉ ZMĚNY. Při solo se nekreslí." }
ref_connector = "Spojnice ref–commit"
ref_connector_help = "Tenká čára od každé pilulky ref ve sloupci Ref ke kolečku jejího commitu v grafu. Vyplňuje jen volné místo: dráhy, kterými prochází, zůstávají nahoře a nic se neposouvá. Kreslí se jen, když je sloupec Ref hned vlevo od sloupce Graph."
log_wip_counts_in_message = "Zobrazit počty změn WIP ve zprávě, když je sloupec Změny skrytý"
log_wip_counts_in_message_help = "Řádek WIP ukazuje, kolik souborů je změněno, přidáno a smazáno. Při viditelném sloupci Změny (pravé tlačítko na záhlaví Logu ho zobrazí) jsou počty vždy v něm, jako u každého commitu. Při skrytém jsou ve zprávě WIP, dokud je toto zapnuto; vypnuto nezobrazí počty vůbec."
avatars = "Avatary autorů"
avatars_help = "Obrázky autorů. graf kreslí autora každého commitu do jeho kolečka v grafu (jen obrazový graf; v textovém grafu je ve sloupci Autor místo toho barevná iniciála). autor dá kulatý obrázek na začátek sloupce Autor. Oba ho ukazují i v panelu detailu commitu. Ve výchozím stavu vypnuto: zapnutí posílá hash SHA-256 e-mailové adresy každého autora na gravatar.com přes HTTPS - hash známé nebo uhodnutelné adresy není anonymní - a v repozitáři s remote na github.com se jednou na autora zeptá API GitHubu, který účet vytvořil jeden z jeho commitů (s tokenem vaší integrace GitHub, pokud existuje). Dokud obrázek nedorazí, a když žádný neexistuje, zobrazí se iniciály nebo prosté kolečko. vypnuto neposílá po síti nic."
avatar_sources = "Zdroje avatarů"
avatar_sources_help = "Kde se obrázek autora hledá, v tomto pořadí (noreply adresa GitHubu vždy nejdřív určí svůj účet). hosting_gravatar: připojená integrace GitHub, GitLab nebo Bitbucket, jejíž hostitel odpovídá remote repozitáře (autor commitu či vyhledání uživatele na GitHubu, avatar podle e-mailu či API uživatelů na GitLabu), pak Gravatar; bez odpovídající integrace je první Gravatar a remote na github.com se nakonec ještě zeptá bez přihlášení. gravatar_hosting: obráceně. gravatar nebo hosting: jen ten jeden. Když obrázek nemá žádný, nakreslí se náhradní avatar níže. Platí pro autory, kteří ještě nebyli vyhledáni."
avatar_fallback = "Náhradní avatar"
avatar_fallback_help = "Co dostane autor bez obrázku. identicon: zrcadlový vzor 5x5 jako na GitHubu v barvě odvozené z jeho e-mailu, generovaný lokálně (bez sítě), jako obrázek v terminálu s obrázky a jinde jako blokové znaky. iniciály: barevný odznak s iniciálami."
composer_files = "Návrhy Composeru"
composer_files_help = "Jak se otevírá kontrola AI composeru commitů. rozbalené: každý navržený commit vypíše své soubory. sbalené: jen řádky commitů; Right/Left (nebo klik na šipku) jeden otevře."
blame_side = "Anotace blame"
blame_side_help = "Na které straně pohledu Blame je sloupec anotací (avatar, autor, stáří, shrnutí). right: vpravo od kódu. left: vlevo od kódu."
column_resize = "Změna velikosti sloupců"
column_resize_help = "Jak se chytá hranice sloupce v Logu, v Radaru a v bočním sloupci zobrazení souborů. line: tenká čára přes celou výšku tabulky, dokud je ukazatel na hranici, s malou značkou v záhlaví. header: bez mezery a bez značky, velikost se mění jen ze záhlaví, kde se rozsvítí první znak následující buňky."
blame_width = "Šířka anotací blame"
blame_width_help = "Šířka sloupce anotací v buňkách (24 až 90). Táhněte za jeho okraj v pohledu Blame nebo použijte klávesy pro rozšíření / zúžení; nová šířka se uloží sem."
ref_tree = "Strom složek větví"
ref_tree_help = "Postranní panel Refs seskupuje názvy větví podle `/` do sbalitelných složek, každý remote jako vlastní uzel nejvyšší úrovně. Vypnuto dá jeden plochý řádek na větev. `y` v panelu Refs to přepíná živě a volbu zde zapíše."
reveal_on_ref_click = "Kliknutí na ref ho ukáže v grafu"
reveal_on_ref_click_help = "Jedno kliknutí na ref v panelu Refs posune Log tam, kam ref ukazuje, a řádek krátce zvýrazní. Výběr v Logu a pravý panel zůstanou, jak jsou. Vypnuto, kliknutí jen vybere řádek postranního panelu. „Ukázat v grafu“ v nabídce refu, jeho klávesa v panelu Refs a příkaz v paletě fungují v obou případech."
graph_ghost_ref = { git = "Zobrazit zástupnou větev u najetého commitu", local = "Zobrazit zástupnou větev u najetého commitu" }
graph_ghost_ref_help = "Ve sloupci Ref v Logu se u najetého {$commit}, který nemá vlastní ref, zobrazí vybledlá pilulka s názvem větve, do které patří (jinak vzdálené větve), odvozené z historie. Najetí na pilulku ukáže její druh. Kliknutí nedělá nic zvláštního; větev vytvoří příkaz pro vytvoření větve. Kreslí se jen tam, kde je ve sloupci Ref místo. Vypnuto: pilulka se skryje."
mouse_enabled = "Myš zapnuta"
mouse_enabled_help = "Vypnuto nechá výběr tažením na vašem terminálu. Vyžaduje restart."
mouse_scroll_lines = "Řádků na kolečko myši"
mouse_scroll_lines_help = "O kolik commitů v Logu posune jeden krok kolečka. Vyžaduje restart."
heading_date_time = "Datum a čas"
heading_layout = "Rozvržení"
date_locale = "Jazyk data a času"
date_locale_help = "systémový: názvy měsíců a dnů se řídí jazykem rozhraní. english: vždy anglické názvy, bez ohledu na jazyk. Platí pro všechna data na této stránce."
diff_layout = "Výchozí rozvržení"
diff_layout_help = { git = "Sjednocené (jeden sloupec) nebo vedle sebe (původní a nová verze). Pokračuje podle posledního diffu, který jste si prohlíželi, v tomto okně i po restartech - změna zde určuje jen výchozí stav *nové* relace.", local = "Sjednocené (jeden sloupec) nebo vedle sebe (původní a nová verze). Pokračuje podle posledního rozdílu, který jste si prohlíželi, v tomto okně i po restartech - změna zde určuje jen výchozí stav *nové* relace." }
diff_hunks_only = "Jen hunky"
diff_hunks_only_help = "Zapnuto ukáže jen změněné hunky s několika řádky kontextu; vypnuto celý soubor se změnami zvýrazněnými na místě. Pokračuje stejně jako rozvržení."
diff_show_whitespace = "Zobrazit změny jen v bílých znacích"
diff_show_whitespace_help = "Vypnuto sbalí hunk, který se liší jen v bílých znacích, do kontextu."
input_color = "Barva vstupů"
input_color_help = "Pozadí textových vstupů. „Podle motivu“ (výchozí) použije barvu motivu; ostatní jsou tmavé barvy, které ji přepíší. Vlastní... použije barvu hex níže. Platí živě, bez restartu."
input_color_custom = "Vlastní barva vstupů"
input_color_custom_help = "#rrggbb, použije se, když je Barva vstupů Vlastní.... Platí živě."
minimap = "Minimapa"
minimap_help = { git = "Obrázek celého souboru vedle svislého posuvníku diffu (režim celého souboru) a editoru se zvýrazněnou viditelnou částí; kliknutím skočíte. Skutečný obrázek v terminálu, který je kreslí, jinde braillové buňky. Také `M` v diffu a „Zobrazení: Přepnout minimapu“ v paletě.", local = "Obrázek celého souboru vedle svislého posuvníku rozdílu (režim celého souboru) a editoru se zvýrazněnou viditelnou částí; kliknutím skočíte. Skutečný obrázek v terminálu, který je kreslí, jinde braillové buňky. Také `M` v rozdílu a „Zobrazení: Přepnout minimapu“ v paletě." }
date_format = "Formát data"
date_format_help = "Sloupec data Blame / Historie souboru."
date_time_format = "Formát data a času"
date_time_format_help = "Samotný sloupec Datum v Logu."
date_verbose_format = "Podrobný formát data"
date_verbose_format_help = "Řádek Datum v panelu detailu commitu, popisek sloupce Datum při najetí a Kopírovat > Datum."
preview = "náhled"
sidebar_sections_scope = "Sekce levého panelu"
sidebar_sections_scope_help = "Čí volba určuje, které sekce levého panelu jsou zobrazené a skryté. repozitář: každý repozitář má vlastní sadu (globální je jeho výchozím bodem). globální: jedna sada pro všechny repozitáře. Přepínáním o žádnou ze sad nepřijdete."
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "Rozložení sloupců"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "Jak Log rozkládá své sloupce. fit: každý sloupec se vejde do panelu a pružná je jen Zpráva. scroll: sloupce si drží šířky, i Zpráva, a tabulka se posouvá do stran, když je širší než panel."

[settings_git]
default_backend = "Backend gitu"
default_backend_help = "Globální. Běžící daemon si ponechá backend, se kterým startoval."
default_backend_warning = "Platí pro daemony spuštěné po této změně."
pull_mode = { git = "Tlačítko Pull", local = "Tlačítko Stáhnout" }
default_encoding = "Výchozí kódování"
default_encoding_help = { git = "Používá se pro zobrazení obsahu souborů, blame a diffů, které nejsou platné UTF-8 (platné UTF-8 se nikdy znovu nedekóduje). Repozitář ho může níže přepsat. Jen zobrazení: staging a patche zachovají přesné bajty souboru.", local = "Používá se pro zobrazení obsahu souborů, blame a rozdílů, které nejsou platné UTF-8 (platné UTF-8 se nikdy znovu nedekóduje). Repozitář ho může níže přepsat. Jen zobrazení: přidávání do indexu a patche zachovají přesné bajty souboru." }
push_behavior = { git = "Tlačítko Push", local = "Tlačítko Odeslat" }
push_behavior_help = { git = "přímo: push ihned do výchozího remote. zeptat se: otevře malou nabídku s předvybraným výchozím remote. ▾ tlačítka se ptá vždy.", local = "přímo: odeslání ihned do výchozího remote. zeptat se: otevře malou nabídku s předvybraným výchozím remote. ▾ tlačítka se ptá vždy." }
repo_encoding_help = { git = "Jak se obsah souborů, blame a diffy dekódují pro zobrazení, když nejsou platné UTF-8 (jen tento repozitář; inherited: Výchozí kódování na této stránce). Staging nic nepřekóduje.", local = "Jak se obsah souborů, blame a rozdíly dekódují pro zobrazení, když nejsou platné UTF-8 (jen tento repozitář; inherited: Výchozí kódování na této stránce). Přidávání do indexu nic nepřekóduje." }
core_autocrlf_help = "Zapisuje se do konfigurace gitu tohoto repozitáře (core.autocrlf), takže ji vidí git i všechny ostatní nástroje. true: LF na CRLF při checkoutu; input: CRLF na LF jen při uložení do historie; false: nikdy nepřevádět. (zděděno): odstraní hodnotu repozitáře, takže platí vaše globální konfigurace gitu. Lze vrátit zpět."
core_eol_help = "Zapisuje se do konfigurace gitu tohoto repozitáře (core.eol): konec řádku, který git používá pro textové soubory v pracovním stromu (lf, crlf, nebo native, tedy platformní). (zděděno): odstraní hodnotu repozitáře, takže platí vaše globální konfigurace gitu. Lze vrátit zpět."
git_lfs = "Git LFS"
git_lfs_help = { git = "Zobrazit Git LFS v rozhraní (tag LFS, kartu diffu, banner chybějícího programu, příkazy LFS) a nechat GitPoulpi provádět vlastní kroky LFS (fetch objektů po klonování). Vypnuto: vlastní filtry LFS gitu stále běží, GitPoulpi git-lfs sám nikdy nevolá.", local = "Zobrazit Git LFS v rozhraní (odznak LFS, kartu rozdílů, banner chybějícího programu, příkazy LFS) a nechat GitPoulpi provádět vlastní kroky LFS (načtení objektů po klonování). Vypnuto: vlastní filtry LFS gitu stále běží, GitPoulpi git-lfs sám nikdy nevolá." }
git_lfs_program = "Program git-lfs"
git_lfs_program_help = "Nainstalujte z https://git-lfs.com (Windows: součást Git for Windows, nebo `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Paleta: LFS: Otevřít stránku instalace."
initialize_lfs_for_this_repository = "Inicializovat LFS pro tento repozitář"
initialize_lfs_for_this_repository_help = "Spustí `git lfs install --local`: filtry a hooky LFS ve vlastní konfiguraci tohoto repozitáře, nikdy v globální. Vyžaduje git-lfs."
pull_mode_help = "Co dělá {$Pull}{hint} na panelu nástrojů: {$merge} (fast-forward, pokud lze), ff_only nebo rebase. Položky ▾ tlačítka provedou ihned vlastní akci a toto nemění."
repo_heading = "Repo: {repo} - jen tento repozitář"
inherited = "(zděděno)"
lfs_not_checked = "(zatím nezjištěno)"
lfs_autofix_filters = { git = "Instalovat filtry LFS před pull a push", local = "Instalovat filtry LFS před stažením a odesláním" }
lfs_autofix_filters_help = { git = "Před pull nebo push v repozitáři používajícím Git LFS spustí `git lfs install --local`, pokud chybí jeho filtry LFS nebo hooky (jen vlastní konfigurace repozitáře, nikdy globální), aby přenos zvládl velké soubory. Stavový řádek to oznámí. Vyžaduje git-lfs.", local = "Před stažením nebo odesláním v repozitáři používajícím Git LFS spustí `git lfs install --local`, pokud chybí jeho filtry LFS nebo hooky (jen vlastní konfigurace repozitáře, nikdy globální), aby přenos zvládl velké soubory. Stavový řádek to oznámí. Vyžaduje git-lfs." }

