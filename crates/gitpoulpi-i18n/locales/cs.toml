step_lift_azure = "Otevřete Project settings > Repositories > repozitář > Policies, odeberte politiku větve a v části Security si povolte oprávnění přepisovat historii a mazat větve, proveďte {$push_noun} přepisu a pak obojí obnovte."
step_lift_bitbucket = "Otevřete nastavení repozitáře > Branch restrictions (na Data Center Branch permissions), odeberte omezení, které se týká větve, proveďte {$push_noun} přepisu a pak omezení obnovte."
step_lift_other = "Odeberte nebo zmírněte pravidlo ochrany větve v nastavení repozitáře u hostitele, proveďte {$push_noun} přepisu a pak pravidlo obnovte."
step_push_new_name = "Proveďte {$push_noun} přepisu do větve, která není chráněná, pod novým názvem (GitPoulpi chráněný ref nechává být)."
step_switch_github = "Pak v Settings > Branches nastavte novou větev jako výchozí (nebo nejdřív přejmenujte starou přes Settings > Branches > ikona tužky > Rename) a starou větev smažte, až ji nikdo nebude používat."
step_switch_gitlab = "Pak v Settings > Repository > Branch defaults nastavte novou větev jako výchozí a starou smažte (Code > Branches), až ji nikdo nebude používat."
step_switch_azure = "Pak v Repos > Branches použijte nabídku nové větve > Set as default branch a starou větev smažte, až ji nikdo nebude používat."
step_switch_bitbucket = "Pak v nastavení repozitáře > Repository details nastavte novou větev jako hlavní (na Data Center jako výchozí) a starou smažte, až ji nikdo nebude používat."
step_switch_other = "Pak v nastavení repozitáře u hostitele udělejte z nové větve výchozí a starou smažte, až ji nikdo nebude používat."
step_recreate = { git = "Smažte vzdálený repozitář v jeho nastavení, vytvořte prázdný se stejným názvem a pak proveďte {$push_noun} všech větví a všech tagů. Všichni si musí repozitář naklonovat znovu.", local = "Smažte vzdálený repozitář v jeho nastavení, vytvořte prázdný se stejným názvem a pak proveďte {$push_noun} všech větví a všech značek. Všichni si musí repozitář naklonovat znovu." }
