delete_orig_files_after_merge_help = { git = "Po dokončení merge smaže zálohy *.orig, které v pracovním stromu zanechal nástroj merge (viz mergetool.keepBackup v gitu). Ve výchozím stavu vypnuto.", local = "Po dokončení sloučení smaže zálohy *.orig, které v pracovním stromu zanechal nástroj pro slučování (viz mergetool.keepBackup v gitu). Ve výchozím stavu vypnuto." }
initial_commits_in_graph = "Počáteční commity v grafu"
initial_commits_in_graph_help = "Pokud je zapnuto líné načítání commitů, další se načtou, jakmile dosáhnete nejstaršího commitu v grafu."
initial_commits_in_graph_warning = "Zvýšení může zhoršit výkon ve velkých repozitářích."
lazy_load_commits_in_graph = "Líné načítání commitů v grafu"
lazy_load_commits_in_graph_help = "Vypnuto: graf končí u počátečních commitů výše a posouváním se k ničemu staršímu nedostanete."
commits_per_lazy_page = "Commitů na líné načtení"
commits_per_lazy_page_help = "Kolik commitů načte jedno načtení na pozadí, když se blížíte k nejstaršímu drženému commitu."
max_commits_in_graph = "Maximum commitů v grafu"
max_commits_in_graph_help = "Strop, u kterého líné načítání skončí. 0 znamená bez stropu - nakonec se celá historie udrží v paměti."
max_commits_in_graph_warning = "Každý držený commit stojí zhruba 300 bajtů paměti."
undo_enabled = "Zpět povoleno"
undo_enabled_help = { git = "Zapnuto: Zpět a Znovu umí vrátit commity, staging, zahození a změny větví. Vypnuto: GitPoulpi nedělá pro vracení žádnou práci - nejrychlejší nastavení - a tlačítka na panelu nástrojů zmizí. Vypnutí smaže historii vracení všech repozitářů.", local = "Zapnuto: Zpět a Znovu umí vrátit commity, přidání do indexu, zahození a změny větví. Vypnuto: GitPoulpi nedělá pro vracení žádnou práci - nejrychlejší nastavení - a tlačítka na panelu nástrojů zmizí. Vypnutí smaže historii vracení všech repozitářů." }
undo_depth = "Hloubka historie Zpět"
undo_depth_help = "Kolik operací může Zpět vrátit. 0 znamená neomezeně."
journal_outside = "Zaznamenávat změny provedené mimo GitPoulpi"
journal_outside_help = { git = "Zapnuto: co shell nebo AI agent udělá s větvemi, tagy, stashi a HEADem, se objeví v historii vrácení jako provedené mimo GitPoulpi a Ctrl+Z to může vzít zpět. Úpravy souborů v pracovním stromu se nikdy nezachycují. Vyžaduje povolené Zpět.", local = "Zapnuto: co shell nebo AI agent udělá s větvemi, značkami, odloženými změnami a HEADem, se objeví v historii vrácení jako provedené mimo GitPoulpi a Ctrl+Z to může vzít zpět. Úpravy souborů v pracovním stromu se nikdy nezachycují. Vyžaduje povolené Zpět." }
remember_tabs = "Pamatovat si karty"
remember_tabs_help = "Zapnuto: karty otevřené při posledním ukončení relace se znovu otevřou při dalším spuštění. Vypnuto: spuštění začne na jedné kartě - repozitáři, na který bylo namířeno. Čte se jednou při startu; změna vyžaduje restart."
radar_enabled = "Povolit Radar"
radar_enabled_help = "Vypnuto: karta Radar, její příkazy i zkratka jsou skryté a na pozadí se pro ni nic nenačítá. Platí okamžitě."
startup_tab_in_repo = "Karta při spuštění v repozitáři"
startup_tab_in_repo_help = "Karta, na které se aplikace otevře, když složka, v níž se spouští, leží uvnitř repozitáře. Aktuální repozitář otevře kartu tohoto repozitáře (v případě potřeby ji otevře). Poslední karta otevře kartu, která byla aktivní při posledním ukončení (Domů, když je vypnuto Pamatovat si karty). Repozitář zadaný přes --repo vždy otevře vlastní kartu. Čte se jednou při startu; změna vyžaduje restart."
startup_tab_outside_repo = "Karta při spuštění mimo repozitář"
startup_tab_outside_repo_help = "Karta, na které se aplikace otevře, když složka, v níž se spouští, není repozitář (například uživatelská složka). Poslední karta otevře kartu, která byla aktivní při posledním ukončení (Domů, když je vypnuto Pamatovat si karty nebo si nic nepamatuje). Radar otevře Domů, když je Radar vypnutý. Čte se jednou při startu; změna vyžaduje restart."
startup_tab_launcher = "Karta při spuštění ze spouštěče"
startup_tab_launcher_help = "Karta, na které se aplikace otevře, když ji spustí zástupce na ploše nebo v nabídce Start (viz Spouštěč níže), ať je složka jakákoli. Má přednost před dvěma nastaveními výše; Poslední karta a Radar se chovají jako tam. Čte se jednou při startu; změna vyžaduje restart."
group_worktree_tabs = "Seskupovat karty worktree"
group_worktree_tabs_help = "Karty propojených worktree repozitáře se řadí hned za kartu tohoto repozitáře a odtažená karta worktree se k ní vrátí. Vypnuto: karty zůstanou tam, kam je dáte. Zapnutím se otevřené karty seskupí."
allow_agent_view_control = "Povolit AI agentům ovládat zobrazení"
allow_agent_view_control_help = "Zapnuto: AI agent (přes MCP nebo `gitpoulpi ui`) může požádat toto okno o zobrazení commitu, souboru nebo oznámení. Nikdy nic v repozitáři nemění. Vypnuto: okno je nepřijímá. Čte se při otevření okna."
allow_ui_propose = "Nechat AI agenty navrhovat změny k mému potvrzení"
allow_ui_propose_help = { git = "Zapnuto: AI agent může otevřít předvyplněný dialog: novou zprávu commitu, zprávu commitu v editoru, novou větev nebo tag. Je označen ✦ Navrhl <agent> a nic se nezmění, dokud nestisknete vlastní potvrzení dialogu; Esc ho odmítne. Vypnuto (výchozí): `ui propose` a nástroje MCP ui_propose_* jsou odmítnuty.", local = "Zapnuto: AI agent může otevřít předvyplněný dialog: novou zprávu commitu, zprávu commitu v editoru, novou větev nebo značku. Je označen ✦ Navrhl <agent> a nic se nezmění, dokud nestisknete vlastní potvrzení dialogu; Esc ho odmítne. Vypnuto (výchozí): `ui propose` a nástroje MCP ui_propose_* jsou odmítnuty." }
clone_root = "Výchozí složka pro klonování"
clone_root_help = "Odkud začíná pole „Kam klonovat“ v dialogu Klonovat. Prázdné použije výchozí podle OS: %USERPROFILE%\\source\\repos ve Windows, jinde ~/src."
# context: setting: which source the Clone dialog opens on (Last used, Clone with URL, or an integration)
clone_start_source = "Dialog Klonovat se otevře na"
clone_start_source_help = "Zdroj, na kterém se dialog Klonovat otevře. Naposledy použitý znovu otevře ten, který zobrazoval při posledním zavření; Klonovat z URL vždy začne na formuláři URL; nebo vyberte jednu z připojených integrací. Zdroj, který už není dostupný, se vrátí na Klonovat z URL."
# context: option of the "Clone dialog starts on" setting: the source shown when the dialog was last closed
clone_start_last = "Naposledy použitý"
browse_root = "Výchozí složka pro procházení"
browse_root_help = "Kde se ve výchozím stavu otevře Procházet (výběr složky z karty Domů). Prázdné nechá Procházet otevírat poslední zvolenou složku - poprvé domovskou - místo pevné."
heading_auto_stash = { git = "Auto-Stash", local = "Automatické odložení" }
heading_log = "Protokol aplikace"
heading_undo = "Historie vrácení"
log_level = "Úroveň protokolu"
log_retention_days = "Uchovávat soubory protokolu"
# context: setting help: how long log files are kept; a number and a unit (days, weeks, months, years) on one line
log_retention_help = "Starší soubory protokolu se smažou při spuštění GitPoulpi. Soubor každého dne je navíc omezen nastavením velikosti níže."
# context: setting: where the data GitPoulpi keeps for one repository lives (ref filters, fold state, workflow, caches)
repo_data_location = "Umístění dat repozitáře"
# context: help of the setting above
repo_data_location_help = "Kde se ukládají data jednotlivých repozitářů (filtry refů, workflow, mezipaměti). Uvnitř .git zůstane pracovní strom čistý; změna tohoto nastavení stávající data přesune."
# context: option of the repository data location: inside the repository's .git folder
repo_data_in_git_dir = "Uvnitř .git (složka gitpoulpi)"
# context: option of the repository data location: a .gitpoulpi folder in the working tree
repo_data_in_worktree = "V pracovním stromu (složka .gitpoulpi)"
# context: option of the repository data location: the user's own data folder
repo_data_user_data = "V mé složce s uživatelskými daty (mimo repozitář)"
log_max_file_mb = "Maximální velikost souboru protokolu"
log_timings = "Zobrazit dobu trvání operací"
log_timings_help = "Přidá ke každé operaci v protokolu aktivity (karta Operace gitu) dobu trvání v milisekundách."
log_extended = "Rozšířené protokolování"
log_extended_help = { git = "Vypíše také operace na pozadí (automatický {$fetch}, obnovení, sledování stavu) s dobou trvání.", local = "Vypíše také operace na pozadí (automatické načítání, obnovení, sledování stavu) s dobou trvání." }
# context: setting: how the status bar counts the total commits (the dropdown choices are in settings_value)
commit_count = "Celkem {$commits} zjišťovat pomocí"
# context: help of the setting above; mentions antivirus software
commit_count_help = "Jak stavový řádek zjistí celkový počet v údaji načteno / celkem. Systémový git spustí jeden proces git (obvykle nejrychlejší). libgit2 počítá uvnitř GitPoulpi a žádný proces nespouští: zvolte ho, když antivirový program kontroluje každý příkaz a git tím zpomaluje. Vypnuto: zobrazí se jen načtené {$commits}. Platí okamžitě."
auto_stash = { git = "Auto-stash před checkoutem, pull, merge nebo rebase", local = "Automaticky odložit před checkoutem, stažením, sloučením nebo rebase" }
auto_stash_help = { git = "Co dělat, když checkout, pull, merge nebo rebase blokují místní změny. zeptat se: dialog nabídne stash, provedení operace a opětovný pop; vždy: provede se bez ptaní; nikdy: odmítne se, jako v gitu.", local = "Co dělat, když checkout, stažení, sloučení nebo rebase blokují místní změny. zeptat se: dialog nabídne odložení změn, provedení operace a jejich opětovné obnovení; vždy: provede se bez ptaní; nikdy: odmítne se, jako v gitu." }
include_untracked_in_autostash = { git = "Zahrnout nesledované soubory do auto-stash", local = "Zahrnout nesledované soubory do automatického odložení" }
include_untracked_in_autostash_help = { git = "Zda automatický stash bere i nesledované soubory (jinak se uloží a vrátí jen sledované změny).", local = "Zda automatické odložení bere i nesledované soubory (jinak se uloží a vrátí jen sledované změny)." }
hosting_refresh_minutes = { git = "Obnovení: {$prs} a issues", local = "Obnovení žádostí o sloučení a issues" }
hosting_refresh_minutes_help = { git = "Jak často se seznamy {$prs} a Issues v postranním panelu (a čip propojeného {$pr_abbr} na panelu nástrojů) znovu ptají hostitele. 0 vypne časovač; stále se obnoví při otevření repozitáře, přepnutí větve, po pushi či fetchi a na požádání.", local = "Jak často se seznamy žádostí o sloučení a issues v postranním panelu (a čip propojené žádosti na panelu nástrojů) znovu ptají hostitele. 0 vypne časovač; stále se obnoví při otevření repozitáře, přepnutí větve, po odeslání či načtení a na požádání." }
pr_terminology = "Terminologie žádosti o kontrolu kódu"
pr_terminology_help = "Slovo používané pro hostovanou žádost o kontrolu kódu v celém TUI. Auto se řídí hostitelem repozitáře: Merge Request pro GitLab, Pull Request pro ostatní. Pull Request nebo Merge Request vynutí dané slovo. Platí okamžitě."
hide_finished_pr_chip = { git = "Čip {$pr}: skrýt po uzavření nebo merge", local = "Čip {$pr}: skrýt po uzavření nebo sloučení" }
hide_finished_pr_chip_help = { git = "Čip na panelu nástrojů ukazuje nejnovější {$pr} aktuální větve. Zapnuto: po uzavření nebo merge se čip skryje a větev místo něj nabídne tlumený čip „+ {$pr_abbr}“, jako by {$pr} neměla. Vypnuto: čip ukazuje nejnovější {$pr} vždy, ať je v jakémkoli stavu. Platí okamžitě.", local = "Čip na panelu nástrojů ukazuje nejnovější {$pr} aktuální větve. Zapnuto: po uzavření nebo sloučení se čip skryje a větev místo něj nabídne tlumený čip „+ {$pr_abbr}“, jako by {$pr} neměla. Vypnuto: čip ukazuje nejnovější {$pr} vždy, ať je v jakémkoli stavu. Platí okamžitě." }
heading_external_tools = "Externí nástroje"
external_editor = "Externí editor"
external_editor_help = "Příkaz pro položku nabídky souboru „Otevřít v <editor>“; {{file}} je plná cesta k souboru (připojí se, pokud chybí). Prázdné: VS Code (`code`), je-li na PATH, jinak výchozí program systému."
external_diff_tool = { git = "Externí nástroj diff", local = "Externí nástroj pro porovnání" }
external_diff_tool_help = { git = "Příkaz pro „Otevřít v externím nástroji diff“; {{local}} je commitnutá (nebo staged) verze, {{remote}} porovnávaná verze. Prázdné: `git difftool` s `diff.tool`, který máte nastavený v gitu.", local = "Příkaz pro „Otevřít v externím nástroji pro porovnání“; {{local}} je commitnutá (nebo přidaná do indexu) verze, {{remote}} porovnávaná verze. Prázdné: `git difftool` s `diff.tool`, který máte nastavený v gitu." }
external_merge_tool = { git = "Externí nástroj merge", local = "Externí nástroj pro slučování" }
external_merge_tool_help = { git = "Příkaz pro „Otevřít v externím nástroji merge“ na kartě konfliktu; {{base}}, {{local}} (A, aktuální), {{remote}} (B, příchozí) a {{merged}} (kam nástroj zapíše výsledek; po úspěšném skončení je staged). Prázdné: `git mergetool` s `merge.tool`, který máte nastavený v gitu.", local = "Příkaz pro „Otevřít v externím nástroji pro slučování“ na kartě konfliktu; {{base}}, {{local}} (A, aktuální), {{remote}} (B, příchozí) a {{merged}} (kam nástroj zapíše výsledek; po úspěšném skončení se přidá do indexu). Prázdné: `git mergetool` s `merge.tool`, který máte nastavený v gitu." }
file_explorer = "Správce souborů"
file_explorer_help = "Příkaz pro „Zobrazit ve složce“; {{path}} je plná cesta k souboru, {{dir}} jeho složka. Windows: explorer.exe /select,\"{{path}}\" soubor vybere; Linux: xdg-open \"{{dir}}\"; macOS: open -R \"{{path}}\"."
ai_assistant = "AI asistent"
launch = "Otevřít okno pro agenty"
launch_help = "Když AI agent požádá o zobrazení a nikde není otevřené okno GitPoulpi, spustí se toto a otevře ho: vypnuto (nikdy, výchozí), terminál (kitty, foot, WezTerm, Windows Terminal, ...), nová karta/panel/pracovní plocha v multiplexeru (tmux, zellij, cmux, ...) nebo custom, který použije šablonu níže. Agent o to stále musí požádat (`--launch`), nebo jeho ui_control musí být auto. Platí od dalšího požadavku."
launch_command = "Příkaz ke spuštění (custom)"
launch_command_help = "Použije se, když je volba výše custom. Rozdělí se na argumenty (uvozujte '...' nebo \"...\"), bez shellu. {{repo}} je složka repozitáře, {{session}} název relace a {{gitpoulpi}} tento program. Příklad: kitty --directory {{repo}} {{gitpoulpi}} --session {{session}}"
tab_dir_follow = "Sledovat složku aktivní karty"
tab_dir_follow_help = "Program nemůže změnit složku svého shellu, proto nabízí dvě cesty. tlačítka (výchozí): dokud aktivní karta není složkou, ve které byl GitPoulpi spuštěn, lišta karet ukazuje Konec a cd sem (jen při spuštění přes obal shellu, viz `gitpoulpi shell-init`). auto: bez tlačítek; ukončení vždy provede cd shellu do aktivní karty a při otevření nové karty se sám otevře terminál (ne u karet obnovených při startu)."
forget_all_usernames_and_passwords = "Zapomenout všechna jména a hesla"
forget_all_usernames_and_passwords_help = "Odstraní všechny tokeny, které GitPoulpi uložil do vašeho credential helperu."
mcp_server = "Server MCP"
mcp_server_help = "Zapnuto: AI agent může spustit server MCP (`gitpoulpi mcp serve`, nebo `--http` pro síťový koncový bod). Vypnuto: odmítne startovat. Ukládá se jako `mcp.enabled`. Změna se projeví při dalším spuštění serveru agentem; již běžící server si ponechá nastavení, se kterým startoval."
mcp_port = "Port serveru MCP"
mcp_port_help = "Port, na kterém `gitpoulpi mcp serve --http` naslouchá, není-li zadána adresa (hostitelská část `mcp.bind` zůstává, výchozí 127.0.0.1, jen loopback, pokud není --allow-remote). Projeví se při dalším spuštění serveru agentem; běžící server si port ponechá."
mcp_bind_unreadable = "`mcp.bind` je „{bind}“, což nemá čitelný port. Nastavení portu zde ponechá hostitele a zbytek nahradí."
undo_off_note = "Zpět je vypnuto - zapněte „Zpět povoleno“ a nastavte hloubku"
use_mailmap = "Zobrazovat autory podle .mailmap"
use_mailmap_help = "Zobrazuje každého autora tak, jak ho pojmenovává soubor .mailmap repozitáře, v Logu, v blame i v historii souboru. Samotné {$commits} se nemění. Platí okamžitě."
auto_prune_tags = "Automaticky mazat {$tags}"
auto_prune_tags_help = { git = "Při každém fetchi smaže i lokální tagy, které už remote nemá. Týká se jen tagů, které na remote byly: tag, který jste nikdy neodeslali, zůstane. Ve výchozím stavu vypnuto, stejně jako v gitu.", local = "Při každém načtení smaže i lokální značky, které už remote nemá. Týká se jen značek, které na remote byly: značka, kterou jste nikdy neodeslali, zůstane. Ve výchozím stavu vypnuto, stejně jako v gitu." }

