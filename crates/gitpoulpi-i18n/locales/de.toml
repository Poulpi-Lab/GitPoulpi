[help_text]
git_actions_then_pull_all_branches = "{$pull} aller Branches: {$fetch}, jeden Branch, der nur hinter seinem Upstream liegt, per Fast-Forward vorspulen, den ausgecheckten Branch mit {$pull} aktualisieren (auch ein Eintrag der {$Pull} ▾)"
git_actions_then_amend = "den ausgewählten {$Commit} ändern: Zusammenfassung, Beschreibung, Name, E-Mail und Datum des Autors in einem Fenster"
git_actions_then_edit_author = "nur den Autor im ausgewählten {$Commit} ändern (Name, E-Mail, Datum)"
rewrite_1 = "öffnet die Werkbank zum Umschreiben des Verlaufs: Autoren, Datum, Nachrichten, Dateiinhalte oder Pfade im gesamten Verlauf oder in einer Auswahl ändern"
rewrite_2 = "zeigt in einer Vorschau, was die Regeln ändern würden, und wendet es dann in einem Schritt an, den Rückgängig zurücknimmt; Anwenden bleibt gesperrt, solange die Vorschau veraltet ist"
rewrite_3 = "bricht die laufende Vorschau ab (Esc tut dasselbe; ein zweites Esc schließt die Werkbank)"
rewrite_4 = "fügt eine Regel hinzu, löscht die Regel unter dem Cursor, stellt die zuletzt gelöschte wieder her, dupliziert die Regel"
rewrite_5 = "schaltet die Regel ein oder aus oder verschiebt sie nach oben oder unten (Regeln laufen von oben nach unten)"
rewrite_6 = "wechselt zwischen den Vorschau-Tabs"
rewrite_7 = "speichert das Rezept im Repository oder nur für Sie, lädt ein gespeichertes, benennt es um; geheime Werte werden nie gespeichert"
rewrite_8 = "bezieht jeden geschützten, bereits veröffentlichten Branch ein oder lässt ihn aus; prüft die externen Programme erneut"
file_history_1 = "zum {$commit} der Zeile im Log springen und dabei weitere Log-Zeilen laden, falls er noch fehlt"
file_history_2 = { git = "die Auswahl bewegen; der Diff rechts folgt sofort", local = "die Auswahl bewegen; die Unterschiede rechts folgen sofort" }
file_history_3 = { git = "die Auswahl zu einem Bereich erweitern: rechts erscheint dann der Diff der Datei zwischen den beiden Enden (Shift+Klick tut dasselbe)", local = "die Auswahl zu einem Bereich erweitern: rechts erscheinen dann die Unterschiede der Datei zwischen den beiden Enden (Shift+Klick tut dasselbe)" }
file_history_4 = { git = "die Tastatur dem Diff geben oder zurück an die Liste", local = "die Tastatur den Unterschieden geben oder zurück an die Liste" }
file_history_5 = "die SHA des {$commit}s oder seine Zusammenfassung kopieren"
file_history_6 = { git = "rechte Seite: der Diff, die Datei, wie sie bei diesem {$commit} war, oder ihr Blame; sie folgt der Auswahl und behält ihren Modus", local = "rechte Seite: die Unterschiede, die Datei, wie sie bei diesem {$commit} war, oder ihr Blame; sie folgt der Auswahl und behält ihren Modus" }
file_history_7 = "die Version der Zeile mit dem Arbeitsverzeichnis vergleichen (erneut drücken, um zurückzugehen)"
file_history_8 = "die Datei im Arbeitsverzeichnis auf diese Version zurücksetzen (fragt vorher; Rückgängig bringt die alten Bytes zurück)"
file_history_9 = "die Liste in der Größe ändern (die Trennlinie lässt sich auch ziehen; die Breite wird gemerkt)"
file_history_10 = "Maus: Klick auf eine Zeile, Shift+Klick für einen Bereich, Doppelklick zeigt sie im Log, Rechtsklick öffnet das Menü"
commit_column_1 = "die Zeilen seitlich scrollen (Shift+Rad oder ein horizontales Rad tun dasselbe); sie scrollen nur, wenn ein Teil breiter eingestellt ist, als Platz da ist"
commit_column_2 = "einen Teil wählen (Spuren, Autor, Datum) und verbreitern oder verschmälern, oder alle Teile auf automatische Breite zurücksetzen; die Grenzen in der Kopfzeile lassen sich auch ziehen, die Breiten werden gemerkt"
commit_column_3 = "Maus: Klick auf eine Zeile wählt ihren {$commit}, Rechtsklick öffnet ihr Menü (die Menütaste auch, nachdem eine Zeile mit Auf/Ab gewählt wurde)"
commit_column_4 = "den gewählten Teil nach links oder rechts verschieben; das Ziehen seiner Kopfzeile tut dasselbe, die Reihenfolge wird gemerkt"
log_columns_1 = "eine Log-Spalte wählen (ihre Kopfzelle leuchtet auf); dann nach links oder rechts verschieben (das Ziehen der Kopfzeile tut dasselbe), verbreitern oder verschmälern (das Ziehen ihrer Grenze tut dasselbe), auf automatische Breite zurücksetzen oder an ihren Inhalt anpassen (ein Doppelklick auf ihre Grenze tut dasselbe; + passt alle Spalten an). Tab / Shift+Tab wählen eine andere Spalte, Esc beendet; das Layout wird gemerkt"
global_1 = "öffnet die Befehlspalette - jeden Befehl der App, jeweils mit seinem Kürzel; zum Filtern tippen, Auf/Ab oder PageUp/PageDown zum Bewegen (nicht j/k: die werden getippt), Enter zum Ausführen. Ausgegraute Zeilen sagen, warum sie gerade nicht ausgeführt werden können"
global_2 = "das Navigationspräfix - siehe den eigenen Abschnitt unten"
global_3 = "das Präfix für Git-Aktionen - siehe den eigenen Abschnitt unten"
global_4 = "diese Hilfe-Überlagerung umschalten - öffnet sich über allem, was sonst offen ist (Einstellungen, Repository-Verwaltung, ...), nicht nur über dem einfachen Graph"
global_5 = "Aktualisierung erzwingen"
global_6 = { git = "Fetch, {$Prs} und Issues neu prüfen, neu laden", local = "Abrufen, {$Prs} und Issues neu prüfen, neu laden" }
global_7 = "den letzten Vorgang rückgängig machen / wiederholen (Commit, Amend, Checkout, Branch erstellen/löschen); fragt zuerst nach, wenn es riskant ist"
global_9 = { git = "beenden - aus dem Graph; über einem Diff oder der Dateiansicht schließt es stattdessen diese Ansicht. Jedes Beenden wird in gitpoulpi-tui-exit.log neben der Konfiguration protokolliert", local = "beenden - aus dem Graph; über den Unterschieden oder der Dateiansicht schließt es stattdessen diese Ansicht. Jedes Beenden wird in gitpoulpi-tui-exit.log neben der Konfiguration protokolliert" }
global_10 = "ein Kontextmenü öffnen, wo immer unten eines existiert - die Tasten sind austauschbar (die Menü-/Apps-Taste erreicht diese App unter Windows selten, daher ist dort die F10-Kombination die zuverlässige)"
global_11 = "den Fokus zum nächsten / vorherigen Bereich wechseln"
global_12 = "die Auswahl bewegen (jeder Bereich und jede Liste)"
global_13 = "Zählpräfix im Vim-Stil für j/k/Auf/Ab (und Bild auf/Bild ab, als Anzahl von Bildschirmen) - getippte Ziffern erscheinen als „4...“ in der Statuszeile, bis die Bewegung erfolgt; Esc oder jede andere Taste löscht es, und eine führende 0 beginnt nie eines (so werden Ziffern im Composer, im Refs-Filter und in jedem anderen Textfeld weiterhin normal getippt)"
global_14 = "Refs: Abschnitt LOKAL/REMOTE/TAGS wechseln"
global_15 = "Log: h = aus der Dateiliste eines Commits heraus / l = hinein"
global_16 = { git = "Status: zu Unstaged / Staged springen", local = "Status: zu Nicht bereitgestellt / Bereitgestellt springen" }
mouse_basics_1 = "eine Zeile auswählen + fokussieren (jeder Bereich, jede Liste, jedes Menü, jeder Dialog); das Mausrad scrollt, was auch immer unter dem Zeiger liegt"
mouse_basics_2 = { git = "öffnen/aktivieren: eine LOKAL-/TAGS-Ref oder eine Ref-Pille einer Log-Zeile checkt sie aus, eine geänderte Datei öffnet ihren Diff, eine Repository-Zeile öffnet dieses Repository", local = "öffnen/aktivieren: eine LOKAL-/TAGS-Ref oder eine Ref-Pille einer Log-Zeile checkt sie aus, eine geänderte Datei öffnet ihre Unterschiede, eine Repository-Zeile öffnet dieses Repository" }
mouse_basics_3 = "das einzige „anklickbar“-Signal, das die meisten Terminals geben (siehe „Hover & Tooltips“ unten) - auch volle Tooltips über Log-Zellen und abgeschnittenen Ref-Badges"
mouse_basics_4 = "ein Bereichstrenner, eine Log-Spaltengrenze, der untere Rand eines Refs-Abschnitts oder der untere Rand des Commit-Nachrichtenblocks ändert die Größe (unter dem Minimum klappt er stattdessen zu); eine Log-Spaltenüberschrift über einen Nachbarn hinaus ordnet sie um"
mouse_basics_5 = "(obere rechte Ecke) beenden, wie q - nur gezeigt, wenn das Fenster breit genug ist, um den Titeltext nicht zu überlappen"
navigation_prefix_then_1 = "den Refs-Bereich (links) ein-/ausklappen"
navigation_prefix_then_2 = "den Status-Bereich (rechts) ein-/ausklappen - für die Maus den Chevron am Rand eines Bereichs oder den dünnen Streifen anklicken, der nach dem Einklappen bleibt"
navigation_prefix_then_3 = "den aktiven Refs-Abschnitt um eine Zeile vergrößern ({{nav_prefix.shrink_section}} verkleinert ihn); das Ziehen des unteren Rands eines Abschnitts tut dasselbe, und die Größe wird gemerkt"
navigation_prefix_then_4 = "den Commit-Nachrichtenblock des rechten Bereichs um eine Zeile vergrößern ({{nav_prefix.shrink_message}} verkleinert ihn); für die Maus den Rand darunter ziehen"
navigation_prefix_then_5 = { git = "diesen Unterbereich fokussieren - jeder Refs-Abschnitt, das Filterfeld, das Log (oder die Diff-Ansicht, wenn sie dort offen ist), die Dateiverlauf-Liste, jede Hälfte des dritten Bereichs und das Feld Zusammenfassung des Composers, wenn Platz ist, erhalten ein eigenes Badge: erst 1-9, dann a/b/c..., wenn es in diesem Bild mehr als neun gibt - Badges werden bei jedem Öffnen des Präfixes neu vergeben, also das Zeichen lesen, keine Ziffer auswendig lernen", local = "diesen Unterbereich fokussieren - jeder Refs-Abschnitt, das Filterfeld, das Log (oder die Unterschiedsansicht, wenn sie dort offen ist), die Dateiverlauf-Liste, jede Hälfte des dritten Bereichs und das Feld Zusammenfassung des Composers, wenn Platz ist, erhalten ein eigenes Badge: erst 1-9, dann a/b/c..., wenn es in diesem Bild mehr als neun gibt - Badges werden bei jedem Öffnen des Präfixes neu vergeben, also das Zeichen lesen, keine Ziffer auswendig lernen" }
navigation_prefix_then_6 = "die Einstellungen öffnen (wie das Zahnrad in der Titelleiste)"
navigation_prefix_then_16 = "öffnet das Fenster „Über GitPoulpi“ (wie der Oktopus in der Titelleiste)"
navigation_prefix_then_17 = "die Trennlinie zwischen Refs-Bereich und Log um eine Stufe nach links ({{nav_prefix.refs_narrower}}) oder rechts ({{nav_prefix.refs_wider}}) verschieben; ein eingeklappter Refs-Bereich kommt zuerst zurück, die Breite wird gemerkt"
navigation_prefix_then_18 = "die Trennlinie zwischen Log und rechtem Bereich um eine Stufe nach links ({{nav_prefix.status_wider}}) oder rechts ({{nav_prefix.status_narrower}}) verschieben; ein eingeklappter Bereich kommt zuerst zurück, die Breite wird gemerkt"
navigation_prefix_then_7 = "diese Hilfe umschalten (wie ein bloßes ?)"
navigation_prefix_then_8 = "einen Repository-Tab zum Wechseln wählen - zum Filtern tippen, Auf/Ab oder PageUp/PageDown zum Bewegen, Enter wechselt, eine Zeile anklicken, Esc schließt"
workspace_search = "durchsucht alle Repositories des Workspace nach Branches, {$tags}, Worktrees, {$stashes}, {$commits}, {$prs} und Issues - Enter springt hin, Alt+1-8 schaltet Arten um, b: t: c: s: w: r: pr: i: # schränkt ein, Esc schließt"
navigation_prefix_then_9 = "die von einem KI-Agenten angebotene Ansicht zeigen (der Chip `Show ...?` in der Statuszeile), das Gegenstück zum Anklicken"
navigation_prefix_then_10 = "diesen Chip verwerfen, sonst zur Ansicht vor der letzten Änderung des Agenten zurückgehen (auch `Agent: Zurück` in der Palette)"
navigation_prefix_then_11 = "abbrechen, zurück in den Normalmodus"
navigation_prefix_then_12 = "ein Design aus der Liste wählen - tippen zum Filtern, die Markierung zeigt es live, Enter wendet es an und speichert es, Esc stellt das vorherige wieder her (auch `App: Design wechseln...` in der Palette)"
navigation_prefix_then_13 = "eine Sprache aus der Liste wählen - tippen zum Filtern, Enter wendet sie an und speichert sie, Esc bricht ab (auch `App: Sprache wechseln...` in der Palette)"
navigation_prefix_then_14 = "`App: Farbschema des Graphen wechseln...`"
navigation_prefix_then_15 = "`App: Zeilenfärbung des Graphen umschalten`"
navigation_prefix_then_19 = "den geöffneten Dialog per Tastatur anordnen: Pfeile verschieben ihn, Shift+Pfeile ändern die Größe, 0 stellt ihn zurück, Enter beendet (das Gegenstück zum Ziehen von Titelleiste und Rändern; auch `Dialog: Verschieben/Größe ändern` in der Palette)"
git_actions_then_1 = { git = "die ausgewählte unstaged Datei stagen (Status-Bereich)", local = "die ausgewählte nicht bereitgestellte Datei bereitstellen (Status-Bereich)" }
git_actions_then_2 = { git = "die ausgewählte staged Datei unstagen (Status-Bereich)", local = "die Bereitstellung der ausgewählten bereitgestellten Datei aufheben (Status-Bereich)" }
git_actions_then_3 = { git = "alle Änderungen stagen", local = "alle Änderungen bereitstellen" }
