host_github_support = { git = "GitHub hält alte {$commits} über ihre ID erreichbar: in zwischengespeicherten Ansichten und in den verborgenen Refs, die es nach einem Force-Push für Review-Anfragen aufbewahrt. Der Anleitung „Removing sensitive data from a repository“ in der GitHub-Dokumentation folgen und den GitHub-Support (https://support.github.com/contact) bitten, die zwischengespeicherten Ansichten und die Referenzen in Review-Anfragen zu entfernen und eine Garbage Collection auszuführen.", local = "GitHub hält alte {$commits} über ihre ID erreichbar: in zwischengespeicherten Ansichten und in den verborgenen Refs, die es nach einem erzwungenen Hochladen für Review-Anfragen aufbewahrt. Der Anleitung „Removing sensitive data from a repository“ in der GitHub-Dokumentation folgen und den GitHub-Support (https://support.github.com/contact) bitten, die zwischengespeicherten Ansichten und die Referenzen in Review-Anfragen zu entfernen und eine Garbage Collection auszuführen." }
host_github_forks = "Forks behalten den alten Verlauf: Die Eigentümer der Forks bitten, sie zu löschen oder ihren Verlauf umzuschreiben, oder den GitHub-Support nach dem Fork-Netzwerk fragen."
host_github_recreate = "Wenn Review-Anfragen, Issues und Sterne verloren gehen dürfen: aus dem bereinigten Klon ein neues Repository erstellen und das alte löschen. Nur so ist ohne Support sicher, dass die alten Objekte weg sind."
host_gitlab_cleanup = { git = "GitLab: Einstellungen > Repository > Wartung öffnen (in älteren Versionen „Repository bereinigen“) und die {$commit}-Zuordnung hochladen (GitPoulpi kann sie für Sie kopieren): GitLab entfernt dann die internen Refs (Merge-Request-, Pipeline- und Umgebungs-Refs), die die alten {$commits} festhalten.", local = "GitLab: Einstellungen > Repository > Wartung öffnen (in älteren Versionen „Repository bereinigen“) und die {$commit}-Zuordnung hochladen (GitPoulpi kann sie für Sie kopieren): GitLab entfernt dann die internen Refs (Refs der Änderungsanfragen, Pipelines und Umgebungen), die die alten {$commits} festhalten." }
host_gitlab_expire = "GitLab: Die Bereinigung läuft im Hintergrund, und Objekte verschwinden erst nach der Wartung (Housekeeping). Bei einer selbst gehosteten Instanz kann ein Administrator die Wartung für das Projekt starten oder auf die nächste planmäßige warten."
host_gitlab_recreate = "GitLab: Reicht die Bereinigung nicht, aus dem bereinigten Klon ein neues Projekt erstellen und das alte löschen."
host_azure_support = { git = "Azure DevOps: Ein Force-Push löscht die alten {$commits} nicht aus dem Dienst, und keine Einstellung bereinigt sie. Beim Microsoft-Support eine Anfrage mit Projekt, Repository und den {$commit}-IDs stellen und um Entfernung bitten.", local = "Azure DevOps: Ein erzwungenes Hochladen löscht die alten {$commits} nicht aus dem Dienst, und keine Einstellung bereinigt sie. Beim Microsoft-Support eine Anfrage mit Projekt, Repository und den {$commit}-IDs stellen und um Entfernung bitten." }
host_azure_recreate = "Azure DevOps: Oder aus dem bereinigten Klon ein neues Repository erstellen, das alte löschen und es dann auch aus dem Papierkorb entfernen (Projekteinstellungen > Repositorys > Gelöschte Repositorys), damit es endgültig weg ist."
host_bitbucket_support = { git = "Bitbucket Cloud: Alte {$commits} bleiben nach einem Force-Push über Review-Anfragen und ihre ID erreichbar. Den Atlassian-Support kontaktieren und eine Garbage Collection des Repositorys verlangen. In Bitbucket Data Center kann ein Administrator die Garbage Collection in den Wartungseinstellungen des Repositorys starten.", local = "Bitbucket Cloud: Alte {$commits} bleiben nach einem erzwungenen Hochladen über Review-Anfragen und ihre ID erreichbar. Den Atlassian-Support kontaktieren und eine Garbage Collection des Repositorys verlangen. In Bitbucket Data Center kann ein Administrator die Garbage Collection in den Wartungseinstellungen des Repositorys starten." }
host_bitbucket_forks = "Bitbucket: Forks behalten den alten Verlauf: löschen oder von ihren Eigentümern umschreiben lassen."
host_bitbucket_recreate = "Bitbucket: Oder aus dem bereinigten Klon ein neues Repository erstellen und das alte löschen (dabei gehen Review-Anfragen und Issues verloren)."
host_server_gc = "Selbst gehosteter oder unbekannter Host: Im Bare-Repository auf dem Server das Reflog ablaufen lassen und eine Garbage Collection mit sofortigem Prune ausführen, nachdem alle verborgenen Refs (etwa die für Review-Anfragen aufbewahrten), die noch auf die alten {$commits} zeigen, gelöscht wurden. Danach sollen alle neu klonen."
