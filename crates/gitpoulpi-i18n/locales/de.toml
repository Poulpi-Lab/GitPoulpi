mouse_gestures_in_1 = "Terminals ändern die Zeigerform des Betriebssystems für die meisten Dinge nicht, daher ist ein Hintergrund-/Vordergrundwechsel beim Überfahren oft das einzige „anklickbar“-Signal - jede Schaltfläche, jedes Kontrollkästchen, jeder Tab, jede Menüzeile, jede Aktion einer Bereichskopfzeile und die Schließen-Schaltfläche × leuchten beim Überfahren auf; eine Log-Zelle, die weiteren Refs eines Commits und eine Datei-/Blame-Spalte zeigen stattdessen einen Wert-Tooltip"
mouse_gestures_in_2 = { git = "ein Bereichstrenner oder eine Log-Spaltengrenze ändert die Größe (unter dem Minimum klappt der Bereich zu); eine über einen Nachbarn gezogene Log-Spaltenüberschrift ordnet um; das Ziehen einer Ref auf einen anderen Branch öffnet ein Menü mit den passenden Aktionen (Esc bricht ab)", local = "ein Bereichstrenner oder eine Log-Spaltengrenze ändert die Größe (unter dem Minimum klappt der Bereich zu); eine über einen Nachbarn gezogene Log-Spaltenüberschrift ordnet um; das Ziehen einer Ref auf einen anderen Branch öffnet ein Menü mit den passenden Aktionen (Esc bricht ab)" }
mouse_gestures_in_3 = { git = "Ziehen über den Text eines Diffs, der Dateiansicht, von Blame oder Dateiverlauf wählt ihn aus, Doppelklick ein Wort; y oder Ctrl+C kopiert ihn (nur Dateitext, nie Spalten); die anderen Vorkommen eines ausgewählten Worts werden im Diff und im Editor getönt (und auf dem Lineal markiert)", local = "Ziehen über den Text der Unterschiede, der Dateiansicht, von Blame oder Dateiverlauf wählt ihn aus, Doppelklick ein Wort; y oder Ctrl+C kopiert ihn (nur Dateitext, nie Spalten); die anderen Vorkommen eines ausgewählten Worts werden in den Unterschieden und im Editor getönt (und auf dem Lineal markiert)" }
mouse_gestures_in_4 = { git = "scrollt die fokussierte/überfahrene Liste oder den Diff; Shift+Mausrad (beide Schreibweisen, die Terminals melden) scrollt einen Diff/eine Dateiansicht/Blame stattdessen *horizontal*, solange der Zeilenumbruch aus ist", local = "scrollt die fokussierte/überfahrene Liste oder die Unterschiede; Shift+Mausrad (beide Schreibweisen, die Terminals melden) scrollt stattdessen die Unterschiede / eine Dateiansicht / Blame *horizontal*, solange der Zeilenumbruch aus ist" }
mouse_gestures_in_5 = "öffnet ein Kontextmenü, wo immer eines existiert (siehe den Abschnitt jedes Bereichs oben); das Tastaturäquivalent ist immer {{*global.context_menu}}"
mouse_gestures_in_6 = "jede Aktion „Kopieren ...“ legt den Text in die System-Zwischenablage und sendet ihn, wo das Terminal dies bekanntermaßen beachtet, zusätzlich per OSC 52; über SSH oder ohne Display wird nur OSC 52 gesendet, und ein Terminal, das die Sequenz ignoriert, kopiert nicht"
mouse_gestures_in_7 = "Hinweise zu Größe/Zeiger/offener Hand werden per OSC 22 auf Terminals gesendet, die es unterstützen (kitty, Ghostty, foot, mintty; nicht in Rio, Alacritty, Windows Terminal oder iTerm2) - ziehbare Trenner und Spaltengrenzen leuchten auch im eigenen Puffer der App auf, was gar keine Mitwirkung des Terminals braucht"
git_actions_then_25 = "das LFS-Menü öffnen (die LFS-Schaltfläche der Symbolleiste; seine Zeilen stehen auch in der Palette)"
git_actions_then_26 = "LFS: {$fetch} der Objekte aller Refs"
git_actions_then_27 = "LFS: den echten Inhalt über die Zeigerdateien schreiben (offline)"
git_actions_then_28 = "LFS: {$pull} (herunterladen, dann den Inhalt schreiben)"
git_actions_then_29 = "LFS: {$push} der Objekte aller Refs"
git_actions_then_30 = "LFS: den lokalen LFS-Speicher bereinigen"
diff_view_encoding = "die Kodierung wählen, in der die Datei gelesen wird (Automatisch erkennen, UTF-8, UTF-16, Windows-1252, ...)"
commit_composer_bottom_14 = "„Hooks überspringen“ umschalten: Der {$commit} wird ohne Ausführung der Git-Hooks erstellt (Status-Bereich)"
repositories_and_tabs_39 = "filtert die Einträge des Ordners schon beim Tippen (Groß-/Kleinschreibung egal; links oder im Inhalt fokussiert auch `/` das Feld; Enter oder Ab springt zum ersten Treffer, Esc leert es; beim Ordnerwechsel wird es geleert)"
repositories_and_tabs_40 = "schaltet Nachbarordner anzeigen um (der linke Baum listet auch die anderen Ordner jeder geöffneten Ebene - wird gemerkt)"
split_1 = "ordnet die ausgewählte Datei, den Hunk oder die Zeile diesem {$commit} zu (0 lässt sie unzugeordnet, n legt dafür einen neuen {$commit} an); Tab wechselt zwischen den {$commits} und den Änderungen, Enter oder e bearbeitet eine Nachricht, d löscht einen {$commit}; {{compose.apply}} teilt auf"
split_2 = "wählt einzelne Zeilen im aktuellen Hunk aus (Shift+Auf/Ab erweitert die Auswahl)"
split_3 = "verschiebt den {$commit} in der Liste nach oben oder unten (K und J tun dasselbe)"
split_4 = "setzt alle Änderungen auf den Stand zurück, den sie beim Öffnen des Editors hatten"
split_5 = "teilt den {$commit} mit dem aktuellen Plan auf; solange der Plan ungültig ist, bleibt die Schaltfläche deaktiviert und die Statuszeile nennt den Grund"
split_6 = "schaltet „{$Commits} signieren“ um (beim Öffnen des Editors an, wenn die Einstellung gpgSign des Repositorys true ist)"
split_7 = "wählt im Bereich {$commits} diesen {$commit} aus; m oder Enter auf einer Änderung zeigt die {$commits}, denen sie zugeordnet werden kann"
rewrite_9 = "öffnet den Tab Größe und analysiert den Verlauf: die größten Dateien und Ordner sowie gelöschte, aber noch gespeicherte Dateien; angekreuzte Zeilen werden zu Regeln zum Entfernen"
rewrite_host_howto = "erklärt, wie ein Umschreiben durch einen Branch kommt, den der Host schützt: den Schutz aufheben, den Verlauf per {$Push} unter neuem Namen veröffentlichen oder das Repository neu anlegen; es wird nichts für Sie erledigt"
rewrite_ai_rules = "erstellt mit KI die Umschreib-Regeln aus Ihrer Beschreibung (es wird nichts in der Vorschau gezeigt oder angewendet)"
log_columns_2 = "die Spalten des Logs seitlich scrollen, wenn sie ihre Breiten behalten (das Layout Seitlich scrollen, gewählt in der Spaltenauswahl, in den Einstellungen oder mit s bei gewählter Spalte); im Layout Anpassen passt jede Spalte in den Bereich"
refs_pane_20 = "die Remotes des ausgewählten lokalen Branches bearbeiten (sein Upstream und weitere Remotes für den {$Push}): das Tastaturäquivalent zum Klick auf das Remotes-Abzeichen in seiner Zeile"
markdown_editor_1 = "zwischen Schreiben und Vorschau wechseln (der Text, wie er nach dem Senden aussieht)"
markdown_editor_2 = "Text und Vorschau nebeneinander zeigen (braucht ein breites Fenster)"
markdown_editor_3 = "den Text senden (Enter fügt einen Zeilenumbruch ein)"
markdown_editor_4 = "„Mit KI schreiben“ öffnen oder schließen (es entwirft nur: nichts wird gesendet)"

