heading_https_credentials = "HTTPS-Zugangsdaten"
https_mode = "HTTPS-Zugangsdaten"
https_mode_help = { git = "Wie sich Fetch, Pull, Push und Klonen über HTTPS authentifizieren. credential_helper: der eigene Helper von git (Git Credential Manager, libsecret, Keychain). prompt: jeden Helper ignorieren und git im Terminal fragen lassen. none: gar keine Zugangsdaten, nur öffentliche Remotes. Gilt für die nächste Übertragung.", local = "Wie sich Abrufen, Holen, Hochladen und Klonen über HTTPS authentifizieren. credential_helper: der eigene Helper von git (Git Credential Manager, libsecret, Keychain). prompt: jeden Helper ignorieren und git im Terminal fragen lassen. none: gar keine Zugangsdaten, nur öffentliche Remotes. Gilt für die nächste Übertragung." }
heading_keys = "Schlüssel"
generate_key_pair = "Schlüsselpaar erzeugen"
generate_key_pair_help = "Erzeugt ein ed25519-Schlüsselpaar im Prozess (ohne ssh-keygen, ohne Passphrase) als ~/.ssh/gitpoulpi_ed25519, überschreibt nie eine Datei und trägt beide Pfade oben ein. Den öffentlichen Schlüssel fügen Sie unter Integrationen bei einem Host hinzu."

[settings_editor]
tab_size = "Tab-Breite"
tab_size_help = { git = "Spalten zwischen Tabstopps im eingebauten Editor (Zeichnen, Shift+Tab) und in den Diff-Ansichten. Die Blame-Ansicht zeichnet einen Tab als ein Leerzeichen und ignoriert die Einstellung.", local = "Spalten zwischen Tabstopps im eingebauten Editor (Zeichnen, Shift+Tab) und in den Unterschiedsansichten. Die Blame-Ansicht zeichnet einen Tab als ein Leerzeichen und ignoriert die Einstellung." }
eol = "Zeilenende"
eol_help = "Was der eingebaute Editor beim Speichern schreibt. Auto behält das eigene Zeilenende der Datei (LF für eine neue Datei); LF oder CRLF konvertiert die Datei beim Speichern. Die Statuszeile des Editors zeigt, was das nächste Speichern schreibt."
syntax_highlighting = "Syntaxhervorhebung"
syntax_highlighting_help = { git = "Färbt den eingebauten Editor nach Sprache. Die Diff-Ansichten und die Blame-Ansicht sind nicht syntaxgefärbt.", local = "Färbt den eingebauten Editor nach Sprache. Die Unterschiedsansichten und die Blame-Ansicht sind nicht syntaxgefärbt." }
line_numbers = "Zeilennummern"
line_numbers_help = { git = "Die Nummernspalte des eingebauten Editors und der Diff-Ansichten (dort ist sie leer, die Spalten behalten ihren Platz). Die Blame-Ansicht hat keine.", local = "Die Nummernspalte des eingebauten Editors und der Unterschiedsansichten (dort ist sie leer, die Spalten behalten ihren Platz). Die Blame-Ansicht hat keine." }
follow_selection = "Der Auswahl im Editor folgen"
follow_selection_help = "Solange der Editor offen ist, öffnet die Auswahl einer anderen Datei im rechten Bereich diese ebenfalls im Editor, nachdem gefragt wurde, ob ungespeicherte Änderungen gespeichert werden sollen. Eine Datei, die sich nicht bearbeiten lässt, öffnet sich in ihrer gewohnten Ansicht."
merge_side_by_side_min_width = { git = "Merge-Editor: nebeneinander ab (Spalten)", local = "Zusammenführungs-Editor: nebeneinander ab (Spalten)" }
merge_side_by_side_min_width_help = { git = "Der Merge-Konflikteditor zeigt A und B nebeneinander, wenn sein Bereich mindestens so viele Spalten breit ist (lange Zeilen scrollen seitwärts mit Shift+Mausrad oder Shift+Pfeiltasten); schmaler zeigt er jeweils eine Seite hinter Tabs. Standard 100; 40 ist der niedrigste Wert, 0 heißt immer nebeneinander. Der Editor blendet die Panels Refs und Status aus, solange er offen ist, hat also meist das ganze Fenster.", local = "Der Zusammenführungs-Konflikteditor zeigt A und B nebeneinander, wenn sein Bereich mindestens so viele Spalten breit ist (lange Zeilen scrollen seitwärts mit Shift+Mausrad oder Shift+Pfeiltasten); schmaler zeigt er jeweils eine Seite hinter Tabs. Standard 100; 40 ist der niedrigste Wert, 0 heißt immer nebeneinander. Der Editor blendet die Panels Refs und Status aus, solange er offen ist, hat also meist das ganze Fenster." }
diff_word_wrap = "Zeilenumbruch"
diff_word_wrap_help = { git = "Bricht lange Zeilen in den Diff-Ansichten um, statt sie mit einer Ellipse abzuschneiden. Der eingebaute Editor und die Blame-Ansicht scrollen seitwärts und brechen nicht um. Auch der eigene Umbruch-Schalter der Diff-Ansicht.", local = "Bricht lange Zeilen in den Unterschiedsansichten um, statt sie mit einer Ellipse abzuschneiden. Der eingebaute Editor und die Blame-Ansicht scrollen seitwärts und brechen nicht um. Auch der eigene Umbruch-Schalter der Unterschiedsansicht." }
diff_intraline = "Geänderte Wörter hervorheben"
diff_intraline_help = "Hebt in einer geänderten Zeile die Wörter, die sich von der passenden entfernten oder hinzugefügten Zeile unterscheiden, in jeder {$diff}-Ansicht mit einem stärkeren Hintergrund hervor. Aus: eine einheitliche Tönung pro Zeile. Auch in der Befehlspalette."

[settings_ui]
theme = "Design"
theme_help = "Farben der gesamten Oberfläche. Beim Durchgehen der Liste wird jedes Design vorab angezeigt; Enter übernimmt es, Esc geht zurück. System folgt dem Terminal (seinem hellen oder dunklen Hintergrund, einmal beim Start erkannt; Dunkel, wenn er nicht erkennbar ist). Eigene Design-Dateien im Ordner themes/ der Konfiguration stehen am Ende."
theme_system = "System (folgt dem Terminal)"
follow_theme = "Design folgen"
graph_color_missing = "{name} (nicht gefunden, die Spuren des Designs werden verwendet)"
theme_swatches = "Farben"
graph_lane_background = "Hintergrund der Graph-Spuren"
graph_lane_background_help = "Aus: transparent, nichts hinter den Spuren (Standard). Zeilentönung: ein blasses Band in der Spurfarbe des Commits innerhalb der Graph-Spalte, dazu ein dünner Balken in dieser Farbe am rechten Spaltenrand. Eine gespeicherte Spur wird als Zeilentönung gelesen. Wirkt, wenn die Einstellungen geschlossen werden."
graph_row_tint_strength = "Stärke der Zeilentönung"
graph_row_tint_strength_help = "Wie blass das Band der Zeilentönung ist: Stark (das Original), Mittel (Standard) oder Dezent. Nur das Band wird blasser; der Balken am rechten Spaltenrand behält seine volle Farbe. Wirkt, wenn die Einstellungen geschlossen werden."
graph_row_tint_strength_coming = "zuerst den Hintergrund der Graph-Spuren auf Zeilentönung setzen"
toolbar_position = "Position der Symbolleiste"
toolbar_position_help = "Wo die Symbolleiste sitzt: Oben, Unten (Standard), Links oder Rechts. Links und Rechts machen daraus eine Spalte neben den Bereichen; ein Fenster unter 80 Spalten zeichnet sie unten. Wirkt sofort."
toolbar_align = "Ausrichtung der Schaltflächen der Symbolleiste"
toolbar_align_help = "Wo die Schaltflächen entlang der Leiste sitzen: Anfang (Standard), Mitte oder Ende. Anfang ist links in einer Zeile und oben in einer Spalte; Ende ist rechts und unten. Wirkt sofort."
# context: label of the setting that decides whether a dialog the user moved or resized keeps its place
dialog_geometry = "Position und Größe von Dialogen merken"
dialog_geometry_help = "Eine Einstellung für alle Dialoge. Dialoge lassen sich verschieben (Titelleiste ziehen oder Ctrl+N, dann m); die größeren Fenster lassen sich auch in der Größe ändern (Ränder und untere Ecken ziehen). Jeder Dialog merkt sich seine eigene Position und Größe. Für diese Sitzung (Standard): bleibt bis zum Beenden von GitPoulpi erhalten. Auf Festplatte gespeichert: gilt auch beim nächsten Start. Nie: Jeder Dialog öffnet sich an Standardposition und in Standardgröße. Wirkt sofort."
toolbar_pr_pinned = "{$pr}-Schaltfläche ans Ende heften"
toolbar_pr_pinned_help = "Ein (Standard): Die {$pr}-Schaltfläche sitzt am äußersten Ende der Symbolleiste (rechts, in einer Spalte unten), egal wie ausgerichtet wird. Aus: Sie fließt mit den anderen Schaltflächen und wird mit ihnen ausgerichtet. Wirkt sofort."
statusbar_position = "Position der Statuszeile"
statusbar_position_help = "Wo die Statuszeile (Branch, Zähler, Meldungen, Tastenhinweise) sitzt: Oben, über den Repository-Tabs, oder Unten (Standard). Der Tab Start behält seine eigene Statuszeile unten. Wirkt sofort."
tabs_position = "Position der Tab-Leiste"
tabs_position_help = "Wo die Repository-Tabs sitzen: Oben (Standard), Unten oder Links, eine Liste mit einem Tab pro Zeile am linken Fensterrand. Ein Fenster unter 80 Spalten zeichnet sie oben. Neben einer Symbolleiste als Spalte bleiben die Tabs ganz außen. Wirkt sofort."
graph_color_theme = "Farbschema des Graphen"
graph_color_theme_help = "Die Spurfarbenpalette des Log-Graphen. „Design folgen“ nimmt die Palette des gewählten Designs; jeder andere Eintrag überschreibt sie, so lässt sich jedes Design mit jeder Palette kombinieren. Wirkt beim Schließen der Einstellungen."
graph_renderer = "Graph-Darstellung"
graph_renderer_help = "auto zeichnet den Graphen als echtes Bild in einem Terminal, das dies unterstützt, und überall sonst als Zeichen - auch in zellij und screen, die die Umgebung des Terminals erben, das Bild aber nicht durchreichen, in tmux, solange das Terminal dahinter kein Sixel kann, und in herdr, solange dessen Einstellung kitty_graphics nicht an ist. image erzwingt das Bild, text schaltet es aus. Erfordert einen Neustart."
image_protocol = "Bildprotokoll"
image_protocol_help = "Wie Bilder (das Graph-Bild, Autoren-Avatare) das Terminal erreichen. auto: das Kitty-Grafikprotokoll in kitty, Ghostty und einem herdr, dessen Konfiguration kitty_graphics = true setzt; das Kitty-Protokoll auch in iTerm2 ab 3.7.7; iTerm2-Inline-Bilder in WezTerm, Rio, mintty und älteren iTerm2-Versionen; Sixel-Bilder (die Graph-Spalte und die Avatare) in Windows Terminal, foot, Tabby, Konsole, mlterm und in tmux, wenn das Terminal dahinter Sixel kann; sonst Zeichen. kitty, iterm2 oder sixel erzwingt dieses Protokoll (kitty für ein herdr, dessen Konfiguration woanders liegt; sixel für ein Terminal, das es darstellt, aber nicht erkannt wird); none schaltet Bilder aus. Erfordert einen Neustart."
kitty_keyboard = "Kitty-Tastaturprotokoll"
kitty_keyboard_help = "auto fragt beim Start innerhalb von etwa 100 ms das Terminal, ob es das Kitty-Tastaturprotokoll beherrscht, und nutzt es dann: Tastenkombinationen, die alte Terminals nicht unterscheiden können (Ctrl mit Satzzeichen, Ziffern, Shift oder Enter), kommen dann so an, wie sie sind, statt mit Steuercodes zu kollidieren. Ein Terminal, das nicht antwortet, behält die alten Tasten. off berührt den Tastaturmodus des Terminals nie. Erfordert einen Neustart."
color_depth = "Farbtiefe"
color_depth_help = "auto nutzt 24-Bit-Farben, außer auf Terminals, die sie nicht darstellen (Apple Terminal, Linux-Konsole oder ein 256-Farben-Terminal ohne COLORTERM); dort werden die Farben auf die nächsten 256 oder 16 Einträge abgebildet. truecolor, 256 und 16 erzwingen eine Tiefe. Wirkt sofort."
text_cursor = "Textcursor"
text_cursor_help = "terminal setzt den eigenen Cursor des Terminals an die Einfügemarke des fokussierten Textfelds, als Balken: die Cursor-Einstellungen Ihres Terminals gelten, und das Kandidatenfenster einer Eingabemethode öffnet sich an der Einfügemarke. drawn zeichnet die eigene Einfügemarke von GitPoulpi (einen Block oder einen Unterstrich) und hält den Terminalcursor verborgen. Wirkt sofort."
graph_show_stashes = { git = "Stashes im Graph anzeigen", local = "Zwischenspeicher im Graph anzeigen" }
graph_show_stashes_help = { git = "Jeder Stash erhält im Log eine eigene Zeile an seinem Datum: ein kleines Kästchen auf einer Spur neben dem Commit, auf dem er entstand, durch eine gestrichelte Linie verbunden. Die Auswahl zeigt, was er geändert hat; Rechtsklick (oder .) bietet Pop, Apply und Drop. Aus hält Stashes nur im Abschnitt STASHES. Wird beim Solo nicht gezeichnet.", local = "Jeder Zwischenspeicher erhält im Log eine eigene Zeile an seinem Datum: ein kleines Kästchen auf einer Spur neben dem Commit, auf dem er entstand, durch eine gestrichelte Linie verbunden. Die Auswahl zeigt, was er geändert hat; Rechtsklick (oder .) bietet Wiederherstellen, Anwenden und Verwerfen. Aus hält Zwischenspeicher nur im Abschnitt ZWISCHENSPEICHER. Wird beim Solo nicht gezeichnet." }
ref_connector = "Verbinder von Ref zu Commit"
ref_connector_help = "Eine dünne Linie von jeder Ref-Pille in der Ref-Spalte zum Kreis ihres Commits im Graph. Sie füllt nur freien Platz: Spuren, die sie kreuzt, bleiben oben, und nichts verschiebt sich. Wird nur gezeichnet, solange die Ref-Spalte direkt links von der Graph-Spalte steht."
log_wip_counts_in_message = "WIP-Änderungszähler in der Nachricht zeigen, wenn die Spalte Änderungen ausgeblendet ist"
log_wip_counts_in_message_help = "Die WIP-Zeile zeigt, wie viele Dateien geändert, hinzugefügt und gelöscht sind. Bei sichtbarer Spalte Änderungen (Rechtsklick auf die Log-Kopfzeile zum Einblenden) stehen die Zähler immer in dieser Spalte, wie bei jedem Commit. Ist sie ausgeblendet, stehen sie bei eingeschalteter Einstellung in der WIP-Nachricht; aus zeigt gar keine Zähler."
avatars = "Autoren-Avatare"
avatars_help = "Autorenbilder. graph zeichnet den Autor jedes Commits in dessen Kreis im Graph (nur beim Bild-Graph; beim Text-Graph steht stattdessen ein farbiger Initialbuchstabe in der Spalte Autor). author setzt ein rundes Bild an den Anfang der Spalte Autor. Beide zeigen es auch im Commit-Detailbereich. Standardmäßig aus: Das Einschalten sendet einen SHA-256-Hash der E-Mail-Adresse jedes Autors per HTTPS an gravatar.com - der Hash einer bekannten oder erratbaren Adresse ist nicht anonym - und fragt in einem Repository mit github.com-Remote die GitHub-API einmal je Autor, welches Konto einen seiner Commits erstellt hat (mit dem Token Ihrer GitHub-Integration, falls vorhanden). Bis ein Bild eintrifft und wenn keines existiert, werden die Initialen oder der einfache Kreis gezeigt. off sendet nichts über das Netzwerk."
avatar_sources = "Avatar-Quellen"
avatar_sources_help = "Wo das Bild eines Autors der Reihe nach gesucht wird (eine GitHub-noreply-Adresse nennt ihr Konto immer zuerst). hosting_gravatar: die verbundene GitHub-, GitLab- oder Bitbucket-Integration, deren Host zum Remote des Repositorys passt (GitHub-Commit-Autor oder Benutzersuche, GitLab-Avatar per E-Mail oder Users-API), dann Gravatar; ist keine passende Integration verbunden, kommt Gravatar zuerst, und ein github.com-Remote wird zuletzt noch unauthentifiziert gefragt. gravatar_hosting: umgekehrt. gravatar oder hosting: nur diese eine. Hat keine ein Bild, wird der Avatar-Ersatz unten gezeichnet. Gilt für noch nicht nachgeschlagene Autoren."
avatar_fallback = "Avatar-Ersatz"
avatar_fallback_help = "Was ein Autor ohne Bild erhält. identicon: ein gespiegeltes 5x5-Muster im GitHub-Stil in einer aus der E-Mail abgeleiteten Farbe, lokal erzeugt (kein Netzwerk), als Bild in einem Bild-Terminal und sonst als Blockzeichen. initials: ein farbiges Abzeichen mit den Initialen."
composer_files = "Composer-Vorschläge"
composer_files_help = "Wie die Prüfung des KI-Commit-Composers geöffnet wird. expanded: Jeder vorgeschlagene Commit listet seine Dateien. collapsed: nur die Commit-Zeilen; Rechts/Links (oder ein Klick auf den Pfeil) öffnet einen."
blame_side = "Blame-Annotationen"
blame_side_help = "Auf welcher Seite der Blame-Ansicht die Annotationsspalte steht (Avatar, Autor, Alter, Zusammenfassung). right: rechts vom Code. left: links vom Code."
column_resize = "Spaltengröße ändern"
column_resize_help = "Wie eine Spaltengrenze im Log, im Radar und in der Seitenspalte der Dateiansichten gegriffen wird. line: eine dünne Linie über die ganze Höhe der Tabelle, solange der Zeiger auf der Grenze steht, mit einer kleinen Markierung in der Kopfzeile. header: keine Lücke und keine Markierung, die Größe ändert sich nur über die Kopfzeile, wo das erste Zeichen der nächsten Zelle aufleuchtet."
blame_width = "Breite der Blame-Annotationen"
blame_width_help = "Breite der Annotationsspalte in Zellen (24 bis 90). Ihren Rand in der Blame-Ansicht ziehen oder die Tasten zum Verbreitern / Verschmälern nutzen; die neue Breite wird hier gespeichert."
ref_tree = "Branch-Ordnerbaum"
ref_tree_help = "Die Refs-Seitenleiste gruppiert Branch-Namen an `/` zu einklappbaren Ordnern, wobei jedes Remote ein eigener Knoten oberster Ebene ist. Aus ergibt eine flache Zeile je Branch. `y` im Refs-Bereich schaltet es live um und schreibt die Wahl hierher."
tree_folders_first = "Ordner zuerst in der Baumansicht"
tree_folders_first_help = "Die Baumansicht der Dateibereiche (Änderungen, Details, Vergleich) listet die Unterordner eines Ordners vor seinen Dateien auf. Aus behält die einfache alphabetische Pfadreihenfolge. Die flache Liste ist nicht betroffen."
reveal_on_ref_click = "Klick auf eine Ref zeigt sie im Graph"
reveal_on_ref_click_help = "Ein einfacher Klick auf eine Ref im Refs-Bereich scrollt den Log dorthin, wohin sie zeigt, und lässt die Zeile kurz aufblinken. Die Auswahl im Log und das rechte Panel bleiben unverändert. Aus wählt ein Klick nur die Zeile der Seitenleiste aus. „Im Graph anzeigen“ im Menü der Ref, ihre Taste im Refs-Bereich und der Paletten-Befehl funktionieren in beiden Fällen."
graph_ghost_ref = "Platzhalter für Branch am überfahrenen {$Commit} zeigen"
graph_ghost_ref_help = "In der Ref-Spalte des Logs zeigt der überfahrene {$Commit}, der keine eigene Ref hat, eine blasse Pille mit dem Namen des Branches, zu dem er gehört (sonst der Remote-Branch), aus dem Verlauf abgeleitet. Die Pille zeigt beim Überfahren ihre Art; ein Klick darauf bewirkt nichts, einen Branch legt der Befehl zum Erstellen eines Branches an. Sie erscheint nur, wo die Ref-Spalte Platz hat. Aus blendet sie aus."
mouse_enabled = "Maus aktiviert"
mouse_enabled_help = "Aus überlässt das Auswählen per Klicken und Ziehen Ihrem Terminal. Erfordert einen Neustart."
mouse_scroll_lines = "Zeilen pro Mausrad-Raste"
mouse_scroll_lines_help = "Wie viele Commits eine Mausrad-Raste im Log bewegt. Erfordert einen Neustart."
heading_date_time = "Datum und Uhrzeit"
heading_layout = "Layout"
date_locale = "Gebietsschema für Datum/Uhrzeit"
date_locale_help = "system: Monats- und Tagesnamen folgen der Oberflächensprache. english: immer englische Namen, egal welche Sprache. Gilt für alle Datumsangaben dieser Seite."
diff_layout = "Standardlayout"
diff_layout_help = { git = "Inline (eine Spalte) oder Split (vorher und nachher nebeneinander). Wird vom zuletzt betrachteten Diff fortgesetzt, in diesem Fenster und über Neustarts hinweg - eine Änderung hier legt nur fest, womit eine *neue* Sitzung beginnt.", local = "Inline (eine Spalte) oder Split (vorher und nachher nebeneinander). Wird von den zuletzt betrachteten Unterschieden fortgesetzt, in diesem Fenster und über Neustarts hinweg - eine Änderung hier legt nur fest, womit eine *neue* Sitzung beginnt." }
diff_hunks_only = "Nur Hunks"
diff_hunks_only_help = "An zeigt nur die geänderten Hunks mit ein paar Zeilen Kontext; aus zeigt die ganze Datei mit an Ort und Stelle hervorgehobenen Änderungen. Wird wie das Layout fortgesetzt."
diff_show_whitespace = "Reine Leerraum-Änderungen anzeigen"
diff_show_whitespace_help = "Aus klappt einen Hunk, der sich nur im Leerraum unterscheidet, zu Kontext zusammen."
input_color = "Eingabefarbe"
input_color_help = "Hintergrund von Texteingaben. „Design folgen“ (Standard) nimmt den des Designs; die anderen sind dunkle Farben, die ihn überschreiben. Benutzerdefiniert... verwendet die Hex-Farbe unten. Wirkt live, kein Neustart."
input_color_custom = "Benutzerdefinierte Eingabefarbe"
input_color_custom_help = "#rrggbb, verwendet, wenn die Eingabefarbe Benutzerdefiniert ist. Wirkt live."
minimap = "Minimap"
minimap_help = { git = "Ein Bild der ganzen Datei neben der vertikalen Bildlaufleiste des Diffs (Ganzdatei-Modus) und des Editors, der sichtbare Teil hervorgehoben; zum Springen anklicken. Ein echtes Bild, wo das Terminal es darstellt, sonst Braille-Zellen. Auch `M` im Diff und „Minimap umschalten“ der Palette.", local = "Ein Bild der ganzen Datei neben der vertikalen Bildlaufleiste der Unterschiede (Ganzdatei-Modus) und des Editors, der sichtbare Teil hervorgehoben; zum Springen anklicken. Ein echtes Bild, wo das Terminal es darstellt, sonst Braille-Zellen. Auch `M` in den Unterschieden und „Minimap umschalten“ der Palette." }
date_format = "Datumsformat"
date_format_help = "Die Datumsspalte Blame / Dateiverlauf."
date_time_format = "Datums-/Zeitformat"
date_time_format_help = "Die Datumsspalte des Logs selbst."
date_verbose_format = "Ausführliches Datumsformat"
date_verbose_format_help = "Die Datumszeile des Commit-Detailbereichs, der Hover-Tooltip der Datumsspalte und Kopieren > Datum."
preview = "Vorschau"
sidebar_sections_scope = "Abschnitte der Seitenleiste"
sidebar_sections_scope_help = "Wessen Auswahl die ein- und ausgeblendeten Abschnitte der Seitenleiste sind. repository: Jedes Repository behält seine eigene Auswahl (die globale ist der Ausgangspunkt). global: Eine Auswahl für alle Repositorys. Beim Umschalten geht keine der beiden Auswahlen verloren."
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "Spaltenlayout"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "Wie das Log seine Spalten anordnet. fit: jede Spalte passt in den Bereich, nur die Nachricht ist flexibel. scroll: Spalten behalten ihre Breiten, die Nachricht auch, und die Tabelle scrollt seitlich, wenn sie breiter als der Bereich ist."

[settings_git]
default_backend = "Git-Backend"
default_backend_help = "Global. Ein laufender Daemon behält das Backend, mit dem er gestartet wurde."
default_backend_warning = "Gilt für Daemons, die nach dieser Änderung gestartet werden."
pull_mode = { git = "Pull-Schaltfläche", local = "Schaltfläche „Holen“" }
default_encoding = "Standardkodierung"
default_encoding_help = { git = "Wird verwendet, um Dateiinhalte, Blame und Diffs anzuzeigen, die kein gültiges UTF-8 sind (gültiges UTF-8 wird nie neu dekodiert). Ein Repository kann sie unten überschreiben. Nur Anzeige: Staging und Patches behalten die Bytes der Datei exakt.", local = "Wird verwendet, um Dateiinhalte, Blame und Unterschiede anzuzeigen, die kein gültiges UTF-8 sind (gültiges UTF-8 wird nie neu dekodiert). Ein Repository kann sie unten überschreiben. Nur Anzeige: Bereitstellung und Patches behalten die Bytes der Datei exakt." }
push_behavior = { git = "Push-Schaltfläche", local = "Schaltfläche „Hochladen“" }
push_behavior_help = { git = "direct: sofort an das Standard-Remote pushen. ask: ein kleines Menü mit vorgewähltem Standard-Remote öffnen. Das ▾ der Schaltfläche fragt immer.", local = "direct: sofort an das Standard-Remote hochladen. ask: ein kleines Menü mit vorgewähltem Standard-Remote öffnen. Das ▾ der Schaltfläche fragt immer." }
repo_encoding_help = { git = "Wie Dateiinhalte, Blame und Diffs zur Anzeige dekodiert werden, wenn sie kein gültiges UTF-8 sind (nur dieses Repository; inherited: Standardkodierung auf dieser Seite). Das Staging kodiert nie etwas um.", local = "Wie Dateiinhalte, Blame und Unterschiede zur Anzeige dekodiert werden, wenn sie kein gültiges UTF-8 sind (nur dieses Repository; inherited: Standardkodierung auf dieser Seite). Die Bereitstellung kodiert nie etwas um." }
core_autocrlf_help = "In die Git-Konfiguration dieses Repositorys geschrieben (core.autocrlf), also für Git und jedes andere Werkzeug sichtbar. true: LF beim Checkout zu CRLF; input: CRLF nur beim Speichern in den Verlauf zu LF; false: nie umwandeln. (geerbt): entfernt den Repository-Wert, sodass Ihre globale Git-Konfiguration gilt. Rückgängig machbar."
core_eol_help = "In die Git-Konfiguration dieses Repositorys geschrieben (core.eol): das Zeilenende, das Git für Textdateien im Arbeitsverzeichnis nutzt (lf, crlf oder native für das der Plattform). (geerbt): entfernt den Repository-Wert, sodass Ihre globale Git-Konfiguration gilt. Rückgängig machbar."
git_lfs = "Git LFS"
git_lfs_help = { git = "Git LFS in der Oberfläche zeigen (das LFS-Tag, die Diff-Karte, das Banner für das fehlende Programm, die LFS-Befehle) und GitPoulpi seine eigenen LFS-Schritte ausführen lassen (Objekte nach einem Klon herunterladen). Aus: Die eigenen LFS-Filter von git laufen weiterhin, GitPoulpi ruft git-lfs nie selbst auf.", local = "Git LFS in der Oberfläche zeigen (das LFS-Tag, die Unterschiedskarte, das Banner für das fehlende Programm, die LFS-Befehle) und GitPoulpi seine eigenen LFS-Schritte ausführen lassen (Objekte nach einem Klon herunterladen). Aus: Die eigenen LFS-Filter von git laufen weiterhin, GitPoulpi ruft git-lfs nie selbst auf." }
git_lfs_program = "Programm git-lfs"
git_lfs_program_help = "Von https://git-lfs.com installieren (Windows: in Git for Windows enthalten oder `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Palette: LFS: Installationsseite öffnen."
initialize_lfs_for_this_repository = "LFS für dieses Repository initialisieren"
initialize_lfs_for_this_repository_help = "Führt `git lfs install --local` aus: die LFS-Filter und -Hooks in der eigenen Konfiguration dieses Repositorys, nie in Ihrer globalen. Erfordert git-lfs."
pull_mode_help = "Was die Schaltfläche {$Pull}{hint} der Symbolleiste tut: merge (Fast-Forward, wenn möglich), ff_only oder rebase. Die ▾-Einträge der Schaltfläche führen sofort ihre eigene Aktion aus und ändern dies nicht."
merge_fast_forward = "{$Merge}: Fast-Forward"
merge_fast_forward_help = "Wie ein von Ihnen gestarteter {$Merge} (Branch-Menü, Drag-and-drop, Palette, Kommandozeile) mit einem Branch umgeht, der sich einfach vorspulen ließe. never: immer einen {$Merge}-{$Commit} erzeugen. allowed: per Fast-Forward vorspulen, wenn möglich, wie es Git standardmäßig tut. only: nur Fast-Forward, sonst abbrechen. Ein Repository kann das auf seiner Seite „{$Merge}-Optionen“ überschreiben."
repo_heading = "Repo: {repo} - nur dieses Repository"
inherited = "(geerbt)"
lfs_not_checked = "(noch nicht geprüft)"
lfs_autofix_filters = "LFS-Filter vor {$pull} und {$push} installieren"
lfs_autofix_filters_help = "Vor einem {$pull} oder {$push} in einem Repository mit Git LFS wird `git lfs install --local` ausgeführt, wenn die LFS-Filter oder die Hooks fehlen (nur die eigene Konfiguration des Repositorys, nie die globale), damit die Übertragung die großen Dateien behandelt. Die Statuszeile meldet es. Benötigt git-lfs."
push_group_preflight = "Jedes Remote vor einem {$Push} prüfen"
push_group_preflight_help = "Vor einem {$Push} eines Branches, der noch an weitere Remotes sendet, zuerst jedes Remote ansehen (eine kurze Abfrage, plus ein Download von diesem Remote nur, wenn es abweicht), damit ein Problem beim dritten Remote sichtbar wird, bevor der erste {$Push} startet. Aus: nacheinander an jedes Remote senden und berichten, was passiert ist."
default_push_targets = "Weitere Remotes für den {$Push} neuer Branches"
default_push_targets_help = "Nur dieses Repository. Haken Sie die Remotes an, an die ein neuer Branch zusätzlich zu seinem Upstream sendet. Sie werden in den Branch kopiert, sobald er zum ersten Mal einen Upstream bekommt (ein erster {$Push}, der ihn setzt, oder ein aus einem Remote-Branch erstellter Branch). Bereits vorhandene Branches bleiben unverändert: Ändern Sie sie im Remotes-Dialog des Branches."
default_push_targets_none = "(kein Remote konfiguriert)"

