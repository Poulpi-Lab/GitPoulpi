pop = { git = "Pop", local = "wiederherstellen" }
apply = { git = "Apply", local = "anwenden" }
stash_drop = { git = "Drop", local = "verwerfen" }
tag = { git = "Tag", local = "Tag" }
tags = { git = "Tags", local = "Tags" }
head = { git = "HEAD", local = "HEAD" }
diff = { git = "Diff", local = "Unterschiede" }
pr = { git = { pull = "Pull Request", merge = "Merge Request" }, local = { pull = "Pullanforderung", merge = "Änderungsanfrage" } }
