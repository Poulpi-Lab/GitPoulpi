# S23: what the host protects, and the three ways through it. Never done
# automatically: these are instructions. The git words are terms ({$push},
# {$tag}, {$prs}) so "Translate git terms" works here too; the exact commands
# are in the English CLI text, not here.
[rewrite_host]
protected_on = "geschützt auf {provider}"
btn_howto = "So geht es weiter"
title = "Am Schutz des Hosts vorbeikommen"
intro = "Der Host lehnt den umgeschriebenen Verlauf von {names} ab, weil {provider} ihn schützt. GitPoulpi ändert nie die Einstellungen des Hosts für Sie; es gibt drei Wege, vom mildesten zum drastischsten."
unknown = "Der Schutz des Hosts ließ sich nicht lesen: {why}"
not_asked = "Dieses Repository ist nicht mit einem Host verknüpft, daher wurde sein Schutz nicht gelesen. In der Seitenleiste verknüpfen, um zu sehen, welche Branches geschützt sind."
refs_unknown = "Schutz auf dem Host unbekannt: {why}"
any_branch = "der geschützte Branch"
way_lift = "1. Den Schutz in den Einstellungen des Hosts vorübergehend aufheben"
way_rename = "2. Den umgeschriebenen Verlauf per {$push_noun} unter neuem Branch-Namen senden, dann den Standard-Branch wechseln"
way_recreate = "3. Letzter Ausweg: das Remote-Repository löschen und neu anlegen"
step_lift_github = "In den Einstellungen des Repositorys unter Settings > Branches (Regeln zum Branch-Schutz) und Settings > Rules (Rulesets) die Regel, die den Branch abdeckt, entfernen oder lockern, den umgeschriebenen Verlauf per {$push_noun} senden und die Regel danach wiederherstellen."
step_lift_gitlab = "Settings > Repository > Protected branches öffnen, den Schutz des Branches aufheben (oder die Option einschalten, die das Umschreiben seines Verlaufs erlaubt) und ihn nach dem Senden des umgeschriebenen Verlaufs wieder schützen."
step_lift_azure = "Project settings > Repositories > das Repository > Policies öffnen, die Branch-Richtlinie des Branches entfernen und sich unter Security selbst die Berechtigung geben, den Verlauf umzuschreiben und Branches zu löschen, den umgeschriebenen Verlauf per {$push_noun} senden und beides wiederherstellen."
step_lift_bitbucket = "In den Einstellungen des Repositorys unter Branch restrictions (auf Data Center: Branch permissions) die Einschränkung, die den Branch abdeckt, entfernen, den umgeschriebenen Verlauf per {$push_noun} senden und die Einschränkung danach wiederherstellen."
step_lift_other = "Die Regel zum Branch-Schutz in den Repository-Einstellungen des Hosts entfernen oder lockern, den umgeschriebenen Verlauf per {$push_noun} senden und die Regel danach wiederherstellen."
step_push_new_name = "Den umgeschriebenen Verlauf per {$push_noun} unter neuem Namen auf einen nicht geschützten Branch senden (GitPoulpi lässt die geschützte Ref in Ruhe)."
step_switch_github = "Danach unter Settings > Branches den neuen Branch als Standard-Branch festlegen (oder zuerst den alten über Settings > Branches > Stiftsymbol > Rename umbenennen) und den alten Branch löschen, sobald ihn niemand mehr nutzt."
step_switch_gitlab = "Danach unter Settings > Repository > Branch defaults den neuen Branch als Standard-Branch festlegen und den alten (Code > Branches) löschen, sobald ihn niemand mehr nutzt."
step_switch_azure = "Danach unter Repos > Branches im Menü des neuen Branches Set as default branch wählen und den alten löschen, sobald ihn niemand mehr nutzt."
step_switch_bitbucket = "Danach in den Einstellungen des Repositorys unter Repository details den neuen Branch als Hauptbranch festlegen (auf Data Center: Standard-Branch) und den alten löschen, sobald ihn niemand mehr nutzt."
step_switch_other = "Danach den neuen Branch in den Repository-Einstellungen des Hosts zum Standard-Branch machen und den alten löschen, sobald ihn niemand mehr nutzt."
step_recreate = "Das Remote-Repository in seinen Einstellungen löschen, ein leeres mit demselben Namen anlegen und dann jeden Branch und jeden {$tag} per {$push_noun} senden. Alle müssen neu klonen."
