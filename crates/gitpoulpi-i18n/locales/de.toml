private_key_path = "Pfad des privaten Schlüssels"
private_key_path_help = "Schlüsseldatei, die {$Fetch}, {$Pull}, {$Push} und Clone ssh anbieten (ssh -i <Schlüssel> -o IdentitiesOnly=yes). Leer: ssh-agent und Ihre ssh-Konfiguration wie gewohnt. Wird ignoriert, wenn ein Repository einen eigenen Schlüssel wählt (SSH & Zugangsdaten) oder wenn GIT_SSH_COMMAND oder core.sshCommand gesetzt ist. Gilt ab der nächsten Übertragung."
public_key_path = "Pfad des öffentlichen Schlüssels"
public_key_path_help = "Nur genutzt, wenn der Pfad des privaten Schlüssels leer ist: ssh wählt dann den passenden Schlüssel aus dem ssh-agent (oder einen Hardwareschlüssel), statt alle Agent-Schlüssel anzubieten. Schlüsselpaar erzeugen füllt beide. Gleiche Rangfolge wie beim Pfad des privaten Schlüssels."
