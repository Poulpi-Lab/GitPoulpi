squash = { git = "Squash", local = "Zusammenfassen" }
fixup = { git = "Fixup", local = "Einarbeiten" }
drop = { git = "Drop", local = "Verwerfen" }
edit = { git = "Edit", local = "Bearbeiten" }
stage = { git = "stagen", local = "bereitstellen" }
unstage = { git = "unstagen", local = "Bereitstellung aufheben" }
staged = { git = "staged", local = "bereitgestellt" }
unstaged = { git = "unstaged", local = "nicht bereitgestellt" }
