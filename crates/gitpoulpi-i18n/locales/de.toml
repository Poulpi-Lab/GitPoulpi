journal_outside_help = "Wenn aktiv, erscheint im Rückgängig-Verlauf, was eine Shell oder ein KI-Agent an Branches, {$tags}, {$stashes} und HEAD tut, als „außerhalb“ markiert, und Ctrl+Z kann es zurücknehmen. Änderungen an Dateien im Arbeitsverzeichnis werden nie erfasst. Setzt aktiviertes Rückgängig voraus."
remember_tabs = "Tabs merken"
remember_tabs_help = "An: Die beim letzten Beenden offenen Tabs werden beim nächsten Start wieder geöffnet. Aus: Ein Start beginnt mit einem Tab – dem Repository, auf das gezeigt wurde. Wird einmal beim Start gelesen; erfordert einen Neustart."
radar_enabled = "Radar aktivieren"
radar_enabled_help = "Aus: Der Radar-Tab, seine Befehle und sein Kurzbefehl sind ausgeblendet, und im Hintergrund wird dafür nichts abgerufen. Wirkt sofort."
startup_tab_in_repo = "Start-Tab in einem Repository"
startup_tab_in_repo_help = "Der Tab, auf dem ein Start öffnet, wenn der Ordner, in dem er beginnt, in einem Repository liegt. Aktuelles Repository öffnet den Tab dieses Repositorys, bei Bedarf neu geöffnet. Letzter Tab öffnet den Tab, der beim letzten Beenden aktiv war (Home, wenn Tabs merken aus ist). Ein mit --repo angegebenes Repository öffnet immer seinen eigenen Tab. Wird einmal beim Start gelesen; erfordert einen Neustart."
startup_tab_outside_repo = "Start-Tab außerhalb eines Repositorys"
startup_tab_outside_repo_help = "Der Tab, auf dem ein Start öffnet, wenn der Ordner, in dem er beginnt, kein Repository ist, etwa ein Benutzerordner. Letzter Tab öffnet den Tab, der beim letzten Beenden aktiv war (Home, wenn Tabs merken aus ist oder nichts gemerkt wurde). Radar öffnet Home, wenn das Radar aus ist. Wird einmal beim Start gelesen; erfordert einen Neustart."
startup_tab_launcher = "Start-Tab über den Starter"
startup_tab_launcher_help = "Der Tab, auf dem ein Start öffnet, wenn GitPoulpi über seine Desktop- oder Startmenü-Verknüpfung gestartet wird (siehe Starter unten), egal in welchem Ordner. Hat Vorrang vor den beiden Einstellungen darüber; Letzter Tab und Radar verhalten sich wie dort. Wird einmal beim Start gelesen; erfordert einen Neustart."
group_worktree_tabs = "Worktree-Tabs gruppieren"
group_worktree_tabs_help = "Die Tabs der verknüpften Worktrees eines Repositorys stehen direkt hinter dessen Tab, und ein weggezogener Worktree-Tab springt dorthin zurück. Aus lässt die Tabs dort, wo Sie sie ablegen. Beim Einschalten werden die geöffneten Tabs neu gruppiert."
allow_agent_view_control = "KI-Agenten die Ansicht steuern lassen"
allow_agent_view_control_help = "An: Ein KI-Agent (über MCP oder `gitpoulpi ui`) kann dieses Fenster bitten, einen Commit, eine Datei oder einen Hinweis anzuzeigen. Er ändert nie etwas im Repository. Aus: Dieses Fenster nimmt sie nicht an. Wird beim Öffnen eines Fensters gelesen."
allow_ui_propose = "KI-Agenten Änderungen zur Bestätigung vorschlagen lassen"
allow_ui_propose_help = "An: Ein KI-Agent darf einen für Sie vorausgefüllten Dialog öffnen: eine neue Nachricht für einen Commit, eine Commit-Nachricht im Composer, einen neuen Branch oder Tag. Er ist mit ✦ Vorgeschlagen von <Agent> markiert, und nichts ändert sich, bis Sie die eigene Bestätigung des Dialogs drücken; Esc lehnt ihn ab. Aus (Standard): `ui propose` und die MCP-Tools ui_propose_* werden abgelehnt."
clone_root = "Standard-Klonordner"
clone_root_help = "Wo „Klonen nach“ im Klon-Dialog beginnt. Leer verwendet den Standard je Betriebssystem: %USERPROFILE%\\source\\repos unter Windows, sonst ~/src."
# context: setting: which source the Clone dialog opens on (Last used, Clone with URL, or an integration)
clone_start_source = "Klon-Dialog beginnt bei"
clone_start_source_help = "Die Quelle, bei der der Klon-Dialog beginnt. Zuletzt verwendet öffnet die Quelle, die beim letzten Schließen angezeigt wurde; Per URL klonen beginnt immer beim URL-Formular; oder wählen Sie eine Ihrer verbundenen Integrationen. Eine nicht mehr verfügbare Quelle fällt auf Per URL klonen zurück."
# context: option of the "Clone dialog starts on" setting: the source shown when the dialog was last closed
clone_start_last = "Zuletzt verwendet"
browse_root = "Standardordner für Durchsuchen"
browse_root_help = "Wo Durchsuchen (die Ordnerauswahl im Home-Tab) standardmäßig öffnet. Leer lässt Durchsuchen im zuletzt gewählten Ordner öffnen – beim allerersten Mal im Home-Ordner – statt in einem festen."
heading_auto_stash = { git = "Auto-Stash", local = "Auto-Zwischenspeicher" }
heading_log = "Anwendungsprotokoll"
heading_undo = "Rückgängig-Verlauf"
log_level = "Protokollstufe"
log_retention_days = "Protokolldateien aufbewahren"
# context: setting help: how long log files are kept; a number and a unit (days, weeks, months, years) on one line
log_retention_help = "Ältere Protokolldateien werden beim Start von GitPoulpi gelöscht. Die Datei jedes Tages ist außerdem durch die Größeneinstellung unten begrenzt."
# context: setting: where the data GitPoulpi keeps for one repository lives (ref filters, fold state, workflow, caches)
repo_data_location = "Speicherort der Repository-Daten"
# context: help of the setting above
repo_data_location_help = "Wo die Daten je Repository (Ref-Filter, Workflow, Caches) liegen. Innerhalb von .git bleibt das Arbeitsverzeichnis sauber; beim Ändern der Einstellung werden vorhandene Daten mitgenommen."
# context: option of the repository data location: inside the repository's .git folder
repo_data_in_git_dir = "In .git (Ordner gitpoulpi)"
# context: option of the repository data location: a .gitpoulpi folder in the working tree
repo_data_in_worktree = "Im Arbeitsverzeichnis (Ordner .gitpoulpi)"
# context: option of the repository data location: the user's own data folder
repo_data_user_data = "In meinem Benutzerdatenordner (außerhalb des Repositorys)"
log_max_file_mb = "Maximale Größe einer Protokolldatei"
log_timings = "Dauer der Vorgänge anzeigen"
log_timings_help = "Zeigt bei jedem Vorgang im Aktivitätsprotokoll (Tab „Git-Vorgänge“) die Dauer in Millisekunden."
log_extended = "Erweiterte Protokollierung"
log_extended_help = "Listet auch Hintergrundvorgänge (Auto-{$fetch}, Aktualisierung, Statusabfrage) mit ihrer Dauer auf."
# context: setting: how the status line counts the total commits (the dropdown choices are in settings_value)
commit_count = "Gesamtzahl der {$Commits} zählen mit"
# context: help of the setting above; mentions antivirus software
commit_count_help = "Wie die Statuszeile die Gesamtzahl für „geladen / gesamt“ ermittelt. System-Git startet einen Git-Prozess (normalerweise am schnellsten). libgit2 zählt in GitPoulpi selbst und startet keinen Prozess: Wählen Sie es, wenn eine Antivirensoftware jeden Befehl prüft und Git dadurch langsam wird. Aus zeigt nur die geladenen {$Commits}. Wirkt sofort."
auto_stash = "Auto-{$stash} vor Checkout, {$pull}, {$merge} oder {$rebase}"
auto_stash_help = { git = "Was geschieht, wenn ein Checkout, Pull, Merge oder Rebase durch lokale Änderungen blockiert wird. ask: Ein Dialog bietet an, sie zu stashen, den Vorgang auszuführen und den Stash wieder zu poppen; always: das ohne Nachfrage tun; never: ablehnen, wie git es tut.", local = "Was geschieht, wenn ein Checkout, Holen, Zusammenführen oder Rebase durch lokale Änderungen blockiert wird. ask: Ein Dialog bietet an, sie beiseitezulegen, den Vorgang auszuführen und den Zwischenspeicher danach wiederherzustellen; always: das ohne Nachfrage tun; never: ablehnen, wie Git es tut." }
include_untracked_in_autostash = { git = "Unversionierte Dateien in den Auto-Stash aufnehmen", local = "Unversionierte Dateien in den Auto-Zwischenspeicher aufnehmen" }
include_untracked_in_autostash_help = { git = "Ob der automatische Stash auch unversionierte Dateien erfasst (sonst werden nur versionierte Änderungen gestasht und zurückgelegt).", local = "Ob der automatische Zwischenspeicher auch unversionierte Dateien erfasst (sonst werden nur versionierte Änderungen beiseitegelegt und zurückgelegt)." }
hosting_refresh_minutes = { git = "Aktualisierung von {$prs} und Issues", local = "Aktualisierung von {$Prs} und Issues" }
hosting_refresh_minutes_help = { git = "Wie oft die Listen {$prs} und Issues der Seitenleiste (und der Chip des verknüpften {$pr_abbr} in der Symbolleiste) den Host erneut fragen. 0 schaltet den Timer aus; sie aktualisieren sich weiterhin beim Öffnen eines Repositorys, beim Branch-Wechsel, nach Push oder Fetch und auf Anforderung.", local = "Wie oft die Listen {$Prs} und Issues der Seitenleiste (und der Chip der verknüpften {$Pr} in der Symbolleiste) den Host erneut fragen. 0 schaltet den Timer aus; sie aktualisieren sich weiterhin beim Öffnen eines Repositorys, beim Branch-Wechsel, nach dem Hochladen oder Abrufen und auf Anforderung." }
# context: label of the row that sets the name messages to a host are posted as (a bot such as my-app[bot])
hosting_post_as = "Senden als"
# context: help under the "Post as" row of Settings
hosting_post_as_help = "Der Name, unter dem Ihre Nachrichten an den Host gesendet werden, und der Name, an dem GitPoulpi Ihre eigenen Kommentare erkennt (bearbeiten, löschen), zum Beispiel my-app[bot] für eine GitHub App. Nur mit einem Bot-Token nötig: Bleibt das Feld leer, fragt GitPoulpi den Host und lernt den Namen aus der ersten gesendeten Nachricht."
pr_terminology = "Begriff für Review-Anfragen"
pr_terminology_help = { git = "Das Wort für eine gehostete Code-Review-Anfrage überall in der TUI. Auto folgt dem Host des Repositorys: Merge Request für GitLab, Pull Request für die anderen Hosts. Pull Request oder Merge Request erzwingt dieses Wort. Wirkt sofort.", local = "Das Wort für eine gehostete Code-Review-Anfrage überall in der TUI. Auto folgt dem Host des Repositorys: Änderungsanfrage für GitLab, Pullanforderung für die anderen Hosts. Pullanforderung oder Änderungsanfrage erzwingt dieses Wort. Wirkt sofort." }
hide_finished_pr_chip = { git = "{$Pr}-Chip ausblenden, wenn erledigt (geschlossen oder gemergt)", local = "{$Pr}-Chip ausblenden, wenn erledigt (geschlossen oder zusammengeführt)" }
hide_finished_pr_chip_help = { git = "Der Chip in der Symbolleiste zeigt den neuesten {$pr} des ausgecheckten Branches. Ein: Er verschwindet, sobald dieser {$pr} geschlossen oder gemergt ist; stattdessen erscheint der blasse Chip „+ {$pr_abbr}“, als hätte der Branch keinen. Aus: Der Chip zeigt immer den neuesten {$pr}, egal in welchem Zustand. Wirkt sofort.", local = "Der Chip in der Symbolleiste zeigt die neueste {$pr} des ausgecheckten Branches. Ein: Er verschwindet, sobald diese {$pr} geschlossen oder zusammengeführt ist; stattdessen erscheint der blasse Chip „+ {$pr_abbr}“, als hätte der Branch keine. Aus: Der Chip zeigt immer die neueste {$pr}, egal in welchem Zustand. Wirkt sofort." }
heading_external_tools = "Externe Tools"
external_editor = "Externer Editor"
external_editor_help = "Befehl für den Menüeintrag „In <Editor> öffnen“ einer Datei; {{file}} ist der vollständige Pfad der Datei (wird angehängt, wenn er fehlt). Leer: VS Code (`code`), wenn es im PATH liegt, sonst das Standardprogramm des Systems."
external_diff_tool = { git = "Externes Diff-Tool", local = "Externes Werkzeug für Unterschiede" }
external_diff_tool_help = { git = "Befehl für „Im externen Diff-Tool öffnen“; {{local}} ist die committete (oder staged) Version, {{remote}} die verglichene Version. Leer: `git difftool` mit dem in git konfigurierten `diff.tool`.", local = "Befehl für „Im externen Werkzeug für Unterschiede öffnen“; {{local}} ist die committete (oder bereitgestellte) Version, {{remote}} die verglichene Version. Leer: das in der Git-Konfiguration eingestellte Vergleichswerkzeug." }
external_merge_tool = { git = "Externes Merge-Tool", local = "Externes Zusammenführungs-Werkzeug" }
external_merge_tool_help = { git = "Befehl für „Im Merge-Tool öffnen“ auf einer Konfliktkarte; {{base}}, {{local}} (A, aktuell), {{remote}} (B, eingehend) und {{merged}} (wohin das Tool das Ergebnis schreibt; staged, wenn es erfolgreich endet). Leer: `git mergetool` mit dem in git konfigurierten `merge.tool`.", local = "Befehl für „Im Zusammenführungs-Werkzeug öffnen“ auf einer Konfliktkarte; {{base}}, {{local}} (A, aktuell), {{remote}} (B, eingehend) und {{merged}} (wohin das Werkzeug das Ergebnis schreibt; bereitgestellt, wenn es erfolgreich endet). Leer: das in der Git-Konfiguration eingestellte Werkzeug." }
file_explorer = "Dateimanager"
file_explorer_help = "Befehl für „Im Ordner anzeigen“; {{path}} ist der vollständige Pfad der Datei, {{dir}} ihr Ordner. Windows: explorer.exe /select,\"{{path}}\" wählt die Datei aus; Linux: xdg-open \"{{dir}}\"; macOS: open -R \"{{path}}\"."
ai_assistant = "KI-Assistent"
launch = "Fenster für Agenten öffnen"
launch_help = "Wenn ein KI-Agent etwas anzeigen möchte und nirgends ein GitPoulpi-Fenster offen ist, wird dies ausgeführt, um eines zu öffnen: off (nie, Standard), ein Terminal (kitty, foot, WezTerm, Windows Terminal, ...), ein neuer Tab/Bereich/Arbeitsbereich in einem Multiplexer (tmux, zellij, cmux, ...) oder custom, das die Vorlage unten verwendet. Der Agent muss es weiterhin anfordern (`--launch`), oder sein ui_control muss auto sein. Gilt ab der nächsten Anfrage."
launch_command = "Startbefehl (custom)"
launch_command_help = "Wird verwendet, wenn die obige Wahl custom ist. In Argumente zerlegt (mit '...' oder \"...\" quoten), keine Shell. {{repo}} ist der Repository-Ordner, {{session}} der Sitzungsname und {{gitpoulpi}} dieses Programm. Beispiel: kitty --directory {{repo}} {{gitpoulpi}} --session {{session}}"
tab_dir_follow = "Dem Ordner des aktiven Tabs folgen"
tab_dir_follow_help = "Ein Programm kann den Ordner seiner Shell nicht ändern, daher gibt es zwei Wege dorthin. buttons (Standard): Solange der aktive Tab nicht der Ordner ist, in dem GitPoulpi gestartet wurde, zeigt die Tab-Leiste Beenden & cd hierher (nur beim Start über den Shell-Wrapper, siehe `gitpoulpi shell-init`). auto: keine Schaltflächen; beim Beenden wechselt Ihre Shell immer in den aktiven Tab, und beim Öffnen eines neuen Tabs öffnet sich von selbst ein Terminal (nicht für die beim Start wiederhergestellten Tabs)."
forget_all_usernames_and_passwords = "Alle Benutzernamen und Passwörter vergessen"
forget_all_usernames_and_passwords_help = "Entfernt jedes Token, das GitPoulpi in Ihrem Credential-Helper gespeichert hat."
mcp_server = "MCP-Server"
mcp_server_help = "An kann ein KI-Agent den MCP-Server starten (`gitpoulpi mcp serve`, oder `--http` für den Netzwerk-Endpunkt). Aus verweigert er den Start. Gespeichert als `mcp.enabled`. Eine Änderung gilt, sobald ein Agent den Server das nächste Mal startet; ein bereits laufender Server behält seine Einstellungen."
mcp_port = "Port des MCP-Servers"
mcp_port_help = "Der Port, auf dem `gitpoulpi mcp serve --http` lauscht, wenn keine Adresse angegeben wird (der Host-Teil von `mcp.bind` bleibt erhalten, standardmäßig 127.0.0.1, nur Loopback, außer mit --allow-remote). Gilt, sobald ein Agent den Server das nächste Mal startet; ein laufender Server behält seinen Port."
mcp_bind_unreadable = "`mcp.bind` ist „{bind}“ und enthält keinen lesbaren Port. Wird hier ein Port festgelegt, bleibt der Host erhalten und der Rest wird ersetzt."
undo_off_note = "Rückgängig ist aus - „Rückgängig aktiviert“ einschalten, um die Tiefe festzulegen"
use_mailmap = "Autoren über .mailmap anzeigen"
use_mailmap_help = "Zeigt jeden Autor im Log, in Blame und im Dateiverlauf so, wie ihn die .mailmap des Repositorys nennt. Die {$commits} selbst werden nicht geändert. Wirkt sofort."
auto_prune_tags = "Auto-Prune {$tags}"
auto_prune_tags_help = "Löscht bei jedem {$fetch_noun} auch die lokalen {$tags}, die auf dem Remote gelöscht wurden. Betroffen sind nur {$tags}, die auf dem Remote lagen: Ein {$tag}, den es dort nie gab, bleibt erhalten. Standardmäßig aus, wie bei Git."

