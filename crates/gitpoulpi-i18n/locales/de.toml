[help_tabs]
tab_keys = "Tasten"
tab_start = "Start"
tab_log = "Log"
tab_changes = "Änderungen"
tab_refs = "Refs"
tab_hosting = "Hosting"
tab_setup = "Einrichtung"
tab_tools = "KI & CLI"
title = "Hilfe - tippen zum Filtern, Tab-Taste wechselt den Tab, ? schließt"
title_filtered = "Hilfe - Filter „{filter}“ - Esc leert, ? schließt"
hint = "Tab/Shift+Tab, ←/→, Alt+1..8: Tabs - ↑/↓, Bild auf/Bild ab scrollen"
start_1 = "Fenster|Oben die Tabs (Home listet, öffnet und klont Repositories), darunter die Symbolleiste, links die Refs-Seitenleiste, in der Mitte das Log, rechts die Änderungen und das {$Commit}-Formular."
start_2 = "Befehlspalette|Ctrl+P listet jede Aktion mit ihrem Kürzel. Tippen sucht, Enter führt aus. Alles, was mit der Maus geht, geht auch über die Palette."
start_3 = "Präfix-Kürzel|Ctrl+G, dann eine Taste führt eine Git-Aktion aus ({$stage}, {$commit}, {$pull}, {$push}...). Ctrl+N, dann eine Taste navigiert oder ändert die Ansicht. Die Statuszeile zeigt die Möglichkeiten."
start_4 = "Tabs|Ein Tab pro Repository. Ctrl+PageUp / Ctrl+PageDown wechseln, Ctrl+W schließt, t öffnet die Tab-Auswahl; ein Rechtsklick auf einen Tab oder Ctrl+T öffnet sein Menü."
start_5 = "Maus und Tastatur|Klick wählt aus, Doppelklick öffnet oder checkt aus, Rechtsklick (oder .) öffnet ein Menü, Ziehen verschiebt Refs und {$rebase}-Zeilen. Jede Mausaktion hat eine Taste."
start_6 = "Aktualisieren und Rückgängig|r aktualisiert, F5 lädt alles neu, Ctrl+Z / Ctrl+Y machen den letzten Vorgang rückgängig bzw. wiederholen ihn, q beendet."
log_1 = "Den Graphen lesen|Eine Zeile pro {$commit}, eine Spur pro Branch. Die erste Zeile ist Ihre nicht committete Arbeit (WIP): Wählen Sie sie aus, um die Änderungen zu sehen. Ein Klick auf eine Zeile zeigt rechts ihre Details."
log_2 = "Suchen|f (oder die Schaltfläche Suchen) dunkelt die Zeilen ab, die nicht zu Nachricht, Autor, Hash oder Ref passen. Enter / Shift+Enter springen zum nächsten / vorherigen Treffer. / filtert die Refs-Seitenleiste."
log_3 = "{$Commit}-Menü|Rechtsklick auf einen {$commit} oder . darauf: {$cherry_pick}, Revert, Reset, Nachricht bearbeiten, Branch oder {$tag} erstellen, Checkout, Worktree, Patch, Kopieren."
log_4 = "Interaktiver {$rebase}|„Interaktiver Rebase ab hier...“ im {$commit}-Menü: jeden {$commit} auf {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} oder {$edit} setzen, mit Ctrl+Up/Down umordnen, mit Ctrl+S starten, mit Esc verlassen."
log_5 = "Mehrere {$commits}|Ctrl+Klick wählt einen {$commit} zu oder ab, Shift+Klick (Alt+Klick) wählt einen Bereich, die Leertaste schaltet den aktuellen um, Esc hebt die Auswahl auf. Dann per Rechtsklick {$cherry_pick} oder Revert der ganzen Auswahl."
log_6 = "Refs ziehen|Einen Branch auf einen anderen ziehen für {$merge}, {$rebase} oder Fast-Forward, oder auf einen Remote-Branch für {$push}; beim Loslassen öffnet sich ein Menü, Esc bricht ab. Tastatur: Palette, „Refs: Ausgewählte Ref auf dem ausgecheckten Branch ablegen...“."
changes_1 = { git = "Änderungen im Arbeitsverzeichnis|Die erste Log-Zeile (WIP) auswählen: Rechts erscheinen die Dateien, unstaged und staged. m wechselt zwischen Pfad und Baum, a zeigt alle Dateien, z klappt die Ordner zu.", local = "Änderungen im Arbeitsverzeichnis|Die erste Log-Zeile (WIP) auswählen: Rechts erscheinen die Dateien, nicht bereitgestellt und bereitgestellt. m wechselt zwischen Pfad und Baum, a zeigt alle Dateien, z klappt die Ordner zu." }
changes_2 = { git = "Stagen und Unstagen|Ctrl+Leertaste auf einer Datei, ihre Schaltfläche oder Ctrl+G s; Ctrl+G a für alles, Ctrl+G u zum Unstagen. Rechtsklick auf eine Datei, um sie zu verwerfen, ihren Verlauf oder Blame zu sehen oder sie im Editor zu öffnen.", local = "Bereitstellen und Bereitstellung aufheben|Ctrl+Leertaste auf einer Datei, ihre Schaltfläche oder Ctrl+G s; Ctrl+G a für alles, Ctrl+G u hebt die Bereitstellung auf. Rechtsklick auf eine Datei, um sie zu verwerfen, ihren Verlauf oder Blame zu sehen oder sie im Editor zu öffnen." }
changes_3 = "{$Diff} lesen|Eine Datei anklicken oder d drücken. m wechselt Inline / Split, w bricht Zeilen um, s ignoriert Leerraum, n / p springen zwischen Hunks, Esc oder q kehrt zum Log zurück."
changes_4 = { git = "Hunks und Zeilen|In der Diff-Ansicht: Leertaste = Hunk stagen, v, dann j / k, dann Enter = ausgewählte Zeilen stagen, x = Hunk verwerfen. Verwerfen fragt vorher; Ctrl+Z holt es zurück.", local = "Hunks und Zeilen|In der Unterschiedsansicht: Leertaste = Hunk bereitstellen, v, dann j / k, dann Enter = ausgewählte Zeilen bereitstellen, x = Hunk verwerfen. Verwerfen fragt vorher; Ctrl+Z holt es zurück." }
changes_5 = "{$Commit} schreiben|Zusammenfassung und Beschreibung eingeben, dann Ctrl+Enter oder die grüne Schaltfläche. Shift+A ändert den letzten {$commit} (Amend). Ctrl+G c setzt den Cursor ins Formular, Esc verlässt es."
changes_6 = "{$Merge}-Konflikte|Ein Banner bietet „Konflikte lösen...“. Im {$Merge}-Editor für jeden Konflikt A, B oder beide wählen (a / b / c), das Ergebnis bearbeiten, speichern, dann Fortsetzen."
changes_7 = "Rückgängig und Wiederholen|Ctrl+Z / Ctrl+Y oder die Schaltflächen der Symbolleiste machen die meisten Vorgänge rückgängig bzw. wiederholen sie: {$commits}, Branches, Checkouts, Resets, {$stashes}, Verwerfen. Bei riskanten Vorgängen wird vorher gefragt."
refs_1 = "Branches und {$tags}|Ein Doppelklick auf einen lokalen Branch oder {$tag} checkt ihn aus; ein Rechtsklick öffnet sein Menü ({$merge}, {$rebase}, Umbenennen, Löschen...). Ctrl+G b und Ctrl+G t erstellen einen am ausgecheckten {$commit}."
refs_2 = "Solo und Ausblenden|Die Taste o zeigt nur die {$commits} der ausgewählten Ref, Shift+O beendet das. Das Menü einer Ref blendet sie im Graphen aus; Shift+H zeigt wieder alles. Nur Anzeige: Im Repository ändert sich nichts."
refs_3 = "{$Fetch}, {$Pull}, {$Push}|Ctrl+G f: {$Fetch} aller Remotes. Ctrl+G p: {$Pull}. Ctrl+G Shift+P: {$Push}. Der Pfeil neben einer Schaltfläche der Symbolleiste wählt eine andere Variante oder ein anderes Remote."
refs_4 = "Remotes|Das + im Titel REMOTE fügt eines hinzu. Rechtsklick auf ein Remote: {$Fetch}, Weblink kopieren, URLs bearbeiten oder entfernen."
refs_5 = { git = "{$Stashes} und Worktrees|Die Schaltflächen Stash und Pop; Ctrl+G m fragt zuerst nach einer Nachricht. Rechtsklick auf einen {$stash}, um ihn anzuwenden oder zu poppen. „Worktree aus <Name> erstellen...“ öffnet einen Branch in einem eigenen Tab.", local = "{$Stashes} und Worktrees|Die Schaltflächen Ablegen und Pop; Ctrl+G m fragt zuerst nach einer Nachricht. Rechtsklick auf einen {$stash}, um ihn anzuwenden oder wiederherzustellen. „Worktree aus <Name> erstellen...“ öffnet einen Branch in einem eigenen Tab." }
refs_6 = "Submodule und LFS|Ein Abschnitt SUBMODULE erscheint, wenn das Repository welche hat: Ein Doppelklick öffnet eines als Tab, ein Rechtsklick aktualisiert es. Git-LFS-Aktionen: die Schaltfläche LFS oder Ctrl+G l."
hosting_1 = "Verbinden|Einstellungen > Integrationen: ein persönliches Token für GitHub oder GitLab einfügen. Kein Konto nötig; das Token landet im Credential-Helper Ihres Systems."
hosting_2 = "Repository verknüpfen|In den Abschnitten {$PRS} und ISSUES der Seitenleiste einen der Anbieter wählen, die die Auswahlliste vorschlägt. Nichts wird automatisch verknüpft; die Verknüpfung wird pro Repository gespeichert."
hosting_3 = "{$Pr} erstellen|Das + in der Kopfzeile {$PRS} oder n in diesem Abschnitt öffnet das Formular; das Menü eines Branches hat „{$Pr} von <Name> starten...“. Die KI kann Titel und Beschreibung schreiben."
hosting_4 = "Issues|Der Abschnitt ISSUES listet sie; + oder n erstellt eines. Das Menü einer Zeile öffnet es im Browser oder bearbeitet es."
hosting_5 = "Verweise|Verweise auf Issues und {$prs} (#12, !53, ABC-7) in einer {$commit}-Nachricht oder einem Branch-Namen werden erkannt. Alt+R im {$commit}-Formular fügt einen ein."
hosting_6 = { git = "Chip in der Symbolleiste|Links in der Symbolleiste zeigt ein Chip den {$pr} des ausgecheckten Branches (GH #12, GL !53) oder ein blasses „+ {$pr_abbr}“, um einen zu starten. Ein Klick darauf genügt.", local = "Chip in der Symbolleiste|Links in der Symbolleiste zeigt ein Chip die {$pr} des ausgecheckten Branches (GH #12, GL !53) oder ein blasses „+ {$pr_abbr}“, um eine zu starten. Ein Klick darauf genügt." }
hosting_7 = "SSH-Schlüssel|Einen SSH-Schlüssel pro Profil (Einstellungen > Profile) oder pro Repository (Tab-Menü > „SSH & Zugangsdaten...“) wählen. Passphrasen bleiben beim ssh-agent Ihres Systems."
setup_1 = "Einstellungen|Ctrl+, oder das Zahnrad. Tab wechselt zwischen Seitenliste und Optionen, j / k bewegen, Enter oder Leertaste ändert einen Wert, / oder Ctrl+F durchsucht alle Optionen, Esc schließt."
setup_2 = "Designs|Einstellungen > Darstellung > Design: dunkel, hell, dem Terminal folgen oder eine der vielen Vorlagen. Ctrl+N, dann eine Taste wechselt auch Design, Sprache und Graph-Farben, ohne die Einstellungen zu öffnen."
setup_3 = "Sprache|Einstellungen > Allgemein > Sprache bietet 17 Sprachen. „Git-Begriffe übersetzen“ legt fest, ob auch die Wörter von Git selbst ({$commit}, {$push}...) übersetzt werden."
setup_4 = "Profile|Einstellungen > Profile enthält {$commit}-Identitäten (Name, E-Mail, SSH-Schlüssel). Das Profilfeld der Symbolleiste wählt die für dieses Repository."
setup_5 = "Öffnen in|Die Schaltfläche Öffnen in (Alt+O) öffnet den Ordner dieses Tabs in einem Terminal, einem Editor oder dem Dateimanager. Einstellungen > Öffnen in bearbeitet die Liste."
setup_6 = "Tastenbelegung|Einstellungen > Tastatur & Maus belegt jede Taste neu. Der Tab Tasten dieser Hilfe zeigt Ihre eigenen Belegungen."
tools_1 = "KI (optional)|Aus, bis Sie sie unter Einstellungen > KI einrichten: ein OpenAI-kompatibler Dienst, Anthropic oder ein lokaler Agent wie claude -p. Ein Konto bei GitPoulpi ist nie nötig."
tools_2 = "KI-Aktionen|Die Funkeln-Schaltfläche neben der Zusammenfassung oder Ctrl+G i schreibt eine {$commit}-Nachricht; Ctrl+G w erklärt Änderungen; Ctrl+G C teilt Ihre Arbeit in mehrere {$commits} auf; Alt+I schlägt eine Konfliktlösung vor. Nichts wird angewendet, bevor Sie bestätigen."
tools_3 = "CLI|gitpoulpi <Befehl> erledigt per Skript, was das Fenster tut, über denselben Daemon, sodass Änderungen live erscheinen. --json liefert maschinenlesbare Ausgabe, --help listet die Optionen."
tools_4 = "MCP|gitpoulpi mcp serve --stdio gibt KI-Agenten ein Werkzeug pro CLI-Befehl. Einstellungen > Agenten & MCP legt fest, was sie ändern dürfen."
tools_5 = "Shell-Wrapper|Mit dem Shell-Wrapper gp lässt „Beenden & cd hierher“ Ihre Shell beim Beenden von GitPoulpi im Ordner des aktiven Tabs."

