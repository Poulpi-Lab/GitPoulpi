test_failed = "{label}: {error}"

[settings_images]
list_title = "Editors"
section_title = "Images"
heading_viewer = "Image preview"
heading_editors = "Image editors"
image_view = "Preview images"
image_view_help = "Show a binary file that is an image as a picture in the {$Diff} view and the File View. Off: the plain binary notice."
text_fallback = "Without an image protocol"
text_fallback_help = "What a terminal with no inline-image protocol shows: the picture as colored half-block characters, or only the info card."
max_mib = "Maximum preview size"
max_mib_help = "Images bigger than this are not decoded; an info card shows instead."
pixelated_from = "Zoom in pixelated from"
pixelated_from_help = "From this zoom the picture is enlarged as square pixels instead of smoothed: 1x (100%), 2x (200%) or never."
sync = "Sync before/after zoom and scroll"
sync_help = "In the image {$diff}, the before and after panes share one zoom and scroll position."
fallback_halfblock = "Half-block colors"
fallback_card = "Info card only"
default_entry_help = "The editor that Edit in default runs. It is marked in the Edit in list."
command_help = "Split into arguments (quote with '...' or \"...\"), no shell. Variables: ${{file}} the image (a read-only copy when it is not the working-tree file), ${{dir}} its folder, ${{name}} its file name, ${{repo}} the repository root, ${{env:NAME}} an environment variable. Example: gimp ${{file}}"
test = "Test with a sample image"
test_help = "Opens a small generated PNG with this editor now."
restore_help = "Replaces the list with the editors detected on this machine and clears the default."
saved = "Image editors saved"
tested = "Opening a sample image in \"{label}\"..."

[settings_ssh]
private_key_path = "Private key path"
private_key_path_help = "Key file that fetch, pull, push and clone offer to ssh (ssh -i <key> -o IdentitiesOnly=yes). Empty: ssh-agent and your ssh config as usual. Not used when a repository chooses its own key (SSH & credentials), or when GIT_SSH_COMMAND or core.sshCommand is set. Applies to the next transfer."
public_key_path = "Public key path"
public_key_path_help = "Used only when Private key path is empty: ssh then picks the matching key held by ssh-agent (or a hardware key) instead of offering every agent key. Generate key pair fills both. Same precedence as Private key path."
key_type = "Key type"
heading_https_credentials = "HTTPS credentials"
https_mode = "HTTPS credentials"
https_mode_help = "How fetch, pull, push and clone authenticate over HTTPS. credential_helper: git's own helper (Git Credential Manager, libsecret, Keychain). prompt: ignore any helper and let git ask on a terminal. none: no credentials at all, public remotes only. Applies to the next transfer."
heading_keys = "Keys"
generate_key_pair = "Generate key pair"
generate_key_pair_help = "Generates an ed25519 key pair in process (no ssh-keygen, no passphrase) as ~/.ssh/gitpoulpi_ed25519, never overwriting a file, and records both paths above. Add the public key to a host from Integrations."

[settings_editor]
tab_size = "Tab size"
tab_size_help = "Columns between tab stops, in the built-in editor (drawing, Shift+Tab) and in the diff views. The blame view draws a tab as one space and ignores it."
eol = "End of line"
eol_help = "What the built-in editor writes when it saves. Auto keeps the file's own line ending (LF for a new file); LF or CRLF converts the file on save. The editor's status line shows what the next save writes."
syntax_highlighting = "Syntax highlighting"
syntax_highlighting_help = "Colors the built-in editor by language. The diff views and the blame view are not syntax colored."
line_numbers = "Line numbers"
line_numbers_help = "The number column of the built-in editor and of the diff views (there it is blanked, the columns keep their place). The blame view has none."
follow_selection = "Follow the selection in the editor"
follow_selection_help = "While the editor is open, selecting another file in the right pane opens it in the editor too, after asking to save any unsaved changes. A file that cannot be edited opens in its usual view instead."
# context: Settings row on the Diff & editor page: the merge conflict editor's width threshold
merge_side_by_side_min_width = "Merge editor: side by side from (columns)"
merge_side_by_side_min_width_help = "The merge conflict editor shows A and B side by side when its area is at least this many columns wide (long lines scroll sideways with Shift+wheel or Shift+arrows); narrower, it shows one side at a time behind tabs. 100 by default; 40 is the lowest value, 0 means always side by side. The editor hides the Refs and Status panels while it is open, so it usually has the whole window."
diff_word_wrap = "Word wrap"
diff_word_wrap_help = "Wraps long lines in the diff views instead of cutting them with an ellipsis. The built-in editor and the blame view scroll sideways and do not wrap. Also the diff view's own wrap toggle."

[settings_ui]
theme = "Theme"
theme_help = "Colors of the whole interface. Moving through the list previews each theme; Enter keeps it, Esc goes back. System follows the terminal's light or dark background, detected once at start-up (Dark when it cannot be told). Your own theme files in the config folder's themes/ directory are listed last."
theme_system = "System (follows terminal)"
follow_theme = "Follow theme"
theme_swatches = "Colors"
graph_lane_background = "Graph lane background"
graph_lane_background_help = "Off: transparent, nothing behind the lanes (default). Row tint: a faint band of the commit's lane color inside the Graph column, plus a thin bar in that color at the column's right edge. A stored lane is read as Row tint. Applies when Settings closes."
graph_row_tint_strength = "Row tint strength"
graph_row_tint_strength_help = "How faded the Row tint band is: Strong (the original), Medium (default) or Subtle. Only the band fades; the bar at the column's right edge keeps its full color. Applies when Settings closes."
graph_row_tint_strength_coming = "set Graph lane background to Row tint first"
# context: label of the setting for where the toolbar sits
toolbar_position = "Toolbar position"
toolbar_position_help = "Where the toolbar sits: Top, Bottom (default), Left or Right. Left and Right make a column beside the panes; a window under 80 columns draws it at the bottom instead. Applies at once."
# context: label of the setting for where the toolbar buttons sit along the bar
toolbar_align = "Toolbar button alignment"
toolbar_align_help = "Where the toolbar's buttons sit along it: Start (default), Center or End. Start is the left of a row and the top of a column; End is the right and the bottom. Applies at once."
# context: label of the setting that decides whether a dialog the user moved or resized keeps its place
dialog_geometry = "Remember dialog position and size"
dialog_geometry_help = "One setting for every dialog. Dialogs can be moved (drag the title bar, or Ctrl+N then m); the larger windows can also be resized (drag the borders and bottom corners). Each dialog remembers its own place and size. For this session (default): kept until GitPoulpi closes. Saved to disk: kept for the next launch too. Never: every dialog opens at its default place and size. Applies at once."
# context: label of an on/off setting: the pull request button stays at the far end of the toolbar; {$pr} is the pull or merge request term
toolbar_pr_pinned = "Pin the {$pr} button to the end"
toolbar_pr_pinned_help = "On (default), the {$pr} button sits at the far end of the toolbar (right, or bottom in a column), whatever the alignment. Off, it flows with the other buttons and is aligned with them. Applies at once."
# context: label of the setting for where the status line (the bar with branch, counts and messages) sits
statusbar_position = "Status line position"
statusbar_position_help = "Where the status line (branch, counts, messages, key hints) sits: Top, above the repository tabs, or Bottom (default). The Home tab keeps its own status line at the bottom. Applies at once."
# context: label of the setting for where the repository tab bar sits (top, bottom or a column at the left)
tabs_position = "Tab bar position"
tabs_position_help = "Where the repository tabs sit: Top (default), Bottom, or Left, a list with one tab per row at the window's left edge. A window under 80 columns draws them at the top instead. Beside a column toolbar the tabs stay outermost. Applies at once."
graph_color_theme = "Graph color theme"
graph_color_theme_help = "The lane color palette of the Log graph. Follow theme uses the palette of the chosen theme; any other entry overrides it, so any theme can be combined with any palette. Applies when Settings closes."
graph_renderer = "Graph renderer"
graph_renderer_help = "auto draws the graph as a real image on a terminal that supports it, and as characters everywhere else - including inside zellij and screen, which inherit the terminal's environment but do not pass the image through, inside tmux unless the terminal behind it takes sixel, and inside herdr unless its kitty_graphics setting is on. image forces the picture on, text forces it off. Needs a restart."
image_protocol = "Image protocol"
image_protocol_help = "How pictures (the graph image, author avatars) reach the terminal. auto: the Kitty graphics protocol in kitty, Ghostty and a herdr whose config sets kitty_graphics = true; the Kitty protocol also in iTerm2 3.7.7 or newer; iTerm2 inline images in WezTerm, Rio, mintty and older iTerm2; sixel pictures (the graph column and the avatars) in Windows Terminal, foot, Tabby, Konsole, mlterm and in tmux when the terminal behind it takes sixel; characters elsewhere. kitty, iterm2 or sixel forces that protocol (kitty for a herdr whose config lives somewhere else; sixel for a terminal that draws it but is not recognized); none turns pictures off. Needs a restart."
kitty_keyboard = "Kitty keyboard protocol"
kitty_keyboard_help = "auto asks the terminal, at start-up and within about 100 ms, whether it speaks the kitty keyboard protocol, and uses it when it does: chords that legacy terminals cannot tell apart (Control with punctuation, digits, Shift or Enter) then arrive as themselves instead of colliding with control codes. A terminal that does not answer keeps the legacy keys. off never touches the terminal's keyboard mode. Needs a restart."
color_depth = "Color depth"
color_depth_help = "auto uses 24-bit color, except on terminals known not to show it (Apple Terminal and the Linux console, or a 256-color terminal that does not advertise COLORTERM), where colors are mapped to the nearest 256 or 16 entries. truecolor, 256 and 16 force a depth. Applies at once."
text_cursor = "Text cursor"
text_cursor_help = "terminal puts the terminal's own cursor at the caret of the focused text field, as a bar: your terminal's cursor settings apply and an input method's candidate window opens at the caret. drawn paints GitPoulpi's own caret (a block or an underscore) and keeps the terminal cursor hidden. Applies at once."
graph_show_stashes = "Show stashes in the graph"
graph_show_stashes_help = "Each stash gets a row of its own in the Log, at its date: a small box on a lane beside the commit it was made on, joined to it by a dashed line. Selecting it shows what it changed; right-click (or .) offers Pop, Apply and Drop. Off keeps stashes in the STASHES section only. Not drawn while soloing."
ref_connector = "Ref-to-commit connector"
ref_connector_help = "A thin line from each ref pill in the Ref column to its commit's circle in the graph. It only fills blank space: lanes it passes stay on top and nothing moves. Drawn only while the Ref column is immediately left of the Graph column."
log_wip_counts_in_message = "Show WIP change counts in the message when the Changes column is hidden"
log_wip_counts_in_message_help = "The WIP row shows how many files are modified, added and deleted. With the Changes column visible (right-click the Log header to show it) the counts always go in that column, like every commit's. With it hidden they ride in the WIP message while this is on; off shows no counts at all."
avatars = "Author avatars"
avatars_help = "Author pictures. graph draws each commit's author inside its circle in the graph (image graph only; with the text graph a colored initial goes in the Author column instead). author puts a round picture at the start of the Author column. Both also show it in the commit detail pane. Off by default: turning this on sends a SHA-256 hash of each author's email address to gravatar.com over HTTPS - a hash of a known or guessable address is not anonymous - and, in a repository with a github.com remote, asks the GitHub API once per author which account made one of their commits (using your GitHub integration's token when there is one). Until a picture arrives, and when none exists, the initials or the plain circle are shown. off sends nothing over the network."
avatar_sources = "Avatar sources"
avatar_sources_help = "Where an author's picture is looked up, in order (a GitHub noreply address always names its account first). hosting_gravatar: the connected GitHub, GitLab or Bitbucket integration whose host matches the repository's remote (GitHub commit author or user search, GitLab avatar-by-email or users API), then Gravatar; with no matching integration connected, Gravatar comes first and a github.com remote is still asked last, unauthenticated. gravatar_hosting: the reverse. gravatar or hosting: just that one. When none has a picture, the avatar fallback below is drawn. Applies to authors not looked up yet."
avatar_fallback = "Avatar fallback"
avatar_fallback_help = "What an author with no picture gets. identicon: a GitHub-style 5x5 mirrored pattern in a color derived from their email, generated locally (no network), as a picture on an image terminal and as block characters elsewhere. initials: a colored badge with their initials."
composer_files = "Composer proposals"
composer_files_help = "How the AI commit composer's review opens. expanded: every proposed commit lists its files. collapsed: only the commit rows; Right/Left (or a click on the arrow) opens one."
blame_side = "Blame annotations"
blame_side_help = "Which side of the Blame view holds the annotation column (avatar, author, age, summary). right: right of the code. left: left of the code."
column_resize = "Column resizing"
column_resize_help = "How a column boundary is grabbed in the Log, the Radar and the side column of the file views. line: a thin line over the whole height of the table while the pointer is on the boundary, with a small tick in the header. header: no gap and no tick, resize only from the header, where the first character of the next cell lights up."
blame_width = "Blame annotation width"
blame_width_help = "The annotation column's width in cells (24 to 90). Drag its border in the Blame view, or press the widen / narrow keys; the new width is saved here."
ref_tree = "Branch folder tree"
ref_tree_help = "The Refs sidebar groups branch names on `/` into collapsible folders, with each remote as its own top-level node. Off gives one flat row per branch. `y` in the Refs pane toggles it live and writes the choice here."
reveal_on_ref_click = "Click a ref to reveal it in the graph"
reveal_on_ref_click_help = "A single click on a ref in the Refs pane scrolls the Log to where it points and flashes the row. The Log's selection and the right panel stay as they are. Off, a click only selects the sidebar row. `Reveal in graph` in a ref's menu, its Refs-pane key and its palette command work either way."
graph_ghost_ref = "Show a ghost branch on the hovered {$commit}"
graph_ghost_ref_help = "In the Log's Ref column, the hovered {$commit} that has no ref of its own shows a faded pill with the name of the branch it belongs to (else its remote branch), deduced from the history. Hovering the pill shows its kind. Clicking it does nothing special; the create-branch command makes a branch. Only drawn where the Ref column has room. Off hides it."
mouse_enabled = "Mouse enabled"
mouse_enabled_help = "Off leaves click-drag selection to your terminal. Needs a restart."
mouse_scroll_lines = "Mouse wheel lines"
mouse_scroll_lines_help = "How many commits one wheel notch moves in the Log. Needs a restart."
heading_date_time = "Date and time"
# context: section heading above the toolbar and status line position settings
heading_layout = "Layout"
date_locale = "Date/time locale"
date_locale_help = "system: month and day names follow the interface language. english: always English names, whatever the language. Applies to every date on this page."
diff_layout = "Default layout"
diff_layout_help = "Inline (one column) or Split (before and after side by side). Resumed from the last diff you looked at, in this window and across restarts - changing it here only sets what a *new* session starts from."
diff_hunks_only = "Hunks only"
diff_hunks_only_help = "On shows only the changed hunks with a few lines of context; off shows the whole file with the changes highlighted in place. Resumed like the layout."
diff_show_whitespace = "Show whitespace-only changes"
diff_show_whitespace_help = "Off collapses a hunk that differs only in whitespace to context."
input_color = "Input color"
input_color_help = "Background of text inputs. Follow theme (default) uses the theme's own; the others are dark colors that override it. Custom... uses the hex color below. Applies live, no restart."
input_color_custom = "Custom input color"
input_color_custom_help = "#rrggbb, used when Input color is Custom. Applies live."
minimap = "Minimap"
minimap_help = "A picture of the whole file beside the vertical scrollbar of the diff (whole file mode) and the editor, the visible part highlighted; click it to jump. A real image where the terminal draws them, braille cells elsewhere. Also `M` in the diff and the palette's Toggle Minimap."
date_format = "Date format"
date_format_help = "The Blame / File History date column."
date_time_format = "Date/time format"
date_time_format_help = "The Log's Date column itself."
date_verbose_format = "Verbose date format"
date_verbose_format_help = "The commit-detail panel's Date line, the Date column's hover tooltip, and Copy > Date."
preview = "preview"
sidebar_sections_scope = "Left pane sections"
sidebar_sections_scope_help = "Whose choice the left pane's shown/hidden sections are. repository: each repository keeps its own set (the global one is its starting point). global: one set for every repository. Switching never loses either set."
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "Column layout"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "How the Log lays its columns out. fit: every column fits the pane and only Message flexes. scroll: columns keep their widths, Message too, and the table scrolls sideways when it is wider than the pane."

[settings_git]
default_backend = "Git backend"
default_backend_help = "Global. A running daemon keeps the backend it started with."
default_backend_warning = "Takes effect for daemons started after this change."
pull_mode = "Pull button"
default_encoding = "Default encoding"
default_encoding_help = "Used to show file contents, blame and diffs that are not valid UTF-8 (valid UTF-8 is never re-decoded). A repository can override it below. Display only: staging and patches keep the file's bytes exactly."
push_behavior = "Push button"
push_behavior_help = "direct: push to the default remote at once. ask: open a small menu with the default remote preselected. The button's ▾ always asks."
repo_encoding_help = "How file contents, blame and diffs are decoded for display when they are not valid UTF-8 (this repository only; inherited: Default encoding on this page). Staging never re-encodes anything."
core_autocrlf_help = "Written to this repository's git config (core.autocrlf), so git and every other tool see it. true: LF to CRLF on checkout; input: CRLF to LF only when saving into history; false: never convert. (inherited): remove the repository value so your global git config applies. Undoable."
core_eol_help = "Written to this repository's git config (core.eol): the line ending git uses for text files in the working tree (lf, crlf, or native for the platform's own). (inherited): remove the repository value so your global git config applies. Undoable."
git_lfs = "Git LFS"
git_lfs_help = "Show Git LFS in the interface (the LFS tag, the diff card, the missing-program banner, the LFS commands) and let GitPoulpi run its own LFS steps (downloading objects after a clone). Off: git's own LFS filters still run, GitPoulpi never calls git-lfs itself."
git_lfs_program = "git-lfs program"
git_lfs_program_help = "Install it from https://git-lfs.com (Windows: bundled with Git for Windows, or `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Palette: LFS: Open Install Page."
initialize_lfs_for_this_repository = "Initialize LFS for this repository"
initialize_lfs_for_this_repository_help = "Runs `git lfs install --local`: the LFS filters and hooks in this repository's own config, never your global one. Needs git-lfs."
pull_mode_help = "What the toolbar's {$Pull}{hint} does: merge (fast-forward if possible), ff_only or rebase. The button's ▾ items run their own action at once and do not change this."
# context: row label on the Git page; what a merge the user starts does when the branch could be fast-forwarded
merge_fast_forward = "{$Merge} fast-forward"
merge_fast_forward_help = "How a {$merge} you start (branch menu, drag and drop, palette, command line) treats a branch that could simply be fast-forwarded. never: always make a {$merge} {$commit}. allowed: fast-forward when possible, as git does by default. only: fast-forward, or refuse when that is not possible. A repository can override it on its {$Merge} options page."
repo_heading = "Repo: {repo} - this repository only"
inherited = "(inherited)"
lfs_not_checked = "(not checked yet)"
lfs_autofix_filters = "Install LFS filters before {$pull} and {$push}"
lfs_autofix_filters_help = "Before a {$pull} or {$push} in a repository that uses Git LFS, run `git lfs install --local` when its LFS filters or hooks are missing (this repository's own config, never your global one), so the transfer handles the large files. The status line says when it did. Needs git-lfs."

