git_actions_then_22 = "cherry-pick the selected commit onto HEAD"
git_actions_then_23 = "revert the selected commit (asks first)"
git_actions_then_24 = "reset the branch to the selected commit, mixed (soft and hard are palette-only; hard asks first)"
