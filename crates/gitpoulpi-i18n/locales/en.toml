# context: progress line while the AI works; {n} is the conflict number, {via} the AI profile, {secs} the seconds so far
msg_ai_working = "suggesting a resolution for conflict {n} via {via}... {secs}s · Esc cancels"
# context: status line when the suggestion landed in the Output; {n} is the conflict number
msg_ai_done = "suggestion for conflict {n} is in the Output, marked edited · review it; nothing is saved until you save"
# context: status line when the AI request failed; {why} is the reason
msg_ai_failed = "the AI could not suggest a resolution: {why}"
# context: status line when the user canceled the AI request
msg_ai_canceled = "suggestion canceled"
# context: status line when the suggestion arrived after the editor moved to another file or closed
msg_ai_dropped = "the AI's suggestion was dropped: the editor is no longer on that conflict"
# context: shortest form of the merge banner (no branch names); shown when the Log pane is narrow
banner_merge_short = "{$Merge} in progress"

[settings_general]
external_editor_placeholder = "code -r {{file}}"
external_diff_tool_placeholder = "meld {{local}} {{remote}}"
external_merge_tool_placeholder = "meld {{local}} {{base}} {{remote}} --output {{merged}}"
auto_fetch_interval_minutes = "Auto-fetch interval"
auto_fetch_interval_minutes_help = "Default 5. 0 turns off background fetching."
fetch_on_tab_open = "Fetch when a tab opens"
fetch_on_tab_open_help = "Fetch All in the background; skipped if fetched in the last minute."
auto_prune = "Auto-prune"
auto_prune_help = "Removes remote-tracking branches that no longer exist on the remote whenever you fetch: background auto-fetch, Fetch and Fetch All (not the lease check of the diverged-push dialog). On by default, so a branch deleted on the server disappears from the REMOTE section after the next fetch. Turn it off to keep stale remote-tracking branches listed."
keep_submodules_up_to_date = "Keep submodules up to date"
default_branch_name = "Default branch name"
default_branch_name_help = "Used when initializing or cloning a repository."
delete_orig_files_after_merge = "Delete \".orig\" files after merging"
delete_orig_files_after_merge_help = "After a merge completes, deletes the *.orig backup files a merge tool left in the working tree (see git's mergetool.keepBackup). Off by default."
initial_commits_in_graph = "Initial commits in graph"
initial_commits_in_graph_help = "With lazy loading on, more commits load when you reach the oldest commit loaded in the Graph."
initial_commits_in_graph_warning = "Raising this may hurt performance on large repositories."
lazy_load_commits_in_graph = "Lazy load commits in graph"
lazy_load_commits_in_graph_help = "Off, the Graph stops at the initial commits above and scrolling cannot reach anything older."
commits_per_lazy_page = "Commits per lazy page"
commits_per_lazy_page_help = "How many commits one background load fetches once you approach the earliest commit held."
max_commits_in_graph = "Maximum commits in graph"
max_commits_in_graph_help = "Where lazy loading stops. 0 means no limit: the whole history ends up in memory."
max_commits_in_graph_warning = "Every commit held costs roughly 300 bytes of memory."
undo_enabled = "Undo enabled"
undo_enabled_help = "On, Undo and Redo can take back commits, staging, discards and branch changes. Off, GitPoulpi does no undo work at all - the fastest setting - and the toolbar buttons disappear. Turning it off erases the undo history of every repository."
undo_depth = "Undo history depth"
undo_depth_help = "How many operations Undo can step back through. 0 means unlimited."
journal_outside = "Record changes made outside GitPoulpi"
journal_outside_help = "On, what a shell or an AI agent does to branches, tags, stashes and HEAD shows up in the Undo history, marked as outside, and Ctrl+Z can take it back. Edits to files in the working tree are never captured. Needs Undo enabled."
remember_tabs = "Remember tabs"
remember_tabs_help = "On, the tabs open when a session last quit are reopened on the next launch. Off, a launch starts on one tab - the repository it was pointed at. Read once at startup; needs a restart to take effect."
radar_enabled = "Enable the Radar"
radar_enabled_help = "Off, the Radar tab, its commands and its shortcut are hidden and nothing is fetched for it in the background. Applies immediately."
startup_tab_in_repo = "Start tab inside a repository"
startup_tab_in_repo_help = "The tab a start opens on when the folder it starts in is inside a repository. Current repository opens that repository's tab, opened if needed. Last tab opens the tab that was active at the last quit (Home when Remember tabs is off). A repository given with --repo always opens its own tab. Read once at startup; needs a restart to take effect."
startup_tab_outside_repo = "Start tab outside a repository"
startup_tab_outside_repo_help = "The tab a start opens on when the folder it starts in is not a repository, a user folder for example. Last tab opens the tab that was active at the last quit (Home when Remember tabs is off or nothing is remembered). Radar opens Home when the Radar is off. Read once at startup; needs a restart to take effect."
startup_tab_launcher = "Start tab from the launcher"
startup_tab_launcher_help = "The tab a start opens on when GitPoulpi is started from its desktop or Start menu shortcut (made further down this page), whatever the folder. Wins over the two settings above, and Last tab and Radar behave as there. Read once at startup; needs a restart to take effect."
group_worktree_tabs = "Group worktree tabs together"
group_worktree_tabs_help = "Tabs of a repository's linked worktrees sit right after that repository's tab, and a worktree tab dragged away snaps back next to it. Off leaves tabs where you put them. Turning it on regroups the open tabs."
allow_agent_view_control = "Allow AI agents to drive the view"
allow_agent_view_control_help = "On, an AI agent (through the MCP or `gitpoulpi ui`) can ask this window to show a commit, a file or a notice. It never changes anything in the repository. Off, this window does not accept them. Read when a window opens."
allow_ui_propose = "Let AI agents propose changes for me to confirm"
allow_ui_propose_help = "On, an AI agent may open a dialog pre-filled for you: a new message for a commit, a commit message in the composer, a new branch or tag. It is marked ✦ Proposed by <agent>, and nothing changes until you press the dialog's own confirm; Esc rejects it. Off (the default), `ui propose` and the MCP ui_propose_* tools are refused."
clone_root = "Default clone folder"
clone_root_help = "Where the Clone dialog's \"Where to clone to\" starts. Empty uses the per-OS default: %USERPROFILE%\\source\\repos on Windows, ~/src elsewhere."
# context: setting: which source the Clone dialog opens on (Last used, Clone with URL, or an integration)
clone_start_source = "Clone dialog starts on"
clone_start_source_help = "The source the Clone dialog opens on. Last used reopens the one it showed when it was last closed; Clone with URL always starts on the URL form; or pick one of your connected integrations. A source that is no longer available falls back to Clone with URL."
# context: option of the "Clone dialog starts on" setting: the source shown when the dialog was last closed
clone_start_last = "Last used"
browse_root = "Default browse folder"
browse_root_help = "Where Browse (the folder picker on the Home tab) opens. Empty reopens the last folder you chose, or your home folder the first time."
heading_auto_stash = "Auto-stash"
# context: sub-heading of the settings rows about the application log
heading_log = "Application log"
heading_undo = "Undo history"
# context: setting: the most verbose level recorded in the application log
log_level = "Log level"
# context: setting: how many days of log files are kept
log_retention_days = "Keep log files for"
# context: setting help: how long log files are kept; a number and a unit (days, weeks, months, years) on one line
log_retention_help = "Older log files are deleted when GitPoulpi starts. Each day's file is also capped by the size setting below."
# context: setting: where the data GitPoulpi keeps for one repository lives (ref filters, fold state, workflow, caches)
repo_data_location = "Repository data location"
# context: help of the setting above
repo_data_location_help = "Where per-repository data (ref filters, workflow, caches) is stored. Inside .git keeps the working tree clean; moving the setting migrates existing data."
# context: option of the repository data location: inside the repository's .git folder
repo_data_in_git_dir = "Inside .git (gitpoulpi folder)"
# context: option of the repository data location: a .gitpoulpi folder in the working tree
repo_data_in_worktree = "In the working tree (.gitpoulpi folder)"
# context: option of the repository data location: the user's own data folder
repo_data_user_data = "In my user data folder (outside the repository)"
# context: setting: size at which a log file is rotated, in MiB
log_max_file_mb = "Maximum size of a log file"
# context: setting: show how long operations take in the Activity Log
log_timings = "Show how long operations take"
# context: help of the setting above
log_timings_help = "Adds the duration in milliseconds to each operation in the Activity Log (Git operations tab)."
# context: setting: extended logging, also lists background operations
log_extended = "Extended logging"
# context: help of the setting above
log_extended_help = "Also list the background operations (auto-{$fetch}, refresh, status polling) with their durations."
# context: setting: how the status line counts the total commits (the dropdown choices are in settings_value)
commit_count = "Count the total {$commits} with"
# context: help of the setting above; mentions antivirus software
commit_count_help = "How the status line learns the total in loaded / total. System git runs one git process (fastest normally). libgit2 counts inside GitPoulpi and starts no process: choose it when antivirus software scans every command and makes git slow. Off shows only the loaded {$commits}. Applies at once."
auto_stash = "Auto-stash before checkout, pull, merge or rebase"
auto_stash_help = "What to do when a checkout, pull, merge or rebase is blocked by local changes. ask: a dialog offers to stash them, run the operation and pop the stash again; always: do that without asking; never: refuse, as git does."
include_untracked_in_autostash = "Include untracked files in auto-stash"
include_untracked_in_autostash_help = "Whether the automatic stash also takes untracked files (otherwise only tracked changes are stashed and put back)."
hosting_refresh_minutes = "{$^prs} and issues refresh"
hosting_refresh_minutes_help = "How often the sidebar's {$^prs} and Issues lists (and the toolbar's linked-{$pr_abbr} chip) ask the host again. 0 turns the timer off; they still refresh on opening a repository, on a branch switch, after a push or fetch, and on demand."
pr_terminology = "Review request terminology"
pr_terminology_help = "The word used for a hosted code-review request everywhere in the TUI. Auto follows the repository's host: Merge request for GitLab, Pull request for the other hosts. Pull request or Merge request forces that word. Applies at once."
hide_finished_pr_chip = "Hide the {$pr} chip when it is closed or {$merge}d"
hide_finished_pr_chip_help = "The chip on the toolbar shows the latest {$pr} of the checked-out branch. On, it is hidden once that {$pr} is closed or {$merge}d and the branch offers the dim \"+ {$pr_abbr}\" chip instead, as if it had none. Off, the chip always shows the latest {$pr}, whatever its state. Applies at once."
heading_external_tools = "External tools"
external_editor = "External editor"
external_editor_help = "Command for a file's \"Open in <editor>\" menu item; {{file}} is the file's full path (appended when absent). Empty: VS Code (`code`) when it is on PATH, else the system's default program."
external_diff_tool = "External diff tool"
external_diff_tool_help = "Command for \"Open in external diff tool\"; {{local}} is the committed (or staged) version, {{remote}} the version being compared. Empty: `git difftool`, with whatever `diff.tool` you configured in git."
# context: Settings row label; the program that resolves a conflict card (binary, LFS, too large file)
external_merge_tool = "External merge tool"
external_merge_tool_help = "Command for \"Open in external merge tool\" on a conflict card; {{base}}, {{local}} (A, current), {{remote}} (B, incoming) and {{merged}} (where the tool writes the result; staged when it exits successfully). Empty: `git mergetool`, with the `merge.tool` you configured in git."
file_explorer = "File explorer"
file_explorer_help = "Command for \"Show in folder\"; {{path}} is the file's full path, {{dir}} its folder. Windows: explorer.exe /select,\"{{path}}\" selects the file; Linux: xdg-open \"{{dir}}\"; macOS: open -R \"{{path}}\"."
ai_assistant = "AI assistant"
launch = "Open a window for agents"
launch_help = "When an AI agent asks to show something and no GitPoulpi window is open anywhere, this opens one: off (never, the default), a terminal (kitty, foot, WezTerm, Windows Terminal, ...), a new tab, pane or workspace in a multiplexer (tmux, zellij, cmux, ...), or custom, which uses the template below. The agent must still ask for it (`--launch`), or its ui_control must be auto. Applies to the next request."
launch_command = "Launch command (custom)"
launch_command_help = "Used when the choice above is custom. Split into arguments (quote with '...' or \"...\"), no shell. {{repo}} is the repository folder, {{session}} the session name and {{gitpoulpi}} this program. Example: kitty --directory {{repo}} {{gitpoulpi}} --session {{session}}"
tab_dir_follow = "Follow the active tab's folder"
tab_dir_follow_help = "A program cannot change its shell's folder, so this offers two ways to get there. buttons (the default): while the active tab is not the folder GitPoulpi was started in, the tab bar shows Quit & cd here (only when started through the shell wrapper, see `gitpoulpi shell-init`). auto: no buttons; quitting always cd's your shell to the active tab, and a terminal opens by itself whenever you open a new tab (not for the tabs restored at start-up)."
forget_all_usernames_and_passwords = "Forget all usernames and passwords"
forget_all_usernames_and_passwords_help = "Removes every token GitPoulpi stored in your credential helper."
mcp_server = "MCP server"
mcp_server_help = "On, an AI agent can start the MCP server (`gitpoulpi mcp serve`, or `--http` for the network endpoint). Off, it refuses to start. Saved as `mcp.enabled`. A change applies the next time an agent starts the server; a server that is already running keeps the settings it started with."
mcp_port = "MCP server port"
mcp_port_help = "The port `gitpoulpi mcp serve --http` listens on when no address is given (the host part of `mcp.bind` is kept, 127.0.0.1 by default, loopback only unless --allow-remote). Applies the next time an agent starts the server; a running server keeps its port."
mcp_bind_unreadable = "`mcp.bind` is \"{bind}\", which has no readable port. Setting a port here keeps its host and replaces the rest."
undo_off_note = "Undo is off - turn on \"Undo enabled\" to set the depth"
# context: a setting: the Log, blame and file history show each author as the repository's .mailmap names them
use_mailmap = "Show authors through .mailmap"
use_mailmap_help = "Shows each author as the repository's .mailmap names them in the Log, blame and file history. The {$commits} themselves are not changed. Applies at once."
auto_prune_tags = "Auto-prune {$tags}"
auto_prune_tags_help = "On every {$fetch}, also deletes the local {$tags} that the remote has deleted. Only {$tags} that were on the remote are touched: a {$tag} you never pushed is kept. Off by default, like git."

# context: log retention unit dropdown, beside a number ("2 weeks"). Only the unit word is shown: the number is cut out of the text, so keep it a separate word
retention_unit_days = { one = "{n} day", other = "{n} days" }
retention_unit_weeks = { one = "{n} week", other = "{n} weeks" }
retention_unit_months = { one = "{n} month", other = "{n} months" }
retention_unit_years = { one = "{n} year", other = "{n} years" }

# context: duration unit dropdown, beside a number ("5 minutes"). Only the unit word is shown: the number is cut out of the text, so keep it a separate word
unit_milliseconds = { one = "{n} millisecond", other = "{n} milliseconds" }
unit_seconds = { one = "{n} second", other = "{n} seconds" }
unit_minutes = { one = "{n} minute", other = "{n} minutes" }
unit_hours = { one = "{n} hour", other = "{n} hours" }
# context: size unit dropdown, beside a number ("32 MiB"): mebibytes (1024 x 1024 bytes)
unit_mib = "MiB"
# context: size unit dropdown, beside a number ("1 GiB"): gibibytes (1024 MiB)
unit_gib = "GiB"
# context: sub-heading of the settings rows about history rewrite (external scripts)
heading_rewrite = "History rewrite"
# context: setting: how long an external script of a history rewrite gets to answer one request (one commit of the rewrite); a number and a unit (milliseconds, seconds) on one line
script_timeout = "Script answer time limit"
script_timeout_help = "When an external script takes longer than this to answer one request, its whole process is stopped and the rewrite fails with nothing moved."
# context: setting: how long one whole pass of an external script of a history rewrite may take; a number and a unit (seconds, minutes, hours) on one line
script_total_timeout = "Script time limit per pass"
script_total_timeout_help = "The most one whole pass of an external script over the history may take. Past it the script is stopped and the rewrite fails with nothing moved."

