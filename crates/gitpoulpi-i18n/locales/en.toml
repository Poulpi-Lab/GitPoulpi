mouse_gestures_in_1 = "terminals don't change the OS pointer shape for most things, so a background/foreground change on hover is often the only \"this is clickable\" signal - every button, checkbox, tab, menu row, pane-header action and the × close button light up on hover; a Log cell, a commit's other refs and a file/blame gutter show a value tooltip instead"
mouse_gestures_in_2 = "a pane divider or Log column boundary resizes it (past the minimum, the pane collapses); a Log column header dragged past a neighbor reorders it; dragging a ref onto another branch opens a menu of the actions that apply (Esc cancels)"
mouse_gestures_in_3 = "drag over the text of a diff, File View, Blame or File History selects it, double-click a word; y or Ctrl+C copies it (file text only, never gutters); the other occurrences of a selected word are tinted in the diff and the editor (and marked on the ruler)"
mouse_gestures_in_4 = "scrolls the focused/hovered list or diff; Shift+wheel (both spellings terminals report) scrolls a diff/file view/blame *horizontally* instead, while word wrap is off"
mouse_gestures_in_5 = "opens a context menu wherever one exists (see each pane's section above); the keyboard equivalent is always {{*global.context_menu}}"
mouse_gestures_in_6 = "every \"Copy ...\" action puts the text on the system clipboard and, where the terminal is known to honor it, also sends it via OSC 52; over SSH or with no display only OSC 52 is sent, and a terminal that ignores the sequence doesn't copy"
mouse_gestures_in_7 = "resize/pointer/open-hand hints are sent via OSC 22 on terminals that support it (kitty, Ghostty, foot, mintty; not in Rio, Alacritty, Windows Terminal or iTerm2) - draggable dividers and column boundaries also light up inside the app's own buffer, which needs no terminal cooperation at all"
