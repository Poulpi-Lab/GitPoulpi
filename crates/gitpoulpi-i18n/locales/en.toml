# context: line under a card's buttons
card_note = "Choosing resolves the file at once (it is staged). Esc closes without choosing."
# context: status line after the external merge tool was started; {path} is the file
msg_external_started = "opened {path} in the external merge tool · it is staged when the tool succeeds"
# context: why a palette command is unavailable: the editor shows text panes, not a card
reason_not_card = "this conflict is shown as text panes, not as a card"
# context: error when the temp files for the external merge tool cannot be written; {why} is the system error
ext_prepare_failed = "could not prepare the merge tool's files: {why}"
# context: error when the external merge tool cannot start; {program} is its command, {why} the system error
ext_start_failed = "could not start {program}: {why}"
# context: error when the external merge tool failed; {program} is its command, {status} how it ended, {path} the file
ext_failed = "{program} exited with {status}: {path} stays conflicted"
# context: status line when an agent asked for a conflict number the file does not have; {n} is the number, {path} the file
msg_agent_no_conflict = "an agent asked for conflict {n} in {path}, which has no such conflict"
# context: status line when an agent's proposal was dropped because the file's stages changed since it was made
msg_agent_stale = "the agent's proposal was dropped: the file changed since it was made"
# context: status line when an agent's proposal does not fit the file (a different number of conflicts, or not text)
