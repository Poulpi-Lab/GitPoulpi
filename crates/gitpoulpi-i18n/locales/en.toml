# English: the source of truth. Every key lives here; other languages add
# translations for the same keys. See docs/developer/i18n.md.
#
# Shapes:  key = "text {arg} {$term}"
#          key = { git = "...", local = "..." }   per-vocabulary text
#          key = { one = "...", other = "..." }   plural ({n} in `other`)

[_meta]
language_name = "English"

# Git vocabulary. `git` is the English word developers search for and the
# default. `local` is the translated vocabulary, used when the "Translate git
# terms" setting is on (English: the same words). A message writes `{$name}`
# (as is), `{$Name}` (first letter capitalized) or `{$NAME}` (upper case).
# `pr`, `prs` and `pr_abbr` also depend on the host: { pull, merge }.
[term]
commit = { git = "commit", local = "commit" }
commits = { git = "commits", local = "commits" }
push = { git = "push", local = "push" }
pull = { git = "pull", local = "pull" }
fetch = { git = "fetch", local = "fetch" }
merge = { git = "merge", local = "merge" }
rebase = { git = "rebase", local = "rebase" }
cherry_pick = { git = "cherry-pick", local = "cherry-pick" }
stash = { git = "stash", local = "stash" }
stashes = { git = "stashes", local = "stashes" }
pop = { git = "pop", local = "pop" }
apply = { git = "apply", local = "apply" }
stash_drop = { git = "drop", local = "drop" }
tag = { git = "tag", local = "tag" }
tags = { git = "tags", local = "tags" }
head = { git = "HEAD", local = "HEAD" }
diff = { git = "diff", local = "diff" }
pr = { git = { pull = "pull request", merge = "merge request" }, local = { pull = "pull request", merge = "merge request" } }
prs = { git = { pull = "pull requests", merge = "merge requests" }, local = { pull = "pull requests", merge = "merge requests" } }
pr_abbr = { git = { pull = "PR", merge = "MR" }, local = { pull = "PR", merge = "MR" } }
pick = { git = "pick", local = "pick" }
reword = { git = "reword", local = "reword" }
squash = { git = "squash", local = "squash" }
fixup = { git = "fixup", local = "fixup" }
drop = { git = "drop", local = "drop" }
edit = { git = "edit", local = "edit" }
stage = { git = "stage", local = "stage" }
unstage = { git = "unstage", local = "unstage" }
staged = { git = "staged", local = "staged" }
unstaged = { git = "unstaged", local = "unstaged" }
staged_files = { git = "Staged Files", local = "Staged Files" }
unstaged_files = { git = "Unstaged Files", local = "Unstaged Files" }
# Noun forms of the git actions, for sentences that name the operation ("after the push", "LFS push: 2/5"). A
# language whose local verb is not a noun (fr "pousser" / "envoi") gives the noun here; `git` is the English word.
push_noun = { git = "push", local = "push" }
pull_noun = { git = "pull", local = "pull" }
fetch_noun = { git = "fetch", local = "fetch" }
merge_noun = { git = "merge", local = "merge" }
rebase_noun = { git = "rebase", local = "rebase" }

# Seed messages that exercise every mechanism; real areas are added by the
# extraction slices, each in its own section.
[common]
# context: toolbar-style verb, a button
push = "{$Push}"
# context: the git stash, a noun
stash = "{$Stash}"
# context: a button; the word for the pull/merge request depends on the host
create_pr = "Create {$pr}"
# context: status message; {old} and {new} are branch names, may be reordered
branch_renamed = "Renamed {old} to {new}"
files_staged = { one = "Staged {n} file", other = "Staged {n} files" }
commits_ahead = { one = "{n} {$commit} ahead", other = "{n} {$commits} ahead" }
# context: a menu entry; grammar may depend on the term, hence per-vocabulary text
undo_commit = { git = "Undo {$commit}", local = "Undo {$commit}" }
# context: literal braces are written doubled
braces = "Use {{name}} as a placeholder"

# Toolbar: the buttons' text (the icon glyph stays in code), their tooltips and
# the overflow menu's spelled-out rows. Width budget: labels <= 9 cells.
[toolbar]
# context: toolbar button, verb: undo the last git operation
undo = "Undo"
# context: toolbar button, verb: redo what was undone
redo = "Redo"
# context: toolbar button, the git pull operation
pull = "{$Pull}"
# context: toolbar button, the git push operation
push = "{$Push}"
# context: toolbar button, verb: create a branch
branch = "Branch"
# context: toolbar button, verb: create a tag
tag = "{$Tag}"
# context: toolbar button, verb: put the working changes aside (git stash)
stash = "{$Stash}"
# context: toolbar button, verb: apply the latest stash and drop it
pop = "{$Pop}"
# context: toolbar button, verb: search the commit graph
search = "Search"
pull_tip = "{$Pull} the current branch from its upstream"
push_tip = "{$Push} the current branch to its remote"
branch_tip = "Create a branch at the selected commit or HEAD"
tag_tip = "Create a {$tag} at the selected commit or HEAD"
stash_tip = "{$Stash} the working changes"
pop_tip = "Apply the latest {$stash} and {$stash_drop} it"
search_tip = "Search the commit graph"
pull_menu_tip = "Choose what {$Pull} does: Fetch All, or {$pull} with merge, fast-forward or rebase"
push_menu_tip = "{$Push} the checked-out branch to a remote you choose, once"
# context: row of the toolbar overflow menu (the glyph is added by the code)
overflow_push_menu = "{$Push} to remote..."
# context: row of the toolbar overflow menu (the glyph is added by the code)
overflow_pull_menu = "{$Pull} button does..."
# context: tooltip of the gear button in the title bar, left of the quit button
settings_tip = "Settings"

# Settings rows added with the language setting; the rest of the page is
# extracted in its own slice.
lfs = "LFS"
lfs_tip = "Git LFS: {$fetch}, check out, {$pull} or {$push} the large files, or prune the local store"

[settings]
# context: Settings row label, a combobox choosing the display language
language = "Language"
# context: appended to the Language help when the GITPOULPI_LANG environment variable is set
language_env_override = "GITPOULPI_LANG is set here, so it wins over this choice."
language_help = "The language of the interface. Auto follows your system. Applies at once. GITPOULPI_LANG overrides it."
# context: {name} is the language detection picked, in its own language
language_auto = "Auto ({name})"
# context: suffix of a language in the picker whose translation is not complete yet; the interface stays English
language_soon = "{name} (soon)"
# context: suffix of a language shown in the picker that is chosen in config.toml but was left out when this binary was built (custom build); the interface stays English
language_not_built = "{name} (not built into this binary)"
# context: Settings row label, a checkbox right below Language
translate_git_terms = "Translate git terms"
translate_git_terms_help = "Off (default): commit, push, pull, stash, tag... stay English in every language, as developers say them. On: use the translated git vocabulary of the chosen language. Applies at once."
# context: Settings checkbox shown only for ja, ko and zh-CN, below Translate git terms
git_terms_english = "Use English git words"
git_terms_english_help = "Only for this language: show the English git words instead of the katakana, hangul or Chinese ones. Has no effect while Translate git terms is on. Applies at once."
# context: shown in place of the value when the checkbox is disabled
git_terms_english_off = "unavailable while git terms are translated"

# The merge conflict editor. Keys named after the area. Toolbar labels degrade by width, so
# several have a shorter twin.
[merge]
# context: header of the merge conflict editor; {path} is the file. The word is the git operation
title = { git = "{$Merge} \u00b7 {path}", local = "{$Merge} \u00b7 {path}" }
# context: header, right side; {k} is the position of the open conflicted file, {n} how many files are conflicted
file_of = "file {k} of {n}"
# context: title of the lower pane: the merged result being edited; {path} is the file
output_title = "Output \u00b7 {path}"
# context: toolbar label before the two "take all" buttons (take the whole file from A or from B)
take_all = "Take all:"
# context: shorter twin of take_all when the toolbar is narrow
take_all_short = "All:"
# context: toolbar button, picks every conflict from side A (the branch being merged into). A is a letter label
take_a = "A Current"
# context: toolbar button, picks every conflict from side B (the incoming branch). B is a letter label
take_b = "B Incoming"
# context: toolbar toggle that shows or hides the common-ancestor pane
base = "Base"
# context: toolbar toggle: show the whole file in panes A and B, colored against the common ancestor
full_file = "Full file"
# context: pane title fallback: side A, the branch we are on
current = "Current"
# context: pane title fallback: side B, the branch being merged in
incoming = "Incoming"
# context: toolbar button, writes the file without marking it resolved
save = "Save"
# context: toolbar primary button, writes the file and stages it. Longest form
save_resolve_long = "Save & mark resolved"
# context: toolbar primary button, medium form of save_resolve_long
save_resolve = "Save & resolve"
# context: toolbar primary button, shortest form (a check mark is added by the code)
save_short = "Save"
# context: header of one conflict block; {n} is its number
conflict_n = "Conflict {n}"
# context: row in the Output pane standing for a conflict with nothing picked; {n} is the conflict number
placeholder = "Conflict {n} \u00b7 nothing picked yet \u00b7 pick from A / B, or type here"
# context: row under the Output when the file has no final line break
no_final_newline = "no newline at end of file"
# context: one-time hint after a pick replaced text the user typed; {undo_key} is the key that undoes
replaced_edit = "replaced your edit \u00b7 {undo_key} restores"
# context: suffix of a pane title when its alignment is approximate (shown as the conflict blocks)
approximate = "approximate"
# context: pane message when both sides added the file and there is no common ancestor
no_ancestor = "no common ancestor (both added)"
# context: pane message when a side has no text at this path
no_text = "no text on this side"
# context: counter text when the output was loaded from the file on disk
edited_outside = "edited outside"
# context: notice shown instead of the editor when the terminal is too small (60 columns by 14 rows)
too_small = { git = "{$Merge} editor needs at least 40\u00d714 \u00b7 widen the window or use the palette's Take Current/Incoming", local = "{$Merge} editor needs at least 40\u00d714 \u00b7 widen the window or use the palette's Take Current/Incoming" }
# context: key hints under the editor, one per hint; shown after the key label: "<key> line"
hint_line = "line"
# context: key hint, toggles the whole chunk of the focused side
hint_chunk = "chunk"
# context: key hint, take A or B or both for the current conflict
hint_take = "take"
# context: key hint, swaps which of the two picked sides comes first
hint_order = "order"
# context: key hint, goes to the next conflict
hint_next = "next"
# context: key hint, moves the focus to the next pane
hint_pane = "pane"
# context: key hint, writes the file and marks it resolved
hint_save = "save & resolve"
# context: key hint, closes the editor
hint_close = "close"
# context: what was copied, in the status line "copied <what>"; a selection of the Output
clip_selection = "the selection"
# context: what was cut, in the status line
clip_cut = "the cut text"
# context: button on the Diff view bar of a conflicted file: opens the merge editor
button_merge_editor = "Merge editor"
# context: card in the Diff view of a conflicted file (no useful diff exists): title
conflict_card_title = "Conflicted file"
# context: card in the Diff view of a conflicted file: what to do next
conflict_card_hint = "Click here or press Enter to resolve it in the merge editor"
# context: status line when the window cannot close because the merge editor has unsaved work; {path} is the file
msg_unsaved_leave = "unsaved changes in {path}: save or discard them first"
# context: key hint (Output focused), undoes the last pick or typing
hint_undo = "undo"
# context: key hint (Output focused), goes back to the A / B panes
hint_back = "back to A / B"
# context: title of the box asking what to do with unsaved work in the merge editor
prompt_title = "Unsaved changes"
# context: question in that box; {path} is the file
prompt_question = "Save changes to {path}?"
# context: button of that box: write the file (it stays conflicted) and go on
prompt_save = "Save"
# context: button of that box: throw the work away and go on
prompt_discard = "Discard"
# context: button of that box: stay in the editor
prompt_cancel = "Cancel"
# context: title of the box shown before a save that would leave conflicts empty or leave markers in
confirm_title = "Save anyway?"
# context: line of that box; {n} is how many conflicts have nothing picked
confirm_unpicked = { one = "{n} conflict has nothing picked: it will be empty in the file.", other = "{n} conflicts have nothing picked: they will be empty in the file." }
# context: line of that box; {n} is the line of the Output that looks like a conflict marker
confirm_markers = "The Output still contains a conflict marker on line {n}."
# context: button of that box: save as it is
confirm_save_anyway = "Save anyway"
# context: button of that box: leave the save and show a conflict; {n} is its number
confirm_go_to = "Go to conflict {n}"
# context: strip under the editor when the file on disk was edited by something else
strip_edited_outside = "The file on disk was edited outside the editor."
# context: strip button: load the text on disk into the Output
strip_continue = "Continue from the file on disk"
# context: strip button: keep the fresh merge and drop the strip
strip_start_over = "Start over from the merge"
# context: strip under the editor when the file was resolved by another program or window
strip_resolved = "This file was resolved outside the editor."
# context: strip under the editor when the stages of the file changed under the open editor
strip_changed = "This conflict changed outside the editor."
# context: strip button: close the editor
strip_close = "Close"
# context: strip button: put the conflict back and open the file again
strip_unresolve = "Unresolve and reopen"
# context: strip button: open the file again from the repository
strip_reload = "Reload"
# context: status line while the file is being read; {path} is the file
msg_opening = "opening {path} in the merge editor..."
# context: status line after a save that left the file conflicted; {path} is the file
msg_saved = "saved {path} · still conflicted"
# context: status line while the file is being written; {path} is the file
msg_saving = "saving {path}..."
# context: the Output's find bar in the hint row; {query} is what was typed (with a caret mark)
find_bar = "Find: {query}   Enter next · Shift+Enter previous · Esc close"
# context: the find bar when the last search found nothing; {query} as above
find_bar_miss = "Find: {query}   no match · Esc close"
# context: status line after Save and Mark Resolved; {path} is the file
msg_resolved = "resolved {path}"
# context: status line after Save and Mark Resolved when other files remain; {path} is the file, {n} the count
msg_resolved_left = { one = "resolved {path} · {n} conflicted file left", other = "resolved {path} · {n} conflicted files left" }
# context: status line when a save was refused because the file changed meanwhile; {path} is the file
msg_stale = "{path} was resolved or changed elsewhere since it was opened: nothing was written"
# context: status line when saving failed; {path} is the file, {why} the reason
msg_save_failed = "could not save {path}: {why}"
# context: status line when the file cannot be opened; {path} is the file, {why} the reason
msg_open_failed = "could not open {path}: {why}"
# context: status line when there is no conflicted file to open
msg_no_conflicts = "no conflicted files"
# context: status line when next/previous file has nowhere to go
msg_one_file = "this is the only conflicted file"
# context: status line when undo or redo has nothing to do in the editor
msg_nothing_undo = "nothing to undo"
msg_nothing_redo = "nothing to redo"
# context: status line after Reset Pane Sizes
msg_panes_reset = "pane sizes reset"
# context: status line when a pane resize key is used while A and B are tabs
msg_panes_tabbed = "A and B are tabs at this width: nothing to resize"
# context: status line after Reset Output
msg_reset = "Output reset to the merge result"
reset_all = "Reset"
msg_unpicked = "conflict back to unresolved"
menu_unpick = "Unpick (back to unresolved)"
reset_confirm_title = "Reset the Output?"
reset_confirm_text = "The Output holds text you typed. Resetting discards it (Undo brings it back)."
reset_confirm_button = "Reset"
tip_reset = "Unpick every conflict and restore the Output to the original conflicted state"
tip_take_all_a = "Take A (current) for every conflict of the file"
tip_take_all_b = "Take B (incoming) for every conflict of the file"
# context: status line after the file on disk was loaded into the Output
msg_loaded_disk = "Output loaded from the file on disk · picks are off until you start over"
# context: status line when a pick is refused because the Output came from the disk
msg_picks_off = "picks are off: the Output came from the file on disk. Start over to pick again"
# context: status line while an unresolve is running; {path} is the file
msg_unresolving = "putting {path} back in conflict..."
# context: context-menu row on a conflict: use only A's lines
menu_take_a = "Take A only"
menu_take_b = "Take B only"
# context: context-menu row: both sides, A's lines first
menu_a_then_b = "A then B"
menu_b_then_a = "B then A"
# context: context-menu row: no line from either side
menu_none = "Take nothing"
# context: context-menu row: put the caret in the Output at this conflict
menu_edit = "Edit in Output"
menu_take_all_a = "Take all of A"
menu_take_all_b = "Take all of B"
# context: menu row that shows or hides the common-ancestor pane
menu_base = "Show or hide the Base pane"
# context: menu row that switches panes A and B between conflicts only and the whole file colored like a diff
menu_full_file = "Toggle the full-file diff coloring"
menu_reset = "Reset Output to the merge result"
# context: menu row: stage A's whole file as it is, with no merge at all
menu_use_a_file = "Use A's file as is (discard B's changes too)"
menu_use_b_file = "Use B's file as is (discard A's changes too)"
# context: banner above the Log while a merge is stopped; {theirs} is what is merged in, {head} the branch
banner_merge = "{$Merge} in progress · {theirs} into {head}"
# context: same banner on a detached HEAD
banner_merge_detached = "{$Merge} in progress · {theirs}"
# context: banner while a cherry-pick is stopped; {commit} is the short commit id
banner_pick = "{$Cherry_pick} in progress · {commit}"
# context: banner while a revert is stopped; {commit} is the short commit id
banner_revert = "Revert in progress · {commit}"
# context: banner suffix: how many files still have conflicts
banner_files = { one = "{n} conflicted file", other = "{n} conflicted files" }
# context: banner suffix when no file has conflicts any more
banner_all_resolved = "all conflicts resolved"
# context: banner button, opens the merge editor on the first conflicted file
banner_resolve = "Resolve conflicts..."
# context: banner button that commits the merge
banner_commit_merge = "{$Commit} {$merge}"
# context: banner button that continues a cherry-pick or revert
banner_continue = "Continue"
# context: banner button that aborts a merge
banner_abort_merge = "Abort {$merge}"
# context: banner button that aborts a cherry-pick or revert
banner_abort = "Abort"
# context: confirmation before aborting a merge
abort_confirm_merge = "Abort the {$merge} in progress? HEAD, the index and the working tree go back to where they were."
# context: confirmation before aborting a cherry-pick
abort_confirm_pick = "Abort the {$cherry_pick} in progress? HEAD, the index and the working tree go back to where they were."
# context: confirmation before aborting a revert
abort_confirm_revert = "Abort the revert in progress? HEAD, the index and the working tree go back to where they were."
# context: banner button that skips a cherry-pick or revert (gives up on the stopped step)
banner_skip = "Skip"
# context: confirmation before skipping a cherry-pick
skip_confirm_pick = "Skip the {$cherry_pick} in progress? Nothing is recorded for it and its resolutions are dropped."
# context: confirmation before skipping a revert
skip_confirm_revert = "Skip the revert in progress? Nothing is recorded for it and its resolutions are dropped."
# context: message when Continue is used on an empty cherry-pick or revert (the change is already applied)
msg_empty_pick = "nothing to record: the change is already applied. Use Skip to leave this step."
# context: message when the abort banner is used without any operation
msg_no_operation = "no merge, cherry-pick or revert is in progress"
# context: why a palette command is unavailable: the editor is closed
reason_no_editor = "open the merge editor first (Enter on a conflicted file)"
# context: why a palette command is unavailable: nothing is conflicted
reason_no_conflicts = "the repository has no unresolved conflicts"
# context: why a palette command is unavailable: no operation is running
reason_no_operation = "no merge, cherry-pick or revert is in progress"
# context: why a palette command is unavailable: only a cherry-pick or revert can be skipped
reason_not_skippable = "only a {$cherry_pick} or a revert can be skipped"
# context: why a palette command is unavailable: the Output came from the disk
reason_picks_off = "the Output came from the file on disk: start over from the merge to pick again"
# context: why a palette command is unavailable: the file has several conflicts to reach
reason_one_file = "there is no other conflicted file"
# context: why a palette command is unavailable: no strip is showing
reason_no_strip = "nothing to answer here"
# context: why a palette command is unavailable: the editor has no conflict block (non-text)
reason_no_blocks = "this file has no conflict blocks to pick from"
# context: card of a conflict that is not text: headline, binary file
card_binary = "Binary file: both sides changed it and git cannot merge it line by line."
# context: card headline, Git LFS pointer files
card_lfs = "Git LFS pointer: the two sides point to different large files."
# context: card headline, file over the size limit for the text editor
card_too_large = "File too large to merge here (over 8 MiB)."
# context: card headline: A deleted the file, B changed it
card_deleted_in_a = "Deleted in A, changed in B."
# context: card headline: B deleted the file, A changed it
card_deleted_in_b = "Changed in A, deleted in B."
# context: card headline, leftover of a rename conflict
