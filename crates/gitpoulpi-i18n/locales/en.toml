# context: card button: take the common ancestor's version
card_take_base = "Take base"
# context: card button: keep the file that is left (delete / modify)
card_keep_file = "Keep the file"
# context: card button: the deletion wins
card_accept_delete = "Accept the deletion"
# context: card button: remove the file
card_delete = "Delete the file"
# context: card button: open the file in the configured merge tool
