group_terminal = "Terminal"
group_editor = "Editor"
group_git = "Git tool"
group_agent = "AI agent"
group_web = "Web"
add_custom = "Add custom"
restore = "Restore detected defaults"
restore_help = "Replaces the list with the entries detected on this machine and clears the default."
new_entry_label = "New entry"
saved = "Open in list saved"
label_empty = "The label cannot be empty"
label_taken = "An entry labeled \"{label}\" already exists"
command_invalid = "Command: {error}"
