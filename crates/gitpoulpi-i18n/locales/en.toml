# context: line in a side's box; {oid} short object id, {size} human size, {mode} file mode (octal)
card_detail = "{oid} · {size} · mode {mode}"
# context: line in a side's box for a submodule; {oid} is the commit
card_commit = "commit {oid}"
# context: line in a side's box for a symbolic link; {target} is where it points
card_points_to = "points to {target}"
# context: line in a side's box for an LFS pointer; {oid} is the start of the large file's id, {size} its size
