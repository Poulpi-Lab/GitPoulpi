# S23: what the host protects, and the three ways through it. Never done
# automatically: these are instructions. The git words are terms ({$push},
# {$tag}, {$prs}) so "Translate git terms" works here too; the exact commands
# are in the English CLI text, not here.
[rewrite_host]
protected_on = "protected on {provider}"
btn_howto = "How to get through"
title = "Getting through the host's protection"
intro = "The host refuses the rewritten history of {names} because {provider} protects it. GitPoulpi never changes the host's settings for you; there are three ways through, from the least to the most drastic."
unknown = "The host's protection could not be read: {why}"
not_asked = "This repository is not linked to a host, so its protection was not read. Link it in the sidebar to see which branches are protected."
refs_unknown = "Host protection unknown: {why}"
any_branch = "the protected branch"
way_lift = "1. Temporarily lift the protection in the host's settings"
way_rename = "2. {$Push} the rewrite under a new branch name, then switch the default branch"
way_recreate = "3. Last resort: delete and recreate the remote repository"
step_lift_github = "Open the repository's Settings > Branches (branch protection rules) and Settings > Rules (rulesets), remove or relax the rule that covers the branch, {$push} the rewrite, then put the rule back."
step_lift_gitlab = "Open Settings > Repository > Protected branches, unprotect the branch (or turn on the option that lets you rewrite its history for it), then protect it again once the rewrite is sent."
step_lift_azure = "Open Project settings > Repositories > the repository > Policies, remove the branch policy on the branch and, under Security, allow yourself the permission to rewrite history and delete branches, {$push} the rewrite, then restore both."
step_lift_bitbucket = "Open the repository's settings > Branch restrictions (Branch permissions on Data Center), remove the restriction that covers the branch, {$push} the rewrite, then restore it."
step_lift_other = "Remove or relax the branch protection rule in the host's repository settings, {$push} the rewrite, then restore the rule."
step_push_new_name = "{$Push} the rewrite to a branch that is not protected, under a new name (GitPoulpi leaves the protected ref alone)."
step_switch_github = "Then in Settings > Branches set the new branch as the default branch (or rename the old one first with Settings > Branches > the pencil icon > Rename), and delete the old branch once nobody uses it."
step_switch_gitlab = "Then in Settings > Repository > Branch defaults set the new branch as the default branch, and delete the old one (Code > Branches) once nobody uses it."
step_switch_azure = "Then in Repos > Branches use the menu of the new branch > Set as default branch, and delete the old one once nobody uses it."
step_switch_bitbucket = "Then in the repository's settings > Repository details set the new branch as the main branch (the default branch on Data Center), and delete the old one once nobody uses it."
step_switch_other = "Then make the new branch the default branch in the host's repository settings, and delete the old one once nobody uses it."
step_recreate = "Delete the remote repository in its settings, create an empty one with the same name, then {$push} every branch and every {$tag}. Everyone must re-clone."
loses = "This loses"
