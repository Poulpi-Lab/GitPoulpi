# context: status line after opening the user docs, {url} is the address
opened_docs = "opened the user docs: {url}"
# context: status line when the browser could not be started; {url} is the address, {why} the reason
open_docs_failed = "could not open {url}: {why}"

[help_tabs]
# context: the help popup's tab headers (keep short, about 9 cells at most); the first tab is the key bindings table
tab_keys = "Keys"
tab_start = "Start"
tab_log = "Log"
tab_changes = "Changes"
tab_refs = "Refs"
tab_hosting = "Hosting"
tab_setup = "Setup"
tab_tools = "AI & CLI"
# context: the help popup's top border on the guide tabs; keys stay as written
title = "Help - type to filter, Tab switches tabs, ? closes"
title_filtered = "Help - filter \"{filter}\" - Esc clears, ? closes"
# context: the help popup's hint line under the list; keys stay as written. Alt+1..8 jumps to the tab
hint = "Tab/Shift+Tab, ←/→, Alt+1..8: tabs - ↑/↓, PgUp/PgDn scroll"
# context: guide tab entries are "Title|text": the bar splits the bold title from the text. Git words are {$term} tokens; keys and menu names stay as in the app
start_1 = "Window|Tabs on top (Home lists, opens and clones repositories), then the toolbar, the Refs sidebar on the left, the Log in the center, and the changes and the {$commit} form on the right."
start_2 = "Command palette|Ctrl+P lists every action with its shortcut. Type to search, Enter runs it. Whatever the mouse can do, the palette can do."
start_3 = "Shortcut prefixes|Ctrl+G then a key runs a git action ({$stage}, {$commit}, {$pull}, {$push}...). Ctrl+N then a key moves around or changes the view. The status line lists the choices."
start_4 = "Tabs|One tab per repository. Ctrl+PageUp / Ctrl+PageDown switch, Ctrl+W closes, t opens the tab picker, right-click a tab or press Ctrl+T for its menu."
start_5 = "Mouse and keys|Click selects, double-click opens or checks out, right-click (or .) opens a menu, drag moves refs and {$rebase} rows. Every mouse action has a key."
start_6 = "Refresh and undo|r refreshes, F5 reloads everything, Ctrl+Z / Ctrl+Y undo and redo the last operation, q quits."
log_1 = "Reading the graph|One row per {$commit}, one lane per branch. The first row is your uncommitted work (WIP): select it to see the changes. Click any row for its details on the right."
log_2 = "Searching|f (or the Search button) dims the rows that do not match a message, author, hash or ref. Enter / Shift+Enter jump to the next / previous match. / filters the Refs sidebar."
log_3 = "{$Commit} menu|Right-click a {$commit} or press . on it: {$cherry_pick}, revert, reset, edit the message, create a branch or {$tag}, check out, worktree, patch, copy."
log_4 = "Interactive {$rebase}|\"Interactively {$rebase} from here...\" in the {$commit} menu: set each {$commit} to {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} or {$edit}, reorder with Ctrl+Up/Down, start with Ctrl+S, leave with Esc."
log_5 = "Several {$commits}|Ctrl+click toggles a {$commit}, Shift+click (Alt+click) selects a range, Space toggles the current one, Esc clears. Then right-click for {$cherry_pick} or revert of the whole selection."
log_6 = "Dragging refs|Drag a branch onto another to {$merge}, {$rebase} or fast-forward, or onto a remote branch to {$push}; release to choose from a menu, Esc cancels. Keyboard: palette, \"Refs: Drop Selected Ref...\"."
changes_1 = "Working changes|Select the first Log row (WIP): {$Unstaged} and {$staged} files appear on the right. m flips between path and tree, a shows every file, z folds the folders."
changes_2 = "{$Stage} and {$unstage}|Ctrl+Space on a file, or its button, or Ctrl+G s; Ctrl+G a for everything, Ctrl+G u to {$unstage}. Right-click a file to discard, see its history or blame, or open it in your editor."
changes_3 = "Reading a {$diff}|Click a file or press d. m cycles inline / split, w wraps lines, s ignores whitespace, n / p jump between hunks, Esc or q returns to the Log."
changes_4 = "Hunks and lines|In a {$diff}: Space = {$stage} the hunk, v then j / k then Enter = {$stage} the selected lines, x = discard the hunk. Discards ask first; Ctrl+Z brings them back."
changes_5 = "Writing a {$commit}|Type a summary and a description, then Ctrl+Enter or the green button. Shift+A amends the last {$commit}. Ctrl+G c puts the caret in the form, Esc leaves it."
changes_6 = "{$Merge} conflicts|A banner offers \"Resolve conflicts...\". In the {$merge} editor pick A, B or both for each conflict (a / b / c), edit the Output, save, then Continue."
changes_7 = "Undo and redo|Ctrl+Z / Ctrl+Y, or the toolbar buttons, undo and redo most operations: {$commits}, branches, checkouts, resets, {$stashes}, discards. It asks first when risky."
refs_1 = "Branches and {$tags}|Double-click a local branch or {$tag} to check it out; right-click for its menu ({$merge}, {$rebase}, rename, delete...). Ctrl+G b and Ctrl+G t create one at the checked-out {$commit}."
refs_2 = "Solo and hide|The o key shows only the {$commits} of the selected ref, Shift+O stops. A ref's menu hides it from the graph; Shift+H shows everything again. Display only: nothing changes in the repository."
refs_3 = "{$Fetch}, {$pull}, {$push}|Ctrl+G f: {$fetch} every remote. Ctrl+G p: {$pull}. Ctrl+G Shift+P: {$push}. The arrow next to a toolbar button picks another way or another remote."
refs_4 = "Remotes|The + in the REMOTE title adds one. Right-click a remote to {$fetch} it, copy its web link, edit its URLs or remove it."
refs_5 = "{$Stashes} and worktrees|The {$stash} and Pop buttons; Ctrl+G m asks for a message first. Right-click a {$stash} to apply or pop it. \"Create worktree from...\" opens a branch in a tab of its own."
refs_6 = "Submodules and LFS|A SUBMODULES section appears when the repository has any: double-click opens one as a tab, right-click updates it. Git LFS actions: the LFS button or Ctrl+G l."
hosting_1 = "Connect|Settings > Integrations: paste a personal token for GitHub or GitLab. No account is needed; the token goes to your OS credential helper."
hosting_2 = "Link a repository|In the sidebar's {$PRS} and ISSUES sections, pick one of the providers the dropdown proposes. Nothing is linked automatically; the link is saved per repository."
hosting_3 = "Create a {$pr}|The + in the {$PRS} header, or n in that section, opens the form; a branch's menu has \"Start a {$pr} from...\". AI can write the title and description."
hosting_4 = "Issues|The ISSUES section lists them; + or n creates one. A row's menu opens it in your browser or acts on it."
hosting_5 = "References|Issue and {$pr} references (#12, !53, ABC-7) in a {$commit} message or a branch name are recognized. Alt+R in the {$commit} form inserts one."
hosting_6 = "Toolbar chip|At the left of the toolbar, a chip shows the {$pr} of the checked-out branch (GH #12, GL !53) or a dim \"+ {$pr_abbr}\" to start one. Click it."
hosting_7 = "SSH keys|Choose an SSH key per profile (Settings > Profiles) or per repository (tab menu > \"SSH & credentials...\"). Passphrases stay with your system ssh-agent."
setup_1 = "Settings|Ctrl+, or the gear. Tab switches between the page list and the options, j / k move, Enter or Space changes a value, / or Ctrl+F searches every option, Esc closes."
setup_2 = "Themes|Settings > Appearance > Theme: dark, light, follow the terminal, or one of many presets. Ctrl+N then a key also changes theme, language and graph colors without opening Settings."
setup_3 = "Language|Settings > General > Language offers 17 languages. \"Translate git terms\" decides whether git's own words ({$commit}, {$push}...) are translated too."
setup_4 = "Profiles|Settings > Profiles holds {$commit} identities (name, email, SSH key). The toolbar's profile box picks the one this repository uses."
setup_5 = "Open in|The Open in button (Alt+O) opens this tab's folder in a terminal, an editor or the file manager. Settings > Open in edits the list."
setup_6 = "Key bindings|Settings > Keyboard & mouse rebinds any key. The Keys tab of this help shows your own bindings."
tools_1 = "AI (optional)|Off until you set it up in Settings > AI: an OpenAI-compatible service, Anthropic, or a local agent such as claude -p. No account with GitPoulpi is ever needed."
tools_2 = "AI actions|The sparkle button beside the summary or Ctrl+G i writes a {$commit} message; Ctrl+G w explains changes; Ctrl+G C splits your work into several {$commits}; Alt+I suggests a conflict resolution. Nothing is applied before you confirm."
tools_3 = "CLI|gitpoulpi <command> does from a script what the window does, through the same daemon, so changes appear live. --json gives machine output, --help lists the flags."
tools_4 = "MCP|gitpoulpi mcp serve --stdio gives AI agents one tool per CLI command. Settings > Agents & MCP chooses what they may change."
tools_5 = "Shell wrapper|With the gp shell wrapper, \"Quit & cd here\" leaves your shell in the active tab's folder when GitPoulpi quits."

