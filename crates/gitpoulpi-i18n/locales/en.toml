scope_missing = "missing: {list}"
# context: part of the scope line; {list} names the scopes the token has beyond what is needed
scope_excess = "more than needed: {list}"
# context: shown while the page asks the daemon for the current sign-in settings
loading = "Reading the sign-in settings..."
# context: line saying which GitPoulpi account this repository signs in as over HTTPS; {account} is the account id
identity_token = "Signs in as: {account} (token)"
# context: line saying which git user name this repository signs in as over HTTPS
identity_user = "Signs in as: {user}"
# context: line saying HTTPS sign-in uses a credential helper chosen for this repository
identity_helper = "Signs in with this repository's credential helper"
# context: line saying HTTPS sign-in uses a token command chosen for this repository
identity_command = "Signs in with this repository's token command"
# context: line saying the credential helpers the repository sets itself are not used
identity_ignored = "Ignores the credential helpers of this repository"
# context: line saying which key file this repository uses over SSH; {key} is the file name
identity_ssh = "SSH key: {key}"
# context: line saying this repository uses the SSH key of a GitPoulpi account; {account} is the account id
identity_ssh_account = "SSH key of {account}"
# context: joins the HTTPS line and the SSH line of the active sign-in
identity_both = "{https}; {ssh}"
# context: row of the repository tab menu that opens the SSH & credentials page
menu_row = "SSH & credentials..."
# context: label of the row showing the SSH command the repository itself sets
pin_label = "Pinned in git's config"
# context: help under the row that shows an SSH key pinned in the repository's config
pin_help = "This repository sets its own SSH command. GitPoulpi can keep that key in its private store instead of the repository's config."
# context: button that turns the SSH command pinned in the repository's config into a key choice of this page and removes the pin
pin_move = "Move into GitPoulpi"
# context: note shown instead of the move button when the pinned SSH command does more than name one key
pin_other = "This command is not a plain key pin, so GitPoulpi cannot move it. Edit it with git config."
# context: status when the move was asked while the page has unsaved edits
pin_save_first = "Save or revert your edits first."
# context: status when the move was asked but this page already chooses an SSH source
pin_ssh_taken = "SSH already has a source here. Use the defaults first, then move the pin."
# context: status after the move; {key} is the key file path
pin_moved = "Moved: this repository now signs in over SSH with {key}, and its pin is removed."
# context: status when the pin removal failed after the key was saved; {why} is the reason
pin_unset_failed = "The key is saved, but the pin could not be removed: {why}"
# context: warning under the key file row when the file is readable by other accounts
acl_warning = "Other accounts can read this key file. OpenSSH refuses such a key (bad permissions)."
# context: button that makes the key file readable by the current account only
acl_button = "Restrict to my account"
# context: status after the key file was restricted
acl_done = "The key file can now be read by your account only."
# context: status when restricting the key file failed; {why} is the reason
acl_failed = "Could not restrict the key file: {why}"

[dialog_frame]
# context: shown on the border of a dialog in the arrange mode; {done} is the name of the key that leaves it
arrange_hint = "Arrange: arrows move, Shift+arrows resize, 0 resets, {done} leaves"
# context: status line when the arrange mode starts
arranging = "Arranging the dialog: arrows move, Shift+arrows resize, 0 resets, Enter leaves"
# context: status line after the dialog went back to its default place and size
reset_done = "dialog back at its default place and size"
why_no_dialog = "no dialog that can be arranged is open"

[link_confirm]
# context: title of the dialog that asks before a web address from a commit message opens in the browser
title = "Open this link?"
# context: first paragraph of that dialog; the address follows it on the next lines
body = "This address comes from text in a commit message. Check it before you open it in your browser:"
# context: line of that dialog when the message holds several addresses; {n} is the shown one, {total} how many there are
position = "Link {n} of {total}"
# context: button that opens the address in the browser
open = "Open"
# context: button that shows the next address of the message
next = "Next"
# context: key of the Open button, one letter (shown as "Open (O)")
key_open = "o"
# context: key of the Next button, one letter
key_next = "n"
# context: key of the Cancel button of that dialog, one letter
key_cancel = "c"
# context: status line; the message in view holds no web address to open
none = "no link in this message"

[branch_remotes]
# context: title of the dialog that lists every remote a branch pushes to and pulls from; {branch} is the local branch
title = "Remotes of {branch}"
# context: label before the list that picks the upstream (the remote branch the local branch tracks)
upstream_label = "Upstream"
# context: table heading: a configured remote's name
col_remote = "Remote"
# context: table heading: the branch's name on that remote
col_branch = "Branch"
# context: table heading over a checkbox: the branch is also pushed to that remote
col_push = "{$Push}"
# context: table heading over a checkbox: a pull also takes the new commits of that remote
col_pull = "{$Pull} too"
# context: table heading: how the local branch stands against that remote (ahead, behind, in sync)
col_state = "State"
# context: cell in the Pull too column of the upstream's own row: the upstream is always pulled
pull_upstream = "upstream"
# context: state cell: the remote's copy and the local branch are the same commit
state_in_sync = "in sync"
# context: state cell: the remote has no copy of the branch yet
state_new = "new"
# context: state cell: the remote's copy shares no history with the local branch
state_unrelated = "unrelated"
# context: state cell of a remote that is not used by the branch
state_none = "-"
# context: row of a remote the branch still mentions but the repository no longer has
gone = "remote gone"
# context: button on a gone row: forget that remote for this branch
remove_button = "Remove"
# context: warning under the table; {first} and {second} are two remote names with the same address
same_url = "{first} and {second} push to the same URL."
# context: button: changes the branch name used on the selected remote
rename_button = "Rename on remote..."
# context: button: the branch tracks no upstream any more
unset_button = "Unset upstream"
# context: primary button of the dialog
apply_button = "Apply"
# context: shown while the dialog reads the branch's remotes
loading = "Reading the remotes..."
# context: inline error when Apply is pressed while a gone row is left; {remote} is its name
gone_first = "{remote} no longer exists: remove its row first (Del)."
# context: title of the small dialog that asks for the branch's name on one remote; {remote} is the remote
rename_title = "Branch name on {remote}"
# context: placeholder of that dialog's field
rename_placeholder = "Branch name on the remote"
# context: primary button of that dialog
rename_set = "Set"
# context: inline error of that dialog when the field is empty
rename_empty = "Type a branch name."
# context: inline error when Rename is used on the upstream's own row
rename_upstream_row = "The upstream's branch name is chosen in the list above."
# context: inline error when Rename is used with nothing to rename
rename_no_row = "Select a remote's row first."
# context: key hints under the table; keep the key names (Space, p, r, Del, Enter)
keys_hint = "Space Push, p Pull too, r Rename, Del Remove, Enter Apply"
# context: status line while the change is sent; {branch} is the local branch
applying = "setting the remotes of {branch}..."
# context: status line once the daemon applied the change; {branch} is the local branch
remotes_set = "remotes of {branch} updated"
