[help_text]
# context: help line after a key chord; a git commit is amended
git_actions_then_amend = "amend the selected {$commit}: summary, description, author name, email and date in one popup"
# context: help line after a key chord; a git commit is amended
git_actions_then_edit_author = "amend only the selected {$commit}'s author (name, email, date)"
rewrite_1 = "opens the history rewrite workbench: change authors, dates, messages, file contents or paths over all the history or a selection"
rewrite_2 = "previews what the rules would change, then applies it as one step that Undo takes back; Apply stays disabled while the preview is out of date"
rewrite_3 = "cancels the preview that is running (Esc does the same; a second Esc closes the workbench)"
rewrite_4 = "adds a rule, deletes the rule under the cursor, restores the last deleted one, duplicates the rule"
rewrite_5 = "switches the rule on or off, or moves it up or down (rules run from top to bottom)"
rewrite_6 = "moves between the preview tabs"
rewrite_7 = "saves the recipe with the repository or for you only, loads a saved one, renames it; secret values are never saved"
rewrite_8 = "includes or leaves out every protected branch that is already published; checks the external tools again"
file_history_1 = "go to the row's {$commit} in the Log, loading more of the Log when it is not there yet"
file_history_2 = "move the selection; the diff on the right follows at once"
file_history_3 = "extend the selection to a range: the right side then shows the file's diff between the two ends (Shift+click does the same)"
file_history_4 = "give the keyboard to the diff, or back to the list"
file_history_5 = "copy the {$commit} SHA, or its summary"
file_history_6 = "right side: the {$diff}, the file as it was at that {$commit}, or its blame; it follows the selection and keeps its mode"
file_history_7 = "compare the row's version with the working tree (press again to go back)"
file_history_8 = "restore the file to that version in the working tree (asks first; Undo brings the old bytes back)"
file_history_9 = "resize the list (the splitter also drags; the width is remembered)"
file_history_10 = "mouse: click a row, Shift+click for a range, double-click shows it in the Log, right-click opens the menu"
commit_column_1 = "scroll the rows sideways (Shift+wheel or a horizontal wheel does the same); they only scroll when a part was sized wider than the room"
commit_column_2 = "pick a part (lanes, author, date), then widen or narrow it, or put every part back to automatic; the header's boundaries also drag, and the widths are remembered"
commit_column_3 = "mouse: click a row to pick its {$commit}, right-click opens its menu (the menu key does too, after picking a row with Up/Down)"
commit_column_4 = "move the chosen part left or right; dragging its header does the same, and the order is remembered"
log_columns_1 = "pick a Log column (its header cell lights up); then move it left or right (dragging its header does the same), widen or narrow it (dragging its boundary does the same), put its width back to automatic, or fit it to its content (double-clicking its boundary does the same; + fits every column). Tab / Shift+Tab pick another column, Esc leaves; the layout is remembered"
global_1 = "open the command palette - every command in the app, each with its shortcut; type to filter, Up/Down or PageUp/PageDown to move (not j/k: those are typed), Enter to run. Grayed rows say why they can't run right now"
global_2 = "the navigation prefix - see its own section below"
global_3 = "the git-action prefix - see its own section below"
global_4 = "toggle this help overlay - opens on top of whatever else is open (Settings, Repository Management, ...), not just the plain graph"
global_5 = "force a refresh"
global_6 = "fetch, re-check {$prs} and issues, reload"
global_7 = "undo / redo the last operation (commit, amend, checkout, branch create/delete); asks first when it is risky"
global_9 = "quit - from the graph; over a diff or File View it closes that view instead. Every exit is recorded in gitpoulpi-tui-exit.log, beside the config"
global_10 = "open a context menu, wherever one exists below - the keys are interchangeable (the Menu/Apps key rarely reaches this app on Windows, so the F10 chord is the one that reliably does there)"
global_11 = "cycle focus to the next / previous pane"
global_12 = "move the selection (every pane and list)"
global_13 = "vim-style count prefix on j/k/Up/Down (and PageUp/PageDown, as a count of screens) - typed digits show as \"4...\" in the status line until the motion lands; Esc or any other key clears it, and a leading 0 never starts one (so digits still type normally in the composer, the Refs filter and every other text field)"
global_14 = "Refs: switch LOCAL/REMOTE/TAGS section"
global_15 = "Log: h = back out of / l = into a commit's file list"
global_16 = "Status: jump to Unstaged / Staged"
mouse_basics_1 = "select and focus a row (in every pane, list, menu and dialog); the wheel scrolls whatever the pointer is over"
mouse_basics_2 = "open/activate: a LOCAL/TAGS ref or a Log-row ref pill checks it out, a changed file opens its diff, a repository row opens that repository"
mouse_basics_3 = "the only \"this is clickable\" signal most terminals give (see \"Hover & tooltips\" below) - also full tooltips over Log cells and truncated ref badges"
mouse_basics_4 = "a pane divider, a Log column boundary, a Refs section's bottom border or the commit message block's bottom border resizes it (past the minimum it collapses instead); a Log column header past a neighbor reorders it"
mouse_basics_5 = "(top-right corner) quit, same as q - shown only when the window is wide enough not to overlap the title text"
navigation_prefix_then_1 = "collapse/restore the Refs pane (left)"
navigation_prefix_then_2 = "collapse/restore the Status pane (right) - click the chevron on a pane's border, or the thin strip left behind once collapsed, for the mouse equivalent"
navigation_prefix_then_3 = "grow the active Refs section by a row ({{nav_prefix.shrink_section}} shrinks it); dragging a section's bottom border does the same, and the size is remembered"
navigation_prefix_then_4 = "grow the commit message block of the right panel by a row ({{nav_prefix.shrink_message}} shrinks it); drag the border under it for the mouse equivalent"
navigation_prefix_then_5 = "focus that sub-pane - every Refs section, the filter field, the Log (or the Diff view when it's open there), the File History list, each half of the third pane, and the composer's Summary field when there's room all get their own badge: 1-9 first, then a/b/c... if there are more than nine in this frame - badges are handed out fresh every time the prefix opens, so read the glyph, don't memorize a digit"
navigation_prefix_then_6 = "open settings (same as the title bar gear)"
navigation_prefix_then_16 = "open the About window (same as the octopus in the title bar)"
navigation_prefix_then_17 = "move the divider between the Refs pane and the Log a notch left ({{nav_prefix.refs_narrower}}) or right ({{nav_prefix.refs_wider}}); a collapsed Refs pane comes back first, and the width is remembered"
navigation_prefix_then_18 = "move the divider between the Log and the right pane a notch left ({{nav_prefix.status_wider}}) or right ({{nav_prefix.status_narrower}}); a collapsed pane comes back first, and the width is remembered"
navigation_prefix_then_7 = "toggle this help (same as bare ?)"
navigation_prefix_then_8 = "pick a repository tab to switch to - type to filter, Up/Down or PageUp/PageDown to move, Enter switches, click a row, Esc closes"
workspace_search = "search every repository of the workspace for branches, {$tags}, worktrees, {$stashes}, {$commits}, {$prs} and issues - Enter goes there, Alt+1-8 toggle kinds, b: t: c: s: w: r: pr: i: # narrow, Esc closes"
navigation_prefix_then_9 = "show the view an AI agent offered (the status line chip `Show ...?`), the twin of clicking it"
navigation_prefix_then_10 = "dismiss that chip, else go back to the view before the agent's last change (also `Agent: Back` in the palette)"
navigation_prefix_then_11 = "cancel, back to normal mode"
navigation_prefix_then_12 = "pick a theme from the list - type to filter, the highlight previews it live, Enter applies and saves it, Esc restores the previous one (also `App: Change Theme...` in the palette)"
navigation_prefix_then_13 = "pick a language from the list - type to filter, Enter applies it and saves it, Esc cancels (also `App: Change Language...` in the palette)"
navigation_prefix_then_14 = "`App: Change Graph Color Theme...`"
navigation_prefix_then_15 = "`App: Toggle Graph Row Tints`"
navigation_prefix_then_19 = "arrange the open dialog from the keyboard: the arrows move it, Shift+arrows resize it, 0 puts it back, Enter leaves (the twin of dragging its title bar and borders; also `Dialog: Move or Resize` in the palette)"
git_actions_then_1 = "stage the selected unstaged file (Status pane)"
git_actions_then_2 = "unstage the selected staged file (Status pane)"
git_actions_then_3 = "stage all changes"
git_actions_then_4 = "discard all changes, untracked files included (asks first and says so)"
