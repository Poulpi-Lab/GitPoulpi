# context: palette and status line: why Open Security Notice does nothing
why_no_notice = "ningún aviso de seguridad con enlace menciona esta versión"
# context: footer hint of the update panel when a security notice is listed; the letters are the keys of the buttons
panel_hint = "u actualizar  c copiar  t terminal  v volver  n notas  a aviso  s omitir  r comprobar  Esc cerrar"

[ai_privacy]
# context: title of the dialog shown before an AI request is sent; {via} is the name of the AI profile
title = "Revisa lo que se envía a {via}"
# context: first line of that dialog
intro = "Esta es la solicitud después de reemplazar los secretos y dejar fuera los archivos sensibles. No sale nada hasta que elijas Enviar."
# context: heading of the list of secrets replaced in the request
redactions_heading = { one = "{n} secreto reemplazado", other = "{n} secretos reemplazados" }
# context: heading of the list of sensitive files left out of the request
excluded_heading = { one = "{n} archivo sensible excluido", other = "{n} archivos sensibles excluidos" }
# context: line of the dialog when nothing was replaced and nothing was left out
nothing_removed = "No se encontró ningún secreto y ningún archivo sensible forma parte de esta solicitud."
# context: one row of the list of replaced secrets; {rule} is the kind of secret (github-token), {preview} a masked sample that never shows the whole value
redaction_row = "{rule}: {preview}"
# context: checkbox of the dialog; {action} is the name of the AI action (Commit message, Explain changes...)
dont_show = "No mostrar más para {action}"
# context: button that sends the AI request
send = "Enviar"
# context: button that cancels the AI request
cancel = "Cancelar"
# context: key hint at the bottom of the dialog
hint = "Tab: siguiente control, Espacio: alternar, Enter: pulsar, Esc: cancelar"
# context: Settings > AI, heading of the privacy rows
settings_heading = "Privacidad"
# context: Settings > AI, label of a switch
redact_label = "Ocultar secretos antes de enviar"
# context: help under that switch
redact_help = "Reemplaza los tokens, claves privadas y contraseñas que se encuentren en una solicitud por una marca [REDACTED] antes de que la solicitud salga de este equipo."
# context: red warning shown while that switch is off
redact_warning = "Desactivado: los secretos de tus cambios se envían tal cual al servicio de IA."
# context: Settings > AI, label of a switch
exclude_label = "Dejar fuera archivos sensibles"
# context: help under that switch; privacy.sensitive_patterns is a config key and stays as written
exclude_help = "Nunca incluye los cambios de archivos como .env, claves privadas y certificados (mira privacy.sensitive_patterns en config.toml)."
# context: red warning shown while that switch is off
exclude_warning = "Desactivado: los cambios de archivos sensibles se envían al servicio de IA cuando forman parte de una solicitud."
# context: Settings > AI, heading above one switch per AI action
sent_heading = "Mostrar lo que se envía antes de..."
# context: help under the first of those switches
sent_help = "Cada interruptor muestra la solicitud para revisarla antes de enviarla. La casilla «No mostrar más» del diálogo desactiva uno; este botón los activa todos."
# context: Settings > AI, button that turns every "show what is sent" switch back on
show_all_again = "Mostrar todo otra vez"
# context: status line after that button was pressed
shown_all = "Se mostrará cada solicitud antes de enviarla"

[stage_guard]
# context: title of the dialog that lists files the staging guard flagged
title = "Archivos sensibles"
# context: question of that dialog
question = { git = "Estos archivos parecen sensibles. ¿Hacer stage de todos modos?", local = "Estos archivos parecen sensibles. ¿Prepararlos de todos modos?" }
# context: one reason in the list; {pattern} is a path pattern such as .env.*
reason_pattern = "coincide con {pattern}"
# context: one reason in the list; {rule} is the kind of secret found (github-token), {preview} a masked sample that never shows the whole value
reason_secret = "contiene {rule} ({preview})"
# context: first numbered answer of the dialog
answer_stage = { git = "Hacer stage de todos modos", local = "Preparar de todos modos" }
# context: second numbered answer of the dialog
answer_cancel = { git = "Cancelar, no hacer stage de nada", local = "Cancelar, no preparar nada" }
# context: key hint at the bottom of the dialog
hint = "Arriba/Abajo: elegir, Enter o 1/2: responder, Esc: cancelar"
# context: the error line when a stage was refused for sensitive files; {files} is a list of paths. In English it is word for word the text the CLI prints
sensitive_stage = { git = "no se hizo stage de archivos sensibles: {files}; pregunta al usuario y vuelve a hacer stage permitiendo archivos sensibles", local = "no se prepararon archivos sensibles: {files}; pregunta al usuario y vuelve a preparar permitiendo archivos sensibles" }

[ai_limits]
# context: Settings > AI, heading of the rows that limit how much input an AI request carries
settings_heading = "Límites"
# context: Settings > AI, label of a number: the most bytes one merge conflict may add up to when the AI is asked to resolve it
conflict_label = "Tamaño máximo de un conflicto a enviar (bytes)"
# context: help under that number
conflict_help = "Por encima de este tamaño, «Sugerir una resolución» no falla: avisa, y puedes enviarlo igualmente una vez, abrir este ajuste o cancelar. El límite es una protección propia de GitPoulpi, no del modelo: súbelo si tu modelo tiene margen. 40000 por defecto."
# context: red warning under that number while it is very large
conflict_warning = "Un límite muy grande puede enviar más de lo que el modelo acepta: la petición fallará entonces en el proveedor."
# context: title of the dialog shown when a conflict is over the limit
too_large_title = "Conflicto demasiado grande para enviarlo"
# context: body of that dialog; {path} is the file, {size} the conflict's size (for example "48.1 KB (49206 bytes)"), {limit} the limit in the same form, {key} the name of the setting
too_large_body = "El conflicto de {path} ocupa {size} y el límite es {limit} (ajuste {key}). El límite es una protección propia de GitPoulpi, no del modelo. Si lo envías igualmente, los secretos se siguen reemplazando y los archivos sensibles se siguen omitiendo."
# context: button that sends the oversized conflict this one time
send_anyway = "Enviar igualmente"
# context: button that opens Settings on the limit
open_setting = "Abrir ajuste"
# context: key of the Send anyway button, one letter (shown as "Send anyway (S)")
key_send = "e"
# context: key of the Open setting button, one letter
key_open = "a"
# context: key of the Cancel button of that dialog, one letter
key_cancel = "c"
# context: Settings > AI, label of a number: the most bytes of the {$diff} an AI request for a message, an explanation, a stash name, a request description, a commit plan or a split may carry; also the whole {$diff} of a code review
diff_label = "Tamaño máximo de {$diff} a enviar (bytes)"
# context: help under that number
diff_help = { git = "Por encima de este tamaño, nada se recorta en silencio: se te pregunta si enviar todo el {$diff}, enviarlo recortado, abrir este ajuste o cancelar. Se aplica a un mensaje de {$commit}, una explicación, un nombre para un {$stash}, una descripción de una solicitud, un plan de {$commits} y una división, y a todo el {$diff} de una revisión de código. 60000 por defecto.", local = "Por encima de este tamaño, nada se recorta en silencio: se te pregunta si enviar todas las {$diff}, enviarlas recortadas, abrir este ajuste o cancelar. Se aplica a un mensaje de {$commit}, una explicación, un nombre para un {$stash}, una descripción de una solicitud, un plan de {$commits} y una división, y a todas las {$diff} de una revisión de código. 60000 por defecto." }
# context: Settings > AI, label of a number: the most bytes of one file's {$diff} in a code review
review_file_label = "Tamaño máximo de {$diff} por archivo en una revisión (bytes)"
# context: help under that number
review_file_help = { git = "Por encima de este tamaño, el {$diff} de un archivo en una revisión de código se recorta, tras preguntarte: enviarlo entero, enviarlo recortado, abrir este ajuste o cancelar. 12000 por defecto.", local = "Por encima de este tamaño, las {$diff} de un archivo en una revisión de código se recortan, tras preguntarte: enviarlas enteras, enviarlas recortadas, abrir este ajuste o cancelar. 12000 por defecto." }
# context: Settings > AI, label of a number: the most bytes of the description of the reviewed request
review_text_label = "Tamaño máximo de la descripción de la revisión (bytes)"
# context: help under that number
review_text_help = "Por encima de este tamaño, la descripción de la solicitud revisada se recorta, tras preguntarte: enviarla entera, enviarla recortada, abrir este ajuste o cancelar. 4000 por defecto."
# context: Settings > AI, label of a number: the most bytes of the comments that already exist on the reviewed request
review_threads_label = "Tamaño máximo de la lista de comentarios existentes en una revisión (bytes)"
# context: help under that number
review_threads_help = "Los comentarios que ya existen se incluyen para que el modelo no los repita. Por encima de este tamaño, la lista se recorta, tras preguntarte: enviarla entera, enviarla recortada, abrir este ajuste o cancelar. 6000 por defecto."
# context: Settings > AI, label of a number: the most bytes of one project context file (CLAUDE.md, AGENTS.md, the extra file) given to a code review
review_context_file_label = "Tamaño máximo de un archivo de contexto en una revisión (bytes)"
# context: help under that number
review_context_file_help = "Por encima de este tamaño, un archivo de contexto (CLAUDE.md, AGENTS.md o el archivo extra) se recorta, tras preguntarte: enviarlo entero, enviarlo recortado, abrir este ajuste o cancelar. 8192 por defecto."
# context: Settings > AI, label of a number: the most bytes of all the project context files together
review_context_label = "Tamaño máximo del contexto de una revisión, todos los archivos (bytes)"
# context: help under that number
review_context_help = "Por encima de este tamaño, los archivos de contexto en conjunto se recortan (el último se acorta u omite), tras preguntarte: enviarlos todos, enviarlos recortados, abrir este ajuste o cancelar. 16384 por defecto."
# context: title of the dialog shown when what would be sent to the AI is over a limit and would be cut
truncate_title = "Por encima del límite de la IA"
# context: first paragraph of that dialog, before the list of what is over its limit
truncate_intro = "Parte de lo que se enviaría a la IA supera un límite que fija GitPoulpi (los límites son una protección propia de GitPoulpi, no del modelo):"
# context: last paragraph of that dialog, explaining the buttons
truncate_outro = "«Enviar todo» envía todo esta vez. «Enviar recortado» recorta lo que supera su límite, como se describe arriba. En ambos casos, los secretos se siguen reemplazando y los archivos sensibles se siguen omitiendo."
# context: list line of that dialog; {size} is the {$diff}'s size (for example "91.2 KB (91234 bytes)"), {limit} the limit in the same form, {key} the name of the setting
part_diff = { git = "El {$diff} ocupa {size}, límite {limit} (ajuste {key}). Recortado, se omite su final.", local = "Las {$diff} ocupan {size}, límite {limit} (ajuste {key}). Recortadas, se omite su final." }
# context: list line of that dialog, for the {$commit} being split; sizes like the line above
part_hunks = { git = "Los cambios del {$commit} ocupan {size}, límite {limit} (ajuste {key}). Recortado, los últimos pierden su {$diff}.", local = "Los cambios de la {$commit} ocupan {size}, límite {limit} (ajuste {key}). Recortado, los últimos pierden sus {$diff}." }
# context: list line of that dialog, for a code review; {name} is the list of files that do not fit
part_review_diff = "Archivos que no caben en la revisión: {name}. La revisión ocupa {size}, límite {limit} (ajuste {key}). Recortada, se omiten."
# context: list line of that dialog, for one file of a code review; {name} is its path
part_review_file = { git = "El {$diff} de {name} ocupa {size}, límite {limit} (ajuste {key}). Recortado, se omite su final.", local = "Las {$diff} de {name} ocupan {size}, límite {limit} (ajuste {key}). Recortadas, se omite su final." }
# context: list line of that dialog, for the description of the reviewed request
part_review_text = "La descripción ocupa {size}, límite {limit} (ajuste {key}). Recortada, se omite su final."
# context: list line of that dialog, for the comments that already exist on the reviewed request
part_review_threads = "Los comentarios existentes ocupan {size}, límite {limit} (ajuste {key}). Recortados, se omiten los últimos."
# context: list line of that dialog, for one project context file of a code review; {name} is the file
part_context_file = "El archivo de contexto {name} ocupa {size}, límite {limit} (ajuste {key}). Recortado, se omite su final."
# context: list line of that dialog, for the project context files together; {name} is the file that crossed the limit
part_context_total = "Los archivos de contexto juntos llegan a {size} en {name}, límite {limit} (ajuste {key}). Recortado, se omite el resto."
# context: button that sends everything of the oversized request this one time, nothing cut
send_all = "Enviar todo"
# context: button that sends the request with what is over its limit cut
send_truncated = "Enviar recortado"
# context: key of the Send all button, one letter (shown as "Send all (A)")
key_send_all = "t"
# context: key of the Send truncated button, one letter (shown as "Send truncated (T)")
key_send_truncated = "r"

[conflict_guard]
# context: title of the dialog that says conflicts must be resolved before an action
title = "Resuelve primero los conflictos"
# context: first line of that dialog; {n} files have unresolved conflicts
count = { one = "{n} archivo aún tiene conflictos", other = "{n} archivos aún tienen conflictos" }
