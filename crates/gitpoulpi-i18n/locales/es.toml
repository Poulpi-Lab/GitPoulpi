private_key_path = "Ruta de la clave privada"
private_key_path_help = { git = "Archivo de clave que {$fetch}, {$pull}, {$push} y clone ofrecen a ssh (ssh -i <clave> -o IdentitiesOnly=yes). Vacío: ssh-agent y tu configuración ssh como siempre. Se ignora si GIT_SSH_COMMAND o core.sshCommand (p. ej. Clave SSH de este repositorio) está definido. Se aplica a la siguiente transferencia.", local = "Archivo de clave que se ofrece a ssh en las obtenciones, traídas, envíos y clonados (ssh -i <clave> -o IdentitiesOnly=yes). Vacío: ssh-agent y tu configuración ssh como siempre. Se ignora si GIT_SSH_COMMAND o core.sshCommand (p. ej. Clave SSH de este repositorio) está definido. Se aplica a la siguiente transferencia." }
public_key_path = "Ruta de la clave pública"
public_key_path_help = "Solo se usa si la ruta de la clave privada está vacía: ssh elige entonces la clave correspondiente que tenga ssh-agent (o una clave de hardware) en vez de ofrecer todas las del agente. Generar par de claves rellena ambas. Misma prioridad que la ruta de la clave privada."
key_type = "Tipo de clave"
heading_https_credentials = "Credenciales HTTPS"
https_mode = "Credenciales HTTPS"
https_mode_help = { git = "Cómo se autentican fetch, pull, push y clone por HTTPS. credential_helper: el helper propio de git (Git Credential Manager, libsecret, Keychain). prompt: ignora cualquier helper y deja que git pregunte en un terminal. none: sin credenciales, solo remotos públicos. Se aplica a la siguiente transferencia.", local = "Cómo se autentican la obtención, la traída, el envío y el clonado por HTTPS. credential_helper: el helper propio de git (Git Credential Manager, libsecret, Keychain). prompt: ignora cualquier helper y deja que git pregunte en un terminal. none: sin credenciales, solo remotos públicos. Se aplica a la siguiente transferencia." }
heading_keys = "Claves"
generate_key_pair = "Generar par de claves"
generate_key_pair_help = "Genera un par de claves ed25519 internamente (sin ssh-keygen ni frase de contraseña) en ~/.ssh/gitpoulpi_ed25519, sin sobrescribir nunca un archivo, y registra las dos rutas de arriba. Añade la clave pública a un host desde Integraciones."

[settings_editor]
tab_size = "Tamaño de tabulación"
tab_size_help = { git = "Columnas entre tabuladores, en el editor integrado (dibujo, Shift+Tab) y en las vistas de diff. La vista de blame dibuja un tabulador como un espacio y lo ignora.", local = "Columnas entre tabuladores, en el editor integrado (dibujo, Shift+Tab) y en las vistas de diferencias. La vista de blame dibuja un tabulador como un espacio y lo ignora." }
eol = "Fin de línea"
eol_help = "Lo que escribe el editor integrado al guardar. Auto conserva el fin de línea del propio archivo (LF para un archivo nuevo); LF o CRLF convierte el archivo al guardar. La barra de estado del editor muestra lo que escribirá el siguiente guardado."
syntax_highlighting = "Resaltado de sintaxis"
syntax_highlighting_help = { git = "Colorea el editor integrado según el lenguaje. Las vistas de diff y de blame no llevan color de sintaxis.", local = "Colorea el editor integrado según el lenguaje. Las vistas de diferencias y de blame no llevan color de sintaxis." }
line_numbers = "Números de línea"
line_numbers_help = { git = "La columna de números del editor integrado y de las vistas de diff (ahí queda en blanco, las columnas conservan su sitio). La vista de blame no tiene.", local = "La columna de números del editor integrado y de las vistas de diferencias (ahí queda en blanco, las columnas conservan su sitio). La vista de blame no tiene." }
follow_selection = "Seguir la selección en el editor"
follow_selection_help = "Mientras el editor está abierto, seleccionar otro archivo en el panel derecho lo abre también en el editor, tras preguntar si se guardan los cambios pendientes. Un archivo que no se puede editar se abre en su vista habitual."
merge_side_by_side_min_width = { git = "Editor de merge: lado a lado desde (columnas)", local = "Editor de fusión: lado a lado desde (columnas)" }
merge_side_by_side_min_width_help = { git = "El editor de conflictos de merge muestra A y B lado a lado cuando su área tiene al menos este número de columnas (las líneas largas se desplazan en horizontal con Shift+rueda o Shift+flechas); más estrecho, muestra un lado a la vez en pestañas. 100 por defecto; 40 es el valor mínimo, 0 significa siempre lado a lado. El editor oculta los paneles Refs y Estado mientras está abierto, así que suele tener toda la ventana.", local = "El editor de conflictos de fusión muestra A y B lado a lado cuando su área tiene al menos este número de columnas (las líneas largas se desplazan en horizontal con Shift+rueda o Shift+flechas); más estrecho, muestra un lado a la vez en pestañas. 100 por defecto; 40 es el valor mínimo, 0 significa siempre lado a lado. El editor oculta los paneles Refs y Estado mientras está abierto, así que suele tener toda la ventana." }
diff_word_wrap = "Ajuste de línea"
diff_word_wrap_help = { git = "Ajusta las líneas largas en las vistas de diff en vez de cortarlas con puntos suspensivos. El editor integrado y la vista de blame se desplazan en horizontal y no ajustan. Es también el interruptor de ajuste de la propia vista de diff.", local = "Ajusta las líneas largas en las vistas de diferencias en vez de cortarlas con puntos suspensivos. El editor integrado y la vista de blame se desplazan en horizontal y no ajustan. Es también el interruptor de ajuste de la propia vista de diferencias." }

[settings_ui]
theme = "Tema"
theme_help = "Colores de toda la interfaz. Al recorrer la lista se previsualiza cada tema; Enter lo conserva, Esc vuelve atrás. Sistema sigue el terminal (su fondo claro u oscuro, detectado una vez al iniciar; Oscuro si no se puede saber). Tus propios archivos de tema en la carpeta themes/ de la configuración aparecen al final."
theme_system = "Sistema (sigue el terminal)"
follow_theme = "Seguir el tema"
theme_swatches = "Colores"
graph_lane_background = "Fondo de los carriles del grafo"
graph_lane_background_help = { git = "Desactivado: transparente, nada detrás de los carriles (por defecto). Tinte de fila: una banda tenue del color del carril del commit dentro de la columna Grafo, más una barra fina de ese color en el borde derecho de la columna. Un carril guardado se lee como Tinte de fila. Se aplica al cerrar Ajustes.", local = "Desactivado: transparente, nada detrás de los carriles (por defecto). Tinte de fila: una banda tenue del color del carril de la confirmación dentro de la columna Grafo, más una barra fina de ese color en el borde derecho de la columna. Un carril guardado se lee como Tinte de fila. Se aplica al cerrar Ajustes." }
graph_row_tint_strength = "Intensidad del tinte de fila"
graph_row_tint_strength_help = "Cuán atenuada es la banda Tinte de fila: Fuerte (la original), Media (por defecto) o Sutil. Solo se atenúa la banda; la barra del borde derecho de la columna conserva todo su color. Se aplica al cerrar Ajustes."
graph_row_tint_strength_coming = "primero pon Fondo de los carriles del grafo en Tinte de fila"
toolbar_position = "Posición de la barra de herramientas"
toolbar_position_help = "Dónde va la barra de herramientas: Arriba, Abajo (por defecto), Izquierda o Derecha. Izquierda y Derecha forman una columna junto a los paneles; una ventana de menos de 80 columnas la dibuja abajo. Se aplica al instante."
toolbar_align = "Alineación de los botones de la barra de herramientas"
toolbar_align_help = "Dónde van los botones a lo largo de la barra: Inicio (por defecto), Centro o Final. El inicio es la izquierda de una fila y la parte superior de una columna; el final es la derecha y la parte inferior. Se aplica al instante."
toolbar_pr_pinned = "Fijar el botón de {$pr} al final"
toolbar_pr_pinned_help = "Activado (por defecto), el botón de {$pr} queda en el extremo de la barra de herramientas (a la derecha, o abajo en una columna), sea cual sea la alineación. Desactivado, fluye con los demás botones y se alinea con ellos. Se aplica al instante."
statusbar_position = "Posición de la barra de estado"
statusbar_position_help = "Dónde va la barra de estado (rama, contadores, mensajes, atajos): Arriba, sobre las pestañas de repositorio, o Abajo (por defecto). La pestaña Inicio conserva su propia barra de estado abajo. Se aplica al instante."
tabs_position = "Posición de la barra de pestañas"
tabs_position_help = "Dónde van las pestañas de repositorio: Arriba (por defecto), Abajo o Izquierda, una lista con una pestaña por fila en el borde izquierdo de la ventana. Una ventana de menos de 80 columnas las dibuja arriba. Junto a una barra de herramientas en columna, las pestañas quedan en el exterior. Se aplica al instante."
graph_color_theme = "Tema de color del grafo"
graph_color_theme_help = "La paleta de colores de carriles del grafo del Log. Seguir el tema usa la paleta del tema elegido; cualquier otra entrada la reemplaza, así que se puede combinar cualquier tema con cualquier paleta. Se aplica al cerrar Ajustes."
graph_renderer = "Renderizador del grafo"
graph_renderer_help = "auto dibuja el grafo como una imagen real en un terminal que lo admita, y como caracteres en todos los demás - incluso dentro de tmux o zellij, que heredan el entorno del terminal pero no dejan pasar la imagen, y dentro de herdr salvo que su ajuste kitty_graphics esté activado. image fuerza la imagen, text la desactiva. Requiere reiniciar."
image_protocol = "Protocolo de imagen"
image_protocol_help = "Cómo llegan las imágenes (la imagen del grafo, los avatares de autor) al terminal. auto: el protocolo gráfico de Kitty en kitty, Ghostty y un herdr cuya configuración tenga kitty_graphics = true; imágenes en línea de iTerm2 en WezTerm, iTerm2 y mintty; sixel (solo los avatares) en Windows Terminal, foot, Konsole y mlterm; caracteres en el resto. kitty, iterm2 o sixel fuerza ese protocolo (kitty para un herdr cuya configuración esté en otro sitio); none desactiva las imágenes. Requiere reiniciar."
kitty_keyboard = "Protocolo de teclado de Kitty"
kitty_keyboard_help = "auto pregunta al terminal, al iniciar y en unos 100 ms, si habla el protocolo de teclado de kitty, y lo usa si es así: los acordes que los terminales antiguos no distinguen (Control con puntuación, dígitos, Shift o Enter) llegan entonces tal cual en vez de chocar con códigos de control. Un terminal que no responde conserva las teclas clásicas. off nunca toca el modo de teclado del terminal. Requiere reiniciar."
color_depth = "Profundidad de color"
color_depth_help = "auto usa color de 24 bits, salvo en terminales que no lo muestran (Terminal de Apple, consola de Linux o un terminal de 256 colores sin COLORTERM), donde los colores se ajustan a las 256 o 16 entradas más cercanas. truecolor, 256 y 16 fuerzan una profundidad. Se aplica al instante."
graph_show_stashes = { git = "Mostrar stashes en el grafo", local = "Mostrar guardados rápidos en el grafo" }
graph_show_stashes_help = { git = "Cada stash tiene su propia fila en el Log, en su fecha: una cajita en un carril junto al commit sobre el que se hizo, unida a él por una línea discontinua. Al seleccionarla muestra lo que cambió; clic derecho (o .) ofrece Pop, Apply y Drop. Off deja los stashes solo en la sección STASHES. No se dibuja en modo solo.", local = "Cada guardado rápido tiene su propia fila en el Log, en su fecha: una cajita en un carril junto a la confirmación en la que se hizo, unida a ella por una línea discontinua. Al seleccionarla muestra lo que cambió; clic derecho (o .) ofrece Pop, Apply y Drop. Off deja los guardados rápidos solo en la sección GUARDADOS RÁPIDOS. No se dibuja en modo solo." }
ref_connector = { git = "Conector ref-commit", local = "Conector ref-confirmación" }
ref_connector_help = { git = "Una línea fina de cada chip de ref de la columna Ref al círculo de su commit en el grafo. Solo rellena espacio en blanco: los carriles que cruza quedan encima y nada se mueve. Solo se dibuja mientras la columna Ref está justo a la izquierda de la columna Grafo.", local = "Una línea fina de cada chip de ref de la columna Ref al círculo de su confirmación en el grafo. Solo rellena espacio en blanco: los carriles que cruza quedan encima y nada se mueve. Solo se dibuja mientras la columna Ref está justo a la izquierda de la columna Grafo." }
log_wip_counts_in_message = "Mostrar los recuentos de cambios WIP en el mensaje cuando la columna Cambios está oculta"
log_wip_counts_in_message_help = { git = "La fila WIP muestra cuántos archivos están modificados, añadidos y eliminados. Con la columna Cambios visible (clic derecho en la cabecera del Log para mostrarla) los recuentos van siempre en esa columna, como los de cada commit. Con ella oculta, van en el mensaje WIP mientras esto esté activado; desactivado no muestra recuentos.", local = "La fila WIP muestra cuántos archivos están modificados, añadidos y eliminados. Con la columna Cambios visible (clic derecho en la cabecera del Log para mostrarla) los recuentos van siempre en esa columna, como los de cada confirmación. Con ella oculta, van en el mensaje WIP mientras esto esté activado; desactivado no muestra recuentos." }
avatars = "Avatares de autor"
avatars_help = { git = "Imágenes de autor. graph dibuja el autor de cada commit dentro de su círculo en el grafo (solo con el grafo de imagen; con el grafo de texto va una inicial coloreada en la columna Autor). author pone una imagen redonda al principio de la columna Autor. Ambos la muestran también en el panel de detalle del commit. Desactivado por defecto: activarlo envía un hash SHA-256 del correo de cada autor a gravatar.com por HTTPS - el hash de una dirección conocida o adivinable no es anónimo - y, en un repositorio con un remoto de github.com, pregunta una vez por autor a la API de GitHub qué cuenta hizo uno de sus commits (con el token de tu integración de GitHub si hay). Hasta que llega una imagen, y cuando no existe, se muestran las iniciales o el círculo liso. off no envía nada por la red.", local = "Imágenes de autor. graph dibuja el autor de cada confirmación dentro de su círculo en el grafo (solo con el grafo de imagen; con el grafo de texto va una inicial coloreada en la columna Autor). author pone una imagen redonda al principio de la columna Autor. Ambos la muestran también en el panel de detalle de la confirmación. Desactivado por defecto: activarlo envía un hash SHA-256 del correo de cada autor a gravatar.com por HTTPS - el hash de una dirección conocida o adivinable no es anónimo - y, en un repositorio con un remoto de github.com, pregunta una vez por autor a la API de GitHub qué cuenta hizo una de sus confirmaciones (con el token de tu integración de GitHub si hay). Hasta que llega una imagen, y cuando no existe, se muestran las iniciales o el círculo liso. off no envía nada por la red." }
avatar_sources = "Fuentes de avatares"
avatar_sources_help = { git = "Dónde se busca la imagen de un autor, por orden (una dirección noreply de GitHub siempre nombra primero su cuenta). hosting_gravatar: la integración de GitHub, GitLab o Bitbucket conectada cuyo host coincide con el remoto del repositorio (autor de commit o búsqueda de usuario en GitHub, avatar por correo o API de usuarios en GitLab), luego Gravatar; sin integración coincidente conectada, Gravatar va primero y un remoto de github.com se consulta aún al final, sin autenticar. gravatar_hosting: al revés. gravatar o hosting: solo esa. Cuando ninguna tiene imagen, se dibuja el avatar de reserva de abajo. Se aplica a los autores aún no consultados.", local = "Dónde se busca la imagen de un autor, por orden (una dirección noreply de GitHub siempre nombra primero su cuenta). hosting_gravatar: la integración de GitHub, GitLab o Bitbucket conectada cuyo host coincide con el remoto del repositorio (autor de confirmación o búsqueda de usuario en GitHub, avatar por correo o API de usuarios en GitLab), luego Gravatar; sin integración coincidente conectada, Gravatar va primero y un remoto de github.com se consulta aún al final, sin autenticar. gravatar_hosting: al revés. gravatar o hosting: solo esa. Cuando ninguna tiene imagen, se dibuja el avatar de reserva de abajo. Se aplica a los autores aún no consultados." }
avatar_fallback = "Avatar de reserva"
avatar_fallback_help = "Lo que recibe un autor sin imagen. identicon: un patrón simétrico 5x5 al estilo GitHub en un color derivado de su correo, generado en local (sin red), como imagen en un terminal con imágenes y como caracteres de bloque en los demás. initials: una insignia coloreada con sus iniciales."
composer_files = "Propuestas del compositor"
composer_files_help = { git = "Cómo se abre la revisión del compositor de commits de IA. expanded: cada commit propuesto lista sus archivos. collapsed: solo las filas de commit; Derecha/Izquierda (o clic en la flecha) abre uno.", local = "Cómo se abre la revisión del compositor de confirmaciones de IA. expanded: cada confirmación propuesta lista sus archivos. collapsed: solo las filas de confirmación; Derecha/Izquierda (o clic en la flecha) abre uno." }
blame_side = "Anotaciones del blame"
blame_side_help = "Lado de la vista Blame donde va la columna de anotaciones (avatar, autor, antigüedad, resumen). right: a la derecha del código. left: a la izquierda del código."
column_resize = "Redimensionado de columnas"
column_resize_help = "Cómo se agarra el límite de una columna en el Log, el Radar y la columna lateral de las vistas de archivo. line: una línea fina en toda la altura de la tabla mientras el puntero está sobre el límite, con una pequeña marca en la cabecera. header: sin hueco ni marca, solo se redimensiona desde la cabecera, donde se ilumina el primer carácter de la celda siguiente."
blame_width = "Ancho de las anotaciones del blame"
blame_width_help = "Ancho de la columna de anotaciones en celdas (24 a 90). Arrastra su borde en la vista Blame o usa las teclas de ensanchar / estrechar; el nuevo ancho se guarda aquí."
ref_tree = "Árbol de carpetas de ramas"
ref_tree_help = "La barra lateral Refs agrupa los nombres de rama por `/` en carpetas plegables, con cada remoto como nodo de primer nivel. Off da una fila plana por rama. `y` en el panel Refs lo alterna al instante y guarda la elección aquí."
reveal_on_ref_click = "Clic en una ref para mostrarla en el grafo"
reveal_on_ref_click_help = "Un solo clic en una ref del panel Refs desplaza el Log hasta donde apunta y hace parpadear la fila. La selección del Log y el panel derecho no cambian. Desactivado, un clic solo selecciona la fila de la barra lateral. «Mostrar en el grafo» del menú de la ref, su tecla en el panel Refs y el comando de la paleta funcionan en ambos casos."
graph_ghost_ref = { git = "Mostrar una rama fantasma en el {$commit} bajo el puntero", local = "Mostrar una rama fantasma en la {$commit} bajo el puntero" }
graph_ghost_ref_help = { git = "En la columna Ref del Log, el {$commit} bajo el puntero que no tiene ref propia muestra una píldora atenuada con el nombre de la rama a la que pertenece (si no, su rama remota), deducida del historial. Al pasar el puntero por la píldora se ve su tipo. Hacer clic no hace nada especial; el comando de crear rama crea una rama. Solo se dibuja donde la columna Ref tiene sitio. Desactivado la oculta.", local = "En la columna Ref del Log, la {$commit} bajo el puntero que no tiene ref propia muestra una píldora atenuada con el nombre de la rama a la que pertenece (si no, su rama remota), deducida del historial. Al pasar el puntero por la píldora se ve su tipo. Hacer clic no hace nada especial; el comando de crear rama crea una rama. Solo se dibuja donde la columna Ref tiene sitio. Desactivado la oculta." }
mouse_enabled = "Ratón activado"
mouse_enabled_help = "Desactivado deja la selección con clic y arrastre a tu terminal. Requiere reiniciar."
mouse_scroll_lines = "Líneas de la rueda del ratón"
mouse_scroll_lines_help = { git = "Cuántos commits mueve una muesca de la rueda en el Log. Requiere reiniciar.", local = "Cuántas confirmaciones mueve una muesca de la rueda en el Log. Requiere reiniciar." }
heading_date_time = "Fecha y hora"
heading_layout = "Disposición"
date_locale = "Configuración regional de fecha/hora"
date_locale_help = "system: los nombres de mes y día siguen el idioma de la interfaz. english: siempre en inglés, sea cual sea el idioma. Se aplica a todas las fechas de esta página."
diff_layout = "Disposición por defecto"
diff_layout_help = { git = "Inline (una columna) o Split (antes y después lado a lado). Se retoma del último diff que miraste, en esta ventana y entre reinicios - cambiarlo aquí solo fija desde dónde empieza una sesión *nueva*.", local = "Inline (una columna) o Split (antes y después lado a lado). Se retoma de las últimas diferencias que miraste, en esta ventana y entre reinicios - cambiarlo aquí solo fija desde dónde empieza una sesión *nueva*." }
diff_hunks_only = "Solo hunks"
diff_hunks_only_help = "Activado muestra solo los hunks cambiados con unas líneas de contexto; desactivado muestra el archivo entero con los cambios resaltados en su sitio. Se retoma como la disposición."
diff_show_whitespace = "Mostrar cambios solo de espacios en blanco"
diff_show_whitespace_help = "Desactivado reduce a contexto un hunk que solo difiere en espacios en blanco."
input_color = "Color de entrada"
input_color_help = "Fondo de las entradas de texto. Seguir el tema (por defecto) usa el del tema; los demás son colores oscuros que lo reemplazan. Personalizado... usa el color hexadecimal de abajo. Se aplica en vivo, sin reiniciar."
input_color_custom = "Color de entrada personalizado"
input_color_custom_help = "#rrggbb, se usa cuando Color de entrada es Personalizado. Se aplica en vivo."
minimap = "Minimapa"
minimap_help = { git = "Una imagen de todo el archivo junto a la barra de desplazamiento vertical del diff (modo archivo entero) y del editor, con la parte visible resaltada; haz clic para saltar. Una imagen real donde el terminal las dibuja, celdas braille en los demás. También `M` en el diff y Alternar minimapa de la paleta.", local = "Una imagen de todo el archivo junto a la barra de desplazamiento vertical de las diferencias (modo archivo entero) y del editor, con la parte visible resaltada; haz clic para saltar. Una imagen real donde el terminal las dibuja, celdas braille en los demás. También `M` en las diferencias y Alternar minimapa de la paleta." }
date_format = "Formato de fecha"
date_format_help = "La columna de fecha de Blame / Historial del archivo."
date_time_format = "Formato de fecha/hora"
date_time_format_help = "La propia columna Fecha del Log."
date_verbose_format = "Formato de fecha detallado"
date_verbose_format_help = { git = "La línea Fecha del panel de detalle del commit, el tooltip al pasar sobre la columna Fecha y Copiar > Fecha.", local = "La línea Fecha del panel de detalle de la confirmación, el tooltip al pasar sobre la columna Fecha y Copiar > Fecha." }
preview = "vista previa"
sidebar_sections_scope = "Secciones del panel izquierdo"
sidebar_sections_scope_help = "De quién es la elección de secciones mostradas u ocultas del panel izquierdo. repository: cada repositorio conserva la suya (la global es su punto de partida). global: una misma para todos los repositorios. Cambiar de una a otra no hace perder ninguna."
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "Disposición de columnas"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "Cómo dispone el Log sus columnas. fit: cada columna cabe en el panel y solo Mensaje se adapta. scroll: las columnas conservan sus anchos, Mensaje también, y la tabla se desplaza lateralmente cuando es más ancha que el panel."

[settings_git]
default_backend = "Backend de git"
default_backend_help = "Global. Un daemon en ejecución conserva el backend con el que arrancó."
default_backend_warning = "Surte efecto en los daemons iniciados después de este cambio."
pull_mode = { git = "Botón Pull", local = "Botón Traer" }
default_encoding = "Codificación por defecto"
default_encoding_help = { git = "Se usa para mostrar contenidos de archivos, blame y diffs que no son UTF-8 válido (el UTF-8 válido nunca se vuelve a decodificar). Un repositorio puede sobrescribirla abajo. Solo visualización: el staging y los parches conservan exactamente los bytes del archivo.", local = "Se usa para mostrar contenidos de archivos, blame y diferencias que no son UTF-8 válido (el UTF-8 válido nunca se vuelve a decodificar). Un repositorio puede sobrescribirla abajo. Solo visualización: la preparación y los parches conservan exactamente los bytes del archivo." }
push_behavior = { git = "Botón Push", local = "Botón Enviar" }
push_behavior_help = { git = "direct: push al remoto por defecto al instante. ask: abre un menú pequeño con el remoto por defecto preseleccionado. El ▾ del botón siempre pregunta.", local = "direct: envía al remoto por defecto al instante. ask: abre un menú pequeño con el remoto por defecto preseleccionado. El ▾ del botón siempre pregunta." }
