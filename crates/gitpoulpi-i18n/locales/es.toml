[help_tabs]
tab_keys = "Teclas"
tab_start = "Inicio"
tab_log = "Log"
tab_changes = "Cambios"
tab_refs = "Refs"
tab_hosting = "Alojamiento"
tab_setup = "Ajustes"
tab_tools = "IA y CLI"
title = "Ayuda - escribe para filtrar, Tab cambia de pestaña, ? cierra"
title_filtered = "Ayuda - filtro «{filter}» - Esc borra, ? cierra"
hint = "Tab/Shift+Tab, ←/→ o Alt+1..8: pestañas - ↑/↓, PgUp/PgDn desplazan"
start_1 = "Ventana|Pestañas arriba (Inicio lista, abre y clona repositorios), luego la barra de herramientas, la barra lateral Refs a la izquierda, el Log al centro, y los cambios y el formulario de {$commit} a la derecha."
start_2 = "Paleta de comandos|Ctrl+P lista cada acción con su atajo. Escribe para buscar, Enter la ejecuta. Todo lo que hace el ratón, lo hace la paleta."
start_3 = "Prefijos de atajos|Ctrl+G y luego una tecla ejecuta una acción de git ({$stage}, {$commit}, {$pull}, {$push}...). Ctrl+N y luego una tecla te mueve o cambia la vista. La barra de estado lista las opciones."
start_4 = "Pestañas|Una pestaña por repositorio. Ctrl+PgUp / Ctrl+PgDn cambian, Ctrl+W la cierra, t abre el selector de pestañas, clic derecho en una pestaña o Ctrl+T para su menú."
start_5 = { git = "Ratón y teclas|Clic selecciona, doble clic abre o hace checkout, clic derecho (o .) abre un menú, arrastrar mueve refs y filas de {$rebase}. Cada acción del ratón tiene una tecla.", local = "Ratón y teclas|Clic selecciona, doble clic abre o hace checkout, clic derecho (o .) abre un menú, arrastrar mueve refs y filas del reaplicado. Cada acción del ratón tiene una tecla." }
start_6 = "Actualizar y deshacer|r actualiza, F5 recarga todo, Ctrl+Z / Ctrl+Y deshacen y rehacen la última operación, q sale."
log_1 = "Leer el grafo|Una fila por {$commit}, un carril por rama. La primera fila es tu trabajo sin confirmar (WIP): selecciónala para ver los cambios. Haz clic en una fila para ver sus detalles a la derecha."
log_2 = "Buscar|f (o el botón Buscar) atenúa las filas que no coinciden con un mensaje, autor, hash o ref. Enter / Shift+Enter saltan a la coincidencia siguiente / anterior. / filtra la barra lateral Refs."
log_3 = { git = "Menú de {$commits}|Clic derecho en un {$commit} o . sobre él: {$cherry_pick}, revert, reset, editar el mensaje, crear una rama o {$tag}, checkout, worktree, parche, copiar.", local = "Menú de {$commits}|Clic derecho en una {$commit} o . sobre ella: {$cherry_pick}, revert, reset, editar el mensaje, crear una rama o {$tag}, checkout, worktree, parche, copiar." }
log_4 = { git = "{$Rebase} interactivo|«{$Rebase} interactivo desde aquí...» en el menú del {$commit}: marca cada {$commit} como {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} o {$edit}, reordena con Ctrl+Up/Down, inicia con Ctrl+S, sal con Esc.", local = "{$Rebase} interactivo|«{$Rebase} interactivo desde aquí...» en el menú de la {$commit}: marca cada {$commit} como {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} o {$edit}, reordena con Ctrl+Up/Down, inicia con Ctrl+S, sal con Esc." }
log_5 = { git = "Varios {$commits}|Ctrl+clic alterna un {$commit}, Shift+clic (Alt+clic) selecciona un rango, Space alterna el actual, Esc borra. Luego clic derecho para {$cherry_pick} o revert de toda la selección.", local = "Varias {$commits}|Ctrl+clic alterna una {$commit}, Shift+clic (Alt+clic) selecciona un rango, Space alterna la actual, Esc borra. Luego clic derecho para {$cherry_pick} o revert de toda la selección." }
log_6 = "Arrastrar refs|Arrastra una rama sobre otra para {$merge}, {$rebase} o avance rápido, o sobre una rama remota para {$push}; suelta para elegir en un menú, Esc cancela. Teclado: paleta, «Refs: Soltar la ref seleccionada...»."
changes_1 = { git = "Cambios en curso|Selecciona la primera fila del Log (WIP): los archivos {$unstaged} y {$staged} aparecen a la derecha. m alterna ruta / árbol, a muestra todos los archivos, z pliega las carpetas.", local = "Cambios en curso|Selecciona la primera fila del Log (WIP): los archivos sin preparar y los preparados aparecen a la derecha. m alterna ruta / árbol, a muestra todos los archivos, z pliega las carpetas." }
changes_2 = "{$Stage} y {$unstage}|Ctrl+Space sobre un archivo, o su botón, o Ctrl+G s; Ctrl+G a para todo, Ctrl+G u para {$unstage}. Clic derecho en un archivo para descartar, ver su historial o blame, o abrirlo en tu editor."
changes_3 = { git = "Leer un {$diff}|Haz clic en un archivo o pulsa d. m alterna en línea / dividido, w ajusta líneas, s ignora espacios, n / p saltan entre hunks, Esc o q vuelve al Log.", local = "Leer las {$diff}|Haz clic en un archivo o pulsa d. m alterna en línea / dividido, w ajusta líneas, s ignora espacios, n / p saltan entre hunks, Esc o q vuelve al Log." }
changes_4 = { git = "Hunks y líneas|En un {$diff}: Space = {$stage} el hunk, v luego j / k luego Enter = {$stage} las líneas elegidas, x = descartar el hunk. Descartar pregunta antes; Ctrl+Z lo recupera.", local = "Hunks y líneas|En las {$diff}: Space = {$stage} el hunk, v luego j / k luego Enter = {$stage} las líneas elegidas, x = descartar el hunk. Descartar pregunta antes; Ctrl+Z lo recupera." }
changes_5 = { git = "Escribir un {$commit}|Escribe un resumen y una descripción, luego Ctrl+Enter o el botón verde. Shift+A enmienda el último {$commit}. Ctrl+G c lleva el cursor al formulario, Esc lo deja.", local = "Escribir una {$commit}|Escribe un resumen y una descripción, luego Ctrl+Enter o el botón verde. Shift+A enmienda la última {$commit}. Ctrl+G c lleva el cursor al formulario, Esc lo deja." }
changes_6 = { git = "Conflictos de {$merge}|Un aviso ofrece «Resolver conflictos...». En el editor de {$merge} elige A, B o ambos por conflicto (a / b / c), edita la Salida, guarda y pulsa Continuar.", local = "Conflictos de fusión|Un aviso ofrece «Resolver conflictos...». En el editor de fusión elige A, B o ambos por conflicto (a / b / c), edita la Salida, guarda y pulsa Continuar." }
changes_7 = "Deshacer y rehacer|Ctrl+Z / Ctrl+Y, o los botones de la barra, deshacen y rehacen la mayoría de las operaciones: {$commits}, ramas, checkouts, resets, {$stashes}, descartes. Pregunta antes si es arriesgado."
refs_1 = { git = "Ramas y {$tags}|Doble clic en una rama local o {$tag} para hacer checkout; clic derecho para su menú ({$merge}, {$rebase}, renombrar, borrar...). Ctrl+G b y Ctrl+G t crean uno en el {$commit} actual.", local = "Ramas y {$tags}|Doble clic en una rama local o {$tag} para hacer checkout; clic derecho para su menú ({$merge}, {$rebase}, renombrar, borrar...). Ctrl+G b y Ctrl+G t crean una en la {$commit} actual." }
refs_2 = { git = "Solo y ocultar|La tecla o muestra solo los {$commits} de la ref seleccionada, Shift+O lo detiene. El menú de una ref la oculta del grafo; Shift+H lo muestra todo de nuevo. Solo visual: el repositorio no cambia.", local = "Solo y ocultar|La tecla o muestra solo las {$commits} de la ref seleccionada, Shift+O lo detiene. El menú de una ref la oculta del grafo; Shift+H lo muestra todo de nuevo. Solo visual: el repositorio no cambia." }
refs_3 = "{$Fetch}, {$pull}, {$push}|Ctrl+G f: {$fetch} de todos los remotos. Ctrl+G p: {$pull}. Ctrl+G Shift+P: {$push}. La flecha junto a un botón de la barra elige otra forma u otro remoto."
refs_4 = "Remotos|El + del título REMOTAS añade uno. Clic derecho en un remoto para hacer {$fetch}, copiar su enlace web, editar sus URL o quitarlo."
refs_5 = "{$Stashes} y worktrees|Los botones {$stash} y Pop; Ctrl+G m pide antes un mensaje. Clic derecho en un {$stash} para aplicarlo o sacarlo. «Crear worktree desde...» abre una rama en su propia pestaña."
refs_6 = "Submódulos y LFS|Aparece una sección SUBMÓDULOS si hay alguno: doble clic abre uno como pestaña, clic derecho lo actualiza. Acciones de Git LFS: el botón LFS o Ctrl+G l."
hosting_1 = "Conectar|Ajustes > Integraciones: pega un token personal de GitHub o GitLab. No hace falta cuenta; el token va al gestor de credenciales del sistema."
hosting_2 = "Vincular un repositorio|En las secciones {$PRS} e ISSUES de la barra lateral, elige uno de los proveedores que propone la lista. Nada se vincula solo; el vínculo se guarda por repositorio."
hosting_3 = "Crear una {$pr}|El + de la cabecera {$PRS}, o n en esa sección, abre el formulario; el menú de una rama tiene «Iniciar una {$pr} desde...». La IA puede escribir el título y la descripción."
hosting_4 = "Issues|La sección ISSUES los lista; + o n crea uno. El menú de una fila lo abre en el navegador o actúa sobre él."
hosting_5 = "Referencias|Las referencias a issues y {$prs} (#12, !53, ABC-7) en un mensaje de {$commit} o un nombre de rama se reconocen. Alt+R en el formulario de {$commit} inserta una."
hosting_6 = "Chip de la barra|A la izquierda de la barra, un chip muestra la {$pr} de la rama actual (GH #12, GL !53) o un «+ {$pr_abbr}» tenue para iniciar una. Haz clic."
hosting_7 = "Claves SSH|Elige una clave SSH por perfil (Ajustes > Perfiles) o por repositorio (menú de la pestaña > «Clave SSH...»). Las frases de paso quedan en tu ssh-agent del sistema."
setup_1 = "Ajustes|Ctrl+, o el engranaje. Tab alterna entre la lista de páginas y las opciones, j / k mueven, Enter o Space cambia un valor, / o Ctrl+F busca en todas las opciones, Esc cierra."
setup_2 = "Temas|Ajustes > Apariencia > Tema: oscuro, claro, seguir el terminal o uno de muchos preajustes. Ctrl+N y una tecla también cambian tema, idioma y colores del grafo sin abrir Ajustes."
setup_3 = "Idioma|Ajustes > General > Idioma ofrece 17 idiomas. «Traducir términos de git» decide si las palabras propias de git ({$commit}, {$push}...) también se traducen."
setup_4 = "Perfiles|Ajustes > Perfiles guarda identidades de {$commit} (nombre, correo, clave SSH). El selector de perfil de la barra elige la de este repositorio."
setup_5 = "Abrir en|El botón Abrir en (Alt+O) abre la carpeta de esta pestaña en un terminal, un editor o el gestor de archivos. Ajustes > Abrir en edita la lista."
setup_6 = "Atajos de teclado|Ajustes > Teclado y ratón reasigna cualquier tecla. La pestaña Teclas de esta ayuda muestra tus propios atajos."
tools_1 = "IA (opcional)|Desactivada hasta configurarla en Ajustes > IA: un servicio compatible con OpenAI, Anthropic o un agente local como claude -p. Nunca hace falta una cuenta de GitPoulpi."
tools_2 = { git = "Acciones de IA|El botón de destello junto al resumen o Ctrl+G i escribe un mensaje de {$commit}; Ctrl+G w explica los cambios; Ctrl+G C divide tu trabajo en varios {$commits}; Alt+I sugiere una resolución de conflicto. Nada se aplica sin tu confirmación.", local = "Acciones de IA|El botón de destello junto al resumen o Ctrl+G i escribe un mensaje de {$commit}; Ctrl+G w explica los cambios; Ctrl+G C divide tu trabajo en varias {$commits}; Alt+I sugiere una resolución de conflicto. Nada se aplica sin tu confirmación." }
tools_3 = "CLI|gitpoulpi <comando> hace desde un script lo que hace la ventana, mediante el mismo daemon, así que los cambios aparecen en vivo. --json da salida para máquinas, --help lista las opciones."
tools_4 = "MCP|gitpoulpi mcp serve --stdio da a los agentes de IA una herramienta por comando CLI. Ajustes > Agentes y MCP elige qué pueden cambiar."
tools_5 = "Wrapper de shell|Con el wrapper de shell gp, «Salir y cd aquí» deja tu shell en la carpeta de la pestaña activa al salir de GitPoulpi."

