mouse_gestures_in_2 = { git = "un divisor de panel o el límite de una columna del Log lo redimensiona (más allá del mínimo, el panel se contrae); la cabecera de una columna del Log arrastrada más allá de su vecina la reordena; arrastrar una ref sobre otra rama abre un menú con las acciones aplicables (Esc cancela)", local = "un divisor de panel o el límite de una columna del Log lo redimensiona (más allá del mínimo, el panel se contrae); la cabecera de una columna del Log arrastrada más allá de su vecina la reordena; arrastrar una ref sobre otra rama abre un menú con las acciones aplicables (Esc cancela)" }
