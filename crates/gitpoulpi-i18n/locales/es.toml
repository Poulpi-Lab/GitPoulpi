core_autocrlf_help = "Se escribe en la configuración git de este repositorio (core.autocrlf), así que git y cualquier otra herramienta la ven. true: LF a CRLF al hacer checkout; input: CRLF a LF solo al guardar en el historial; false: nunca convertir. (heredado): quita el valor del repositorio para que se aplique tu configuración git global. Se puede deshacer."
core_eol_help = "Se escribe en la configuración git de este repositorio (core.eol): el fin de línea que git usa en los archivos de texto del árbol de trabajo (lf, crlf, o native para el de la plataforma). (heredado): quita el valor del repositorio para que se aplique tu configuración git global. Se puede deshacer."
git_lfs = "Git LFS"
git_lfs_help = { git = "Muestra Git LFS en la interfaz (el tag LFS, la tarjeta de diff, el aviso de programa ausente, los comandos LFS) y deja que GitPoulpi ejecute sus propios pasos LFS (descargar objetos tras un clone). Desactivado: los filtros LFS propios de git siguen ejecutándose, GitPoulpi nunca llama a git-lfs por sí mismo.", local = "Muestra Git LFS en la interfaz (la etiqueta LFS, la tarjeta de diferencias, el aviso de programa ausente, los comandos LFS) y deja que GitPoulpi ejecute sus propios pasos LFS (descargar objetos tras un clone). Desactivado: los filtros LFS propios de git siguen ejecutándose, GitPoulpi nunca llama a git-lfs por sí mismo." }
git_lfs_program = "Programa git-lfs"
git_lfs_program_help = "Instálalo desde https://git-lfs.com (Windows: incluido con Git para Windows, o `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Paleta: LFS: Open Install Page."
