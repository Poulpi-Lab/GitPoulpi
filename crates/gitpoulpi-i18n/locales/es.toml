mouse_gestures_in_4 = { git = "desplaza la lista o el diff con foco/bajo el puntero; Shift+rueda (las dos grafías que informan los terminales) desplaza un diff/vista de archivo/blame *en horizontal*, mientras el ajuste de línea está desactivado", local = "desplaza la lista o las diferencias con foco/bajo el puntero; Shift+rueda (las dos grafías que informan los terminales) desplaza unas diferencias/vista de archivo/blame *en horizontal*, mientras el ajuste de línea está desactivado" }
mouse_gestures_in_5 = "abre un menú contextual donde exista uno (ver la sección de cada panel arriba); el equivalente de teclado es siempre {{*global.context_menu}}"
mouse_gestures_in_6 = "toda acción «Copiar ...» pide el portapapeles al *terminal* mediante OSC 52 - una TUI no puede alcanzarlo directamente; un terminal que ignora la secuencia simplemente no copia"
mouse_gestures_in_7 = "las pistas de redimensión/puntero/mano abierta se envían mediante OSC 22 en terminales que lo admiten (kitty, foot, xterm; desigual en otros) - los divisores arrastrables y límites de columna también se iluminan dentro del propio búfer de la app, que no necesita ninguna cooperación del terminal"
git_actions_then_25 = "abrir el menú LFS (el botón LFS de la barra; sus filas también están en la paleta)"
git_actions_then_26 = { git = "LFS: {$fetch} de los objetos de todas las referencias", local = "LFS: {$fetch} los objetos de todas las referencias" }
git_actions_then_27 = "LFS: escribir el contenido real sobre los punteros (sin conexión)"
git_actions_then_28 = "LFS: {$pull} (descargar y escribir el contenido)"
git_actions_then_29 = { git = "LFS: {$push} de los objetos de todas las referencias", local = "LFS: {$push} los objetos de todas las referencias" }
git_actions_then_30 = "LFS: limpiar el almacén LFS local"
diff_view_encoding = "elegir la codificación con la que se lee el archivo (Detección automática, UTF-8, UTF-16, Windows-1252, ...)"
commit_composer_bottom_14 = { git = "alterna «Omitir hooks»: el commit se hace sin ejecutar los hooks de git (panel Estado)", local = "alterna «Omitir hooks»: la confirmación se hace sin ejecutar los hooks de git (panel Estado)" }
repositories_and_tabs_39 = "filtra las entradas de la carpeta mientras escribes (sin distinguir mayúsculas; en Izquierda o Contenido, `/` también le da el foco; Enter o Abajo salta a la primera coincidencia, Esc borra el filtro; se vacía al cambiar de carpeta)"
repositories_and_tabs_40 = "alterna Mostrar carpetas hermanas (el árbol de la izquierda también lista las demás carpetas de cada nivel abierto; se recuerda)"
split_1 = { git = "asigna la selección (archivo, hunk o línea) a ese {$commit} (0 la deja sin asignar, n la pone en un {$commit} nuevo); Tab alterna entre los {$commits} y los cambios, Enter o e edita el mensaje, d elimina un {$commit}; {{compose.apply}} divide", local = "asigna la selección (archivo, hunk o línea) a esa {$commit} (0 la deja sin asignar, n la pone en una {$commit} nueva); Tab alterna entre las {$commits} y los cambios, Enter o e edita el mensaje, d elimina una {$commit}; {{compose.apply}} divide" }
split_2 = "selecciona líneas sueltas dentro del hunk actual (Shift+Up/Down amplía la selección)"
split_3 = { git = "sube o baja el {$commit} en la lista (K y J hacen lo mismo)", local = "sube o baja la {$commit} en la lista (K y J hacen lo mismo)" }
split_4 = "devuelve cada cambio a como estaba al abrir el editor"
split_5 = { git = "divide el {$commit} con el plan tal como está; mientras el plan no sea válido, el botón queda desactivado y la barra de estado dice por qué", local = "divide la {$commit} con el plan tal como está; mientras el plan no sea válido, el botón queda desactivado y la barra de estado dice por qué" }
split_6 = "alterna «Firmar {$commits}» (activado al abrir el editor si el ajuste gpgSign del repositorio es true)"
split_7 = { git = "en el panel de {$commits}, selecciona ese {$commit}; m o Enter sobre un cambio lista los {$commits} a los que asignarlo", local = "en el panel de {$commits}, selecciona esa {$commit}; m o Enter sobre un cambio lista las {$commits} a las que asignarlo" }
rewrite_9 = "abre la pestaña Tamaño y analiza el historial: los archivos y carpetas más grandes, y los archivos eliminados que aún se conservan; las filas marcadas se convierten en reglas de eliminación"
rewrite_host_howto = "explica cómo sortear la protección de una rama del host para publicar una reescritura: quitar la protección, hacer un {$push_noun} con otro nombre de rama o volver a crear el repositorio; no se hace nada por ti"
rewrite_ai_rules = "crea las reglas de reescritura a partir de tu descripción con IA (no se previsualiza ni se aplica nada)"
log_columns_2 = "desplazar lateralmente las columnas del Log cuando conservan sus anchos (la disposición Desplazar lateralmente, que se elige en el selector de columnas, en Ajustes o con s mientras hay una columna elegida); en la disposición ajustada, todas las columnas caben en el panel"

