compose_hint = "La IA no puede dividir los cambios en {$commits} mientras haya archivos con conflictos. Resuélvelos y vuelve a pedirlo."
# context: second paragraph of the dialog when a commit was asked
commit_hint = { git = "Un {$commit} necesita que todos los conflictos estén resueltos primero. Resuélvelos, haz {$stage} de los resultados y vuelve a hacer {$commit}.", local = "Una {$commit} necesita que todos los conflictos estén resueltos primero. Resuélvelos, prepara los resultados y vuelve a hacer la {$commit}." }
