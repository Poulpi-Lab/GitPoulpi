journal_outside_help = { git = "Activado, lo que un shell o un agente de IA hace en ramas, tags, stashes y HEAD aparece en el historial de deshacer, marcado como externo, y Ctrl+Z puede revertirlo. Las ediciones de archivos del árbol de trabajo nunca se capturan. Requiere Deshacer activado.", local = "Activado, lo que un shell o un agente de IA hace en ramas, etiquetas, guardados rápidos y HEAD aparece en el historial de deshacer, marcado como externo, y Ctrl+Z puede revertirlo. Las ediciones de archivos del árbol de trabajo nunca se capturan. Requiere Deshacer activado." }
remember_tabs = "Recordar pestañas"
remember_tabs_help = "Activado, las pestañas abiertas al cerrar la última sesión se reabren en el siguiente arranque. Desactivado, el arranque empieza con una sola pestaña: el repositorio indicado. Se lee una vez al iniciar; requiere reiniciar para surtir efecto."
radar_enabled = "Radar activado"
radar_enabled_help = "Desactivado, la pestaña Radar, sus comandos y su atajo se ocultan y no se consulta nada para ella en segundo plano. Se aplica al instante."
startup_tab_in_repo = "Pestaña de arranque dentro de un repositorio"
startup_tab_in_repo_help = "La pestaña en la que se abre un arranque cuando la carpeta desde la que se inicia está dentro de un repositorio. Repositorio actual abre la pestaña de ese repositorio, abriéndola si hace falta. Última pestaña abre la que estaba activa al cerrar por última vez (Inicio si Recordar pestañas está desactivado). Un repositorio indicado con --repo abre siempre su propia pestaña. Se lee una vez al iniciar; requiere reiniciar para surtir efecto."
startup_tab_outside_repo = "Pestaña de arranque fuera de un repositorio"
startup_tab_outside_repo_help = "La pestaña en la que se abre un arranque cuando la carpeta desde la que se inicia no es un repositorio, por ejemplo una carpeta de usuario. Última pestaña abre la que estaba activa al cerrar por última vez (Inicio si Recordar pestañas está desactivado o no hay ninguna recordada). Radar abre Inicio si el Radar está desactivado. Se lee una vez al iniciar; requiere reiniciar para surtir efecto."
startup_tab_launcher = "Pestaña de arranque desde el lanzador"
startup_tab_launcher_help = "La pestaña en la que se abre un arranque cuando GitPoulpi se inicia desde su acceso directo del escritorio o del menú Inicio (véase Lanzador más abajo), sea cual sea la carpeta. Tiene prioridad sobre los dos ajustes anteriores; Última pestaña y Radar se comportan como allí. Se lee una vez al iniciar; requiere reiniciar para surtir efecto."
group_worktree_tabs = "Agrupar las pestañas de worktrees"
group_worktree_tabs_help = "Las pestañas de los worktrees vinculados de un repositorio van justo después de la pestaña de ese repositorio, y una pestaña de worktree que arrastres a otro sitio vuelve a colocarse a su lado. Desactivado deja las pestañas donde las pongas. Al activarlo se reagrupan las pestañas abiertas."
allow_agent_view_control = "Permitir que los agentes de IA controlen la vista"
allow_agent_view_control_help = { git = "Activado, un agente de IA (mediante MCP o `gitpoulpi ui`) puede pedir a esta ventana que muestre un commit, un archivo o un aviso. Nunca cambia nada en el repositorio. Desactivado, esta ventana no los acepta. Se lee al abrir una ventana.", local = "Activado, un agente de IA (mediante MCP o `gitpoulpi ui`) puede pedir a esta ventana que muestre una confirmación, un archivo o un aviso. Nunca cambia nada en el repositorio. Desactivado, esta ventana no los acepta. Se lee al abrir una ventana." }
allow_ui_propose = "Dejar que los agentes de IA propongan cambios para que yo los confirme"
allow_ui_propose_help = { git = "Activado, un agente de IA puede abrirte un diálogo rellenado de antemano: un mensaje nuevo para un commit, un mensaje de commit en el compositor, una rama o un tag nuevos. Aparece marcado ✦ Propuesto por <agente>, y nada cambia hasta que pulses la confirmación del propio diálogo; Esc lo rechaza. Desactivado (por defecto), `ui propose` y las herramientas MCP ui_propose_* se rechazan.", local = "Activado, un agente de IA puede abrirte un diálogo rellenado de antemano: un mensaje nuevo para una confirmación, un mensaje de confirmación en el compositor, una rama o una etiqueta nuevas. Aparece marcado ✦ Propuesto por <agente>, y nada cambia hasta que pulses la confirmación del propio diálogo; Esc lo rechaza. Desactivado (por defecto), `ui propose` y las herramientas MCP ui_propose_* se rechazan." }
clone_root = "Carpeta de clonado por defecto"
clone_root_help = "Dónde empieza el «Dónde clonar» del diálogo Clonar. Vacío usa el valor por defecto de cada sistema: %USERPROFILE%\\source\\repos en Windows, ~/src en los demás."
# context: setting: which source the Clone dialog opens on (Last used, Clone with URL, or an integration)
clone_start_source = "El diálogo Clonar empieza en"
clone_start_source_help = "La fuente con la que se abre el diálogo Clonar. «Última usada» reabre la que mostraba al cerrarse por última vez; «Clonar con URL» empieza siempre en el formulario de URL; o elige una de tus integraciones conectadas. Una fuente que ya no está disponible vuelve a «Clonar con URL»."
# context: option of the "Clone dialog starts on" setting: the source shown when the dialog was last closed
clone_start_last = "Última usada"
browse_root = "Carpeta de exploración por defecto"
browse_root_help = "Dónde se abre Explorar (el selector de carpetas, desde la pestaña Inicio) por defecto. Vacío hace que Explorar se abra en la última carpeta elegida (o en la carpeta personal, la primera vez) en vez de una fija."
heading_auto_stash = { git = "Auto-stash", local = "Guardado rápido automático" }
heading_log = "Registro de la aplicación"
heading_undo = "Historial de deshacer"
log_level = "Nivel del registro"
log_retention_days = "Conservar los archivos de registro"
# context: setting help: how long log files are kept; a number and a unit (days, weeks, months, years) on one line
log_retention_help = "Los archivos de registro más antiguos se eliminan al iniciar GitPoulpi. El archivo de cada día también está limitado por el ajuste de tamaño de abajo."
# context: setting: where the data GitPoulpi keeps for one repository lives (ref filters, fold state, workflow, caches)
repo_data_location = "Ubicación de los datos del repositorio"
# context: help of the setting above
repo_data_location_help = "Dónde se guardan los datos de cada repositorio (filtros de refs, flujo de trabajo, cachés). Dentro de .git mantiene limpio el árbol de trabajo; al cambiar el ajuste se migran los datos existentes."
# context: option of the repository data location: inside the repository's .git folder
repo_data_in_git_dir = "Dentro de .git (carpeta gitpoulpi)"
# context: option of the repository data location: a .gitpoulpi folder in the working tree
repo_data_in_worktree = "En el árbol de trabajo (carpeta .gitpoulpi)"
# context: option of the repository data location: the user's own data folder
repo_data_user_data = "En mi carpeta de datos de usuario (fuera del repositorio)"
log_max_file_mb = "Tamaño máximo de un archivo de registro"
log_timings = "Mostrar la duración de las operaciones"
log_timings_help = "Añade la duración en milisegundos a cada operación del registro de actividad (pestaña \"Operaciones de git\")."
log_extended = "Registro ampliado"
log_extended_help = "Incluye también las operaciones en segundo plano (auto-{$fetch}, actualización, sondeo del estado) con su duración."
# context: setting: how the status bar counts the total commits (the dropdown choices are in settings_value)
commit_count = "Contar el total de {$commits} con"
# context: help of the setting above; mentions antivirus software
commit_count_help = { git = "Cómo averigua la barra de estado el total de «cargados / total». Git del sistema ejecuta un proceso de git (lo más rápido en condiciones normales). libgit2 cuenta dentro de GitPoulpi y no inicia ningún proceso: elígelo cuando el antivirus analiza cada comando y ralentiza git. Desactivado muestra solo los {$commits} cargados. Se aplica al instante.", local = "Cómo averigua la barra de estado el total de «cargadas / total». Git del sistema ejecuta un proceso de git (lo más rápido en condiciones normales). libgit2 cuenta dentro de GitPoulpi y no inicia ningún proceso: elígelo cuando el antivirus analiza cada comando y ralentiza git. Desactivado muestra solo las {$commits} cargadas. Se aplica al instante." }
auto_stash = "Auto-{$stash} antes de checkout, {$pull}, {$merge} o {$rebase}"
auto_stash_help = { git = "Qué hacer cuando un checkout, pull, merge o rebase queda bloqueado por cambios locales. ask: un diálogo ofrece hacer stash, ejecutar la operación y recuperar el stash; always: hacerlo sin preguntar; never: rechazar, como hace git.", local = "Qué hacer cuando un checkout, una traída, una fusión o un reaplicado queda bloqueado por cambios locales. ask: un diálogo ofrece guardar aparte, ejecutar la operación y recuperar el guardado rápido; always: hacerlo sin preguntar; never: rechazar, como hace git." }
include_untracked_in_autostash = { git = "Incluir archivos sin seguimiento en el auto-stash", local = "Incluir archivos sin seguimiento en el guardado rápido automático" }
include_untracked_in_autostash_help = { git = "Si el stash automático también toma los archivos sin seguimiento (si no, solo se guardan y se restauran los cambios con seguimiento).", local = "Si el guardado rápido automático también toma los archivos sin seguimiento (si no, solo se guardan y se restauran los cambios con seguimiento)." }
hosting_refresh_minutes = "Actualización de {$prs} e issues"
hosting_refresh_minutes_help = { git = "Cada cuánto vuelven a consultar al host las listas de {$prs} e issues de la barra lateral (y el chip de {$pr_abbr} vinculada de la barra de herramientas). 0 apaga el temporizador; aun así se actualizan al abrir un repositorio, al cambiar de rama, tras un push o fetch, y bajo demanda.", local = "Cada cuánto vuelven a consultar al host las listas de {$prs} e issues de la barra lateral (y el chip de {$pr_abbr} vinculada de la barra de herramientas). 0 apaga el temporizador; aun así se actualizan al abrir un repositorio, al cambiar de rama, tras un envío o obtención, y bajo demanda." }
pr_terminology = "Terminología de las solicitudes de revisión"
pr_terminology_help = { git = "La palabra que designa una solicitud de revisión de código alojada en toda la TUI. Auto sigue el host del repositorio: Merge request en GitLab, Pull request en los demás. Pull request o Merge request fuerza esa palabra. Se aplica al instante.", local = "La palabra que designa una solicitud de revisión de código alojada en toda la TUI. Auto sigue el host del repositorio: «Solicitud de fusión» en GitLab, «Solicitud de incorporación» en los demás. «Solicitud de incorporación» o «Solicitud de fusión» fuerza esa palabra. Se aplica al instante." }
hide_finished_pr_chip = { git = "Ocultar el chip de {$pr} cuando se cierra o se hace {$merge} de ella", local = "Ocultar el chip de {$pr} cuando se cierra o se fusiona" }
hide_finished_pr_chip_help = { git = "El chip de la barra de herramientas muestra la última {$pr} de la rama activa. Activado, se oculta cuando esa {$pr} se cierra o se hace {$merge} de ella, y la rama ofrece en su lugar el chip atenuado \"+ {$pr_abbr}\", como si no tuviera ninguna. Desactivado, el chip muestra siempre la última {$pr}, sea cual sea su estado. Se aplica al instante.", local = "El chip de la barra de herramientas muestra la última {$pr} de la rama activa. Activado, se oculta cuando esa {$pr} se cierra o se fusiona, y la rama ofrece en su lugar el chip atenuado \"+ {$pr_abbr}\", como si no tuviera ninguna. Desactivado, el chip muestra siempre la última {$pr}, sea cual sea su estado. Se aplica al instante." }
heading_external_tools = "Herramientas externas"
external_editor = "Editor externo"
external_editor_help = "Comando del elemento de menú «Abrir en <editor>» de un archivo; {{file}} es la ruta completa del archivo (se añade si falta). Vacío: VS Code (`code`) si está en el PATH, si no el programa predeterminado del sistema."
external_diff_tool = { git = "Herramienta de diff externa", local = "Herramienta de diferencias externa" }
external_diff_tool_help = { git = "Comando de «Abrir en herramienta de diff externa»; {{local}} es la versión confirmada (o staged), {{remote}} la versión con la que se compara. Vacío: `git difftool`, con el `diff.tool` que hayas configurado en git.", local = "Comando de «Abrir en herramienta de diferencias externa»; {{local}} es la versión confirmada (o preparada), {{remote}} la versión con la que se compara. Vacío: `git difftool`, con la herramienta que hayas configurado en git." }
external_merge_tool = { git = "Herramienta de merge externa", local = "Herramienta de fusión externa" }
external_merge_tool_help = { git = "Comando de «Abrir en herramienta de merge externa» en una tarjeta de conflicto; {{base}}, {{local}} (A, actual), {{remote}} (B, entrante) y {{merged}} (donde la herramienta escribe el resultado; se hace stage si termina bien). Vacío: `git mergetool`, con el `merge.tool` que hayas configurado en git.", local = "Comando de «Abrir en herramienta de fusión externa» en una tarjeta de conflicto; {{base}}, {{local}} (A, actual), {{remote}} (B, entrante) y {{merged}} (donde la herramienta escribe el resultado; se prepara si termina bien). Vacío: `git mergetool`, con el `merge.tool` que hayas configurado en git." }
file_explorer = "Explorador de archivos"
file_explorer_help = "Comando de «Mostrar en la carpeta»; {{path}} es la ruta completa del archivo, {{dir}} su carpeta. Windows: explorer.exe /select,\"{{path}}\" selecciona el archivo; Linux: xdg-open \"{{dir}}\"; macOS: open -R \"{{path}}\"."
ai_assistant = "Asistente de IA"
launch = "Abrir una ventana para agentes"
launch_help = "Cuando un agente de IA pide mostrar algo y no hay ninguna ventana de GitPoulpi abierta en ningún sitio, ejecuta esto para abrir una: off (nunca, por defecto), un terminal (kitty, foot, WezTerm, Windows Terminal, ...), una pestaña/panel/espacio de trabajo nuevo en un multiplexor (tmux, zellij, cmux, ...) o custom, que usa la plantilla de abajo. El agente aún debe pedirlo (`--launch`), o su ui_control debe ser auto. Surte efecto en la siguiente petición."
launch_command = "Comando de lanzamiento (custom)"
launch_command_help = "Se usa cuando la opción de arriba es custom. Se divide en argumentos (entrecomilla con '...' o \"...\"), sin shell. {{repo}} es la carpeta del repositorio, {{session}} el nombre de la sesión y {{gitpoulpi}} este programa. Ejemplo: kitty --directory {{repo}} {{gitpoulpi}} --session {{session}}"
tab_dir_follow = "Seguir la carpeta de la pestaña activa"
tab_dir_follow_help = "Un programa no puede cambiar la carpeta de su shell, así que ofrece dos formas de llegar. buttons (por defecto): mientras la pestaña activa no sea la carpeta donde se inició GitPoulpi, la barra de pestañas muestra Salir y cd aquí (solo si se inició con el wrapper de shell, ver `gitpoulpi shell-init`). auto: sin botones; al salir siempre se hace cd de tu shell a la pestaña activa, y se abre un terminal solo cada vez que abres una pestaña nueva (no con las restauradas al iniciar)."
forget_all_usernames_and_passwords = "Olvidar todos los usuarios y contraseñas"
forget_all_usernames_and_passwords_help = "Elimina todos los tokens que GitPoulpi guardó en tu gestor de credenciales."
mcp_server = "Servidor MCP"
mcp_server_help = "Activado, un agente de IA puede arrancar el servidor MCP (`gitpoulpi mcp serve`, o `--http` para el punto de acceso de red). Desactivado, se niega a arrancar. Se guarda como `mcp.enabled`. Un cambio se aplica la próxima vez que un agente arranque el servidor; un servidor que ya está en marcha conserva los ajustes con los que arrancó."
mcp_port = "Puerto del servidor MCP"
mcp_port_help = "El puerto en el que escucha `gitpoulpi mcp serve --http` cuando no se da ninguna dirección (se conserva la parte de host de `mcp.bind`, 127.0.0.1 por defecto, solo loopback salvo --allow-remote). Se aplica la próxima vez que un agente arranque el servidor; un servidor en marcha conserva su puerto."
mcp_bind_unreadable = "`mcp.bind` es «{bind}», que no tiene un puerto legible. Fijar un puerto aquí conserva su host y sustituye el resto."
undo_off_note = "Deshacer está desactivado - activa «Deshacer activado» para fijar la profundidad"
use_mailmap = "Mostrar autores según .mailmap"
use_mailmap_help = { git = "Muestra cada autor con el nombre que le da el .mailmap del repositorio en el Log, el blame y el historial de archivos. Los {$commits} en sí no cambian. Se aplica al instante.", local = "Muestra cada autor con el nombre que le da el .mailmap del repositorio en el Log, el blame y el historial de archivos. Las {$commits} en sí no cambian. Se aplica al instante." }
auto_prune_tags = { git = "Auto-prune de {$tags}", local = "Poda automática de {$tags}" }
auto_prune_tags_help = { git = "En cada {$fetch_noun}, elimina también los {$tags} locales que el remoto ha eliminado. Solo se tocan los {$tags} que estaban en el remoto: un {$tag} que nunca enviaste se conserva. Desactivado por defecto, como en git.", local = "En cada {$fetch_noun}, elimina también las {$tags} locales que el remoto ha eliminado. Solo se tocan las {$tags} que estaban en el remoto: una {$tag} que nunca enviaste se conserva. Desactivado por defecto, como en git." }

