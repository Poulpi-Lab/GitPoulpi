need_resolve = { git = "Resolver conflictos para hacer {$commit}", local = "Resolver conflictos para hacer la {$commit}" }
# context: palette: why a command does nothing while files have conflicts
why_commit = "aún hay archivos con conflictos: resuélvelos primero"

