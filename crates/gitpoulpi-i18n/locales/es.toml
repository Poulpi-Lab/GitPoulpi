[help_text]
git_actions_then_amend = { git = "modificar el commit seleccionado: resumen, descripción, nombre, correo y fecha del autor en una sola ventana", local = "modificar la confirmación seleccionada: resumen, descripción, nombre, correo y fecha del autor en una sola ventana" }
git_actions_then_edit_author = { git = "modificar solo el autor del commit seleccionado (nombre, correo, fecha)", local = "modificar solo el autor de la confirmación seleccionada (nombre, correo, fecha)" }
rewrite_1 = "abre el editor de reescritura del historial: cambia autores, fechas, mensajes, contenido de archivos o rutas en todo el historial o en una selección"
rewrite_2 = "genera la vista previa de lo que cambiarían las reglas y luego lo aplica en un solo paso que Deshacer revierte; Aplicar queda desactivado mientras la vista previa esté desactualizada"
rewrite_3 = "cancela la vista previa en curso (Esc hace lo mismo; un segundo Esc cierra el editor)"
rewrite_4 = "añade una regla, elimina la regla bajo el cursor, restaura la última eliminada, duplica la regla"
rewrite_5 = "activa o desactiva la regla, o la sube o la baja (las reglas se ejecutan de arriba abajo)"
rewrite_6 = "cambia entre las pestañas de la vista previa"
rewrite_7 = "guarda la receta en el repositorio o solo para ti, carga una guardada, la renombra; los valores secretos nunca se guardan"
rewrite_8 = "incluye o excluye todas las ramas protegidas ya publicadas; vuelve a comprobar las herramientas externas"
file_history_1 = { git = "ir al commit de la fila en el Log, cargando más Log si aún no está", local = "ir a la confirmación de la fila en el Log, cargando más Log si aún no está" }
file_history_2 = { git = "mover la selección; el diff de la derecha la sigue al instante", local = "mover la selección; las diferencias de la derecha la siguen al instante" }
file_history_3 = { git = "ampliar la selección a un rango: la derecha muestra entonces el diff del archivo entre los dos extremos (Shift+clic hace lo mismo)", local = "ampliar la selección a un rango: la derecha muestra entonces las diferencias del archivo entre los dos extremos (Shift+clic hace lo mismo)" }
file_history_4 = { git = "dar el teclado al diff, o devolverlo a la lista", local = "dar el teclado a las diferencias, o devolverlo a la lista" }
file_history_5 = { git = "copiar el SHA del commit, o su resumen", local = "copiar el SHA de la confirmación, o su resumen" }
file_history_6 = { git = "lado derecho: el diff, el archivo tal como estaba en ese commit, o su blame; sigue la selección y conserva su modo", local = "lado derecho: las diferencias, el archivo tal como estaba en esa confirmación, o su blame; sigue la selección y conserva su modo" }
file_history_7 = "comparar la versión de la fila con el árbol de trabajo (pulsa de nuevo para volver)"
file_history_8 = "restaurar el archivo a esa versión en el árbol de trabajo (pregunta antes; Deshacer devuelve los bytes antiguos)"
file_history_9 = "cambiar el tamaño de la lista (el separador también se arrastra; el ancho se recuerda)"
file_history_10 = "ratón: clic en una fila, Shift+clic para un rango, doble clic la muestra en el Log, clic derecho abre el menú"
commit_column_1 = "desplazar las filas hacia los lados (Shift+rueda o una rueda horizontal hacen lo mismo); solo se desplazan cuando una parte se ha dimensionado más ancha que el espacio disponible"
commit_column_2 = "elegir una parte (carriles, autor, fecha) y ensancharla o estrecharla, o devolver todas las partes al ancho automático; los límites de la cabecera también se arrastran y los anchos se recuerdan"
commit_column_3 = { git = "ratón: clic en una fila para elegir su commit, clic derecho abre su menú (la tecla de menú también, tras elegir una fila con Arriba/Abajo)", local = "ratón: clic en una fila para elegir su confirmación, clic derecho abre su menú (la tecla de menú también, tras elegir una fila con Arriba/Abajo)" }
commit_column_4 = "mover la parte elegida a la izquierda o a la derecha; arrastrar su encabezado hace lo mismo, y el orden se recuerda"
log_columns_1 = "elegir una columna del Log (su celda de encabezado se ilumina); después moverla a la izquierda o a la derecha (arrastrar su encabezado hace lo mismo), ensancharla o estrecharla (arrastrar su borde hace lo mismo), devolverla al ancho automático o ajustarla a su contenido (hacer doble clic en su borde hace lo mismo; + ajusta todas las columnas). Tab / Shift+Tab eligen otra columna, Esc sale; la disposición se recuerda"
global_1 = "abre la paleta de comandos - todos los comandos de la app, cada uno con su atajo; escribe para filtrar, Up/Down o Ctrl+P/Ctrl+N para moverte (no j/k: esas se escriben), Enter para ejecutar. Las filas en gris dicen por qué no pueden ejecutarse ahora"
global_2 = "el prefijo de navegación - ver su propia sección más abajo"
global_3 = "el prefijo de acciones de git - ver su propia sección más abajo"
global_4 = "alterna esta ayuda superpuesta - se abre encima de lo que haya abierto (Ajustes, Gestión de repositorios, ...), no solo sobre el grafo"
global_5 = "fuerza una actualización"
global_6 = "{$fetch}, volver a comprobar {$prs} e issues, recargar"
global_7 = { git = "deshacer / rehacer la última operación (commit, enmienda, checkout, crear/eliminar rama); pregunta antes si es arriesgado", local = "deshacer / rehacer la última operación (confirmación, enmienda, checkout, crear/eliminar rama); pregunta antes si es arriesgado" }
global_9 = { git = "salir - desde el grafo; sobre un diff o la vista de archivo cierra esa vista en su lugar. Cada salida se registra en gitpoulpi-tui-exit.log, junto a la configuración", local = "salir - desde el grafo; sobre unas diferencias o la vista de archivo cierra esa vista en su lugar. Cada salida se registra en gitpoulpi-tui-exit.log, junto a la configuración" }
global_10 = "abre un menú contextual, donde exista uno más abajo - las teclas son intercambiables (la tecla Menú/Aplicaciones rara vez llega a esta app en Windows, así que el acorde F10 es el que funciona de forma fiable allí)"
global_11 = "pasa el foco al panel siguiente / anterior"
global_12 = "mueve la selección (todos los paneles y listas)"
global_13 = "prefijo de recuento al estilo vim en j/k/Up/Down (y PgUp/PgDn, como recuento de pantallas) - los dígitos escritos aparecen como «4...» en la barra de estado hasta que se hace el movimiento; Esc o cualquier otra tecla lo borra, y un 0 inicial nunca lo empieza (así los dígitos se siguen escribiendo con normalidad en el compositor, el filtro de Refs y todo otro campo de texto)"
global_14 = { git = "Refs: cambia de sección LOCALES/REMOTAS/TAGS", local = "Refs: cambia de sección LOCALES/REMOTAS/ETIQUETAS" }
global_15 = { git = "Log: h = salir de / l = entrar en la lista de archivos de un commit", local = "Log: h = salir de / l = entrar en la lista de archivos de una confirmación" }
global_16 = { git = "Estado: ir a Unstaged / Staged", local = "Estado: ir a Sin preparar / Preparados" }
mouse_basics_1 = "selecciona + da foco a una fila (todo panel, lista, menú, diálogo); la rueda desplaza lo que haya bajo el puntero"
mouse_basics_2 = { git = "abrir/activar: una ref LOCAL/TAGS o un chip de ref de una fila del Log hace checkout, un archivo cambiado abre su diff, una fila de repositorio abre ese repositorio", local = "abrir/activar: una ref LOCAL/ETIQUETAS o un chip de ref de una fila del Log hace checkout, un archivo cambiado abre sus diferencias, una fila de repositorio abre ese repositorio" }
mouse_basics_3 = "la única señal de «esto es clicable» que dan la mayoría de terminales (ver «Hover y tooltips» más abajo) - también tooltips completos sobre celdas del Log y chips de ref truncados"
mouse_basics_4 = { git = "un divisor de panel, el límite de una columna del Log, el borde inferior de una sección de Refs o el del bloque de mensaje del commit lo redimensiona (más allá del mínimo se contrae); la cabecera de una columna del Log arrastrada más allá de su vecina la reordena", local = "un divisor de panel, el límite de una columna del Log, el borde inferior de una sección de Refs o el del bloque de mensaje de la confirmación lo redimensiona (más allá del mínimo se contrae); la cabecera de una columna del Log arrastrada más allá de su vecina la reordena" }
mouse_basics_5 = "(esquina superior derecha) salir, igual que q - solo se muestra cuando la ventana es lo bastante ancha para no solaparse con el título"
navigation_prefix_then_1 = "contrae/restaura el panel Refs (izquierda)"
navigation_prefix_then_2 = "contrae/restaura el panel Estado (derecha) - haz clic en el chevrón del borde de un panel, o en la franja fina que queda al contraerlo, como equivalente con ratón"
navigation_prefix_then_3 = "agranda la sección activa de Refs una fila ({{nav_prefix.shrink_section}} la reduce); arrastrar el borde inferior de una sección hace lo mismo, y el tamaño se recuerda"
navigation_prefix_then_4 = { git = "agranda el bloque de mensaje del commit del panel derecho una fila ({{nav_prefix.shrink_message}} lo reduce); arrastra el borde de debajo como equivalente con ratón", local = "agranda el bloque de mensaje de la confirmación del panel derecho una fila ({{nav_prefix.shrink_message}} lo reduce); arrastra el borde de debajo como equivalente con ratón" }
navigation_prefix_then_5 = { git = "da foco a ese subpanel - cada sección de Refs, el campo de filtro, el Log (o la vista de Diff cuando está abierta ahí), la lista del Historial del archivo, cada mitad del tercer panel y el campo Resumen del compositor cuando hay sitio tienen su propia insignia: 1-9 primero, luego a/b/c... si hay más de nueve en este fotograma - las insignias se reparten de nuevo cada vez que se abre el prefijo, así que lee el glifo, no memorices un dígito", local = "da foco a ese subpanel - cada sección de Refs, el campo de filtro, el Log (o la vista de diferencias cuando está abierta ahí), la lista del Historial del archivo, cada mitad del tercer panel y el campo Resumen del compositor cuando hay sitio tienen su propia insignia: 1-9 primero, luego a/b/c... si hay más de nueve en este fotograma - las insignias se reparten de nuevo cada vez que se abre el prefijo, así que lee el glifo, no memorices un dígito" }
navigation_prefix_then_6 = "abre los ajustes (igual que el engranaje de la barra de título)"
navigation_prefix_then_16 = "abre la ventana Acerca de (como el pulpo de la barra de título)"
navigation_prefix_then_17 = "mueve un paso el divisor entre el panel Refs y el Log a la izquierda ({{nav_prefix.refs_narrower}}) o a la derecha ({{nav_prefix.refs_wider}}); un panel Refs contraído vuelve primero, y el ancho se recuerda"
navigation_prefix_then_18 = "mueve un paso el divisor entre el Log y el panel derecho a la izquierda ({{nav_prefix.status_wider}}) o a la derecha ({{nav_prefix.status_narrower}}); un panel contraído vuelve primero, y el ancho se recuerda"
navigation_prefix_then_7 = "alterna esta ayuda (igual que ? a secas)"
navigation_prefix_then_8 = "elige una pestaña de repositorio a la que cambiar - escribe para filtrar, Up/Down o Ctrl+P/Ctrl+N para moverte, Enter cambia, haz clic en una fila, Esc cierra"
workspace_search = "busca en todos los repositorios del espacio de trabajo ramas, {$tags}, worktrees, {$stashes}, {$commits}, {$prs} e issues - Enter va allí, Alt+1-8 activa tipos, b: t: c: s: w: r: pr: i: # acota, Esc cierra"
navigation_prefix_then_9 = "muestra la vista que ofreció un agente de IA (el chip de la barra de estado `Show ...?`), gemelo de hacer clic en él"
navigation_prefix_then_10 = "descarta ese chip; si no, vuelve a la vista anterior al último cambio del agente (también `Agent: Back` en la paleta)"
navigation_prefix_then_11 = "cancela, vuelve al modo normal"
navigation_prefix_then_12 = "elegir un tema de la lista - escribe para filtrar, la selección se previsualiza en vivo, Enter la aplica y la guarda, Esc restaura el anterior (también `App: Cambiar tema...` en la paleta)"
navigation_prefix_then_13 = "elegir un idioma de la lista - escribe para filtrar, Enter lo aplica y lo guarda, Esc cancela (también `App: Cambiar idioma...` en la paleta)"
