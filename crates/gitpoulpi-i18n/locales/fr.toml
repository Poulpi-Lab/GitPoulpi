mouse_gestures_in_1 = { git = "les terminaux ne changent pas la forme du pointeur système pour la plupart des éléments : un changement de couleur au survol est donc souvent le seul indice « c'est cliquable » ; chaque bouton, case, onglet, ligne de menu, action d'en-tête de volet et le bouton de fermeture × s'éclairent au survol ; une cellule du Log, les autres refs d'un {$commit} et une gouttière de fichier/blame affichent plutôt une infobulle avec la valeur", local = "les terminaux ne changent pas la forme du pointeur système pour la plupart des éléments : un changement de couleur au survol est donc souvent le seul indice « c'est cliquable » ; chaque bouton, case, onglet, ligne de menu, action d'en-tête de volet et le bouton de fermeture × s'éclairent au survol ; une cellule du Log, les autres refs d'une validation et une gouttière de fichier/blame affichent plutôt une infobulle avec la valeur" }
mouse_gestures_in_2 = "une séparation de volets ou une limite de colonne du Log la redimensionne (en dessous du minimum, le volet se replie) ; un en-tête de colonne du Log glissé au-delà d'une voisine la réordonne ; glisser une ref sur une autre branche ouvre un menu des actions possibles (Esc annule)"
mouse_gestures_in_3 = { git = "glisser sur le texte d'un diff, de la vue fichier, du Blame ou de l'Historique du fichier le sélectionne, double-clic sur un mot ; y ou Ctrl+C le copie (texte du fichier seulement, jamais les gouttières) ; les autres occurrences d'un mot sélectionné sont surlignées dans le diff et l'éditeur (et marquées sur la règle)", local = "glisser sur le texte des différences, de la vue fichier, du Blame ou de l'Historique du fichier le sélectionne, double-clic sur un mot ; y ou Ctrl+C le copie (texte du fichier seulement, jamais les gouttières) ; les autres occurrences d'un mot sélectionné sont surlignées dans les différences et l'éditeur (et marquées sur la règle)" }
mouse_gestures_in_4 = { git = "fait défiler la liste ou le diff qui a le focus ou qui est survolé ; Shift+molette (les deux formes que rapportent les terminaux) défile un diff, une vue fichier ou un blame *horizontalement*, quand le retour à la ligne est désactivé", local = "fait défiler la liste ou les différences qui a le focus ou qui est survolé ; Shift+molette (les deux formes que rapportent les terminaux) défile des différences, une vue fichier ou un blame *horizontalement*, quand le retour à la ligne est désactivé" }
