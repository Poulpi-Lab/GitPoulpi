mouse_gestures_in_7 = "les indices redimensionner / pointeur / main ouverte sont envoyés via OSC 22 aux terminaux qui le gèrent (kitty, Ghostty, foot, mintty ; pas dans Rio, Alacritty, Windows Terminal ni iTerm2) ; les séparations déplaçables et limites de colonne s'éclairent aussi dans l'affichage de l'appli, sans aucune coopération du terminal"
