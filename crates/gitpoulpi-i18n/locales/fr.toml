undo_enabled_help = { git = "Activée, Annuler et Rétablir peuvent défaire des {$commits}, le stage, les abandons de modifications et les changements de branches. Désactivée, GitPoulpi ne fait aucun travail d'annulation (paramètre le plus rapide) et les boutons de la barre d'outils disparaissent. La désactiver efface l'historique d'annulation de tous les dépôts.", local = "Activée, Annuler et Rétablir peuvent défaire des {$commits}, l'indexation, les abandons de modifications et les changements de branches. Désactivée, GitPoulpi ne fait aucun travail d'annulation (paramètre le plus rapide) et les boutons de la barre d'outils disparaissent. La désactiver efface l'historique d'annulation de tous les dépôts." }
undo_depth = "Profondeur de l'historique"
undo_depth_help = "Nombre d'opérations que l'annulation peut remonter. 0 signifie illimité."
journal_outside = "Enregistrer les changements faits hors de GitPoulpi"
journal_outside_help = "Activé, ce qu'un terminal ou un agent IA fait aux branches, aux {$tags}, aux {$stashes} et à {$head} apparaît dans l'historique d'annulation, marqué comme extérieur, et Ctrl+Z peut l'annuler. Les modifications de fichiers dans l'arbre de travail ne sont jamais capturées. Nécessite que l'annulation soit activée."
remember_tabs = "Mémoriser les onglets"
remember_tabs_help = "Activé, les onglets ouverts à la dernière fermeture d'une session sont rouverts au lancement suivant. Désactivé, un lancement démarre sur un seul onglet : le dépôt visé. Lu une seule fois au démarrage ; nécessite un redémarrage."
radar_enabled = "Activer le Radar"
radar_enabled_help = "Désactivé, l'onglet Radar, ses commandes et son raccourci sont masqués et rien n'est récupéré pour lui en arrière-plan. S'applique immédiatement."
startup_tab_in_repo = "Onglet de démarrage dans un dépôt"
startup_tab_in_repo_help = "L'onglet sur lequel s'ouvre un démarrage lorsque le dossier de lancement se trouve dans un dépôt. Dépôt courant ouvre l'onglet de ce dépôt, ouvert si besoin. Dernier onglet ouvre l'onglet actif à la dernière fermeture (Accueil si Mémoriser les onglets est désactivé). Un dépôt donné avec --repo ouvre toujours son propre onglet. Lu une seule fois au démarrage ; nécessite un redémarrage."
startup_tab_outside_repo = "Onglet de démarrage hors d'un dépôt"
startup_tab_outside_repo_help = "L'onglet sur lequel s'ouvre un démarrage lorsque le dossier de lancement n'est pas un dépôt, un dossier personnel par exemple. Dernier onglet ouvre l'onglet actif à la dernière fermeture (Accueil si Mémoriser les onglets est désactivé ou si rien n'est mémorisé). Radar ouvre Accueil si le Radar est désactivé. Lu une seule fois au démarrage ; nécessite un redémarrage."
startup_tab_launcher = "Onglet de démarrage depuis le lanceur"
startup_tab_launcher_help = "L'onglet sur lequel s'ouvre un démarrage lorsque GitPoulpi est lancé depuis son raccourci du bureau ou du menu Démarrer (voir Lanceur plus bas), quel que soit le dossier. Prioritaire sur les deux réglages ci-dessus ; Dernier onglet et Radar se comportent comme ci-dessus. Lu une seule fois au démarrage ; nécessite un redémarrage."
group_worktree_tabs = { git = "Regrouper les onglets de worktrees", local = "Regrouper les onglets d'arbres de travail" }
group_worktree_tabs_help = { git = "Les onglets des worktrees liés d'un dépôt se placent juste après l'onglet de ce dépôt, et un onglet de worktree déplacé ailleurs revient se coller à lui. Désactivé, les onglets restent où vous les mettez. L'activer regroupe les onglets ouverts.", local = "Les onglets des arbres de travail liés d'un dépôt se placent juste après l'onglet de ce dépôt, et un onglet d'arbre de travail déplacé ailleurs revient se coller à lui. Désactivé, les onglets restent où vous les mettez. L'activer regroupe les onglets ouverts." }
allow_agent_view_control = "Laisser les agents IA piloter la vue"
allow_agent_view_control_help = { git = "Activé, un agent IA (via MCP ou `gitpoulpi ui`) peut demander à cette fenêtre d'afficher un {$commit}, un fichier ou un avis. Il ne modifie jamais rien dans le dépôt. Désactivé, cette fenêtre ne les accepte pas. Lu à l'ouverture d'une fenêtre.", local = "Activé, un agent IA (via MCP ou `gitpoulpi ui`) peut demander à cette fenêtre d'afficher une {$commit}, un fichier ou un avis. Il ne modifie jamais rien dans le dépôt. Désactivé, cette fenêtre ne les accepte pas. Lu à l'ouverture d'une fenêtre." }
allow_ui_propose = "Laisser les agents IA proposer des modifications à confirmer"
allow_ui_propose_help = { git = "Activé, un agent IA peut ouvrir une boîte de dialogue préremplie : un nouveau message de {$commit}, un message dans le compositeur, une nouvelle branche ou un nouveau {$tag}. Elle est marquée ✦ Proposé par <agent> et rien ne change tant que vous n'appuyez pas sur la confirmation de la boîte ; Esc la rejette. Désactivé (par défaut), `ui propose` et les outils MCP ui_propose_* sont refusés.", local = "Activé, un agent IA peut ouvrir une boîte de dialogue préremplie : un nouveau message de {$commit}, un message dans le compositeur, une nouvelle branche ou une nouvelle {$tag}. Elle est marquée ✦ Proposé par <agent> et rien ne change tant que vous n'appuyez pas sur la confirmation de la boîte ; Esc la rejette. Désactivé (par défaut), `ui propose` et les outils MCP ui_propose_* sont refusés." }
clone_root = "Dossier de clonage par défaut"
clone_root_help = "Point de départ du champ « Cloner vers » de la boîte de clonage. Vide : le dossier par défaut de l'OS, %USERPROFILE%\\source\\repos sous Windows, ~/src ailleurs."
# context: setting: which source the Clone dialog opens on (Last used, Clone with URL, or an integration)
clone_start_source = "La boîte Cloner s'ouvre sur"
clone_start_source_help = "La source sur laquelle s'ouvre la boîte Cloner. Dernière utilisée rouvre celle qu'elle affichait à sa dernière fermeture ; Cloner par URL démarre toujours sur le formulaire d'URL ; ou choisissez l'une de vos intégrations connectées. Une source qui n'est plus disponible revient à Cloner par URL."
# context: option of the "Clone dialog starts on" setting: the source shown when the dialog was last closed
clone_start_last = "Dernière utilisée"
browse_root = "Dossier de navigation par défaut"
browse_root_help = "Où s'ouvre Parcourir (le sélecteur de dossier de l'onglet Accueil) par défaut. Vide : Parcourir s'ouvre sur le dernier dossier choisi, ou sur le dossier personnel la toute première fois, plutôt que sur un dossier fixe."
heading_auto_stash = "Auto-{$stash}"
heading_log = "Journal de l'application"
heading_undo = "Historique d'annulation"
log_level = "Niveau du journal"
log_retention_days = "Durée de conservation des journaux"
# context: setting help: how long log files are kept; a number and a unit (days, weeks, months, years) on one line
log_retention_help = "Les anciens fichiers journaux sont supprimés au démarrage de GitPoulpi. Le fichier de chaque jour est aussi plafonné par le paramètre de taille ci-dessous."
# context: setting: where the data GitPoulpi keeps for one repository lives (ref filters, fold state, workflow, caches)
repo_data_location = "Emplacement des données du dépôt"
# context: help of the setting above
repo_data_location_help = "Où sont stockées les données propres à chaque dépôt (filtres de références, workflow, caches). Le dossier .git garde l'arbre de travail propre ; changer ce paramètre migre les données existantes."
# context: option of the repository data location: inside the repository's .git folder
repo_data_in_git_dir = "Dans .git (dossier gitpoulpi)"
# context: option of the repository data location: a .gitpoulpi folder in the working tree
repo_data_in_worktree = "Dans l'arbre de travail (dossier .gitpoulpi)"
# context: option of the repository data location: the user's own data folder
repo_data_user_data = "Dans mon dossier de données utilisateur (hors du dépôt)"
log_max_file_mb = "Taille maximale d'un fichier journal"
log_timings = "Afficher la durée des opérations"
log_timings_help = "Ajoute la durée en millisecondes à chaque opération du journal d'activité (onglet Opérations Git)."
log_extended = "Journalisation étendue"
log_extended_help = { git = "Liste aussi les opérations en arrière-plan (auto-{$fetch}, actualisation, suivi de l'état) avec leur durée.", local = "Liste aussi les opérations en arrière-plan (récupération automatique, actualisation, suivi de l'état) avec leur durée." }
# context: setting: how the status line counts the total commits (the dropdown choices are in settings_value)
commit_count = "Compter le total des {$commits} avec"
# context: help of the setting above; mentions antivirus software
commit_count_help = "Comment la ligne d'état obtient le total de « chargés / total ». « Git système » lance un processus git (le plus rapide en général). « libgit2 » compte dans GitPoulpi sans lancer de processus : à choisir quand un antivirus analyse chaque commande et ralentit git. Désactivé, seuls les {$commits} chargés sont affichés. S'applique immédiatement."
auto_stash = { git = "Auto-{$stash} avant un checkout, un {$pull}, un {$merge} ou un {$rebase}", local = "Auto-{$stash} avant un basculement, un tirage, une fusion ou un rebasage" }
auto_stash_help = { git = "Que faire quand un checkout, un {$pull}, un {$merge} ou un {$rebase} est bloqué par des modifications locales. demander : une boîte propose de les stasher, d'exécuter l'opération puis de les restaurer ; toujours : le faire sans demander ; jamais : refuser, comme le fait git.", local = "Que faire quand un basculement, un tirage, une fusion ou un rebasage est bloqué par des modifications locales. demander : une boîte propose de les remiser, d'exécuter l'opération puis de les restaurer ; toujours : le faire sans demander ; jamais : refuser, comme le fait git." }
include_untracked_in_autostash = "Inclure les fichiers non suivis dans l'auto-{$stash}"
include_untracked_in_autostash_help = { git = "Indique si le stash automatique prend aussi les fichiers non suivis (sinon seules les modifications suivies sont stashées puis restaurées).", local = "Indique si le remisage automatique prend aussi les fichiers non suivis (sinon seules les modifications suivies sont remisées puis restaurées)." }
hosting_refresh_minutes = "Actualisation des {$prs} et des tickets"
hosting_refresh_minutes_help = { git = "Fréquence à laquelle les listes {$prs} et Tickets du volet latéral (et la pastille de {$pr} liée de la barre d'outils) interrogent à nouveau l'hébergeur. 0 coupe le minuteur ; elles s'actualisent quand même à l'ouverture d'un dépôt, au changement de branche, après un {$push} ou un {$fetch}, et à la demande.", local = "Fréquence à laquelle les listes {$Prs} et Tickets du volet latéral (et la pastille de {$pr} liée de la barre d'outils) interrogent à nouveau l'hébergeur. 0 coupe le minuteur ; elles s'actualisent quand même à l'ouverture d'un dépôt, au changement de branche, après un envoi ou une récupération, et à la demande." }
pr_terminology = "Terme pour les demandes de revue"
pr_terminology_help = "Le mot employé pour une demande de revue de code hébergée, partout dans la TUI. Auto suit l'hébergeur du dépôt : Merge request pour GitLab, Pull request pour les autres. Pull request ou Merge request impose ce mot. S'applique immédiatement."
hide_finished_pr_chip = { git = "Masquer la pastille de {$pr} quand elle est fermée ou mergée", local = "Masquer la pastille de {$pr} quand elle est fermée ou fusionnée" }
hide_finished_pr_chip_help = { git = "La pastille de la barre d'outils affiche la dernière {$pr} de la branche extraite. Activé, elle est masquée dès que cette {$pr} est fermée ou mergée, et la branche propose la pastille discrète \"+ {$pr_abbr}\" comme si elle n'en avait aucune. Désactivé, la pastille affiche toujours la dernière {$pr}, quel que soit son état. S'applique immédiatement.", local = "La pastille de la barre d'outils affiche la dernière {$pr} de la branche extraite. Activé, elle est masquée dès que cette {$pr} est fermée ou fusionnée, et la branche propose la pastille discrète \"+ {$pr_abbr}\" comme si elle n'en avait aucune. Désactivé, la pastille affiche toujours la dernière {$pr}, quel que soit son état. S'applique immédiatement." }
heading_external_tools = "Outils externes"
external_editor = "Éditeur externe"
external_editor_help = "Commande de l'entrée de menu « Ouvrir dans <éditeur> » d'un fichier ; {{file}} est le chemin complet du fichier (ajouté s'il est absent). Vide : VS Code (`code`) s'il est dans le PATH, sinon le programme par défaut du système."
external_diff_tool = "Outil de {$diff} externe"
external_diff_tool_help = { git = "Commande de « Ouvrir dans l'outil de {$diff} externe » ; {{local}} est la version commitée (ou staged), {{remote}} la version comparée. Vide : `git difftool`, avec le `diff.tool` configuré dans git.", local = "Commande de « Ouvrir dans l'outil de {$diff} externe » ; {{local}} est la version validée (ou indexée), {{remote}} la version comparée. Vide : `git difftool`, avec le `diff.tool` configuré dans git." }
external_merge_tool = { git = "Outil de merge externe", local = "Outil de fusion externe" }
external_merge_tool_help = { git = "Commande de « Ouvrir dans l'outil de merge externe » sur une carte de conflit ; {{base}}, {{local}} (A, courant), {{remote}} (B, entrant) et {{merged}} (où l'outil écrit le résultat ; staged s'il se termine avec succès). Vide : `git mergetool`, avec le `merge.tool` configuré dans git.", local = "Commande de « Ouvrir dans l'outil de fusion externe » sur une carte de conflit ; {{base}}, {{local}} (A, courant), {{remote}} (B, entrant) et {{merged}} (où l'outil écrit le résultat ; indexé s'il se termine avec succès). Vide : `git mergetool`, avec le `merge.tool` configuré dans git." }
file_explorer = "Explorateur de fichiers"
file_explorer_help = "Commande de « Afficher dans le dossier » ; {{path}} est le chemin complet du fichier, {{dir}} son dossier. Windows : explorer.exe /select,\"{{path}}\" sélectionne le fichier ; Linux : xdg-open \"{{dir}}\" ; macOS : open -R \"{{path}}\"."
ai_assistant = "Assistant IA"
launch = "Ouvrir une fenêtre pour les agents"
launch_help = "Quand un agent IA demande d'afficher quelque chose et qu'aucune fenêtre GitPoulpi n'est ouverte, lance ceci pour en ouvrir une : désactivé (jamais, par défaut), un terminal (kitty, foot, WezTerm, Windows Terminal, ...), un nouvel onglet/volet/espace de travail d'un multiplexeur (tmux, zellij, cmux, ...) ou custom, qui utilise le modèle ci-dessous. L'agent doit quand même le demander (`--launch`), ou son ui_control doit valoir auto. Pris en compte à la requête suivante."
launch_command = "Commande de lancement (custom)"
launch_command_help = "Utilisée quand le choix ci-dessus est custom. Découpée en arguments (guillemets '...' ou \"...\"), sans shell. {{repo}} est le dossier du dépôt, {{session}} le nom de la session et {{gitpoulpi}} ce programme. Exemple : kitty --directory {{repo}} {{gitpoulpi}} --session {{session}}"
tab_dir_follow = "Suivre le dossier de l'onglet actif"
tab_dir_follow_help = "Un programme ne peut pas changer le dossier de son shell ; deux moyens d'y arriver sont donc proposés. boutons (par défaut) : tant que l'onglet actif n'est pas le dossier où GitPoulpi a démarré, la barre d'onglets montre Quitter & cd ici (seulement via le script d'enrobage du shell, voir `gitpoulpi shell-init`). auto : pas de boutons ; quitter fait toujours un cd vers l'onglet actif, et un terminal s'ouvre seul à chaque nouvel onglet (pas pour les onglets restaurés au démarrage)."
forget_all_usernames_and_passwords = "Oublier tous les noms d'utilisateur et mots de passe"
forget_all_usernames_and_passwords_help = "Supprime tous les jetons que GitPoulpi a stockés dans votre gestionnaire d'identifiants."
mcp_server = "Serveur MCP"
mcp_server_help = "Activé, un agent IA peut démarrer le serveur MCP (`gitpoulpi mcp serve`, ou `--http` pour le point d'accès réseau). Désactivé, il refuse de démarrer. Enregistré dans `mcp.enabled`. Le changement s'applique au prochain démarrage du serveur par un agent ; un serveur déjà lancé garde ses réglages."
mcp_port = "Port du serveur MCP"
mcp_port_help = "Le port d'écoute de `gitpoulpi mcp serve --http` quand aucune adresse n'est donnée (la partie hôte de `mcp.bind` est conservée, 127.0.0.1 par défaut, boucle locale seulement sans --allow-remote). S'applique au prochain démarrage du serveur par un agent ; un serveur déjà lancé garde son port."
mcp_bind_unreadable = "`mcp.bind` vaut « {bind} », sans port lisible. Régler un port ici conserve son hôte et remplace le reste."
undo_off_note = "Annulation désactivée - activez « Annulation activée » pour régler la profondeur"
use_mailmap = "Afficher les auteurs d'après .mailmap"
use_mailmap_help = { git = "Affiche chaque auteur sous le nom que le fichier .mailmap du dépôt lui donne, dans le journal, le blame et l'historique d'un fichier. Les commits eux-mêmes ne changent pas. S'applique tout de suite.", local = "Affiche chaque auteur sous le nom que le fichier .mailmap du dépôt lui donne, dans le journal, le blame et l'historique d'un fichier. Les validations elles-mêmes ne changent pas. S'applique tout de suite." }
auto_prune_tags = { git = "Élagage automatique des tags", local = "Élagage automatique des étiquettes" }
auto_prune_tags_help = { git = "À chaque fetch, supprime aussi les tags locaux que le distant a supprimés. Seuls les tags qui étaient sur le distant sont concernés : un tag jamais envoyé est conservé. Désactivé par défaut, comme git.", local = "À chaque récupération, supprime aussi les étiquettes locales que le distant a supprimées. Seules les étiquettes qui étaient sur le distant sont concernées : une étiquette jamais envoyée est conservée. Désactivé par défaut, comme git." }

