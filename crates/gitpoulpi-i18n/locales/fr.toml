step_switch_azure = "Puis, dans Repos > Branches, utilisez le menu de la nouvelle branche > Set as default branch, et supprimez l'ancienne quand plus personne ne l'utilise."
step_switch_bitbucket = "Puis, dans les réglages du dépôt > Repository details, faites de la nouvelle branche la branche principale (la branche par défaut sur Data Center), et supprimez l'ancienne quand plus personne ne l'utilise."
