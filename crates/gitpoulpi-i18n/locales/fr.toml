# context: help under that number
review_threads_help = "Les commentaires déjà présents sont listés pour que le modèle ne les répète pas. Au-delà de cette taille, la liste est coupée, après que l'on vous a demandé : tout envoyer, l'envoyer tronquée, ouvrir ce paramètre ou annuler. 6000 par défaut."
