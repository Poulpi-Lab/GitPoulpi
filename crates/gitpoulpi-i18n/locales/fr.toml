# context: action: send the local commits to the remote
action_push = "{$Push}"
# context: action: move the local branch forward to the remote's commit; {remote} is the remote
action_fast_forward = "Avance rapide depuis {remote}"
# context: action: combine the remote's commits into the local branch, then send; {remote} is the remote
action_merge = "{$Merge} depuis {remote}"
# context: action: replay the local commits on top of the remote's, then send; {remote} is the remote
action_rebase = "{$Rebase} sur {remote}"
# context: action: overwrite the remote's branch, refused if it moved since the plan
action_force = { git = "Push forcé (lease)", local = "Envoi forcé (lease)" }
# context: action: leave this remote out
action_skip = "Ignorer"
# context: line under a row whose merge would conflict; {n} is the number of files, {files} their names
conflicts = { one = "La {$merge_noun} entrerait en conflit dans {n} fichier : {files}", other = "La {$merge_noun} entrerait en conflit dans {n} fichiers : {files}" }
# context: checkbox: also send the tags that no remote has yet
tags = "{$Push} aussi les {$tags} pas encore envoyés"
# context: summary line under the table; {steps} is the list of steps
then_line = "Ensuite : {steps}."
# context: summary line when every row is skipped or already up to date
then_nothing = "Ensuite : rien à faire."
# context: separator between steps in the summary line
then_join = ", "
# context: step of the summary line; {remote} is the remote
step_fast_forward = "avance rapide depuis {remote}"
# context: step of the summary line; {remote} is the remote
step_merge = "{$merge} de {remote}"
# context: step of the summary line; {remote} is the remote
step_rebase = "{$rebase} sur {remote}"
# context: step of the summary line; {n} is the number of remotes
step_push = { one = "{$push} vers {n} distant", other = "{$push} vers {n} distants" }
# context: warning under the summary when a row force-pushes; {n} is the number of commits that disappear, {remote} the remote
force_note = { one = "Le {$push_noun} forcé remplace {n} {$commit} sur {remote}.", other = "Le {$push_noun} forcé remplace {n} {$commits} sur {remote}." }
# context: warning under the summary when rows rebase while other remotes already hold the local commits; {remotes} are those remotes
rebase_warn = "Un {$rebase_noun} réécrit les {$commits} locaux : {remotes} aura ensuite besoin d'un {$push_noun} forcé."
# context: confirmation question before a force push; {n} is the number of remote commits replaced, {branch} the branch, {remotes} the remote names
force_confirm = { one = { git = "Push forcé de {branch} vers {remotes} ?\nAvec lease : {n} {$commit} du distant est remplacé. Non annulable.", local = "Envoi forcé de {branch} vers {remotes} ?\nAvec lease : {n} validation du distant est remplacée. Non annulable." }, other = { git = "Push forcé de {branch} vers {remotes} ?\nAvec lease : {n} {$commits} des distants sont remplacés. Non annulable.", local = "Envoi forcé de {branch} vers {remotes} ?\nAvec lease : {n} validations des distants sont remplacées. Non annulable." } }
# context: button: ask the remotes again
btn_fetch_again = "{$Fetch} à nouveau"
# context: button: set every row that has a problem to Skip
btn_skip_problems = "Ignorer les problèmes"
# context: button: close the dialog without running
btn_cancel = "Annuler"
# context: button: run the grouped push
btn_run = "Lancer"
# context: button: go to the next step
btn_next = "Suivant"
# context: button: close the dialog (the run goes on)
btn_close = "Fermer"
# context: button: try the failed remotes again
btn_retry = "Réessayer les échecs"
# context: progress row: the remote took the commits
run_pushed = "envoyé"
# context: progress row: the remote got a new branch
run_created = "créé"
# context: progress row: nothing to send
run_up_to_date = "à jour"
# context: progress row: the local branch moved forward
run_fast_forwarded = "avancé"
# context: progress row: the remote's commits were combined into the local branch with a new commit
run_merged = "combiné"
# context: progress row: the local commits were replayed on the remote's
run_rebased = "rejoué"
# context: progress row: the remote's commits were taken in
run_integrated = "intégré"
# context: progress row: left out
run_skipped = "ignoré"
# context: progress row: the remote's commits are being combined with the local branch
run_merging = "combinaison"
# context: progress row: sending in progress
run_pushing = "envoi"
# context: progress row: not started yet
run_waiting = "en attente"
# context: progress row: failed; {why} is the reason
run_failed = "échec : {why}"
# context: progress row: the remote refused; {why} is the reason
run_rejected = "refusé : {why}"
# context: progress row: the run was canceled while this remote was in flight
run_unknown = "inconnu (annulé)"
# context: progress row: the remote is not configured
run_missing = "distant absent"
# context: line under the progress rows while the run is going
run_going = "Fermer cette fenêtre n'arrête pas l'opération."
# context: line under the progress rows when the run ended well
run_done = "Terminé."
# context: line under the progress rows when some remotes failed
run_problems = "Certains distants ont échoué. Réessayez-les, ou fermez."
# context: key hints of the selection step
hint_select = "Haut/Bas déplacer  Espace cocher  m mémoriser  Entrée suivant  Échap fermer"
# context: key hints of the plan step
hint_plan = "Haut/Bas ligne  Gauche/Droite action  Entrée liste  s ignorer  t {$tags}  f relancer  Ctrl+Entrée lancer  Échap fermer"
# context: key hints of the progress step
hint_run = "Échap fermer  r réessayer"
# context: text of the strip over the Log while a grouped push waits for the conflicts of a remote to be resolved; {remote} is that remote
strip_waiting = { git = "Push groupé en pause ({remote}) : résolvez et concluez, puis Continuer.", local = "Envoi groupé en pause ({remote}) : résolvez et concluez, puis Continuer." }
# context: text of the strip when the conflicts are resolved and the run can go on; {remote} is that remote
strip_ready = { git = "Push groupé en pause ({remote}) : résolu. Continuez le push.", local = "Envoi groupé en pause ({remote}) : résolu. Continuez l'envoi." }
# context: strip button: go on with the grouped push
strip_continue = "Continuer"
# context: strip button: abort the merge or rebase of the grouped push and drop it
strip_abort = "Abandonner le groupe"
# context: status line after the grouped push was aborted
aborted = { git = "Push groupé abandonné.", local = "Envoi groupé abandonné." }
# context: status line while a grouped push runs
running = { git = "Push groupé...", local = "Envoi groupé..." }
# context: question before aborting a paused grouped push; {branch} is the local branch, {remote} the remote whose merge or rebase stopped
abort_confirm = { git = "Abandonner le push groupé de {branch} (arrêté sur {remote}) ?\nLe merge ou rebase en cours est annulé. Ce qui est déjà envoyé reste.", local = "Abandonner l'envoi groupé de {branch} (arrêté sur {remote}) ?\nLa fusion ou le rebasage en cours est annulé. Ce qui est déjà envoyé reste." }
[multi_remote]
state_new = "nouveau"
state_gone = "absent"
state_unrelated = "sans lien"
tip_title = "Distants de {branch}"
tip_in_sync = "{remote} : à jour"
tip_ahead = "{remote} : {n} en avance"
tip_behind = "{remote} : {n} en retard"
tip_diverged = "{remote} : a divergé ({ahead} en avance, {behind} en retard)"
tip_new = "{remote} : pas encore de copie de cette branche"
tip_unrelated = "{remote} : aucun historique commun"
tip_gone = "{remote} : n'est plus configuré"
tip_open_hint = "Cliquez pour modifier les distants de cette branche"
