# S23: what the host protects, and the three ways through it. Never done
# automatically: these are instructions. The git words are terms ({$push},
# {$tag}, {$prs}) so "Translate git terms" works here too; the exact commands
# are in the English CLI text, not here.
[rewrite_host]
protected_on = "protégée sur {provider}"
btn_howto = "Comment contourner"
title = "Contourner la protection de l'hébergeur"
intro = "L'hébergeur refuse l'historique réécrit de {names} parce que {provider} la protège. GitPoulpi ne modifie jamais les réglages de l'hébergeur à votre place ; il y a trois façons de la contourner, de la moins à la plus radicale."
unknown = "La protection de l'hébergeur n'a pas pu être lue : {why}"
