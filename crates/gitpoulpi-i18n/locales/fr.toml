sidebar_sections_scope_help = "À qui appartient le choix des sections affichées ou masquées du volet gauche. repository : chaque dépôt garde son propre choix (le choix global est son point de départ). global : un seul choix pour tous les dépôts. Basculer ne fait perdre aucun des deux choix."
