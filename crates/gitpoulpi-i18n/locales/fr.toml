# context: help under that number
review_file_help = { git = "Au-delà de cette taille, le {$diff} d'un fichier dans une revue de code est coupé, après que l'on vous a demandé : tout envoyer, l'envoyer tronqué, ouvrir ce paramètre ou annuler. 12000 par défaut.", local = "Au-delà de cette taille, la {$diff} d'un fichier dans une revue de code est coupée, après que l'on vous a demandé : tout envoyer, l'envoyer tronquée, ouvrir ce paramètre ou annuler. 12000 par défaut." }
# context: Settings > AI, label of a number: the most bytes of the description of the reviewed request
