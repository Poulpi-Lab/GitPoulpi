refs_unknown = "Protection de l'hébergeur inconnue : {why}"
any_branch = "la branche protégée"
way_lift = "1. Lever temporairement la protection dans les réglages de l'hébergeur"
way_rename = { git = "2. Faire un {$push} de la réécriture sous un nouveau nom de branche, puis changer la branche par défaut", local = "2. {$Push} la réécriture sous un nouveau nom de branche, puis changer la branche par défaut" }
way_recreate = "3. En dernier recours : supprimer puis recréer le dépôt distant"
step_lift_github = { git = "Ouvrez Settings > Branches (règles de protection de branche) et Settings > Rules (rulesets) du dépôt, supprimez ou assouplissez la règle qui couvre la branche, faites un {$push} de la réécriture, puis remettez la règle.", local = "Ouvrez Settings > Branches (règles de protection de branche) et Settings > Rules (rulesets) du dépôt, supprimez ou assouplissez la règle qui couvre la branche, poussez la réécriture, puis remettez la règle." }
step_lift_gitlab = "Ouvrez Settings > Repository > Protected branches, retirez la protection de la branche (ou activez l'option qui permet d'en réécrire l'historique), puis protégez-la de nouveau une fois la réécriture envoyée."
step_lift_azure = { git = "Ouvrez Project settings > Repositories > le dépôt > Policies, supprimez la stratégie de branche et, dans Security, accordez-vous la permission de réécrire l'historique et de supprimer des branches, faites un {$push} de la réécriture, puis rétablissez les deux.", local = "Ouvrez Project settings > Repositories > le dépôt > Policies, supprimez la stratégie de branche et, dans Security, accordez-vous la permission de réécrire l'historique et de supprimer des branches, poussez la réécriture, puis rétablissez les deux." }
step_lift_bitbucket = { git = "Ouvrez les réglages du dépôt > Branch restrictions (Branch permissions sur Data Center), supprimez la restriction qui couvre la branche, faites un {$push} de la réécriture, puis rétablissez-la.", local = "Ouvrez les réglages du dépôt > Branch restrictions (Branch permissions sur Data Center), supprimez la restriction qui couvre la branche, poussez la réécriture, puis rétablissez-la." }
step_lift_other = { git = "Supprimez ou assouplissez la règle de protection de branche dans les réglages du dépôt chez l'hébergeur, faites un {$push} de la réécriture, puis rétablissez la règle.", local = "Supprimez ou assouplissez la règle de protection de branche dans les réglages du dépôt chez l'hébergeur, poussez la réécriture, puis rétablissez la règle." }
step_push_new_name = { git = "Faites le {$push} de la réécriture vers une branche non protégée, sous un nouveau nom (GitPoulpi ne touche pas à la référence protégée).", local = "Poussez la réécriture vers une branche non protégée, sous un nouveau nom (GitPoulpi ne touche pas à la référence protégée)." }
step_switch_github = "Puis, dans Settings > Branches, faites de la nouvelle branche la branche par défaut (ou renommez d'abord l'ancienne avec Settings > Branches > le crayon > Rename), et supprimez l'ancienne branche quand plus personne ne l'utilise."
