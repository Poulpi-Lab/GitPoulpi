default_entry_help = "L'éditeur lancé par « Éditer avec » par défaut. Il est marqué dans la liste Éditer avec."
command_help = "Découpée en arguments (guillemets '...' ou \"...\"), sans shell. Variables : ${{file}} l'image (une copie en lecture seule si ce n'est pas le fichier de l'arbre de travail), ${{dir}} son dossier, ${{name}} son nom de fichier, ${{repo}} la racine du dépôt, ${{env:NAME}} une variable d'environnement. Exemple : gimp ${{file}}"
test = "Tester avec une image d'exemple"
test_help = "Ouvre maintenant un petit PNG généré avec cet éditeur."
restore_help = "Remplace la liste par les éditeurs détectés sur cette machine et efface le défaut."
saved = "Éditeurs d'images enregistrés"
tested = "Ouverture d'une image d'exemple dans « {label} »..."

[settings_ssh]
private_key_path = "Chemin de la clé privée"
private_key_path_help = { git = "Fichier de clé que {$fetch}, {$pull}, {$push} et clone proposent à ssh (ssh -i <clé> -o IdentitiesOnly=yes). Vide : ssh-agent et votre config ssh comme d'habitude. Sans effet quand un dépôt choisit sa propre clé (SSH et identifiants), ou quand GIT_SSH_COMMAND ou core.sshCommand est défini. S'applique au prochain transfert.", local = "Fichier de clé que la récupération, le tirage, l'envoi et le clonage proposent à ssh (ssh -i <clé> -o IdentitiesOnly=yes). Vide : ssh-agent et votre config ssh comme d'habitude. Sans effet quand un dépôt choisit sa propre clé (SSH et identifiants), ou quand GIT_SSH_COMMAND ou core.sshCommand est défini. S'applique au prochain transfert." }
public_key_path = "Chemin de la clé publique"
public_key_path_help = "Utilisé seulement si le chemin de la clé privée est vide : ssh choisit alors la clé correspondante détenue par ssh-agent (ou une clé matérielle) au lieu de proposer toutes les clés de l'agent. Générer une paire de clés remplit les deux. Même priorité que le chemin de la clé privée."
key_type = "Type de clé"
heading_https_credentials = "Identifiants HTTPS"
https_mode = "Identifiants HTTPS"
https_mode_help = { git = "Comment {$fetch}, {$pull}, {$push} et clone s'authentifient en HTTPS. credential_helper : l'assistant propre à git (Git Credential Manager, libsecret, Keychain). prompt : ignorer tout assistant et laisser git demander dans un terminal. aucun : aucun identifiant, distants publics uniquement. S'applique au prochain transfert.", local = "Comment la récupération, le tirage, l'envoi et le clonage s'authentifient en HTTPS. credential_helper : l'assistant propre à git (Git Credential Manager, libsecret, Keychain). prompt : ignorer tout assistant et laisser git demander dans un terminal. aucun : aucun identifiant, distants publics uniquement. S'applique au prochain transfert." }
heading_keys = "Clés"
generate_key_pair = "Générer une paire de clés"
generate_key_pair_help = "Génère une paire de clés ed25519 en interne (sans ssh-keygen, sans phrase secrète) dans ~/.ssh/gitpoulpi_ed25519, sans jamais écraser un fichier, et enregistre les deux chemins ci-dessus. Ajoutez la clé publique à un hébergeur depuis Intégrations."

[settings_editor]
tab_size = "Taille de tabulation"
tab_size_help = "Colonnes entre deux taquets, dans l'éditeur intégré (dessin, Shift+Tab) et dans les vues de {$diff}. La vue blame dessine une tabulation comme une espace et l'ignore."
eol = "Fin de ligne"
eol_help = "Ce qu'écrit l'éditeur intégré à l'enregistrement. Auto garde la fin de ligne du fichier (LF pour un nouveau fichier) ; LF ou CRLF convertit le fichier à l'enregistrement. La ligne d'état de l'éditeur montre ce que le prochain enregistrement écrira."
syntax_highlighting = "Coloration syntaxique"
syntax_highlighting_help = "Colore l'éditeur intégré selon le langage. Les vues de {$diff} et la vue blame ne sont pas colorées syntaxiquement."
line_numbers = "Numéros de ligne"
line_numbers_help = "La colonne des numéros de l'éditeur intégré et des vues de {$diff} (elle y est vide, les colonnes gardent leur place). La vue blame n'en a pas."
follow_selection = "Suivre la sélection dans l'éditeur"
follow_selection_help = "Tant que l'éditeur est ouvert, sélectionner un autre fichier dans le volet de droite l'ouvre aussi dans l'éditeur, après avoir proposé d'enregistrer les modifications non sauvegardées. Un fichier qui ne peut pas être édité s'ouvre dans sa vue habituelle."
merge_side_by_side_min_width = { git = "Éditeur de merge : côte à côte dès (colonnes)", local = "Éditeur de fusion : côte à côte dès (colonnes)" }
merge_side_by_side_min_width_help = { git = "L'éditeur de conflits de merge montre A et B côte à côte quand sa zone fait au moins ce nombre de colonnes (les longues lignes défilent latéralement avec Shift+molette ou Shift+flèches) ; plus étroit, il montre un côté à la fois derrière des onglets. 100 par défaut ; 40 est le minimum, 0 signifie toujours côte à côte. L'éditeur masque les panneaux Refs et Status tant qu'il est ouvert, il a donc le plus souvent toute la fenêtre.", local = "L'éditeur de conflits de fusion montre A et B côte à côte quand sa zone fait au moins ce nombre de colonnes (les longues lignes défilent latéralement avec Shift+molette ou Shift+flèches) ; plus étroit, il montre un côté à la fois derrière des onglets. 100 par défaut ; 40 est le minimum, 0 signifie toujours côte à côte. L'éditeur masque les panneaux Refs et Status tant qu'il est ouvert, il a donc le plus souvent toute la fenêtre." }
diff_word_wrap = "Retour à la ligne"
diff_word_wrap_help = "Coupe les longues lignes des vues de {$diff} au lieu de les tronquer avec une ellipse. L'éditeur intégré et la vue blame défilent latéralement sans retour à la ligne. C'est aussi le commutateur propre à la vue de {$diff}."

[settings_ui]
theme = "Thème"
theme_help = "Couleurs de toute l'interface. Parcourir la liste affiche un aperçu de chaque thème ; Enter garde le thème, Esc revient en arrière. Système suit le terminal (son fond clair ou sombre, détecté une fois au démarrage ; Sombre s'il ne peut pas être déterminé). Vos propres fichiers de thème du dossier themes/ de la configuration sont listés en dernier."
theme_system = "Système (suit le terminal)"
follow_theme = "Suivre le thème"
theme_swatches = "Couleurs"
graph_lane_background = "Fond des voies du graphe"
graph_lane_background_help = { git = "Désactivé : transparent, rien derrière les voies (par défaut). Teinte de ligne : une bande légère de la couleur de voie du {$commit} dans la colonne Graphe, plus une fine barre de cette couleur au bord droit de la colonne. Une voie enregistrée est lue comme Teinte de ligne. S'applique à la fermeture des paramètres.", local = "Désactivé : transparent, rien derrière les voies (par défaut). Teinte de ligne : une bande légère de la couleur de voie de la {$commit} dans la colonne Graphe, plus une fine barre de cette couleur au bord droit de la colonne. Une voie enregistrée est lue comme Teinte de ligne. S'applique à la fermeture des paramètres." }
graph_row_tint_strength = "Force de la teinte"
graph_row_tint_strength_help = "Intensité de la bande de teinte : Forte (l'originale), Moyenne (par défaut) ou Subtile. Seule la bande s'estompe ; la barre au bord droit garde toute sa couleur. S'applique à la fermeture des paramètres."
graph_row_tint_strength_coming = "réglez d'abord Fond des voies du graphe sur Teinte de ligne"
toolbar_position = "Position de la barre d'outils"
toolbar_position_help = "Où se place la barre d'outils : Haut, Bas (par défaut), Gauche ou Droite. Gauche et Droite en font une colonne à côté des volets ; une fenêtre de moins de 80 colonnes la dessine en bas. S'applique immédiatement."
toolbar_align = "Alignement des boutons de la barre d'outils"
toolbar_align_help = "Où se placent les boutons le long de la barre d'outils : Début (par défaut), Centre ou Fin. Le début est la gauche d'une ligne et le haut d'une colonne ; la fin est la droite et le bas. S'applique immédiatement."
# context: label of the setting that decides whether a dialog the user moved or resized keeps its place
dialog_geometry = "Mémoriser la position et la taille des dialogues"
dialog_geometry_help = "Un seul réglage pour tous les dialogues. Les dialogues peuvent être déplacés (glissez la barre de titre, ou Ctrl+N puis m) ; les grandes fenêtres peuvent aussi être redimensionnées (glissez les bordures et les coins du bas). Chaque dialogue mémorise sa propre place et sa propre taille. Pour cette session (par défaut) : conservés jusqu'à la fermeture de GitPoulpi. Enregistrés sur disque : conservés aussi au prochain lancement. Jamais : chaque dialogue s'ouvre à sa place et à sa taille par défaut. S'applique immédiatement."
toolbar_pr_pinned = "Épingler le bouton {$pr} en bout de barre"
toolbar_pr_pinned_help = "Activé (par défaut), le bouton {$pr} se place à l'extrémité de la barre d'outils (à droite, ou en bas dans une colonne), quel que soit l'alignement. Désactivé, il suit les autres boutons et s'aligne avec eux. S'applique immédiatement."
statusbar_position = "Position de la ligne d'état"
statusbar_position_help = "Où se place la ligne d'état (branche, compteurs, messages, aide des touches) : Haut, au-dessus des onglets de dépôt, ou Bas (par défaut). L'onglet Accueil garde sa propre ligne d'état en bas. S'applique immédiatement."
tabs_position = "Position de la barre d'onglets"
tabs_position_help = "Où se placent les onglets de dépôt : Haut (par défaut), Bas, ou Gauche, une liste d'un onglet par ligne au bord gauche de la fenêtre. Une fenêtre de moins de 80 colonnes les dessine en haut. À côté d'une barre d'outils en colonne, les onglets restent à l'extérieur. S'applique immédiatement."
graph_color_theme = "Thème de couleurs du graphe"
graph_color_theme_help = "La palette de couleurs des voies du graphe du Log. Suivre le thème utilise la palette du thème choisi ; toute autre entrée la remplace, on peut donc combiner n'importe quel thème avec n'importe quelle palette. S'applique à la fermeture des paramètres."
graph_renderer = "Rendu du graphe"
graph_renderer_help = "auto dessine le graphe comme une vraie image sur un terminal qui le permet, et en caractères ailleurs, y compris dans zellij et screen, qui héritent de l'environnement du terminal sans transmettre l'image, dans tmux sauf si le terminal derrière lui accepte sixel, et dans herdr sauf si son paramètre kitty_graphics est activé. image force l'image, texte la désactive. Nécessite un redémarrage."
image_protocol = "Protocole d'image"
image_protocol_help = "Comment les images (graphe, avatars) parviennent au terminal. auto : le protocole graphique de Kitty dans kitty, Ghostty et un herdr dont la configuration a kitty_graphics = true ; le protocole de Kitty aussi dans iTerm2 3.7.7 ou plus récent ; les images en ligne d'iTerm2 dans WezTerm, Rio, mintty et les iTerm2 plus anciens ; sixel (la colonne du graphe et les avatars) dans Windows Terminal, foot, Tabby, Konsole, mlterm et dans tmux quand le terminal derrière lui accepte sixel ; des caractères ailleurs. kitty, iterm2 ou sixel force ce protocole (kitty pour un herdr dont la configuration est ailleurs ; sixel pour un terminal qui le dessine sans être reconnu) ; aucun désactive les images. Nécessite un redémarrage."
kitty_keyboard = "Protocole clavier kitty"
kitty_keyboard_help = "auto demande au terminal, au démarrage et en 100 ms environ, s'il parle le protocole clavier kitty, et l'utilise si oui : les combinaisons que les terminaux classiques ne distinguent pas (Ctrl avec ponctuation, chiffres, Shift ou Enter) arrivent alors telles quelles au lieu de se confondre avec des codes de contrôle. Un terminal qui ne répond pas garde les touches classiques. désactivé ne touche jamais au mode clavier du terminal. Nécessite un redémarrage."
color_depth = "Profondeur de couleur"
color_depth_help = "auto utilise les couleurs 24 bits, sauf sur les terminaux qui ne les affichent pas (Terminal d'Apple, console Linux, ou terminal 256 couleurs sans COLORTERM), où les couleurs sont ramenées aux 256 ou 16 entrées les plus proches. truecolor, 256 et 16 imposent une profondeur. S'applique immédiatement."
text_cursor = "Curseur de texte"
text_cursor_help = "terminal place le curseur du terminal lui-même à l'emplacement du point d'insertion du champ de texte actif, en barre : les réglages de curseur de votre terminal s'appliquent et la fenêtre de candidats d'une méthode de saisie s'ouvre à cet endroit. drawn dessine le curseur propre à GitPoulpi (un bloc ou un trait de soulignement) et garde le curseur du terminal masqué. S'applique immédiatement."
graph_show_stashes = "Afficher les {$stashes} dans le graphe"
graph_show_stashes_help = { git = "Chaque {$stash} a sa propre ligne dans le Log, à sa date : une petite boîte sur une voie à côté du {$commit} d'origine, reliée par un trait pointillé. La sélectionner montre ce qu'elle a changé ; le clic droit (ou .) propose {$Pop}, {$Apply} et {$Stash_drop}. Désactivé, les {$stashes} restent dans la section STASHES seulement. Non dessinés en mode solo.", local = "Chaque {$stash} a sa propre ligne dans le Log, à sa date : une petite boîte sur une voie à côté de la {$commit} d'origine, reliée par un trait pointillé. La sélectionner montre ce qu'elle a changé ; le clic droit (ou .) propose {$Pop}, {$Apply} et {$Stash_drop}. Désactivé, les {$stashes} restent dans la section STASHES seulement. Non dessinés en mode solo." }
ref_connector = "Lien ref vers {$commit}"
ref_connector_help = { git = "Un trait fin de chaque pastille de ref de la colonne Ref au cercle de son {$commit} dans le graphe. Il ne remplit que l'espace vide : les voies qu'il croise restent au-dessus et rien ne bouge. Dessiné seulement quand la colonne Ref est juste à gauche de la colonne Graphe.", local = "Un trait fin de chaque pastille de ref de la colonne Ref au cercle de sa {$commit} dans le graphe. Il ne remplit que l'espace vide : les voies qu'il croise restent au-dessus et rien ne bouge. Dessiné seulement quand la colonne Ref est juste à gauche de la colonne Graphe." }
log_wip_counts_in_message = "Compteurs WIP dans le message si Modifs est masquée"
log_wip_counts_in_message_help = "La ligne WIP indique combien de fichiers sont modifiés, ajoutés et supprimés. Avec la colonne Modifs visible (clic droit sur l'en-tête du Log pour l'afficher), les compteurs vont toujours dans cette colonne, comme pour chaque {$commit}. Masquée, ils s'affichent dans le message WIP tant que ceci est activé ; désactivé, aucun compteur."
avatars = "Avatars des auteurs"
avatars_help = { git = "Images d'auteurs. graphe dessine l'auteur de chaque {$commit} dans son cercle du graphe (graphe en image seulement ; avec le graphe en texte, une initiale colorée va dans la colonne Auteur). auteur met une image ronde au début de la colonne Auteur. Les deux l'affichent aussi dans le détail du {$commit}. Désactivé par défaut : l'activer envoie à gravatar.com, en HTTPS, un hachage SHA-256 de l'e-mail de chaque auteur (le hachage d'une adresse connue ou devinable n'est pas anonyme) et, dans un dépôt avec un distant github.com, interroge une fois par auteur l'API GitHub pour savoir quel compte a fait l'un de ses {$commits} (avec le jeton de votre intégration GitHub s'il y en a un). Tant qu'une image n'est pas arrivée, ou s'il n'y en a pas, les initiales ou le cercle simple s'affichent. désactivé n'envoie rien sur le réseau.", local = "Images d'auteurs. graphe dessine l'auteur de chaque {$commit} dans son cercle du graphe (graphe en image seulement ; avec le graphe en texte, une initiale colorée va dans la colonne Auteur). auteur met une image ronde au début de la colonne Auteur. Les deux l'affichent aussi dans le détail de la {$commit}. Désactivé par défaut : l'activer envoie à gravatar.com, en HTTPS, un hachage SHA-256 de l'e-mail de chaque auteur (le hachage d'une adresse connue ou devinable n'est pas anonyme) et, dans un dépôt avec un distant github.com, interroge une fois par auteur l'API GitHub pour savoir quel compte a fait l'un de ses {$commits} (avec le jeton de votre intégration GitHub s'il y en a un). Tant qu'une image n'est pas arrivée, ou s'il n'y en a pas, les initiales ou le cercle simple s'affichent. désactivé n'envoie rien sur le réseau." }
avatar_sources = "Sources d'avatars"
avatar_sources_help = { git = "Où l'image d'un auteur est cherchée, dans l'ordre (une adresse noreply GitHub désigne toujours son compte en premier). hosting_gravatar : l'intégration GitHub, GitLab ou Bitbucket connectée dont l'hôte correspond au distant du dépôt (auteur du {$commit} ou recherche d'utilisateur GitHub, avatar par e-mail ou API users GitLab), puis Gravatar ; sans intégration correspondante, Gravatar passe en premier et un distant github.com est quand même interrogé en dernier, sans authentification. gravatar_hosting : l'inverse. gravatar ou hosting : seulement celle-là. Si aucune n'a d'image, l'avatar de repli ci-dessous est dessiné. S'applique aux auteurs pas encore cherchés.", local = "Où l'image d'un auteur est cherchée, dans l'ordre (une adresse noreply GitHub désigne toujours son compte en premier). hosting_gravatar : l'intégration GitHub, GitLab ou Bitbucket connectée dont l'hôte correspond au distant du dépôt (auteur de la {$commit} ou recherche d'utilisateur GitHub, avatar par e-mail ou API users GitLab), puis Gravatar ; sans intégration correspondante, Gravatar passe en premier et un distant github.com est quand même interrogé en dernier, sans authentification. gravatar_hosting : l'inverse. gravatar ou hosting : seulement celle-là. Si aucune n'a d'image, l'avatar de repli ci-dessous est dessiné. S'applique aux auteurs pas encore cherchés." }
avatar_fallback = "Avatar de repli"
avatar_fallback_help = "Ce que reçoit un auteur sans image. identicon : un motif 5x5 en miroir, style GitHub, d'une couleur dérivée de son e-mail, généré localement (sans réseau), en image sur un terminal graphique et en blocs de caractères ailleurs. initiales : un badge coloré avec ses initiales."
composer_files = "Propositions du compositeur"
composer_files_help = { git = "Comment s'ouvre la revue du compositeur de {$commits} IA. développé : chaque {$commit} proposé liste ses fichiers. replié : seulement les lignes de {$commits} ; Droite/Gauche (ou un clic sur la flèche) en ouvre un.", local = "Comment s'ouvre la revue du compositeur de {$commits} IA. développé : chaque {$commit} proposée liste ses fichiers. replié : seulement les lignes de {$commits} ; Droite/Gauche (ou un clic sur la flèche) en ouvre une." }
blame_side = "Annotations du blame"
blame_side_help = "Côté de la colonne d'annotation (avatar, auteur, ancienneté, résumé) dans la vue Blame. right : à droite du code. left : à gauche du code."
column_resize = "Redimensionnement des colonnes"
column_resize_help = "Comment une frontière de colonne se saisit dans le Log, le Radar et la colonne latérale des vues de fichier. line : un trait fin sur toute la hauteur du tableau quand le pointeur est sur la frontière, avec un petit repère dans l'en-tête. header : pas d'espace ni de repère, on redimensionne seulement depuis l'en-tête, où le premier caractère de la cellule suivante s'allume."
blame_width = "Largeur des annotations du blame"
blame_width_help = "Largeur de la colonne d'annotation en cellules (24 à 90). Tirez sa bordure dans la vue Blame ou utilisez les touches élargir / réduire ; la nouvelle largeur est enregistrée ici."
ref_tree = "Arbre de dossiers des branches"
ref_tree_help = "Le volet Refs regroupe les noms de branches sur `/` en dossiers repliables, chaque distant étant un nœud de premier niveau. Désactivé, une ligne simple par branche. `y` dans le panneau Refs le bascule en direct et écrit le choix ici."
reveal_on_ref_click = "Un clic sur une ref la révèle dans le graphe"
reveal_on_ref_click_help = "Un simple clic sur une ref du volet Refs fait défiler le Log jusqu'à l'endroit où elle pointe et fait clignoter la ligne. La sélection du Log et le panneau de droite ne bougent pas. Désactivé, un clic ne fait que sélectionner la ligne du panneau. « Révéler dans le graphe » du menu de la ref, sa touche dans le panneau Refs et la commande de la palette fonctionnent dans les deux cas."
graph_ghost_ref = { git = "Afficher une branche fantôme sur le {$commit} survolé", local = "Afficher une branche fantôme sur la {$commit} survolée" }
graph_ghost_ref_help = { git = "Dans la colonne Ref du Log, le {$commit} survolé qui n'a pas de ref propre affiche une pastille estompée avec le nom de la branche à laquelle il appartient (sinon sa branche distante), déduite de l'historique. Survoler la pastille indique son type. Cliquer dessus ne fait rien de particulier ; la commande de création de branche crée une branche. Affichée seulement si la colonne Ref a la place. Désactivé, elle est masquée.", local = "Dans la colonne Ref du Log, la {$commit} survolée qui n'a pas de ref propre affiche une pastille estompée avec le nom de la branche à laquelle elle appartient (sinon sa branche distante), déduite de l'historique. Survoler la pastille indique son type. Cliquer dessus ne fait rien de particulier ; la commande de création de branche crée une branche. Affichée seulement si la colonne Ref a la place. Désactivé, elle est masquée." }
mouse_enabled = "Souris activée"
mouse_enabled_help = "Désactivée, la sélection par glisser-déposer revient à votre terminal. Nécessite un redémarrage."
mouse_scroll_lines = "Lignes par cran de molette"
mouse_scroll_lines_help = "Nombre de {$commits} qu'un cran de molette déplace dans le Log. Nécessite un redémarrage."
heading_date_time = "Date et heure"
heading_layout = "Disposition"
date_locale = "Locale de date/heure"
date_locale_help = "system : les noms de mois et de jours suivent la langue de l'interface. english : toujours en anglais, quelle que soit la langue. S'applique à toutes les dates de cette page."
diff_layout = "Disposition par défaut"
diff_layout_help = { git = "En ligne (une colonne) ou côte à côte (avant et après). Reprise du dernier {$diff} consulté, dans cette fenêtre et d'un redémarrage à l'autre : la changer ici définit seulement le point de départ d'une *nouvelle* session.", local = "En ligne (une colonne) ou côte à côte (avant et après). Reprise de la dernière {$diff} consultée, dans cette fenêtre et d'un redémarrage à l'autre : la changer ici définit seulement le point de départ d'une *nouvelle* session." }
diff_hunks_only = "Hunks seulement"
diff_hunks_only_help = "Activé, seuls les hunks modifiés s'affichent avec quelques lignes de contexte ; désactivé, tout le fichier s'affiche avec les modifications surlignées sur place. Repris comme la disposition."
diff_show_whitespace = "Montrer les modifications d'espaces seuls"
diff_show_whitespace_help = "Désactivé, un hunk qui ne diffère que par des espaces est replié en contexte."
input_color = "Couleur des champs"
input_color_help = "Fond des champs de saisie. Suivre le thème (par défaut) utilise celui du thème ; les autres sont des couleurs sombres qui le remplacent. Personnalisée... utilise la couleur hexadécimale ci-dessous. S'applique tout de suite, sans redémarrage."
input_color_custom = "Couleur de champ personnalisée"
input_color_custom_help = "#rrggbb, utilisée quand Couleur des champs vaut Personnalisée. S'applique tout de suite."
minimap = "Minimap"
minimap_help = { git = "Une image du fichier entier à côté de la barre de défilement verticale du {$diff} (mode fichier entier) et de l'éditeur, avec la partie visible en surbrillance ; cliquez pour y aller. Une vraie image là où le terminal en dessine, des cellules braille ailleurs. Aussi `M` dans le {$diff} et Basculer la minimap dans la palette.", local = "Une image du fichier entier à côté de la barre de défilement verticale de la {$diff} (mode fichier entier) et de l'éditeur, avec la partie visible en surbrillance ; cliquez pour y aller. Une vraie image là où le terminal en dessine, des cellules braille ailleurs. Aussi `M` dans la {$diff} et Basculer la minimap dans la palette." }
date_format = "Format de date"
date_format_help = "La colonne de date Blame / Historique du fichier."
date_time_format = "Format de date/heure"
date_time_format_help = "La colonne Date du Log elle-même."
date_verbose_format = "Format de date détaillé"
date_verbose_format_help = { git = "La ligne Date du volet de détail du {$commit}, l'infobulle de la colonne Date et Copier > Date.", local = "La ligne Date du volet de détail de la {$commit}, l'infobulle de la colonne Date et Copier > Date." }
preview = "aperçu"
