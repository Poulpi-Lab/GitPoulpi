[help_tabs]
tab_keys = "Raccourcis"
tab_start = "Départ"
tab_log = "Log"
tab_changes = "Modifs"
tab_refs = "Refs"
tab_hosting = "Hébergeur"
tab_setup = "Paramètres"
tab_tools = "IA & CLI"
title = "Aide - tapez pour filtrer, Tab change d'onglet, ? ferme"
title_filtered = "Aide - filtre « {filter} » - Esc efface, ? ferme"
hint = "Tab/Shift+Tab, ←/→ ou Alt+1..8 : onglets - ↑/↓, PgUp/PgDn défilent"
start_1 = "Fenêtre|Onglets en haut (Accueil liste, ouvre et clone les dépôts), puis la barre d'outils, la barre latérale Refs à gauche, le Log au centre, et les modifications avec le formulaire de {$commit} à droite."
start_2 = "Palette de commandes|Ctrl+P liste chaque action avec son raccourci. Tapez pour chercher, Enter l'exécute. Tout ce que fait la souris, la palette le fait."
start_3 = "Préfixes de raccourcis|Ctrl+G puis une touche lance une action git ({$stage}, {$commit}, {$pull}, {$push}...). Ctrl+N puis une touche déplace ou change l'affichage. La ligne d'état liste les choix."
start_4 = "Onglets|Un onglet par dépôt. Ctrl+PageUp / Ctrl+PageDown changent d'onglet, Ctrl+W le ferme, t ouvre le sélecteur d'onglets, clic droit sur un onglet ou Ctrl+T pour son menu."
start_5 = { git = "Souris et clavier|Un clic sélectionne, un double-clic ouvre ou extrait, un clic droit (ou .) ouvre un menu, le glisser déplace les refs et les lignes de {$rebase}. Chaque action à la souris a une touche.", local = "Souris et clavier|Un clic sélectionne, un double-clic ouvre ou extrait, un clic droit (ou .) ouvre un menu, le glisser déplace les refs et les lignes du rebasage. Chaque action à la souris a une touche." }
start_6 = "Actualiser et annuler|r actualise, F5 recharge tout, Ctrl+Z / Ctrl+Y annulent et rétablissent la dernière opération, q quitte."
log_1 = "Lire le graphe|Une ligne par {$commit}, une voie par branche. La première ligne est votre travail non validé (WIP) : sélectionnez-la pour voir les modifications. Cliquez une ligne pour ses détails à droite."
log_2 = "Rechercher|f (ou le bouton Chercher) estompe les lignes qui ne correspondent pas à un message, un auteur, un hash ou une ref. Enter / Shift+Enter vont au résultat suivant / précédent. / filtre la barre Refs."
log_3 = { git = "Menu des {$commits}|Clic droit sur un {$commit} ou . dessus : {$cherry_pick}, revert, reset, modifier le message, créer une branche ou un {$tag}, checkout, worktree, patch, copier.", local = "Menu des {$commits}|Clic droit sur une {$commit} ou . dessus : {$cherry_pick}, inverser, réinitialiser, modifier le message, créer une branche ou une {$tag}, basculer, arbre de travail, patch, copier." }
log_4 = { git = "{$Rebase} interactif|« {$Rebase} interactif depuis ici... » dans le menu du {$commit} : réglez chaque {$commit} sur {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} ou {$edit}, réordonnez avec Ctrl+Up/Down, lancez avec Ctrl+S, quittez avec Esc.", local = "Rebasage interactif|« Rebaser interactivement depuis ici... » dans le menu de la validation : réglez chaque validation sur {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} ou {$edit}, réordonnez avec Ctrl+Up/Down, lancez avec Ctrl+S, quittez avec Esc." }
log_5 = { git = "Plusieurs {$commits}|Ctrl+clic bascule un {$commit}, Shift+clic (Alt+clic) sélectionne une plage, Space bascule le courant, Esc efface. Puis clic droit pour {$cherry_pick} ou inverser toute la sélection.", local = "Plusieurs {$commits}|Ctrl+clic bascule une {$commit}, Shift+clic (Alt+clic) sélectionne une plage, Space bascule le courant, Esc efface. Puis clic droit pour {$cherry_pick} ou inverser toute la sélection." }
log_6 = "Glisser des refs|Glissez une branche sur une autre pour {$merge}, {$rebase} ou avance rapide, ou sur une branche distante pour {$push} ; relâchez pour choisir dans un menu, Esc annule. Clavier : palette, « Refs : Déposer la ref sélectionnée... »."
changes_1 = "Modifications en cours|Sélectionnez la première ligne du Log (WIP) : les fichiers {$unstaged} et {$staged} apparaissent à droite. m bascule chemin / arbre, a montre tous les fichiers, z replie les dossiers."
changes_2 = "{$Stage} et {$unstage}|Ctrl+Space sur un fichier, ou son bouton, ou Ctrl+G s ; Ctrl+G a pour tout, Ctrl+G u pour {$unstage}. Clic droit sur un fichier pour abandonner, voir son historique ou blame, ou l'ouvrir dans votre éditeur."
changes_3 = { git = "Lire un {$diff}|Cliquez un fichier ou appuyez sur d. m alterne En ligne / Côte à côte, w coupe les lignes, s ignore les espaces, n / p sautent d'un hunk à l'autre, Esc ou q revient au Log.", local = "Lire les différences|Cliquez un fichier ou appuyez sur d. m alterne En ligne / Côte à côte, w coupe les lignes, s ignore les espaces, n / p sautent d'un hunk à l'autre, Esc ou q revient au Log." }
changes_4 = { git = "Hunks et lignes|Dans un {$diff} : Space = {$stage} du hunk, v puis j / k puis Enter = {$stage} des lignes choisies, x = abandonner le hunk. Les abandons demandent confirmation ; Ctrl+Z les annule.", local = "Hunks et lignes|Dans les différences : Space = indexer le hunk, v puis j / k puis Enter = indexer les lignes choisies, x = abandonner le hunk. Les abandons demandent confirmation ; Ctrl+Z les annule." }
changes_5 = { git = "Écrire un {$commit}|Saisissez un titre et une description, puis Ctrl+Enter ou le bouton vert. Shift+A amende le dernier {$commit}. Ctrl+G c place le curseur dans le formulaire, Esc le quitte.", local = "Écrire une {$commit}|Saisissez un titre et une description, puis Ctrl+Enter ou le bouton vert. Shift+A amende la dernière {$commit}. Ctrl+G c place le curseur dans le formulaire, Esc le quitte." }
changes_6 = { git = "Conflits de {$merge}|Un bandeau propose « Résoudre les conflits... ». Dans l'éditeur de {$merge}, choisissez A, B ou les deux pour chaque conflit (a / b / c), modifiez le Résultat, enregistrez, puis Continuer.", local = "Conflits de fusion|Un bandeau propose « Résoudre les conflits... ». Dans l'éditeur de fusion, choisissez A, B ou les deux pour chaque conflit (a / b / c), modifiez le Résultat, enregistrez, puis Continuer." }
changes_7 = { git = "Annuler et rétablir|Ctrl+Z / Ctrl+Y, ou les boutons de la barre d'outils, annulent et rétablissent la plupart des opérations : {$commits}, branches, checkouts, resets, {$stashes}, abandons. Une confirmation précède les cas risqués.", local = "Annuler et rétablir|Ctrl+Z / Ctrl+Y, ou les boutons de la barre d'outils, annulent et rétablissent la plupart des opérations : {$commits}, branches, bascules, réinitialisations, {$stashes}, abandons. Une confirmation précède les cas risqués." }
refs_1 = { git = "Branches et {$tags}|Double-clic sur une branche locale ou un {$tag} pour l'extraire ; clic droit pour son menu ({$merge}, {$rebase}, renommer, supprimer...). Ctrl+G b et Ctrl+G t en créent un sur le {$commit} extrait.", local = "Branches et {$tags}|Double-clic sur une branche locale ou une {$tag} pour l'extraire ; clic droit pour son menu ({$merge}, {$rebase}, renommer, supprimer...). Ctrl+G b et Ctrl+G t en créent une sur la {$commit} extraite." }
refs_2 = "Solo et masquer|La touche o n'affiche que les {$commits} de la ref sélectionnée, Shift+O arrête. Le menu d'une ref la masque du graphe ; Shift+H réaffiche tout. Affichage seulement : le dépôt ne change pas."
refs_3 = "{$Fetch}, {$pull}, {$push}|Ctrl+G f : {$fetch} tous les distants. Ctrl+G p : {$pull}. Ctrl+G Shift+P : {$push}. La flèche d'un bouton de la barre d'outils choisit une autre méthode ou un autre distant."
refs_4 = { git = "Distants|Le + du titre DISTANTES en ajoute un. Clic droit sur un distant pour le {$fetch}, copier son lien web, modifier ses URL ou le supprimer.", local = "Distants|Le + du titre DISTANTES en ajoute un. Clic droit sur un distant pour le récupérer, copier son lien web, modifier ses URL ou le supprimer." }
refs_5 = { git = "{$Stashes} et worktrees|Les boutons {$stash} et {$Pop} ; Ctrl+G m demande d'abord un message. Clic droit sur un {$stash} pour l'appliquer ou le dépiler. « Créer un worktree depuis... » ouvre une branche dans son propre onglet.", local = "{$Stashes} et arbres de travail|Les boutons {$stash} et {$Pop} ; Ctrl+G m demande d'abord un message. Clic droit sur une {$stash} pour l'appliquer ou la dépiler. « Créer un arbre de travail depuis... » ouvre une branche dans son propre onglet." }
refs_6 = "Sous-modules et LFS|Une section SOUS-MODULES apparaît s'il y en a : un double-clic en ouvre un dans un onglet, un clic droit le met à jour. Actions Git LFS : le bouton LFS ou Ctrl+G l."
hosting_1 = "Connecter|Paramètres > Intégrations : collez un jeton personnel pour GitHub ou GitLab. Aucun compte requis ; le jeton va dans l'assistant d'identifiants du système."
hosting_2 = "Lier un dépôt|Dans les sections {$PRS} et TICKETS de la barre latérale, choisissez un des fournisseurs proposés par la liste. Rien n'est lié automatiquement ; le lien est enregistré par dépôt."
hosting_3 = "Créer une {$pr}|Le + de l'en-tête {$PRS}, ou n dans cette section, ouvre le formulaire ; le menu d'une branche propose « Démarrer une {$pr} depuis... ». L'IA peut rédiger le titre et la description."
hosting_4 = "Tickets|La section TICKETS les liste ; + ou n en crée un. Le menu d'une ligne l'ouvre dans le navigateur ou agit dessus."
hosting_5 = "Références|Les références de ticket et de {$pr} (#12, !53, ABC-7) dans un message de {$commit} ou un nom de branche sont reconnues. Alt+R dans le formulaire de {$commit} en insère une."
hosting_6 = "Pastille de la barre d'outils|À gauche de la barre d'outils, une pastille montre la {$pr} de la branche extraite (GH #12, GL !53) ou un « + {$pr_abbr} » estompé pour en démarrer une. Cliquez-la."
hosting_7 = "Clés SSH|Choisissez une clé SSH par profil (Paramètres > Profils) ou par dépôt (menu de l'onglet > « SSH et identifiants... »). Les phrases secrètes restent dans votre ssh-agent."
setup_1 = "Paramètres|Ctrl+, ou l'engrenage. Tab passe de la liste des pages aux options, j / k déplacent, Enter ou Space change une valeur, / ou Ctrl+F cherche dans toutes les options, Esc ferme."
setup_2 = "Thèmes|Paramètres > Apparence > Thème : sombre, clair, suivre le terminal, ou l'un des nombreux préréglages. Ctrl+N puis une touche change aussi thème, langue et couleurs du graphe sans ouvrir les Paramètres."
setup_3 = "Langue|Paramètres > Général > Langue propose 17 langues. « Traduire les termes git » décide si les mots propres à git ({$commit}, {$push}...) sont traduits aussi."
setup_4 = "Profils|Paramètres > Profils contient les identités de {$commit} (nom, e-mail, clé SSH). La liste de profils de la barre d'outils choisit celle de ce dépôt."
setup_5 = "Ouvrir dans|Le bouton Ouvrir dans (Alt+O) ouvre le dossier de cet onglet dans un terminal, un éditeur ou le gestionnaire de fichiers. Paramètres > Ouvrir dans modifie la liste."
setup_6 = "Raccourcis clavier|Paramètres > Clavier et souris reconfigure n'importe quelle touche. L'onglet Raccourcis de cette aide montre vos propres raccourcis."
tools_1 = "IA (facultative)|Désactivée jusqu'à sa configuration dans Paramètres > IA : un service compatible OpenAI, Anthropic, ou un agent local comme claude -p. Aucun compte GitPoulpi n'est jamais nécessaire."
tools_2 = "Actions IA|Le bouton étincelle près du titre ou Ctrl+G i écrit un message de {$commit} ; Ctrl+G w explique les modifications ; Ctrl+G C découpe votre travail en plusieurs {$commits} ; Alt+I propose une résolution de conflit. Rien n'est appliqué avant votre confirmation."
tools_3 = "CLI|gitpoulpi <commande> fait depuis un script ce que fait la fenêtre, via le même démon, donc les changements apparaissent en direct. --json donne une sortie machine, --help liste les options."
tools_4 = "MCP|gitpoulpi mcp serve --stdio donne aux agents IA un outil par commande CLI. Paramètres > Agents et MCP choisit ce qu'ils peuvent modifier."
tools_5 = "Wrapper shell|Avec le wrapper shell gp, « Quitter & cd ici » laisse votre shell dans le dossier de l'onglet actif quand GitPoulpi se ferme."

