[help_text]
git_actions_then_amend = { git = "modifier le commit sélectionné : résumé, description, nom, e-mail et date de l'auteur dans une seule fenêtre", local = "modifier la validation sélectionnée : résumé, description, nom, e-mail et date de l'auteur dans une seule fenêtre" }
git_actions_then_edit_author = { git = "modifier seulement l'auteur du commit sélectionné (nom, e-mail, date)", local = "modifier seulement l'auteur de la validation sélectionnée (nom, e-mail, date)" }
rewrite_1 = "ouvre l'atelier de réécriture de l'historique : modifier les auteurs, les dates, les messages, le contenu des fichiers ou les chemins, sur tout l'historique ou sur une sélection"
rewrite_2 = "affiche ce que les règles changeraient, puis l'applique en une seule étape, que Annuler peut défaire ; Appliquer reste inactif tant que l'aperçu n'est plus à jour"
rewrite_3 = "annule l'aperçu en cours (Esc aussi ; un second Esc ferme l'atelier)"
rewrite_4 = "ajoute une règle, supprime la règle sous le curseur, rétablit la dernière supprimée, duplique la règle"
rewrite_5 = "active ou désactive la règle, ou la monte ou la descend (les règles s'exécutent de haut en bas)"
rewrite_6 = "passe d'un onglet d'aperçu à l'autre"
rewrite_7 = "enregistre la recette dans le dépôt ou pour vous seul, en charge une enregistrée, la renomme ; les valeurs secrètes ne sont jamais enregistrées"
rewrite_8 = "inclut ou exclut toutes les branches protégées déjà poussées ; revérifie les outils externes"
file_history_1 = { git = "aller au commit de la ligne dans le Log, en chargeant la suite du Log s'il n'y est pas encore", local = "aller à la validation de la ligne dans le Log, en chargeant la suite du Log si elle n'y est pas encore" }
file_history_2 = { git = "déplacer la sélection ; le diff à droite suit aussitôt", local = "déplacer la sélection ; la différence à droite suit aussitôt" }
file_history_3 = { git = "étendre la sélection en plage : la droite montre alors le diff du fichier entre les deux bouts (Shift+clic fait pareil)", local = "étendre la sélection en plage : la droite montre alors la différence du fichier entre les deux bouts (Shift+clic fait pareil)" }
file_history_4 = { git = "donner le clavier au diff, ou le rendre à la liste", local = "donner le clavier à la différence, ou le rendre à la liste" }
file_history_5 = { git = "copier le SHA du commit, ou son résumé", local = "copier le SHA de la validation, ou son résumé" }
file_history_6 = { git = "côté droit : le diff, le fichier tel qu'il était à ce commit, ou son blame ; il suit la sélection et garde son mode", local = "côté droit : la différence, le fichier tel qu'il était à cette validation, ou son blame ; il suit la sélection et garde son mode" }
file_history_7 = "comparer la version de la ligne à l'arbre de travail (rappuyer pour revenir)"
file_history_8 = "restaurer le fichier à cette version dans l'arbre de travail (demande confirmation ; Annuler remet les anciens octets)"
file_history_9 = "redimensionner la liste (le séparateur se glisse aussi ; la largeur est mémorisée)"
file_history_10 = "souris : clic sur une ligne, Shift+clic pour une plage, double-clic l'affiche dans le Log, clic droit ouvre le menu"
commit_column_1 = "faire défiler les lignes sur le côté (Shift+molette ou une molette horizontale font de même) ; elles ne défilent que si une partie a été élargie au-delà de la place disponible"
commit_column_2 = "choisir une partie (voies du graphe, auteur, date), puis l'élargir ou la rétrécir, ou remettre toutes les parties en largeur automatique ; les séparateurs de l'en-tête se font aussi glisser, et les largeurs sont mémorisées"
commit_column_3 = { git = "souris : clic sur une ligne pour choisir son commit, clic droit ouvre son menu (la touche menu aussi, après avoir choisi une ligne avec Haut/Bas)", local = "souris : clic sur une ligne pour choisir sa validation, clic droit ouvre son menu (la touche menu aussi, après avoir choisi une ligne avec Haut/Bas)" }
commit_column_4 = "déplacer la partie choisie vers la gauche ou la droite ; faire glisser son en-tête fait pareil, et l'ordre est mémorisé"
log_columns_1 = "choisir une colonne du Log (sa cellule d'en-tête s'allume) ; puis la déplacer vers la gauche ou la droite (faire glisser son en-tête fait pareil), l'élargir ou la rétrécir (faire glisser sa limite fait pareil), lui rendre sa largeur automatique, ou l'ajuster à son contenu (double-cliquer sa limite fait pareil ; + ajuste toutes les colonnes). Tab / Shift+Tab choisissent une autre colonne, Échap quitte ; la disposition est mémorisée"
global_1 = "ouvre la palette de commandes : toutes les commandes de l'appli, chacune avec son raccourci ; tapez pour filtrer, Up/Down ou PageUp/PageDown pour vous déplacer (pas j/k : ils sont saisis), Enter pour lancer. Une ligne grisée indique pourquoi elle est indisponible"
global_2 = "le préfixe de navigation, voir sa section plus bas"
global_3 = "le préfixe des actions git, voir sa section plus bas"
global_4 = "affiche ou masque cette aide, par-dessus tout ce qui est ouvert (Paramètres, gestion des dépôts, ...), pas seulement le graphe"
global_5 = "force l'actualisation"
global_6 = { git = "{$fetch}, puis revérifie les {$prs} et les tickets et recharge", local = "récupère, revérifie les {$prs} et les tickets, recharge" }
global_7 = { git = "annule / rétablit la dernière opération ({$commit}, amend, checkout, création ou suppression de branche) ; demande d'abord si elle est risquée", local = "annule / rétablit la dernière opération (validation, amendement, bascule de branche, création ou suppression de branche) ; demande d'abord si elle est risquée" }
global_9 = { git = "quitte (depuis le graphe) ; sur un diff ou la vue fichier, ferme plutôt cette vue. Chaque sortie est consignée dans gitpoulpi-tui-exit.log, à côté de la configuration", local = "quitte (depuis le graphe) ; sur les différences ou la vue fichier, ferme plutôt cette vue. Chaque sortie est consignée dans gitpoulpi-tui-exit.log, à côté de la configuration" }
global_10 = "ouvre un menu contextuel, partout où il en existe un (voir plus bas) ; les touches sont interchangeables (sous Windows, la touche Menu atteint rarement l'appli : F10 y fonctionne à coup sûr)"
global_11 = "passe le focus au volet suivant / précédent"
global_12 = "déplace la sélection (tous les volets et listes)"
global_13 = "préfixe de répétition à la vim sur j/k/Up/Down (et PageUp/PageDown, en nombre d'écrans) : les chiffres tapés s'affichent « 4... » dans la ligne d'état jusqu'au mouvement ; Esc ou toute autre touche l'annule, et un 0 initial n'en commence jamais un (les chiffres se tapent donc normalement dans le formulaire, le filtre des Refs et tout autre champ)"
global_14 = "Refs : change de section (LOCALES, DISTANTES, {$TAGS}...)"
global_15 = { git = "Log : h = sortir de la liste des fichiers d'un {$commit} / l = y entrer", local = "Log : h = sortir de la liste des fichiers d'une {$commit} / l = y entrer" }
global_16 = { git = "Status : saute à {$Unstaged} / {$Staged}", local = "Status : saute aux fichiers non indexés / indexés" }
mouse_basics_1 = "sélectionne et donne le focus à une ligne (volet, liste, menu, boîte de dialogue) ; la molette fait défiler ce qui est sous le pointeur"
mouse_basics_2 = { git = "ouvre ou active : extrait la ref (branche locale, {$tag} ou pastille de ref du Log), ouvre le diff d'un fichier modifié, ouvre le dépôt d'une ligne de dépôt", local = "ouvre ou active : extrait la ref (branche locale, {$tag} ou pastille de ref du Log), ouvre les différences d'un fichier modifié, ouvre le dépôt d'une ligne de dépôt" }
mouse_basics_3 = "seul indice « c'est cliquable » que donnent la plupart des terminaux (voir « Survol et infobulles » plus bas) ; affiche aussi la valeur complète des cellules du Log et des badges de refs tronqués"
mouse_basics_4 = { git = "une séparation de volets, une limite de colonne du Log, le bord bas d'une section Refs ou celui du bloc de message de {$commit} : le glisser redimensionne (en dessous du minimum, l'élément se replie) ; un en-tête de colonne du Log glissé au-delà d'une voisine la réordonne", local = "une séparation de volets, une limite de colonne du Log, le bord bas d'une section Refs ou celui du bloc de message : le glisser redimensionne (en dessous du minimum, l'élément se replie) ; un en-tête de colonne du Log glissé au-delà d'une voisine la réordonne" }
mouse_basics_5 = "(coin supérieur droit) quitte, comme q ; affiché seulement si la fenêtre est assez large pour ne pas recouvrir le titre"
navigation_prefix_then_1 = "replie ou rétablit le volet Refs (à gauche)"
navigation_prefix_then_2 = "replie ou rétablit le volet Status (à droite) ; à la souris, cliquez le chevron sur la bordure d'un volet, ou la fine bande qui reste une fois replié"
navigation_prefix_then_3 = "agrandit d'une ligne la section Refs active ({{nav_prefix.shrink_section}} la réduit) ; glisser le bord bas d'une section fait de même, et la taille est mémorisée"
navigation_prefix_then_4 = { git = "agrandit d'une ligne le bloc de message de {$commit} du volet de droite ({{nav_prefix.shrink_message}} le réduit) ; à la souris, glissez la bordure du dessous", local = "agrandit d'une ligne le bloc de message du volet de droite ({{nav_prefix.shrink_message}} le réduit) ; à la souris, glissez la bordure du dessous" }
navigation_prefix_then_5 = "donne le focus à ce sous-volet : chaque section Refs, le champ de filtre, le Log (ou la vue {$diff} quand elle y est ouverte), la liste de l'Historique du fichier, chaque moitié du troisième volet et le champ Résumé du formulaire (s'il y a la place) ont chacun leur badge : 1-9 d'abord, puis a/b/c... s'il y en a plus de neuf à l'écran ; les badges sont redistribués à chaque ouverture du préfixe : lisez le symbole, ne retenez pas un chiffre"
navigation_prefix_then_6 = "ouvre les Paramètres (comme l'engrenage de la barre de titre)"
navigation_prefix_then_16 = "ouvre la fenêtre À propos (comme la pieuvre de la barre de titre)"
navigation_prefix_then_17 = "déplace d'un cran la séparation entre le volet Refs et le Log vers la gauche ({{nav_prefix.refs_narrower}}) ou la droite ({{nav_prefix.refs_wider}}) ; un volet Refs replié revient d'abord, et la largeur est mémorisée"
navigation_prefix_then_18 = "déplace d'un cran la séparation entre le Log et le volet de droite vers la gauche ({{nav_prefix.status_wider}}) ou la droite ({{nav_prefix.status_narrower}}) ; un volet replié revient d'abord, et la largeur est mémorisée"
navigation_prefix_then_7 = "affiche ou masque cette aide (comme un simple ?)"
navigation_prefix_then_8 = "choisit l'onglet de dépôt où aller : tapez pour filtrer, Up/Down ou PageUp/PageDown pour vous déplacer, Enter y va, un clic sur une ligne aussi, Esc ferme"
workspace_search = "cherche dans tous les dépôts de l'espace de travail les branches, {$tags}, worktrees, {$stashes}, {$commits}, {$prs} et tickets - Enter y va, Alt+1-8 active les types, b: t: c: s: w: r: pr: i: # restreint, Esc ferme"
navigation_prefix_then_9 = "affiche la vue proposée par un agent IA (la pastille de la ligne d'état « ... veut afficher ... »), comme un clic dessus"
navigation_prefix_then_10 = "ferme cette pastille, sinon revient à la vue d'avant la dernière modification de l'agent (aussi `Agent : Retour` dans la palette)"
navigation_prefix_then_11 = "annule, retour au mode normal"
navigation_prefix_then_12 = "choisit un thème dans la liste : tapez pour filtrer, la sélection s'applique en aperçu, Enter l'applique et l'enregistre, Esc rétablit le précédent (aussi `Application : Changer de thème...` dans la palette)"
navigation_prefix_then_13 = "choisit une langue dans la liste : tapez pour filtrer, Enter l'applique et l'enregistre, Esc annule (aussi `Application : Changer de langue...` dans la palette)"
navigation_prefix_then_14 = "`Application : Changer le thème de couleurs du graphe...`"
navigation_prefix_then_15 = "`Application : Basculer la teinte de ligne du graphe`"
navigation_prefix_then_19 = "dispose le dialogue ouvert au clavier : les flèches le déplacent, Shift+flèches le redimensionnent, 0 le remet en place, Enter quitte (le pendant du glisser de sa barre de titre et de ses bordures ; aussi `Dialogue : Déplacer/redimensionner` dans la palette)"
git_actions_then_1 = { git = "{$stage} du fichier {$unstaged} sélectionné (volet Status)", local = "indexe le fichier non indexé sélectionné (volet Status)" }
git_actions_then_2 = { git = "{$unstage} du fichier {$staged} sélectionné (volet Status)", local = "désindexe le fichier indexé sélectionné (volet Status)" }
git_actions_then_3 = { git = "{$stage} de toutes les modifications", local = "indexe toutes les modifications" }
git_actions_then_4 = "abandonne toutes les modifications (avec confirmation ; fichiers non suivis inclus, la confirmation le précise)"
git_actions_then_5 = "ouvre le formulaire de message de {$commit}"
git_actions_then_commit_now = { git = "commite tout de suite les modifications staged avec le message du formulaire, d'où que vous soyez (le jumeau du bouton Commiter ; si rien n'est staged ou s'il manque le résumé, il dit pourquoi et passe au formulaire)", local = "valide tout de suite les modifications indexées avec le message du formulaire, d'où que vous soyez (le jumeau du bouton Valider ; si rien n'est indexé ou s'il manque le résumé, il dit pourquoi et passe au formulaire)" }
git_actions_then_6 = { git = "{$stash} de toutes les modifications, avec d'abord la saisie d'un message (IA activée : {{global.git_prefix}} dans cette invite demande au modèle de l'écrire)", local = "remise de toutes les modifications, avec d'abord la saisie d'un message (IA activée : {{global.git_prefix}} dans cette invite demande au modèle de l'écrire)" }
git_actions_then_7 = "l'IA écrit le message de {$commit} (seulement si l'IA est activée dans les Paramètres)"
git_actions_then_8 = { git = "l'IA explique le {$commit} sélectionné (ou les modifications en cours)", local = "l'IA explique la {$commit} sélectionnée (ou les modifications en cours)" }
git_actions_then_9 = "l'IA propose comment répartir les modifications en cours en {$commits} (une revue interactive : réordonner, modifier, déplacer des fichiers, retirer ; {{compose.apply}} crée les {$commits})"
git_actions_then_10 = { git = "{$pull}, selon le paramètre du bouton {$Pull} (son ▾ : Fetch All / fast-forward si possible / fast-forward seul / rebase ; `git.pull_mode`)", local = "tire, selon le paramètre du bouton {$Pull} (son ▾ : tout récupérer / avance rapide si possible / avance rapide seule / rebasage ; `git.pull_mode`)" }
git_actions_then_11 = { git = "{$push} vers le distant par défaut (ou demande, selon `git.push_behavior`)", local = "pousse vers le distant par défaut (ou demande, selon `git.push_behavior`)" }
git_actions_then_12 = { git = "{$fetch} de tous les distants, avec nettoyage (prune)", local = "récupère tous les distants, avec nettoyage (prune)" }
git_actions_then_13 = "nouvelle branche sur HEAD (saisie du nom)"
git_actions_then_14 = { git = "nouveau {$tag} sur HEAD (saisie du nom)", local = "nouvelle {$tag} sur HEAD (saisie du nom)" }
git_actions_then_15 = { git = "{$stash} {$push} (toutes les modifications, fichiers non suivis inclus, sans message)", local = "remise de toutes les modifications (fichiers non suivis inclus, sans message)" }
git_actions_then_16 = { git = "{$stash} pop : le {$stash} sélectionné dans le Log s'il a le focus, sinon le plus récent", local = "dépile la remise sélectionnée dans le Log si elle a le focus, sinon la plus récente" }
git_actions_then_17 = { git = "{$push} de tous les {$tags} non pushés", local = "pousse toutes les étiquettes non poussées" }
git_actions_then_18 = "ouvre dans le navigateur la {$pr} de la branche extraite (le clic sur la pastille de la barre d'outils)"
git_actions_then_19 = { git = "supprime la branche ou le {$tag} sélectionné (volet Refs) : ouvre la confirmation", local = "supprime la branche ou l'{$tag} sélectionnée (volet Refs) : ouvre la confirmation" }
git_actions_then_20 = { git = "{$rebase} de la branche courante sur la ref sélectionnée (volet Refs)", local = "rebasage de la branche courante sur la ref sélectionnée (volet Refs)" }
git_actions_then_21 = { git = "modifie le message du {$commit} sélectionné, voir « Modifier le message d'un {$commit} » plus bas", local = "modifie le message de la validation sélectionnée, voir « Modifier le message d'une validation » plus bas" }
git_actions_then_22 = { git = "{$cherry_pick} du {$commit} sélectionné sur HEAD", local = "{$cherry_pick} de la {$commit} sélectionnée sur HEAD" }
git_actions_then_23 = { git = "revert du {$commit} sélectionné (avec confirmation)", local = "inverse la validation sélectionnée (avec confirmation)" }
git_actions_then_24 = { git = "reset de la branche sur le {$commit} sélectionné, en mixed (soft/hard : palette seulement, hard confirmé)", local = "réinitialise la branche sur la validation sélectionnée, en mode mixte (douce/dure : palette seulement, dure confirmée)" }
pull_requests_and_1 = "ouvre la ligne dans le navigateur ; « Reconnecter » ouvre les Paramètres sur le profil"
pull_requests_and_2 = "ligne de {$pr} : la modifier sur le site de l'hébergeur (le crayon de la ligne) ; la palette propose la même action pour la branche extraite"
pull_requests_and_3 = "(section {$PRS}) en crée une : comme le + de l'en-tête"
pull_requests_and_4 = "le menu de la ligne : ouvrir, copier l'URL / le numéro, extraire la branche source, voir ses {$commits}, créer une branche depuis un ticket"
pull_requests_and_5 = "choisit le filtre (Ouvertes, Mes {$prs}, En attente de ma relecture, Toutes / Qui me sont assignés) ; la pastille de la barre d'outils (GL !53, GH #12) ouvre la demande liée, clic droit pour son menu ; « + {$pr_abbr} » en démarre une pour une branche poussée"
refs_pane_1 = { git = "ouvre le menu de la ref sélectionnée : checkout, masquer/solo, {$merge}, {$rebase}, fast-forward, {$pull} / {$push} / {$fetch}, définir l'amont, créer un worktree, démarrer une {$pr}, renommer, supprimer, Copier (nom / ref complète / SHA ciblé)", local = "ouvre le menu de la ref sélectionnée : basculer, masquer/solo, {$merge}, {$rebase}, avance rapide, {$pull} / {$push} / {$fetch}, définir l'amont, créer un arbre de travail, démarrer une {$pr}, renommer, supprimer, Copier (nom / ref complète / SHA ciblé)" }
refs_pane_2 = { git = "Avancer <branche> jusqu'à <courante> / <courante> jusqu'à <branche> (menu ou palette) : fait seulement avancer une branche ; grisé, avec la raison, si ce n'est pas un fast-forward", local = "Avancer <branche> jusqu'à <courante> / <courante> jusqu'à <branche> (menu ou palette) : fait seulement avancer une branche ; grisé, avec la raison, si ce n'est pas une avance rapide" }
refs_pane_3 = { git = "Créer un worktree depuis <ref>... (menu d'une branche, d'un {$tag} ou d'un {$commit}) : une boîte de dialogue, dossier ({{dialog.browse}} ou Parcourir...), nouvelle branche facultative, [x] l'ouvrir dans un onglet (Space bascule)", local = "Créer un arbre de travail depuis <ref>... (menu d'une branche, d'une étiquette ou d'une validation) : une boîte de dialogue, dossier ({{dialog.browse}} ou Parcourir...), nouvelle branche facultative, [x] l'ouvrir dans un onglet (Space bascule)" }
refs_pane_4 = { git = "Démarrer une {$pr} depuis <branche> (branches locales, après un push) : grisé sans amont ou avec un hébergeur non reconnu ; avec un jeton configuré, un petit formulaire (cible / titre / description / brouillon) ; sans, ouvre la page de comparaison de l'hébergeur dans le navigateur", local = "Démarrer une {$pr} depuis <branche> (branches locales, une fois poussées) : grisé sans amont ou avec un hébergeur non reconnu ; avec un jeton configuré, un petit formulaire (cible / titre / description / brouillon) ; sans, ouvre la page de comparaison de l'hébergeur dans le navigateur" }
refs_pane_5 = { git = "Créer un patch (menu d'un {$commit} ou d'un fichier, ou palette) : depuis un {$commit}, d'un {$commit} à HEAD, ou depuis les modifications de l'arbre de travail ; un sélecteur de dossier (« Enregistrer ici ») écrit le premier nom libre nom[-n].patch", local = "Créer un patch (menu d'une {$commit} ou d'un fichier, ou palette) : depuis une {$commit}, d'une {$commit} à HEAD, ou depuis les modifications de l'arbre de travail ; un sélecteur de dossier (« Enregistrer ici ») écrit le premier nom libre nom[-n].patch" }
refs_pane_6 = "Appliquer un patch (palette) : un sélecteur de fichier applique un patch à l'arbre de travail ; un patch qui ne s'applique pas ne change rien"
refs_pane_7 = { git = "son menu : {$fetch}, copier le nom / le lien, définir comme distant par défaut, modifier (nom, URL de fetch / push), masquer/afficher toutes ses branches, supprimer", local = "son menu : {$fetch}, copier le nom / le lien, définir comme distant par défaut, modifier (nom, URL de récupération / d'envoi), masquer/afficher toutes ses branches, supprimer" }
refs_pane_8 = "tout masquer/afficher, solo/arrêter le solo : toutes les refs sous cette ligne de dossier ou de distant d'un coup"
refs_pane_9 = "met en solo la sélection (une ref, ou tout un dossier/distant)"
refs_pane_10 = "Arrêter le solo : efface d'un coup toutes les refs en solo"
refs_pane_11 = "Tout afficher : réaffiche d'un coup toutes les refs masquées"
refs_pane_12 = "section DISTANTES : ajoute un distant (ou le bouton + de l'en-tête)"
refs_pane_13 = "déplie/replie la section active, ou le dossier sélectionné dans la vue hiérarchique"
refs_pane_14 = "change la section active"
refs_pane_15 = "filtre par nom (Enter applique, Esc annule)"
refs_pane_16 = "bascule la vue hiérarchique des branches (dossiers selon les `/` du nom) pour LOCALES et DISTANTES ; mémorisé (`ui.ref_tree`)"
