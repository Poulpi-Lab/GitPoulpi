[settings_git]
default_backend = "Moteur Git"
default_backend_help = "Global. Un démon en cours garde le moteur avec lequel il a démarré."
default_backend_warning = "Pris en compte par les démons démarrés après ce changement."
pull_mode = "Bouton {$Pull}"
default_encoding = "Encodage par défaut"
default_encoding_help = { git = "Sert à afficher le contenu des fichiers, le blame et les {$diff}s qui ne sont pas de l'UTF-8 valide (l'UTF-8 valide n'est jamais redécodé). Un dépôt peut le remplacer ci-dessous. Affichage seulement : le stage et les patchs gardent exactement les octets du fichier.", local = "Sert à afficher le contenu des fichiers, le blame et les {$diff}s qui ne sont pas de l'UTF-8 valide (l'UTF-8 valide n'est jamais redécodé). Un dépôt peut le remplacer ci-dessous. Affichage seulement : l'indexation et les patchs gardent exactement les octets du fichier." }
push_behavior = "Bouton {$Push}"
push_behavior_help = "direct : {$push} vers le distant par défaut tout de suite. demander : ouvre un petit menu avec le distant par défaut présélectionné. Le ▾ du bouton demande toujours."
repo_encoding_help = { git = "Comment le contenu des fichiers, le blame et les {$diff}s sont décodés à l'affichage quand ils ne sont pas de l'UTF-8 valide (ce dépôt seulement ; hérité : Encodage par défaut de cette page). Le stage ne réencode jamais rien.", local = "Comment le contenu des fichiers, le blame et les {$diff}s sont décodés à l'affichage quand ils ne sont pas de l'UTF-8 valide (ce dépôt seulement ; hérité : Encodage par défaut de cette page). L'indexation ne réencode jamais rien." }
core_autocrlf_help = "Écrit dans la config git de ce dépôt (core.autocrlf), donc visible de git et de tous les autres outils. true : LF en CRLF au checkout ; input : CRLF en LF seulement à l'enregistrement dans l'historique ; false : aucune conversion. (hérité) : retire la valeur du dépôt pour que votre config git globale s'applique. Annulable."
core_eol_help = "Écrit dans la config git de ce dépôt (core.eol) : la fin de ligne que git utilise pour les fichiers texte de l'arbre de travail (lf, crlf, ou native pour celle de la plateforme). (hérité) : retire la valeur du dépôt pour que votre config git globale s'applique. Annulable."
git_lfs = "Git LFS"
git_lfs_help = { git = "Affiche Git LFS dans l'interface (le tag LFS, la carte de {$diff}, le bandeau de programme manquant, les commandes LFS) et laisse GitPoulpi exécuter ses propres étapes LFS (téléchargement des objets après un clone). Désactivé : les filtres LFS de git tournent toujours, GitPoulpi n'appelle jamais git-lfs lui-même.", local = "Affiche Git LFS dans l'interface (l'étiquette LFS, la carte de {$diff}, le bandeau de programme manquant, les commandes LFS) et laisse GitPoulpi exécuter ses propres étapes LFS (téléchargement des objets après un clone). Désactivé : les filtres LFS de git tournent toujours, GitPoulpi n'appelle jamais git-lfs lui-même." }
git_lfs_program = "Programme git-lfs"
git_lfs_program_help = "Installez-le depuis https://git-lfs.com (Windows : fourni avec Git for Windows, ou `winget install GitHub.GitLFS` ; Debian/Ubuntu : `apt install git-lfs` ; macOS : `brew install git-lfs`). Palette : LFS: Open Install Page."
initialize_lfs_for_this_repository = "Initialiser LFS pour ce dépôt"
initialize_lfs_for_this_repository_help = "Lance `git lfs install --local` : les filtres et hooks LFS dans la configuration propre à ce dépôt, jamais la globale. Nécessite git-lfs."
pull_mode_help = "Ce que fait le bouton {$Pull}{hint} de la barre d'outils : {$merge} (avance rapide si possible), ff_only ou {$rebase}. Les entrées du ▾ du bouton lancent leur propre action tout de suite et ne changent pas ce paramètre."
merge_fast_forward = { git = "Fast-forward des merges", local = "Avance rapide des fusions" }
merge_fast_forward_help = { git = "Comment un merge que vous lancez (menu de la branche, glisser-déposer, palette, ligne de commande) traite une branche qui pourrait simplement avancer en fast-forward. never : toujours faire un commit de merge. allowed : fast-forward si possible, comme git par défaut. only : fast-forward ou refus. Un dépôt peut le remplacer dans sa page Options de merge.", local = "Comment une fusion que vous lancez (menu de la branche, glisser-déposer, palette, ligne de commande) traite une branche qui pourrait simplement avancer rapidement. never : toujours faire une validation de fusion. allowed : avance rapide si possible, comme git par défaut. only : avance rapide ou refus. Un dépôt peut le remplacer dans sa page Options de fusion." }
repo_heading = "Dépôt : {repo} - ce dépôt seulement"
inherited = "(hérité)"
lfs_not_checked = "(pas encore vérifié)"
lfs_autofix_filters = { git = "Installer les filtres LFS avant {$pull} et {$push}", local = "Installer les filtres LFS avant un tirage ou un envoi" }
lfs_autofix_filters_help = { git = "Avant un {$pull} ou un {$push} dans un dépôt qui utilise Git LFS, lance `git lfs install --local` si ses filtres LFS ou ses hooks manquent (config propre au dépôt, jamais la globale), pour que le transfert gère les gros fichiers. La ligne d'état l'indique. Nécessite git-lfs.", local = "Avant un tirage ou un envoi dans un dépôt qui utilise Git LFS, lance `git lfs install --local` si ses filtres LFS ou ses hooks manquent (config propre au dépôt, jamais la globale), pour que le transfert gère les gros fichiers. La ligne d'état l'indique. Nécessite git-lfs." }
push_group_preflight = "Vérifier chaque distant avant un {$push}"
push_group_preflight_help = "Avant un {$push} d'une branche qui a des cibles de {$push} supplémentaires, regarde d'abord chaque distant (une requête rapide, plus un téléchargement de ce distant seulement quand il diffère), pour qu'un problème sur le troisième distant apparaisse avant le début du premier {$push}. Désactivé : {$push} vers chaque distant à tour de rôle, puis le compte rendu."
default_push_targets = "Cibles de {$push} supplémentaires pour les nouvelles branches"
default_push_targets_help = "Ce dépôt seulement. Cochez les distants vers lesquels une nouvelle branche fait aussi un {$push}, en plus de son amont. Ils sont copiés dans la branche quand elle reçoit son premier amont (un premier {$push} qui le définit, ou une branche créée depuis une branche distante). Les branches existantes ne changent pas : utilisez leur dialogue Définir l'amont..."
default_push_targets_none = "(aucun distant configuré)"

