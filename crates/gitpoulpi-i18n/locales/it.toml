mouse_gestures_in_1 = "i terminali non cambiano la forma del puntatore del sistema per quasi nulla, quindi un cambio di sfondo/primo piano al passaggio è spesso l'unico segnale «è cliccabile» - ogni pulsante, casella, scheda, riga di menu, azione dell'intestazione di un pannello e il pulsante di chiusura × si illuminano al passaggio; una cella del Log, gli altri ref di un commit e la barra di un file/blame mostrano invece un tooltip col valore"
mouse_gestures_in_2 = "un divisore di pannello o il confine di una colonna del Log lo ridimensiona (oltre il minimo, il pannello si comprime); l'intestazione di una colonna del Log trascinata oltre una vicina la riordina; trascinare un ref su un altro branch apre un menu con le azioni applicabili (Esc annulla)"
mouse_gestures_in_3 = "trascinare sul testo di un diff, di una vista file, di Blame o della Cronologia del file lo seleziona, doppio clic su una parola; y o Ctrl+C lo copia (solo testo del file, mai le barre); le altre occorrenze di una parola selezionata sono evidenziate nel diff e nell'editor (e segnate sul righello)"
mouse_gestures_in_4 = "scorre l'elenco o il diff con focus/sotto il puntatore; Shift+rotella (entrambe le grafie che i terminali riportano) scorre invece un diff/vista file/blame *in orizzontale*, con l'a capo automatico disattivato"
mouse_gestures_in_5 = "apre un menu contestuale dove ne esiste uno (vedi la sezione di ogni pannello sopra); l'equivalente da tastiera è sempre {{*global.context_menu}}"
mouse_gestures_in_6 = "ogni azione «Copia ...» chiede gli appunti al *terminale* tramite OSC 52 - una TUI non può raggiungerli direttamente; un terminale che ignora la sequenza semplicemente non copia"
mouse_gestures_in_7 = "i suggerimenti di ridimensionamento/puntatore/mano aperta sono inviati tramite OSC 22 sui terminali che lo supportano (kitty, foot, xterm; irregolare altrove) - i divisori trascinabili e i confini delle colonne si illuminano anche nel buffer dell'app, che non richiede alcuna collaborazione del terminale"
git_actions_then_25 = "apri il menu LFS (il pulsante LFS della barra; le sue righe sono anche nella palette)"
git_actions_then_26 = "LFS: {$fetch} degli oggetti di tutti i riferimenti"
git_actions_then_27 = "LFS: scrivi il contenuto reale al posto dei puntatori (offline)"
git_actions_then_28 = "LFS: {$pull} (scarica, poi scrivi il contenuto)"
git_actions_then_29 = "LFS: {$push} degli oggetti di tutti i riferimenti"
git_actions_then_30 = "LFS: pulisci l'archivio LFS locale"
diff_view_encoding = "sceglie la codifica con cui viene letto il file (Rilevamento automatico, UTF-8, UTF-16, Windows-1252, ...)"
commit_composer_bottom_14 = "attiva o disattiva «Salta gli hook»: il {$commit} viene creato senza eseguire gli hook di git (pannello Stato)"
repositories_and_tabs_39 = "filtra le voci della cartella mentre scrivi (senza distinguere maiuscole e minuscole; nel pannello sinistro o in quello Contenuto `/` porta lì anche il focus; Enter o Giù salta alla prima corrispondenza, Esc lo svuota; si svuota quando cambi cartella)"
repositories_and_tabs_40 = "attiva o disattiva Mostra le cartelle sorelle (l'albero a sinistra elenca anche le altre cartelle di ogni livello aperto - viene ricordato)"
split_1 = "assegna il file, l'hunk o la riga selezionati a quel {$commit} (0 lo lascia non assegnato, n lo mette in un nuovo {$commit}); Tab passa dai {$commits} alle modifiche e viceversa, Enter o e modifica un messaggio, d elimina un {$commit}; {{compose.apply}} divide"
split_2 = "seleziona singole righe dentro l'hunk corrente (Shift+Su/Giù estende la selezione)"
split_3 = "sposta il {$commit} in su o in giù nell'elenco (K e J fanno lo stesso)"
split_4 = "rimette ogni modifica com'era all'apertura dell'editor"
split_5 = "divide il {$commit} con il piano così com'è; finché il piano non è valido il pulsante è disattivato e la barra di stato ne spiega il motivo"
split_6 = "attiva o disattiva Firma i {$commits} (attivo all'apertura dell'editor se l'impostazione gpgSign del repository è true)"
split_7 = "nel pannello {$commits} seleziona quel {$commit}; m o Enter su una modifica elenca i {$commits} a cui assegnarla"
rewrite_9 = "apre la scheda Dimensioni e analizza la cronologia: i file e le cartelle più grandi, e i file eliminati ma ancora conservati; le righe spuntate diventano regole di rimozione"
rewrite_host_howto = "spiega come far passare una riscrittura su un branch protetto dall'host: togliere la protezione, fare un {$push_noun} con un nuovo nome o ricreare il repository; non viene fatto nulla al posto tuo"
rewrite_ai_rules = "crea le regole di riscrittura dalla tua descrizione con l'IA (nulla viene mostrato in anteprima né applicato)"
log_columns_2 = "scorri lateralmente le colonne del Log quando mantengono le loro larghezze (la disposizione Scorri lateralmente, scelta nel selettore delle colonne, nelle Impostazioni o con s mentre una colonna è scelta); nella disposizione adattata ogni colonna sta nel pannello"

