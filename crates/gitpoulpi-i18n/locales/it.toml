startup_tab_outside_repo_help = "La scheda su cui si apre un avvio quando la cartella da cui parte non è un repository, ad esempio la cartella utente. Ultima scheda apre quella attiva all'ultima chiusura (Home se Ricorda le schede è disattivato o non c'è nulla di ricordato). Radar apre Home se il Radar è disattivato. Letto una sola volta all'avvio; richiede un riavvio per avere effetto."
startup_tab_launcher = "Scheda di avvio dal launcher"
startup_tab_launcher_help = "La scheda su cui si apre un avvio quando GitPoulpi viene avviato dal suo collegamento sul desktop o nel menu Start (vedi Launcher più sotto), qualunque sia la cartella. Ha la precedenza sulle due impostazioni qui sopra; Ultima scheda e Radar si comportano come sopra. Letto una sola volta all'avvio; richiede un riavvio per avere effetto."
group_worktree_tabs = { git = "Raggruppa le schede dei worktree", local = "Raggruppa le schede degli alberi di lavoro" }
group_worktree_tabs_help = { git = "Le schede dei worktree collegati di un repository stanno subito dopo la scheda di quel repository, e una scheda di worktree trascinata altrove torna accanto alla sua. Se disattivato, le schede restano dove le metti. Attivandolo si raggruppano le schede già aperte.", local = "Le schede degli alberi di lavoro collegati di un repository stanno subito dopo la scheda di quel repository, e una scheda di albero di lavoro trascinata altrove torna accanto alla sua. Se disattivato, le schede restano dove le metti. Attivandolo si raggruppano le schede già aperte." }
allow_agent_view_control = "Consenti agli agenti IA di pilotare la vista"
allow_agent_view_control_help = "Se attivo, un agente IA (tramite MCP o `gitpoulpi ui`) può chiedere a questa finestra di mostrare un commit, un file o un avviso. Non modifica mai nulla nel repository. Se disattivato, questa finestra non li accetta. Letto all'apertura di una finestra."
allow_ui_propose = "Lascia che gli agenti IA propongano modifiche da confermare"
allow_ui_propose_help = "Se attivo, un agente IA può aprire un dialogo precompilato per te: un nuovo messaggio per un commit, un messaggio di commit nel compositore, un nuovo branch o tag. È contrassegnato ✦ Proposto da <agente> e nulla cambia finché non premi la conferma del dialogo; Esc lo rifiuta. Se disattivato (predefinito), `ui propose` e gli strumenti MCP ui_propose_* vengono rifiutati."
clone_root = "Cartella di clonazione predefinita"
clone_root_help = "Da dove parte «Dove clonare» nel dialogo Clona. Vuoto usa il valore predefinito del sistema: %USERPROFILE%\\source\\repos su Windows, ~/src altrove."
# context: setting: which source the Clone dialog opens on (Last used, Clone with URL, or an integration)
clone_start_source = "La finestra Clona si apre su"
clone_start_source_help = "L'origine su cui si apre la finestra Clona. Ultima usata riapre quella mostrata alla precedente chiusura; Clona con URL parte sempre dal modulo URL; oppure scegli una delle integrazioni collegate. Un'origine non più disponibile ripiega su Clona con URL."
# context: option of the "Clone dialog starts on" setting: the source shown when the dialog was last closed
clone_start_last = "Ultima usata"
browse_root = "Cartella di esplorazione predefinita"
browse_root_help = "Dove si apre Sfoglia (il selettore di cartelle, dalla scheda Home) per impostazione predefinita. Vuoto fa aprire Sfoglia sull'ultima cartella scelta - o sulla cartella home, la prima volta - invece che su una fissa."
heading_auto_stash = { git = "Auto-stash", local = "Accantonamento automatico" }
