heading_undo = "Cronologia annullamenti"
log_level = "Livello del registro"
log_retention_days = "Conserva i file di registro"
# context: setting help: how long log files are kept; a number and a unit (days, weeks, months, years) on one line
log_retention_help = "I file di registro più vecchi vengono eliminati all'avvio di GitPoulpi. Anche il file di ogni giorno ha un tetto, dato dall'impostazione della dimensione qui sotto."
# context: setting: where the data GitPoulpi keeps for one repository lives (ref filters, fold state, workflow, caches)
repo_data_location = "Posizione dei dati del repository"
# context: help of the setting above
repo_data_location_help = "Dove vengono conservati i dati di ogni repository (filtri dei ref, workflow, cache). Dentro .git la directory di lavoro resta pulita; cambiando l'impostazione i dati esistenti vengono migrati."
# context: option of the repository data location: inside the repository's .git folder
repo_data_in_git_dir = "Dentro .git (cartella gitpoulpi)"
# context: option of the repository data location: a .gitpoulpi folder in the working tree
repo_data_in_worktree = "Nella directory di lavoro (cartella .gitpoulpi)"
# context: option of the repository data location: the user's own data folder
repo_data_user_data = "Nella mia cartella dati utente (fuori dal repository)"
log_max_file_mb = "Dimensione massima di un file di registro"
log_timings = "Mostra la durata delle operazioni"
log_timings_help = "Aggiunge la durata in millisecondi a ogni operazione del registro attività (scheda \"Operazioni git\")."
log_extended = "Registrazione estesa"
log_extended_help = "Elenca anche le operazioni in background (auto-{$fetch}, aggiornamento, controllo dello stato) con la loro durata."
# context: setting: how the status line counts the total commits (the dropdown choices are in settings_value)
commit_count = "Conta il totale dei {$commits} con"
# context: help of the setting above; mentions antivirus software
commit_count_help = "Come la barra di stato ricava il totale in «caricati / totale». Git di sistema avvia un processo git (di solito la scelta più veloce). libgit2 conta dentro GitPoulpi senza avviare alcun processo: sceglilo se un antivirus analizza ogni comando e rallenta git. Disattivato mostra solo i {$commits} caricati. Si applica subito."
auto_stash = { git = "Auto-{$stash} prima di checkout, {$pull}, {$merge} o {$rebase}", local = "Accantona in automatico prima di cambio di branch, scaricamento, unione o ribasamento" }
auto_stash_help = { git = "Cosa fare quando un checkout, pull, merge o rebase è bloccato da modifiche locali. ask: un dialogo propone di metterle in stash, eseguire l'operazione e riprenderle; always: lo fa senza chiedere; never: rifiuta, come fa git.", local = "Cosa fare quando un cambio di branch, uno scaricamento, un'unione o un ribasamento è bloccato da modifiche locali. ask: un dialogo propone di accantonarle, eseguire l'operazione e riprenderle; always: lo fa senza chiedere; never: rifiuta, come fa git." }
include_untracked_in_autostash = { git = "Includi i file non tracciati nell'auto-stash", local = "Includi i file non tracciati nell'accantonamento automatico" }
include_untracked_in_autostash_help = { git = "Se lo stash automatico prende anche i file non tracciati (altrimenti solo le modifiche tracciate vengono messe da parte e ripristinate).", local = "Se l'accantonamento automatico prende anche i file non tracciati (altrimenti solo le modifiche tracciate vengono messe da parte e ripristinate)." }
hosting_refresh_minutes = "Aggiornamento di {$prs} e issue"
hosting_refresh_minutes_help = { git = "Ogni quanto gli elenchi {$prs} e Issue della barra laterale (e il chip della {$pr_abbr} collegata nella barra degli strumenti) interrogano di nuovo l'host. 0 spegne il timer; si aggiornano comunque all'apertura di un repository, al cambio di branch, dopo un push o un fetch e su richiesta.", local = "Ogni quanto gli elenchi {$prs} e Issue della barra laterale (e il chip della {$pr_abbr} collegata nella barra degli strumenti) interrogano di nuovo l'host. 0 spegne il timer; si aggiornano comunque all'apertura di un repository, al cambio di branch, dopo un invio o un recupero e su richiesta." }
pr_terminology = "Terminologia delle richieste di revisione"
pr_terminology_help = { git = "La parola usata per una richiesta di revisione del codice ospitata, in tutta la TUI. Auto segue l'host del repository: Merge request per GitLab, Pull request per gli altri host. Pull request o Merge request forza quella parola. Si applica subito.", local = "La parola usata per una richiesta di revisione del codice ospitata, in tutta la TUI. Auto segue l'host del repository: Richiesta di unione per GitLab, Richiesta di integrazione per gli altri host. Richiesta di integrazione o Richiesta di unione forza quella parola. Si applica subito." }
hide_finished_pr_chip = { git = "Nascondi il chip della {$pr} quando è chiusa o il {$merge_noun} è avvenuto", local = "Nascondi il chip della {$pr} quando è chiusa o l'{$merge_noun} è avvenuta" }
hide_finished_pr_chip_help = { git = "Il chip nella barra degli strumenti mostra l'ultima {$pr} del branch attivo. Attivo: quando quella {$pr} è chiusa o il {$merge_noun} è avvenuto, il chip sparisce e al suo posto il branch offre il chip attenuato «+ {$pr_abbr}», come se non ne avesse una. Disattivo: il chip mostra sempre l'ultima {$pr}, qualunque sia il suo stato. Si applica subito.", local = "Il chip nella barra degli strumenti mostra l'ultima {$pr} del branch attivo. Attivo: quando quella {$pr} è chiusa o l'{$merge_noun} è avvenuta, il chip sparisce e al suo posto il branch offre il chip attenuato «+ {$pr_abbr}», come se non ne avesse una. Disattivo: il chip mostra sempre l'ultima {$pr}, qualunque sia il suo stato. Si applica subito." }
heading_external_tools = "Strumenti esterni"
external_editor = "Editor esterno"
external_editor_help = "Comando per la voce «Apri in <editor>» di un file; {{file}} è il percorso completo del file (aggiunto in coda se manca). Vuoto: VS Code (`code`) se è nel PATH, altrimenti il programma predefinito del sistema."
external_diff_tool = "Strumento diff esterno"
external_diff_tool_help = "Comando per «Apri nello strumento diff esterno»; {{local}} è la versione di cui è stato fatto il commit (o in stage), {{remote}} la versione confrontata. Vuoto: `git difftool`, con il `diff.tool` configurato in git."
external_merge_tool = { git = "Strumento di merge esterno", local = "Strumento di unione esterno" }
external_merge_tool_help = "Comando per «Apri nello strumento di merge esterno» su una scheda di conflitto; {{base}}, {{local}} (A, corrente), {{remote}} (B, in entrata) e {{merged}} (dove lo strumento scrive il risultato; messo in stage se termina con successo). Vuoto: `git mergetool`, con il `merge.tool` configurato in git."
file_explorer = "Gestore file"
file_explorer_help = "Comando per «Mostra nella cartella»; {{path}} è il percorso completo del file, {{dir}} la sua cartella. Windows: explorer.exe /select,\"{{path}}\" seleziona il file; Linux: xdg-open \"{{dir}}\"; macOS: open -R \"{{path}}\"."
ai_assistant = "Assistente IA"
launch = "Apri una finestra per gli agenti"
launch_help = "Quando un agente IA chiede di mostrare qualcosa e nessuna finestra di GitPoulpi è aperta da nessuna parte, esegui questo per aprirne una: off (mai, predefinito), un terminale (kitty, foot, WezTerm, Windows Terminal, ...), una nuova scheda/riquadro/workspace in un multiplexer (tmux, zellij, cmux, ...) oppure custom, che usa il modello qui sotto. L'agente deve comunque richiederlo (`--launch`), oppure il suo ui_control deve essere auto. Ha effetto alla richiesta successiva."
launch_command = "Comando di avvio (custom)"
launch_command_help = "Usato quando la scelta sopra è custom. Diviso in argomenti (usa '...' o \"...\" per le virgolette), senza shell. {{repo}} è la cartella del repository, {{session}} il nome della sessione e {{gitpoulpi}} questo programma. Esempio: kitty --directory {{repo}} {{gitpoulpi}} --session {{session}}"
tab_dir_follow = "Segui la cartella della scheda attiva"
tab_dir_follow_help = "Un programma non può cambiare la cartella della sua shell, quindi offre due modi per arrivarci. buttons (predefinito): finché la scheda attiva non è la cartella da cui è stato avviato GitPoulpi, la barra delle schede mostra Esci e cd qui (solo se avviato tramite il wrapper della shell, vedi `gitpoulpi shell-init`). auto: niente pulsanti; uscendo la shell va sempre con cd alla scheda attiva, e un terminale si apre da solo ogni volta che apri una nuova scheda (non per le schede ripristinate all'avvio)."
forget_all_usernames_and_passwords = "Dimentica tutti i nomi utente e le password"
forget_all_usernames_and_passwords_help = "Rimuove ogni token che GitPoulpi ha memorizzato nel tuo credential helper."
mcp_server = "Server MCP"
mcp_server_help = "Se attivo, un agente IA può avviare il server MCP (`gitpoulpi mcp serve`, oppure `--http` per l'endpoint di rete). Se disattivato, si rifiuta di avviarsi. Salvato in `mcp.enabled`. Una modifica vale dal prossimo avvio del server da parte di un agente; un server già in esecuzione mantiene le impostazioni con cui è partito."
mcp_port = "Porta del server MCP"
mcp_port_help = "La porta su cui ascolta `gitpoulpi mcp serve --http` quando non viene dato alcun indirizzo (la parte host di `mcp.bind` resta invariata, 127.0.0.1 di base, solo loopback salvo --allow-remote). Vale dal prossimo avvio del server da parte di un agente; un server in esecuzione mantiene la sua porta."
mcp_bind_unreadable = "`mcp.bind` è «{bind}», che non ha una porta leggibile. Impostare qui una porta ne mantiene l'host e sostituisce il resto."
undo_off_note = "Annulla è disattivato - attiva «Annulla attivo» per impostare la profondità"
use_mailmap = "Mostra gli autori tramite .mailmap"
use_mailmap_help = "Mostra ogni autore con il nome indicato dal .mailmap del repository nel Log, in blame e nella cronologia del file. I {$commits} in sé non cambiano. Ha effetto subito."
auto_prune_tags = "Prune automatico dei {$tags}"
auto_prune_tags_help = "A ogni {$fetch_noun} elimina anche i {$tags} locali che il remoto ha eliminato. Sono toccati solo i {$tags} che erano sul remoto: un {$tag} che non hai mai inviato resta dov'è. Disattivato per impostazione predefinita, come in git."

