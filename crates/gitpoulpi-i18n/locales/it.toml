https_mode_help = { git = "Come fetch, pull, push e clone si autenticano via HTTPS. credential_helper: l'helper di git (Git Credential Manager, libsecret, Keychain). prompt: ignora qualsiasi helper e lascia che git chieda da terminale. none: nessuna credenziale, solo remoti pubblici. Si applica al trasferimento successivo.", local = "Come recupero, scaricamento, invio e clonazione si autenticano via HTTPS. credential_helper: l'helper di git (Git Credential Manager, libsecret, Keychain). prompt: ignora qualsiasi helper e lascia che git chieda da terminale. none: nessuna credenziale, solo remoti pubblici. Si applica al trasferimento successivo." }
