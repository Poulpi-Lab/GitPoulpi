btn_howto = "Come procedere"
title = "Superare la protezione dell'host"
intro = "L'host rifiuta la cronologia riscritta di {names} perché {provider} la protegge. GitPoulpi non cambia mai le impostazioni dell'host al posto tuo; ci sono tre strade, dalla meno drastica alla più drastica."
unknown = "Impossibile leggere la protezione dell'host: {why}"
not_asked = "Questo repository non è collegato a un host, quindi la sua protezione non è stata letta. Collegalo nella barra laterale per vedere quali branch sono protetti."
