merge_side_by_side_min_width = { git = "Editor di merge: affiancato da (colonne)", local = "Editor di unione: affiancato da (colonne)" }
merge_side_by_side_min_width_help = { git = "L'editor dei conflitti di merge mostra A e B affiancati quando la sua area è larga almeno questo numero di colonne (le righe lunghe scorrono lateralmente con Shift+rotella o Shift+frecce); più stretto, mostra un lato alla volta dietro delle schede. 100 per impostazione predefinita; 40 è il valore minimo, 0 significa sempre affiancato. L'editor nasconde i pannelli Refs e Stato mentre è aperto, quindi di solito ha tutta la finestra.", local = "L'editor dei conflitti di unione mostra A e B affiancati quando la sua area è larga almeno questo numero di colonne (le righe lunghe scorrono lateralmente con Shift+rotella o Shift+frecce); più stretto, mostra un lato alla volta dietro delle schede. 100 per impostazione predefinita; 40 è il valore minimo, 0 significa sempre affiancato. L'editor nasconde i pannelli Refs e Stato mentre è aperto, quindi di solito ha tutta la finestra." }
diff_word_wrap = "A capo automatico"
diff_word_wrap_help = "Manda a capo le righe lunghe nelle viste diff invece di troncarle con i puntini di sospensione. L'editor integrato e la vista blame scorrono lateralmente e non vanno a capo. È anche l'interruttore dell'a capo della vista diff."

[settings_ui]
theme = "Tema"
theme_help = "Colori di tutta l'interfaccia. Scorrere l'elenco mostra l'anteprima di ogni tema; Enter lo mantiene, Esc torna indietro. Sistema segue il terminale (il suo sfondo chiaro o scuro, rilevato una volta all'avvio; Scuro se non si può determinare). I tuoi file di tema nella cartella themes/ della configurazione compaiono in fondo."
theme_system = "Sistema (segue il terminale)"
follow_theme = "Segui il tema"
theme_swatches = "Colori"
graph_lane_background = "Sfondo delle corsie del grafo"
graph_lane_background_help = "Disattivato: trasparente, niente dietro le corsie (predefinito). Tinta di riga: una tenue fascia del colore della corsia del commit nella colonna Grafo, più una sottile barra di quel colore sul bordo destro della colonna. Una corsia memorizzata viene letta come Tinta di riga. Si applica alla chiusura delle Impostazioni."
graph_row_tint_strength = "Intensità della tinta di riga"
graph_row_tint_strength_help = "Quanto è sbiadita la fascia Tinta di riga: Forte (l'originale), Media (predefinita) o Sottile. Sbiadisce solo la fascia; la barra sul bordo destro della colonna mantiene il colore pieno. Si applica alla chiusura delle Impostazioni."
graph_row_tint_strength_coming = "imposta prima lo sfondo delle corsie del grafo su Tinta di riga"
toolbar_position = "Posizione della barra degli strumenti"
toolbar_position_help = "Dove sta la barra degli strumenti: In alto, In basso (predefinito), A sinistra o A destra. A sinistra e A destra ne fanno una colonna accanto ai pannelli; una finestra sotto le 80 colonne la disegna in basso. Si applica subito."
toolbar_align = "Allineamento dei pulsanti della barra degli strumenti"
toolbar_align_help = "Dove stanno i pulsanti lungo la barra: Inizio (predefinito), Centro o Fine. L'inizio è la sinistra di una riga e l'alto di una colonna; la fine è la destra e il basso. Si applica subito."
# context: label of the setting that decides whether a dialog the user moved or resized keeps its place
dialog_geometry = "Ricorda posizione e dimensione delle finestre"
dialog_geometry_help = "Un'unica impostazione per tutte le finestre. Le finestre si possono spostare (trascina la barra del titolo, o Ctrl+N poi m); quelle più grandi si possono anche ridimensionare (trascina i bordi e gli angoli in basso). Ogni finestra ricorda la propria posizione e dimensione. Per questa sessione (predefinito): restano così fino alla chiusura di GitPoulpi. Salvata su disco: restano così anche al prossimo avvio. Mai: ogni finestra si apre nella posizione e con la dimensione predefinite. Si applica subito."
toolbar_pr_pinned = "Fissa il pulsante {$pr} in fondo"
toolbar_pr_pinned_help = "Attivo (predefinito), il pulsante {$pr} sta all'estremità della barra degli strumenti (a destra, o in basso in una colonna), qualunque sia l'allineamento. Disattivo, scorre con gli altri pulsanti e si allinea con loro. Si applica subito."
statusbar_position = "Posizione della barra di stato"
statusbar_position_help = "Dove sta la barra di stato (branch, conteggi, messaggi, scorciatoie): In alto, sopra le schede dei repository, o In basso (predefinito). La scheda Home mantiene la propria barra di stato in basso. Si applica subito."
tabs_position = "Posizione della barra delle schede"
tabs_position_help = "Dove stanno le schede dei repository: In alto (predefinito), In basso o A sinistra, un elenco con una scheda per riga al bordo sinistro della finestra. Una finestra sotto le 80 colonne le disegna in alto. Accanto a una barra degli strumenti in colonna, le schede restano all'esterno. Si applica subito."
graph_color_theme = "Tema colori del grafo"
graph_color_theme_help = "La tavolozza dei colori delle corsie del grafo del Log. Segui il tema usa la tavolozza del tema scelto; ogni altra voce la sostituisce, quindi qualsiasi tema si può combinare con qualsiasi tavolozza. Si applica alla chiusura delle Impostazioni."
graph_renderer = "Rendering del grafo"
graph_renderer_help = "auto disegna il grafo come vera immagine su un terminale che lo supporta, e come caratteri ovunque altrove - anche dentro tmux o zellij, che ereditano l'ambiente del terminale ma non fanno passare l'immagine, e dentro herdr a meno che la sua impostazione kitty_graphics sia attiva. image forza l'immagine, text la esclude. Richiede un riavvio."
image_protocol = "Protocollo immagini"
image_protocol_help = "Come le immagini (il grafo come immagine, gli avatar degli autori) arrivano al terminale. auto: il protocollo grafico Kitty in kitty, Ghostty e in un herdr la cui configurazione imposta kitty_graphics = true; immagini inline iTerm2 in WezTerm, iTerm2 e mintty; sixel (solo avatar) in Windows Terminal, foot, Konsole e mlterm; caratteri altrove. kitty, iterm2 o sixel forza quel protocollo (kitty per un herdr la cui configurazione sta altrove); none disattiva le immagini. Richiede un riavvio."
kitty_keyboard = "Protocollo tastiera Kitty"
kitty_keyboard_help = "auto chiede al terminale, all'avvio ed entro circa 100 ms, se parla il protocollo tastiera di kitty, e lo usa se sì: le combinazioni che i terminali tradizionali non distinguono (Control con punteggiatura, cifre, Shift o Enter) arrivano allora come sono, invece di collidere con i codici di controllo. Un terminale che non risponde mantiene i tasti tradizionali. off non tocca mai la modalità tastiera del terminale. Richiede un riavvio."
color_depth = "Profondità colore"
color_depth_help = "auto usa il colore a 24 bit, tranne sui terminali che non lo mostrano (Terminale di Apple, console Linux o un terminale a 256 colori senza COLORTERM), dove i colori sono mappati sulle 256 o 16 voci più vicine. truecolor, 256 e 16 impongono una profondità. Si applica subito."
text_cursor = "Text cursor"
text_cursor_help = "terminal puts the terminal's own cursor at the caret of the focused text field, as a bar: your terminal's cursor settings apply and an input method's candidate window opens at the caret. drawn paints GitPoulpi's own caret (a block or an underscore) and keeps the terminal cursor hidden. Applies at once."
graph_show_stashes = { git = "Mostra gli stash nel grafo", local = "Mostra gli accantonamenti nel grafo" }
graph_show_stashes_help = { git = "Ogni stash ha una riga tutta sua nel Log, alla sua data: un piccolo riquadro su una corsia accanto al commit su cui è stato creato, unito a esso da una linea tratteggiata. Selezionarlo mostra cosa ha cambiato; il clic destro (o .) offre Pop, Applica ed Elimina. Se disattivato, gli stash restano solo nella sezione STASH. Non disegnati durante il solo.", local = "Ogni accantonamento ha una riga tutta sua nel Log, alla sua data: un piccolo riquadro su una corsia accanto al commit su cui è stato creato, unito a esso da una linea tratteggiata. Selezionarlo mostra cosa ha cambiato; il clic destro (o .) offre Estrai, Applica ed Elimina. Se disattivato, gli accantonamenti restano solo nella sezione ACCANTONAMENTI. Non disegnati durante il solo." }
ref_connector = "Connettore ref-commit"
ref_connector_help = "Una linea sottile da ogni pillola di ref nella colonna Ref al cerchio del suo commit nel grafo. Riempie solo lo spazio vuoto: le corsie che attraversa restano sopra e nulla si sposta. Disegnato solo quando la colonna Ref è subito a sinistra della colonna Grafo."
log_wip_counts_in_message = "Mostra i conteggi delle modifiche WIP nel messaggio quando la colonna Modifiche è nascosta"
log_wip_counts_in_message_help = "La riga WIP mostra quanti file sono modificati, aggiunti ed eliminati. Con la colonna Modifiche visibile (clic destro sull'intestazione del Log per mostrarla) i conteggi vanno sempre in quella colonna, come per ogni commit. Se è nascosta, vanno nel messaggio WIP finché questa opzione è attiva; se disattiva non mostra alcun conteggio."
avatars = "Avatar degli autori"
avatars_help = "Immagini degli autori. graph disegna l'autore di ogni commit dentro il suo cerchio nel grafo (solo grafo come immagine; con il grafo a testo un'iniziale colorata va invece nella colonna Autore). author mette un'immagine rotonda all'inizio della colonna Autore. Entrambe la mostrano anche nel pannello di dettaglio del commit. Disattivato per impostazione predefinita: attivarlo invia a gravatar.com via HTTPS un hash SHA-256 dell'e-mail di ogni autore - l'hash di un indirizzo noto o intuibile non è anonimo - e, in un repository con un remoto github.com, chiede una volta per autore all'API di GitHub quale account ha fatto uno dei suoi commit (usando il token dell'integrazione GitHub, se c'è). Finché non arriva un'immagine, e quando non ne esiste, vengono mostrate le iniziali o il semplice cerchio. off non invia nulla in rete."
avatar_sources = "Fonti degli avatar"
avatar_sources_help = "Dove si cerca l'immagine di un autore, in ordine (un indirizzo noreply di GitHub indica sempre per primo il suo account). hosting_gravatar: l'integrazione GitHub, GitLab o Bitbucket connessa il cui host corrisponde al remoto del repository (autore del commit o ricerca utenti di GitHub, avatar-per-e-mail o API utenti di GitLab), poi Gravatar; senza un'integrazione corrispondente connessa, Gravatar viene per primo e un remoto github.com è comunque interrogato per ultimo, senza autenticazione. gravatar_hosting: l'inverso. gravatar o hosting: solo quella. Quando nessuna ha un'immagine, viene disegnato l'avatar di riserva qui sotto. Si applica agli autori non ancora cercati."
avatar_fallback = "Avatar di riserva"
avatar_fallback_help = "Cosa ottiene un autore senza immagine. identicon: un motivo 5x5 speculare in stile GitHub in un colore derivato dalla sua e-mail, generato in locale (senza rete), come immagine su un terminale con immagini e come caratteri a blocchi altrove. initials: un badge colorato con le sue iniziali."
composer_files = "Proposte del compositore"
composer_files_help = "Come si apre la revisione del compositore di commit IA. expanded: ogni commit proposto elenca i suoi file. collapsed: solo le righe dei commit; Destra/Sinistra (o un clic sulla freccia) ne apre uno."
blame_side = "Annotazioni del blame"
blame_side_help = "Lato della vista Blame in cui sta la colonna delle annotazioni (avatar, autore, età, riepilogo). right: a destra del codice. left: a sinistra del codice."
column_resize = "Ridimensionamento delle colonne"
column_resize_help = "Come si afferra il bordo di una colonna nel Log, nel Radar e nella colonna laterale delle viste dei file. line: una linea sottile su tutta l'altezza della tabella mentre il puntatore è sul bordo, con un piccolo segno nell'intestazione. header: nessuno spazio e nessun segno, si ridimensiona solo dall'intestazione, dove si accende il primo carattere della cella successiva."
blame_width = "Larghezza delle annotazioni del blame"
blame_width_help = "Larghezza della colonna delle annotazioni in celle (da 24 a 90). Trascina il bordo nella vista Blame o usa i tasti allarga / restringi; la nuova larghezza viene salvata qui."
ref_tree = "Albero delle cartelle dei branch"
ref_tree_help = "La barra laterale Refs raggruppa i nomi dei branch su `/` in cartelle comprimibili, con ogni remoto come nodo di primo livello. Se disattivato, una riga piatta per branch. `y` nel pannello Refs lo attiva al volo e scrive la scelta qui."
reveal_on_ref_click = "Un clic su un ref lo mostra nel grafo"
reveal_on_ref_click_help = "Un singolo clic su un ref nel pannello Refs scorre il Log fino a dove punta e fa lampeggiare la riga. La selezione del Log e il pannello di destra restano invariati. Disattivato, un clic seleziona solo la riga della barra laterale. «Mostra nel grafo» nel menu del ref, il suo tasto nel pannello Refs e il comando della palette funzionano in ogni caso."
graph_ghost_ref = "Mostra un branch fantasma sul {$commit} evidenziato"
graph_ghost_ref_help = "Nella colonna Ref del Log, il {$commit} evidenziato che non ha un ref proprio mostra una pillola sbiadita con il nome del branch a cui appartiene (altrimenti il suo branch remoto), dedotto dalla cronologia. Passando sulla pillola se ne vede il tipo. Un clic non fa nulla di particolare; il comando di creazione branch crea un branch. Viene disegnata solo se la colonna Ref ha spazio. Se disattivato, non compare."
mouse_enabled = "Mouse attivo"
mouse_enabled_help = "Se disattivato, la selezione con trascinamento resta al tuo terminale. Richiede un riavvio."
mouse_scroll_lines = "Righe della rotella del mouse"
mouse_scroll_lines_help = "Quanti commit sposta uno scatto della rotella nel Log. Richiede un riavvio."
heading_date_time = "Data e ora"
heading_layout = "Disposizione"
date_locale = "Lingua di data/ora"
date_locale_help = "system: i nomi di mesi e giorni seguono la lingua dell'interfaccia. english: sempre in inglese, qualunque sia la lingua. Vale per tutte le date di questa pagina."
diff_layout = "Layout predefinito"
diff_layout_help = "Inline (una colonna) o Split (prima e dopo affiancati). Ripreso dall'ultimo diff che hai guardato, in questa finestra e tra un riavvio e l'altro - cambiarlo qui imposta solo da cosa parte una *nuova* sessione."
diff_hunks_only = "Solo hunk"
diff_hunks_only_help = "Attivo mostra solo gli hunk modificati con qualche riga di contesto; disattivo mostra tutto il file con le modifiche evidenziate sul posto. Ripreso come il layout."
diff_show_whitespace = "Mostra le modifiche di soli spazi"
diff_show_whitespace_help = "Se disattivato, un hunk che differisce solo per gli spazi diventa contesto."
input_color = "Colore dei campi di input"
input_color_help = "Sfondo dei campi di testo. Segui il tema (predefinito) usa quello del tema; gli altri sono colori scuri che lo sostituiscono. Personalizzato... usa il colore esadecimale qui sotto. Si applica subito, senza riavvio."
input_color_custom = "Colore personalizzato dei campi di input"
input_color_custom_help = "#rrggbb, usato quando il colore dei campi di input è Personalizzato. Si applica subito."
minimap = "Minimappa"
minimap_help = "Un'immagine dell'intero file accanto alla barra di scorrimento verticale del diff (modalità file intero) e dell'editor, con la parte visibile evidenziata; clic per saltare. Una vera immagine dove il terminale le disegna, celle braille altrove. Anche `M` nel diff e Attiva/disattiva minimappa nella palette."
date_format = "Formato della data"
date_format_help = "La colonna data di Blame / Cronologia del file."
date_time_format = "Formato di data/ora"
date_time_format_help = "La colonna Data del Log stessa."
date_verbose_format = "Formato della data esteso"
date_verbose_format_help = "La riga Data del pannello di dettaglio del commit, il tooltip al passaggio sulla colonna Data e Copia > Data."
preview = "anteprima"
sidebar_sections_scope = "Sezioni della barra laterale"
sidebar_sections_scope_help = "Di chi è la scelta delle sezioni mostrate o nascoste nella barra laterale. repository: ogni repository ha il suo insieme (quello globale è il punto di partenza). global: un solo insieme per tutti i repository. Passare dall'uno all'altro non fa perdere nessuno dei due insiemi."
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "Disposizione delle colonne"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "Come il Log dispone le sue colonne. fit: ogni colonna sta nel pannello e solo Messaggio si adatta. scroll: le colonne mantengono le loro larghezze, anche Messaggio, e la tabella scorre lateralmente quando è più larga del pannello."

[settings_git]
default_backend = "Backend di git"
default_backend_help = "Globale. Un daemon in esecuzione mantiene il backend con cui è partito."
default_backend_warning = "Ha effetto per i daemon avviati dopo questa modifica."
pull_mode = { git = "Pulsante Pull", local = "Pulsante Scarica" }
default_encoding = "Codifica predefinita"
default_encoding_help = "Usata per mostrare contenuti di file, blame e diff che non sono UTF-8 valido (l'UTF-8 valido non viene mai ridecodificato). Un repository può sovrascriverla qui sotto. Solo visualizzazione: stage e patch mantengono esattamente i byte del file."
push_behavior = { git = "Pulsante Push", local = "Pulsante Invia" }
push_behavior_help = { git = "direct: push subito verso il remoto predefinito. ask: apre un piccolo menu con il remoto predefinito preselezionato. Il ▾ del pulsante chiede sempre.", local = "direct: invia subito al remoto predefinito. ask: apre un piccolo menu con il remoto predefinito preselezionato. Il ▾ del pulsante chiede sempre." }
repo_encoding_help = "Come vengono decodificati per la visualizzazione i contenuti dei file, il blame e i diff quando non sono UTF-8 valido (solo questo repository; inherited: Codifica predefinita in questa pagina). Lo stage non ricodifica mai nulla."
core_autocrlf_help = "Scritto nella configurazione git di questo repository (core.autocrlf), quindi lo vedono git e ogni altro strumento. true: LF in CRLF al checkout; input: CRLF in LF solo al salvataggio nella cronologia; false: nessuna conversione. (ereditato): rimuove il valore del repository così vale la tua configurazione git globale. Annullabile."
core_eol_help = "Scritto nella configurazione git di questo repository (core.eol): il fine riga che git usa per i file di testo dell'albero di lavoro (lf, crlf o native, quello della piattaforma). (ereditato): rimuove il valore del repository così vale la tua configurazione git globale. Annullabile."
git_lfs = "Git LFS"
git_lfs_help = "Mostra Git LFS nell'interfaccia (il tag LFS, la scheda diff, il banner del programma mancante, i comandi LFS) e lascia che GitPoulpi esegua i propri passaggi LFS (scaricare gli oggetti dopo un clone). Disattivo: i filtri LFS di git girano comunque, GitPoulpi non chiama mai git-lfs da sé."
git_lfs_program = "Programma git-lfs"
git_lfs_program_help = "Installalo da https://git-lfs.com (Windows: incluso in Git for Windows, oppure `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Palette: LFS: Apri la pagina di installazione."
initialize_lfs_for_this_repository = "Inizializza LFS per questo repository"
initialize_lfs_for_this_repository_help = "Esegue `git lfs install --local`: i filtri e gli hook LFS nella configurazione propria di questo repository, mai in quella globale. Richiede git-lfs."
pull_mode_help = { git = "Cosa fa il pulsante {$Pull}{hint} della barra degli strumenti: merge (fast-forward se possibile), ff_only o rebase. Le voci ▾ del pulsante eseguono subito la propria azione e non cambiano questa impostazione.", local = "Cosa fa il pulsante {$Pull}{hint} della barra degli strumenti: unione (avanzamento rapido se possibile), ff_only o ribasamento. Le voci ▾ del pulsante eseguono subito la propria azione e non cambiano questa impostazione." }
merge_fast_forward = { git = "{$Merge} fast-forward", local = "{$Merge} con avanzamento rapido" }
merge_fast_forward_help = { git = "Come tratta un {$merge} che avvii tu (menu del branch, drag and drop, palette, riga di comando) un branch che potrebbe semplicemente avanzare con un fast-forward. never: crea sempre un {$commit} di {$merge}. allowed: fast-forward quando possibile, come fa git per impostazione predefinita. only: solo fast-forward, altrimenti rifiuta. Un repository può sostituirla nella sua pagina Opzioni del {$merge}.", local = "Come tratta un'unione che avvii tu (menu del branch, drag and drop, palette, riga di comando) un branch che potrebbe semplicemente avanzare in modo rapido. never: crea sempre un {$commit} di unione. allowed: avanzamento rapido quando possibile, come fa git per impostazione predefinita. only: solo avanzamento rapido, altrimenti rifiuta. Un repository può sostituirla nella sua pagina Opzioni dell'unione." }
repo_heading = "Repo: {repo} - solo questo repository"
inherited = "(ereditato)"
lfs_not_checked = "(non ancora verificato)"
lfs_autofix_filters = { git = "Installa i filtri LFS prima di {$pull} e {$push}", local = "Installa i filtri LFS prima di scaricare e inviare" }
lfs_autofix_filters_help = { git = "Prima di un {$pull} o di un {$push} in un repository che usa Git LFS, esegue `git lfs install --local` se mancano i suoi filtri LFS o gli hook (configurazione propria del repository, mai quella globale), così il trasferimento gestisce i file grandi. La barra di stato lo segnala. Richiede git-lfs.", local = "Prima di scaricare o inviare in un repository che usa Git LFS, esegue `git lfs install --local` se mancano i suoi filtri LFS o gli hook (configurazione propria del repository, mai quella globale), così il trasferimento gestisce i file grandi. La barra di stato lo segnala. Richiede git-lfs." }

