[help_text]
git_actions_then_amend = "modifica il {$commit} selezionato: riepilogo, descrizione, nome, e-mail e data dell'autore in un'unica finestra"
git_actions_then_edit_author = "modifica solo l'autore del {$commit} selezionato (nome, e-mail, data)"
rewrite_1 = "apre il pannello di riscrittura della cronologia: cambia autori, date, messaggi, contenuto o percorsi dei file su tutta la cronologia o su una selezione"
rewrite_2 = "mostra in anteprima cosa cambierebbero le regole, poi le applica in un solo passo che Annulla può ripristinare; Applica resta disabilitato finché l'anteprima non è aggiornata"
rewrite_3 = "interrompe l'anteprima in corso (Esc fa lo stesso; un secondo Esc chiude il pannello)"
rewrite_4 = "aggiunge una regola, elimina quella sotto il cursore, ripristina l'ultima eliminata, duplica la regola"
rewrite_5 = "attiva o disattiva la regola, oppure la sposta in alto o in basso (le regole vengono eseguite dall'alto verso il basso)"
rewrite_6 = "passa da una scheda di anteprima all'altra"
rewrite_7 = "salva la ricetta nel repository o solo per te, ne carica una salvata, la rinomina; i valori segreti non vengono mai salvati"
rewrite_8 = "include o esclude ogni branch protetto già pubblicato; ricontrolla gli strumenti esterni"
file_history_1 = "vai al {$commit} della riga nel Log, caricando altro Log se non c'è ancora"
file_history_2 = "sposta la selezione; il diff a destra la segue subito"
file_history_3 = "estendi la selezione a un intervallo: a destra compare il diff del file tra i due estremi (Shift+clic fa lo stesso)"
file_history_4 = "passa la tastiera al diff, o restituiscila all'elenco"
file_history_5 = "copia lo SHA del {$commit}, o il suo riepilogo"
file_history_6 = "lato destro: il diff, il file com'era in quel {$commit}, o il suo blame; segue la selezione e mantiene la modalità"
file_history_7 = "confronta la versione della riga con la directory di lavoro (premi di nuovo per tornare)"
file_history_8 = "ripristina il file a quella versione nella directory di lavoro (chiede conferma; Annulla riporta i vecchi byte)"
file_history_9 = "ridimensiona l'elenco (anche il divisore si trascina; la larghezza viene ricordata)"
file_history_10 = "mouse: clic su una riga, Shift+clic per un intervallo, doppio clic la mostra nel Log, clic destro apre il menu"
commit_column_1 = "scorri le righe in orizzontale (Shift+rotellina o una rotellina orizzontale fanno lo stesso); scorrono solo se una parte è stata allargata oltre lo spazio disponibile"
commit_column_2 = "scegli una parte (corsie, autore, data), poi allargala o restringila, o riporta tutte le parti all'automatico; anche i bordi dell'intestazione si possono trascinare e le larghezze vengono ricordate"
commit_column_3 = "mouse: clic su una riga per sceglierne il {$commit}, il clic destro apre il suo menu (anche il tasto menu, dopo aver scelto una riga con Su/Giù)"
commit_column_4 = "sposta la parte scelta a sinistra o a destra; trascinare la sua intestazione fa lo stesso e l'ordine viene ricordato"
log_columns_1 = "scegli una colonna del Log (la sua cella d'intestazione si illumina); poi spostala a sinistra o a destra (trascinare la sua intestazione fa lo stesso), allargala o restringila (trascinare il suo bordo fa lo stesso), riportala alla larghezza automatica o adattala al suo contenuto (il doppio clic sul suo bordo fa lo stesso; + adatta ogni colonna). Tab / Shift+Tab scelgono un'altra colonna, Esc esce; la disposizione viene ricordata"
global_1 = "apre la palette dei comandi - ogni comando dell'app, ciascuno con la sua scorciatoia; scrivi per filtrare, Su/Giù o PageUp/PageDown per spostarti (non j/k: quelli vengono digitati), Enter per eseguire. Le righe in grigio dicono perché non si possono eseguire ora"
global_2 = "il prefisso di navigazione - vedi la sua sezione qui sotto"
global_3 = "il prefisso delle azioni git - vedi la sua sezione qui sotto"
global_4 = "mostra o nasconde questa guida - si apre sopra qualsiasi altra cosa sia aperta (Impostazioni, Gestione repository, ...), non solo sul semplice grafo"
global_5 = "forza un aggiornamento"
global_6 = "{$fetch}, ricontrollo di {$prs} e issue, ricaricamento"
global_7 = "annulla / ripeti l'ultima operazione (commit, amend, checkout, creazione/eliminazione di branch); chiede prima conferma se è rischiosa"
global_9 = "esci - dal grafo; sopra un diff o una vista file chiude invece quella vista. Ogni uscita viene registrata in gitpoulpi-tui-exit.log, accanto alla configurazione"
global_10 = "apre un menu contestuale, dove ne esiste uno qui sotto - i tasti sono intercambiabili (il tasto Menu/Apps raramente arriva a questa app su Windows, quindi la combinazione F10 è quella che lì funziona sempre)"
global_11 = "sposta il focus sul pannello successivo / precedente"
global_12 = "sposta la selezione (ogni pannello ed elenco)"
global_13 = "prefisso di conteggio in stile vim su j/k/Su/Giù (e PgUp/PgDn, come conteggio di schermate) - le cifre digitate compaiono come \"4...\" nella barra di stato finché il movimento non parte; Esc o qualsiasi altro tasto lo annulla, e uno 0 iniziale non ne avvia mai uno (così le cifre si scrivono normalmente nel compositore, nel filtro dei Refs e in ogni altro campo di testo)"
global_14 = "Refs: cambia sezione LOCALI/REMOTI/TAG"
global_15 = "Log: h = esci da / l = entra nell'elenco dei file di un commit"
global_16 = "Stato: salta a Non in stage / In stage"
mouse_basics_1 = "seleziona + porta il focus su una riga (ogni pannello, elenco, menu, dialogo); la rotella scorre ciò che sta sotto il puntatore"
mouse_basics_2 = "apri/attiva: un ref LOCAL/TAGS o una pillola di ref di una riga del Log ne fa il checkout, un file modificato apre il suo diff, una riga di repository apre quel repository"
mouse_basics_3 = "l'unico segnale «è cliccabile» che la maggior parte dei terminali dà (vedi «Passaggio del mouse e tooltip» sotto) - anche tooltip completi sulle celle del Log e sui badge di ref troncati"
mouse_basics_4 = "un divisore di pannello, il confine di una colonna del Log, il bordo inferiore di una sezione Refs o del blocco del messaggio del commit lo ridimensiona (oltre il minimo si comprime); l'intestazione di una colonna del Log trascinata oltre una vicina la riordina"
mouse_basics_5 = "(angolo in alto a destra) esci, come q - mostrato solo quando la finestra è abbastanza larga da non sovrapporsi al titolo"
navigation_prefix_then_1 = "comprime/ripristina il pannello Refs (a sinistra)"
navigation_prefix_then_2 = "comprime/ripristina il pannello Stato (a destra) - clicca la freccia sul bordo di un pannello, o la sottile striscia rimasta una volta compresso, per l'equivalente col mouse"
navigation_prefix_then_3 = "ingrandisce di una riga la sezione Refs attiva ({{nav_prefix.shrink_section}} la riduce); trascinare il bordo inferiore di una sezione fa lo stesso, e la dimensione viene ricordata"
navigation_prefix_then_4 = "ingrandisce di una riga il blocco del messaggio del commit del pannello destro ({{nav_prefix.shrink_message}} lo riduce); trascina il bordo sotto di esso per l'equivalente col mouse"
navigation_prefix_then_5 = "porta il focus su quel sotto-pannello - ogni sezione Refs, il campo filtro, il Log (o la vista Diff quando è aperta lì), l'elenco della Cronologia del file, ciascuna metà del terzo pannello e il campo Riepilogo del compositore, se c'è spazio, hanno un proprio badge: prima 1-9, poi a/b/c... se in questa schermata ce ne sono più di nove - i badge vengono riassegnati ogni volta che si apre il prefisso, quindi leggi il simbolo, non memorizzare una cifra"
navigation_prefix_then_6 = "apre le impostazioni (come l'ingranaggio della barra del titolo)"
navigation_prefix_then_16 = "apre la finestra Informazioni (come il polpo nella barra del titolo)"
navigation_prefix_then_17 = "sposta di un passo il divisore tra il pannello Refs e il Log a sinistra ({{nav_prefix.refs_narrower}}) o a destra ({{nav_prefix.refs_wider}}); un pannello Refs compresso torna prima, e la larghezza viene ricordata"
navigation_prefix_then_18 = "sposta di un passo il divisore tra il Log e il pannello destro a sinistra ({{nav_prefix.status_wider}}) o a destra ({{nav_prefix.status_narrower}}); un pannello compresso torna prima, e la larghezza viene ricordata"
navigation_prefix_then_7 = "mostra/nasconde questa guida (come ? da solo)"
navigation_prefix_then_8 = "sceglie una scheda di repository a cui passare - scrivi per filtrare, Su/Giù o PageUp/PageDown per spostarti, Enter passa, clic su una riga, Esc chiude"
workspace_search = "cerca in tutti i repository dell'area di lavoro: branch, {$tags}, worktree, {$stashes}, {$commits}, {$prs} e issue - Enter ti porta lì, Alt+1-8 attiva i tipi, b: t: c: s: w: r: pr: i: # restringe, Esc chiude"
navigation_prefix_then_9 = "mostra la vista proposta da un agente IA (il chip della barra di stato `Mostra ...?`), gemello del clic su di esso"
navigation_prefix_then_10 = "chiude quel chip, altrimenti torna alla vista precedente all'ultima modifica dell'agente (anche `Agente: Indietro` nella palette)"
navigation_prefix_then_11 = "annulla, torna alla modalità normale"
navigation_prefix_then_12 = "sceglie un tema dall'elenco - scrivi per filtrare, l'evidenziato si vede in anteprima, Enter lo applica e lo salva, Esc ripristina il precedente (anche `App: Cambia tema...` nella palette)"
navigation_prefix_then_13 = "sceglie una lingua dall'elenco - scrivi per filtrare, Enter la applica e la salva, Esc annulla (anche `App: Cambia lingua...` nella palette)"
navigation_prefix_then_14 = "`App: Cambia tema colori del grafo...`"
navigation_prefix_then_15 = "`App: Attiva/disattiva tinta righe del grafo`"
navigation_prefix_then_19 = "dispone la finestra aperta da tastiera: le frecce la spostano, Maiusc+frecce la ridimensionano, 0 la rimette al suo posto, Invio esce (gemello del trascinare la barra del titolo e i bordi; anche `Finestra: Sposta o ridimensiona` nella palette)"
git_actions_then_1 = "stage del file non in stage selezionato (pannello Stato)"
git_actions_then_2 = "unstage del file in stage selezionato (pannello Stato)"
git_actions_then_3 = "stage di tutte le modifiche"
git_actions_then_4 = "scarta tutte le modifiche (con conferma; file non tracciati inclusi, detto nella conferma)"
git_actions_then_5 = "apre il compositore del messaggio di commit"
git_actions_then_commit_now = "esegue subito il {$commit} delle modifiche in stage con il messaggio del compositore, da qualsiasi punto (gemello del pulsante Commit; senza modifiche in stage o senza riepilogo dice perché e passa al compositore)"
git_actions_then_6 = { git = "stash di tutte le modifiche, chiedendo prima un messaggio (con l'IA attiva, {{global.git_prefix}} in quel campo chiede al modello di scriverlo)", local = "accantona tutte le modifiche, chiedendo prima un messaggio (con l'IA attiva, {{global.git_prefix}} in quel campo chiede al modello di scriverlo)" }
git_actions_then_7 = "l'IA scrive il messaggio di commit (solo se l'IA è attiva nelle Impostazioni)"
git_actions_then_8 = "l'IA spiega il commit selezionato (o le modifiche in corso)"
git_actions_then_9 = "l'IA propone come dividere le modifiche in corso in commit (una revisione interattiva: riordina, modifica, sposta file, scarta; {{compose.apply}} crea i commit)"
git_actions_then_10 = { git = "pull, come impostato sul pulsante Pull (il suo ▾: fetch all / ff se possibile / solo ff / rebase; `git.pull_mode`)", local = "scarica, come impostato sul pulsante Scarica (il suo ▾: recupera tutto / avanzamento rapido se possibile / solo avanzamento rapido / ribasamento; `git.pull_mode`)" }
git_actions_then_11 = { git = "push verso il remoto predefinito (o chiede, secondo `git.push_behavior`)", local = "invia al remoto predefinito (o chiede, secondo `git.push_behavior`)" }
git_actions_then_12 = { git = "fetch di ogni remoto, con prune", local = "recupera ogni remoto, con prune" }
git_actions_then_13 = "nuovo branch su HEAD (richiesta del nome)"
git_actions_then_14 = "nuovo tag su HEAD (richiesta del nome)"
git_actions_then_15 = { git = "stash push (tutte le modifiche, file non tracciati inclusi, senza messaggio)", local = "accantona tutte le modifiche (file non tracciati inclusi, senza messaggio)" }
git_actions_then_16 = { git = "stash pop - la riga di stash selezionata nel Log se una ha il focus, altrimenti lo stash più recente", local = "estrae l'accantonamento - quello selezionato nel Log se una riga ha il focus, altrimenti il più recente" }
git_actions_then_17 = { git = "push di ogni tag non inviato", local = "invia ogni tag non inviato" }
git_actions_then_18 = "apre nel browser la {$pr} del branch attivo (il clic sul chip della barra degli strumenti)"
git_actions_then_19 = "elimina il branch/tag selezionato (pannello Refs) - apre la conferma"
git_actions_then_20 = { git = "rebase del branch corrente sul ref selezionato (pannello Refs)", local = "ribasa il branch corrente sul ref selezionato (pannello Refs)" }
git_actions_then_21 = "modifica il messaggio del commit selezionato - vedi «Modifica del messaggio di un commit» sotto"
git_actions_then_22 = "cherry-pick del commit selezionato su HEAD"
git_actions_then_23 = "revert del commit selezionato (con conferma)"
git_actions_then_24 = "reset del branch al commit selezionato, mixed (soft/hard solo da palette, hard con conferma)"
pull_requests_and_1 = "apre la riga nel browser; «Riconnetti» apre le Impostazioni sul profilo"
pull_requests_and_2 = "riga {$pr}: modificala sul sito dell'host (la matita della riga); la palette ha il gemello per il branch attivo"
pull_requests_and_3 = "(sezione {$PRS}) creane una - il + dell'intestazione"
pull_requests_and_4 = "il menu della riga: apri, copia URL / numero, checkout del branch di origine, vedi i suoi commit, crea un branch da una issue"
pull_requests_and_5 = "scegli il filtro (Aperte, Mie, Revisione richiesta, Tutte / Assegnate a me); il chip della barra degli strumenti (GL !53, GH #12) apre la richiesta collegata, clic destro per il suo menu; \"+ {$pr_abbr}\" ne avvia una per un branch inviato"
refs_pane_1 = { git = "apre il menu del ref selezionato: checkout, nascondi/solo, merge, rebase, fast-forward, pull / push / fetch, imposta upstream, crea worktree, avvia una {$pr}, rinomina, elimina, Copia (nome / ref completo / SHA di destinazione)", local = "apre il menu del ref selezionato: passa a, nascondi/solo, unisci, ribasa, avanzamento rapido, scarica / invia / recupera, imposta upstream, crea un albero di lavoro, avvia una {$pr}, rinomina, elimina, Copia (nome / ref completo / SHA di destinazione)" }
refs_pane_2 = "Fast-forward di <branch> a <corrente> / <corrente> a <branch> (menu o palette): sposta un branch solo in avanti; in grigio, con il motivo, quando non è un fast-forward"
refs_pane_3 = { git = "Crea un worktree da <ref>... (menu di un branch, tag o commit): un dialogo - cartella (Sfoglia / {{dialog.browse}}), nuovo branch facoltativo, [x] aprilo come scheda (Space attiva/disattiva)", local = "Crea un albero di lavoro da <ref>... (menu di un branch, tag o commit): un dialogo - cartella (Sfoglia / {{dialog.browse}}), nuovo branch facoltativo, [x] aprilo come scheda (Space attiva/disattiva)" }
refs_pane_4 = { git = "Avvia una {$pr} da <branch> (branch locali, dopo il push): in grigio senza upstream o con un host remoto non riconosciuto; con un token configurato, un piccolo modulo (destinazione / titolo / descrizione / bozza); senza, apre la pagina di confronto dell'host nel browser", local = "Avvia una {$pr} da <branch> (branch locali, dopo l'invio): in grigio senza upstream o con un host remoto non riconosciuto; con un token configurato, un piccolo modulo (destinazione / titolo / descrizione / bozza); senza, apre la pagina di confronto dell'host nel browser" }
refs_pane_5 = "Crea patch (menu di un commit, di un file o la palette): da un commit, da un commit a HEAD, o dalle modifiche della directory di lavoro - un selettore di cartelle («Salva qui») scrive il primo nome libero nome[-n].patch"
refs_pane_6 = "Applica patch (palette): un selettore di file applica una patch alla directory di lavoro; una patch che non si applica non cambia nulla"
refs_pane_7 = { git = "il suo menu: fetch, copia nome / link, imposta come predefinito, modifica (nome, URL di fetch / push), nascondi/mostra tutti i suoi branch, rimuovi", local = "il suo menu: recupera, copia nome / link, imposta come predefinito, modifica (nome, URL di recupero / invio), nascondi/mostra tutti i suoi branch, rimuovi" }
refs_pane_8 = "nascondi/mostra tutto, solo/rimuovi solo su tutto - ogni ref sotto quella cartella o riga radice del remoto in una volta"
refs_pane_9 = "solo sulla selezione (un ref, o un'intera cartella/remoto)"
refs_pane_10 = "Termina il solo - rimuove ogni ref in solo in una volta"
refs_pane_11 = "Mostra tutto - rende visibile ogni ref nascosto in una volta"
refs_pane_12 = "sezione REMOTI: aggiungi un remoto (o il pulsante + dell'intestazione)"
refs_pane_13 = "espande/comprime la sezione attiva, o la cartella selezionata nella vista gerarchica"
refs_pane_14 = "cambia quale sezione è attiva"
refs_pane_15 = "filtra per nome (Enter applica, Esc annulla)"
refs_pane_16 = "attiva/disattiva la vista gerarchica dei branch (cartelle da `/` nel nome) per LOCALI/REMOTI - persistente (`ui.ref_tree`)"
refs_pane_17 = "mouse: passa sulla barra sinistra riservata per far comparire l'occhio nascondi-nel-grafo (o il cerchio solo durante il solo); la barra di una riga cartella/nome del remoto nasconde/mette in solo ogni ref sotto di essa in una volta. Clicca il pulsante «Termina il solo»/«Mostra tutto» del titolo per annullare l'intero insieme"
refs_pane_18 = "mostra il ref selezionato nel Log: scorre fino a dove punta e fa lampeggiare la riga, la selezione resta"
refs_pane_19 = "segna il ref selezionato come origine del rilascio, poi rilascialo su un altro ref: stesso menu del trascinamento ({$merge}, {$rebase}, {$push}...); Esc toglie il segno"
status_pane_working_1 = "sposta; uscendo dalla fine di un sotto-pannello si passa all'altro (quelli compressi/vuoti vengono saltati)"
status_pane_working_2 = "salta direttamente a Non in stage / In stage"
status_pane_working_3 = "comprime/espande il sotto-pannello attivo"
status_pane_working_4 = "stage/unstage del file selezionato, o comprime una riga cartella (modalità albero)"
status_pane_working_5 = "alterna l'elenco dei file tra Percorso (piatto) e Albero (cartelle)"
status_pane_working_6 = "attiva Vedi tutti i file (pannello Stato / riga WIP, o i file modificati di un commit; palette: File: Percorso/Albero e File: Vedi tutti i file)"
status_pane_working_7 = "comprime tutte le cartelle, o le espande di nuovo se qualcuna è compressa"
status_pane_working_8 = "il menu del file selezionato: Stage/Unstage, Scarta modifiche (con conferma), Copia percorso del file agiscono davvero; Cronologia del file/Blame aprono il file al centro; il resto è elencato in grigio con ciò che serve"
status_pane_working_9 = "filtra per nome i file modificati di un commit (solo dentro l'elenco dei file di un commit, non in Stato)"
status_pane_working_10 = "mouse: clicca il titolo di un sotto-pannello per comprimerlo/espanderlo; il suo pulsante Stage di tutte le modifiche / Unstage di tutte le modifiche lo svuota; passa su una riga per un pulsante Stage del file/della cartella o Unstage; anche il selettore Percorso/Albero e Comprimi tutto/Espandi tutto sono pulsanti"
commit_composer_bottom_1 = "seleziona la riga WIP e porta il focus sul campo Riepilogo del compositore - lo stesso testo in entrambi i casi"
commit_composer_bottom_2 = "uguale: porta il focus sul campo Riepilogo"
commit_composer_bottom_3 = "attiva/disattiva «Modifica il commit precedente» (pannello Stato)"
commit_composer_bottom_4 = "apre il diff del file selezionato nella colonna centrale"
commit_composer_bottom_5 = "(Log con focus) lo stesso interruttore Percorso/Albero; {{log.view_all_files}} Vedi tutti i file"
commit_composer_bottom_6 = "(nei file modificati di un commit) comprime / espande tutte le cartelle"
commit_composer_bottom_7 = "ogni tasto viene digitato nel campo con il focus (j, Space, . inclusi); le combinazioni Ctrl funzionano ancora"
commit_composer_bottom_8 = "passa alla Descrizione, come premendo Enter nel campo della riga WIP"
commit_composer_bottom_9 = "a capo nella descrizione"
commit_composer_bottom_10 = "commit da Riepilogo o Descrizione (come cliccare Commit); Ctrl+J dove il terminale invia Ctrl+Enter come un semplice Enter"
commit_composer_bottom_11 = "esce dal campo, mantenendo il testo digitato, tornando all'elenco dei file"
commit_composer_bottom_12 = "mouse: clicca l'area Riepilogo o Descrizione per darle il focus, la casella/etichetta per attivare Amend, il pulsante Commit a tutta larghezza per fare il commit (aspetto disattivato + motivo quando non c'è nulla da committare o manca il riepilogo)"
commit_composer_bottom_13 = "inserisce un riferimento a una issue al cursore (prima quella del branch, poi quelle collegate; digita per filtrare); il pulsante # a destra di Summary fa lo stesso"
log_pane_commit_1 = "sposta la selezione di una schermata visibile di righe"
log_pane_commit_2 = "salta al primo / ultimo commit *caricato* - il caricamento della pagina successiva avviene come scorrendo fin lì"
log_pane_commit_3 = { git = "apre il menu del commit selezionato: cherry-pick, revert, Reset (sottomenu), Modifica il messaggio del commit, Rebase interattivo da qui, crea branch/tag qui, checkout, crea worktree qui, Copia (sottomenu: messaggio, nome/e-mail dell'autore, data, SHA breve/completo)", local = "apre il menu del commit selezionato: cherry-pick, annulla gli effetti, Reimposta (sottomenu), Modifica il messaggio del commit, Ribasamento interattivo da qui, crea branch/tag qui, passa a questo commit, crea albero di lavoro qui, Copia (sottomenu: messaggio, nome/e-mail dell'autore, data, SHA breve/completo)" }
log_pane_commit_4 = "aggiunge/toglie un commit in una selezione multipla; Shift+clic (Alt+clic), Shift+Su/Giù selezionano un intervallo; Esc la annulla. Con 2+ selezionati, Cherry-pick apre la vista interattiva"
log_pane_commit_5 = { git = "(vista di rebase interattivo / cherry-pick; trascina le righe per riordinarle)", local = "(vista di ribasamento interattivo / cherry-pick; trascina le righe per riordinarle)" }
log_pane_commit_6 = "azione {$pick} sulla riga selezionata"
log_pane_commit_7 = "azione {$reword}"
log_pane_commit_8 = "azione {$squash}: la unisce alla riga sotto (la più vecchia)"
log_pane_commit_9 = "azione {$fixup} ({$squash} che scarta il suo messaggio; solo {$rebase_noun})"
log_pane_commit_10 = "azione {$drop}"
log_pane_commit_11 = "azione {$edit} (si ferma per fare amend; solo {$rebase_noun})"
log_pane_commit_12 = "attiva o disattiva `autosquash`"
log_pane_commit_13 = "sposta la riga in su"
log_pane_commit_14 = "sposta la riga in giù"
log_pane_commit_split = "divide il {$commit} della riga nell'editor di divisione (solo {$rebase_noun})"
log_pane_commit_15 = "Space apre l'elenco delle azioni della riga selezionata, Su/Giù spostano la selezione, Enter su una riga Reword ne modifica il messaggio (Tab passa tra riepilogo / descrizione / pulsanti, {{reword.apply}} conferma); Squash trasforma la riga in cui confluisce in un Reword con il messaggio combinato"
log_pane_commit_16 = "reimposta il piano"
log_pane_commit_17 = "(o «Avvia ...») esegue il piano"
log_pane_commit_18 = "o «Annulla ...» chiude"
log_pane_commit_19 = "(nuovo branch/tag) il nome si scrive in un riquadro nella colonna Ref del Log, sulla riga del commit: Enter crea, Esc annulla"
log_pane_commit_20 = { git = "un banner sopra il Log offre Continua/Salta/Interrompi (anche Rebase: continua/salta/interrompi nella palette)", local = "un banner sopra il Log offre Continua/Salta/Interrompi (anche Ribasamento: Continua/Salta/Interrompi nella palette)" }
log_pane_commit_21 = "(directory di lavoro modificata) seleziona la riga WIP e scrivi il messaggio di commit nel suo campo - vedi «Compositore di commit» sopra"
log_pane_commit_22 = { git = ". / clic destro apre il suo menu: Crea patch dalle modifiche WIP, Applica patch, Stash/Stage/Scarta tutte le modifiche - in grigio con un motivo su una directory di lavoro pulita", local = ". / clic destro apre il suo menu: Crea patch dalle modifiche WIP, Applica patch, Accantona/Stage/Scarta tutte le modifiche - in grigio con un motivo su una directory di lavoro pulita" }
log_pane_commit_23 = { git = "un riquadro accanto al commit su cui è stato creato: selezionarlo mostra cosa ha cambiato; . / clic destro apre Pop / Applica / Elimina; {{git_prefix.stash_pop}} lo ripristina (`ui.graph_show_stashes`)", local = "un riquadro accanto al commit su cui è stato creato: selezionarlo mostra cosa ha cambiato; . / clic destro apre Estrai / Applica / Elimina; {{git_prefix.stash_pop}} lo estrae (`ui.graph_show_stashes`)" }
log_pane_commit_24 = "(nell'elenco dei file modificati del commit) apre il menu di quel file: Apri diff, Cronologia del file, Blame del file, Copia percorso del file"
log_pane_commit_25 = "mouse: clicca il campo `// WIP` della riga WIP per scrivere lì il Riepilogo; passa su una cella del Log per un tooltip col valore completo, o sul badge `+n` di un commit per vedere ogni ref (doppio clic su uno per farne il checkout)"
editing_a_commit_1 = "modifica; Enter va a capo"
