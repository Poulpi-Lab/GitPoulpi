merge_conflict_editor_1 = { git = "Lo aprono: Enter su una riga di Stato in conflitto (!), un clic su di essa, la voce Apri nell'editor di merge del suo menu, il {{diff.merge_editor}} / pulsante della vista Diff, Risolvi i conflitti del banner dell'operazione e Conflitti: Apri l'editor di merge della palette. A (corrente) e B (in entrata) stanno affiancati sopra il Risultato, il file in scrittura", local = "Lo aprono: Enter su una riga di Stato in conflitto (!), un clic su di essa, la voce Apri nell'editor di unione del suo menu, il {{diff.merge_editor}} / pulsante della vista Diff, Risolvi i conflitti del banner dell'operazione e Conflitti: Apri l'editor di unione della palette. A (corrente) e B (in entrata) stanno affiancati sopra il Risultato, il file in scrittura" }
