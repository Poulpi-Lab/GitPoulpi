[settings_ssh]
private_key_path = "Percorso della chiave privata"
private_key_path_help = "File di chiave che {$fetch}, {$pull}, {$push} e clone offrono a ssh (ssh -i <chiave> -o IdentitiesOnly=yes). Vuoto: ssh-agent e la tua configurazione ssh come al solito. Ignorato se un repository sceglie una propria chiave (SSH e credenziali) o se GIT_SSH_COMMAND o core.sshCommand è impostato. Vale dal prossimo trasferimento."
public_key_path = "Percorso della chiave pubblica"
public_key_path_help = "Usato solo se il percorso della chiave privata è vuoto: ssh sceglie allora la chiave corrispondente tenuta da ssh-agent (o una chiave hardware) invece di offrirle tutte. Genera coppia di chiavi compila entrambi. Stessa precedenza del percorso della chiave privata."
