[help_tabs]
tab_keys = "Tasti"
tab_start = "Inizio"
tab_log = "Log"
tab_changes = "Modifiche"
tab_refs = "Refs"
tab_hosting = "Hosting"
tab_setup = "Impost."
tab_tools = "IA e CLI"
title = "Aiuto - scrivi per filtrare, Tab cambia scheda, ? chiude"
title_filtered = "Aiuto - filtro «{filter}» - Esc cancella, ? chiude"
hint = "Tab/Shift+Tab, ←/→ o Alt+1..8: schede - ↑/↓, PgUp/PgDn scorrono"
start_1 = "Finestra|Schede in alto (Home elenca, apre e clona i repository), poi la barra degli strumenti, la barra laterale Refs a sinistra, il Log al centro, e le modifiche con il modulo del {$commit} a destra."
start_2 = "Palette comandi|Ctrl+P elenca ogni azione con la sua scorciatoia. Scrivi per cercare, Enter la esegue. Tutto ciò che fa il mouse lo fa la palette."
start_3 = "Prefissi di scorciatoie|Ctrl+G e poi un tasto esegue un'azione git ({$stage}, {$commit}, {$pull}, {$push}...). Ctrl+N e poi un tasto sposta o cambia la vista. La barra di stato elenca le scelte."
start_4 = "Schede|Una scheda per repository. Ctrl+PgUp / Ctrl+PgDn cambiano scheda, Ctrl+W la chiude, t apre il selettore di schede, clic destro su una scheda o Ctrl+T per il suo menu."
start_5 = { git = "Mouse e tasti|Il clic seleziona, il doppio clic apre o fa checkout, il clic destro (o .) apre un menu, il trascinamento sposta ref e righe di {$rebase}. Ogni azione del mouse ha un tasto.", local = "Mouse e tasti|Il clic seleziona, il doppio clic apre o passa al branch, il clic destro (o .) apre un menu, il trascinamento sposta ref e righe del ribasamento. Ogni azione del mouse ha un tasto." }
start_6 = "Aggiorna e annulla|r aggiorna, F5 ricarica tutto, Ctrl+Z / Ctrl+Y annullano e ripetono l'ultima operazione, q esce."
log_1 = "Leggere il grafo|Una riga per {$commit}, una corsia per branch. La prima riga è il tuo lavoro non salvato (WIP): selezionala per vedere le modifiche. Clicca una riga per i dettagli a destra."
log_2 = "Cercare|f (o il pulsante Cerca) attenua le righe che non corrispondono a un messaggio, autore, hash o ref. Enter / Shift+Enter vanno alla corrispondenza successiva / precedente. / filtra la barra Refs."
log_3 = { git = "Menu dei {$commits}|Clic destro su un {$commit} o . su di esso: {$cherry_pick}, revert, reset, modifica messaggio, crea branch o tag, checkout, worktree, patch, copia.", local = "Menu dei {$commits}|Clic destro su un {$commit} o . su di esso: {$cherry_pick}, annulla gli effetti, reimposta, modifica messaggio, crea branch o tag, passa a, albero di lavoro, patch, copia." }
log_4 = { git = "{$Rebase} interattivo|«{$Rebase} interattivo da qui...» nel menu del {$commit}: imposta ogni {$commit} su {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} o {$edit}, riordina con Ctrl+Su/Giù, avvia con Ctrl+S, esci con Esc.", local = "Ribasamento interattivo|«Ribasamento interattivo da qui...» nel menu del {$commit}: imposta ogni {$commit} su {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} o {$edit}, riordina con Ctrl+Su/Giù, avvia con Ctrl+S, esci con Esc." }
log_5 = "Più {$commits}|Ctrl+clic attiva un {$commit}, Shift+clic (Alt+clic) seleziona un intervallo, Space attiva quello corrente, Esc cancella. Poi clic destro per {$cherry_pick} o revert dell'intera selezione."
log_6 = { git = "Trascinare ref|Trascina un branch su un altro per {$merge}, {$rebase} o fast-forward, o su un branch remoto per {$push}; rilascia per scegliere da un menu, Esc annulla. Tastiera: palette, «Refs: Rilascia il ref selezionato...».", local = "Trascinare ref|Trascina un branch su un altro per unire, ribasare o avanzare rapidamente, o su un branch remoto per inviare; rilascia per scegliere da un menu, Esc annulla. Tastiera: palette, «Refs: Rilascia il ref selezionato...»." }
changes_1 = "Modifiche in corso|Seleziona la prima riga del Log (WIP): i file {$unstaged} e {$staged} appaiono a destra. m alterna percorso / albero, a mostra tutti i file, z comprime le cartelle."
changes_2 = "{$Stage} e {$unstage}|Ctrl+Space su un file, o il suo pulsante, o Ctrl+G s; Ctrl+G a per tutto, Ctrl+G u per {$unstage}. Clic destro su un file per scartare, vedere cronologia o blame, o aprirlo nel tuo editor."
changes_3 = "Leggere un {$diff}|Clicca un file o premi d. m alterna inline / split, w manda a capo, s ignora gli spazi, n / p saltano tra gli hunk, Esc o q torna al Log."
changes_4 = "Hunk e righe|In un {$diff}: Space = {$stage} dell'hunk, v poi j / k poi Enter = {$stage} delle righe scelte, x = scarta l'hunk. Gli scarti chiedono prima; Ctrl+Z li ripristina."
changes_5 = "Scrivere un {$commit}|Scrivi un riepilogo e una descrizione, poi Ctrl+Enter o il pulsante verde. Shift+A corregge l'ultimo {$commit}. Ctrl+G c porta il cursore nel modulo, Esc lo lascia."
changes_6 = { git = "Conflitti di {$merge}|Un avviso offre «Risolvi conflitti...». Nell'editor di {$merge} scegli A, B o entrambi per ogni conflitto (a / b / c), modifica il Risultato, salva, poi Continua.", local = "Conflitti di unione|Un avviso offre «Risolvi conflitti...». Nell'editor di unione scegli A, B o entrambi per ogni conflitto (a / b / c), modifica il Risultato, salva, poi Continua." }
changes_7 = "Annulla e ripeti|Ctrl+Z / Ctrl+Y, o i pulsanti della barra, annullano e ripetono la maggior parte delle operazioni: {$commits}, branch, checkout, reset, {$stashes}, scarti. Chiede prima se rischioso."
refs_1 = "Branch e {$tags}|Doppio clic su un branch locale o su un {$tag} per fare checkout; clic destro per il menu ({$merge}, {$rebase}, rinomina, elimina...). Ctrl+G b e Ctrl+G t ne creano uno sul {$commit} corrente."
refs_2 = "Solo e nascondi|Il tasto o mostra solo i {$commits} del ref selezionato, Shift+O smette. Il menu di un ref lo nasconde dal grafo; Shift+H mostra di nuovo tutto. Solo visualizzazione: il repository non cambia."
refs_3 = { git = "{$Fetch}, {$pull}, {$push}|Ctrl+G f: {$fetch} di tutti i remoti. Ctrl+G p: {$pull}. Ctrl+G Shift+P: {$push}. La freccia accanto a un pulsante sceglie un altro modo o un altro remoto.", local = "Recupera, scarica, invia|Ctrl+G f: recupera tutti i remoti. Ctrl+G p: scarica. Ctrl+G Shift+P: invia. La freccia accanto a un pulsante sceglie un altro modo o un altro remoto." }
refs_4 = { git = "Remoti|Il + nel titolo REMOTI ne aggiunge uno. Clic destro su un remoto per fare {$fetch}, copiarne il link web, modificarne gli URL o rimuoverlo.", local = "Remoti|Il + nel titolo REMOTI ne aggiunge uno. Clic destro su un remoto per recuperarlo, copiarne il link web, modificarne gli URL o rimuoverlo." }
refs_5 = { git = "Stash e worktree|I pulsanti Stash e Pop; Ctrl+G m chiede prima un messaggio. Clic destro su uno stash per applicarlo o fare il pop. «Crea worktree da...» apre un branch in una scheda propria.", local = "Accantonamenti e alberi di lavoro|I pulsanti Accantona ed Estrai; Ctrl+G m chiede prima un messaggio. Clic destro su un accantonamento per applicarlo o estrarlo. «Crea un albero di lavoro da...» apre un branch in una scheda propria." }
refs_6 = "Sottomoduli e LFS|Una sezione SOTTOMODULI appare se ce ne sono: doppio clic ne apre uno come scheda, clic destro lo aggiorna. Azioni Git LFS: il pulsante LFS o Ctrl+G l."
hosting_1 = "Collegare|Impostazioni > Integrazioni: incolla un token personale per GitHub o GitLab. Nessun account richiesto; il token va al gestore di credenziali del sistema."
hosting_2 = "Collegare un repository|Nelle sezioni {$PRS} e ISSUE della barra laterale scegli uno dei provider proposti dall'elenco. Niente viene collegato da solo; il collegamento è salvato per repository."
hosting_3 = "Creare una {$pr}|Il + nell'intestazione {$PRS}, o n in quella sezione, apre il modulo; il menu di un branch ha «Avvia una {$pr} da...». L'IA può scrivere titolo e descrizione."
hosting_4 = "Issue|La sezione ISSUE le elenca; + o n ne crea una. Il menu di una riga la apre nel browser o agisce su di essa."
hosting_5 = "Riferimenti|I riferimenti a issue e {$prs} (#12, !53, ABC-7) in un messaggio di {$commit} o nel nome di un branch sono riconosciuti. Alt+R nel modulo del {$commit} ne inserisce uno."
hosting_6 = "Chip della barra|A sinistra della barra un chip mostra la {$pr} del branch corrente (GH #12, GL !53) o un «+ {$pr_abbr}» attenuato per avviarne una. Cliccalo."
hosting_7 = "Chiavi SSH|Scegli una chiave SSH per profilo (Impostazioni > Profili) o per repository (menu della scheda > «SSH e credenziali...»). Le passphrase restano nel tuo ssh-agent di sistema."
setup_1 = "Impostazioni|Ctrl+, o l'ingranaggio. Tab passa tra l'elenco pagine e le opzioni, j / k si muovono, Enter o Space cambia un valore, / o Ctrl+F cerca in tutte le opzioni, Esc chiude."
setup_2 = "Temi|Impostazioni > Aspetto > Tema: scuro, chiaro, segui il terminale o uno dei tanti preset. Ctrl+N e un tasto cambiano anche tema, lingua e colori del grafo senza aprire le Impostazioni."
setup_3 = "Lingua|Impostazioni > Generale > Lingua offre 17 lingue. «Traduci i termini di git» decide se anche le parole proprie di git ({$commit}, {$push}...) sono tradotte."
setup_4 = "Profili|Impostazioni > Profili contiene le identità di {$commit} (nome, e-mail, chiave SSH). Il selettore di profilo della barra sceglie quella di questo repository."
setup_5 = "Apri in|Il pulsante Apri in (Alt+O) apre la cartella di questa scheda in un terminale, un editor o il gestore file. Impostazioni > Apri in modifica l'elenco."
setup_6 = "Scorciatoie tastiera|Impostazioni > Tastiera e mouse riassegna qualsiasi tasto. La scheda Tasti di questo aiuto mostra le tue scorciatoie."
tools_1 = "IA (facoltativa)|Disattivata finché non la configuri in Impostazioni > IA: un servizio compatibile OpenAI, Anthropic o un agente locale come claude -p. Non serve mai un account GitPoulpi."
tools_2 = "Azioni IA|Il pulsante scintilla accanto al riepilogo o Ctrl+G i scrive un messaggio di {$commit}; Ctrl+G w spiega le modifiche; Ctrl+G C divide il lavoro in più {$commits}; Alt+I suggerisce una risoluzione di conflitto. Nulla viene applicato senza la tua conferma."
tools_3 = "CLI|gitpoulpi <comando> fa da script ciò che fa la finestra, tramite lo stesso daemon, così le modifiche appaiono dal vivo. --json dà output per macchine, --help elenca le opzioni."
tools_4 = "MCP|gitpoulpi mcp serve --stdio dà agli agenti IA uno strumento per comando CLI. Impostazioni > Agenti e MCP sceglie cosa possono modificare."
tools_5 = "Wrapper shell|Con il wrapper shell gp, «Esci e cd qui» lascia la tua shell nella cartella della scheda attiva all'uscita di GitPoulpi."

