title_filtered = "ヘルプ - 絞り込み「{filter}」- Esc で解除、? で閉じる"
hint = "Tab/Shift+Tab、←/→、Alt+1..8: タブ - ↑/↓、PgUp/PgDn でスクロール"
start_1 = "ウィンドウ|上にタブ（ホームではリポジトリの一覧、オープン、クローン）、その下にツールバー、左に Refs サイドバー、中央に Log、右に変更と{$commit}フォーム。"
start_2 = "コマンドパレット|Ctrl+P で全アクションをショートカット付きで一覧。入力で検索、Enter で実行。マウスでできることはパレットでもできます。"
start_3 = "ショートカットのプレフィックス|Ctrl+G の後にキーで git 操作（{$stage}、{$commit}、{$pull}、{$push}...）を実行。Ctrl+N の後にキーで移動や表示の切替。ステータスバーに選択肢が並びます。"
start_4 = "タブ|リポジトリごとに 1 タブ。Ctrl+PageUp / Ctrl+PageDown で切替、Ctrl+W で閉じる、t でタブ選択、タブを右クリックまたは Ctrl+T でメニュー。"
start_5 = "マウスとキー|クリックで選択、ダブルクリックで開く／チェックアウト、右クリック（または .）でメニュー、ドラッグで参照や{$rebase}の行を移動。マウス操作にはすべてキーがあります。"
start_6 = "更新と取り消し|r で更新、F5 ですべて再読み込み、Ctrl+Z / Ctrl+Y で直前の操作を取り消し／やり直し、q で終了。"
log_1 = "グラフの見方|{$commit}ごとに 1 行、ブランチごとに 1 レーン。最初の行は未{$commit}の作業（WIP）で、選ぶと変更が見えます。行をクリックすると右に詳細が出ます。"
log_2 = "検索|f（または検索ボタン）で、メッセージ・作成者・ハッシュ・参照に一致しない行を薄く表示。Enter / Shift+Enter で次／前の一致へ。/ で Refs サイドバーを絞り込み。"
log_3 = { git = "{$Commit}メニュー|{$commit}を右クリック、または . で：{$cherry_pick}、revert、reset、メッセージ編集、ブランチや{$tag}の作成、checkout、worktree、パッチ、コピー。", local = "{$Commit}メニュー|{$commit}を右クリック、または . で：{$cherry_pick}、リバート、リセット、メッセージ編集、ブランチや{$tag}の作成、チェックアウト、ワークツリー、パッチ、コピー。" }
log_4 = "対話的{$rebase}|{$commit}メニューの「ここから対話的{$rebase}...」：各{$commit}を{$pick}、{$reword}、{$squash}、{$fixup}、{$drop}、{$edit}に設定し、Ctrl+上/下で並べ替え、Ctrl+S で開始、Esc で中止。"
log_5 = { git = "複数の{$commit}|Ctrl+クリックで{$commit}を切替、Shift+クリック（Alt+クリック）で範囲選択、Space で現在行を切替、Esc で解除。右クリックで選択全体の{$cherry_pick}や revert。", local = "複数の{$commit}|Ctrl+クリックで{$commit}を切替、Shift+クリック（Alt+クリック）で範囲選択、Space で現在行を切替、Esc で解除。右クリックで選択全体の{$cherry_pick}やリバート。" }
log_6 = { git = "参照のドラッグ|ブランチを別のブランチへドラッグして{$merge}・{$rebase}・fast-forward、リモートブランチへドラッグして{$push}。離すとメニューで選択、Esc で中止。キーボード：パレットの「Refs: 選択中の参照をチェックアウト中のブランチにドロップ...」。", local = "参照のドラッグ|ブランチを別のブランチへドラッグして{$merge}・{$rebase}・早送り、リモートブランチへドラッグして{$push}。離すとメニューで選択、Esc で中止。キーボード：パレットの「Refs: 選択中の参照をチェックアウト中のブランチにドロップ...」。" }
changes_1 = "作業中の変更|Log の最初の行（WIP）を選ぶと、{$unstaged}と{$staged}のファイルが右に出ます。m でパス／ツリー切替、a で全ファイル表示、z でフォルダーを折りたたみ。"
changes_2 = "{$Stage}と{$unstage}|ファイル上で Ctrl+Space、そのボタン、または Ctrl+G s。すべては Ctrl+G a、{$unstage}は Ctrl+G u。ファイルを右クリックで破棄、履歴や blame、エディターで開く。"
changes_3 = "{$Diff}の見方|ファイルをクリックするか d。m でインライン／分割を切替、w で折り返し、s で空白を無視、n / p でブロック間を移動、Esc か q で Log に戻る。"
changes_4 = "ブロックと行|{$diff}内で、Space = ブロックを{$stage}、v の後 j / k で選び Enter = 選択行を{$stage}、x = ブロックを破棄。破棄は先に確認し、Ctrl+Z で元に戻せます。"
changes_5 = "{$Commit}を書く|要約と説明を入力し、Ctrl+Enter または緑のボタン。Shift+A で直前の{$commit}を修正。Ctrl+G c でカーソルをフォームへ、Esc で戻る。"
changes_6 = "{$Merge}の競合|バナーに「競合を解決...」が出ます。{$merge}エディターで競合ごとに A、B、または両方を選び（a / b / c）、出力を編集して保存、続行。"
changes_7 = { git = "取り消しとやり直し|Ctrl+Z / Ctrl+Y またはツールバーのボタンで、多くの操作を取り消し／やり直し：{$commit}、ブランチ、checkout、reset、{$stash}、破棄。危険な場合は先に確認します。", local = "取り消しとやり直し|Ctrl+Z / Ctrl+Y またはツールバーのボタンで、多くの操作を取り消し／やり直し：{$commit}、ブランチ、チェックアウト、リセット、{$stash}、破棄。危険な場合は先に確認します。" }
refs_1 = { git = "ブランチと{$tag}|ローカルブランチや{$tag}をダブルクリックで checkout、右クリックでメニュー（{$merge}、{$rebase}、名前変更、削除...）。Ctrl+G b と Ctrl+G t で現在の{$commit}に作成。", local = "ブランチと{$tag}|ローカルブランチや{$tag}をダブルクリックでチェックアウト、右クリックでメニュー（{$merge}、{$rebase}、名前変更、削除...）。Ctrl+G b と Ctrl+G t で現在の{$commit}に作成。" }
refs_2 = "ソロと非表示|o キーで選択した参照の{$commit}だけを表示、Shift+O で解除。参照のメニューでグラフから隠し、Shift+H で再表示。表示だけで、リポジトリは変わりません。"
refs_3 = "{$Fetch}・{$pull}・{$push}|Ctrl+G f：すべてのリモートを{$fetch}。Ctrl+G p：{$pull}。Ctrl+G Shift+P：{$push}。ボタン横の矢印で別の方法や別のリモートを選べます。"
refs_4 = "リモート|REMOTE の見出しの + で追加。リモートを右クリックして{$fetch}、Web リンクのコピー、URL の編集、削除。"
refs_5 = { git = "{$Stash}と worktree|{$stash}と Pop のボタン。Ctrl+G m は先にメッセージを尋ねます。{$stash}を右クリックで適用や取り出し。「worktree を作成...」でブランチを専用タブで開きます。", local = "{$Stash}とワークツリー|{$stash}と復元のボタン。Ctrl+G m は先にメッセージを尋ねます。{$stash}を右クリックで適用や取り出し。「ワークツリーを作成...」でブランチを専用タブで開きます。" }
refs_6 = "サブモジュールと LFS|サブモジュールがあると SUBMODULES セクションが出ます。ダブルクリックでタブとして開き、右クリックで更新。Git LFS の操作は LFS ボタンまたは Ctrl+G l。"
hosting_1 = "接続|設定 > 連携：GitHub・GitLab の個人トークンを貼り付けます。アカウントは不要で、トークンは OS の資格情報ヘルパーへ。"
hosting_2 = "リポジトリの関連付け|サイドバーの{$PRS}と ISSUES で、一覧が示すプロバイダーから選びます。自動では関連付けられず、リポジトリごとに保存されます。"
hosting_3 = "{$Pr}の作成|{$PRS}見出しの + またはそのセクションで n を押すとフォームが開きます。ブランチのメニューに「{$pr}を開始...」。AI がタイトルと説明を書けます。"
hosting_4 = "Issue|ISSUES セクションに一覧が出ます。+ または n で作成。行のメニューでブラウザーで開くなどの操作。"
hosting_5 = "参照|{$commit}メッセージやブランチ名の Issue と{$pr}の参照（#12、!53、ABC-7）が認識されます。{$commit}フォームの Alt+R で挿入。"
hosting_6 = "ツールバーのチップ|ツールバーのチップに、現在のブランチの{$pr}（GH #12、GL !53）か、作成用の薄い「+ {$pr_abbr}」が出ます。クリックしてください。"
hosting_7 = "SSH 鍵|プロファイルごと（設定 > プロファイル）またはリポジトリごと（タブメニュー > 「SSH と認証情報...」）に SSH 鍵を選びます。パスフレーズはシステムの ssh-agent に残ります。"
setup_1 = "設定|Ctrl+, または歯車。Tab でページ一覧とオプションを切替、j / k で移動、Enter か Space で値を変更、/ か Ctrl+F で全オプションを検索、Esc で閉じる。"
setup_2 = "テーマ|設定 > 外観 > テーマ：ダーク、ライト、ターミナルに合わせる、または多数のプリセット。Ctrl+N の後にキーで、設定を開かずにテーマ・言語・グラフの色も変更できます。"
setup_3 = "言語|設定 > 一般 > 言語は 17 言語に対応。「git 用語を翻訳」で、git 自身の用語（{$commit}、{$push}...）も翻訳するかを決めます。"
setup_4 = "プロファイル|設定 > プロファイルに{$commit}の ID（名前、メール、SSH 鍵）を保存。ツールバーのプロファイル欄でこのリポジトリ用を選びます。"
setup_5 = "開く場所|「開く場所」ボタン（Alt+O）で、このタブのフォルダーをターミナル・エディター・ファイルマネージャーで開きます。設定 > 開く場所 で一覧を編集。"
setup_6 = "キー割り当て|設定 > キーボードとマウスで任意のキーを再割り当て。このヘルプの「キー」タブにあなたの割り当てが表示されます。"
tools_1 = "AI（任意）|設定 > AI で設定するまでオフ。OpenAI 互換サービス、Anthropic、または claude -p のようなローカルエージェント。GitPoulpi のアカウントは一切不要です。"
tools_2 = "AI の操作|要約横のきらめきボタンか Ctrl+G i で{$commit}メッセージを作成、Ctrl+G w で変更を説明、Ctrl+G C で作業を複数の{$commit}に分割、Alt+I で競合の解決案。確認するまで何も適用されません。"
tools_3 = "CLI|gitpoulpi <コマンド> は、ウィンドウと同じデーモン経由で、スクリプトから同じ操作を行うため変更がすぐ反映されます。--json は機械向け出力、--help でフラグ一覧。"
tools_4 = "MCP|gitpoulpi mcp serve --stdio は CLI コマンドごとに 1 つのツールを AI エージェントに提供します。設定 > エージェントと MCP で変更を許可する範囲を選びます。"
tools_5 = "シェルラッパー|シェルラッパー gp を使うと、GitPoulpi の終了時に「終了して cd」でシェルがアクティブなタブのフォルダーに移動します。"

