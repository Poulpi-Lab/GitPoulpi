[branch_remotes]
# context: title of the dialog that lists every remote a branch pushes to and pulls from; {branch} is the local branch
title = "{branch} のリモート"
# context: label before the list that picks the upstream (the remote branch the local branch tracks)
upstream_label = "アップストリーム"
# context: table heading: a configured remote's name
col_remote = "リモート"
# context: table heading: the branch's name on that remote
col_branch = "ブランチ"
# context: table heading over a checkbox: the branch is also pushed to that remote
col_push = "{$Push}"
# context: table heading over a checkbox: a pull also takes the new commits of that remote
col_pull = "{$Pull}も"
# context: table heading: how the local branch stands against that remote (ahead, behind, in sync)
col_state = "状態"
# context: cell in the Pull too column of the upstream's own row: the upstream is always pulled
pull_upstream = "アップストリーム"
# context: state cell: the remote's copy and the local branch are the same commit
state_in_sync = "同期済み"
# context: state cell: the remote has no copy of the branch yet
state_new = "新規"
# context: state cell: the remote's copy shares no history with the local branch
state_unrelated = "無関係"
# context: state cell of a remote that is not used by the branch
state_none = "-"
# context: row of a remote the branch still mentions but the repository no longer has
gone = "リモートなし"
# context: button on a gone row: forget that remote for this branch
remove_button = "削除"
# context: warning under the table; {first} and {second} are two remote names with the same address
same_url = "{first} と {second} は同じ URL に{$push}します。"
# context: button: changes the branch name used on the selected remote
rename_button = "リモート上の名前を変更..."
# context: button: the branch tracks no upstream any more
unset_button = "アップストリーム解除"
# context: primary button of the dialog
apply_button = "適用"
# context: shown while the dialog reads the branch's remotes
loading = "リモートを読み込み中..."
# context: title of the small dialog that asks for the branch's name on one remote; {remote} is the remote
rename_title = "{remote} 上のブランチ名"
# context: placeholder of that dialog's field
rename_placeholder = "リモート上のブランチ名"
# context: primary button of that dialog
rename_set = "設定"
# context: inline error of that dialog when the field is empty
rename_empty = "ブランチ名を入力してください。"
# context: inline error when Rename is used on the upstream's own row
rename_upstream_row = "アップストリームのブランチ名は上のリストで選びます。"
# context: inline error when Rename is used with nothing to rename
rename_no_row = "先にリモートの行を選択してください。"
# context: key hints under the table; keep the key names (Space, p, r, Del, Enter)
keys_hint = "Space {$Push}、p {$Pull}も、r 名前変更、Del 削除、Enter 適用"
# context: status line while the change is sent; {branch} is the local branch
applying = "{branch} のリモートを設定中..."
# context: status line once the daemon applied the change; {branch} is the local branch
remotes_set = "{branch} のリモートを更新しました"

[push_group]
# context: title of the dialog that asks which remotes to push a branch to (one push only); {branch} is the local branch
title_select = "{branch} を選択したリモートに{$Push}"
# context: title of the dialog that shows how a branch stands against each remote before a grouped push; {n} is the number of remotes, {branch} the local branch
title_plan = { one = "{branch} を {n} 個のリモートに{$Push}", other = "{branch} を {n} 個のリモートに{$Push}" }
# context: title of the dialog while a grouped push runs or after it ended; {branch} is the local branch
title_run = "{branch} を{$Push}"
# context: line under the title; {branch} is the local branch, {sha} the short id of its tip
local_at = "ローカル {branch}（{sha}）"
# context: help line over the list of remotes to push to
select_hint = "今回の{$push}先のリモートを選びます。「記憶」にチェックを入れない限り何も保存されません。"
# context: checkbox: store the picked remotes as the branch's push targets
remember = "このブランチに記憶"
# context: shown under the list when no remote is ticked
select_none = "リモートを1つ以上選択してください。"
# context: shown while the daemon asks the remotes about the branch
loading = "リモートに問い合わせ中..."
# context: table heading: the remote's name
col_remote = "リモート"
# context: table heading: how the local branch stands against the remote
col_state = "状態"
# context: table heading: what the run does with that remote
col_action = "操作"
# context: state of a remote that already has the same commit
state_up_to_date = "最新"
# context: state of a remote that only misses local commits
state_ready = "準備完了"
# context: state of a remote that has no copy of the branch yet
state_new = "新規"
# context: state of a remote that has commits the local branch lacks
state_behind = "遅れ"
# context: state of a remote whose history and the local branch's both moved
state_diverged = "分岐"
# context: state of a remote whose commits are older copies of rebased or amended local commits
state_rewritten = "書き換え済み"
# context: state of a remote whose history shares nothing with the local branch
state_unrelated = "無関係"
# context: state of a remote whose host refused the branch earlier (protected branch)
state_refused = "拒否"
# context: state of a remote that could not be asked
state_unreachable = "接続不可"
# context: state of a remote that is no longer configured
state_missing = "なし"
# context: note on a remote that points at the same repository as an earlier row; {other} is that earlier remote
same_as = "{other} と同じリポジトリ"
# context: action: send the local commits to the remote
action_push = "{$Push}"
# context: action: move the local branch forward to the remote's commit; {remote} is the remote
action_fast_forward = "{remote} から早送り"
# context: action: combine the remote's commits into the local branch, then send; {remote} is the remote
action_merge = "{remote} から{$Merge}"
# context: action: replay the local commits on top of the remote's, then send; {remote} is the remote
action_rebase = "{remote} に{$Rebase}"
# context: action: overwrite the remote's branch, refused if it moved since the plan
action_force = "強制{$push}（リース）"
# context: action: leave this remote out
action_skip = "スキップ"
# context: line under a row whose merge would conflict; {n} is the number of files, {files} their names
conflicts = { one = "{$merge}すると {n} ファイルで競合します：{files}", other = "{$merge}すると {n} ファイルで競合します：{files}" }
# context: checkbox: also send the tags that no remote has yet
tags = "未送信の{$tags}も{$push}"
# context: summary line under the table; {steps} is the list of steps
then_line = "その後：{steps}。"
# context: summary line when every row is skipped or already up to date
then_nothing = "その後：することはありません。"
# context: separator between steps in the summary line
then_join = "、"
# context: step of the summary line; {remote} is the remote
step_fast_forward = "{remote} から早送り"
# context: step of the summary line; {remote} is the remote
step_merge = "{remote} を{$merge}"
# context: step of the summary line; {remote} is the remote
step_rebase = "{remote} に{$rebase}"
# context: step of the summary line; {n} is the number of remotes
step_push = { one = "{n} 個のリモートに{$push}", other = "{n} 個のリモートに{$push}" }
# context: warning under the summary when a row force-pushes; {n} is the number of commits that disappear, {remote} the remote
force_note = { one = "強制{$push}により {remote} 上の {n} {$commit}が置き換えられます。", other = "強制{$push}により {remote} 上の {n} {$commits}が置き換えられます。" }
# context: warning under the summary when rows rebase while other remotes already hold the local commits; {remotes} are those remotes
rebase_warn = "{$rebase}するとローカルの{$commits}が書き換えられ、{remotes} には強制{$push}が必要になります。"
# context: confirmation question before a force push; {n} is the number of remote commits replaced, {branch} the branch, {remotes} the remote names
force_confirm = { one = "{branch} を {remotes} に強制{$push}しますか？\nリース付き：リモート上の {n} {$commit}が置き換えられます。元に戻せません。", other = "{branch} を {remotes} に強制{$push}しますか？\nリース付き：リモート上の {n} {$commits}が置き換えられます。元に戻せません。" }
# context: button: ask the remotes again
btn_fetch_again = "再{$Fetch}"
# context: button: set every row that has a problem to Skip
btn_skip_problems = "問題をスキップ"
# context: button: close the dialog without running
btn_cancel = "キャンセル"
# context: button: run the grouped push
btn_run = "実行"
# context: button: go to the next step
btn_next = "次へ"
# context: button: close the dialog (the run goes on)
btn_close = "閉じる"
# context: button: try the failed remotes again
btn_retry = "失敗分を再試行"
# context: progress row: the remote took the commits
run_pushed = "送信済み"
# context: progress row: the remote got a new branch
run_created = "作成"
# context: progress row: nothing to send
run_up_to_date = "最新"
# context: progress row: the local branch moved forward
run_fast_forwarded = "早送り済み"
# context: progress row: the remote's commits were combined into the local branch with a new commit
run_merged = "統合済み"
# context: progress row: the local commits were replayed on the remote's
run_rebased = "再適用済み"
# context: progress row: the remote's commits were taken in
run_integrated = "取り込み済み"
# context: progress row: left out
run_skipped = "スキップ"
# context: progress row: the remote's commits are being combined with the local branch
run_merging = "統合中"
# context: progress row: sending in progress
run_pushing = "送信中"
# context: progress row: not started yet
