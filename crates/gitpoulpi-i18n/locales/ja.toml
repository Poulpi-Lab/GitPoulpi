graph_renderer_help = "auto は、対応するターミナルではグラフを実際の画像として、それ以外では文字で描画します - ターミナルの環境を引き継ぐが画像を通さない zellij や screen の中、背後のターミナルが sixel に対応していない tmux の中、および kitty_graphics 設定がオンでない herdr の中も文字になります。image は画像を強制し、text は強制的にオフにします。再起動が必要です。"
image_protocol = "画像プロトコル"
image_protocol_help = "画像（グラフ画像、作成者のアバター）をターミナルへ送る方法です。auto：kitty、Ghostty、および設定で kitty_graphics = true にした herdr では Kitty グラフィックスプロトコル（iTerm2 3.7.7 以降でも Kitty プロトコル）、WezTerm、Rio、mintty、古い iTerm2 では iTerm2 インライン画像、Windows Terminal、foot、Tabby、Konsole、mlterm、および背後のターミナルが sixel に対応している tmux では sixel 画像（グラフ列とアバター）、それ以外では文字。kitty、iterm2、sixel でそのプロトコルを強制します（設定が別の場所にある herdr には kitty、sixel を描画できるのに認識されないターミナルには sixel）。none で画像をオフにします。再起動が必要です。"
kitty_keyboard = "Kitty キーボードプロトコル"
kitty_keyboard_help = "auto は、起動時に約 100 ms 以内でターミナルが kitty キーボードプロトコルに対応しているかを問い合わせ、対応していれば使用します。従来のターミナルでは区別できないキーの組み合わせ（Control と記号、数字、Shift、Enter）が、制御コードと衝突せずそのまま届きます。応答しないターミナルでは従来のキーのままです。off はターミナルのキーボードモードに一切触れません。再起動が必要です。"
color_depth = "色深度"
color_depth_help = "auto は 24 ビットカラーを使いますが、表示できないターミナル（Apple のターミナル、Linux コンソール、COLORTERM を持たない 256 色ターミナル）では、最も近い 256 色または 16 色に変換します。truecolor、256、16 は深度を強制します。すぐに反映されます。"
text_cursor = "テキストカーソル"
text_cursor_help = "terminal は、フォーカス中のテキスト欄のキャレット位置にターミナル自身のカーソルをバー形状で置きます。ターミナルのカーソル設定が反映され、入力メソッドの候補ウィンドウもキャレットの位置に開きます。drawn は GitPoulpi 独自のキャレット（ブロックまたはアンダースコア）を描画し、ターミナルのカーソルは非表示のままにします。すぐに反映されます。"
graph_show_stashes = { git = "グラフに{$stash}を表示", local = "グラフにスタッシュを表示" }
graph_show_stashes_help = { git = "各{$stash}がログに日付順で専用の行を持ち、作成元の{$commit}の隣のレーンに小さな四角として描かれ、破線で結ばれます。選択すると変更内容が表示され、右クリック（または .）で Pop、Apply、Drop を選べます。オフの場合、{$stash}は{$STASHES}セクションにのみ表示されます。ソロ表示中は描画されません。", local = "各スタッシュがログに日付順で専用の行を持ち、作成元のコミットの隣のレーンに小さな四角として描かれ、破線で結ばれます。選択すると変更内容が表示され、右クリック（または .）で 復元、適用、破棄 を選べます。オフの場合、スタッシュは{$STASHES}セクションにのみ表示されます。ソロ表示中は描画されません。" }
ref_connector = { git = "参照と{$commit}の接続線", local = "参照とコミットの接続線" }
ref_connector_help = { git = "Ref 列の各参照ピルから、グラフ内の{$commit}の円へ細い線を引きます。空白部分にだけ描かれ、通過するレーンが上に残り、何も動きません。Ref 列が Graph 列のすぐ左にあるときだけ描かれます。", local = "Ref 列の各参照ピルから、グラフ内のコミットの円へ細い線を引きます。空白部分にだけ描かれ、通過するレーンが上に残り、何も動きません。Ref 列が Graph 列のすぐ左にあるときだけ描かれます。" }
log_wip_counts_in_message = "変更列が非表示のとき、メッセージに WIP の変更数を表示"
log_wip_counts_in_message_help = { git = "WIP 行には、変更、追加、削除されたファイルの数が表示されます。変更列が表示されているとき（ログのヘッダーを右クリックして表示）は、各{$commit}と同様に常にその列に数が入ります。非表示のときは、これがオンなら WIP のメッセージに添えられ、オフなら数は一切表示されません。", local = "WIP 行には、変更、追加、削除されたファイルの数が表示されます。変更列が表示されているとき（ログのヘッダーを右クリックして表示）は、各コミットと同様に常にその列に数が入ります。非表示のときは、これがオンなら WIP のメッセージに添えられ、オフなら数は一切表示されません。" }
avatars = "作成者のアバター"
avatars_help = { git = "作成者の画像です。graph はグラフ内の各{$commit}の円の中に作成者を描きます（画像グラフのみ。文字グラフでは代わりに色付きのイニシャルが Author 列に入ります）。author は Author 列の先頭に丸い画像を置きます。どちらも{$commit}詳細ペインにも表示されます。既定ではオフです。オンにすると、各作成者のメールアドレスの SHA-256 ハッシュを HTTPS で gravatar.com に送信します - 既知または推測しやすいアドレスのハッシュは匿名ではありません - さらに、github.com のリモートを持つリポジトリでは、作成者ごとに 1 回、その{$commit}を作成したアカウントを GitHub API に問い合わせます（GitHub 連携のトークンがあればそれを使用）。画像が届くまで、および存在しない場合は、イニシャルまたは無地の円が表示されます。off はネットワークに何も送信しません。", local = "作成者の画像です。graph はグラフ内の各コミットの円の中に作成者を描きます（画像グラフのみ。文字グラフでは代わりに色付きのイニシャルが Author 列に入ります）。author は Author 列の先頭に丸い画像を置きます。どちらもコミット詳細ペインにも表示されます。既定ではオフです。オンにすると、各作成者のメールアドレスの SHA-256 ハッシュを HTTPS で gravatar.com に送信します - 既知または推測しやすいアドレスのハッシュは匿名ではありません - さらに、github.com のリモートを持つリポジトリでは、作成者ごとに 1 回、そのコミットを作成したアカウントを GitHub API に問い合わせます（GitHub 連携のトークンがあればそれを使用）。画像が届くまで、および存在しない場合は、イニシャルまたは無地の円が表示されます。off はネットワークに何も送信しません。" }
avatar_sources = "アバターの取得元"
avatar_sources_help = { git = "作成者の画像を探す順序です（GitHub の noreply アドレスは常に先にそのアカウントを指します）。hosting_gravatar：リポジトリのリモートとホストが一致する、接続済みの GitHub、GitLab、または Bitbucket 連携（GitHub の{$commit}作成者またはユーザー検索、GitLab のメールによるアバターまたは users API）、次に Gravatar。一致する連携が接続されていない場合は Gravatar が先になり、github.com のリモートは最後に未認証で問い合わせます。gravatar_hosting：その逆。gravatar または hosting：その 1 つのみ。どれにも画像がない場合は、下のアバターのフォールバックが描かれます。まだ検索していない作成者から適用されます。", local = "作成者の画像を探す順序です（GitHub の noreply アドレスは常に先にそのアカウントを指します）。hosting_gravatar：リポジトリのリモートとホストが一致する、接続済みの GitHub、GitLab、または Bitbucket 連携（GitHub のコミット作成者またはユーザー検索、GitLab のメールによるアバターまたは users API）、次に Gravatar。一致する連携が接続されていない場合は Gravatar が先になり、github.com のリモートは最後に未認証で問い合わせます。gravatar_hosting：その逆。gravatar または hosting：その 1 つのみ。どれにも画像がない場合は、下のアバターのフォールバックが描かれます。まだ検索していない作成者から適用されます。" }
avatar_fallback = "アバターのフォールバック"
avatar_fallback_help = "画像のない作成者に使うものです。identicon：メールアドレスから決まる色の、GitHub 風の 5x5 の左右対称パターンで、ローカルで生成されます（ネットワーク不使用）。画像対応ターミナルでは画像、それ以外ではブロック文字です。initials：イニシャルの入った色付きバッジ。"
composer_files = "コンポーザーの提案"
composer_files_help = { git = "AI {$commit}コンポーザーのレビューの開き方です。expanded：提案された各{$commit}がファイルを一覧表示します。collapsed：{$commit}の行のみで、Right/Left（または矢印のクリック）で 1 件ずつ開きます。", local = "AI コミットコンポーザーのレビューの開き方です。expanded：提案された各コミットがファイルを一覧表示します。collapsed：コミットの行のみで、Right/Left（または矢印のクリック）で 1 件ずつ開きます。" }
blame_side = "Blame の注釈"
blame_side_help = "Blame ビューで注釈列（アバター、作成者、経過時間、要約）を置く側。right：コードの右側。left：コードの左側。"
column_resize = "列のサイズ変更"
column_resize_help = "Log、Radar、ファイルビューのサイド列で、列の境界をどうつかむか。line：ポインターが境界にある間、表の全高にわたる細い線を表示し、ヘッダーに小さな目印を置きます。header：隙間も目印もなく、ヘッダーからだけサイズを変更でき、次のセルの最初の文字が光ります。"
blame_width = "Blame 注釈の幅"
blame_width_help = "注釈列の幅（セル数、24～90）です。Blame ビューで境界をドラッグするか、広げる / 狭めるキーで変更できます。新しい幅はここに保存されます。"
ref_tree = "ブランチのフォルダーツリー"
ref_tree_help = "Refs サイドバーは、ブランチ名を `/` で折りたたみ可能なフォルダーにまとめ、各リモートを最上位のノードにします。オフの場合は、ブランチごとに 1 行のフラット表示になります。Refs ペインの `y` で即座に切り替わり、選択がここに書き込まれます。"
tree_folders_first = "ツリー表示でフォルダーを先に"
tree_folders_first_help = "ファイルペイン（変更、詳細、比較）のツリー表示で、フォルダー内のサブフォルダーをファイルより先に並べます。オフの場合は、パスのアルファベット順のままです。フラット表示は影響を受けません。"
reveal_on_ref_click = "参照をクリックしてグラフに表示"
reveal_on_ref_click_help = "Refs ペインで参照を 1 回クリックすると、Log がその参照の指す位置までスクロールし、行が一瞬ハイライトされます。Log の選択と右側のパネルは変わりません。オフの場合、クリックはサイドバーの行を選択するだけです。参照のメニューの「グラフで表示」、Refs ペインのキー、パレットのコマンドは、どちらの設定でも使えます。"
graph_ghost_ref = "ホバー中の{$commit}に、ブランチの仮表示を出す"
graph_ghost_ref_help = "ログの Ref 列で、自分の ref を持たないホバー中の{$commit}に、履歴から推定した所属ブランチ(なければリモートブランチ)の名前を淡いピルで表示します。ピルにホバーすると種類が表示されます。クリックしても特別なことは起きません。ブランチの作成はブランチ作成コマンドで行います。Ref 列に余裕があるときだけ表示されます。オフにすると表示されません。"
mouse_enabled = "マウスを有効化"
mouse_enabled_help = "オフの場合、ドラッグによる選択はターミナルに任せます。再起動が必要です。"
mouse_scroll_lines = "マウスホイールの行数"
mouse_scroll_lines_help = { git = "ログでホイールの 1 ノッチが動かす{$commit}数です。再起動が必要です。", local = "ログでホイールの 1 ノッチが動かすコミット数です。再起動が必要です。" }
heading_date_time = "日付と時刻"
heading_layout = "レイアウト"
date_locale = "日付/時刻のロケール"
date_locale_help = "system：月名・曜日名はインターフェース言語に従います。english：言語に関わらず常に英語名。このページのすべての日付に適用されます。"
diff_layout = "既定のレイアウト"
diff_layout_help = { git = "インライン（1 列）または分割（前後を左右に並べる）。このウィンドウでも再起動後でも、最後に見た{$diff}から引き継がれます - ここでの変更は、*新しい* セッションの開始時の設定にのみ反映されます。", local = "インライン（1 列）または分割（前後を左右に並べる）。このウィンドウでも再起動後でも、最後に見た差分から引き継がれます - ここでの変更は、*新しい* セッションの開始時の設定にのみ反映されます。" }
diff_hunks_only = "ハンクのみ"
diff_hunks_only_help = "オンの場合、変更されたハンクのみを前後数行の文脈とともに表示します。オフの場合、ファイル全体を表示し、変更箇所をその場でハイライトします。レイアウトと同様に引き継がれます。"
diff_show_whitespace = "空白のみの変更を表示"
diff_show_whitespace_help = "オフの場合、空白のみが異なるハンクは文脈として折りたたまれます。"
input_color = "入力欄の色"
input_color_help = "テキスト入力欄の背景色です。「テーマに従う」（既定）はテーマ自身の色を使い、それ以外はそれを上書きする暗い色です。Custom... は下の 16 進数カラーを使います。すぐに反映され、再起動は不要です。"
input_color_custom = "入力欄のカスタム色"
input_color_custom_help = "#rrggbb 形式で、入力欄の色が Custom のときに使います。すぐに反映されます。"
minimap = "ミニマップ"
minimap_help = { git = "{$diff}（ファイル全体モード）とエディターの縦スクロールバーの横に、ファイル全体の縮小図を表示し、表示中の部分を強調します。クリックでジャンプします。ターミナルが画像を描画できる場合は実際の画像、それ以外は点字セルです。{$diff}内の `M` とパレットの「ミニマップの切り替え」でも操作できます。", local = "差分（ファイル全体モード）とエディターの縦スクロールバーの横に、ファイル全体の縮小図を表示し、表示中の部分を強調します。クリックでジャンプします。ターミナルが画像を描画できる場合は実際の画像、それ以外は点字セルです。差分内の `M` とパレットの「ミニマップの切り替え」でも操作できます。" }
date_format = "日付の形式"
date_format_help = "Blame / ファイル履歴の日付列です。"
date_time_format = "日付/時刻の形式"
date_time_format_help = "ログの日付列そのものです。"
date_verbose_format = "日付の詳細形式"
date_verbose_format_help = { git = "{$commit}詳細パネルの日付行、日付列のホバーツールチップ、およびコピー > 日付です。", local = "コミット詳細パネルの日付行、日付列のホバーツールチップ、およびコピー > 日付です。" }
preview = "プレビュー"
sidebar_sections_scope = "左ペインのセクション"
sidebar_sections_scope_help = "左ペインで表示するセクションの選び方を決めます。リポジトリ別：リポジトリごとに独自の設定を持ちます（最初はグローバルの設定が使われます）。グローバル：すべてのリポジトリで共通の設定です。切り替えても、どちらの設定も失われません。"
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "列のレイアウト"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "Logの列の並べ方。fit：すべての列がペインに収まり、概要だけが伸縮します。scroll：概要を含め列は幅を保ち、ペインより広いときは表が横にスクロールします。"

[settings_git]
default_backend = "git バックエンド"
default_backend_help = "グローバル設定です。起動中のデーモンは、起動時のバックエンドを保持します。"
default_backend_warning = "この変更の後に起動したデーモンから有効になります。"
pull_mode = { git = "{$pull}ボタン", local = "プルボタン" }
default_encoding = "既定のエンコーディング"
default_encoding_help = { git = "有効な UTF-8 でないファイル内容、Blame、{$diff}の表示に使います（有効な UTF-8 は再デコードしません）。リポジトリごとに下で上書きできます。表示のみ：{$stage}とパッチはファイルのバイト列をそのまま保ちます。", local = "有効な UTF-8 でないファイル内容、Blame、差分の表示に使います（有効な UTF-8 は再デコードしません）。リポジトリごとに下で上書きできます。表示のみ：ステージとパッチはファイルのバイト列をそのまま保ちます。" }
push_behavior = { git = "{$push}ボタン", local = "プッシュボタン" }
push_behavior_help = { git = "direct：既定のリモートへすぐに{$push}します。ask：既定のリモートを選択済みにした小さなメニューを開きます。ボタンの ▾ は常に確認します。", local = "direct：既定のリモートへすぐにプッシュします。ask：既定のリモートを選択済みにした小さなメニューを開きます。ボタンの ▾ は常に確認します。" }
repo_encoding_help = { git = "有効な UTF-8 でないファイル内容、Blame、{$diff}を表示用にデコードする方法です（このリポジトリのみ。inherited：このページの既定のエンコーディング）。{$stage}で再エンコードされることはありません。", local = "有効な UTF-8 でないファイル内容、Blame、差分を表示用にデコードする方法です（このリポジトリのみ。inherited：このページの既定のエンコーディング）。ステージで再エンコードされることはありません。" }
core_autocrlf_help = "このリポジトリの git 設定（core.autocrlf）に書き込まれるため、git や他のツールからも見えます。true：チェックアウト時に LF を CRLF へ。input：履歴に保存するときだけ CRLF を LF へ。false：変換しない。（継承）：リポジトリの値を削除し、グローバルの git 設定を使います。元に戻せます。"
core_eol_help = "このリポジトリの git 設定（core.eol）に書き込まれます。git が作業ツリーのテキストファイルに使う改行です（lf、crlf、またはプラットフォーム既定の native）。（継承）：リポジトリの値を削除し、グローバルの git 設定を使います。元に戻せます。"
git_lfs = "Git LFS"
git_lfs_help = { git = "インターフェースに Git LFS（LFS {$tag}、{$diff}カード、プログラム未検出バナー、LFS コマンド）を表示し、GitPoulpi 自身の LFS 手順（クローン後のオブジェクトのダウンロード）を実行できるようにします。オフ：git 自身の LFS フィルターは引き続き動作しますが、GitPoulpi が git-lfs を直接呼び出すことはありません。", local = "インターフェースに Git LFS（LFS タグ、差分カード、プログラム未検出バナー、LFS コマンド）を表示し、GitPoulpi 自身の LFS 手順（クローン後のオブジェクトのダウンロード）を実行できるようにします。オフ：git 自身の LFS フィルターは引き続き動作しますが、GitPoulpi が git-lfs を直接呼び出すことはありません。" }
git_lfs_program = "git-lfs プログラム"
git_lfs_program_help = "https://git-lfs.com からインストールしてください（Windows：Git for Windows に同梱、または `winget install GitHub.GitLFS`。Debian/Ubuntu：`apt install git-lfs`。macOS：`brew install git-lfs`）。パレット：LFS: Open Install Page。"
initialize_lfs_for_this_repository = "このリポジトリの LFS を初期化"
initialize_lfs_for_this_repository_help = "`git lfs install --local` を実行します：LFS のフィルターとフックはこのリポジトリ自身の設定に入り、グローバル設定には入りません。git-lfs が必要です。"
pull_mode_help = { git = "ツールバーの{$Pull}{hint}の動作です：merge（可能なら早送り）、ff_only、または rebase。ボタンの ▾ の項目はそれぞれの動作をすぐに実行し、この設定は変更しません。", local = "ツールバーの{$Pull}{hint}の動作です：merge（可能なら早送り）、ff_only、または rebase。ボタンの ▾ の項目はそれぞれの動作をすぐに実行し、この設定は変更しません。" }
merge_fast_forward = "{$Merge}の早送り"
