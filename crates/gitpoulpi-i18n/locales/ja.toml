undo_enabled = "元に戻す機能を有効化"
undo_enabled_help = { git = "オンの場合、元に戻す／やり直すで、{$commit}、{$stage}、破棄、ブランチの変更を取り消せます。オフの場合、GitPoulpi は元に戻すための処理を一切行わず（最速の設定）、ツールバーのボタンも消えます。オフにすると、すべてのリポジトリの元に戻す履歴が消去されます。", local = "オンの場合、元に戻す／やり直すで、コミット、ステージ、破棄、ブランチの変更を取り消せます。オフの場合、GitPoulpi は元に戻すための処理を一切行わず（最速の設定）、ツールバーのボタンも消えます。オフにすると、すべてのリポジトリの元に戻す履歴が消去されます。" }
