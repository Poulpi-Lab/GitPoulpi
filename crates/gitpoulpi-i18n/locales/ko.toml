core_autocrlf_help = "이 저장소의 git 설정(core.autocrlf)에 기록되므로 git과 다른 모든 도구에서 보입니다. true: 체크아웃 시 LF를 CRLF로; input: 기록에 저장할 때만 CRLF를 LF로; false: 변환 안 함. (상속): 저장소 값을 제거해 전역 git 설정이 적용되게 합니다. 실행 취소할 수 있습니다."
core_eol_help = "이 저장소의 git 설정(core.eol)에 기록됩니다. git이 작업 트리의 텍스트 파일에 쓰는 줄 끝입니다(lf, crlf, 또는 플랫폼 기본인 native). (상속): 저장소 값을 제거해 전역 git 설정이 적용되게 합니다. 실행 취소할 수 있습니다."
