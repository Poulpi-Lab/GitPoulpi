[settings_ui]
theme = "테마"
theme_help = "전체 인터페이스의 색상입니다. 목록을 이동하면 각 테마가 바로 미리보기되며, Enter로 확정하고 Esc로 되돌립니다. 시스템은 터미널을 따릅니다(시작할 때 한 번 감지한 밝은/어두운 배경, 알 수 없으면 어둡게). 설정 폴더의 themes/ 에 있는 직접 만든 테마 파일은 맨 끝에 나옵니다."
theme_system = "시스템(터미널을 따름)"
follow_theme = "테마 따르기"
theme_swatches = "색상"
graph_lane_background = "그래프 레인 배경"
graph_lane_background_help = "꺼짐: 투명, 레인 뒤에 아무것도 없음 (기본값). 행 색조: 그래프 열 안에 {$commit} 레인 색상의 옅은 띠와 열의 오른쪽 가장자리에 같은 색의 가는 막대를 표시합니다. 저장된 레인 값은 행 색조로 읽습니다. 설정을 닫을 때 적용됩니다."
graph_row_tint_strength = "행 색조 강도"
graph_row_tint_strength_help = "행 색조 띠가 얼마나 흐려지는지입니다: 강하게(원래 값), 보통(기본값), 약하게. 띠만 흐려지며 열 오른쪽 가장자리의 막대는 원래 색을 유지합니다. 설정을 닫을 때 적용됩니다."
graph_row_tint_strength_coming = "먼저 그래프 레인 배경을 행 색조로 설정하세요"
toolbar_position = "도구 모음 위치"
toolbar_position_help = "도구 모음의 위치: 위, 아래(기본값), 왼쪽, 오른쪽. 왼쪽과 오른쪽은 창 옆에 세로 열을 만들며, 80열 미만의 창에서는 아래에 그립니다. 즉시 적용됩니다."
toolbar_align = "도구 모음 버튼 정렬"
toolbar_align_help = "도구 모음에서 버튼이 놓이는 위치: 시작(기본값), 가운데, 끝. 시작은 행에서는 왼쪽, 열에서는 위이며, 끝은 오른쪽과 아래입니다. 즉시 적용됩니다."
toolbar_pr_pinned = "{$pr} 버튼을 끝에 고정"
toolbar_pr_pinned_help = "켜면(기본값) 정렬과 관계없이 {$pr} 버튼이 도구 모음의 맨 끝(오른쪽, 열에서는 아래)에 놓입니다. 끄면 다른 버튼과 함께 배치되고 같은 정렬을 따릅니다. 즉시 적용됩니다."
statusbar_position = "상태 표시줄 위치"
statusbar_position_help = "상태 표시줄(브랜치, 개수, 메시지, 키 힌트)의 위치: 위(저장소 탭 위) 또는 아래(기본값). 홈 탭은 아래에 자체 상태 표시줄을 유지합니다. 즉시 적용됩니다."
tabs_position = "탭 표시줄 위치"
tabs_position_help = "저장소 탭의 위치: 위(기본값), 아래, 왼쪽. 왼쪽은 창의 왼쪽 가장자리에 한 줄에 탭 하나씩 목록으로 표시합니다. 80열 미만의 창에서는 위에 그립니다. 세로 도구 모음 옆에서도 탭이 가장 바깥에 놓입니다. 즉시 적용됩니다."
graph_color_theme = "그래프 색상 테마"
graph_color_theme_help = "Log 그래프의 레인 색상 팔레트입니다. 테마 따르기는 선택한 테마의 팔레트를 사용하고, 다른 항목은 이를 덮어쓰므로 어떤 테마든 어떤 팔레트와도 조합할 수 있습니다. 설정을 닫을 때 적용됩니다."
graph_renderer = "그래프 렌더러"
graph_renderer_help = "auto는 지원하는 터미널에서는 그래프를 실제 이미지로, 그 외에는 문자로 그립니다 - 터미널의 환경을 상속하지만 이미지를 전달하지 않는 tmux, zellij 안에서와, kitty_graphics 설정이 켜져 있지 않은 herdr 안에서도 문자로 그립니다. image는 이미지를 강제로 켜고, text는 강제로 끕니다. 재시작이 필요합니다."
image_protocol = "이미지 프로토콜"
image_protocol_help = "그림(그래프 이미지, 작성자 아바타)을 터미널에 전달하는 방식입니다. auto: kitty, Ghostty, 설정에 kitty_graphics = true가 있는 herdr에서는 Kitty 그래픽 프로토콜, WezTerm, iTerm2, mintty에서는 iTerm2 인라인 이미지, Windows Terminal, foot, Konsole, mlterm에서는 sixel 그림(작성자 아바타만, 그래프는 문자 그대로), 그 외에는 문자. kitty, iterm2 또는 sixel은 해당 프로토콜을 강제합니다 (설정이 다른 곳에 있는 herdr에는 kitty, sixel을 그리지만 인식되지 않는 터미널에는 sixel). none은 그림을 끕니다. 재시작이 필요합니다."
kitty_keyboard = "Kitty 키보드 프로토콜"
kitty_keyboard_help = "auto는 시작할 때 약 100ms 안에 터미널이 kitty 키보드 프로토콜을 지원하는지 묻고, 지원하면 사용합니다: 레거시 터미널이 구분하지 못하는 조합(Control과 문장 부호, 숫자, Shift, Enter)이 제어 코드와 충돌하지 않고 그대로 전달됩니다. 응답하지 않는 터미널은 레거시 키를 유지합니다. off는 터미널의 키보드 모드를 건드리지 않습니다. 재시작이 필요합니다."
color_depth = "색상 깊이"
color_depth_help = "auto는 24비트 색상을 사용하되, 이를 표시하지 못하는 터미널(Apple 터미널, Linux 콘솔, COLORTERM이 없는 256색 터미널)에서는 가장 가까운 256색 또는 16색으로 변환합니다. truecolor, 256, 16은 깊이를 강제합니다. 즉시 적용됩니다."
graph_show_stashes = "그래프에 {$stash} 표시"
graph_show_stashes_help = { git = "각 {$stash}가 Log에 날짜 순으로 자기만의 행을 가집니다: 만든 {$commit} 옆 레인의 작은 상자로, 점선으로 {$commit}과 이어집니다. 선택하면 변경 내용이 표시되고, 오른쪽 클릭(또는 .)으로 Pop, Apply, Drop을 쓸 수 있습니다. 꺼짐이면 {$stash}는 {$STASHES} 섹션에만 표시됩니다. 솔로 모드에서는 그려지지 않습니다.", local = "각 {$stash}가 Log에 날짜 순으로 자기만의 행을 가집니다: 만든 {$commit} 옆 레인의 작은 상자로, 점선으로 {$commit}과 이어집니다. 선택하면 변경 내용이 표시되고, 오른쪽 클릭(또는 .)으로 꺼내기, 적용, 삭제를 쓸 수 있습니다. 꺼짐이면 {$stash}는 {$STASHES} 섹션에만 표시됩니다. 솔로 모드에서는 그려지지 않습니다." }
ref_connector = "Ref-{$commit} 연결선"
ref_connector_help = "Ref 열의 각 ref 배지에서 그래프에 있는 해당 {$commit}의 원까지 이어지는 가는 선입니다. 빈 공간에만 그려지므로 지나가는 레인은 그 위에 그대로 보이고 다른 것은 움직이지 않습니다. Ref 열이 그래프 열 바로 왼쪽에 있을 때만 그려집니다."
log_wip_counts_in_message = "변경 열이 숨겨졌을 때 메시지에 WIP 변경 수 표시"
log_wip_counts_in_message_help = "WIP 행은 수정, 추가, 삭제된 파일 수를 보여줍니다. 변경 열이 보이면(Log 헤더를 오른쪽 클릭해 표시) 모든 {$commit}처럼 항상 그 열에 개수가 들어갑니다. 숨겨져 있으면 이 옵션이 켜진 동안 WIP 메시지에 개수가 함께 표시되고, 꺼짐이면 개수를 전혀 표시하지 않습니다."
avatars = "작성자 아바타"
avatars_help = "작성자 사진입니다. graph는 그래프의 각 {$commit} 원 안에 작성자를 그립니다 (이미지 그래프 전용. 텍스트 그래프에서는 색깔 있는 이니셜이 작성자 열에 들어갑니다). author는 작성자 열 시작 부분에 둥근 사진을 넣습니다. 둘 다 {$commit} 상세 창에도 표시합니다. 기본값은 꺼짐: 켜면 각 작성자 이메일 주소의 SHA-256 해시를 HTTPS로 gravatar.com에 보내며 - 알려졌거나 추측 가능한 주소의 해시는 익명이 아닙니다 - github.com 리모트가 있는 저장소에서는 작성자마다 한 번씩 GitHub API에 그 사람의 {$commit}을 만든 계정을 묻습니다 (GitHub 연동 토큰이 있으면 사용). 사진이 도착하기 전과 없을 때는 이니셜 또는 단순한 원이 표시됩니다. off는 네트워크로 아무것도 보내지 않습니다."
avatar_sources = "아바타 출처"
avatar_sources_help = "작성자 사진을 찾는 곳과 순서입니다 (GitHub noreply 주소는 항상 계정을 먼저 알려줍니다). hosting_gravatar: 저장소 리모트의 호스트와 일치하는 연결된 GitHub, GitLab 또는 Bitbucket 연동(GitHub {$commit} 작성자 또는 사용자 검색, GitLab 이메일별 아바타 또는 users API), 그다음 Gravatar. 일치하는 연동이 없으면 Gravatar가 먼저이며 github.com 리모트에는 마지막에 인증 없이 요청합니다. gravatar_hosting: 반대 순서. gravatar 또는 hosting: 그것만. 사진이 없으면 아래의 아바타 대체 이미지가 그려집니다. 아직 조회하지 않은 작성자에게 적용됩니다."
avatar_fallback = "아바타 대체 이미지"
avatar_fallback_help = "사진이 없는 작성자에게 표시할 것입니다. identicon: 이메일에서 얻은 색상으로 로컬에서(네트워크 없이) 생성한 GitHub 스타일의 5x5 좌우 대칭 패턴으로, 이미지 터미널에서는 그림, 그 외에는 블록 문자입니다. initials: 이니셜이 적힌 색깔 배지."
composer_files = "작성기 제안"
composer_files_help = "AI {$commit} 작성기의 검토 화면이 열리는 방식입니다. expanded: 제안된 각 {$commit}이 파일을 나열합니다. collapsed: {$commit} 행만 표시하며 Right/Left(또는 화살표 클릭)로 하나를 엽니다."
blame_side = "Blame 주석"
blame_side_help = "Blame 보기에서 주석 열(아바타, 작성자, 경과 시간, 요약)을 둘 쪽입니다. right: 코드 오른쪽. left: 코드 왼쪽."
column_resize = "열 크기 조절"
column_resize_help = "Log, Radar, 파일 보기의 측면 열에서 열 경계를 잡는 방식입니다. line: 포인터가 경계 위에 있는 동안 표 전체 높이에 걸쳐 가는 선이 나타나고 머리글에 작은 눈금이 표시됩니다. header: 틈도 눈금도 없고 머리글에서만 크기를 조절하며, 다음 셀의 첫 글자가 밝아집니다."
blame_width = "Blame 주석 너비"
blame_width_help = "주석 열의 너비(셀 단위, 24~90). Blame 보기에서 경계를 끌거나 넓히기 / 좁히기 키를 사용하세요. 새 너비는 여기에 저장됩니다."
ref_tree = "브랜치 폴더 트리"
ref_tree_help = "Refs 사이드바가 브랜치 이름을 `/` 기준으로 접을 수 있는 폴더로 묶고, 각 리모트를 최상위 노드로 둡니다. 꺼짐이면 브랜치마다 평평한 행 하나입니다. Refs 창에서 `y`를 누르면 즉시 전환되고 선택이 여기에 기록됩니다."
reveal_on_ref_click = "Ref를 클릭하면 그래프에 표시"
reveal_on_ref_click_help = "Refs 창에서 ref를 한 번 클릭하면 Log가 ref가 가리키는 위치로 스크롤되고 해당 행이 잠깐 강조됩니다. Log의 선택과 오른쪽 패널은 그대로입니다. 끄면 클릭은 사이드바 행만 선택합니다. ref 메뉴의 \"그래프에서 보기\", Refs 창의 단축키, 팔레트 명령은 어느 쪽이든 동작합니다."
graph_ghost_ref = "마우스를 올린 {$commit}에 가상 브랜치 표시"
graph_ghost_ref_help = "Log의 Ref 열에서, 자체 ref가 없는 마우스를 올린 {$commit}에, 기록에서 추론한 소속 브랜치(없으면 원격 브랜치)의 이름을 흐린 알약 모양으로 표시합니다. 알약에 마우스를 올리면 종류가 표시됩니다. 클릭해도 특별한 일은 일어나지 않으며, 브랜치는 브랜치 만들기 명령으로 만듭니다. Ref 열에 여유 공간이 있을 때만 그려집니다. 끄면 표시하지 않습니다."
mouse_enabled = "마우스 사용"
mouse_enabled_help = "꺼짐이면 클릭-드래그 선택을 터미널에 맡깁니다. 재시작이 필요합니다."
mouse_scroll_lines = "마우스 휠 줄 수"
mouse_scroll_lines_help = "Log에서 휠 한 칸이 움직이는 {$commit} 수입니다. 재시작이 필요합니다."
heading_date_time = "날짜 및 시간"
heading_layout = "레이아웃"
date_locale = "날짜/시간 로캘"
date_locale_help = "system: 월·요일 이름이 인터페이스 언어를 따릅니다. english: 언어와 관계없이 항상 영어 이름. 이 페이지의 모든 날짜에 적용됩니다."
diff_layout = "기본 레이아웃"
diff_layout_help = "인라인(한 열) 또는 분할(변경 전후를 나란히). 이 창과 재시작을 넘어 마지막으로 본 {$diff}에서 이어집니다 - 여기서 바꾸면 *새* 세션이 시작할 값만 정해집니다."
diff_hunks_only = "변경 부분만"
diff_hunks_only_help = "켜짐이면 변경된 hunk만 몇 줄의 문맥과 함께 표시하고, 꺼짐이면 파일 전체를 표시하며 변경 부분을 그 자리에서 강조합니다. 레이아웃처럼 이어집니다."
diff_show_whitespace = "공백만 바뀐 변경 표시"
diff_show_whitespace_help = "꺼짐이면 공백만 다른 hunk를 문맥으로 접습니다."
input_color = "입력창 색상"
input_color_help = "텍스트 입력창의 배경입니다. 테마 따르기(기본값)는 테마 고유의 색을 쓰고, 나머지는 이를 덮어쓰는 어두운 색입니다. 사용자 지정...은 아래의 16진수 색상을 사용합니다. 재시작 없이 즉시 적용됩니다."
input_color_custom = "사용자 지정 입력창 색상"
input_color_custom_help = "#rrggbb 형식이며 입력창 색상이 사용자 지정일 때 사용합니다. 즉시 적용됩니다."
minimap = "미니맵"
minimap_help = "{$diff}(전체 파일 모드)와 편집기의 세로 스크롤바 옆에 파일 전체의 그림을 표시하고 보이는 부분을 강조합니다. 클릭하면 이동합니다. 터미널이 이미지를 그릴 수 있으면 실제 이미지, 그 외에는 점자 셀로 그립니다. {$diff}의 `M`과 팔레트의 \"미니맵 전환\"도 같습니다."
date_format = "날짜 형식"
date_format_help = "Blame / 파일 기록의 날짜 열입니다."
date_time_format = "날짜/시간 형식"
date_time_format_help = "Log의 날짜 열 자체입니다."
date_verbose_format = "날짜 상세 형식"
date_verbose_format_help = "{$commit} 상세 패널의 날짜 줄, 날짜 열의 호버 툴팁, 그리고 복사 > 날짜입니다."
preview = "미리보기"
sidebar_sections_scope = "왼쪽 창 섹션"
