[jobs]
# context: window title of the list of background jobs (clone, fetch, push...)
title = "백그라운드 작업"
# context: key hints under the background jobs list
hint = "위/아래: 선택  c / Del: 취소  Enter: 저장소로 이동  Esc: 닫기"
empty = "실행 중인 백그라운드 작업이 없습니다."
# context: short name of a background job that clones a repository
kind_clone = "클론"
kind_workspace = "워크스페이스"
kind_send = "호스트로 전송 중"
# context: short name of a background job that transfers Git LFS files
kind_lfs = "LFS"
# context: short name of a background job that talks to a remote (anything not fetch, push, pull or clone)
kind_remote = "리모트"
# context: status line when Push is pressed while a push of the same branch is running
already_pushing = "{$push}가 이미 진행 중입니다 - 합류했습니다"
# context: status line when Pull is pressed while a pull is running
already_pulling = "{$pull}이 이미 진행 중입니다 - 합류했습니다"
# context: status line when Fetch is pressed while a fetch is running
already_fetching = "{$fetch}가 이미 진행 중입니다 - 합류했습니다"
# context: status line when an LFS transfer is started while the same one is running
already_lfs = "이미 LFS 파일을 전송 중입니다 - 진행 중인 전송에 합류했습니다"
# context: one job as {kind}: {name}, e.g. Push: my-repo; the name is the repository folder
label = "{kind}: {name}"
# context: status bar: how many background jobs are running, e.g. Jobs: 3
jobs_count = "작업: {n}"
# context: job state: waiting for another job on the same repository to end
state_queued = "대기 중"
state_running = "실행 중"
# context: job state: a cancel was requested and the job is being stopped
state_cancelling = "취소하는 중..."
state_done = "완료"
state_failed = "실패"
# context: job state: stopped on request
state_canceled = "취소됨"
# context: button that stops a background job
button_cancel = "취소"
button_cancel_all = "모두 취소"
# context: shown on the disabled Cancel button of a job that is already being stopped
why_cancelling = "이미 취소하는 중입니다"
# context: why a pull cannot be canceled any more: it is now writing the merge into the working tree
why_integrating = "변경 사항을 통합하는 중: 안전하게 중지할 수 없습니다"
# context: why a job cannot be canceled: it is rewriting files in the working tree
why_rewriting = "파일을 다시 쓰는 중: 안전하게 중지할 수 없습니다"
# context: why a workflow job cannot be canceled between its steps
why_steps = "여러 단계의 워크플로: 아직 단계 사이에서 중지할 수 없습니다"
why_sent = "호스트로 전송했으며 응답을 기다리는 중입니다"
why_finished = "이미 끝났습니다"
why_unknown = "그런 작업이 없습니다"
palette_show = "작업: 백그라운드 작업 표시"
# context: command palette: cancel one named background job
palette_cancel = "작업: {label} 취소"
palette_cancel_all = "작업: 취소할 수 있는 것을 모두 취소"
palette_none = "실행 중인 백그라운드 작업이 없습니다"
# context: help overlay line for the key that opens the background jobs list
help_nav = "백그라운드 작업(클론, {$fetch}, {$push} 등의 진행률)을 열고 취소하기"
# context: status line when a job was stopped on request; {label} names it
canceled = "취소됨: {label}"
# context: status line when a cancel was refused; {reason} says why
not_cancellable = "취소할 수 없음: {reason}"
# context: status line when the same job is already running; {existing} is its number
job_conflict = "이미 실행 중입니다(작업 {existing})"
kind_fetch = "{$Fetch}"
kind_push = "{$Push}"
kind_push_tags = "{$Push} {$tags}"
kind_pull = "{$Pull}"
why_purging = "이전 기록 삭제 중: 안전하게 중단할 수 없습니다"

