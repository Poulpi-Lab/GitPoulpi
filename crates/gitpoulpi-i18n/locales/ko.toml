[_meta]
language_name = "한국어"

# `git`: 영어 어휘(기본값). `local`: 한국어 개발 도구에서 쓰는 어휘
# ("Git 용어 번역" 설정). 조사가 필요한 곳은 용어 뒤에 조사를 붙이지 않도록 명사구로 쓴다.
[term]
commit = { git = "commit", local = "커밋" }
commits = { git = "commits", local = "커밋" }
push = { git = "push", local = "푸시" }
pull = { git = "pull", local = "풀" }
fetch = { git = "fetch", local = "페치" }
merge = { git = "merge", local = "병합" }
rebase = { git = "rebase", local = "리베이스" }
cherry_pick = { git = "cherry-pick", local = "체리픽" }
stash = { git = "stash", local = "스태시" }
stashes = { git = "stashes", local = "스태시" }
pop = { git = "pop", local = "꺼내기" }
apply = { git = "apply", local = "적용" }
stash_drop = { git = "drop", local = "삭제" }
