launch = "에이전트용 창 열기"
launch_help = "AI 에이전트가 무언가를 표시하라고 요청했는데 열려 있는 GitPoulpi 창이 어디에도 없을 때 창을 여는 방법입니다: off(안 함, 기본값), 터미널(kitty, foot, WezTerm, Windows Terminal 등), 멀티플렉서의 새 탭/창/워크스페이스(tmux, zellij, cmux 등), 또는 아래 템플릿을 쓰는 custom. 에이전트가 직접 요청(`--launch`)해야 하거나 ui_control이 auto여야 합니다. 다음 요청부터 적용됩니다."
