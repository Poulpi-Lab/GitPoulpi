tab_dir_follow = "활성 탭의 폴더 따라가기"
tab_dir_follow_help = "프로그램은 자신의 셸 폴더를 바꿀 수 없으므로 두 가지 방법을 제공합니다. buttons(기본값): 활성 탭이 GitPoulpi를 시작한 폴더가 아닐 때 탭 표시줄에 \"종료 후 cd\" (셸 래퍼로 시작한 경우에만, `gitpoulpi shell-init` 참조)가 표시됩니다. auto: 버튼 없음. 종료하면 항상 셸이 활성 탭으로 cd하고, 새 탭을 열 때마다 터미널이 자동으로 열립니다 (시작 시 복원된 탭은 제외)."
