title_filtered = "도움말 - 필터 \"{filter}\" - Esc로 지우기, ?로 닫기"
hint = "Tab/Shift+Tab, ←/→, Alt+1..8: 탭 - ↑/↓, PgUp/PgDn 스크롤"
start_1 = "창|위쪽에 탭(홈은 저장소를 나열하고 열고 클론), 그 아래 도구 모음, 왼쪽에 Refs 사이드바, 가운데 Log, 오른쪽에 변경 사항과 {$commit} 양식."
start_2 = "명령 팔레트|Ctrl+P는 모든 동작을 단축키와 함께 나열합니다. 입력해 검색하고 Enter로 실행합니다. 마우스로 하는 일은 팔레트로도 됩니다."
start_3 = "단축키 접두사|Ctrl+G 다음 키로 git 동작({$stage}, {$commit}, {$pull}, {$push}...)을 실행합니다. Ctrl+N 다음 키는 이동하거나 보기를 바꿉니다. 상태 표시줄에 선택지가 나옵니다."
start_4 = "탭|저장소마다 탭 하나. Ctrl+PageUp / Ctrl+PageDown으로 전환, Ctrl+W로 닫기, t로 탭 선택기, 탭을 우클릭하거나 Ctrl+T로 메뉴."
start_5 = "마우스와 키|클릭은 선택, 더블 클릭은 열기 또는 체크아웃, 우클릭(또는 .)은 메뉴, 드래그는 ref와 {$rebase} 행 이동. 모든 마우스 동작에는 키가 있습니다."
start_6 = "새로 고침과 실행 취소|r은 새로 고침, F5는 모두 다시 불러오기, Ctrl+Z / Ctrl+Y는 마지막 작업 취소/다시 실행, q는 종료."
log_1 = "그래프 읽기|{$commit}마다 한 행, 브랜치마다 한 레인. 첫 행은 아직 {$commit}하지 않은 작업(WIP)이며 선택하면 변경 사항이 보입니다. 행을 클릭하면 오른쪽에 자세히 나옵니다."
log_2 = "검색|f(또는 검색 버튼)는 메시지, 작성자, 해시, ref와 맞지 않는 행을 흐리게 합니다. Enter / Shift+Enter로 다음/이전 결과로 이동. /는 Refs 사이드바를 필터링합니다."
log_3 = { git = "{$Commit} 메뉴|{$commit}을 우클릭하거나 . 키: {$cherry_pick}, 되돌리기, 리셋, 메시지 편집, 브랜치나 {$tag} 만들기, 체크아웃, worktree, 패치, 복사.", local = "{$Commit} 메뉴|{$commit}을 우클릭하거나 . 키: {$cherry_pick}, 되돌리기, 리셋, 메시지 편집, 브랜치나 {$tag} 만들기, 체크아웃, 워크트리, 패치, 복사." }
log_4 = "대화형 {$rebase}|{$commit} 메뉴의 \"여기서부터 대화형 {$rebase}...\": 각 {$commit}을 {$pick}, {$reword}, {$squash}, {$fixup}, {$drop}, {$edit}으로 지정하고 Ctrl+위/아래로 순서를 바꾼 뒤 Ctrl+S로 시작, Esc로 나갑니다."
log_5 = "여러 {$commit}|Ctrl+클릭은 {$commit} 토글, Shift+클릭 (Alt+클릭)은 범위 선택, Space는 현재 항목 토글, Esc는 해제. 이후 우클릭으로 선택 전체를 {$cherry_pick}하거나 되돌리기."
log_6 = "ref 드래그|브랜치를 다른 브랜치로 드래그해 {$merge}, {$rebase}, fast-forward, 리모트 브랜치로 드래그해 {$push}. 놓으면 메뉴에서 선택, Esc로 취소. 키보드: 팔레트의 \"Refs: 선택한 ref 놓기...\"."
changes_1 = "작업 중 변경|Log의 첫 행(WIP)을 선택하면 {$unstaged} 및 {$staged} 파일이 오른쪽에 나옵니다. m은 경로/트리 전환, a는 모든 파일 표시, z는 폴더 접기."
changes_2 = "{$Stage}과 {$unstage}|파일에서 Ctrl+Space, 그 버튼, 또는 Ctrl+G s. 전체는 Ctrl+G a, {$unstage}는 Ctrl+G u. 파일을 우클릭해 되돌리기, 기록이나 blame 보기, 편집기로 열기."
changes_3 = "{$Diff} 읽기|파일을 클릭하거나 d를 누릅니다. m은 인라인/분할 전환, w는 줄 바꿈, s는 공백 무시, n / p는 블록 간 이동, Esc 또는 q는 Log로 돌아갑니다."
changes_4 = "블록과 줄|{$diff}에서 Space = 블록 {$stage}, v 후 j / k로 선택하고 Enter = 선택한 줄 {$stage}, x = 블록 되돌리기. 되돌리기는 먼저 묻고 Ctrl+Z로 복구합니다."
changes_5 = "{$Commit} 작성|요약과 설명을 입력하고 Ctrl+Enter 또는 초록 버튼. Shift+A는 마지막 {$commit}을 수정합니다. Ctrl+G c는 커서를 양식으로, Esc는 나갑니다."
changes_6 = "{$Merge} 충돌|배너에 \"충돌 해결...\"이 나옵니다. {$merge} 편집기에서 충돌마다 A, B 또는 둘 다 선택(a / b / c)하고 출력을 편집해 저장한 뒤 계속합니다."
changes_7 = "실행 취소와 다시 실행|Ctrl+Z / Ctrl+Y 또는 도구 모음 버튼으로 대부분의 작업을 취소/다시 실행합니다: {$commit}, 브랜치, 체크아웃, 리셋, {$stash}, 되돌리기. 위험하면 먼저 묻습니다."
refs_1 = "브랜치와 {$tag}|로컬 브랜치나 {$tag}를 더블 클릭하면 체크아웃, 우클릭하면 메뉴({$merge}, {$rebase}, 이름 변경, 삭제...). Ctrl+G b와 Ctrl+G t는 현재 {$commit}에 만듭니다."
refs_2 = "솔로와 숨기기|o 키는 선택한 ref의 {$commit}만 표시, Shift+O로 해제. ref 메뉴로 그래프에서 숨기고 Shift+H로 모두 다시 표시. 표시만 바뀌며 저장소는 변하지 않습니다."
refs_3 = "{$Fetch}, {$pull}, {$push}|Ctrl+G f: 모든 리모트 {$fetch}. Ctrl+G p: {$pull}. Ctrl+G Shift+P: {$push}. 버튼 옆 화살표로 다른 방식이나 다른 리모트를 고릅니다."
refs_4 = "리모트|리모트 제목의 +로 추가. 리모트를 우클릭해 {$fetch}, 웹 링크 복사, URL 편집, 제거."
refs_5 = { git = "{$Stash}와 worktree|{$stash}와 Pop 버튼. Ctrl+G m은 먼저 메시지를 묻습니다. {$stash}를 우클릭해 적용하거나 꺼냅니다. \"worktree 만들기...\"는 브랜치를 별도 탭으로 엽니다.", local = "{$Stash}와 워크트리|{$stash}와 꺼내기 버튼. Ctrl+G m은 먼저 메시지를 묻습니다. {$stash}를 우클릭해 적용하거나 꺼냅니다. \"워크트리 만들기...\"는 브랜치를 별도 탭으로 엽니다." }
refs_6 = "서브모듈과 LFS|서브모듈이 있으면 서브모듈 섹션이 나타납니다. 더블 클릭으로 탭으로 열고 우클릭으로 업데이트. Git LFS 동작은 LFS 버튼 또는 Ctrl+G l."
hosting_1 = "연결|설정 > 연동: GitHub, GitLab의 개인 토큰을 붙여 넣습니다. 계정은 필요 없고 토큰은 OS 자격 증명 도우미로 갑니다."
hosting_2 = "저장소 연결|사이드바의 {$PRS} 및 이슈 섹션에서 목록이 제안하는 제공자 중 하나를 고릅니다. 자동으로 연결되지 않으며 저장소별로 저장됩니다."
hosting_3 = "{$Pr} 만들기|{$PRS} 제목의 + 또는 해당 섹션에서 n을 누르면 양식이 열립니다. 브랜치 메뉴에 \"{$pr} 시작...\"이 있습니다. AI가 제목과 설명을 써 줄 수 있습니다."
hosting_4 = "이슈|이슈 섹션에 나열됩니다. + 또는 n으로 새로 만듭니다. 행 메뉴로 브라우저에서 열거나 동작을 실행합니다."
hosting_5 = "참조|{$commit} 메시지나 브랜치 이름의 이슈 및 {$pr} 참조(#12, !53, ABC-7)가 인식됩니다. {$commit} 양식에서 Alt+R로 삽입합니다."
hosting_6 = "도구 모음 칩|도구 모음 왼쪽의 칩은 현재 브랜치의 {$pr}(GH #12, GL !53)이나 새로 시작하는 흐릿한 \"+ {$pr_abbr}\"를 보여 줍니다. 클릭하세요."
hosting_7 = "SSH 키|프로필별(설정 > 프로필) 또는 저장소별(탭 메뉴 > \"SSH 키...\")로 SSH 키를 고릅니다. 암호문은 시스템 ssh-agent에 남습니다."
setup_1 = "설정|Ctrl+, 또는 톱니바퀴. Tab은 페이지 목록과 옵션 사이를 전환, j / k는 이동, Enter 또는 Space는 값 변경, /나 Ctrl+F는 모든 옵션 검색, Esc는 닫기."
setup_2 = "테마|설정 > 모양 > 테마: 어둡게, 밝게, 터미널 따르기 또는 여러 프리셋. Ctrl+N 다음 키로 설정을 열지 않고 테마, 언어, 그래프 색도 바꿉니다."
setup_3 = "언어|설정 > 일반 > 언어는 17개 언어를 제공합니다. \"git 용어 번역\"은 git 고유 용어({$commit}, {$push}...)도 번역할지 정합니다."
setup_4 = "프로필|설정 > 프로필에 {$commit} 신원(이름, 이메일, SSH 키)이 있습니다. 도구 모음의 프로필 상자로 이 저장소용을 고릅니다."
setup_5 = "열기|열기 버튼(Alt+O)은 이 탭의 폴더를 터미널, 편집기, 파일 관리자에서 엽니다. 설정 > 열기에서 목록을 편집합니다."
setup_6 = "키 바인딩|설정 > 키보드 및 마우스에서 모든 키를 다시 지정합니다. 이 도움말의 키 탭에 내 바인딩이 표시됩니다."
tools_1 = "AI(선택)|설정 > AI에서 설정하기 전에는 꺼져 있습니다: OpenAI 호환 서비스, Anthropic, 또는 claude -p 같은 로컬 에이전트. GitPoulpi 계정은 전혀 필요 없습니다."
tools_2 = "AI 동작|요약 옆 반짝이 버튼 또는 Ctrl+G i는 {$commit} 메시지를 쓰고, Ctrl+G w는 변경을 설명하고, Ctrl+G C는 작업을 여러 {$commit}으로 나누고, Alt+I는 충돌 해결안을 제안합니다. 확인 전에는 아무것도 적용되지 않습니다."
tools_3 = "CLI|gitpoulpi <명령>은 창과 같은 데몬을 통해 스크립트에서 창과 같은 일을 하므로 변경이 바로 반영됩니다. --json은 기계용 출력, --help는 플래그 목록."
tools_4 = "MCP|gitpoulpi mcp serve --stdio는 AI 에이전트에게 CLI 명령마다 도구 하나를 제공합니다. 설정 > 에이전트 및 MCP에서 변경 허용 범위를 정합니다."
tools_5 = "셸 래퍼|셸 래퍼 gp를 쓰면 GitPoulpi 종료 시 \"종료 후 cd\"가 셸을 활성 탭의 폴더에 둡니다."

