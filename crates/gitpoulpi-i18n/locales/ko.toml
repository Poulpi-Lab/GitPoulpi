settings_preferences_the_8 = "이 도움말 오버레이 전환 - 설정 위에 열리며 설정은 뒤에 열려 있습니다"
settings_preferences_the_9 = "마우스: 사이드바의 섹션, 필드, 체크박스, 버튼 행 클릭 - 키보드와 같은 동작"
text_fields_filters_1 = "커서 이동. Ctrl+Left/Right는 단어 단위. 여러 줄 필드에서는 Up/Down으로 줄 사이 이동"
text_fields_filters_2 = "선택 확장"
text_fields_filters_3 = "모두 선택 - 입력하면 대체되고 Backspace/Delete로 삭제"
text_fields_filters_4 = "현재 줄의 시작 / 끝까지 삭제"
text_fields_filters_5 = "선택 영역 복사 / 잘라내기 (비밀번호는 제외)"
text_fields_filters_6 = "마우스: 클릭하면 커서 배치, 드래그하면 선택, 더블 클릭은 단어 선택. 필드 밖을 클릭하면 텍스트를 유지한 채 포커스 해제"
mouse_gestures_in_1 = "터미널은 대부분의 경우 OS 포인터 모양을 바꾸지 않으므로 마우스를 올렸을 때의 배경/전경 변화가 유일한 \"클릭할 수 있음\" 표시인 경우가 많습니다 - 모든 버튼, 체크박스, 탭, 메뉴 행, 창 헤더 동작, × 닫기 버튼이 마우스를 올리면 강조됩니다. Log 셀, {$commit}의 다른 ref, 파일/blame 여백은 대신 값 툴팁을 표시합니다"
mouse_gestures_in_2 = "창 구분선이나 Log 열 경계는 크기 조절 (최솟값을 넘으면 창이 접힘). 이웃을 넘겨 드래그한 Log 열 헤더는 순서 변경. ref를 다른 브랜치 위로 드래그하면 적용할 수 있는 동작의 메뉴가 열림 (Esc로 취소)"
mouse_gestures_in_3 = "{$diff}, 파일 보기, Blame, 파일 기록의 텍스트 위를 드래그하면 선택, 단어는 더블 클릭. y 또는 Ctrl+C로 복사 (파일 텍스트만, 여백 제외). 선택한 단어의 다른 출현은 {$diff}와 편집기에서 색이 입혀지고 (눈금자에 표시됨)"
mouse_gestures_in_4 = "포커스되었거나 마우스가 올라간 목록 또는 {$diff}를 스크롤. Shift+휠 (터미널이 보고하는 두 표기 모두)은 자동 줄바꿈이 꺼져 있을 때 {$diff}/파일 보기/blame을 대신 *가로*로 스크롤"
mouse_gestures_in_5 = "컨텍스트 메뉴가 있는 곳 어디서나 엽니다 (위의 각 창 섹션 참조). 키보드 대응 키는 항상 {{*global.context_menu}}"
mouse_gestures_in_6 = "모든 \"복사 ...\" 동작은 OSC 52로 *터미널*에 클립보드를 요청합니다 - TUI는 직접 접근할 수 없습니다. 이 시퀀스를 무시하는 터미널은 복사하지 않습니다"
mouse_gestures_in_7 = "크기 조절/포인터/열린 손 힌트는 이를 지원하는 터미널 (kitty, foot, xterm. 그 외에는 들쭉날쭉)에 OSC 22로 전송됩니다 - 드래그할 수 있는 구분선과 열 경계는 앱 자체 버퍼 안에서도 강조되며 터미널의 협조가 전혀 필요하지 않습니다"
merge_conflict_editor_31 = "현재 충돌의 선택 해제 (미해결로 되돌림) / 파일 전체를 원래 충돌 상태로 초기화 (출력에 입력한 내용이 있으면 먼저 확인, 실행 취소로 되돌릴 수 있음). 도구 모음에 초기화 버튼이 있습니다"
merge_conflict_editor_32 = "이웃 창(A, Base, B, 출력)으로 이동하며 같은 충돌에 머뭅니다"
merge_conflict_editor_33 = "같은 충돌에서 창으로 바로 이동. 탐색 접두사 다음 1 / 2 / 3 도 됩니다"
merge_conflict_editor_34 = "숫자를 붙이면 이동을 반복합니다: 3j 는 세 줄 아래, 2k 는 두 줄 위, 3n 은 세 충돌 앞으로"
merge_conflict_editor_35 = "스크롤바에 모든 충돌이 표시됩니다 (주황: 미해결, 초록: 처리됨, 파랑: 현재). 표시를 클릭하면 그 충돌로 이동합니다"
git_actions_then_25 = "LFS 메뉴 열기(도구 모음의 LFS 버튼, 각 항목은 팔레트에도 있음)"
git_actions_then_26 = "LFS: 모든 ref의 객체 {$fetch}"
git_actions_then_27 = "LFS: 포인터 파일을 실제 내용으로 쓰기(오프라인)"
git_actions_then_28 = "LFS: {$pull}(내려받은 뒤 내용 쓰기)"
git_actions_then_29 = "LFS: 모든 ref의 객체 {$push}"
git_actions_then_30 = "LFS: 로컬 LFS 저장소 정리"
diff_view_encoding = "파일을 읽을 인코딩 선택 (자동 감지, UTF-8, UTF-16, Windows-1252, ...)"
commit_composer_bottom_14 = "\"훅 건너뛰기\" 전환: git 훅을 실행하지 않고 {$commit}을 만듭니다 (Status 창)"
repositories_and_tabs_39 = "입력하는 대로 폴더의 항목 필터링 (대소문자 구분 없음. 왼쪽 또는 내용 영역에서는 `/`로도 포커스. Enter 또는 Down은 첫 번째 일치 항목으로 이동, Esc는 필터 지우기. 폴더를 바꾸면 비워짐)"
repositories_and_tabs_40 = "형제 폴더 표시 전환 (왼쪽 트리에 열린 모든 단계의 다른 폴더도 표시. 설정이 유지됨)"
split_1 = "선택한 파일, hunk 또는 줄을 해당 {$commit}에 지정 (0은 미지정으로 두고, n은 새 {$commit}에 넣음). Tab으로 {$commits} 목록과 변경 사항 사이 전환, Enter 또는 e로 메시지 편집, d로 {$commit} 삭제. {{compose.apply}}로 분할"
split_2 = "현재 hunk 안에서 개별 줄 선택 (Shift+Up/Down으로 선택 확장)"
split_3 = "{$commit}을 목록에서 위나 아래로 이동 (K와 J도 동일)"
split_4 = "편집기를 열었을 때의 상태로 모든 변경 사항 되돌리기"
split_5 = "현재 계획대로 {$commit} 분할. 계획이 유효하지 않으면 버튼이 비활성화되고 상태 표시줄에 이유가 표시됨"
split_6 = "{$commits} 서명 전환 (저장소의 gpgSign 설정이 true이면 편집기를 열 때 켜져 있음)"
split_7 = "{$commits} 창에서는 해당 {$commit} 선택. 변경 사항에서 m 또는 Enter는 지정할 {$commit} 목록 표시"
rewrite_9 = "크기 탭을 열고 기록을 분석합니다: 가장 큰 파일과 폴더, 삭제됐지만 아직 저장된 파일을 보여 주며, 선택한 행은 제거 규칙이 됩니다"
rewrite_host_howto = "호스트가 보호하는 브랜치에서 다시 쓴 기록을 통과시키는 방법을 설명합니다: 보호 해제, 새 이름으로 {$push}, 저장소 다시 만들기 중 하나이며 대신 실행해 주지는 않습니다"
rewrite_ai_rules = "설명을 바탕으로 AI가 다시 쓰기 규칙을 만듦 (미리보기도 적용도 하지 않음)"
log_columns_2 = "scroll the Log's columns sideways when they keep their widths (the Scroll sideways layout, chosen in the column chooser, in Settings or with s while a column is picked); in the fit layout every column fits the pane"

