lfs_autofix_filters_help = "Git LFS를 쓰는 저장소에서 {$pull}이나 {$push}를 하기 전에 LFS 필터나 훅이 없으면 `git lfs install --local`을 실행합니다(그 저장소 자체 설정만, 전역 설정은 건드리지 않음). 큰 파일이 제대로 전송됩니다. 실행하면 상태 표시줄에 표시합니다. git-lfs가 필요합니다."

