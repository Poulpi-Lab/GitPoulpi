pull_mode_help = "도구 모음의 {$Pull}{hint}가 하는 일입니다: {$merge}(가능하면 fast-forward), ff_only 또는 {$rebase}. 버튼의 ▾ 항목은 각자의 동작을 즉시 실행하며 이 값을 바꾸지 않습니다."
repo_heading = "저장소: {repo} - 이 저장소 전용"
inherited = "(상속됨)"
lfs_not_checked = "(아직 확인 안 함)"
