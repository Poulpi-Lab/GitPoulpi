mcp_server = "MCP 서버"
mcp_server_help = "켜면 AI 에이전트가 MCP 서버를 시작할 수 있습니다(`gitpoulpi mcp serve`, 네트워크 엔드포인트는 `--http`). 끄면 시작을 거부합니다. `mcp.enabled`로 저장됩니다. 변경은 에이전트가 다음에 서버를 시작할 때 적용되며, 이미 실행 중인 서버는 시작 시의 설정을 유지합니다."
