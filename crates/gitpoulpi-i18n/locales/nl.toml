[help_tabs]
tab_keys = "Toetsen"
tab_start = "Start"
tab_log = "Log"
tab_changes = "Wijzigingen"
tab_refs = "Refs"
tab_hosting = "Hosting"
tab_setup = "Instellen"
tab_tools = "AI & CLI"
title = "Help - typ om te filteren, Tab wisselt van tabblad, ? sluit"
title_filtered = "Help - filter \"{filter}\" - Esc wist, ? sluit"
hint = "Tab/Shift+Tab, ←/→, Alt+1..8: tabbladen - ↑/↓, PgUp/PgDn scrollen"
start_1 = "Venster|Bovenaan de tabbladen (Start toont, opent en kloont repositories), dan de werkbalk, links de Refs-zijbalk, in het midden de Log, en rechts de wijzigingen en het {$commit}-formulier."
start_2 = "Opdrachtenpalet|Ctrl+P toont elke actie met haar sneltoets. Typ om te zoeken, Enter voert uit. Alles wat met de muis kan, kan ook via het palet."
start_3 = "Sneltoetsprefixen|Ctrl+G en dan een toets voert een git-actie uit ({$stage}, {$commit}, {$pull}, {$push}...). Ctrl+N en dan een toets verplaatst de focus of wijzigt de weergave. De statusbalk toont de keuzes."
start_4 = "Tabbladen|Eén tabblad per repository. Ctrl+PageUp / Ctrl+PageDown wisselen, Ctrl+W sluit, t opent de tabbladkiezer; rechtsklik op een tabblad of Ctrl+T opent het menu ervan."
start_5 = "Muis en toetsen|Klikken selecteert, dubbelklikken opent of checkt uit, rechtsklikken (of .) opent een menu, slepen verplaatst refs en {$rebase}-rijen. Elke muisactie heeft een toets."
start_6 = "Vernieuwen en ongedaan maken|r vernieuwt, F5 laadt alles opnieuw, Ctrl+Z / Ctrl+Y maken de laatste bewerking ongedaan of voeren haar opnieuw uit, q sluit af."
log_1 = "De grafiek lezen|Eén rij per {$commit}, één baan per branch. De eerste rij is je nog niet gecommitte werk (WIP): selecteer die om de wijzigingen te zien. Klik op een rij voor de details rechts."
log_2 = "Zoeken|f (of de knop Zoeken) dimt de rijen die niet passen bij een bericht, auteur, hash of ref. Enter / Shift+Enter springen naar de volgende / vorige treffer. / filtert de Refs-zijbalk."
log_3 = "{$Commit}-menu|Rechtsklik op een {$commit} of druk er op .: {$cherry_pick}, revert, reset, bericht bewerken, branch of {$tag} maken, checkout, worktree, patch, kopiëren."
log_4 = "Interactieve {$rebase}|\"Interactief rebasen vanaf hier...\" in het {$commit}-menu: zet elke {$commit} op {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} of {$edit}, herorden met Ctrl+Up/Down, start met Ctrl+S, verlaat met Esc."
log_5 = "Meerdere {$commits}|Ctrl+klik selecteert of deselecteert een {$commit}, Shift+klik (Alt+klik) selecteert een reeks, Spatie wisselt de huidige, Esc wist de selectie. Rechtsklik daarna voor {$cherry_pick} of revert van de hele selectie."
log_6 = "Refs slepen|Sleep een branch op een andere voor {$merge}, {$rebase} of fast-forward, of op een remote branch voor {$push}; laat los om in een menu te kiezen, Esc annuleert. Toetsenbord: palet, \"Refs: Geselecteerde ref droppen op uitgecheckte branch...\"."
changes_1 = "Lokale wijzigingen|Selecteer de eerste Log-rij (WIP): rechts verschijnen de {$unstaged} en {$staged} bestanden. m wisselt tussen pad en boom, a toont alle bestanden, z klapt de mappen in."
changes_2 = "Stagen en unstagen|Ctrl+Spatie op een bestand, de knop ervan of Ctrl+G s; Ctrl+G a voor alles, Ctrl+G u om te unstagen. Rechtsklik op een bestand om het te verwerpen, de geschiedenis of blame te zien, of het in je editor te openen."
changes_3 = "Een {$diff} lezen|Klik op een bestand of druk op d. m wisselt inline / gesplitst, w breekt regels af, s negeert witruimte, n / p springen tussen hunks, Esc of q gaat terug naar de Log."
changes_4 = "Hunks en regels|In een {$diff}: Spatie = hunk stagen, v dan j / k dan Enter = gekozen regels stagen, x = hunk verwerpen. Verwerpen vraagt eerst; Ctrl+Z zet het terug."
changes_5 = "Een {$commit} schrijven|Typ een samenvatting en een beschrijving, dan Ctrl+Enter of de groene knop. Shift+A wijzigt de laatste {$commit} (amend). Ctrl+G c zet de cursor in het formulier, Esc verlaat het."
changes_6 = { git = "Mergeconflicten|Een banner biedt \"Conflicten oplossen...\". Kies in de Merge-editor per conflict A, B of beide (a / b / c), bewerk de uitvoer, sla op en kies dan Doorgaan.", local = "Samenvoegconflicten|Een banner biedt \"Conflicten oplossen...\". Kies in de samenvoegeditor per conflict A, B of beide (a / b / c), bewerk de uitvoer, sla op en kies dan Doorgaan." }
changes_7 = "Ongedaan maken en opnieuw|Ctrl+Z / Ctrl+Y, of de werkbalkknoppen, maken de meeste bewerkingen ongedaan of voeren ze opnieuw uit: {$commits}, branches, checkouts, resets, {$stashes}, verwerpingen. Bij risico wordt eerst gevraagd."
refs_1 = "Branches en {$tags}|Dubbelklik op een lokale branch of {$tag} om die uit te checken; rechtsklik voor het menu ({$merge}, {$rebase}, hernoemen, verwijderen...). Ctrl+G b en Ctrl+G t maken er een op de uitgecheckte {$commit}."
refs_2 = "Solo en verbergen|De toets o toont alleen de {$commits} van de gekozen ref, Shift+O stopt daarmee. Het menu van een ref verbergt die in de grafiek; Shift+H toont alles weer. Alleen weergave: er verandert niets in de repository."
refs_3 = "{$Fetch}, {$pull}, {$push}|Ctrl+G f: {$fetch} van alle remotes. Ctrl+G p: {$pull}. Ctrl+G Shift+P: {$push}. De pijl naast een werkbalkknop kiest een andere manier of een andere remote."
refs_4 = "Remotes|De + in de titel REMOTE voegt er een toe. Rechtsklik op een remote voor {$fetch}, de weblink kopiëren, de URL's bewerken of verwijderen."
refs_5 = "{$Stashes} en worktrees|De knoppen {$Stash} en Pop; Ctrl+G m vraagt eerst om een bericht. Rechtsklik op een {$stash} om die toe te passen of te poppen. \"Worktree maken van <naam>...\" opent een branch in een eigen tabblad."
refs_6 = "Submodules en LFS|Een sectie SUBMODULES verschijnt als de repository er heeft: dubbelklik opent er een als tabblad, rechtsklik werkt die bij. Git LFS-acties: de LFS-knop of Ctrl+G l."
hosting_1 = "Verbinden|Instellingen > Integraties: plak een persoonlijk token voor GitHub of GitLab. Geen account nodig; het token gaat naar de credential helper van je systeem."
hosting_2 = "Repository koppelen|Kies in de secties {$PRS} en ISSUES van de zijbalk een van de providers die de keuzelijst voorstelt. Niets wordt automatisch gekoppeld; de koppeling wordt per repository bewaard."
hosting_3 = "Een {$pr} maken|De + in de kop {$PRS}, of n in die sectie, opent het formulier; het menu van een branch heeft \"{$Pr} starten vanaf <naam>...\". AI kan de titel en de beschrijving schrijven."
hosting_4 = "Issues|De sectie ISSUES toont ze; + of n maakt er een. Het menu van een rij opent het issue in je browser of voert er een actie op uit."
hosting_5 = "Verwijzingen|Verwijzingen naar issues en {$prs} (#12, !53, ABC-7) in een {$commit}-bericht of branchnaam worden herkend. Alt+R in het {$commit}-formulier voegt er een in."
hosting_6 = "Werkbalkchip|Links in de werkbalk toont een chip de {$pr} van de uitgecheckte branch (GH #12, GL !53) of een gedimde \"+ {$pr_abbr}\" om er een te starten. Klik erop."
hosting_7 = "SSH-sleutels|Kies een SSH-sleutel per profiel (Instellingen > Profielen) of per repository (tabbladmenu > \"SSH & inloggegevens...\"). Wachtwoordzinnen blijven bij de ssh-agent van je systeem."
setup_1 = "Instellingen|Ctrl+, of het tandwiel. Tab wisselt tussen de paginalijst en de opties, j / k bewegen, Enter of Spatie wijzigt een waarde, / of Ctrl+F doorzoekt alle opties, Esc sluit."
setup_2 = "Thema's|Instellingen > Weergave > Thema: donker, licht, de terminal volgen of een van de vele voorinstellingen. Ctrl+N en dan een toets wisselt ook thema, taal en grafiekkleuren zonder Instellingen te openen."
setup_3 = "Taal|Instellingen > Algemeen > Taal biedt 17 talen. \"Git-termen vertalen\" bepaalt of ook de eigen woorden van git ({$commit}, {$push}...) worden vertaald."
setup_4 = "Profielen|Instellingen > Profielen bevat {$commit}-identiteiten (naam, e-mail, SSH-sleutel). Het profielvak in de werkbalk kiest welke deze repository gebruikt."
setup_5 = "Openen in|De knop Openen in (Alt+O) opent de map van dit tabblad in een terminal, een editor of bestandsbeheer. Instellingen > Openen in bewerkt de lijst."
setup_6 = "Sneltoetsen|Instellingen > Toetsenbord & muis wijst elke toets opnieuw toe. Het tabblad Toetsen van deze help toont je eigen sneltoetsen."
tools_1 = "AI (optioneel)|Uit tot je het instelt in Instellingen > AI: een OpenAI-compatibele dienst, Anthropic of een lokale agent zoals claude -p. Een GitPoulpi-account is nooit nodig."
tools_2 = "AI-acties|De glinsterknop naast de samenvatting of Ctrl+G i schrijft een {$commit}-bericht; Ctrl+G w legt wijzigingen uit; Ctrl+G C splitst je werk in meerdere {$commits}; Alt+I stelt een conflictoplossing voor. Niets wordt toegepast voordat je bevestigt."
tools_3 = "CLI|gitpoulpi <opdracht> doet vanuit een script wat het venster doet, via dezelfde daemon, dus wijzigingen verschijnen live. --json geeft machineleesbare uitvoer, --help toont de opties."
tools_4 = "MCP|gitpoulpi mcp serve --stdio geeft AI-agents één tool per CLI-opdracht. Instellingen > Agents & MCP bepaalt wat ze mogen wijzigen."
tools_5 = "Shell-wrapper|Met de shell-wrapper gp laat \"Afsluiten & cd hier\" je shell achter in de map van het actieve tabblad wanneer GitPoulpi afsluit."

