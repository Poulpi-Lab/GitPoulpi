line_numbers_help = { git = "De nummerkolom van de ingebouwde editor en van de diff-weergaven (daar is hij leeg, de kolommen behouden hun plaats). De blame-weergave heeft er geen.", local = "De nummerkolom van de ingebouwde editor en van de verschilweergaven (daar is hij leeg, de kolommen behouden hun plaats). De blame-weergave heeft er geen." }
follow_selection = "De selectie volgen in de editor"
follow_selection_help = "Zolang de editor open is, opent het selecteren van een ander bestand in het rechterpaneel dat ook in de editor, nadat is gevraagd of niet-opgeslagen wijzigingen moeten worden opgeslagen. Een bestand dat niet bewerkt kan worden, opent in de gebruikelijke weergave."
merge_side_by_side_min_width = { git = "Merge-editor: naast elkaar vanaf (kolommen)", local = "Samenvoegeditor: naast elkaar vanaf (kolommen)" }
merge_side_by_side_min_width_help = { git = "De merge-conflicteditor toont A en B naast elkaar als zijn gebied minstens zo veel kolommen breed is (lange regels scrollen zijwaarts met Shift+wiel of Shift+pijlen); smaller toont hij één kant tegelijk achter tabbladen. Standaard 100; 40 is de laagste waarde, 0 betekent altijd naast elkaar. De editor verbergt de panelen Refs en Status zolang hij open is, dus hij heeft meestal het hele venster.", local = "De samenvoegconflicteditor toont A en B naast elkaar als zijn gebied minstens zo veel kolommen breed is (lange regels scrollen zijwaarts met Shift+wiel of Shift+pijlen); smaller toont hij één kant tegelijk achter tabbladen. Standaard 100; 40 is de laagste waarde, 0 betekent altijd naast elkaar. De editor verbergt de panelen Refs en Status zolang hij open is, dus hij heeft meestal het hele venster." }
diff_word_wrap = "Regelafbreking"
diff_word_wrap_help = { git = "Breekt lange regels in de diff-weergaven af in plaats van ze met een beletselteken af te kappen. De ingebouwde editor en de blame-weergave scrollen zijwaarts en breken niet af. Ook de eigen afbrekingsschakelaar van de diff-weergave.", local = "Breekt lange regels in de verschilweergaven af in plaats van ze met een beletselteken af te kappen. De ingebouwde editor en de blame-weergave scrollen zijwaarts en breken niet af. Ook de eigen afbrekingsschakelaar van de verschilweergave." }

[settings_ui]
theme = "Thema"
theme_help = "Kleuren van de hele interface. Door de lijst bladeren toont elk thema meteen; Enter houdt het, Esc gaat terug. Systeem volgt de terminal (de lichte of donkere achtergrond, één keer bij het starten gedetecteerd; Donker als dat niet te bepalen is). Je eigen themabestanden in de map themes/ van de configuratie staan helemaal onderaan."
theme_system = "Systeem (volgt de terminal)"
follow_theme = "Thema volgen"
theme_swatches = "Kleuren"
graph_lane_background = "Achtergrond van grafiekbanen"
graph_lane_background_help = "Uit: transparant, niets achter de banen (standaard). Rijtint: een zwakke band in de baankleur van de commit binnen de grafiekkolom, plus een dunne balk in die kleur aan de rechterrand van de kolom. Een opgeslagen baan wordt gelezen als Rijtint. Geldt als Instellingen sluit."
graph_row_tint_strength = "Sterkte van rijtint"
graph_row_tint_strength_help = "Hoe vervaagd de rijtintband is: Sterk (het origineel), Gemiddeld (standaard) of Subtiel. Alleen de band vervaagt; de balk aan de rechterrand van de kolom behoudt zijn volle kleur. Geldt als Instellingen sluit."
graph_row_tint_strength_coming = "stel eerst Achtergrond van grafiekbanen in op Rijtint"
toolbar_position = "Positie van de werkbalk"
toolbar_position_help = "Waar de werkbalk staat: Boven, Onder (standaard), Links of Rechts. Links en Rechts maken er een kolom naast de panelen van; in een venster smaller dan 80 kolommen staat hij onderaan. Werkt direct."
toolbar_align = "Uitlijning van de werkbalkknoppen"
toolbar_align_help = "Waar de knoppen langs de balk staan: Begin (standaard), Midden of Einde. Begin is links in een rij en boven in een kolom; Einde is rechts en onder. Werkt direct."
# context: label of the setting that decides whether a dialog the user moved or resized keeps its place
dialog_geometry = "Positie en grootte van dialogen onthouden"
dialog_geometry_help = "Eén instelling voor alle dialogen. Dialogen kunnen worden verplaatst (sleep de titelbalk, of Ctrl+N en dan m); de grotere vensters kunnen ook worden geschaald (sleep de randen en de onderhoeken). Elk dialoog onthoudt zijn eigen plaats en grootte. Voor deze sessie (standaard): bewaard tot GitPoulpi sluit. Op schijf opgeslagen: ook bewaard voor de volgende start. Nooit: elk dialoog opent op zijn standaardplaats en -grootte. Werkt direct."
toolbar_pr_pinned = "Zet de {$pr}-knop vast aan het einde"
toolbar_pr_pinned_help = "Aan (standaard): de {$pr}-knop staat helemaal aan het einde van de werkbalk (rechts, in een kolom onderaan), wat de uitlijning ook is. Uit: hij stroomt mee met de andere knoppen en wordt met hen uitgelijnd. Werkt direct."
statusbar_position = "Positie van de statusbalk"
statusbar_position_help = "Waar de statusbalk (branch, tellers, meldingen, toetstips) staat: Boven, boven de tabbladen van de repository, of Onder (standaard). Het tabblad Start houdt zijn eigen statusbalk onderaan. Werkt direct."
tabs_position = "Positie van de tabbalk"
tabs_position_help = "Waar de repositorytabbladen staan: Boven (standaard), Onder of Links, een lijst met één tabblad per regel aan de linkerrand van het venster. In een venster smaller dan 80 kolommen staan ze bovenaan. Naast een werkbalk als kolom blijven de tabbladen aan de buitenkant. Werkt direct."
graph_color_theme = "Kleurthema van de grafiek"
graph_color_theme_help = "Het baankleurenpalet van de Log-grafiek. Thema volgen gebruikt het palet van het gekozen thema; elke andere keuze overschrijft het, dus elk thema is met elk palet te combineren. Geldt na het sluiten van de instellingen."
graph_renderer = "Grafiekweergave"
graph_renderer_help = "auto tekent de grafiek als echte afbeelding op een terminal die dat ondersteunt, en als tekens overal elders - ook binnen zellij en screen, die de omgeving van de terminal erven maar de afbeelding niet doorgeven, binnen tmux tenzij de terminal erachter sixel aankan, en binnen herdr tenzij de instelling kitty_graphics aan staat. image forceert de afbeelding aan, text forceert hem uit. Vereist een herstart."
image_protocol = "Afbeeldingsprotocol"
image_protocol_help = "Hoe afbeeldingen (de grafiekafbeelding, avatars van auteurs) de terminal bereiken. auto: het Kitty-grafiekprotocol in kitty, Ghostty en een herdr waarvan de config kitty_graphics = true zet; het Kitty-protocol ook in iTerm2 3.7.7 of nieuwer; iTerm2 inline-afbeeldingen in WezTerm, Rio, mintty en oudere iTerm2; sixel-afbeeldingen (de grafiekkolom en de avatars) in Windows Terminal, foot, Tabby, Konsole, mlterm en in tmux als de terminal erachter sixel aankan; elders tekens. kitty, iterm2 of sixel forceert dat protocol (kitty voor een herdr waarvan de config ergens anders staat; sixel voor een terminal die het tekent maar niet wordt herkend); none zet afbeeldingen uit. Vereist een herstart."
kitty_keyboard = "Kitty-toetsenbordprotocol"
kitty_keyboard_help = "auto vraagt de terminal bij het opstarten, binnen ongeveer 100 ms, of hij het kitty-toetsenbordprotocol spreekt, en gebruikt het als dat zo is: toetscombinaties die oude terminals niet kunnen onderscheiden (Control met leestekens, cijfers, Shift of Enter) komen dan als zichzelf aan in plaats van met stuurcodes te botsen. Een terminal die niet antwoordt behoudt de oude toetsen. off raakt de toetsenbordmodus van de terminal nooit aan. Vereist een herstart."
color_depth = "Kleurdiepte"
color_depth_help = "auto gebruikt 24-bits kleur, behalve op terminals die dat niet tonen (Apple Terminal, de Linux-console of een 256-kleurenterminal zonder COLORTERM); daar worden kleuren afgebeeld op de dichtstbijzijnde 256 of 16 items. truecolor, 256 en 16 dwingen een diepte af. Werkt direct."
text_cursor = "Tekstcursor"
text_cursor_help = "terminal zet de eigen cursor van de terminal op de invoegpositie van het actieve tekstveld, als streepje: de cursorinstellingen van je terminal gelden en het kandidatenvenster van een invoermethode opent bij de invoegpositie. drawn tekent de eigen cursor van GitPoulpi (een blok of een underscore) en houdt de terminalcursor verborgen. Geldt meteen."
graph_show_stashes = { git = "Stashes in de grafiek tonen", local = "Bergingen in de grafiek tonen" }
graph_show_stashes_help = { git = "Elke stash krijgt een eigen rij in de Log, op zijn datum: een klein vakje op een baan naast de commit waarop hij is gemaakt, met een stippellijn eraan verbonden. Selecteren toont wat hij wijzigde; rechtsklik (of .) biedt Pop, Apply en Drop. Uit laat stashes alleen in de sectie STASHES staan. Niet getekend tijdens soloën.", local = "Elke berging krijgt een eigen rij in de Log, op zijn datum: een klein vakje op een baan naast de commit waarop hij is gemaakt, met een stippellijn eraan verbonden. Selecteren toont wat hij wijzigde; rechtsklik (of .) biedt Pop, Apply en Drop. Uit laat bergingen alleen in de sectie BERGINGEN staan. Niet getekend tijdens soloën." }
ref_connector = "Verbinding ref-naar-commit"
ref_connector_help = "Een dunne lijn van elke ref-pil in de Ref-kolom naar de cirkel van zijn commit in de grafiek. Hij vult alleen lege ruimte: banen die hij kruist blijven bovenop en niets verschuift. Alleen getekend als de Ref-kolom direct links van de grafiekkolom staat."
log_wip_counts_in_message = "WIP-aantallen in het bericht tonen als de kolom Wijzigingen verborgen is"
log_wip_counts_in_message_help = "De WIP-rij toont hoeveel bestanden zijn gewijzigd, toegevoegd en verwijderd. Met de kolom Wijzigingen zichtbaar (rechtsklik op de Log-kop om hem te tonen) staan de aantallen altijd in die kolom, zoals bij elke commit. Verborgen reizen ze mee in het WIP-bericht zolang dit aan staat; uit toont helemaal geen aantallen."
avatars = "Avatars van auteurs"
avatars_help = "Auteursfoto's. graph tekent de auteur van elke commit in zijn cirkel in de grafiek (alleen afbeeldingsgrafiek; bij de tekstgrafiek komt in plaats daarvan een gekleurde initiaal in de Auteur-kolom). author zet een ronde afbeelding aan het begin van de Auteur-kolom. Beide tonen het ook in het commitdetailpaneel. Standaard uit: inschakelen stuurt een SHA-256-hash van het e-mailadres van elke auteur via HTTPS naar gravatar.com - een hash van een bekend of raadbaar adres is niet anoniem - en vraagt in een repository met een github.com-remote de GitHub-API één keer per auteur welk account een van hun commits maakte (met het token van je GitHub-integratie als die er is). Zolang er geen afbeelding is, en als er geen bestaat, worden de initialen of de gewone cirkel getoond. off stuurt niets over het netwerk."
avatar_sources = "Avatarbronnen"
avatar_sources_help = { git = "Waar de afbeelding van een auteur wordt opgezocht, in volgorde (een GitHub-noreply-adres noemt altijd eerst zijn account). hosting_gravatar: de verbonden GitHub-, GitLab- of Bitbucket-integratie waarvan de host overeenkomt met de remote van de repository (GitHub-commit-auteur of gebruikerszoekopdracht, GitLab-avatar-per-e-mail of users-API), dan Gravatar; zonder passende verbonden integratie komt Gravatar eerst en wordt een github.com-remote nog als laatste gevraagd, niet-geauthenticeerd. gravatar_hosting: het omgekeerde. gravatar of hosting: alleen die ene. Als geen enkele een afbeelding heeft, wordt de avatar-terugval hieronder getekend. Geldt voor auteurs die nog niet zijn opgezocht.", local = "Waar de afbeelding van een auteur wordt opgezocht, in volgorde (een GitHub-noreply-adres noemt altijd eerst zijn account). hosting_gravatar: de verbonden GitHub-, GitLab- of Bitbucket-integratie waarvan de host overeenkomt met de remote van de repository (GitHub-commitauteur of gebruikerszoekopdracht, GitLab-avatar-per-e-mail of users-API), dan Gravatar; zonder passende verbonden integratie komt Gravatar eerst en wordt een github.com-remote nog als laatste gevraagd, niet-geauthenticeerd. gravatar_hosting: het omgekeerde. gravatar of hosting: alleen die ene. Als geen enkele een afbeelding heeft, wordt de avatar-terugval hieronder getekend. Geldt voor auteurs die nog niet zijn opgezocht." }
avatar_fallback = "Avatar-terugval"
avatar_fallback_help = "Wat een auteur zonder afbeelding krijgt. identicon: een GitHub-achtig gespiegeld 5x5-patroon in een kleur afgeleid van zijn e-mail, lokaal gegenereerd (geen netwerk), als afbeelding op een afbeeldingsterminal en als blokjes elders. initials: een gekleurde badge met zijn initialen."
composer_files = "Composervoorstellen"
composer_files_help = "Hoe de review van de AI-commitcomposer opent. expanded: elke voorgestelde commit toont zijn bestanden. collapsed: alleen de commitrijen; Rechts/Links (of een klik op de pijl) opent er één."
blame_side = "Blame-annotaties"
blame_side_help = "Aan welke kant van de Blame-weergave de annotatiekolom staat (avatar, auteur, leeftijd, samenvatting). right: rechts van de code. left: links van de code."
column_resize = "Kolombreedte aanpassen"
column_resize_help = "Hoe je een kolomgrens vastpakt in het Log, de Radar en de zijkolom van de bestandsweergaven. line: een dunne lijn over de volle hoogte van de tabel zolang de aanwijzer op de grens staat, met een klein streepje in de kop. header: geen tussenruimte en geen streepje, aanpassen kan alleen vanuit de kop, waar het eerste teken van de volgende cel oplicht."
blame_width = "Breedte van blame-annotaties"
blame_width_help = "Breedte van de annotatiekolom in cellen (24 tot 90). Sleep de rand in de Blame-weergave of gebruik de toetsen voor verbreden / versmallen; de nieuwe breedte wordt hier opgeslagen."
ref_tree = "Boom van branchmappen"
ref_tree_help = "De zijbalk Refs groepeert branchnamen op `/` in inklapbare mappen, met elke remote als eigen topniveauknooppunt. Uit geeft één platte rij per branch. `y` in het Refs-paneel schakelt dit live en schrijft de keuze hier weg."
reveal_on_ref_click = "Klik op een ref om die in de grafiek te tonen"
reveal_on_ref_click_help = "Eén klik op een ref in het Refs-paneel scrolt de Log naar waar de ref naartoe wijst en laat de rij even oplichten. De selectie in de Log en het rechterpaneel blijven zoals ze zijn. Uit, dan selecteert een klik alleen de rij in de zijbalk. \"In grafiek tonen\" in het menu van de ref, de toets in het Refs-paneel en het palet-opdracht werken in beide gevallen."
graph_ghost_ref = "Spookbranch tonen bij de aangewezen {$commit}"
graph_ghost_ref_help = "In de kolom Ref van de Log toont de {$commit} onder de aanwijzer die geen eigen ref heeft een vervaagde pil met de naam van de branch waartoe die behoort (anders de remote branch), afgeleid uit de geschiedenis. Wijs je de pil aan, dan zie je het soort. Klikken doet niets bijzonders; de opdracht om een branch te maken maakt een branch. Alleen getekend waar de kolom Ref ruimte heeft. Uit verbergt hem."
mouse_enabled = "Muis ingeschakeld"
mouse_enabled_help = "Uit laat selecteren met klikken en slepen aan je terminal. Vereist een herstart."
mouse_scroll_lines = "Regels per muiswielstap"
mouse_scroll_lines_help = "Hoeveel commits één wielstap in de Log verplaatst. Vereist een herstart."
heading_date_time = "Datum / tijd"
heading_layout = "Indeling"
date_locale = "Landinstelling voor datum/tijd"
date_locale_help = "system: maand- en dagnamen volgen de interfacetaal. english: altijd Engelse namen, ongeacht de taal. Geldt voor alle datums op deze pagina."
diff_layout = "Standaardindeling"
diff_layout_help = { git = "Inline (één kolom) of Split (voor en na naast elkaar). Hervat vanaf de laatst bekeken diff, in dit venster en over herstarts heen - hier wijzigen bepaalt alleen waarmee een *nieuwe* sessie begint.", local = "Inline (één kolom) of Split (voor en na naast elkaar). Hervat vanaf het laatst bekeken verschil, in dit venster en over herstarts heen - hier wijzigen bepaalt alleen waarmee een *nieuwe* sessie begint." }
diff_hunks_only = "Alleen hunks"
diff_hunks_only_help = "Aan toont alleen de gewijzigde hunks met enkele regels context; uit toont het hele bestand met de wijzigingen ter plaatse gemarkeerd. Hervat net als de lay-out."
diff_show_whitespace = "Alleen-witruimtewijzigingen tonen"
diff_show_whitespace_help = "Uit klapt een hunk die alleen in witruimte verschilt in tot context."
input_color = "Invoerkleur"
input_color_help = "Achtergrond van tekstvelden. Thema volgen (standaard) gebruikt die van het thema; de rest zijn donkere kleuren die hem overschrijven. Aangepast... gebruikt de hexkleur hieronder. Geldt live, zonder herstart."
input_color_custom = "Aangepaste invoerkleur"
input_color_custom_help = "#rrggbb, gebruikt als Invoerkleur Aangepast is. Geldt live."
minimap = "Minimap"
minimap_help = { git = "Een afbeelding van het hele bestand naast de verticale schuifbalk van de diff (modus heel bestand) en de editor, met het zichtbare deel gemarkeerd; klik erop om te springen. Een echte afbeelding waar de terminal die tekent, elders braille-cellen. Ook `M` in de diff en Minimap wisselen in het palet.", local = "Een afbeelding van het hele bestand naast de verticale schuifbalk van het verschil (modus heel bestand) en de editor, met het zichtbare deel gemarkeerd; klik erop om te springen. Een echte afbeelding waar de terminal die tekent, elders braille-cellen. Ook `M` in het verschil en Minimap omschakelen in het palet." }
date_format = "Datumformaat"
date_format_help = "De datumkolom Blame / Bestandsgeschiedenis."
date_time_format = "Datum-/tijdformaat"
date_time_format_help = "De Datumkolom van de Log zelf."
date_verbose_format = "Uitgebreid datumformaat"
date_verbose_format_help = { git = "De Datumregel van het commit-detailpaneel, de tooltip van de Datumkolom en Kopiëren > Datum.", local = "De Datumregel van het commitdetailpaneel, de tooltip van de Datumkolom en Kopiëren > Datum." }
preview = "voorbeeld"
sidebar_sections_scope = "Secties van het linkerpaneel"
sidebar_sections_scope_help = "Voor wie de getoonde en verborgen secties van het linkerpaneel gelden. Per repository: elke repository houdt een eigen set (de globale is het startpunt). Globaal: één set voor alle repositories. Wisselen verliest nooit een van beide sets."
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "Kolomindeling"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "Hoe de Log zijn kolommen indeelt. fit: elke kolom past in het paneel en alleen Bericht rekt mee. scroll: kolommen behouden hun breedte, Bericht ook, en de tabel scrollt zijwaarts als hij breder is dan het paneel."

[settings_git]
default_backend = "Git-backend"
default_backend_help = "Globaal. Een draaiende daemon behoudt de backend waarmee hij startte."
default_backend_warning = "Geldt voor daemons die na deze wijziging worden gestart."
pull_mode = "Pull-knop"
default_encoding = "Standaardcodering"
default_encoding_help = { git = "Gebruikt om bestandsinhoud, blame en diffs te tonen die geen geldige UTF-8 zijn (geldige UTF-8 wordt nooit opnieuw gedecodeerd). Een repository kan dit hieronder overschrijven. Alleen weergave: staging en patches behouden de bytes van het bestand exact.", local = "Gebruikt om bestandsinhoud, blame en verschillen te tonen die geen geldige UTF-8 zijn (geldige UTF-8 wordt nooit opnieuw gedecodeerd). Een repository kan dit hieronder overschrijven. Alleen weergave: staging en patches behouden de bytes van het bestand exact." }
push_behavior = "Push-knop"
push_behavior_help = "direct: meteen pushen naar de standaardremote. ask: een klein menu openen met de standaardremote voorgeselecteerd. De ▾ van de knop vraagt altijd."
repo_encoding_help = { git = "Hoe bestandsinhoud, blame en diffs voor weergave worden gedecodeerd als ze geen geldige UTF-8 zijn (alleen deze repository; inherited: Standaardcodering op deze pagina). Staging codeert nooit iets opnieuw.", local = "Hoe bestandsinhoud, blame en verschillen voor weergave worden gedecodeerd als ze geen geldige UTF-8 zijn (alleen deze repository; inherited: Standaardcodering op deze pagina). Staging codeert nooit iets opnieuw." }
core_autocrlf_help = "Weggeschreven naar de git-configuratie van deze repository (core.autocrlf), dus zichtbaar voor git en alle andere tools. true: LF naar CRLF bij checkout; input: CRLF naar LF alleen bij opslaan in de geschiedenis; false: nooit converteren. (geërfd): verwijdert de repositorywaarde zodat je globale git-configuratie geldt. Ongedaan te maken."
core_eol_help = "Weggeschreven naar de git-configuratie van deze repository (core.eol): het regeleinde dat git gebruikt voor tekstbestanden in de werkmap (lf, crlf, of native voor dat van het platform). (geërfd): verwijdert de repositorywaarde zodat je globale git-configuratie geldt. Ongedaan te maken."
git_lfs = "Git LFS"
git_lfs_help = { git = "Toon Git LFS in de interface (de LFS-tag, de diff-kaart, de banner voor een ontbrekend programma, de LFS-opdrachten) en laat GitPoulpi zijn eigen LFS-stappen uitvoeren (objecten downloaden na een clone). Uit: de eigen LFS-filters van git draaien nog, GitPoulpi roept git-lfs zelf nooit aan.", local = "Toon Git LFS in de interface (het LFS-label, de verschilkaart, de banner voor een ontbrekend programma, de LFS-opdrachten) en laat GitPoulpi zijn eigen LFS-stappen uitvoeren (objecten downloaden na een clone). Uit: de eigen LFS-filters van git draaien nog, GitPoulpi roept git-lfs zelf nooit aan." }
git_lfs_program = "git-lfs-programma"
git_lfs_program_help = "Installeer het via https://git-lfs.com (Windows: meegeleverd met Git for Windows, of `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Palet: LFS: Installatiepagina openen."
initialize_lfs_for_this_repository = "LFS initialiseren voor deze repository"
initialize_lfs_for_this_repository_help = "Voert `git lfs install --local` uit: de LFS-filters en hooks in de eigen config van deze repository, nooit je globale. Vereist git-lfs."
pull_mode_help = { git = "Wat de {$Pull}{hint} van de werkbalk doet: merge (fast-forward indien mogelijk), ff_only of rebase. De ▾-items van de knop voeren hun eigen actie meteen uit en wijzigen dit niet.", local = "Wat de {$Pull}{hint} van de werkbalk doet: samenvoegen (fast-forward indien mogelijk), ff_only of rebase. De ▾-items van de knop voeren hun eigen actie meteen uit en wijzigen dit niet." }
merge_fast_forward = { git = "Fast-forward bij merge", local = "Fast-forward bij samenvoegen" }
merge_fast_forward_help = { git = "Hoe een merge die je start (branchmenu, slepen en neerzetten, palet, opdrachtregel) omgaat met een branch die gewoon een fast-forward kan zijn. never: altijd een merge-commit maken. allowed: fast-forward indien mogelijk, zoals git standaard doet. only: alleen fast-forward, of weigeren als dat niet kan. Een repository kan dit overschrijven op de pagina {$Merge}-opties.", local = "Hoe een samenvoeging die je start (branchmenu, slepen en neerzetten, palet, opdrachtregel) omgaat met een branch die gewoon een fast-forward kan zijn. never: altijd een samenvoegcommit maken. allowed: fast-forward indien mogelijk, zoals git standaard doet. only: alleen fast-forward, of weigeren als dat niet kan. Een repository kan dit overschrijven op de pagina Samenvoegopties." }
repo_heading = "Repo: {repo} - alleen deze repository"
inherited = "(overgenomen)"
lfs_not_checked = "(nog niet gecontroleerd)"
lfs_autofix_filters = "LFS-filters installeren vóór {$pull} en {$push}"
lfs_autofix_filters_help = "Vóór een {$pull} of {$push} in een repository met Git LFS wordt `git lfs install --local` uitgevoerd als de LFS-filters of de hooks ontbreken (alleen de eigen configuratie van de repository, nooit de globale), zodat de overdracht de grote bestanden afhandelt. De statusbalk meldt het. Vereist git-lfs."
push_group_preflight = "Elke remote controleren vóór een {$push}"
