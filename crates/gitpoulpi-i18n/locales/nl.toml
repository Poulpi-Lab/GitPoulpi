run_going = "Dit venster sluiten stopt de uitvoering niet."
# context: line under the progress rows when the run ended well
run_done = "Klaar."
# context: line under the progress rows when some remotes failed
run_problems = "Sommige remotes zijn mislukt. Probeer ze opnieuw of sluit het venster."
