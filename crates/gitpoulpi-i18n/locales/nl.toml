mouse_gestures_in_6 = "elke actie \"Kopiëren ...\" zet de tekst op het systeemklembord en stuurt hem, waar de terminal er bekend om staat dat hij het honoreert, ook via OSC 52; via SSH of zonder beeldscherm wordt alleen OSC 52 gestuurd, en een terminal die de reeks negeert, kopieert niet"
mouse_gestures_in_7 = "schaal-/aanwijzer-/open-handaanwijzingen worden verstuurd via OSC 22 op terminals die dat ondersteunen (kitty, Ghostty, foot, mintty; niet in Rio, Alacritty, Windows Terminal of iTerm2) - versleepbare scheidingen en kolomgrenzen lichten ook op binnen de eigen buffer van de app, wat helemaal geen terminalmedewerking vereist"
git_actions_then_25 = "het LFS-menu openen (de LFS-knop van de werkbalk; de items staan ook in het palet)"
git_actions_then_26 = "LFS: {$fetch} (objecten van alle refs)"
git_actions_then_27 = "LFS: de echte inhoud over de verwijzingsbestanden schrijven (offline)"
git_actions_then_28 = "LFS: {$pull} (downloaden, dan de inhoud schrijven)"
git_actions_then_29 = "LFS: {$push} (objecten van alle refs)"
git_actions_then_30 = "LFS: de lokale LFS-opslag opruimen"
diff_view_encoding = "kies de codering waarin het bestand wordt gelezen (automatisch detecteren, UTF-8, UTF-16, Windows-1252, ...)"
commit_composer_bottom_14 = "\"Hooks overslaan\" omschakelen: de {$commit} wordt gemaakt zonder git-hooks uit te voeren (Statuspaneel)"
repositories_and_tabs_39 = "de items van de map filteren terwijl je typt (hoofdletterongevoelig; op Links of Inhoud focust `/` het ook; Enter of Omlaag springt naar de eerste treffer, Esc wist het filter; het wordt leeg als je van map wisselt)"
repositories_and_tabs_40 = "Naastgelegen mappen tonen aan- of uitzetten (de linkerboom toont ook de andere mappen van elk geopend niveau - wordt onthouden)"
split_1 = "wijst het geselecteerde bestand, de hunk of de regel toe aan die {$commit} (0 laat het ongetoewezen, n zet het in een nieuwe {$commit}); Tab wisselt tussen de {$commits} en de wijzigingen, Enter of e bewerkt een bericht, d verwijdert een {$commit}; {{compose.apply}} splitst"
split_2 = "selecteert losse regels binnen de huidige hunk (Shift+Omhoog/Omlaag breidt de selectie uit)"
split_3 = "verplaatst de {$commit} omhoog of omlaag in de lijst (K en J doen hetzelfde)"
split_4 = "zet elke wijziging terug zoals die was toen de editor opende"
split_5 = "splitst de {$commit} met het plan zoals het is; zolang het plan ongeldig is, is de knop uitgeschakeld en zegt de statusbalk waarom"
split_6 = "schakelt {$commits} ondertekenen om (aan bij het openen van de editor als de instelling gpgSign van de repository true is)"
split_7 = "selecteert in het paneel met {$commits} die {$commit}; m of Enter op een wijziging toont de {$commits} waaraan je die kunt geven"
rewrite_9 = "opent het tabblad Grootte en analyseert de geschiedenis: de grootste bestanden en mappen, en bestanden die zijn verwijderd maar nog worden bewaard; aangevinkte rijen worden verwijderregels"
rewrite_host_howto = "legt uit hoe je een herschrijving door een branch krijgt die de host beschermt: de bescherming opheffen, {$push} onder een nieuwe naam, of de repository opnieuw aanmaken; er wordt niets voor je gedaan"
rewrite_ai_rules = "maakt met AI de herschrijfregels op basis van je beschrijving (er wordt geen voorbeeld getoond en niets toegepast)"
log_columns_2 = "de kolommen van de Log zijwaarts scrollen als ze hun breedte behouden (de indeling Zijwaarts scrollen, te kiezen in de kolomkeuze, in de Instellingen of met s terwijl een kolom gekozen is); bij de indeling Aanpassen past elke kolom in het paneel"
refs_pane_20 = "de remotes van de geselecteerde lokale branch bewerken (zijn upstream en extra {$push}-doelen): het toetsenbordequivalent van klikken op het remotes-label op zijn rij"
markdown_editor_1 = "wisselen tussen Schrijven en Voorbeeld (de tekst zoals hij er na het plaatsen uitziet)"
markdown_editor_2 = "de tekst en zijn voorbeeld naast elkaar tonen (vraagt een breed venster)"
markdown_editor_3 = "de tekst verzenden (Enter voegt een regeleinde in)"
markdown_editor_4 = "Schrijven met AI openen of sluiten (het stelt alleen een concept op: er wordt niets geplaatst)"

