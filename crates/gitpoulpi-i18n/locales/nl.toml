# context: Settings > AI, label of a number: the most bytes of all the project context files together
review_context_label = "Grootste context in een review, alle bestanden (bytes)"
# context: help under that number
review_context_help = "Boven deze grootte worden de contextbestanden samen ingekort (het laatste wordt verkort of weggelaten), nadat er is gevraagd: alles verzenden, ingekort verzenden, deze instelling openen of annuleren. Standaard 16384."
