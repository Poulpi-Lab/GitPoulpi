[help_text]
git_actions_then_amend = "de geselecteerde {$commit} wijzigen: samenvatting, beschrijving, naam, e-mail en datum van de auteur in één venster"
git_actions_then_edit_author = "alleen de auteur van de geselecteerde {$commit} wijzigen (naam, e-mail, datum)"
rewrite_1 = "opent de werkbank voor geschiedenis herschrijven: wijzig auteurs, datums, berichten, bestandsinhoud of paden in de hele geschiedenis of in een selectie"
rewrite_2 = "toont in een voorbeeld wat de regels zouden wijzigen en past dat daarna toe als één stap die Ongedaan maken terugdraait; Toepassen blijft uitgeschakeld zolang het voorbeeld verouderd is"
rewrite_3 = "annuleert het lopende voorbeeld (Esc doet hetzelfde; een tweede Esc sluit de werkbank)"
rewrite_4 = "voegt een regel toe, verwijdert de regel onder de cursor, herstelt de laatst verwijderde of dupliceert de regel"
rewrite_5 = "schakelt de regel in of uit, of verplaatst hem omhoog of omlaag (regels worden van boven naar beneden uitgevoerd)"
rewrite_6 = "wisselt tussen de tabbladen van het voorbeeld"
rewrite_7 = "slaat het recept op in de repository of alleen voor jou, laadt een opgeslagen recept of hernoemt het; geheime waarden worden nooit opgeslagen"
rewrite_8 = "neemt elke beschermde branch die al is gepubliceerd mee of laat hem buiten beschouwing; controleert de externe programma's opnieuw"
file_history_1 = "naar de {$commit} van de rij gaan in de Log, en meer Log laden als die er nog niet in zit"
file_history_2 = { git = "de selectie verplaatsen; de diff rechts volgt meteen", local = "de selectie verplaatsen; het verschil rechts volgt meteen" }
file_history_3 = { git = "de selectie uitbreiden tot een bereik: rechts staat dan de diff van het bestand tussen de twee uiteinden (Shift+klik doet hetzelfde)", local = "de selectie uitbreiden tot een bereik: rechts staat dan het verschil van het bestand tussen de twee uiteinden (Shift+klik doet hetzelfde)" }
file_history_4 = { git = "het toetsenbord aan de diff geven, of terug aan de lijst", local = "het toetsenbord aan het verschil geven, of terug aan de lijst" }
file_history_5 = "de SHA van de {$commit} kopiëren, of de samenvatting"
file_history_6 = { git = "rechterkant: de diff, het bestand zoals het was bij die {$commit}, of de blame; volgt de selectie en behoudt de modus", local = "rechterkant: het verschil, het bestand zoals het was bij die {$commit}, of de blame; volgt de selectie en behoudt de modus" }
file_history_7 = "de versie van de rij vergelijken met de werkmap (druk nogmaals om terug te gaan)"
file_history_8 = "het bestand in de werkmap terugzetten naar die versie (vraagt eerst; Ongedaan maken brengt de oude bytes terug)"
file_history_9 = "de lijst van grootte veranderen (de scheidingslijn is ook te slepen; de breedte wordt onthouden)"
file_history_10 = "muis: klik op een rij, Shift+klik voor een bereik, dubbelklik toont hem in de Log, rechtsklik opent het menu"
commit_column_1 = "de rijen zijwaarts scrollen (Shift+wiel of een horizontaal wiel doet hetzelfde); ze scrollen alleen als een deel breder is ingesteld dan de beschikbare ruimte"
commit_column_2 = "een deel kiezen (banen, auteur, datum) en het verbreden of versmallen, of alle delen weer automatisch maken; de grenzen van de kopregel zijn ook te slepen en de breedtes worden onthouden"
commit_column_3 = "muis: klik op een rij om de {$commit} te kiezen, rechtsklik opent het menu (de menutoets ook, na het kiezen van een rij met Omhoog/Omlaag)"
commit_column_4 = "het gekozen deel naar links of rechts verplaatsen; de kop slepen doet hetzelfde, en de volgorde wordt onthouden"
log_columns_1 = "een Logkolom kiezen (de koptekstcel licht op); daarna naar links of rechts verplaatsen (de kop slepen doet hetzelfde), verbreden of versmallen (de rand slepen doet hetzelfde), de breedte weer automatisch maken of de kolom aan zijn inhoud aanpassen (dubbelklikken op de rand doet hetzelfde; + past elke kolom aan). Tab / Shift+Tab kiezen een andere kolom, Esc sluit af; de indeling wordt onthouden"
global_1 = "open het opdrachtenpalet - elke opdracht in de app, elk met zijn sneltoets; typ om te filteren, omhoog/omlaag of PageUp/PageDown om te bewegen (niet j/k: die worden getypt), Enter om uit te voeren. Grijze rijen zeggen waarom ze nu niet kunnen draaien"
global_2 = "het navigatieprefix - zie zijn eigen sectie hieronder"
global_3 = "het prefix voor git-acties - zie zijn eigen sectie hieronder"
global_4 = "deze help-overlay omschakelen - opent bovenop al het andere dat open is (Instellingen, Repositorybeheer, ...), niet alleen de gewone grafiek"
global_5 = "een vernieuwing afdwingen"
global_6 = { git = "fetch, {$prs} en issues opnieuw controleren, herladen", local = "ophalen, {$prs} en issues opnieuw controleren, herladen" }
global_7 = "de laatste bewerking ongedaan maken / opnieuw doen (commit, amend, checkout, branch maken/verwijderen); vraagt eerst als het riskant is"
global_9 = { git = "afsluiten - vanuit de grafiek; boven een diff of bestandsweergave sluit het die weergave in plaats daarvan. Elke afsluiting wordt vastgelegd in gitpoulpi-tui-exit.log, naast de config", local = "afsluiten - vanuit de grafiek; boven een verschil of bestandsweergave sluit het die weergave in plaats daarvan. Elke afsluiting wordt vastgelegd in gitpoulpi-tui-exit.log, naast de config" }
global_10 = "een contextmenu openen, overal waar er hieronder een bestaat - de toetsen zijn uitwisselbaar (de Menu/Apps-toets bereikt deze app op Windows zelden, dus de F10-combinatie is daar degene die betrouwbaar werkt)"
global_11 = "de focus naar het volgende / vorige paneel doorlopen"
global_12 = "de selectie verplaatsen (elk paneel en elke lijst)"
global_13 = "telprefix in vim-stijl op j/k/omhoog/omlaag (en PageUp/PageDown, als aantal schermen) - getypte cijfers verschijnen als \"4...\" in de statusbalk tot de beweging landt; Esc of een andere toets wist het, en een voorloop-0 begint er nooit een (dus cijfers worden nog gewoon getypt in de composer, het Refs-filter en elk ander tekstveld)"
global_14 = { git = "Refs: wisselen tussen de secties LOKAAL/REMOTE/TAGS", local = "Refs: wisselen tussen de secties LOKAAL/REMOTE/LABELS" }
global_15 = "Log: h = terug uit / l = in de bestandslijst van een commit"
global_16 = "Status: naar Unstaged / Staged springen"
mouse_basics_1 = "een rij selecteren + focus geven (elk paneel, lijst, menu, dialoog); het wiel scrolt wat onder de aanwijzer ligt"
mouse_basics_2 = { git = "openen/activeren: een LOKAAL/TAGS-ref of een ref-pil in een Log-rij checkt hem uit, een gewijzigd bestand opent zijn diff, een repositoryrij opent die repository", local = "openen/activeren: een LOKAAL/LABELS-ref of een ref-pil in een Log-rij checkt hem uit, een gewijzigd bestand opent zijn verschil, een repositoryrij opent die repository" }
mouse_basics_3 = "het enige signaal \"dit is klikbaar\" dat de meeste terminals geven (zie \"Aanwijzen & tooltips\" hieronder) - ook volledige tooltips boven Log-cellen en afgekapte ref-badges"
mouse_basics_4 = { git = "een paneelscheiding, een Log-kolomgrens, de onderrand van een Refs-sectie of de onderrand van het commit-berichtblok schaalt het (voorbij het minimum klapt het in); een Log-kolomkop voorbij een buur slepen herordent hem", local = "een paneelscheiding, een Log-kolomgrens, de onderrand van een Refs-sectie of de onderrand van het commitberichtblok schaalt het (voorbij het minimum klapt het in); een Log-kolomkop voorbij een buur slepen herordent hem" }
mouse_basics_5 = "(rechtsboven) afsluiten, zoals q - alleen getoond als het venster breed genoeg is om de titeltekst niet te overlappen"
navigation_prefix_then_1 = "het Refs-paneel (links) in-/uitklappen"
