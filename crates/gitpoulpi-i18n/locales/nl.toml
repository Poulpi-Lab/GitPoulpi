# context: button: try the failed remotes again
btn_retry = "Mislukte opnieuw"
# context: progress row: the remote took the commits
run_pushed = "verstuurd"
# context: progress row: the remote got a new branch
run_created = "aangemaakt"
# context: progress row: nothing to send
run_up_to_date = "actueel"
# context: progress row: the local branch moved forward
run_fast_forwarded = "fast-forward toegepast"
# context: progress row: the remote's commits were combined into the local branch with a new commit
run_merged = "samengevoegd"
# context: progress row: the local commits were replayed on the remote's
run_rebased = "afgespeeld"
# context: progress row: the remote's commits were taken in
run_integrated = "overgenomen"
# context: progress row: left out
run_skipped = "overgeslagen"
# context: progress row: the remote's commits are being combined with the local branch
run_merging = "samenvoegen"
# context: progress row: sending in progress
run_pushing = "versturen"
# context: progress row: not started yet
run_waiting = "wachtend"
# context: progress row: failed; {why} is the reason
run_failed = "mislukt: {why}"
# context: progress row: the remote refused; {why} is the reason
