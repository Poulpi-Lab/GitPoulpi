# context: key hints of the plan step
hint_plan = "↑/↓ rij  ←/→ actie  Enter lijst  s overslaan  t {$tags}  f opnieuw  Ctrl+Enter uitvoeren  Esc sluiten"
# context: key hints of the progress step
hint_run = "Esc sluiten  r mislukte opnieuw"
