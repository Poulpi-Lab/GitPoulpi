private_key_path = "Pad van privésleutel"
private_key_path_help = "Sleutelbestand dat {$fetch}, {$pull}, {$push} en clone aan ssh aanbieden (ssh -i <sleutel> -o IdentitiesOnly=yes). Leeg: ssh-agent en je ssh-configuratie zoals gewoonlijk. Niet gebruikt als een repository een eigen sleutel kiest (SSH & inloggegevens), of als GIT_SSH_COMMAND of core.sshCommand is ingesteld. Geldt vanaf de volgende overdracht."
public_key_path = "Pad van publieke sleutel"
