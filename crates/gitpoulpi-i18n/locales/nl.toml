startup_tab_launcher_help = "Het tabblad waarop een start opent als GitPoulpi wordt gestart vanaf zijn snelkoppeling op het bureaublad of in het Startmenu (zie Starter hieronder), welke map ook. Heeft voorrang op de twee instellingen hierboven; Laatste tabblad en Radar gedragen zich als daar. Eenmalig gelezen bij het opstarten; vereist een herstart."
group_worktree_tabs = "Worktree-tabbladen groeperen"
group_worktree_tabs_help = "Tabbladen van de gekoppelde worktrees van een repository staan direct achter het tabblad van die repository, en een weggesleept worktree-tabblad springt terug naar zijn plek. Uit: tabbladen blijven staan waar je ze neerzet. Bij het inschakelen worden de geopende tabbladen opnieuw gegroepeerd."
allow_agent_view_control = "AI-agents de weergave laten besturen"
allow_agent_view_control_help = "Aan: een AI-agent (via MCP of `gitpoulpi ui`) kan dit venster vragen een commit, bestand of melding te tonen. Hij wijzigt nooit iets in de repository. Uit: dit venster accepteert ze niet. Gelezen bij het openen van een venster."
allow_ui_propose = "AI-agents wijzigingen laten voorstellen die ik bevestig"
allow_ui_propose_help = { git = "Aan: een AI-agent mag een vooraf ingevuld dialoogvenster voor je openen: een nieuw bericht voor een commit, een commitbericht in de composer, een nieuwe branch of tag. Het is gemarkeerd met ✦ Voorgesteld door <agent> en er verandert niets tot je op de eigen bevestigingsknop drukt; Esc wijst af. Uit (standaard): `ui propose` en de MCP-tools ui_propose_* worden geweigerd.", local = "Aan: een AI-agent mag een vooraf ingevuld dialoogvenster voor je openen: een nieuw bericht voor een commit, een commitbericht in de composer, een nieuwe branch of een nieuw label. Het is gemarkeerd met ✦ Voorgesteld door <agent> en er verandert niets tot je op de eigen bevestigingsknop drukt; Esc wijst af. Uit (standaard): `ui propose` en de MCP-tools ui_propose_* worden geweigerd." }
clone_root = "Standaard kloonmap"
clone_root_help = "Waar \"Waarheen klonen\" in het Kloon-dialoogvenster begint. Leeg gebruikt de standaard per besturingssysteem: %USERPROFILE%\\source\\repos op Windows, ~/src elders."
# context: setting: which source the Clone dialog opens on (Last used, Clone with URL, or an integration)
clone_start_source = "Kloon-dialoogvenster begint bij"
clone_start_source_help = "De bron waarop het Kloon-dialoogvenster opent. Laatst gebruikt heropent de bron die het toonde toen het voor het laatst werd gesloten; Klonen met URL begint altijd op het URL-formulier; of kies een van je verbonden integraties. Een bron die niet meer beschikbaar is, valt terug op Klonen met URL."
# context: option of the "Clone dialog starts on" setting: the source shown when the dialog was last closed
clone_start_last = "Laatst gebruikt"
browse_root = "Standaard bladermap"
browse_root_help = "Waar Bladeren (de mapkiezer, vanaf het tabblad Start) standaard opent. Leeg laat Bladeren openen in de laatst gekozen map - of de thuismap, de allereerste keer - in plaats van een vaste map."
heading_auto_stash = { git = "Auto-stash", local = "Auto-berging" }
heading_log = "Applicatielogboek"
heading_undo = "Geschiedenis van ongedaan maken"
log_level = "Logniveau"
log_retention_days = "Logbestanden bewaren"
# context: setting help: how long log files are kept; a number and a unit (days, weeks, months, years) on one line
log_retention_help = "Oudere logbestanden worden verwijderd wanneer GitPoulpi start. Het bestand van elke dag wordt bovendien begrensd door de grootte-instelling hieronder."
# context: setting: where the data GitPoulpi keeps for one repository lives (ref filters, fold state, workflow, caches)
repo_data_location = "Opslaglocatie van repositorygegevens"
# context: help of the setting above
repo_data_location_help = "Waar de gegevens per repository (ref-filters, workflow, caches) worden bewaard. Binnen .git blijft de werkmap schoon; als je deze instelling wijzigt, worden bestaande gegevens meeverhuisd."
# context: option of the repository data location: inside the repository's .git folder
repo_data_in_git_dir = "In .git (map gitpoulpi)"
# context: option of the repository data location: a .gitpoulpi folder in the working tree
repo_data_in_worktree = "In de werkmap (map .gitpoulpi)"
# context: option of the repository data location: the user's own data folder
repo_data_user_data = "In mijn gebruikersgegevensmap (buiten de repository)"
log_max_file_mb = "Maximale grootte van een logbestand"
log_timings = "Duur van bewerkingen tonen"
log_timings_help = "Voegt bij elke bewerking in het activiteitenlogboek (tabblad \"Git-bewerkingen\") de duur in milliseconden toe."
log_extended = "Uitgebreid loggen"
log_extended_help = "Toont ook achtergrondbewerkingen (automatisch {$fetch}, vernieuwen, statuscontrole) met hun duur."
# context: setting: how the status line counts the total commits (the dropdown choices are in settings_value)
commit_count = "Totaal aantal {$commits} tellen met"
# context: help of the setting above; mentions antivirus software
commit_count_help = "Hoe de statusbalk het totaal in geladen / totaal bepaalt. System git start één git-proces (normaal het snelst). libgit2 telt binnen GitPoulpi en start geen proces: kies dit als antivirussoftware elke opdracht scant en git traag maakt. Uit toont alleen de geladen {$commits}. Geldt direct."
auto_stash = "Auto-{$stash} voor checkout, {$pull}, {$merge} of {$rebase}"
auto_stash_help = { git = "Wat te doen als een checkout, pull, merge of rebase door lokale wijzigingen wordt geblokkeerd. ask: een dialoogvenster biedt aan ze te stashen, de bewerking uit te voeren en de stash weer te poppen; always: dat doen zonder te vragen; never: weigeren, zoals git.", local = "Wat te doen als een checkout, pull, samenvoeging of rebase door lokale wijzigingen wordt geblokkeerd. ask: een dialoogvenster biedt aan ze in berging te zetten, de bewerking uit te voeren en de berging weer terug te zetten; always: dat doen zonder te vragen; never: weigeren, zoals git." }
include_untracked_in_autostash = { git = "Niet-gevolgde bestanden opnemen in auto-stash", local = "Niet-gevolgde bestanden opnemen in auto-berging" }
include_untracked_in_autostash_help = { git = "Of de automatische stash ook niet-gevolgde bestanden meeneemt (anders worden alleen gevolgde wijzigingen gestasht en teruggezet).", local = "Of de automatische berging ook niet-gevolgde bestanden meeneemt (anders worden alleen gevolgde wijzigingen in berging gezet en teruggezet)." }
hosting_refresh_minutes = "Vernieuwing {$prs} & issues"
hosting_refresh_minutes_help = { git = "Hoe vaak de lijsten {$prs} en Issues in de zijbalk (en de chip van de gekoppelde {$pr_abbr} in de werkbalk) de host opnieuw vragen. 0 zet de timer uit; ze vernieuwen nog steeds bij het openen van een repository, bij een branchwissel, na een push of fetch en op verzoek.", local = "Hoe vaak de lijsten {$prs} en Issues in de zijbalk (en de chip van de gekoppelde {$pr_abbr} in de werkbalk) de host opnieuw vragen. 0 zet de timer uit; ze vernieuwen nog steeds bij het openen van een repository, bij een branchwissel, na een push of ophalen en op verzoek." }
# context: label of the row that sets the name messages to a host are posted as (a bot such as my-app[bot])
hosting_post_as = "Plaatsen als"
# context: help under the "Post as" row of Settings
hosting_post_as_help = "De naam waarmee je berichten naar de host worden geplaatst, en de naam waaraan je eigen opmerkingen worden herkend (bewerken, verwijderen), bijvoorbeeld my-app[bot] voor een GitHub App. Alleen nodig met een bot-token: leeg gelaten vraagt GitPoulpi het aan de host en leert de naam van het eerste bericht dat het plaatst."
pr_terminology = "Terminologie voor reviewverzoeken"
pr_terminology_help = { git = "Het woord voor een gehost codereviewverzoek, overal in de TUI. Auto volgt de host van de repository: Merge request voor GitLab, Pull request voor de andere hosts. Pull request of Merge request dwingt dat woord af. Geldt meteen.", local = "Het woord voor een gehost codereviewverzoek, overal in de TUI. Auto volgt de host van de repository: Samenvoegaanvraag voor GitLab, Pull request voor de andere hosts. Pull request of Samenvoegaanvraag dwingt dat woord af. Geldt meteen." }
hide_finished_pr_chip = { git = "{$Pr}-chip verbergen als de {$pr} gesloten of gemerged is", local = "{$Pr}-chip verbergen als de {$pr} gesloten of samengevoegd is" }
hide_finished_pr_chip_help = { git = "De chip in de werkbalk toont de laatste {$pr} van de uitgecheckte branch. Aan: zodra die {$pr} gesloten of gemerged is, verdwijnt de chip en toont de branch de gedimde chip \"+ {$pr_abbr}\", alsof er geen is. Uit: de chip toont altijd de laatste {$pr}, in welke status die ook staat. Geldt meteen.", local = "De chip in de werkbalk toont de laatste {$pr} van de uitgecheckte branch. Aan: zodra die {$pr} gesloten of samengevoegd is, verdwijnt de chip en toont de branch de gedimde chip \"+ {$pr_abbr}\", alsof er geen is. Uit: de chip toont altijd de laatste {$pr}, in welke status die ook staat. Geldt meteen." }
heading_external_tools = "Externe tools"
external_editor = "Externe editor"
external_editor_help = "Opdracht voor het menu-item \"Openen in <editor>\" van een bestand; {{file}} is het volledige pad van het bestand (toegevoegd als het ontbreekt). Leeg: VS Code (`code`) als het op PATH staat, anders het standaardprogramma van het systeem."
external_diff_tool = { git = "Externe diff-tool", local = "Externe verschiltool" }
external_diff_tool_help = "Opdracht voor \"Openen in externe diff-tool\"; {{local}} is de gecommitte (of gestagede) versie, {{remote}} de versie waarmee wordt vergeleken. Leeg: `git difftool`, met de `diff.tool` die je in git hebt ingesteld."
external_merge_tool = { git = "Externe merge-tool", local = "Externe samenvoegtool" }
external_merge_tool_help = "Opdracht voor \"Openen in externe merge-tool\" op een conflictkaart; {{base}}, {{local}} (A, huidig), {{remote}} (B, inkomend) en {{merged}} (waar de tool het resultaat schrijft; gestaged als hij succesvol eindigt). Leeg: `git mergetool`, met de `merge.tool` die je in git hebt ingesteld."
file_explorer = "Bestandsbeheer"
file_explorer_help = "Opdracht voor \"Tonen in map\"; {{path}} is het volledige pad van het bestand, {{dir}} de map. Windows: explorer.exe /select,\"{{path}}\" selecteert het bestand; Linux: xdg-open \"{{dir}}\"; macOS: open -R \"{{path}}\"."
ai_assistant = "AI-assistent"
launch = "Een venster voor agents openen"
launch_help = "Als een AI-agent vraagt iets te tonen en er nergens een GitPoulpi-venster open is, voer dit uit om er een te openen: off (nooit, de standaard), een terminal (kitty, foot, WezTerm, Windows Terminal, ...), een nieuw tabblad/paneel/werkruimte in een multiplexer (tmux, zellij, cmux, ...) of custom, dat het onderstaande sjabloon gebruikt. De agent moet er nog steeds om vragen (`--launch`), of zijn ui_control moet auto zijn. Geldt vanaf het volgende verzoek."
launch_command = "Startopdracht (custom)"
launch_command_help = "Gebruikt als de keuze hierboven custom is. Opgesplitst in argumenten (quote met '...' of \"...\"), geen shell. {{repo}} is de repositorymap, {{session}} de sessienaam en {{gitpoulpi}} dit programma. Voorbeeld: kitty --directory {{repo}} {{gitpoulpi}} --session {{session}}"
tab_dir_follow = "De map van het actieve tabblad volgen"
tab_dir_follow_help = "Een programma kan de map van zijn shell niet wijzigen, dus dit biedt twee manieren om er te komen. buttons (standaard): zolang het actieve tabblad niet de map is waarin GitPoulpi is gestart, toont de tabbalk Afsluiten & cd hier (alleen bij start via de shell-wrapper, zie `gitpoulpi shell-init`). auto: geen knoppen; afsluiten doet altijd cd naar het actieve tabblad en er opent vanzelf een terminal wanneer je een nieuw tabblad opent (niet voor de bij het opstarten herstelde tabbladen)."
forget_all_usernames_and_passwords = "Alle gebruikersnamen en wachtwoorden vergeten"
forget_all_usernames_and_passwords_help = "Verwijdert elk token dat GitPoulpi in je credential helper heeft opgeslagen."
mcp_server = "MCP-server"
mcp_server_help = "Aan kan een AI-agent de MCP-server starten (`gitpoulpi mcp serve`, of `--http` voor het netwerkeindpunt). Uit weigert hij te starten. Opgeslagen als `mcp.enabled`. Een wijziging geldt de volgende keer dat een agent de server start; een server die al draait houdt de instellingen waarmee hij startte."
mcp_port = "Poort van MCP-server"
mcp_port_help = "De poort waarop `gitpoulpi mcp serve --http` luistert als er geen adres is opgegeven (het hostdeel van `mcp.bind` blijft behouden, standaard 127.0.0.1, alleen loopback tenzij --allow-remote). Geldt de volgende keer dat een agent de server start; een draaiende server houdt zijn poort."
mcp_bind_unreadable = "`mcp.bind` is \"{bind}\", wat geen leesbare poort heeft. Hier een poort instellen behoudt de host en vervangt de rest."
undo_off_note = "Ongedaan maken staat uit - schakel \"Ongedaan maken ingeschakeld\" in om de diepte in te stellen"
use_mailmap = "Auteurs tonen via .mailmap"
use_mailmap_help = "Toont elke auteur met de naam uit de .mailmap van de repository, in de Log, blame en bestandsgeschiedenis. De {$commits} zelf worden niet gewijzigd. Geldt direct."
auto_prune_tags = "{$Tags} automatisch opschonen"
auto_prune_tags_help = "Verwijdert bij elke {$fetch} ook de lokale {$tags} die op de remote zijn verwijderd. Alleen {$tags} die op de remote stonden worden aangeraakt: een {$tag} die je nooit hebt gepusht blijft staan. Standaard uit, net als in git."

