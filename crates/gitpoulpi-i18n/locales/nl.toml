conflict_label = "Grootste conflict om te verzenden (bytes)"
# context: help under that number
conflict_help = "Boven deze grootte mislukt \"Oplossing voorstellen\" niet: er volgt een waarschuwing en je kunt het toch één keer verzenden, deze instelling openen of annuleren. De limiet is de eigen beveiliging van GitPoulpi, niet die van het model: verhoog hem als je model genoeg ruimte heeft. Standaard 40000."
# context: red warning under that number while it is very large
conflict_warning = "Een zeer hoge limiet kan meer verzenden dan het model accepteert: het verzoek mislukt dan bij de provider."
# context: title of the dialog shown when a conflict is over the limit
too_large_title = "Conflict te groot om te verzenden"
# context: body of that dialog; {path} is the file, {size} the conflict's size (for example "48.1 KB (49206 bytes)"), {limit} the limit in the same form, {key} the name of the setting
too_large_body = "Het conflict in {path} is {size} en de limiet is {limit} (instelling {key}). De limiet is de eigen beveiliging van GitPoulpi, niet die van het model. Als je het toch verzendt, worden geheimen nog steeds vervangen en gevoelige bestanden nog steeds weggelaten."
# context: button that sends the oversized conflict this one time
send_anyway = "Toch verzenden"
# context: button that opens Settings on the limit
open_setting = "Instelling openen"
# context: key of the Send anyway button, one letter (shown as "Send anyway (S)")
key_send = "t"
# context: key of the Open setting button, one letter
key_open = "i"
# context: key of the Cancel button of that dialog, one letter
key_cancel = "a"
# context: Settings > AI, label of a number: the most bytes of the {$diff} an AI request for a message, an explanation, a stash name, a request description, a commit plan or a split may carry; also the whole {$diff} of a code review
diff_label = "Grootste {$diff} om te verzenden (bytes)"
# context: help under that number
diff_help = "Boven deze grootte wordt niets stilzwijgend afgekapt: er wordt gevraagd of je alles wilt verzenden, ingekort wilt verzenden, deze instelling wilt openen of wilt annuleren. Geldt voor een bericht voor een {$commit}, een uitleg, de naam van een {$stash}, de beschrijving van een verzoek, een plan van {$commits} en een splitsing, en voor de totale omvang van {$diff} in een review. Standaard 60000."
# context: Settings > AI, label of a number: the most bytes of one file's {$diff} in a code review
review_file_label = "Grootste {$diff} per bestand in een review (bytes)"
# context: help under that number
review_file_help = "Boven deze grootte wordt de inhoud van {$diff} van één bestand in een review ingekort, nadat er is gevraagd: alles verzenden, ingekort verzenden, deze instelling openen of annuleren. Standaard 12000."
# context: Settings > AI, label of a number: the most bytes of the description of the reviewed request
review_text_label = "Grootste reviewbeschrijving (bytes)"
# context: help under that number
review_text_help = "Boven deze grootte wordt de beschrijving van het beoordeelde verzoek ingekort, nadat er is gevraagd: alles verzenden, ingekort verzenden, deze instelling openen of annuleren. Standaard 4000."
# context: Settings > AI, label of a number: the most bytes of the comments that already exist on the reviewed request
review_threads_label = "Grootste lijst bestaande opmerkingen in een review (bytes)"
# context: help under that number
review_threads_help = "De bestaande opmerkingen worden vermeld zodat het model ze niet herhaalt. Boven deze grootte wordt de lijst ingekort, nadat er is gevraagd: alles verzenden, ingekort verzenden, deze instelling openen of annuleren. Standaard 6000."
# context: Settings > AI, label of a number: the most bytes of one project context file (CLAUDE.md, AGENTS.md, the extra file) given to a code review
review_context_file_label = "Grootste contextbestand in een review (bytes)"
# context: help under that number
