# context: detail combobox row: adds author and date to each commit id
detail_full = "Volledig: + auteur en datum"
# context: direction combobox row
orientation_lr = "Van links naar rechts"
# context: direction combobox row
orientation_tb = "Van boven naar beneden"
# context: checkbox: wrap the script in a Markdown code fence (keep the three backticks and the word mermaid)
fence = "Het ```mermaid-codeblok meenemen"
# context: title of the scrollable box that shows the generated text. Width budget: 20 cells
preview = "Voorbeeld"
# context: button: copy the script. Width budget: 10 cells
copy_button = "Kopiëren"
# context: button: close the popup. Width budget: 10 cells
close_button = "Sluiten"
# context: key hint: Tab moves to the next field
hint_next = "volgend veld"
# context: key hint: Enter copies the script
hint_copy = "kopiëren"
# context: key hint: the arrows scroll the preview
hint_scroll = "scrollen"
# context: title of the viewer that shows one Mermaid diagram of a conversation. Width budget: 40 cells
