max_commits_in_graph_warning = { git = "Każdy przechowywany commit kosztuje około 300 bajtów pamięci.", local = "Każde przechowywane zatwierdzenie kosztuje około 300 bajtów pamięci." }
undo_enabled = "Cofanie włączone"
undo_enabled_help = { git = "Włączone: Cofnij i Ponów mogą wycofać commity, staging, odrzucenia i zmiany gałęzi. Wyłączone: GitPoulpi w ogóle nie obsługuje cofania - najszybsze ustawienie - a przyciski paska narzędzi znikają. Wyłączenie kasuje historię cofania każdego repozytorium.", local = "Włączone: Cofnij i Ponów mogą wycofać zatwierdzenia, dodawanie do poczekalni, odrzucenia i zmiany gałęzi. Wyłączone: GitPoulpi w ogóle nie obsługuje cofania - najszybsze ustawienie - a przyciski paska narzędzi znikają. Wyłączenie kasuje historię cofania każdego repozytorium." }
undo_depth = "Głębokość historii cofania"
undo_depth_help = "Ile operacji może cofnąć Cofnij. 0 oznacza bez limitu."
journal_outside = "Zapisuj zmiany wykonane poza GitPoulpi"
journal_outside_help = { git = "Włączone: to, co powłoka lub agent AI zrobi z gałęziami, tagami, stashami i HEAD, pojawia się w historii cofania, oznaczone jako zewnętrzne, a Ctrl+Z może to cofnąć. Zmiany plików w drzewie roboczym nigdy nie są przechwytywane. Wymaga włączonego cofania.", local = "Włączone: to, co powłoka lub agent AI zrobi z gałęziami, znacznikami, schowkami i HEAD, pojawia się w historii cofania, oznaczone jako zewnętrzne, a Ctrl+Z może to cofnąć. Zmiany plików w drzewie roboczym nigdy nie są przechwytywane. Wymaga włączonego cofania." }
remember_tabs = "Pamiętaj karty"
remember_tabs_help = "Włączone: karty otwarte przy ostatnim zamknięciu sesji są otwierane przy następnym uruchomieniu. Wyłączone: uruchomienie zaczyna od jednej karty - repozytorium, na które wskazano. Czytane raz przy starcie; wymaga restartu."
radar_enabled = "Włącz Radar"
radar_enabled_help = "Wyłączone: karta Radar, jej polecenia i skrót są ukryte, a w tle nic dla niej nie jest pobierane. Działa od razu."
startup_tab_in_repo = "Karta startowa w repozytorium"
startup_tab_in_repo_help = "Karta, na której otwiera się start, gdy folder, z którego go uruchomiono, leży w repozytorium. Bieżące repozytorium otwiera kartę tego repozytorium, w razie potrzeby ją otwierając. Ostatnia karta otwiera kartę aktywną przy ostatnim zamknięciu (Home, gdy Pamiętaj karty jest wyłączone). Repozytorium podane przez --repo zawsze otwiera własną kartę. Czytane raz przy starcie; wymaga restartu."
startup_tab_outside_repo = "Karta startowa poza repozytorium"
startup_tab_outside_repo_help = "Karta, na której otwiera się start, gdy folder, z którego go uruchomiono, nie jest repozytorium, na przykład folder użytkownika. Ostatnia karta otwiera kartę aktywną przy ostatnim zamknięciu (Home, gdy Pamiętaj karty jest wyłączone lub nic nie zapamiętano). Radar otwiera Home, gdy Radar jest wyłączony. Czytane raz przy starcie; wymaga restartu."
startup_tab_launcher = "Karta startowa przy uruchomieniu z systemu"
startup_tab_launcher_help = "Karta, na której otwiera się start, gdy GitPoulpi uruchomiono z jego skrótu na pulpicie lub w menu Start (zobacz Uruchamianie z systemu niżej), niezależnie od folderu. Ma pierwszeństwo przed dwoma ustawieniami powyżej; Ostatnia karta i Radar działają jak powyżej. Czytane raz przy starcie; wymaga restartu."
group_worktree_tabs = "Grupuj karty worktree"
group_worktree_tabs_help = "Karty powiązanych worktree repozytorium stoją tuż za kartą tego repozytorium, a przeciągnięta gdzie indziej karta worktree wraca obok niej. Wyłączone zostawia karty tam, gdzie je ułożysz. Włączenie ponownie grupuje otwarte karty."
allow_agent_view_control = "Pozwól agentom AI sterować widokiem"
allow_agent_view_control_help = { git = "Włączone: agent AI (przez MCP lub `gitpoulpi ui`) może poprosić to okno o pokazanie commita, pliku lub powiadomienia. Nigdy nie zmienia niczego w repozytorium. Wyłączone: to okno ich nie przyjmuje. Czytane przy otwarciu okna.", local = "Włączone: agent AI (przez MCP lub `gitpoulpi ui`) może poprosić to okno o pokazanie zatwierdzenia, pliku lub powiadomienia. Nigdy nie zmienia niczego w repozytorium. Wyłączone: to okno ich nie przyjmuje. Czytane przy otwarciu okna." }
allow_ui_propose = "Pozwól agentom AI proponować zmiany do mojego potwierdzenia"
allow_ui_propose_help = { git = "Włączone: agent AI może otworzyć wstępnie wypełnione okno dialogowe: nowy opis commita, opis commita w kompozytorze, nową gałąź lub tag. Jest oznaczone ✦ Proposed by <agent>, a nic się nie zmienia, dopóki nie potwierdzisz w samym oknie; Esc odrzuca. Wyłączone (domyślnie): `ui propose` i narzędzia MCP ui_propose_* są odrzucane.", local = "Włączone: agent AI może otworzyć wstępnie wypełnione okno dialogowe: nowy opis zatwierdzenia, opis zatwierdzenia w kompozytorze, nową gałąź lub znacznik. Jest oznaczone ✦ Proposed by <agent>, a nic się nie zmienia, dopóki nie potwierdzisz w samym oknie; Esc odrzuca. Wyłączone (domyślnie): `ui propose` i narzędzia MCP ui_propose_* są odrzucane." }
clone_root = "Domyślny folder klonowania"
clone_root_help = "Od czego zaczyna się pole „Gdzie sklonować” w oknie Klonuj. Puste: domyślne dla systemu: %USERPROFILE%\\source\\repos w Windows, ~/src gdzie indziej."
browse_root = "Domyślny folder przeglądania"
browse_root_help = "Gdzie domyślnie otwiera się Przeglądaj (wybór folderu z karty Home). Puste: Przeglądaj otwiera się w ostatnio wybranym folderze - lub w folderze domowym za pierwszym razem - zamiast w stałym."
heading_auto_stash = { git = "Auto-stash", local = "Automatyczny schowek" }
