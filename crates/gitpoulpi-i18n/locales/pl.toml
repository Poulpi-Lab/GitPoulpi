initial_commits_in_graph = { git = "Początkowe commity w grafie", local = "Początkowe zatwierdzenia w grafie" }
initial_commits_in_graph_help = { git = "Jeśli leniwe wczytywanie commitów jest włączone, kolejne commity są wczytywane po dotarciu do najstarszego commita w grafie.", local = "Jeśli leniwe wczytywanie zatwierdzeń jest włączone, kolejne zatwierdzenia są wczytywane po dotarciu do najstarszego zatwierdzenia w grafie." }
initial_commits_in_graph_warning = "Zwiększenie może pogorszyć wydajność w dużych repozytoriach."
