pull_requests_and_1 = "otwórz wiersz w przeglądarce; „Połącz ponownie” otwiera Ustawienia na profilu"
pull_requests_and_2 = "wiersz {$pr}: edytuj na stronie hosta (ołówek wiersza); paleta ma odpowiednik dla wybranej gałęzi"
pull_requests_and_3 = "(sekcja {$PRS}) utwórz nowy - + w nagłówku"
pull_requests_and_4 = { git = "menu wiersza: otwórz, kopiuj URL / numer, checkout gałęzi źródłowej, pokaż jej commity, utwórz gałąź ze zgłoszenia", local = "menu wiersza: otwórz, kopiuj URL / numer, checkout gałęzi źródłowej, pokaż jej zatwierdzenia, utwórz gałąź ze zgłoszenia" }
pull_requests_and_5 = { git = "wybierz filtr ({$prs}: Otwarte, Merged / closed, Wszystkie; zgłoszenia: Otwarte, Wszystkie, Przypisane do mnie, Zamknięte); chip na pasku (GL !53, GH #12) otwiera powiązane żądanie, prawy przycisk myszy daje jego menu; „+ {$pr_abbr}” zaczyna je dla wypchniętej gałęzi", local = "wybierz filtr ({$prs}: Otwarte, Scalone / zamknięte, Wszystkie; zgłoszenia: Otwarte, Wszystkie, Przypisane do mnie, Zamknięte); chip na pasku (GL !53, GH #12) otwiera powiązane żądanie, prawy przycisk myszy daje jego menu; „+ {$pr_abbr}” zaczyna je dla wypchniętej gałęzi" }
refs_pane_1 = { git = "otwórz menu zaznaczonego refu: checkout, ukryj/solo, merge, rebase, fast-forward, pull / push / fetch, ustaw upstream, utwórz worktree, rozpocznij {$pr}, zmień nazwę, usuń, Kopiuj (nazwa / pełny ref / SHA celu)", local = "otwórz menu zaznaczonego refu: checkout, ukryj/solo, scal, rebase, fast-forward, ściągnij / wypchnij / pobierz, ustaw upstream, utwórz worktree, rozpocznij {$pr}, zmień nazwę, usuń, Kopiuj (nazwa / pełny ref / SHA celu)" }
