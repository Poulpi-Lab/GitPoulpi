git_actions_then_6 = { git = "stash wszystkich zmian, najpierw pytając o opis (z włączonym AI {{global.git_prefix}} w tym polu prosi model o jego napisanie)", local = "schowaj wszystkie zmiany, najpierw pytając o opis (z włączonym AI {{global.git_prefix}} w tym polu prosi model o jego napisanie)" }
git_actions_then_7 = { git = "AI pisze opis commita (tylko gdy AI jest włączone w Ustawieniach)", local = "AI pisze opis zatwierdzenia (tylko gdy AI jest włączone w Ustawieniach)" }
git_actions_then_8 = { git = "AI wyjaśnia zaznaczony commit (lub zmiany robocze)", local = "AI wyjaśnia zaznaczone zatwierdzenie (lub zmiany robocze)" }
git_actions_then_9 = { git = "AI proponuje podział zmian roboczych na commity (interaktywny przegląd: zmień kolejność, edytuj, przenoś pliki, pomijaj; {{compose.apply}} tworzy commity)", local = "AI proponuje podział zmian roboczych na zatwierdzenia (interaktywny przegląd: zmień kolejność, edytuj, przenoś pliki, pomijaj; {{compose.apply}} tworzy zatwierdzenia)" }
git_actions_then_10 = { git = "pull, tak jak ustawiono przycisk Pull (jego ▾: fetch wszystkich / ff, jeśli się da / tylko ff / rebase; `git.pull_mode`)", local = "ściągnięcie, tak jak ustawiono przycisk Ściągnij (jego ▾: pobranie wszystkich / ff, jeśli się da / tylko ff / rebase; `git.pull_mode`)" }
git_actions_then_11 = { git = "push do domyślnego zdalnego (lub pytanie, wg `git.push_behavior`)", local = "wypchnięcie do domyślnego zdalnego (lub pytanie, wg `git.push_behavior`)" }
git_actions_then_12 = { git = "fetch każdego zdalnego, z prune", local = "pobranie ze wszystkich zdalnych, z prune" }
git_actions_then_13 = "nowa gałąź w HEAD (pole wpisania nazwy)"
git_actions_then_14 = { git = "nowy tag w HEAD (pole wpisania nazwy)", local = "nowy znacznik w HEAD (pole wpisania nazwy)" }
git_actions_then_15 = { git = "stash push (wszystkie zmiany, z nieśledzonymi, bez opisu)", local = "schowaj wszystkie zmiany (z nieśledzonymi, bez opisu)" }
