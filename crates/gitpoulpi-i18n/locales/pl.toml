[settings_ssh]
private_key_path = "Ścieżka klucza prywatnego"
private_key_path_help = { git = "Plik klucza, który fetch, pull, push i clone podają ssh (ssh -i <klucz> -o IdentitiesOnly=yes). Puste: ssh-agent i konfiguracja ssh jak zwykle. Ignorowane, gdy ustawiono GIT_SSH_COMMAND lub core.sshCommand (np. Klucz SSH dla tego repozytorium). Obowiązuje od następnego transferu.", local = "Plik klucza, który pobieranie, ściąganie, wypychanie i klonowanie podają ssh (ssh -i <klucz> -o IdentitiesOnly=yes). Puste: ssh-agent i konfiguracja ssh jak zwykle. Ignorowane, gdy ustawiono GIT_SSH_COMMAND lub core.sshCommand (np. Klucz SSH dla tego repozytorium). Obowiązuje od następnego transferu." }
public_key_path = "Ścieżka klucza publicznego"
public_key_path_help = "Używane tylko gdy ścieżka klucza prywatnego jest pusta: ssh wybiera wtedy pasujący klucz z ssh-agent (lub klucz sprzętowy) zamiast podawać wszystkie klucze agenta. Generuj parę kluczy wypełnia oba pola. Taki sam priorytet jak ścieżka klucza prywatnego."
key_type = "Typ klucza"
heading_https_credentials = "Poświadczenia HTTPS"
https_mode = "Poświadczenia HTTPS"
https_mode_help = { git = "Jak fetch, pull, push i clone uwierzytelniają się przez HTTPS. credential_helper: własny helper gita (Git Credential Manager, libsecret, Keychain). prompt: ignoruje helpery i pozwala gitowi zapytać w terminalu. none: bez poświadczeń, tylko publiczne zdalne repozytoria. Dotyczy następnego transferu.", local = "Jak pobieranie, ściąganie, wypychanie i klonowanie uwierzytelniają się przez HTTPS. credential_helper: własny helper gita (Git Credential Manager, libsecret, Keychain). prompt: ignoruje helpery i pozwala gitowi zapytać w terminalu. none: bez poświadczeń, tylko publiczne zdalne repozytoria. Dotyczy następnego transferu." }
heading_keys = "Klucze"
generate_key_pair = "Generuj parę kluczy"
generate_key_pair_help = "Generuje parę kluczy ed25519 we własnym zakresie (bez ssh-keygen, bez hasła) jako ~/.ssh/gitpoulpi_ed25519, nigdy nie nadpisując pliku, i zapisuje obie ścieżki powyżej. Klucz publiczny dodasz do hosta w Integracjach."

[settings_editor]
tab_size = "Rozmiar tabulacji"
tab_size_help = { git = "Kolumny między tabulatorami we wbudowanym edytorze (rysowanie, Shift+Tab) i w widokach diff. Widok blame rysuje tabulator jako jedną spację i go ignoruje.", local = "Kolumny między tabulatorami we wbudowanym edytorze (rysowanie, Shift+Tab) i w widokach różnic. Widok blame rysuje tabulator jako jedną spację i go ignoruje." }
eol = "Koniec linii"
eol_help = "Co zapisuje wbudowany edytor. Auto zachowuje koniec linii pliku (LF dla nowego pliku); LF lub CRLF konwertuje plik przy zapisie. Pasek stanu edytora pokazuje, co zapisze następny zapis."
syntax_highlighting = "Podświetlanie składni"
syntax_highlighting_help = { git = "Koloruje wbudowany edytor według języka. Widoki diff i blame nie mają kolorowania składni.", local = "Koloruje wbudowany edytor według języka. Widoki różnic i blame nie mają kolorowania składni." }
line_numbers = "Numery linii"
line_numbers_help = { git = "Kolumna numerów wbudowanego edytora i widoków diff (tam jest pusta, kolumny zachowują miejsce). Widok blame jej nie ma.", local = "Kolumna numerów wbudowanego edytora i widoków różnic (tam jest pusta, kolumny zachowują miejsce). Widok blame jej nie ma." }
follow_selection = "Podążaj za zaznaczeniem w edytorze"
follow_selection_help = "Gdy edytor jest otwarty, zaznaczenie innego pliku w prawym panelu otwiera go także w edytorze, po zapytaniu o zapisanie niezapisanych zmian. Plik, którego nie można edytować, otwiera się w zwykłym widoku."
merge_side_by_side_min_width = { git = "Edytor merge: obok siebie od (kolumn)", local = "Edytor scalania: obok siebie od (kolumn)" }
merge_side_by_side_min_width_help = { git = "Edytor konfliktów merge pokazuje A i B obok siebie, gdy jego obszar ma co najmniej tyle kolumn (długie linie przewijają się w bok Shift+kółko lub Shift+strzałki); węższy pokazuje jedną stronę naraz w kartach. Domyślnie 100; najmniej 40, 0 oznacza zawsze obok siebie. Edytor ukrywa panele Refs i Status, gdy jest otwarty, więc zwykle ma całe okno.", local = "Edytor konfliktów scalania pokazuje A i B obok siebie, gdy jego obszar ma co najmniej tyle kolumn (długie linie przewijają się w bok Shift+kółko lub Shift+strzałki); węższy pokazuje jedną stronę naraz w kartach. Domyślnie 100; najmniej 40, 0 oznacza zawsze obok siebie. Edytor ukrywa panele Refs i Status, gdy jest otwarty, więc zwykle ma całe okno." }
diff_word_wrap = "Zawijanie linii"
diff_word_wrap_help = { git = "Zawija długie linie w widokach diff zamiast ucinać je wielokropkiem. Wbudowany edytor i widok blame przewijają się w bok i nie zawijają. To także własny przełącznik zawijania widoku diff.", local = "Zawija długie linie w widokach różnic zamiast ucinać je wielokropkiem. Wbudowany edytor i widok blame przewijają się w bok i nie zawijają. To także własny przełącznik zawijania widoku różnic." }

[settings_ui]
theme = "Motyw"
theme_help = "Kolory całego interfejsu. Przesuwanie po liście pokazuje podgląd każdego motywu; Enter go zachowuje, Esc cofa. System podąża za terminalem (jego jasnym lub ciemnym tłem, wykrytym raz przy uruchomieniu; Ciemny, gdy nie da się go ustalić). Własne pliki motywów z katalogu themes/ w folderze konfiguracji są na końcu."
theme_system = "System (zgodny z terminalem)"
follow_theme = "Zgodnie z motywem"
theme_swatches = "Kolory"
graph_lane_background = "Tło ścieżek grafu"
graph_lane_background_help = { git = "Wył.: przezroczyste, nic za ścieżkami (domyślnie). Podbarwienie wiersza: blady pas koloru ścieżki commita w kolumnie Graf oraz cienki pasek tego koloru na prawej krawędzi kolumny. Zapisana wartość lane jest odczytywana jako Podbarwienie wiersza. Działa po zamknięciu Ustawień.", local = "Wył.: przezroczyste, nic za ścieżkami (domyślnie). Podbarwienie wiersza: blady pas koloru ścieżki zatwierdzenia w kolumnie Graf oraz cienki pasek tego koloru na prawej krawędzi kolumny. Zapisana wartość lane jest odczytywana jako Podbarwienie wiersza. Działa po zamknięciu Ustawień." }
graph_row_tint_strength = "Intensywność podbarwienia"
graph_row_tint_strength_help = "Jak wyblakły jest pas podbarwienia wiersza: Mocne (oryginalne), Średnie (domyślnie) lub Subtelne. Blednie tylko pas; pasek na prawej krawędzi kolumny zachowuje pełny kolor. Działa po zamknięciu Ustawień."
graph_row_tint_strength_coming = "najpierw ustaw Tło ścieżek grafu na Podbarwienie wiersza"
toolbar_position = "Położenie paska narzędzi"
toolbar_position_help = "Gdzie leży pasek narzędzi: U góry, Na dole (domyślnie), Po lewej lub Po prawej. Po lewej i Po prawej robią z niego kolumnę obok paneli; w oknie węższym niż 80 kolumn jest rysowany na dole. Działa od razu."
toolbar_align = "Wyrównanie przycisków paska narzędzi"
toolbar_align_help = "Gdzie leżą przyciski wzdłuż paska: Początek (domyślnie), Środek lub Koniec. Początek to lewa strona wiersza i góra kolumny; koniec to prawa strona i dół. Działa od razu."
toolbar_pr_pinned = "Przypnij przycisk {$pr} na końcu"
toolbar_pr_pinned_help = "Włączone (domyślnie): przycisk {$pr} leży na samym końcu paska narzędzi (po prawej, w kolumnie na dole) przy każdym wyrównaniu. Wyłączone: płynie razem z innymi przyciskami i jest z nimi wyrównany. Działa od razu."
statusbar_position = "Położenie paska stanu"
statusbar_position_help = "Gdzie leży pasek stanu (gałąź, liczniki, komunikaty, podpowiedzi klawiszy): U góry, nad kartami repozytoriów, lub Na dole (domyślnie). Karta Home zachowuje własny pasek stanu na dole. Działa od razu."
tabs_position = "Położenie paska kart"
tabs_position_help = "Gdzie leżą karty repozytoriów: U góry (domyślnie), Na dole lub Po lewej, lista z jedną kartą w wierszu przy lewej krawędzi okna. W oknie węższym niż 80 kolumn są rysowane u góry. Obok paska narzędzi w kolumnie karty zostają na zewnątrz. Działa od razu."
graph_color_theme = "Motyw kolorów grafu"
graph_color_theme_help = "Paleta kolorów ścieżek grafu Log. „Zgodnie z motywem” używa palety wybranego motywu; każda inna pozycja ją zastępuje, więc dowolny motyw można połączyć z dowolną paletą. Działa po zamknięciu Ustawień."
graph_renderer = "Renderer grafu"
graph_renderer_help = "auto rysuje graf jako prawdziwy obraz w terminalu, który to obsługuje, a znakami wszędzie indziej - także w tmux lub zellij, które dziedziczą środowisko terminala, ale nie przepuszczają obrazu, oraz w herdr, chyba że jego ustawienie kitty_graphics jest włączone. obraz wymusza obraz, tekst go wyłącza. Wymaga restartu."
image_protocol = "Protokół obrazów"
image_protocol_help = "Jak obrazy (obraz grafu, awatary autorów) docierają do terminala. auto: protokół graficzny Kitty w kitty, Ghostty i herdr, którego konfiguracja ustawia kitty_graphics = true; obrazy inline iTerm2 w WezTerm, iTerm2 i mintty; obrazy sixel (tylko awatary autorów, graf zostaje w znakach) w Windows Terminal, foot, Konsole i mlterm; znaki gdzie indziej. kitty, iterm2 lub sixel wymusza ten protokół (kitty dla herdr z konfiguracją w innym miejscu; sixel dla terminala, który go rysuje, ale nie jest rozpoznawany); none wyłącza obrazy. Wymaga restartu."
kitty_keyboard = "Protokół klawiatury Kitty"
kitty_keyboard_help = "auto pyta terminal przy starcie, w ciągu około 100 ms, czy obsługuje protokół klawiatury kitty, i używa go, gdy tak: kombinacje, których starsze terminale nie rozróżniają (Control z interpunkcją, cyframi, Shift lub Enter), docierają wtedy same, zamiast kolidować z kodami sterującymi. Terminal, który nie odpowie, zachowuje klawisze starego typu. off nigdy nie rusza trybu klawiatury terminala. Wymaga restartu."
color_depth = "Głębia kolorów"
color_depth_help = "auto używa kolorów 24-bitowych, z wyjątkiem terminali, które ich nie pokazują (Apple Terminal, konsola Linuksa lub terminal 256-kolorowy bez COLORTERM), gdzie kolory są mapowane na najbliższe z 256 lub 16 pozycji. truecolor, 256 i 16 wymuszają głębię. Działa od razu."
graph_show_stashes = { git = "Pokaż stashe w grafie", local = "Pokaż schowki w grafie" }
graph_show_stashes_help = { git = "Każdy stash dostaje własny wiersz w Log, w swojej dacie: małe pudełko na ścieżce obok commita, na którym powstał, połączone z nim linią przerywaną. Zaznaczenie pokazuje, co zmienił; prawy przycisk myszy (lub .) oferuje Pop, Apply i Drop. Wyłączone: stashe są tylko w sekcji STASHES. Nie rysowane podczas solowania.", local = "Każdy schowek dostaje własny wiersz w Log, w swojej dacie: małe pudełko na ścieżce obok zatwierdzenia, na którym powstał, połączone z nim linią przerywaną. Zaznaczenie pokazuje, co zmienił; prawy przycisk myszy (lub .) oferuje Pop, Apply i Drop. Wyłączone: schowki są tylko w sekcji {$STASHES}. Nie rysowane podczas solowania." }
ref_connector = { git = "Łącznik ref–commit", local = "Łącznik ref–zatwierdzenie" }
ref_connector_help = { git = "Cienka linia od każdej plakietki ref w kolumnie Ref do kółka jej commita w grafie. Wypełnia tylko puste miejsce: mijane ścieżki zostają na wierzchu i nic się nie przesuwa. Rysowana tylko, gdy kolumna Ref jest tuż po lewej od kolumny Graf.", local = "Cienka linia od każdej plakietki ref w kolumnie Ref do kółka jej zatwierdzenia w grafie. Wypełnia tylko puste miejsce: mijane ścieżki zostają na wierzchu i nic się nie przesuwa. Rysowana tylko, gdy kolumna Ref jest tuż po lewej od kolumny Graf." }
log_wip_counts_in_message = "Pokaż liczniki zmian WIP w opisie, gdy kolumna Zmiany jest ukryta"
log_wip_counts_in_message_help = { git = "Wiersz WIP pokazuje, ile plików zmodyfikowano, dodano i usunięto. Gdy kolumna Zmiany jest widoczna (prawy przycisk myszy nagłówka Log, by ją pokazać), liczniki zawsze trafiają do niej, jak dla każdego commita. Gdy jest ukryta, jadą w opisie WIP, dopóki to włączone; wyłączone nie pokazuje liczników wcale.", local = "Wiersz WIP pokazuje, ile plików zmodyfikowano, dodano i usunięto. Gdy kolumna Zmiany jest widoczna (prawy przycisk myszy nagłówka Log, by ją pokazać), liczniki zawsze trafiają do niej, jak przy każdym commicie. Gdy jest ukryta, jadą w opisie WIP, dopóki to włączone; wyłączone nie pokazuje liczników wcale." }
avatars = "Awatary autorów"
avatars_help = { git = "Obrazy autorów. graf rysuje autora każdego commita w jego kółku w grafie (tylko graf obrazkowy; w grafie tekstowym kolorowy inicjał trafia do kolumny Autor). autor umieszcza okrągły obraz na początku kolumny Autor. Oba pokazują go też w panelu szczegółów commita. Domyślnie wyłączone: włączenie wysyła hasz SHA-256 adresu e-mail każdego autora do gravatar.com przez HTTPS - hasz znanego lub łatwego do odgadnięcia adresu nie jest anonimowy - a w repozytorium ze zdalnym github.com pyta raz na autora API GitHuba, które konto stworzyło jeden z jego commitów (z tokenem integracji GitHub, jeśli jest). Dopóki obraz nie dotrze lub gdy go nie ma, pokazywane są inicjały lub zwykłe kółko. wył. nic nie wysyła przez sieć.", local = "Obrazy autorów. graf rysuje autora każdego zatwierdzenia w jego kółku w grafie (tylko graf obrazkowy; w grafie tekstowym kolorowy inicjał trafia do kolumny Autor). autor umieszcza okrągły obraz na początku kolumny Autor. Oba pokazują go też w panelu szczegółów zatwierdzenia. Domyślnie wyłączone: włączenie wysyła hasz SHA-256 adresu e-mail każdego autora do gravatar.com przez HTTPS - hasz znanego lub łatwego do odgadnięcia adresu nie jest anonimowy - a w repozytorium ze zdalnym github.com pyta raz na autora API GitHuba, które konto stworzyło jeden z jego zatwierdzeń (z tokenem integracji GitHub, jeśli jest). Dopóki obraz nie dotrze lub gdy go nie ma, pokazywane są inicjały lub zwykłe kółko. wył. nic nie wysyła przez sieć." }
avatar_sources = "Źródła awatarów"
avatar_sources_help = { git = "Gdzie szukany jest obraz autora, w kolejności (adres noreply GitHuba zawsze najpierw wskazuje swoje konto). hosting_gravatar: połączona integracja GitHub, GitLab lub Bitbucket, której host pasuje do zdalnego repozytorium (autor commita GitHub lub wyszukiwanie użytkownika, awatar GitLab po e-mailu lub API users), potem Gravatar; bez pasującej integracji Gravatar jest pierwszy, a zdalny github.com jest nadal pytany na końcu, bez uwierzytelnienia. gravatar_hosting: odwrotnie. gravatar lub hosting: tylko to jedno. Gdy żadne nie ma obrazu, rysowany jest zapasowy awatar poniżej. Dotyczy autorów jeszcze nie sprawdzonych.", local = "Gdzie szukany jest obraz autora, w kolejności (adres noreply GitHuba zawsze najpierw wskazuje swoje konto). hosting_gravatar: połączona integracja GitHub, GitLab lub Bitbucket, której host pasuje do zdalnego repozytorium (autor zatwierdzenia GitHub lub wyszukiwanie użytkownika, awatar GitLab po e-mailu lub API users), potem Gravatar; bez pasującej integracji Gravatar jest pierwszy, a zdalny github.com jest nadal pytany na końcu, bez uwierzytelnienia. gravatar_hosting: odwrotnie. gravatar lub hosting: tylko to jedno. Gdy żadne nie ma obrazu, rysowany jest zapasowy awatar poniżej. Dotyczy autorów jeszcze nie sprawdzonych." }
avatar_fallback = "Awatar zapasowy"
avatar_fallback_help = "Co dostaje autor bez obrazu. identicon: wzór 5x5 lustrzany w stylu GitHub w kolorze wyprowadzonym z jego e-maila, generowany lokalnie (bez sieci), jako obraz w terminalu obrazkowym i znaki blokowe gdzie indziej. inicjały: kolorowa plakietka z inicjałami."
composer_files = "Propozycje kompozytora"
composer_files_help = { git = "Jak otwiera się przegląd kompozytora commitów AI. rozwinięte: każdy proponowany commit wylicza swoje pliki. zwinięte: tylko wiersze commitów; Right/Left (lub kliknięcie strzałki) otwiera jeden.", local = "Jak otwiera się przegląd kompozytora zatwierdzeń AI. rozwinięte: każde proponowane zatwierdzenie wylicza swoje pliki. zwinięte: tylko wiersze zatwierdzeń; Right/Left (lub kliknięcie strzałki) otwiera jeden." }
blame_side = "Adnotacje Blame"
blame_side_help = "Po której stronie widoku Blame jest kolumna adnotacji (awatar, autor, wiek, opis). right: z prawej strony kodu. left: z lewej strony kodu."
column_resize = "Zmiana szerokości kolumn"
column_resize_help = "Jak chwyta się granicę kolumny w Logu, Radarze i bocznej kolumnie widoków plików. line: cienka linia na całej wysokości tabeli, gdy wskaźnik jest na granicy, z małym znacznikiem w nagłówku. header: bez odstępu i bez znacznika, szerokość zmienia się tylko z nagłówka, gdzie zapala się pierwszy znak następnej komórki."
blame_width = "Szerokość adnotacji Blame"
blame_width_help = "Szerokość kolumny adnotacji w komórkach (od 24 do 90). Przeciągnij jej krawędź w widoku Blame albo użyj klawiszy poszerzania / zwężania; nowa szerokość jest zapisywana tutaj."
ref_tree = "Drzewo folderów gałęzi"
ref_tree_help = "Panel Refs grupuje nazwy gałęzi po `/` w zwijane foldery, a każde zdalne repozytorium ma własny węzeł najwyższego poziomu. Wyłączone daje jeden płaski wiersz na gałąź. `y` w panelu Refs przełącza to na żywo i zapisuje wybór tutaj."
reveal_on_ref_click = "Kliknięcie refu pokazuje go w grafie"
reveal_on_ref_click_help = "Pojedyncze kliknięcie refu w panelu Refs przewija Log do miejsca, na które ref wskazuje, i na chwilę podświetla wiersz. Zaznaczenie w Logu i prawy panel pozostają bez zmian. Po wyłączeniu kliknięcie tylko zaznacza wiersz paska bocznego. „Pokaż w grafie” w menu refu, jego klawisz w panelu Refs i polecenie w palecie działają w obu przypadkach."
graph_ghost_ref = { git = "Pokaż widmową gałąź dla najechanego commita", local = "Pokaż widmową gałąź dla najechanego zatwierdzenia" }
graph_ghost_ref_help = { git = "W kolumnie Ref w Log najechany commit, który nie ma własnego refa, pokazuje wyblakłą pigułkę z nazwą gałęzi, do której należy (w razie braku jej gałąź zdalną), wywnioskowaną z historii. Najechanie na pigułkę pokazuje jej rodzaj. Kliknięcie nie robi nic szczególnego; gałąź tworzy polecenie utworzenia gałęzi. Rysowana tylko tam, gdzie kolumna Ref ma miejsce. Wyłączone ją ukrywa.", local = "W kolumnie Ref w Log najechane zatwierdzenie, które nie ma własnego refa, pokazuje wyblakłą pigułkę z nazwą gałęzi, do której należy (w razie braku jej gałąź zdalną), wywnioskowaną z historii. Najechanie na pigułkę pokazuje jej rodzaj. Kliknięcie nie robi nic szczególnego; gałąź tworzy polecenie utworzenia gałęzi. Rysowana tylko tam, gdzie kolumna Ref ma miejsce. Wyłączone ją ukrywa." }
mouse_enabled = "Mysz włączona"
mouse_enabled_help = "Wyłączone zostawia zaznaczanie przeciąganiem twojemu terminalowi. Wymaga restartu."
mouse_scroll_lines = "Linie kółka myszy"
mouse_scroll_lines_help = { git = "O ile commitów w Log przesuwa jeden ząbek kółka. Wymaga restartu.", local = "O ile zatwierdzeń w Log przesuwa jeden ząbek kółka. Wymaga restartu." }
heading_date_time = "Data i czas"
heading_layout = "Układ"
date_locale = "Ustawienia regionalne daty/czasu"
date_locale_help = "systemowy: nazwy miesięcy i dni zgodne z językiem interfejsu. english: zawsze nazwy angielskie, niezależnie od języka. Dotyczy wszystkich dat na tej stronie."
diff_layout = "Domyślny układ"
diff_layout_help = { git = "W linii (jedna kolumna) lub obok siebie (przed i po). Wznawiane z ostatnio oglądanego diffa, w tym oknie i między restartami - zmiana tutaj ustawia tylko punkt startu *nowej* sesji.", local = "W linii (jedna kolumna) lub obok siebie (przed i po). Wznawiane z ostatnio oglądanych różnic, w tym oknie i między restartami - zmiana tutaj ustawia tylko punkt startu *nowej* sesji." }
diff_hunks_only = "Tylko hunki"
diff_hunks_only_help = "Włączone pokazuje tylko zmienione hunki z kilkoma liniami kontekstu; wyłączone pokazuje cały plik ze zmianami podświetlonymi na miejscu. Wznawiane jak układ."
diff_show_whitespace = "Pokaż zmiany tylko w białych znakach"
diff_show_whitespace_help = "Wyłączone zwija hunk różniący się tylko białymi znakami do kontekstu."
input_color = "Kolor pól tekstowych"
input_color_help = "Tło pól tekstowych. „Zgodnie z motywem” (domyślnie) używa koloru motywu; pozostałe to ciemne kolory, które go zastępują. Własny... używa koloru hex poniżej. Działa na żywo, bez restartu."
input_color_custom = "Własny kolor pól tekstowych"
input_color_custom_help = "#rrggbb, używany, gdy Kolor pól tekstowych to Własny. Działa na żywo."
minimap = "Minimapa"
minimap_help = { git = "Obraz całego pliku obok pionowego paska przewijania diffa (tryb całego pliku) i edytora, z podświetloną widoczną częścią; kliknij, by skoczyć. Prawdziwy obraz tam, gdzie terminal je rysuje, komórki braille gdzie indziej. Także `M` w diffie i „Widok: Przełącz minimapę” w palecie.", local = "Obraz całego pliku obok pionowego paska przewijania różnic (tryb całego pliku) i edytora, z podświetloną widoczną częścią; kliknij, by skoczyć. Prawdziwy obraz tam, gdzie terminal je rysuje, komórki braille gdzie indziej. Także `M` w różnicach i „Widok: Przełącz minimapę” w palecie." }
date_format = "Format daty"
date_format_help = "Kolumna daty Blame / Historii pliku."
date_time_format = "Format daty/czasu"
date_time_format_help = "Sama kolumna Date w Log."
date_verbose_format = "Format daty rozszerzony"
date_verbose_format_help = { git = "Linia Date w panelu szczegółów commita, tooltip kolumny Data po najechaniu i Copy > Date.", local = "Linia Date w panelu szczegółów zatwierdzenia, tooltip kolumny Data po najechaniu i Copy > Date." }
preview = "podgląd"
sidebar_sections_scope = "Sekcje panelu bocznego"
sidebar_sections_scope_help = "Od czego zależy, które sekcje panelu bocznego są pokazane lub ukryte. repository: każde repozytorium ma własny zestaw (globalny jest jego punktem wyjścia). global: jeden zestaw dla wszystkich repozytoriów. Przełączanie nie traci żadnego z zestawów."
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "Column layout"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "How the Log lays its columns out. fit: every column fits the pane and only Message flexes. scroll: columns keep their widths, Message too, and the table scrolls sideways when it is wider than the pane."

[settings_git]
default_backend = "Backend gita"
default_backend_help = "Globalne. Działający demon zachowuje backend, z którym wystartował."
default_backend_warning = "Działa dla demonów uruchomionych po tej zmianie."
pull_mode = { git = "Przycisk Pull", local = "Przycisk Ściągnij" }
default_encoding = "Domyślne kodowanie"
default_encoding_help = { git = "Używane do pokazywania zawartości plików, blame i diffów, które nie są poprawnym UTF-8 (poprawny UTF-8 nigdy nie jest dekodowany ponownie). Repozytorium może to nadpisać poniżej. Tylko wyświetlanie: staging i patche zachowują bajty pliku dokładnie.", local = "Używane do pokazywania zawartości plików, blame i różnic, które nie są poprawnym UTF-8 (poprawny UTF-8 nigdy nie jest dekodowany ponownie). Repozytorium może to nadpisać poniżej. Tylko wyświetlanie: dodawanie do poczekalni i patche zachowują bajty pliku dokładnie." }
push_behavior = { git = "Przycisk Push", local = "Przycisk Wypchnij" }
push_behavior_help = { git = "od razu: push natychmiast do domyślnego zdalnego repozytorium. pytaj: otwiera małe menu z wstępnie wybranym domyślnym zdalnym. ▾ przycisku zawsze pyta.", local = "od razu: wypchnięcie natychmiast do domyślnego zdalnego repozytorium. pytaj: otwiera małe menu z wstępnie wybranym domyślnym zdalnym. ▾ przycisku zawsze pyta." }
repo_encoding_help = { git = "Jak zawartość plików, blame i diffy są dekodowane do wyświetlenia, gdy nie są poprawnym UTF-8 (tylko to repozytorium; inherited: Domyślne kodowanie na tej stronie). Staging niczego nie przekodowuje.", local = "Jak zawartość plików, blame i różnice są dekodowane do wyświetlenia, gdy nie są poprawnym UTF-8 (tylko to repozytorium; inherited: Domyślne kodowanie na tej stronie). Dodawanie do poczekalni niczego nie przekodowuje." }
core_autocrlf_help = "Zapisywane w konfiguracji git tego repozytorium (core.autocrlf), więc widzą je git i wszystkie inne narzędzia. true: LF na CRLF przy checkout; input: CRLF na LF tylko przy zapisie do historii; false: bez konwersji. (dziedziczone): usuwa wartość repozytorium, aby obowiązywała globalna konfiguracja git. Można cofnąć."
core_eol_help = "Zapisywane w konfiguracji git tego repozytorium (core.eol): koniec linii, którego git używa dla plików tekstowych w drzewie roboczym (lf, crlf lub native, czyli platformowy). (dziedziczone): usuwa wartość repozytorium, aby obowiązywała globalna konfiguracja git. Można cofnąć."
git_lfs = "Git LFS"
git_lfs_help = { git = "Pokaż Git LFS w interfejsie (tag LFS, kartę diffa, baner braku programu, polecenia LFS) i pozwól GitPoulpi wykonywać własne kroki LFS (pobieranie obiektów po klonowaniu). Wyłączone: własne filtry LFS gita nadal działają, GitPoulpi nigdy sam nie wywołuje git-lfs.", local = "Pokaż Git LFS w interfejsie (znacznik LFS, kartę różnic, baner braku programu, polecenia LFS) i pozwól GitPoulpi wykonywać własne kroki LFS (pobieranie obiektów po klonowaniu). Wyłączone: własne filtry LFS gita nadal działają, GitPoulpi nigdy sam nie wywołuje git-lfs." }
git_lfs_program = "Program git-lfs"
git_lfs_program_help = "Zainstaluj z https://git-lfs.com (Windows: dołączony do Git for Windows lub `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Paleta: LFS: Otwórz stronę instalacji."
initialize_lfs_for_this_repository = "Zainicjuj LFS dla tego repozytorium"
initialize_lfs_for_this_repository_help = "Uruchamia `git lfs install --local`: filtry i hooki LFS w konfiguracji tego repozytorium, nigdy w globalnej. Wymaga git-lfs."
pull_mode_help = { git = "Co robi {$Pull}{hint} na pasku narzędzi: merge (fast-forward, jeśli się da), ff_only lub rebase. Pozycje ▾ przycisku wykonują własną akcję od razu i tego nie zmieniają.", local = "Co robi Ściągnij{hint} na pasku narzędzi: scalenie (fast-forward, jeśli się da), ff_only lub rebase. Pozycje ▾ przycisku wykonują własną akcję od razu i tego nie zmieniają." }
repo_heading = "Repo: {repo} - tylko to repozytorium"
inherited = "(dziedziczone)"
lfs_not_checked = "(jeszcze nie sprawdzono)"
lfs_autofix_filters = { git = "Instaluj filtry LFS przed pull i push", local = "Instaluj filtry LFS przed ściąganiem i wypychaniem" }
lfs_autofix_filters_help = { git = "Przed pull lub push w repozytorium używającym Git LFS uruchamia `git lfs install --local`, jeśli brakuje jego filtrów LFS lub hooków (tylko własna konfiguracja repozytorium, nigdy globalna), aby transfer obsłużył duże pliki. Pasek stanu o tym informuje. Wymaga git-lfs.", local = "Przed ściąganiem lub wypychaniem w repozytorium używającym Git LFS uruchamia `git lfs install --local`, jeśli brakuje jego filtrów LFS lub hooków (tylko własna konfiguracja repozytorium, nigdy globalna), aby transfer obsłużył duże pliki. Pasek stanu o tym informuje. Wymaga git-lfs." }

