git_actions_then_amend = { git = "popraw wybrany commit: podsumowanie, opis, imię, e-mail i datę autora w jednym oknie", local = "popraw wybrane zatwierdzenie: podsumowanie, opis, imię, e-mail i datę autora w jednym oknie" }
git_actions_then_edit_author = { git = "popraw tylko autora wybranego commita (imię, e-mail, data)", local = "popraw tylko autora wybranego zatwierdzenia (imię, e-mail, data)" }
rewrite_1 = "otwiera warsztat przepisywania historii: zmienia autorów, daty, opisy, zawartość plików lub ścieżki w całej historii albo w jej wybranej części"
rewrite_2 = "pokazuje podgląd tego, co zmieniłyby reguły, a potem stosuje to jednym krokiem, który Cofnij odwraca; Zastosuj jest wyłączone, gdy podgląd jest nieaktualny"
rewrite_3 = "anuluje trwający podgląd (Esc robi to samo; drugi Esc zamyka warsztat)"
rewrite_4 = "dodaje regułę, usuwa regułę pod kursorem, przywraca ostatnio usuniętą, duplikuje regułę"
rewrite_5 = "włącza lub wyłącza regułę albo przesuwa ją w górę lub w dół (reguły działają od góry do dołu)"
rewrite_6 = "przełącza karty podglądu"
rewrite_7 = "zapisuje przepis w repozytorium albo tylko dla ciebie, wczytuje zapisany, zmienia jego nazwę; wartości tajne nigdy nie są zapisywane"
rewrite_8 = "uwzględnia albo pomija każdą chronioną gałąź, która jest już wypchnięta; sprawdza zewnętrzne narzędzia ponownie"
file_history_1 = { git = "przejdź do commita wiersza w Log, doczytując Log, jeśli jeszcze go tam nie ma", local = "przejdź do zatwierdzenia wiersza w Log, doczytując Log, jeśli jeszcze go tam nie ma" }
file_history_2 = { git = "przesuń zaznaczenie; diff po prawej podąża od razu", local = "przesuń zaznaczenie; różnice po prawej podążają od razu" }
file_history_3 = { git = "rozszerz zaznaczenie do zakresu: po prawej pojawi się diff pliku między dwoma końcami (Shift+klik robi to samo)", local = "rozszerz zaznaczenie do zakresu: po prawej pojawią się różnice pliku między dwoma końcami (Shift+klik robi to samo)" }
file_history_4 = { git = "przekaż klawiaturę diffowi lub zwróć ją liście", local = "przekaż klawiaturę różnicom lub zwróć ją liście" }
file_history_5 = { git = "kopiuj SHA commita lub jego podsumowanie", local = "kopiuj SHA zatwierdzenia lub jego podsumowanie" }
file_history_6 = { git = "prawa strona: diff, plik tak, jak wyglądał w stanie z tego commita, lub jego blame; podąża za zaznaczeniem i zachowuje tryb", local = "prawa strona: różnice, plik tak, jak wyglądał w tym zatwierdzeniu, lub jego blame; podąża za zaznaczeniem i zachowuje tryb" }
file_history_7 = "porównaj wersję z wiersza z drzewem roboczym (naciśnij ponownie, aby wrócić)"
file_history_8 = "przywróć plik do tej wersji w drzewie roboczym (najpierw zapyta; Cofnij przywraca stare bajty)"
file_history_9 = "zmień rozmiar listy (separator też można przeciągnąć; szerokość jest zapamiętywana)"
file_history_10 = "mysz: kliknięcie wiersza, Shift+klik dla zakresu, podwójne kliknięcie pokazuje go w Log, prawy przycisk myszy otwiera menu"
commit_column_1 = "przewiń wiersze na boki (Shift+kółko lub poziome kółko robią to samo); przewijają się tylko wtedy, gdy jakąś część ustawiono szerzej, niż jest miejsca"
commit_column_2 = "wybierz część (linie grafu, autor, data), potem ją poszerz lub zwęź albo przywróć wszystkim częściom szerokość automatyczną; granice w nagłówku też można przeciągać, a szerokości są zapamiętywane"
commit_column_3 = { git = "mysz: kliknięcie wiersza wybiera jego commit, prawy przycisk otwiera jego menu (klawisz menu też, po wybraniu wiersza strzałkami Góra/Dół)", local = "mysz: kliknięcie wiersza wybiera jego zatwierdzenie, prawy przycisk otwiera jego menu (klawisz menu też, po wybraniu wiersza strzałkami Góra/Dół)" }
commit_column_4 = "przesuń wybraną część w lewo lub w prawo; przeciągnięcie jej nagłówka robi to samo, a kolejność jest zapamiętywana"
log_columns_1 = "wybierz kolumnę Logu (jej komórka nagłówka się podświetla); potem przesuń ją w lewo lub w prawo (przeciągnięcie nagłówka robi to samo), poszerz lub zwęź (przeciągnięcie jej granicy robi to samo) albo przywróć szerokość automatyczną. Tab / Shift+Tab wybierają inną kolumnę, Esc kończy; układ jest zapamiętywany"
global_1 = "otwórz paletę poleceń - każde polecenie w aplikacji wraz ze skrótem; pisz, by filtrować, Up/Down lub Ctrl+P/Ctrl+N poruszają (nie j/k: te są wpisywane), Enter uruchamia. Wyszarzone wiersze mówią, czemu nie można ich teraz uruchomić"
global_2 = "prefiks nawigacji - zob. jego własną sekcję poniżej"
global_3 = "prefiks akcji git - zob. jego własną sekcję poniżej"
global_4 = "przełącz tę nakładkę pomocy - otwiera się nad wszystkim innym (Ustawienia, zarządzanie repozytoriami, ...), nie tylko nad samym grafem"
global_5 = "wymuś odświeżenie"
global_6 = { git = "fetch, ponowne sprawdzenie {$prs} i zgłoszeń, przeładowanie", local = "pobranie, ponowne sprawdzenie {$prs} i zgłoszeń, przeładowanie" }
global_7 = { git = "cofnij / ponów ostatnią operację (commit, amend, checkout, tworzenie/usuwanie gałęzi); pyta najpierw, gdy jest ryzykowna", local = "cofnij / ponów ostatnią operację (zatwierdzenie, amend, checkout, tworzenie/usuwanie gałęzi); pyta najpierw, gdy jest ryzykowna" }
global_9 = { git = "zakończ - z grafu; nad diffem lub widokiem pliku zamyka ten widok. Każde wyjście jest zapisywane w gitpoulpi-tui-exit.log obok konfiguracji", local = "zakończ - z grafu; nad różnicami lub widokiem pliku zamyka ten widok. Każde wyjście jest zapisywane w gitpoulpi-tui-exit.log obok konfiguracji" }
global_10 = "otwórz menu kontekstowe wszędzie, gdzie istnieje poniżej - klawisze są wymienne (klawisz Menu/Apps rzadko dociera do tej aplikacji w Windows, więc tam niezawodny jest skrót F10)"
global_11 = "przejdź do następnego / poprzedniego panelu"
global_12 = "przesuń zaznaczenie (każdy panel i lista)"
global_13 = "prefiks liczby w stylu vim przed j/k/Up/Down (i PageUp/PageDown, jako liczba ekranów) - wpisane cyfry widać jako „4...” na pasku stanu, aż ruch nastąpi; Esc lub inny klawisz je czyści, a początkowe 0 nigdy go nie zaczyna (więc cyfry nadal normalnie wpisują się w kompozytorze, filtrze Refs i każdym innym polu tekstowym)"
global_14 = { git = "Refs: przełącz sekcję LOKALNE/ZDALNE/TAGS", local = "Refs: przełącz sekcję LOKALNE/ZDALNE/{$TAGS}" }
global_15 = { git = "Log: h = wyjdź z listy / l = wejdź do listy plików commita", local = "Log: h = wyjdź z listy / l = wejdź do listy plików zatwierdzenia" }
global_16 = { git = "Status: skocz do Unstaged / Staged", local = "Status: skocz do sekcji poza poczekalnią / w poczekalni" }
mouse_basics_1 = "zaznacz i aktywuj wiersz (każdy panel, lista, menu, okno); kółko przewija to, nad czym jest wskaźnik"
mouse_basics_2 = { git = "otwórz/aktywuj: ref LOKALNE/TAGS lub plakietka refu w wierszu Log robi checkout, zmieniony plik otwiera diff, wiersz repozytorium otwiera to repozytorium", local = "otwórz/aktywuj: ref LOKALNE/{$TAGS} lub plakietka refu w wierszu Log robi checkout, zmieniony plik otwiera różnice, wiersz repozytorium otwiera to repozytorium" }
mouse_basics_3 = "jedyny sygnał „można kliknąć”, jaki daje większość terminali (zob. „Najechanie i podpowiedzi” poniżej) - także pełne podpowiedzi nad komórkami Log i obciętymi plakietkami refów"
mouse_basics_4 = { git = "separator panelu, granica kolumny Log, dolna ramka sekcji Refs lub dolna ramka bloku opisu commita zmienia rozmiar (poniżej minimum zwija się); nagłówek kolumny Log przeciągnięty za sąsiada zmienia kolejność", local = "separator panelu, granica kolumny Log, dolna ramka sekcji Refs lub dolna ramka bloku opisu zatwierdzenia zmienia rozmiar (poniżej minimum zwija się); nagłówek kolumny Log przeciągnięty za sąsiada zmienia kolejność" }
mouse_basics_5 = "(prawy górny róg) zakończ, jak q - pokazywane tylko, gdy okno jest dość szerokie, by nie nachodzić na tytuł"
navigation_prefix_then_1 = "zwiń/przywróć panel Refs (lewy)"
navigation_prefix_then_2 = "zwiń/przywróć panel Status (prawy) - odpowiednik myszą: kliknij szewron na ramce panelu lub wąski pasek po zwinięciu"
navigation_prefix_then_3 = "powiększ aktywną sekcję Refs o wiersz ({{nav_prefix.shrink_section}} ją pomniejsza); przeciągnięcie dolnej ramki sekcji robi to samo, a rozmiar jest zapamiętywany"
navigation_prefix_then_4 = { git = "powiększ blok opisu commita w prawym panelu o wiersz ({{nav_prefix.shrink_message}} go pomniejsza); odpowiednik myszą: przeciągnij ramkę pod nim", local = "powiększ blok opisu zatwierdzenia w prawym panelu o wiersz ({{nav_prefix.shrink_message}} go pomniejsza); odpowiednik myszą: przeciągnij ramkę pod nim" }
navigation_prefix_then_5 = { git = "przejdź do tego podpanelu - każda sekcja Refs, pole filtra, Log (lub widok Diff, gdy tam jest otwarty), lista Historii pliku, każda połowa trzeciego panelu i pole Podsumowanie kompozytora, gdy jest miejsce, mają własną plakietkę: najpierw 1-9, potem a/b/c..., jeśli w tej klatce jest ich więcej niż dziewięć - plakietki są przydzielane od nowa przy każdym otwarciu prefiksu, więc czytaj znak, nie zapamiętuj cyfry", local = "przejdź do tego podpanelu - każda sekcja Refs, pole filtra, Log (lub widok różnic, gdy tam jest otwarty), lista Historii pliku, każda połowa trzeciego panelu i pole Podsumowanie kompozytora, gdy jest miejsce, mają własną plakietkę: najpierw 1-9, potem a/b/c..., jeśli w tej klatce jest ich więcej niż dziewięć - plakietki są przydzielane od nowa przy każdym otwarciu prefiksu, więc czytaj znak, nie zapamiętuj cyfry" }
navigation_prefix_then_6 = "otwórz ustawienia (jak koło zębate na pasku tytułu)"
navigation_prefix_then_16 = "otwórz okno „O programie” (jak ośmiornica na pasku tytułu)"
navigation_prefix_then_17 = "przesuń o jeden krok separator między panelem Refs a Log w lewo ({{nav_prefix.refs_narrower}}) lub w prawo ({{nav_prefix.refs_wider}}); zwinięty panel Refs wraca najpierw, a szerokość jest zapamiętywana"
navigation_prefix_then_18 = "przesuń o jeden krok separator między Log a prawym panelem w lewo ({{nav_prefix.status_wider}}) lub w prawo ({{nav_prefix.status_narrower}}); zwinięty panel wraca najpierw, a szerokość jest zapamiętywana"
navigation_prefix_then_7 = "przełącz tę pomoc (jak samo ?)"
navigation_prefix_then_8 = "wybierz kartę repozytorium do przełączenia - pisz, by filtrować, Up/Down lub Ctrl+P/Ctrl+N poruszają, Enter przełącza, kliknij wiersz, Esc zamyka"
workspace_search = "przeszukuje wszystkie repozytoria obszaru roboczego: gałęzie, {$tags}, worktree, {$stashes}, {$commits}, {$prs} i zgłoszenia - Enter przechodzi, Alt+1-8 przełącza rodzaje, b: t: c: s: w: r: pr: i: # zawęża, Esc zamyka"
navigation_prefix_then_9 = "pokaż widok zaproponowany przez agenta AI (chip na pasku stanu „... chce pokazać ...”), to samo co kliknięcie go"
navigation_prefix_then_10 = "odrzuć ten chip, a w przeciwnym razie wróć do widoku sprzed ostatniej zmiany agenta (także `Agent: Wstecz` w palecie)"
navigation_prefix_then_11 = "anuluj, wróć do zwykłego trybu"
navigation_prefix_then_12 = "wybierz motyw z listy - pisz, aby filtrować, podświetlony motyw widać na żywo, Enter go stosuje i zapisuje, Esc przywraca poprzedni (także `Aplikacja: Zmień motyw...` w palecie)"
navigation_prefix_then_13 = "wybierz język z listy - wpisz, aby filtrować, Enter go zastosuje i zapisze, Esc anuluje (także `Aplikacja: Zmień język...` w palecie)"
navigation_prefix_then_14 = "`Aplikacja: Zmień motyw kolorów grafu...`"
navigation_prefix_then_15 = "`Aplikacja: Przełącz zabarwienie wierszy grafu`"
git_actions_then_1 = { git = "stage zaznaczony plik unstaged (panel Status)", local = "dodaj zaznaczony plik spoza poczekalni (panel Status)" }
git_actions_then_2 = { git = "unstage zaznaczony plik staged (panel Status)", local = "usuń zaznaczony plik z poczekalni (panel Status)" }
git_actions_then_3 = { git = "stage wszystkie zmiany", local = "dodaj wszystkie zmiany do poczekalni" }
