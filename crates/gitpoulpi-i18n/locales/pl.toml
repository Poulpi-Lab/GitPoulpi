mouse_gestures_in_1 = { git = "terminale nie zmieniają kształtu wskaźnika systemu w większości przypadków, więc zmiana tła/pierwszego planu przy najechaniu jest często jedynym sygnałem „można kliknąć” - każdy przycisk, pole wyboru, karta, wiersz menu, akcja nagłówka panelu i przycisk zamknięcia × podświetla się przy najechaniu; komórka Log, inne refy commita i margines pliku/blame pokazują zamiast tego podpowiedź z wartością", local = "terminale nie zmieniają kształtu wskaźnika systemu w większości przypadków, więc zmiana tła/pierwszego planu przy najechaniu jest często jedynym sygnałem „można kliknąć” - każdy przycisk, pole wyboru, karta, wiersz menu, akcja nagłówka panelu i przycisk zamknięcia × podświetla się przy najechaniu; komórka Log, inne refy zatwierdzenia i margines pliku/blame pokazują zamiast tego podpowiedź z wartością" }
mouse_gestures_in_2 = { git = "separator panelu lub granica kolumny Log zmienia rozmiar (poniżej minimum panel się zwija); nagłówek kolumny Log przeciągnięty za sąsiada zmienia kolejność; przeciągnięcie refu na inną gałąź otwiera menu pasujących akcji (Esc anuluje)", local = "separator panelu lub granica kolumny Log zmienia rozmiar (poniżej minimum panel się zwija); nagłówek kolumny Log przeciągnięty za sąsiada zmienia kolejność; przeciągnięcie refu na inną gałąź otwiera menu pasujących akcji (Esc anuluje)" }
mouse_gestures_in_3 = { git = "przeciągnięcie po tekście diffa, widoku pliku, Blame lub Historii pliku zaznacza go, podwójne kliknięcie słowo; y lub Ctrl+C kopiuje (tylko tekst pliku, nigdy marginesy); inne wystąpienia zaznaczonego słowa są podświetlone w diffie i edytorze (i zaznaczone na linijce)", local = "przeciągnięcie po tekście różnic, widoku pliku, Blame lub Historii pliku zaznacza go, podwójne kliknięcie słowo; y lub Ctrl+C kopiuje (tylko tekst pliku, nigdy marginesy); inne wystąpienia zaznaczonego słowa są podświetlone w różnicach i edytorze (i zaznaczone na linijce)" }
mouse_gestures_in_4 = { git = "przewija listę lub diff z fokusem/pod wskaźnikiem; Shift+kółko (obie pisownie, jakie zgłaszają terminale) przewija diff/widok pliku/blame *w poziomie*, gdy zawijanie jest wyłączone", local = "przewija listę lub różnice z fokusem/pod wskaźnikiem; Shift+kółko (obie pisownie, jakie zgłaszają terminale) przewija różnice/widok pliku/blame *w poziomie*, gdy zawijanie jest wyłączone" }
mouse_gestures_in_5 = "otwiera menu kontekstowe wszędzie, gdzie istnieje (zob. sekcję każdego panelu powyżej); odpowiednik z klawiatury to zawsze {{*global.context_menu}}"
mouse_gestures_in_6 = "każda akcja „Kopiuj ...” prosi *terminal* o schowek przez OSC 52 - TUI nie sięga do niego bezpośrednio; terminal ignorujący tę sekwencję po prostu nie kopiuje"
mouse_gestures_in_7 = "wskazówki zmiany rozmiaru/wskaźnika/otwartej dłoni są wysyłane przez OSC 22 w terminalach, które to obsługują (kitty, foot, xterm; nierówno gdzie indziej) - przeciągalne separatory i granice kolumn podświetlają się też we własnym buforze aplikacji, co nie wymaga żadnej współpracy terminala"
git_actions_then_25 = "otwórz menu LFS (przycisk LFS na pasku; jego pozycje są też w palecie)"
git_actions_then_26 = { git = "LFS: fetch obiektów wszystkich refów", local = "LFS: pobierz obiekty wszystkich refów" }
git_actions_then_27 = "LFS: zapisz prawdziwą zawartość w miejsce wskaźników (offline)"
git_actions_then_28 = { git = "LFS: pull (pobierz, potem zapisz zawartość)", local = "LFS: ściągnij (pobierz, potem zapisz zawartość)" }
git_actions_then_29 = { git = "LFS: push obiektów wszystkich refów", local = "LFS: wypchnij obiekty wszystkich refów" }
git_actions_then_30 = "LFS: wyczyść lokalny magazyn LFS"
diff_view_encoding = "wybierz kodowanie, w jakim czytany jest plik (Wykryj automatycznie, UTF-8, UTF-16, Windows-1252, ...)"
commit_composer_bottom_14 = { git = "przełącz „Pomiń hooki”: commit powstaje bez uruchamiania hooków gita (panel Status)", local = "przełącz „Pomiń hooki”: zatwierdzenie powstaje bez uruchamiania hooków gita (panel Status)" }
repositories_and_tabs_39 = "filtruj wpisy folderu w trakcie pisania (bez rozróżniania wielkości liter; gdy fokus jest na liście po lewej lub na zawartości, `/` też przenosi go do pola; Enter lub Down przeskakuje do pierwszego dopasowania, Esc czyści filtr; po zmianie folderu filtr się opróżnia)"
repositories_and_tabs_40 = "przełącz Pokaż foldery sąsiednie (lewe drzewo wypisuje też pozostałe foldery każdego otwartego poziomu - zapamiętywane)"
split_1 = { git = "przypisuje zaznaczony plik, hunk lub linię do tego commita (0 zostawia bez przypisania, n wstawia do nowego commita); Tab przełącza między commitami a zmianami, Enter lub e edytuje opis, d usuwa commit; {{compose.apply}} wykonuje podział", local = "przypisuje zaznaczony plik, hunk lub linię do tego zatwierdzenia (0 zostawia bez przypisania, n wstawia do nowego zatwierdzenia); Tab przełącza między zatwierdzeniami a zmianami, Enter lub e edytuje opis, d usuwa zatwierdzenie; {{compose.apply}} wykonuje podział" }
split_2 = "zaznacza pojedyncze linie w bieżącym hunku (Shift+Up/Down rozszerza zaznaczenie)"
split_3 = { git = "przesuwa commit w górę lub w dół listy (K i J robią to samo)", local = "przesuwa zatwierdzenie w górę lub w dół listy (K i J robią to samo)" }
split_4 = "przywraca każdą zmianę do stanu z chwili otwarcia edytora"
split_5 = { git = "dzieli commit według planu w obecnej postaci; dopóki plan jest nieprawidłowy, przycisk jest wyłączony, a pasek stanu podaje powód", local = "dzieli zatwierdzenie według planu w obecnej postaci; dopóki plan jest nieprawidłowy, przycisk jest wyłączony, a pasek stanu podaje powód" }
split_6 = "przełącza pole „Podpisz {$commits}” (po otwarciu edytora jest włączone, jeśli ustawienie gpgSign repozytorium ma wartość true)"
split_7 = { git = "w panelu commitów zaznacza ten commit; m lub Enter na zmianie pokazuje listę commitów, którym można ją przekazać", local = "w panelu zatwierdzeń zaznacza to zatwierdzenie; m lub Enter na zmianie pokazuje listę zatwierdzeń, którym można ją przekazać" }
rewrite_9 = "otwiera kartę Rozmiar i analizuje historię: największe pliki i foldery oraz pliki usunięte, ale wciąż przechowywane; zaznaczone wiersze zamieniają się w reguły usuwania"
rewrite_host_howto = { git = "wyjaśnia, jak przepchnąć przepisaną historię przez gałąź chronioną przez hosta: zdjąć ochronę, zrobić push pod nową nazwą albo utworzyć repozytorium od nowa; niczego nie robi za ciebie", local = "wyjaśnia, jak przepchnąć przepisaną historię przez gałąź chronioną przez hosta: zdjąć ochronę, wypchnąć pod nową nazwą albo utworzyć repozytorium od nowa; niczego nie robi za ciebie" }
rewrite_ai_rules = "tworzy z AI reguły przepisania na podstawie twojego opisu (niczego nie podgląda ani nie stosuje)"
log_columns_2 = "scroll the Log's columns sideways when they keep their widths (the Scroll sideways layout, chosen in the column chooser, in Settings or with s while a column is picked); in the fit layout every column fits the pane"

