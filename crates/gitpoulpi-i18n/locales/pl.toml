start_1 = { git = "Okno|Karty na górze (Home wyświetla, otwiera i klonuje repozytoria), potem pasek narzędzi, po lewej panel Refs, pośrodku Log, a po prawej zmiany i formularz commita.", local = "Okno|Karty na górze (Home wyświetla, otwiera i klonuje repozytoria), potem pasek narzędzi, po lewej panel Refs, pośrodku Log, a po prawej zmiany i formularz zatwierdzenia." }
start_2 = "Paleta poleceń|Ctrl+P wyświetla każdą akcję z jej skrótem. Pisz, by szukać, Enter uruchamia. Wszystko, co robi mysz, robi też paleta."
start_3 = "Prefiksy skrótów|Ctrl+G, a potem klawisz uruchamia akcję git ({$stage}, {$commit}, {$pull}, {$push}...). Ctrl+N, a potem klawisz przesuwa lub zmienia widok. Pasek stanu wyświetla wybory."
start_4 = "Karty|Jedna karta na repozytorium. Ctrl+PgUp / Ctrl+PgDn przełączają, Ctrl+W zamyka, t otwiera wybór kart, prawy przycisk myszy na karcie lub Ctrl+T otwiera jej menu."
start_5 = "Mysz i klawisze|Kliknięcie zaznacza, podwójne kliknięcie otwiera lub robi checkout, prawy przycisk myszy (lub .) otwiera menu, przeciąganie przenosi refy i wiersze {$rebase}. Każda akcja myszą ma klawisz."
start_6 = "Odświeżanie i cofanie|r odświeża, F5 przeładowuje wszystko, Ctrl+Z / Ctrl+Y cofają i ponawiają ostatnią operację, q kończy."
log_1 = { git = "Czytanie grafu|Jeden wiersz na commit, jeden tor na gałąź. Pierwszy wiersz to twoja niezatwierdzona praca (WIP): zaznacz go, by zobaczyć zmiany. Kliknięcie wiersza pokazuje szczegóły po prawej.", local = "Czytanie grafu|Jeden wiersz na zatwierdzenie, jeden tor na gałąź. Pierwszy wiersz to twoja niezatwierdzona praca (WIP): zaznacz go, by zobaczyć zmiany. Kliknięcie wiersza pokazuje szczegóły po prawej." }
log_2 = "Szukanie|f (lub przycisk Szukaj) przyciemnia wiersze niepasujące do opisu, autora, hasha lub refa. Enter / Shift+Enter skaczą do następnego / poprzedniego trafienia. / filtruje panel Refs."
log_3 = { git = "Menu commita|Prawy przycisk myszy na commicie lub . na nim: cherry-pick, revert, reset, edycja opisu, utworzenie gałęzi lub tagu, checkout, worktree, patch, kopiowanie.", local = "Menu zatwierdzenia|Prawy przycisk myszy na zatwierdzeniu lub . na nim: cherry-pick, revert, reset, edycja opisu, utworzenie gałęzi lub znacznika, checkout, worktree, patch, kopiowanie." }
log_4 = { git = "Interaktywny rebase|„Interaktywny rebase stąd...” w menu commita: ustaw każdemu commitowi pick, reword, squash, fixup, drop lub edit, zmień kolejność Ctrl+Up/Down, uruchom Ctrl+S, wyjdź Esc.", local = "Interaktywny rebase|„Interaktywny rebase stąd...” w menu zatwierdzenia: ustaw każdemu zatwierdzeniu akcję ({$pick}, {$reword}, {$squash}, {$fixup}, {$drop} lub {$edit}), zmień kolejność Ctrl+Up/Down, uruchom Ctrl+S, wyjdź Esc." }
log_5 = { git = "Wiele commitów|Ctrl+klik przełącza commit, Shift+klik (Alt+klik) zaznacza zakres, Space przełącza bieżący, Esc czyści. Potem prawy przycisk myszy: cherry-pick lub revert całego zaznaczenia.", local = "Wiele zatwierdzeń|Ctrl+klik przełącza zatwierdzenie, Shift+klik (Alt+klik) zaznacza zakres, Space przełącza bieżące, Esc czyści. Potem prawy przycisk myszy: cherry-pick lub revert całego zaznaczenia." }
log_6 = { git = "Przeciąganie refów|Przeciągnij gałąź na inną, by zrobić merge, rebase lub fast-forward, albo na gałąź zdalną, by zrobić push; puść i wybierz z menu, Esc anuluje. Klawiatura: paleta, „Refs: Upuść zaznaczony ref na bieżącą gałąź...”.", local = "Przeciąganie refów|Przeciągnij gałąź na inną, by ją scalić, zrobić rebase lub fast-forward, albo na gałąź zdalną, by ją wypchnąć; puść i wybierz z menu, Esc anuluje. Klawiatura: paleta, „Refs: Upuść zaznaczony ref na bieżącą gałąź...”." }
changes_1 = { git = "Bieżące zmiany|Zaznacz pierwszy wiersz Logu (WIP): pliki unstaged i staged pojawią się po prawej. m przełącza Ścieżka / Drzewo, a pokazuje wszystkie pliki, z zwija foldery.", local = "Bieżące zmiany|Zaznacz pierwszy wiersz Logu (WIP): pliki spoza poczekalni i z poczekalni pojawią się po prawej. m przełącza Ścieżka / Drzewo, a pokazuje wszystkie pliki, z zwija foldery." }
changes_2 = { git = "Stage i unstage|Ctrl+Space na pliku, jego przycisk lub Ctrl+G s; Ctrl+G a dla wszystkiego, Ctrl+G u, by zrobić unstage. Prawy przycisk myszy na pliku: odrzuć, historia lub blame, otwórz w edytorze.", local = "Poczekalnia|Ctrl+Space na pliku, jego przycisk lub Ctrl+G s; Ctrl+G a dla wszystkiego, Ctrl+G u, by usunąć z poczekalni. Prawy przycisk myszy na pliku: odrzuć, historia lub blame, otwórz w edytorze." }
changes_3 = { git = "Czytanie diffa|Kliknij plik lub naciśnij d. m przełącza układ w linii / obok siebie, w zawija wiersze, s pomija białe znaki, n / p skaczą między hunkami, Esc lub q wraca do Logu.", local = "Czytanie różnic|Kliknij plik lub naciśnij d. m przełącza układ w linii / obok siebie, w zawija wiersze, s pomija białe znaki, n / p skaczą między hunkami, Esc lub q wraca do Logu." }
changes_4 = { git = "Hunki i linie|W diffie: Space = stage hunka, v potem j / k potem Enter = stage zaznaczonych linii, x = odrzuć hunk. Odrzucenie pyta najpierw; Ctrl+Z przywraca.", local = "Hunki i linie|W różnicach: Space = dodaj hunk do poczekalni, v potem j / k potem Enter = dodaj zaznaczone linie, x = odrzuć hunk. Odrzucenie pyta najpierw; Ctrl+Z przywraca." }
changes_5 = { git = "Pisanie commita|Wpisz podsumowanie i opis, potem Ctrl+Enter lub zielony przycisk. Shift+A poprawia ostatni commit. Ctrl+G c ustawia kursor w formularzu, Esc go opuszcza.", local = "Zatwierdzanie|Wpisz podsumowanie i opis, potem Ctrl+Enter lub zielony przycisk. Shift+A poprawia ostatnie zatwierdzenie. Ctrl+G c ustawia kursor w formularzu, Esc go opuszcza." }
changes_6 = { git = "Konflikty merge|Baner proponuje „Rozwiąż konflikty...”. W edytorze merge wybierz A, B lub oba dla każdego konfliktu (a / b / c), edytuj Wynik, zapisz, potem Kontynuuj.", local = "Konflikty scalania|Baner proponuje „Rozwiąż konflikty...”. W edytorze scalania wybierz A, B lub oba dla każdego konfliktu (a / b / c), edytuj Wynik, zapisz, potem Kontynuuj." }
changes_7 = { git = "Cofnij i ponów|Ctrl+Z / Ctrl+Y lub przyciski paska cofają i ponawiają większość operacji: commity, gałęzie, checkouty, resety, stashe, odrzucenia. Przy ryzyku pyta najpierw.", local = "Cofnij i ponów|Ctrl+Z / Ctrl+Y lub przyciski paska cofają i ponawiają większość operacji: zatwierdzenia, gałęzie, checkouty, resety, schowki, odrzucenia. Przy ryzyku pyta najpierw." }
refs_1 = { git = "Gałęzie i tagi|Podwójne kliknięcie lokalnej gałęzi lub tagu robi checkout; prawy przycisk myszy otwiera menu (merge, rebase, zmiana nazwy, usuwanie...). Ctrl+G b i Ctrl+G t tworzą gałąź lub tag w miejscu bieżącego commita.", local = "Gałęzie i znaczniki|Podwójne kliknięcie lokalnej gałęzi lub znacznika robi checkout; prawy przycisk myszy otwiera menu (scalenie, rebase, zmiana nazwy, usuwanie...). Ctrl+G b i Ctrl+G t tworzą gałąź lub znacznik w miejscu bieżącego zatwierdzenia." }
refs_2 = { git = "Solo i ukrywanie|Klawisz o pokazuje tylko commity zaznaczonego refa, Shift+O kończy. Menu refa ukrywa go w grafie; Shift+H pokazuje wszystko znowu. Tylko widok: repozytorium się nie zmienia.", local = "Solo i ukrywanie|Klawisz o pokazuje tylko zatwierdzenia zaznaczonego refa, Shift+O kończy. Menu refa ukrywa go w grafie; Shift+H pokazuje wszystko znowu. Tylko widok: repozytorium się nie zmienia." }
refs_3 = { git = "Fetch, pull, push|Ctrl+G f: fetch wszystkich zdalnych. Ctrl+G p: pull. Ctrl+G Shift+P: push. Strzałka obok przycisku wybiera inny sposób lub inne zdalne.", local = "Pobieranie, ściąganie, wypychanie|Ctrl+G f: pobierz ze wszystkich zdalnych. Ctrl+G p: ściągnij. Ctrl+G Shift+P: wypchnij. Strzałka obok przycisku wybiera inny sposób lub inne zdalne." }
refs_4 = { git = "Zdalne|Plus w tytule ZDALNE dodaje zdalne. Prawy przycisk myszy na zdalnym: fetch, kopiowanie linku, edycja URL-i lub usunięcie.", local = "Zdalne|Plus w tytule ZDALNE dodaje zdalne. Prawy przycisk myszy na zdalnym: pobieranie, kopiowanie linku, edycja URL-i lub usunięcie." }
refs_5 = { git = "Stashe i worktree|Przyciski Stash i Pop; Ctrl+G m najpierw pyta o opis. Prawy przycisk myszy na stashu, by zrobić apply lub drop. „Utwórz worktree z...” otwiera gałąź we własnej karcie.", local = "Schowki i worktree|Przyciski Schowek i Pop; Ctrl+G m najpierw pyta o opis. Prawy przycisk myszy na schowku, by go zastosować lub porzucić. „Utwórz worktree z...” otwiera gałąź we własnej karcie." }
refs_6 = "Submoduły i LFS|Sekcja SUBMODUŁY pojawia się, gdy są submoduły: podwójne kliknięcie otwiera submoduł jako kartę, prawy przycisk myszy go aktualizuje. Akcje Git LFS: przycisk LFS lub Ctrl+G l."
hosting_1 = "Połączenie|Ustawienia > Integracje: wklej osobisty token do GitHub lub GitLab. Konto nie jest potrzebne; token trafia do systemowego menedżera poświadczeń."
hosting_2 = "Powiązanie repozytorium|W sekcjach {$PRS} i ZGŁOSZENIA panelu bocznego wybierz jednego z dostawców z listy. Nic nie łączy się samo; powiązanie zapisuje się dla każdego repozytorium osobno."
hosting_3 = "Utwórz {$pr}|Plus w nagłówku {$PRS} lub n w tej sekcji otwiera formularz; menu gałęzi ma „Rozpocznij {$pr} z...”. AI może napisać tytuł i opis."
hosting_4 = "Zgłoszenia|Sekcja ZGŁOSZENIA je wyświetla; + lub n tworzy nowe. Menu wiersza otwiera zgłoszenie w przeglądarce lub działa na nim."
hosting_5 = { git = "Odwołania|Odwołania do zgłoszeń i {$prs} (#12, !53, ABC-7) w opisie commita lub nazwie gałęzi są rozpoznawane. Alt+R w formularzu commita wstawia odwołanie.", local = "Odwołania|Odwołania do zgłoszeń i {$prs} (#12, !53, ABC-7) w opisie zatwierdzenia lub nazwie gałęzi są rozpoznawane. Alt+R w formularzu zatwierdzenia wstawia odwołanie." }
hosting_6 = "Chip na pasku|Po lewej stronie paska chip pokazuje {$pr} bieżącej gałęzi (GH #12, GL !53) lub przygaszony „+ {$pr_abbr}”, by go rozpocząć. Kliknij go."
hosting_7 = "Klucze SSH|Wybierz klucz SSH dla profilu (Ustawienia > Profile) lub dla repozytorium (menu karty > „Klucz SSH...”). Hasła zostają w systemowym ssh-agent."
setup_1 = "Ustawienia|Ctrl+, lub koło zębate. Tab przełącza między listą stron a opcjami, j / k przesuwają, Enter lub Space zmienia wartość, / lub Ctrl+F przeszukuje wszystkie opcje, Esc zamyka."
setup_2 = "Motywy|Ustawienia > Wygląd > Motyw: ciemny, jasny, zgodny z terminalem lub jeden z wielu gotowych. Ctrl+N i klawisz zmienia też motyw, język i kolory grafu bez otwierania Ustawień."
setup_3 = "Język|Ustawienia > Ogólne > Język oferuje 17 języków. „Tłumacz terminy git” decyduje, czy własne słowa gita ({$commit}, {$push}...) też są tłumaczone."
setup_4 = { git = "Profile|Ustawienia > Profile zawiera tożsamości autora commitów (imię, e-mail, klucz SSH). Pole profilu na pasku wybiera tożsamość dla tego repozytorium.", local = "Profile|Ustawienia > Profile zawiera tożsamości autora zatwierdzeń (imię, e-mail, klucz SSH). Pole profilu na pasku wybiera tożsamość dla tego repozytorium." }
setup_5 = "Otwórz w|Przycisk Otwórz w (Alt+O) otwiera folder tej karty w terminalu, edytorze lub menedżerze plików. Ustawienia > Otwórz w edytuje listę."
setup_6 = "Skróty klawiszowe|Ustawienia > Klawiatura i mysz zmienia przypisanie dowolnego klawisza. Karta Klawisze tej pomocy pokazuje twoje własne skróty."
tools_1 = "AI (opcjonalne)|Wyłączone, dopóki nie skonfigurujesz w Ustawienia > AI: usługa zgodna z OpenAI, Anthropic lub lokalny agent jak claude -p. Konto GitPoulpi nigdy nie jest potrzebne."
tools_2 = { git = "Akcje AI|Przycisk iskry przy podsumowaniu lub Ctrl+G i pisze opis commita; Ctrl+G w wyjaśnia zmiany; Ctrl+G C dzieli pracę na kilka commitów; Alt+I proponuje rozwiązanie konfliktu. Nic nie jest stosowane bez twojego potwierdzenia.", local = "Akcje AI|Przycisk iskry przy podsumowaniu lub Ctrl+G i pisze opis zatwierdzenia; Ctrl+G w wyjaśnia zmiany; Ctrl+G C dzieli pracę na kilka zatwierdzeń; Alt+I proponuje rozwiązanie konfliktu. Nic nie jest stosowane bez twojego potwierdzenia." }
tools_3 = "CLI|gitpoulpi <polecenie> robi ze skryptu to, co okno, przez tego samego demona, więc zmiany widać na żywo. --json daje wynik dla maszyn, --help wymienia opcje."
tools_4 = "MCP|gitpoulpi mcp serve --stdio daje agentom AI jedno narzędzie na polecenie CLI. Ustawienia > Agenci i MCP określa, co mogą zmieniać."
tools_5 = "Nakładka powłoki|Z nakładką powłoki gp „Zakończ i cd tutaj” zostawia powłokę w folderze aktywnej karty po zamknięciu GitPoulpi."

