[_meta]
language_name = "Polski"

# `git`: angielskie słownictwo (domyślne). `local`: polskie słownictwo gita
# (ustawienie „Tłumacz terminy git”), w mianowniku, by pasowało do każdego zdania.
[term]
commit = { git = "commit", local = "zatwierdzenie" }
commits = { git = "commity", local = "zatwierdzenia" }
push = { git = "push", local = "wypchnij" }
pull = { git = "pull", local = "ściągnij" }
fetch = { git = "fetch", local = "pobierz" }
merge = { git = "merge", local = "scalenie" }
rebase = { git = "rebase", local = "rebase" }
cherry_pick = { git = "cherry-pick", local = "cherry-pick" }
stash = { git = "stash", local = "schowek" }
stashes = { git = "stashe", local = "schowki" }
pop = { git = "pop", local = "przywróć" }
apply = { git = "apply", local = "zastosuj" }
stash_drop = { git = "drop", local = "porzuć" }
tag = { git = "tag", local = "znacznik" }
tags = { git = "tagi", local = "znaczniki" }
head = { git = "HEAD", local = "HEAD" }
diff = { git = "diff", local = "różnice" }
pr = { git = { pull = "pull request", merge = "merge request" }, local = { pull = "żądanie scalenia", merge = "żądanie scalenia" } }
prs = { git = { pull = "pull requesty", merge = "merge requesty" }, local = { pull = "żądania scalenia", merge = "żądania scalenia" } }
