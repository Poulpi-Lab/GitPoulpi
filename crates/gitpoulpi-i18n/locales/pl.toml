repo_data_location = "Lokalizacja danych repozytorium"
# context: help of the setting above
repo_data_location_help = "Gdzie przechowywane są dane poszczególnych repozytoriów (filtry refów, workflow, pamięci podręczne). Wewnątrz .git drzewo robocze pozostaje czyste; zmiana tego ustawienia przenosi istniejące dane."
# context: option of the repository data location: inside the repository's .git folder
repo_data_in_git_dir = "Wewnątrz .git (folder gitpoulpi)"
# context: option of the repository data location: a .gitpoulpi folder in the working tree
repo_data_in_worktree = "W drzewie roboczym (folder .gitpoulpi)"
# context: option of the repository data location: the user's own data folder
repo_data_user_data = "W moim folderze danych użytkownika (poza repozytorium)"
log_max_file_mb = "Maksymalny rozmiar pliku dziennika"
log_timings = "Pokaż czas trwania operacji"
log_timings_help = "Dodaje czas trwania w milisekundach do każdej operacji w dzienniku aktywności (karta „Operacje git”)."
log_extended = "Rozszerzone logowanie"
log_extended_help = { git = "Wypisuje też operacje w tle (automatyczny {$fetch}, odświeżanie, sprawdzanie stanu) z czasem trwania.", local = "Wypisuje też operacje w tle (automatyczne pobieranie, odświeżanie, sprawdzanie stanu) z czasem trwania." }
# context: setting: how the status line counts the total commits (the dropdown choices are in settings_value)
commit_count = "Metoda liczenia: {$commits}"
# context: help of the setting above; mentions antivirus software
commit_count_help = "Jak pasek stanu ustala łączną liczbę w „wczytane / łącznie”. System git uruchamia jeden proces git (zwykle najszybciej). libgit2 liczy wewnątrz GitPoulpi i nie uruchamia żadnego procesu: wybierz je, gdy oprogramowanie antywirusowe skanuje każde polecenie i spowalnia git. Wyłączone pokazuje tylko wczytane {$commits}. Działa od razu."
auto_stash = { git = "Auto-stash przed checkout, pull, merge lub rebase", local = "Automatyczny schowek przed checkoutem, ściągnięciem, scaleniem lub rebase" }
auto_stash_help = { git = "Co zrobić, gdy checkout, pull, merge lub rebase blokują lokalne zmiany. pytaj: okno proponuje zrobić stash, wykonać operację i zrobić pop; zawsze: robi to bez pytania; nigdy: odmawia, tak jak git.", local = "Co zrobić, gdy checkout, ściągnięcie, scalenie lub rebase blokują lokalne zmiany. pytaj: okno proponuje schować zmiany, wykonać operację i przywrócić je; zawsze: robi to bez pytania; nigdy: odmawia, tak jak git." }
include_untracked_in_autostash = { git = "Uwzględnij nieśledzone pliki w auto-stash", local = "Uwzględnij nieśledzone pliki w automatycznym schowku" }
include_untracked_in_autostash_help = { git = "Czy automatyczny stash obejmuje też nieśledzone pliki (inaczej chowane i przywracane są tylko śledzone zmiany).", local = "Czy automatyczny schowek obejmuje też nieśledzone pliki (inaczej chowane i przywracane są tylko śledzone zmiany)." }
hosting_refresh_minutes = "Odświeżanie: {$prs} i zgłoszenia"
hosting_refresh_minutes_help = { git = "Jak często listy {$prs} i zgłoszeń na pasku bocznym (oraz chip powiązanego {$pr_abbr} na pasku narzędzi) pytają hosta ponownie. 0 wyłącza zegar; nadal odświeżają się po otwarciu repozytorium, zmianie gałęzi, push lub fetch i na żądanie.", local = "Jak często listy w sekcjach {$PRS} i ZGŁOSZENIA na pasku bocznym (oraz chip powiązanego {$pr_abbr} na pasku narzędzi) pytają hosta ponownie. 0 wyłącza zegar; nadal odświeżają się po otwarciu repozytorium, zmianie gałęzi, wypchnięciu lub pobraniu i na żądanie." }
pr_terminology = "Terminologia żądań przeglądu"
pr_terminology_help = "Słowo używane w całym TUI na hostowane żądanie przeglądu kodu. Auto podąża za hostem repozytorium: Merge Request dla GitLaba, Pull Request dla pozostałych. Pull Request lub Merge Request wymusza to słowo. Działa od razu."
hide_finished_pr_chip = { git = "Ukryj chip {$pr} po jego zamknięciu lub merge", local = "Ukryj chip {$pr} po jego zamknięciu lub scaleniu" }
hide_finished_pr_chip_help = { git = "Chip na pasku narzędzi pokazuje najnowszy {$pr} aktywnej gałęzi. Włączone: po zamknięciu lub merge tego {$pr} chip znika, a gałąź pokazuje przyciemniony chip „+ {$pr_abbr}”, tak jakby go nie miała. Wyłączone: chip zawsze pokazuje najnowszy {$pr}, niezależnie od jego stanu. Działa od razu.", local = "Chip na pasku narzędzi pokazuje najnowsze {$pr} aktywnej gałęzi. Włączone: po zamknięciu lub scaleniu tego {$pr} chip znika, a gałąź pokazuje przyciemniony chip „+ {$pr_abbr}”, tak jakby go nie miała. Wyłączone: chip zawsze pokazuje najnowsze {$pr}, niezależnie od jego stanu. Działa od razu." }
heading_external_tools = "Narzędzia zewnętrzne"
external_editor = "Zewnętrzny edytor"
external_editor_help = "Polecenie dla pozycji menu pliku „Otwórz w <edytor>”; {{file}} to pełna ścieżka pliku (dopisywana, gdy jej brak). Puste: VS Code (`code`), gdy jest w PATH, w przeciwnym razie domyślny program systemu."
external_diff_tool = { git = "Zewnętrzne narzędzie diff", local = "Zewnętrzne narzędzie porównywania" }
external_diff_tool_help = { git = "Polecenie dla „Otwórz w zewnętrznym narzędziu diff”; {{local}} to wersja zatwierdzona (lub staged), {{remote}} porównywana wersja. Puste: `git difftool` z `diff.tool` skonfigurowanym w git.", local = "Polecenie dla „Otwórz w zewnętrznym narzędziu porównywania”; {{local}} to wersja zatwierdzona (lub w poczekalni), {{remote}} porównywana wersja. Puste: `git difftool` z `diff.tool` skonfigurowanym w git." }
external_merge_tool = { git = "Zewnętrzne narzędzie merge", local = "Zewnętrzne narzędzie scalania" }
external_merge_tool_help = { git = "Polecenie dla „Otwórz w zewnętrznym narzędziu merge” na karcie konfliktu; {{base}}, {{local}} (A, bieżący), {{remote}} (B, przychodzący) i {{merged}} (gdzie narzędzie zapisuje wynik; jest staged po pomyślnym zakończeniu). Puste: `git mergetool` z `merge.tool` skonfigurowanym w git.", local = "Polecenie dla „Otwórz w zewnętrznym narzędziu scalania” na karcie konfliktu; {{base}}, {{local}} (A, bieżący), {{remote}} (B, przychodzący) i {{merged}} (gdzie narzędzie zapisuje wynik; trafia do poczekalni po pomyślnym zakończeniu). Puste: `git mergetool` z `merge.tool` skonfigurowanym w git." }
file_explorer = "Eksplorator plików"
file_explorer_help = "Polecenie dla „Pokaż w folderze”; {{path}} to pełna ścieżka pliku, {{dir}} jego folder. Windows: explorer.exe /select,\"{{path}}\" zaznacza plik; Linux: xdg-open \"{{dir}}\"; macOS: open -R \"{{path}}\"."
ai_assistant = "Asystent AI"
launch = "Otwórz okno dla agentów"
launch_help = "Gdy agent AI prosi o pokazanie czegoś, a nigdzie nie jest otwarte okno GitPoulpi, uruchom to, by je otworzyć: off (nigdy, domyślnie), terminal (kitty, foot, WezTerm, Windows Terminal, ...), nowa karta/panel/obszar w multiplekserze (tmux, zellij, cmux, ...) lub custom, który używa szablonu poniżej. Agent nadal musi o to poprosić (`--launch`) albo jego ui_control musi być auto. Działa od następnego żądania."
launch_command = "Polecenie uruchomienia (custom)"
launch_command_help = "Używane, gdy wybór powyżej to custom. Dzielone na argumenty (cudzysłowy '...' lub \"...\"), bez powłoki. {{repo}} to folder repozytorium, {{session}} nazwa sesji, a {{gitpoulpi}} ten program. Przykład: kitty --directory {{repo}} {{gitpoulpi}} --session {{session}}"
tab_dir_follow = "Podążaj za folderem aktywnej karty"
tab_dir_follow_help = "Program nie może zmienić folderu swojej powłoki, więc są dwa sposoby, by tam dotrzeć. przyciski (domyślnie): gdy aktywna karta nie jest folderem, w którym uruchomiono GitPoulpi, pasek kart pokazuje Zakończ i cd tutaj (tylko po uruchomieniu przez nakładkę powłoki, zob. `gitpoulpi shell-init`). auto: bez przycisków; zamknięcie zawsze przenosi powłokę do aktywnej karty, a terminal otwiera się sam przy każdej nowej karcie (nie dla kart przywróconych przy starcie)."
forget_all_usernames_and_passwords = "Zapomnij wszystkie nazwy użytkowników i hasła"
forget_all_usernames_and_passwords_help = "Usuwa każdy token zapisany przez GitPoulpi w twoim menedżerze poświadczeń."
mcp_server = "Serwer MCP"
mcp_server_help = "Włączone: agent AI może uruchomić serwer MCP (`gitpoulpi mcp serve` lub `--http` dla punktu dostępu w sieci). Wyłączone: odmawia startu. Zapisywane jako `mcp.enabled`. Zmiana działa od następnego uruchomienia serwera przez agenta; już działający serwer zachowuje swoje ustawienia."
mcp_port = "Port serwera MCP"
mcp_port_help = "Port, na którym nasłuchuje `gitpoulpi mcp serve --http`, gdy nie podano adresu (część hosta z `mcp.bind` zostaje, domyślnie 127.0.0.1, tylko loopback, chyba że --allow-remote). Działa od następnego uruchomienia serwera przez agenta; działający serwer zachowuje swój port."
mcp_bind_unreadable = "`mcp.bind` ma wartość „{bind}”, w której nie da się odczytać portu. Ustawienie portu tutaj zachowuje jej host i zastępuje resztę."
undo_off_note = "Cofanie jest wyłączone - zaznacz „Cofanie włączone”, by ustawić głębokość"
use_mailmap = "Pokaż autorów przez .mailmap"
use_mailmap_help = "Pokazuje każdego autora tak, jak nazywa go .mailmap repozytorium: w Logu, blame i historii pliku. Same {$commits} nie są zmieniane. Działa od razu."
auto_prune_tags = { git = "Auto-prune tagów", local = "Auto-prune znaczników" }
auto_prune_tags_help = { git = "Przy każdym fetchu usuwa też lokalne tagi, które zniknęły ze zdalnego repozytorium. Dotyczy tylko tych, które były na zdalnym: tag, którego nigdy nie wypchnięto, zostaje. Domyślnie wyłączone, tak jak w samym git.", local = "Przy każdym pobraniu usuwa też lokalne znaczniki, które zniknęły ze zdalnego repozytorium. Dotyczy tylko tych, które były na zdalnym: znacznik, którego nigdy nie wypchnięto, zostaje. Domyślnie wyłączone, tak jak w samym git." }

