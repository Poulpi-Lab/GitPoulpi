lazy_load_commits_in_graph_help = { git = "Wyłączone: graf kończy się na początkowych commitach powyżej, a przewijanie nie dosięga starszych.", local = "Wyłączone: graf kończy się na początkowych zatwierdzeniach powyżej, a przewijanie nie dosięga starszych." }
