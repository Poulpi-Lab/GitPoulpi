git_actions_then_20 = "rebase bieżącej gałęzi na zaznaczony ref (panel Refs)"
git_actions_then_21 = { git = "edytuj opis zaznaczonego commita - zob. „Edycja opisu commita” poniżej", local = "edytuj opis zaznaczonego zatwierdzenia - zob. „Edycja opisu zatwierdzenia” poniżej" }
git_actions_then_22 = { git = "cherry-pick zaznaczonego commita na HEAD", local = "cherry-pick zaznaczonego zatwierdzenia na HEAD" }
git_actions_then_23 = { git = "revert zaznaczonego commita (z potwierdzeniem)", local = "revert zaznaczonego zatwierdzenia (z potwierdzeniem)" }
