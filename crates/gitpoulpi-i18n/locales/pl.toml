# S23: what the host protects, and the three ways through it. Never done
# automatically: these are instructions. The git words are terms ({$push},
# {$tag}, {$prs}) so "Translate git terms" works here too; the exact commands
# are in the English CLI text, not here.
[rewrite_host]
protected_on = "chroniona przez {provider}"
btn_howto = "Jak to obejść"
title = "Jak obejść ochronę po stronie hosta"
intro = "Host odrzuca przepisaną historię ({names}), bo {provider} ją chroni. GitPoulpi nigdy sam nie zmienia ustawień hosta; są trzy drogi, od najłagodniejszej do najbardziej radykalnej."
unknown = "Nie udało się odczytać ochrony po stronie hosta: {why}"
not_asked = "To repozytorium nie jest powiązane z hostem, więc jego ochrona nie została odczytana. Powiąż je w panelu bocznym, aby zobaczyć, które gałęzie są chronione."
refs_unknown = "Ochrona po stronie hosta nieznana: {why}"
any_branch = "chroniona gałąź"
way_lift = "1. Tymczasowo zdejmij ochronę w ustawieniach hosta"
way_rename = { git = "2. Zrób push przepisanej historii pod nową nazwą gałęzi, a potem zmień gałąź domyślną", local = "2. Wypchnij przepisaną historię pod nową nazwą gałęzi, a potem zmień gałąź domyślną" }
way_recreate = "3. Ostateczność: usuń zdalne repozytorium i utwórz je od nowa"
step_lift_github = { git = "Otwórz Settings > Branches (reguły ochrony gałęzi) oraz Settings > Rules (rulesets) repozytorium, usuń lub złagodź regułę obejmującą gałąź, zrób push przepisanej historii, a potem przywróć regułę.", local = "Otwórz Settings > Branches (reguły ochrony gałęzi) oraz Settings > Rules (rulesets) repozytorium, usuń lub złagodź regułę obejmującą gałąź, wypchnij przepisaną historię, a potem przywróć regułę." }
step_lift_gitlab = "Otwórz Settings > Repository > Protected branches, zdejmij ochronę z gałęzi (albo włącz opcję pozwalającą przepisać jej historię), a gdy przepisana historia zostanie wysłana, chroń gałąź ponownie."
step_lift_azure = { git = "Otwórz Project settings > Repositories > repozytorium > Policies, usuń politykę gałęzi dla tej gałęzi, a w Security nadaj sobie uprawnienie do przepisywania historii i usuwania gałęzi, zrób push przepisanej historii, a potem przywróć jedno i drugie.", local = "Otwórz Project settings > Repositories > repozytorium > Policies, usuń politykę gałęzi dla tej gałęzi, a w Security nadaj sobie uprawnienie do przepisywania historii i usuwania gałęzi, wypchnij przepisaną historię, a potem przywróć jedno i drugie." }
step_lift_bitbucket = { git = "Otwórz ustawienia repozytorium > Branch restrictions (w Data Center: Branch permissions), usuń ograniczenie obejmujące gałąź, zrób push przepisanej historii, a potem przywróć je.", local = "Otwórz ustawienia repozytorium > Branch restrictions (w Data Center: Branch permissions), usuń ograniczenie obejmujące gałąź, wypchnij przepisaną historię, a potem przywróć je." }
step_lift_other = { git = "Usuń lub złagodź regułę ochrony gałęzi w ustawieniach repozytorium na hoście, zrób push przepisanej historii, a potem przywróć regułę.", local = "Usuń lub złagodź regułę ochrony gałęzi w ustawieniach repozytorium na hoście, wypchnij przepisaną historię, a potem przywróć regułę." }
step_push_new_name = { git = "Zrób push przepisanej historii do niechronionej gałęzi o nowej nazwie (GitPoulpi nie rusza chronionego refa).", local = "Wypchnij przepisaną historię do niechronionej gałęzi o nowej nazwie (GitPoulpi nie rusza chronionego refa)." }
step_switch_github = "Potem w Settings > Branches ustaw nową gałąź jako domyślną (albo najpierw zmień nazwę starej w Settings > Branches > ikona ołówka > Rename) i usuń starą, gdy nikt jej już nie używa."
step_switch_gitlab = "Potem w Settings > Repository > Branch defaults ustaw nową gałąź jako domyślną i usuń starą (Code > Branches), gdy nikt jej już nie używa."
step_switch_azure = "Potem w Repos > Branches otwórz menu nowej gałęzi > Set as default branch i usuń starą, gdy nikt jej już nie używa."
step_switch_bitbucket = "Potem w ustawieniach repozytorium > Repository details ustaw nową gałąź jako główną (w Data Center: domyślną) i usuń starą, gdy nikt jej już nie używa."
step_switch_other = "Potem ustaw nową gałąź jako domyślną w ustawieniach repozytorium na hoście i usuń starą, gdy nikt jej już nie używa."
step_recreate = { git = "Usuń zdalne repozytorium w jego ustawieniach, utwórz puste o tej samej nazwie, a potem zrób push każdej gałęzi i każdego tagu. Wszyscy muszą sklonować je od nowa.", local = "Usuń zdalne repozytorium w jego ustawieniach, utwórz puste o tej samej nazwie, a potem wypchnij każdą gałąź i każdy znacznik. Wszyscy muszą sklonować je od nowa." }
