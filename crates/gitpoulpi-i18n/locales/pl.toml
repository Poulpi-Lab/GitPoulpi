pick = { git = "pick", local = "użyj" }
reword = { git = "reword", local = "zmień opis" }
squash = { git = "squash", local = "połącz" }
fixup = { git = "fixup", local = "fixup" }
drop = { git = "drop", local = "pomiń" }
edit = { git = "edit", local = "edytuj" }
stage = { git = "stage", local = "dodać do poczekalni" }
unstage = { git = "unstage", local = "usunąć z poczekalni" }
staged = { git = "staged", local = "w poczekalni" }
unstaged = { git = "unstaged", local = "poza poczekalnią" }
