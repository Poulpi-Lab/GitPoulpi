[help_tabs]
tab_keys = "Teclas"
tab_start = "Início"
tab_log = "Log"
tab_changes = "Alterações"
tab_refs = "Refs"
tab_hosting = "Hospedagem"
tab_setup = "Config."
tab_tools = "IA e CLI"
title = "Ajuda - digite para filtrar, Tab troca de aba, ? fecha"
title_filtered = "Ajuda - filtro \"{filter}\" - Esc limpa, ? fecha"
hint = "Tab/Shift+Tab, ←/→ ou Alt+1..8: abas - ↑/↓, PgUp/PgDn rolam"
start_1 = "Janela|Abas no topo (Início lista, abre e clona repositórios), depois a barra de ferramentas, a barra lateral Refs à esquerda, o Log no centro, e as alterações com o formulário de {$commit} à direita."
start_2 = "Paleta de comandos|Ctrl+P lista cada ação com seu atalho. Digite para buscar, Enter executa. Tudo o que o mouse faz, a paleta faz."
start_3 = "Prefixos de atalhos|Ctrl+G e depois uma tecla executa uma ação do git ({$stage}, {$commit}, {$pull}, {$push}...). Ctrl+N e depois uma tecla move ou muda a exibição. A linha de status lista as opções."
start_4 = "Abas|Uma aba por repositório. Ctrl+PgUp / Ctrl+PgDn trocam, Ctrl+W fecha, t abre o seletor de abas, clique com o botão direito em uma aba ou Ctrl+T para o menu dela."
start_5 = "Mouse e teclas|Clicar seleciona, clique duplo abre ou faz checkout, clique com o botão direito (ou .) abre um menu, arrastar move refs e linhas de {$rebase}. Toda ação do mouse tem uma tecla."
start_6 = "Atualizar e desfazer|r atualiza, F5 recarrega tudo, Ctrl+Z / Ctrl+Y desfazem e refazem a última operação, q sai."
log_1 = "Ler o grafo|Uma linha por {$commit}, uma faixa por branch. A primeira linha é seu trabalho não commitado (WIP): selecione-a para ver as alterações. Clique em uma linha para ver os detalhes à direita."
log_2 = "Buscar|f (ou o botão Buscar) esmaece as linhas que não combinam com mensagem, autor, hash ou ref. Enter / Shift+Enter pulam para a correspondência seguinte / anterior. / filtra a barra Refs."
log_3 = "Menu do {$commit}|Clique com o botão direito em um {$commit} ou . nele: {$cherry_pick}, revert, reset, editar a mensagem, criar branch ou {$tag}, checkout, worktree, patch, copiar."
log_4 = "{$Rebase} interativo|\"{$Rebase} interativo a partir daqui...\" no menu do {$commit}: marque cada {$commit} como {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} ou {$edit}, reordene com Ctrl+Cima/Baixo, inicie com Ctrl+S, saia com Esc."
log_5 = "Vários {$commits}|Ctrl+clique alterna um {$commit}, Shift+clique (Alt+clique) seleciona um intervalo, Espaço alterna o atual, Esc limpa. Depois clique com o botão direito para {$cherry_pick} ou revert de toda a seleção."
log_6 = { git = "Arrastar refs|Arraste uma branch sobre outra para {$merge}, {$rebase} ou fast-forward, ou sobre uma branch remota para {$push}; solte para escolher em um menu, Esc cancela. Teclado: paleta, “Refs: Soltar a ref selecionada...”.", local = "Arrastar refs|Arraste uma branch sobre outra para mesclar, fazer rebase ou fast-forward, ou sobre uma branch remota para enviar; solte para escolher em um menu, Esc cancela. Teclado: paleta, “Refs: Soltar a ref selecionada...”." }
changes_1 = "Alterações em andamento|Selecione a primeira linha do Log (WIP): os arquivos {$unstaged} e {$staged} aparecem à direita. m alterna caminho / árvore, a mostra todos os arquivos, z recolhe as pastas."
changes_2 = "{$Stage} e {$unstage}|Ctrl+Espaço em um arquivo, ou o botão dele, ou Ctrl+G s; Ctrl+G a para tudo, Ctrl+G u para {$unstage}. Clique com o botão direito em um arquivo para descartar, ver histórico ou blame, ou abrir no seu editor."
changes_3 = { git = "Ler um {$diff}|Clique em um arquivo ou pressione d. m alterna em linha / dividido, w quebra linhas, s ignora espaços, n / p pulam entre hunks, Esc ou q volta ao Log.", local = "Ler uma {$diff}|Clique em um arquivo ou pressione d. m alterna em linha / dividido, w quebra linhas, s ignora espaços, n / p pulam entre hunks, Esc ou q volta ao Log." }
changes_4 = { git = "Hunks e linhas|Em um {$diff}: Espaço = {$stage} o hunk, v depois j / k depois Enter = {$stage} as linhas escolhidas, x = descartar o hunk. Descartes perguntam antes; Ctrl+Z desfaz.", local = "Hunks e linhas|Em uma {$diff}: Espaço = {$stage} o hunk, v depois j / k depois Enter = {$stage} as linhas escolhidas, x = descartar o hunk. Descartes perguntam antes; Ctrl+Z desfaz." }
changes_5 = "Escrever um {$commit}|Digite um resumo e uma descrição, depois Ctrl+Enter ou o botão verde. Shift+A emenda o último {$commit}. Ctrl+G c leva o cursor ao formulário, Esc sai."
changes_6 = "Conflitos de {$merge}|Um aviso oferece “Resolver conflitos...”. No editor de {$merge} escolha A, B ou ambos por conflito (a / b / c), edite o Resultado, salve e depois Continuar."
changes_7 = "Desfazer e refazer|Ctrl+Z / Ctrl+Y, ou os botões da barra, desfazem e refazem a maioria das operações: {$commits}, branches, checkouts, resets, {$stashes}, descartes. Pergunta antes quando é arriscado."
refs_1 = "Branches e {$tags}|Clique duplo em uma branch local ou {$tag} para fazer checkout; clique com o botão direito para o menu ({$merge}, {$rebase}, renomear, excluir...). Ctrl+G b e Ctrl+G t criam um no {$commit} atual."
refs_2 = "Solo e ocultar|A tecla o mostra só os {$commits} da ref selecionada, Shift+O para. O menu de uma ref a oculta do grafo; Shift+H mostra tudo de novo. Só exibição: o repositório não muda."
refs_3 = "{$Fetch}, {$pull}, {$push}|Ctrl+G f: {$fetch} de todos os remotos. Ctrl+G p: {$pull}. Ctrl+G Shift+P: {$push}. A seta ao lado de um botão escolhe outra forma ou outro remoto."
refs_4 = { git = "Remotos|O + no título REMOTE adiciona um. Clique com o botão direito em um remoto para fazer {$fetch}, copiar o link web, editar as URLs ou remover.", local = "Remotos|O + no título REMOTE adiciona um. Clique com o botão direito em um remoto para buscar, copiar o link web, editar as URLs ou remover." }
refs_5 = "{$Stashes} e worktrees|Os botões {$stash} e Pop; Ctrl+G m pede uma mensagem antes. Clique com o botão direito em um {$stash} para aplicar ou retirar. “Criar worktree a partir de...” abre uma branch em aba própria."
refs_6 = "Submódulos e LFS|Uma seção SUBMODULES aparece se houver: clique duplo abre um como aba, clique com o botão direito o atualiza. Ações do Git LFS: o botão LFS ou Ctrl+G l."
hosting_1 = "Conectar|Configurações > Integrações: cole um token pessoal do GitHub ou GitLab. Não precisa de conta; o token vai para o gerenciador de credenciais do sistema."
hosting_2 = "Vincular um repositório|Nas seções {$PRS} e ISSUES da barra lateral, escolha um dos provedores sugeridos pela lista. Nada é vinculado sozinho; o vínculo é salvo por repositório."
hosting_3 = { git = "Criar um {$pr}|O + no cabeçalho {$PRS}, ou n nessa seção, abre o formulário; o menu de uma branch tem \"Iniciar {$pr} a partir de...\". A IA pode escrever título e descrição.", local = "Criar uma {$pr}|O + no cabeçalho {$PRS}, ou n nessa seção, abre o formulário; o menu de uma branch tem \"Iniciar {$pr} a partir de...\". A IA pode escrever título e descrição." }
hosting_4 = "Issues|A seção ISSUES as lista; + ou n cria uma. O menu de uma linha a abre no navegador ou age sobre ela."
hosting_5 = "Referências|Referências a issues e {$prs} (#12, !53, ABC-7) em uma mensagem de {$commit} ou nome de branch são reconhecidas. Alt+R no formulário de {$commit} insere uma."
hosting_6 = { git = "Chip da barra|À esquerda da barra, um chip mostra o {$pr} da branch atual (GH #12, GL !53) ou um \"+ {$pr_abbr}\" apagado para iniciar um. Clique nele.", local = "Chip da barra|À esquerda da barra, um chip mostra a {$pr} da branch atual (GH #12, GL !53) ou um \"+ {$pr_abbr}\" apagado para iniciar uma. Clique nele." }
hosting_7 = "Chaves SSH|Escolha uma chave SSH por perfil (Configurações > Perfis) ou por repositório (menu da aba > “SSH e credenciais...”). As senhas ficam no ssh-agent do sistema."
setup_1 = "Configurações|Ctrl+, ou a engrenagem. Tab alterna entre a lista de páginas e as opções, j / k movem, Enter ou Espaço muda um valor, / ou Ctrl+F busca em todas as opções, Esc fecha."
setup_2 = "Temas|Configurações > Aparência > Tema: escuro, claro, seguir o terminal ou um dos muitos presets. Ctrl+N e uma tecla também mudam tema, idioma e cores do grafo sem abrir as Configurações."
setup_3 = "Idioma|Configurações > Geral > Idioma oferece 17 idiomas. “Traduzir termos do git” decide se as palavras próprias do git ({$commit}, {$push}...) também são traduzidas."
setup_4 = "Perfis|Configurações > Perfis guarda identidades de {$commit} (nome, e-mail, chave SSH). A caixa de perfil da barra escolhe a deste repositório."
setup_5 = "Abrir em|O botão Abrir em (Alt+O) abre a pasta desta aba em um terminal, editor ou gerenciador de arquivos. Configurações > Abrir em edita a lista."
setup_6 = "Atalhos de teclado|Configurações > Teclado e mouse reatribui qualquer tecla. A aba Teclas desta ajuda mostra seus próprios atalhos."
tools_1 = "IA (opcional)|Desativada até você configurar em Configurações > IA: um serviço compatível com OpenAI, Anthropic ou um agente local como claude -p. Nunca é preciso uma conta GitPoulpi."
tools_2 = "Ações de IA|O botão de brilho ao lado do resumo ou Ctrl+G i escreve uma mensagem de {$commit}; Ctrl+G w explica as alterações; Ctrl+G C divide seu trabalho em vários {$commits}; Alt+I sugere uma resolução de conflito. Nada é aplicado sem sua confirmação."
tools_3 = "CLI|gitpoulpi <comando> faz por script o que a janela faz, pelo mesmo daemon, então as mudanças aparecem ao vivo. --json dá saída para máquinas, --help lista as opções."
tools_4 = "MCP|gitpoulpi mcp serve --stdio dá aos agentes de IA uma ferramenta por comando da CLI. Configurações > Agentes e MCP escolhe o que eles podem alterar."
tools_5 = "Wrapper de shell|Com o wrapper de shell gp, “Sair e cd aqui” deixa seu shell na pasta da aba ativa quando o GitPoulpi sai."

