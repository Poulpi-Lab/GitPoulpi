mouse_gestures_in_6 = "toda ação “Copiar ...” pede ao *terminal* a área de transferência por OSC 52 - um TUI não a alcança diretamente; um terminal que ignora a sequência simplesmente não copia"
mouse_gestures_in_7 = "as dicas de redimensionar/ponteiro/mão aberta são enviadas por OSC 22 nos terminais que o suportam (kitty, foot, xterm; irregular nos demais) - divisores arrastáveis e limites de coluna também se acendem no buffer do próprio app, o que não exige cooperação alguma do terminal"
git_actions_then_25 = "abrir o menu LFS (o botão LFS da barra; suas linhas também estão na paleta)"
git_actions_then_26 = { git = "LFS: {$fetch} dos objetos de todas as referências", local = "LFS: {$fetch} os objetos de todas as referências" }
git_actions_then_27 = "LFS: gravar o conteúdo real sobre os ponteiros (offline)"
git_actions_then_28 = "LFS: {$pull} (baixar e gravar o conteúdo)"
git_actions_then_29 = { git = "LFS: {$push} dos objetos de todas as referências", local = "LFS: {$push} os objetos de todas as referências" }
git_actions_then_30 = "LFS: limpar o armazenamento LFS local"
diff_view_encoding = "escolher a codificação em que o arquivo é lido (Detecção automática, UTF-8, UTF-16, Windows-1252, ...)"
commit_composer_bottom_14 = "alternar “Ignorar hooks”: o {$commit} é feito sem executar os hooks do git (painel Status)"
repositories_and_tabs_39 = "filtrar as entradas da pasta conforme você digita (sem diferenciar maiúsculas de minúsculas; em Esquerda ou Conteúdo, `/` também foca o campo; Enter ou Seta para baixo vai à primeira correspondência, Esc limpa o filtro; ele se esvazia ao trocar de pasta)"
repositories_and_tabs_40 = "alternar Mostrar pastas irmãs (a árvore da esquerda também lista as outras pastas de cada nível aberto - lembrado)"
split_1 = "atribuir o arquivo, hunk ou linha selecionado a esse {$commit} (0 deixa sem atribuição, n coloca em um novo {$commit}); Tab alterna entre os {$commits} e as alterações, Enter ou e edita uma mensagem, d exclui um {$commit}; {{compose.apply}} divide"
split_2 = "seleciona linhas avulsas dentro do hunk atual (Shift+Cima/Baixo estende a seleção)"
split_3 = "move o {$commit} para cima ou para baixo na lista (K e J fazem o mesmo)"
split_4 = "devolve cada alteração ao estado em que estava quando o editor foi aberto"
split_5 = "divide o {$commit} com o plano como está; enquanto o plano não for válido, o botão fica desativado e a linha de status diz o motivo"
split_6 = "alterna Assinar {$commits} (ativado ao abrir o editor se a configuração gpgSign do repositório for true)"
split_7 = "no painel de {$commits}, seleciona esse {$commit}; m ou Enter em uma alteração lista os {$commits} para onde atribuí-la"
rewrite_9 = "abre a aba Tamanho e analisa o histórico: os maiores arquivos e pastas, e os arquivos excluídos que o histórico ainda guarda; as linhas marcadas viram regras de remoção"
rewrite_host_howto = { git = "explica como fazer uma reescrita passar por uma branch que o host protege: suspender a proteção, fazer push com outro nome de branch ou recriar o repositório; nada é feito por você", local = "explica como fazer uma reescrita passar por uma branch que o host protege: suspender a proteção, enviar com outro nome de branch ou recriar o repositório; nada é feito por você" }
rewrite_ai_rules = "cria com IA as regras de reescrita a partir da sua descrição (nenhuma prévia é gerada e nada é aplicado)"
log_columns_2 = "rolar as colunas do Log para os lados quando mantêm suas larguras (a disposição Rolar para os lados, escolhida no seletor de colunas, em Configurações ou com s enquanto uma coluna está escolhida); na disposição ajustada, todas as colunas cabem no painel"

