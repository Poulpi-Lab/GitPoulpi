[settings_ssh]
private_key_path = "Caminho da chave privada"
private_key_path_help = { git = "Arquivo de chave que {$fetch}, {$pull}, {$push} e clone oferecem ao ssh (ssh -i <chave> -o IdentitiesOnly=yes). Vazio: ssh-agent e sua configuração ssh como de costume. Não usado quando um repositório escolhe a própria chave (SSH e credenciais) ou quando GIT_SSH_COMMAND ou core.sshCommand está definido. Vale na próxima transferência.", local = "Arquivo de chave que a busca, a puxada, o envio e o clone oferecem ao ssh (ssh -i <chave> -o IdentitiesOnly=yes). Vazio: ssh-agent e sua configuração ssh como de costume. Não usado quando um repositório escolhe a própria chave (SSH e credenciais) ou quando GIT_SSH_COMMAND ou core.sshCommand está definido. Vale na próxima transferência." }
public_key_path = "Caminho da chave pública"
public_key_path_help = "Usado só quando o caminho da chave privada está vazio: o ssh então escolhe a chave correspondente mantida pelo ssh-agent (ou uma chave de hardware) em vez de oferecer todas as do agente. Gerar par de chaves preenche os dois. Mesma precedência do caminho da chave privada."
key_type = "Tipo de chave"
heading_https_credentials = "Credenciais HTTPS"
https_mode = "Credenciais HTTPS"
https_mode_help = { git = "Como fetch, pull, push e clone se autenticam por HTTPS. credential_helper: o auxiliar do próprio git (Git Credential Manager, libsecret, Keychain). prompt: ignora qualquer auxiliar e deixa o git perguntar em um terminal. none: nenhuma credencial, só remotos públicos. Vale para a próxima transferência.", local = "Como a busca, a puxada, o envio e o clone se autenticam por HTTPS. credential_helper: o auxiliar do próprio git (Git Credential Manager, libsecret, Keychain). prompt: ignora qualquer auxiliar e deixa o git perguntar em um terminal. none: nenhuma credencial, só remotos públicos. Vale para a próxima transferência." }
heading_keys = "Chaves"
generate_key_pair = "Gerar par de chaves"
generate_key_pair_help = "Gera um par de chaves ed25519 internamente (sem ssh-keygen, sem senha) em ~/.ssh/gitpoulpi_ed25519, sem nunca sobrescrever um arquivo, e registra os dois caminhos acima. Adicione a chave pública a um host em Integrações."

[settings_editor]
tab_size = "Tamanho da tabulação"
tab_size_help = "Colunas entre as paradas de tabulação, no editor integrado (desenho, Shift+Tab) e nas visualizações de {$diff}. A visualização de blame desenha a tabulação como um espaço e a ignora."
eol = "Fim de linha"
eol_help = "O que o editor integrado grava ao salvar. Auto mantém o fim de linha do próprio arquivo (LF para um arquivo novo); LF ou CRLF converte o arquivo ao salvar. A linha de status do editor mostra o que o próximo salvamento grava."
syntax_highlighting = "Realce de sintaxe"
syntax_highlighting_help = "Colore o editor integrado por linguagem. As visualizações de {$diff} e de blame não têm cores de sintaxe."
line_numbers = "Números de linha"
line_numbers_help = "A coluna de números do editor integrado e das visualizações de {$diff} (nestas ela fica em branco, as colunas mantêm o lugar). A visualização de blame não tem."
follow_selection = "Seguir a seleção no editor"
follow_selection_help = "Com o editor aberto, selecionar outro arquivo no painel direito também o abre no editor, depois de perguntar se as alterações não salvas devem ser salvas. Um arquivo que não pode ser editado abre na visualização habitual."
merge_side_by_side_min_width = "Editor de {$merge}: lado a lado a partir de (colunas)"
merge_side_by_side_min_width_help = "O editor de conflitos de {$merge} mostra A e B lado a lado quando sua área tem pelo menos esta largura em colunas (linhas longas rolam para o lado com Shift+roda ou Shift+setas); mais estreito, mostra um lado por vez em abas. 100 por padrão; 40 é o menor valor, 0 significa sempre lado a lado. O editor oculta os painéis Refs e Status enquanto está aberto, então normalmente tem a janela inteira."
diff_word_wrap = "Quebra de linha"
diff_word_wrap_help = "Quebra linhas longas nas visualizações de {$diff} em vez de cortá-las com reticências. O editor integrado e a visualização de blame rolam para o lado e não quebram. Também é o alternador de quebra da própria visualização de {$diff}."

[settings_ui]
theme = "Tema"
theme_help = "Cores de toda a interface. Percorrer a lista pré-visualiza cada tema; Enter o mantém, Esc volta. Sistema segue o terminal (seu fundo claro ou escuro, detectado uma vez ao iniciar; Escuro quando não dá para saber). Seus próprios arquivos de tema na pasta themes/ da configuração aparecem por último."
theme_system = "Sistema (segue o terminal)"
follow_theme = "Seguir o tema"
theme_swatches = "Cores"
graph_lane_background = "Fundo das faixas do grafo"
graph_lane_background_help = "Desativado: transparente, nada atrás das faixas (padrão). Tom da linha: uma faixa suave na cor da faixa do commit dentro da coluna Grafo, mais uma barra fina dessa cor na borda direita da coluna. Uma faixa armazenada é lida como Tom da linha. Aplica-se quando as Configurações fecham."
graph_row_tint_strength = "Intensidade do tom da linha"
graph_row_tint_strength_help = "Quão esmaecida é a faixa de Tom da linha: Forte (a original), Média (padrão) ou Sutil. Só a faixa esmaece; a barra na borda direita da coluna mantém a cor total. Aplicado ao fechar as Configurações."
graph_row_tint_strength_coming = "defina antes o Fundo das faixas do grafo como Tom da linha"
toolbar_position = "Posição da barra de ferramentas"
toolbar_position_help = "Onde fica a barra de ferramentas: Topo, Base (padrão), Esquerda ou Direita. Esquerda e Direita formam uma coluna ao lado dos painéis; uma janela com menos de 80 colunas a desenha na base. Aplicado imediatamente."
toolbar_align = "Alinhamento dos botões da barra de ferramentas"
toolbar_align_help = "Onde ficam os botões ao longo da barra: Início (padrão), Centro ou Fim. O início é a esquerda de uma linha e o topo de uma coluna; o fim é a direita e a base. Aplicado imediatamente."
# context: label of the setting that decides whether a dialog the user moved or resized keeps its place
dialog_geometry = "Lembrar posição e tamanho dos diálogos"
dialog_geometry_help = "Uma só configuração para todos os diálogos. Os diálogos podem ser movidos (arraste a barra de título, ou Ctrl+N e depois m); as janelas maiores também podem ser redimensionadas (arraste as bordas e os cantos inferiores). Cada diálogo lembra a própria posição e o próprio tamanho. Nesta sessão (padrão): mantidos até o GitPoulpi fechar. Salvo em disco: mantidos também na próxima abertura. Nunca: todo diálogo abre na posição e no tamanho padrão. Aplicado imediatamente."
toolbar_pr_pinned = "Fixar o botão de {$pr} no fim"
toolbar_pr_pinned_help = "Ativado (padrão), o botão de {$pr} fica na extremidade da barra de ferramentas (à direita, ou na base em uma coluna), qualquer que seja o alinhamento. Desativado, ele flui com os outros botões e se alinha com eles. Aplicado imediatamente."
statusbar_position = "Posição da linha de status"
statusbar_position_help = "Onde fica a linha de status (branch, contagens, mensagens, atalhos): Topo, acima das abas de repositório, ou Base (padrão). A aba Início mantém a própria linha de status na base. Aplicado imediatamente."
tabs_position = "Posição da barra de abas"
tabs_position_help = "Onde ficam as abas de repositório: Topo (padrão), Base ou Esquerda, uma lista com uma aba por linha na borda esquerda da janela. Uma janela com menos de 80 colunas as desenha no topo. Ao lado de uma barra de ferramentas em coluna, as abas ficam por fora. Aplicado imediatamente."
graph_color_theme = "Tema de cores do grafo"
graph_color_theme_help = "A paleta de cores das faixas do grafo do Log. Seguir o tema usa a paleta do tema escolhido; qualquer outra entrada a substitui, então qualquer tema pode ser combinado com qualquer paleta. Aplicado ao fechar as Configurações."
graph_renderer = "Renderizador do grafo"
graph_renderer_help = "auto desenha o grafo como uma imagem de verdade em um terminal que a suporta, e como caracteres nos demais - inclusive dentro de tmux ou zellij, que herdam o ambiente do terminal mas não repassam a imagem, e dentro do herdr, a menos que sua opção kitty_graphics esteja ativada. image força a imagem, text a desativa. Exige reinício."
image_protocol = "Protocolo de imagem"
image_protocol_help = "Como as imagens (a imagem do grafo, avatares de autores) chegam ao terminal. auto: o protocolo gráfico do Kitty no kitty, no Ghostty e em um herdr cuja configuração tenha kitty_graphics = true; imagens inline do iTerm2 no WezTerm, iTerm2 e mintty; imagens sixel (só os avatares de autores, o grafo continua em caracteres) no Windows Terminal, foot, Konsole e mlterm; caracteres nos demais. kitty, iterm2 ou sixel força esse protocolo (kitty para um herdr cuja configuração está em outro lugar; sixel para um terminal que o desenha mas não é reconhecido); none desativa as imagens. Exige reinício."
kitty_keyboard = "Protocolo de teclado do Kitty"
kitty_keyboard_help = "auto pergunta ao terminal, na inicialização e em cerca de 100 ms, se ele fala o protocolo de teclado do kitty, e o usa quando fala: combinações que terminais legados não distinguem (Control com pontuação, dígitos, Shift ou Enter) chegam então como elas mesmas, em vez de colidir com códigos de controle. Um terminal que não responde mantém as teclas legadas. off nunca mexe no modo de teclado do terminal. Exige reinício."
color_depth = "Profundidade de cor"
color_depth_help = "auto usa cor de 24 bits, exceto em terminais que não a mostram (Terminal da Apple, console do Linux ou um terminal de 256 cores sem COLORTERM), onde as cores são mapeadas para as 256 ou 16 entradas mais próximas. truecolor, 256 e 16 forçam uma profundidade. Aplicado imediatamente."
text_cursor = "Text cursor"
text_cursor_help = "terminal puts the terminal's own cursor at the caret of the focused text field, as a bar: your terminal's cursor settings apply and an input method's candidate window opens at the caret. drawn paints GitPoulpi's own caret (a block or an underscore) and keeps the terminal cursor hidden. Applies at once."
graph_show_stashes = "Mostrar stashes no grafo"
graph_show_stashes_help = "Cada stash ganha uma linha própria no Log, na sua data: uma caixinha em uma faixa ao lado do commit em que foi feita, ligada a ele por uma linha tracejada. Selecioná-la mostra o que ela alterou; clique com o botão direito (ou .) oferece Pop, Apply e Drop. Desativado, os stashes ficam só na seção STASHES. Não é desenhado durante o solo."
ref_connector = "Conector ref-commit"
ref_connector_help = "Uma linha fina de cada pílula de ref na coluna Ref até o círculo do seu commit no grafo. Ela só preenche espaço em branco: as faixas por onde passa ficam por cima e nada se move. Desenhada só enquanto a coluna Ref está imediatamente à esquerda da coluna Grafo."
log_wip_counts_in_message = "Mostrar contagens de alterações do WIP na mensagem quando a coluna Alterações está oculta"
log_wip_counts_in_message_help = "A linha WIP mostra quantos arquivos foram modificados, adicionados e excluídos. Com a coluna Alterações visível (clique com o botão direito no cabeçalho do Log para mostrá-la), as contagens sempre vão nessa coluna, como as de todo commit. Com ela oculta, vão na mensagem do WIP enquanto isto estiver ativado; desativado, não mostra contagem alguma."
avatars = "Avatares dos autores"
avatars_help = "Imagens de autor. graph desenha o autor de cada commit dentro do seu círculo no grafo (só no grafo de imagem; no grafo de texto, uma inicial colorida vai na coluna Autor). author coloca uma imagem redonda no início da coluna Autor. Ambos também a mostram no painel de detalhes do commit. Desativado por padrão: ativar isto envia um hash SHA-256 do e-mail de cada autor ao gravatar.com por HTTPS - o hash de um endereço conhecido ou previsível não é anônimo - e, em um repositório com remoto github.com, consulta a API do GitHub uma vez por autor para saber qual conta fez um dos commits dele (usando o token da sua integração com o GitHub, quando houver). Até a imagem chegar, e quando não existe, mostram-se as iniciais ou o círculo simples. off não envia nada pela rede."
avatar_sources = "Fontes de avatar"
avatar_sources_help = "Onde a imagem de um autor é procurada, em ordem (um endereço noreply do GitHub sempre nomeia primeiro a sua conta). hosting_gravatar: a integração GitHub, GitLab ou Bitbucket conectada cujo host corresponde ao remoto do repositório (autor de commit ou busca de usuário no GitHub, avatar por e-mail ou API de usuários no GitLab), depois o Gravatar; sem integração correspondente conectada, o Gravatar vem primeiro e um remoto github.com ainda é consultado por último, sem autenticação. gravatar_hosting: o inverso. gravatar ou hosting: só essa. Quando nenhuma tem imagem, desenha-se o avatar alternativo abaixo. Vale para autores ainda não consultados."
avatar_fallback = "Avatar alternativo"
avatar_fallback_help = "O que um autor sem imagem recebe. identicon: um padrão espelhado 5x5 ao estilo GitHub em uma cor derivada do e-mail, gerado localmente (sem rede), como imagem em um terminal de imagens e como caracteres de bloco nos demais. initials: um selo colorido com as iniciais."
composer_files = "Propostas do compositor"
composer_files_help = "Como abre a revisão do compositor de commits com IA. expandido: cada commit proposto lista seus arquivos. recolhido: só as linhas dos commits; Direita/Esquerda (ou um clique na seta) abre um."
blame_side = "Anotações do blame"
blame_side_help = "Lado da visão Blame onde fica a coluna de anotações (avatar, autor, idade, resumo). right: à direita do código. left: à esquerda do código."
column_resize = "Redimensionamento das colunas"
column_resize_help = "Como se pega o limite de uma coluna no Log, no Radar e na coluna lateral das visões de arquivo. line: uma linha fina em toda a altura da tabela enquanto o ponteiro está sobre o limite, com uma pequena marca no cabeçalho. header: sem espaço nem marca, só se redimensiona pelo cabeçalho, onde o primeiro caractere da célula seguinte se acende."
blame_width = "Largura das anotações do blame"
blame_width_help = "Largura da coluna de anotações em células (24 a 90). Arraste a borda na visão Blame ou use as teclas de aumentar / diminuir a largura; a nova largura é salva aqui."
ref_tree = "Árvore de pastas de branches"
ref_tree_help = "A barra lateral Refs agrupa nomes de branch em `/` em pastas recolhíveis, com cada remoto como nó de nível superior. Desativado, dá uma linha simples por branch. `y` no painel Refs alterna isto imediatamente e grava a escolha aqui."
reveal_on_ref_click = "Clicar em uma ref a mostra no grafo"
reveal_on_ref_click_help = "Um único clique em uma ref no painel Refs rola o Log até onde ela aponta e faz a linha piscar. A seleção do Log e o painel direito não mudam. Desativado, um clique só seleciona a linha da barra lateral. “Mostrar no grafo” no menu da ref, sua tecla no painel Refs e o comando da paleta funcionam nos dois casos."
graph_ghost_ref = "Mostrar uma branch fantasma no {$commit} sob o mouse"
graph_ghost_ref_help = "Na coluna Ref do Log, o {$commit} sob o mouse que não tem ref própria mostra uma pílula esmaecida com o nome da branch a que pertence (senão a branch remota), deduzido do histórico. Passar o mouse na pílula mostra o tipo. Clicar nela não faz nada de especial; o comando de criar branch cria uma branch. Só é desenhada onde a coluna Ref tem espaço. Desativado, ela não aparece."
mouse_enabled = "Mouse ativado"
mouse_enabled_help = "Desativado, deixa a seleção por arrastar para o seu terminal. Exige reinício."
mouse_scroll_lines = "Linhas da roda do mouse"
mouse_scroll_lines_help = "Quantos commits um clique da roda move no Log. Exige reinício."
heading_date_time = "Data e hora"
heading_layout = "Layout"
date_locale = "Localidade de data/hora"
date_locale_help = "system: os nomes de mês e dia seguem o idioma da interface. english: sempre em inglês, seja qual for o idioma. Vale para todas as datas desta página."
diff_layout = "Layout padrão"
diff_layout_help = { git = "Inline (uma coluna) ou Dividido (antes e depois lado a lado). Retomado do último diff que você viu, nesta janela e entre reinícios - mudar aqui só define de onde parte uma sessão *nova*.", local = "Inline (uma coluna) ou Dividido (antes e depois lado a lado). Retomado da última diferença que você viu, nesta janela e entre reinícios - mudar aqui só define de onde parte uma sessão *nova*." }
diff_hunks_only = "Só hunks"
diff_hunks_only_help = "Ativado mostra só os hunks alterados com algumas linhas de contexto; desativado mostra o arquivo todo com as alterações realçadas no lugar. Retomado como o layout."
diff_show_whitespace = "Mostrar alterações só de espaços em branco"
diff_show_whitespace_help = "Desativado reduz a contexto um hunk que difere apenas em espaços em branco."
input_color = "Cor dos campos"
input_color_help = "Fundo dos campos de texto. Seguir o tema (padrão) usa o do tema; os demais são cores escuras que o substituem. Personalizada... usa a cor hexadecimal abaixo. Aplicado imediatamente, sem reiniciar."
input_color_custom = "Cor personalizada dos campos"
input_color_custom_help = "#rrggbb, usada quando a Cor dos campos é Personalizada. Aplicado imediatamente."
minimap = "Minimapa"
minimap_help = { git = "Uma imagem do arquivo inteiro ao lado da barra de rolagem vertical do diff (modo arquivo todo) e do editor, com a parte visível realçada; clique para pular. Uma imagem de verdade onde o terminal as desenha, células braille nos demais. Também `M` no diff e Alternar minimapa na paleta.", local = "Uma imagem do arquivo inteiro ao lado da barra de rolagem vertical da diferença (modo arquivo todo) e do editor, com a parte visível realçada; clique para pular. Uma imagem de verdade onde o terminal as desenha, células braille nos demais. Também `M` na diferença e Alternar minimapa na paleta." }
date_format = "Formato de data"
date_format_help = "A coluna de data do Blame / Histórico do arquivo."
date_time_format = "Formato de data/hora"
date_time_format_help = "A própria coluna Data do Log."
date_verbose_format = "Formato de data detalhado"
date_verbose_format_help = "A linha Data do painel de detalhes do commit, a dica ao passar o mouse na coluna Data e Copiar > Data."
preview = "prévia"
sidebar_sections_scope = "Seções do painel esquerdo"
sidebar_sections_scope_help = "De quem é a escolha das seções mostradas ou ocultas no painel esquerdo. repository: cada repositório guarda o seu conjunto (o global é o ponto de partida). global: um único conjunto para todos os repositórios. Alternar nunca perde nenhum dos dois conjuntos."
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "Disposição das colunas"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "Como o Log organiza suas colunas. fit: todas as colunas cabem no painel e só Mensagem se ajusta. scroll: as colunas mantêm suas larguras, Mensagem também, e a tabela rola para os lados quando é mais larga que o painel."

[settings_git]
default_backend = "Backend do git"
default_backend_help = "Global. Um daemon em execução mantém o backend com que iniciou."
default_backend_warning = "Vale para daemons iniciados depois desta mudança."
pull_mode = "Botão {$Pull}"
default_encoding = "Codificação padrão"
default_encoding_help = { git = "Usada para mostrar conteúdos de arquivos, blame e diffs que não são UTF-8 válido (UTF-8 válido nunca é redecodificado). Um repositório pode substituí-la abaixo. Só exibição: staging e patches mantêm exatamente os bytes do arquivo.", local = "Usada para mostrar conteúdos de arquivos, blame e diferenças que não são UTF-8 válido (UTF-8 válido nunca é redecodificado). Um repositório pode substituí-la abaixo. Só exibição: preparação e patches mantêm exatamente os bytes do arquivo." }
push_behavior = "Botão {$Push}"
push_behavior_help = "direto: {$push} para o remoto padrão imediatamente. perguntar: abre um pequeno menu com o remoto padrão pré-selecionado. O ▾ do botão sempre pergunta."
repo_encoding_help = { git = "Como conteúdos de arquivos, blame e diffs são decodificados para exibição quando não são UTF-8 válido (só este repositório; herdada: Codificação padrão nesta página). O staging nunca recodifica nada.", local = "Como conteúdos de arquivos, blame e diferenças são decodificados para exibição quando não são UTF-8 válido (só este repositório; herdada: Codificação padrão nesta página). A preparação nunca recodifica nada." }
core_autocrlf_help = "Gravado na configuração git deste repositório (core.autocrlf), então o git e qualquer outra ferramenta o enxergam. true: LF para CRLF no checkout; input: CRLF para LF só ao salvar no histórico; false: nunca converter. (herdado): remove o valor do repositório para valer sua configuração git global. Pode ser desfeito."
core_eol_help = "Gravado na configuração git deste repositório (core.eol): o fim de linha que o git usa nos arquivos de texto da árvore de trabalho (lf, crlf ou native, o da plataforma). (herdado): remove o valor do repositório para valer sua configuração git global. Pode ser desfeito."
git_lfs = "Git LFS"
git_lfs_help = { git = "Mostrar o Git LFS na interface (a tag LFS, o cartão de diff, o aviso de programa ausente, os comandos LFS) e deixar o GitPoulpi executar seus próprios passos de LFS (baixar objetos após um clone). Desativado: os filtros LFS do próprio git continuam sendo executados, o GitPoulpi nunca chama o git-lfs.", local = "Mostrar o Git LFS na interface (a marca LFS, o cartão de diferença, o aviso de programa ausente, os comandos LFS) e deixar o GitPoulpi executar seus próprios passos de LFS (baixar objetos após um clone). Desativado: os filtros LFS do próprio git continuam sendo executados, o GitPoulpi nunca chama o git-lfs." }
git_lfs_program = "Programa git-lfs"
git_lfs_program_help = "Instale-o em https://git-lfs.com (Windows: incluído no Git for Windows, ou `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Paleta: LFS: Abrir página de instalação."
initialize_lfs_for_this_repository = "Inicializar o LFS neste repositório"
initialize_lfs_for_this_repository_help = "Executa `git lfs install --local`: os filtros e hooks do LFS na configuração deste repositório, nunca na global. Exige git-lfs."
pull_mode_help = { git = "O que o botão {$Pull}{hint} da barra de ferramentas faz: merge (fast-forward se possível), ff_only ou rebase. Os itens do ▾ do botão executam a própria ação imediatamente e não mudam isto.", local = "O que o botão {$Pull}{hint} da barra de ferramentas faz: mesclagem (fast-forward se possível), ff_only ou rebase. Os itens do ▾ do botão executam a própria ação imediatamente e não mudam isto." }
merge_fast_forward = { git = "{$Merge} fast-forward", local = "Fast-forward da {$merge}" }
merge_fast_forward_help = { git = "Como um {$merge} que você inicia (menu da branch, arrastar e soltar, paleta, linha de comando) trata uma branch que poderia simplesmente avançar por fast-forward. never: sempre faz um {$commit} de {$merge}. allowed: fast-forward quando possível, como o git faz por padrão. only: apenas fast-forward, ou recusa quando não for possível. Um repositório pode substituir isso na própria página Opções de {$merge}.", local = "Como uma {$merge} que você inicia (menu da branch, arrastar e soltar, paleta, linha de comando) trata uma branch que poderia simplesmente avançar por fast-forward. never: sempre faz um {$commit} de {$merge}. allowed: fast-forward quando possível, como o git faz por padrão. only: apenas fast-forward, ou recusa quando não for possível. Um repositório pode substituir isso na própria página Opções da {$merge}." }
repo_heading = "Repo: {repo} - só este repositório"
inherited = "(herdado)"
lfs_not_checked = "(ainda não verificado)"
lfs_autofix_filters = "Instalar os filtros LFS antes de {$pull} e {$push}"
lfs_autofix_filters_help = { git = "Antes de um {$pull} ou {$push} em um repositório que usa Git LFS, executa `git lfs install --local` se os filtros LFS ou os hooks estiverem faltando (configuração própria do repositório, nunca a global), para que a transferência cuide dos arquivos grandes. A linha de status avisa. Requer git-lfs.", local = "Antes de puxar ou enviar em um repositório que usa Git LFS, executa `git lfs install --local` se os filtros LFS ou os hooks estiverem faltando (configuração própria do repositório, nunca a global), para que a transferência cuide dos arquivos grandes. A linha de status avisa. Requer git-lfs." }

