startup_tab_launcher_help = "A aba em que uma inicialização abre quando o GitPoulpi é iniciado pelo atalho da área de trabalho ou do menu Iniciar (veja Lançador abaixo), seja qual for a pasta. Tem prioridade sobre as duas configurações acima; Última aba e Radar se comportam como acima. Lido uma vez na inicialização; exige reinício para ter efeito."
group_worktree_tabs = "Agrupar as abas de worktrees"
group_worktree_tabs_help = "As abas dos worktrees vinculados de um repositório ficam logo depois da aba desse repositório, e a aba de um worktree arrastada para longe volta para junto dela. Desativado, as abas ficam onde você as colocou. Ativar reagrupa as abas abertas."
allow_agent_view_control = "Permitir que agentes de IA controlem a visualização"
allow_agent_view_control_help = "Ativado, um agente de IA (pelo MCP ou `gitpoulpi ui`) pode pedir a esta janela que mostre um commit, um arquivo ou um aviso. Ele nunca altera nada no repositório. Desativado, esta janela não os aceita. Lido quando uma janela abre."
allow_ui_propose = "Deixar agentes de IA proporem alterações para eu confirmar"
allow_ui_propose_help = { git = "Ativado, um agente de IA pode abrir um diálogo já preenchido para você: uma nova mensagem para um commit, uma mensagem de commit no compositor, uma nova branch ou tag. Ele é marcado ✦ Proposto por <agente>, e nada muda até você confirmar no próprio diálogo; Esc o rejeita. Desativado (padrão), `ui propose` e as ferramentas MCP ui_propose_* são recusadas.", local = "Ativado, um agente de IA pode abrir um diálogo já preenchido para você: uma nova mensagem para um commit, uma mensagem de commit no compositor, uma nova branch ou etiqueta. Ele é marcado ✦ Proposto por <agente>, e nada muda até você confirmar no próprio diálogo; Esc o rejeita. Desativado (padrão), `ui propose` e as ferramentas MCP ui_propose_* são recusadas." }
clone_root = "Pasta de clone padrão"
clone_root_help = "Onde começa o campo “Onde clonar” do diálogo Clonar. Vazio usa o padrão de cada SO: %USERPROFILE%\\source\\repos no Windows, ~/src nos demais."
# context: setting: which source the Clone dialog opens on (Last used, Clone with URL, or an integration)
clone_start_source = "O diálogo Clonar começa em"
clone_start_source_help = "A fonte em que o diálogo Clonar abre. Último usado reabre a que ele mostrava quando foi fechado pela última vez; Clonar por URL sempre começa no formulário de URL; ou escolha uma das suas integrações conectadas. Uma fonte que não está mais disponível volta para Clonar por URL."
# context: option of the "Clone dialog starts on" setting: the source shown when the dialog was last closed
clone_start_last = "Último usado"
browse_root = "Pasta de navegação padrão"
browse_root_help = "Onde Procurar (o seletor de pastas, a partir da aba Início) abre por padrão. Vazio faz Procurar abrir na última pasta escolhida - ou na pasta pessoal, na primeira vez - em vez de uma fixa."
heading_auto_stash = "Auto-{$stash}"
heading_log = "Registro do aplicativo"
heading_undo = "Histórico de desfazer"
log_level = "Nível do registro"
log_retention_days = "Manter os arquivos de registro"
# context: setting help: how long log files are kept; a number and a unit (days, weeks, months, years) on one line
log_retention_help = "Os arquivos de registro mais antigos são excluídos quando o GitPoulpi inicia. O arquivo de cada dia também é limitado pela configuração de tamanho abaixo."
# context: setting: where the data GitPoulpi keeps for one repository lives (ref filters, fold state, workflow, caches)
repo_data_location = "Local dos dados do repositório"
# context: help of the setting above
repo_data_location_help = "Onde ficam os dados de cada repositório (filtros de refs, fluxo de trabalho, caches). Dentro de .git mantém a árvore de trabalho limpa; mudar esta configuração migra os dados existentes."
# context: option of the repository data location: inside the repository's .git folder
repo_data_in_git_dir = "Dentro de .git (pasta gitpoulpi)"
# context: option of the repository data location: a .gitpoulpi folder in the working tree
repo_data_in_worktree = "Na árvore de trabalho (pasta .gitpoulpi)"
# context: option of the repository data location: the user's own data folder
repo_data_user_data = "Na minha pasta de dados de usuário (fora do repositório)"
log_max_file_mb = "Tamanho máximo de um arquivo de registro"
log_timings = "Mostrar a duração das operações"
log_timings_help = "Adiciona a duração em milissegundos a cada operação do registro de atividade (aba Operações do Git)."
log_extended = "Registro estendido"
log_extended_help = "Lista também as operações em segundo plano (auto-{$fetch}, atualização, verificação do status) com a duração."
# context: setting: how the status line counts the total commits (the dropdown choices are in settings_value)
commit_count = "Contar o total de {$commits} com"
# context: help of the setting above; mentions antivirus software
commit_count_help = "Como a linha de status descobre o total em carregados / total. O git do sistema executa um processo git (normalmente o mais rápido). O libgit2 conta dentro do GitPoulpi e não inicia processo: escolha-o quando um antivírus examina cada comando e deixa o git lento. Desativado, mostra só os {$commits} carregados. Aplicado imediatamente."
auto_stash = { git = "Auto-{$stash} antes de checkout, {$pull}, {$merge} ou {$rebase}", local = "Auto-{$stash} antes de checkout, {$pull}, mesclar ou {$rebase}" }
auto_stash_help = { git = "O que fazer quando um checkout, {$pull}, {$merge} ou {$rebase} é bloqueado por alterações locais. perguntar: um diálogo oferece fazer stash delas, executar a operação e restaurá-las; sempre: faz isso sem perguntar; nunca: recusa, como o git faz.", local = "O que fazer quando um checkout, {$pull}, mesclar ou {$rebase} é bloqueado por alterações locais. perguntar: um diálogo oferece guardá-las, executar a operação e restaurá-las; sempre: faz isso sem perguntar; nunca: recusa, como o git faz." }
include_untracked_in_autostash = "Incluir arquivos não rastreados no auto-stash"
include_untracked_in_autostash_help = "Se o stash automático também leva arquivos não rastreados (caso contrário, só as alterações rastreadas são guardadas e restauradas)."
hosting_refresh_minutes = { git = "Atualização de {$prs} e issues", local = "Atualização de {$Prs} e issues" }
hosting_refresh_minutes_help = { git = "Com que frequência as listas de {$prs} e Issues da barra lateral (e o chip de {$pr_abbr} vinculado da barra de ferramentas) consultam o host de novo. 0 desliga o temporizador; elas ainda atualizam ao abrir um repositório, ao trocar de branch, após um push ou fetch, e sob demanda.", local = "Com que frequência as listas de {$Prs} e Issues da barra lateral (e o chip de {$pr_abbr} vinculado da barra de ferramentas) consultam o host de novo. 0 desliga o temporizador; elas ainda atualizam ao abrir um repositório, ao trocar de branch, após um envio ou uma busca, e sob demanda." }
pr_terminology = "Terminologia de solicitação de revisão"
pr_terminology_help = { git = "A palavra usada para uma solicitação de revisão de código hospedada em todo o TUI. Auto segue o host do repositório: Merge Request para o GitLab, Pull Request para os outros hosts. Pull Request ou Merge Request força essa palavra. Aplicado imediatamente.", local = "A palavra usada para uma solicitação de revisão de código hospedada em todo o TUI. Auto segue o host do repositório: Solicitação de mesclagem para o GitLab, solicitação de integração para os outros hosts. Cada uma das duas força essa palavra. Aplicado imediatamente." }
hide_finished_pr_chip = { git = "Ocultar o chip de {$pr} após o fechamento ou o {$merge}", local = "Ocultar o chip de {$pr} após o fechamento ou a {$merge}" }
hide_finished_pr_chip_help = { git = "O chip na barra de ferramentas mostra o {$pr} mais recente da branch atual. Ativado, ele some quando esse {$pr} é fechado ou mergeado, e a branch passa a oferecer o chip esmaecido “+ {$pr_abbr}”, como se não tivesse nenhum. Desativado, o chip sempre mostra o {$pr} mais recente, seja qual for o estado. Vale na hora.", local = "O chip na barra de ferramentas mostra a {$pr} mais recente da branch atual. Ativado, ele some quando essa {$pr} é fechada ou integrada, e a branch passa a oferecer o chip esmaecido “+ {$pr_abbr}”, como se não tivesse nenhuma. Desativado, o chip sempre mostra a {$pr} mais recente, seja qual for o estado. Vale na hora." }
heading_external_tools = "Ferramentas externas"
external_editor = "Editor externo"
external_editor_help = "Comando do item de menu “Abrir em <editor>” de um arquivo; {{file}} é o caminho completo do arquivo (acrescentado se ausente). Vazio: VS Code (`code`) quando está no PATH, senão o programa padrão do sistema."
external_diff_tool = { git = "Ferramenta de diff externa", local = "Ferramenta de comparação externa" }
external_diff_tool_help = { git = "Comando de “Abrir na ferramenta de diff externa”; {{local}} é a versão commitada (ou staged), {{remote}} a versão comparada. Vazio: `git difftool`, com o `diff.tool` configurado no git.", local = "Comando de “Abrir na ferramenta de comparação externa”; {{local}} é a versão commitada (ou preparada), {{remote}} a versão comparada. Vazio: a ferramenta de comparação configurada no git." }
external_merge_tool = "Ferramenta de {$merge} externa"
external_merge_tool_help = { git = "Comando de “Abrir na ferramenta de merge externa” em um cartão de conflito; {{base}}, {{local}} (A, atual), {{remote}} (B, recebido) e {{merged}} (onde a ferramenta grava o resultado; staged quando ela termina com sucesso). Vazio: `git mergetool`, com o `merge.tool` configurado no git.", local = "Comando de “Abrir na ferramenta de mesclagem externa” em um cartão de conflito; {{base}}, {{local}} (A, atual), {{remote}} (B, recebido) e {{merged}} (onde a ferramenta grava o resultado; preparado quando ela termina com sucesso). Vazio: a ferramenta de mesclagem configurada no git." }
file_explorer = "Explorador de arquivos"
file_explorer_help = "Comando de \"Mostrar na pasta\"; {{path}} é o caminho completo do arquivo, {{dir}} sua pasta. Windows: explorer.exe /select,\"{{path}}\" seleciona o arquivo; Linux: xdg-open \"{{dir}}\"; macOS: open -R \"{{path}}\"."
ai_assistant = "Assistente de IA"
launch = "Abrir uma janela para agentes"
launch_help = "Quando um agente de IA pede para mostrar algo e nenhuma janela do GitPoulpi está aberta em lugar nenhum, execute isto para abrir uma: desativado (nunca, o padrão), um terminal (kitty, foot, WezTerm, Windows Terminal, ...), uma nova aba/painel/workspace em um multiplexador (tmux, zellij, cmux, ...) ou custom, que usa o modelo abaixo. O agente ainda precisa pedir (`--launch`), ou seu ui_control precisa ser auto. Vale a partir do próximo pedido."
launch_command = "Comando de abertura (custom)"
launch_command_help = "Usado quando a escolha acima é custom. Dividido em argumentos (use aspas '...' ou \"...\"), sem shell. {{repo}} é a pasta do repositório, {{session}} o nome da sessão e {{gitpoulpi}} este programa. Exemplo: kitty --directory {{repo}} {{gitpoulpi}} --session {{session}}"
tab_dir_follow = "Seguir a pasta da aba ativa"
tab_dir_follow_help = "Um programa não consegue mudar a pasta do seu shell, então isto oferece duas formas de chegar lá. botões (padrão): enquanto a aba ativa não for a pasta em que o GitPoulpi foi iniciado, a barra de abas mostra Sair e cd aqui (só quando iniciado pelo wrapper do shell, veja `gitpoulpi shell-init`). auto: sem botões; ao sair, o shell sempre faz cd para a aba ativa, e um terminal abre sozinho sempre que você abre uma nova aba (não para as abas restauradas na inicialização)."
forget_all_usernames_and_passwords = "Esquecer todos os usuários e senhas"
forget_all_usernames_and_passwords_help = "Remove todo token que o GitPoulpi guardou no seu auxiliar de credenciais."
mcp_server = "Servidor MCP"
mcp_server_help = "Ativado, um agente de IA pode iniciar o servidor MCP (`gitpoulpi mcp serve`, ou `--http` para o endpoint de rede). Desativado, ele se recusa a iniciar. Salvo em `mcp.enabled`. Uma mudança vale na próxima vez que um agente iniciar o servidor; um servidor já em execução mantém as configurações com que iniciou."
mcp_port = "Porta do servidor MCP"
mcp_port_help = "A porta em que `gitpoulpi mcp serve --http` escuta quando nenhum endereço é informado (a parte do host de `mcp.bind` é mantida, 127.0.0.1 por padrão, somente loopback, a menos que --allow-remote). Vale na próxima vez que um agente iniciar o servidor; um servidor em execução mantém a sua porta."
mcp_bind_unreadable = "`mcp.bind` é “{bind}”, que não tem uma porta legível. Definir uma porta aqui mantém o host e substitui o resto."
undo_off_note = "Desfazer está desativado - ative “Desfazer ativado” para definir a profundidade"
use_mailmap = "Mostrar autores pelo .mailmap"
use_mailmap_help = "Mostra cada autor como o .mailmap do repositório o nomeia no Log, no blame e no histórico do arquivo. Os {$commits} em si não mudam. Aplicado imediatamente."
auto_prune_tags = { git = "Auto-prune de {$tags}", local = "Poda automática de {$tags}" }
auto_prune_tags_help = { git = "A cada fetch, exclui também as {$tags} locais que o remoto excluiu. Só são afetadas as {$tags} que estavam no remoto: uma {$tag} que você nunca enviou é mantida. Desativado por padrão, como no git.", local = "A cada busca, exclui também as {$tags} locais que o remoto excluiu. Só são afetadas as {$tags} que estavam no remoto: uma {$tag} que você nunca enviou é mantida. Desativado por padrão, como no git." }

