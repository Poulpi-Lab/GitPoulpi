script_timeout_help = "Quando um script externo demora mais que isto para responder a uma solicitação, o processo inteiro dele é interrompido e a reescrita falha sem mover nada."
# context: setting: how long one whole pass of an external script of a history rewrite may take; a number and a unit (seconds, minutes, hours) on one line
