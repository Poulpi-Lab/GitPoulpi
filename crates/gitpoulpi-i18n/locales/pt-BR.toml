way_recreate = "3. Último recurso: excluir e recriar o repositório remoto"
step_lift_github = { git = "Abra Settings > Branches (regras de proteção de branch) e Settings > Rules (rulesets) do repositório, remova ou afrouxe a regra que cobre a branch, faça push da reescrita e depois restaure a regra.", local = "Abra Settings > Branches (regras de proteção de branch) e Settings > Rules (rulesets) do repositório, remova ou afrouxe a regra que cobre a branch, envie a reescrita e depois restaure a regra." }
step_lift_gitlab = "Abra Settings > Repository > Protected branches, desproteja a branch (ou ative a opção que permite reescrever o histórico dela) e proteja-a de novo depois que a reescrita for enviada."
step_lift_azure = { git = "Abra Project settings > Repositories > o repositório > Policies, remova a política da branch e, em Security, conceda a si mesmo a permissão de reescrever o histórico e excluir branches, faça push da reescrita e restaure as duas coisas.", local = "Abra Project settings > Repositories > o repositório > Policies, remova a política da branch e, em Security, conceda a si mesmo a permissão de reescrever o histórico e excluir branches, envie a reescrita e restaure as duas coisas." }
step_lift_bitbucket = { git = "Abra as configurações do repositório > Branch restrictions (Branch permissions no Data Center), remova a restrição que cobre a branch, faça push da reescrita e restaure a restrição.", local = "Abra as configurações do repositório > Branch restrictions (Branch permissions no Data Center), remova a restrição que cobre a branch, envie a reescrita e restaure a restrição." }
step_lift_other = { git = "Remova ou afrouxe a regra de proteção de branch nas configurações do repositório no host, faça push da reescrita e restaure a regra.", local = "Remova ou afrouxe a regra de proteção de branch nas configurações do repositório no host, envie a reescrita e restaure a regra." }
