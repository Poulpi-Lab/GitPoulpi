rewrite_4 = "adiciona uma regra, exclui a regra sob o cursor, restaura a última excluída, duplica a regra"
rewrite_5 = "ativa ou desativa a regra, ou a move para cima ou para baixo (as regras rodam de cima para baixo)"
rewrite_6 = "alterna entre as abas da prévia"
rewrite_7 = "salva a receita no repositório ou só para você, carrega uma já salva, renomeia; os valores secretos nunca são salvos"
rewrite_8 = "inclui ou deixa de fora toda branch protegida que já foi publicada; verifica de novo as ferramentas externas"
file_history_1 = "ir ao {$commit} da linha no Log, carregando mais do Log se ainda não estiver lá"
file_history_2 = { git = "mover a seleção; o diff à direita acompanha na hora", local = "mover a seleção; a diferença à direita acompanha na hora" }
file_history_3 = { git = "estender a seleção a um intervalo: a direita mostra então o diff do arquivo entre as duas pontas (Shift+clique faz o mesmo)", local = "estender a seleção a um intervalo: a direita mostra então a diferença do arquivo entre as duas pontas (Shift+clique faz o mesmo)" }
file_history_4 = { git = "dar o teclado ao diff, ou devolvê-lo à lista", local = "dar o teclado à diferença, ou devolvê-lo à lista" }
file_history_5 = "copiar o SHA do {$commit}, ou o resumo dele"
file_history_6 = { git = "lado direito: o diff, o arquivo como estava nesse {$commit}, ou o blame; acompanha a seleção e mantém o modo", local = "lado direito: a diferença, o arquivo como estava nesse {$commit}, ou o blame; acompanha a seleção e mantém o modo" }
file_history_7 = "comparar a versão da linha com a árvore de trabalho (pressione de novo para voltar)"
file_history_8 = "restaurar o arquivo para essa versão na árvore de trabalho (pergunta antes; Desfazer devolve os bytes antigos)"
file_history_9 = "redimensionar a lista (o divisor também arrasta; a largura é lembrada)"
file_history_10 = "mouse: clique em uma linha, Shift+clique para um intervalo, clique duplo mostra no Log, clique com o botão direito abre o menu"
commit_column_1 = "rolar as linhas para os lados (Shift+roda ou uma roda horizontal fazem o mesmo); elas só rolam quando uma parte ficou mais larga que o espaço disponível"
commit_column_2 = "escolher uma parte (faixas, autor, data) e alargá-la ou estreitá-la, ou devolver todas as partes à largura automática; os limites no cabeçalho também podem ser arrastados e as larguras são lembradas"
commit_column_3 = "mouse: clique numa linha para escolher o {$commit} dela, clique direito abre o menu (a tecla de menu também, depois de escolher uma linha com Cima/Baixo)"
commit_column_4 = "mover a parte escolhida para a esquerda ou para a direita; arrastar o cabeçalho dela faz o mesmo, e a ordem é memorizada"
log_columns_1 = "escolher uma coluna do Log (a célula do cabeçalho dela se acende); depois movê-la para a esquerda ou para a direita (arrastar o cabeçalho faz o mesmo), alargá-la ou estreitá-la (arrastar a borda faz o mesmo), voltar à largura automática ou ajustá-la ao conteúdo (dar um clique duplo na borda faz o mesmo; + ajusta todas as colunas). Tab / Shift+Tab escolhem outra coluna, Esc sai; a disposição é memorizada"
global_1 = "abrir a paleta de comandos - todos os comandos do app, cada um com seu atalho; digite para filtrar, Cima/Baixo ou PageUp/PageDown para mover (não j/k: esses são digitados), Enter para executar. As linhas em cinza dizem por que não podem ser executadas agora"
global_2 = "o prefixo de navegação - veja a seção própria abaixo"
global_3 = "o prefixo das ações do git - veja a seção própria abaixo"
global_4 = "alternar esta ajuda - abre por cima de qualquer outra coisa aberta (Configurações, Gerenciamento de repositórios, ...), não só do grafo simples"
global_5 = "forçar uma atualização"
global_6 = "{$fetch}, rever {$prs} e issues, recarregar"
global_7 = "desfazer / refazer a última operação (commit, amend, checkout, criar/excluir branch); pergunta antes quando é arriscado"
global_9 = { git = "sair - a partir do grafo; sobre um diff ou visualização de arquivo, fecha essa visualização. Toda saída é registrada em gitpoulpi-tui-exit.log, junto da configuração", local = "sair - a partir do grafo; sobre uma diferença ou visualização de arquivo, fecha essa visualização. Toda saída é registrada em gitpoulpi-tui-exit.log, junto da configuração" }
global_10 = "abrir um menu de contexto, onde quer que exista um abaixo - as teclas são intercambiáveis (a tecla Menu/Apps raramente chega a este app no Windows, então a combinação F10 é a que funciona de forma confiável lá)"
global_11 = "levar o foco ao próximo painel / ao painel anterior"
global_12 = "mover a seleção (todo painel e lista)"
global_13 = "prefixo de contagem estilo vim em j/k/Cima/Baixo (e PageUp/PageDown, como contagem de telas) - os dígitos digitados aparecem como “4...” na linha de status até o movimento acontecer; Esc ou qualquer outra tecla o limpa, e um 0 inicial nunca começa um (então os dígitos continuam sendo digitados normalmente no compositor, no filtro de Refs e em todo outro campo de texto)"
