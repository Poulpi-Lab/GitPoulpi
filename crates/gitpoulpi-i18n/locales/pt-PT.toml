# Log: Copy as Mermaid gitGraph (mermaid_popup.rs).
[mermaid]
# context: title of the popup that turns Log commits into a Mermaid gitGraph script. Width budget: 40 cells
title = "Copiar como Mermaid gitGraph"
# context: label of the combobox that picks which commits go into the script. Width budget: 12 cells
scope_label = "{$Commits}"
# context: label of the combobox that picks how much is written per commit. Width budget: 12 cells
detail_label = "Detalhe"
# context: label of the combobox that picks the direction of the graph. Width budget: 12 cells
orientation_label = "Direção"
# context: scope combobox row: only the selected commits; {n} is how many
scope_selection = { one = "Seleção ({n} {$commit})", other = "Seleção ({n} {$commits})" }
# context: scope combobox row: from the oldest selected commit up to HEAD; {n} is how many commits that is
scope_to_head = { one = "Da seleção até {$head} ({n} {$commit})", other = "Da seleção até {$head} ({n} {$commits})" }
# context: detail combobox row: the lowest level
detail_structure = "Estrutura: {$commits}, branches, {$commits} de {$merge}"
# context: detail combobox row: adds branch names, tags and the HEAD mark
detail_refs = "Refs: + nomes de branches, {$tags}, {$head}"
# context: detail combobox row: adds the commit subject to each commit id
detail_subjects = "Assuntos: + assuntos dos {$commits}"
# context: detail combobox row: adds author and date to each commit id
detail_full = "Completo: + autor e data"
# context: direction combobox row
orientation_lr = "Da esquerda para a direita"
# context: direction combobox row
orientation_tb = "De cima para baixo"
# context: checkbox: wrap the script in a Markdown code fence (keep the three backticks and the word mermaid)
fence = "Incluir o delimitador ```mermaid"
# context: title of the scrollable box that shows the generated text. Width budget: 20 cells
preview = "Pré-visualização"
# context: button: copy the script. Width budget: 10 cells
copy_button = "Copiar"
# context: button: close the popup. Width budget: 10 cells
close_button = "Fechar"
# context: key hint: Tab moves to the next field
hint_next = "campo seguinte"
# context: key hint: Enter copies the script
hint_copy = "copiar"
# context: key hint: the arrows scroll the preview
hint_scroll = "deslocar"
# context: title of the viewer that shows one Mermaid diagram of a conversation. Width budget: 40 cells
view_title = "Diagrama Mermaid"
# context: key hint: Esc closes the viewer
hint_close = "fechar"
# context: noun for the status line after a copy: 'copied <this> (...)'
diagram_copied_what = "Diagrama Mermaid"
# context: noun for the status line after a copy: 'copied <this> (...)'
copied_what = "Mermaid gitGraph"
# context: status line: Copy as Mermaid gitGraph was used with nothing to copy
no_commits = "nenhum {$commit} para copiar como Mermaid gitGraph: clique primeiro num {$commit} no Log"
# context: command palette entry
palette_copy = "Log: copiar como Mermaid gitGraph..."
# context: name of the key binding in Settings and Help
keymap_copy = "Copiar {$commits} como Mermaid gitGraph"
# context: Log context menu entry; opens the popup
menu_copy = "Copiar como Mermaid gitGraph..."
# context: help line, next to the key that opens the Copy as Mermaid gitGraph popup
help_copy = "copiar os {$commits} selecionados (ou deste até {$head}) como script Mermaid gitGraph: escolha o nível de detalhe, leia o texto e prima Enter para o copiar"

[compare]
# context: title of the right pane while two or more Log rows are compared
title = "Comparar"
# context: first line of the right pane while comparing: the word before the two ends
header = "A comparar"
# context: button that swaps the two compared ends (older/newer)
swap = "Trocar"
# context: status line when Swap cannot apply: the WIP row is always the newer end
swap_refused = "nada para trocar: a linha WIP é sempre a extremidade mais recente"
# context: the working-changes row of the Log, as one end of a comparison
wip = "WIP"
# context: the older end of a comparison; {label} is a short id and summary, WIP or a stash
from_line = "De: {label}"
# context: the newer end of a comparison; {label} is a short id and summary, WIP or a stash
to_line = "Até: {label}"
# context: start of a combined range: the state just before the oldest selected row; {label} names that row
before = "Antes de {label}"
# context: three or more rows selected: their changes are combined into one list; {n} is the row count
range_note = "Combinado, {n} linhas selecionadas: de logo antes da mais antiga até à mais recente"
# context: status line after selecting several Log rows (Ctrl+click, Space, Shift+click)
rows_selected = { one = "{n} linha selecionada: o painel direito compara-as (Esc limpa)", other = "{n} linhas selecionadas: o painel direito compara-as (Esc limpa)" }
# context: status line when Compare Selection is used with fewer than two rows selected
select_more = "selecione primeiro duas ou mais linhas (Ctrl+clique, Espaço, Shift+clique)"
# context: status line after Compare Selection: the file list of the comparison now has the focus
comparing = "a comparar: escolha um ficheiro no painel direito para o abrir"
# context: command palette entry
palette_compare_selection = "Log: comparar a seleção"
# context: command palette entry
palette_swap = "Log: trocar as extremidades da comparação"
# context: name of the key binding in Settings and Help
keymap_compare_selection = "Comparar as linhas selecionadas"
# context: name of the key binding in Settings and Help
keymap_swap = "Trocar as extremidades da comparação"
# context: help line, next to the key that compares the Log's selected rows
help_compare = "comparar as linhas selecionadas (WIP, {$stashes}, {$commits}): o painel direito lista os ficheiros que diferem entre a mais antiga e a mais recente; Esc ou um clique simples volta"
# context: help line, next to the key that swaps the comparison's ends
help_swap = "trocar as duas extremidades da comparação (duas linhas, sem WIP)"
# context: tag on the older end's card of a comparison (the state compared from)
