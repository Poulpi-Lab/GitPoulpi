mouse_gestures_in_1 = "os terminais não mudam o formato do ponteiro do SO para quase nada, por isso uma mudança de fundo/primeiro plano ao passar o rato costuma ser o único sinal de \"isto é clicável\" - cada botão, caixa, separador, linha de menu, ação de cabeçalho de painel e o botão de fechar × acendem-se ao passar o rato; uma célula do Log, as outras refs de um commit e a margem de ficheiro/blame mostram uma dica de valor"
