tab_size_help = { git = "Colunas entre as posições de tabulação, no editor integrado (desenho, Shift+Tab) e nas vistas de diff. A vista de blame desenha a tabulação como um espaço e ignora-a.", local = "Colunas entre as posições de tabulação, no editor integrado (desenho, Shift+Tab) e nas vistas de diferença. A vista de blame desenha a tabulação como um espaço e ignora-a." }
eol = "Fim de linha"
eol_help = "O que o editor integrado grava ao guardar. Auto mantém o fim de linha do próprio ficheiro (LF para um ficheiro novo); LF ou CRLF converte o ficheiro ao guardar. A barra de estado do editor mostra o que a próxima gravação grava."
syntax_highlighting = "Realce de sintaxe"
syntax_highlighting_help = { git = "Colore o editor integrado por linguagem. As vistas de diff e de blame não têm cores de sintaxe.", local = "Colore o editor integrado por linguagem. As vistas de diferença e de blame não têm cores de sintaxe." }
line_numbers = "Números de linha"
line_numbers_help = { git = "A coluna de números do editor integrado e das vistas de diff (nestas fica em branco, as colunas mantêm o lugar). A vista de blame não tem.", local = "A coluna de números do editor integrado e das vistas de diferença (nestas fica em branco, as colunas mantêm o lugar). A vista de blame não tem." }
follow_selection = "Seguir a seleção no editor"
follow_selection_help = "Com o editor aberto, selecionar outro ficheiro no painel direito também o abre no editor, depois de perguntar se as alterações por guardar devem ser guardadas. Um ficheiro que não pode ser editado abre na vista habitual."
merge_side_by_side_min_width = { git = "Editor de merge: lado a lado a partir de (colunas)", local = "Editor de integração: lado a lado a partir de (colunas)" }
merge_side_by_side_min_width_help = { git = "O editor de conflitos de merge mostra A e B lado a lado quando a sua área tem pelo menos esta largura em colunas (linhas longas deslocam para o lado com Shift+roda ou Shift+setas); mais estreito, mostra um lado de cada vez em separadores. 100 por predefinição; 40 é o menor valor, 0 significa sempre lado a lado. O editor oculta os painéis Refs e Status enquanto está aberto, por isso normalmente tem a janela inteira.", local = "O editor de conflitos de integração mostra A e B lado a lado quando a sua área tem pelo menos esta largura em colunas (linhas longas deslocam para o lado com Shift+roda ou Shift+setas); mais estreito, mostra um lado de cada vez em separadores. 100 por predefinição; 40 é o menor valor, 0 significa sempre lado a lado. O editor oculta os painéis Refs e Status enquanto está aberto, por isso normalmente tem a janela inteira." }
diff_word_wrap = "Quebra de linha"
diff_word_wrap_help = { git = "Quebra as linhas longas nas vistas de diff em vez de as cortar com reticências. O editor integrado e a vista de blame deslocam-se para o lado e não quebram. É também o alternador de quebra da própria vista de diff.", local = "Quebra as linhas longas nas vistas de diferença em vez de as cortar com reticências. O editor integrado e a vista de blame deslocam-se para o lado e não quebram. É também o alternador de quebra da própria vista de diferença." }
diff_intraline = "Highlight changed words"
diff_intraline_help = "In a changed line, paints the words that differ from the matching removed or added line with a stronger background, in every {$diff} view. Off keeps one flat tint per line. Also in the command palette."

[settings_ui]
theme = "Tema"
theme_help = "Cores de toda a interface. Percorrer a lista pré-visualiza cada tema; Enter mantém-no, Esc volta atrás. Sistema segue o terminal (o seu fundo claro ou escuro, detetado uma vez ao arrancar; Escuro quando não é possível saber). Os seus próprios ficheiros de tema na pasta themes/ da configuração aparecem no fim."
theme_system = "Sistema (segue o terminal)"
follow_theme = "Seguir o tema"
theme_swatches = "Cores"
graph_lane_background = "Fundo das faixas do grafo"
graph_lane_background_help = "Desativado: transparente, nada atrás das faixas (predefinição). Tom da linha: uma faixa suave na cor da faixa do commit dentro da coluna Grafo, mais uma barra fina dessa cor na margem direita da coluna. Uma faixa armazenada é lida como Tom da linha. Aplica-se quando as Definições fecham."
graph_row_tint_strength = "Intensidade do tom da linha"
graph_row_tint_strength_help = "Quão atenuada é a faixa de Tom da linha: Forte (a original), Média (predefinição) ou Subtil. Só a faixa atenua; a barra na margem direita da coluna mantém a cor total. Aplica-se quando as Definições fecham."
graph_row_tint_strength_coming = "defina antes o Fundo das faixas do grafo como Tom da linha"
toolbar_position = "Posição da barra de ferramentas"
toolbar_position_help = "Onde fica a barra de ferramentas: Topo, Fundo (predefinição), Esquerda ou Direita. Esquerda e Direita formam uma coluna junto aos painéis; uma janela com menos de 80 colunas desenha-a no fundo. Aplica-se de imediato."
toolbar_align = "Alinhamento dos botões da barra de ferramentas"
toolbar_align_help = "Onde ficam os botões ao longo da barra: Início (predefinição), Centro ou Fim. O início é a esquerda de uma linha e o topo de uma coluna; o fim é a direita e o fundo. Aplica-se de imediato."
# context: label of the setting that decides whether a dialog the user moved or resized keeps its place
dialog_geometry = "Memorizar posição e tamanho das janelas"
dialog_geometry_help = "Uma única definição para todas as janelas. As janelas podem ser movidas (arraste a barra de título, ou Ctrl+N e depois m); as janelas maiores também podem ser redimensionadas (arraste as margens e os cantos inferiores). Cada janela memoriza o seu próprio lugar e tamanho. Nesta sessão (predefinição): mantidos até o GitPoulpi fechar. Guardado em disco: mantidos também no próximo arranque. Nunca: cada janela abre no lugar e com o tamanho predefinidos. Aplica-se de imediato."
toolbar_pr_pinned = "Fixar o botão de {$pr} no fim"
toolbar_pr_pinned_help = "Ativado (predefinição), o botão de {$pr} fica na extremidade da barra de ferramentas (à direita, ou no fundo numa coluna), seja qual for o alinhamento. Desativado, segue os outros botões e alinha com eles. Aplica-se de imediato."
statusbar_position = "Posição da barra de estado"
statusbar_position_help = "Onde fica a barra de estado (branch, contagens, mensagens, atalhos): Topo, acima dos separadores de repositório, ou Fundo (predefinição). O separador Início mantém a sua própria barra de estado no fundo. Aplica-se de imediato."
tabs_position = "Posição da barra de separadores"
tabs_position_help = "Onde ficam os separadores de repositório: Topo (predefinição), Fundo ou Esquerda, uma lista com um separador por linha na margem esquerda da janela. Uma janela com menos de 80 colunas desenha-os no topo. Junto a uma barra de ferramentas em coluna, os separadores ficam por fora. Aplica-se de imediato."
graph_color_theme = "Tema de cores do grafo"
graph_color_theme_help = "A paleta de cores das faixas do grafo do Log. Seguir o tema usa a paleta do tema escolhido; qualquer outra entrada substitui-a, pelo que qualquer tema pode ser combinado com qualquer paleta. Aplica-se ao fechar as preferências."
graph_renderer = "Renderizador do grafo"
graph_renderer_help = "auto desenha o grafo como uma imagem real num terminal que a suporta, e como caracteres nos restantes - incluindo dentro de zellij e screen, que herdam o ambiente do terminal mas não reencaminham a imagem, dentro do tmux a menos que o terminal por trás aceite sixel, e dentro do herdr, a menos que a sua opção kitty_graphics esteja ativada. image força a imagem, text desativa-a. Exige reinício."
image_protocol = "Protocolo de imagem"
image_protocol_help = "Como as imagens (a imagem do grafo, avatares de autores) chegam ao terminal. auto: o protocolo gráfico do Kitty no kitty, no Ghostty e num herdr cuja configuração tenha kitty_graphics = true; o protocolo do Kitty também no iTerm2 3.7.7 ou posterior; imagens inline do iTerm2 no WezTerm, Rio, mintty e iTerm2 mais antigo; imagens sixel (a coluna do grafo e os avatares) no Windows Terminal, foot, Tabby, Konsole, mlterm e no tmux quando o terminal por trás aceita sixel; carateres nos restantes. kitty, iterm2 ou sixel força esse protocolo (kitty para um herdr cuja configuração está noutro local; sixel para um terminal que o desenha mas não é reconhecido); none desativa as imagens. Exige reinício."
kitty_keyboard = "Protocolo de teclado do Kitty"
kitty_keyboard_help = "auto pergunta ao terminal, no arranque e em cerca de 100 ms, se fala o protocolo de teclado do kitty, e usa-o se for o caso: combinações que os terminais antigos não distinguem (Control com pontuação, dígitos, Shift ou Enter) chegam então tal como são, em vez de colidirem com códigos de controlo. Um terminal que não responde mantém as teclas antigas. off nunca mexe no modo de teclado do terminal. Exige reinício."
color_depth = "Profundidade de cor"
color_depth_help = "auto usa cor de 24 bits, exceto em terminais que não a mostram (Terminal da Apple, consola do Linux ou um terminal de 256 cores sem COLORTERM), onde as cores são mapeadas para as 256 ou 16 entradas mais próximas. truecolor, 256 e 16 forçam uma profundidade. Aplica-se de imediato."
text_cursor = "Cursor de texto"
text_cursor_help = "terminal põe o cursor do próprio terminal na posição do cursor de texto do campo em foco, como uma barra: aplicam-se as definições de cursor do seu terminal e a janela de candidatos de um método de entrada abre nessa posição. drawn desenha o cursor próprio do GitPoulpi (um bloco ou um sublinhado) e mantém o cursor do terminal oculto. Aplica-se de imediato."
graph_show_stashes = "Mostrar stashes no grafo"
graph_show_stashes_help = "Cada stash ganha uma linha própria no Log, na sua data: uma caixa pequena numa faixa ao lado do commit em que foi feita, ligada a ele por uma linha tracejada. Selecioná-la mostra o que alterou; o clique com o botão direito (ou .) oferece Pop, Apply e Drop. Desativado, os stashes ficam só na secção STASHES. Não é desenhado durante o solo."
ref_connector = "Conector ref-commit"
ref_connector_help = "Uma linha fina de cada pílula de ref na coluna Ref até ao círculo do seu commit no grafo. Só preenche espaço em branco: as faixas por onde passa ficam por cima e nada se move. Desenhada só enquanto a coluna Ref está imediatamente à esquerda da coluna Grafo."
log_wip_counts_in_message = "Mostrar contagens de alterações do WIP na mensagem quando a coluna Alterações está oculta"
log_wip_counts_in_message_help = "A linha WIP mostra quantos ficheiros foram modificados, adicionados e eliminados. Com a coluna Alterações visível (clique com o botão direito no cabeçalho do Log para mostrá-la), as contagens vão sempre para essa coluna, como as de qualquer commit. Com ela oculta, vão na mensagem do WIP enquanto isto estiver ativado; desativado, não mostra contagem alguma."
avatars = "Avatares dos autores"
avatars_help = "Imagens de autor. graph desenha o autor de cada commit dentro do seu círculo no grafo (só no grafo de imagem; no grafo de texto, uma inicial colorida vai na coluna Autor). author coloca uma imagem redonda no início da coluna Autor. Ambos também a mostram no painel de detalhes do commit. Desativado por predefinição: ativar isto envia um hash SHA-256 do e-mail de cada autor ao gravatar.com por HTTPS - o hash de um endereço conhecido ou previsível não é anónimo - e, num repositório com remoto github.com, consulta a API do GitHub uma vez por autor para saber que conta fez um dos seus commits (usando o token da sua integração com o GitHub, quando houver). Até a imagem chegar, e quando não existe, mostram-se as iniciais ou o círculo simples. off não envia nada pela rede."
avatar_sources = "Fontes de avatar"
avatar_sources_help = "Onde a imagem de um autor é procurada, por ordem (um endereço noreply do GitHub indica sempre primeiro a sua conta). hosting_gravatar: a integração GitHub, GitLab ou Bitbucket ligada cujo host corresponde ao remoto do repositório (autor de commit ou pesquisa de utilizador no GitHub, avatar por e-mail ou API de utilizadores no GitLab), depois o Gravatar; sem integração correspondente ligada, o Gravatar vem primeiro e um remoto github.com ainda é consultado por último, sem autenticação. gravatar_hosting: o inverso. gravatar ou hosting: só essa. Quando nenhuma tem imagem, desenha-se o avatar alternativo abaixo. Vale para autores ainda não consultados."
avatar_fallback = "Avatar alternativo"
avatar_fallback_help = "O que um autor sem imagem recebe. identicon: um padrão espelhado 5x5 ao estilo GitHub numa cor derivada do e-mail, gerado localmente (sem rede), como imagem num terminal de imagens e como caracteres de bloco nos restantes. initials: um selo colorido com as iniciais."
composer_files = "Propostas do compositor"
composer_files_help = "Como abre a revisão do compositor de commits com IA. expandido: cada commit proposto lista os seus ficheiros. recolhido: só as linhas dos commits; Direita/Esquerda (ou um clique na seta) abre um."
blame_side = "Anotações do blame"
blame_side_help = "Lado da vista Blame onde fica a coluna de anotações (avatar, autor, idade, resumo). right: à direita do código. left: à esquerda do código."
column_resize = "Redimensionamento das colunas"
column_resize_help = "Como se agarra a fronteira de uma coluna no Log, no Radar e na coluna lateral das vistas de ficheiro. line: uma linha fina em toda a altura da tabela enquanto o ponteiro está na fronteira, com uma pequena marca no cabeçalho. header: sem espaço nem marca, redimensiona-se só a partir do cabeçalho, onde o primeiro carácter da célula seguinte se acende."
blame_width = "Largura das anotações do blame"
blame_width_help = "Largura da coluna de anotações em células (24 a 90). Arraste a margem na vista Blame ou use as teclas de alargar / estreitar; a nova largura fica guardada aqui."
ref_tree = "Árvore de pastas de branches"
ref_tree_help = "A barra lateral Refs agrupa nomes de branch em `/` em pastas recolhíveis, com cada remoto como nó de nível superior. Desativado, dá uma linha simples por branch. `y` no painel Refs alterna isto de imediato e grava a escolha aqui."
tree_folders_first = "Pastas primeiro na vista em árvore"
tree_folders_first_help = "A vista em árvore dos painéis de ficheiros (Alterações, detalhes, comparação) lista as subpastas de uma pasta antes dos seus ficheiros. Desativado, mantém a ordem alfabética simples dos caminhos. A lista plana não é afetada."
reveal_on_ref_click = "Clicar numa ref mostra-a no grafo"
reveal_on_ref_click_help = "Um único clique numa ref no painel Refs desloca o Log até onde ela aponta e faz a linha piscar. A seleção do Log e o painel direito não mudam. Desativado, um clique só seleciona a linha da barra lateral. \"Mostrar no grafo\" no menu da ref, a sua tecla no painel Refs e o comando da paleta funcionam nos dois casos."
graph_ghost_ref = "Mostrar uma branch fantasma no {$commit} sob o rato"
graph_ghost_ref_help = "Na coluna Ref do Log, o {$commit} sob o rato que não tem ref própria mostra uma pílula esbatida com o nome da branch a que pertence (senão a branch remota), deduzido do histórico. Passar o rato na pílula mostra o tipo. Clicar nela não faz nada de especial; o comando de criar branch cria uma branch. Só é desenhada onde a coluna Ref tem espaço. Desativado, fica oculta."
mouse_enabled = "Rato ativado"
mouse_enabled_help = "Desativado, deixa a seleção por arrastar para o seu terminal. Exige reinício."
mouse_scroll_lines = "Linhas da roda do rato"
mouse_scroll_lines_help = "Quantos commits um clique da roda move no Log. Exige reinício."
heading_date_time = "Data e hora"
heading_layout = "Disposição"
date_locale = "Idioma das datas e horas"
date_locale_help = "system: os nomes de mês e dia seguem o idioma da interface. english: sempre em inglês, seja qual for o idioma. Aplica-se a todas as datas desta página."
diff_layout = "Layout predefinido"
diff_layout_help = { git = "Inline (uma coluna) ou Dividido (antes e depois lado a lado). Retomado do último diff que viu, nesta janela e entre reinícios - mudar aqui só define de onde parte uma sessão *nova*.", local = "Inline (uma coluna) ou Dividido (antes e depois lado a lado). Retomado da última diferença que viu, nesta janela e entre reinícios - mudar aqui só define de onde parte uma sessão *nova*." }
diff_hunks_only = "Só hunks"
diff_hunks_only_help = "Ativado mostra só os hunks alterados com algumas linhas de contexto; desativado mostra o ficheiro todo com as alterações realçadas no lugar. Retomado como o layout."
diff_show_whitespace = "Mostrar alterações só de espaços em branco"
diff_show_whitespace_help = "Desativado reduz a contexto um hunk que difere apenas em espaços em branco."
input_color = "Cor dos campos"
input_color_help = "Fundo dos campos de texto. Seguir o tema (predefinição) usa o do tema; os restantes são cores escuras que o substituem. Personalizada... usa a cor hexadecimal abaixo. Aplica-se de imediato, sem reiniciar."
input_color_custom = "Cor personalizada dos campos"
input_color_custom_help = "#rrggbb, usada quando a Cor dos campos é Personalizada. Aplica-se de imediato."
minimap = "Minimapa"
minimap_help = { git = "Uma imagem do ficheiro inteiro ao lado da barra de deslocação vertical do diff (modo ficheiro todo) e do editor, com a parte visível realçada; clique para saltar. Uma imagem real onde o terminal as desenha, células braille nos restantes. Também `M` no diff e Alternar minimapa na paleta.", local = "Uma imagem do ficheiro inteiro ao lado da barra de deslocação vertical da diferença (modo ficheiro todo) e do editor, com a parte visível realçada; clique para saltar. Uma imagem real onde o terminal as desenha, células braille nos restantes. Também `M` na diferença e Alternar minimapa na paleta." }
date_format = "Formato de data"
date_format_help = "A coluna de data do Blame / Histórico do ficheiro."
date_time_format = "Formato de data/hora"
date_time_format_help = "A própria coluna Data do Log."
date_verbose_format = "Formato de data detalhado"
date_verbose_format_help = "A linha Data do painel de detalhes do commit, a dica ao passar o rato na coluna Data e Copiar > Data."
preview = "pré-visualização"
sidebar_sections_scope = "Secções do painel esquerdo"
sidebar_sections_scope_help = "A quem pertence a escolha das secções mostradas ou ocultas do painel esquerdo. repository: cada repositório guarda o seu conjunto (o global é o ponto de partida). global: um só conjunto para todos os repositórios. Mudar de uma opção para a outra nunca perde nenhum dos conjuntos."
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "Disposição das colunas"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "Como o Log dispõe as suas colunas. fit: cada coluna cabe no painel e só Mensagem se adapta. scroll: as colunas mantêm a largura, Mensagem também, e a tabela desloca-se lateralmente quando é mais larga do que o painel."

[settings_git]
default_backend = "Backend do git"
default_backend_help = "Global. Um daemon em execução mantém o backend com que iniciou."
default_backend_warning = "Vale para daemons iniciados depois desta mudança."
pull_mode = "Botão {$Pull}"
default_encoding = "Codificação predefinida"
default_encoding_help = { git = "Usada para mostrar conteúdos de ficheiros, blame e diffs que não são UTF-8 válido (o UTF-8 válido nunca é descodificado de novo). Um repositório pode substituí-la abaixo. Só apresentação: staging e patches mantêm exatamente os bytes do ficheiro.", local = "Usada para mostrar conteúdos de ficheiros, blame e diferenças que não são UTF-8 válido (o UTF-8 válido nunca é descodificado de novo). Um repositório pode substituí-la abaixo. Só apresentação: preparação e patches mantêm exatamente os bytes do ficheiro." }
push_behavior = "Botão {$Push}"
push_behavior_help = "direto: {$push} para o remoto predefinido de imediato. perguntar: abre um pequeno menu com o remoto predefinido pré-selecionado. O ▾ do botão pergunta sempre."
repo_encoding_help = { git = "Como conteúdos de ficheiros, blame e diffs são descodificados para apresentação quando não são UTF-8 válido (só este repositório; herdada: Codificação predefinida nesta página). O staging nunca recodifica nada.", local = "Como conteúdos de ficheiros, blame e diferenças são descodificados para apresentação quando não são UTF-8 válido (só este repositório; herdada: Codificação predefinida nesta página). A preparação nunca recodifica nada." }
core_autocrlf_help = "Gravado na configuração git deste repositório (core.autocrlf), pelo que o git e qualquer outra ferramenta o veem. true: LF para CRLF no checkout; input: CRLF para LF só ao guardar no histórico; false: nunca converter. (herdado): remove o valor do repositório para se aplicar a sua configuração git global. Pode ser desfeito."
core_eol_help = "Gravado na configuração git deste repositório (core.eol): o fim de linha que o git usa nos ficheiros de texto da árvore de trabalho (lf, crlf ou native, o da plataforma). (herdado): remove o valor do repositório para se aplicar a sua configuração git global. Pode ser desfeito."
git_lfs = "Git LFS"
git_lfs_help = { git = "Mostrar o Git LFS na interface (a tag LFS, o cartão de diff, o aviso de programa em falta, os comandos LFS) e deixar o GitPoulpi executar os seus próprios passos de LFS (transferir objetos após um clone). Desativado: os filtros LFS do próprio git continuam a ser executados, o GitPoulpi nunca chama o git-lfs.", local = "Mostrar o Git LFS na interface (a marca LFS, o cartão de diferença, o aviso de programa em falta, os comandos LFS) e deixar o GitPoulpi executar os seus próprios passos de LFS (transferir objetos após um clone). Desativado: os filtros LFS do próprio git continuam a ser executados, o GitPoulpi nunca chama o git-lfs." }
git_lfs_program = "Programa git-lfs"
git_lfs_program_help = "Instale-o em https://git-lfs.com (Windows: incluído no Git for Windows, ou `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Paleta: LFS: Abrir página de instalação."
initialize_lfs_for_this_repository = "Inicializar o LFS neste repositório"
initialize_lfs_for_this_repository_help = "Executa `git lfs install --local`: os filtros e hooks do LFS na configuração deste repositório, nunca na global. Exige git-lfs."
pull_mode_help = { git = "O que o botão {$Pull}{hint} da barra de ferramentas faz: merge (fast-forward se possível), ff_only ou rebase. Os itens do ▾ do botão executam a própria ação de imediato e não mudam isto.", local = "O que o botão {$Pull}{hint} da barra de ferramentas faz: integração (fast-forward se possível), ff_only ou rebase. Os itens do ▾ do botão executam a própria ação de imediato e não mudam isto." }
merge_fast_forward = { git = "Fast-forward do {$merge}", local = "Fast-forward da integração" }
merge_fast_forward_help = { git = "Como um {$merge} que inicia (menu da branch, arrastar e largar, paleta, linha de comandos) trata uma branch que podia simplesmente avançar por fast-forward. never: faz sempre um {$commit} de {$merge}. allowed: fast-forward quando possível, como o git faz por predefinição. only: apenas fast-forward, ou recusa quando não é possível. Um repositório pode substituí-lo na sua página Opções de {$merge}.", local = "Como uma integração que inicia (menu da branch, arrastar e largar, paleta, linha de comandos) trata uma branch que podia simplesmente avançar por fast-forward. never: faz sempre um {$commit} de integração. allowed: fast-forward quando possível, como o git faz por predefinição. only: apenas fast-forward, ou recusa quando não é possível. Um repositório pode substituí-la na sua página Opções de integração." }
repo_heading = "Repo: {repo} - só este repositório"
inherited = "(herdado)"
lfs_not_checked = "(ainda não verificado)"
lfs_autofix_filters = "Instalar os filtros LFS antes de {$pull} e {$push}"
