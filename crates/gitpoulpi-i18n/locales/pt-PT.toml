startup_tab_outside_repo_help = "O separador que abre ao arrancar quando a pasta de arranque não é um repositório, por exemplo uma pasta pessoal. Último separador abre o que estava ativo da última vez que saiu (Início se Lembrar separadores estiver desativado ou se não houver nada memorizado). Radar abre Início se o Radar estiver desativado. Lido uma só vez no arranque; precisa de reinício para ter efeito."
startup_tab_launcher = "Separador inicial pelo lançador"
startup_tab_launcher_help = "O separador que abre quando o GitPoulpi é iniciado pelo atalho do ambiente de trabalho ou do menu Iniciar (criado mais abaixo nesta página), seja qual for a pasta. Tem prioridade sobre as duas definições acima; Último separador e Radar comportam-se da mesma forma. Lido uma só vez no arranque; precisa de reinício para ter efeito."
group_worktree_tabs = "Agrupar os separadores dos worktrees"
group_worktree_tabs_help = "Os separadores dos worktrees associados a um repositório ficam logo a seguir ao separador desse repositório, e um separador de worktree arrastado para longe volta a colar-se a ele. Desativado, os separadores ficam onde os pôr. Ao ativar, os separadores abertos são reagrupados."
allow_agent_view_control = "Permitir que agentes de IA controlem a vista"
allow_agent_view_control_help = "Ativado, um agente de IA (pelo MCP ou `gitpoulpi ui`) pode pedir a esta janela que mostre um commit, um ficheiro ou um aviso. Nunca altera nada no repositório. Desativado, esta janela não os aceita. Lido quando uma janela abre."
allow_ui_propose = "Deixar agentes de IA proporem alterações para eu confirmar"
allow_ui_propose_help = { git = "Ativado, um agente de IA pode abrir uma caixa de diálogo já preenchida para si: uma nova mensagem para um commit, uma mensagem de commit no compositor, uma nova branch ou tag. Fica marcada com ✦ Proposto por <agente>, e nada muda até confirmar no próprio diálogo; Esc rejeita-a. Desativado (predefinição), `ui propose` e as ferramentas MCP ui_propose_* são recusados.", local = "Ativado, um agente de IA pode abrir uma caixa de diálogo já preenchida para si: uma nova mensagem para um commit, uma mensagem de commit no compositor, uma nova branch ou etiqueta. Fica marcada com ✦ Proposto por <agente>, e nada muda até confirmar no próprio diálogo; Esc rejeita-a. Desativado (predefinição), `ui propose` e as ferramentas MCP ui_propose_* são recusados." }
clone_root = "Pasta de clonagem predefinida"
clone_root_help = "Onde começa o campo \"Onde clonar\" do diálogo Clonar. Vazio usa a predefinição de cada SO: %USERPROFILE%\\source\\repos no Windows, ~/src nos restantes."
# context: setting: which source the Clone dialog opens on (Last used, Clone with URL, or an integration)
clone_start_source = "O diálogo Clonar começa em"
clone_start_source_help = "A fonte em que o diálogo Clonar abre. Última usada reabre a que mostrava quando foi fechado da última vez; Clonar por URL começa sempre no formulário de URL; ou escolha uma das suas integrações ligadas. Uma fonte que já não esteja disponível recorre a Clonar por URL."
# context: option of the "Clone dialog starts on" setting: the source shown when the dialog was last closed
clone_start_last = "Última usada"
browse_root = "Pasta de navegação predefinida"
browse_root_help = "Onde Procurar (o seletor de pastas, a partir do separador Início) abre por predefinição. Vazio faz Procurar abrir na última pasta escolhida - ou na pasta pessoal, na primeira vez - em vez de uma fixa."
heading_auto_stash = "Auto-{$stash}"
heading_log = "Registo da aplicação"
heading_undo = "Histórico de desfazer"
log_level = "Nível do registo"
log_retention_days = "Manter os ficheiros de registo"
# context: setting help: how long log files are kept; a number and a unit (days, weeks, months, years) on one line
log_retention_help = "Os ficheiros de registo mais antigos são eliminados quando o GitPoulpi arranca. O ficheiro de cada dia também tem o limite de tamanho definido abaixo."
# context: setting: where the data GitPoulpi keeps for one repository lives (ref filters, fold state, workflow, caches)
repo_data_location = "Local dos dados do repositório"
# context: help of the setting above
repo_data_location_help = "Onde ficam os dados de cada repositório (filtros de refs, fluxo de trabalho, caches). Dentro de .git mantém a árvore de trabalho limpa; mudar esta opção migra os dados existentes."
# context: option of the repository data location: inside the repository's .git folder
repo_data_in_git_dir = "Dentro de .git (pasta gitpoulpi)"
# context: option of the repository data location: a .gitpoulpi folder in the working tree
repo_data_in_worktree = "Na árvore de trabalho (pasta .gitpoulpi)"
# context: option of the repository data location: the user's own data folder
repo_data_user_data = "Na minha pasta de dados do utilizador (fora do repositório)"
log_max_file_mb = "Tamanho máximo de um ficheiro de registo"
log_timings = "Mostrar a duração das operações"
log_timings_help = "Acrescenta a duração em milissegundos a cada operação do registo de atividade (separador \"Operações Git\")."
log_extended = "Registo alargado"
log_extended_help = { git = "Lista também as operações em segundo plano (auto-{$fetch}, atualização, verificação do estado) com a duração.", local = "Lista também as operações em segundo plano (obtenção automática, atualização, verificação do estado) com a duração." }
# context: setting: how the status line counts the total commits (the dropdown choices are in settings_value)
commit_count = "Contar o total de {$commits} com"
# context: help of the setting above; mentions antivirus software
commit_count_help = "Como a barra de estado obtém o total em carregados / total. O git do sistema executa um processo git (normalmente o mais rápido). O libgit2 conta dentro do GitPoulpi e não inicia nenhum processo: escolha-o quando um antivírus analisa cada comando e deixa o git lento. Desativado, mostra só os {$commits} carregados. Aplica-se de imediato."
auto_stash = { git = "Auto-{$stash} antes de checkout, {$pull}, {$merge} ou {$rebase}", local = "Auto-{$stash} antes de checkout, puxada, integração ou {$rebase}" }
auto_stash_help = { git = "O que fazer quando um checkout, {$pull}, {$merge} ou {$rebase} é bloqueado por alterações locais. perguntar: uma caixa de diálogo oferece fazer stash delas, executar a operação e restaurá-las; sempre: faz isso sem perguntar; nunca: recusa, como o git faz.", local = "O que fazer quando um checkout, puxada, integração ou {$rebase} é bloqueado por alterações locais. perguntar: uma caixa de diálogo oferece guardá-las, executar a operação e restaurá-las; sempre: faz isso sem perguntar; nunca: recusa, como o git faz." }
include_untracked_in_autostash = "Incluir ficheiros não acompanhados no auto-stash"
include_untracked_in_autostash_help = "Se o stash automático também leva ficheiros não acompanhados (caso contrário, só as alterações acompanhadas são guardadas e restauradas)."
hosting_refresh_minutes = { git = "Atualização de {$prs} e issues", local = "Atualização de {$Prs} e issues" }
hosting_refresh_minutes_help = { git = "Com que frequência as listas de {$prs} e Issues da barra lateral (e o chip de {$pr_abbr} associado na barra de ferramentas) voltam a consultar o host. 0 desliga o temporizador; continuam a ser atualizadas ao abrir um repositório, ao mudar de branch, após um push ou fetch, e a pedido.", local = "Com que frequência as listas de {$Prs} e Issues da barra lateral (e o chip de {$pr_abbr} associado na barra de ferramentas) voltam a consultar o host. 0 desliga o temporizador; continuam a ser atualizadas ao abrir um repositório, ao mudar de branch, após um envio ou uma obtenção, e a pedido." }
# context: label of the row that sets the name messages to a host are posted as (a bot such as my-app[bot])
hosting_post_as = "Publicar como"
# context: help under the "Post as" row of Settings
hosting_post_as_help = "O nome com que as suas mensagens ao host são publicadas, e o nome usado para reconhecer os seus próprios comentários (editar, eliminar), por exemplo my-app[bot] para uma GitHub App. Só é preciso com um token de bot: se ficar vazio, o GitPoulpi pergunta ao host e aprende-o com a primeira mensagem que publicar."
pr_terminology = "Terminologia de pedido de revisão"
pr_terminology_help = { git = "A palavra usada para um pedido de revisão de código alojado em todo o TUI. Auto segue o host do repositório: Merge Request para o GitLab, Pull Request para os outros hosts. Pull Request ou Merge Request força essa palavra. Aplica-se de imediato.", local = "A palavra usada para um pedido de revisão de código alojado em todo o TUI. Auto segue o host do repositório: Pedido de integração para o GitLab, Pedido de incorporação para os outros hosts. Pedido de incorporação ou Pedido de integração força essa palavra. Aplica-se de imediato." }
hide_finished_pr_chip = { git = "Ocultar o chip do {$pr} depois de fechado ou de feito o merge", local = "Ocultar o chip do {$pr} depois de fechado ou de feita a integração" }
hide_finished_pr_chip_help = { git = "O chip na barra de ferramentas mostra o {$pr} mais recente da branch em checkout. Ativado, fica oculto quando esse {$pr} é fechado ou o merge é feito, e a branch passa a mostrar o chip esbatido \"+ {$pr_abbr}\", como se não tivesse nenhum. Desativado, o chip mostra sempre o {$pr} mais recente, seja qual for o estado. Aplica-se de imediato.", local = "O chip na barra de ferramentas mostra o {$pr} mais recente da branch em checkout. Ativado, fica oculto quando esse {$pr} é fechado ou integrado, e a branch passa a mostrar o chip esbatido \"+ {$pr_abbr}\", como se não tivesse nenhum. Desativado, o chip mostra sempre o {$pr} mais recente, seja qual for o estado. Aplica-se de imediato." }
heading_external_tools = "Ferramentas externas"
external_editor = "Editor externo"
external_editor_help = "Comando do item de menu \"Abrir em <editor>\" de um ficheiro; {{file}} é o caminho completo do ficheiro (acrescentado se faltar). Vazio: VS Code (`code`) quando está no PATH, senão o programa predefinido do sistema."
external_diff_tool = { git = "Ferramenta de diff externa", local = "Ferramenta de comparação externa" }
external_diff_tool_help = { git = "Comando de \"Abrir na ferramenta de diff externa\"; {{local}} é a versão commitada (ou staged), {{remote}} a versão comparada. Vazio: `git difftool`, com o `diff.tool` configurado no git.", local = "Comando de \"Abrir na ferramenta de comparação externa\"; {{local}} é a versão commitada (ou preparada), {{remote}} a versão comparada. Vazio: `git difftool`, com o `diff.tool` configurado no git." }
external_merge_tool = { git = "Ferramenta de merge externa", local = "Ferramenta de integração externa" }
external_merge_tool_help = { git = "Comando de \"Abrir na ferramenta de merge externa\" num cartão de conflito; {{base}}, {{local}} (A, atual), {{remote}} (B, recebido) e {{merged}} (onde a ferramenta grava o resultado; staged quando ela termina com sucesso). Vazio: `git mergetool`, com o `merge.tool` configurado no git.", local = "Comando de \"Abrir na ferramenta de integração externa\" num cartão de conflito; {{base}}, {{local}} (A, atual), {{remote}} (B, recebido) e {{merged}} (onde a ferramenta grava o resultado; preparado quando ela termina com sucesso). Vazio: `git mergetool`, com o `merge.tool` configurado no git." }
file_explorer = "Explorador de ficheiros"
file_explorer_help = "Comando de \"Mostrar na pasta\"; {{path}} é o caminho completo do ficheiro, {{dir}} a sua pasta. Windows: explorer.exe /select,\"{{path}}\" seleciona o ficheiro; Linux: xdg-open \"{{dir}}\"; macOS: open -R \"{{path}}\"."
ai_assistant = "Assistente de IA"
launch = "Abrir uma janela para agentes"
launch_help = "Quando um agente de IA pede para mostrar algo e nenhuma janela do GitPoulpi está aberta em lado nenhum, execute isto para abrir uma: desativado (nunca, a predefinição), um terminal (kitty, foot, WezTerm, Windows Terminal, ...), um novo separador/painel/workspace num multiplexador (tmux, zellij, cmux, ...) ou custom, que usa o modelo abaixo. O agente tem ainda de o pedir (`--launch`), ou o seu ui_control tem de ser auto. Vale a partir do próximo pedido."
launch_command = "Comando de abertura (custom)"
launch_command_help = "Usado quando a escolha acima é custom. Dividido em argumentos (use aspas '...' ou \"...\"), sem shell. {{repo}} é a pasta do repositório, {{session}} o nome da sessão e {{gitpoulpi}} este programa. Exemplo: kitty --directory {{repo}} {{gitpoulpi}} --session {{session}}"
tab_dir_follow = "Seguir a pasta do separador ativo"
tab_dir_follow_help = "Um programa não consegue mudar a pasta do seu shell, por isso há duas formas de lá chegar. botões (predefinição): enquanto o separador ativo não for a pasta em que o GitPoulpi foi iniciado, a barra de separadores mostra Sair e cd aqui (só quando iniciado pelo wrapper do shell, consulte `gitpoulpi shell-init`). auto: sem botões; ao sair, o shell faz sempre cd para o separador ativo, e um terminal abre-se sozinho sempre que abre um novo separador (não para os separadores restaurados no arranque)."
forget_all_usernames_and_passwords = "Esquecer todos os utilizadores e palavras-passe"
forget_all_usernames_and_passwords_help = "Remove todos os tokens que o GitPoulpi guardou no seu auxiliar de credenciais."
mcp_server = "Servidor MCP"
mcp_server_help = "Ativado, um agente de IA pode iniciar o servidor MCP (`gitpoulpi mcp serve`, ou `--http` para o ponto de acesso de rede). Desativado, recusa-se a arrancar. Guardado em `mcp.enabled`. Uma alteração aplica-se da próxima vez que um agente iniciar o servidor; um servidor já em execução mantém as definições com que arrancou."
mcp_port = "Porta do servidor MCP"
mcp_port_help = "A porta em que `gitpoulpi mcp serve --http` escuta quando nenhum endereço é indicado (a parte do anfitrião de `mcp.bind` é mantida, 127.0.0.1 por predefinição, apenas loopback, exceto com --allow-remote). Aplica-se da próxima vez que um agente iniciar o servidor; um servidor em execução mantém a sua porta."
mcp_bind_unreadable = "`mcp.bind` é «{bind}», que não tem uma porta legível. Definir aqui uma porta mantém o respetivo anfitrião e substitui o resto."
undo_off_note = "Desfazer está desativado - ative «Desfazer ativado» para definir a profundidade"
use_mailmap = "Mostrar autores através do .mailmap"
use_mailmap_help = "Mostra cada autor com o nome que o .mailmap do repositório lhe dá, no Log, no blame e no histórico do ficheiro. Os {$commits} em si não mudam. Aplica-se de imediato."
auto_prune_tags = "Poda automática de {$tags}"
auto_prune_tags_help = "Em cada {$fetch_noun}, elimina também as {$tags} locais que o remoto eliminou. Só são afetadas as {$tags} que estiveram no remoto: uma {$tag} que nunca enviou é mantida. Desativado por predefinição, como no git."

