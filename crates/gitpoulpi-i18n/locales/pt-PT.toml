mouse_gestures_in_3 = { git = "arrastar sobre o texto de um diff, vista de ficheiro, Blame ou Histórico do ficheiro o seleciona, clique duplo numa palavra; y ou Ctrl+C o copia (só texto de ficheiro, nunca margens); as outras ocorrências de uma palavra selecionada são realçadas no diff e no editor (e marcadas na régua)", local = "arrastar sobre o texto de uma diferença, vista de ficheiro, Blame ou Histórico do ficheiro o seleciona, clique duplo numa palavra; y ou Ctrl+C o copia (só texto de ficheiro, nunca margens); as outras ocorrências de uma palavra selecionada são realçadas na diferença e no editor (e marcadas na régua)" }
mouse_gestures_in_4 = { git = "desloca a lista ou diff focado/sob o rato; Shift+roda (as duas grafias que os terminais informam) desloca um diff/vista de ficheiro/blame na *horizontal*, enquanto a quebra de linha está desativada", local = "desloca a lista ou diferença focada/sob o rato; Shift+roda (as duas grafias que os terminais informam) desloca uma diferença/vista de ficheiro/blame na *horizontal*, enquanto a quebra de linha está desativada" }
