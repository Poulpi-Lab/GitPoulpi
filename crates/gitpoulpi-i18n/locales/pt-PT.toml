private_key_path_help = { git = "Ficheiro de chave que {$fetch}, {$pull}, {$push} e clone oferecem ao ssh (ssh -i <chave> -o IdentitiesOnly=yes). Vazio: ssh-agent e a sua configuração ssh como habitualmente. Não usado quando um repositório escolhe a sua própria chave (SSH e credenciais), ou quando GIT_SSH_COMMAND ou core.sshCommand está definido. Aplica-se na próxima transferência.", local = "Ficheiro de chave que a obtenção, a puxada, o envio e o clone oferecem ao ssh (ssh -i <chave> -o IdentitiesOnly=yes). Vazio: ssh-agent e a sua configuração ssh como habitualmente. Não usado quando um repositório escolhe a sua própria chave (SSH e credenciais), ou quando GIT_SSH_COMMAND ou core.sshCommand está definido. Aplica-se na próxima transferência." }
public_key_path = "Caminho da chave pública"
public_key_path_help = "Usado só quando o caminho da chave privada está vazio: o ssh escolhe então a chave correspondente mantida pelo ssh-agent (ou uma chave de hardware) em vez de oferecer todas as do agente. Gerar par de chaves preenche ambos. Mesma precedência do caminho da chave privada."
