[help_tabs]
tab_keys = "Teclas"
tab_start = "Início"
tab_log = "Log"
tab_changes = "Alterações"
tab_refs = "Refs"
tab_hosting = "Alojamento"
tab_setup = "Definições"
tab_tools = "IA e CLI"
title = "Ajuda - escreva para filtrar, Tab muda de separador, ? fecha"
title_filtered = "Ajuda - filtro \"{filter}\" - Esc limpa, ? fecha"
hint = "Tab/Shift+Tab, ←/→ ou Alt+1..8: separadores - ↑/↓, PgUp/PgDn deslocam"
start_1 = "Janela|Separadores no topo (Início lista, abre e clona repositórios), depois a barra de ferramentas, a barra lateral Refs à esquerda, o Log ao centro, e as alterações com o formulário de {$commit} à direita."
start_2 = "Paleta de comandos|Ctrl+P lista cada ação com o seu atalho. Escreva para pesquisar, Enter executa. Tudo o que o rato faz, a paleta faz."
start_3 = "Prefixos de atalhos|Ctrl+G e depois uma tecla executa uma ação do git ({$stage}, {$commit}, {$pull}, {$push}...). Ctrl+N e depois uma tecla move ou muda a vista. A barra de estado lista as opções."
start_4 = "Separadores|Um separador por repositório. Ctrl+PgUp / Ctrl+PgDn mudam, Ctrl+W fecha, t abre o seletor de separadores, clique direito num separador ou Ctrl+T para o menu."
start_5 = "Rato e teclas|Clicar seleciona, clique duplo abre ou faz checkout, clique direito (ou .) abre um menu, arrastar move refs e linhas de {$rebase}. Cada ação do rato tem uma tecla."
start_6 = "Atualizar e desfazer|r atualiza, F5 recarrega tudo, Ctrl+Z / Ctrl+Y desfazem e refazem a última operação, q sai."
log_1 = "Ler o grafo|Uma linha por {$commit}, uma faixa por branch. A primeira linha é o seu trabalho por confirmar (WIP): selecione-a para ver as alterações. Clique numa linha para ver os detalhes à direita."
log_2 = "Pesquisar|f (ou o botão Pesquisar) esbate as linhas que não correspondem a mensagem, autor, hash ou ref. Enter / Shift+Enter saltam para a correspondência seguinte / anterior. / filtra a barra Refs."
log_3 = "Menu de {$commits}|Clique direito num {$commit} ou . sobre ele: {$cherry_pick}, revert, reset, editar a mensagem, criar branch ou {$tag}, checkout, worktree, patch, copiar."
log_4 = "{$Rebase} interativo|\"{$Rebase} interativo a partir daqui...\" no menu do {$commit}: defina cada {$commit} como {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} ou {$edit}, reordene com Ctrl+Cima/Baixo, inicie com Ctrl+S, saia com Esc."
log_5 = "Vários {$commits}|Ctrl+clique alterna um {$commit}, Shift+clique (Alt+clique) seleciona um intervalo, Espaço alterna o atual, Esc limpa. Depois clique direito para {$cherry_pick} ou revert de toda a seleção."
log_6 = { git = "Arrastar refs|Arraste uma branch para cima de outra para {$merge}, {$rebase} ou fast-forward, ou para uma branch remota para {$push}; largue para escolher num menu, Esc cancela. Teclado: paleta, \"Refs: Largar a ref selecionada...\".", local = "Arrastar refs|Arraste uma branch para cima de outra para integrar, {$rebase} ou fast-forward, ou para uma branch remota para enviar; largue para escolher num menu, Esc cancela. Teclado: paleta, \"Refs: Largar a ref selecionada...\"." }
changes_1 = "Alterações em curso|Selecione a primeira linha do Log (WIP): os ficheiros {$unstaged} e {$staged} aparecem à direita. m alterna caminho / árvore, a mostra todos os ficheiros, z recolhe as pastas."
changes_2 = "{$Stage} e {$unstage}|Ctrl+Espaço num ficheiro, ou o seu botão, ou Ctrl+G s; Ctrl+G a para tudo, Ctrl+G u para {$unstage}. Clique direito num ficheiro para descartar, ver histórico ou blame, ou abrir no seu editor."
changes_3 = { git = "Ler um {$diff}|Clique num ficheiro ou prima d. m alterna em linha / dividido, w quebra linhas, s ignora espaços, n / p saltam entre blocos, Esc ou q volta ao Log.", local = "Ler uma diferença|Clique num ficheiro ou prima d. m alterna em linha / dividido, w quebra linhas, s ignora espaços, n / p saltam entre blocos, Esc ou q volta ao Log." }
changes_4 = { git = "Blocos e linhas|Num {$diff}: Espaço = {$stage} o bloco, v depois j / k depois Enter = {$stage} as linhas escolhidas, x = descartar o bloco. Descartar pergunta antes; Ctrl+Z recupera.", local = "Blocos e linhas|Numa diferença: Espaço = {$stage} o bloco, v depois j / k depois Enter = {$stage} as linhas escolhidas, x = descartar o bloco. Descartar pergunta antes; Ctrl+Z recupera." }
changes_5 = "Escrever um {$commit}|Escreva um resumo e uma descrição, depois Ctrl+Enter ou o botão verde. Shift+A emenda o último {$commit}. Ctrl+G c leva o cursor ao formulário, Esc sai."
changes_6 = "Conflitos de {$merge}|Um aviso oferece \"Resolver conflitos...\". No editor de {$merge} escolha A, B ou ambos por conflito (a / b / c), edite o Resultado, guarde e depois Continuar."
changes_7 = "Desfazer e refazer|Ctrl+Z / Ctrl+Y, ou os botões da barra, desfazem e refazem a maioria das operações: {$commits}, branches, checkouts, resets, {$stashes}, descartes. Pergunta antes se for arriscado."
refs_1 = "Branches e {$tags}|Clique duplo numa branch local ou {$tag} para fazer checkout; clique direito para o menu ({$merge}, {$rebase}, mudar o nome, apagar...). Ctrl+G b e Ctrl+G t criam um no {$commit} atual."
refs_2 = "Solo e ocultar|A tecla o mostra só os {$commits} da ref selecionada, Shift+O para. O menu de uma ref oculta-a do grafo; Shift+H mostra tudo de novo. Só visualização: o repositório não muda."
refs_3 = { git = "{$Fetch}, {$pull}, {$push}|Ctrl+G f: {$fetch} de todos os remotos. Ctrl+G p: {$pull}. Ctrl+G Shift+P: {$push}. A seta ao lado de um botão escolhe outra forma ou outro remoto.", local = "{$Fetch}, {$pull}, {$push}|Ctrl+G f: obter todos os remotos. Ctrl+G p: {$pull}. Ctrl+G Shift+P: {$push}. A seta ao lado de um botão escolhe outra forma ou outro remoto." }
refs_4 = "Remotos|O + no título REMOTO adiciona um. Clique direito num remoto para fazer {$fetch}, copiar a ligação web, editar os URL ou remover."
refs_5 = "{$Stashes} e worktrees|Os botões {$stash} e Pop; Ctrl+G m pede antes uma mensagem. Clique direito num {$stash} para aplicar ou retirar. \"Criar worktree a partir de...\" abre uma branch num separador próprio."
refs_6 = "Submódulos e LFS|Uma secção SUBMODULES aparece se existirem: clique duplo abre um como separador, clique direito atualiza-o. Ações do Git LFS: o botão LFS ou Ctrl+G l."
hosting_1 = "Ligar|Definições > Integrações: cole um token pessoal do GitHub ou GitLab. Não precisa de conta; o token vai para o gestor de credenciais do sistema."
hosting_2 = "Associar um repositório|Nas secções {$PRS} e ISSUES da barra lateral, escolha um dos fornecedores propostos pela lista. Nada é associado sozinho; a associação é guardada por repositório."
hosting_3 = "Criar um {$pr}|O + no cabeçalho {$PRS}, ou n nessa secção, abre o formulário; o menu de uma branch tem \"Iniciar {$pr} a partir de...\". A IA pode escrever o título e a descrição."
hosting_4 = "Issues|A secção ISSUES lista-as; + ou n cria uma. O menu de uma linha abre-a no navegador ou age sobre ela."
hosting_5 = "Referências|Referências a issues e {$prs} (#12, !53, ABC-7) numa mensagem de {$commit} ou nome de branch são reconhecidas. Alt+R no formulário de {$commit} insere uma."
hosting_6 = "Chip da barra|À esquerda da barra, um chip mostra o {$pr} da branch atual (GH #12, GL !53) ou um \"+ {$pr_abbr}\" esbatido para iniciar um. Clique nele."
hosting_7 = "Chaves SSH|Escolha uma chave SSH por perfil (Definições > Perfis) ou por repositório (menu do separador > \"SSH e credenciais...\"). As frases-passe ficam no ssh-agent do sistema."
setup_1 = "Definições|Ctrl+, ou a roda dentada. Tab alterna entre a lista de páginas e as opções, j / k movem, Enter ou Espaço muda um valor, / ou Ctrl+F pesquisa todas as opções, Esc fecha."
setup_2 = "Temas|Definições > Aspeto > Tema: escuro, claro, seguir o terminal ou um dos muitos predefinidos. Ctrl+N e uma tecla também mudam tema, idioma e cores do grafo sem abrir as Definições."
setup_3 = "Idioma|Definições > Geral > Idioma oferece 17 idiomas. \"Traduzir termos do git\" decide se as palavras próprias do git ({$commit}, {$push}...) também são traduzidas."
setup_4 = "Perfis|Definições > Perfis guarda identidades de {$commit} (nome, e-mail, chave SSH). A caixa de perfil da barra escolhe a deste repositório."
setup_5 = "Abrir em|O botão Abrir em (Alt+O) abre a pasta deste separador num terminal, editor ou gestor de ficheiros. Definições > Abrir em edita a lista."
setup_6 = "Atalhos de teclado|Definições > Teclado e rato reatribui qualquer tecla. O separador Teclas desta ajuda mostra os seus próprios atalhos."
tools_1 = "IA (opcional)|Desligada até a configurar em Definições > IA: um serviço compatível com OpenAI, Anthropic ou um agente local como claude -p. Nunca é preciso uma conta GitPoulpi."
tools_2 = "Ações de IA|O botão de brilho ao lado do resumo ou Ctrl+G i escreve uma mensagem de {$commit}; Ctrl+G w explica as alterações; Ctrl+G C divide o seu trabalho em vários {$commits}; Alt+I sugere uma resolução de conflito. Nada é aplicado sem a sua confirmação."
tools_3 = "CLI|gitpoulpi <comando> faz por script o que a janela faz, através do mesmo daemon, por isso as mudanças aparecem em direto. --json dá saída para máquinas, --help lista as opções."
tools_4 = "MCP|gitpoulpi mcp serve --stdio dá aos agentes de IA uma ferramenta por comando da CLI. Definições > Agentes e MCP escolhe o que podem alterar."
tools_5 = "Wrapper de shell|Com o wrapper de shell gp, «Sair e cd aqui» deixa o seu shell na pasta do separador ativo quando o GitPoulpi sai."

