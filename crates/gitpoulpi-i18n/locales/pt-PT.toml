[help_text]
git_actions_then_pull_all_branches = "{$pull} de todas as branches: {$fetch}, avança em fast-forward cada branch que apenas está atrás do seu upstream e {$pull} da branch atual (também uma linha do ▾ de {$Pull})"
git_actions_then_amend = "alterar o {$commit} selecionado: resumo, descrição, nome, e-mail e data do autor numa só janela"
git_actions_then_edit_author = "alterar apenas o autor do {$commit} selecionado (nome, e-mail, data)"
rewrite_1 = "abre o painel de reescrita do histórico: altere autores, datas, mensagens, conteúdo ou caminhos dos ficheiros em todo o histórico ou numa seleção"
rewrite_2 = "pré-visualiza o que as regras alterariam e depois aplica tudo num só passo que Desfazer reverte; Aplicar fica desativado enquanto a pré-visualização estiver desatualizada"
rewrite_3 = "cancela a pré-visualização em curso (Esc faz o mesmo; um segundo Esc fecha o painel)"
rewrite_4 = "adiciona uma regra, elimina a regra sob o cursor, restaura a última eliminada, duplica a regra"
rewrite_5 = "liga ou desliga a regra, ou move-a para cima ou para baixo (as regras correm de cima para baixo)"
rewrite_6 = "alterna entre os separadores da pré-visualização"
rewrite_7 = "guarda a receita no repositório ou só para si, carrega uma guardada, renomeia-a; os valores secretos nunca são guardados"
rewrite_8 = "inclui ou deixa de fora todas as branches protegidas já publicadas; volta a verificar as ferramentas externas"
file_history_1 = "ir ao {$commit} da linha no Log, carregando mais do Log se ainda não lá estiver"
file_history_2 = { git = "mover a seleção; o diff à direita acompanha de imediato", local = "mover a seleção; a diferença à direita acompanha de imediato" }
file_history_3 = { git = "estender a seleção a um intervalo: a direita mostra então o diff do ficheiro entre as duas pontas (Shift+clique faz o mesmo)", local = "estender a seleção a um intervalo: a direita mostra então a diferença do ficheiro entre as duas pontas (Shift+clique faz o mesmo)" }
file_history_4 = { git = "dar o teclado ao diff, ou devolvê-lo à lista", local = "dar o teclado à diferença, ou devolvê-lo à lista" }
file_history_5 = "copiar o SHA do {$commit}, ou o resumo dele"
file_history_6 = { git = "lado direito: o diff, o ficheiro como estava nesse {$commit}, ou o blame; acompanha a seleção e mantém o modo", local = "lado direito: a diferença, o ficheiro como estava nesse {$commit}, ou o blame; acompanha a seleção e mantém o modo" }
file_history_7 = "comparar a versão da linha com a árvore de trabalho (prima de novo para voltar)"
file_history_8 = "restaurar o ficheiro para essa versão na árvore de trabalho (pergunta antes; Desfazer devolve os bytes antigos)"
file_history_9 = "redimensionar a lista (o divisor também se arrasta; a largura fica guardada)"
file_history_10 = "rato: clique numa linha, Shift+clique para um intervalo, clique duplo mostra no Log, clique com o botão direito abre o menu"
commit_column_1 = "deslocar as linhas para os lados (Shift+roda ou uma roda horizontal fazem o mesmo); só se deslocam quando uma parte foi alargada além do espaço disponível"
commit_column_2 = "escolher uma parte (faixas, autor, data) e alargá-la ou estreitá-la, ou voltar todas as partes ao automático; os limites do cabeçalho também se arrastam e as larguras ficam guardadas"
commit_column_3 = "rato: clique numa linha para escolher o respetivo {$commit}, o clique direito abre o menu dela (a tecla de menu também, depois de escolher uma linha com Cima/Baixo)"
commit_column_4 = "mover a parte escolhida para a esquerda ou para a direita; arrastar o seu cabeçalho faz o mesmo, e a ordem é memorizada"
log_columns_1 = "escolher uma coluna do Log (a célula do cabeçalho acende-se); depois movê-la para a esquerda ou para a direita (arrastar o cabeçalho faz o mesmo), alargá-la ou estreitá-la (arrastar a sua borda faz o mesmo), repor a largura automática, ou ajustá-la ao conteúdo (fazer duplo clique na sua borda faz o mesmo; + ajusta todas as colunas). Tab / Shift+Tab escolhem outra coluna, Esc sai; a disposição é memorizada"
global_1 = "abrir a paleta de comandos - todos os comandos da aplicação, cada um com o seu atalho; escreva para filtrar, Cima/Baixo ou PageUp/PageDown para mover (não j/k: esses são escritos), Enter para executar. As linhas a cinzento dizem porque não podem ser executadas agora"
global_2 = "o prefixo de navegação - veja a secção própria abaixo"
global_3 = "o prefixo das ações do git - veja a secção própria abaixo"
global_4 = "alternar esta ajuda - abre por cima de qualquer outra coisa aberta (Definições, Gestão de repositórios, ...), não só do grafo simples"
global_5 = "forçar uma atualização"
global_6 = { git = "{$fetch}, rever {$prs} e issues, recarregar", local = "obter, rever {$prs} e issues, recarregar" }
global_7 = "desfazer / refazer a última operação (commit, amend, checkout, criar/eliminar branch); pergunta antes quando é arriscado"
global_9 = { git = "sair - a partir do grafo; sobre um diff ou vista de ficheiro, fecha essa vista. Cada saída é registada em gitpoulpi-tui-exit.log, junto da configuração", local = "sair - a partir do grafo; sobre uma diferença ou vista de ficheiro, fecha essa vista. Cada saída é registada em gitpoulpi-tui-exit.log, junto da configuração" }
global_10 = "abrir um menu de contexto, onde quer que exista um abaixo - as teclas são intercambiáveis (a tecla Menu/Apps raramente chega a esta aplicação no Windows, por isso a combinação F10 é a que funciona de forma fiável lá)"
global_11 = "levar o foco ao próximo / painel anterior"
global_12 = "mover a seleção (cada painel e lista)"
global_13 = "prefixo de contagem estilo vim em j/k/Cima/Baixo (e PageUp/PageDown, como contagem de ecrãs) - os dígitos escritos aparecem como \"4...\" na barra de estado até ao movimento acontecer; Esc ou qualquer outra tecla limpa-o, e um 0 inicial nunca começa um (por isso os dígitos continuam a ser escritos normalmente no compositor, no filtro de Refs e em qualquer outro campo de texto)"
global_14 = { git = "Refs: mudar a secção LOCAL/REMOTO/TAGS", local = "Refs: mudar a secção LOCAL/REMOTO/ETIQUETAS" }
global_15 = "Log: h = sair da / l = entrar na lista de ficheiros de um commit"
global_16 = { git = "Status: ir para Unstaged / Staged", local = "Status: ir para Não preparados / Preparados" }
mouse_basics_1 = "selecionar + focar uma linha (cada painel, lista, menu, diálogo); a roda desloca o que estiver sob o ponteiro"
mouse_basics_2 = { git = "abrir/ativar: uma ref LOCAL/TAGS ou a pílula de ref de uma linha do Log faz checkout dela, um ficheiro alterado abre o seu diff, uma linha de repositório abre esse repositório", local = "abrir/ativar: uma ref LOCAL/ETIQUETAS ou a pílula de ref de uma linha do Log faz checkout dela, um ficheiro alterado abre a sua diferença, uma linha de repositório abre esse repositório" }
mouse_basics_3 = "o único sinal de \"isto é clicável\" que a maioria dos terminais dá (veja \"Hover e dicas\" abaixo) - também dicas completas sobre células do Log e selos de ref truncados"
mouse_basics_4 = "o divisor de um painel, o limite de uma coluna do Log, a margem inferior de uma secção de Refs ou a margem inferior do bloco de mensagem do commit o redimensiona (abaixo do mínimo ele recolhe); arrastar o cabeçalho de uma coluna do Log além de uma vizinha a reordena"
mouse_basics_5 = "(canto superior direito) sair, igual a q - só aparece quando a janela é suficientemente larga para não sobrepor o texto do título"
navigation_prefix_then_1 = "recolher/restaurar o painel Refs (esquerda)"
navigation_prefix_then_2 = "recolher/restaurar o painel Status (direita) - clique na seta da margem de um painel, ou na tira fina que sobra quando recolhido, para o equivalente no rato"
navigation_prefix_then_3 = "aumentar a secção ativa de Refs numa linha ({{nav_prefix.shrink_section}} a diminui); arrastar a margem inferior de uma secção faz o mesmo, e o tamanho é lembrado"
navigation_prefix_then_4 = "aumentar numa linha o bloco de mensagem do commit do painel direito ({{nav_prefix.shrink_message}} o diminui); arraste a margem abaixo dele para o equivalente no rato"
navigation_prefix_then_5 = { git = "focar esse subpainel - cada secção de Refs, o campo de filtro, o Log (ou a vista de Diff quando aberta ali), a lista do Histórico do ficheiro, cada metade do terceiro painel e o campo Resumo do compositor, quando há espaço, ganham o seu próprio selo: 1-9 primeiro, depois a/b/c... se houver mais de nove neste quadro - os selos são redistribuídos sempre que o prefixo abre, por isso leia o glifo, não decore um dígito", local = "focar esse subpainel - cada secção de Refs, o campo de filtro, o Log (ou a vista de Diferença quando aberta ali), a lista do Histórico do ficheiro, cada metade do terceiro painel e o campo Resumo do compositor, quando há espaço, ganham o seu próprio selo: 1-9 primeiro, depois a/b/c... se houver mais de nove neste quadro - os selos são redistribuídos sempre que o prefixo abre, por isso leia o glifo, não decore um dígito" }
navigation_prefix_then_6 = "abrir as definições (igual à roda dentada da barra de título)"
navigation_prefix_then_16 = "abre a janela Acerca de (como o polvo na barra de título)"
navigation_prefix_then_17 = "move o divisor entre o painel Refs e o Log um passo para a esquerda ({{nav_prefix.refs_narrower}}) ou para a direita ({{nav_prefix.refs_wider}}); um painel Refs recolhido volta primeiro, e a largura é guardada"
navigation_prefix_then_18 = "move o divisor entre o Log e o painel direito um passo para a esquerda ({{nav_prefix.status_wider}}) ou para a direita ({{nav_prefix.status_narrower}}); um painel recolhido volta primeiro, e a largura é guardada"
navigation_prefix_then_7 = "alternar esta ajuda (igual a ? sozinho)"
navigation_prefix_then_8 = "escolher um separador de repositório para onde ir - escreva para filtrar, Cima/Baixo ou PageUp/PageDown para mover, Enter muda, clique numa linha, Esc fecha"
workspace_search = "pesquisa em todos os repositórios da área de trabalho por branches, {$tags}, worktrees, {$stashes}, {$commits}, {$prs} e issues - Enter vai lá, Alt+1-8 ativa tipos, b: t: c: s: w: r: pr: i: # restringe, Esc fecha"
navigation_prefix_then_9 = "mostrar a vista que um agente de IA ofereceu (o chip da barra de estado `Mostrar ...?`), o equivalente a clicar nele"
navigation_prefix_then_10 = "dispensar esse chip, ou então voltar à vista anterior à última mudança do agente (também `Agente: voltar` na paleta)"
navigation_prefix_then_11 = "cancelar, voltar ao modo normal"
navigation_prefix_then_12 = "escolher um tema na lista - escreva para filtrar, o destaque é pré-visualizado em direto, Enter aplica e guarda, Esc repõe o anterior (também `Aplicação: mudar tema...` na paleta)"
navigation_prefix_then_13 = "escolher um idioma na lista - escreva para filtrar, Enter aplica-o e guarda-o, Esc cancela (também `Aplicação: mudar idioma...` na paleta)"
navigation_prefix_then_14 = "`Aplicação: mudar tema de cores do grafo...`"
navigation_prefix_then_15 = "`Aplicação: alternar tom das linhas do grafo`"
navigation_prefix_then_19 = "arranjar a janela aberta pelo teclado: as setas movem-na, Shift+setas redimensionam-na, 0 repõe-na, Enter sai (o equivalente a arrastar a barra de título e as margens; também `Janela: mover ou redimensionar` na paleta)"
git_actions_then_1 = { git = "stage do ficheiro unstaged selecionado (painel Status)", local = "preparar o ficheiro não preparado selecionado (painel Status)" }
git_actions_then_2 = { git = "unstage do ficheiro staged selecionado (painel Status)", local = "remover da preparação o ficheiro preparado selecionado (painel Status)" }
git_actions_then_3 = { git = "stage de todas as alterações", local = "preparar todas as alterações" }
git_actions_then_4 = "descartar todas as alterações (com confirmação; ficheiros não acompanhados incluídos, dito na confirmação)"
git_actions_then_5 = "abrir o compositor de mensagem de commit"
git_actions_then_commit_now = { git = "faz agora o {$commit} das alterações em stage com a mensagem do compositor, a partir de qualquer lugar (equivalente ao botão de commit; sem nada em stage ou sem resumo, diz porquê e vai para o compositor)", local = "faz agora o {$commit} das alterações preparadas com a mensagem do compositor, a partir de qualquer lugar (equivalente ao botão de commit; sem nada preparado ou sem resumo, diz porquê e vai para o compositor)" }
