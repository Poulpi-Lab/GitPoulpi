graph_row_tint_strength_help = "Насколько приглушена полоса подсветки строки: Сильная (исходная), Средняя (по умолчанию) или Слабая. Приглушается только полоса; планка у правого края колонки сохраняет полный цвет. Применяется при закрытии настроек."
graph_row_tint_strength_coming = "сначала выберите «Подсветка строки» в «Фон полос графа»"
toolbar_position = "Положение панели инструментов"
toolbar_position_help = "Где находится панель инструментов: Сверху, Снизу (по умолчанию), Слева или Справа. Слева и Справа делают из неё колонку рядом с панелями; в окне меньше 80 столбцов она рисуется снизу. Применяется сразу."
toolbar_align = "Выравнивание кнопок панели инструментов"
toolbar_align_help = "Где кнопки стоят вдоль панели: В начале (по умолчанию), По центру или В конце. Начало - это левый край строки и верх колонки; конец - правый край и низ. Применяется сразу."
# context: label of the setting that decides whether a dialog the user moved or resized keeps its place
dialog_geometry = "Запоминать положение и размер диалогов"
dialog_geometry_help = "Один параметр для всех диалогов. Диалоги можно перемещать (перетащите заголовок или нажмите Ctrl+N, затем m); у больших окон можно ещё менять размер (перетащите границы и нижние углы). Каждый диалог запоминает своё положение и размер. На этот сеанс (по умолчанию): хранится до закрытия GitPoulpi. На диске: хранится и до следующего запуска. Никогда: каждый диалог открывается на стандартном месте и в стандартном размере. Применяется сразу."
toolbar_pr_pinned = "Закрепить кнопку {$pr} в конце"
toolbar_pr_pinned_help = "Вкл. (по умолчанию): кнопка {$pr} стоит на дальнем конце панели инструментов (справа, а в колонке снизу) при любом выравнивании. Выкл.: она идёт вместе с остальными кнопками и выравнивается с ними. Применяется сразу."
statusbar_position = "Положение строки состояния"
statusbar_position_help = "Где находится строка состояния (ветка, счётчики, сообщения, подсказки клавиш): Сверху, над вкладками репозиториев, или Снизу (по умолчанию). Вкладка Главная сохраняет собственную строку состояния снизу. Применяется сразу."
tabs_position = "Положение панели вкладок"
tabs_position_help = "Где находятся вкладки репозиториев: Сверху (по умолчанию), Снизу или Слева, список с одной вкладкой в строке у левого края окна. В окне меньше 80 столбцов они рисуются сверху. Рядом с панелью инструментов-колонкой вкладки остаются снаружи. Применяется сразу."
graph_color_theme = "Цветовая тема графа"
graph_color_theme_help = "Палитра цветов полос графа в Log. «Как в теме» берёт палитру выбранной темы; любой другой пункт заменяет её, поэтому любую тему можно сочетать с любой палитрой. Применяется при закрытии настроек."
graph_renderer = "Отрисовка графа"
graph_renderer_help = "auto рисует граф настоящим изображением в терминале, который это умеет, и символами везде в остальных случаях - в том числе внутри zellij и screen, которые наследуют окружение терминала, но не пропускают изображения, внутри tmux, если терминал за ним не понимает sixel, и внутри herdr, если не включён его kitty_graphics. image принудительно включает картинку, text - выключает. Нужен перезапуск."
image_protocol = "Протокол изображений"
image_protocol_help = "Как картинки (изображение графа, аватары авторов) попадают в терминал. auto: протокол графики Kitty в kitty, Ghostty и herdr с kitty_graphics = true, а также в iTerm2 3.7.7 и новее; встроенные изображения iTerm2 в WezTerm, Rio, mintty и более старых версиях iTerm2; картинки sixel (колонка графа и аватары) в Windows Terminal, foot, Tabby, Konsole, mlterm и в tmux, если терминал за ним понимает sixel; в остальных случаях символы. kitty, iterm2 или sixel принудительно включает протокол (kitty для herdr, чей конфиг лежит в другом месте; sixel для терминала, который его рисует, но не распознан); none отключает картинки. Нужен перезапуск."
kitty_keyboard = "Клавиатурный протокол Kitty"
kitty_keyboard_help = "auto при запуске и примерно за 100 мс спрашивает терминал, знает ли он клавиатурный протокол kitty, и использует его: сочетания, которые старые терминалы не различают (Control с пунктуацией, цифрами, Shift или Enter), приходят как есть, а не сливаются с управляющими кодами. Терминал, который не отвечает, остаётся на старых клавишах. off никогда не трогает клавиатурный режим терминала. Нужен перезапуск."
color_depth = "Глубина цвета"
color_depth_help = "auto использует 24-битный цвет, кроме терминалов, которые его не показывают (Apple Terminal, консоль Linux или 256-цветный терминал без COLORTERM): там цвета приводятся к ближайшим из 256 или 16 значений. truecolor, 256 и 16 задают глубину принудительно. Применяется сразу."
text_cursor = "Текстовый курсор"
text_cursor_help = "terminal ставит собственный курсор терминала в позицию ввода сфокусированного текстового поля в виде вертикальной черты: действуют настройки курсора вашего терминала, а окно кандидатов метода ввода открывается у курсора. drawn рисует собственный курсор GitPoulpi (блок или подчёркивание), а курсор терминала остаётся скрытым. Применяется сразу."
graph_show_stashes = { git = "Показывать stash'и в графе", local = "Показывать стэши в графе" }
graph_show_stashes_help = { git = "Каждый stash получает отдельную строку в Log по своей дате: маленький прямоугольник на полосе рядом с commit'ом, на котором он создан, соединённый с ним штриховой линией. Выбор показывает, что он менял; правый щелчок (или .) предлагает Pop, Apply и Drop. Выкл. оставляет stash'и только в разделе STASHES. Не рисуется в режиме solo.", local = "Каждый стэш получает отдельную строку в Log по своей дате: маленький прямоугольник на полосе рядом с коммитом, на котором он создан, соединённый с ним штриховой линией. Выбор показывает, что он менял; правый щелчок (или .) предлагает «Достать», «Применить» и «Удалить». Выкл. оставляет стэши только в разделе СТЭШИ. Не рисуется в режиме solo." }
ref_connector = { git = "Соединитель ссылки с commit'ом", local = "Соединитель ссылки с коммитом" }
ref_connector_help = { git = "Тонкая линия от каждой плашки ссылки в колонке Ref до кружка её commit'а в графе. Она занимает только пустое место: пересекаемые полосы остаются сверху, ничего не сдвигается. Рисуется, только когда колонка Ref стоит сразу слева от колонки Graph.", local = "Тонкая линия от каждой плашки ссылки в колонке Ref до кружка её коммита в графе. Она занимает только пустое место: пересекаемые полосы остаются сверху, ничего не сдвигается. Рисуется, только когда колонка Ref стоит сразу слева от колонки Graph." }
log_wip_counts_in_message = "Показывать счётчики WIP в сообщении, когда колонка «Изменения» скрыта"
log_wip_counts_in_message_help = { git = "Строка WIP показывает, сколько файлов изменено, добавлено и удалено. Когда колонка «Изменения» видна (правый щелчок по заголовку Log, чтобы показать её), счётчики всегда в ней, как у каждого commit'а. Когда она скрыта, при включении счётчики идут в сообщении WIP; при выключении счётчиков нет вообще.", local = "Строка WIP показывает, сколько файлов изменено, добавлено и удалено. Когда колонка «Изменения» видна (правый щелчок по заголовку Log, чтобы показать её), счётчики всегда в ней, как у каждого коммита. Когда она скрыта, при включении счётчики идут в сообщении WIP; при выключении счётчиков нет вообще." }
avatars = "Аватары авторов"
avatars_help = { git = "Картинки авторов. граф рисует автора каждого commit'а внутри его кружка в графе (только граф-изображение; в текстовом графе вместо этого в колонке «Автор» цветные инициалы). автор ставит круглую картинку в начало колонки «Автор». Оба режима также показывают её в панели сведений о commit'е. По умолчанию выкл.: включение отправляет хэш SHA-256 email каждого автора на gravatar.com по HTTPS (хэш известного или угадываемого адреса не анонимен), а в репозитории с remote на github.com один раз на автора спрашивает GitHub API, какой аккаунт сделал один из его commit'ов (с токеном вашей интеграции GitHub, если он есть). Пока картинка не пришла или её нет, показываются инициалы или простой кружок. выкл. ничего не отправляет по сети.", local = "Картинки авторов. граф рисует автора каждого коммита внутри его кружка в графе (только граф-изображение; в текстовом графе вместо этого в колонке «Автор» цветные инициалы). автор ставит круглую картинку в начало колонки «Автор». Оба режима также показывают её в панели сведений о коммите. По умолчанию выкл.: включение отправляет хэш SHA-256 email каждого автора на gravatar.com по HTTPS (хэш известного или угадываемого адреса не анонимен), а в репозитории с remote на github.com один раз на автора спрашивает GitHub API, какой аккаунт сделал один из его коммитов (с токеном вашей интеграции GitHub, если он есть). Пока картинка не пришла или её нет, показываются инициалы или простой кружок. выкл. ничего не отправляет по сети." }
avatar_sources = "Источники аватаров"
avatar_sources_help = { git = "Где по порядку искать картинку автора (адрес GitHub noreply всегда сначала называет свой аккаунт). hosting_gravatar: подключённая интеграция GitHub, GitLab или Bitbucket, хост которой совпадает с remote репозитория (автор commit'а или поиск пользователя GitHub, аватар по email или API users GitLab), затем Gravatar; если подходящая интеграция не подключена, первым идёт Gravatar, а remote на github.com всё равно опрашивается последним без аутентификации. gravatar_hosting: наоборот. gravatar или hosting: только этот источник. Если картинки нет нигде, рисуется запасной аватар ниже. Применяется к авторам, которых ещё не искали.", local = "Где по порядку искать картинку автора (адрес GitHub noreply всегда сначала называет свой аккаунт). hosting_gravatar: подключённая интеграция GitHub, GitLab или Bitbucket, хост которой совпадает с remote репозитория (автор коммита или поиск пользователя GitHub, аватар по email или API users GitLab), затем Gravatar; если подходящая интеграция не подключена, первым идёт Gravatar, а remote на github.com всё равно опрашивается последним без аутентификации. gravatar_hosting: наоборот. gravatar или hosting: только этот источник. Если картинки нет нигде, рисуется запасной аватар ниже. Применяется к авторам, которых ещё не искали." }
avatar_fallback = "Запасной аватар"
avatar_fallback_help = "Что показывать у автора без картинки. identicon: симметричный узор 5x5 в стиле GitHub, цвет которого берётся из email автора; создаётся локально, без сети, и выводится картинкой в графическом терминале или блочными символами в остальных. инициалы: цветной значок с инициалами."
composer_files = "Предложения композитора"
composer_files_help = { git = "Как открывается обзор ИИ-композитора commit'ов. развёрнуто: каждый предложенный commit перечисляет свои файлы. свёрнуто: только строки commit'ов; Вправо/Влево (или щелчок по стрелке) раскрывает один.", local = "Как открывается обзор ИИ-композитора коммитов. развёрнуто: каждый предложенный коммит перечисляет свои файлы. свёрнуто: только строки коммитов; Вправо/Влево (или щелчок по стрелке) раскрывает один." }
blame_side = "Аннотации Blame"
blame_side_help = "С какой стороны в виде Blame находится колонка аннотаций (аватар, автор, возраст, описание). right: справа от кода. left: слева от кода."
column_resize = "Изменение размера колонок"
column_resize_help = "Как захватывается граница колонки в Log, Radar и боковой колонке файловых видов. line: тонкая линия на всю высоту таблицы, пока указатель на границе, с небольшой меткой в заголовке. header: без промежутка и метки, размер меняется только из заголовка, где подсвечивается первый символ следующей ячейки."
blame_width = "Ширина аннотаций Blame"
blame_width_help = "Ширина колонки аннотаций в ячейках (от 24 до 90). Тяните её границу в виде Blame или используйте клавиши «шире» / «уже»; новая ширина сохраняется здесь."
ref_tree = "Дерево папок веток"
ref_tree_help = "Боковая панель Refs группирует имена веток по `/` в сворачиваемые папки, а каждый remote - отдельным узлом верхнего уровня. Выкл. даёт одну плоскую строку на ветку. `y` в панели Refs переключает это сразу и записывает выбор сюда."
reveal_on_ref_click = "Щелчок по ссылке показывает её в графе"
reveal_on_ref_click_help = "Одиночный щелчок по ссылке в панели Refs прокручивает Log туда, куда она указывает, и ненадолго подсвечивает строку. Выбор в Log и правая панель не меняются. Если выключено, щелчок только выделяет строку боковой панели. «Показать в графе» в меню ссылки, её клавиша в панели Refs и команда палитры работают в любом случае."
graph_ghost_ref = { git = "Показывать призрачную ветку на наведённом commit'е", local = "Показывать призрачную ветку на наведённом коммите" }
graph_ghost_ref_help = { git = "В колонке Ref графа Log наведённый commit без собственной ссылки показывает бледную пилюлю с названием ветки, к которой он относится (иначе удалённой ветки), выведенным из истории. При наведении на пилюлю видно её тип. Щелчок по ней ничего особого не делает; ветку создаёт команда создания ветки. Рисуется только там, где в колонке Ref хватает места. Выкл. скрывает её.", local = "В колонке Ref графа Log наведённый коммит без собственной ссылки показывает бледную пилюлю с названием ветки, к которой он относится (иначе удалённой ветки), выведенным из истории. При наведении на пилюлю видно её тип. Щелчок по ней ничего особого не делает; ветку создаёт команда создания ветки. Рисуется только там, где в колонке Ref хватает места. Выкл. скрывает её." }
mouse_enabled = "Мышь включена"
mouse_enabled_help = "Выкл. оставляет выделение перетаскиванием вашему терминалу. Нужен перезапуск."
