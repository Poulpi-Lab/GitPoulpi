# context: scope combobox row: from the oldest selected commit up to HEAD; {n} is how many commits that is
scope_to_head = { one = { git = "От выбранного до HEAD ({n} commit)", local = "От выбранного до HEAD ({n} коммит)" }, few = { git = "От выбранного до HEAD ({n} commit'а)", local = "От выбранного до HEAD ({n} коммита)" }, many = { git = "От выбранного до HEAD ({n} commit'ов)", local = "От выбранного до HEAD ({n} коммитов)" }, other = { git = "От выбранного до HEAD ({n} commit'ов)", local = "От выбранного до HEAD ({n} коммитов)" } }
# context: detail combobox row: the lowest level
