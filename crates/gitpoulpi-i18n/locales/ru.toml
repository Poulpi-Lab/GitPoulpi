[prompt_dialog]
# context: title of the stash dialog; stash is the git verb (stash the working changes)
stash_title = "{$Stash} изменений"
# context: placeholder of the stash message field; an empty message is allowed
stash_placeholder = "сообщение (необязательно)"
# context: the primary button of the stash dialog; stash is the git verb
stash_button = "{$Stash}"
# context: AI button of the stash dialog (the key that does the same follows it); the AI writes the stash message
ai_message_button = "Сообщение от ИИ"
# context: shown in the stash message field while the AI is writing it
ai_writing = "пишу..."
# context: title of the dialog that annotates an existing tag; {name} is the tag
tag_annotate_title = "Аннотировать {$tag} {name}"
# context: title of the dialog that creates an annotated tag; {name} is the new tag, {sha} the short hash of the commit it points at
tag_new_title = "Новый аннотированный {$tag} {name} в {sha}"
# context: placeholder of the tag message field (several lines allowed)
tag_placeholder = "сообщение"
# context: the primary button of the dialog that annotates an existing tag
tag_annotate_button = "Аннотировать"
# context: the primary button of the dialog that creates an annotated tag
tag_create_button = "Создать {$tag}"
# context: hint under the multi-line message field of the tag dialog; {key} is the key that applies
keys_hint = "Enter: новая строка, {key}: применить, Esc: отмена"
# context: title of the dialog that sets the upstream (the remote branch it tracks) of a local branch; {branch} is the local branch
upstream_title = "Задать upstream для {branch}"
# context: placeholder of the remote branch list of that dialog while nothing is chosen
upstream_placeholder = "Выберите удалённую ветку..."
# context: the primary button of the set upstream dialog
set_button = "Задать"
# context: button of the set upstream dialog that removes the branch's upstream (only shown when it has one)
unset_button = "Сбросить upstream"
# context: inline error in the set upstream dialog when the typed value starts with a name that is not a remote; {remote} is that name
unknown_remote = "Нет remote'а «{remote}»"
# context: inline error in the set upstream dialog when Set is pressed with nothing chosen
upstream_none = "Сначала выберите удалённую ветку."
# context: title of the dialog that routes file patterns through Git LFS
lfs_track_title = "Отслеживать через Git LFS"
# context: placeholder of the Git LFS track field; several patterns are separated by spaces
lfs_track_placeholder = "шаблоны, напр. *.psd assets/big.bin"
# context: the primary button of the Git LFS track dialog
track_button = "Отслеживать"
# context: title of the dialog that stops routing a pattern through Git LFS
lfs_untrack_title = "Прекратить отслеживание через Git LFS"
# context: placeholder of the list of tracked Git LFS patterns while nothing is chosen
lfs_untrack_placeholder = "Выберите шаблон..."
# context: the primary button of the Git LFS untrack dialog
untrack_button = "Не отслеживать"
# context: inline error in the Git LFS track and untrack dialogs when no pattern was given
pattern_empty = "Введите хотя бы один шаблон."

