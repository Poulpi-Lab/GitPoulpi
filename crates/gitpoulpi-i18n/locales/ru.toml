# Log: Copy as Mermaid gitGraph (mermaid_popup.rs).
[mermaid]
# context: title of the popup that turns Log commits into a Mermaid gitGraph script. Width budget: 40 cells
title = "Копировать как Mermaid gitGraph"
# context: label of the combobox that picks which commits go into the script. Width budget: 12 cells
scope_label = "{$Commits}"
# context: label of the combobox that picks how much is written per commit. Width budget: 12 cells
detail_label = "Детализация"
# context: label of the combobox that picks the direction of the graph. Width budget: 12 cells
orientation_label = "Направление"
# context: scope combobox row: only the selected commits; {n} is how many
