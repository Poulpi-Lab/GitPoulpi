[settings_git]
default_backend = "Бэкенд git"
default_backend_help = "Глобально. Работающий демон сохраняет бэкенд, с которым запущен."
default_backend_warning = "Действует для демонов, запущенных после этого изменения."
pull_mode = "Кнопка «{$Pull}»"
default_encoding = "Кодировка по умолчанию"
default_encoding_help = { git = "Используется для показа содержимого файлов, blame и diff, которые не являются корректным UTF-8 (корректный UTF-8 никогда не перекодируется). Репозиторий может переопределить её ниже. Только отображение: staging и патчи сохраняют байты файла как есть.", local = "Используется для показа содержимого файлов, blame и различий, которые не являются корректным UTF-8 (корректный UTF-8 никогда не перекодируется). Репозиторий может переопределить её ниже. Только отображение: индексация и патчи сохраняют байты файла как есть." }
push_behavior = "Кнопка «{$Push}»"
push_behavior_help = { git = "сразу: сразу делать push на remote по умолчанию. спрашивать: открыть небольшое меню с предвыбранным remote по умолчанию. ▾ на кнопке всегда спрашивает.", local = "сразу: сразу отправлять на remote по умолчанию. спрашивать: открыть небольшое меню с предвыбранным remote по умолчанию. ▾ на кнопке всегда спрашивает." }
repo_encoding_help = { git = "Как содержимое файлов, blame и diff декодируются для показа, если это не корректный UTF-8 (только этот репозиторий; inherited: «Кодировка по умолчанию» на этой странице). Staging ничего не перекодирует.", local = "Как содержимое файлов, blame и различия декодируются для показа, если это не корректный UTF-8 (только этот репозиторий; inherited: «Кодировка по умолчанию» на этой странице). Индексация ничего не перекодирует." }
core_autocrlf_help = "Записывается в git-конфигурацию этого репозитория (core.autocrlf), поэтому её видят git и все другие инструменты. true: LF в CRLF при checkout; input: CRLF в LF только при сохранении в историю; false: не преобразовывать. (унаследовано): удаляет значение репозитория, чтобы действовала ваша глобальная git-конфигурация. Можно отменить."
core_eol_help = "Записывается в git-конфигурацию этого репозитория (core.eol): окончание строк, которое git использует для текстовых файлов в рабочем дереве (lf, crlf или native, то есть платформенное). (унаследовано): удаляет значение репозитория, чтобы действовала ваша глобальная git-конфигурация. Можно отменить."
git_lfs = "Git LFS"
git_lfs_help = { git = "Показывать Git LFS в интерфейсе (tag LFS, карточка diff, баннер об отсутствии программы, команды LFS) и позволять GitPoulpi выполнять свои шаги LFS (fetch объектов после clone). Выкл.: собственные фильтры LFS в git работают по-прежнему, GitPoulpi сам git-lfs не вызывает.", local = "Показывать Git LFS в интерфейсе (метка LFS, карточка различий, баннер об отсутствии программы, команды LFS) и позволять GitPoulpi выполнять свои шаги LFS (загрузка объектов после clone). Выкл.: собственные фильтры LFS в git работают по-прежнему, GitPoulpi сам git-lfs не вызывает." }
git_lfs_program = "Программа git-lfs"
git_lfs_program_help = "Установите с https://git-lfs.com (Windows: входит в Git for Windows или `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Палитра: «LFS: открыть страницу установки»."
initialize_lfs_for_this_repository = "Инициализировать LFS для этого репозитория"
initialize_lfs_for_this_repository_help = "Выполняет `git lfs install --local`: фильтры и хуки LFS в конфигурации самого репозитория, никогда не в глобальной. Нужен git-lfs."
pull_mode_help = { git = "Что делает кнопка {$Pull}{hint} на панели инструментов: merge (fast-forward, если возможно), ff_only или rebase. Пункты ▾ на кнопке сразу выполняют своё действие и этот выбор не меняют.", local = "Что делает кнопка «{$Pull}»{hint} на панели инструментов: слияние (fast-forward, если возможно), ff_only или перебазирование. Пункты ▾ на кнопке сразу выполняют своё действие и этот выбор не меняют." }
merge_fast_forward = { git = "Fast-forward при merge", local = "Fast-forward при слиянии" }
merge_fast_forward_help = { git = "Как merge, который вы запускаете (меню ветки, drag and drop, палитра, командная строка), обращается с веткой, которую можно просто перемотать fast-forward. never: всегда создавать merge-commit. allowed: fast-forward, если возможно, как git делает по умолчанию. only: только fast-forward, а если это невозможно, отказ. Репозиторий может переопределить это на странице «Настройки merge».", local = "Как слияние, которое вы запускаете (меню ветки, drag and drop, палитра, командная строка), обращается с веткой, которую можно просто перемотать fast-forward. never: всегда создавать коммит слияния. allowed: fast-forward, если возможно, как git делает по умолчанию. only: только fast-forward, а если это невозможно, отказ. Репозиторий может переопределить это на странице «Настройки слияния»." }
repo_heading = "Репозиторий: {repo} - только этот репозиторий"
inherited = "(унаследовано)"
lfs_not_checked = "(ещё не проверено)"
lfs_autofix_filters = { git = "Устанавливать фильтры LFS перед {$pull} и {$push}", local = "Устанавливать фильтры LFS перед получением и отправкой" }
lfs_autofix_filters_help = { git = "Перед {$pull} или {$push} в репозитории с Git LFS запускает `git lfs install --local`, если его фильтров или хуков LFS нет (только в собственной конфигурации репозитория, не в глобальной), чтобы передача обработала большие файлы. Строка состояния сообщит, если это произошло. Нужен git-lfs.", local = "Перед получением или отправкой в репозитории с Git LFS запускает `git lfs install --local`, если его фильтров или хуков LFS нет (только в собственной конфигурации репозитория, не в глобальной), чтобы передача обработала большие файлы. Строка состояния сообщит, если это произошло. Нужен git-lfs." }
push_group_preflight = { git = "Проверять все remote перед push", local = "Проверять все remote перед отправкой" }
push_group_preflight_help = { git = "Перед push ветки с дополнительными целями push сначала проверяется каждый remote (быстрый запрос и загрузка с remote только если он отличается), чтобы проблема на третьем remote была видна до начала первого push. Выключено: push на каждый remote по очереди и отчёт о результатах.", local = "Перед отправкой ветки с дополнительными целями отправки сначала проверяется каждый remote (быстрый запрос и загрузка с remote только если он отличается), чтобы проблема на третьем remote была видна до начала первой отправки. Выключено: отправка на каждый remote по очереди и отчёт о результатах." }
default_push_targets = { git = "Дополнительные цели push для новых веток", local = "Дополнительные цели отправки для новых веток" }
default_push_targets_help = { git = "Только этот репозиторий. Отметьте remote, на которые новая ветка делает push, помимо своего upstream. Они копируются в ветку, когда она впервые получает upstream (первый push, который его задаёт, или ветка, созданная из ветки remote). Уже существующие ветки не меняются: меняйте их в диалоге «Remote ветки».", local = "Только этот репозиторий. Отметьте remote, на которые новая ветка тоже отправляет изменения, помимо своего upstream. Они копируются в ветку, когда она впервые получает upstream (первая отправка, которая его задаёт, или ветка, созданная из ветки remote). Уже существующие ветки не меняются: меняйте их в диалоге «Remote ветки»." }
default_push_targets_none = "(remote не настроены)"

