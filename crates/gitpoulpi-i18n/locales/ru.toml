diff_layout = "Вид по умолчанию"
diff_layout_help = { git = "Единый (одна колонка) или рядом (до и после бок о бок). Восстанавливается по последнему просмотренному diff, в этом окне и между запусками - смена здесь задаёт только то, с чего начнёт *новый* сеанс.", local = "Единый (одна колонка) или рядом (до и после бок о бок). Восстанавливается по последним просмотренным различиям, в этом окне и между запусками - смена здесь задаёт только то, с чего начнёт *новый* сеанс." }
