title_filtered = "Справка - фильтр «{filter}» - Esc сбрасывает, ? закрывает"
hint = "Tab/Shift+Tab, ←/→ или Alt+1..8: вкладки - ↑/↓, PgUp/PgDn прокрутка"
start_1 = { git = "Окно|Вкладки сверху («Главная» показывает, открывает и клонирует репозитории), затем панель инструментов, слева боковая панель Refs, в центре Log, справа изменения и форма commit'а.", local = "Окно|Вкладки сверху («Главная» показывает, открывает и клонирует репозитории), затем панель инструментов, слева боковая панель Refs, в центре Log, справа изменения и форма коммита." }
start_2 = "Палитра команд|Ctrl+P показывает каждое действие с его сочетанием. Вводите для поиска, Enter запускает. Всё, что умеет мышь, умеет и палитра."
start_3 = "Префиксы сочетаний|Ctrl+G, затем клавиша запускает действие git ({$stage}, {$commit}, {$pull}, {$push}...). Ctrl+N, затем клавиша перемещает или меняет вид. Строка состояния перечисляет варианты."
start_4 = "Вкладки|Одна вкладка на репозиторий. Ctrl+PgUp / Ctrl+PgDn переключают, Ctrl+W закрывает, t открывает выбор вкладок, правый щелчок по вкладке или Ctrl+T открывает её меню."
start_5 = { git = "Мышь и клавиши|Щелчок выбирает, двойной щелчок открывает или делает checkout, правый щелчок (или .) открывает меню, перетаскивание двигает ссылки и строки {$rebase}. У каждого действия мыши есть клавиша.", local = "Мышь и клавиши|Щелчок выбирает, двойной щелчок открывает или делает checkout, правый щелчок (или .) открывает меню, перетаскивание двигает ссылки и строки перебазирования. У каждого действия мыши есть клавиша." }
start_6 = "Обновить и отменить|r обновляет, F5 перезагружает всё, Ctrl+Z / Ctrl+Y отменяют и повторяют последнюю операцию, q выходит."
log_1 = "Чтение графа|Одна строка на {$commit}, одна дорожка на ветку. Первая строка - ваша незафиксированная работа (WIP): выберите её, чтобы увидеть изменения. Щелчок по строке покажет подробности справа."
log_2 = "Поиск|f (или кнопка Поиск) приглушает строки, не совпадающие с сообщением, автором, хешем или ссылкой. Enter / Shift+Enter переходят к следующему / предыдущему совпадению. / фильтрует панель Refs."
log_3 = { git = "Меню commit'а|Правый щелчок по commit'у или . на нём: {$cherry_pick}, revert, reset, правка сообщения, создание ветки или tag'а, checkout, worktree, патч, копирование.", local = "Меню коммита|Правый щелчок по коммиту или . на нём: {$cherry_pick}, revert, reset, правка сообщения, создание ветки или тега, checkout, worktree, патч, копирование." }
log_4 = { git = "Интерактивный {$rebase}|«Интерактивный {$rebase} отсюда...» в меню commit'а: задайте каждому commit'у {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} или {$edit}, переставляйте Ctrl+Вверх/Вниз, запускайте Ctrl+S, выходите Esc.", local = "Интерактивное перебазирование|«Интерактивное перебазирование отсюда...» в меню коммита: задайте каждому коммиту действие ({$pick}, {$reword}, {$squash}, {$fixup}, {$drop} или {$edit}), переставляйте Ctrl+Вверх/Вниз, запускайте Ctrl+S, выходите Esc." }
log_5 = { git = "Несколько commit'ов|Ctrl+щелчок переключает {$commit}, Shift+щелчок (Alt+щелчок) выделяет диапазон, Пробел переключает текущий, Esc сбрасывает. Затем правый щелчок: {$cherry_pick} или revert всего выделения.", local = "Несколько коммитов|Ctrl+щелчок переключает коммит, Shift+щелчок (Alt+щелчок) выделяет диапазон, Пробел переключает текущий, Esc сбрасывает. Затем правый щелчок: {$cherry_pick} или revert всего выделения." }
log_6 = { git = "Перетаскивание ссылок|Перетащите ветку на другую для merge, rebase или fast-forward, либо на удалённую ветку для push; отпустите и выберите в меню, Esc отменяет. Клавиатура: палитра, «Refs: перетащить выбранную ссылку на текущую ветку...».", local = "Перетаскивание ссылок|Перетащите ветку на другую для слияния, перебазирования или fast-forward, либо на удалённую ветку для отправки; отпустите и выберите в меню, Esc отменяет. Клавиатура: палитра, «Refs: перетащить выбранную ссылку на текущую ветку...»." }
changes_1 = "Текущие изменения|Выберите первую строку Log (WIP): файлы {$unstaged} и {$staged} появятся справа. m переключает путь / дерево, a показывает все файлы, z сворачивает папки."
changes_2 = { git = "Stage и unstage|Ctrl+Пробел на файле, его кнопка или Ctrl+G s; Ctrl+G a - всё, Ctrl+G u - unstage. Правый щелчок по файлу: отбросить изменения, история или blame, открыть в редакторе.", local = "Добавить в индекс и убрать из индекса|Ctrl+Пробел на файле, его кнопка или Ctrl+G s; Ctrl+G a - всё, Ctrl+G u - убрать из индекса. Правый щелчок по файлу: отбросить изменения, история или blame, открыть в редакторе." }
changes_3 = { git = "Чтение diff|Щёлкните файл или нажмите d. m переключает единый / раздельный вид, w переносит строки, s игнорирует пробелы, n / p переходят между блоками, Esc или q возвращает в Log.", local = "Чтение различий|Щёлкните файл или нажмите d. m переключает единый / раздельный вид, w переносит строки, s игнорирует пробелы, n / p переходят между блоками, Esc или q возвращает в Log." }
changes_4 = { git = "Блоки и строки|В diff: Пробел = {$stage} блока, v, затем j / k, затем Enter = {$stage} выбранных строк, x = отбросить блок. Отбрасывание сначала спрашивает; Ctrl+Z возвращает.", local = "Блоки и строки|В различиях: Пробел = добавить блок в индекс, v, затем j / k, затем Enter = добавить выбранные строки в индекс, x = отбросить блок. Отбрасывание сначала спрашивает; Ctrl+Z возвращает." }
changes_5 = "Написать {$commit}|Введите заголовок и описание, затем Ctrl+Enter или зелёная кнопка. Shift+A исправляет последний {$commit}. Ctrl+G c переносит курсор в форму, Esc выходит."
changes_6 = { git = "Конфликты merge|Баннер предлагает «Разрешить конфликты...». В редакторе merge выберите A, B или оба для каждого конфликта (a / b / c), правьте Результат, сохраните, затем Продолжить.", local = "Конфликты слияния|Баннер предлагает «Разрешить конфликты...». В редакторе слияния выберите A, B или оба для каждого конфликта (a / b / c), правьте Результат, сохраните, затем Продолжить." }
changes_7 = "Отмена и повтор|Ctrl+Z / Ctrl+Y или кнопки панели отменяют и повторяют большинство операций: {$commits}, ветки, checkout, reset, {$stashes}, отмены правок. При риске сначала спрашивает."
refs_1 = { git = "Ветки и {$tags}|Двойной щелчок по локальной ветке или tag'у делает checkout; правый щелчок открывает меню ({$merge}, {$rebase}, переименовать, удалить...). Ctrl+G b и Ctrl+G t создают их на текущем commit'е.", local = "Ветки и теги|Двойной щелчок по локальной ветке или тегу делает checkout; правый щелчок открывает меню (слияние, перебазирование, переименовать, удалить...). Ctrl+G b и Ctrl+G t создают их на текущем коммите." }
refs_2 = "Соло и скрытие|Клавиша o показывает только {$commits} выбранной ссылки, Shift+O отключает. Меню ссылки скрывает её в графе; Shift+H снова показывает всё. Только вид: репозиторий не меняется."
refs_3 = { git = "Fetch, pull, push|Ctrl+G f: fetch всех remote. Ctrl+G p: pull. Ctrl+G Shift+P: push. Стрелка у кнопки выбирает другой способ или другой remote.", local = "Загрузка, получение, отправка|Ctrl+G f: загрузить все remote. Ctrl+G p: подтянуть. Ctrl+G Shift+P: отправить. Стрелка у кнопки выбирает другой способ или другой remote." }
refs_4 = "Remote-репозитории|Плюс в заголовке REMOTE добавляет remote. Правый щелчок по remote: {$fetch}, копировать веб-ссылку, править URL или удалить."
refs_5 = { git = "{$Stashes} и worktree|Кнопки Stash и Pop; Ctrl+G m сначала спрашивает сообщение. Правый щелчок по stash'у: применить или достать. «Создать worktree из...» открывает ветку в отдельной вкладке.", local = "Стэши и worktree|Кнопки «Стэш» и «Достать»; Ctrl+G m сначала спрашивает сообщение. Правый щелчок по стэшу: применить или достать. «Создать worktree из...» открывает ветку в отдельной вкладке." }
refs_6 = "Подмодули и LFS|Раздел ПОДМОДУЛИ появляется, если подмодули есть: двойной щелчок открывает подмодуль вкладкой, правый щелчок обновляет. Действия Git LFS: кнопка LFS или Ctrl+G l."
hosting_1 = "Подключение|Настройки > Интеграции: вставьте личный токен GitHub или GitLab. Аккаунт не нужен; токен уходит в системное хранилище учётных данных."
hosting_2 = "Привязка репозитория|В разделах {$PRS} и ЗАДАЧИ боковой панели выберите одного из предложенных списком провайдеров. Ничего не привязывается само; привязка хранится для каждого репозитория."
hosting_3 = { git = "Создание {$pr}|Плюс в заголовке {$PRS} или n в этом разделе открывает форму; в меню ветки есть «Создать {$pr} из...». ИИ может написать заголовок и описание.", local = "Создание запроса на слияние|Плюс в заголовке {$PRS} или n в этом разделе открывает форму; в меню ветки есть «Создать {$pr} из...». ИИ может написать заголовок и описание." }
hosting_4 = "Задачи|Раздел ЗАДАЧИ их показывает; + или n создаёт новую. Меню строки открывает задачу в браузере или действует над ней."
hosting_5 = { git = "Ссылки|Ссылки на задачи и {$prs} (#12, !53, ABC-7) в сообщении commit'а или имени ветки распознаются. Alt+R в форме commit'а вставляет ссылку.", local = "Ссылки|Ссылки на задачи и запросы на слияние (#12, !53, ABC-7) в сообщении коммита или имени ветки распознаются. Alt+R в форме коммита вставляет ссылку." }
hosting_6 = "Чип на панели|Слева на панели инструментов чип показывает {$pr} текущей ветки (GH #12, GL !53) или приглушённый «+ {$pr_abbr}», чтобы начать. Нажмите на него."
hosting_7 = "Ключи SSH|Выберите ключ SSH для профиля (Настройки > Профили) или для репозитория (меню вкладки > «SSH и учётные данные...»). Парольные фразы остаются в системном ssh-agent."
setup_1 = "Настройки|Ctrl+, или шестерёнка. Tab переключает список страниц и параметры, j / k двигают, Enter или Пробел меняет значение, / или Ctrl+F ищет по всем параметрам, Esc закрывает."
setup_2 = "Темы|Настройки > Оформление > Тема: тёмная, светлая, как в терминале или один из многих пресетов. Ctrl+N и клавиша тоже меняют тему, язык и цвета графа, не открывая Настройки."
setup_3 = "Язык|Настройки > Общие > Язык предлагает 17 языков. «Переводить термины git» решает, переводятся ли собственные слова git ({$commit}, {$push}...)."
setup_4 = { git = "Профили|Настройки > Профили хранят личности автора commit'ов (имя, email, ключ SSH). Список профилей на панели выбирает личность для этого репозитория.", local = "Профили|Настройки > Профили хранят личности автора коммитов (имя, email, ключ SSH). Список профилей на панели выбирает личность для этого репозитория." }
setup_5 = "Открыть в|Кнопка Открыть в (Alt+O) открывает папку этой вкладки в терминале, редакторе или файловом менеджере. Настройки > Открыть в правят список."
setup_6 = "Сочетания клавиш|Настройки > Клавиатура и мышь переназначают любую клавишу. Вкладка Клавиши этой справки показывает ваши сочетания."
tools_1 = "ИИ (необязательно)|Выключен, пока вы не настроите его в Настройки > ИИ: OpenAI-совместимый сервис, Anthropic или локальный агент вроде claude -p. Аккаунт GitPoulpi не нужен никогда."
tools_2 = { git = "Действия ИИ|Кнопка-искра у заголовка или Ctrl+G i пишет сообщение commit'а; Ctrl+G w объясняет изменения; Ctrl+G C делит работу на несколько commit'ов; Alt+I предлагает решение конфликта. Ничего не применяется без вашего подтверждения.", local = "Действия ИИ|Кнопка-искра у заголовка или Ctrl+G i пишет сообщение коммита; Ctrl+G w объясняет изменения; Ctrl+G C делит работу на несколько коммитов; Alt+I предлагает решение конфликта. Ничего не применяется без вашего подтверждения." }
tools_3 = "CLI|gitpoulpi <команда> делает из скрипта то же, что окно, через того же демона, так что изменения видны сразу. --json даёт машинный вывод, --help перечисляет параметры."
tools_4 = "MCP|gitpoulpi mcp serve --stdio даёт ИИ-агентам по инструменту на каждую команду CLI. Настройки > Агенты и MCP определяют, что они могут менять."
tools_5 = "Обёртка оболочки|С обёрткой оболочки gp «Выйти и cd сюда» оставляет вашу оболочку в папке активной вкладки при выходе из GitPoulpi."

