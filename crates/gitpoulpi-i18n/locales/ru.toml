auto_prune_help = { git = "Убирает remote-tracking ветки, которых больше нет на remote, при каждом {$fetch}, кроме проверки lease в диалоге расходящегося {$push}: при фоновом auto-{$fetch} и при {$Fetch} / {$Fetch} All на панели инструментов. По умолчанию включено, поэтому ветка, удалённая на сервере, исчезает из раздела REMOTE после следующего {$fetch}; отключите, чтобы устаревшие remote-tracking ветки оставались в списке.", local = "Убирает удалённые ветки, которых больше нет на remote, при каждой загрузке, кроме проверки lease в диалоге расходящейся отправки: при фоновой автозагрузке и при «Загрузить» / «Загрузить всё» на панели инструментов. По умолчанию включено, поэтому ветка, удалённая на сервере, исчезает из раздела REMOTE после следующей загрузки; отключите, чтобы устаревшие удалённые ветки оставались в списке." }
