[_meta]
language_name = "Русский"

# `git`: английский словарь (по умолчанию). `local`: русский git-словарь
# (параметр «Переводить термины git»). Формы выбраны так, чтобы подстановка
# работала в именительном/винительном падеже (неодушевлённые существительные).
[term]
commit = { git = "commit", local = "коммит" }
commits = { git = "commits", local = "коммиты" }
push = { git = "push", local = "отправить" }
pull = { git = "pull", local = "подтянуть" }
fetch = { git = "fetch", local = "загрузить" }
merge = { git = "merge", local = "слияние" }
rebase = { git = "rebase", local = "перебазирование" }
cherry_pick = { git = "cherry-pick", local = "cherry-pick" }
stash = { git = "stash", local = "стэш" }
stashes = { git = "stashes", local = "стэши" }
pop = { git = "pop", local = "достать" }
apply = { git = "apply", local = "применить" }
stash_drop = { git = "drop", local = "удалить" }
tag = { git = "tag", local = "тег" }
tags = { git = "tags", local = "теги" }
head = { git = "HEAD", local = "HEAD" }
diff = { git = "diff", local = "различия" }
pr = { git = { pull = "pull request", merge = "merge request" }, local = { pull = "запрос на слияние", merge = "запрос на слияние" } }
prs = { git = { pull = "pull requests", merge = "merge requests" }, local = { pull = "запросы на слияние", merge = "запросы на слияние" } }
pr_abbr = { git = { pull = "PR", merge = "MR" }, local = { pull = "PR", merge = "MR" } }
pick = { git = "pick", local = "взять" }
reword = { git = "reword", local = "переформулировать" }
squash = { git = "squash", local = "объединить" }
fixup = { git = "fixup", local = "fixup" }
drop = { git = "drop", local = "убрать" }
edit = { git = "edit", local = "изменить" }
stage = { git = "stage", local = "добавить в индекс" }
unstage = { git = "unstage", local = "убрать из индекса" }
staged = { git = "staged", local = "в индексе" }
unstaged = { git = "unstaged", local = "вне индекса" }
staged_files = { git = "Файлы staged", local = "Файлы в индексе" }
unstaged_files = { git = "Файлы unstaged", local = "Файлы вне индекса" }
push_noun = { git = "push", local = "отправка" }
pull_noun = { git = "pull", local = "получение изменений" }
fetch_noun = { git = "fetch", local = "загрузка" }
merge_noun = { git = "merge", local = "слияние" }
rebase_noun = { git = "rebase", local = "перебазирование" }

