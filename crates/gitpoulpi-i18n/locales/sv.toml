startup_tab_outside_repo = "Startflik utanför ett repository"
startup_tab_outside_repo_help = "Fliken som en start öppnar på när mappen den startar i inte är ett repository, till exempel en användarmapp. Senaste fliken öppnar fliken som var aktiv vid senaste avslutet (Hem när Kom ihåg flikar är av eller inget är sparat). Radar öppnar Hem när Radar är av. Läses en gång vid start; kräver omstart."
startup_tab_launcher = "Startflik från startaren"
startup_tab_launcher_help = "Fliken som en start öppnar på när GitPoulpi startas från sin genväg på skrivbordet eller i Startmenyn (se Startare nedan), oavsett mapp. Har företräde framför de två inställningarna ovan; Senaste fliken och Radar beter sig som ovan. Läses en gång vid start; kräver omstart."
group_worktree_tabs = "Gruppera worktree-flikar"
group_worktree_tabs_help = "Flikarna för ett repositorys länkade worktrees hamnar direkt efter repositoryts egen flik, och en worktree-flik som dras bort hoppar tillbaka intill den. Av lämnar flikarna där du placerat dem. När du slår på det grupperas de öppna flikarna om."
allow_agent_view_control = "Låt AI-agenter styra vyn"
allow_agent_view_control_help = { git = "På: en AI-agent (via MCP eller `gitpoulpi ui`) kan be det här fönstret visa en commit, en fil eller ett meddelande. Den ändrar aldrig något i repositoryt. Av: fönstret tar inte emot sådant. Läses när ett fönster öppnas.", local = "På: en AI-agent (via MCP eller `gitpoulpi ui`) kan be det här fönstret visa en incheckning, en fil eller ett meddelande. Den ändrar aldrig något i repositoryt. Av: fönstret tar inte emot sådant. Läses när ett fönster öppnas." }
allow_ui_propose = "Låt AI-agenter föreslå ändringar som jag bekräftar"
allow_ui_propose_help = { git = "På: en AI-agent får öppna en förifylld dialog åt dig: ett nytt meddelande för en commit, ett commit-meddelande i composern, en ny gren eller tag. Den märks ✦ Föreslaget av <agent>, och inget ändras förrän du trycker på dialogens egen bekräftelseknapp; Esc avvisar den. Av (standard): `ui propose` och MCP-verktygen ui_propose_* avvisas.", local = "På: en AI-agent får öppna en förifylld dialog åt dig: ett nytt meddelande för en incheckning, ett incheckningsmeddelande i composern, en ny gren eller tagg. Den märks ✦ Föreslaget av <agent>, och inget ändras förrän du trycker på dialogens egen bekräftelseknapp; Esc avvisar den. Av (standard): `ui propose` och MCP-verktygen ui_propose_* avvisas." }
clone_root = "Standardmapp för kloning"
clone_root_help = "Där klondialogens ”Klona till” börjar. Tomt använder standarden per OS: %USERPROFILE%\\source\\repos på Windows, ~/src annars."
# context: setting: which source the Clone dialog opens on (Last used, Clone with URL, or an integration)
clone_start_source = "Klona-dialogen startar på"
clone_start_source_help = "Källan som Klona-dialogen öppnas på. Senast använd öppnar den som visades när dialogen stängdes sist; Klona med URL startar alltid på URL-formuläret; eller välj en av dina anslutna integrationer. En källa som inte längre är tillgänglig ersätts av Klona med URL."
# context: option of the "Clone dialog starts on" setting: the source shown when the dialog was last closed
clone_start_last = "Senast använd"
browse_root = "Standardmapp för bläddring"
browse_root_help = "Där Bläddra (mappväljaren, från fliken Hem) öppnas som standard. Tomt gör att Bläddra öppnas i senast valda mapp - eller hemmappen första gången - i stället för en fast mapp."
heading_auto_stash = "Auto-stash"
heading_log = "Programlogg"
heading_undo = "Ångrahistorik"
log_level = "Loggnivå"
log_retention_days = "Behåll loggfiler"
# context: setting help: how long log files are kept; a number and a unit (days, weeks, months, years) on one line
log_retention_help = "Äldre loggfiler tas bort när GitPoulpi startar. Varje dags fil begränsas dessutom av storleksinställningen nedan."
# context: setting: where the data GitPoulpi keeps for one repository lives (ref filters, fold state, workflow, caches)
repo_data_location = "Plats för repositorydata"
# context: help of the setting above
repo_data_location_help = "Var data per repository (reffilter, arbetsflöde, cacher) lagras. Inuti .git hålls arbetskatalogen ren; om du flyttar inställningen migreras befintliga data."
# context: option of the repository data location: inside the repository's .git folder
repo_data_in_git_dir = "Inuti .git (mappen gitpoulpi)"
# context: option of the repository data location: a .gitpoulpi folder in the working tree
repo_data_in_worktree = "I arbetskatalogen (mappen .gitpoulpi)"
# context: option of the repository data location: the user's own data folder
repo_data_user_data = "I min användardatamapp (utanför repositoryt)"
log_max_file_mb = "Största storlek för en loggfil"
log_timings = "Visa hur lång tid åtgärder tar"
log_timings_help = "Lägger till varaktigheten i millisekunder för varje åtgärd i aktivitetsloggen (fliken Git-åtgärder)."
log_extended = "Utökad loggning"
log_extended_help = "Visar även bakgrundsåtgärder (automatisk {$fetch}, uppdatering, statuskontroll) med deras varaktighet."
# context: setting: how the status line counts the total commits (the dropdown choices are in settings_value)
commit_count = "Räkna det totala antalet {$commits} med"
# context: help of the setting above; mentions antivirus software
commit_count_help = "Hur statusraden får fram totalen i inlästa / totalt. System git kör en git-process (normalt snabbast). libgit2 räknar inuti GitPoulpi och startar ingen process: välj det när ett antivirusprogram skannar varje kommando och gör git långsamt. Av visar bara de inlästa {$commits}. Gäller direkt."
auto_stash = "Auto-{$stash} före checkout, {$pull}, {$merge} eller {$rebase}"
auto_stash_help = { git = "Vad som görs när en checkout, pull, merge eller rebase blockeras av lokala ändringar. ask: en dialog erbjuder att stasha dem, köra operationen och pop:a stashen igen; always: gör det utan att fråga; never: vägra, som git gör.", local = "Vad som görs när en checkout, pull, sammanslagning eller rebase blockeras av lokala ändringar. ask: en dialog erbjuder att stasha dem, köra operationen och pop:a stashen igen; always: gör det utan att fråga; never: vägra, som git gör." }
include_untracked_in_autostash = "Ta med ospårade filer i auto-stash"
include_untracked_in_autostash_help = "Om den automatiska stashen också tar ospårade filer (annars stashas och återställs bara spårade ändringar)."
hosting_refresh_minutes = "Uppdatering av {$prs} och ärenden"
hosting_refresh_minutes_help = { git = "Hur ofta sidopanelens listor över {$prs} och ärenden (och verktygsfältets länkade {$pr_abbr}-chip) frågar värden igen. 0 stänger av timern; de uppdateras ändå när ett repository öppnas, vid grenbyte, efter push eller fetch och på begäran.", local = "Hur ofta sidopanelens listor över {$prs} och ärenden (och verktygsfältets länkade {$pr_abbr}-chip) frågar värden igen. 0 stänger av timern; de uppdateras ändå när ett repository öppnas, vid grenbyte, efter push eller hämtning och på begäran." }
pr_terminology = "Terminologi för granskningsbegäran"
pr_terminology_help = "Ordet som används överallt i TUI:t för en hostad kodgranskningsbegäran. Auto följer repositoryts värd: Merge request för GitLab, Pull request för övriga värdar. Pull request eller Merge request tvingar det ordet. Gäller direkt."
hide_finished_pr_chip = { git = "Dölj {$pr}-chipet när den är stängd eller {$merge}ad", local = "Dölj {$pr_abbr}-chipet när den är stängd eller sammanslagen" }
hide_finished_pr_chip_help = { git = "Chipet i verktygsfältet visar den senaste {$pr} för den utcheckade grenen. På: det döljs när den {$pr} är stängd eller mergad, och grenen visar i stället det dämpade chipet \"+ {$pr_abbr}\", som om den inte hade någon. Av: chipet visar alltid den senaste {$pr}, oavsett status. Gäller direkt.", local = "Chipet i verktygsfältet visar den senaste begäran för den utcheckade grenen. På: det döljs när begäran är stängd eller sammanslagen, och grenen visar i stället det dämpade chipet \"+ {$pr_abbr}\", som om den inte hade någon. Av: chipet visar alltid den senaste begäran, oavsett status. Gäller direkt." }
heading_external_tools = "Externa verktyg"
external_editor = "Extern redigerare"
external_editor_help = "Kommando för en fils menyval ”Öppna i <redigerare>”; {{file}} är filens fullständiga sökväg (läggs till om den saknas). Tomt: VS Code (`code`) om det finns i PATH, annars systemets standardprogram."
external_diff_tool = "Externt diff-verktyg"
external_diff_tool_help = { git = "Kommando för ”Öppna i externt diff-verktyg”; {{local}} är den committade (eller stagade) versionen, {{remote}} versionen som jämförs. Tomt: `git difftool`, med den `diff.tool` du ställt in i git.", local = "Kommando för ”Öppna i externt diff-verktyg”; {{local}} är den incheckade (eller stagade) versionen, {{remote}} versionen som jämförs. Tomt: `git difftool`, med den `diff.tool` du ställt in i git." }
external_merge_tool = { git = "Externt merge-verktyg", local = "Externt sammanslagningsverktyg" }
external_merge_tool_help = { git = "Kommando för ”Öppna i externt merge-verktyg” på ett konfliktkort; {{base}}, {{local}} (A, nuvarande), {{remote}} (B, inkommande) och {{merged}} (där verktyget skriver resultatet; stagas när det avslutas utan fel). Tomt: `git mergetool`, med den `merge.tool` du ställt in i git.", local = "Kommando för ”Öppna i externt sammanslagningsverktyg” på ett konfliktkort; {{base}}, {{local}} (A, nuvarande), {{remote}} (B, inkommande) och {{merged}} (där verktyget skriver resultatet; stagas när det avslutas utan fel). Tomt: `git mergetool`, med den `merge.tool` du ställt in i git." }
file_explorer = "Filutforskare"
file_explorer_help = "Kommando för ”Visa i mapp”; {{path}} är filens fullständiga sökväg, {{dir}} dess mapp. Windows: explorer.exe /select,\"{{path}}\" markerar filen; Linux: xdg-open \"{{dir}}\"; macOS: open -R \"{{path}}\"."
ai_assistant = "AI-assistent"
launch = "Öppna ett fönster för agenter"
launch_help = "När en AI-agent ber om att få visa något och inget GitPoulpi-fönster är öppet någonstans, kör detta för att öppna ett: av (aldrig, standard), en terminal (kitty, foot, WezTerm, Windows Terminal, ...), en ny flik/ruta/arbetsyta i en multiplexer (tmux, zellij, cmux, ...) eller custom, som använder mallen nedan. Agenten måste fortfarande be om det (`--launch`), eller så måste dess ui_control vara auto. Gäller från nästa begäran."
launch_command = "Startkommando (custom)"
launch_command_help = "Används när valet ovan är custom. Delas upp i argument (citera med '...' eller \"...\"), inget skal. {{repo}} är repositoryts mapp, {{session}} sessionens namn och {{gitpoulpi}} det här programmet. Exempel: kitty --directory {{repo}} {{gitpoulpi}} --session {{session}}"
tab_dir_follow = "Följ aktiv flikens mapp"
tab_dir_follow_help = "Ett program kan inte byta sitt skals mapp, så detta erbjuder två sätt att ta sig dit. buttons (standard): när den aktiva fliken inte är mappen GitPoulpi startades i visar flikraden Avsluta och cd hit (bara när det startats via skalomslaget, se `gitpoulpi shell-init`). auto: inga knappar; att avsluta gör alltid cd i ditt skal till den aktiva fliken, och en terminal öppnas av sig själv varje gång du öppnar en ny flik (inte för flikar som återställs vid start)."
forget_all_usernames_and_passwords = "Glöm alla användarnamn och lösenord"
forget_all_usernames_and_passwords_help = "Tar bort varje token GitPoulpi lagrat i din credential helper."
mcp_server = "MCP-server"
mcp_server_help = "På: en AI-agent kan starta MCP-servern (`gitpoulpi mcp serve`, eller `--http` för nätverksändpunkten). Av: den vägrar starta. Sparas som `mcp.enabled`. En ändring gäller nästa gång en agent startar servern; en server som redan körs behåller de inställningar den startade med."
mcp_port = "MCP-serverns port"
mcp_port_help = "Porten som `gitpoulpi mcp serve --http` lyssnar på när ingen adress anges (värddelen av `mcp.bind` behålls, som standard 127.0.0.1, endast loopback om inte --allow-remote). Gäller nästa gång en agent startar servern; en server som körs behåller sin port."
mcp_bind_unreadable = "`mcp.bind` är ”{bind}”, som saknar läsbar port. Om du anger en port här behålls värden och resten ersätts."
undo_off_note = "Ångra är av - slå på ”Ångra aktiverat” för att ställa in djupet"
use_mailmap = "Visa författare via .mailmap"
use_mailmap_help = "Visar varje författare med det namn som repositoryts .mailmap anger, i Log, blame och filhistorik. Själva {$commits} ändras inte. Gäller direkt."
auto_prune_tags = "Auto-prune {$tags}"
auto_prune_tags_help = "Vid varje {$fetch} tas även de lokala {$tags} bort som remoten har tagit bort. Bara {$tags} som fanns på remoten berörs: en {$tag} du aldrig har publicerat behålls. Av som standard, precis som i git."

