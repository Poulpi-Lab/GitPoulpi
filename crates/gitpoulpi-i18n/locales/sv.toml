[help_text]
git_actions_then_amend = "ändra vald {$commit}: sammanfattning, beskrivning, författarens namn, e-post och datum i ett fönster"
git_actions_then_edit_author = { git = "ändra bara författaren för den valda commiten (namn, e-post, datum)", local = "ändra bara författaren för den valda incheckningen (namn, e-post, datum)" }
rewrite_1 = "öppnar omskrivningsvyn: ändra författare, datum, meddelanden, filinnehåll eller sökvägar i hela historiken eller i ett urval"
rewrite_2 = "förhandsgranskar vad reglerna skulle ändra och tillämpar det sedan som ett enda steg som Ångra tar tillbaka; Tillämpa är avstängd medan förhandsgranskningen är föråldrad"
rewrite_3 = "avbryter den pågående förhandsgranskningen (Esc gör detsamma; ett andra Esc stänger omskrivningsvyn)"
rewrite_4 = "lägger till en regel, tar bort regeln under markören, återställer den senast borttagna, duplicerar regeln"
rewrite_5 = "slår på eller av regeln, eller flyttar den uppåt eller nedåt (reglerna körs uppifrån och ned)"
rewrite_6 = "växlar mellan förhandsgranskningsflikarna"
rewrite_7 = "sparar receptet i repositoryt eller bara för dig, läser in ett sparat, byter namn på det; hemliga värden sparas aldrig"
rewrite_8 = "tar med eller utelämnar varje skyddad gren som redan är publicerad; kontrollerar de externa verktygen igen"
file_history_1 = "gå till radens {$commit} i Log och läs in mer Log om den inte finns där ännu"
file_history_2 = "flytta markeringen; diffen till höger följer direkt"
file_history_3 = "utvidga markeringen till ett intervall: till höger visas då filens diff mellan de två ändarna (Shift+klick gör detsamma)"
file_history_4 = "ge tangentbordet till diffen, eller tillbaka till listan"
file_history_5 = "kopiera SHA för {$commit} eller dess sammanfattning"
file_history_6 = "högra sidan: diffen, filen som den var vid denna {$commit}, eller dess blame; följer markeringen och behåller läget"
file_history_7 = "jämför radens version med arbetskatalogen (tryck igen för att gå tillbaka)"
file_history_8 = "återställ filen till den versionen i arbetskatalogen (frågar först; Ångra ger tillbaka de gamla byten)"
file_history_9 = "ändra listans storlek (avgränsaren går också att dra; bredden kommer ihåg)"
file_history_10 = "mus: klicka på en rad, Shift+klick för ett intervall, dubbelklick visar den i Log, högerklick öppnar menyn"
commit_column_1 = "rulla raderna i sidled (Shift+hjul eller ett horisontellt hjul gör samma sak); de rullar bara när en del har gjorts bredare än det finns plats för"
commit_column_2 = "välj en del (spår, författare, datum) och gör den bredare eller smalare, eller återställ alla delar till automatisk bredd; rubrikens gränser kan också dras, och bredderna sparas"
commit_column_3 = { git = "mus: klicka på en rad för att välja dess commit, högerklick öppnar dess meny (menytangenten också, efter att ha valt en rad med Upp/Ned)", local = "mus: klicka på en rad för att välja dess incheckning, högerklick öppnar dess meny (menytangenten också, efter att ha valt en rad med Upp/Ned)" }
commit_column_4 = "flytta den valda delen åt vänster eller höger; att dra dess rubrik gör detsamma, och ordningen sparas"
log_columns_1 = "välj en Log-kolumn (dess rubrikcell lyser upp); flytta den sedan åt vänster eller höger (att dra rubriken gör detsamma), bredda eller smalna av den (att dra dess kant gör detsamma), ge den automatisk bredd igen eller anpassa den efter innehållet (att dubbelklicka på dess kant gör detsamma; + anpassar alla kolumner). Tab / Shift+Tab väljer en annan kolumn, Esc avslutar; layouten sparas"
global_1 = "öppna kommandopaletten - varje kommando i appen, vart och ett med sitt kortkommando; skriv för att filtrera, Upp/Ned eller PageUp/PageDown för att flytta (inte j/k: de skrivs), Enter för att köra. Gråade rader säger varför de inte kan köras just nu"
global_2 = "navigeringsprefixet - se dess egen sektion nedan"
global_3 = "git-åtgärdsprefixet - se dess egen sektion nedan"
global_4 = "växla den här hjälpen - öppnas ovanpå vad som än är öppet (Inställningar, Repositoryhantering, ...), inte bara den vanliga grafen"
global_5 = "tvinga en uppdatering"
global_6 = { git = "fetch, kontrollera {$prs} och ärenden igen, ladda om", local = "hämta, kontrollera {$prs} och ärenden igen, ladda om" }
global_7 = { git = "ångra / gör om senaste operationen (commit, amend, checkout, skapa/ta bort gren); frågar först när det är riskabelt", local = "ångra / gör om senaste operationen (incheckning, amend, checkout, skapa/ta bort gren); frågar först när det är riskabelt" }
global_9 = "avsluta - från grafen; över en diff eller filvy stänger det i stället den vyn. Varje avslut loggas i gitpoulpi-tui-exit.log, bredvid konfigurationen"
global_10 = "öppna en snabbmeny, där det finns en nedan - tangenterna är utbytbara (Meny/Apps-tangenten når sällan den här appen i Windows, så F10-kombinationen är den som pålitligt fungerar där)"
global_11 = "flytta fokus till nästa / föregående ruta"
global_12 = "flytta markeringen (varje ruta och lista)"
global_13 = "vim-liknande räknarprefix för j/k/Upp/Ned (och PageUp/PageDown, som antal skärmar) - skrivna siffror visas som ”4...” på statusraden tills rörelsen sker; Esc eller någon annan tangent rensar det, och en inledande 0 startar aldrig ett (så siffror skrivs ändå normalt i composern, Refs-filtret och alla andra textfält)"
global_14 = { git = "Refs: växla avsnitt LOKALA/REMOTE/TAGS", local = "Refs: växla avsnitt LOKALA/REMOTE/TAGGAR" }
global_15 = { git = "Log: h = ut ur / l = in i en commits fillista", local = "Log: h = ut ur / l = in i en inchecknings fillista" }
global_16 = "Status: hoppa till Unstaged / Staged"
