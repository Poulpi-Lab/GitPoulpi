start_6 = "Uppdatera och ångra|r uppdaterar, F5 laddar om allt, Ctrl+Z / Ctrl+Y ångrar och gör om den senaste åtgärden, q avslutar."
log_1 = { git = "Läsa grafen|En rad per {$commit}, ett spår per gren. Första raden är ditt arbete som inte är committat (WIP): markera den för att se ändringarna. Klicka på en rad för detaljerna till höger.", local = "Läsa grafen|En rad per {$commit}, ett spår per gren. Första raden är ditt arbete som inte är incheckat (WIP): markera den för att se ändringarna. Klicka på en rad för detaljerna till höger." }
log_2 = "Söka|f (eller knappen Sök) tonar ner raderna som inte matchar ett meddelande, en författare, en hash eller en ref. Enter / Shift+Enter hoppar till nästa / föregående träff. / filtrerar Refs-sidofältet."
log_3 = { git = "{$Commit}-menyn|Högerklicka på en {$commit} eller tryck . på den: {$cherry_pick}, revert, reset, redigera meddelandet, skapa gren eller {$tag}, checkout, worktree, patch, kopiera.", local = "Incheckningsmenyn|Högerklicka på en {$commit} eller tryck . på den: {$cherry_pick}, revert, reset, redigera meddelandet, skapa gren eller {$tag}, checkout, worktree, patch, kopiera." }
log_4 = { git = "Interaktiv {$rebase}|”Interaktiv rebase härifrån...” i {$commit}-menyn: sätt varje {$commit} till {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} eller {$edit}, ordna om med Ctrl+Up/Down, starta med Ctrl+S, lämna med Esc.", local = "Interaktiv {$rebase}|”Interaktiv rebase härifrån...” i incheckningsmenyn: sätt varje {$commit} till {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} eller {$edit}, ordna om med Ctrl+Up/Down, starta med Ctrl+S, lämna med Esc." }
log_5 = "Flera {$commits}|Ctrl+klick markerar eller avmarkerar en {$commit}, Shift+klick (Alt+klick) markerar ett intervall, Mellanslag växlar den aktuella, Esc rensar. Högerklicka sedan för {$cherry_pick} eller revert av hela markeringen."
log_6 = "Dra refs|Dra en gren till en annan för {$merge}, {$rebase} eller fast-forward, eller till en remote-gren för {$push}; släpp för att välja i en meny, Esc avbryter. Tangentbord: paletten, ”Refs: Släpp vald ref på utcheckad gren...”."
changes_1 = "Pågående ändringar|Markera första Log-raden (WIP): filerna, {$unstaged} och {$staged}, visas till höger. m växlar mellan sökväg och träd, a visar alla filer, z fäller ihop mapparna."
changes_2 = "Stagea och unstagea|Ctrl+Mellanslag på en fil, dess knapp eller Ctrl+G s; Ctrl+G a för allt, Ctrl+G u för att unstagea. Högerklicka på en fil för att förkasta den, se dess historik eller blame, eller öppna den i din redigerare."
changes_3 = "Läsa en {$diff}|Klicka på en fil eller tryck d. m växlar infogad / delad, w radbryter, s ignorerar blanksteg, n / p hoppar mellan hunks, Esc eller q går tillbaka till Log."
changes_4 = "Hunks och rader|I en {$diff}: Mellanslag = stagea hunken, v sedan j / k sedan Enter = stagea de valda raderna, x = förkasta hunken. Att förkasta frågar först; Ctrl+Z återställer."
changes_5 = "Skriva en {$commit}|Skriv en sammanfattning och en beskrivning, sedan Ctrl+Enter eller den gröna knappen. Shift+A ändrar den senaste {$commit} (amend). Ctrl+G c flyttar markören till formuläret, Esc lämnar det."
changes_6 = { git = "Merge-konflikter|En banner erbjuder ”Lös konflikter...”. I merge-redigeraren väljer du A, B eller båda för varje konflikt (a / b / c), redigerar Resultat, sparar och väljer sedan Fortsätt.", local = "Sammanslagningskonflikter|En banner erbjuder ”Lös konflikter...”. I redigeraren för sammanslagning väljer du A, B eller båda för varje konflikt (a / b / c), redigerar Resultat, sparar och väljer sedan Fortsätt." }
changes_7 = "Ångra och gör om|Ctrl+Z / Ctrl+Y, eller verktygsfältets knappar, ångrar och gör om de flesta åtgärder: {$commits}, grenar, checkouts, resets, {$stashes}, förkastade ändringar. Den frågar först när det är riskabelt."
refs_1 = "Grenar och {$tags}|Dubbelklicka på en lokal gren eller {$tag} för att checka ut den; högerklicka för dess meny ({$merge}, {$rebase}, byt namn, ta bort...). Ctrl+G b och Ctrl+G t skapar en på den utcheckade {$commit}."
refs_2 = "Solo och dölj|Tangenten o visar bara {$commits} för den valda refen, Shift+O slutar. En refs meny döljer den i grafen; Shift+H visar allt igen. Bara visning: ingenting ändras i repositoryt."
refs_3 = { git = "Fetch, {$pull}, {$push}|Ctrl+G f: fetch från alla remotes. Ctrl+G p: {$pull}. Ctrl+G Shift+P: {$push}. Pilen vid en knapp i verktygsfältet väljer ett annat sätt eller en annan remote.", local = "Hämta, {$pull}, {$push}|Ctrl+G f: hämta från alla remotes. Ctrl+G p: {$pull}. Ctrl+G Shift+P: {$push}. Pilen vid en knapp i verktygsfältet väljer ett annat sätt eller en annan remote." }
refs_4 = "Remotes|+ i rubriken REMOTE lägger till en. Högerklicka på en remote för {$fetch}, kopiera webblänken, redigera URL:erna eller ta bort den."
refs_5 = "{$Stashes} och worktrees|Knapparna {$stash} och Pop; Ctrl+G m frågar först efter ett meddelande. Högerklicka på en {$stash} för att tillämpa eller poppa den. ”Skapa worktree från <namn>...” öppnar en gren i en egen flik."
refs_6 = "Submoduler och LFS|En sektion SUBMODULER visas när repositoryt har några: dubbelklick öppnar en som flik, högerklick uppdaterar den. Git LFS-åtgärder: LFS-knappen eller Ctrl+G l."
hosting_1 = "Anslut|Inställningar > Integrationer: klistra in en personlig token för GitHub eller GitLab. Inget konto behövs; token hamnar i systemets credential helper."
hosting_2 = "Länka ett repository|I sidofältets sektioner {$PRS} och ÄRENDEN väljer du en av leverantörerna som listan föreslår. Inget länkas automatiskt; länken sparas per repository."
hosting_3 = "Skapa en {$pr}|+ i rubriken {$PRS}, eller n i sektionen, öppnar formuläret; en grens meny har ”Starta en {$pr} från <namn>...”. AI kan skriva titel och beskrivning."
hosting_4 = "Ärenden|Sektionen ÄRENDEN listar dem; + eller n skapar ett. En rads meny öppnar ärendet i webbläsaren eller utför en åtgärd på det."
hosting_5 = { git = "Referenser|Referenser till ärenden och {$prs} (#12, !53, ABC-7) i ett {$commit}-meddelande eller ett grennamn känns igen. Alt+R i {$commit}-formuläret infogar en.", local = "Referenser|Referenser till ärenden och {$prs} (#12, !53, ABC-7) i ett incheckningsmeddelande eller ett grennamn känns igen. Alt+R i incheckningsformuläret infogar en." }
hosting_6 = "Chip i verktygsfältet|Till vänster i verktygsfältet visar ett chip {$pr} för den utcheckade grenen (GH #12, GL !53) eller ett nedtonat ”+ {$pr_abbr}” för att starta en. Klicka på det."
hosting_7 = "SSH-nycklar|Välj en SSH-nyckel per profil (Inställningar > Profiler) eller per repository (flikmenyn > ”SSH & inloggning...”). Lösenfraser stannar i systemets ssh-agent."
setup_1 = "Inställningar|Ctrl+, eller kugghjulet. Tab växlar mellan sidlistan och alternativen, j / k flyttar, Enter eller Mellanslag ändrar ett värde, / eller Ctrl+F söker bland alla alternativ, Esc stänger."
setup_2 = "Teman|Inställningar > Utseende > Tema: mörkt, ljust, följ terminalen eller en av många förinställningar. Ctrl+N och sedan en tangent byter också tema, språk och grafens färger utan att öppna Inställningar."
setup_3 = "Språk|Inställningar > Allmänt > Språk erbjuder 17 språk. ”Översätt git-termer” avgör om gits egna ord ({$commit}, {$push}...) också översätts."
setup_4 = { git = "Profiler|Inställningar > Profiler innehåller {$commit}-identiteter (namn, e-post, SSH-nyckel). Profilrutan i verktygsfältet väljer den som det här repositoryt använder.", local = "Profiler|Inställningar > Profiler innehåller incheckningsidentiteter (namn, e-post, SSH-nyckel). Profilrutan i verktygsfältet väljer den som det här repositoryt använder." }
setup_5 = "Öppna i|Knappen Öppna i (Alt+O) öppnar flikens mapp i en terminal, en redigerare eller filhanteraren. Inställningar > Öppna i redigerar listan."
setup_6 = "Tangentbindningar|Inställningar > Tangentbord & mus binder om valfri tangent. Fliken Tangenter i den här hjälpen visar dina egna bindningar."
tools_1 = "AI (valfritt)|Av tills du ställer in det i Inställningar > AI: en OpenAI-kompatibel tjänst, Anthropic eller en lokal agent som claude -p. Inget konto hos GitPoulpi behövs någonsin."
tools_2 = { git = "AI-åtgärder|Gnistknappen bredvid sammanfattningen eller Ctrl+G i skriver ett {$commit}-meddelande; Ctrl+G w förklarar ändringar; Ctrl+G C delar upp ditt arbete i flera {$commits}; Alt+I föreslår en konfliktlösning. Inget tillämpas innan du bekräftar.", local = "AI-åtgärder|Gnistknappen bredvid sammanfattningen eller Ctrl+G i skriver ett incheckningsmeddelande; Ctrl+G w förklarar ändringar; Ctrl+G C delar upp ditt arbete i flera {$commits}; Alt+I föreslår en konfliktlösning. Inget tillämpas innan du bekräftar." }
tools_3 = "CLI|gitpoulpi <kommando> gör från ett skript det som fönstret gör, via samma daemon, så ändringarna syns direkt. --json ger maskinläsbar utdata, --help listar flaggorna."
tools_4 = "MCP|gitpoulpi mcp serve --stdio ger AI-agenter ett verktyg per CLI-kommando. Inställningar > Agenter & MCP väljer vad de får ändra."
tools_5 = "Skalomslag|Med skalomslaget gp lämnar ”Avsluta, cd hit” ditt skal i den aktiva flikens mapp när GitPoulpi avslutas."

