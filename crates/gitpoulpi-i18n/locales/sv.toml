navigation_prefix_then_10 = "avfärda det chipet, annars gå tillbaka till vyn före agentens senaste ändring (även `Agent: Back` i paletten)"
navigation_prefix_then_11 = "avbryt, tillbaka till normalläge"
navigation_prefix_then_12 = "välj ett tema i listan - skriv för att filtrera, markeringen förhandsvisas direkt, Enter använder och sparar, Esc återställer det förra (även `App: Byt tema...` i paletten)"
navigation_prefix_then_13 = "välj ett språk i listan - skriv för att filtrera, Enter använder och sparar det, Esc avbryter (även `App: Byt språk...` i paletten)"
