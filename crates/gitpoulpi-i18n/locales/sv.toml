mouse_basics_3 = "den enda ”det här är klickbart”-signalen de flesta terminaler ger (se ”Hover & tooltips” nedan) - även fullständiga tooltips över Log-celler och avkortade ref-märken"
mouse_basics_4 = { git = "en ruteavdelare, en Log-kolumngräns, ett Refs-avsnitts nederkant eller commit-meddelandeblockets nederkant ändrar storlek (förbi minimum fälls den ihop i stället); en Log-kolumnrubrik dragen förbi en granne ordnar om den", local = "en ruteavdelare, en Log-kolumngräns, ett Refs-avsnitts nederkant eller incheckningsmeddelandeblockets nederkant ändrar storlek (förbi minimum fälls den ihop i stället); en Log-kolumnrubrik dragen förbi en granne ordnar om den" }
mouse_basics_5 = "(övre högra hörnet) avsluta, som q - visas bara när fönstret är bredt nog att inte överlappa titeltexten"
