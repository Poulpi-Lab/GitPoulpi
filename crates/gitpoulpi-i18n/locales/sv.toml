navigation_prefix_then_18 = "flytta avgränsaren mellan Log och högra rutan ett steg åt vänster ({{nav_prefix.status_wider}}) eller höger ({{nav_prefix.status_narrower}}); en hopfälld ruta kommer tillbaka först, och bredden sparas"
navigation_prefix_then_7 = "växla den här hjälpen (som bara ?)"
navigation_prefix_then_8 = "välj en repositoryflik att växla till - skriv för att filtrera, Upp/Ned eller PageUp/PageDown för att flytta, Enter växlar, klicka på en rad, Esc stänger"
