[settings_ssh]
private_key_path = "Sökväg till privat nyckel"
private_key_path_help = "Nyckelfil som {$fetch}, {$pull}, {$push} och clone erbjuder ssh (ssh -i <nyckel> -o IdentitiesOnly=yes). Tom: ssh-agent och din ssh-konfiguration som vanligt. Används inte när ett repository väljer sin egen nyckel (SSH & inloggning) eller när GIT_SSH_COMMAND eller core.sshCommand är satt. Gäller från nästa överföring."
public_key_path = "Sökväg till publik nyckel"
public_key_path_help = "Används bara när sökvägen till den privata nyckeln är tom: ssh väljer då den matchande nyckeln i ssh-agent (eller en hårdvarunyckel) i stället för att erbjuda alla agentens nycklar. Skapa nyckelpar fyller i båda. Samma företräde som sökvägen till den privata nyckeln."
key_type = "Nyckeltyp"
heading_https_credentials = "HTTPS-uppgifter"
https_mode = "HTTPS-uppgifter"
https_mode_help = { git = "Hur fetch, pull, push och clone autentiserar över HTTPS. credential_helper: gits egen helper (Git Credential Manager, libsecret, Keychain). prompt: ignorera alla helpers och låt git fråga i en terminal. none: inga uppgifter alls, bara publika remotes. Gäller nästa överföring.", local = "Hur hämtning, pull, push och clone autentiserar över HTTPS. credential_helper: gits egen helper (Git Credential Manager, libsecret, Keychain). prompt: ignorera alla helpers och låt git fråga i en terminal. none: inga uppgifter alls, bara publika remotes. Gäller nästa överföring." }
heading_keys = "Nycklar"
generate_key_pair = "Generera nyckelpar"
generate_key_pair_help = "Skapar ett ed25519-nyckelpar i processen (utan ssh-keygen, utan lösenfras) som ~/.ssh/gitpoulpi_ed25519, skriver aldrig över en fil och sparar båda sökvägarna ovan. Lägg till den publika nyckeln hos en värd under Integrationer."

[settings_editor]
tab_size = "Tabbstorlek"
tab_size_help = "Kolumner mellan tabbstopp, i den inbyggda redigeraren (ritning, Shift+Tab) och i diff-vyerna. Blame-vyn ritar en tabb som ett mellanslag och ignorerar den."
eol = "Radslut"
eol_help = "Vad den inbyggda redigeraren skriver vid sparande. Auto behåller filens eget radslut (LF för en ny fil); LF eller CRLF konverterar filen vid sparande. Redigerarens statusrad visar vad nästa sparande skriver."
syntax_highlighting = "Syntaxmarkering"
syntax_highlighting_help = "Färglägger den inbyggda redigeraren efter språk. Diff-vyerna och blame-vyn syntaxfärgas inte."
line_numbers = "Radnummer"
line_numbers_help = "Nummerkolumnen i den inbyggda redigeraren och i diff-vyerna (där är den tom, kolumnerna behåller sin plats). Blame-vyn har ingen."
follow_selection = "Följ markeringen i redigeraren"
follow_selection_help = "Medan redigeraren är öppen öppnas en annan fil som markeras i högerpanelen även i redigeraren, efter att du fått frågan om osparade ändringar ska sparas. En fil som inte kan redigeras öppnas i sin vanliga vy."
merge_side_by_side_min_width = { git = "Merge-redigerare: sida vid sida från (kolumner)", local = "Konfliktredigerare: sida vid sida från (kolumner)" }
merge_side_by_side_min_width_help = { git = "Merge-redigeraren visar A och B sida vid sida när dess yta är minst så många kolumner bred (långa rader rullas i sidled med Shift+hjul eller Shift+piltangenter); smalare visas en sida i taget bakom flikar. 100 som standard; 40 är lägsta värde, 0 betyder alltid sida vid sida. Redigeraren döljer panelerna Refs och Status medan den är öppen, så den har oftast hela fönstret.", local = "Konfliktredigeraren visar A och B sida vid sida när dess yta är minst så många kolumner bred (långa rader rullas i sidled med Shift+hjul eller Shift+piltangenter); smalare visas en sida i taget bakom flikar. 100 som standard; 40 är lägsta värde, 0 betyder alltid sida vid sida. Redigeraren döljer panelerna Refs och Status medan den är öppen, så den har oftast hela fönstret." }
diff_word_wrap = "Radbrytning"
diff_word_wrap_help = "Bryter långa rader i diff-vyerna i stället för att kapa dem med ellips. Den inbyggda redigeraren och blame-vyn rullar i sidled och bryter inte. Även diff-vyns egen brytningsknapp."

[settings_ui]
theme = "Tema"
theme_help = "Färger för hela gränssnittet. När du går i listan förhandsvisas varje tema; Enter behåller det, Esc går tillbaka. System följer terminalen (dess ljusa eller mörka bakgrund, avläst en gång vid start; Mörkt om den inte går att avgöra). Dina egna temafiler i mappen themes/ i konfigurationen står sist."
theme_system = "System (följer terminalen)"
follow_theme = "Följ temat"
theme_swatches = "Färger"
graph_lane_background = "Bakgrund för grafspår"
graph_lane_background_help = { git = "Av: transparent, inget bakom spåren (standard). Row tint: ett svagt band i commitens spårfärg inom grafkolumnen, plus en tunn stapel i samma färg vid kolumnens högra kant. Ett lagrat spår läses som Row tint. Gäller när Inställningar stängs.", local = "Av: transparent, inget bakom spåren (standard). Row tint: ett svagt band i incheckningens spårfärg inom grafkolumnen, plus en tunn stapel i samma färg vid kolumnens högra kant. Ett lagrat spår läses som Row tint. Gäller när Inställningar stängs." }
graph_row_tint_strength = "Styrka på radfärgning"
graph_row_tint_strength_help = "Hur blekt Row tint-bandet är: Stark (originalet), Medel (standard) eller Svag. Bara bandet bleknar; stapeln vid kolumnens högra kant behåller sin fulla färg. Gäller när Inställningar stängs."
graph_row_tint_strength_coming = "ställ först in Bakgrund för grafspår på Row tint"
toolbar_position = "Verktygsfältets position"
toolbar_position_help = "Var verktygsfältet sitter: Överst, Nederst (standard), Vänster eller Höger. Vänster och Höger gör det till en kolumn bredvid panelerna; i ett fönster smalare än 80 kolumner ritas det nederst. Gäller direkt."
toolbar_align = "Justering av verktygsfältets knappar"
toolbar_align_help = "Var knapparna sitter längs fältet: Början (standard), Mitten eller Slutet. Början är vänster i en rad och överst i en kolumn; slutet är höger och nederst. Gäller direkt."
# context: label of the setting that decides whether a dialog the user moved or resized keeps its place
dialog_geometry = "Kom ihåg dialogrutans position och storlek"
dialog_geometry_help = "En inställning för alla dialogrutor. Dialogrutor kan flyttas (dra i titelraden, eller Ctrl+N och sedan m); de större fönstren kan också ändras i storlek (dra i kanterna och de nedre hörnen). Varje dialogruta kommer ihåg sin egen plats och storlek. Under den här sessionen (standard): behålls tills GitPoulpi stängs. Sparat på disk: behålls även till nästa start. Aldrig: varje dialogruta öppnas på sin standardplats och i sin standardstorlek. Gäller direkt."
toolbar_pr_pinned = { git = "Fäst {$pr}-knappen i slutet", local = "Fäst {$pr_abbr}-knappen i slutet" }
toolbar_pr_pinned_help = { git = "På (standard): {$pr}-knappen sitter längst bort i verktygsfältet (höger, i en kolumn nederst) oavsett justering. Av: den flödar med de andra knapparna och justeras med dem. Gäller direkt.", local = "På (standard): {$pr_abbr}-knappen sitter längst bort i verktygsfältet (höger, i en kolumn nederst) oavsett justering. Av: den flödar med de andra knapparna och justeras med dem. Gäller direkt." }
statusbar_position = "Statusradens position"
statusbar_position_help = "Var statusraden (gren, antal, meddelanden, tangenttips) sitter: Överst, ovanför repositoryfliken, eller Nederst (standard). Fliken Hem behåller sin egen statusrad nederst. Gäller direkt."
tabs_position = "Flikradens position"
tabs_position_help = "Var repositorieflikarna sitter: Överst (standard), Nederst eller Vänster, en lista med en flik per rad vid fönstrets vänsterkant. I ett fönster smalare än 80 kolumner ritas de överst. Bredvid ett verktygsfält som kolumn ligger flikarna ytterst. Gäller direkt."
graph_color_theme = "Färgtema för grafen"
graph_color_theme_help = "Spårfärgpaletten i Log-grafen. Följ temat använder det valda temats palett; alla andra val åsidosätter den, så vilket tema som helst kan kombineras med vilken palett som helst. Gäller när inställningarna stängs."
graph_renderer = "Grafritare"
graph_renderer_help = "auto ritar grafen som en riktig bild i en terminal som stöder det, och som tecken överallt annars - även inuti tmux eller zellij, som ärver terminalens miljö men inte släpper igenom bilden, och inuti herdr om inte dess kitty_graphics-inställning är på. image tvingar bilden på, text tvingar av den. Kräver omstart."
image_protocol = "Bildprotokoll"
image_protocol_help = "Hur bilder (grafbilden, författaravatarer) når terminalen. auto: Kitty-grafikprotokollet i kitty, Ghostty och en herdr vars konfiguration sätter kitty_graphics = true; iTerm2 inline-bilder i WezTerm, iTerm2 och mintty; sixel-bilder (bara författaravatarer, grafen förblir tecken) i Windows Terminal, foot, Konsole och mlterm; tecken annars. kitty, iterm2 eller sixel tvingar det protokollet (kitty för en herdr vars konfiguration finns någon annanstans; sixel för en terminal som ritar det men inte känns igen); none stänger av bilder. Kräver omstart."
kitty_keyboard = "Kitty-tangentbordsprotokoll"
kitty_keyboard_help = "auto frågar terminalen, vid start och inom cirka 100 ms, om den talar kitty-tangentbordsprotokollet, och använder det när den gör det: tangentkombinationer som äldre terminaler inte kan skilja åt (Control med skiljetecken, siffror, Shift eller Enter) kommer då fram som sig själva i stället för att kollidera med styrkoder. En terminal som inte svarar behåller de äldre tangenterna. off rör aldrig terminalens tangentbordsläge. Kräver omstart."
color_depth = "Färgdjup"
color_depth_help = "auto använder 24-bitarsfärg, utom i terminaler som inte visar den (Apple Terminal, Linux-konsolen eller en 256-färgsterminal utan COLORTERM), där färgerna mappas till närmaste av 256 eller 16 poster. truecolor, 256 och 16 tvingar ett djup. Gäller direkt."
text_cursor = "Text cursor"
text_cursor_help = "terminal puts the terminal's own cursor at the caret of the focused text field, as a bar: your terminal's cursor settings apply and an input method's candidate window opens at the caret. drawn paints GitPoulpi's own caret (a block or an underscore) and keeps the terminal cursor hidden. Applies at once."
graph_show_stashes = "Visa stashes i grafen"
graph_show_stashes_help = { git = "Varje stash får en egen rad i Log, vid sitt datum: en liten ruta på ett spår bredvid commiten den gjordes på, förbunden med den av en streckad linje. Att markera den visar vad den ändrade; högerklick (eller .) erbjuder Pop, Apply och Drop. Av håller stashes bara i avsnittet STASHES. Ritas inte vid solo.", local = "Varje stash får en egen rad i Log, vid sitt datum: en liten ruta på ett spår bredvid incheckningen den gjordes på, förbunden med den av en streckad linje. Att markera den visar vad den ändrade; högerklick (eller .) erbjuder Pop, Apply och Drop. Av håller stashes bara i avsnittet STASHES. Ritas inte vid solo." }
ref_connector = { git = "Koppling mellan ref och commit", local = "Koppling mellan ref och incheckning" }
ref_connector_help = { git = "En tunn linje från varje ref-pill i Ref-kolumnen till commitens cirkel i grafen. Den fyller bara tomt utrymme: spår den passerar ligger kvar överst och inget flyttas. Ritas bara när Ref-kolumnen är omedelbart till vänster om Graf-kolumnen.", local = "En tunn linje från varje ref-pill i Ref-kolumnen till incheckningens cirkel i grafen. Den fyller bara tomt utrymme: spår den passerar ligger kvar överst och inget flyttas. Ritas bara när Ref-kolumnen är omedelbart till vänster om Graf-kolumnen." }
log_wip_counts_in_message = "Visa WIP-antal i meddelandet när kolumnen Ändringar är dold"
log_wip_counts_in_message_help = { git = "WIP-raden visar hur många filer som är ändrade, tillagda och borttagna. När kolumnen Ändringar syns (högerklicka på Log-huvudet för att visa den) hamnar antalen alltid där, som för varje commit. När den är dold följer de med WIP-meddelandet så länge detta är på; av visar inga antal alls.", local = "WIP-raden visar hur många filer som är ändrade, tillagda och borttagna. När kolumnen Ändringar syns (högerklicka på Log-huvudet för att visa den) hamnar antalen alltid där, som för varje incheckning. När den är dold följer de med WIP-meddelandet så länge detta är på; av visar inga antal alls." }
avatars = "Författaravatarer"
avatars_help = { git = "Författarbilder. graph ritar varje commits författare inuti dess cirkel i grafen (bara bildgrafen; med textgrafen visas en färgad initial i kolumnen Författare i stället). author sätter en rund bild i början av kolumnen Författare. Båda visar den även i commit-detaljrutan. Av som standard: att slå på det skickar en SHA-256-hash av varje författares e-postadress till gravatar.com över HTTPS - en hash av en känd eller gissningsbar adress är inte anonym - och, i ett repository med en github.com-remote, frågar GitHub-API:t en gång per författare vilket konto som gjorde en av deras commits (med din GitHub-integrations token när det finns en). Tills en bild kommer, och när ingen finns, visas initialerna eller den enkla cirkeln. off skickar inget över nätverket.", local = "Författarbilder. graph ritar varje inchecknings författare inuti dess cirkel i grafen (bara bildgrafen; med textgrafen visas en färgad initial i kolumnen Författare i stället). author sätter en rund bild i början av kolumnen Författare. Båda visar den även i incheckningsdetaljrutan. Av som standard: att slå på det skickar en SHA-256-hash av varje författares e-postadress till gravatar.com över HTTPS - en hash av en känd eller gissningsbar adress är inte anonym - och, i ett repository med en github.com-remote, frågar GitHub-API:t en gång per författare vilket konto som gjorde en av deras incheckningar (med din GitHub-integrations token när det finns en). Tills en bild kommer, och när ingen finns, visas initialerna eller den enkla cirkeln. off skickar inget över nätverket." }
avatar_sources = "Avatarkällor"
avatar_sources_help = { git = "Var en författares bild slås upp, i ordning (en GitHub noreply-adress namnger alltid sitt konto först). hosting_gravatar: den anslutna GitHub-, GitLab- eller Bitbucket-integration vars värd matchar repositoryts remote (GitHub-commit-författare eller användarsökning, GitLab avatar-via-e-post eller users-API), sedan Gravatar; utan matchande ansluten integration kommer Gravatar först och en github.com-remote frågas ändå sist, oautentiserat. gravatar_hosting: omvänt. gravatar eller hosting: bara den. När ingen har en bild ritas avatarreserven nedan. Gäller författare som inte slagits upp ännu.", local = "Var en författares bild slås upp, i ordning (en GitHub noreply-adress namnger alltid sitt konto först). hosting_gravatar: den anslutna GitHub-, GitLab- eller Bitbucket-integration vars värd matchar repositoryts remote (GitHub-incheckningsförfattare eller användarsökning, GitLab avatar-via-e-post eller users-API), sedan Gravatar; utan matchande ansluten integration kommer Gravatar först och en github.com-remote frågas ändå sist, oautentiserat. gravatar_hosting: omvänt. gravatar eller hosting: bara den. När ingen har en bild ritas avatarreserven nedan. Gäller författare som inte slagits upp ännu." }
avatar_fallback = "Avatarreserv"
avatar_fallback_help = "Vad en författare utan bild får. identicon: ett spegelvänt 5x5-mönster i GitHub-stil i en färg härledd från e-postadressen, genererat lokalt (inget nätverk), som bild på en bildterminal och som blocktecken annars. initials: ett färgat märke med initialerna."
composer_files = "Composer-förslag"
composer_files_help = { git = "Hur AI-commit-composerns granskning öppnas. expanded: varje föreslagen commit listar sina filer. collapsed: bara commit-raderna; Höger/Vänster (eller ett klick på pilen) öppnar en.", local = "Hur AI-incheckningscomposerns granskning öppnas. expanded: varje föreslagen incheckning listar sina filer. collapsed: bara incheckningsraderna; Höger/Vänster (eller ett klick på pilen) öppnar en." }
blame_side = "Blame-annoteringar"
blame_side_help = "Vilken sida av Blame-vyn annoteringskolumnen (avatar, författare, ålder, sammanfattning) ligger på. right: till höger om koden. left: till vänster om koden."
column_resize = "Kolumnstorlek"
column_resize_help = "Hur en kolumngräns greppas i Log, Radar och sidokolumnen i filvyerna. line: en tunn linje över tabellens hela höjd medan pekaren står på gränsen, med en liten markering i rubriken. header: inget mellanrum och ingen markering, storleken ändras bara från rubriken, där första tecknet i nästa cell lyses upp."
blame_width = "Bredd på blame-annoteringar"
blame_width_help = "Annoteringskolumnens bredd i celler (24 till 90). Dra i kanten i Blame-vyn eller använd tangenterna för bredda / smalna av; den nya bredden sparas här."
ref_tree = "Mappträd för grenar"
ref_tree_help = "Refs-sidopanelen grupperar grennamn på `/` i hopfällbara mappar, med varje remote som en egen toppnivånod. Av ger en platt rad per gren. `y` i Refs-rutan växlar det direkt och sparar valet här."
reveal_on_ref_click = "Klick på en ref visar den i grafen"
reveal_on_ref_click_help = "Ett enkelt klick på en ref i Refs-panelen rullar Log till dit refen pekar och blinkar till på raden. Markeringen i Log och högerpanelen ändras inte. Av markerar ett klick bara raden i sidofältet. ”Visa i grafen” i refens meny, dess tangent i Refs-panelen och palettkommandot fungerar i båda fallen."
graph_ghost_ref = "Visa en spökgren vid {$commit} under muspekaren"
graph_ghost_ref_help = "I Log-vyns Ref-kolumn visar en {$commit} under muspekaren som saknar egen ref en blekt pill med namnet på grenen den tillhör (annars remote-grenen), härlett ur historiken. Pekar du på pillen visas dess typ. Ett klick gör inget särskilt; kommandot för att skapa en gren skapar en gren. Ritas bara där Ref-kolumnen har plats. Av döljer den."
mouse_enabled = "Mus aktiverad"
mouse_enabled_help = "Av lämnar markering med dra-och-släpp åt din terminal. Kräver omstart."
mouse_scroll_lines = "Rader per musskroll"
mouse_scroll_lines_help = { git = "Hur många commits ett hjulsteg flyttar i Log. Kräver omstart.", local = "Hur många incheckningar ett hjulsteg flyttar i Log. Kräver omstart." }
heading_date_time = "Datum och tid"
heading_layout = "Layout"
date_locale = "Språk för datum/tid"
date_locale_help = "system: månads- och dagsnamn följer gränssnittets språk. english: alltid engelska namn, oavsett språk. Gäller alla datum på den här sidan."
diff_layout = "Standardlayout"
diff_layout_help = "Inline (en kolumn) eller Split (före och efter sida vid sida). Återupptas från den senaste diffen du tittade på, i det här fönstret och över omstarter - att ändra den här ställer bara in vad en *ny* session startar från."
diff_hunks_only = "Bara hunks"
diff_hunks_only_help = "På visar bara de ändrade hunkarna med några rader sammanhang; av visar hela filen med ändringarna markerade på plats. Återupptas som layouten."
diff_show_whitespace = "Visa ändringar som bara rör blanksteg"
diff_show_whitespace_help = "Av komprimerar en hunk som bara skiljer sig i blanksteg till sammanhang."
input_color = "Inmatningsfärg"
input_color_help = "Bakgrund för textfält. Följ temat (standard) använder temats egen; de andra är mörka färger som åsidosätter den. Egen... använder hex-färgen nedan. Gäller direkt, ingen omstart."
input_color_custom = "Egen inmatningsfärg"
input_color_custom_help = "#rrggbb, används när Inmatningsfärg är Egen. Gäller direkt."
minimap = "Minikarta"
minimap_help = "En bild av hela filen bredvid diffens vertikala rullningslist (helfilsläge) och redigeraren, med den synliga delen markerad; klicka på den för att hoppa. En riktig bild där terminalen ritar sådana, braille-celler annars. Även `M` i diffen och palettens Växla minikarta."
date_format = "Datumformat"
date_format_help = "Datumkolumnen i Blame / Filhistorik."
date_time_format = "Datum-/tidsformat"
date_time_format_help = "Själva Datum-kolumnen i Log."
date_verbose_format = "Utförligt datumformat"
date_verbose_format_help = { git = "Datumraden i commit-detaljpanelen, Datum-kolumnens hover-tooltip och Kopiera > Datum.", local = "Datumraden i incheckningsdetaljpanelen, Datum-kolumnens hover-tooltip och Kopiera > Datum." }
preview = "förhandsvisning"
sidebar_sections_scope = "Avsnitt i sidopanelen"
sidebar_sections_scope_help = "Vems val de visade och dolda avsnitten i sidopanelen är. Per repository: varje repository har sin egen uppsättning (den globala är utgångspunkten). Global: en uppsättning för alla repositories. Att växla förlorar aldrig någon av uppsättningarna."
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "Kolumnlayout"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "Hur Log lägger ut sina kolumner. fit: varje kolumn ryms i rutan och bara Meddelande är flexibel. scroll: kolumnerna behåller sina bredder, Meddelande också, och tabellen rullar i sidled när den är bredare än rutan."

[settings_git]
default_backend = "Git-backend"
default_backend_help = "Global. En körande daemon behåller den backend den startade med."
default_backend_warning = "Gäller för daemons som startas efter den här ändringen."
pull_mode = "Pull-knapp"
default_encoding = "Standardkodning"
default_encoding_help = "Används för att visa filinnehåll, blame och diffar som inte är giltig UTF-8 (giltig UTF-8 avkodas aldrig om). Ett repository kan åsidosätta den nedan. Bara visning: staging och patchar behåller filens byte exakt."
push_behavior = "Push-knapp"
push_behavior_help = "direct: push till standard-remote direkt. ask: öppna en liten meny med standard-remote förvald. Knappens ▾ frågar alltid."
repo_encoding_help = "Hur filinnehåll, blame och diffar avkodas för visning när de inte är giltig UTF-8 (bara det här repositoryt; inherited: Standardkodning på den här sidan). Staging omkodar aldrig något."
core_autocrlf_help = "Skrivs till det här repositoryts git-konfiguration (core.autocrlf), så git och alla andra verktyg ser den. true: LF till CRLF vid checkout; input: CRLF till LF bara vid sparande i historiken; false: konvertera aldrig. (ärvd): tar bort repositoryts värde så att din globala git-konfiguration gäller. Kan ångras."
core_eol_help = "Skrivs till det här repositoryts git-konfiguration (core.eol): den radbrytning git använder för textfiler i arbetskatalogen (lf, crlf eller native för plattformens egen). (ärvd): tar bort repositoryts värde så att din globala git-konfiguration gäller. Kan ångras."
git_lfs = "Git LFS"
git_lfs_help = "Visa Git LFS i gränssnittet (LFS-taggen, diff-kortet, bannern för saknat program, LFS-kommandona) och låt GitPoulpi köra sina egna LFS-steg (ladda ned objekt efter en clone). Av: gits egna LFS-filter körs ändå, GitPoulpi anropar aldrig git-lfs själv."
git_lfs_program = "Programmet git-lfs"
git_lfs_program_help = "Installera det från https://git-lfs.com (Windows: ingår i Git for Windows, eller `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Palett: LFS: Öppna installationssidan."
initialize_lfs_for_this_repository = "Initiera LFS för det här repositoryt"
initialize_lfs_for_this_repository_help = "Kör `git lfs install --local`: LFS-filtren och hookarna i det här repositoryts egen konfiguration, aldrig din globala. Kräver git-lfs."
pull_mode_help = { git = "Vad verktygsfältets {$Pull}{hint} gör: merge (fast-forward om möjligt), ff_only eller rebase. Knappens ▾-alternativ kör sin egen åtgärd direkt och ändrar inte detta.", local = "Vad verktygsfältets {$Pull}{hint} gör: sammanslagning (fast-forward om möjligt), ff_only eller rebase. Knappens ▾-alternativ kör sin egen åtgärd direkt och ändrar inte detta." }
merge_fast_forward = "Fast-forward vid {$merge}"
merge_fast_forward_help = { git = "Hur en merge du startar (grenmenyn, dra och släpp, paletten, kommandoraden) behandlar en gren som enkelt kan fast-forwardas. never: gör alltid en merge-commit. allowed: fast-forward när det går, som git gör som standard. only: bara fast-forward, eller avvisa när det inte går. Ett repository kan åsidosätta det på sin sida Alternativ för merge.", local = "Hur en sammanslagning du startar (grenmenyn, dra och släpp, paletten, kommandoraden) behandlar en gren som enkelt kan fast-forwardas. never: gör alltid en sammanslagningsincheckning. allowed: fast-forward när det går, som git gör som standard. only: bara fast-forward, eller avvisa när det inte går. Ett repository kan åsidosätta det på sin sida Alternativ för sammanslagning." }
repo_heading = "Repo: {repo} - bara det här repositoryt"
inherited = "(ärvd)"
lfs_not_checked = "(inte kontrollerad ännu)"
lfs_autofix_filters = "Installera LFS-filter före {$pull} och {$push}"
lfs_autofix_filters_help = "Före en {$pull} eller {$push} i ett repository som använder Git LFS körs `git lfs install --local` om dess LFS-filter eller hooks saknas (repositoryts egen konfiguration, aldrig den globala), så att överföringen hanterar de stora filerna. Statusraden meddelar det. Kräver git-lfs."

