[_meta]
language_name = "Svenska"

# `git`: engelskt vokabulär (standard). `local`: svenskt git-vokabulär
# (inställningen ”Översätt git-termer”), enligt git-l10n där den finns (se
# docs/developer/l10n/sv.md). Grundform, så att {$Term} mitt i en mening blir
# rätt; verb och bestämd form skrivs som { git, local }-par.
[term]
commit = { git = "commit", local = "incheckning" }
commits = { git = "commits", local = "incheckningar" }
push = { git = "push", local = "push" }
pull = { git = "pull", local = "pull" }
fetch = { git = "fetch", local = "hämtning" }
merge = { git = "merge", local = "sammanslagning" }
rebase = { git = "rebase", local = "rebase" }
cherry_pick = { git = "cherry-pick", local = "cherry-pick" }
stash = { git = "stash", local = "stash" }
stashes = { git = "stashes", local = "stashes" }
pop = { git = "pop", local = "poppa" }
apply = { git = "apply", local = "tillämpa" }
stash_drop = { git = "drop", local = "droppa" }
tag = { git = "tag", local = "tagg" }
tags = { git = "tags", local = "taggar" }
head = { git = "HEAD", local = "HEAD" }
diff = { git = "diff", local = "diff" }
pr = { git = { pull = "pull request", merge = "merge request" }, local = { pull = "pull request", merge = "merge request" } }
