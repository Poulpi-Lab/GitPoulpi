pick = { git = "pick", local = "plocka" }
reword = { git = "reword", local = "skriv om" }
squash = { git = "squash", local = "slå ihop" }
fixup = { git = "fixup", local = "rätta" }
drop = { git = "drop", local = "ta bort" }
edit = { git = "edit", local = "redigera" }
stage = { git = "stage", local = "stage" }
unstage = { git = "unstage", local = "unstage" }
staged = { git = "staged", local = "staged" }
unstaged = { git = "unstaged", local = "unstaged" }
staged_files = { git = "Staged-filer", local = "Staged-filer" }
unstaged_files = { git = "Unstaged-filer", local = "Unstaged-filer" }
push_noun = { git = "push", local = "push" }
