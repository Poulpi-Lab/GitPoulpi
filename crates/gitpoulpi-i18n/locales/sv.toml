navigation_prefix_then_4 = { git = "förstora commit-meddelandeblocket i högra panelen med en rad ({{nav_prefix.shrink_message}} förminskar det); dra kanten under det för musekvivalenten", local = "förstora incheckningsmeddelandeblocket i högra panelen med en rad ({{nav_prefix.shrink_message}} förminskar det); dra kanten under det för musekvivalenten" }
