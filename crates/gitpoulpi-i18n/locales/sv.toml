navigation_prefix_then_15 = "`App: Växla radfärgning i grafen`"
navigation_prefix_then_19 = "ordna den öppna dialogrutan med tangentbordet: piltangenterna flyttar den, Shift+pilar ändrar storleken, 0 sätter tillbaka den, Enter lämnar läget (tvillingen till att dra i titelraden och kanterna; även `Dialogruta: Flytta/ändra storlek` i paletten)"
git_actions_then_1 = "stage den valda unstaged filen (Status-rutan)"
git_actions_then_2 = "unstage den valda staged filen (Status-rutan)"
git_actions_then_3 = "stage alla ändringar"
git_actions_then_4 = "förkasta alla ändringar (bekräftas; ospårade filer ingår, det står i bekräftelsen)"
