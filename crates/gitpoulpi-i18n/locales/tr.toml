diff_layout = "Varsayılan yerleşim"
diff_layout_help = { git = "Satır içi (tek sütun) veya Bölünmüş (önce ve sonra yan yana). En son baktığınız diff'teki seçimle devam eder, pencere içinde ve yeniden başlatmalar arasında; buradan değiştirmek yalnızca *yeni* bir oturumun neyle başlayacağını belirler.", local = "Satır içi (tek sütun) veya Bölünmüş (önce ve sonra yan yana). En son baktığınız farktaki seçimle devam eder, pencere içinde ve yeniden başlatmalar arasında; buradan değiştirmek yalnızca *yeni* bir oturumun neyle başlayacağını belirler." }
