fixup = { git = "Fixup", local = "Düzelt" }
drop = { git = "Drop", local = "At" }
edit = { git = "Edit", local = "Düzenle" }
stage = { git = "stage'le", local = "hazırla" }
unstage = { git = "unstage'le", local = "hazırlıktan çıkar" }
