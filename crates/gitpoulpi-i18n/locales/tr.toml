[_meta]
language_name = "Türkçe"

# `git`: İngilizce kelime dağarcığı (varsayılan). `local`: Türkçe git
# kelimeleri ("Git terimlerini çevir" ayarı). Ekler terime bağlı olduğundan
# cümleler terimi, ek almayacak biçimde ("{$Pull}: ...") yerleştirir.
[term]
commit = { git = "Commit", local = "Commit" }
commits = { git = "Commit'ler", local = "Commit'ler" }
push = { git = "Push", local = "Gönder" }
pull = { git = "Pull", local = "Çek" }
fetch = { git = "Fetch", local = "Getir" }
merge = { git = "Merge", local = "Birleştirme" }
rebase = { git = "Rebase", local = "Rebase" }
cherry_pick = { git = "Cherry-pick", local = "Cherry-pick" }
stash = { git = "Stash", local = "Saklama" }
stashes = { git = "Stash'ler", local = "Saklamalar" }
pop = { git = "Pop", local = "geri yükle ve kaldır" }
apply = { git = "Apply", local = "uygula" }
stash_drop = { git = "Drop", local = "at" }
tag = { git = "Tag", local = "Etiket" }
tags = { git = "Tag'ler", local = "Etiketler" }
head = { git = "HEAD", local = "HEAD" }
diff = { git = "Diff", local = "Fark" }
