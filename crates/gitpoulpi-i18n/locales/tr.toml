# context: detail combobox row: adds branch names, tags and the HEAD mark
detail_refs = "Refs: + dal adları, {$tags}, {$head}"
# context: detail combobox row: adds the commit subject to each commit id
detail_subjects = "Başlıklar: + {$commit} başlıkları"
# context: detail combobox row: adds author and date to each commit id
detail_full = "Tam: + yazar ve tarih"
# context: direction combobox row
orientation_lr = "Soldan sağa"
# context: direction combobox row
orientation_tb = "Yukarıdan aşağıya"
# context: checkbox: wrap the script in a Markdown code fence (keep the three backticks and the word mermaid)
fence = "```mermaid çitini ekle"
# context: title of the scrollable box that shows the generated text. Width budget: 20 cells
preview = "Önizleme"
