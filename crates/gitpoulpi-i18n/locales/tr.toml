[help_tabs]
tab_keys = "Tuşlar"
tab_start = "Başlangıç"
tab_log = "Log"
tab_changes = "Değişim"
tab_refs = "Refs"
tab_hosting = "Barındırma"
tab_setup = "Ayarlar"
tab_tools = "YZ ve CLI"
title = "Yardım - filtrelemek için yazın, Tab sekme değiştirir, ? kapatır"
title_filtered = "Yardım - filtre \"{filter}\" - Esc temizler, ? kapatır"
hint = "Tab/Shift+Tab, ←/→ veya Alt+1..8: sekmeler - ↑/↓, PgUp/PgDn kaydırır"
start_1 = "Pencere|Üstte sekmeler (Ana klasör depoları listeler, açar ve klonlar), sonra araç çubuğu, solda Refs kenar çubuğu, ortada Log, sağda değişiklikler ve {$commit} formu."
start_2 = "Komut paleti|Ctrl+P her eylemi kısayoluyla listeler. Aramak için yazın, Enter çalıştırır. Fare ne yapıyorsa palet de yapar."
start_3 = "Kısayol önekleri|Ctrl+G ve ardından bir tuş git eylemi çalıştırır ({$stage}, {$commit}, {$pull}, {$push}...). Ctrl+N ve ardından bir tuş dolaşır ya da görünümü değiştirir. Durum çubuğu seçenekleri listeler."
start_4 = "Sekmeler|Depo başına bir sekme. Ctrl+PgUp / Ctrl+PgDn geçiş yapar, Ctrl+W kapatır, t sekme seçiciyi açar, bir sekmeye sağ tık veya Ctrl+T menüsünü açar."
start_5 = "Fare ve tuşlar|Tık seçer, çift tık açar veya checkout yapar, sağ tık (veya .) menü açar, sürükleme ref'leri ve {$rebase} satırlarını taşır. Her fare eyleminin bir tuşu vardır."
start_6 = "Yenile ve geri al|r yeniler, F5 her şeyi yeniden yükler, Ctrl+Z / Ctrl+Y son işlemi geri alır ve yineler, q çıkar."
log_1 = "Grafiği okuma|{$commit} başına bir satır, dal başına bir şerit. İlk satır kaydedilmemiş çalışmanızdır (WIP): değişiklikleri görmek için seçin. Ayrıntılar için bir satıra tıklayın, sağda görünür."
log_2 = "Arama|f (veya Ara düğmesi) bir mesajla, yazarla, hash veya ref'le eşleşmeyen satırları soluklaştırır. Enter / Shift+Enter sonraki / önceki eşleşmeye atlar. / Refs kenar çubuğunu süzer."
log_3 = "{$Commit} menüsü|Bir {$commit} üzerinde sağ tık veya . : {$cherry_pick}, revert, reset, mesajı düzenle, dal veya {$tag} oluştur, checkout, worktree, yama, kopyala."
log_4 = "Etkileşimli {$rebase}|{$commit} menüsünde \"Buradan etkileşimli {$rebase}...\": her {$commit} için {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} veya {$edit} seçin, Ctrl+Yukarı/Aşağı ile sıralayın, Ctrl+S ile başlatın, Esc ile çıkın."
log_5 = "Birden çok {$commit}|Ctrl+tık bir {$commit} seçimini değiştirir, Shift+tık (Alt+tık) aralık seçer, Space geçerli olanı değiştirir, Esc temizler. Sonra tüm seçimde {$cherry_pick} veya revert için sağ tıklayın."
log_6 = { git = "Ref'leri sürükleme|Bir dalı başka bir dalın üstüne sürükleyip bırakarak merge, rebase veya fast-forward yapın; uzak bir dala bırakarak push edin. Bırakınca menüden seçin, Esc iptal eder. Klavye: palet, \"Refs: Seçili ref'i bırak...\".", local = "Ref'leri sürükleme|Bir dalı başka bir dalın üstüne sürükleyip bırakarak birleştirin, rebase veya fast-forward yapın; uzak bir dala bırakarak gönderin. Bırakınca menüden seçin, Esc iptal eder. Klavye: palet, \"Refs: Seçili ref'i bırak...\"." }
changes_1 = "Çalışma değişiklikleri|İlk Log satırını (WIP) seçin: {$unstaged} ve {$staged} dosyalar sağda görünür. m yol / ağaç arasında geçer, a tüm dosyaları gösterir, z klasörleri daraltır."
changes_2 = "{$Stage} ve {$unstage}|Dosyada Ctrl+Boşluk, düğmesi veya Ctrl+G s; hepsi için Ctrl+G a, {$unstage} için Ctrl+G u. Dosyaya sağ tık: at, geçmişine veya blame'e bak, düzenleyicide aç."
changes_3 = "{$Diff} okuma|Bir dosyaya tıklayın veya d'ye basın. m satır içi / bölünmüş arasında geçer, w satırları sarar, s boşlukları yok sayar, n / p bloklar arasında atlar, Esc veya q Log'a döner."
changes_4 = "Bloklar ve satırlar|Bir {$diff} içinde: Boşluk = bloğu {$stage}, v sonra j / k sonra Enter = seçili satırları {$stage}, x = bloğu at. Atma önce sorar; Ctrl+Z geri getirir."
changes_5 = "{$Commit} yazma|Bir özet ve açıklama yazın, sonra Ctrl+Enter veya yeşil düğme. Shift+A son {$commit}'i düzeltir. Ctrl+G c imleci forma taşır, Esc formdan çıkar."
changes_6 = "{$Merge} çakışmaları|Bir şerit \"Çakışmaları çöz...\" önerir. {$merge} düzenleyicisinde her çakışma için A, B veya ikisini seçin (a / b / c), Çıktıyı düzenleyin, kaydedin, sonra Devam."
changes_7 = "Geri al ve yinele|Ctrl+Z / Ctrl+Y veya araç çubuğu düğmeleri çoğu işlemi geri alır ve yineler: {$commits}, dallar, checkout'lar, reset'ler, {$stashes}, atmalar. Riskliyse önce sorar."
refs_1 = "Dallar ve {$tags}|Yerel dala veya {$tag} üzerine çift tık checkout yapar; sağ tık menüyü açar ({$merge}, {$rebase}, yeniden adlandır, sil...). Ctrl+G b ve Ctrl+G t geçerli {$commit} üzerinde bir tane oluşturur."
refs_2 = "Solo ve gizle|o tuşu yalnızca seçili ref'in {$commits} öğelerini gösterir, Shift+O durdurur. Bir ref'in menüsü onu grafikten gizler; Shift+H hepsini yeniden gösterir. Yalnızca görünüm: depo değişmez."
refs_3 = "{$Fetch}, {$pull}, {$push}|Ctrl+G f: tüm uzak depolara {$fetch}. Ctrl+G p: {$pull}. Ctrl+G Shift+P: {$push}. Bir düğmenin yanındaki ok başka bir yolu veya başka bir uzağı seçer."
refs_4 = "Uzak depolar|UZAK başlığındaki + bir tane ekler. Bir uzak depoya sağ tıklayın: {$fetch}, web bağlantısını kopyala, URL'lerini düzenle veya kaldır."
refs_5 = "{$Stashes} ve worktree'ler|{$stash} ve Pop düğmeleri; Ctrl+G m önce mesaj sorar. Uygulamak veya çıkarmak için bir {$stash} üzerine sağ tıklayın. \"Şuradan worktree oluştur...\" bir dalı kendi sekmesinde açar."
refs_6 = "Alt modüller ve LFS|Alt modül varsa ALT MODÜLLER bölümü görünür: çift tık birini sekme olarak açar, sağ tık günceller. Git LFS eylemleri: LFS düğmesi veya Ctrl+G l."
hosting_1 = "Bağlan|Ayarlar > Entegrasyonlar: GitHub veya GitLab için kişisel bir token yapıştırın. Hesap gerekmez; token sisteminizin kimlik bilgisi yardımcısına gider."
hosting_2 = "Depoyu bağla|Kenar çubuğunun {$PRS} ve ISSUE'LAR bölümlerinde listenin önerdiği sağlayıcılardan birini seçin. Hiçbir şey kendiliğinden bağlanmaz; bağlantı depo başına saklanır."
hosting_3 = "{$Pr} oluştur|{$PRS} başlığındaki + veya o bölümde n formu açar; bir dalın menüsünde \"Şuradan {$pr} başlat...\" vardır. YZ başlığı ve açıklamayı yazabilir."
hosting_4 = "Issue'lar|ISSUE'LAR bölümü onları listeler; + veya n yenisini oluşturur. Satır menüsü tarayıcıda açar ya da üzerinde işlem yapar."
hosting_5 = "Referanslar|Bir {$commit} mesajındaki veya dal adındaki issue ve {$prs} referansları (#12, !53, ABC-7) tanınır. {$commit} formunda Alt+R bir tane ekler."
hosting_6 = "Araç çubuğu çipi|Araç çubuğunun solunda bir çip geçerli dalın {$pr} bilgisini (GH #12, GL !53) ya da başlatmak için soluk \"+ {$pr_abbr}\" gösterir. Tıklayın."
hosting_7 = "SSH anahtarları|Profil başına (Ayarlar > Profiller) veya depo başına (sekme menüsü > \"SSH ve kimlik bilgileri...\") bir SSH anahtarı seçin. Parolalar sistemin ssh-agent'ında kalır."
setup_1 = "Ayarlar|Ctrl+, veya dişli. Tab sayfa listesi ile seçenekler arasında geçer, j / k hareket ettirir, Enter veya Boşluk değeri değiştirir, / veya Ctrl+F tüm seçeneklerde arar, Esc kapatır."
setup_2 = "Temalar|Ayarlar > Görünüm > Tema: koyu, açık, terminali izle veya çok sayıda hazır ayardan biri. Ctrl+N ve bir tuş, Ayarlar'ı açmadan tema, dil ve grafik renklerini de değiştirir."
setup_3 = "Dil|Ayarlar > Genel > Dil 17 dil sunar. \"Git terimlerini çevir\" git'in kendi sözcüklerinin ({$commit}, {$push}...) de çevrilip çevrilmeyeceğini belirler."
setup_4 = "Profiller|Ayarlar > Profiller {$commit} kimliklerini (ad, e-posta, SSH anahtarı) tutar. Araç çubuğundaki profil kutusu bu depo için olanı seçer."
setup_5 = "Şurada aç|Şurada aç düğmesi (Alt+O) bu sekmenin klasörünü terminalde, düzenleyicide veya dosya yöneticisinde açar. Ayarlar > Şurada aç listeyi düzenler."
setup_6 = "Tuş atamaları|Ayarlar > Klavye ve fare her tuşu yeniden atar. Bu yardımın Tuşlar sekmesi kendi atamalarınızı gösterir."
tools_1 = "YZ (isteğe bağlı)|Ayarlar > YZ'de kurana kadar kapalıdır: OpenAI uyumlu bir hizmet, Anthropic veya claude -p gibi yerel bir ajan. GitPoulpi hesabı hiçbir zaman gerekmez."
tools_2 = "YZ eylemleri|Özetin yanındaki kıvılcım düğmesi veya Ctrl+G i bir {$commit} mesajı yazar; Ctrl+G w değişiklikleri açıklar; Ctrl+G C işinizi birkaç {$commits} olarak böler; Alt+I çakışma çözümü önerir. Onayınız olmadan hiçbir şey uygulanmaz."
tools_3 = "CLI|gitpoulpi <komut> pencerenin yaptığını betikten aynı arka plan hizmetiyle yapar, böylece değişiklikler canlı görünür. --json makine çıktısı verir, --help seçenekleri listeler."
tools_4 = "MCP|gitpoulpi mcp serve --stdio YZ ajanlarına CLI komutu başına bir araç verir. Ayarlar > Ajanlar ve MCP neyi değiştirebileceklerini belirler."
tools_5 = "Kabuk sarmalayıcısı|gp kabuk sarmalayıcısıyla \"Çık ve cd yap\" düğmesi, GitPoulpi kapanınca kabuğunuzu etkin sekmenin klasöründe bırakır."

