# context: button: changes the branch name used on the selected remote
rename_button = "Uzakta yeniden adlandır..."
# context: button: the branch tracks no upstream any more
unset_button = "Upstream'i kaldır"
# context: primary button of the dialog
apply_button = "Uygula"
# context: shown while the dialog reads the branch's remotes
loading = "Uzak depolar okunuyor..."
# context: title of the small dialog that asks for the branch's name on one remote; {remote} is the remote
rename_title = "{remote} üzerindeki dal adı"
# context: placeholder of that dialog's field
rename_placeholder = "Uzak depodaki dal adı"
# context: primary button of that dialog
rename_set = "Ayarla"
# context: inline error of that dialog when the field is empty
rename_empty = "Bir dal adı yazın."
# context: inline error when Rename is used on the upstream's own row
rename_upstream_row = "Upstream'in dal adı yukarıdaki listeden seçilir."
# context: inline error when Rename is used with nothing to rename
rename_no_row = "Önce bir uzak depo satırı seçin."
# context: key hints under the table; keep the key names (Space, p, r, Del, Enter)
keys_hint = "Space {$Push}, p {$Pull} da, r Yeniden adlandır, Del Kaldır, Enter Uygula"
# context: status line while the change is sent; {branch} is the local branch
applying = "{branch} dalının uzak depoları ayarlanıyor..."
# context: status line once the daemon applied the change; {branch} is the local branch
remotes_set = "{branch} dalının uzak depoları güncellendi"

[push_group]
# context: title of the dialog that asks which remotes to push a branch to (one push only); {branch} is the local branch
title_select = "{$Push}: {branch} → seçili uzak depolar"
# context: title of the dialog that shows how a branch stands against each remote before a grouped push; {n} is the number of remotes, {branch} the local branch
title_plan = { one = "{$Push}: {branch} → {n} uzak depo", other = "{$Push}: {branch} → {n} uzak depo" }
# context: title of the dialog while a grouped push runs or after it ended; {branch} is the local branch
title_run = "{$Push}: {branch}"
# context: line under the title; {branch} is the local branch, {sha} the short id of its tip
local_at = "Yerel {branch} dalı, {sha} üzerinde"
# context: help line over the list of remotes to push to
select_hint = "Bu {$push_noun} işleminin gideceği uzak depoları seçin. Anımsa'yı işaretlemedikçe hiçbir şey kaydedilmez."
# context: checkbox: store the picked remotes as the branch's push targets
remember = "Bu dal için anımsa"
# context: shown under the list when no remote is ticked
select_none = "En az bir uzak depo işaretleyin."
# context: shown while the daemon asks the remotes about the branch
loading = "Uzak depolara soruluyor..."
# context: table heading: the remote's name
col_remote = "Uzak depo"
# context: table heading: how the local branch stands against the remote
col_state = "Durum"
# context: table heading: what the run does with that remote
col_action = "Eylem"
# context: state of a remote that already has the same commit
state_up_to_date = "güncel"
# context: state of a remote that only misses local commits
state_ready = "hazır"
# context: state of a remote that has no copy of the branch yet
state_new = "yeni"
# context: state of a remote that has commits the local branch lacks
state_behind = "geride"
# context: state of a remote whose history and the local branch's both moved
state_diverged = "ayrışmış"
# context: state of a remote whose commits are older copies of rebased or amended local commits
state_rewritten = "yeniden yazılmış"
# context: state of a remote whose history shares nothing with the local branch
state_unrelated = "ilgisiz"
# context: state of a remote whose host refused the branch earlier (protected branch)
state_refused = "reddedildi"
# context: state of a remote that could not be asked
state_unreachable = "ulaşılamıyor"
# context: state of a remote that is no longer configured
state_missing = "yok"
# context: note on a remote that points at the same repository as an earlier row; {other} is that earlier remote
same_as = "{other} ile aynı depo"
# context: action: send the local commits to the remote
action_push = "{$Push}"
# context: action: move the local branch forward to the remote's commit; {remote} is the remote
action_fast_forward = "{remote} üzerinden fast-forward"
# context: action: combine the remote's commits into the local branch, then send; {remote} is the remote
action_merge = "{$Merge}: {remote}"
# context: action: replay the local commits on top of the remote's, then send; {remote} is the remote
action_rebase = "{$Rebase}: {remote} üzerine"
# context: action: overwrite the remote's branch, refused if it moved since the plan
action_force = "Zorla {$push} (lease)"
# context: action: leave this remote out
action_skip = "Atla"
# context: line under a row whose merge would conflict; {n} is the number of files, {files} their names
conflicts = { one = "{$merge} {n} dosyada çakışır: {files}", other = "{$merge} {n} dosyada çakışır: {files}" }
# context: checkbox: also send the tags that no remote has yet
tags = "Henüz gönderilmemiş {$tags} da {$push} et"
# context: summary line under the table; {steps} is the list of steps
then_line = "Sonra: {steps}."
# context: summary line when every row is skipped or already up to date
then_nothing = "Sonra: yapılacak bir şey yok."
# context: separator between steps in the summary line
then_join = ", "
# context: step of the summary line; {remote} is the remote
step_fast_forward = "{remote} üzerinden fast-forward"
# context: step of the summary line; {remote} is the remote
step_merge = "{$merge}: {remote}"
# context: step of the summary line; {remote} is the remote
step_rebase = "{$rebase}: {remote} üzerine"
# context: step of the summary line; {n} is the number of remotes
step_push = { one = "{n} uzak depoya {$push}", other = "{n} uzak depoya {$push}" }
# context: warning under the summary when a row force-pushes; {n} is the number of commits that disappear, {remote} the remote
force_note = { one = "Zorla {$push}, {remote} üzerindeki {n} {$commit} öğesinin yerine geçer.", other = "Zorla {$push}, {remote} üzerindeki {n} {$commits} öğesinin yerine geçer." }
# context: warning under the summary when rows rebase while other remotes already hold the local commits; {remotes} are those remotes
rebase_warn = "{$Rebase} yerel {$commits} yeniden yazar: {remotes} için sonra force {$push} gerekir."
# context: confirmation question before a force push; {n} is the number of remote commits replaced, {branch} the branch, {remotes} the remote names
force_confirm = { one = "{branch} dalı {remotes} uzak depolarına zorla {$push} edilsin mi?\nLease ile: uzak depodaki {n} {$commit} değiştirilir. Geri alınamaz.", other = "{branch} dalı {remotes} uzak depolarına zorla {$push} edilsin mi?\nLease ile: uzak depolardaki {n} {$commits} değiştirilir. Geri alınamaz." }
# context: button: ask the remotes again
btn_fetch_again = "Yeniden {$fetch}"
# context: button: set every row that has a problem to Skip
