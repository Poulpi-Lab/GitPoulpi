minimap_help = { git = "Diff'in (tüm dosya kipi) ve düzenleyicinin dikey kaydırma çubuğunun yanında tüm dosyanın bir resmi; görünen kısım vurgulanır, tıklayınca oraya atlar. Terminal çiziyorsa gerçek görüntü, değilse braille hücreleri. Ayrıca diff'te `M` ve paletin Minimap'i Aç/Kapat komutu.", local = "Farkın (tüm dosya kipi) ve düzenleyicinin dikey kaydırma çubuğunun yanında tüm dosyanın bir resmi; görünen kısım vurgulanır, tıklayınca oraya atlar. Terminal çiziyorsa gerçek görüntü, değilse braille hücreleri. Ayrıca farkta `M` ve paletin Minimap'i Aç/Kapat komutu." }
