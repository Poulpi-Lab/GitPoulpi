allow_ui_propose = "YZ ajanlarının onaylayacağım değişiklikler önermesine izin ver"
allow_ui_propose_help = { git = "Açıkken bir YZ ajanı sizin için önceden doldurulmuş bir iletişim kutusu açabilir: bir commit için yeni mesaj, düzenleyicide bir commit mesajı, yeni bir dal veya tag. ✦ <ajan> önerdi diye işaretlenir ve iletişim kutusunun kendi onay düğmesine siz basana kadar hiçbir şey değişmez; Esc reddeder. Kapalıyken (varsayılan) `ui propose` ve MCP ui_propose_* araçları reddedilir.", local = "Açıkken bir YZ ajanı sizin için önceden doldurulmuş bir iletişim kutusu açabilir: bir commit için yeni mesaj, düzenleyicide bir commit mesajı, yeni bir dal veya etiket. ✦ <ajan> önerdi diye işaretlenir ve iletişim kutusunun kendi onay düğmesine siz basana kadar hiçbir şey değişmez; Esc reddeder. Kapalıyken (varsayılan) `ui propose` ve MCP ui_propose_* araçları reddedilir." }
