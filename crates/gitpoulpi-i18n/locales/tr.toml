default_encoding = "Varsayılan kodlama"
default_encoding_help = { git = "Geçerli UTF-8 olmayan dosya içeriklerini, blame ve diff'leri göstermek için kullanılır (geçerli UTF-8 asla yeniden çözülmez). Bir depo bunu aşağıda geçersiz kılabilir. Yalnızca görüntüleme: staging ve yamalar dosyanın baytlarını aynen korur.", local = "Geçerli UTF-8 olmayan dosya içeriklerini, blame ve farkları göstermek için kullanılır (geçerli UTF-8 asla yeniden çözülmez). Bir depo bunu aşağıda geçersiz kılabilir. Yalnızca görüntüleme: hazırlama ve yamalar dosyanın baytlarını aynen korur." }
push_behavior = { git = "Push düğmesi", local = "Gönder düğmesi" }
push_behavior_help = { git = "direct: varsayılan uzak depoya hemen push eder. ask: varsayılan uzak deponun önceden seçili olduğu küçük bir menü açar. Düğmenin ▾ simgesi her zaman sorar.", local = "direct: varsayılan uzak depoya hemen gönderir. ask: varsayılan uzak deponun önceden seçili olduğu küçük bir menü açar. Düğmenin ▾ simgesi her zaman sorar." }
repo_encoding_help = { git = "Geçerli UTF-8 olmayan dosya içeriklerinin, blame'in ve diff'lerin görüntülenmek üzere nasıl çözüldüğü (yalnızca bu depo; inherited: bu sayfadaki Varsayılan kodlama). Staging hiçbir şeyi yeniden kodlamaz.", local = "Geçerli UTF-8 olmayan dosya içeriklerinin, blame'in ve farkların görüntülenmek üzere nasıl çözüldüğü (yalnızca bu depo; inherited: bu sayfadaki Varsayılan kodlama). Hazırlama hiçbir şeyi yeniden kodlamaz." }
core_autocrlf_help = "Bu deponun git yapılandırmasına (core.autocrlf) yazılır; böylece git ve diğer tüm araçlar görür. true: checkout'ta LF'yi CRLF'ye; input: yalnızca geçmişe kaydederken CRLF'yi LF'ye; false: hiç dönüştürme. (devralınan): depo değerini kaldırır, genel git yapılandırmanız geçerli olur. Geri alınabilir."
core_eol_help = "Bu deponun git yapılandırmasına (core.eol) yazılır: git'in çalışma ağacındaki metin dosyaları için kullandığı satır sonu (lf, crlf veya platformunkini kullanan native). (devralınan): depo değerini kaldırır, genel git yapılandırmanız geçerli olur. Geri alınabilir."
git_lfs = "Git LFS"
git_lfs_help = { git = "Git LFS'yi arayüzde göster (LFS tag'i, diff kartı, eksik program bandı, LFS komutları) ve GitPoulpi'nin kendi LFS adımlarını çalıştırmasına izin ver (klondan sonra nesneleri indirme). Kapalı: git'in kendi LFS filtreleri yine çalışır, GitPoulpi git-lfs'yi hiç kendisi çağırmaz.", local = "Git LFS'yi arayüzde göster (LFS etiketi, fark kartı, eksik program bandı, LFS komutları) ve GitPoulpi'nin kendi LFS adımlarını çalıştırmasına izin ver (klondan sonra nesneleri indirme). Kapalı: git'in kendi LFS filtreleri yine çalışır, GitPoulpi git-lfs'yi hiç kendisi çağırmaz." }
git_lfs_program = "git-lfs programı"
git_lfs_program_help = "https://git-lfs.com adresinden kurun (Windows: Git for Windows ile birlikte gelir veya `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Palet: LFS: Kurulum Sayfasını Aç."
initialize_lfs_for_this_repository = "Bu depo için LFS'yi başlat"
initialize_lfs_for_this_repository_help = "`git lfs install --local` çalıştırır: LFS filtreleri ve kancaları bu deponun kendi yapılandırmasına yazılır, genel olana asla. git-lfs gerekir."
pull_mode_help = "Araç çubuğundaki {$Pull}{hint} düğmesinin yaptığı: merge (mümkünse fast-forward), ff_only veya rebase. Düğmenin ▾ öğeleri kendi eylemlerini hemen çalıştırır ve bunu değiştirmez."
merge_fast_forward = "{$Merge} fast-forward"
merge_fast_forward_help = "Başlattığınız bir {$merge} işleminin (dal menüsü, sürükle-bırak, palet, komut satırı) fast-forward yapılabilecek bir dalı nasıl ele alacağı. never: her zaman bir {$merge} {$commit}'i oluşturur. allowed: mümkünse fast-forward yapar, git'in varsayılanı gibi. only: yalnızca fast-forward yapar, mümkün değilse reddeder. Bir depo bunu kendi {$Merge} seçenekleri sayfasında geçersiz kılabilir."
repo_heading = "Depo: {repo} - yalnızca bu depo"
inherited = "(devralınan)"
lfs_not_checked = "(henüz denetlenmedi)"
lfs_autofix_filters = "{$pull} ve {$push} öncesinde LFS filtrelerini kur"
lfs_autofix_filters_help = "Git LFS kullanan bir depoda {$pull} veya {$push} öncesinde LFS filtreleri ya da hook'lar eksikse `git lfs install --local` çalıştırır (yalnızca deponun kendi yapılandırması, asla genel olan değil); böylece aktarım büyük dosyaları işler. Durum çubuğu bunu bildirir. git-lfs gerekir."
push_group_preflight = "Her uzak depoyu {$push_noun} öncesinde denetle"
push_group_preflight_help = "Ek {$push} hedefleri olan bir dalı {$push_noun} öncesinde önce her uzak depoya bakılır (hızlı bir sorgu; o uzak depodan indirme yalnızca farklıysa yapılır), böylece üçüncü uzak depodaki bir sorun ilk {$push_noun} başlamadan görünür. Kapalıyken her uzak depoya sırayla {$push} yapılır ve olanlar bildirilir."
default_push_targets = "Yeni dallar için ek {$push} hedefleri"
default_push_targets_help = "Yalnızca bu depo için. Yeni bir dalın upstream'inin yanında {$push} yaptığı uzak depoları işaretleyin. Dal ilk kez bir upstream aldığında (bunu ayarlayan ilk {$push_noun} veya bir uzak daldan oluşturulan dal) dala kopyalanırlar. Var olan dallar değişmez: onları dalın Uzak depolar penceresinden değiştirin."
default_push_targets_none = "(yapılandırılmış uzak depo yok)"

