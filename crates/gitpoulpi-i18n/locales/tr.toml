[settings_ssh]
private_key_path = "Özel anahtar yolu"
private_key_path_help = "{$fetch}, {$pull}, {$push} ve clone'un ssh'a sunduğu anahtar dosyası (ssh -i <anahtar> -o IdentitiesOnly=yes). Boş: ssh-agent ve ssh yapılandırmanız her zamanki gibi. Bir depo kendi anahtarını seçtiğinde (SSH ve kimlik bilgileri) veya GIT_SSH_COMMAND ya da core.sshCommand ayarlıysa yok sayılır. Sonraki aktarımdan itibaren geçerlidir."
public_key_path = "Genel anahtar yolu"
public_key_path_help = "Yalnızca özel anahtar yolu boşken kullanılır: ssh, ajandaki tüm anahtarları sunmak yerine ssh-agent'taki (veya donanım anahtarındaki) eşleşen anahtarı seçer. Anahtar çifti oluştur ikisini de doldurur. Özel anahtar yolu ile aynı öncelik."
key_type = "Anahtar türü"
heading_https_credentials = "HTTPS kimlik bilgileri"
https_mode = "HTTPS kimlik bilgileri"
https_mode_help = { git = "fetch, pull, push ve clone'un HTTPS üzerinden nasıl kimlik doğruladığı. credential_helper: git'in kendi yardımcısı (Git Credential Manager, libsecret, Keychain). prompt: herhangi bir yardımcıyı yok sayar ve git'in terminalde sormasını sağlar. none: hiç kimlik bilgisi yok, yalnızca herkese açık uzak depolar. Sonraki aktarımda uygulanır.", local = "getirme, çekme, gönderme ve clone'un HTTPS üzerinden nasıl kimlik doğruladığı. credential_helper: git'in kendi yardımcısı (Git Credential Manager, libsecret, Keychain). prompt: herhangi bir yardımcıyı yok sayar ve git'in terminalde sormasını sağlar. none: hiç kimlik bilgisi yok, yalnızca herkese açık uzak depolar. Sonraki aktarımda uygulanır." }
heading_keys = "Anahtarlar"
generate_key_pair = "Anahtar çifti oluştur"
generate_key_pair_help = "İşlem içinde (ssh-keygen ve parola olmadan) ~/.ssh/gitpoulpi_ed25519 olarak bir ed25519 anahtar çifti oluşturur, hiçbir dosyanın üzerine yazmaz ve yukarıdaki iki yolu kaydeder. Açık anahtarı Entegrasyonlar'dan bir sunucuya ekleyin."

[settings_editor]
tab_size = "Sekme boyutu"
tab_size_help = { git = "Yerleşik düzenleyicide (çizim, Shift+Tab) ve diff görünümlerinde sekme durakları arasındaki sütun sayısı. Blame görünümü sekmeyi tek boşluk çizer ve yok sayar.", local = "Yerleşik düzenleyicide (çizim, Shift+Tab) ve fark görünümlerinde sekme durakları arasındaki sütun sayısı. Blame görünümü sekmeyi tek boşluk çizer ve yok sayar." }
eol = "Satır sonu"
eol_help = "Yerleşik düzenleyicinin kaydederken yazdığı. Otomatik dosyanın kendi satır sonunu korur (yeni dosya için LF); LF veya CRLF dosyayı kaydederken dönüştürür. Düzenleyicinin durum çubuğu bir sonraki kaydın ne yazacağını gösterir."
syntax_highlighting = "Sözdizimi vurgulama"
syntax_highlighting_help = { git = "Yerleşik düzenleyiciyi dile göre renklendirir. Diff görünümleri ve blame görünümü sözdizimi renklendirmesi almaz.", local = "Yerleşik düzenleyiciyi dile göre renklendirir. Fark görünümleri ve blame görünümü sözdizimi renklendirmesi almaz." }
line_numbers = "Satır numaraları"
line_numbers_help = { git = "Yerleşik düzenleyicinin ve diff görünümlerinin numara sütunu (orada boş bırakılır, sütunlar yerinde kalır). Blame görünümünde yok.", local = "Yerleşik düzenleyicinin ve fark görünümlerinin numara sütunu (orada boş bırakılır, sütunlar yerinde kalır). Blame görünümünde yok." }
follow_selection = "Düzenleyicide seçimi izle"
follow_selection_help = "Düzenleyici açıkken sağ panelde başka bir dosya seçmek onu düzenleyicide de açar; önce kaydedilmemiş değişikliklerin kaydedilip kaydedilmeyeceği sorulur. Düzenlenemeyen bir dosya olağan görünümünde açılır."
merge_side_by_side_min_width = { git = "Merge düzenleyici: yan yana (sütun)", local = "Birleştirme düzenleyici: yan yana (sütun)" }
merge_side_by_side_min_width_help = { git = "Merge çakışma düzenleyicisi, alanı en az bu kadar sütun genişliğindeyse A ve B'yi yan yana gösterir (uzun satırlar Shift+tekerlek veya Shift+oklarla yana kayar); daha darsa sekmelerin ardında her seferinde bir tarafı gösterir. Varsayılan 100; en düşük değer 40, 0 her zaman yan yana demektir. Düzenleyici açıkken Refs ve Durum panellerini gizler, bu yüzden genelde tüm pencereye sahiptir.", local = "Birleştirme çakışma düzenleyicisi, alanı en az bu kadar sütun genişliğindeyse A ve B'yi yan yana gösterir (uzun satırlar Shift+tekerlek veya Shift+oklarla yana kayar); daha darsa sekmelerin ardında her seferinde bir tarafı gösterir. Varsayılan 100; en düşük değer 40, 0 her zaman yan yana demektir. Düzenleyici açıkken Refs ve Durum panellerini gizler, bu yüzden genelde tüm pencereye sahiptir." }
diff_word_wrap = "Sözcük kaydırma"
diff_word_wrap_help = { git = "Diff görünümlerinde uzun satırları üç nokta ile kesmek yerine kaydırır. Yerleşik düzenleyici ve blame görünümü yana kayar, kaydırmaz. Diff görünümünün kendi kaydırma anahtarı da budur.", local = "Fark görünümlerinde uzun satırları üç nokta ile kesmek yerine kaydırır. Yerleşik düzenleyici ve blame görünümü yana kayar, kaydırmaz. Fark görünümünün kendi kaydırma anahtarı da budur." }

[settings_ui]
theme = "Tema"
theme_help = "Tüm arayüzün renkleri. Listede gezinirken her tema canlı önizlenir; Enter korur, Esc geri döner. Sistem, terminalin açık veya koyu arka planını izler (başlangıçta bir kez algılanır; algılanamazsa Koyu). Yapılandırma klasöründeki themes/ içindeki kendi tema dosyalarınız en sonda listelenir."
theme_system = "Sistem (terminali izler)"
follow_theme = "Temayı izle"
theme_swatches = "Renkler"
graph_lane_background = "Grafik şerit arka planı"
graph_lane_background_help = "Kapalı: saydam, şeritlerin arkasında bir şey yok (varsayılan). Satır tonu: Grafik sütununun içinde commit'in şerit renginde soluk bir bant, ayrıca sütunun sağ kenarında aynı renkte ince bir çubuk. Kayıtlı bir şerit Satır tonu olarak okunur. Ayarlar kapanınca uygulanır."
graph_row_tint_strength = "Satır tonu gücü"
graph_row_tint_strength_help = "Satır tonu bandının ne kadar soluk olduğu: Güçlü (özgün), Orta (varsayılan) veya Hafif. Yalnızca bant solar; sütunun sağ kenarındaki çubuk tam rengini korur. Ayarlar kapanınca uygulanır."
graph_row_tint_strength_coming = "önce Grafik şerit arka planını Satır tonu yapın"
toolbar_position = "Araç çubuğu konumu"
toolbar_position_help = "Araç çubuğunun yeri: Üst, Alt (varsayılan), Sol veya Sağ. Sol ve Sağ onu bölmelerin yanında bir sütun yapar; 80 sütundan dar bir pencerede altta çizilir. Hemen uygulanır."
toolbar_align = "Araç çubuğu düğmelerinin hizası"
toolbar_align_help = "Düğmelerin çubuk boyunca yeri: Baş (varsayılan), Orta veya Son. Baş, satırda sol ve sütunda üsttür; Son sağ ve alttır. Hemen uygulanır."
# context: label of the setting that decides whether a dialog the user moved or resized keeps its place
dialog_geometry = "Pencere konumunu ve boyutunu hatırla"
dialog_geometry_help = "Tüm pencereler için tek ayar. Pencereler taşınabilir (başlık çubuğunu sürükleyin ya da Ctrl+N ardından m); büyük pencereler ayrıca yeniden boyutlandırılabilir (kenarları ve alt köşeleri sürükleyin). Her pencere kendi konumunu ve boyutunu hatırlar. Bu oturum için (varsayılan): GitPoulpi kapanana kadar korunur. Diske kaydedilir: sonraki açılışta da korunur. Asla: her pencere varsayılan yerinde ve boyutunda açılır. Hemen uygulanır."
toolbar_pr_pinned = "{$pr} düğmesini sona sabitle"
toolbar_pr_pinned_help = "Açıkken (varsayılan) {$pr} düğmesi hizadan bağımsız olarak araç çubuğunun en ucunda durur (sağda, sütunda altta). Kapalıyken diğer düğmelerle birlikte akar ve onlarla hizalanır. Hemen uygulanır."
statusbar_position = "Durum çubuğu konumu"
statusbar_position_help = "Durum çubuğunun (dal, sayılar, iletiler, tuş ipuçları) yeri: Üst (depo sekmelerinin üstü) veya Alt (varsayılan). Ana sayfa sekmesi altta kendi durum çubuğunu korur. Hemen uygulanır."
tabs_position = "Sekme çubuğu konumu"
tabs_position_help = "Depo sekmelerinin yeri: Üst (varsayılan), Alt veya Sol, pencerenin sol kenarında satır başına bir sekme olan bir liste. 80 sütundan dar bir pencerede üstte çizilir. Sütun biçimindeki bir araç çubuğunun yanında sekmeler en dışta kalır. Hemen uygulanır."
graph_color_theme = "Grafik renk teması"
graph_color_theme_help = "Log grafiğinin şerit renk paleti. Temayı izle, seçilen temanın paletini kullanır; diğer her seçenek onu geçersiz kılar, böylece her tema her paletle birleştirilebilir. Ayarlar kapanınca uygulanır."
graph_renderer = "Grafik çizici"
graph_renderer_help = "auto grafiği, destekleyen bir terminalde gerçek görüntü olarak, başka her yerde karakterlerle çizer - terminalin ortamını devralan ama görüntüyü geçirmeyen zellij ve screen içinde, arkasındaki terminal sixel kabul etmedikçe tmux içinde ve kitty_graphics ayarı açık olmadıkça herdr içinde de. image resmi zorla açar, text zorla kapatır. Yeniden başlatma gerekir."
image_protocol = "Görüntü protokolü"
image_protocol_help = "Resimlerin (grafik görüntüsü, yazar avatarları) terminale nasıl ulaştığı. auto: kitty, Ghostty ve yapılandırmasında kitty_graphics = true olan herdr içinde Kitty grafik protokolü; iTerm2 3.7.7 ve üstünde de Kitty protokolü; WezTerm, Rio, mintty ve daha eski iTerm2 içinde iTerm2 satır içi görüntüler; Windows Terminal, foot, Tabby, Konsole, mlterm içinde ve arkasındaki terminal sixel kabul ediyorsa tmux içinde sixel resimler (grafik sütunu ve avatarlar); başka yerlerde karakterler. kitty, iterm2 veya sixel o protokolü zorlar (yapılandırması başka yerde olan herdr için kitty; sixel çizen ama tanınmayan bir terminal için sixel); none resimleri kapatır. Yeniden başlatma gerekir."
kitty_keyboard = "Kitty klavye protokolü"
kitty_keyboard_help = "auto başlangıçta ve yaklaşık 100 ms içinde terminale kitty klavye protokolünü konuşup konuşmadığını sorar ve konuşuyorsa kullanır: eski terminallerin ayırt edemediği tuş birleşimleri (noktalama, rakam, Shift veya Enter ile Control) o zaman kontrol kodlarıyla çakışmak yerine kendileri olarak gelir. Yanıt vermeyen terminal eski tuşlarını korur. off terminalin klavye kipine hiç dokunmaz. Yeniden başlatma gerekir."
color_depth = "Renk derinliği"
color_depth_help = "auto 24 bit renk kullanır; bunu göstermeyen terminallerde (Apple Terminal, Linux konsolu veya COLORTERM bildirmeyen 256 renkli bir terminal) renkler en yakın 256 veya 16 girişe eşlenir. truecolor, 256 ve 16 bir derinliği zorlar. Hemen uygulanır."
text_cursor = "Metin imleci"
text_cursor_help = "terminal, terminalin kendi imlecini odaktaki metin alanının düzenleme noktasına çubuk olarak koyar: terminalinizin imleç ayarları geçerli olur ve bir giriş yönteminin aday penceresi o noktada açılır. drawn GitPoulpi'nin kendi imlecini (blok veya alt çizgi) çizer ve terminal imlecini gizli tutar. Hemen uygulanır."
graph_show_stashes = { git = "Grafikte stash'leri göster", local = "Grafikte saklamaları göster" }
graph_show_stashes_help = { git = "Her stash Log'da tarihinde kendi satırını alır: yapıldığı commit'in yanındaki bir şeritte küçük bir kutu, ona kesikli çizgiyle bağlı. Seçince neyi değiştirdiğini gösterir; sağ tık (veya .) Pop, Apply ve Drop sunar. Kapalıyken stash'ler yalnızca {$STASHES} bölümünde kalır. Solo modunda çizilmez.", local = "Her saklama Log'da tarihinde kendi satırını alır: yapıldığı commit'in yanındaki bir şeritte küçük bir kutu, ona kesikli çizgiyle bağlı. Seçince neyi değiştirdiğini gösterir; sağ tık (veya .) Pop, Apply ve Drop sunar. Kapalıyken saklamalar yalnızca {$STASHES} bölümünde kalır. Solo modunda çizilmez." }
ref_connector = "Ref-commit bağlayıcısı"
ref_connector_help = "Ref sütunundaki her ref hapından grafikteki commit'inin dairesine ince bir çizgi. Yalnızca boş alanı doldurur: geçtiği şeritler üstte kalır ve hiçbir şey yer değiştirmez. Yalnızca Ref sütunu Grafik sütununun hemen solundayken çizilir."
log_wip_counts_in_message = "Değişiklikler sütunu gizliyken mesajda WIP değişiklik sayılarını göster"
log_wip_counts_in_message_help = "WIP satırı kaç dosyanın değiştirildiğini, eklendiğini ve silindiğini gösterir. Değişiklikler sütunu görünürken (göstermek için Log başlığına sağ tıklayın) sayılar her commit'te olduğu gibi hep o sütuna gider. Gizliyken bu açıksa WIP mesajında gelirler; kapalıyken hiç sayı gösterilmez."
avatars = "Yazar avatarları"
avatars_help = "Yazar resimleri. graph her commit'in yazarını grafikteki dairesinin içine çizer (yalnızca resimli grafikte; metin grafikte bunun yerine Yazar sütununa renkli bir baş harf konur). author Yazar sütununun başına yuvarlak bir resim koyar. İkisi de commit ayrıntı panelinde de gösterir. Varsayılan kapalı: açmak her yazarın e-posta adresinin SHA-256 özetini HTTPS üzerinden gravatar.com'a gönderir - bilinen veya tahmin edilebilir bir adresin özeti anonim değildir - ve github.com uzak deposu olan bir depoda, her yazar için commit'lerinden birini hangi hesabın yaptığını GitHub API'ye bir kez sorar (varsa GitHub entegrasyonunun token'ını kullanarak). Resim gelene kadar ve hiç olmadığında baş harfler veya düz daire gösterilir. off ağa hiçbir şey göndermez."
avatar_sources = "Avatar kaynakları"
avatar_sources_help = "Bir yazarın resminin hangi sırayla aranacağı (GitHub noreply adresi her zaman önce hesabını belirtir). hosting_gravatar: uzak depoyla barındırıcısı eşleşen bağlı GitHub, GitLab veya Bitbucket entegrasyonu (GitHub commit yazarı veya kullanıcı araması, GitLab e-postayla avatar veya users API), sonra Gravatar; eşleşen bağlı entegrasyon yoksa önce Gravatar gelir ve github.com uzak deposu yine de en son, kimliksiz sorulur. gravatar_hosting: tersi. gravatar veya hosting: yalnızca o. Hiçbirinde resim yoksa aşağıdaki avatar yedeği çizilir. Henüz aranmamış yazarlara uygulanır."
avatar_fallback = "Avatar yedeği"
avatar_fallback_help = "Resmi olmayan bir yazarın alacağı. identicon: e-postasından türetilen renkte GitHub tarzı 5x5 simetrik bir desen, yerelde üretilir (ağ yok), resimli terminalde resim, başka yerde blok karakterler olarak. initials: baş harflerini taşıyan renkli bir rozet."
composer_files = "Composer önerileri"
composer_files_help = "YZ commit composer'ının incelemesinin nasıl açıldığı. expanded: önerilen her commit dosyalarını listeler. collapsed: yalnızca commit satırları; Sağ/Sol (veya oka tıklama) birini açar."
blame_side = "Blame açıklamaları"
blame_side_help = "Blame görünümünde açıklama sütununun (avatar, yazar, yaş, özet) hangi yanda olduğu. right: kodun sağında. left: kodun solunda."
column_resize = "Sütun yeniden boyutlandırma"
column_resize_help = "Log'da, Radar'da ve dosya görünümlerinin yan sütununda bir sütun sınırının nasıl tutulduğu. line: imleç sınırın üzerindeyken tablonun tüm yüksekliğince ince bir çizgi, başlıkta küçük bir işaret. header: boşluk ve işaret yok, yalnızca sonraki hücrenin ilk karakterinin yandığı başlıktan yeniden boyutlandırılır."
blame_width = "Blame açıklama genişliği"
blame_width_help = "Açıklama sütununun hücre cinsinden genişliği (24 ile 90 arası). Blame görünümünde kenarını sürükleyin veya genişlet / daralt tuşlarını kullanın; yeni genişlik buraya kaydedilir."
ref_tree = "Dal klasör ağacı"
ref_tree_help = "Refs kenar çubuğu dal adlarını `/` üzerinden katlanabilir klasörlere gruplar, her uzak depo kendi üst düzey düğümü olur. Kapalıyken dal başına tek düz satır verir. Refs panelinde `y` bunu canlı değiştirir ve seçimi buraya yazar."
reveal_on_ref_click = "Bir ref'e tıklamak onu grafikte gösterir"
reveal_on_ref_click_help = "Refs panelinde bir ref'e tek tıklamak Log'u ref'in işaret ettiği yere kaydırır ve satırı kısa süre vurgular. Log'daki seçim ve sağ panel değişmez. Kapalıyken tıklama yalnızca kenar çubuğundaki satırı seçer. Ref menüsündeki \"Grafikte göster\", Refs panelindeki tuşu ve palet komutu her iki durumda da çalışır."
graph_ghost_ref = "Üzerine gelinen {$commit} için soluk bir dal göster"
graph_ghost_ref_help = "Log'un Ref sütununda, kendi ref'i olmayan ve üzerine gelinen {$commit}, ait olduğu dalın (yoksa uzak dalın) adını taşıyan soluk bir hap gösterir; ad geçmişten çıkarılır. Hapın üzerine gelmek türünü gösterir. Tıklamak özel bir şey yapmaz; dalı dal oluşturma komutu oluşturur. Yalnızca Ref sütununda yer varsa çizilir. Kapalıyken gizlenir."
