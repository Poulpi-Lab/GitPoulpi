split_6 = "{$commits} imzalamayı açar/kapatır (deponun gpgSign ayarı true ise düzenleyici açıldığında açıktır)"
split_7 = "{$commits} panelinde o {$commit}'i seçer; bir değişiklikte m veya Enter, onu verebileceğiniz {$commits} listesini açar"
rewrite_9 = "Boyut sekmesini açar ve geçmişi analiz eder: en büyük dosyalar ve klasörler, silinmiş ama hâlâ saklanan dosyalar; işaretli satırlar kaldırma kurallarına dönüşür"
rewrite_host_howto = { git = "yeniden yazılan geçmişin barındırıcının koruduğu bir daldan nasıl geçirileceğini açıklar: korumayı kaldırın, yeni bir adla push edin veya depoyu yeniden oluşturun; sizin yerinize hiçbir şey yapılmaz", local = "yeniden yazılan geçmişin barındırıcının koruduğu bir daldan nasıl geçirileceğini açıklar: korumayı kaldırın, yeni bir adla gönderin veya depoyu yeniden oluşturun; sizin yerinize hiçbir şey yapılmaz" }
rewrite_ai_rules = "açıklamanızdan YZ ile yeniden yazma kurallarını oluşturur (hiçbir şey önizlenmez veya uygulanmaz)"
log_columns_2 = "sütunlar genişliklerini koruyorsa Log'un sütunlarını yana kaydır (sütun seçicide, Ayarlar'da ya da bir sütun seçiliyken s ile seçilen Yana kaydır düzeni); sığdırma düzeninde her sütun bölmeye sığar"
refs_pane_20 = "seçili yerel dalın uzak depolarını (upstream'ini ve ek {$push} hedeflerini) düzenler: satırındaki uzak depo rozetine tıklamanın klavye karşılığı"
markdown_editor_1 = "switch between Write and Preview (the text as it will look once posted)"
markdown_editor_2 = "show the text and its preview side by side (needs a wide window)"
markdown_editor_3 = "send the text (Enter inserts a newline)"

