log_2 = "Пошук|f (або кнопка Пошук) притлумлює рядки, що не збігаються з повідомленням, автором, хешем чи посиланням. Enter / Shift+Enter переходять до наступного / попереднього збігу. / фільтрує панель Refs."
log_3 = { git = "Меню commit'ів|Праве клацання по commit'у або . на ньому: {$cherry_pick}, revert, reset, редагування повідомлення, створення гілки чи tag'а, checkout, worktree, патч, копіювання.", local = "Меню комітів|Праве клацання по коміту або . на ньому: {$cherry_pick}, revert, reset, редагування повідомлення, створення гілки чи тегу, checkout, worktree, патч, копіювання." }
log_4 = { git = "Інтерактивний {$rebase}|«Інтерактивний {$rebase} звідси...» у меню commit'у: задайте кожному commit'у {$pick}, {$reword}, {$squash}, {$fixup}, {$drop} або {$edit}, перевпорядковуйте Ctrl+Вгору/Вниз, запускайте Ctrl+S, виходьте Esc.", local = "Інтерактивне перебазування|«Інтерактивне перебазування звідси...» у меню коміту: задайте кожному коміту дію ({$pick}, {$reword}, {$squash}, {$fixup}, {$drop} або {$edit}), перевпорядковуйте Ctrl+Вгору/Вниз, запускайте Ctrl+S, виходьте Esc." }
log_5 = { git = "Кілька commit'ів|Ctrl+клацання перемикає {$commit}, Shift+клацання (Alt+клацання) виділяє діапазон, Пробіл перемикає поточний, Esc скидає. Потім праве клацання: {$cherry_pick} або revert усього виділення.", local = "Кілька комітів|Ctrl+клацання перемикає коміт, Shift+клацання (Alt+клацання) виділяє діапазон, Пробіл перемикає поточний, Esc скидає. Потім праве клацання: {$cherry_pick} або revert усього виділення." }
log_6 = "Перетягування посилань|Перетягніть гілку на іншу для {$merge}, {$rebase} або fast-forward, чи на віддалену гілку для {$push}; відпустіть і виберіть у меню, Esc скасовує. Клавіатура: палітра, «Refs: перенести вибраний ref на поточну гілку...»."
changes_1 = "Поточні зміни|Виберіть перший рядок Log (WIP): файли {$unstaged} і {$staged} з'являться праворуч. m перемикає шлях / дерево, a показує всі файли, z згортає папки."
changes_2 = "{$Stage} і {$unstage}|Ctrl+Пробіл на файлі, його кнопка або Ctrl+G s; Ctrl+G a для всього, Ctrl+G u для {$unstage}. Праве клацання по файлу: скасувати, історія чи blame, відкрити в редакторі."
changes_3 = { git = "Читання diff|Натисніть файл або клавішу d. m перемикає рядковий / розділений вигляд, w переносить рядки, s ігнорує пробіли, n / p переходять між блоками, Esc або q повертає до Log.", local = "Читання різниці|Натисніть файл або клавішу d. m перемикає рядковий / розділений вигляд, w переносить рядки, s ігнорує пробіли, n / p переходять між блоками, Esc або q повертає до Log." }
changes_4 = { git = "Блоки й рядки|У diff: Пробіл = {$stage} блоку, v, потім j / k, потім Enter = {$stage} вибраних рядків, x = скасувати блок. Скасування спершу питає; Ctrl+Z повертає.", local = "Блоки й рядки|У різниці: Пробіл = додати блок в індекс, v, потім j / k, потім Enter = додати вибрані рядки в індекс, x = скасувати блок. Скасування спершу питає; Ctrl+Z повертає." }
changes_5 = "Написати {$commit}|Введіть заголовок і опис, потім Ctrl+Enter або зелена кнопка. Shift+A виправляє останній {$commit}. Ctrl+G c переносить курсор у форму, Esc виходить."
changes_6 = "Конфлікти {$merge}|Банер пропонує «Вирішити конфлікти...». У редакторі {$merge} виберіть A, B або обидва для кожного конфлікту (a / b / c), правте Результат, збережіть, потім Продовжити."
changes_7 = "Скасування й повтор|Ctrl+Z / Ctrl+Y або кнопки панелі скасовують і повторюють більшість операцій: {$commits}, гілки, checkout, reset, {$stashes}, скасування змін. За ризику спершу питає."
refs_1 = { git = "Гілки й {$tags}|Подвійне клацання по локальній гілці чи tag'у робить checkout; праве клацання відкриває меню ({$merge}, {$rebase}, перейменувати, видалити...). Ctrl+G b і Ctrl+G t створюють їх на поточному commit'і.", local = "Гілки й теги|Подвійне клацання по локальній гілці чи тегу робить checkout; праве клацання відкриває меню (злиття, перебазування, перейменувати, видалити...). Ctrl+G b і Ctrl+G t створюють їх на поточному коміті." }
refs_2 = "Solo й приховування|Клавіша o показує лише {$commits} вибраного посилання, Shift+O вимикає. Меню посилання ховає його в графі; Shift+H знову показує все. Лише вигляд: репозиторій не змінюється."
refs_3 = "{$Fetch}, {$pull}, {$push}|Ctrl+G f: {$fetch} усіх віддалених. Ctrl+G p: {$pull}. Ctrl+G Shift+P: {$push}. Стрілка біля кнопки вибирає інший спосіб або інший віддалений репозиторій."
refs_4 = "Віддалені|Плюс у заголовку REMOTE додає репозиторій. Праве клацання по віддаленому: {$fetch}, копіювати веб-посилання, правити URL або видалити."
refs_5 = { git = "{$Stashes} і worktree|Кнопки Stash і Pop; Ctrl+G m спершу питає повідомлення. Праве клацання по stash'у: застосувати або витягти. «Створити worktree з...» відкриває гілку в окремій вкладці.", local = "Схованки і worktree|Кнопки «Схованка» і «Повернути»; Ctrl+G m спершу питає повідомлення. Праве клацання по схованці: застосувати або витягти. «Створити worktree з...» відкриває гілку в окремій вкладці." }
refs_6 = "Підмодулі й LFS|Розділ SUBMODULES з'являється, якщо підмодулі є: подвійне клацання відкриває підмодуль вкладкою, праве клацання оновлює. Дії Git LFS: кнопка LFS або Ctrl+G l."
hosting_1 = "Підключення|Налаштування > Інтеграції: вставте особистий токен GitHub або GitLab. Обліковий запис не потрібен; токен іде до системного сховища облікових даних."
hosting_2 = "Прив'язка репозиторію|У розділах {$PRS} та ISSUES бічної панелі виберіть одного із запропонованих провайдерів. Нічого не прив'язується саме; прив'язка зберігається для кожного репозиторію."
hosting_3 = "Створення {$pr}|Плюс у заголовку {$PRS} або n у цьому розділі відкриває форму; у меню гілки є «Почати {$pr} з...». ШІ може написати заголовок і опис."
hosting_4 = "Issues|Розділ ISSUES показує issues; + або n створює нове. Меню рядка відкриває issue в браузері або діє над ним."
hosting_5 = { git = "Посилання|Посилання на issues та {$prs} (#12, !53, ABC-7) у повідомленні commit'у або назві гілки розпізнаються. Alt+R у формі commit'у вставляє посилання.", local = "Посилання|Посилання на issues та запити на злиття (#12, !53, ABC-7) у повідомленні коміту або назві гілки розпізнаються. Alt+R у формі коміту вставляє посилання." }
hosting_6 = "Чіп на панелі|Ліворуч на панелі інструментів чіп показує {$pr} поточної гілки (GH #12, GL !53) або притлумлений «+ {$pr_abbr}», щоб почати. Натисніть на нього."
hosting_7 = "Ключі SSH|Виберіть ключ SSH для профілю (Налаштування > Профілі) або для репозиторію (меню вкладки > «SSH і облікові дані...»). Парольні фрази залишаються в системному ssh-agent."
setup_1 = "Налаштування|Ctrl+, або шестірня. Tab перемикає список сторінок і параметри, j / k рухають, Enter або Пробіл змінює значення, / або Ctrl+F шукає по всіх параметрах, Esc закриває."
setup_2 = "Теми|Налаштування > Вигляд > Тема: темна, світла, як у терміналі або один із багатьох пресетів. Ctrl+N і клавіша теж змінюють тему, мову й кольори графа, не відкриваючи Налаштування."
setup_3 = "Мова|Налаштування > Загальні > Мова пропонує 17 мов. «Перекладати терміни git» вирішує, чи перекладаються власні слова git ({$commit}, {$push}...)."
setup_4 = { git = "Профілі|Налаштування > Профілі зберігають особи автора commit'ів (ім'я, e-mail, ключ SSH). Список профілів на панелі вибирає особу для цього репозиторію.", local = "Профілі|Налаштування > Профілі зберігають особи автора комітів (ім'я, e-mail, ключ SSH). Список профілів на панелі вибирає особу для цього репозиторію." }
setup_5 = "Відкрити в|Кнопка Відкрити в (Alt+O) відкриває папку цієї вкладки в терміналі, редакторі чи файловому менеджері. Налаштування > Відкрити в редагують список."
setup_6 = "Скорочення клавіш|Налаштування > Клавіатура й миша перепризначають будь-яку клавішу. Вкладка Клавіші цієї довідки показує ваші скорочення."
tools_1 = "ШІ (необов'язково)|Вимкнений, поки ви не налаштуєте його в Налаштування > ШІ: OpenAI-сумісний сервіс, Anthropic або локальний агент на кшталт claude -p. Обліковий запис GitPoulpi не потрібен ніколи."
tools_2 = { git = "Дії ШІ|Кнопка-іскра біля заголовка або Ctrl+G i пише повідомлення commit'у; Ctrl+G w пояснює зміни; Ctrl+G C ділить роботу на кілька commit'ів; Alt+I пропонує вирішення конфлікту. Нічого не застосовується без вашого підтвердження.", local = "Дії ШІ|Кнопка-іскра біля заголовка або Ctrl+G i пише повідомлення коміту; Ctrl+G w пояснює зміни; Ctrl+G C ділить роботу на кілька комітів; Alt+I пропонує вирішення конфлікту. Нічого не застосовується без вашого підтвердження." }
tools_3 = "CLI|gitpoulpi <команда> робить зі скрипта те саме, що вікно, через того самого демона, тож зміни видно одразу. --json дає машинний вивід, --help перелічує параметри."
tools_4 = "MCP|gitpoulpi mcp serve --stdio дає ШІ-агентам по інструменту на кожну команду CLI. Налаштування > Агенти й MCP визначають, що вони можуть змінювати."
tools_5 = "Обгортка оболонки|З обгорткою оболонки gp «Вийти й cd сюди» залишає вашу оболонку в папці активної вкладки під час виходу з GitPoulpi."

