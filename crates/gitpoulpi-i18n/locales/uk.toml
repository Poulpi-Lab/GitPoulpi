[edit_off_branch]
# context: title of the dialog offered when the commit to edit is not on the checked-out branch
title = "Змінити {$commit} іншої гілки"
# context: body of that dialog when local branches hold the commit; {short} is the short commit id
body_branches = "{short} немає в поточній гілці. Зробіть checkout гілки, що його містить, щоб змінити його тут."
# context: body of that dialog when no local branch holds the commit (only a remote branch, or none); {short} is the short commit id
body_none = "{short} немає в жодній локальній гілці. Створіть гілку на ньому, щоб змінити його тут."
# context: button, one per local branch that holds the commit; {branch} is the branch name. Width budget: 50 cells
checkout = "Checkout {branch} і змінити"
# context: button that opens the advanced history rewrite workbench on that commit. Width budget: 40 cells
rewrite = "Змінити через переписування історії"
# context: button that opens the name box to create a branch at that commit
create = "Створити гілку тут..."
# context: key of the advanced history rewrite button, one letter (shown as "Edit with advanced history rewrite (R)")
key_rewrite = "п"
# context: key of the Create a branch here button, one letter
key_create = "г"
# context: key of the Cancel button of that dialog, one letter
key_cancel = "с"
# context: status line when the checkout did not happen and the edit was dropped; {short} is the short commit id
gave_up = "{short} не змінено: checkout гілки не відбувся"

[branch_sync]
# context: title of the dialog asked before Pull all branches when a branch is checked out in another worktree
dlg_title = "{$Pull} усіх гілок"
# context: question of that dialog; the branches and their worktrees are listed under it
dlg_question = "Ці гілки відстають і відкриті в інших worktree:"
# context: one line of that list; {branch} is a branch, {path} the worktree folder
row = "{branch}  у  {path}"
# context: first answer: also fast-forward the other worktrees
opt_update = "Оновити й ці worktree"
# context: second answer: leave the other worktrees alone
opt_skip = "Пропустити їх"
# context: third answer: do not run
opt_cancel = "Скасувати"
# context: explanation under the highlighted first answer
detail_update = { git = "Для кожного worktree виконується fast-forward у його власній папці. Якщо оновлення перезапише в ньому локальні зміни, його залишають як є й повідомляють про це.", local = "Кожен worktree перемотується у власній папці. Якщо оновлення перезапише в ньому локальні зміни, його залишають як є й повідомляють про це." }
# context: explanation under the highlighted second answer
detail_skip = "Їх залишають як є й вказують у підсумку як пропущені."
# context: explanation under the highlighted third answer
detail_cancel = "Нічого не завантажується й не змінюється."
# context: key hints of that dialog
dlg_hint = "Вгору/Вниз або 1-3 - вибір, Enter - підтвердити, Esc - скасувати"
# context: last line of the list of that dialog when more branches exist than fit; {n} is how many
more = "і ще {n}"
