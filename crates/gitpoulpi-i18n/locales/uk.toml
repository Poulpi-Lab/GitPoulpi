[_meta]
language_name = "Українська"

# `git`: англійська лексика (типово). `local`: українська лексика git
# (налаштування «Перекладати терміни git»). Іменникові форми, щоб речення
# з {$term} читалися і з англійськими словами, і з українськими.
[term]
commit = { git = "commit", local = "коміт" }
commits = { git = "commits", local = "коміти" }
push = { git = "push", local = "надсилання" }
pull = { git = "pull", local = "отримання" }
fetch = { git = "fetch", local = "завантаження" }
merge = { git = "merge", local = "злиття" }
rebase = { git = "rebase", local = "перебазування" }
cherry_pick = { git = "cherry-pick", local = "cherry-pick" }
stash = { git = "stash", local = "схованка" }
stashes = { git = "stashes", local = "схованки" }
pop = { git = "pop", local = "повернути" }
apply = { git = "apply", local = "застосувати" }
stash_drop = { git = "drop", local = "видалити" }
tag = { git = "tag", local = "тег" }
tags = { git = "tags", local = "теги" }
head = { git = "HEAD", local = "HEAD" }
diff = { git = "diff", local = "різниця" }
pr = { git = { pull = "pull request", merge = "merge request" }, local = { pull = "запит на злиття", merge = "запит на злиття" } }
prs = { git = { pull = "pull requests", merge = "merge requests" }, local = { pull = "запити на злиття", merge = "запити на злиття" } }
pr_abbr = { git = { pull = "PR", merge = "MR" }, local = { pull = "PR", merge = "MR" } }
pick = { git = "pick", local = "взяти" }
reword = { git = "reword", local = "змінити опис" }
squash = { git = "squash", local = "об'єднати" }
fixup = { git = "fixup", local = "fixup" }
drop = { git = "drop", local = "відкинути" }
edit = { git = "edit", local = "змінити" }
stage = { git = "stage", local = "додати в індекс" }
unstage = { git = "unstage", local = "прибрати з індексу" }
staged = { git = "staged", local = "в індексі" }
unstaged = { git = "unstaged", local = "без індексу" }
staged_files = { git = "Файли staged", local = "Файли в індексі" }
unstaged_files = { git = "Файли unstaged", local = "Файли без індексу" }
push_noun = { git = "push", local = "надсилання" }
pull_noun = { git = "pull", local = "отримання" }
fetch_noun = { git = "fetch", local = "завантаження" }
merge_noun = { git = "merge", local = "злиття" }
rebase_noun = { git = "rebase", local = "перебазування" }

