merge_side_by_side_min_width = { git = "Редактор merge: поруч від (стовпців)", local = "Редактор злиття: поруч від (стовпців)" }
merge_side_by_side_min_width_help = { git = "Редактор конфліктів merge показує A і B поруч, коли його область має щонайменше стільки стовпців (довгі рядки прокручуються вбік Shift+колесо або Shift+стрілки); вужче - одна сторона за раз на вкладках. Типово 100; мінімум 40, 0 - завжди поруч. Редактор ховає панелі Refs і Status, поки відкритий, тож зазвичай має все вікно.", local = "Редактор конфліктів злиття показує A і B поруч, коли його область має щонайменше стільки стовпців (довгі рядки прокручуються вбік Shift+колесо або Shift+стрілки); вужче - одна сторона за раз на вкладках. Типово 100; мінімум 40, 0 - завжди поруч. Редактор ховає панелі Refs і Status, поки відкритий, тож зазвичай має все вікно." }
diff_word_wrap = "Перенесення слів"
