statusbar_position = "Розташування рядка стану"
statusbar_position_help = "Де розташований рядок стану (гілка, лічильники, повідомлення, підказки клавіш): Угорі, над вкладками репозиторіїв, або Внизу (типово). Вкладка Головна зберігає власний рядок стану внизу. Застосовується одразу."
tabs_position = "Розташування панелі вкладок"
tabs_position_help = "Де розташовані вкладки репозиторіїв: Угорі (типово), Внизу або Ліворуч, список з однією вкладкою в рядку біля лівого краю вікна. У вікні вужчому за 80 стовпців вони малюються вгорі. Поруч із панеллю інструментів-колонкою вкладки залишаються ззовні. Застосовується одразу."
graph_color_theme = "Колірна тема графа"
graph_color_theme_help = "Палітра кольорів доріжок графа Log. «Як у темі» бере палітру вибраної теми; будь-який інший пункт замінює її, тож будь-яку тему можна поєднати з будь-якою палітрою. Застосовується під час закриття налаштувань."
graph_renderer = "Рендерер графа"
graph_renderer_help = "auto малює граф справжнім зображенням у терміналі, що це підтримує, і символами в решті - зокрема в zellij і screen, які успадковують середовище терміналу, але не пропускають зображення, у tmux, якщо термінал за ним не приймає sixel, і в herdr, якщо не ввімкнено його kitty_graphics. image примусово вмикає картинку, text вимикає. Потрібен перезапуск."
image_protocol = "Протокол зображень"
image_protocol_help = "Як зображення (граф, аватари авторів) потрапляють у термінал. auto: графічний протокол Kitty у kitty, Ghostty і herdr, у конфігу якого kitty_graphics = true; протокол Kitty також в iTerm2 3.7.7 або новішому; вбудовані зображення iTerm2 у WezTerm, Rio, mintty і старішому iTerm2; зображення sixel (стовпець графа й аватари) у Windows Terminal, foot, Tabby, Konsole, mlterm і в tmux, якщо термінал за ним приймає sixel; символи деінде. kitty, iterm2 або sixel примусово задає протокол (kitty для herdr, чий конфіг лежить в іншому місці; sixel для термінала, що його малює, але не розпізнаний); none вимикає зображення. Потрібен перезапуск."
kitty_keyboard = "Клавіатурний протокол Kitty"
kitty_keyboard_help = "auto під час запуску й упродовж ~100 мс питає термінал, чи розуміє він клавіатурний протокол kitty, і використовує його, якщо так: комбінації, які старі термінали не розрізняють (Control із розділовими знаками, цифрами, Shift чи Enter), тоді приходять як є, а не збігаються з керівними кодами. Термінал, що не відповів, залишається зі старими клавішами. off ніколи не чіпає клавіатурний режим термінала. Потрібен перезапуск."
color_depth = "Глибина кольору"
color_depth_help = "auto використовує 24-бітний колір, крім терміналів, які його не показують (Apple Terminal, консоль Linux або 256-кольоровий термінал без COLORTERM): там кольори зводяться до найближчих із 256 або 16 значень. truecolor, 256 і 16 задають глибину примусово. Застосовується одразу."
text_cursor = "Текстовий курсор"
text_cursor_help = "terminal ставить власний курсор термінала на позицію вводу сфокусованого текстового поля у вигляді смужки: діють налаштування курсора вашого термінала, а вікно кандидатів методу введення відкривається біля позиції вводу. drawn малює власний курсор GitPoulpi (блок або підкреслення) і тримає курсор термінала прихованим. Застосовується одразу."
graph_show_stashes = { git = "Показувати stash'і в графі", local = "Показувати схованки в графі" }
graph_show_stashes_help = { git = "Кожен stash отримує власний рядок у Log за своєю датою: маленька коробка на доріжці поруч із commit'ом, на якому його створено, з'єднана з ним пунктирною лінією. Вибір показує, що він змінив; праве клацання (або .) пропонує Pop, Apply і Drop. Вимк. залишає stash'і лише в розділі STASHES. Не малюється в режимі solo.", local = "Кожна схованка отримує власний рядок у Log за своєю датою: маленька коробка на доріжці поруч із комітом, на якому її створено, з'єднана з ним пунктирною лінією. Вибір показує, що вона змінила; праве клацання (або .) пропонує «Повернути», «Застосувати» і «Видалити». Вимк. залишає схованки лише в розділі СХОВАНКИ. Не малюється в режимі solo." }
ref_connector = { git = "З'єднувач ref-commit", local = "З'єднувач ref-коміт" }
ref_connector_help = { git = "Тонка лінія від кожної мітки ref у стовпці Ref до кружечка її commit'у в графі. Заповнює лише порожнє місце: доріжки, які вона перетинає, залишаються зверху, і нічого не зсувається. Малюється, лише коли стовпець Ref одразу ліворуч від стовпця графа.", local = "Тонка лінія від кожної мітки ref у стовпці Ref до кружечка її коміту в графі. Заповнює лише порожнє місце: доріжки, які вона перетинає, залишаються зверху, і нічого не зсувається. Малюється, лише коли стовпець Ref одразу ліворуч від стовпця графа." }
log_wip_counts_in_message = "Показувати кількість змін WIP у повідомленні, коли стовпець Changes сховано"
log_wip_counts_in_message_help = { git = "Рядок WIP показує, скільки файлів змінено, додано й видалено. Коли стовпець Changes видимий (праве клацання на заголовку Log, щоб показати), лічильники завжди в ньому, як у кожного commit'у. Коли він схований, вони йдуть у повідомленні WIP, поки це ввімкнено; вимк. не показує лічильників узагалі.", local = "Рядок WIP показує, скільки файлів змінено, додано й видалено. Коли стовпець Changes видимий (праве клацання на заголовку Log, щоб показати), лічильники завжди в ньому, як у кожного коміту. Коли він схований, вони йдуть у повідомленні WIP, поки це ввімкнено; вимк. не показує лічильників узагалі." }
avatars = "Аватари авторів"
avatars_help = { git = "Зображення авторів. граф малює автора кожного commit'у всередині його кружечка в графі (лише графічний граф; у текстовому графі натомість у стовпці «Автор» з'являється кольоровий ініціал). автор ставить кругле зображення на початку стовпця «Автор». Обидва також показують його в панелі подробиць commit'у. Типово вимкнено: увімкнення надсилає SHA-256-хеш email кожного автора на gravatar.com через HTTPS - хеш відомої чи вгадуваної адреси не анонімний - і, у репозиторії з віддаленим github.com, один раз на автора питає API GitHub, який обліковий запис зробив один з їхніх commit'ів (з токеном вашої інтеграції GitHub, якщо є). Доки зображення не прийшло, чи коли його немає, показуються ініціали або просте коло. вимк. нічого не надсилає мережею.", local = "Зображення авторів. граф малює автора кожного коміту всередині його кружечка в графі (лише графічний граф; у текстовому графі натомість у стовпці «Автор» з'являється кольоровий ініціал). автор ставить кругле зображення на початку стовпця «Автор». Обидва також показують його в панелі подробиць коміту. Типово вимкнено: увімкнення надсилає SHA-256-хеш email кожного автора на gravatar.com через HTTPS - хеш відомої чи вгадуваної адреси не анонімний - і, у репозиторії з віддаленим github.com, один раз на автора питає API GitHub, який обліковий запис зробив один з їхніх комітів (з токеном вашої інтеграції GitHub, якщо є). Доки зображення не прийшло, чи коли його немає, показуються ініціали або просте коло. вимк. нічого не надсилає мережею." }
avatar_sources = "Джерела аватарів"
avatar_sources_help = { git = "Де шукати зображення автора, по черзі (адреса GitHub noreply завжди називає свій обліковий запис першою). hosting_gravatar: підключена інтеграція GitHub, GitLab чи Bitbucket, хост якої збігається з віддаленим репозиторієм (автор commit'у GitHub або пошук користувача, avatar-by-email чи users API GitLab), потім Gravatar; без відповідної підключеної інтеграції першим іде Gravatar, а віддалений github.com усе ж питається останнім, без автентифікації. gravatar_hosting: навпаки. gravatar або hosting: лише це одне. Коли зображення немає ніде, малюється резервний аватар нижче. Діє для авторів, яких ще не шукали.", local = "Де шукати зображення автора, по черзі (адреса GitHub noreply завжди називає свій обліковий запис першою). hosting_gravatar: підключена інтеграція GitHub, GitLab чи Bitbucket, хост якої збігається з віддаленим репозиторієм (автор коміту GitHub або пошук користувача, avatar-by-email чи users API GitLab), потім Gravatar; без відповідної підключеної інтеграції першим іде Gravatar, а віддалений github.com усе ж питається останнім, без автентифікації. gravatar_hosting: навпаки. gravatar або hosting: лише це одне. Коли зображення немає ніде, малюється резервний аватар нижче. Діє для авторів, яких ще не шукали." }
avatar_fallback = "Резервний аватар"
avatar_fallback_help = "Що отримує автор без зображення. identicon: симетричний візерунок 5x5 у стилі GitHub, колір якого походить від email автора; створюється локально (без мережі) і малюється як зображення в графічному терміналі або блоковими символами в іншому. ініціали: кольоровий значок з ініціалами."
composer_files = "Пропозиції композера"
composer_files_help = { git = "Як відкривається рецензія ШІ-композера commit'ів. розгорнуто: кожен запропонований commit показує свої файли. згорнуто: лише рядки commit'ів; Праворуч/Ліворуч (або клацання по стрілці) відкриває один.", local = "Як відкривається рецензія ШІ-композера комітів. розгорнуто: кожен запропонований коміт показує свої файли. згорнуто: лише рядки комітів; Праворуч/Ліворуч (або клацання по стрілці) відкриває один." }
blame_side = "Анотації Blame"
blame_side_help = "З якого боку у вигляді Blame розташована колонка анотацій (аватар, автор, вік, опис). right: праворуч від коду. left: ліворуч від коду."
column_resize = "Зміна ширини стовпців"
column_resize_help = "Як захоплюється межа стовпця в Log, Radar і бічному стовпці подань файлів. line: тонка лінія на всю висоту таблиці, поки курсор на межі, з маленькою позначкою в заголовку. header: без проміжку й позначки, ширину можна міняти лише із заголовка, де підсвічується перший символ наступної комірки."
blame_width = "Ширина анотацій Blame"
blame_width_help = "Ширина колонки анотацій у клітинках (від 24 до 90). Тягніть її межу у вигляді Blame або користуйтеся клавішами «ширше» / «вужче»; нова ширина зберігається тут."
ref_tree = "Дерево папок гілок"
ref_tree_help = "Бічна панель Refs групує назви гілок за `/` у згортні папки, а кожен віддалений репозиторій - окремий вузол верхнього рівня. Вимк. дає один плоский рядок на гілку. `y` на панелі Refs перемикає це наживо й записує вибір сюди."
tree_folders_first = "Папки першими в поданні дерева"
tree_folders_first_help = "У поданні дерева панелей файлів (Changes, деталі, порівняння) папка спершу перелічує свої підпапки, а потім файли. Вимк. залишає звичайний алфавітний порядок шляхів. Плоский список не змінюється."
reveal_on_ref_click = "Клацання по ref показує його в графі"
reveal_on_ref_click_help = "Одинарне клацання по ref на панелі Refs прокручує Log до місця, куди він вказує, і ненадовго підсвічує рядок. Вибір у Log і права панель не змінюються. Якщо вимкнено, клацання лише виділяє рядок бічної панелі. «Показати в графі» в меню ref, його клавіша на панелі Refs і команда палітри працюють в обох випадках."
graph_ghost_ref = "Показувати підказку гілки на {$commit} під курсором"
graph_ghost_ref_help = "У стовпці Ref журналу {$commit} під курсором, що не має власного ref, показує блідий значок із назвою гілки, до якої він належить (інакше віддаленої гілки), виведеною з історії. Якщо навести курсор на значок, видно його тип. Клацання по ньому нічого особливого не робить; гілку створює команда створення гілки. Малюється, лише якщо у стовпці Ref вистачає місця. Вимкнено: не показується."
mouse_enabled = "Миша ввімкнена"
mouse_enabled_help = "Вимк. залишає виділення перетягуванням вашому терміналу. Потрібен перезапуск."
mouse_scroll_lines = "Рядків за крок колеса миші"
mouse_scroll_lines_help = { git = "На скільки commit'ів зсувається Log за один крок колеса. Потрібен перезапуск.", local = "На скільки комітів зсувається Log за один крок колеса. Потрібен перезапуск." }
heading_date_time = "Дата й час"
heading_layout = "Розташування"
date_locale = "Локаль дати/часу"
date_locale_help = "системна: назви місяців і днів відповідають мові інтерфейсу. english: завжди англійські назви, незалежно від мови. Діє для всіх дат на цій сторінці."
diff_layout = "Типовий вигляд"
diff_layout_help = { git = "Єдиний (один стовпець) або поруч (до і після пліч-о-пліч). Відновлюється з останнього diff, який ви переглядали, у цьому вікні та між запусками - зміна тут лише задає, з чого починається *нова* сесія.", local = "Єдиний (один стовпець) або поруч (до і після пліч-о-пліч). Відновлюється з останньої різниці, яку ви переглядали, у цьому вікні та між запусками - зміна тут лише задає, з чого починається *нова* сесія." }
diff_hunks_only = "Лише hunks"
diff_hunks_only_help = "Увімк. показує лише змінені hunks із кількома рядками контексту; вимк. показує весь файл зі змінами, підсвіченими на місці. Відновлюється як розкладка."
diff_show_whitespace = "Показувати зміни лише пробілів"
diff_show_whitespace_help = "Вимк. згортає hunk, що відрізняється лише пробілами, до контексту."
input_color = "Колір полів введення"
input_color_help = "Тло текстових полів. «Як у темі» (типово) бере колір теми; решта - темні кольори, що його замінюють. «Власний...» бере hex-колір нижче. Застосовується наживо, без перезапуску."
input_color_custom = "Власний колір полів введення"
input_color_custom_help = "#rrggbb, використовується, коли колір полів введення - «Власний...». Застосовується наживо."
minimap = "Мінікарта"
minimap_help = { git = "Зображення всього файлу біля вертикальної смуги прокрутки diff (режим усього файлу) і редактора, видима частина підсвічена; клацання переходить туди. Справжнє зображення, де термінал їх малює, клітинки Брайля деінде. Також `M` у diff та «Вигляд: показати чи сховати мінікарту» в палітрі.", local = "Зображення всього файлу біля вертикальної смуги прокрутки різниці (режим усього файлу) і редактора, видима частина підсвічена; клацання переходить туди. Справжнє зображення, де термінал їх малює, клітинки Брайля деінде. Також `M` у різниці та «Вигляд: показати чи сховати мінікарту» в палітрі." }
date_format = "Формат дати"
date_format_help = "Стовпець дати Blame / Історія файлу."
date_time_format = "Формат дати/часу"
date_time_format_help = "Сам стовпець Date у Log."
date_verbose_format = "Докладний формат дати"
date_verbose_format_help = { git = "Рядок Date панелі подробиць commit'у, підказка стовпця Date при наведенні та Copy > Date.", local = "Рядок Date панелі подробиць коміту, підказка стовпця Date при наведенні та Copy > Date." }
preview = "перегляд"
sidebar_sections_scope = "Розділи лівої панелі"
sidebar_sections_scope_help = "Чий вибір визначає, які розділи лівої панелі показано чи сховано. repository: кожен репозиторій має власний набір (глобальний править за початковий). global: один набір для всіх репозиторіїв. Перемикання не втрачає жодного з наборів."
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "Розкладка стовпців"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "Як Log розкладає свої стовпці. fit: кожен стовпець вміщується в панель, розтягується лише Повідомлення. scroll: стовпці зберігають свою ширину, Повідомлення теж, а таблиця прокручується вбік, коли вона ширша за панель."

[settings_git]
default_backend = "Бекенд git"
default_backend_help = "Глобально. Запущений демон залишається з бекендом, з яким стартував."
default_backend_warning = "Діє для демонів, запущених після цієї зміни."
pull_mode = { git = "Кнопка Pull", local = "Кнопка «Отримати»" }
default_encoding = "Типове кодування"
default_encoding_help = { git = "Використовується для показу вмісту файлів, blame і diff, що не є коректним UTF-8 (коректний UTF-8 ніколи не перекодовується). Репозиторій може перевизначити його нижче. Лише показ: staging й патчі зберігають байти файлу точно.", local = "Використовується для показу вмісту файлів, blame і різниці, що не є коректним UTF-8 (коректний UTF-8 ніколи не перекодовується). Репозиторій може перевизначити його нижче. Лише показ: індексація й патчі зберігають байти файлу точно." }
push_behavior = { git = "Кнопка Push", local = "Кнопка «Надіслати»" }
push_behavior_help = { git = "одразу: push одразу на типовий віддалений репозиторій. питати: відкрити невелике меню з наперед вибраним типовим віддаленим. ▾ кнопки завжди питає.", local = "одразу: надсилання одразу на типовий віддалений репозиторій. питати: відкрити невелике меню з наперед вибраним типовим віддаленим. ▾ кнопки завжди питає." }
repo_encoding_help = { git = "Як декодується вміст файлів, blame і diff для показу, коли вони не є коректним UTF-8 (лише цей репозиторій; inherited: «Типове кодування» на цій сторінці). Staging нічого не перекодовує.", local = "Як декодується вміст файлів, blame і різниця для показу, коли вони не є коректним UTF-8 (лише цей репозиторій; inherited: «Типове кодування» на цій сторінці). Індексація нічого не перекодовує." }
core_autocrlf_help = "Записується в git-конфігурацію цього репозиторію (core.autocrlf), тож її бачать git і всі інші інструменти. true: LF у CRLF під час checkout; input: CRLF у LF лише під час збереження в історію; false: не перетворювати. (успадковано): видаляє значення репозиторію, щоб діяла ваша глобальна git-конфігурація. Можна скасувати."
core_eol_help = "Записується в git-конфігурацію цього репозиторію (core.eol): закінчення рядків, яке git використовує для текстових файлів у робочому дереві (lf, crlf або native, тобто платформне). (успадковано): видаляє значення репозиторію, щоб діяла ваша глобальна git-конфігурація. Можна скасувати."
git_lfs = "Git LFS"
git_lfs_help = { git = "Показувати Git LFS в інтерфейсі (tag LFS, картка diff, банер відсутньої програми, команди LFS) і дозволити GitPoulpi виконувати власні кроки LFS (завантаження об'єктів після клонування). Вимк.: власні фільтри LFS у git усе одно працюють, GitPoulpi сам git-lfs не викликає.", local = "Показувати Git LFS в інтерфейсі (тег LFS, картка різниці, банер відсутньої програми, команди LFS) і дозволити GitPoulpi виконувати власні кроки LFS (завантаження об'єктів після клонування). Вимк.: власні фільтри LFS у git усе одно працюють, GitPoulpi сам git-lfs не викликає." }
git_lfs_program = "Програма git-lfs"
git_lfs_program_help = "Встановіть з https://git-lfs.com (Windows: входить до Git for Windows або `winget install GitHub.GitLFS`; Debian/Ubuntu: `apt install git-lfs`; macOS: `brew install git-lfs`). Палітра: «LFS: відкрити сторінку встановлення»."
initialize_lfs_for_this_repository = "Ініціалізувати LFS для цього репозиторію"
initialize_lfs_for_this_repository_help = "Виконує `git lfs install --local`: фільтри й хуки LFS у власному конфігу цього репозиторію, ніколи не глобальному. Потрібен git-lfs."
pull_mode_help = { git = "Що робить кнопка {$Pull}{hint} на панелі: merge (fast-forward, якщо можливо), ff_only або rebase. Пункти ▾ кнопки виконують власну дію одразу й цього вибору не змінюють.", local = "Що робить кнопка «Отримати»{hint} на панелі: злиття (fast-forward, якщо можливо), ff_only або перебазування. Пункти ▾ кнопки виконують власну дію одразу й цього вибору не змінюють." }
merge_fast_forward = { git = "{$Merge}: fast-forward", local = "{$Merge}: перемотування" }
merge_fast_forward_help = "Як обробляється гілка, яку можна просто перемотати (fast-forward), коли ви запускаєте {$merge} (меню гілки, перетягування, палітра, командний рядок). never: завжди створювати {$commit} {$merge}. allowed: fast-forward, коли можливо, як git робить типово. only: лише fast-forward, інакше відмова. Репозиторій може змінити це на своїй сторінці «Опції {$merge}»."
repo_heading = "Репозиторій: {repo} - лише цей репозиторій"
inherited = "(успадковано)"
lfs_not_checked = "(ще не перевірено)"
lfs_autofix_filters = { git = "Встановлювати фільтри LFS перед {$pull} і {$push}", local = "Встановлювати фільтри LFS перед отриманням і надсиланням" }
lfs_autofix_filters_help = { git = "Перед {$pull} або {$push} у репозиторії з Git LFS запускає `git lfs install --local`, якщо його фільтрів або хуків LFS немає (лише у власній конфігурації репозиторію, не в глобальній), щоб передавання опрацювало великі файли. Рядок стану повідомить, якщо це сталося. Потрібен git-lfs.", local = "Перед отриманням або надсиланням у репозиторії з Git LFS запускає `git lfs install --local`, якщо його фільтрів або хуків LFS немає (лише у власній конфігурації репозиторію, не в глобальній), щоб передавання опрацювало великі файли. Рядок стану повідомить, якщо це сталося. Потрібен git-lfs." }
push_group_preflight = "Перевіряти всі remote перед {$push}"
push_group_preflight_help = "Перед {$push} гілки, що має додаткові цілі {$push}, спершу переглядає кожен remote (швидкий запит, а завантаження з remote лише коли він відрізняється), тож проблему на третьому remote видно ще до початку першого {$push}. Вимкнено: {$push} на кожен remote по черзі та звіт про результат."
default_push_targets = "Додаткові цілі {$push} для нових гілок"
default_push_targets_help = "Лише цей репозиторій. Позначте remote, на які нова гілка також робить {$push}, крім свого upstream. Їх копіюють у гілку, коли вона вперше отримує upstream (перший {$push}, що його задає, або гілка, створена з віддаленої гілки). Наявні гілки не змінюються: змініть їх у діалозі «Remote гілки» цієї гілки."
default_push_targets_none = "(remote не налаштовано)"

