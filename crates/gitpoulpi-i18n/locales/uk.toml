# context: label of the setting that decides whether a dialog the user moved or resized keeps its place
dialog_geometry = "Запам'ятовувати позицію й розмір діалогів"
dialog_geometry_help = "Одне налаштування для всіх діалогів. Діалоги можна пересувати (перетягніть рядок заголовка або Ctrl+N, потім m); більші вікна можна й змінювати в розмірі (перетягніть межі та нижні кути). Кожен діалог пам'ятає власне місце й розмір. На цей сеанс (типово): зберігається, доки GitPoulpi не закриють. Збережено на диск: зберігається й до наступного запуску. Ніколи: кожен діалог відкривається на типовому місці й з типовим розміром. Застосовується одразу."
toolbar_pr_pinned = "Закріпити кнопку {$pr} в кінці"
