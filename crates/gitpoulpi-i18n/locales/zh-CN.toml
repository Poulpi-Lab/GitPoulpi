proxy = "位于隧道或反向代理之后"
# context: help under that switch
proxy_help = "当端点前面的隧道或代理会加密流量时开启。服务器无法验证这一点，因此这是你的声明。它允许非回环地址在没有 TLS 的情况下运行。保留回环地址并使用 ssh -L 更安全。"
# context: red warning shown while that switch is on
proxy_warning = "没有 TLS 时，隧道或代理与服务器之间的这一跳在该网络上是明文。"

