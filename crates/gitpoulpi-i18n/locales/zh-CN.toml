# context: label of the row that shows the access token of the MCP HTTP endpoint
token = "访问令牌"
# context: value of the access token row when no token has been made yet
token_none = "（尚无）"
# context: help under the access token row
token_help = "客户端以 Authorization: Bearer 加令牌的形式发送。它保存在只有你能读取的文件中。新令牌立即生效：持有旧令牌的客户端会被拒绝。"
# context: button that reveals the access token on screen
show = "显示"
# context: button that hides the access token again
hide = "隐藏"
# context: button that copies the access token to the clipboard
copy = "复制"
# context: button that replaces the access token with a new one
rotate = "更换"
# context: button that makes the first access token when there is none
create = "创建"
# context: status line after the access token was copied; the token itself is never shown there
token_copied = "访问令牌已复制到剪贴板。"
# context: status line after the access token was replaced
token_rotated = "访问令牌已更换。"
# context: status line when the access token file could not be written; {reason} is the system error
