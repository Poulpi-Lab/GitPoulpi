# S23: what the host protects, and the three ways through it. Never done
# automatically: these are instructions. The git words are terms ({$push},
# {$tag}, {$prs}) so "Translate git terms" works here too; the exact commands
# are in the English CLI text, not here.
[rewrite_host]
protected_on = "在 {provider} 上受保护"
btn_howto = "如何通过"
title = "如何通过主机的分支保护"
intro = "主机拒绝了 {names} 的重写后历史，因为 {provider} 对它做了保护。GitPoulpi 绝不会替你更改主机的设置；有三种办法，从影响最小到最激进依次如下。"
unknown = "无法读取主机的保护设置：{why}"
not_asked = "此仓库没有关联主机，因此没有读取其保护设置。请在侧边栏中关联它，以查看哪些分支受保护。"
refs_unknown = "主机保护情况未知：{why}"
any_branch = "受保护的分支"
way_lift = "1. 在主机的设置中临时解除保护"
way_rename = { git = "2. 以新的分支名 {$push} 重写后的分支，再切换默认分支", local = "2. 以新的分支名{$push}重写后的分支，再切换默认分支" }
way_recreate = "3. 最后手段：删除并重建远程仓库"
step_lift_github = { git = "打开仓库的 Settings > Branches（分支保护规则）和 Settings > Rules（规则集），移除或放宽覆盖该分支的规则，{$push} 重写结果，然后把规则恢复。", local = "打开仓库的 Settings > Branches（分支保护规则）和 Settings > Rules（规则集），移除或放宽覆盖该分支的规则，{$push}重写结果，然后把规则恢复。" }
step_lift_gitlab = "打开 Settings > Repository > Protected branches，取消该分支的保护（或开启允许重写其历史的选项），待重写结果发送完毕后再重新保护。"
step_lift_azure = { git = "打开 Project settings > Repositories > 该仓库 > Policies，移除该分支上的分支策略；在 Security 下授予自己重写历史和删除分支的权限，{$push} 重写结果，然后把两者都恢复。", local = "打开 Project settings > Repositories > 该仓库 > Policies，移除该分支上的分支策略；在 Security 下授予自己重写历史和删除分支的权限，{$push}重写结果，然后把两者都恢复。" }
step_lift_bitbucket = { git = "打开仓库的 settings > Branch restrictions（Data Center 上为 Branch permissions），移除覆盖该分支的限制，{$push} 重写结果，然后恢复它。", local = "打开仓库的 settings > Branch restrictions（Data Center 上为 Branch permissions），移除覆盖该分支的限制，{$push}重写结果，然后恢复它。" }
step_lift_other = { git = "在主机的仓库设置中移除或放宽分支保护规则，{$push} 重写结果，然后恢复该规则。", local = "在主机的仓库设置中移除或放宽分支保护规则，{$push}重写结果，然后恢复该规则。" }
step_push_new_name = { git = "把重写结果 {$push} 到一个不受保护的分支，使用新名称（GitPoulpi 不会动受保护的引用）。", local = "把重写结果{$push}到一个不受保护的分支，使用新名称（GitPoulpi 不会动受保护的引用）。" }
step_switch_github = "然后在 Settings > Branches 中把新分支设为默认分支（也可先用 Settings > Branches > 铅笔图标 > Rename 重命名旧分支），并在没人再用旧分支后将其删除。"
step_switch_gitlab = "然后在 Settings > Repository > Branch defaults 中把新分支设为默认分支，并在没人再用旧分支后将其删除（Code > Branches）。"
step_switch_azure = "然后在 Repos > Branches 中打开新分支的菜单 > Set as default branch，并在没人再用旧分支后将其删除。"
step_switch_bitbucket = "然后在仓库的 settings > Repository details 中把新分支设为主分支（Data Center 上为默认分支），并在没人再用旧分支后将其删除。"
step_switch_other = "然后在主机的仓库设置中把新分支设为默认分支，并在没人再用旧分支后将其删除。"
step_recreate = { git = "在设置中删除远程仓库，创建一个同名的空仓库，然后 {$push} 每个分支和每个 {$tag}。所有人都必须重新克隆。", local = "在设置中删除远程仓库，创建一个同名的空仓库，然后{$push}每个分支和每个{$tag}。所有人都必须重新克隆。" }
