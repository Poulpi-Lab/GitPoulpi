avatars = "作者头像"
avatars_help = { git = "作者图片。graph 在图中每个 {$commit} 的圆圈内绘制其作者（仅限图像图；文本图则在作者列放置彩色首字母）。author 在作者列开头放置一张圆形图片。两者也会显示在 {$commit} 详情窗格中。默认关闭：开启后会通过 HTTPS 将每位作者邮箱地址的 SHA-256 哈希发送到 gravatar.com - 已知或可猜测地址的哈希并非匿名 - 并且在有 github.com 远程的仓库中，会就每位作者向 GitHub API 查询一次其某个 {$commit} 是由哪个账户 {$commit} 的（若有 GitHub 集成的令牌则会使用）。图片到达之前，以及没有图片时，会显示首字母或纯圆圈。off 不通过网络发送任何内容。", local = "作者图片。graph 在图中每个提交的圆圈内绘制其作者（仅限图像图；文本图则在作者列放置彩色首字母）。author 在作者列开头放置一张圆形图片。两者也会显示在提交详情窗格中。默认关闭：开启后会通过 HTTPS 将每位作者邮箱地址的 SHA-256 哈希发送到 gravatar.com - 已知或可猜测地址的哈希并非匿名 - 并且在有 github.com 远程的仓库中，会就每位作者向 GitHub API 查询一次其某个提交是由哪个账户提交的（若有 GitHub 集成的令牌则会使用）。图片到达之前，以及没有图片时，会显示首字母或纯圆圈。off 不通过网络发送任何内容。" }
avatar_sources = "头像来源"
avatar_sources_help = { git = "按顺序查找作者图片的位置（GitHub noreply 地址总是先指明其账户）。hosting_gravatar：与仓库远程主机匹配的已连接 GitHub、GitLab 或 Bitbucket 集成（GitHub {$commit} 作者或用户搜索，GitLab 按邮箱查头像或用户 API），然后是 Gravatar；若没有匹配的集成连接，则 Gravatar 优先，github.com 远程仍会在最后以未认证方式查询。gravatar_hosting：相反。gravatar 或 hosting：仅用其中一个。都没有图片时，绘制下面的头像回退样式。对尚未查找的作者生效。", local = "按顺序查找作者图片的位置（GitHub noreply 地址总是先指明其账户）。hosting_gravatar：与仓库远程主机匹配的已连接 GitHub、GitLab 或 Bitbucket 集成（GitHub 提交作者或用户搜索，GitLab 按邮箱查头像或用户 API），然后是 Gravatar；若没有匹配的集成连接，则 Gravatar 优先，github.com 远程仍会在最后以未认证方式查询。gravatar_hosting：相反。gravatar 或 hosting：仅用其中一个。都没有图片时，绘制下面的头像回退样式。对尚未查找的作者生效。" }
avatar_fallback = "头像回退"
avatar_fallback_help = "没有图片的作者使用的样式。identicon：GitHub 风格的 5x5 镜像图案，颜色由其邮箱派生，在本地生成（无需网络），图像终端中为图片，其他终端中为方块字符。initials：带有其首字母的彩色徽章。"
composer_files = "撰写器提议"
composer_files_help = { git = "AI {$commit} 撰写器评审界面的打开方式。expanded：每个提议的 {$commit} 都列出其文件。collapsed：只显示 {$commit} 行；按 Right/Left（或点击箭头）展开一项。", local = "AI 提交撰写器评审界面的打开方式。expanded：每个提议的提交都列出其文件。collapsed：只显示提交行；按 Right/Left（或点击箭头）展开一项。" }
blame_side = { git = "Blame 注释", local = "追溯注释" }
blame_side_help = { git = "Blame 视图中注释列（头像、作者、时间、摘要）所在的一侧。right：代码右侧。left：代码左侧。", local = "追溯视图中注释列（头像、作者、时间、摘要）所在的一侧。right：代码右侧。left：代码左侧。" }
column_resize = "列宽调整"
column_resize_help = "在 Log、Radar 和文件视图侧边列中如何抓取列边界。line：指针位于边界上时，在表格全高范围内显示一条细线，表头中带一个小刻度。header：没有间隙和刻度，只能在表头调整，下一个单元格的第一个字符会亮起。"
blame_width = { git = "Blame 注释宽度", local = "追溯注释宽度" }
blame_width_help = { git = "注释列的宽度，以单元格计（24 到 90）。在 Blame 视图中拖动其边框，或使用加宽 / 收窄键；新宽度会保存在这里。", local = "注释列的宽度，以单元格计（24 到 90）。在追溯视图中拖动其边框，或使用加宽 / 收窄键；新宽度会保存在这里。" }
ref_tree = "分支文件夹树"
ref_tree_help = "引用侧栏按 `/` 将分支名分组为可折叠的文件夹，每个远程作为单独的顶级节点。关闭则每个分支占一行平铺显示。引用窗格中按 `y` 可实时切换并将选择写入此处。"
reveal_on_ref_click = "点击引用时在图中定位"
reveal_on_ref_click_help = "在 Refs 窗格中点击一个引用，Log 会滚动到它所指的位置并让该行短暂闪烁。Log 中的选择和右侧面板保持不变。关闭后，点击只会选中侧栏中的行。引用菜单中的“在图中定位”、Refs 窗格中的按键和命令面板命令在两种设置下都可用。"
graph_ghost_ref = { git = "在悬停的 {$commit} 上显示虚影分支", local = "在悬停的{$commit}上显示虚影分支" }
graph_ghost_ref_help = { git = "在 Log 的引用列中，没有自身引用的悬停 {$commit} 会显示一个淡色药丸，内含它所属分支（否则为远程分支）的名称，由历史推断得出。悬停在药丸上会显示其类型。点击它不会有特别的效果；创建分支请使用“创建分支”命令。仅在引用列有空间时才绘制。关闭则隐藏。", local = "在 Log 的引用列中，没有自身引用的悬停{$commit}会显示一个淡色药丸，内含它所属分支（否则为远程分支）的名称，由历史推断得出。悬停在药丸上会显示其类型。点击它不会有特别的效果；创建分支请使用“创建分支”命令。仅在引用列有空间时才绘制。关闭则隐藏。" }
mouse_enabled = "启用鼠标"
mouse_enabled_help = "关闭后，拖动选择交给终端处理。需重启。"
mouse_scroll_lines = "鼠标滚轮行数"
mouse_scroll_lines_help = { git = "滚轮每滚一格在 Log 中移动多少个 {$commit}。需重启。", local = "滚轮每滚一格在 Log 中移动多少个提交。需重启。" }
heading_date_time = "日期和时间"
heading_layout = "布局"
date_locale = "日期/时间区域"
date_locale_help = "system：月份和星期名称跟随界面语言。english：始终使用英文名称，不论界面语言。适用于本页所有日期。"
diff_layout = "默认布局"
diff_layout_help = { git = "内联（一列）或分栏（前后并排）。沿用你上次查看的 {$diff} 的设置，在此窗口中和重启后均如此 - 在此更改只会设置“新”会话的起点。", local = "内联（一列）或分栏（前后并排）。沿用你上次查看的{$diff}的设置，在此窗口中和重启后均如此 - 在此更改只会设置“新”会话的起点。" }
diff_hunks_only = { git = "仅显示 hunk", local = "仅显示代码块" }
diff_hunks_only_help = { git = "开启时只显示有改动的 hunk 及少量上下文；关闭时显示整个文件，并就地高亮改动。与布局一样沿用上次设置。", local = "开启时只显示有改动的代码块及少量上下文；关闭时显示整个文件，并就地高亮改动。与布局一样沿用上次设置。" }
diff_show_whitespace = "显示仅空白字符的更改"
diff_show_whitespace_help = { git = "关闭时，仅空白字符不同的 hunk 会折叠为上下文。", local = "关闭时，仅空白字符不同的代码块会折叠为上下文。" }
input_color = "输入框颜色"
input_color_help = "文本输入框的背景。“跟随主题”（默认）使用主题自身的颜色；其他为覆盖它的深色。“自定义…”使用下面的十六进制颜色。实时生效，无需重启。"
input_color_custom = "自定义输入框颜色"
input_color_custom_help = "#rrggbb，在输入框颜色为“自定义…”时使用。实时生效。"
minimap = "缩略图"
minimap_help = { git = "在 {$diff}（整个文件模式）和编辑器的垂直滚动条旁显示整个文件的缩略图，可见部分高亮；点击可跳转。终端能绘制图像时为真实图像，否则使用盲文字符。也可在 {$diff} 中按 `M`，或使用命令面板的“切换缩略图”。", local = "在{$diff}（整个文件模式）和编辑器的垂直滚动条旁显示整个文件的缩略图，可见部分高亮；点击可跳转。终端能绘制图像时为真实图像，否则使用盲文字符。也可在{$diff}中按 `M`，或使用命令面板的“切换缩略图”。" }
date_format = "日期格式"
date_format_help = { git = "Blame / 文件历史的日期列。", local = "追溯 / 文件历史的日期列。" }
date_time_format = "日期/时间格式"
date_time_format_help = "Log 的日期列本身。"
date_verbose_format = "日期详细格式"
date_verbose_format_help = { git = "{$commit} 详情面板的日期行、日期列的悬停提示，以及“复制 > 日期”。", local = "提交详情面板的日期行、日期列的悬停提示，以及“复制 > 日期”。" }
preview = "预览"
sidebar_sections_scope = "左侧窗格分区"
sidebar_sections_scope_help = "左侧窗格中显示或隐藏的分区由谁决定。repository：每个仓库各自保存一套（全局设置是它的起点）。global：所有仓库共用一套。来回切换不会丢失任何一套。"
# context: a Settings row; how the Log lays its columns out
log_columns_layout = "列布局"
# context: help text of the Log column layout row; "fit" and "scroll" are the two choices
log_columns_layout_help = "Log 各列的布局方式。fit：所有列都适应窗格，只有消息列伸缩。scroll：各列保持宽度（消息列也是），表格比窗格宽时可横向滚动。"

[settings_git]
default_backend = "Git 后端"
default_backend_help = "全局设置。正在运行的守护进程保持其启动时的后端。"
default_backend_warning = "对此更改之后启动的守护进程生效。"
pull_mode = { git = "{$Pull} 按钮", local = "{$Pull}按钮" }
default_encoding = "默认编码"
default_encoding_help = { git = "用于显示非有效 UTF-8 的文件内容、blame 和 {$diff}（有效的 UTF-8 绝不会重新解码）。仓库可在下方覆盖此设置。仅影响显示：{$stage} 和补丁保持文件的原始字节。", local = "用于显示非有效 UTF-8 的文件内容、追溯和{$diff}（有效的 UTF-8 绝不会重新解码）。仓库可在下方覆盖此设置。仅影响显示：暂存和补丁保持文件的原始字节。" }
push_behavior = { git = "{$Push} 按钮", local = "{$Push}按钮" }
push_behavior_help = { git = "direct：立即 {$push} 到默认远程。ask：打开一个小菜单，并预选默认远程。按钮的 ▾ 总是询问。", local = "direct：立即{$push}到默认远程。ask：打开一个小菜单，并预选默认远程。按钮的 ▾ 总是询问。" }
repo_encoding_help = { git = "非有效 UTF-8 的文件内容、blame 和 {$diff} 的显示解码方式（仅此仓库；inherited：沿用本页的默认编码）。{$stage} 绝不会重新编码任何内容。", local = "非有效 UTF-8 的文件内容、追溯和{$diff}的显示解码方式（仅此仓库；inherited：沿用本页的默认编码）。暂存绝不会重新编码任何内容。" }
core_autocrlf_help = "写入此仓库的 git 配置（core.autocrlf），因此 git 和其他工具都能看到。true：检出时 LF 转 CRLF；input：仅在存入历史记录时 CRLF 转 LF；false：从不转换。（继承）：移除仓库级的值，改用你的全局 git 配置。可撤销。"
core_eol_help = "写入此仓库的 git 配置（core.eol）：git 在工作区文本文件中使用的换行符（lf、crlf，或 native 表示平台默认）。（继承）：移除仓库级的值，改用你的全局 git 配置。可撤销。"
git_lfs = "Git LFS"
git_lfs_help = { git = "在界面中显示 Git LFS（LFS {$tag}、{$diff} 卡片、缺少程序的横幅、LFS 命令），并让 GitPoulpi 运行自己的 LFS 步骤（克隆后下载对象）。关闭：git 自带的 LFS 过滤器仍会运行，GitPoulpi 绝不会自行调用 git-lfs。", local = "在界面中显示 Git LFS（LFS 标记、{$diff}卡片、缺少程序的横幅、LFS 命令），并让 GitPoulpi 运行自己的 LFS 步骤（克隆后下载对象）。关闭：git 自带的 LFS 过滤器仍会运行，GitPoulpi 绝不会自行调用 git-lfs。" }
git_lfs_program = "git-lfs 程序"
git_lfs_program_help = "从 https://git-lfs.com 安装（Windows：随 Git for Windows 附带，或 `winget install GitHub.GitLFS`；Debian/Ubuntu：`apt install git-lfs`；macOS：`brew install git-lfs`）。命令面板：LFS：打开安装页面。"
initialize_lfs_for_this_repository = "为此仓库初始化 LFS"
initialize_lfs_for_this_repository_help = "运行 `git lfs install --local`：将 LFS 过滤器和钩子写入此仓库自己的配置，绝不写入全局配置。需要 git-lfs。"
pull_mode_help = { git = "工具栏的 {$Pull}{hint} 的行为：{$merge}（可能时快进）、ff_only 或 {$rebase}。按钮 ▾ 菜单中的各项会立即执行各自的操作，不会改变此设置。", local = "工具栏的{$Pull}{hint} 的行为：{$merge}（可能时快进）、ff_only 或{$rebase}。按钮 ▾ 菜单中的各项会立即执行各自的操作，不会改变此设置。" }
repo_heading = "仓库：{repo} - 仅此仓库"
inherited = "（继承）"
lfs_not_checked = "（尚未检查）"
lfs_autofix_filters = { git = "在 {$pull} 和 {$push} 之前安装 LFS 过滤器", local = "在{$pull}和{$push}之前安装 LFS 过滤器" }
lfs_autofix_filters_help = { git = "在使用 Git LFS 的仓库中 {$pull} 或 {$push} 之前，如果缺少 LFS 过滤器或钩子，就运行 `git lfs install --local`（只改该仓库自己的配置，绝不改全局配置），让传输能处理大文件。状态栏会提示。需要 git-lfs。", local = "在使用 Git LFS 的仓库中{$pull}或{$push}之前，如果缺少 LFS 过滤器或钩子，就运行 `git lfs install --local`（只改该仓库自己的配置，绝不改全局配置），让传输能处理大文件。状态栏会提示。需要 git-lfs。" }

