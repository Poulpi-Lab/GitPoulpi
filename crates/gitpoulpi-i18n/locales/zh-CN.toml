[mcp_security]
# context: heading in Settings > Agents & MCP above the rows that protect the MCP HTTP endpoint
heading = "MCP HTTP 端点安全"
# context: label of a switch in Settings > Agents & MCP; the MCP server's HTTP endpoint asks clients for an access token
auth = "HTTP 身份验证"
# context: help under the HTTP authentication switch
auth_help = "对 MCP HTTP 端点（gitpoulpi mcp serve --http）的请求必须带上访问令牌。服务器下次启动时生效。"
# context: red warning shown while HTTP authentication is off
