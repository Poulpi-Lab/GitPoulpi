image_protocol_help = "图片（图的图像、作者头像）传送到终端的方式。auto：kitty、Ghostty 以及配置中设置了 kitty_graphics = true 的 herdr 中使用 Kitty 图形协议；WezTerm、iTerm2 和 mintty 中使用 iTerm2 内嵌图像；Windows Terminal、foot、Konsole 和 mlterm 中使用 sixel 图片（仅用于作者头像，图仍用字符）；其他情况使用字符。kitty、iterm2 或 sixel 强制使用该协议（kitty 适用于配置位于别处的 herdr；sixel 适用于能绘制 sixel 但未被识别的终端）；none 关闭图片。需重启。"
kitty_keyboard = "Kitty 键盘协议"
kitty_keyboard_help = "auto 会在启动时询问终端（约 100 毫秒内）是否支持 kitty 键盘协议，支持就使用：传统终端无法区分的组合键（Control 加标点、数字、Shift 或 Enter）将按其本来面目送达，而不是与控制码冲突。不应答的终端保持传统按键。off 绝不改动终端的键盘模式。需重启。"
color_depth = "色深"
color_depth_help = "auto 使用 24 位色，但在不支持的终端（Apple 终端、Linux 控制台，或未声明 COLORTERM 的 256 色终端）上，会把颜色映射到最接近的 256 色或 16 色。truecolor、256 和 16 强制指定色深。立即生效。"
graph_show_stashes = { git = "在图中显示 {$stash}", local = "在图中显示{$stash}" }
