tls = "TLS"
# context: help under the TLS choice
tls_help = "加密 HTTP 端点；服务器自己终结 TLS，因此明文连接会被拒绝。“自签名”会一次性生成证书并显示其指纹供客户端核对。“文件”使用下面的证书和密钥。服务器下次启动时生效。"
# context: TLS choice: no encryption
tls_off = "关闭"
# context: TLS choice: the server makes its own certificate
tls_self_signed = "自签名"
# context: TLS choice: the user supplies a certificate and a key file
tls_files = "文件"
# context: label of a path field in Settings > Agents & MCP: the TLS certificate file
tls_cert = "证书路径"
# context: help under the certificate path
tls_cert_help = "包含证书链的 PEM 文件。TLS 设为“文件”时使用。"
# context: label of a path field in Settings > Agents & MCP: the TLS private key file
tls_key = "密钥路径"
# context: help under the key path
tls_key_help = "包含私钥的 PEM 文件。TLS 设为“文件”时使用。"
# context: label of a read-only row: the SHA-256 fingerprint of the certificate the endpoint serves
fingerprint = "证书指纹"
