[package]
name = "gitpoulpi-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Client<->daemon IPC protocol shared by the TUI, CLI, and MCP frontends: request/response commands plus a live event-subscription stream."

[dependencies]
gitpoulpi-core.workspace = true
gitpoulpi-config.workspace = true
getrandom = "0.4"
subtle = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

# `discovery::pid_alive`: is the process that wrote a discovery file still there?
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
