[package]
name = "gitpoulpi-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
description = "The daemon client every graphical frontend shares: a link to the session daemon that runs requests off the render thread and hands results back over channels."

[features]
# The same names (and meaning) as the frontend's features: the client skips the
# reads of an optional part when the build left it out.
lfs = ["gitpoulpi-daemon/lfs"]
worktree = ["gitpoulpi-daemon/worktree"]
submodule = ["gitpoulpi-daemon/submodule"]
# Test helpers a frontend's own tests share (a link against an embedded daemon,
# per-thread stores): never enabled by a normal build.
test-support = ["dep:tempfile", "dep:async-trait", "gitpoulpi-hosting/test-support"]
# The hosting reading model's tests (and the in-memory host fake a frontend's
# tests share) need a request provider; the frontend forwards these.
hosting = ["gitpoulpi-daemon/hosting", "gitpoulpi-app/hosting"]
github = ["hosting", "gitpoulpi-hosting/github", "gitpoulpi-app/github"]
gitlab = ["hosting", "gitpoulpi-hosting/gitlab", "gitpoulpi-app/gitlab"]

[dependencies]
gitpoulpi-app.workspace = true
gitpoulpi-config.workspace = true
gitpoulpi-core.workspace = true
gitpoulpi-daemon.workspace = true
gitpoulpi-i18n.workspace = true
gitpoulpi-hosting.workspace = true
gitpoulpi-ipc.workspace = true
gitpoulpi-session.workspace = true
imara-diff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tempfile = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[dev-dependencies]
gitpoulpi-testkit.workspace = true
gitpoulpi-cli-backend.workspace = true
tempfile.workspace = true
# The tests read the optional parts and the French catalog: a build of this
# crate alone turns them on for its own tests (a self dev-dependency).
gitpoulpi-link = { path = ".", features = ["lfs", "worktree", "submodule", "test-support", "github", "gitlab"] }
gitpoulpi-i18n = { workspace = true, features = ["lang-fr"] }
