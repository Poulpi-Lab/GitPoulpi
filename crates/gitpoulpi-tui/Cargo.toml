[package]
name = "gitpoulpi-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
description = "GitPoulpi terminal UI: a ratatui/crossterm client over gitpoulpi-ipc, subscribed to daemon events for live updates."

[[bin]]
name = "gitpoulpi-tui"
path = "src/main.rs"

[features]
default = ["full"]
full = ["all-langs", "github", "gitlab", "azure-devops", "bitbucket", "jira", "trello", "gitea", "linear", "youtrack", "redmine", "gerrit", "local-issues", "ai", "mcp", "lfs", "worktree", "submodule", "avatar-fetch", "image-view", "radar", "mermaid", "board", "review", "conversation", "history-rewrite", "global-search", "workspaces", "rewrite-scripts"]
all-langs = [
    "lang-fr",
    "lang-es",
    "lang-pt-br",
    "lang-pt-pt",
    "lang-it",
    "lang-de",
    "lang-zh-cn",
    "lang-ja",
    "lang-ru",
    "lang-ko",
    "lang-nl",
    "lang-pl",
    "lang-uk",
    "lang-cs",
    "lang-sv",
    "lang-tr",
    "lang-qps",
]
lang-fr = ["gitpoulpi-i18n/lang-fr"]
lang-es = ["gitpoulpi-i18n/lang-es"]
lang-pt-br = ["gitpoulpi-i18n/lang-pt-br"]
lang-pt-pt = ["gitpoulpi-i18n/lang-pt-pt"]
lang-it = ["gitpoulpi-i18n/lang-it"]
lang-de = ["gitpoulpi-i18n/lang-de"]
lang-zh-cn = ["gitpoulpi-i18n/lang-zh-cn"]
lang-ja = ["gitpoulpi-i18n/lang-ja"]
lang-ru = ["gitpoulpi-i18n/lang-ru"]
lang-ko = ["gitpoulpi-i18n/lang-ko"]
lang-nl = ["gitpoulpi-i18n/lang-nl"]
lang-pl = ["gitpoulpi-i18n/lang-pl"]
lang-uk = ["gitpoulpi-i18n/lang-uk"]
lang-cs = ["gitpoulpi-i18n/lang-cs"]
lang-sv = ["gitpoulpi-i18n/lang-sv"]
lang-tr = ["gitpoulpi-i18n/lang-tr"]
lang-qps = ["gitpoulpi-i18n/lang-qps"]
ai = ["dep:gitpoulpi-ai", "dep:async-trait", "gitpoulpi-app/ai"]
# Internal: "at least one hosting provider". Never enabled alone.
hosting = ["gitpoulpi-link/hosting", "gitpoulpi-daemon/hosting", "gitpoulpi-ai?/conversation", "gitpoulpi-app/hosting"]
github = ["hosting", "gitpoulpi-hosting/github", "gitpoulpi-app/github", "gitpoulpi-link/github"]
gitlab = ["hosting", "gitpoulpi-hosting/gitlab", "gitpoulpi-app/gitlab", "gitpoulpi-link/gitlab"]
azure-devops = ["hosting", "gitpoulpi-hosting/azure-devops", "gitpoulpi-app/azure-devops"]
bitbucket = ["hosting", "gitpoulpi-hosting/bitbucket", "gitpoulpi-app/bitbucket"]
jira = ["hosting", "gitpoulpi-hosting/jira", "gitpoulpi-app/jira"]
trello = ["hosting", "gitpoulpi-hosting/trello", "gitpoulpi-app/trello"]
gitea = ["hosting", "gitpoulpi-hosting/gitea", "gitpoulpi-app/gitea"]
linear = ["hosting", "gitpoulpi-hosting/linear", "gitpoulpi-app/linear"]
youtrack = ["hosting", "gitpoulpi-hosting/youtrack", "gitpoulpi-app/youtrack"]
redmine = ["hosting", "gitpoulpi-hosting/redmine", "gitpoulpi-app/redmine"]
gerrit = ["hosting", "gitpoulpi-hosting/gerrit", "gitpoulpi-app/gerrit"]
local-issues = ["hosting", "gitpoulpi-hosting/local-issues", "gitpoulpi-app/local-issues"]
radar = ["gitpoulpi-app/radar"]
mermaid = ["gitpoulpi-app/mermaid"]
board = ["gitpoulpi-app/board"]
review = ["conversation", "gitpoulpi-app/review"]
# The read-only conversation view of an issue or a request (`item_view`).
conversation = ["gitpoulpi-app/conversation"]
history-rewrite = ["gitpoulpi-app/history-rewrite"]
global-search = ["gitpoulpi-app/global-search"]
workspaces = ["gitpoulpi-app/workspaces"]
rewrite-scripts = ["gitpoulpi-daemon/rewrite-scripts", "gitpoulpi-cli-backend/rewrite-scripts", "gitpoulpi-app/rewrite-scripts"]
mcp = ["gitpoulpi-app/mcp"]
lfs = ["gitpoulpi-link/lfs", "gitpoulpi-daemon/lfs", "gitpoulpi-cli-backend/lfs", "gitpoulpi-app/lfs"]
worktree = ["gitpoulpi-link/worktree", "gitpoulpi-daemon/worktree", "gitpoulpi-cli-backend/worktree", "gitpoulpi-app/worktree"]
submodule = ["gitpoulpi-link/submodule", "gitpoulpi-daemon/submodule", "gitpoulpi-cli-backend/submodule", "gitpoulpi-app/submodule"]
# Author avatars fetched over HTTP (reqwest); off = initials/identicon only.
avatar-fetch = ["dep:reqwest", "gitpoulpi-app/avatar-fetch"]
# Image preview engine (GIF, WebP, BMP, ICO decoders); PNG/JPEG stay unconditional for avatars.
image-view = ["dep:gif", "dep:image-webp", "gitpoulpi-app/image-view"]

[dependencies]
encoding_rs.workspace = true
# The History view merges a rename's delete + add into one diff (`history_view/rename.rs`).
imara-diff.workspace = true
gitpoulpi-cli-backend.workspace = true
gitpoulpi-core.workspace = true
gitpoulpi-ipc.workspace = true
gitpoulpi-daemon.workspace = true
gitpoulpi-config.workspace = true
gitpoulpi-log.workspace = true
tracing.workspace = true
gitpoulpi-i18n.workspace = true
# The Preferences screen: the token store (secrets) and the per-repo
# settings scope (session). Both are adapters the TUI drives directly --
# neither is a daemon concern, because neither is repository state the
# other frontends need to agree on.
gitpoulpi-secrets.workspace = true
# AI (off by default): completion clients and prompts. See `ai_ui.rs`.
gitpoulpi-ai = { workspace = true, features = ["network", "terminal-agent"], optional = true }
async-trait = { workspace = true, optional = true }
# Start a pull request (`pull_request.rs`): the same GitHub/GitLab API
# client `gitpoulpi hosting` uses, driven directly rather than through
# the daemon -- like the token store above, this is not repository
# state the other frontends need to agree on.
#
# The provider-agnostic port (client, model, resolve) comes with this
# crate's `github` / `gitlab` features (via `hosting`).
gitpoulpi-hosting.workspace = true
# The self-updater's engine (`updates::auto`): download, verify, stage, swap.
gitpoulpi-update.workspace = true
# `pull_request.rs` reads `[[integrations]]` out of `config.toml` itself
# (the same forward-compatible parser `gitpoulpi-cli`'s hosting_cmd
# uses -- `gitpoulpi-config` does not carry that table yet).
toml.workspace = true
gitpoulpi-session.workspace = true
# The frontend-neutral graph model (lanes, stash rows, lazy paging) shared with the desktop UI.
gitpoulpi-app.workspace = true
gitpoulpi-link.workspace = true
crossterm.workspace = true
ratatui.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# `worktree_dialog`: the random id of a generated worktree name.
getrandom = "0.4"
png.workspace = true
arboard.workspace = true
# Author-avatar decoding (`avatar::decode`) and fetching (`avatar::fetch`).
# See the root `Cargo.toml`'s comments on each for why these specific
# crates and feature sets.
jpeg-decoder.workspace = true
gif = { workspace = true, optional = true }
image-webp = { workspace = true, optional = true }
sha2.workspace = true
reqwest = { workspace = true, optional = true }
# The editor's syntax highlighting (`editor_highlight.rs`).
syntect.workspace = true
pulldown-cmark.workspace = true

# `kitty_keyboard.rs`: a bounded poll(2) on the tty for the start-up query.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
# Build script: logo colorways + Windows executable icon.
gitpoulpi-logo-build.workspace = true
# Build script: the About window's third-party crate list (build_crates.rs).
toml.workspace = true

[dev-dependencies]
gitpoulpi-logo-build.workspace = true
gitpoulpi-hosting = { workspace = true, features = ["test-support"] }
async-trait.workspace = true
gitpoulpi-testkit.workspace = true
gitpoulpi-link = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
insta.workspace = true
# The pty driver, for `tests/pty_ui.rs`: those tests drive this crate's
# own binary end to end through a terminal. It lives in xtask because it
# is a dev task as much as a test harness (`cargo run -p xtask -- tui`),
# and a dev-dependency here rather than a second copy of the driver.
xtask.workspace = true
