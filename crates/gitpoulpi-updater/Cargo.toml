[package]
name = "gitpoulpi-updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "gitpoulpi-updater: the separate program that stops GitPoulpi, swaps its files (or runs the package manager), checks the result, rolls back on failure and starts GitPoulpi again. The TUI hands it a job file and exits, so nothing holds the install folder open."

[[bin]]
name = "gitpoulpi-updater"
path = "src/main.rs"

[dependencies]
gitpoulpi-config.workspace = true
gitpoulpi-update.workspace = true
gitpoulpi-ipc.workspace = true
# `network`: the elevated worker downloads the `.sha256` itself.
gitpoulpi-hosting = { workspace = true, features = ["network"] }
gitpoulpi-core.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
gitpoulpi-testkit.workspace = true
assert_cmd.workspace = true
xtask.workspace = true
gitpoulpi-daemon.workspace = true
gitpoulpi-cli-backend.workspace = true
