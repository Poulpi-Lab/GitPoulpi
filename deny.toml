# cargo-deny policy: `cargo deny check licenses` (scripts/check.ps1 runs it
# when cargo-deny is installed). A new dependency under a license that is not
# listed here fails the check, so a copyleft crate never slips in unseen.
# The notices that ship with the binaries are THIRD-PARTY-LICENSES.txt
# (`cargo run -p xtask -- licenses`).

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Weak copyleft, file level: `option-ext` is used unmodified, and its
    # notice and source link are in THIRD-PARTY-LICENSES.txt. Never patch it
    # in-tree.
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

# libgit2 (GPLv2 with a linking exception) is C code bundled by libgit2-sys,
# not a crate license cargo-deny sees; it is documented in
# THIRD-PARTY-LICENSES.txt.
