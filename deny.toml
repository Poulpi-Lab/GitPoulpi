# cargo-deny policy: `cargo deny check advisories bans sources licenses`
# (scripts/check.ps1 runs it when cargo-deny is installed; CI and the release
# preflight run it through EmbarkStudios/cargo-deny-action). A new dependency
# under a license that is not listed here, from a registry other than
# crates.io, or with a known advisory fails the check, so nothing slips in
# unseen.
# The notices that ship with the binaries are THIRD-PARTY-LICENSES.txt
# (`cargo run -p xtask -- licenses`).

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Weak copyleft, file level: `option-ext` is used unmodified, and its
    # notice and source link are in THIRD-PARTY-LICENSES.txt. Never patch it
    # in-tree.
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

# libgit2 (GPLv2 with a linking exception) is C code bundled by libgit2-sys,
# not a crate license cargo-deny sees; it is documented in
# THIRD-PARTY-LICENSES.txt.

[advisories]
version = 2
# A yanked release is a withdrawn one: do not ship it.
yanked = "deny"
# Every ignore needs an id and a reason. These are findings of the first run of
# this policy on the existing lock file: each one needs a dependency upgrade
# that is a separate change (a major version or an upstream release). Remove the
# entry when the upgrade lands; do not add one without a reason.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 comes in through syntect (syntax highlighting); declared complete by its authors, no vulnerability, no safe upgrade exists" },
    { id = "RUSTSEC-2024-0436", reason = "paste is a proc-macro of ratatui, build time only; no vulnerability, no replacement upstream yet" },
    { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin timing attack) comes in through ssh-key, which only generates a local SSH key pair (RSA is an optional key type); the attack needs an observer timing private-key operations, and none is performed. No fixed release exists" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 comes in through ssh-key's p256 and rsa, used for local one-shot key generation with no observer of timing; fixed only in 0.7.x, which ssh-key 0.6 does not accept. Tracked: upgrade ssh-key" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.12.5 comes in through ratatui 0.29's layout cache (a thread-local LruCache of 500 splits); ratatui only calls get_or_insert, resize and cap on it, never pop(), and the flagged UB needs a key whose Drop panics under catch_unwind (the key is a Rect plus a Layout). Fixed only in lru 0.18.2, which ratatui 0.29 does not accept. Tracked: upgrade ratatui" },
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5 comes in through ratatui 0.29's layout cache; the unsound IterMut (Stacked Borrows) is never reached because ratatui does not call iter_mut() on its cache. Fixed only in lru 0.16.3, which ratatui 0.29 does not accept. Tracked: upgrade ratatui" },
]

[bans]
multiple-versions = "warn"
# "warn", not "deny": the workspace crates depend on each other by path without a
# version, which cargo-deny counts as wildcards for crates that could be published.
# Give them versions (workspace.dependencies) to turn this into "deny".
wildcards = "warn"
# rustls-only policy: no system TLS stack.
deny = [
    { crate = "openssl-sys", reason = "TLS is rustls only" },
    { crate = "native-tls", reason = "TLS is rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
