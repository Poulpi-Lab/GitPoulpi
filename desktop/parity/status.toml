# Which registry rows the desktop frontend marks done.
#
# Ids are the shared registry's: an action's config id (`global.quit`) or `palette.<command id>`.
# Only `done` is listed; `terminal only` comes from the registry and everything else is `to do`.
# The tests make this list equal to what the command dispatcher implements, so an id cannot be
# added or kept by hand: implement it in `src/commands/ops.rs`, then run
# `UPDATE_PARITY=1 cargo test -p gitpoulpi-desktop parity` (it rewrites this file and the table).
# See README.md.

[[action]]
id = "global.find_in_log"
status = "done"
note = "Opens the Log's find bar."

[[action]]
id = "global.git_prefix"
status = "done"
note = "First key of the two-key chord; the next key is looked up in the git_prefix context."

[[action]]
id = "global.help"
status = "done"
note = "Opens the keybindings view."

[[action]]
id = "global.nav_prefix"
status = "done"
note = "First key of the two-key chord; the next key is looked up in the nav_prefix context."

[[action]]
id = "global.palette"
status = "done"
note = "Opens the command palette (shared catalogue, shortcuts, fuzzy matching, reasons)."

[[action]]
id = "global.quit"
status = "done"
note = "Quits the app."

[[action]]
id = "global.refresh"
status = "done"
note = "Reloads the refs and the Log."

[[action]]
id = "log_columns.fit_all"
status = "done"

[[action]]
id = "log_columns.reset_width"
status = "done"

[[action]]
