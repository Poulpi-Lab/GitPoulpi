# Which registry rows the desktop frontend marks done.
#
# Ids are the shared registry's: an action's config id (`global.quit`) or `palette.<command id>`.
# Only `done` is listed; `terminal only` comes from the registry and everything else is `to do`.
# The tests make this list equal to what the command dispatcher implements, so an id cannot be
# added or kept by hand: implement it in `src/commands/ops.rs`, then run
# `UPDATE_PARITY=1 cargo test -p gitpoulpi-desktop parity` (it rewrites this file and the table).
# See README.md.

