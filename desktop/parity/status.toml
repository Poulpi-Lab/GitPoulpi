[[action]]
id = "nav_prefix.change_language"
status = "done"
note = "Opens the language picker."

[[action]]
id = "nav_prefix.change_theme"
status = "done"
note = "Opens the theme picker."

[[action]]
id = "nav_prefix.collapse_refs"
status = "done"
note = "Shows or hides the Refs sidebar."

[[action]]
id = "nav_prefix.collapse_status"
status = "done"
note = "Shows or hides the right-hand details pane."

[[action]]
id = "nav_prefix.help"
status = "done"
note = "Opens the keybindings view."

[[action]]
id = "palette.browse_repository"
status = "done"
note = "Folder chooser of the operating system, then opens that repository (File menu)."

[[action]]
id = "palette.focus_log"
status = "done"

[[action]]
id = "palette.focus_refs"
status = "done"

[[action]]
id = "palette.focus_refs_filter"
status = "done"

[[action]]
id = "palette.focus_status"
status = "done"

[[action]]
id = "palette.keybindings"
status = "done"
