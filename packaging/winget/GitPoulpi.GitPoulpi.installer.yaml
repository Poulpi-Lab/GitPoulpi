# TEMPLATE, NOT PUBLISHED. see the release-and-packaging and install-channels designs ("winget").
# @SHA256_WINDOWS_SETUP@ is the first field of gitpoulpi-<version>-x86_64-pc-windows-msvc-setup.exe.sha256.
#
# winget runs the Inno Setup installer of the release (packaging/windows/gitpoulpi.iss). For the inno type winget
# already passes /SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART; Custom adds the rest:
#   /CURRENTUSER or /ALLUSERS  picks the scope (the script allows `commandline dialog`);
#   /TASKS=...                 Start menu shortcut and PATH, no Desktop shortcut;
#   /ALIAS=                    no `gp` command alias;
#   /CHANNEL=winget            the installer writes channel=winget into the marker, so GitPoulpi runs
#                              `winget upgrade` for updates and a re-run keeps the channel.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json

